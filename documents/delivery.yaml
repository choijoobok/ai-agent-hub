# 고객 제출 사이트 구성 — 내용은 원래 정본에 두고 여기에는 배치만 둔다.
#
# `deliverable-site`가 세 사이트를 만들 때 읽는 프로젝트별 카탈로그다.
# 같은 원본은 한 사이트에만 배치한다. 화면 목업·캡처는 공용 자산이라 여러 사이트가 참조할 수 있다.

meta:
  id: DLV-001
  status: in_progress
  baselined: null

sites:
  - id: SITE-001
    key: design
    title: "설계·검증 산출물"
    description: "spec에서 생성한 설계 문서와 상세 설계, 화면 요건서·목업을 함께 검토한다"
    sources:
      - "documents/generated/**/*.md — 운영 런북은 SITE-003으로 보낸다"
      - "documents/design/**/*.md"
      - "documents/screen/**/requirements.md + mockup.html"
    # 종류/배치만 여기서 정의한다. 기능 소유 모듈은 spec에서 읽고 단일 모듈 문서는 module 메타를 쓴다.
    navigation:
      title: "분석·설계·검증 문서"
      integrated_label: "전체·통합"
      module_labels: { common: "공통" }
      sections:
        - key: project
          path: ["프로젝트·요구사항", "개요·기준"]
          source_prefixes: ["documents/generated/10-"]
        - key: requirements
          path: ["프로젝트·요구사항", "기능 요구사항"]
          source_prefixes: ["documents/generated/10-요구사항정의서/04-요구사항/"]
          group_by_module: true
        - key: process
          path: ["프로젝트·요구사항", "업무 프로세스·품질·연동"]
          source_prefixes: ["documents/generated/10-요구사항정의서/05-", "documents/generated/10-요구사항정의서/06-", "documents/generated/10-요구사항정의서/07-"]
        - key: architecture
          path: ["아키텍처·권한"]
          source_prefixes: ["documents/generated/20-", "documents/generated/21-", "documents/generated/22-"]
          group_by_module: true
        - key: usecases
          path: ["유즈케이스"]
          source_prefixes: ["documents/generated/30-"]
          group_by_module: true
        - key: feature-index
          path: ["기능 명세", "전체 목록"]
          source_prefixes: ["documents/generated/31-"]
        - key: features
          path: ["기능 명세"]
          source_prefixes: ["documents/generated/32-"]
          owner: feature
          group_by_module: true
        - key: sequence
          path: ["시퀀스"]
          source_prefixes: ["documents/generated/33-"]
          group_by_module: true
        - key: data-api
          path: ["데이터·API"]
          source_prefixes: ["documents/generated/40-", "documents/generated/50-", "documents/generated/51-"]
          group_by_module: true
        - key: tables
          path: ["데이터·API", "테이블 목록·명세서"]
          source_prefixes: ["documents/generated/41-"]
          group_by_module: true
        - key: screens
          path: ["화면 목록"]
          source_prefixes: ["documents/generated/60-"]
          group_by_module: true
        - key: batches
          path: ["스케줄 배치"]
          source_prefixes: ["documents/generated/65-"]
          group_by_module: true
        - key: validation
          path: ["테스트·추적성"]
          source_prefixes: ["documents/generated/70-", "documents/generated/71-", "documents/generated/72-", "documents/generated/90-"]
          group_by_module: true
        - key: detail
          path: ["상세 설계"]
          source_prefixes: ["documents/design/"]
          group_by_module: true
    flow_views:
      - key: agent-flow
        requirement: REQ-010
        title: "Agent 처리 흐름 · 설계와 검증"
        # 업무 연결은 REQ-010.overview_diagram에서 읽는다. 여기에는 배치만 둔다.
        layout:
          width: 1600
          height: 990
          groups:
            - { key: intake, title: "요청 접수", sequence: S1, nodes: [P, A], x: 40, y: 120 }
            - { key: start, title: "실행 시작 조건", sequence: S1, nodes: [E], x: 360, y: 120 }
            - { key: plan, title: "계획과 다음 작업", sequence: S2, nodes: [C, N], x: 680, y: 120 }
            - { key: finish, title: "결과 기록과 종결", sequence: S8, nodes: [R], x: 1320, y: 120 }
            - { key: wait, title: "사용자 확인·승인 대기", sequence: S5, nodes: [W], x: 40, y: 410 }
            - { key: search, title: "필요한 지식 검색", sequence: S4, nodes: [K, I], x: 360, y: 410 }
            - { key: reason, title: "필요한 모델 판단", sequence: S2, nodes: [L, F], x: 680, y: 410 }
            - { key: action, title: "SQL·API·도구 실행", sequence: S3, nodes: [T], x: 1000, y: 410 }
            - { key: poll, title: "상태 조회와 화면 표시", sequence: S1, nodes: [Q, V, Z], x: 1320, y: 410 }
            - { key: change, title: "변경·중단 입력", sequence: S6, nodes: [U, D], x: 40, y: 760 }
            - { key: lease, title: "점유 만료와 늦은 응답", sequence: S7, nodes: [X, S], x: 360, y: 760 }
            - { key: knowledge, title: "관리자 지식 임베딩", sequence: S4, nodes: [M, B], x: 680, y: 760 }
            - { key: audit, title: "단계별 통제·기록", sequence: S8, nodes: [H], x: 1000, y: 760 }
            - { key: history, title: "과거 질의·새 턴 요청", sequence: S7, nodes: [J, FAV], x: 1320, y: 760 }
          # 주요 선은 노드 밖의 공용 통로를 사용한다. 그 밖의 선은 선택 시 강조한다.
          routes:
            - { from: intake, to: start, path: "M280 170 H360", label: "접수 허용", lx: 320, ly: 153 }
            - { from: start, to: plan, path: "M600 170 H680" }
            - { from: plan, to: finish, path: "M920 170 H1320", label: "완료 또는 처리 불가 판정", lx: 1120, ly: 153 }
            - { from: plan, to: search, path: "M760 230 V310 H480 V410", label: "검색 필요", lx: 480, ly: 345 }
            - { from: plan, to: reason, path: "M800 230 V410", label: "추론 필요", lx: 800, ly: 345 }
            - { from: plan, to: action, path: "M840 230 V310 H1120 V410", label: "실행 가능한 작업", lx: 1120, ly: 345 }
            - { from: plan, to: wait, path: "M680 200 H640 V270 H160 V410", label: "정보·확인·승인 필요", lx: 160, ly: 345 }
            - { from: wait, to: start, path: "M280 460 H310 V255 H400 V230", label: "유효 응답", lx: 355, ly: 280 }
            - { from: search, to: plan, path: "M480 520 V570 H1280 V65 H800 V120" }
            - { from: reason, to: plan, path: "M800 520 V570 H1280 V65 H800 V120", label: "유효 결과 → 작업 상태 반영 → 다음 작업", lx: 875, ly: 603 }
            - { from: action, to: plan, path: "M1120 520 V570 H1280 V65 H800 V120" }
            - { from: finish, to: poll, path: "M1440 230 V410", label: "종결 확정 후 공개", lx: 1440, ly: 345 }
            - { from: poll, to: history, path: "M1440 520 V760", label: "본문과 독립 조회", lx: 1440, ly: 645 }
            - { from: intake, to: poll, kind: control, path: "M280 205 H300 V620 H1530 V520", label: "접수 이후 처리 중에도 상태·결과 조회", lx: 950, ly: 643 }
            - { from: change, to: start, kind: control, path: "M160 760 V665 H20 V95 H480 V120", label: "현재 상태 확인 후 반영", lx: 150, ly: 650 }
            - { from: lease, to: poll, kind: control, path: "M600 815 H640 V650 H1490 V520" }
            - { from: audit, to: start, kind: control, path: "M1000 815 H970 V690 H320 V95 H440 V120" }
            - { from: history, to: intake, kind: control, path: "M1560 815 H1580 V915 H8 V160 H40", label: "명시적 새 요청 · 새 턴", lx: 1200, ly: 903 }

  - id: SITE-002
    key: user
    title: "사용자 매뉴얼"
    description: "화면별 manual.md와 목업 또는 실제 캡처를 실제 메뉴 순서로 보여 준다"
    sources:
      - "documents/screen/**/manual.md"
      - "documents/screen/**/mockup.html 또는 screen-{그림키}.png"

  - id: SITE-003
    key: operations
    title: "운영·개발자 가이드"
    description: "고객 환경 운영 런북과 구축·개발·배포·운영 안내를 한 사이트에서 제공한다"
    sources:
      - "documents/generated/80-운영런북.md"
      - "developer-guide/**/*.md"

output:
  path: build/deliverables
  offline: true
  shared_assets: true
  html_per_site: one
  pdf: optional

capture:
  identity: "SCR-###/그림키"
  main_file: screen.png
  keyed_file: "screen-{그림키}.png"
  draft_fallback: mockup
  release_requires_png: true
