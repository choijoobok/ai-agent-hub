    manual_admission:
      decision: 'ADR-046: 2026-11-10 사용자 A 선택. 이미 접수·확정된 배치는 계속 처리하며 비활성화/권한회수 뒤 새 실행·중단 요청은 차단한다.'
      scope: API-572 수동 실행과 API-575 중단은 ADMIN 보호 접수 명령이다. API-571 일정 저장은 일반 보호 저장이다. 예약 실행은 서버 소유이며 현재 관리자 세션을 만들거나 주입하지 않는다.
      boundary: 공유 ADMIN guard에서 현재 계정/EXECUTE를 확인한 뒤 수락 RUNNING 행을 같은 REQUIRED 트랜잭션에 저장한다. 커밋이 접수 확정점이며 executor 제출은 AFTER_COMMIT이다. 회수 선행은401/403·신규 lock/RUNNING/큐0, 접수 선행은 그 작업을 유지한다. guard를 장기 job 실행 동안 잡지 않는다.
      multiple: API-572 한 HTTP 요청의 대상 목록은 한 guard 보호/트랜잭션에서 판정한다. 없는 일정 BATCH_ID는 전체 요청 오류로 사전 거부한다. 이미 RUNNING 등 기존 건별 업무 결과는 유지한다. 수락 대상 RUNNING을 함께 커밋하며 DB 장애는 전체 접수 롤백으로 실패한다. 배포 후 BatchJob bean 소실은 접수 뒤 실행 FAIL이며 없는 일정 ID와 구분한다. 트랜잭션 오류를 잡고 일부 성공 응답을 보내지 않는다.
      handoff: 획득한 분산 잠금/heartbeat의 rollback 정리를 등록하고 커밋 전에는 worker를 실행하지 않는다. AFTER_COMMIT 큐 제출 실패는 해당 확정 HIST_ID를 FAIL로 종결하고 잠금을 정리한다. 이미 접수한 다른 대상은 취소하지 않는다. 커밋 후 프로세스 종료는 자동 재전송하지 않으며 기존 heartbeat/잠금 만료·LOST 조건으로 진단한다. 일정 삭제 등 기존 LOST 조건 불충족은 RUNNING 기록을 보존해 운영 확인하며 성공/중단으로 위장하지 않는다.
      revocation: 접수 뒤 대기/실행은 서버 소유의 확정 작업이다. 요청자 계정 상태에 따른 암묵 취소/재인가를 추가하지 않는다. 다른 현재 EXECUTE 보유 관리자의 별도 중단 요청은 가능하다.
      cancel: 현재 ADMIN 권한 확인과 RUNNING 행 cancelReqDtm 기록은 같은 guard/트랜잭션이다. 회수 선행이면 기록0, 중단 접수 선행이면 요청은 유지된다. checkpoint가 실제 중단한 경우만 CANCELED이며 정상 반환은 SUCCESS다.
      lease_ownership: CR-033 구현 반례 Fix. 수동/예약 모두 batch 등록 행 잠금→현재 RUNNING 조회→같은 REQUIRED의 start/HIST_ID/락 점유→커밋 뒤 큐/heartbeat 순서다. 다중 대상은 BATCH_ID 정렬 잠금·응답은 원 입력 순서다. SYS_DATA_LOCK의 nullable BATCH_HIST_ID를 배치 전용 lease 참조로 추가하는 상세 보완을 후속 SLICE-520에서 반영한다. token은 HIST_ID 동등성만 비교하며 TABLE allocation 때문에 MAX/대소로 새 실행을 추정하지 않는다. release/heartbeat/isHeldBy/ghost는 같은 token을 확인하고 cooldown만 남기면 token=null로 소유를 종료한다. 기존 CustomLock/LockStore 의미는 변경하지 않는다.
      history_concurrency: 'CR-033 목표·미구현. cancel/finish/markLost는 같은 HIST_ID 행의 DB 쓰기 잠금을 획득한 뒤 최신 상태를 다시 읽는다. 기존 영속성 문맥에 행이 있으면 잠금만으로 갱신됐다고 가정하지 않고 refresh 또는 동등한 최신 조회를 보장한다. cancel은 ADMIN guard→현재 권한→중복 제거한 HIST_ID 오름차순 잠금 순서이며, 없는 행/최신 상태가 RUNNING이 아닌 행은 기존 전체 요청 오류로 롤백한다. 최초 cancelReqDtm만 설정하고 결과/종결 필드를 바꾸지 않는다. finish/markLost는 해당 행 잠금만 사용하고 ADMIN guard에 재진입하지 않으며 기존 REQUIRES_NEW 경계를 유지한다. finish는 최신 중단 시각을 보존해 실제 SUCCESS/FAIL/CANCELED를 적는다. markLost는 최신 RUNNING에만 적용한다. LOST 선행 뒤 실제 finish는 실제 결과로 교정하고, finish 선행 뒤 markLost는 무변경이라는 기존 의미를 유지한다. 장기 실행 동안 행 잠금을 유지하지 않는다.'
      current_gap: 현 BatchHistoryWriter.start의 REQUIRES_NEW와 즉시 메모리 제출은 목표 접수 경계를 충족하지 않는다. 수동 경로만 REQUIRED 접수/커밋 후 인계로 정비하고 예약·청크·종결의 독립 트랜잭션은 유지한다. 현 cancel/finish/markLost의 잠금 없는 조회·전체 행 갱신에는 결과/중단 시각 유실 경합이 있어 history_concurrency를 함께 구현한다. 기존 HIST의 NODE_ID를 요청자 ID로 해석하지 않는다.
      verification: TC-5086~5089, SLICE-520. 인터셉터 검사만 남기는 변이, REQUIRES_NEW start/커밋 전 submit·회수 후 cancel 허용·큐 실패 성공 위장과 이력 잠금/최신 조회 제거로 결과·최초 중단 시각을 덮는 반례를 시험한다.
  FEAT-509:
    request_rule: 공지 기간과 요청 판정 사유를 검증하고 알림 소유자는 세션·계약 발신자로 고정한다
    response_rule: 현재 노출 가능 공지와 자기 요청·자기 알림만 반환한다
    transaction: 요청 판정은 대상 행을 PK 오름차순으로 잠근 뒤 결과 알림 생성과 원자적으로 처리하며, 뒤 동시 요청은 상태 충돌로 거부하고 계정·권한 데이터는 건드리지 않는다
    exception_map:
      UC-509.E1: NOTICE_OUTSIDE_WINDOW
      UC-509.E2: NOTIFICATION_REQUEST_STATE_CONFLICT
      UC-509.E3: NoRecipients — 공개 포트 정상 결과이며 HTTP 오류를 새로 만들지 않는다
      UC-509.E4: Unavailable — 현재 수신자 조회 실패를 정상0명과 구분한다
      UC-509.E5: 저장 예외 전파·동일 트랜잭션 전체 롤백 — UC-049의 저장 실패 경로로 인계한다
    external_change_notification:
      decision: ADR-047·CR-034. 구현 전 호환 확장이다. 기존 void send/sendAll과 기존 종류의 동작을 바꾸지 않는다.
      types: RecipientPolicyRef={configGeneration,policyVersion,roleCodes[],requiredReadMenuActions[]}; VerifiedSourceNotificationOrigin={receiptId,eventKeyDigest,kind,safeTargetRef}; RecipientSnapshot={policyVersion,sortedDistinctAdminIds,checkedAt}. 임의 HTTP 클라이언트가 내부 origin/수신자 목록을 제출할 수 없다.
      policy: 고객 배포 설정에서 기존 system 역할 코드를 수신 역할로 지정한다. 제품 고정 역할명/코드·개인 수신목록·새 화면을 만들지 않는다. 실제 코드 목록은 외부 연동 운영 검수 전 정의하며 공란/삭제된 역할로 정상0명이면 NoRecipients다.
      resolve: withCurrentSourceNotificationRecipients(origin,policyRef,callback) -> Stored|NoRecipients|Unavailable. ADMIN_AUTHORITY_V1 공유 보호를 달력/Portal 잠금 전에 획득하고 현재 SYS_USER 이용조건·역할 소속/유효성·관련 조회 권한을 원천으로 확인한다. 지정 역할 합집합의 중복 관리자는1명이다. 계정/역할 조회 실패를 정상0명으로 반환하지 않는다. 외부 원천을ADMIN principal로 위장하지 않는다.
      guard_scope: 보호 구간은 현재 수신자 결정과 동일 REQUIRED 저장/참조 인계 commit까지다. 원천 검증 네트워크나 실제 화면 읽기는 포함하지 않는다. 전송 시점에 끝난 알림을 후속 권한 회수로 되돌리지 않으며 상세 링크는 현재 READ로 재인가한다.
      store: storeSourceChangeNotification(origin,RecipientSnapshot) -> Stored([{adminUserId,notiId}],policyVersion)|NoRecipients|Unavailable. 기존 SYS_NOTI_INBOX/NotificationSender의 단일 저장 진입을 확장하며 정확 저장 ID를 반환한다. 호출자와 같은 AI DB REQUIRED, REQUIRES_NEW/AFTER_COMMIT 알림 생성 금지. 반환ID와 ENT-266을 같은 commit에 기록한다.
      type: 새 인앱 종류 PORTAL_CHANGE를 추가한다. 기존 AUTHZ는 만료예고 중복 판정에 쓰이므로 재사용하지 않는다. 프런트 타입/MSG 키와 기존 알림함 표시를 호환 확장하며 별도 메뉴/페이지는 만들지 않는다.
      content: 원천 subject·원문 인사 내용·조직 세부·비밀은 본문에 복사하지 않는다. 안전 사건 종류와 조회 권한이 있는 상세 링크만 제공한다. Portal 대상ID와 같은 문자열 관리자ID를 자동 연결/제외하지 않는다.
      delivery: 인앱 행 commit이 도달이다. 기존90일 파기/본인 읽음 규칙을 유지한다. 브라우저 재조회 실패로 알림을 다시 만들지 않는다. 다수 수신자 중 일부만 저장되면전체rollback이다.
      ownership: SLICE-521 system 소유. integration SLICE-305는 해당 실제 공개 포트와 함께 검증한다. system G3의 CR-034 타입/MSG/기존 만료예고 회귀 승인 범위는 project.state.yaml을 따른다. SLICE-520 이후 구현하며 다른 소유 G3로 소스를 열지 않는다.
      verification: TC-5098~50911. 같은 사람의 복수역할/권한회수·정상0명/조회장애·partial 저장 실패·기존 AUTHZ 예고 비간섭·기존 알림함 종류/표시 회귀.
