      rollback: 인증/요청 수락을 닫고 진행 요청을 배출한다. CR-039의 빈 DB 재기준선 경로가 실패하면 수락을 열지 않고 선택한 기준선을 수정·재구축한다. 구 artifact 복귀가 필요하면 구 판의 초기 SQL/체크섬에 맞는 빈 개발 DB 재구축을 별도 대상 확인·삭제 실행 승인 뒤 수행한다. 재삭제도 execution 절을 따른다. 코드만 rollback하거나 clearCheckSums로 서로 다른 기준선을 섞지 않는다. 기존 데이터 보존 전환 경로에서만 새 changeset의 원 API 키/메뉴 연결 복구→이전 artifact/정적 파일 배포를 사용한다. 모든 경로에서 모든 노드의 registry/캐시·허용 시작 경로·권한/로그인 smoke를 확인한 뒤 재개한다. DB 백업 자체를 복원하면 RUN-301의 새 인증 epoch/구 grant 회수도 적용한다. 초기화 전 데이터는 코드 rollback으로 복원할 수 없다.
