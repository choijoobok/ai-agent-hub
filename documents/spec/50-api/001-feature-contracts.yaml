feature_contracts:
  FEAT-501:
    security_scope: ARCH-050.admin_account_contract — 관리자 자체 계정/인증·세션 명령이며 Portal 계정/인증 요청에 재사용하지 않는다
    request_rule: 관리 API의 userId는 필수이며 자기 서비스의 사용자 ID는 세션에서 얻는다; 비밀번호·토큰 원문은 응답·로그에 쓰지 않는다
    response_rule: 현재 DTO 필드·null 의미·페이징을 보존하고 세션에는 authzVersion을 포함한다
    transaction: 계정/역할/IP/비밀번호 이력 변경은 각 명령 단위로 원자적
    exception_map:
      UC-501.E1: LOGIN_CONDITION_DENIED
      UC-501.E2: CREDENTIAL_OR_SESSION_CONFLICT
    auth_precondition:
      status: CR-028/033·ADR-034/046의 system 영향 상세 초안·미구현
      shared_contract: FEAT-301.request_boundary/session_isolation/admin_authority_guard/migration_detail를 수락한다. API-601과 ADMIN 쿠키/CSRF 준비는 system, 영역 선택 필터/공통 조립은 integration 소유다.
      exact_paths: API-501~505의 정확 public method/path와 API-601은 관리자 인증 명령/준비의 익명 목록이다. 부팅용 공개 자원 API-557은 아래 public_boot_resource로 별도 등록한다. API-501/503/504/505는 POST CSRF/Origin을 검증한다. getPasswordPolicy는 비밀 없는 조회다. common API-506~509는 ADMIN 본인 문맥만 수락한다.
      public_boot_resource: API-557 GET /api/system/public/message/getBundle의 lang/v 공개 번들은 ANONYMOUS·PASSWORD_CHANGE_REQUIRED·AUTHENTICATED에서 같은 공개 읽기로 제공한다. 정확한 method/path만 허용하며 자격/관리 권한 부여·세션 생성/회전·CSRF 준비·첫 사용 확정 의미는 없다. getMe401 뒤 로그인 문구 로드와 제한 세션의 새로고침/언어·메시지 버전 변경을 지원한다. 넓은 public prefix 예외는 만들지 않는다.
      restricted: 초기/만료 비밀번호 제한 세션의 보호 API는 getMe/heartbeat/changePassword/logout과 자기 CSRF 준비만 가능하다. 반드시 현재 계정 검사를 먼저 하고 메뉴/일반 저장은403이다. API-557의 비계정 공개 읽기는 위 public_boot_resource 기준으로 별도 허용한다. 기존 데이터/비밀번호 이력 정책은 유지한다.
      transaction_port: system 공개 withCurrentAdminAuthority(context, exactApi, mode, callback)는 호출자의 REQUIRED 트랜잭션에 참여한다. 공유/배타 선택·잠금 뒤 현재 계정/액션·callback 효과를 같은 구간에 둔다. 단순 boolean을 반환해 경계 밖 저장에 재사용하지 않는다.
      scope: ADMIN 요청 수락은 대상 사용자 선택 ID와 별개다. 비밀번호/잠금·기간·사용/IP·역할/개인 권한·메뉴/API 변경 경로를 보호 매트릭스로 연결한다. 시작 후 ADMIN guard 잠금 업그레이드는 금지한다.
      sessions: FEAT-301.session_store_v2의 ADMIN 인스턴스를 사용한다. JDBC는 암호/이력·기존 세대 폐기·새 grant/payload를 같은 물리 REQUIRED로 확정한다. Redis는 DB 자격/이력/구접속 회수를 먼저 확정하고 새 payload/활성화 실패 시 새 암호 재로그인으로 복구한다. Portal credentialVersion을 SYS_USER 필드로 추가하지 않는다.
      audit: 기존 SYS_LO_LOGIN·SYS_LO_ACCESS의 ADMIN 저장/보존 사실은 유지한다. 전용 권한 원장을 새로 만들지 않는다. Portal 경로를 일반 ADMIN 요청 전문에서 제외하고 인증 비밀은 수집 단계에서 차단한다.
      screen: SCR-501의 목표 동작과 CR-033 검수를 따른다. 사용자가 2026-11-10 거절한 기존 확정 변경 유지 안내 문구를 새로 추가하지 않는다. 비활성화 동작 계약과 시험은 유지한다.
      verification: TC-50110~50114·TC-5037/5038을 양 노드/양 순서·기한/권한·회전/응답 유실·public 위장으로 검증한다. 기존 현재 소스 시험을 새 계약 통과로 세지 않는다.
      late_flush: 영역 공통 세션 조립은 폐기된 세션 ID의 늦은 저장을 INSERT로 되살리지 않는다. 인증/익명 생성 경로와 기존 세션 갱신 경로를 분리하고 삭제된 원 행 갱신은 폐기한다. ADMIN과 PORTAL 모두 회전/종료/만료 경합을 검증한다.
      guard_modes:
        exclusive:
          - API-508
          - API-511
          - API-512
          - API-513
          - API-514
          - API-516
          - API-518
          - API-525
          - API-528
          - API-532
          - API-534
          - API-539
          - API-540
          - API-541
          - API-542
        public_credentials: API-501은 실패횟수 임계 잠금/성공 해제도 계정 상태 변경이므로 처음부터 exclusive 보호를 획득한다. JDBC는 수락/세션 동일 커밋까지, Redis는 자격/실패횟수 또는 PENDING의 1차 DB 확정까지 유지한다. Redis publication은 모든 보호/DB 잠금 해제 뒤 수행하고 별도 짧은 REQUIRED의 새 보호 안에서 현재 계정/권한·epoch·PENDING·접속 한도를 재검사해 ACTIVE를 확정한다(session_store_v2). API-505도 검증된 복구 문맥의 자격 변경/기존 세션 회수를 exclusive로 보호한다. 익명에 관리자 메뉴 권한을 부여하지 않고 로그인 증거 또는 복구 토큰의 목적/본인/만료로 수락한다. API-503/504의 원천 검증·메일 송신은 기존 복구 계약을 유지하며 네트워크를 보호 안에서 기다리지 않는다.
        shared: 위 배타/익명 수락 외 모든 ADMIN 보호 조회·본인 서비스·관리 쓰기. API-509 종료는 본인 세션만 삭제한다. self profile/locale은 권한 입력을 바꿀 수 없고 바꾸는 필드가 추가되면 배타 분류를 먼저 변경한다.
        non_http: 기동 시 메뉴/API/권한 캐시 구성과 새 시드 적용은 배출된 서비스 경계에서 수행한다. 운영 중 직접 SQL/오래된 캐시로 변경을 우회하지 않는다. 만료 시각 도달은 요청마다 원천 시각 검사로 집행한다.
      session_adapter: FEAT-301.shared_session_adapter의 ADMIN 인스턴스를 사용한다. 자동 filter/REQUIRES_NEW 저장을 남겨둔 채 원자성을 주장하지 않는다. 현재 서버 sessionRef 재검사·조건부 기존행 갱신·요청 wrapper flush 종료를 함께 적용한다.
      login_failure_commit: 계정 상태·실패횟수 쓰기는 ADMIN 배타 보호와 같은 트랜잭션에 참여한다. 로그인 거부는 결과값으로 반환하고 횟수/잠금 커밋 뒤 HTTP401로 변환한다. 기존 ADMIN 일반 로그인 이력의 독립 저장/실패 정책과 Portal 필수 보안 사건 정책은 구별하며 관리자 로그 실패를 권한 허용으로 바꾸지 않는다.
      interface_version: integration 영향 G3에서 동결한 CR-036의 admin-auth-boundary/v2를 소비한다. system 소비 영향 G3→SLICE-308 공통 G4→SLICE-520 실제 ADMIN 소비 순서다. SLICE-307 v1/JDBC G4 사실은 보존하며 승인 상태는 project.state.yaml을 따른다.
      frontend_consumption:
        password_publication_failure: API-508의 HTTP503 PASSWORD_CHANGED_REAUTH_REQUIRED만 비밀번호 확정 후 재인증 결과로 처리한다. 제한 변경 화면과 내 프로필 변경 폼 모두 회수된 ADMIN 인증 상태·비밀번호 입력을 지우고 기존 ADMIN 재로그인 흐름으로 전환한다. 새 비밀번호를 사용하며 원 POST 자동 재전송·클라이언트 제한 해제·일반503에 같은 처리·PORTAL 상태 변경은 금지한다. 별도 배너는 추가하지 않는다.
        first_use: 로그인/회전 성공 뒤 새 쿠키의 API-506 getMe로 현재 ADMIN 상태와 첫 사용을 확인한다. 서버 발급 성공만으로 일반 관리 화면을 열지 않고 제한 세션은 확인 뒤 기존 비밀번호 변경 화면으로 보낸다. 첫 사용/실패 결과는 FEAT-301.session_store_v2를 따른다.
        entry_scope: ARCH-021의 영역별 진입을 ADMIN 초기 getMe·세션 신호·RequireAuth·wildcard보다 먼저 구분한다. 제품 ADMIN은 /admin 진입에 적용한다. local/includeSample=true에서만 정확 등록된 /sample/** 참조 화면이 기존 ADMIN 셸/권한을 사용하는 예외이며 product에는 해당 화면/슬롯을 두지 않는다. /·/portal/**·/internal/**는 관리자 셸이나 기본 로그인으로 가로채지 않는다. CR-037의 /admin/login·/admin/password/change와 모든 내부 링크/복귀를 함께 전환하고 구 /login·/password/change의 alias/redirect를 남기지 않는다. 미구현 Portal/디버그 진입은 닫힌 소유 슬롯으로 남기고 관리자 로그인 완료로 접근을 허용하지 않는다. 제품 Portal 인증 URL은 ARCH-021을 따르며 요건/목업·구현과 디버그 두 주체 실행은 각 소유 설계/게이트를 따른다.
      async_admission: FEAT-508.manual_admission은 수동 배치의 보호 접수 경계다. 접수 뒤 장기 실행은 같은 HTTP/guard 트랜잭션에 포함하지 않는다. 다른 비동기/외부효과는 각 소유의 인수 계약 없이 이 예외를 일반화하지 않는다.
    route_cutover:
      common_contract: integration 소유 G3에서 동결한 FEAT-301.api_path_transition을 소비한다. 이 절은 실제 system 페이지/호출자·DB/시드와 운영 적용 순서를 구체화하며 공통 저장/회수 프로토콜을 바꾸지 않는다.
      page_consumers: AppRouter의 진입 분류/부팅·RequireAuth/RequireAnonymous, LoginPage 성공 이동, PasswordChangePage·PasswordChangeForm, useSessionSignals의 재인증/포기/로그아웃, ShellLayout의 로그인 유지 홈/셸 초기화를 ARCH-021 경로에 맞춘다. 관리자 성공/홈은 /admin의 허용 시작 화면이며 Portal /로 보내지 않는다. 새 탭·새로고침·뒤로가기·제한세션·미등록 경로와 구 /login·/password/change의 별칭/리다이렉트 부재를 검증한다. 페이지에 새 업무 액션이나 안내 배너를 추가하지 않는다.
      api_consumers: source_contract/current_path의 현재101핸들러와 local sample20, 모든 endpoints/auth client·메시지/코드·시스템 정보·진행률·알림/배치 호출·시험/검수 스크립트를 method+현재경로→목표경로로 대조한다. 인증 명령뿐 아니라 public/common도 포함한다. DTO/메서드/현재 주체·권한/오류 의미를 유지하고 호출자/handler/생성 입력 누락·중복0을 확인한다.
      permission_data: DB의 service API 키/메뉴 연결은 공통 전환 계약을 따른다. 현재 사용자·역할/개인 예외·메뉴 코드/액션 권한과 기존 감사 값을 보존하고 API_URL 변경을 메뉴/권한 신규 부여로 해석하지 않는다. 페이지 MENU_URL은 실제 변경 대상만 명시 매핑하며 이미 /admin/system 아래인 메뉴를 다시 옮기거나 중복 메뉴로 만들지 않는다. 로그인/강제 변경은 비메뉴 화면이라 해당 SYS_MENU 행을 신설하지 않는다.
      seed_sources: 현재 런타임은 modules/platform·system·sample의 모듈 SQL 기준선을 읽는다. generateMenuSeed/generateApiSeed/generateMessageSeed는 data의 생성 CSV를 만들며 옛 data/*.yaml과CSV는 runtime 리소스에서 제외된다. CR-038에서 API006·메뉴API007 생성 CSV와 실행용 system/sample 초기 seed SQL을 함께 대조한다. 메뉴 URL 변경이 있으면 메뉴003 생성 결과/실행 SQL도 대조하되 독립 로그인/변경 URL만으로 메뉴 행을 추가하지 않는다. 현재 자동 SQL 기준선 생성 태스크는 없으며 CSV 갱신을 초기 DB 적용 완료로 세지 않는다.
      development_rebaseline:
        change: CR-039
        decision: 사용자가 현재 개발 DB에 보존할 수동 데이터가 없으며 전부 초기화한 뒤 Liquibase 관리 테이블을 포함해 초기화 파일을 수정하는 방향을 선택했다. 현재 미배포 개발 DB의 초기 기준선 재정리를 계획하며 데이터 보존 전환이나 운영 DB에 확대하지 않는다.
        files: 경로 변경은 기존 테이블 구조를 바꾸지 않으므로 system/sample의 초기 seed SQL과 생성 CSV의 경로·권한 연결을 동기화한다. 필요한 schema 변경은 소유 슬라이스 설계에 한정한다. 현재 product의 platform→system(schema/seed/후속003~006), local의 추가sample(schema/seed/shared-seed) 순서를 대조하고 후속 파일을 기본 유지한다. 기준선에 효과를 흡수할 항목이 있으면 master의 중복 실행을 함께 제거·검증한다. 308에서 검증한 platform/인증 원장 changeset은 각 루트/모듈 master에 정확1회 포함하며 현재 이미 구현됐다고 표시하지 않는다. 기준선 재작성은 CR-039가 지정한 초기 개발 DB에만 허용한다.
        reproducibility: generateSeeds의 코드/메뉴/메시지 선언→생성CSV와 체크인 초기SQL→실제DB 두 경로를 검증으로 연결한다. 재기준선 작업에서 product/local별 메뉴·API·메뉴API 집합의 정규화 비교를 재현 가능한 검사에 추가하고 선택한 초기SQL 동기화 결과를 기록한다. 자격/사용자 원문을 출력하거나 전체 seed를 임의로 재생성하지 않으며 선언 변화가 없는 역할/코드/시퀀스의 초기 값을 보존한다. SQL 기준선이 CSV 생성 태스크의 자동 출력인 것처럼 보고하지 않는다.
        execution: 승인된 구현/시드·빈 DB 검증이 준비된 뒤 실제 개발 대상 host/database/schema·product/local 변형과 포함 객체를 명시한다. 사용자 명시 실행 승인 후 모든 앱 노드/배치 실행기를 멈추고 대상 스키마의 업무/플랫폼/세션 객체와 DATABASECHANGELOG·DATABASECHANGELOGLOCK을 함께 비워 같은 변형의 Liquibase로 재구성한다. 메모리에 남은 ID 할당/작업이 새 DB에 쓰지 않도록 모든 노드를 새로 시작한다. 관리 테이블만 지우거나 clearCheckSums로 기존 DB를 새 기준선인 것처럼 수락하지 않는다. DB명/스키마가 정해지지 않은 현재 설계 작업에서는 삭제를 실행하지 않는다.
        auth_state: 초기화 뒤 이전 로그인 상태는 유지하지 않는다. 선택 저장소가 Redis면 공유 서버 전체를 지우지 않고 해당 개발 환경/인증 영역의 namespace·설정판/epoch를 맞춰 구 payload/쿠키를 재사용하지 못하게 한다. 현재 JDBC 세션도 빈 DB에서 다시 발급한다. 상세 수락/복구 원칙은 session_store_v2를 따른다.
