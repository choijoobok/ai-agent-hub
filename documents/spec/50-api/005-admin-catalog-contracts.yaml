feature_contracts:
  FEAT-003:
    group_removal: 사용자 그룹 제거를 저장하면 서버는 제거한 그룹의 해당 카탈로그 컬럼 예외도 같은 트랜잭션으로 함께 삭제한다. 예외를 먼저 삭제하도록 요구하지 않는다. 컬럼 예외만 삭제하는 저장은 사용자 그룹을 유지하고 해당 컬럼의 그룹 기본 권한으로 복귀한다. 매핑 OFF는 제거와 달라 예외를 휴면 보존한다.
    reference_projection: 기술 참조 보호의 currentRef는 응답/내부 문맥에 보존한다. 별개인 소유 링크의 mappingActive:boolean|null을 역조회에 제공하고 화면은 매핑 활성 여부만 표시한다. 비활성 링크도 참조 존재와 다르며 조회 실패/미상은 null로 표시한다. 구조 참조는 임의 활성 플래그를 만들지 않는다.
    mapping_active: REQ-601.asset_mapping_active. tableGroupRefs의 각 링크에 groupRef/mappingActive를 보존하며 ACCESS_GROUPS 영역과 전체 HIST에 동형 저장한다. 역조회는 같은 원값을 반환한다. 현재 그룹 합집합에 true 링크만 사용하고 컬럼 예외의 원본/MASK/HIDE 검증은 별도 유지한다.
    change_history_contract: REQ-601.change_history·approval_storage. 실제 적용된 ENT-005 마스터와 전체 관리 자식을 원본별 HIST에 복사한다. 논리 복사 매핑은 013-admin-management-history.yaml, 마스터 저장일시·정확 적용 리비전과 HISTORY_NO는 모든 자식 조회 문맥을 결정한다. SCR-042는 적용본 관리 화면을 읽기 전용으로 상속한다.
    security_domain_scope: ARCH-050.admin_account_contract. 관리 명령의 인증·ACTOR_ID·지문·원 결과 소유 비교는 system 관리자 영역이다. Portal 주체/같은 문자열 ID로 실행·재생하지 않으며 Portal 대상 이용자와 처리자를 구분한다
    design_status: approved
    implementation: planned
    implementation_transport:
      input: 공통 ManagedCommand wire의 commandKey/targetId/expectedRevision/scope/values/reason을 사용한다. 논리 baseRevision/saveTarget/areaValues는 각각 expectedRevision/scope/values다. 신규 MASTER의 targetId/expectedRevision은 null이며 논리 기준판0에 대응한다.
      scopes: MASTER의 values는 마스터 필드 자체이며 COLUMNS={columns:[]}, ACCESS_GROUPS={groups:[]}, COLUMN_GROUP_EXCEPTIONS={exceptions:[]}, INDEXES={indexes:[]}다. 누락 목록과 명시 빈 목록을 구분한다.
      output: ManagementResult는 commandKey/status/targets[{targetKind=CATALOG,targetId,baseRevision,appliedRevision,historyNo}]/appliedAt/memberMappings[{clientKey,memberId,kind}]다. 원 결과 조회는 {status=APPLIED|UNKNOWN,result}로 감싸며 새 안정 식별은 원 명령의 불변 ENT-020 매핑으로 재조회한다.
      reads: getOne은 {row,values:{master,columns,groups,exceptions,indexes},dependencies:{groupCandidates,review,columnReviews,references,relations,constraints}}다. 서버 검수자/시각은 readonly dependencies.review/columnReviews로 제공하고 editable values로 받지 않는다. exceptions의 regId/regDtm은 서버 소유 조회 필드이며 값이 없으면 null이다. 저장 입력은 columnId/groupId/mode/reason만 허용하고 등록 근거 필드는 거부한다. 등록 근거 보존은 FEAT-007.delivery_boundary.audit를 따른다.
      candidates: API-036 getReferenceCandidates는 기존 선택 후보 계약의 OPTIONS 투영으로 {dataSources:[{id,alias,dbmsCode,dbmsVersion}],timezones,maskingTypes,maskingState}를 반환한다. 정책/마스킹 생산자 미설치는 NOT_CONNECTED이며 정상 지원 빈 목록으로 표시하지 않는다.
      source: CatalogSource·PostgresCatalogSource의 PostgreSQL exact-name/v1이다. serverName은 해당 없음 null, DB/schema/object는 필수인 정확 원문이며 UTF-8 63바이트를 넘는 PostgreSQL 이름과 다른 DBMS 입력은 지원 밖이다. 전역 소문자화·기본 스키마 추정·이름 자르기를 하지 않는다. 실측 지원 근거는 PostgreSQL16.11이며 SQL 파서/업무 실행 지원을 뜻하지 않는다.
      identity: 기동 설정 세대와 최초 서버 관측 OID를 SOURCE_SETTINGS_ID/SOURCE_OBJECT_TOKEN으로 현재·HIST에 보존한다. 이름 정정은 같은 세대·같은 현재 OID와 사용자 동일성 근거를 모두 확인한다. 수기 등록 등 원래 관측 근거가 없으면 UNAVAILABLE이며 타 실체로 자동 승계하지 않는다.
      source_observation: API-028/029는 등록된 catalog-metadata 소비자의 현재 READ 권한으로 연결 레지스트리를 소비한다. read-only/repeatable-read 전용 연결·3초 문장/3초 접속·5초 소켓 상한·rollback을 사용한다. 정확 pg_catalog 조회에 이름을 바인딩하고 비밀·주소·업무값을 반환하지 않는다. 원천 부재 증명이 불충분하면 UNAVAILABLE/ABSENCE_NOT_PROVEN이다.
      source_types: 원천 치수는 state=KNOWN|UNKNOWN|NA|UNSUPPORTED와 characterLength/octetLength/numericPrecision/numericScale/lengthUnit=CHAR|BYTE|null 및 항목별 상태/원문을 보존한다. 일반 뷰의 nullable UNKNOWN과 PK 해당 없음을 원본 테이블 사실로 채우지 않는다.
      indexes: INDEX는 ENT-535/537, UNIQUE_KEY는 기존 ENT-021/022의 전체 구성을 사용한다. UNIQUE_KEY의 구성 순서는 보존하며 정렬 방향은 해당 없음 UNKNOWN이다. INDEX의 ASC/DESC/UNKNOWN, 포함 컬럼/필터/함수/원문과 미지원 상태를 보존한다. 원천 DDL을 실행하지 않는다.
      followup: JOB-003의 일괄 비교 실행/요약·SQL 파서와 실제 업무 실행·FEAT-011 관계 편집·지식/조회제약 소비 및 독립 이력 화면은 각 소유 구현에서 검증한다. 카탈로그 화면의 변경 근거 탭/수동 접수는 TC-00314에 따라 설치하지 않는다. CR-055에 따라 정의·그룹·컬럼 예외는 HUB_CATALOG READ·SAVE 하나로 변경한다.
      sources:
        - sources/backend/modules/admin/src/main/java/com/aiagent/admin/catalog/
        - sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
        - sources/backend/core/src/main/java/com/aiagent/core/deployment/CatalogSource.java
        - sources/backend/support/src/main/java/com/aiagent/support/deployment/PostgresCatalogSource.java
    knowledge_mapping_boundary: REQ-303.reference_mapping. 지식의 외부 안정 ID 연결과 기술적 정확 참조를 구분한다. 외부 리비전 상승만으로 지식 매핑을 동기화/거부하지 않고 필수 SQL/API/참조 무결성만 검사한다. 대상 안정 ID/종류·표시명·적용 리비전·연결 경로·현재 참조 여부를 현재 열람 권한 안에서 조회한다. 연결 지식 본문/사용 설명 자동 수집·업무 의미 영향 판단/보완 작업은 제공하지 않는다.
    save_reason: 상단과 각 편집 탭의 저장 버튼은 소유 영역의 고정 saveTarget 코드를 전달한다. MASTER=마스터 데이터, COLUMNS=컬럼 정의, ACCESS_GROUPS=사용자 그룹, COLUMN_GROUP_EXCEPTIONS=컬럼 그룹 예외, INDEXES=인덱스, RELATIONSHIPS=별도 관계 편집이다. 변경 사유 레이어 팝업의 trim 후 비공백 reason과 해당 영역 변경값만 반영한다. 단, ACCESS_GROUPS에서 그룹을 제거할 때 그 그룹의 저장된 컬럼 예외를 서버가 함께 정리하는 것은 동일 명령의 필수 연쇄 처리이며 다른 탭 입력 저장이 아니다. 삭제 대상 그룹에 속한 미저장 예외는 함께 폐기될 내용을 먼저 확인하고, 취소하면 그룹·예외 입력을 모두 보존한다. 다른 그룹의 예외 편집은 유지한다. 서버는 대상 코드·허용 필드·현재 HUB_CATALOG READ·SAVE 권한/기준 리비전·전체 참조 무결성을 검증하며 다른 탭의 미저장값은 반영하지 않는다. saveTarget을 그대로 이력에 저장하고 실제 차이로 대상을 재계산하지 않는다. 변경 없음은 새 이력 없이 반환한다. 현재 확정 구성에 영역 변경을 합쳐 같은 HISTORY_NO의 전체 HIST를 복사하며 부모에 saveTarget과 HIST_REASON을 기록한다. 취소는 전송하지 않고 다른 탭 입력도 유지한다. 실패/충돌/결과 불명 및 동일 명령 재시도는 원 대상·reason·입력·commandKey를 보존한다. 성공 후 새 저장은 새 메모를 받고 다른 탭 편집은 보존한 채 최신 기준 리비전/참조를 재검사한다. SCR-042는 저장된 saveTarget 명칭과 메모를 변경 대상/변경 사유로 조회한다.
    column_order_contract: REQ-301.column_order. CatalogComposition 컬럼은 ordinalPosition:number|null과 확인/수기 출처를 보존하고 순서 ASC·null 마지막·안정 ID 순으로 반환한다. 원천 StructureResult/SourceObjectResult의 성공 메타데이터 순서와 관리 저장값을 구분한다. COLUMNS areaValues와 전체 HIST 복사에도 포함한다. 양의 정수/동일 카탈로그 non-null 중복을 검증하며 부분 공개 공백을 허용한다.
    simplified_grid_projection: SCR-003 사용자 그룹에는 groupCandidateStatus 상태 열이 없고 매핑 활성 여부는 자산 useYn과 구분한 boolean mappingActive로 보존한다. 인덱스 indexDirection은 정렬 방향으로 표시하고 indexReview 직접 편집 열은 제공하지 않는다. 서버 기술 검증/정의 완전성은 유지한다.
    response_rule: 안정 항목·선택한 내용 판·현재 효력·초안 검수·현재 정책/연결 관측을 분리한다. draft 저장 성공이나 검사 결과만으로 운영 사용 가능을 반환하지 않는다. 메타데이터 열람과 원본 값/샘플 열람 권한은 별도다
    identity_contract:
      source: REQ-301.business_rules와 identity_change·ADR-032를 따른다. DATA_SOURCE_ID는 같은 안정 항목에서 고정하며 다른 물리 실체/데이터소스로 이름을 바꾸는 우회를 허용하지 않는다
      resolution: integration 소유의 정확 객체 해석은 실제 데이터소스·DBMS 식별 규칙 버전·서버/DB/스키마/객체의 정확 이름과 각 차원의 PRESENT/NOT_APPLICABLE을 반환한다. 해당 없음은 DB null로 저장하지만 입력의 미확인/생략과 구분한다. 해당하는 스키마는 기본 스키마도 실제 이름을 명시한다. 모호함·지원 불가 식별은 저장하지 않는다. 원천 조회 실패는 선언 식별과 별개이며 REQ-301.manual_registration의 완전한 직접 입력을 서버에 고정된 identityProfile로 정규화할 수 있다. 메타데이터 조회 성공이 정규화의 전제는 아니다
      equality: 서버에 고정된 DBMS별 동일성 규칙으로 각 구성 요소를 정규화한 길이 구분 UTF-8 튜플을 만들고 SHA-256 OBJECT_KEY를 계산한다. 구성 순서는 profile/server/database/schema/object이며 해당 없음 표지를 포함한다. 단순 연결 문자열·전역 소문자화·데이터소스 별칭 규칙을 사용하지 않는다. 같은 키이면 전체 튜플을 추가 비교하며 해시 충돌은 동일 객체로 병합하지 않고 409로 중단한다. 길이는 각 이름 500자 이내이며 원문을 자르지 않는다
      profile_transition: 한 데이터소스의 등록/반영에는 하나의 고정된 식별 규칙 버전만 사용한다. integration이 다른 버전을 반환하거나 기존 DRAFT/ACTIVE 항목의 IDENTITY_PROFILE이 섞였으면 기존 전체 등록과 재대조/충돌 해결·키 이행을 완료하기 전 신규 등록·이름 변경·복원/반영을 409로 차단한다. 새 버전으로 키만 계산해 기존 유일 인덱스를 우회하지 않는다. 이행은 데이터소스 및 해당 live 카탈로그 잠금 아래 현재 키를 함께 바꾸며 고정 과거 판의 profile/이름은 보존한다. @defer P3 integration — 규칙 버전의 원천·배포/이행 절차와 동시 저장 차단 계약을 연결한다
      uniqueness: ENT-005의 DATA_SOURCE_ID+OBJECT_KEY 부분 유일 인덱스로 DRAFT/ACTIVE 중복을 차단한다. 같은 객체의 여러 후보는 한 CATALOG_ID 아래에 둔다. RETIRED 항목의 과거 참조는 유지하고 신규 실체 등록은 새 ID를 사용한다. 복원/이름 변경 반영 때 새 이름 점유와 현재 원천 실체를 다시 검사한다. 객체 유형 TABLE/VIEW는 사실이며 동일 물리 식별 중복을 피해 가는 키가 아니다
      rename: 이름 변경은 새 후보에 전체 새 물리 식별과 IDENTITY_EVIDENCE를 기록한다. 기존 항목·구성의 안정 ID를 재사용하려면 같은 객체임을 현재 근거로 검수하고, 참조 영향/기준 판/새 이름 중복을 세트 반영 직전 다시 검사한다. 현재 행의 이름은 실제 반영 시에만 바뀐다. 삭제·재생성의 자동 승계나 과거 판 이름 덮어쓰기는 금지한다
      column: COLUMN_ID는 ENT-020의 카탈로그/종류에 고정한다. 한 판에서 COLUMN_KEY의 중복을 거부하되 이름 미확인 초안은 null로 보존한다. 새로 발견한 동명 컬럼에 이전 ID를 자동 배정하지 않는다. 부분 수집을 등록 컬럼 삭제로 해석하지 않는다
    batch_comparison_contract:
      view_capabilities: REQ-304.batch_structure_comparison.view_scope. 양쪽 objectType과 항목별 적용/지원/확인 상태를 반환한다. 일반 뷰의 물리 PK 해당 없음은 PK 없음·UNKNOWN과 구분하고 논리키를 원천 PK로 비교하지 않는다. 뷰 NULL UNKNOWN은 원본 컬럼 사실로 덮지 않는다. 특수 뷰 인덱스는 DBMS 지원에 따라 비교하며 구조 일치로 내부 쿼리 의미 동일을 보증하지 않는다
      source: REQ-304.batch_structure_comparison, JOB-003, SCR-002/525, ENT-039/040
      presence_contract: REQ-304.batch_structure_comparison.presence. 각 행은 catalogPresence/sourcePresence와 양쪽 정형 정의를 반환한다. ABSENT는 명시 상태이며 null/빈 배열/조회 실패로 추론하지 않는다. 화면은 존재하는 쪽의 이름으로 행을 식별하고 다른 쪽은 항목 없음으로 표시한다. 양쪽 부재도 성공 확인 범위와 최신 기준을 검사한 뒤 기존 차이 해소를 판정한다
      comparison_views: 목록은 COLUMN/INDEX 유형별로 조회한다. COLUMN은 정확 테이블/컬럼별 카탈로그/원천의 이름·타입·치수·NULL·PK/순서와 속성별 비교 상태를 반환한다. INDEX는 정의 종류·이름·유일성·순서 있는 키 구성·포함 컬럼·필터/표현식·기타 지원 속성의 양쪽 전체 정의를 반환한다. 표시는 비교 쌍이지만 DTO는 구분 문자열 하나가 아닌 정형 값/원문/상태/기준 버전/관측 시각을 보존한다. 미관리/미지원/미확인을 같음으로 합치지 않는다. 긴 정의를 자르지 않고 현재 권한 범위의 셀 상세·엑셀에 제공한다
      implementation: planned
      schedule: JOB-003은 공통 배치 실행기에서 admin 소유 비교 서비스를 호출한다. 승인된 운영 실행 범위와 현재 설정된 원천 접속 계정의 메타데이터 권한을 재검사한다. 관리자 화면 요청인 것처럼 세션을 위조하지 않는다. 수동은 기존 메뉴/비교 액션의 현재 권한을 적용한다. 둘 다 같은 데이터소스 점유·실행 키·현재 결과 갱신 계약을 사용한다.
      summary_read: SCR-002 목록/탭과 SCR-525 대시보드는 admin 소유의 같은 현재 차이 조회 투영을 소비한다. 응답은 dataSourceId/dataSourceKey, resultSnapshot, COLUMN/INDEX의 groupCount, 검사항목/권한 제외/부분 실패 상태와 마지막 성공 근거를 정형 값으로 제공한다. REQ-304.batch_structure_comparison.summary의 표시만 화면에서 조합한다. 현재 HUB_DATA_SOURCE 및 대상 READ 범위 밖 항목/건수는 반환하지 않으며 대시보드는 DASHBOARD 권한도 검사한다. 탭의 페이지 전 total과 요약을 같은 스냅샷으로 고정하고 만료 시 함께 다시 조회한다. 실패/권한 회수 때 이전 데이터를 현재 정상으로 유지하지 않는다.
      commands: 시작(dataSourceId/expectedSettingsVersion/commandKey)·실행 결과 조회(runId)·현재 불일치 목록(dataSourceId)으로 분리한다. 현재 HUB_DATA_SOURCE READ+비교 실행 권한 및 대상 메타데이터 권한을 서버에서 검사한다. 카탈로그 수정/SAVE와 비교 실행은 별도 액션이다
      scope: 서버가 권한 있는 등록 카탈로그의 현재 유효 버전 목록을 확정하고 선택 객체의 API-029/integration 구조 조회를 재사용한다. 클라이언트가 임의 테이블/SQL을 추가하지 못한다. 부분 권한 범위를 데이터소스 전체 정상으로 표시하지 않는다
      result: 실행/완료 시각·RUNNING/COMPLETED/PARTIAL/FAILED/CANCELED·대상/성공/불일치/확인불가/건너뜀 수와 대상별 결과·기준 버전·비교 지원 범위를 반환한다. 목록 행은 정확 대상/속성·정의값/원천값·최초/최근 발견·최근 확인 상태이며 실제 값 데이터는 없다
      update: 동일 데이터소스 실행 점유·기준/세대 검사 뒤 대상별 결과와 현재 차이 UPSERT/일치 확인된 차이 제거를 원자 처리한다. 차이 해소 사실은 실행 기록/근거에 남긴다. 목록/이력/카탈로그 반영은 서로 다른 저장이며 비교가 자산을 자동 수정하거나 기존 검토를 종결하지 않는다
      pending: '@defer P3 integration_assets·integration — 구체 API ID/경로/DTO·페이지/정렬·멱등/잠금·중단/재시작·시간 상한·보존/파기와 실제 검증을 확정한다. READ API-029를 일괄 실행 명령이나 결과 저장 API인 것처럼 사용하지 않는다'
      query_relevance_scope: REQ-304.batch_structure_comparison.relevance_scope. 비교 요청/관측/차이 응답·완전성은 적용된 SQL 관련 범위를 공유한다. SQL 해석/키 보장/인덱스 활용과 무관한 DBA 속성 차이를 새 차이·미지원·전체 불확실로 반환하지 않는다. 범위 안의 미지원/권한 부족은 기존대로 확인 불가다.
    screen_projection: SCR-003/039는 같은 카탈로그 현재 적용본·baseRevision·버튼 영역 변경의 직접 저장과 전체 HIST 복사을 사용한다. 미열람 관계/쌍 누락은 삭제로 처리하지 않고 전체 구성 보존을 검증한다. 상단 테이블 행은 신규/조회 상태별 관리값 편집본을 제공하며 원 서버값·수정 입력을 이중 정의하지 않는다. 테이블 정의 탭은 상단에 통합하고 읽기 전용 ID/DBMS/감사·소속 데이터소스 불변 및 동일 객체 정정 계약은 유지한다. 값의 원천·갱신 시각·계산/저장 구분은 화면 계약과 응답의 같은 정의를 따른다. 상단 목록의 효력 상태/조회 제약 표시는 생략하고 적용 리비전을 반영 시각 다음에 둔다. DTO의 내부 lifecycle·필수 정책 적용과 UI 표시를 구분하며 revision은 현재 적용 리비전의 읽기 전용 값이다.
    code_value_read_contract:
      owner: REQ-301.value_domain 및 REQ-603.data_query_guides. groupCode는 원천 공통 코드 그룹 구분값이며 해당 없으면 null이다. 상세 설명(detailDescription)에 컬럼 용도·사용법과 공통 코드가 아닌 하드 코딩 값/의미를 작성한다. 수기 열거 자식·값 방식 선택은 관리하지 않는다.
      selection: 현재 허용된 선택 카탈로그 ID/적용 리비전/등록 컬럼 집합에서 안정 DS를 추출한다. 각 DS의 가이드를 한 번 읽어 주입하고, 필요한 원천 코드/참조 테이블 스키마는 현재 권한으로 추가 조회한다. 지식 무결과로 전체 공개 자산을 열지 않는다.
      execution: groupCode가 있으면 데이터소스 가이드의 공통 코드 조회 SQL 패턴에 그 값을 안전하게 바인딩해 허용된 원천을 읽고 코드명을 확인한다. groupCode=null이면 조회를 강제하지 않으며 상세 설명에 명확히 기재한 값/의미를 LLM이 해석한다. 설명에 없는 값·모호한 뜻·현재 동적 코드명을 지어내지 않고 필요한 경우 질문/허용된 읽기 조회로 확인한다. 가이드/설명은 권한·실행 명령이 아니며 SQL·객체/컬럼·행·신원·마스킹·read-only·상한 검사는 유지한다.
      uncertainty: 필요 값 미확정 시 질문/보류하고 코드값을 생성/추정하지 않는다. 프롬프트만으로 선행 조회 이행을 보장한다고 하지 않는다.
      evidence: 가이드 적용 DS리비전/ID 및 실제 조회 시각/SQL·바인딩/결과/사용값의 보호된 턴 근거를 보존한다. 원천 결과는 카탈로그/DS 관리 스냅샷에 복사하지 않는다.
    masking_type_catalog: FEAT-007.masking_type_catalog·REQ-611.masking_utility의 공통 논리 계약. 소유 메뉴 READ로 배포된 유틸의 지원 유형 목록 [{value,text}]을 조회한다. value·유형명 메시지 키·검증·실제 변환이 같은 소스 등록을 사용한다. 화면은 원응답 item을 {value:item.value,text:label(item.text)}로 변환해 기존 SelectOption과 CodeSelect/SearchSelectCellEditor 규약을 사용하고 언어가 바뀌어도 선택 코드/호출 의미는 유지한다. 실제 개인정보 값이나 함수/정규식/실행 스크립트는 후보 조회로 보내지 않는다. 지원 입력/출력·버전은 같은 유틸의 내부 검증 메타데이터다. 목록 항목의 value와 원응답 text(메시지 키)는 위 계약을 사용하며 구체 API ID/경로/DTO는 access_policy 상세 설계 후속이다. 목록 실패는 정상 빈 목록과 구분하고 기존 선택을 보존한다.
    composition_contract:
      column_privacy: REQ-111.privacy_metadata.column_workspace. 컬럼 후보는 privacyFlag(YES/NO/UNKNOWN), privacyType, maskingRef, subjectIdentifier, privacyReview를 가진다. maskingRef는 소스 유틸의 안정 정보 유형 코드다. YES 또는 MASK 예외 사용 시 현재 지원/자료형 호환 유형을 요구하고 미확인/누락은 사용 가능으로 검수하지 않는다. 내용 변경은 검수를 무효화하며 전체 저장/복사/고정에서 보존한다. 유형 변경은 소유 후보/HIST에 반영하고 유틸 소스 구현을 덮지 않는다. 과거 코드·표시 근거와 실제 변환 구현 버전은 REQ-611.masking_utility.history를 따른다. @defer P3 access_policy — 물리 매핑/DTO·정책 참조 버전·과거 재현/현재 검증을 완성한다
      source_types: REQ-301.source_type_catalog. 각 컬럼은 sourceTypeCode(nullable DBMS_DATA_TYPE 상세 코드 1~30자)와 sourceType(nullable 원천 문자열 1~200자)를 별도로 가진다. 서버는 카탈로그 데이터소스의 현재 DBMS와 PARENT 일치·활성·NATIVE_TYPE/원천 대조를 검사한다. 미확인 초안은 원문/null 코드로 보존할 수 있지만 잘못된 비null 참조는 거부한다. 검수 완료에는 실제 원천 조회 또는 설계서/담당자 확인 등 REQ-301.manual_registration의 구조 근거 대조가 필요하며 자료형/DBMS 변경 시 해당 검수는 무효화한다. 저장/복사/고정/이력은 당시 코드·원문을 보존한다
      column_exclusions: REQ-103.column_group_exclusions. tableGroupRefs와 columnExceptions는 현재 저장 구성과 해당 영역 변경을 합쳐 같은 기대 버전으로 검증한다. 사용자 그룹 제거를 저장하면 서버는 제거한 그룹의 해당 카탈로그 컬럼 예외도 같은 트랜잭션으로 함께 삭제한다. 예외를 먼저 삭제하도록 요구하지 않는다. 컬럼 예외만 삭제하는 저장은 사용자 그룹을 유지하고 해당 컬럼의 그룹 기본 권한으로 복귀한다. 매핑 OFF는 제거와 달라 예외를 휴면 보존한다. 입력은 columnRef/groupRef/treatment(HIDE 또는 MASK)/reason이며 반환에는 서버 regId/regDtm을 포함한다. 컬럼+그룹 중복·테이블 밖 그룹·빈 사유·알 수 없는 유형을 거부한다. MASK이면 해당 컬럼의 유효한 maskingRef를 검사한다. 예외 제거는 원본 열람 승계 복귀다. HIDE는 컨텍스트/SQL에서 제외, MASK는 결과 변환이며 현재 권한/복수 그룹 합집합을 대조한다. 저장 사본 개인정보 마스킹은 별도로 강제한다. 구체 행 식별·물리·감사/복사 모델은 FEAT-007 후속이다
      additions_pending: '@defer P3 integration_assets — REQ-301.source_dimensions/index_metadata의 치수·인덱스 전체 정의/구성을 CatalogComposition에 포함할 형식·물리 매핑·조회/저장·과거 재현·복사/고정/검증 계약을 완성한다. 기존 DTO/ENT에 해당 필드가 이미 있는 것으로 해석하지 않으며 누락 상태로 부분 저장/운영 반영하지 않는다'
      scope: 현재 업무 내용·전체 소유 관리 자식·접근 그룹은 같은 전체 구성이다. 현재값과 성공 적용 HIST에 동형 매핑하며 외부 소유 관측/비밀은 제외한다.
      relation_preservation: 카탈로그/관계는 동일 마스터의 현재 리비전·전체 구성으로 API-023/024 직접 저장을 사용한다. 관계/쌍 누락은 거부하며 두 표면의 미저장 입력을 자동 병합하지 않는다.
      member_identity: 신규 구성은 종류별 clientKey(UUID)를 받아 전체 입력의 임시 참조를 먼저 해석한다. 서버가 ENT-020을 배정하고 소유/종류를 고정하며 결과에 clientKey→memberId를 반환한다. 자기조인은 같은 저장의 신규 컬럼을 참조할 수 있다. 다른 후보의 아직 배정되지 않은 clientKey를 추정하지 않고 먼저 그 후보 저장 결과를 받는다. 삭제·재추가 시 명시한 기존 ID의 동일성을 검증하며 소유/종류 이전은 거부한다
      keys: REQ-301.key_workspace의 화면 매핑을 따른다. PRIMARY는 컬럼 정의의 전체 PK/순서, UNIQUE는 인덱스 탭의 UNIQUE_KEY 정의로 편집한다. ENT-021·022는 원천/검수된 유일 식별키의 전체 구성이다. 일부 컬럼이 미등록·미확인이면 키를 VERIFIED로 확정하지 않는다. PK 참여 컬럼 하나를 단일 유일키로 취급하지 않는다. 복합 키 순서·중복·전체 범위를 검증하며 원천 DB에 키/인덱스를 생성하지 않는다
      group_code: groupCode는 string|null이며 공백은 null로 정규화한다. 원천 그룹 코드이고 Hub 공통코드 FK가 아니다. groupCode가 있으면 데이터소스 가이드의 공통 코드 조회 SQL 패턴에 그 값을 안전하게 바인딩해 허용된 원천을 읽고 코드명을 확인한다. groupCode=null이면 조회를 강제하지 않으며 상세 설명에 명확히 기재한 값/의미를 LLM이 해석한다. 설명에 없는 값·모호한 뜻·현재 동적 코드명을 지어내지 않고 필요한 경우 질문/허용된 읽기 조회로 확인한다. 가이드/설명은 권한·실행 명령이 아니며 SQL·객체/컬럼·행·신원·마스킹·read-only·상한 검사는 유지한다.
      detail_description: detailDescription은 컬럼 용도/사용법·하드 코딩 값의 의미를 적는 장문이다. valueMode/inlineValues 및 옛 코드 정의/바인딩 입력은 지원하지 않는다. 별도 코드값 자식으로 변환하지 않으며 전체 구성과 HIST에 보존한다.
      constraints: 조회 정책의 세 조건 집합/파라미터/사용·해제 설정은 CatalogComposition에 포함하지 않는다. REQ-611.query_constraints의 현재 정책 원천을 사용하며 SCR-009 소유 공개 조회·변경 계약은 access_policy에서 설계한다
      reviews: 입력은 검수 의도와 근거를 전달하며 검수자/시각은 서버가 현재 작성/검수 권한에서 결정한다. UNKNOWN/INVALID를 유지할 수 있으나 VERIFIED 요청은 실제 필수 필드/전체 참조/타입·의미/근거 검사를 통과해야 한다. 단순 DTO의 VERIFIED 값 복사를 금지한다. 구조·의미·코드·키·관계 정의가 달라지면 해당 검수와 의존 검수를 무효화하고 명시적으로 재검수한다. 별도 관리자 검토/승인 단계는 없으며 저장자가 확인한 기술 입력/참조 유효성을 서버가 검증한다
      owned_components: '@defer P3 access_policy·knowledge — 접근 그룹 후보 저장/고정 참조와 당시 직접 정책 참조의 구체 형식은 FEAT-007 및 소유 정책 계약에서 완성한다. 이 계약을 비운 채 전체 스냅샷 고정/운영 반영을 구현 완료로 표시하지 않는다. 그룹 조회 실패를 빈 그룹 또는 상속 해제로 바꾸지 않는다'
      local_edit: 저장 전 입력은 현재 적용본/baseRevision 기준의 로컬 편집값이다. 서버 요청 초안·SNP·EDIT_VERSION을 만들지 않고 저장 때 전체 구성을 재검증한다.
    edit_transaction:
      scope: REQ-601.management_storage의 전체 직접 저장/이력/명령 결과
      save: commandKey/targetId/baseRevision/saveTarget/reason/areaValues. 선택 영역만 변경하고 서버 확정 나머지와 전체 참조를 검증한 뒤 전체 HIST를 복사한다.
      versions: REVISION은 마스터에만 있고 실제 반영 성공마다 정확히 한 번 증가한다. 자식 변경도 같은 부모 잠금/기준 리비전 검사를 따른다.
      restore: HISTORY 전체 구성을 읽어 현재 적용본의 baseRevision·현재 권한으로 새 직접 변경을 저장하고 원 이력번호를 근거로 남긴다. 과거 이력을 덮어쓰지 않는다.
      result: commandKey/status/targets[{targetKind,targetId,baseRevision,appliedRevision,historyNo}]. APPLIED만 실제 결과 리비전/HISTORY_NO를 가진다. 실패/결과 불명은 원 명령키로 확인하며 같은 명령 재전송은 원 결과만 반환한다.
      atomicity: 현재값·전체 자식·마스터 REVISION·전체 HIST/HISTORY_NO·멱등 성공 결과는 같은 트랜잭션으로 확정한다.
    set_public_contract:
      implementation: planned
      owner: FEAT-014
      validate: 전체 실제 변경 대상과 기술적 참조·기대 버전·현재 변경 권한을 같은 공통 부모 잠금 순서로 검증한다.
      references: SELF/같은 명시 전체 변경의 임시 참조/외부 정확 기술 참조/현재 정책을 구분한다. 지식 안정 ID 매핑은 외부 리비전 고정으로 바꾸지 않는다.
      locks: 대상 종류+안정 ID 순서로 실제 변경 부모를 잠그고 모든 자식 전용 쓰기도 같은 검사에 참여한다. 관리자 진행 요청 점유나 장기 승인 잠금은 없다.
      apply: 현재값·결과 리비전·전체 HIST·원 명령 결과를 원자 반영한다. 기술적으로 함께 변경한 참조는 계산한 새 적용 리비전으로 일치시킨다.
      boundary: '@defer P3 — 그룹/현재 권한·참조/기술 검증·동시성·멱등/불명 복구와 공개 DTO를 소유 영역별 연결한다. 외부 DDL/배포를 admin DB 잠금으로 동결했다고 주장하지 않는다.'
    source_public_contract:
      type_candidates: REQ-301.source_type_catalog의 콤보는 API-600에 grpCd=DBMS_DATA_TYPE, refCd=PARENT, refVal=소속 데이터소스 DBMS 코드를 전달해 활성 상세 코드 목록을 받는다. 공통 useCodeOptionsByRef/CodeSelect를 재사용하고 표시명은 기존 코드 메시지로 읽는다. 버전은 조건에 넣지 않는다. NATIVE_TYPE은 저장/검수 서버의 내부 코드 참조 조회에서 해석하며 단순 코드 배열 응답에 포함됐다고 가정하지 않는다. sourceTypeCode 선택과 SOURCE_TYPE 원천 근거를 대조한다. 기존 API-554는 그룹 전체 조회로 유지한다. CODE 캐시 무효화·조회 실패와 빈 결과의 구분은 FEAT-504.reference_combo_contract를 따른다. 실제 구현/시드는 소유 G3 뒤 진행한다
      implementation: planned
      owner: integration
      input: 현재 주체·Hub 데이터소스·선정한 정확 공개 객체 또는 등록 catalogId/revisionId와 연결 관측 근거. 전체 DB 열거/자동 등록 입력은 없다
      output: nodeId/bootId/appliedSettingsId/observedAt·identityProfile·정확 물리 식별·TABLE/VIEW·관측 DBMS/버전과 컬럼 원천 자료형/치수/키 전체/NULL 사실과 COMPLETE/PARTIAL/FAILED. 부분 수집에는 누락/실패 범위를 명시한다. 원천 코멘트는 제안이며 검수 완료 값이 아니다. 연결 주소/계정/비밀은 제외한다
      manual_boundary: 원천 조회는 선택 보조다. ACCESS_DENIED/UNAVAILABLE/NOT_REQUESTED를 보존하고 직접 입력·근거 검수로 신규 후보를 반영할 수 있다. 성공 관측 필드를 조작하거나 기존 객체의 이름 변경/복원 동일성 검증을 우회하지 않는다. 실제 실행 시 원천 읽기 권한은 별도로 검사한다
      sampling: 현재 화면/구현 범위 제외, 재요청 시에만 재검토한다. 샘플링은 runSample의 별도 수동 실행이다. 선택한 등록 컬럼의 현재 개인정보 제외·읽기/실행 권한·현재 정책·필수 조회 제약·조회량/시간 상한을 서버에서 검사한다. 상한/공개 검증 계약이 미완성인 배포에서는 기능을 활성화하지 않는다. 값은 ENT-010 구조 근거·후보/이력에 복제하지 않고 REQ-304.note의 시스템 조회 이력으로 연결한다
      pending: '@defer P3 integration·agent — DBMS별 정확 이름/동일성 해석 규칙과 최대 이름 길이 대응·사실 조회/일괄 비교의 시간 상한·현재 연결 재검증·실행/불일치 이력 계약을 완성한다. 지원 밖 입력을 정상처럼 저장/실행하지 않는다'
    types:
      CatalogFilter: SearchRequest.params의 dataSourceId/lifecycle/businessName/objectType(TABLE/VIEW) 선택 조건. sorts는 catalogId/businessName/appliedAt, 동률 catalogId. 객체 유형은 정확 물리 식별 중복을 회피하는 키가 아니다. 공통 offset 페이지 제한을 사용한다
      CatalogRow: catalogId/dataSourceId/정확 물리 식별/objectType/lifecycle/revision/업무명/반영시각. 실제 적용본만 반환하며 최초 미적용 요청은 포함하지 않는다.
      CatalogKey: catalogId:필수 양의 십진 문자열. 기록 보존 권한이 있으면 RETIRED 항목도 조회한다
      CatalogDetail: CatalogRow와 현재 선택 내용 요약·현재 연결/정책 관측·권한 있는 사용처. 조회 실패를 값 삭제로 바꾸지 않는다
      RevisionKey: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      RevisionRow: 안정 대상ID/적용 리비전/HISTORY_NO·이력 저장일시/실제 변경자·변경 사유·작업 종류. 성공 적용 이력만 조회한다.; SCR-042는 저장 버튼이 전달한 saveTarget과 reason을 반환하며 실제 차이로 대상을 재계산하지 않음
      CatalogComposition: ENT-006의 편집 가능한 정의와 ENT-007/008/021/022/024/025의 전체 자식 목록, 접근 그룹 후보의 소유 계약 참조. memberId 또는 신규 clientKey를 사용한다. 모든 필드/목록을 명시하며 빈 목록과 누락은 다르다. 당시 정책 참조는 소유 계약의 서버 결과이며 사용자가 현재 정책을 덮지 못한다
      RevisionDetail: RevisionRow·당시 전체 CatalogComposition·과거 근거/고정 참조와 누락/검수 사유. 현재 컬럼/그룹으로 과거를 재구성하지 않는다
      CatalogKnowledgeReferenceRow: API-026의 연관 지식 역조회 전용 응답이다. knowledgeId·knowledgeName·원 소유 링크의 mappingActive:boolean|null을 반환하며 SCR-003의 표시 세 열과 대응한다. 기술 참조 보호에 필요한 대상 종류·정확 적용 리비전·연결 경로·currentRef는 별도 응답 문맥으로 보존한다. 화면 활성 여부를 currentRef에서 계산하지 않으며 지식/예제 본문·사용 설명이나 관계/후보 선택 필드를 혼합하지 않는다.
      CatalogRelationReferenceRow: API-027의 관리용 관계 역조회 전용 응답이다. relationId·relationName·ownerCatalogId/ownerRevisionId·left/right의 정확 catalogId/revisionId·객체 표시명/업무명·roleName·relationType·description·reviewStatus를 반환한다. 조회한 카탈로그가 해당하는 역할은 matchedSides=[LEFT], [RIGHT] 또는 자기조인의 [LEFT,RIGHT]로 표시한다. 자기조인도 같은 소유 관계 한 행 안에서 두 역할을 유지하며 독립 관계 리비전은 만들지 않는다. 편집은 ownerCatalogId와 그 기대 리비전으로 연결하고 컬럼 쌍은 같은 소유 CatalogComposition에서 읽는다. 지식 매핑 활성 여부를 관계 상태로 재사용하지 않는다. 이 관리 응답을 모델의 범위 제한 관계 조회 결과로 사용하지 않는다.
      CatalogReferenceCandidateRow: API-036의 선택 후보 전용 응답이며 candidateKind=COLUMN/JOIN_OBJECT/KEY로 구분한다. 공통 objectRef는 dataSourceId/dataSourceName·정확 catalogId/revisionId·객체 유형·DB/스키마/물리명/업무 표시명과 현재 또는 명시한 동일 편집 문맥을 보존한다. JOIN_OBJECT는 objectRef만 선택한다. COLUMN은 column={columnId 또는 신규 clientKey 중 하나, 물리명/업무명, 자료형}을 포함한다. KEY는 key={keyNo 또는 신규 clientKey 중 하나, 키 종류, 순서 있는 전체 columns}를 포함하며 각 컬럼은 같은 objectRef의 columnId 또는 신규 clientKey로 식별한다. keyNo는 해당 카탈로그 판 안에서만 유일하다. 신규 clientKey는 요청이 명시한 동일 로컬 편집 문맥에서 검증된 경우만 허용하며 다른 편집본/저장된 참조로 자동 승격하지 않는다. 종류별 대상 밖 column/key는 제공하지 않고 전체 복합키를 일부 컬럼으로 축약하지 않는다. 표시 문자열로 식별하거나 동명 다른 객체/정확 판을 대체하지 않는다.
      SourceObjectQuery: dataSourceId·선정한 정확 객체 식별. 서버/DB/스키마 해당 여부는 원천 해석에서 확인한다. 와일드카드 전체 수집 입력을 받지 않는다
      SourceObjectResult: 해석 상태 RESOLVED/AMBIGUOUS/UNSUPPORTED/ACCESS_DENIED/UNAVAILABLE/NOT_FOUND 및 성공 시 정확 식별/동일성 규칙 버전/관측. 미조회는 NOT_REQUESTED로 구분한다. 제한된 목록의 빈 결과를 NOT_FOUND로 단정하지 않으며 부재 확인 근거가 있을 때만 반환한다. 실패는 기본 스키마나 관측 성공으로 자동 확정하지 않고 수동 등록을 안내한다
      StructureQuery: RevisionKey·기대 내용 판/연결 관측 기준. 현재 등록 공개 범위의 구조 사실만 조회한다
      StructureResult: 현재 사실/후보와의 차이·완전성/실패 범위·원천 관측 근거. 자동 후보 갱신이 없으며 저장할 때 서버가 검수 근거를 대조한다
      SampleRequest: RevisionKey·선택한 등록 columnIds·검증 가능한 조회 조건/상한. 원천 SQL 임의 입력이나 미등록 컬럼/개인정보 열 선택을 허용하지 않는다
      SampleResult: 허용 샘플과 실제 조회 이력 참조·적용 제한·결과/실패 상태. 결과 원문을 카탈로그 저장 DTO에 포함하지 않는다
      EvidenceFilter: catalogId/sourceKind/receivedFrom/receivedTo 선택, 시각 범위는 시작 포함·끝 제외. 정렬 receivedAt/evidenceId 내림차순, 공통 offset 페이지
      EvidenceKey: evidenceId:필수. 관련 대상/원 근거의 현재 열람 권한을 함께 검사한다
      EvidenceRow: evidenceId/sourceKind/observationStatus/receivedAt/observedAt·권한 있는 대상 요약
      EvidenceDetail: EvidenceRow·버전 있는 구조 차이/업무 변경 근거·targets:EvidenceTargetView[]·소유 검토/조사 연결. 미확인과 영향 없음은 다르다. 근거 대상은 관측/전후/후보 연결이며 실제 영향 확정이나 조치 완료 목록이 아니다
      EvidenceTargetView: evidenceId/targetNo/catalogId와 CURRENT 또는 HISTORY의 정확 적용 리비전/역할·당시 명칭. 현재 열람 권한을 검사하고 미지정을 현재값으로 바꾸지 않는다.
      EvidenceSave: commandKey/sourceKind/sourceRef/observationStatus/evidenceFormat=1/evidenceBody/targets/고객사 예정·실제 적용 시각. 수동 통지/업무 근거만 입력하며 구조 관측 결과·주체·접수시각은 서버 근거로 검증한다. 보완은 새 evidenceId로 연결한다. SCR-003 수동 입력은 NOTICE/MEANING, sourceRef 최대 200자, 공백뿐인 업무 본문 거부, 입력 시각은 UTC 오프셋 포함으로 검증한다. 이 화면은 선택 catalogId의 대상 1건 이상과 선택/null revisionId·OBSERVED/BEFORE/AFTER/CANDIDATE 역할을 전달하며 같은 catalogId/revisionId/역할 중복을 거부한다. UNCONFIRMED·접수 주체/시각은 서버가 확정하고 STRUCTURE 관측 결과를 사용자가 위조하지 못한다
      CatalogCommandKey: commandKey와 현재 READ·SAVE 권한. 다른 주체 키와 미발견을 같은 UNKNOWN으로 반환한다
      CatalogCommandResult: APPLIED면 원 ManagementResult 또는 근거 접수 결과, UNKNOWN이면 원 명령키로 실제 결과를 확인한다. traceId는 이번 조회의 추적값이다.
      ValidationRequest: 현재 대상/기대 리비전·전체 로컬 편집 구성과 같은 명시 변경 대상 집합. 기술 검증만 반환하며 저장/승인 상태를 만들지 않는다.
      ValidationResult: 관측한 후보 판/편집 버전·정확 참조 목록·오류/미완성/검수 필요 목록. 제출/반영 시 다시 검증하므로 이 결과를 영구 허가로 쓰지 않는다
      ReferenceCandidateFilter: 소유 RevisionKey·후보 종류 COLUMN/JOIN_OBJECT/KEY·조회 범위. 현재 허용된 등록 객체/판만 반환하며 같은 세트 후보와 현재 운영본을 구분한다. 반환 식별자와 종류별 구성은 CatalogReferenceCandidateRow를 따른다. 상대 테이블 선택 뒤 그 정확 판의 컬럼/키만 조회하며 동명 객체·권한 밖 컬럼·이전 테이블의 잔존 선택을 서버에서 거부한다. 미등록 로컬 후보를 포함하면 해당 편집 문맥과 후보 전체 구성을 명시하고 서버가 소유/참조를 검증한다. 클라이언트 키 문자열만으로 다른 편집본을 조회하지 않는다
      ReadContext: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      ManagementChange: commandKey/targetId 또는 신규 업무키/baseRevision/saveTarget/reason/areaValues. saveTarget에 해당하는 영역의 변경값만 반영하고 현재 확정된 나머지 영역과 전체 참조 검증·HIST 복사를 수행한다. 다른 탭의 미저장값을 보내거나 반영하지 않는다. 신규는 MASTER를 먼저 저장한다.
      ManagementResult: commandKey/status/targets[{targetKind,targetId,baseRevision,appliedRevision,historyNo}]. APPLIED만 실제 결과 리비전/HISTORY_NO를 가진다. 실패/결과 불명은 원 명령키로 확인하며 같은 명령 재전송은 원 결과만 반환한다.
    exception_map:
      UC-007.E1: 400 식별 불명/403 현재 권한 부족/503 필수 원천·참조 조회 불가
      UC-007.E2: 초안 저장은 누락/사용 불가를 명시하며 운영 사용/제출 요건을 충족한 것으로 표시하지 않는다
      UC-007.E3: 409 기준/참조 충돌이며 세트 검증 실패로 인계한다
      UC-014.E1: 미확인 근거를 보존하며 영향 없음으로 종결하지 않는다
      UC-014.E2: 실제 오류/조사 연결이며 자동 비활성화하지 않는다
      UC-014.E3: 중대한 영향의 조치 판단은 REQ-304.open 소유 절차로 인계한다
    errors: 400 err.admin.catalog.invalidInput·403 공통 인가·404 공통 미발견·409 err.admin.catalog.versionConflict/referenceConflict/identityConflict/commandConflict·503 err.admin.catalog.dependencyUnavailable. 변경 실패는 전체 롤백한다. 실제 MSG 키/시드·문구는 화면/구현 단계에서 연결한다
    verification_cases:
      - 동명 객체의 DB/스키마/서버/데이터소스가 다르면 별개, 정확 물리 실체가 같으면 그룹이나 TABLE/VIEW 구분으로 중복 등록 불가
      - 같은 객체의 profile v1 등록 뒤 v2가 관측되면 키가 달라져도 신규 등록을 거부하며 기존 전체 대조/이행 전 반영을 허용하지 않는다
      - 동일 이름의 삭제/재생성을 이름 변경으로 자동 승인하지 않으며 동일 객체 이름 변경 뒤 과거 판은 옛 이름을 유지한다
      - 다른 카탈로그의 컬럼 ID·같은 컬럼의 다른 판·관계 소유 이전·자기조인의 한쪽 옛 판은 거부한다
      - 자기조인 복사는 자기 참조만 새 자기 판으로 바꾸고 외부 객체/정확 내용 참조를 보존한다. 데이터소스 가이드는 요청 시점에 현재 허용 문맥으로 읽으며 카탈로그에 복제하지 않는다.
      - 카탈로그의 일반 PRIMARY/UNIQUE 키 검증은 유지하며 별도 조회 제약 대체 키는 관리하지 않는다. 정책 역조회는 REQ-611의 필수 조건 OR 항목을 현재 원천에서 읽는다
      - 세트 상호 참조는 모두 고정한 후보로 검증하며 외부 판/새 후보의 불일치를 자동 치환하지 않는다
      - 검증 직후 외부 유효본 전환·데이터소스 삭제와 경합하면 잠금/재검증으로 안전하게 한 순서만 반영한다
      - 단순 소유자/시각 표시가 아닌 실제 검수 근거가 필요하며 의미/코드 변경 후 이전 검수 완료가 그대로 남으면 실패다
      - 현재 변경 권한 없음·낡은 기준 리비전·필수 참조/기술 계약 오류는 전체 직접 저장을 거부하고 현재값/이력을 유지한다.
      - 전체 이력 일부 실패는 같은 저장 단위의 현재값/리비전도 롤백한다. 동일 명령 재전송은 원 결과만 반환한다.
      - 사용처 조회가 연결 지식 본문 수집/업무 의미 영향 판단/보완 작업 생성으로 확대되면 실패다.
    storage_contract: REQ-601.management_storage 및 40-domain/013-admin-management-history.yaml. 관리 화면은 현재 적용본, 별도 상속 이력은 당시 HIST 전체 세트를 읽는다. 관리자 요청 원장/SNP는 만들지 않는다.
    read_context: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
    save_rule: REQ-301.save_reason. saveTarget을 그대로 기록하고 해당 영역 변경만 저장한다. 전체 구성은 검증·이력 복사의 단위이며 모든 로컬 탭의 변경을 한 번에 반영한다는 뜻이 아니다.
    physical_contract:
      screens:
        SCR-003:
          root: ENT-005
          current_and_owned:
            - ENT-005
            - ENT-006
            - ENT-007
            - ENT-008
            - ENT-021
            - ENT-022
            - ENT-025
            - ENT-151
            - ENT-152
          history_root: ENT-051
          fields: 각 ENT.attributes의 physical_name과 physical.attributes가 저장 타입/NULL의 정본이다. 기존 소유 API의 논리 DTO와 아래 alias를 대조한다. 원천 관측·역조회는 편집 원문에 포함하지 않는다.
          aliases:
            revision: REVISION 또는 MANAGEMENT_VERSION
            targetId: PRIMARY KEY (CATALOG_ID)
            connectionId: 배포 문자열 CONNECTION_ID
            connectionRecordId: ENT-017.CONNECTION_RECORD_ID; API 저장 시 정확 소속·현재 세대와 함께 필수 대조
          save_guard: FEAT-040의 전역 원명령/잠금/원자 전체HIST, 기존 소유 API의 입력영역별 완전성/클라이언트행ID 치환/참조 규칙을 함께 적용한다. 설정 정리만 ENT-169/170 미리보기→재검증→ENT-168 전체 결과를 사용한다.
          read_projection: 연결/구조/빈 관측은 설정 세대·조회시각·미확인을 반환한다. exactRevision은 현재 스냅샷의 다른 판으로 대체하지 않는다.
  FEAT-011:
    implementation_transport:
      status: CR-057 사용자 권장안 승인. 같은 활성 자료형 코드와 검수된 기본키/유일키 전체 컬럼 대조로 구현한다.
      command: API-024의 ManagedCommand를 재사용한다. targetId는 소유 catalogId, expectedRevision은 소유 현재 판, scope=RELATIONSHIPS, values={relations:[RelationDraft]}, reason은 이번 저장 사유다. 별도 관계 revision/명령 원장을 만들지 않는다.
      relation: RelationDraft는 relationId 또는 clientKey 중 하나, relationName/leftCatalogId/leftRevision/rightCatalogId/rightRevision/leftRole/rightRole/cardinality/description/reviewStatus/pairs를 가진다. 신규는 clientKey만 받고 첫 왼쪽 catalogId가 targetId와 같아야 한다. 기존 relationId의 소유는 바뀌지 않는다. 데이터소스/객체명/등록자/수정자/검수 주체·시각은 서버 조회/생성 필드이며 저장 입력에서 거부한다.
      pairs: pairs의 각 항목은 position/leftColumnId/rightColumnId다. 양의 고유 정수 position으로 전체 쌍을 정렬하고 동일 컬럼 쌍 중복·반쪽 쌍·다른 카탈로그의 컬럼을 거부한다. 자기조인의 좌우 역할과 컬럼 식별자는 별개로 유지한다. 타입 호환과 1측 유일성은 아래 accepted_validation을 따른다.
      completeness: 전체 소유 카탈로그의 현재 관계 목록을 확보한 편집본으로 저장한다. relations 누락과 명시 빈 목록은 다르다. 기존 관계의 명시 제거는 현재 소유 전체 목록에서 제외해 표현하고 다른 소유/조회하지 않은 관계를 자동 제거하지 않는다. 다른 영역의 편집값은 포함하지 않는다.
      identities: 신규 관계는 기존 AI_ADMIN_CATALOG_MEMBER의 RELATION 종류와 원 명령 clientKey→memberId 매핑으로 번호를 발급한다. 원 명령 재수신은 같은 번호/결과를 반환한다. 기존 번호/소유의 재귀속과 clientKey·relationId 동시 지정은 거부한다.
      revisions: 외부 끝점의 exact revision은 서버가 명시 HIST에서 해석하고 최신 판으로 대체하지 않는다. 같은 소유 구성의 끝점/컬럼은 저장할 전체 구성으로 검증해 새 적용 판에 연결한다. 다른 카탈로그는 변경 세트에 자동 포함하지 않는다. 현재 권한/기술 참조와 과거 구성 조회를 구별한다.
      authority: 메뉴 진입은 SCR-039의 HUB_CATALOG_RELATION 선언을 따르며 API-024 및 참조 읽기는 승인된 FEAT-003.delivery_boundary.management_authority의 HUB_CATALOG READ·SAVE를 재사용한다. 별도 관계 저장 권한을 새로 만들지 않는다.
      preservation: 관계 이름 및 관계/컬럼쌍 감사4는 현재 물리 구조의 누락이므로 새 migration·동형 HIST·물리 계약을 함께 보완한다. 미조회 근거는 보존하고 기술 입력 변경은 기존 검수를 무효화한다. 기존 적재 changeset은 수정하지 않는다.
      accepted_validation:
        type_compatibility: 2026-11-14 사용자 승인. 같은 데이터소스의 양끝점 컬럼이 같은 활성 DBMS_DATA_TYPE 코드를 사용하고 현재 DBMS의 PARENT·NATIVE_TYPE과 원천 자료형이 일치해야 한다. 미등록/비활성/불명/이종 타입 쌍은 거부한다.
        uniqueness: 2026-11-14 사용자 승인. N:1은 오른쪽, 1:N은 왼쪽, 1:1은 양쪽의 검수된 PRIMARY 또는 UNIQUE_KEY 전체 컬럼 집합과 쌍의 해당 측 컬럼 집합이 일치해야 VERIFIED다. 관리자 설명만으로 유일성을 인정하지 않는다. 불충분한 근거는 UNKNOWN으로 저장하고 기존 근거/설명은 보존한다.
      reads: API-604는 SearchRequest<CatalogRelationFilter>의 관계 목록이며 dataSourceId/keyword/catalogId 조건과 공통 offset 페이지를 사용한다. API-020의 values.relations는 같은 소유 전체 목록, API-027은 한 카탈로그의 양쪽 관리 역조회({state,rows})다. 양쪽 현재 후보는 API-019/020에서 선택한다. 연결 지식 생산자가 미설치인 상태는 NOT_CONNECTED로 구별한다.
      bound_columns: API-604와 API-020의 관계 행은 읽기 전용 leftColumns/rightColumns를 함께 반환한다. 외부 끝점은 저장된 정확 HIST의 columnId/columnName/columnBusinessName/ordinalPosition/sourceTypeCode/sourceType와 원 컬럼 감사4개, 소유 끝점은 현재 판이며 저장 입력에서는 제외한다.
    review_evidence: 신규 수동 관계의 origin은 논리 작성으로 기록하고 description의 업무 용도·유일성/누락·중복/집계 설명을 논리 검수 근거로 연결한다. VERIFIED 의사는 서버가 현재 정확 참조/전체 쌍·기술 조건·설명 완전성을 검사한 경우만 확정하며 검수자/시각은 서버 신원으로 기록한다. 물리 FK 사실과 관리자 설명은 구분한다. 근거 부족은 UNKNOWN이고 미조회 기존 근거/과거 HIST는 삭제하지 않는다.
    workspace: REQ-301.relationship_metadata.workspace·ownership·related_knowledge. 같은 데이터소스의 양끝점 후보/등록 컬럼 조회, 양 선택의 동시 로컬 적용·초기화 확인·신규 왼쪽 소유/기존 소유 고정·전체 쌍/양의 고유 순서와 활성 합집합 역조회를 유지한다. API-024 RELATIONSHIPS 저장과 전체 HIST를 재사용한다.
    design_status: draft
    implementation: planned
    response_rule: 양쪽 카탈로그의 관리용 getRelatedJoins(API-027)는 FEAT-003.types.CatalogRelationReferenceRow로 같은 소유 관계와 양쪽 역할을 반환한다. 편집은 별도 SCR-039에서 관리 카탈로그의 초안으로 연결하고 현재 권한을 검사한다. 이 관리용 역조회는 LLM/예제 작성의 범위 제한 공통 조회를 대신하지 않는다
    relation_read_contract:
      join_constraint_consumer: FEAT-204의 REQ-611.query_constraints.join_rule 검증도 이 정확 카탈로그/판·허용 컬럼 범위를 사용한다. JOIN 항목의 모든 선택 컬럼과 사용하는 관계 전체 쌍을 검사하며 관리 역조회로 후보/권한을 확대하지 않는다.
      design_status: 입력/필터/소비 경계 합의. 구체 DTO·모듈 공개 방식·엔드포인트는 후속 P3에서 확정
      consumers:
        - FEAT-202
        - FEAT-023
      input: 이번 호출에서 실제 조회/선택한 카탈로그의 정확 catalogId/revisionId 집합과 최종 허용 컬럼 범위, 현재 인증 주체·소비 목적을 받는다. 지식 합산 전체 후보나 카탈로그 하나의 모든 인접 관계를 요청 범위로 바꾸지 않는다. 관리 후보/같은 세트 참고는 FEAT-014.reference_validation의 명시 후보 판을 함께 식별한다
      scope: 관계의 LEFT와 RIGHT 각각의 catalogId/revisionId가 모두 입력 집합에 정확히 속해야 한다. ID만 같고 판이 다르거나 동명 다른 객체이면 제외하며 현재/최신판으로 치환하지 않는다. 자기조인은 한 집합 원소로 양쪽 포함을 만족해도 LEFT/RIGHT 두 역할·방향을 유지한다. 범위 밖 중간 테이블을 경로 완성 목적으로 자동 추가하거나 입력 집합/권한을 확대하지 않는다
      validation: 현재 양쪽 공개 객체·정확 판·전체 컬럼쌍의 존재/참조·객체/컬럼 접근 권한·검수와 사용 가능 상태를 대조한다. 프루닝한 최종 컬럼 범위에서 필수 쌍 컬럼 하나라도 빠지면 관계 전체를 제외하고 일부 쌍만 완전한 관계로 반환하지 않는다. LLM 실행 컨텍스트는 실제 반영·운영 사용 가능한 관계만 받는다. 예제 작성의 같은 세트 후보 참고는 검수 근거/후보 상태를 명시하며 운영 가능으로 표시하지 않는다
      output: 동일 정본의 관계 안정 ID·관리 카탈로그/소유 리비전·양쪽 정확 catalogId/revisionId·두 역할/방향·전체 순서 컬럼쌍·대응 수/1측 유일성·기존 description의 양방향 매칭 누락 가능성/업무 근거·물리/논리 근거·검수/사용 가능 상태를 반환한다. 관계는 안정 ID와 소유 판으로 중복 제거하되 역할이나 복합 쌍을 합치거나 삭제하지 않는다. 카탈로그 메타데이터 목록에 모든 관계 본문을 내장하지 않고 이 필터 결과만 별도 조립한다. 관리용 전체 CatalogComposition은 그대로 보존하며 모델에 복사하지 않는다
      prompt_handoff: REQ-301.relationship_metadata.consumption_scope·prompt_guide에 따라 지식 검색/카탈로그 최종 선별 뒤 필터 결과를 테이블 관계 가이드로 제공한다. 상한/프루닝으로 최종 객체·컬럼 집합이 바뀌면 재필터한다. matching_semantics에 따라 기존 설명을 전달하고 질문별 조인 방향/포함 범위를 판단하며 고정 JOIN 유형 필드는 추가하지 않는다. 턴 근거에 실제 제공한 관계/소유 판·정확 양끝점/설명을 연결한다. 공개 DTO·페이지/완전성·실제 프롬프트 직렬화는 pending의 소유 상세 설계에서 확정한다
      failure: 조회 실패·권한 제한·불완전 응답과 필터 결과 0건을 구분한다. 완전성을 확인하지 못한 결과를 완전한 관계 집합으로 제시하지 않고 필요한 관계에 의존한 생성/인증을 확정하지 않는다. 미확인 관계 추측·동명/다른 판 대체·권한 확대는 금지하며 관계가 필요 없는 독립 조회까지 일괄 차단하지 않는다
      pending: '@defer P3 integration_assets·agent·knowledge — 공개 조회/DTO·페이지/상한과 완전성·컬럼 프루닝/재조회 순서·후보 상태 표현·현재 권한 회수 동시성·호출별 근거 추적을 설계하고 LLM과 인증 예제 작성의 같은 필터 반례를 검증한다'
    exception_map:
      UC-008.E1: 초안의 누락/검수 필요를 보존하고 권장 관계 사용 제외
      UC-008.E2: 403 현재 권한 또는 409 참조 충돌. 상대 객체 권한 부여/최신판 자동 치환 금지
    storage_contract: REQ-601.management_storage 및 40-domain/013-admin-management-history.yaml. 관리 화면은 현재 적용본, 별도 상속 이력은 당시 HIST 전체 세트를 읽는다. 관리자 요청 원장/SNP는 만들지 않는다.
    read_context: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
    save_rule: 관계 편집은 같은 카탈로그 마스터의 기대 버전을 사용하고 saveTarget=RELATIONSHIPS 및 관계/전체 쌍 영역의 변경만 API-024로 저장한다. 서버는 다른 현재 구성과 참조 무결성을 검증하고 카탈로그 전체 HIST를 복사한다. 독립 관계 리비전이나 다른 화면의 미저장 입력 반영은 없다.
    physical_contract:
      screens:
        SCR-039:
          root: ENT-005
          current_and_owned:
            - ENT-005
            - ENT-006
            - ENT-007
            - ENT-008
            - ENT-021
            - ENT-022
            - ENT-025
            - ENT-151
            - ENT-152
          history_root: ENT-051
          fields: 각 ENT.attributes의 physical_name과 physical.attributes가 저장 타입/NULL의 정본이다. 기존 소유 API의 논리 DTO와 아래 alias를 대조한다. 원천 관측·역조회는 편집 원문에 포함하지 않는다.
          aliases:
            revision: REVISION 또는 MANAGEMENT_VERSION
            targetId: PRIMARY KEY (CATALOG_ID)
            connectionId: 배포 문자열 CONNECTION_ID
            connectionRecordId: ENT-017.CONNECTION_RECORD_ID; API 저장 시 정확 소속·현재 세대와 함께 필수 대조
          save_guard: FEAT-040의 전역 원명령/잠금/원자 전체HIST, 기존 소유 API의 입력영역별 완전성/클라이언트행ID 치환/참조 규칙을 함께 적용한다. 설정 정리만 ENT-169/170 미리보기→재검증→ENT-168 전체 결과를 사용한다.
          read_projection: 연결/구조/빈 관측은 설정 세대·조회시각·미확인을 반환한다. exactRevision은 현재 스냅샷의 다른 판으로 대체하지 않는다.
