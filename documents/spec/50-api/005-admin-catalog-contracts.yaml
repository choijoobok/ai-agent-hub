    verification_cases: ["동명 객체의 DB/스키마/서버/데이터소스가 다르면 별개, 정확 물리 실체가 같으면 그룹이나 TABLE/VIEW 구분으로 중복 등록 불가", "같은 객체의 profile v1 등록 뒤 v2가 관측되면 키가 달라져도 신규 등록을 거부하며 기존 전체 대조/이행 전 반영을 허용하지 않는다", "동일 이름의 삭제/재생성을 이름 변경으로 자동 승인하지 않으며 동일 객체 이름 변경 뒤 과거 판은 옛 이름을 유지한다", "다른 카탈로그의 컬럼 ID·같은 컬럼의 다른 판·관계 소유 이전·자기조인의 한쪽 옛 판은 거부한다", "자기조인 복사는 자기 참조만 새 자기 판으로 바꾸고 외부 객체/정확 내용 참조를 보존한다. 데이터소스 가이드는 요청 시점에 현재 허용 문맥으로 읽으며 카탈로그에 복제하지 않는다.", "복합 키 일부·여러 대체 키 컬럼의 합집합·한 요청에서 여러 키값·NULL 조건은 기간 대체가 아니다", "세트 상호 참조는 모두 고정한 후보로 검증하며 외부 판/새 후보의 불일치를 자동 치환하지 않는다", "검증 직후 외부 유효본 전환·데이터소스 삭제와 경합하면 잠금/재검증으로 안전하게 한 순서만 반영한다", "단순 소유자/시각 표시가 아닌 실제 검수 근거가 필요하며 의미/코드 변경 후 이전 검수 완료가 그대로 남으면 실패다", "현재 변경 권한 없음·낡은 기준 리비전·필수 참조/기술 계약 오류는 전체 직접 저장을 거부하고 현재값/이력을 유지한다.", "전체 이력 일부 실패는 같은 저장 단위의 현재값/리비전도 롤백한다. 동일 명령 재전송은 원 결과만 반환한다.", "사용처 조회가 연결 지식 본문 수집/업무 의미 영향 판단/보완 작업 생성으로 확대되면 실패다."]
