feature_contracts:
  FEAT-040:
    design_status: draft
    implementation: planned
    reqs:
      - REQ-601
    usecases:
      - UC-001
      - UC-002
      - UC-003
      - UC-006
    scope: delivery_strategy.staged_delivery.admin_first의 19화면에 적용하는 상세 계약이다. 현재 소스 구현/물리 스키마 완성/G3 승인을 뜻하지 않는다. 원 화면의 입력 항목·저장 버튼 범위를 바꾸지 않는다.
    rules_from:
      - REQ-601.direct_management
      - REQ-601.management_storage
      - REQ-601.change_history
      - REQ-601.surrogate_identifier
    types:
      ManagedCommand: commandKey:UUID, expectedRevision:기존 양의 십진 문자열/신규 null, targetId:기존 ID/신규 null, scope:소유 API가 허용한 저장 영역, values:영역별 완전한 편집 구성, reason:필수. actor/domain/action은 인증·경로에서 서버가 정한다. 임의 대상 종류/권한/이력 번호/서버 감사값 입력은 거부한다.
      ManagedResult: commandKey, targetId, revision, historyNo, appliedAt:UTC Instant, action, outcome:APPLIED/NO_CHANGE. NO_CHANGE는 새 이력 번호/반영 시각을 만들지 않고 원 현재 판과 판정 결과만 반환한다. 단일 그리드의 여러 독립 행은 행별 결과이며 명시 복합 저장은 전체 하나의 결과다. 숫자 식별자/리비전은 JSON 정수 문자열이다.
      ExactAssetRef: kind + stableId + appliedRevision. historyNo는 소유 조회로 해석하며 deleted 사건과 구분한다. 표시명·현재 리비전으로 대체하지 않는다.
      HistoryUse: consumerDomain + consumerKind + consumerStableId + ExactAssetRef + purpose. consumerStableId는 소유 모듈의 불투명 안정 참조이며 이 계약이 턴/스텝 테이블을 정하지 않는다.
      ContractFailure: code + retryable + safeMessageKey + requestTraceId + 원 commandKey/확인 경로. 참조/권한 상세는 현재 열람 범위로 제한한다.
    command_identity:
      base: FEAT-001.shared_write_contract.identity/input_digest/preflight/result의 지문·주체·동일 키 의미를 공통으로 재사용한다. 기존 ENT-019/028/036은 각 소유 결과 저장 어댑터이며 같은 명령을 ENT-099에 이중 저장하지 않는다. 나머지 관리 저장은 ENT-099를 사용한다.
      uniqueness: 명령 UUID는 전체 관리 저장 어댑터에서 전역 유일하다. 해시별 공통 기술 잠금 아래 ENT-113 종결표와 ENT-019/028/036/099 및 외부 수신 ENT-257 활성 원장 전부의 소유/입력 지문을 조회한다. 다른 기능/주체/입력의 재사용은409이며 성공효과를 만들지 않는다. 같은 원장에 이중 기록하지 않는다. 원장 일부 조회 실패는503이며 미발견이 아니다.
      late_replay: ADR-044·REQ-601.command_retention. 전체 성공 원장 보존 중은 원 결과 재생, 파기 후 최소 키 해시 종결 기록이 있으면 COMMAND_EXPIRED로 거부한다. 키 보호 조회 실패는 미발견이 아니며 새 적용을 차단한다.
    transaction:
      isolation: 공유 PostgreSQL의 READ COMMITTED와 아래 업무 잠금 프로토콜을 사용한다. 외부 네트워크 호출은 DB 잠금 전에 끝내고 검증 근거의 유효성/소유/버전을 잠금 안에서 다시 대조한다. 잠금 안에서 LLM·JDBC·SSO 응답을 기다리지 않는다.
      sequence:
        - 서버 인증영역·현재 메뉴 액션·입력 형식과 소유 저장 영역을 확인한다. 미조회 목록/원천 실패를 빈 전체 집합으로 받지 않는다.
        - 업무 잠금을 정해진 순서로 획득하고 원 명령 결과를 다시 조회한다. 성공이 있으면 현재 권한을 재검사한 뒤 원 결과만 반환한다.
        - 현재 변경 권한을 authoritative 소유 조회로 확인하고 부모의 기대 리비전·신규 부재·유일 업무 키·전체 참조를 검증한다. 요청 시작 때의 세션 스냅샷만으로 저장을 허용하지 않는다.
        - 허용된 영역의 편집본을 잠근 현재 구성에 적용한다. 다른 탭의 현재값은 유지하고 소유 전체 세트를 검증한다. 임의 외부 자산은 쓰지 않는다.
        - 소유 기능이 무변경 저장을 NO_CHANGE로 정의한 경우(FEAT-003.save_reason 등)는 현재 권한/기준본 검증 뒤 새 리비전/HIST 없이 종결 결과만 기록한다. 단순 재수신과 새 명령의 무변경 판정을 구분하고 다른 화면의 원 저장 의미를 일괄 바꾸지 않는다.
        - 현재값·소유 자식·부모 리비전 1회 증가·동형 전체 HIST·성공 명령 결과를 같은 트랜잭션에 기록한다. 신규/수정은 반영 후 전체, 삭제는 직전 구성과 DELETE 사건이다.
        - 커밋 성공 뒤 결과를 공개한다. 유일 키 경합·롤백된 트랜잭션 안에서는 결과 조회를 계속하지 않고 새 읽기에서 원 키를 확인한다.
      units: 단일 그리드는 기존 행별 부분 성공을 유지한다. 마스터/탭·시작월 등급 전체 세트·최초 월 기준과 단가 고정은 각 전체 단위다. 하나의 저장 단위에서 HIST/자식 하나라도 실패하면 그 단위 전부 롤백한다.
      current_source: RowTx.oneTxForAll은 원자 단위 안의 행 오류 수집, oneTxPerRow는 독립 행 저장에만 재사용한다. CustomLock은 바깥 트랜잭션이 없는 진입 빈에서 전체 집합 잠금을 잡을 때만 사용하며 이미 시작한 트랜잭션 안에 중첩하지 않는다.
    locks:
      order: 명령 키 해시 잠금 → 관리자 권한 보호 경계 → 쿼터 달력 경계(관련 작업만) → 쿼터 월 오름차순 → Portal 계정/그룹 경계 → 참조 부모 종류의 고정 순서·숫자 ID 오름차순 → 변경 부모/자식. 같은 종류는 표시명/문자열 숫자 정렬을 쓰지 않는다. 구현 전 모든 쓰기 진입점의 참여를 시험한다.
      absent_rows: 신규/부재 행은 SELECT FOR UPDATE만으로 보호하지 못한다. 업무 키별 기술 잠금 또는 유일 제약을 함께 사용한다. 참조 대상 삭제와 자식/매핑 생성은 같은 참조 부모 잠금에 참여한다. 조회한 외부 대상 전체를 변경 대상으로 선점하지 않는다.
      access: Portal 이용 조건/그룹/신원/자산 허용 매핑을 변경하는 모든 경로는 동일 접근 정책 보호 경계에서 현재 참조를 검증한다. 초기 단일 배포는 공유 정책 잠금으로 정확성을 확보하며 성능 개선은 같은 경합 시험을 통과한 뒤 세분한다. SYS_DATA_LOCK 기술 기반을 재사용하되 현재 제품에 이미 구현됐다고 표시하지 않는다.
      admin_authority: FEAT-301.admin_authority_guard가 현재 계정/권한 원천 검사와 트랜잭션 공유/배타 보호를 소유한다. ADMIN_AUTHORITY_V1은 만료형 SYS_DATA_LOCK으로 대체하지 않는다. 저장/회수 순서는 해당 계약을 따르며 system 소유 변경은 별도 G3 대상이다.
    history:
      shape: REQ-601.change_history의 원본명_HIST·HIST_ID·HISTORY_NO·마스터 HIST_DTM·원 REG/MOD 유지 규약을 따른다. 리비전은 현재 부모에만 있고 자식 자체 리비전을 만들지 않는다. 이력 UI 완성은 생산 조건이 아니다.
      scope: 소유 관리값과 매핑만 복사한다. 비밀번호 해시/비밀·실시간 연결 관측·역조회 사용처·실행 로그를 복사하지 않는다. Portal 비밀번호 초기화는 비밀을 제외한 수행 사건만 남긴다. 쿼터 계산/배정 결과는 별도 불변 업무 기록이며 관리 HIST로 대신하지 않는다.
      resolution: 원 안정 ID+성공 적용 리비전에 성공 HISTORY_NO가 하나만 대응한다. 삭제 사건은 이전 성공 매핑을 덮지 않는다. 지원 스키마 버전으로 전체 세트를 읽고 소유 자식 일부 유실/파기/미지원이면 HISTORY_UNAVAILABLE로 실패한다. 삭제의 RESULT_REVISION은 마지막 판+1이며 원값 REVISION/MANAGEMENT_VERSION은 직전 구성대로 복사한다. 적용판 조회는 HIST_ACTION=DELETE를 제외한다.
      protection: ENT-100에 실행/보존 소비자의 정확 자산 참조와 전이 참조를 등록한다. 등록과 파기는 같은 이력 세트 잠금을 사용한다. 실행 시작의 보호 등록은 현재 권한/유효성 확인과 함께 수행하며 실패하면 해당 실행을 시작하지 않는다.
      purge: 현재 적용본·실행 중·장기 대기·다른 보존 기록의 직접/전이 참조가 남은 세트는 파기하지 않는다. consumer의 적법한 보존 종료와 원 기록 파기 확정 후에만 보호를 해제한다. 시간 초과나 마지막 접근 시각만으로 보호를 해제하지 않는다. admin 소비자 고장 시 보존하고 실패를 알린다.
      purge_race: 파기가 먼저면 새 보호 등록/과거 실행 재현을 거부하고 현재값으로 대체하지 않는다. 보호 등록이 먼저면 파기가 건너뛴다. 세트 전체를 한 트랜잭션으로 삭제하며 일반 관리/조회 권한으로 이력을 수정하지 못한다. 실제 보존 기간은 ADR-044와 고객사 정책을 따른다.
    screen_matrix:
      - screen: SCR-015
        feature: FEAT-015
        unit: 모델 조합·가격 시작일 세트의 소유 저장 범위
        history: 공급 경로/모델/effort·가격/계량 근거
        consumer: integration 모델 어댑터·단가 산정
        guard: 비밀 제외·이미 고정된 가격 사본 불변
      - screen: SCR-062
        feature: FEAT-015
        unit: 모든 용도 매핑과 기본 지정 전체 세트
        history: ENT-128/129 전체 구성
        consumer: agent 스텝·integration 라우팅
        guard: 중복 순위/미지원 조합 검증·운영용 분리
      - screen: SCR-016
        feature: FEAT-016
        unit: 선택 월 단가 전체 구성
        history: 요약·산정 행·가격/실적 스냅샷
        consumer: FEAT-017
