    errors:
      VALIDATION_ERROR: 400 형식/허용 영역/필수 구성 오류
      AUTHORIZATION_DENIED: 403 현재 변경 권한 없음
      REVISION_CONFLICT: 409 기준본 변경; 편집값 보존 후 재조회
      REFERENCE_CONFLICT: 409 참조 삭제/중지 경합; 안전한 사용처만 반환
      COMMAND_CONFLICT: 409 같은 키 다른 입력
      DEPENDENCY_UNAVAILABLE: 503 현재 권한/원천 검증 불가; 빈 성공 금지
      HISTORY_UNAVAILABLE: 과거 세트 누락/파기/미지원; 현재값 대체 금지
      COMMAND_EXPIRED: 409 보존 종료된 원 명령 키. 입력/원 결과를 복원하지 않고 새 변경으로 자동 전환하지 않는다.
    remaining: 이 물리 초안은 40-domain의 현재/자식/HIST와 각 feature_contracts.physical_contract에 연결했다. AUTHZ-090/ARCH-050 영향 G2·소유 G3, 구현 MSG/시드와 실제 DB 동시성 시험은 후속이다. 게이트 승인을 대신하지 않는다.
    physical_transport:
      authentication: ADMIN 인증 주체만 수락한다. 요청 actorId/권한/tenant 같은 자기 주장으로 소유권을 결정하지 않는다. 소유 메뉴 READ/SAVE 및 서버 범위 검사. 내부 소비 계약은 외부 임의 HTTP 라우트로 노출하지 않는다.
      query_page: page:1부터, size:기본50/최대200, filters:해당 화면 명시 조회필드만, sort:해당 DTO의 정적 허용 열 최대3개. 미지원 필드/연산/정렬400. 문자열 부분검색은 %, _를 이스케이프한다. 같은 값은 안정PK로 정렬해 순서를 확정한다. total은 같은 권한 범위의 조회 시점 값이며 별도 조회 중 변경될 수 있다.
      detail: targetId(고정 구분은 targetKey)로 부모/소유 자식을 한 읽기 스냅샷에서 반환한다. references/현재 연결/현재 권한/임베딩 상태는 별도 관측시각·상태와 함께 반환하며 저장 편집본에서 제외한다.
      payload: 본문 상한2MiB, 한 소유 자식 목록최대10000행. 초과는413이며 절대 잘라 저장하지 않는다. 길이는 Unicode 코드포인트로 검증하고 DB/UTF-8 바이트 상한도 선검증한다. 기술 상한은 부하시험에서 조정하되 대량 전체 저장을 페이지별 부분 저장으로 바꾸지 않는다.
      validation: 화면이 필수로 정의한 문자열은 비공백; DB NOT NULL인 선택 설명은 빈 문자열 허용, 미확인/미지정은 nullable 계약의 null과 구분, id는양의십진문자열, 날짜/월 실재값, enum은정적 허용목록. 미지원 필드400, 업무 입력422, 무인증401/무권한403, 범위 안 미존재404, 판/참조/키 충돌409, 원천 확인실패503. 타 주체 명령 조회는 UNKNOWN으로 통일해 존재를 유출하지 않는다.
      save: 서버 산출/읽기 전용/외부 원천 필드는 DTO에서 write 금지. 서버가 현재값에서 유지하거나 검증 근거에서 다시 산출한다. 누락 자식 배열은 비어있음이 아니며 완전한 영역임을 명시해야 한다. scope는 각 저장 API의 허용 세트만 수락한다.
      authorization_race: 권한/소속/자산 활성 회수와 저장·실행 진입을 같은 보호 경계에서 직렬화한다. read model 캐시만으로 명령을 승인하지 않는다.
      idempotency: 원 명령 키 전역유일/command_identity에 등록한 전체 활성 원장과 종료키 검사는 command_identity. 새 명령과 입력이 같아도 화면의 NO_CHANGE 규칙을 따르며 실패를 성공 원장에 남기지 않는다.
      projections: SCR-006 그룹 사용 상태·자산/소속 역조회, SCR-011 합산 카탈로그, 가격 종료일·운영상태는 현재 원장들에서 계산하며 별도 편집 필드/테이블로 복제하지 않는다.
    internal_ports:
      readExactAsset: ExactAssetRef(kind,stableId,appliedRevision) → 불변 전체 세트 + historyNo + schemaVersion; 없거나 일부누락/파기면 HISTORY_UNAVAILABLE. 내부 호출자도 용도별 현재 열람/사용 권한을 검사한다.
      protectHistoryUse: HistoryUse + exactRef → referenceId; 실행의 안정 소비 참조를 먼저 확보하고 같은 세트 잠금으로 보호를 등록한다. 등록 실패면 실행 시작 금지. 동일키 재호출은 기존 referenceId. 해제는 소비자의 보존 종료 확인 뒤만 허용한다.
      resolveCurrentAccess: 서버 PORTAL principal + stable asset IDs + purpose → ALLOW/DENY/UNKNOWN + 이용/그룹/정책 판; UNKNOWN은503이며 DB조회실패를 빈 그룹/기본허용으로 바꾸지 않는다.
      ensureAllocation: 인증된 PortalUserId+targetMonth+원실행문맥 → 확정 allocationId/limit 또는 미배정사유. 명령 서비스이며 월/사용자 잠금·월종결표·자격발효입력·unique(month,user)·FINAL catch-up을 사용한다. 실제사용량/차감/동시실행은 agent의 소유원장이다.
      loadUsageSnapshot: agent FEAT-211이 month+cutoff+scope를 받아 sourceSnapshotKey/watermark/normalizationVersion + 용도/모델/effort/세부단위/측정근거별 비중복 수량을 반환한다. 미구현/집계불완전은UNKNOWN/UNSUPPORTED,0으로 저장금지.
      embeddingWork: integration은 ENT-165 작업을 admin claimWork(owner,lease)→세대/입력반환→completeWork(jobId,generation,resultRef)로 처리한다. 만료 재점유는 세대 증가, 이전 세대 결과 차단. 모델 비밀/벡터 본문을 관리 API에 노출하지 않는다.
      implementation_catalog: integration의 모델/연결/도구 구현 조회는 node/boot/appliedSettingsId·지원 계약버전·완전성으로 범위를 증명한다. 확인불가면 저장/정리 검증 실패이며 원천 전체부재로 해석하지 않는다.
      auth_boundary: FEAT-301/ARCH-050 영향 G2·G3에서 ADMIN/PORTAL principal 수락/세션 무효화/권한회수 직렬화와 안정 사용자 ID를 검증한다. internal port 명세가 인증 구현을 승인하지 않는다.
