feature_contracts:
  FEAT-301:
    session_store_v2:
      version: admin-auth-boundary/v2
      change: CR-036
      design_status: integration 소유 영향 G3에서 동결한 v2 저장/발급 공통 계약이다. 첫 실제 사용 전 최대60초 예약도 사용자 수용 범위다. 승인 상태/일자는 project.state.yaml의 integration.P3_design.change_recheck를 따른다. CR-038의 실제 API 경로는 api_path_transition의 별도 영향 G3 대상이며 이 저장 프로토콜을 재설계하지 않는다. system 소비 영향 G3도 승인돼 SLICE-308의 구현/마이그레이션/Redis 실증을 진행한다. v1 구현·SLICE-307 G4는 과거 검증 사실로 보존한다.
      scope: CON-010의 설정 교체와 CR-035 관리 참조를 제공한다. LDAP·새 외부 인증 프로토콜·관리 화면·턴 저장소를 추가하지 않는다. Portal 실제 계정/LOCAL·SSO는 SLICE-301/306 소유다.
      selection:
        setting: app.auth.session.provider=jdbc|redis, 기본 jdbc. app.auth.session.epoch는 운영 전환에서 발급한 UUID, app.auth.session.store-instance은 선택 DB/Redis 설치의 고정 식별자다. 프로세스 시작마다 바꾸지 않는다. Redis 연결은 기존 spring.data.redis 설정/비밀 관리 계약을 재사용한다.
        assembly: 같은 artifact에 두 provider를 포함하고 서버 설정으로 한 구현을 선택한다. SessionStoreAdapter·SessionInspectionPort·SessionAdmissionLedger·RequestTransactionBoundary가 저장소 독립 공개 조립 계약이다. filter/소유 서비스는 JdbcSessionPersistence·RedisTemplate·물리 행/키를 받지 않는다. core에는 JDBC/JPA/Redis/Spring 타입이 없다.
        startup: 기본 Spring Session JDBC/Redis 자동 필터는 모두 제외한다. 정확 영역 필터1회·선택 provider1개·영역 resolver1개·ADMIN guard의 같은 DB REQUIRED 식별을 검사한다. 누락/미지원 provider·namespace 충돌·DB 설정판 불일치·Redis 미접속은 기동 실패이며 WAS/JDBC/Redis로 자동 대체하지 않는다.
        configuration: ENT-267의 영역별 ACTIVE provider/epoch/store-instance과 배포 설정이 정확히 같아야 요청을 수락한다. 최초 설치도 명시 초기화 절차로 설정판을 만들며 첫 노드가 임의 전환하지 않는다. 실행 중 다른 설정판을 발견한 기존 노드는 즉시 수락을 닫고 운영 오류를 알린다.
      neutral_types:
        SessionRef: domain·grantId·generation·providerEpoch의 서버 내부 불투명 참조. JDBC PRIMARY_ID/SESSION_ID·Redis key를 공개 필드 의미로 쓰지 않는다. 자동 JSON/로그 출력은 금지·toString은 마스킹한다. 현재 v1 타입에 의미를 몰래 덮어쓰지 않고 v2 타입/조립으로 이행한다.
        SessionSnapshot: 영역·검증 주체/인증수준·표시/언어·생성/최종접근/만료·현재 세대만 제공한다. 자격 비밀·원 SecurityContext·CSRF는 전용 holder 외에 반환하지 않는다. LOCAL Portal credentialVersion과 수락 generation은 서로 다르다.
        ManagementRef: 인증 쿠키와 독립 생성한 256bit 난수의 base64url 문자열. 현재 grant generation에 결합하며 회전 때 새 값으로 교체한다. 인증/CSRF 입력으로는 수락하지 않는다. API-517 sessionId와 API-518 UserSessionKillRequest.targets의 필드/타입은 유지하되 이 참조를 사용한다.
        ports: SessionStoreAdapter는 load/create/updateExisting/delete와 expected domain/epoch/grant/generation/revision CAS를 제공한다. SessionAdmissionLedger는 DB 현재 수락/회수·기한·세대/epoch와 관리 참조 조회를 소유한다. SessionInspectionPort는 현재 DB 유효 원장과 선택 store 확인 결과만 제공한다. raw SessionRepository/SessionRegistry를 전역 빈으로 노출하지 않는다.
        outcomes: 일반 갱신은 APPLIED·STALE_REVISION·INVALID_SESSION·UNAVAILABLE를 구분한다. CAS0 뒤 현재 원장/선택 payload를 재확인해 같은 현재 grant/generation의 revision 경합만 STALE_REVISION 폐기로 처리한다. 회수/만료/세대·쿠키 불일치는 INVALID_SESSION=401, 실제 DB/store 판정 불가는 UNAVAILABLE=503이다. 신규 발급은 DELIVERABLE·REAUTH_REQUIRED·UNAVAILABLE·INDETERMINATE를 구분한다. 암호 DB확정 뒤 새발급 실패는 API-304 기존 계약과 같은 HTTP503·code=PASSWORD_CHANGED_REAUTH_REQUIRED의 ApiResponse 실패 봉투로 API-508에도 연결한다. 논리 data=null이며 공통 ApiResponse NON_NULL 규약에 따라 JSON data 키는 생략한다. traceId/정규 메시지 키를 사용하고 쿠키0이다. DB결과 불명은 암호 확정을 단정하지 않는503이며 원명령 재실행 지시를 넣지 않는다. 회수는 REVOKED/ALREADY_ABSENT와 payload 정리 미완료를 구분하되 DB회수commit이면logout/kill은완료다.
      ledger:
        entities: [ENT-267, ENT-268]
        authority: DB는 세션 수락·회수와 기한/전환 세대의 정본이다. 선택 store는 인증/CSRF payload의 정본이다. DB 원장에 payload·비밀번호·CSRF·직렬화 SecurityContext를 중복 저장하지 않는다. store 자체의 존재/TTL은 인증 허용 근거가 아니다.
        identity: grantId는 SYS_SEQUENCE로 발급한 Long/BIGINT 대리키이며 재사용하지 않는다. TABLE allocation 때문에 ID 대소로 확정 순서를 추정하지 않는다. generation은 grant 안에서 1부터 증가하며 현재 쿠키 digest와 관리 참조를 함께 바꾼다. 쿠키는 독립 256bit 난수이고 DB에는 domain과 결합한 SHA-256 지문만 둔다. 원 쿠키/CSRF는 단일 HTTP writer만 소비한다.
        acceptance: 정확 영역 쿠키 지문의 원장/선택 store payload를 예비 비잠금 조회한다. Redis 네트워크 조회는 DB/ADMIN 잠금 밖이다. 이어 ADMIN 또는 Portal 소유 guard→설정판/grant 보호 안에서 현재 domain/provider/epoch/store-instance·ACTIVE·generation·DB UTC 기한과 예비 payload의 domain/subjectId/authLevel/grant/generation/epoch/schema를 재대조하고 현재 계정/권한을 판정한다. 어느 한쪽도 없거나 다르면 허용하지 않는다. 주체/수준은 DB 원장과 소유 원천에서 얻으며 payload만으로 권한 문맥을 만들지 않는다. authMode와 LOCAL Portal 자격세대/이용 조건은 소유 원천 포트가 최종 판정하고 표시명/언어만 payload 스냅샷으로 허용한다. Redis 과거 snapshot·구쿠키·낡은flush는 현재 원장과 불일치하면401이다. guarded callback 안에서 Redis를 재조회하지 않는다.
        locks: 초기 payload load는 비잠금 스냅샷이다. 강한 store 잠금을 먼저 잡은 채 ADMIN guard로 역진입하지 않는다. ADMIN guard→영역 설정판 공유 잠금→grant 숫자 ID 오름차순 DB 행잠금→현재 세대/기한 재조회 순서다. Portal은 기존 정책/사용자/자격 보호 뒤 같은 영역 설정판/grant 순서를 적용한다. 전환은 배출된 상태에서 설정판 배타 잠금으로만 수행한다. 잠금 전 JPA 엔티티를 수락 사실로 재사용하지 않는다.
        expiry: 기본 기존30분 sliding timeout을 유지한다. DB clock_timestamp 기준 CURRENT/ACTIVE·미만료일 때만 LAST_ACCESS_AT와 EXPIRES_AT를 단조 증가시킨다. Redis/JVM 시각이 기한을 늘릴 수 없다. DB/선택 store 중 한쪽이 만료/부재면 수락하지 않으며 일반 flush로 새로 만들지 않는다.
        retention: ACTIVE는 현재 기한까지 유지한다. REVOKED/실패 PENDING/만료는 TERMINAL_AT 또는 EXPIRES_AT 이후24시간 보존한 뒤1000행 청크로 정리한다. 원장 행이 없으면 항상 거부하므로 정리 후 과거 Redis 자료를 복원해도 부활하지 않는다. 인증 사건/로그의 기존 보존 정책과 섞지 않는다.
        concurrency_slots: 기존 영역별 동시접속 설정을 유지하며 ANONYMOUS는 접속 한도에서 제외한다. ADMIN 배타 guard 또는 Portal 정책/사용자 보호 안에서 DB 미만료 ACTIVE와 publication 기한이 남은 PENDING 예약을 함께 세어 한도를 집행한다. prevent-login은 새 수락/예약을 거부하고, 새 로그인 밀어내기는 기존 최종접근 순서로 선택한 ACTIVE/PENDING을 회수한다. 단순 grant ID 대소를 시간으로 쓰지 않는다. publication도 현재 슬롯 소유·회수/기한을 재검사한다. 발행 실패는 가능하면 별도 짧은 DB 회수로 예약을 풀며 DB 불가면60초 기한 경과 뒤 신규 수락 계산에서 제외한다. 역순 발행으로 폐기한 예약을 되살리지 않는다.
        first_use: 두 provider 모두 새 인증/제한 ACTIVE 세대는 FIRST_USED_AT=null·CONFIRM_DEADLINE_AT=최종 활성화 DB시각+60초인 전달 미확인 예약이다. ANONYMOUS는 이 규칙의 대상이 아니며 기존10분 문맥을 유지한다. 정확 보호 API에서 현재 쿠키·원장·payload·현재 계정/권한을 모두 확인한 첫 실제 요청에서만 FIRST_USED_AT를 확정하고 일반 sliding 세션으로 전환한다. 인증/회전 성공 직후 frontend 공통 흐름은 새 쿠키로 ADMIN의 GET /api/system/common/auth/getMe를 즉시 호출한다. Portal은 소유 후속 계약의 API-303 자기상태 조회에 별도로 연결한다. 제한세션에도 허용하여 암호 작성 중60초만으로 만료되지 않게 한다. response write/서버 내부 callback을 수신 증명으로 쓰지 않는다. 첫 사용 없이 확인 기한이 지나면 쿠키를 거부하고 슬롯 계산에서 제외·회수한다. ACTIVE 커밋 불명/응답 유실로 쿠키를 못 받은 사용자는 최대60초 뒤 새 검증으로 로그인할 수 있으며, 이미 첫 사용한 정상 다른 접속을 임의 회수하지 않는다. UI는 provider 분기/새 화면 없이 기존 재로그인/동시접속 결과와 기한을 소비한다.
      jdbc:
        binding: ADMIN 기존 SPRING_SESSION 표준 스키마/인덱스, PORTAL ENT-252/253 분리 테이블을 사용한다. grant/generation/epoch는 허용 서버 속성으로 연결하며 표준 부모/속성 구조를 바꾸지 않는다. 내부 물리 참조는 provider 안에서만 유지한다. 대상 사용자의 쿠키 없이 관리 조회/종료할 때는 ADMIN principal 인덱스로 후보를 읽고 서버 속성 AUTH_GRANT_ID/AUTH_GENERATION/AUTH_EPOCH와 현재 DB 원장을 대조해 정확한 물리 세션을 찾는다. 매핑 없음은 부재·복수 매핑은503이며 메모리 역매핑이나 DTO 물리키 노출을 쓰지 않는다. 물리 행 쓰기는 현재 grant 보호 뒤에만 잠근다.
        commit: 신규 로그인은 entry 회수+새 grant generation=1, 기존 인증 세션 회전은 같은 grant generation+1·새 쿠키 지문/관리 참조·ACTIVE 교체다. ADMIN 암호/이력·이전 세대 폐기·현재 ACTIVE grant와 새 payload/CSRF는 같은 DataSource/JpaTransactionManager REQUIRED의 한 물리 커밋이다. 기존 JDBC 원자성을 보존하며 실패 전부 롤백·쿠키0, 불명 결과 자동 재시도0이다.
        late_write: 기존 PRIMARY_ID+expected SESSION_ID+DB 기한 부모 행 잠금/CAS와 v2 원장 세대 검사를 함께 사용한다. 갱신0/부모 없음이면 insert/upsert하지 않으며 속성 쓰기도 같은 보호 안에서만 한다.
      redis:
        namespace: 고정 aihub:auth:v2:<ADMIN|PORTAL>:<epoch>:<grantId>:<generation> namespace를 provider가 만든다. 브라우저 입력/물리 키를 공개 계약으로 받지 않는다. 주체 인덱스도 domain+epoch로 분리하며 ADMIN 원 USER_ID와 PORTAL:<stableId> 의미를 유지한다.
        stage_one: ADMIN 배타 보호의 같은 REQUIRED에서 자격/이력을 확정한다. 신규 로그인은 entry grant를 REVOKED로 만들고 새 grant generation=1을 PENDING으로 만든다. 본인 암호 회전은 현재 grant 행을 유지하고 기대 generation을 확인해 generation+1·새 쿠키 지문/관리 참조·PENDING으로 함께 교체하여 이전 세대를 즉시 폐기한다. 신규 발급 의도는 요청 수명에만 결합한다. admission은 이 DB 시도에서1회 소비·종료하며 커밋 뒤 재사용하지 않는다. 같은 주체의 후속 자격 변경은 이전 PENDING 발급을 회수해 낡은 자격의 활성화를 막는다. DB 확정 불명은 발급0이다.
        publication: DB 커밋 확인·모든 ADMIN/DB 잠금 해제 뒤 선택 Redis에 새 payload를 NX로1회 저장한다. Redis 네트워크를 guard/DB 트랜잭션 안에서 기다리지 않는다. 저장 확인 뒤 새 짧은 REQUIRED에서 현재 계정/권한·epoch·PENDING 기대 세대·60초 publication 기한을 재확인하고 ACTIVE로 확정한다. 회수/계정중지/epoch 전환이 끼면 활성화를 거부한다. ANONYMOUS는 정확 CSRF 준비 permit/브라우저 바인딩·epoch만 재검사하며 관리자 계정/액션을 부여하지 않는다. 최종 커밋 확인 뒤에만 단일 writer가 쿠키/성공 응답을 발급한다.
        failure: stage_one 롤백은 자격/이력/구회수 모두 롤백·발급0이다. stage_one 확정 뒤 Redis 저장/활성화 실패는 새 세션 미수락·쿠키0이며 이미 바꾼 암호/이력/구회수는 유지한다. 암호 변경 API는 PASSWORD_CHANGED_REAUTH_REQUIRED와 기존 재로그인 흐름을 반환한다. 별도 배너는 추가하지 않는다. 새 암호 정상 로그인으로 복구하며 원 변경 명령/이전 admission 자동 재실행은 없다. orphan payload는 TTL/정리로 제거하며 보상으로 암호를 되돌리지 않는다.
        uncertainty: Redis 저장 또는 최종 ACTIVE DB 커밋 결과가 불명이면 쿠키0·자동 재발급0이다. ACTIVE가 실제 반영됐을 가능성이 있어도 과거 발급 증거를 재사용하지 않고 새 검증/로그인으로 복구한다.
        cas: Lua 또는 동등 원자 연산으로 domain/epoch/grant/generation/revision·키 존재를 대조한다. updateExisting은 기존 키만 수정하고 revision을 증가시킨다. 오래된 revision/삭제·회전 세대는 갱신0이며 생성하지 않는다. delete도 같은 기대 세대만 지운다. 응답/확정 유실에 create/admission을 자동 반복하지 않는다.
        renewal: 일반 요청의 DB 유효성/최종접근/기한 확정과 Redis CAS 갱신은 분산 커밋이다. CAS0 뒤 현재 원장/선택 payload를 다시 확인하여 같은 현재 grant/generation의 낡은 revision이면 해당 flush만 폐기한다. 정상 두 탭 경합만으로503/접속종료/재인증을 만들지 않는다. 회수/만료/세대·쿠키 불일치는401, 실제 판정 불가는503이며 업무 효과/원 요청을 자동 재실행하지 않는다. Redis TTL은 DB 기한의 정리 힌트이며 과거 payload/기한은 DB 검사로 수락을 늘리지 못한다. key 부재 복구를 일반 save로 수행하지 않는다.
        recovery: 장애/재시작/과거 snapshot 복원 뒤에도 매 요청 DB ACTIVE·현재 generation·epoch를 먼저 검사한다. 저장소 장애 중 새 쿠키/임시 로컬 세션 발급0·JDBC 자동 폴백0이다. DB도 불가하면503이며 Redis 캐시만으로 수락하지 않는다.
      delivery:
        owner: v2 RequestTransactionBoundary는 DB 시도 완료와 선택 store 확인·최종 ACTIVE 커밋을 구별한다. v1 JDBC 전용 inRequired/MVC 전체 callback을 Redis에 그대로 적용하지 않는다. 공개 조립은 provider-neutral runtime/capability를 받고 각 provider가 DB 참여 또는 커밋 후 publication을 제공한다.
        states: 요청은 OPEN→DB_PENDING→DB_COMMITTED→STORE_CONFIRMED→DELIVERABLE→CLOSED로 진행한다. JDBC는 같은 물리 커밋 증거로 STORE_CONFIRMED/DELIVERABLE이 함께 확인된다. Redis는2단계 publication/활성화가 추가된다. rollback/UNKNOWN·출력 실패는 같은 요청을 CLOSED로 마감하며 늦은 flush/재발급을 금지한다.
        permits: CredentialAdmission/RotationAdmission은 최초 DB 시도에서 원장 생성/회수에 단일 소비한다. 커밋 후 Redis 발행은 서버 요청 수명에 결합한 별도 SessionPublication 증거와 현재 PENDING grant 재검사로만 진행한다. 종료된 admission을 부활시키거나 브라우저 재시도키로 쓰지 않는다.
        external_effects: 실제 SMTP/배치 큐 인계는 각 소유의 확정 뒤 외부 인계 계약을 따른다. 세션 publication 실패를 이유로 이미 확정한 업무 효과/메일/배치를 자동 재실행하지 않는다. 응답 body/status/header/redirect/error 모두 발급 가능 시점까지 지연하거나 명시 거부한다.
      management:
        lookup: API-517은 현재 ADMIN READ 권한과 대상 USER_ID를 guard 안에서 검사하고 현재 epoch/ACTIVE·DB 미만료 및 선택 store 일치를 확인한다. 생성/최종접근/만료와 현재 여부를 정확히 반환하며 관리 참조만 sessionId에 넣는다.
        revoke: API-518은 현재 EXECUTE 권한·대상 USER_ID·domain·관리 참조/현재 generation을 다시 조회해 DB REVOKED를 같은 보호 트랜잭션에 확정한다. 선택 store 삭제 실패도 수락 회수를 되돌리지 않는다. 형식 검증과 별개로 유효 형식의 없는/다른 주체/상대 영역/만료/이전 세대 참조는 기존처럼0건 처리하며 다른 세션 종료로 바꾸지 않는다. 중복 참조는 중복 제거하고 응답은 실제 새로 회수한 원장 건수만 센다. 전체 요청 오류로 몰래 변경하지 않는다.
      transition:
        procedure: 신규 접수/인증 배출→진행 보호 트랜잭션 종료 확인→운영 도구로 설정판 배타 잠금과 expected epoch CAS→provider/store-instance 및 새 epoch 확정·구 grants 회수→모든 노드 동일 설정으로 재시작→일치/접속/두 영역 smoke 확인→수락 재개다. 전환 및 되돌림 모두 전체 재로그인한다.
        mixed_nodes: 각 노드 기동에서 epoch 자동 증가0이다. 설정판과 다른 설정의 노드는 기동/수락을 거부한다. 구 epoch·구 provider의 모든 cookie/payload는 새 설정에서 거부하며 JDBC로 되돌려도 과거 JDBC 세션을 재수락하지 않는다.
        database_restore: DB 원장/설정판 자체를 과거 백업으로 복구하면 과거 ACTIVE/epoch도 돌아온다. 따라서 인증 수락을 닫은 상태에서만 복구하고, 복구 후 두 영역에 새 epoch를 명시 확정·구 grant를 회수한 뒤 모든 노드 설정 일치/구쿠키 거부/전체 재로그인을 확인해야 수락을 재개한다. DB+Redis 과거 자료가 서로 일치해도 복구 직후 기존 epoch로 열지 않는다.
        binary_rollback: 같은 v2 artifact에서 provider를 되돌리는 것과 원장 검사가 없는 v1 바이너리 rollback은 다르다. v1로 되돌릴 경우 인증 진입을 닫고 두 provider의 인증 payload/구 쿠키를 무효화·검증한 별도 복구 절차가 필요하다. 원장/자격/이력을 DROP하거나 암호를 과거로 되돌리지 않는다.
      verification:
        common: SLICE-308 공통 구현을 실제 PostgreSQL/JpaTransactionManager·격리 Redis·양 provider Tomcat HTTP에서 검증했다. 저장소/두 노드·커밋 순서·고장·논리 snapshot 복구·운영 전환·Liquibase apply/rollback을 포함한46개 실환경 시험(45개 통과와 Redis 연결/타임아웃 유형 관련1개 좁은 재검증 통과의 합산)과11개 규칙 반전의 실제 JUnit 실패/원문 복구를 확인했다. 최종 PIT·품질 및 G4 판정 근거는 project.state.yaml을 따른다. 실제 제품 소비 활성화는 consumers의 별도 범위다.
        consumers: SLICE-520의 실제 ADMIN 암호/이력/권한·API-517/518·frontend 첫 방문/새로고침, SLICE-301/306의 실제 Portal 자격/복구를 별도 검증한다. v1 대역 성공을 v2나 실제 계정 완료로 세지 않는다.
        environment: 작업 전용 PostgreSQL16과 workspace에 격리한 community redis-windows8.10.3(msys2 실제 Redis 소스 빌드)를 loopback 임의 포트에서 실행했다. 기동 아카이브 SHA-256을 확인했고 전역 PATH/서비스는 등록하지 않았다. 중단 시험의 재기동 Redis를 포함해 시험 후 포트 종료를 확인한다. Docker는 WSL 미준비로 사용하지 않았다. Windows 실제 프로토콜 검증이며 Linux 운영 배포 수락은 별도다.
