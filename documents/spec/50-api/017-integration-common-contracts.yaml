feature_contracts:
  FEAT-302:
    design_status: approved
    implementation: implemented
    reqs:
      - REQ-402
      - REQ-403
    usecases:
      - UC-046
    rules_from:
      - ARCH-028
      - ARCH-030
      - ARCH-032
      - ADR-022
      - ADR-028
    ownership: integration은 설정 해석/비밀 소비/배포 연결 포트를 소유한다. admin은 연결 참조·표시 보완만 저장한다. 설정 원본과 비밀을 관리 화면·SYS_CONFIG에 복제하지 않는다.
    types:
      ConfigGeneration: 배포/기동 식별자·설정 계약 버전·서버 로드 시각. 비밀값이나 암호문에서 계산한 공개 해시를 노출하지 않는다.
      ConnectionRef: kind=DATASOURCE|BUSINESS_API|MODEL|EXTERNAL_IDENTITY, key=배포에 등록된 안정 참조, expectedGeneration=서버가 확보한 값. 표시명/URL/사용자 입력으로 목적지를 다시 선택하지 않는다.
      PublicConnectionView: 참조키·종류·허용 표시명·설정 세대·사용 가능 여부·안전한 미지원/설정 오류 사유. 비밀번호·토큰·헤더·암호문·내부 환경 원문은 없다. 소비자별 허용 필드만 제공한다.
      SecretHandle: 서버 내부의 종류/용도/설정키에 결합된 불투명 참조. 직렬화 금지·toString 마스킹, 연결 어댑터의 제한된 callback 안에서만 평문을 소비한다. GC에서 완전 소거된다는 보장은 하지 않는다.
      ResolvedConnection: 서버 전용 불변 목적지/인증 방식·ConfigGeneration·SecretHandle·지원 기능. 일반 API DTO로 직렬화하지 않는다.
    ports:
      public_registry: listPublicKinds(serverCallerScope) / describe(ConnectionRef) -> PublicConnectionView|NotFound|Unavailable. 현재 소유 관리 READ 또는 내부 호출 허용 범위를 확인하며 일반 익명 HTTP 목록을 만들지 않는다.
      resolution: withResolvedConnection(ConnectionRef, operation, callback) -> Completed|Missing|Unsupported|GenerationMismatch|SecretUnavailable. 콜백은 고정한 연결만 소비하고 해석 실패에 다른 기본 연결로 대체하지 않는다.
      startup: validateBoot(ConfigGeneration) -> Ready|Rejected(safeCode,propertyName). 필수 원천 누락/미지원 모드/순환 설정/비밀 실패에서 해당 구성요소를 열지 않는다. 미사용 선택 연동은 소비 전까지 비밀을 요구하지 않는다.
    lifecycle:
      selection: ARCH-032.secret_contract.boot_design의 우선순위/Origin·선택 후 변환을 따른다. 선언되지 않은 비밀 형식·부트스트랩 값 암호화·잘못된 상위 값의 하위 폴백을 거부한다.
      snapshot: 동일 프로세스의 로드된 설정 세대는 불변이며 파일을 바꿨다는 이유로 기존 핸들을 바꾸지 않는다. 적용은 ARCH-028의 검수/배출/재기동이다. 현재 중단·권한·회수 검사까지 고정하는 의미는 아니다.
      commands: 운영 도구는 encrypt/verify/reencrypt 세 동작과 명시 고객사·환경·정규 설정키를 받는다. 키/평문은 보호된 입력 또는 명시 비밀 파일 핸들로만 읽고 명령 인자/셸 이력에 넣지 않는다. verify는 성공/안전 오류만, 나머지는 암호문만 출력한다. 기존 파일을 덮어쓰거나 YAML 전체를 재작성하지 않는다.
      rotation: 이전 키와 이전 암호문은 분리 보호한 복구 세트로 준비한다. 새 키/암호문 짝과 실제 연결을 검수한 뒤 별도 전환한다. 부분 교체는 차단, 복구도 짝/현재 자격을 확인한다. P2 실증은 ADR-022 근거이며 제품 운영 도구 완료가 아니다.
    storage: 새 업무 테이블 없음. 배포 YAML/보호된 외부 키가 원천이고 공개 뷰는 비저장이다. 유효 운영 설정 세대의 호출별 참조는 각 실행 생산자가 기록한다.
    source_contract:
      - sources/backend/core/src/main/java/com/aiagent/core/deployment/ConnectionRegistry.java
      - sources/backend/support/src/main/java/com/aiagent/support/deployment/
      - sources/backend/bootstrap/src/main/java/com/aiagent/bootstrap/config/SessionRedisConfiguration.java
    configuration: app.secrets.tenant/environment/properties와 app.deployment.id/connections를 사용한다. 키는 AIHUB_CONFIG_MASTER_KEY 또는 AIHUB_CONFIG_MASTER_KEY_FILE 하나이며 시스템 운영 설정에 복제하지 않는다. 표준 password 및 등록 canonical 키의 환경 재정의·배열/중첩 값을 보호한다. 운영 평문은 거부하고 local·시험 합성 자격만 명시 allow-plaintext를 사용한다.
    public_state: 선택 비밀의 미소비 상태는 SECRET_NOT_VERIFIED다. AVAILABLE도 해당 기동의 설정 검증 상태이며 실제 공급자 기능/접속 성공 판정은 소유 어댑터가 수행한다. 현재 권한은 등록된 서버 Consumer가 READ/CONNECT마다 검사한다.
    verification: TC-3021~3025의 제품 단위·실제 Boot/전용 PostgreSQL/Redis 선택 회귀로 검증한다. 고객 실제 운영 키 발급·접근/복구 인계와 외부 연결 검수는 P6/연동 소유 기능의 후속이다.
  FEAT-303:
    design_status: approved
    implementation: implemented
    reqs:
      - REQ-103
      - REQ-105
    usecases:
      - UC-047
    rules_from:
      - AUTHZ-001
      - AUTHZ-012
      - AUTHZ-020
      - AUTHZ-040
      - FEAT-005
      - FEAT-006
    ownership: admin 공개 포트가 현재 Portal 계정/소속/자산 정책을 제공하고 integration은 공통 판정기를 소유한다. system 메뉴 권한 판정과 분리한다. agent가 SQL/행 스코프 집행·전송 동의·쿼터·최종 공개를 수행한다.
    types:
      AccessRequest: 검증된 PORTAL PrincipalRef·purpose=SEARCH|MODEL_INPUT|QUERY|EXECUTE|RESULT·정확 자산 종류/안정ID·필드/응답 경로 참조·requestTraceId. 대상 자산 내용판과 현재 접근정책 판을 별도로 전달한다. 사용자 제출 그룹/ALLOW 값을 받지 않는다.
      CurrentPolicySnapshot: 현재 계정 이용조건·활성 소속·자산 허용 그룹·컬럼 예외·마스킹 정의·필요 대상 매핑과 소유 판/확인시각. admin의 보호 구간 안에서 원천을 완전하게 읽은 서버 값이다.
      AccessDecision: ALLOW|DENY|UNAVAILABLE, 안전한 사유, 주체/대상/목적·소유 정책 참조·확인시각, 필드별 RAW|MASKED|DENIED와 허용 마스킹 규칙. 일반 클라이언트가 제출할 인가 토큰이 아니며 현재 보호 callback 밖의 새 효과를 허용하지 않는다.
    ports:
      evaluation: evaluate(AccessRequest, CurrentPolicySnapshot) -> AccessDecision. 순수 판정기는 네트워크/DB/LLM/저장을 수행하지 않으며 AUTHZ 정본의 교집합·그룹 합집합·덜 엄격한 마스킹 규칙을 구현한다.
      current_use: withCurrentAccess(AccessRequest, callback) -> Completed|Denied|Unavailable. admin 공개 포트가 현재 정책 보호·읽기·판정을 조립하고 내부 수락을 같은 구간에서 확정한다. integration은 admin Repository를 직접 참조하지 않는다. 외부 네트워크 호출을 DB 보호 잠금 안에서 수행하지 않는다.
      projection: projectAllowedFields(decision,currentPayload) -> ControlledPayload|Mismatch. 미등록 경로/필드·정책 판 불일치에서는 닫고 원문을 오류 상세로 반환하지 않는다. 다른 대상/목적의 decision 재사용을 거부한다.
    semantics:
      defaults: 미등록 원천 컬럼/객체는 DENY, 등록 컬럼의 예외 없음은 AUTHZ-012의 상위 상속이다. 조회 실패와 정상 빈 매핑을 구분하고 둘 모두 허용하지 않는다.
      combinations: 복수 그룹의 합집합과 데이터소스/테이블/API 각각의 필수 관문을 혼동하지 않는다. 계정·등급/쿼터·신원 매핑·행 스코프·전송 동의가 필요한 목적은 해당 소유 검사와 함께 수락한다. 그룹 ALLOW만으로 다른 관문을 생략하지 않는다.
      revocation: 정책 회수와 내부 수락은 FEAT-005.access_contract의 보호 순서로 확정한다. 이미 송신한 데이터를 취소/회수했다고 주장하지 않으며 장기 대기 후·새 조회/전송/결과 공개는 재판정한다.
      no_fallback: 원천 일부 유실/시간초과/미지원 자산 종류·마스킹 규칙이면 UNAVAILABLE 또는 명시 미지원이다. 캐시·과거 내용판·다른 사용자의 결과로 우회하지 않는다.
    storage: 새 권한/정책 테이블 없음. ENT-101/102/103 및 자산별 admin 매핑을 현재 원천으로 사용한다. 판정 근거를 소유 실행 이력에 연결하지만 여기서 agent 턴 테이블을 만들지 않는다.
    verification: TC-3031~3035. 허용 그룹/정책 제거·마스킹 우선순위 반전·미등록 경로 공개·낡은 판 재사용을 반례로 검사한다. NFR-026의 공통 계층 시험이며 agent/Portal 최종 직렬화 시험을 대신하지 않는다.
    delivery_boundary: CR-045에 따라 현재 계정/소속·등급의 실제 원장 보호, 공통 순수 판정과 제한 콜백/정규화 잎 필드 투영을 완료한다. 자산 소유 포트·필수 추가 관문이 미설치면 UNAVAILABLE이며 실제 자산 연결/최종 직렬화는 각 소유 슬라이스에서 검증한다.
    datasource_semantics: AUTHZ-010의 데이터소스 적용 가능 그룹은 하위 매핑의 어휘 제약이다. 별도 런타임 허용 관문으로 중복 판정하지 않는다. 대상 신원 매핑·테이블/API/참조 자산의 독립 필수 관문은 유지한다.
    mask_delivery: 고객 합의 전 임의 실제 마스킹을 만들지 않는다. 소스 등록 유틸의 동일 유형/버전·유일 순위·자료형을 검증하고 미등록 규칙은 닫는다. 합성 시험 구현은 시험 소스에만 둔다.
    projection_shape: 소유 어댑터가 원 JSON/SQL 결과를 등록된 안정 경로/필드의 스칼라 행 목록으로 정규화한다. 공통 투영은 임의 객체/배열을 RAW로 통과시키지 않으며 미등록 셀·판/주체/목적 불일치·변환 실패는 빈 MISMATCH다. 실제 API 배열/최종 직렬화 대응은 자산/agent 소유 연결 시험으로 검증한다.
  FEAT-304:
    design_status: draft
    implementation: planned
    reqs:
      - REQ-007
      - REQ-009
      - REQ-034
      - REQ-106
      - REQ-107
      - REQ-602
    usecases:
      - UC-048
    interfaces:
      - IF-003
      - IF-004
    rules_from:
      - ARCH-032
      - ARCH-040
      - REQ-610
      - CON-033
      - CON-034
    ownership: integration은 입력/관측 변환·전송 어댑터·기능 지원 검증, agent는 입력 조립/목적·현재 통제·시도/스텝·취소·재시도와 필수 호출/계량 생산 계약을 소유한다. admin 모델 검토는 agent 공개 서비스에 요청하며 추론 포트를 직접 소비하지 않는다.
    types:
      CallOwnerRef: owner=AGENT|ADMIN, kind=TURN_WORK|ADMIN_OPERATION|EMBEDDING_TASK, stableRef=소유 서버의 불투명 참조, actor=PORTAL 주체 또는 검증된 ADMIN/서버 작업 주체. 임의 요청 userId나 운영용 플래그로 비용 주체를 지정하지 않는다.
      ModelCallRef: 서버 callId:UUID·attemptOrdinal:양의 정수·purpose·CallOwnerRef·requestTraceId. 실제 전송 시도마다 새 callId, 늦은 사건은 원 callId에 귀속한다. 같은 callId를 새 전송에 재사용하지 않는다.
      PreparedInference: ModelCallRef·해석된 경로/모델 코드/effort·연결/내용판 참조·최종 통제된 메시지·허용 도구 스키마·입력 지문·기한·필요 지원 기능·agent가 발급한 단일 전송 permit. 비밀과 원 SDK 객체는 제외한다.
      PreparedEmbedding: ModelCallRef·지식 본문 또는 질의 키워드 유형·모델/차원/설정판·통제된 텍스트·배열 원소 참조·입력 지문·단일 전송 permit. 대화 메시지·도구 스키마를 수락하지 않는다.
      ProviderObservation: callId·공급자 요청 참조·관측시각·전송상태=NOT_SENT|UNKNOWN|ACCEPTED·응답상태=PARTIAL|COMPLETED|FAILED|UNKNOWN·취소상태=NOT_REQUESTED|REQUESTED|CONFIRMED|UNKNOWN·안전 오류 분류. 원 토큰/헤더/진단 전문을 포함하지 않는다.
      UsageObservation: callId·source=PROVIDER|ESTIMATE|UNKNOWN·usageScope·counterSemantics·observationPhase·attributionState·reportedExecutionRef·단위/항목·제공된 정수 수량·최종 여부·공급자 근거 참조·정규화 버전. 미제공 항목은 null이며0과 다르다. 가격/환산/실제 쿼터 귀속은 FEAT-016/017·REQ-116의 소유 규칙이다.
    ports:
      inference: InferencePort.invoke(PreparedInference, observer) -> TerminalObservation. agent 전용 의존으로 제한한다. 공급자 tool call은 제안으로 반환하고 integration/CLI가 업무 도구를 실행하지 않는다.
      embedding: EmbeddingPort.embed(PreparedEmbedding) -> VectorResult|Failure. admin 지식과 agent 키워드가 같은 모델/차원 판을 검증한다. 크기·개수·차원·유한 수·원소 대응이 다르면 저장/검색에 사용하지 않는다.
      dispatch: DispatchPermitPort.consumeAndRecord(ModelCallRef,inputDigest,configuration) -> Permit|Denied|Unavailable. agent가 현재 권한/동의/점유/예산·입력 범위와 필수 사전 기록을 확인하고 한 전송만 수락한다. 숨은 하위 재전송도 이 경계를 통과하거나 비활성화해야 한다.
      recording: CallRecordPort.recordObservation(ref,observationKey,observation) / recordUsage(ref,usageKey,usage) -> Recorded|AlreadyRecorded|Conflict|Unavailable. 같은 키/같은 내용만 중복으로 인정, 같은 키/다른 값은 충돌이다. 관측·추정·최종값은 구분해 보존하고 누적 수치를 매번 합산하지 않는다. 물리 기록은 agent FEAT-210/211 상세가 소유한다.
      cancellation: cancel(callId,requestRef) -> CancelObservation. 로컬 중단 요청 접수와 원격 종료 확인을 분리한다. 이미 완료된 응답과 취소가 경합하면 실제 관측을 보존하고 결과가 늦게 와도 새 효과/시도를 만들지 않는다.
    sequence:
      before_send: agent가 자료/프롬프트/동의 근거를 조립→integration 지원/최종 전송형태 검사→동일 입력 지문으로 단일 전송 permit과 필수 사전 기록 확정→고정한 어댑터로1회 송신. 직렬화 실패는 NOT_SENT, 소켓 송신 여부를 확정할 수 없으면 UNKNOWN이다.
      after_send: 부분/완료/실패와 사용량 관측을 원 callId에 기록한 후 소유 agent에 반환한다. 필수 결과 기록 실패는 성공 종결하지 않고 기록 불명/복구 필요로 남긴다. 이미 전송한 요청을 기록 실패 때문에 자동 재전송하지 않는다.
      streaming: 부분 원문은 agent의 비공개 처리 경계로만 전달한다. Portal 진행 표시는 REQ-006, 최종 출력 통제는 NFR-026이며 모델 청크를 브라우저로 곧바로 전달하지 않는다.
      retry: 후보/재시도 허용은 agent가 결정하고 새 callId·permit·기록을 확보한다. 동일 이름의 다른 모델 자동 대체·SDK/HTTP/CLI의 숨은 재시도·내장 agent 도구 실행은 금지한다.
      usage: 늦은 최종 계량은 원 호출에 연결해 이전 관측과 대조한다. UNKNOWN을0으로 바꾸지 않고 확정값 재수신을 중복 차감하지 않는다. 공급자 정정 계량의 물리 이력/원자 반영은 소유 agent 기록 모델에서 동결한다. FEAT-211.minimal_producer.attribution의 원천 범위/귀속 검증을 통과한 수량만 반영한다. CLI 중단 result의0·이전 턴 누적 재표시·재개 시 재전달은 최종량 확인 근거가 아니다.
    development: ARCH-032.p2_evidence의 CLI 실측 한계/미지원과 운영 API 구독 후 실증을 따른다. 테스트 대역은 합성/허용된 비밀 제거 자료만 사용한다. 대역 기록 포트로 실제 유료 호출을 완료 처리하지 않는다.
    storage_dependency: FEAT-210/211.minimal_producer와 ENT-258~264가 최소 접수·관측·계량/정정·불변 스냅샷을 소유한다. SLICE-230의 실제 생산 뒤 SLICE-304 통합 호출을 검증한다. agent 전체 턴/화면 완료를 이 계약으로 주장하지 않으며 기존 목업은 입력에서 제외한다.
    design_evidence: ADR-048 A 승인 뒤 ASM-003은 고정 그래프/실제 PostgreSQL/CLI 정상·중단의 수정30단언·변이2종과 원천 계량 반례로 설계 재현을 확인했다. 제품 원장/쿼터·운영 공급자 지원 수락을 포함하지 않는다.
    pending_before_g3: []
    operational_acceptance: '@defer 운영 API 구독/유효 시험 연결 확보 직후 — ARCH-032.operational_usage_acceptance가 조합별 수락의 소유·기한·미지원 처리 정본이다. 해당 모델 통합 G4 완료/기능 최초 활성화 전 판정하며 계약 대역이나 CLI 결과로 이를 대체하지 않는다.'
    verification: TC-3041~3049. NFR-026/027의 공통 경계/기록 실패·대역 검증과 실제 공급 경로별 시험을 구분한다.
  FEAT-305:
    design_status: approved
    implementation: implemented
    source_contract:
      - sources/backend/modules/portal/src/main/java/com/aiagent/portal/change/
      - sources/backend/core/src/main/java/com/aiagent/core/security/portal/PortalChangeOwner.java
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/portal/PortalChangeOwnerService.java
      - sources/backend/bootstrap/src/main/java/com/aiagent/bootstrap/config/SourceChangeConfiguration.java
    source_assembly: 실제 공개 이름은 SourceChangeService.verify/receive와 PortalChangeOwner.protectBinding/apply다. Verified는 검증 서비스만 발급하는 비공개 생성자 객체이며 envelope 뒤 최신성 준비와 현재판 재검사를 분리한다. 추적 ID는 공통 요청 문맥에서 관리하며 원 증거/subject를 일반 접근 로그에 기록하지 않는다.
    decision: ADR-047
    reqs:
      - REQ-103
      - REQ-107
    usecases:
      - UC-049
    interfaces:
      - IF-006
    apis:
      - API-307
    entities:
      - ENT-257
      - ENT-265
      - ENT-266
    ownership: integration의 portal 내부 수신 조립은 원천 검증/수신 결과를, admin FEAT-005 공개 포트는 Portal 현재 상태/전체 HIST를 소유한다. 외부 원천을 ADMIN 사용자로 위장하거나 상대 Repository를 직접 쓰지 않는다.
    types:
      ExternalUserChange: schemaVersion=1·sourceEventId:string1~200·subject:string1~255·kind=RETIRED|ORG_MOVED·occurredAt:UTC Instant. sourceKey/namespace·epoch·연결 세대는 등록 원천/검증기에서 얻으며 body의 sourceKey/임의 주체·활성화/그룹 부여는400이다. sourceVersion은 원천 계약이 검증한1~128문자 불투명 판이다.
      VerifiedUserChange: sourceKey·stableNamespace·sourceEpoch·eventKeyDigest·businessPayloadDigest·subjectDigest·currentBindingKey·sourceVersion/orderMode·previousCursorVersion·freshnessDigest·verifierGeneration·verifiedAt/expiresAt·requestTraceId. 원 증거/비밀/전체 원천 본문은 없다. 증거는 정확 method/path·원천 binding·eventId/kind/subject/본문지문·기한/nonce에 결합한다.
      ChangeReceipt: receiptId·sourceEventId·outcome=APPLIED|NO_CHANGE|REJECTED·safeCode·appliedAt|null·notificationState=NOT_REQUIRED|PENDING_NO_RECIPIENT|STORED·duplicate. Portal 주체/그룹/HIST·수신 관리자ID는 HTTP 응답에서 제외한다.
    ports:
      verification: SourceChangeVerifier.verifyEnvelope(exactRoute,headers,body) -> VerifiedEnvelope|Rejected|Unavailable로 현재 원천 인증·업무본문 결합·기한/재생 방지를 검증한다. 이어 확정 사건 결과를 조회한다. 신규 효과가 필요한 경우에만 verifyFreshness(envelope,binding,cursorSnapshot) -> VerifiedUserChange|Rejected|Unavailable를 DB 잠금 밖에서 수행한다. 기존 확정 결과/통지 복구에는 신규 효과용 최신성 판정을 강제하지 않는다.
      application: admin PortalUserChangePort.applyVerifiedChange(sourceOrigin,currentPortalRevision,change) -> Applied(exactHistoryRef)|NoChange|Rejected|RetryableConflict|Unavailable. 현재 원천+subject 연결과 계정 모드·최신 원천/기대 판을 보호 구간에서 재확인한다. 잠금 대기 후 효과 확정 직전에 검증 증거의 expiresAt·원천 설정 세대/유효성·대상 연결을 다시 대조한다. currentPortalRevision이 바뀌면 재검증 없이 자동 재시도하지 않는다.
      origin: SourceChangeOrigin={sourceKey,receiptId,commandKey:UUID,eventKeyDigest,kind}; 서버 검증 생산자만 생성한다. commandKey는 같은 사건 수신 결과의 전역유일 명령 키이며 적용 HIST의 HISTORY_COMMAND_KEY에 그대로 사용한다. 관리자 액션 권한을 대체하는 범용 운영자 토큰이 아니며 두 종류의 비활성화 공개 명령에만 쓸 수 있다.
    transaction:
      identity: 등록된 안정 원천 namespace+sourceEpoch+sourceEventId를 길이 구분 UTF-8로 정규화한 SHA-256(event/v1 도메인 구분)을 사건키로 사용한다. ENT-113 최소종결표→ENT-257 결과/업무본문지문을 확인한다. 같은 본문은 원 효과를 재생하고 통지 pending만 복구, 다른 본문409다. 새 서명/nonce·verifiedAt/expiresAt·검증 키 세대/최신 조회 근거는 업무본문지문에서 제외한다.
      order: 사건키 보호→FEAT-040 명령키 보호/전체 원장 검사→system ADMIN_AUTHORITY_V1 공유 수신자 보호→달력/월→Portal 정책/연결 사용자·원천 cursor→수신 결과/통지 참조 순서다. ADMIN 보호를 Portal 잠금 뒤 획득하지 않는다. 원천 검증 네트워크는 잠금 밖, 새 효과 직전 기한/설정세대·기대 cursor판/binding/Portal판을 재검사한다. 원결과 재생/통지만의 복구는 현재 원천 인증·증거기한과 수신자 권한만 재검사한다. 잠금 전 결과 조회는 힌트이며 사건키 보호 안에서 결과/본문지문을 다시 확인한다.
      atomic: ENT-257의 원 결과·Portal 현재 상태/부모 리비전·비밀 없는 전체 HIST·이력 참조 보호·통지 상태를 같은 AI DB REQUIRED 트랜잭션에서 확정한다. ADR-047에 따라 유효 수신자0명은 이용 상태 변경+통지 PENDING_NO_RECIPIENT로 확정하고 동일 사건 재전송으로 통지만 완료한다. 수신자가 있으면 인앱 저장/정확 참조도 같은 트랜잭션이다. DB/이력/필수 기록 실패는503/성공 ACK 없음이다. 검증되지 않은 공격 입력은 별도 보안 거부 지표에만 남긴다.
      rejection: 검증된 사건 자체의 영구적 업무 거부만 효과0의 REJECTED 원 결과로 확정한다. 현재 부모 판 경합·증거 만료/최신성 재확인 필요는 재시도 가능한409, 원천/DB/기록 불가는503이며 terminal 수신 결과를 확정하지 않는다. 같은 source/eventId/본문으로 원천부터 재검증해 새 보호 구간에서 재시도할 수 있다. 확정 결과의 동일 키/상이 본문409와 구분하며 재시도 중 비활성화/HIST/알림을 부분 확정하지 않는다.
      history_origin: 외부 원천 변경은 ADMIN 명령 원장 ENT-099에 가짜 ACTOR_ID를 넣지 않는다. 수신 결과 ENT-257이 원 명령 결과를 소유하고 실제 적용 HIST에는 HIST_ACTOR_ID를 null로 둔다. sourceKey/receiptId/commandKey와 정확 target+historyNo 역참조가 함께 보존돼야 한다. FEAT-040.protectHistoryUse에 소비영역integration·종류EXTERNAL_USER_CHANGE·안정참조receiptId·정확 Portal HIST를 같은 트랜잭션으로 등록하며 실패하면 전체 롤백한다. ADMIN UI 저장은 기존 실제 관리자 ID 필수 규칙을 유지한다.
      effect: RETIRED는 Portal 비활성화, ORG_MOVED는 일시 비활성화와 관리자 알림이다. system 계정/권한과 과거 배정·확정 실행을 되감지 않는다. 다음 Portal 수락/보호 접근에서 현재 상태를 검사하며 그룹 재부여/재활성화는 기존 관리자 확인 절차다.
      ordering: ENT-265가 sourceEpoch/binding별 마지막 검증 원천 판과 cursor판을 보존한다. MONOTONIC은 원천 검증기가 이전 판과 엄격 증가/동일/과거를 판정하고 불투명 판 문자열을 DB 사전순/발생시각으로 비교하지 않는다. CURRENT_STATE는 같은 subject/현재 binding의 현재 상태 조회 근거로 이번 비활성화가 여전히 적용 대상인지 증명한다. 판정 불명은409/재검증, 명확한 과거 사건은효과0 REJECTED다. NO_CHANGE도 확인된 판 진전은 같은 commit에 저장한다. 동일 원천 판의 다른 사건키가 같은 변경을 반복하려 하면 SOURCE_VERSION_REPLAY409로 닫는다.
      delivery: NOT_REQUIRED/STORED는 commit 뒤200, PENDING_NO_RECIPIENT는 이용 상태/기록 commit 뒤202와 안전한 통지 미완료 상태를 반환한다. 같은 원천/사건/본문의 인증된 재전송은 원 효과를 재적용하지 않는다. 수신자0이면 pending을 유지하고, 유효 수신자 확보 시 통지 상태·인앱 저장·ENT-266 다수 참조를 같은 commit에 STORED로 전환한다. ACK 유실/동시 재전송은 추가 HIST/중복 알림0. 자동 재전송 배치/outbox는 만들지 않는다.
      notification_handoff: ADR-047·FEAT-509.external_change_notification. 지정된 기존 system 역할의 현재 유효 관리자 합집합이며 개인별 추가 목록/전체 관리자 발송이 아니다. 실제 역할명/코드는 고객 배포·운영 검수 전까지 연결한다. 정상0명만 PENDING이며 조회 장애/불완전 결과는503과 전체 rollback이다. 처음 STORED된 수신 집합은 확정하고 후속 역할 변경·인앱90일 보존 종료로 재발송하지 않는다.
      replay_branch: 현재 인증/서명기한을 확인한 같은 업무본문의 확정 receipt는 원효과와 원 cursor/binding을 재평가·재적용하지 않는다. 후속 사건·수동 재활성화·재연결이 있어도 과거 pending 통지만 현재 수신 역할/조회 권한으로 완료할 수 있다. 기록된 과거 사건에 대한 통지임을 표시한다. 신규 효과 판정 실패를 이미 확정된 통지의 영구 복구 차단으로 쓰지 않는다.
    retention: 고객 사건 보존기간/조사·소비 보호를 적용하며 미설정이면 자동 파기 비활성이다. 통지 pending은 보존기간 안에서 조기 정리하지 않지만 그 사실만으로 무기한 보존하지 않는다. 고객 보존 협의에서 미통지 사건의 기한 종료/정당한 연장 기준도 정한다. 알림90일과 사건/HIST 보존을 분리하며 임의 제품 기본 일수를 만들지 않는다.
    pending_before_g3: []
    verification: TC-3051~30512. 역할0명→후속 통지만1회·동시 재전송·새 nonce/키교체 동일본문·최신성/재연결/파기후 재생·서명변조를 포함한다.
    verification_binding:
      epoch: sourceEpoch는 원천의 순서 체계/재가입 세대이며 서명키 세대와 다르다. 새 epoch는 등록 원천의 검증된 전환과 현재 연결 증거가 필요하다. 프로세스 재시작·서명키 교체만으로 cursor를 초기화하지 않는다.
      binding: ENT-131/209의 BINDING_KEY는 신규 연결/재연결 시 서버 UUID이며 일반 프로필 변경·키교체로 바꾸지 않는다. 과거 binding 사건은 현재 연결에 자동 적용하지 않는다. SOURCE_REVISION128은 원천 연결 근거판이고 사건판과 다른 개념이다.
      expiry: 외부 검증 후 잠금 대기 중 만료되거나 cursor/설정판이 바뀌면 같은 사건으로 다시 검증한다. 일시 실패를 영구 REJECTED로 확정하지 않는다.
    retention_detail:
      minimum: ADR-044 원칙을 외부 재전송키에 적용한다. 파기 시 ENT-113에 사건키 event/v1 해시·OWNER_FEATURE=FEAT-305·TERMINAL_CD=EXPIRED와 기존 서버 commandKey 종결을 함께 등록한다. 사건키가 있어야 서버 UUID 매핑 파기 후에도 재수신을 막는다. subject/본문지문/수신자/시각/원결과는 최소표에 복사하지 않는다.
      atomic: 사건/명령키 보호→현재 참조/조사·pending의 고객 보존 종료 조건 재검사→최소종결2종 등록→FEAT-040 보호 참조 해제→수신/통지 연결 제거를 같은 소유 파기 트랜잭션으로 처리한다. 실패는전체rollback이며 최소키 조회 장애는새사건이 아니다.
      cursor: 현재 외부 연결이 소비하는 cursor는 사건 원결과 파기 후에도 남는다. LAST_RECEIPT_ID는 추적 참조이며 현재 행 FK/CASCADE가 아니다. 연결 종료·해당 사건 보호 해제와 소유 보존 종료 전 cursor를 삭제하지 않는다.
      replay: 최소종결키가 있으면 EXPIRED409만 반환하고 원효과/원통지 재생성0. 인앱 행만 파기된 STORED 수신 결과도통지 재생성0이다.
      pending: '@defer 고객 CON-032 보존 협의 — 미통지 사건이 기한에 도달하면 EXPIRE_UNNOTIFIED(원효과 유지·미통지종결·최소키등록 후 개인기록 파기) 또는 명시 사유/유한 기한의 보존 연장 중 고객 정책을 적용한다. 미설정은 자동파기 비활성, pending 자체가 영구 조사보호는 아니다. 새 처리 화면/임의 보존 일수는 추가하지 않는다.'
    operational_prerequisites:
      - '@defer 고객 IF-006 운영 검수 — 실제 원천 인증/재생 차단·epoch/판 비교 또는 현재상태 조회·키 교체/시계/재전송 계약을 어댑터별 검증한다. 검증기 미설정/최신성 증명 불가는 운영 수락 비활성이다.'
      - '@defer 고객 배포/운영 검수 — 실제 수신 역할 코드·보존기간을 설정한다. 역할 미설정/삭제는 사용자 결정대로 정상0명/pending이며 원천 검증 실패와 구분한다.'
