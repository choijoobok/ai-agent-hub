feature_contracts:
  FEAT-301:
    api_path_transition:
      change: CR-038
      baseline: integration 소유 경로 영향 G3에서 동결했다. 승인 일자/범위는 project.state.yaml의 integration.P3_design.path_change_recheck를 따른다. system 실제 페이지/API·권한 연결 소비 상세와 제품 전환 수락은 별도다.
      convention: ARCH-021.api. 모듈 우선 A를 확정했으며 public/common/service 의미·인증 영역/메뉴 액션·HTTP method·요청/응답은 유지한다. 현재 소스/완료 시험을 새 경로 검증으로 표시하지 않는다.
      namespace: 제품 system/admin/portal/agent, 기존 원천 검증 integration, local 참조 sample을 명시 허용한다. 모르는 module/layer/method/path는 닫으며 sys 별칭·부분 문자열 추정·포괄 public 허용을 추가하지 않는다. integration/public은 SourceChangeVerifier/NONE이며 브라우저 익명 허용이 아니다.
      catalog: ExactApiCatalog·ApiLayer·SecurityConfig·AuthorizationInterceptor·제한 세션/CSRF 경로·인증 전문 로그 제외를 같은 목표 카탈로그로 대조한다. 모듈과 계층의 순서를 바꿔도 정확 method/handler/path·인증 영역 매핑은 유지한다. current_path는 문서상 비교 값이며 런타임 허용 목록으로 읽지 않는다.
      special_handlers: 진행률 조회는 system/common의 서버 소유 사용자 검사로 유지한다. 등록한 단일 jobId 경로 변수만 허용하는 정확 handler/method/template를 기동 때 검증하고 값의 형식/본인 소유를 검사한다. 가변 일반 prefix나 service 경로 변수를 허용하지 않는다. system 정보 조회도 현재 ADMIN 공통 인증·응답 범위를 보존한다. sample은 도메인 생략만 예외다.
      database: 기존 데이터를 보존해 전환하는 환경의 계약이다. SYS_API.API_URL과 SYS_MENU_API.API_URL의 기존 키/연결은 새 changeset으로 한 트랜잭션에서 옛→새 정확 매핑한다. 부모/자식 FK 순서를 고려해 새 부모 생성→연결 복사/대조→구 연결/부모 제거 순서로 처리하며 원 메뉴/액션·감사 값·권한 수와 사용자/역할 부여를 보존한다. 대상키 충돌/미등록 구값·양방향 중복은 중단하고 덮어쓰지 않는다. 적재 changeset 수정0·단순 CSV 재적재로 기존 권한 유실0. rollback은 원 키/연결 복구 후 이전 artifact로 통제 전환한다. 보존할 데이터가 없는 현재 개발 환경에서 사용자가 선택한 CR-039 빈 DB 재기준선의 적용/복구는 FEAT-501.route_cutover.development_rebaseline/rollback을 따른다. 이 초기 설치 결과로 보존 이관 성공을 주장하지 않는다.
      seeds_and_clients: generateApiSeed/생성 검증·프런트 endpoints/예외 하드코딩·OpenAPI 선언·구조/보안 시험을 같은 매핑표로 대조한다. system99·공통2의 현재 핸들러와 sample20을 기준으로 누락/중복0을 확인하며 public/common도 목록에 포함한다. 메뉴 인가 시드는 service만 생성한다. 실제 개수는 전환 시 소스를 다시 집계한다.
      cutover: 기동/인증 접수 배출→DB 키/연결 전환→새 artifact/정적 파일 동시 배포→카탈로그·권한 연결·새 URL/구 URL 거부 smoke→재개한다. 구 URL 별칭/redirect/이중 등록을 남기지 않는다. 저장소 전환 세대/재로그인 정책은 session_store_v2를 재사용하며 경로만 바꾸기 위해 새 저장 원장을 추가하지 않는다.
      ownership: integration은 공통 경로 해석/카탈로그·생성 규칙·정확 핸들러/원천 수신·local sample 예외, system은 실제 관리자101경로/프런트 소비·DB API/메뉴 연결을 소유한다. 두 영향 G3 뒤 SLICE-308 G4는 새 카탈로그 capability의 독립 fixture 검증까지이며 현재 제품 parser/seed를 새 경로 전용으로 활성화하지 않는다. SLICE-520에서 공통 분류기/생성기와 실제 system/sample endpoint·호출자·DB 연결을 같은 cutover로 활성화한다. 308 완료조건에520 실제전환을 넣어 순환시키지 않으며 새/구 혼합 제품을 배포하지 않는다. 계획 admin/portal/agent API는 각 소유 구현 때 목표 경로로 시작한다.
      verification: TC-30129·TC-50117. 실제 HTTP의 모든 현재 핸들러 method/path·영역/계층/CSRF/제한 세션·동적 progress 소유 검사, 구 경로 거부, 실제 DB 권한 연결/rollback·시드 일치·sample local/제품 제외를 검증한다. 307 v1/308 저장소 시험 통과와 이 경로 전환 완료는 별개다.
    design_status: 기존 v1/JDBC 동결·SLICE-307 G4 승인 사실은 유지한다. CR-036의 provider 독립 v2와 CR-038 경로 계약은 integration 영향 G3에서 동결됐으며 system 소비 변경 상세도 소유 영향 G3에서 승인됐다. 구현/검증은 SLICE-308부터 계획 순서로 진행한다. 현재 목표 저장/발급/관리 참조는 session_store_v2가 정본이고 승인 상태/일자는 project.state.yaml을 따른다.
    implementation: 기존 v1 core/security·api/auth/boundary 조립은 SLICE-307 완료다. CR-036 v2 공통 조립·DB 수락 원장·선택 provider는 SLICE-308, 실제 관리자 소비는 SLICE-520, Portal 물리 원장/자격·외부 인증은 SLICE-301/306이다.
    decision: ADR-046
    change: CR-033
    reqs:
      - REQ-501
      - REQ-502
      - REQ-103
      - REQ-616
      - REQ-041
    usecases:
      - UC-501
      - UC-502
      - UC-503
      - UC-023
      - UC-045
    ownership:
      system: ADMIN 계정/현재 권한과 보호 경계. 기존 API는 FEAT-501/502/503 소유.
      admin: PORTAL 원장/자격·그룹/등급/매핑 쓰기와 검증 공개 포트.
      portal: FEAT-301 인증 진입/세션·본인 인증 API는 portal 모듈, 소유 작업흐름 integration. FEAT-128 제품 화면은 후행 portal.
      integration: 영역 선택/세션 기술 조립과 공통 수락·실패 계약.
      integration-debug: FEAT-126/SCR-112의 별도 두 주체 결합과 응답 소비 시험. 인증 우회 기능을 만들지 않는다.
    types:
      PrincipalRef: domain:ADMIN|PORTAL, subjectId:영역 안정 ID 문자열. 요청 body/header에서 받지 않고 해당 영역의 검증된 세션에서 만든다. ADMIN USER_ID와 PORTAL BIGINT 십진 문자열은 같아도 다른 주체다.
      AuthenticatedContext: PrincipalRef, authMode:LOCAL|EXTERNAL, sessionRef:서버 내부 불투명 참조, authLevel:PASSWORD_CHANGE_REQUIRED|AUTHENTICATED, credentialVersion:LOCAL 검증 세대, authenticatedAt:UTC Instant, requestTraceId. 쿠키/비밀번호/외부 증거는 포함하지 않는다.
      PortalLoginRequest: loginId:string 필수, password:string 필수. 공백을 비밀번호에서 제거하지 않고 기존 암호 정책을 적용한다. authDomain/portalUserId/role/인증모드는 입력받지 않는다. 배포 모드가 LOCAL일 때만 이 진입을 연다.
      PortalAuthState: domain=PORTAL, subjectId, displayName, authLevel, sessionExpiresAt, access:{eligible:boolean, reasons:미등록/중지/기간/그룹/등급/쿼터미준비 구분}. 그룹/정책 전체나 원 자격정보를 노출하지 않는다. eligible은 이후 실행 권한을 보증하는 토큰이 아니다.
      PortalPasswordChange: currentPassword, newPassword 필수. 세션의 본인만 대상이며 portalUserId를 받지 않는다. 새 값과 재사용/만료 검증은 admin 자격 포트가 수행한다.
      VerifiedExternalIdentity: '서버 전용 검증 결과: sourceKey, subject, issuer/audience 검증 근거, verifiedAt/expiresAt, 단일 소비 evidenceRef, allowlisted profile, correlationRef. 원 토큰/어설션을 관리 DTO/HIST/로그로 전달하지 않는다. 브라우저가 이 타입을 직접 제출하면 거부한다.'
      AuthorityDecision: allowed:boolean, domain, subjectId, exactApi, requiredAction, checkedAt, safeReasonCode. 과거 허용 결과의 재사용/직렬화/브라우저 제출은 금지하며 현재 보호 구간 안에서만 유효하다.
    request_boundary:
      dispatch: 서버의 정확 API 카탈로그에 인증 영역·허용 authLevel·CSRF 필요·메뉴 액션 또는 본인 범위를 등록한다. /api/public 전체 permit을 영역 선택/증거 검증 생략으로 쓰지 않는다. 미등록 경로는 닫는다.
      public: API-301 및 영역별 공개 로그인/정책/복구의 정확 목록만 익명 허용한다. 로그인도 같은 영역 CSRF·Origin 검증을 적용한다. 공개 비밀번호 복구의 관리자 정책을 Portal에 자동 복사하지 않는다.
      protected: ADMIN은 현재 계정 상태와 해당 메뉴 액션, PORTAL은 자기 세션·현재 계정 상태 및 기능별 현재 그룹/쿼터/매핑을 확인한다. API 계층명 common/public만으로 상대 영역 세션을 수락하지 않는다.
      errors: 400 입력형식, 401 인증 실패/만료/다른 영역/비활성, 403 현재 액션/CSRF/업무 이용 불가, 409 자격세대·등록 충돌/이미 소비한 외부 증거, 422 암호정책/모드 불일치, 429 인증 시도 제한, 503 판정/세션 저장소 불가. code·safeMessageKey·requestTraceId만 반환하며 계정 존재 여부·원문 증거를 노출하지 않는다.
      dispatcher:
        routing: 공통 진입부가 정규화한 정확 method+path의 서버 카탈로그로 ADMIN/PORTAL/NONE을 먼저 고른다. prefix·요청 헤더·브라우저 body로 인증 영역을 선택하지 않는다. 미등록 API는403, 인증 없는 보호 경로는401이다.
        order: 정확 경로/영역 선택 → 해당 영역 SessionRepository·쿠키 해석 1회 → 해당 SecurityContext/CSRF → 인증 수준 → 소유 현재 상태/인가 포트 → 업무 트랜잭션. 자동 등록 기본 SessionRepositoryFilter와 명시 영역 필터를 이중 실행하지 않는다.
        anonymous: API-301/API-601은 자기 영역의 현재 세션을 먼저 조회한다. 유효한 인증/익명 세션은 세대·주체를 보존해 prepareCsrf로 현재 CSRF를 준비/재발급한다. 부재/만료만 정확 경로의 익명 생성 permit으로 새 익명 세션을 만든다. 상대 영역 쿠키는 이 조회에 사용하지 않으며 인증 세션을 익명으로 덮지 않는다. 로그인/복구 POST도 같은 문맥·Origin을 검증한다.
        callback: 외부 콜백은 IF-010의 설치된 정확 경로·메서드 한 쌍과 검증 어댑터로만 연다. 일반 CSRF 예외가 필요한 프로토콜은 state/브라우저 바인딩/nonce/서명/일회 소비로 대체 검증한다. public 전체 예외는 금지한다. 정확 콜백은 고객 어댑터 설계에서 확정한다.
        debug: /internal/**는 별도 디버그 수락 계약이 완성되기 전 닫는다. 두 세션을 중첩 HttpSession으로 합치지 않고 소유 포트로 검증한 두 주체를 명시 결합한다.
        clients: shared HTTP 전송 코어는 재사용하되 admin/portal 클라이언트는 자기 영역 CSRF 헤더와 상태 저장소만 연결한다. 인증 오류 시 작성 중 입력을 보존하고 상대 영역 로그아웃을 호출하지 않는다.
        logging: 인증 공개/본인 API 및 외부 콜백은 일반 요청 전문 수집에서 제외한다. denylist 마스킹만으로 안전을 주장하지 않으며 URL query·exception·APM·프록시 접근 로그에도 비밀이 없도록 검증한다. 일반 SYS_LO_ACCESS가 Portal 주체를 ADMIN USER_ID로 기록하지 않게 제외/영역 분류한다.
        source_event: API-307의 정확 POST 경로는 NONE 영역의 원천 전용 조립으로 분기한다. ADMIN/PORTAL SessionRepository와 일반 관리자 인가/로그를 거치지 않으며 FEAT-305 SourceChangeVerifier와 필수 수신 기록을 통과해야 한다. NONE을 익명 허용으로 해석하지 않는다.
    session_isolation:
      cookies: ADMIN=AIHUB_ADMIN_SESSION, PORTAL=AIHUB_PORTAL_SESSION. 별도 불투명 난수·서버 저장 문맥, HttpOnly·Path=/·SameSite=Lax·HostOnly(Domain 미설정). 운영 HTTPS에서 Secure 필수이며 local HTTP 예외는 local 프로파일에만 둔다. Path를 보안 경계로 믿지 않고 정확 API에 맞는 쿠키 하나만 해석한다.
      csrf: ADMIN=AIHUB_ADMIN_CSRF/X-AIHUB-ADMIN-CSRF, PORTAL=AIHUB_PORTAL_CSRF/X-AIHUB-PORTAL-CSRF. 프런트에서 읽는 CSRF 쿠키와 HttpOnly 인증 쿠키를 구별한다. 세션/로그인 문맥과 바인딩하고 해당 영역의 unsafe 요청만 동일 출처 Origin·헤더/토큰을 검증한다. 다른 영역 토큰/헤더는 거부한다.
      store: CON-010·session_store_v2의 JDBC 기본/Redis 기동 설정 선택과 DB 수락 원장을 사용한다. JDBC는 ADMIN 기존 SPRING_SESSION·PORTAL ENT-252/253의 표준 저장/인덱스를 분리한다. Redis도 domain/epoch namespace와 원천 수락 검사를 분리하며 WAS/자동 폴백은 금지한다.
      lifecycle: 로그인 성공·비밀번호 변경 성공 때 해당 영역 sessionId/CSRF를 회전하고 이전 식별자를 폐기한다. 초기화/자격 변경 시 LOCAL credentialVersion 불일치 세션은 다음 보호 요청에401이다. 한 영역 logout/만료는 상대 영역 세션·쿠키를 지우지 않는다. 상태 확인/로그아웃/암호 변경만 제한 세션에 허용한다.
      frontend: authStore/adminApiClient와 portalAuthStore/portalApiClient를 논리 분리하고 각각 자기 CSRF 헤더만 보낸다. 인증 자격/세션ID를 localStorage에 저장하지 않는다. 라우트 가드는 안내이며 서버 검사를 대신하지 않는다. 현재 전역 ADMIN fetchMe·RequireAuth/wildcard의 영역 제한과 API-508 발급 실패 소비는 FEAT-501.auth_precondition.frontend_consumption을 따른다.
      return_url: ADMIN은 /admin 또는 허용 /admin/**, PORTAL은 / 또는 허용 /portal/**에만 복귀한다. 외부 URL·//·스킴/인코딩 우회·상대 영역·반복 로그인 목적지는 거부하고 자기 시작 경로로 돌아간다. /internal/** 복귀는 디버그 전용 두 주체 계약으로 검증한다.
    admin_authority_guard:
      next_request: 비활성화 커밋 뒤 시작하는 모든 보호 요청은 현재 SYS_USER 존재/USE_YN/기간/잠금/휴면 등 수락 조건을 원천에서 확인한다. dirty 유실·타 노드·같은 날짜의 세션 캐시로 생략하지 않는다. 비활성은401과 해당 ADMIN 세션 무효화이며 PORTAL에는 전파하지 않는다. IP 재검증 정책은 기존 system 계약을 따른다.
      current_permission: 관리 저장/결과 재조회는 보호 경계 안에서 현재 역할·개인 예외·메뉴/API 연결의 유효 권한을 system 공개 포트로 계산한다. 캐시는 메뉴 표시를 돕지만 쓰기 허용 근거가 아니다. 원천 실패는503/효과0이며 0권한 허용 폴백을 쓰지 않는다.
      mechanism: 공유 PostgreSQL 트랜잭션 advisory lock의 예약 2-int 키 (1095321685,1)를 ADMIN_AUTHORITY_V1로 사용한다. 읽기/보호 저장은 shared, 계정 상태·역할/개인권한·메뉴/API 권한 변경은 exclusive를 트랜잭션 시작 시 선택한다. 공유→배타 승격은 금지한다. 숫자 키와 이름은 이 계약이 소유하고 다른 락이 재사용하지 않는다.
      order: 관리 명령 키 보호(있는 경우) → ADMIN_AUTHORITY_V1 → FEAT-040의 달력/월·Portal 정책·참조/부모 순서. system 권한 변경도 같은 보호 키를 모든 변경 경로에서 획득한다. 락 획득 전 읽은 계정/권한은 사용하지 않고 READ COMMITTED에서 획득 후 다시 읽는다.
      commit: 보호 판정과 현재값/HIST/명령 결과 쓰기를 같은 물리 DB 트랜잭션에서 커밋한다. system 판정 포트는 호출자 트랜잭션에 참여하며 REQUIRES_NEW·자기 호출로 경계를 빠져나가지 않는다. 회수 커밋이 먼저면 뒤 저장을 거부, 저장이 먼저면 효과 유지 후 다음 요청을 거부한다.
      read_and_replay: 조회와 원 명령 결과 열람도 shared 보호 구간에서 현재 상태/READ 또는 원 결과 열람에 필요한 액션을 확인한다. 단순 재수신이라고 과거 성공 응답을 무조건 반환하지 않는다. 이미 권한이 유효했던 구간의 반환을 소급 철회하지 않는다.
      failure: 잠금 대기 초과/DB 장애는503 또는 기존 잠금 충돌 분류로 안전 실패하고 자동 업무 재전송하지 않는다. 네트워크/모델/SSO를 보호 잠금 안에서 호출하지 않는다. 기존 SYS_DATA_LOCK 만료·dirty 알림의 성공 여부는 이 보장의 근거가 아니다.
      notification: 커밋 뒤 dirty/세션 종료 통지는 화면의 빠른 갱신과 정리를 위한 보조 처리다. 유실되어도 다음 요청 원천 검사가 차단한다. 반대로 롤백된 상태 변경으로 정상 세션을 영구 종료했다고 기록하지 않는다.
    portal_identity_ports:
      - name: verifyLocalCredentials
        owner: admin / FEAT-005
        input: 배포 LOCAL 모드·정규 로그인 ID·서버 일시·보호된 비밀번호 인수(비기록)
        output: AUTHENTICATED/PASSWORD_CHANGE_REQUIRED 또는 안전한 실패·PORTAL 안정ID·credentialVersion
        transaction: 계정/자격을 같은 순서로 잠그고 실패 횟수·잠금·임시 만료·최근 암호 정책을 검증한다. 성공 시 실패횟수 해제. 비밀번호 해시를 portal로 반환하지 않는다.
      - name: changeOwnLocalPassword
        owner: admin / FEAT-005
        input: 서버 PORTAL 본인 문맥·기대 credentialVersion·현재/새 비밀번호
        output: 새 credentialVersion과 변경 시각, 비밀 없음
        transaction: 기존 암호/재사용 검증·새 해시/별도 암호 이력·세대 증가를 원자 반영한다. 부모 관리 리비전/HIST는 관리 프로필 변경이 아니므로 만들지 않고 비밀 없는 보안 사건만 남긴다. 저장 후 세션 회전 실패는 재로그인으로 회복한다.
      - name: resolveVerifiedExternalIdentity
        owner: admin / FEAT-005
        input: 신뢰 어댑터가 검증한 VerifiedExternalIdentity
        output: 이미 등록/검증 연결된 PORTAL 안정ID·원천 프로필·계정 상태 또는 충돌/미등록
        transaction: sourceKey+subject 유일키로 대조하며 이메일/동명/ADMIN 계정으로 병합하지 않는다. 인증만으로 자동 등록/활성·LOCAL 전환을 하지 않는다. 외부 증거의 소비/재생 방지는 integration 검증 어댑터가 보장한다.
      - name: resolveCurrentPortalAccess
        owner: admin / FEAT-005/006
        input: 서버 PORTAL 주체·operation·대상 자산/매핑 참조·UTC 판정시각
        output: 현재 이용/기간/그룹·필요한 매핑·배정 준비와 거부 사유; 과거 허용 토큰 아님
        transaction: FEAT-040의 Portal 정책 보호·FEAT-045의 월/배정 계약을 따른다. 계정 접근과 개별 대상 매핑/쿼터의 행위별 필요조건을 구분한다.
    external_rollout:
      first: LOCAL은 실제 서버 인증 경로와 독립 계정으로 시험한다. EXTERNAL은 검증 어댑터 인터페이스·원천+subject 충돌·만료/재생/잘못된발급자 거부·인사 사건 계약을 먼저 검증한다. 시험 대역은 테스트 조립에서만 사용한다.
      later: 실SSO 프로토콜·콜백 검증·원천 메타데이터/키 회전·logout 연동은 고객 정보 확보 뒤 별도 integration 슬라이스의 명시 계약/실환경 시험으로 완료한다. 검증기 없는 EXTERNAL 설정은 기동/활성 시 거부한다.
      mode: 배포 모드는 명시 LOCAL/EXTERNAL이다. 실패에 따른 자동 모드 하향은 금지하고 모드 전환/신원 재연결은 별도 검수된 계약 없이는409로 거부한다.
    audit: 인증 성공/실패·로그아웃·계정/권한 회수·자격 변경의 도메인/안정 주체/처리자/대상/시각/안전한 결과코드를 소유 보안 감사 포트에 기록한다. 비밀번호·해시·쿠키·CSRF·SSO 원문은 제외한다. 관리 HIST는 FEAT-040이며 system의 부여/회수 전용 이력 원장은 신설하지 않는다.
    migration: 기존 관리자 인증 쿠키/세션을 ADMIN 전용으로 전환할 때 기존 세션은 재인증시킨다. SYS_USER/기존 비밀번호·권한 데이터는 보존한다. 구 공통 쿠키를 Portal로 수락하는 호환 폴백은 금지한다. 관련 프런트/API/세션 조립은 소유 G3 뒤 같은 배포 단위로 회귀 검증한다.
    integration_g3_scope:
      - 동결한 조립·저장·만료/원자성 계약의 공통 구현과 잠금 버전 호환 시험은 admin_interface_v1.implementation_refs로 연결한다. ENT-252~256/API-301~306/IF-010의 실제 Portal 원장·업무 인증·내부 만료 정리는 후속 SLICE-301/306 범위다.
      - FEAT-302~305의 설정/비밀·그룹 판정·호출/계량·외부 사건 상세와 생산/소비 저장 의존성을 심사한다. integration G2 검증 근거는 ARCH-032/ADR-022/028이며 승인 상태는 project.state.yaml을 따른다. 인증 상세만으로 integration 전체 G3를 닫지 않는다.
      - ASM-003은 ADR-048 승인 기준의 설계 재현을 확인했다. 운영 API 수락은 ARCH-032의 별도 후속이며 고객 SSO의 정확 프로토콜/콜백·실환경 검증은 SLICE-306 선행 조건으로 관리한다.
    entities:
      - ENT-252
      - ENT-253
      - ENT-254
      - ENT-255
      - ENT-256
    portal_session_storage:
      implementation: Portal 제품 어댑터와 integration 공통 v2 조립이 소유한다. JDBC 표준 분리 테이블과 Redis 선택 provider는 session_store_v2를 따른다. 기존 v1은 JDBC로 검증했으며 Redis 실증은 후속이다.
      attributes: PORTAL_SECURITY_CONTEXT(최소 안정 ID·인증 수준·모드), PORTAL_CREDENTIAL_VERSION, PORTAL_CSRF, PORTAL_BROWSER_BIND, schemaVersion만 허용한다. principal index는 PORTAL:<ID>, 익명은 null이다. 비밀번호/원 외부 증거/역할·그룹 입력을 저장하지 않는다.
      defaults: 설계 초기값은 현 ADMIN의 30분 유휴 만료·동시 세션1·신규 로그인 허용 후 기존 세션 종료 정책을 영역별 설정으로 분리 재사용한다. Portal 익명 문맥은10분, 외부 challenge는최대5분이며 증거 만료가 더 빠르면 그 값을 쓴다. 각 값/설정은 integration G3 승인 대상이며 운영 설정은 제품 화면에서 편집하지 않는다.
      config: app.auth.portal.session.timeout/max-sessions/prevent-login, anonymous-timeout, external.challenge-timeout을 계획한다. timeout은 양수, max-sessions>=1, challenge<=anonymous-timeout을 검증한다. 기존 spring.session/app.security는 ADMIN으로 해석하며 Portal에 묵시 합성하지 않는다. 유효 스토어/네임스페이스/TTL·설정 버전만 비밀 없이 기동 로그로 확인한다.
      transactions: Spring Session JDBC 기본 REQUIRES_NEW를 인증 원장과 원자적이라고 가정하지 않는다. Portal 인증 조립은 같은 PostgreSQL DataSource/TransactionManager의 REQUIRED TransactionOperations를 명시 주입하고 성공 세션을 응답 전 명시 flush한다. filter의 뒤늦은 저장에 성공 커밋을 맡기지 않는다. 일반 조회의 최종 접근시각 갱신은 별도 짧은 트랜잭션일 수 있으나 인증 성공/회전/증거 소비 경계를 바꾸지 않는다.
      admission: admin 공개 인증 포트가 LOCAL 로그인은 처음부터 Portal 정책 배타 보호(실패 잠금 변경 포함), EXTERNAL 수락은 정책 공유 보호 → 안정 사용자 행 → 자격 행(LOCAL) 순으로 잠근다. 한 요청 안에서 정책 공유→배타 승격을 하지 않는다. 그 안에서 Portal principal index를 조회해 한도를 적용하고 새 세션 저장/기존 종료/성공 사건을 함께 확정한다. 서로 다른 영역의 principal/세션은 조회하지 않는다.
      rotation: 로그인 성공은 익명 세션을 폐기하고 새 인증 ID/CSRF를 발급한다. 암호 변경은 credential DB+이력+사건을 먼저 확정하고 새 자격세대 세션으로 회전한다. 회전 실패 시 이전 세대는 다음 보호 요청에서401이며 API-304는 PASSWORD_CHANGED_REAUTH_REQUIRED와 재로그인 경로를 반환한다. 원 암호 변경 요청을 자동 재전송하지 않는다.
      concurrency: provider 공통 비교자는 DB grant의 현재 generation/epoch다. JDBC 안에서는 기존 PRIMARY_ID+expected SESSION_ID 부모행 CAS를 함께 유지하고 표준 세션 테이블에 generation 열을 추가하지 않는다. Redis 세대/revision CAS와 복구 수락은 session_store_v2.redis를 따른다.
      expiry: DB의 UTC 현재시각과 EXPIRY_TIME으로 매 수락을 검사하고 청소 지연을 유효 기간 연장으로 해석하지 않는다. heartbeat는 유효 세션만 연장하며 만료/종료한 세션을 부활시키지 않는다. 만료 시 Portal 쿠키/문맥만 정리한다.
      restart: 동일 호환 버전의 다른 노드/재시작에서 복구한다. 역직렬화/버전 불일치는401 재로그인, DB 불가는503이다. 로컬 메모리 세션으로 자동 폴백하지 않는다. 인증 세션 만료는 대화·턴/기록 삭제나 자동 업무 재실행이 아니다.
      cleanup: FEAT-301의 내부 만료 정리가 만료 세션/속성과 challenge/증거를 별도 짧은 청크 트랜잭션으로 정리한다. 기본 매분·1000행, 중단/다중노드 반복 실행은 같은 만료 조건으로 안전하다. 정리 전에 만료 검사로 접근을 막는다.
      reference: 'Spring Session 공식 JDBC 구성: https://docs.spring.io/spring-session/reference/configuration/jdbc.html — 표준 스키마·테이블 분리·트랜잭션 설정의 근거. 프로젝트 잠금 버전으로 실제 조립/반례를 소유 G3 뒤 재검증한다.'
      principal_index: portal 소유 인증 세션 어댑터가 허용한 PORTAL_SECURITY_CONTEXT의 안정 ID로 PORTAL:<ID> 인덱스를 명시 생성한다. 표준 Spring Security 속성 키를 임의 추론한다고 가정하지 않는다. 익명은 null, 인증/회전 저장 때 PRINCIPAL_NAME을 같은 트랜잭션으로 반영하고 종료/만료는 해당 행/인덱스를 함께 제거한다. 설정 시 전용 principal resolver/index writer를 주입하고 두 노드 findByPrincipalName 실조회로 검증한다.
    auth_transactions:
      local_login: CSRF/Origin/모드 검증 → 공개 인증 포트의 정책 배타/사용자/자격 보호 → 비밀번호·계정 조건 검증 → 실패횟수/잠금 또는 성공 해제와 필수 결과 사건. 정상 실패는 횟수/사건 커밋 후 트랜잭션 밖에서401로 변환한다. 실패 사건 저장 자체가 실패하면 횟수/잠금도 같은 트랜잭션에서 롤백하고503이며 인증/자동 재전송은 없다. 성공은 새 세션/기존 종료까지 확정한 뒤 쿠키와 응답을 보낸다.
      external_login: 검증 어댑터의 네트워크/서명 검증은 DB 보호 밖에서 수행한다. 이어 challenge 보호 → Portal 정책/사용자 보호 → 만료/원천/브라우저/현재 계정 재검사 → 증거 UNIQUE INSERT·challenge 소비·새 세션/기존 종료·성공 사건을 한 트랜잭션으로 확정한다. 충돌409·장애503에 과거 증거를 새 로그인으로 자동 재전송하지 않는다.
      password_change: admin 자격 포트가 현재 암호·정책·credentialVersion을 검사하고 새해시/ENT-251/세대+1/PORTAL PASSWORD_CHANGED 사건을 같은 트랜잭션으로 확정한다. 사건은 portal 소유 공개 sink 포트를 호출하며 모듈 Repository를 역참조하지 않는다. 그 후 세션 회전 실패는 확정된 비밀번호를 롤백했다고 안내하지 않는다.
      logout: 해당 Portal 세션 삭제+LOGOUT 사건을 짧은 트랜잭션으로 확정한다. DB 실패면503으로 서버 종료 완료를 주장하지 않는다. 브라우저 쿠키는 해당 영역만 만료할 수 있다. 이미 만료된 세션 요청은401이며 상대 영역에는 영향이 없다.
      audit_failure: 로그인 성공/실패·자격 변경·logout 결과 사건은 각 명령의 필수 저장이다. 사건 저장 실패는 해당 트랜잭션 전체(로그인 실패횟수 포함)를 롤백하고503이다. 정상 로그인 거부401와 감사 장애503을 혼동하지 않는다. 이미 확정된 Portal 암호 변경 뒤 회전 실패는 별도 부분 확정 복구를 따른다. 단순 보호 접근 거부는 감사 장애가 있어도 허용으로 바뀌지 않으며 비밀 없는 장애 지표/알림으로 유실을 식별한다.
      no_round_trip: admin→portal 보안 사건 sink는 append만 수행하고 admin 자격 포트/웹 인증을 재호출하지 않는다. 공개 interface는 중립 contracts에 두고 bootstrap에서 연결하여 제품 모듈 간 순환 참조를 만들지 않는다.
    external_acceptance:
      interface: IF-010. VerifiedExternalIdentity는 브라우저 DTO가 아니라 등록된 검증 어댑터의 서버 내부 결과다. sourceKey+subject와 issuer/audience·증거지문·검증/만료시각·challenge/nonce 바인딩을 포함하며 서명 성공만으로 계정 이용을 허용하지 않는다.
      challenge: 서버 CSPRNG의 state/nonce/브라우저 바인딩 난수는256비트 이상. 원문은 브라우저/프로토콜 필요 경로에만 전달하고 DB에는SHA-256만 저장한다. 서버 허용 Portal 복귀 경로는 시작 시 고정하며 콜백이 덮어쓸 수 없다.
      consumption: ENT-254를 행 잠금해 미소비/유효 기한·원천·브라우저 일치를 재검사한다. ENT-255의 sourceKey+evidenceDigest는 원천 발급자·어설션 식별/nonce의 정규 길이 구분 표현으로 지문을 만든다. 원천이 재사용 가능한 토큰만 제공하면 일회 challenge와의 바인딩을 검수하기 전 운영 수락을 열지 않는다.
      expiry: proofExpiresAt과 challengeExpiresAt의 더 빠른 시각까지 소비를 허용한다. 만료 뒤 증거 행을 지워도 오래된 proof/challenge는 다시 수락하지 않는다. 임의 유효기간 연장/시계오차 은폐는 금지한다.
      recovery: 성공 후 응답 유실에 같은 proof를 재제출하면409다. 새 challenge/정상 인증으로 복구하고 기존 세션은 영역 동시 세션 정책을 따른다. 고객 IdP 동작 때문에 반복 사용을 허용해야 하면 별도 변경 검토가 필요하다.
      customer_boundary: 정확 프로토콜·콜백 method/path·issuer/audience·키/신뢰 저장/회전·PKCE 또는 동등 바인딩·외부 logout은 고객 어댑터 설계에서 정한다. 미설정 EXTERNAL 기동/활성은 거부한다. 선행 시험 대역을 운영 verifier 빈으로 등록할 수 없게 조립 검사를 둔다.
    auth_audit:
      destination: ENT-256의 Portal 전용 보안 사건이다. system SYS_LO_LOGIN/ACCESS는 ADMIN 현재 소유를 유지하고 Portal ID를 USER_ID에 대입하지 않는다. 향후 감사 UI는 공개 조회 계약으로 연결하며 지금 만들지 않는다.
      append: EVENT_KEY는 서버가 한 요청 실행을 시작할 때 생성해 내부 append 호출에 전달하는 UUID·UNIQUE, AUTH_EVENT_ID는 SYS_SEQUENCE다. 같은 실행 안의 append 재시도만 같은 키를 유지한다. 별도 HTTP 재요청은 별도 인증 시도/새 사건이며 이전 키를 알아낸다고 가정하지 않는다. 외부 증거 중복은 ENT-255, 자격 변경은 기대 credentialVersion으로 별도 차단한다. DB 확정 불명에 인증 명령을 자동 반복하지 않는다. 사건키에 비밀을 넣지 않는다.
      retention: 인증 로그의 기존 정책과 같은365일을 Portal 초기 보존값으로 제안한다. 자동 파기는 아카이브/고객 보존 정책·복구 검수 전 비활성으로 둔다. FEAT-301의 내부 만료 정리는 보안 사건을 삭제하지 않으며 소유 후속 파기 작업에서 보존 종료/조사 보호·아카이브 확인 뒤 청크 파기한다. 이 활성화는 고객 운영 인수 조건이다.
      access: 추가/조사 읽기/파기 권한을 분리한다. 선행 관리 화면 CRUD/전체 HIST·인증 API에 사건 원장을 노출하지 않는다. 로그와 백업은 같은 접근/암호화 운영 정책을 적용한다.
    migration_detail:
      prepare: 기존 SYS_USER/권한/SPRING_SESSION 스키마는 보존하고 Portal ENT-252~256만 새 Liquibase로 추가한다. 스키마 먼저 적용하되 새 인증 경로는 검수 전 닫는다.
      cutover: 영역 없는 현 세션 형식과 새 형식은 같은 트래픽 구간에 혼용하지 않는다. ADR-028의 비호환 전환으로 신규 접수 차단·배출 확인 후 노드/프런트를 같은 호환 버전으로 전환한다. 관리자 기존 세션을 종료하고 ADMIN 전용 쿠키/CSRF로 재인증한다. 일반 순차 배포가 무중단이라고 주장하지 않는다.
      rollback: session_store_v2.transition을 따른다. 같은 v2 artifact의 provider 되돌림은 새 epoch/전체 재로그인으로 구 provider 자료를 불수락한다. 원장 검사가 없는 v1 바이너리 rollback은 진입 차단·양 provider payload 무효화 검증을 별도 수행한다. 자격/이력/원장은 DROP하거나 과거로 되감지 않는다.
      acceptance: 기존 두 노드/영역·현재 권한·late write/비밀/복구 시험에 session_store_v2.verification의 설정 전환·DB/Redis 독립 장애·snapshot/epoch·관리참조 검증을 추가한다. v1 시험을 v2 실제 Redis/제품 소비 완료로 표시하지 않는다.
    shared_session_adapter:
      owner: integration의 영역 공통 SessionPersistencePort/필터 조립을 ADMIN과 PORTAL에 각각 인스턴스화한다. system은 ADMIN 저장소용 어댑터를 공개 포트로 호출하고 Portal은 자기 저장소만 호출한다. 서버 입력 domain/SessionRef는 검증된 문맥에서만 만든다.
      repositories: 선택 provider는 session_store_v2.selection/neutral_types를 따른다. JDBC ADMIN/PORTAL은 같은 AI DB/REQUIRED로 표준 테이블/주체 인덱스를 분리한다. Redis는 원장/업무만 같은 DB REQUIRED이며 payload는 DB 확정 후 별도 발행·활성화한다. 모든 store를 같은 물리 DB 커밋으로 가정하지 않는다.
      operations: load(domain,sessionId) -> Current(snapshot,ref)|Absent|Expired|Unavailable; prepareCsrf(ref) -> Prepared(CsrfIssue)|Stale|Unavailable; createAnonymous(AnonymousSessionCreation) / createAuthorized(AuthorizedSessionCreation) -> Created(PersistedSession,CsrfIssue)|Rejected|Unavailable; updateExisting(ref,SessionDelta) -> Applied|Stale|Unavailable; rotate(ref,AuthorizedSessionRotation) -> Rotated(PersistedSession,CsrfIssue)|Rejected|Stale|Unavailable; delete(ref) -> Deleted|Stale|Unavailable. 일반 요청 flush는 updateExisting만 호출하고 생성/회전 권한이 없다. 반환 성공은 커밋 확인 전 결과이며 HTTP 발급은 commit_delivery를 따른다.
      late_write: 공통 grant/generation/epoch 확인과 기존행만 갱신하는 CAS가 필수다. JDBC의 PRIMARY_ID+expected SESSION_ID/기한·부모행 잠금은 유지하고 Redis는 존재/현재 generation/revision 조건으로만 갱신한다. 부재/낡은 세대의 insert/upsert는 금지한다. 세부는 session_store_v2다.
      flush: 명시 생성/갱신/회전/종료가 시작되면 요청 wrapper를 PENDING_COMMIT으로 바꾼다. commit_delivery의 완료 상태 뒤 filter는 별도 save를 하지 않는다. 일반 읽기 요청만 기존행 updateExisting을 사용하며 Stale이면 폐기한다. 이미 확정한 업무 효과를 세션 flush 오류 때문에 자동 재실행하지 않는다.
      admin_password: ADMIN 배타 보호·현재 본인/세션 검사는 유지한다. JDBC는 암호/이력/이전 세대 폐기/새 payload까지 같은 물리 커밋이다. Redis는 DB 자격/이력/이전 세대 폐기 확정 뒤 새 발행 실패 시 새 암호 재로그인이다. session_store_v2의 분산 확정·단일 writer·불명 결과를 적용하며 원 변경 명령을 재실행하지 않는다.
      admin_current_session: ADMIN 보호 판정 포트는 계정/액션뿐 아니라 서버에서 받은 해당 sessionRef가 현재 저장소에 존재하고 만료/회전/종료되지 않았는지도 같은 보호 구간 안에서 재확인한다. 요청 시작 SecurityContext만으로 killSession 이후의 저장을 허용하지 않는다.
      wiring_check: v1 startup_assertions의 영역/단일성·정확 카탈로그/무자격 주입 금지는 유지한다. v2는 선택 provider/DB 설정판/원장 REQUIRED와 JDBC 참여 또는 Redis 후처리 capability를 구분해 검사한다. 새 조립 반례는 SLICE-308, 실제 소비는 SLICE-520/301이다.
      csrf_prepare: 현재 부모 행/기대 SESSION_ID·만료를 잠금 안에서 확인한다. 유효 세션의 세대/주체/인증 수준은 유지하고 기존 CSRF 비밀을 같은 영역 writer에만 재발급한다. 비밀이 없으면 생성·저장 확정 뒤 발급한다. 일반 getCsrf마다 토큰을 회전해 다른 탭을 무효화하지 않는다. 이미 폐기된 세대는 새 인증 문맥으로 부활시키지 않는다.
      commit_delivery:
        transaction_owner: HTTP 조립의 바깥 경계가 인증/세션 참여 트랜잭션의 최종 commit 완료를 확인한다. 참여 서비스가 반환했다는 이유로 commit 완료로 보지 않는다. TransactionSynchronization의 afterCompletion(COMMITTED)로 발급 가능 결과를 표시하고 HTTP 응답 작성은 그 뒤 한 writer가 한 번 수행한다. rollback/UNKNOWN에서 쿠키를 발급하지 않는다.
        response: 명령 트랜잭션이 끝날 때까지 인증 응답 헤더/body를 flush/stream하지 않는다. DB commit 후 writer/직렬화/연결 종료 실패는 이미 저장된 암호·세션을 보상 롤백하거나 자동 재실행하지 않는다. 클라이언트는 상태 확인 또는 새 로그인으로 복구하며 서버는 비밀 없는 응답 전달 실패 근거를 남긴다.
        failure: 커밋 전 실패는 전체 롤백·신규 쿠키0, 커밋 결과 불명은 성공/쿠키 발급 없이 안전 실패·자동 재시도0. 서버가 commit 확인을 못 했어도 DB 반영 가능성이 있으므로 변경 미반영이라고 단정하지 않는다.
        permit: permit/rotation admission은 단일 요청·단일 트랜잭션 시도에만 유효하다. 롤백 뒤 같은 인메모리 증거를 재사용하지 않고 새 자격/현재 상태 확인부터 시작한다. 서버 내부 타입을 브라우저 재시도 키로 사용하지 않는다.
    admin_interface_v1:
      version: admin-auth-boundary/v1
      status: v1/JDBC baseline 구현·SLICE-307 G4 완료 사실이다. CR-036의 provider 독립 v2는 session_store_v2에 정의하며 이 v1 타입/물리 원자성을 Redis에 그대로 전이하지 않는다. 실제 소비는 v2 변경 상세 승인 뒤 이행한다.
      ownership: 중립 contracts의 순수 Java 입력/결과와 bootstrap 조립은 integration, ADMIN 계정/권한 조회·자격 변경 callback은 system이다. 서블릿/SDK/JPA 엔티티나 상대 Repository를 인터페이스에 노출하지 않는다.
      types: AuthDomain=ADMIN|PORTAL; PrincipalRef={domain,subjectId}; SessionRef={domain,primaryId,sessionId}. primaryId/sessionId는 서버 저장소에서 얻은 불투명 값이고 브라우저 본문으로 신뢰하지 않는다. CurrentAdminContext={principal,sessionRef,operationId,requiredAction,requestTraceId}; operationId는 정확 method/path에 연결한 서버 등록 키다.
      guard: AdminAuthorityPort.withShared(context,callback) / withExclusive(context,callback). callback 이전에 현재 세션/계정/액션을 검사하고 같은 DataSource/TransactionManager REQUIRED 보호 트랜잭션에서 실행한다. 보호 모드는 FEAT-501.guard_modes의 서버 정적 매핑이며 클라이언트가 지정하지 않는다. public login/recovery는 별도 검증된 자격 문맥으로 exclusive를 진입한다.
      persistence: load(domain,sessionId) -> Current(snapshot,ref)|Absent|Expired|Unavailable; prepareCsrf(ref) -> Prepared(CsrfIssue)|Stale|Unavailable; createAnonymous(AnonymousSessionCreation) / createAuthorized(AuthorizedSessionCreation) -> Created(PersistedSession,CsrfIssue)|Rejected|Unavailable; updateExisting(ref,SessionDelta) -> Applied|Stale|Unavailable; rotate(ref,AuthorizedSessionRotation) -> Rotated(PersistedSession,CsrfIssue)|Rejected|Stale|Unavailable; delete(ref) -> Deleted|Stale|Unavailable. 일반 요청 flush는 updateExisting만 호출하고 생성/회전 권한이 없다. 반환 성공은 커밋 확인 전 결과이며 HTTP 발급은 commit_delivery를 따른다.
      failures: guard의 InactiveOrInvalidSession=401, Forbidden=403, Unavailable=503. DB 오류는 비밀 없는 내부 형식으로 바꾸며 인증/쓰기 자동 재실행을 하지 않는다. persistence Stale은 기존행 갱신 폐기/재인증이며 INSERT나 인증 성공으로 치환하지 않는다. API-601의 unavailable은 AUTH_CONTEXT_UNAVAILABLE이다.
      completion: shared_session_adapter.commit_delivery가 커밋 확인·단일 HTTP writer·롤백/응답 유실을 소유한다. ADMIN 자격/이력/세션은 같은 DB 원자성, Portal 자격 확정 뒤 회전 실패는 기존 부분 확정 복구다.
      compatibility: 승인 시 계약 버전을 고정한다. 서명·원자성·오류/세션 의미를 바꾸면 integration 및 영향 system CR/재검토가 필요하다. SLICE-307의 대역 계약시험 뒤 SLICE-520의 실제 ADMIN HTTP/DB 시험을 통과해야 구현 완료다.
      acceptance: 'TC-30116/30117·TC-50112/50114·TC-5038: 영역 오배선/REQUIRES_NEW 분리/없는행 재생성/중복 필터를 주입하면 실패해야 한다. TC-30118~30120: 인증 세션의 getCsrf 불변, 회전 증거의 요청/세대 결합, commit/rollback/UNKNOWN/응답 writer 실패를 반대로 구현하면 실패해야 한다.'
      placement:
        neutral: 'sources/backend/core/src/main/java/com/aiagent/core/security/에 순수 Java PrincipalRef·SessionRef·생성/결과 타입과 SessionPersistencePort·AdminAuthorityPort를 둔다. 기존 core→support/domain/api→system 의존 방향을 유지하며 새 Gradle 모듈은 만들지 않는다. 서블릿/Security/JDBC 객체는 이 계약에 넣지 않는다.'
        adapters: 'sources/backend/api/src/main/java/com/aiagent/api/auth/boundary/에 영역 dispatcher·Session/SecurityContext/CSRF HTTP 조립을 둔다. ADMIN 원장/권한 구현은 com.aiagent.system.public.auth/authz, 미래 PORTAL 인증 수락은 portal 소유 public 계약으로 연결한다. system 내부 Repository를 공통 api에서 호출하지 않는다.'
        composition: AuthBoundaryAssembly.create가 공개 포트와 자원을 받아 단일 경계 필터를 만든다. bootstrap의 실제 설치·기존 system 소비 교체는 SLICE-520, Portal 생산 연결은 SLICE-301/306이다. verifyInstallation으로 자동 기본 필터·무자격 전역 저장소·중복 설치를 거부한다.
      implementation_refs:
        neutral: sources/backend/core/src/main/java/com/aiagent/core/security/SessionPersistencePort.java
        admission: sources/backend/core/src/main/java/com/aiagent/core/security/SessionAdmissions.java
        request_state: sources/backend/core/src/main/java/com/aiagent/core/security/RequestPersistenceState.java
        assembly: sources/backend/api/src/main/java/com/aiagent/api/auth/boundary/AuthBoundaryAssembly.java
        persistence: sources/backend/api/src/main/java/com/aiagent/api/auth/boundary/JdbcSessionPersistence.java
        response: sources/backend/api/src/main/java/com/aiagent/api/auth/boundary/DeferredAuthResponse.java
        tests: sources/backend/api/src/test/java/com/aiagent/api/auth/boundary/SessionBoundaryTest.java
      implementation_binding:
        attempt: JdbcSessionPersistence.inTransaction이 요청을 실제 트랜잭션 시도에 결합한다. HTTP 조립이 이를 호출하며 포트를 직접 쓰는 소비자도 같은 경계를 사용한다. admission 발급 전에 연결하고 저장이 없던 롤백도 시도를 종료한다.
        authority: AuthorityBinding은 persistence와 같은 DataSource/TransactionManager를 요구한다. 실제 authority callback 진입에서도 연결 자원을 대조해 내부 REQUIRES_NEW가 업무를 먼저 확정하지 못하게 한다.
        delivery: 명시 결과를 respondAfterCommit으로 등록한다. DeferredAuthResponse는 업무의 redirect/error/flush·직접 세션/쿠키 우회를 거부하고 최종 커밋 뒤 영역 writer만 쿠키를 전달한다. 로그아웃 만료 쿠키는 Max-Age=0이다.
        clock: 부모 세션 행의 DB 현재 시각과 만료를 함께 판정한다. 표준 Spring Session 저장 형식/직렬화를 유지하되 애플리케이션 시계에 의한 findById 자동 삭제로 DB 유효 세션을 지우지 않는다.
        scope: 현재 시험의 업무 자격/권한 생산자는 명시 대역이다. 실제 system 계정/암호 이력과 권한 캐시 변환은 SLICE-520, Portal 물리 스키마/확정 자격 복구는 SLICE-301/306의 소비 계약이다.
      structured_types:
        AnonymousSessionCreation: domain·requestTraceId·serverIssuedCreationPermit·expiresAt. 정확 getCsrf 경로가 발급한 요청 수명 permit만 허용하며 principal/authLevel/브라우저 입력을 받지 않는다.
        AuthorizedSessionCreation: 검증된 CredentialAdmission·허용 표시/언어·서버 정책으로 제한한 sessionExpiresAt. domain/PrincipalRef/authLevel/authenticatedAt/LOCAL PORTAL credentialVersion은 admission에서만 가져오며 중복 입력을 받지 않는다. ADMIN에는 새 자격 버전 필드를 만들지 않는다. 검증 결과 expiresAt과 새 세션 만료를 구분한다.
        SessionDelta: 기존 SessionRef와 lastAccessedAt·허용 표시명/언어·서버 계산 권한 cache snapshot/dirtySeen만 제공하는 구조화 타입. domain/주체/세션ID/CSRF/인증수준/자격세대의 변경은 금지한다. 임의 속성 Map 또는 raw SecurityContext를 공개 입력으로 받지 않는다. 권한 캐시는 현재 원천 판정을 생략하는 근거가 아니다.
        PersistedSession: 서버 내부 SessionRef·expiresAt·인증 수준과 허용 주체 뷰. ID는 로그/toString/HTTP DTO로 직렬화하지 않는다. 실제 저장 성공/트랜잭션 참여 결과이며 커밋 완료 전 응답 발급을 허용하지 않는다.
        CsrfIssue: domain·서버 고정 cookieName/headerName·CSRF 비밀과 session cookie 발급 참조. 비밀/세션ID는 영역 HTTP writer만 소비한다. API-601/301 JSON에는 csrfHeaderName만 보내고 토큰은 영역 쿠키로 전달한다. 일반 DTO/HIST/trace/예외에 넣지 않는다. 비밀 holder의 toString은 마스킹하고 디버그/자동 직렬화를 금지한다. 쿠키 응답을 작성하는 명시 writer 외에는 원값을 꺼내 전달하지 않는다.
        RequestPersistenceState: OPEN/PENDING_COMMIT/PERSISTED/CLOSED. 명시 세션 쓰기 후 PENDING_COMMIT에서 filter 자동 flush를 막는다. commit 확인 뒤 생성/갱신은 PERSISTED, 종료/구 회전 참조는 CLOSED다. rollback/commit 결과 불명도 해당 요청은 CLOSED로 마감해 늦은 재생성/재회전을 차단하되 DB 롤백으로 살아 있는 원 세션을 별도 삭제하지 않는다.
        CredentialAdmission: 서버 전용 불투명 LOGIN/RECOVERY 수락 결과. domain·PrincipalRef·authLevel·authenticatedAt·검증 생산자/방식·requestTraceId·entrySessionRef·expiresAt·단일 소비 permit, LOCAL PORTAL만 credentialVersion. entrySessionRef는 dispatcher가 검증한 기존 세션/세대이며 브라우저 제출 값이 아니다. 콜백 프로토콜이 무세션이면 검증된 브라우저 바인딩 증거와 명시 ABSENT를 사용한다. 정확 로그인/복구 검증 생산자만 발급하며 원 비밀번호/외부 evidence/토큰은 제외한다. 브라우저 입력/직렬화/로그 재생 금지. createAuthorized는 같은 실행/영역/주체·만료/미소비를 같은 보호 트랜잭션에서 대조한다. createAuthorized는 존재하는 entrySessionRef의 현재 세대를 확인하고 이전 세션 폐기와 새 세션/CSRF 저장을 같은 트랜잭션에서 수행한다. 낡은 entry 참조면409이며 이전 세션과 새 세션을 동시에 유효하게 두지 않는다. 현재 계정/권한 검사는 생략하지 않으며 이를 암호 변경 회전 증거로 재사용하지 않는다.
        AuthorizedSessionRotation: 현재 검증된 SessionRef와 RotationAdmission·허용 표시/언어·정책 sessionExpiresAt. 로그인으로 익명 세션을 바꾸는 것은 createAuthorized 안의 익명 폐기/새 생성이며 rotate는 인증 세션의 자격 변경 후 회전이다.
        RotationAdmission: 서버 자격 변경 생산자만 발급하는 요청 수명 불투명 증거. PASSWORD_CHANGE/RESET 완료 근거, domain/PrincipalRef/expectedSessionRef/requestTraceId, 이전/새 authLevel, 검증시각/소비기한, LOCAL PORTAL의 변경 후 credentialVersion, 단일 소비 permit. ADMIN은 암호·이력 저장과 같은 보호 트랜잭션에서, Portal은 확정된 새 자격세대를 현재 원천에서 재확인해 발급한다. 원 비밀번호/해시를 포함하지 않는다. 다른 세션/요청/세대·LOGIN 증거 재사용은 무저장 거부다.
      repository_binding:
        principal_keys: ADMIN 인덱스 키는 기존 SYS_USER.USER_ID 원문, PORTAL은 PORTAL:<stableId>다. PrincipalRef의 영역 표시와 ADMIN 기존 인덱스 문자열을 혼동하지 않는다.
        injection: ADMIN FindByIndexNameSessionRepository/SessionRegistry 조회는 명명 qualifier 또는 ADMIN 전용 조회 포트로 SecurityConfig.sessionRegistry·AuthzInvalidator·UserSessionService에만 주입한다. PORTAL 저장소를 전역 기본/Primary로 노출하지 않는다. 두 저장소가 있어도 무자격 타입 자동 선택·상대 인덱스 조회가 없어야 한다.
        transaction: v1 baseline은 두 영역 JDBC가 같은 AI DB/REQUIRED다. v2 JDBC도 이를 보존하며 Redis의 원장/자격 DB와 외부 payload를 분리한다. SYS_LO_LOGIN의 독립 실패 정책은 계속 FEAT-501.login_failure_commit을 따른다. v2 분산 발급은 session_store_v2다.
      source_transition:
        security_chain: 현재 단일 SecurityFilterChain과 /api/public/** permitAll·CSRF ignore를 정확 카탈로그/영역 조립으로 교체한다. unknown method/path는 닫고 API-501 로그인도 자기 영역 CSRF/Origin을 검사한다. API 전체 prefix 허용을 남기지 않는다.
        interceptor: dispatcher는 SecurityContext 로드·CSRF·MVC 인가보다 먼저 영역을 정한다. PORTAL/NONE은 system AuthorizationInterceptor/ADMIN SecurityContextRepository에 진입하지 않는다. ADMIN interceptor는 ADMIN adapter 뒤에서만 실행한다. InterceptorConfig의 전역 등록도 같은 대상 영역으로 제한한다.
        consumers: SecurityConfig의 기본 HttpSessionSecurityContextRepository, LoginService의 saveContext/직접 HttpSession 쓰기, SessionPrincipal의 new HttpSessionSecurityContextRepository를 SLICE-520에서 ADMIN adapter 경로로 교체한다. 영역 adapter 밖의 직접 세션 생성/독립 saveContext를 허용하지 않는다.
        login_admission: 정확 경로의 CSRF/Origin 확인→system의 exclusive guard 안에서 현재 계정/자격 검증과 실패횟수 또는 성공 수락→검증된 LOGIN admission의 1회 소비다. JDBC는 영역 세션과 같은 물리 커밋, Redis는 PENDING의 1차 DB 커밋까지 보호한다. Redis는 모든 잠금 해제 뒤 요청에 결합한 publication으로 저장하고 새 보호/짧은 REQUIRED에서 현재 계정/권한·epoch·PENDING·접속 한도를 재검사해 ACTIVE를 확정한다. 선택 provider의 최종 확정 뒤 단일 cookie writer를 사용한다. 종료 admission 재사용0·잠금 안 네트워크0이며 SYS_LO_LOGIN은 기존 login_failure_commit 정책을 유지한다. 세부 프로토콜은 session_store_v2다.
        mutations: SLICE-520은 AuthController.changePassword의 제한 플래그 직접 제거, LoginService.logout의 invalidate, SessionEvictedStrategy의 invalidate, AuthorizationInterceptor의 비활성 세션 invalidate를 rotate/delete와 요청 완료 상태로 이행한다. 현재 소스 동작은 새 원자성 보장의 근거가 아니다. 단순 getSession(false) 읽기는 dispatcher 뒤 ADMIN 전용인지 검증하고 전면 삭제하지 않는다.
      startup_assertions:
        - 활성 영역의 session/CSRF cookie와 header가 session_isolation의 정확 이름이며 중복0. HostOnly·HttpOnly 구분·Path=/·SameSite=Lax, 비local 운영 HTTPS Secure 필수. local HTTP 예외만 명시 프로파일로 허용한다.
        - ADMIN/PORTAL repository와 principal resolver 각1개, 테이블/인덱스 prefix가 일치하고 기존 ADMIN 인덱스 소비자는 ADMIN qualifier로만 주입된다.
        - v1/JDBC의 domain→DataSource/TransactionManager/REQUIRED 동일성을 확인한다. v2는 ADMIN guard/원장 DB의 동일 REQUIRED와 선택 provider capability를 검증한다. Redis payload를 같은 DB인 것처럼 조립하거나 DB 잠금 안에서 네트워크를 호출하면 실패다.
        - 한 요청은 해당 영역의 SessionRepositoryFilter/SecurityContext/CSRF 조립을 정확1회 거친다. 자동 기본 filter와 명시 filter가 중복 등록되면 기동 실패다.
        - 정확 API 카탈로그의 영역/공개/CSRF/인증수준/액션 매핑이 빠지거나 충돌하면 기동 실패다. PORTAL 경로가 ADMIN interceptor에 매핑되거나 넓은 public 예외가 있으면 실패다.
        - 공통 진입부/소유 전환 소비자에서 전역 무자격 repository 주입·직접 raw session 생성/독립 SecurityContext 저장0을 구조 검사한다. 반례 조립과 실제 HTTP 두 영역 경계는 TC-30116/30117로 검증한다.
      integration_review:
        reviewed_at: '2026-11-10'
        result: 기술 소유 검토 완료. 두 저장소/dispatcher·세션 생성/회전 타입·현재 소스 교체·트랜잭션/기동 검증의 5건과 재검토에서 찾은 CredentialAdmission 정의·CSRF 비밀 출력 경계와 인증 세션 CSRF 보존·암호 변경 회전 증거·최종 commit 뒤 단일 cookie writer·직접 세션 변경 경로를 보완했다. 로그인 entry 세대 폐기와 새 세션/이전 CSRF 거부 반례까지 연결했다. 소유 G3 동결 뒤 공통 조립의 실제 HTTP/DB 시험은 implementation_refs로 연결했다. 실제 업무 소비 시험은 후속이다.
        evidence: 현재 SecurityConfig·AuthzInvalidator·UserSessionService·AuthorizationInterceptor·InterceptorConfig·SessionPrincipal·LoginService 및 기존 Gradle 의존 방향을 읽어 대조했다.
        scope: ADMIN 소비에 필요한 v1의 입력/결과·오류·세션 생성/CSRF·현재 권한/트랜잭션·주체 인덱스·기동 단일성을 검토했다. Portal 원장/실SSO와 FEAT-302~305 전체 G3 검토를 대신하지 않는다.
        pending: 동결한 계약 판의 공통 G4 확인 뒤 system SLICE-520 실제 소비 시험을 수행한다. system G3 승인 범위와 기존 정책을 따르며 불호환 수정은 영향 system 계약과 함께 CR로 처리한다.
