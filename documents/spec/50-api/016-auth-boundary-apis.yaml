    implementation: planned
    method: POST
    path: /api/common/portal/auth/changePassword
    action: AUTHENTICATED
    summary: Portal 본인 비밀번호 변경
    request: PortalPasswordChange
    response: ApiResponse<PortalAuthState>; 회전 Set-Cookie
    contract: FEAT-301.types/request_boundary/portal_session_storage/auth_transactions. UC-045의 정상/대안/예외와 연결하며 API-301/302 외에는 PORTAL 세션이 필수다.
