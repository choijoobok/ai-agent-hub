      '429': 인증 시도 제한
      '503': 원천/세션/필수 사건 저장 불가
    partial_commit: 자격 변경 확정 뒤 회전 실패는503 PASSWORD_CHANGED_REAUTH_REQUIRED. 새 암호 재로그인으로 복구하며 변경 미반영으로 표시하거나 자동 재전송하지 않는다.
    allowed_auth_levels:
