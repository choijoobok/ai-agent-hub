  FEAT-024:
    physical_contract:
      implementation: implemented
      source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/searchtag/SearchTagService.java
      completion: CR-048. 정의 생산·이력·연결 포트 완료 범위이며 실제 지식 연결·agent 검색과 SCR-047는 후속 소유다.
      read: getList는 공통 offset SearchRequest(기본 tagId 오름차순)·PageResponse다. searchText contains는 v1 정규화 뒤 대표어/동의어를 함께 검색하고 tagId eq·useYn eq 및 감사 시각 정렬을 지원한다. 목록에서 참조를 조회하지 않는다.
      detail: getOne={tag,synonyms}; getReferences={revision,state,rows,reference}. state는 READY/NOT_CONNECTED/UNAVAILABLE/FORBIDDEN, reference는 PRESENT/ABSENT/UNKNOWN이다. rows의 knowledgeId/knowledgeNm/revision/activeYn만 노출하며 다른 판을 합치지 않는다.
      command: ManagedCommand scope=definition. values={searchText,useYn:Y|N,synonyms:[{synonymId 또는 clientKey,searchText,description:null|string}]}. 정규화 값/감사 필드/다른 부모 키는 직접 제출하지 않는다. remove의 values는 빈 객체다. 독립 부모는 독립 명령으로 부분 성공을 유지한다.
      result: save는 공통 ManagedResult의 필드와 createdIds(clientKey→synonymId)를 반환한다. 공통 원장은 유지하고 동일 명령의 정확 HIST에서 매핑을 재현한다. NO_CHANGE는 빈 createdIds다. remove는 ManagedResult다.
      locks: 모든 정의/삭제와 지식 참조 연결은 SEARCH_TAG_NAMESPACE/all 경계 뒤 안정 태그 잠금 순서를 공유한다. 지식 소유자는 같은 쓰기 트랜잭션에서 자기 부모 잠금보다 먼저 SearchTagService.requireExisting을 호출하고 링크 저장까지 유지한다.
      failures: 의미 입력/정규화 중복/다른 부모 동의어 재귀속422. 공통 명령 형식400, 현재 권한403, 낡은 판/현재 참조409, 저장/이력/참조 검사 원천 실패503. 실패는 현재값·전체 HIST·원장 모두 무효과다.
      consumer: SearchTagContent current는 등록 소비 원천의 현재 권한/상태와 호출자가 제공한 허용 ID를 확인하며 ON 정의의 정확 판을 보호한다. exact는 같은 소비자가 보호한 당시 판만 반환하고 정규화 버전은v1이다. 검색·지식 권한 판단 자체는 후속 소유다.
      screens:
        SCR-010:
          root: ENT-132
