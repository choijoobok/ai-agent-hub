  - id: API-601
    feature: FEAT-501
    implementation: planned
    method: GET
    path: /api/public/system/auth/getCsrf
    action: PUBLIC
    summary: 관리자 익명/인증 CSRF 문맥 준비
    request: none
    response: ApiResponse<{csrfHeaderName}>; ADMIN Set-Cookie
    auth_domain: ADMIN
    contract: FEAT-301.request_boundary.dispatcher/FEAT-501.auth_precondition. 익명 문맥만 생성하며 인증 주체를 만들지 않는다. 저장 실패503, 상대 영역 문맥을 읽거나 종료하지 않는다.
    errors:
      - http_status: 503
        code: AUTH_CONTEXT_UNAVAILABLE
        meaning: ADMIN 익명/현재 CSRF 문맥 조회 또는 저장 불가. 새 쿠키/인증 성공을 반환하지 않는다.
        retry: 사용자 재시도는 새 문맥 준비이며 인증 명령을 자동 반복하지 않는다.
    error_response: 현재 ApiResponse 실패 외형을 사용하고 의미 코드는 AUTH_CONTEXT_UNAVAILABLE로 고정한다. 화면 메시지는 MSG 키로 연결하며 예외 전문/세션ID/CSRF 값은 본문에 넣지 않는다. FEAT-301.admin_interface_v1의 unavailable 결과를 HTTP503으로 변환한다.
