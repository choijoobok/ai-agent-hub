feature_contracts:
  FEAT-005:
    design_status: approved
    delivery_boundary: CR-044. 독립 원장·관리/자격·현재 접근 공개 포트와006/042 실제 연결은005, 세션301·외부 수신/SSO305/306·대상 후보001/002·배정017/045·추가 토큰018은 각 소유 생산 연결로 검증한다. 미설치/미상과0·미설정을 구분하며 실제 소비 완료로 과장하지 않는다.
    implementation: partial
    reqs:
      - REQ-103
      - REQ-116
      - REQ-609
      - REQ-616
    usecases:
      - UC-023
      - UC-024
    entities:
      - ENT-101
      - ENT-103
      - ENT-104
      - ENT-106
      - ENT-251
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/portal/
    implementation_evidence: PortalUserLiveTest·PortalExternalLiveTest·PortalDefinitionTest 및 portalUserApi.test.ts. 외부 Directory/보안 사건 생산자는 시험 대역이며 실제 세션301·고객 연동305/306은 후속이다.
    storage: FEAT-040을 적용한다. Portal 안정 ID는 서버 자동 번호이며 관리자 SYS_USER.USER_ID와 FK/자동 연결하지 않는다. 프로필/이용 조건·그룹·신원 매핑·월별 등급의 실제 저장 범위를 원 화면대로 구분한다. 외부 소유 프로필을 관리자 입력으로 덮지 않는다.
    membership: ENT-103 하나가 Portal 사용자와 그룹 양쪽 화면의 동일 소속 원천이다. 사용자/그룹 편집 경로 모두 같은 접근 정책 잠금·Portal 부모 기대 리비전·전체 HIST에 참여한다. 역조회 네 자산 탭과 사용자 그룹 탭을 별도 매핑 원장으로 복제하지 않는다.
    last_group: REQ-616/103대로 소속은 물리 삭제하지 않는다. 마지막 활성 소속 회수는 이용자 비활성화를 명시 복합 저장에 함께 포함하거나 거부한다. 소속/자산 매핑의 활성과 그룹 정의의 조회 전용 사용 상태를 구분한다.
    principal: 인증영역 ADMIN/PORTAL과 해당 영역 안정 ID를 함께 전달한다. 관리자는 ADMIN 처리자, 관리 대상은 PORTAL 계정이다. 내부 호출도 서버가 수락한 주체 컨텍스트를 받으며 프론트가 보낸 userId·운영용 플래그를 신뢰하지 않는다.
    access_contract:
      input: PORTAL principal·소유 기능·대상 자산/필드·접근/실행 목적·신뢰된 서버 시각
      evaluation: 현재 Portal 존재/활성/사용기간 → 활성 소속 그룹 → 자산의 활성 허용 그룹 교집합 → 행/컬럼/응답 정책 → 필요한 대상 신원 매핑. 모델/쿼터 조건은 별도 결과로 결합하며 그룹과 등급을 혼합하지 않는다.
      output: ALLOW/DENY/UNAVAILABLE, 안정 계정 ID, 계정/정책 리비전, 확인 시각, 허용 그룹/필드/마스킹/스코프와 안전한 사유. 클라이언트 입력으로 재사용 가능한 인가 토큰이 아니다.
      refresh: Portal 진입·턴 접수·보호 데이터 조회·모델/업무 실행 직전에 소유 현재 저장소로 재판정한다. 세션에는 신원만 신뢰하고 낡은 그룹/쿼터 스냅샷을 권한 근거로 쓰지 않는다. 장기 대기 후에는 재판정한다.
      revocation: 회수 커밋 이후 시작하는 판정은 새 상태를 읽는다. 판정과 내부 실행 수락은 접근 정책 보호 경계에서 순서를 확정한다. 이미 외부로 전송한 호출을 소급 취소했다고 표시하지 않는다. 중단/결과 노출은 해당 실행·보안 요구를 적용한다. 캐시/dirty 이벤트는 성능 보조이며 회수 정확성의 유일 근거로 삼지 않는다.
      owner_handoff: PortalAccessService.acceptCurrentAccess는 같은 정책 공유 보호 안에서 ALLOW일 때만 실행 수락 callback을 수행한다. 자산 생산자는 PortalAssetPolicy, 배정은 PortalQuotaPort이며 필요한 생산자 누락은 UNAVAILABLE이다.
      current_gap: 현재 AuthorizationInterceptor/AuthzSession은 관리자 메뉴 인가다. AuthzInvalidator의 다른 세션 전파는 인덱스 저장소에 의존한다. 이 구현을 Portal 현재 그룹 판정이 이미 완성된 근거로 사용하지 않는다.
    identity_management:
      input: Portal 계정/기대 부모 리비전·대상 종류/안정 ID·대상 사용자 아이디·활성·신원 근거·사유. REQ-609.identity_management의 직접 저장이며 별도 검증 토큰 발급/소비를 저장 선행 조건으로 추가하지 않는다.
      save: 현재 ADMIN 변경 권한·Portal 사용자/대상 유효성·아이디/근거·기대 버전을 잠금 안에서 검사한다. 켜짐은 아이디/근거 필수, 꺼짐은 접근 불가다. 지정한 변경 행만 적용하고 다른 사용자/탭·미열람/미변경 후보는 유지한다. 부모 리비전/전체 HIST/원 결과와 함께 원자 확정한다.
      runtime_handoff: REQ-609.identity_verification·UC-044·IF-009의 일회용 토큰은 실제 업무 API 실행용이다. agent FEAT-205가 발급/요청 결합/결과, integration이 대상 인증/보호 경로, admin이 현재 매핑/유효 판 해석을 소유한다. 소비와 매핑 회수는 같은 정책 보호 경계에 참여하고 소비가 먼저면 고정한 신원을 해당 한 요청에만 반환한다. 매핑 저장이나 Portal 로그인과 혼합하지 않는다.
      secrets: 레거시 개인 비밀번호·업무 신원 토큰 원문은 DB/HIST/명령 지문/로그에 남기지 않는다. 자체 Portal 자격정보는 별도 보안 저장소로 분리한다. 토큰 발급/소비 저장·만료/파기는 agent/integration 소유 교차 P3에서 설계하며 선행 admin에 구현 완료로 표시하지 않는다.
    external_account_registration: ARCH-050/REQ-616에 따라 검증된 외부 원천+subject와 Portal 계정을 연결한다. 현재 원천 프로필·등록 충돌/재요청을 대조하고 원천 실패/미완료는 활성으로 만들지 않는다. 실제 인증 프로토콜/증명 형식·쿠키/세션은 integration/portal 소유 P3에서 정하며 새 관리 증명 토큰을 이 설계로 확정하지 않는다.
    activation_and_quota: 계정·사용기간·활성 그룹·등급 자격을 바꾸는 명령은 FEAT-045 달력/월 잠금 순서를 먼저 따른다. 당월 확정 계획이 있고 배정 기록이 없으면 자격 발효·개별 배정을 같은 성공 단위로 기록한다. 계획 미확정 상태의 계정 등록은 허용하되 쿼터 READY로 응답하거나 실행을 허용하지 않는다. 자격 발효일/원 명령을 보존하고 FEAT-045.catch_up으로 최종 확정 뒤 지급을 수렴시킨다. 외부 인사 이벤트도 같은 명령 경계를 사용한다.
    deletion: 현재 계획은 비활성화/기간 종료와 참조 보존이다. 개인정보 삭제/익명화는 ADR-044 및 ARCH-050 소유 상세 계약 확정 전 실제 파기 기능을 열지 않는다. 계정 삭제를 이유로 그룹/배정/HIST의 과거 주체를 SYS_USER로 치환하지 않는다.
