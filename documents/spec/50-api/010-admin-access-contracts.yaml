      transport: FEAT-040.physical_transport를 따른다.
    credential_commands:
      source: 기존 UserService/IssuedPassword의 임시 비밀번호 최초 응답 패턴을 Portal 별도 자격 저장소에 적용한다. SYS_USER 행을 재사용하지 않는다.
      request: resetCredential/unlockCredential 모두 targetId·expectedRevision·commandKey·reason. 비밀번호 직접 입력 없음. LOCAL만 허용하고 현재 SAVE/보안 정책으로 검증한다.
      transaction: 잠근 계정의 자격 해시/세대 또는 실패/잠금을 변경하고 부모 리비전·비밀 없는 전체 관리 HIST·명령 성공을 같은 트랜잭션으로 기록한다. 로그인 계층의 세션 무효화는 자격 세대를 소비한다.
      response: reset 최초 성공 응답에서만 임시 비밀번호를 한 번 표시한다. DB에는 해시/만료만 저장, 원장/HIST/응답 로그/캐시 금지. 재수신/결과조회는 처리 완료와 SECRET_NOT_REPLAYABLE만 반환하며 비밀번호를 재발급하지 않는다. 응답 유실 시 운영자가 명시 새 키로 재초기화한다. unlock은 비밀 없는 ManagedResult.
      handoff: 인증 수락/세션 저장·암호 정책/재사용 제한의 적용 및 초기 계정의 강제 변경은 integration 인증 소유 설계와 함께 G2/G3 검증한다. 기본 정책을 이 문서에서 새로 정하지 않는다.
      history_contract: ENT-251와 FEAT-301.portal_identity_ports. 관리 reset은 기존 관리 리비전/HIST/명령과 같은 트랜잭션, 본인 변경은 인증정보/암호이력/자격세대와 비밀 없는 보안 사건의 원자 단위다.
    external_change_port: FEAT-305의 SourceChangeOrigin을 검증한 두 비활성화 전용 명령만 수락한다. HTTP ADMIN 저장 권한 우회용 범용 포트가 아니다. 현재 원천+subject/기대 Portal 판과 정책/달력/월 보호를 재검사하고 현재값·리비전·전체 HIST를 호출자 REQUIRED 트랜잭션에 기록한다. 외부 원천 사건은 ENT-099 ADMIN 명령 결과를 만들지 않으며 ENT-257이 원 결과/처리자를 소유한다. HIST_ACTOR_ID/비관리자 MOD_ID는 null, 정확 source receipt와 HIST 역참조가 같은 commit에 필수다. 기존 ADMIN UI 저장은 실제 ADMIN 처리자 필수다.
  FEAT-006:
    design_status: approved
    implementation: partial
    delivery_boundary:
      decision: CR-040
      sources: sources/backend/modules/admin/src/main/java/com/aiagent/admin/group/
      slice_006: 그룹 정의 현재값·전체 HIST·독립 행 저장·목록/상세 화면·원 소유 연결 포트를 구현한다.
      implemented_membership: SLICE-005에서 ENT-103/203·Portal 부모 리비전·전체 이력·마지막 소속 보호·사용자 검색 선택/편집을 실제 연결했다. GroupMembersEditor/PortalGroupLinks와 PortalUserLiveTest 및 직접 브라우저 양방향 저장으로 검증했다. 자산 절은 원 소유 후속이다.
      deferred_assets: "@defer SLICE-002/003/004/011/020 — 원 자산 전체 HIST·실제 역조회·권한 소비를 연결해 TC-0067/0068/00610을 검증한다."
      connection_contract: 각 소유자는 membership/knowledge/catalog/api/tool/datasource 중 하나로 등록한다. 조회는 현재 ADMIN 열람 범위를 적용하고 READY/NOT_CONNECTED/UNAVAILABLE/FORBIDDEN과 행을 구별한다. 미연결에는 행을 반환하지 않는다. 참조 검사는 표시 권한과 무관하게 비활성을 포함한 전체 참조를 조사하며 미상일 때 삭제를 차단한다.
      absent_owner_contract: CR-042. 소유 포트가 없으면 JDBC 메타데이터로 현재 스키마의 그룹 원장 존재와 해당 소유 부모/그룹 참조/정책 및 동형 이력 테이블 전체 미설치를 확인한 경우에만 ABSENT다. 테이블 존재/일부 설치·스키마/원장 부재·메타데이터 실패는 UNKNOWN이며 삭제를 차단한다. 설치된 포트의 UNKNOWN/실패는 미설치 판정으로 우회하지 않는다. 상세 목록 NOT_CONNECTED와 전체 참조 ABSENT는 독립이다. 기존 관계 자동 삭제는 없으며 비활성/숨김 관계와 정책 예외도 참조로 센다.
      lock_contract: 소속/자산 매핑 생성·변경도 같은 REQUIRED 트랜잭션에서 phase3 USER_GROUP 안정 ID 잠금을 정렬 취득한 뒤 현재 그룹 존재를 재확인한다. 삭제와 링크 생성 사이의 빈틈을 허용하지 않는다.
      commands: scope definition은 groupNm/description 두 값만 수락한다. remove는 scope definition과 빈 values를 사용한다. 행마다 독립 commandKey/expectedRevision/reason이며 미확정 재시도는 원 본문·키를 유지한다.
      use_state: getList는 참조 조회 없이 UNKNOWN을 반환한다. 모든 하단 탭 조회 시 선택 그룹의 getOne에서만 상세 목록 행 수 대신 전체 참조 검사로 계산한다. 현재 참조가 확인되면 USED, 모든 소유자가 참조 없음 또는 DB상 전체 미설치로 확인되면 UNUSED, 그 밖의 누락·확인 실패는 UNKNOWN이다. UNKNOWN을 OFF로 렌더링하거나 상태 필터에서 UNUSED에 포함하지 않는다.
    reqs:
      - REQ-103
      - REQ-601
      - REQ-605
    usecases:
      - UC-025
    entities:
