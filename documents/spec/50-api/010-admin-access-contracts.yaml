    storage: 그룹 정의는 ENT-102, 사용자 소속은 ENT-103. 그룹의 사용 상태는 역참조 투영이며 독립 ACTIVE_YN/중지 명령을 두지 않는다. 소속 활성 변경은 Portal 부모 저장과 이력을 사용한다.
    reference_guard: REQ-605의 삭제/사용중지 규칙을 현재 참조 전체에 적용한다. 활성/비활성 소속·데이터소스/카탈로그/API/도구/지식 링크를 조사하며 조회 실패를 참조 없음으로 취급하지 않는다. 삭제 허용 여부와 정리 순서는 해당 소유 요구를 따른다.
