feature_contracts:
  FEAT-016:
    design_status: draft
    implementation: planned
    reqs:
      - REQ-613
    usecases:
      - UC-022
    entities:
      - ENT-107
    types:
      RateDraft: month:YYYY-MM, expectedRevision, memo, rows:[usageKind/modelStableId/effort/meterUnit/quantity/priceRef/priceSnapshot/quantityOrigin/correctionReason], sourceSnapshotId/cutoff/coverage. 금액·단가는 10진 문자열, 토큰 수는 정수 문자열. 자동 근거/가격은 서버가 채운다.
      FreezeReview: reviewId, month, rateRevision, fixedUsageCutoff, usageSnapshotRevision, selectedPriceRefs, differences, expiresAt. ADMIN 처리자와 월·전체 단가에 바인딩한 서버 비교 근거이며 권한 부여 토큰이 아니다.
    draft: REQ-613.calculation_contract의 행/정규화/가격 선택/보완·재생성 전체를 한 월 단위로 저장한다. 실제 공급 경로 계량이 없으면 자동 초안을 성공/0으로 만들지 않는다. 운영용 호출을 개인 풀 표본에 넣지 않고 원 실적과 관리자 추정을 구분한다. 수동 시나리오로 초기 단가를 준비할 수 있다.
    first_plan_save: API-077 비교가 고정한 상한·가격 기준으로 API-079 최초 월 기준 저장을 실행한다. READ와 SAVE는 각 소유 메뉴에서 검사한다. 월·단가/가격 선택 보호 경계에서 자기 기준본·비교 근거를 다시 검사하고 단가 전체 고정+월 기준+각 HIST+원 명령 결과를 같은 DB 트랜잭션으로 확정한다. 차이가 있으면 409 재검토이며 일부 고정하지 않는다.
    no_standalone_freeze: SCR-016의 API-078 저장은 단가 초안 보관이다. 단독 확정/잠금 해제/월 기준 삭제를 만들지 않는다. 고정 뒤 메모·행·실적/가격 사본도 불변이다.
    late_usage: 고정 뒤 늦게 들어온 사용량은 원 발생 월 집계의 새 정정 근거로 보존하되 잠긴 단가/기존 배정은 바꾸지 않는다. FEAT-211이 생산하는 실적 계약은 FEAT-017.usage_handoff를 따른다.
    precision: ADR-045·REQ-613.calculation_contract.precision을 적용한다. 정확 분자/분모를 보존하고 표시 반올림값을 저장·배분에 사용하지 않는다.
