      MonthPlanSave: commandKey, month:YYYY-MM, expectedRevision, amount, currency, exchangeRate, correctionRate, memo, rateId/rateRevision, freezeReviewId:최초만. 금액은 유한한 10진 문자열, 필수 분모는 양수. 생성·저장 후 월/고정 단가 교체 금지.
      QuotaRead: PORTAL principal + month:서버 달력으로 결정 + purpose. admin 조회는 ADMIN READ와 명시 대상 사용자 범위를 따로 검사한다.
