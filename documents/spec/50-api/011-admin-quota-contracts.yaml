  FEAT-045:
    design_status: draft
    implementation: planned
    reqs:
      - REQ-116
      - REQ-118
      - REQ-606
    usecases:
      - UC-042
    entities:
      - ENT-108
      - ENT-109
      - ENT-110
      - ENT-111
      - ENT-112
    job: JOB-004
    calendar: ADR-043·REQ-116.month_boundary. 고객사 IANA 업무 시간대(초기 국내 Asia/Seoul) 매월1일00:00 마감/실행. 대상 월 M·zone·경계 B·수락/선택 버전을 보존한다. 잠금 후 공유 DB 업무 시각으로 순서를 판정하며 지연 복구에서 바꾸지 않는다.
    cutoff: 월말 최종 입력은 B 이전에 업무 잠금 아래 수락·성공 확정한 관리/승인 기록 중 M월에 효력이 있는 판이다. 날짜만 미래로 적은 B 이후 변경을 소급 포함하지 않는다. 경계에 걸친 쓰기는 수락 시각과 선후 순서를 보존하며 마감 작업은 선행 쓰기 커밋/롤백을 기다린다. 이 업무 수락 시각은 HIST_DTM/HTTP 접수 시각과 구분한다.
    snapshot: ENT-112에 금융 원본·고정 단가·M월 등급 세트·대상 사용자/기간/그룹/효력 등급·가중치·기준 판과 정규화 지문을 불변 저장한다. 예약 실행이 지연/재기동돼도 보존된 당시 효력/수락 이력으로 B 기준을 복원하며 현재값만 읽지 않는다. 정확 복원이 불가하면 SNAPSHOT_UNAVAILABLE로 중단한다.
    locking: 관련 등급/사용기간/그룹/자격/예약 변경과 월말/개별 배정 모두 달력 경계 잠금부터 획득한다. M-1 승계가 필요하면 월 오름차순으로 잠그고, 사용자 ID 오름차순으로 이어간다. BatchRunner의 batchId 잠금은 업무 월 잠금/유일 제약을 대신하지 않는다.
    final_sequence:
      - M월 원 작업을 조회한다. 이미 확정이면 같은 결과를 반환하고 batchId/노드/재시도 키가 달라도 새 최종 효과를 만들지 않는다.
      - 달력/월 잠금에서 마감 입력 ENT-112를 최초 한 번 고정한다. 입력 고정과 실행 준비는 작은 내구 트랜잭션으로 보존하되 개인 한도/월 자동 생성 성공으로 노출하지 않는다.
      - 같은 원 작업의 고정 입력으로 산정한다. M월 유효 기준이 있으면 사용, 부재가 확정된 때만 M-1의 유효 금융 원 기준을 그대로 승계한다. 손상/조회 실패는 부재가 아니다. M월 등급/인원은 별도로 선택한다.
      - 월 잠금 안에서 자동 생성 월 기준(필요한 경우)·기준 ENT-110·모든 개인 ENT-111·원 실행 성공을 한 트랜잭션에 확정한다. 계산 준비/실패 기록만 남아도 개인 한도에는 효력이 없다.
      - 커밋 뒤 결과를 반환한다. 중단/네트워크 유실은 원 실행을 조회한다. 실패한 시도는 같은 입력으로 재처리하며 새 현재값 스냅샷을 만들지 않는다.
    zero_population: 대상0명이면 월 금융/등급 준비와 FINAL 실행은 완료하되 ENT-110은 UNASSESSED, 개인 행은0건이다. 분모0 계산/한도0 확정으로 바꾸지 않는다. 최초 자격 발생의 동일 월 잠금에서 현재 유효 인원으로 기준을 한 번 산정하고 이후 재산정하지 않는다.
    calculation_examples:
      - 계획 금액1,000,000·USD/1M 단가1.6·환산율1400·보정1이면 총 풀446,428,571. 환산율을 재적용하거나 별도 여유율을 차감하지 않는다.
      - 총 풀1,001·활성3명의 가중치1/1/3이면 한도200/200/600, 버림 잔여1. 같은 월30일 중16일에 가중치3 신규 자격이면15/30 일할300을 추가 지급한다. 잔여1보다 커도 기존 한도/분모를 재계산하지 않는다.
      - 0명 월 총 풀1,001에서30일인 달의 말일에 가중치3 사용자가 최초 활성화하면 분모3·기본한도1,001·일할33이다. 뒤이어 가중치1 사용자가 같은 날 활성화하면 기존 분모3의 기본한도333·일할11이며 분모4로 되돌려 계산하지 않는다.
    individual: 월 계획/고정 등급 기준을 확인하고 (월,Portal 안정 ID) 기본 배정 부재를 재검사한다. 자격 유효일부터 말일까지 양끝 포함 일수로 floor(등급 기본한도×남은 일수/월 일수)를 지급한다. 월 시작에 유효하면1일부터 계산한다. 이미 배정이면 재활성/중복 이벤트에도 원 한도를 반환한다.
    individual_atomicity: 0명 월 최초 자격 활성화·분모/등급별 기준 산정·해당 이용자 배정은 같은 성공 단위다. 신규 동시 등록은 직렬화 순서에서 먼저 확정된 기준을 따르며 모든 사용자를 임의로 재배분하지 않는다. 계획 총 풀 초과도 기존 규칙대로 지급하고 초과/미배정량을 별도로 계산한다.
    catch_up: 월 미확정 중 활성화한 사용자는 자격 발효일/원 명령을 내구 기록으로 남긴다. FINAL 확정 뒤 서버 복구 작업이 해당 월의 현재 자격 있음·배정 없음 대상을 찾아 individual로 수렴시킨다. 조회 API는 쓰지 않고 다음 신뢰된 유료 실행 진입에서도 별도 ensureAllocation 명령을 호출한 뒤 읽는다. 양 경로는 같은 월/사용자 잠금·유일키·원 자격 발효일을 사용하므로 재처리/재기동에도 중복 지급하지 않는다. 원 마감 분모/기존 한도는 바꾸지 않는다.0명 월 최초 활성 기준도 같은 경로로 한번만 산정한다.
    catch_up_failure: 재조정은 원 FINAL 성공을 취소하지 않고 누락 개인별 실패/재처리 상태를 남긴다. 배정 확인 전 해당 사용자 실행은 계속 차단한다. 현재 자격을 잃었으면 지급하지 않으며 다시 자격이 생기면 기존 재활성 일할 규칙을 적용한다.
    catch_up_recovery: FINAL 트랜잭션에 개별 보완 미완료 표식을 기록한다. FINAL/ALREADY_FINAL 후 보완을 실행하고 기동 복구와 원 배치 재처리에서도 미완료 표식을 재개한다. 인메모리 커밋 후 이벤트만으로 맡기지 않는다. 진행 위치/실패를 보존하며 재조회 가능한 현재 자격과 월별 배정 부재를 기준으로 반복해도 같은 결과로 수렴한다.
    retry: RUNNING/FAILED/UNKNOWN/FINAL은 실행 관측과 업무 확정을 구분한다. 잠금 만료/프로세스 종료만으로 성공을 추정하지 않고 유일 월 결과와 원 작업을 대조한다. 확정 계획 부재는 NOT_READY, 원천 확인 불가는 UNAVAILABLE이다. 장애 동안 한도 없는 실행을 허용하지 않는다.
    retention: ADR-044. 원 입력/배분/시도는 고객 보존 기간과 소비 보호 종료 후 파기한다. 월 잠금 아래 ENT-171 최소 월 종결표를 먼저 등록하고 ENT-123/124/122/111/119→ENT-110→ENT-109→ENT-120/121/112 순으로 같은 파기 단위에서 삭제한다. 남은 참조/다른 실행이 공유한 입력은 보존한다. FINAL 진입은 현재 원 실행과 ENT-171을 먼저 확인하고 종결 월을 재실행하지 않는다.
    physical_records: ENT-109~112·119~124·171. 0명 최초 활성은 ENT-110.INITIAL_ACTIVE_INPUT_ID, 개별 일할은 ENT-111.ELIGIBILITY_INPUT_ID로 원 마감과 구별한다. 매번 새로운 분모를 만들지 않는다.
