    delivery_boundary: CR-043. 기준 관리·연결 포트는042에서 완료, 실제 사용자 효력/예약 이전은005, 예정본 낡음은017, 월 경계/배정 경합은045에서 검증한다. 전체 미설치 확인 외에는 연결 검사 누락/실패를 참조 없음으로 처리하지 않는다.
