    plan_save: 최초는 FEAT-016.first_plan_save와 원자 처리한다. 이후 미래 월 금융값/메모 저장은 이미 고정된 단가/상한을 그대로 사용한다. 메모만 수정하면 계산 지문을 바꾸지 않으며 금액·환산율·보정 또는 효력 등급/대상자 변경은 예정본을 낡음으로 표시한다.
    preparation: API-080은 미래 월의 저장 기준/대상자/등급을 고정해 예정 실행 ENT-109를 새로 만들고 이전 유효 예정본을 교체한다. 예정 행은 실제 ENT-111 개인 한도에 쓰지 않는다. 재생성 중 장애면 이전 예정본을 보존한다.
    read: 월/등급/개인 한도는 admin이 소유하고 실제 사용량은 agent FEAT-211의 공개 집계를 소비한다. 배정·추가 승인·사용량을 각각 월×PORTAL 안정 ID로 먼저 합산해 연결한다. 누락/조회 실패/계량 미상을 구분한다.
    usage_handoff:
      producer: agent FEAT-211 + integration 모델/계량 어댑터. 후행 통계 UI는 생산 조건이 아니다.
      identity: 실제 공급 호출의 안정 invocationId + 생산자 + 단조 증가 계량 revision. 턴/재시도/대체 호출 ID와 관계는 agent 요구 기반 모델이 정하며 이 계약은 그 ID를 불투명 참조로 받는다.
      payload: 주체영역/안정 ID·서버 판정 귀속 PORTAL_PERSONAL/ADMIN_OPERATION·발생 Instant·사용 월/zone·용도/모델/effort·공급 계량 원값과 정규화 버전·비중복 토큰/비용·출처 PROVIDER/ESTIMATED/UNKNOWN·상태/완료 여부·정정 revision.
      dedup: 누적 재수신은 합산하지 않고 같은 invocation의 최신 검증된 누적값으로 대조한다. 같은 revision 다른 값은 충돌, 이전 revision은 무시/원 결과, 새로운 호출은 실패/중단/대체라도 별도 실제 소비다. 정정은 근거를 남기며 원 기록을 무단 덮어쓰지 않는다.
      accounting: 공급 총량 우선→등록된 비중복 조합→Hub 추정 합의 REQ-116/NFR-010 규칙을 따른다. 관리자 운영은 전체 사용량/비용에는 포함하고 Portal 개인 차감에서 제외한다. 관리자 세션/등급 없음만으로 운영용 분류하지 않는다.
      snapshot: 집계 기간 [from,to)·고정 수신 상한/watermark·정규화 버전·coverage와 호출별 선택 revision을 보존한다. 월별 단가는 이 스냅샷을 읽고 최신 실시간 집계로 과거 값을 바꾸지 않는다. 늦은 계량의 원 사용 월 귀속을 유지한다.
      execution: 턴 접수와 모델 호출 직전 현재 배정/사용량을 검사하는 집행·동시 호출 예약/정산·결과 불명 처리는 FEAT-211/agent 소유다. admin의 배정 성공이나 QuotaState만으로 미래 호출 비용/초과 방지가 완료됐다고 보지 않는다. agent G3 전 동시 호출·늦은 정정 계약을 별도 완성한다.
      unavailable: 한도/필수 사용량 원천을 확인할 수 없으면 쿼터 판정 불가로 새 유료 호출을 차단한다. 이미 발생한 소비 기록을 버리거나0으로 확정하지 않는다. 지원하지 않는 자동 실적 초안은 수동 시나리오 경로와 구분한다.
      later_approval: 선행에는 REQ-119 추가 승인 생산 UI가 없다. 승인 원천이 아직 배포되지 않았음이 확인될 때만 추가량0을 명시 반환할 수 있다. 원천 도입 뒤 장애/미확인은 null이며0으로 바꾸지 않는다. 후행 지급도 승인 ID별 단 한 번 효과로 합류하고 기본 배정을 수정하지 않는다.
