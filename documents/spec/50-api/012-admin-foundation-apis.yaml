# 영역: 선행 공통 저장·배정의 신규 관리 API 초안
apis:
  - id: API-077
    feature: FEAT-016
    implementation: planned
    method: POST
    path: /api/admin/service/tokenRate/compareForFreeze
    action: READ
    summary: "최초 월 기준 저장의 단가·실적 고정 비교"
    request: "body={month, rateId, expectedRevision}; 현재 단가/월 기준 READ를 검사"
    response: "ApiResponse<FreezeReview>; 고정 상한/가격 판·차이·확인 불가를 구분"
    contract: "FEAT-016.first_plan_save. 비교는 단가를 고정하지 않는다. 재요청은 같은 고정 상한의 비교 문맥을 사용하며 만료/기준 변경은 새 비교를 안내한다."
  - id: API-078
    feature: FEAT-016
    implementation: planned
    method: POST
    path: /api/admin/service/tokenRate/save
    action: SAVE
    summary: "선택 월 단가 전체 초안 저장"
    request: "body=ManagedCommand<RateDraft>"
    response: "ApiResponse<ManagedResult>"
    contract: "FEAT-016.draft/no_standalone_freeze. 고정 월은409, 불완전 산정은 유효 단가 저장 불가."
  - id: API-079
    feature: FEAT-017
    implementation: planned
    method: POST
    path: /api/admin/service/quotaPlan/save
    action: SAVE
    summary: "월 기준 저장과 최초 단가 고정"
    request: "body=MonthPlanSave"
    response: "ApiResponse<ManagedResult>"
    contract: "FEAT-017.plan_save. SCR-021 SAVE와 참조 단가 READ를 검사하고 허용된 월 기준 저장의 결과로 단가를 고정한다. 독립 단가 확정 액션/추가 승인 단계는 없다. 낡은 비교/기대 버전은409, 원천 확인 실패503."
  - id: API-080
    feature: FEAT-017
    implementation: planned
    method: POST
    path: /api/admin/service/quotaPlan/prepare
    action: EXECUTE
    summary: "미래 월 예정 배분 생성·교체"
    request: "body={commandKey, month, expectedRevision, expectedCalculationDigest, reason}"
    response: "ApiResponse<{runId, month, snapshotId, calculationDigest, state, preparedAt}>"
    contract: "FEAT-017.preparation. 현재 READ+EXECUTE와 미래 월을 검사한다. 실제 한도/최종 배정은 변경하지 않는다."
  - id: API-081
    feature: FEAT-017
    implementation: planned
    method: POST
    path: /api/admin/service/quotaPlan/getAllocation
    action: READ
    summary: "월 기준 화면의 배정 결과 조회"
    request: "body=SearchRequest<{month, portalUserId?:십진 문자열}>"
    response: "ApiResponse<PageResponse<QuotaState>>; 월/원 실행·집계 상한·coverage를 함께 반환"
    contract: "FEAT-017.read. 후행 사용자별/월별 통계 화면의 전체 조회 기능을 승인/구현하는 API가 아니다. 내부 agent 소비는 같은 소유 조회 계약에 검증된 PORTAL 주체로 연결한다."
  - id: API-082
    feature: FEAT-040
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/management/ManagementCommandController.java#getResult
    method: POST
    path: /api/admin/service/managementCommand/getResult
    action: READ
    summary: 공통 관리 저장의 원 명령 결과 확인
    request: body={commandKey, ownerFeature}; ENT-099를 쓰는 등록된 소유 기능만 허용
    response: ApiResponse<{status:APPLIED/UNKNOWN,result?:ManagedResult}>; 파기된 키는409 COMMAND_EXPIRED, 원장 확인실패503
    contract: 현재 해당 원 기능 READ+SAVE와 원 ADMIN 주체를 다시 검사한다. 이 API의 공통 메뉴 READ만으로 원 결과를 열지 않는다. 다른 주체/소유·미발견은 UNKNOWN이며 오류/진행중/미실행 확정이 아니다. ENT-019/028/036은 기존 소유 결과 API 유지. FEAT-040.command_identity의 전역키 보호 검사를 동일하게 적용한다.
  - id: API-083
    feature: FEAT-042
    implementation: planned
    method: POST
    path: /api/admin/service/quotaGrade/save
    action: SAVE
    summary: "시작월 등급 전체 세트 저장"
    request: "body=ManagedCommand<{startMonth, grades:[id|null,name,rank,weight], transitionMappings}>"
    response: "ApiResponse<ManagedResult>"
    contract: "FEAT-042.storage/references/race. 이름 변경/세트 복사의 정당한 기존 등급 ID는 유지한다. 폐기 번호 재발급·다른 등급의 ID 가장·후속 효력 누락/확정월 영향은 거부한다. 소유 전체 세트 한 성공 단위."
  - id: API-084
    feature: FEAT-005
    implementation: planned
    method: POST
    path: /api/admin/service/portalUser/save
    action: SAVE
    summary: "Portal 이용자의 지정 관리 영역 저장"
    request: "body=ManagedCommand<{profile/usePeriod/state 또는 memberships/필요한 명시 비활성화 또는 gradeEffectiveMonth/grade 또는 identityMapping/identityEvidence}>; API가 소유 영역과 마지막 그룹 회수의 허용 복합 입력을 검증"
    response: "ApiResponse<ManagedResult>; 자격 변경 시 확인된 quotaState를 별도 반환"
    contract: "FEAT-005. 비밀번호·외부 원문 토큰은 이 DTO로 받지 않는다. 자체 자격정보 명령/등록 인증은 별도 소유 P3 계약으로 분리한다. 기존 부모의 미변경 영역은 잠근 현재값을 유지하고 전체 HIST는 함께 저장한다."
  - id: API-085
    feature: FEAT-006
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/group/UserGroupController.java#save
    method: POST
    path: /api/admin/service/userGroup/save
    action: SAVE
    summary: 사용자 그룹 정의 저장
    request: body=ManagedCommand<{groupNm,description}>; 사용 상태는 읽기 전용 투영이며 active/useYn 입력 거부
    response: ApiResponse<ManagedResult>
    contract: FEAT-006.storage/reference_guard. 자산 역조회/소속 전체를 정의 저장으로 덮지 않는다. 그룹 화면의 소속 명령은 FEAT-005.membership의 같은 원장을 소비한다.
