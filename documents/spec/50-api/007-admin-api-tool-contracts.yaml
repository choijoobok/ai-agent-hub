feature_contracts:
  FEAT-004:
    preserved_reference: REQ-608.schema_sync.preserved_reference. 서버 판정 보존 불일치의 기존 참조는 오류 상태로 전체 저장 가능하며 실행 불가다. 참조 파손 전체 거부는 임의 ID/소유 혼입/실제 삭제를 의미한다. 불일치 필드의 일괄 삭제는 기존 참조 해소 전 금지한다.
    field_value_mapping: REQ-608.field_value_mapping. 필드 안정 ID/clientKey에 GUIDE/INLINE·설명·참조 가이드와 MEANING 역할의 코드 항목 ID/타입/원값/명칭/의미·조건을 같은 전체 구성으로 저장한다. INPUT/RESPONSE·위치별 소유와 중복·타입·필드 삭제를 검증한다. 자연어 가이드를 별도 자동 조회 규칙으로 파싱하지 않는다.
    reference_projection: 기술 참조 보호의 currentRef는 응답/내부 문맥에 보존한다. 별개인 소유 링크의 mappingActive:boolean|null을 역조회에 제공하고 화면은 매핑 활성 여부만 표시한다. 비활성 링크도 참조 존재와 다르며 조회 실패/미상은 null로 표시한다. 구조 참조는 임의 활성 플래그를 만들지 않는다.
    mapping_active: REQ-601.asset_mapping_active. 허용 그룹 링크의 groupRef/mappingActive를 소유 API/도구 전체 구성과 HIST에 보존하고 현재 호출/노출에는 활성 링크만 사용한다. 역조회 별도 쓰기는 없으며 위험/실행 확인·응답 예외/마스킹·현재 권한을 우회하지 않는다.
    masking_type_catalog: REQ-611.masking_utility.api_levels. 공통 정보 유형 {value,text}는 유지하고 API용 지원 수준은 유형/구현 버전별 안정 코드·표시 키·마스킹 정도 순위·읽기 전용 방법/예시·자료형을 같은 소스 원천에서 제공한다. 그룹별 임의 알고리즘은 없다. 복수 그룹의 덜 엄격한 수준 결합·Portal 기본값·이력 분리는 REQ-608.response_access를 따른다.
    security_domain_scope: ARCH-050.admin_account_contract. 관리 명령의 인증·ACTOR_ID·지문·원 결과 소유 비교는 system 관리자 영역이다. Portal 주체/같은 문자열 ID로 실행·재생하지 않으며 Portal 대상 이용자와 처리자를 구분한다
    design_status: draft
    implementation: planned
    knowledge_mapping_boundary: REQ-303.reference_mapping. 지식의 외부 안정 ID 연결과 기술적 정확 참조를 구분한다. 외부 리비전 상승만으로 지식 매핑을 동기화/거부하지 않고 필수 SQL/API/참조 무결성만 검사한다. 대상 안정 ID/종류·표시명·적용 리비전·연결 경로·현재 참조 여부를 현재 열람 권한 안에서 조회한다. 연결 지식 본문/사용 설명 자동 수집·업무 의미 영향 판단/보완 작업은 제공하지 않는다.
    response_rule: 현재 항목·선택한 전체 내용 판·후보 검수·공동 오픈 시점·현재 호출 조건을 구분한다. 저장/검수 성공으로 호출 가능을 확정하지 않는다. 현재 연결 검사는 주소/인증값을 제외한 관측이며 예약/실행 허가가 아니다
    identity_verification: REQ-609.identity_verification·IF-009. 선택 연결의 검수된 신원 계약을 참조하고 신원 필요 Boolean 편집/수락은 제공하지 않는다. 내부 발급과 대상 시스템용 검증·소비 API는 관리 CRUD와 별도 인증/권한 경계이며 물리 URL/DTO는 후속 상세 설계한다. 토큰 원문/해시·대상 신원 확인 응답은 관리 응답/전체 이력에 포함하지 않는다.
    composition_contract:
      scope: 현재 업무 내용·전체 소유 관리 자식·접근 그룹은 같은 전체 구성이다. 현재값과 성공 적용 HIST에 동형 매핑하며 외부 소유 관측/비밀은 제외한다.
      identity: 신규 필드는 clientKey(UUID)로 임시 연결하고 서버가 ENT-029를 배정한다. 같은 저장 안의 값/코드명/대응/출처는 전체 clientKey 집합을 먼저 해석한다. 기존 FIELD_ID의 API 소유는 고정이다. 판 안의 referenceNo/bindingNo/checkNo/valueNo 등은 양의 순번이며 해당 판 안에서만 의미가 있다. 코드 항목은 이 순번과 별개인 안정 itemId를 사용하고 이름/값/정렬이 바뀌어도 유지한다. 신규 항목의 valueClientKey는 같은 전체 저장에서 먼저 해석해 결과 판정 참조와 HIST에 함께 보존한다. 다른 후보의 신규 필드를 참조하려면 먼저 저장해 실제 ID를 받는다
      review: 필드의 타입·필수/NULL·개인정보·값/참조 유효성은 현재 전체 입력으로 검증한다. 미확인·미완성은 운영 사용으로 확정하지 않는다. 검수 근거는 REQ-608.api_workspace.master의 메모로 기록하며 별도 API 검수 근거 제출/관리 승인 절차를 만들지 않는다. 구조·타입·의미·분류 변경은 관련 검수 상태를 다시 확인한다.
      connection: TARGET_SYSTEM_ID를 먼저 확인하고 그 시스템의 현재 유효 CONNECTION_ID를 필수 선택한다. 기본 연결/모드는 없으며 시스템을 바꾼 편집본은 연결을 재선택한다. 전송 전 현재 정의/소속·useYn·권한을 다시 검사한다.
      call: OPERATION_TYPE은 메서드와 독립인 QUERY/EXECUTE이며 UNKNOWN은 운영 불가다. TIMEOUT_SECONDS=null은 ARCH-033 공통값, 지정은 그 허용 범위·점유/갱신·프록시 지원을 함께 검사한다. 멱등성 보장 여부는 boolean이고 기본 false다. 미보장/결과 확인 API 부재만으로 등록을 금지하지 않는다. 기간·키 조건·별도 근거 필드를 필수화하지 않으며 true도 최초 승인이나 자동 재시도 제한을 면제하지 않는다
      result: SUCCESS_MEANING=COMPLETE/ACCEPTED는 검수한 외부 성공 응답의 업무 의미다. MAPPED는 ENT-034의 정형 상태 대응을 사용한다. HTTP 오류/시간 초과를 업무 실패/미실행 확정으로 자동 바꾸지 않는다. 결과 확인 대상은 REQ-608.result_handling_guide에 따라 사용 가이드로 안내한다. 입력 생성/응답 판정은 호출하는 조회 API 자체 명세를 따른다. 원 API에 외부 조회 입력/상태 대응·확인 주기를 저장하지 않는다. 원 응답의 MAPPED는 결과 확인 API 없이도 사용할 수 있다
      opening: REQ-608.api_workspace.master에 따라 고객사 계약·담당자·시험/공동 오픈 근거는 상단 메모로 기록한다. 별도 RELEASE_REF/EXTERNAL_VERSION/EXTERNAL_OWNER/OPEN_EVIDENCE/OPEN_AT 구조화 필수 입력과 미래 적용일 자동 활성화는 두지 않는다. 메모 내용으로 검수/외부 오픈 완료를 자동 판정하지 않는다. IF-002의 공동 시험·실제 오픈 책임과 현재 사용·연결·권한·기술 계약 검증을 유지한다.
      owned_policy: '@defer P3 access_policy — FEAT-008의 호출 허용 그룹·위험 등급·승인 강제·응답 처리 전체 후보/불변 판·반출 허용/상속 및 당시 직접 정책 참조 저장을 완성한다. 현재 공통 마스킹/전송 동의는 별도다. 이 구성이 비어 있거나 조회 실패이면 전체 스냅샷/고정/반영 완료가 아니다'
      local_edit: 저장 전 입력은 현재 적용본/baseRevision 기준의 로컬 편집값이다. 서버 요청 초안·SNP·EDIT_VERSION을 만들지 않고 저장 때 전체 구성을 재검증한다.
    field_contract:
      sample_import: REQ-608.schema_sync 및 api_workspace.sample_import. 샘플은 원본 스키마 초안 생성용이며 스키마를 검토/반영한 뒤 도출 필드를 동기화한다. 원본은 ENT-012/061에 보존하고 불일치 필드는 명시 정리 전 유지한다.
      path: BODY는 정적 PROPERTY/ITEM 토큰을 원천으로 하며 점·대괄호가 든 실제 키는 문자 그대로 보존한다. 화면의 items[].name과 JSON 따옴표 표기는 api_workspace.sample_import를 따른다. QUERY/HEADER는 정확 단일 PROPERTY이며 HEADER만 ASCII 대소문자를 무시한다. PATH는 이름 PROPERTY 대신 상대 경로의 변수 자리 순서(1..N)를 키로 한다. 고정 경로 세그먼트는 세지 않으며 템플릿 자리와 일대일 검증한다. 정렬/새 자리 삽입으로 기존 의미를 자동 승계하지 않는다. PATH 순서의 물리 저장/정규 토큰 형식은 화면 합의 뒤 확정한다. 모든 PATH는 필수·null/빈 값 불가·단일 세그먼트 안전 인코딩이다. 필터·재귀·스크립트·임의 배열 인덱스는 지원하지 않는다.
      uniqueness: BODY/QUERY/HEADER는 방향·위치·정규 토큰의 길이 구분 직렬화로 서버가 경로 키를 계산하고 전체 원문도 대조한다. PATH는 소유 API 판·REQUEST/PATH·변수 순서로 유일하며 이름 변경/화면 정렬을 식별키로 사용하지 않는다. 같은 정규 경로/순서 중복과 구조·타입 충돌을 거부한다. 미설정과 BODY 루트는 구분한다.
      presence: REQUIRED_CD는 경로 존재, NULLABLE_CD는 존재한 값의 null 허용이다. 0/false/빈 문자열/null/미존재를 합치지 않는다. 객체/배열 노드도 등록해 부모 부재·빈 배열·중첩 필수 필드의 의미를 판정한다. 각 배열 항목에 자식 규칙을 적용하며 최소 항목 수는 별도 MIN_ITEMS다. 미등록 응답 경로와 개인정보 미확인은 노출하지 않는다
      values: VALUE_MODE=INLINE은 ENT-030의 ENUM 집합을 사용하고 REFERENCE는 OWNER_FIELD_ID가 같은 FIELD_CODE 참조와 전체 대응을 갖는다. NONE/UNKNOWN에는 ENUM/코드 원천을 남기지 않는다. ENUM은 동일 타입/정형 값 중복을 거부하고 STRING의 앞자리 0·공백을 보존한다. NUMBER는 유한 십진 값으로 정규화하며 INTEGER 제약을 별도 확인한다. NULL은 필드 nullable 규칙과 일치해야 한다. FIXED/DEFAULT는 ENUM과 별도이며 요청 필드당 각 하나 이하, 응답에는 없다
      checks: ENT-031 조건은 AND다. MIN/MAX는 NUMBER/INTEGER, LENGTH는 STRING, ITEMS는 ARRAY에 적용하고 음수 길이/항목 수·역전 범위·잘못된 포함 경계를 거부한다. FORMAT은 허용된 검증기 식별자와 VALUE_FORMAT/TIME_ZONE_ID를 대조한다. 지원 밖 형식을 조용히 무시하지 않는다. 임의 정규식/코드 실행은 제공하지 않는다. @defer P3 agent·integration — 지원 검증기·수치/날짜 형식의 정확 허용 목록과 실행 검증을 연결한다
      privacy: REQ-111.privacy_metadata·REQ-608.response_access가 정본이다. 요청/응답의 개인·민감 분류·정보주체·정보 유형·이력 마스킹 수준·검수는 API 필드가 소유한다. Portal 그룹 예외는 같은 정보 유형의 지원 수준만 별도 참조하며 원문 권한/덜 엄격한 수준으로 이력 마스킹을 바꾸지 않는다. 미확인·미등록/지원 불가를 원문으로 전송/저장하지 않는다.
      input: ENT-037은 REQUEST만 허용한다. USER는 질문/부족 안내, API_LOOKUP은 REQ-608.input_api_lookup에 따른 같은 입력 필드 소유 INPUT_LOOKUP·TARGET_KIND=API 참조와 안정 API_ID만 사용하며 API_REVISION_ID와 BINDING_NO는 null이다. 대상의 요청/응답 필드 대응을 요구하지 않는다. 기존 LOOKUP은 비API 데이터 조회 참조와 INPUT_VALUE 대응을 사용하며 API 대상은 API_LOOKUP으로 구분한다. FIXED/DEFAULT는 같은 판/필드/역할의 VALUE_NO, SERVER는 자기 요청 필드 대상·SOURCE_KIND=SERVER·REFERENCE_NO=null인 신뢰 문맥 주입 대응, TRANSFORM은 변환 가이드와 원 근거를 사용한다. 종류 밖 참조/값/대응은 null이다. 비API LOOKUP은 출처·참조·바인딩의 소유 필드/참조 번호와 정확 판을 검증한다. 미완성을 다른 필드/원천의 연결로 채우지 않는다. API_LOOKUP은 source.FIELD_ID=reference.OWNER_FIELD_ID·source.REFERENCE_NO=reference.REFERENCE_NO를 검사하며 대상 필드/판을 고정하지 않는다. 실제 입력 검증·서버 보호값 주입·부족/모호성 확인은 유지한다.
    reference_contract:
      identity: ENT-032의 역할·대상 종류와 안정 ID를 보존한다. INPUT_LOOKUP·TARGET_KIND=API는 API_LOOKUP 전용이며 API_ID만 필수, API_REVISION_ID/다른 대상 ID/판은 null이다. 다른 정형 참조는 선택 종류 안 ID/정확 판이 함께 존재해야 하고 종류 밖은 null이다. OWNER_FIELD_ID가 필요한 참조의 소유와 방향을 검사한다. 결과 확인은 통합 가이드가 소유하며 RESULT_CHECK 구조화 역할을 두지 않는다.
      binding: API_LOOKUP은 input_api_lookup의 안정 ID 참조이며 아래 정확 판/필드 바인딩 규칙의 대상이 아니다. ENT-033은 판 안의 REFERENCE_NO와 그 참조의 정확 API/카탈로그 판을 함께 갖는다. SOURCE_KIND/TARGET_KIND별 필드·컬럼·고정값·문맥 키 중 선택한 하나만 사용한다. 원/대상 종류가 API_FIELD/CATALOG_COL이면 정확 참조 판과 구성 ID가 필수다. LOCAL_FIELD는 소유 판의 필드다. REFERENCE_NO가 null이면 원/대상 외부 판·구성은 모두 null이다. LOOKUP_INPUT은 원 요청/응답·고정·신뢰 서버 값에서 조회 API의 REQUEST 또는 카탈로그 조건 컬럼으로 보내며 코드명 해석의 서버 보호 입력은 서버 원천만 가능하다
      matching: API_LOOKUP은 input_api_lookup의 안정 ID 참조이며 아래 정확 판/필드 바인딩 규칙의 대상이 아니다. 기존 MATCH_KEY는 입력 확보·명시 허용값의 전체 조건 대응을 검증한다. 의미 매핑의 자연어 가이드에는 회사·그룹·언어 조건과 값 출처를 설명하며 허용된 실제 근거로 해석한다. 복수 후보·조건 부족을 임의 첫 결과로 확정하지 않는다. CODE_VALUE/DISPLAY_NAME 정형 바인딩을 강제하지 않는다.
      response_name: 응답 내 코드명은 필드값 의미 매핑의 참조 가이드에서 같은 등록 항목/대응 키를 안내할 수 있다. NAME_FIELD_ID/MATCH_MODE 기반 자동 제공 방식은 요구하지 않는다. 코드명 해석과 서버 결과 상태를 혼합하지 않는다.
      inline: 의미 매핑 INLINE은 ENT-030 MEANING 역할의 안정 항목 ID·정확 자료형/원값·명칭·의미/사용 조건을 사용한다. ENUM 허용값·FIXED·DEFAULT와 구분하며 다른 이름 표를 복제하지 않는다.
      lookup: API_LOOKUP은 input_api_lookup의 안정 ID 참조이며 아래 정확 판/필드 바인딩 규칙의 대상이 아니다. 입력 확보/명시 허용값의 정형 참조는 현재 기술 검증을 유지한다. 의미 매핑 GUIDE는 등록 데이터소스/카탈로그 등 허용된 조회 원천을 자연어로 안내하고 실제 조회 결과로 해석한다. 제공 시스템에서 원천을 추정하거나 자동 코드명 조회 엔진/캐시를 요구하지 않는다.
      states: ENT-034는 자기 API 응답의 실행 결과 관련 RESPONSE 스칼라 필드와 MEANING 코드 항목을 참조한다. 코드값/타입/명칭·의미는 항목에서 읽고 상태 대응은 유일해야 한다. GUIDE만 있는 필드·삭제/변경/타입 불일치 항목은 유효 판정으로 저장하지 않는다. 미등록/복수/응답 부재는 UNKNOWN이며 의미 해석 실패로 원 실행을 재전송하지 않는다.
      protections: IDENTITY/REQUEST_KEY는 SERVER 원천·소유 REQUEST 대상만 허용하고 신뢰 계약의 허용 문맥 키를 사용한다. 사용자/모델/응답값으로 신원·추적·인증·보호 헤더를 덮지 못한다. RESULT/후속 가이드는 실행 지시가 아니며 자연어에 적힌 미등록 ID/주소를 새 호출 대상으로 승격하지 않는다
      candidate_set: API_LOOKUP은 input_api_lookup의 안정 ID 참조이며 아래 정확 판/필드 바인딩 규칙의 대상이 아니다. FEAT-014.reference_validation과 FEAT-003.set_public_contract의 전체 후보 집합·SELF/CANDIDATE/EXTERNAL_CONTENT/IMPACT_EVIDENCE/CURRENT_POLICY 분류를 공유한다. 자기/상호 내용 참조는 허용하되 기록한 정확 판을 대조하며 최신/같은 세트 판으로 자동 치환하지 않는다. 영향만 있는 지식/과거 근거는 실제 변경 대상 점유로 만들지 않는다
    edit_transaction:
      scope: REQ-601.management_storage의 전체 직접 저장/이력/명령 결과
      save: commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다.
      versions: REVISION은 마스터에만 있고 실제 반영 성공마다 정확히 한 번 증가한다. 자식 변경도 같은 부모 잠금/기준 리비전 검사를 따른다.
      restore: HISTORY 전체 구성을 읽어 현재 적용본의 baseRevision·현재 권한으로 새 직접 변경을 저장하고 원 이력번호를 근거로 남긴다. 과거 이력을 덮어쓰지 않는다.
      result: commandKey/status/targets[{targetKind,targetId,baseRevision,appliedRevision,historyNo}]. APPLIED만 실제 결과 리비전/HISTORY_NO를 가진다. 실패/결과 불명은 원 명령키로 확인하며 같은 명령 재전송은 원 결과만 반환한다.
      atomicity: 현재값·전체 자식·마스터 REVISION·전체 HIST/HISTORY_NO·멱등 성공 결과는 같은 트랜잭션으로 확정한다.
    module_contract:
      connection_owner: admin FEAT-001 제공 시스템·정확 명시 connectionId와 integration 현재 YAML 공개 정의를 사용한다. 시스템/연결 소속·현재 설정 유효성·사용 여부는 실제 호출 전 다시 검사하며 기본 연결 모드는 없다.
      consumer: agent에는 선택한 정확 내용 판과 현재 효력/정책·검수/오픈·연결 관측을 구분해 제공한다. 소비 시 API 자체의 현재 유효 조건·지식 연결·현재 그룹·신원/마스킹/전송 정책·실제 인자·필수 실행 승인을 검사한다. 원 실행 상태와 응답/코드명 처리 상태를 분리하고 코드명 실패로 원 호출을 재전송하지 않는다. 조회 호출은 가려진 원값을 복원하지 않고 현재 행 스코프/허용량을 적용한다
      pending: '@defer P3 integration·agent·access_policy·knowledge — 정확 URL 결합/보호 헤더·현재 배포와 무효화 경합·필드 실행 검증·조회 상한·그룹/반출 및 세트 원장/복구 계약을 연결한다. 코드명 외부 조회 상한/실행 통제가 없으면 해당 기능을 비활성으로 둔다. 첫 구현에서는 캐시/일괄 조회를 도입하지 않으며 도입하려면 현재 권한·회사/그룹·원천 판별 유효성과 상한을 먼저 설계한다'
      save_apply: 현재 변경 권한·전체 API/도구 구성·기대 버전·그룹/참조·기술 계약/검수·현재 연결/외부 오픈을 검증하고 현재값·효력·전체 HIST/명령 결과를 원자 전환한다. 관리자 승인 요청/전결 원장 없이 직접 저장한다.
    verification_cases:
      - API_LOOKUP은 선택한 API 안정 ID만 저장할 수 있어야 한다. 대상 요청/응답 필드나 특정 판 바인딩을 필수로 요구하면 실패다. 다른 소유 필드/미등록 대상 참조는 거부한다. 비API LOOKUP의 소유·정확 참조 검증은 유지한다
      - SERVER 출처가 다른 요청 필드 대상·외부 참조·LOCAL_FIELD 원천을 사용하면 거부한다. FIXED가 DEFAULT 값 행을 선택해도 거부한다
      - 후속 조회 API는 자신의 입력 가이드로 원 실행 문맥의 requestId를 확보하고 자신의 응답 판정으로 해석한다. 원 API에 중복 입력/상태 대응을 요구하면 실패다. 조회 권한/필수값이 없으면 호출하지 않고 결과를 추정하거나 원 실행을 재전송하지 않는다
      - 배열 순서를 바꾸어도 전체 키의 코드/명칭만 연결한다. 동일 코드가 다른 회사에 존재하면 전체 조건으로 구분하고 부족/복수 결과는 확인 불가다
      - 같은 commandKey의 응답을 잃은 뒤 편집 버전이 올라갔더라도 원 성공 결과를 재생한다. 같은 키의 다른 구성은 409이며 새로운 판을 만들지 않는다
      - 자기 조회 참조를 가진 API를 복사하면 자기 참조만 새 판으로 바꾼다. 다른 API/카탈로그 참조는 원 판을 유지하여 제출 최신성 검사를 받는다
      - 현재 변경 권한 없음·낡은 기준 리비전·필수 참조/기술 계약 오류는 전체 직접 저장을 거부하고 현재값/이력을 유지한다.
      - 전체 이력 일부 실패는 같은 저장 단위의 현재값/리비전도 롤백한다. 동일 명령 재전송은 원 결과만 반환한다.
      - 사용처 조회가 연결 지식 본문 수집/업무 의미 영향 판단/보완 작업 생성으로 확대되면 실패다.
      - 원천에서 필드를 제거해도 설정/안정 ID는 false로 보존한다. 파싱/리로드 실패로 전체 false 처리하거나 같은 경로의 형 변경을 삭제 자격으로 바꾸면 실패다.
      - 참조 중 불일치 필드·일치/null 행 삭제와 보호 구조/타 자산 설정 붙여넣기를 거부한다. 원본/필드/판정/HIST 일부 실패는 전체 롤백한다.
    types:
      BusinessApiFilter: SearchRequest.params의 businessName/targetSystemId/operationType/lifecycle 선택. conditions는 같은 허용 필드, sorts는 apiId/businessName/appliedAt와 동률 apiId. PageSpec 공통 offset 페이지 제한
      BusinessApiKey: apiId:필수 양의 십진 문자열. 현재 권한 안에서 폐지 항목도 조회한다
      BusinessApiRow: apiId/currentRevisionId/stateVersion/lifecycle·업무명·제공 시스템·유형·실제 반영 시각. 관리 상태와 공동 오픈/호출 조건은 별도 필드 useYn:Boolean,connectionId:필수 명시 ID,configurationMismatch:Boolean|null,mismatchReason,checkedAt/appliedSettingsId를 반환한다. configurationMismatch는 REQ-601.configuration_diagnosis에 따라 현재 적용본의 선택 연결이 참조하는 ENT-098 판정이며 API별 사본은 없다. 부모 자체 누락은 반영하되 시스템 전체 자식 집계는 복사하지 않는다. 기존 진단 세 컬럼/선택 열은 제공하지 않고 안전한 사유는 배지 설명/경고로 제공한다. 연결 정보 컬럼 하나로 선택·표시하고 적용 연결 컬럼/중복 응답 필드는 추가하지 않는다. 배지 설명은 저장된 연결 기준임을 안내한다. 미저장 연결/스위치 입력·저장 실패로 현재 진단을 바꾸지 않고 행 되돌리기는 저장된 선택을 복원한다. 저장 성공 후 응답/재조회로 새 연결 판정을 표시하며 새 판정 조회 실패는 확인 필요로 표시한다. 사용 가능 서버 내부 판정·호출 차단은 유지한다. 상단 멱등성 보장 여부(기본 미보장)와 검수/설명 메모를 포함한다. 기간·키 조건은 별도 관리하지 않고 필요한 설명만 자유 메모/가이드에 기록한다.
      BusinessApiDetail: BusinessApiRow·호출 계약 설명을 통합한 API 사용 가이드·현재 연결 관측·연결 지식 탭의 권한 있는 사용처 역조회. 대응 도구 조회/표시는 제공하지 않는다. 실패/열람 제한을 사용처 없음으로 바꾸지 않는다.
      BusinessApiRevisionKey: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      BusinessApiRevisionRow: 안정 대상ID/적용 리비전/HISTORY_NO·이력 저장일시/실제 변경자·변경 사유·작업 종류. 성공 적용 이력만 조회한다.
      BusinessApiComposition: ENT-012 편집 항목, ENT-013/014/030~034/037 전체 자식 목록과 FEAT-008 소유 전체 정책 후보. 필드별 fieldId 또는 신규 clientKey, 판 내 순번/참조·검수 의도/근거를 사용한다. 서버 값은 입력 금지. DB 물리명을 그대로 클라이언트 필드명으로 노출하지 않고 logical attribute와 일대일 대응한다 전체 구성에 수동 useYn과 제공 시스템/명시 connectionId를 포함한다. 연결 모드/기본 연결 값·신원 필요 스위치는 받지 않으며 기술 파생 진단은 서버 전용이다. 신원 계약의 소유/검수는 REQ-609.identity_verification를 따른다. REQ-608.api_workspace의 편집 가능한 탭·통합 가이드·경로 순서·구조화 결과 판정·검수 메모와 response_access의 이력/그룹 마스킹 수준을 같은 전체 구성에 포함한다. JSON 원샘플과 조회 전용 연결 지식 역조회는 저장 입력에 포함하지 않는다. 상단 내용 마스터 소유 bodyJsonSchema/responseJsonSchema(또는 명시 본문 없음)와 도출 필드/보존 불일치 필드를 포함한다. 실제 샘플 값은 제외한다. schemaMatched와 원천 지문은 서버 재계산 값이며 클라이언트의 임의 값은 신뢰하지 않는다.
      BusinessApiRevisionDetail: BusinessApiRevisionRow·당시 전체 BusinessApiComposition·고정 참조와 검수 근거. 현재 정책은 별도 관측이며 과거 판을 현재 값으로 재구성하지 않는다
      AssetReferencesQuery: targetKind/targetId와 명시 CURRENT 또는 HISTORY의 appliedRevision/historyNo. 현재 열람 권한·대상 소유/세트를 검사한다. 로컬 입력의 기술 참조 후보 검증은 전체 구성/baseRevision을 별도로 받고 운영값/요청 상태를 만들지 않는다.
      AssetReferenceRow: 대상 안정 ID/종류·표시명·적용 리비전·연결 경로·현재 참조 여부를 현재 열람 권한 안에서 조회한다. 연결 지식 본문/사용 설명 자동 수집·업무 의미 영향 판단/보완 작업은 제공하지 않는다. 매핑 링크를 표시하는 역조회에는 원 소유 mappingActive:boolean|null도 별도로 제공하며 currentRef는 기술 참조 보호용 응답 문맥으로 보존한다. 화면 활성 표시를 currentRef에서 계산하지 않는다.
      AssetValidationQuery: 현재 대상/기대 리비전·전체 로컬 편집 구성과 같은 명시 변경 대상 집합. 기술 검증만 반환하며 저장/승인 상태를 만들지 않는다.
      AssetValidationResult: 원 targetKind/targetId/readContext와 검증 결과·현재 권한·후보/외부 적용 참조를 구분해 반환한다. 후보는 requestNo+대상키, 외부 참조는 안정 ID+적용 리비전이다.
      AssetReferenceQuery: targetKind/targetId와 명시 CURRENT 또는 HISTORY의 appliedRevision/historyNo. 현재 열람 권한·대상 소유/세트를 검사한다. 로컬 입력의 기술 참조 후보 검증은 전체 구성/baseRevision을 별도로 받고 운영값/요청 상태를 만들지 않는다.
      AssetReferenceCandidate: 입력 확보용 API_LOOKUP 후보는 안정 apiId·API명·대상 시스템 표시명·조회 유형과 현재 선택 가능 상태를 반환한다. 명세 판이 관측 정보로 제공돼도 선택 저장값에 고정하지 않는다. 후보 선택은 현재 관리 열람 범위, 실제 호출은 호출 주체의 권한/현재 효력을 다시 검사한다. 다른 정확 기술 참조 후보는 원 targetKind/targetId/readContext·검증 결과와 현재 또는 명시한 동일 로컬 편집 문맥을 구분하고 외부 적용 참조의 정확 리비전을 보존한다. 관리자 요청 번호를 새로 만들지 않는다.
      ApiConnectionQuery: BusinessApiRevisionKey·기대 editVersion. API의 명시 연결 ID와 소속 시스템의 현재 YAML 정의를 정확 대조한다. 현재 useYn/유효성/권한 검사는 과거 판 고정과 별개다.
      ApiConnectionResult: RESOLVED/UNAVAILABLE/UNSUPPORTED/UNKNOWN·허용된 connectionId/nodeId/bootId/appliedSettingsId/observedAt·지원/검수 사유. 주소·비밀·보호 헤더 원값 제외
      ApiToolMappingQuery: apiId:필수. 현재 대응과 예약 상태를 구분해 조회한다
      ApiToolMappingResult: currentToolId/currentToolRevisionId/lifecycle·claimOwnerToolId/claimStatus 및 NONE/RESERVED/CURRENT/RETIRED/UNKNOWN. 다른 권한의 도구 상세는 가리고 대응 조회 실패를 없음으로 반환하지 않는다
      AssetCommandQuery: commandKey:필수. 현재 READ+SAVE, 실제 인증 주체, endpoint 소유 종류를 검사한다
      ReadContext: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      ManagementChange: commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다.
      ManagementResult: commandKey/status/targets[{targetKind,targetId,baseRevision,appliedRevision,historyNo}]. APPLIED만 실제 결과 리비전/HISTORY_NO를 가진다. 실패/결과 불명은 원 명령키로 확인하며 같은 명령 재전송은 원 결과만 반환한다.
    exception_map:
      UC-018.E1: 400 필드/경로·구성 오류, 403 권한, 404 없는/다른 소유 참조, 409 기준/참조·대응/현재 조건 충돌
      UC-018.E2: 409 호출 제한과 현재 실행/연결 지원 불일치. 숫자만 바꾸어 통과하지 않는다
      UC-018.E3: 실행 소유 계약의 응답/코드명 실패. 관리 저장 API가 원 업무를 재전송하거나 미실행 확정하지 않는다
      UC-018.E4: 공통 세트 처리의 반려/실패. 기존 현재 포인터 유지
    storage_contract: REQ-601.management_storage 및 40-domain/013-admin-management-history.yaml. 관리 화면은 현재 적용본, 별도 상속 이력은 당시 HIST 전체 세트를 읽는다. 관리자 요청 원장/SNP는 만들지 않는다.
    read_context: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
    save_rule: commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다.
    asset_availability: REQ-601.asset_availability·configuration_alerts. 수동 사용은 전체 직접 저장/이력의 입력이고 자동 진단/사유는 서버 관측이다. 미확인/설정 누락과 모든 저장된 실행 경로의 전송 전 차단을 공개 호출 계약으로 제공한다.
    schema_sync_contract: REQ-608.schema_sync. 원본/동기화 구조·도출 필드·서버 판정·설정 복사/붙여넣기·참조 검증 일괄 삭제를 소유 전체 저장/HIST 단위로 다룬다. 삭제 입력은 stable fieldId 목록이며 서버가 false/원본/참조를 재검증한다. 일치/null 필드 삭제·임의 도출 필드 추가/구조 덮기를 거부한다.
    physical_contract:
      screens:
        SCR-004:
          root: ENT-011
          current_and_owned:
            - ENT-011
            - ENT-012
            - ENT-013
            - ENT-014
            - ENT-030
            - ENT-031
            - ENT-032
            - ENT-033
            - ENT-034
            - ENT-037
            - ENT-153
            - ENT-154
          history_root: ENT-059
          fields: 각 ENT.attributes의 physical_name과 physical.attributes가 저장 타입/NULL의 정본이다. 기존 소유 API의 논리 DTO와 아래 alias를 대조한다. 원천 관측·역조회는 편집 원문에 포함하지 않는다.
          aliases:
            revision: REVISION 또는 MANAGEMENT_VERSION
            targetId: PRIMARY KEY (API_ID)
            connectionId: 배포 문자열 CONNECTION_ID
            connectionRecordId: ENT-017.CONNECTION_RECORD_ID; API 저장 시 정확 소속·현재 세대와 함께 필수 대조
          save_guard: FEAT-040의 전역 원명령/잠금/원자 전체HIST, 기존 소유 API의 입력영역별 완전성/클라이언트행ID 치환/참조 규칙을 함께 적용한다. 설정 정리만 ENT-169/170 미리보기→재검증→ENT-168 전체 결과를 사용한다.
          read_projection: 연결/구조/빈 관측은 설정 세대·조회시각·미확인을 반환한다. exactRevision은 현재 스냅샷의 다른 판으로 대체하지 않는다.
  FEAT-021:
    preserved_reference: REQ-608.schema_sync.preserved_reference. 서버 판정 보존 불일치의 기존 참조는 오류 상태로 전체 저장 가능하며 실행 불가다. 참조 파손 전체 거부는 임의 ID/소유 혼입/실제 삭제를 의미한다. 불일치 필드의 일괄 삭제는 기존 참조 해소 전 금지한다.
    mapping_active: REQ-601.asset_mapping_active. 도구 소유 허용 그룹 링크를 전체 저장/HIST에 보존하며 연결 지식은 역조회다.
    design_status: draft
    implementation: planned
    composition_contract:
      input_api_lookup: REQ-608.input_api_lookup을 도구 소유 입력 필드에 동일 적용한다. 조회 API 안정 ID·값 확보 가이드만 저장하고 대상의 판·입출력 필드 바인딩은 두지 않는다. 소유 도구의 전체 저장/동형 HIST이며 제품 API 소유 자식과 분리한다.
      scope: 현재 업무 내용·전체 소유 관리 자식·접근 그룹은 같은 전체 구성이다. 현재값과 성공 적용 HIST에 동형 매핑하며 외부 소유 관측/비밀은 제외한다.
      internal: system BatchJobRegistry의 Map<String,BatchJob> 허용 인터페이스 목록·저장/실행 시 존재 검증 패턴을 차용한다. 업무 도구 전용 인터페이스를 구현해 검수된 Hub 내부 서비스 빈만 후보로 제공하고 DB에는 구현 식별자와 계약 버전·배포 근거만 참조한다. 임의 빈/클래스/메서드명·스크립트 입력 및 reflection 우회 실행은 금지한다. REQ-612.schema_sync에 따라 상단 리로드/명시 반영으로 입력·응답 계약을 보존하고 JSON 편집은 제공하지 않는다.
      review: 검수 근거는 상단 메모로 기록하고 실제 저장 행위자/시각을 이력에 남긴다. 코드/보안/고객사 검수는 유지하되 별도 관리 승인/검수 탭은 없다.
      owned_policy: 7탭의 소유 편집값·상단·가이드 후속 참조·그룹은 도구 전체 직접 저장/기대 버전/동형 HIST 단위다. 연결 지식은 역조회이며 저장 대상이 아니다. API_ID 자식 구조에 TOOL_ID를 섞지 않는다. 물리 자식 표 분리는 화면 합의 후 상세 설계한다. REQ-608.response_access 및 REQ-611 마스킹 유형/수준 규칙을 내부 도구 응답에도 적용한다. 미분류/미등록 필드는 원문 전달하지 않으며 별도 그룹 예외가 없으면 개인/민감 필드를 이력과 동일하게 마스킹한다. 허용된 복수 그룹의 같은 유형에서는 덜 엄격한 수준, 명시 원문 허용 그룹은 해제를 적용한다. 비교 불가 예외는 저장 충돌로 보완하고 실행 시 해당 값을 비노출하고 설정 오류를 알린다. 이력 마스킹은 그룹 예외로 낮추지 않는다.
      local_edit: 저장 전 입력은 현재 적용본/baseRevision 기준의 로컬 편집값이다. 서버 요청 초안·SNP·EDIT_VERSION을 만들지 않고 저장 때 전체 구성을 재검증한다.
      children: TOOL_ID 소유 입력/응답 필드·GUIDE/INLINE 의미 매핑과 코드 항목·응답 코드 항목 기반 결과 판정·그룹별 응답 전달 예외·사용 그룹·ENT-038 후속 참조를 포함한다. 신규 clientKey는 같은 명령에서 안정 ID로 확정하며 다른 도구 소유 ID 혼입을 거부한다.
    registry_contract:
      input: 현재 권한·검색 또는 implementationId/contractVersion/deploymentRef
      output: 검증된 구현 ID·배포/계약 버전·자동 분석 입출력 스키마/확인 필요·조회/실행 유형·멱등성 근거·데이터 범위·현재 관측 시각/실행 노드 근거. 코드/환경/비밀/빈 상태는 반환하지 않는다.
      analysis: 배포 레지스트리 구성 시 허용 진입점의 입력/반환 타입·중첩 DTO/record·배열/컬렉션 제네릭·런타임 애너테이션을 분석하여 JSON 구조 계약을 생성한다. 프록시의 실제 구현 타입과 제네릭을 해석하고 실제 직렬화/역직렬화 설정의 프로퍼티명·제외/읽기쓰기 방향·검증 제약과 일치시킨다. 메서드 호출·getter 실행·빈 상태/환경값 조회로 샘플을 만들지 않는다. 캐시는 구현/계약 버전·배포 문맥으로 구분한다.
      limits: Map<String,Object>·Object·해석 불가 제네릭·미선언 다형성·순환 타입은 확인 필요로 표시한다. 확정 불가 영역은 개발자가 명시 계약을 제공하고 동일 런타임 검증을 갖추기 전 사용 활성화/호출을 허용하지 않는다. 필수/NULL은 인정된 직렬화·검증 계약으로 확인하고 타입 이름만으로 추정하지 않는다. 파라미터 이름 메타데이터가 없으면 임의 arg0을 업무 필드로 확정하지 않는다.
      boundary: 선택 구현의 고정 진입점에 검증된 입력 객체와 서버가 구성한 실행 문맥을 전달한다. 실제 실행 Spring 컨텍스트의 레지스트리를 저장/호출 전에 확인한다. admin에서 보인 후보나 다른 노드의 배포 사실을 현재 실행 노드의 호출 허가로 대체하지 않는다.
      freshness: 상단 서비스 빈 정보 리로드 요청 시 선택한 실행 배포 문맥의 현재 명세를 확인한다. 입력/응답/버전의 부분 응답·미확정 분석·조회 실패는 전체 실패로 보존하고 현재 성공으로 표시하지 않는다. 실제 호출 직전 검증을 면제하지 않는다.
    verification_cases:
      - 미등록/금지 빈·계약 변경·레지스트리 확인 실패·동적 미확정 구조는 저장/활성화/호출을 구분해 거부한다.
      - 리플렉션은 실제 직렬화 이름/제외/제약과 일치하고 업무 메서드/getter를 실행하지 않는다.
      - 7탭의 다른 도구 ID 혼입·코드/결과 참조 파손·마스킹 충돌은 전체 저장을 거부한다.
      - 현재 변경 권한·기대 버전·전체 이력 일부 실패는 전체 롤백한다. 결과 불명은 원 명령 확인한다.
      - 시간 초과/취소 요청이 이미 발생한 효과의 롤백을 보장하지 않으며 자동 재호출하지 않는다.
      - 사용처 역조회는 지식 본문 수집/영향 작업 생성으로 확대하지 않는다.
      - 원천에서 필드를 제거해도 설정/안정 ID는 false로 보존한다. 파싱/리로드 실패로 전체 false 처리하거나 같은 경로의 형 변경을 삭제 자격으로 바꾸면 실패다.
      - 참조 중 불일치 필드·일치/null 행 삭제와 보호 구조/타 자산 설정 붙여넣기를 거부한다. 원본/필드/판정/HIST 일부 실패는 전체 롤백한다.
    types:
      BusinessToolFilter: businessName/implementationId/operationType/useYn. 허용 정렬·공통 페이징. 원천 유형 조건은 없다.
      BusinessToolKey: toolId:필수 양의 십진 문자열. 폐지 이력도 현재 권한으로 조회
      BusinessToolRow: toolId/currentRevision·이름·implementationId/contractVersion·현재 구현 상태·구현 선언 QUERY/EXECUTE·useYn·멱등성 보장·호출 제한(초)·메모
      BusinessToolDetail: BusinessToolRow·7탭 전체 구성·현재 구현/계약 관측·권한 있는 연결 지식 역조회. 연결 지식은 저장 대상 아님.
      BusinessToolRevisionKey: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      BusinessToolRevisionRow: 안정 대상ID/적용 리비전/HISTORY_NO·이력 저장일시/실제 변경자·변경 사유·작업 종류. 성공 적용 이력만 조회한다.
      BusinessToolComposition: ENT-016과 TOOL_ID 소유 입력/응답·의미 매핑/코드·결과 판정·그룹/응답 예외·ENT-038 후속 참조의 전체 구성. API_ID/sourceKind/HTTP 연결 항목은 없다. 동기화한 전체 입력/응답 구조 계약·구현/배포/계약/관측 근거·보존 불일치 필드를 포함한다. 구조/판정은 서버가 원천과 대조한다.
      BusinessToolRevisionDetail: BusinessToolRevisionRow·당시 7탭 전체 구성·정확 구현/계약/배포 참조. 현재 관측과 구분한다.
      ImplementationQuery: 현재 권한 안의 검증된 내부 구현 검색·계약 버전 조건·공통 페이지. 임의 클래스명 실행 입력 없음
      ImplementationRow: registry_contract.output의 비밀 아닌 요약. 현재 관측이지 이후 호출 허가/예약이 아님
      ReadContext: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
      ManagementChange: commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다.
      ManagementResult: commandKey/status/targets[{targetKind,targetId,baseRevision,appliedRevision,historyNo}]. APPLIED만 실제 결과 리비전/HISTORY_NO를 가진다. 실패/결과 불명은 원 명령키로 확인하며 같은 명령 재전송은 원 결과만 반환한다.
    exception_map:
      UC-019.E1: 400 금지/미지원 원천 입력, 409 검수/배포 무효. 내부 승인으로 우회하지 않는다
      UC-019.E2: 404 없는/다른 소유 참조, 403 현재 권한, 409 최신성/사용처/검증 실패. 조회 실패를 연결 없음으로 치환하지 않는다
      UC-019.E3: 409 현재 구현 계약과 불일치, 400 미확정 구조/지원하지 않는 타입. 차이를 보완하기 전 사용 활성화/호출 금지.
