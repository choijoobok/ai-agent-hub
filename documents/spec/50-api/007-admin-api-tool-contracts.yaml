    read_context: kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다.
    save_rule: commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다.
    asset_availability: REQ-601.asset_availability. 기존 EXPOSE_YN에 대응하는 논리 useYn/사용 여부 하나로 후보와 이후 호출을 함께 제한한다. 단순 숨김과 실행 중지를 별도 flag로 복제하지 않으며 저장된 워크플로우/직접 호출도 검사한다. 현재 진단은 미저장 입력과 별개다.
    schema_sync_contract: REQ-612.schema_sync. 원본/동기화 구조·도출 필드·서버 판정·설정 복사/붙여넣기·참조 검증 일괄 삭제를 소유 전체 저장/HIST 단위로 다룬다. 삭제 입력은 stable fieldId 목록이며 서버가 false/원본/참조를 재검증한다. 일치/null 필드 삭제·임의 도출 필드 추가/구조 덮기를 거부한다.
