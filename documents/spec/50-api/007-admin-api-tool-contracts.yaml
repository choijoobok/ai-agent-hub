  "FEAT-021":
    "design_status": "draft"
    "implementation": "planned"
    "composition_contract":
      "scope": "현재 업무 내용·전체 소유 관리 자식·접근 그룹은 같은 전체 구성이다. 현재값과 성공 적용 HIST에 동형 매핑하며 외부 소유 관측/비밀은 제외한다."
      "api": "API 종류는 안정 API/정확 판·원천과 같은 QUERY/EXECUTE 유형을 요구하고 구현/배포 참조·내부 가이드/ENT-038은 null/빈 목록이다. API 계약 변경을 도구 판에 자동 반영하지 않는다. 같은 세트의 정확 API 후보를 선택하거나 외부 최신 유효본을 검증한다"
      "internal": "INTERNAL은 agent 공개 목록의 implementationId/contractVersion/deploymentRef와 검수 근거를 사용한다. 입력으로 임의 클래스/빈/스크립트·환경 설정·자격증명을 받지 않는다. 실제 금지 구현·무효 검수·미배포 계약은 등록/노출을 거부한다. 가이드의 후속 참조는 ENT-038로 정형화하고 현재 권한/새 실행 승인 조건을 유지한다"
      "review": "검수 의도/근거만 입력받고 실제 주체/시각을 기록한다. API/구현 계약·그룹·노출·가이드가 바뀌면 해당 검수를 갱신한다. 내부 구현의 코드/보안/고객사 시험 근거는 관리 승인과 별개다"
      "owned_policy": "@defer P3 access_policy — 도구 전체 허용 그룹 후보 저장/고정 참조를 연결한다. EXPOSE_YN=Y도 현재 원천·지식 연결·양쪽 그룹/정책을 충족해야 노출한다"
      "local_edit": "저장 전 입력은 현재 적용본/baseRevision 기준의 로컬 편집값이다. 서버 요청 초안·SNP·EDIT_VERSION을 만들지 않고 저장 때 전체 구성을 재검증한다."
    "api_mapping_contract":
      "scope": "REQ-612.api_tool_mapping·ADR-031에 따라 한 API에 대응하는 안정 도구는 하나다. 관리자 요청/서버 초안은 점유 근거가 아니다."
      "acquire": "직접 저장 트랜잭션에서 관련 API/도구 부모를 공통 순서로 잠그고 현재 대응/폐지 마지막 대응을 확인해 ENT-035 유일성을 검사한다. 다른 도구가 이미 대응하면 전체 저장을 롤백한다."
      "transition": "API A→B 실제 저장에서 B 유일성을 확보하고 현재 포인터/전체 이력과 함께 전환한다. A가 다른 현재/폐지 마지막 대응의 근거가 아니면 같은 트랜잭션에서 해제하며 과거 이력만으로 영구 점유하지 않는다."
      "retirement": "비활성/폐지된 마지막 API 대응은 기존 도구 안정 ID로 유지한다. 과거 이력과 현재/폐지 마지막 대응을 구분하고 새 도구 ID로 유일성 제한을 우회하지 않는다."
      "consumption": "agent는 예약자 대신 현재 적용 API/도구 대응·양쪽 계약/그룹·노출·지식 연결·신원을 검증한다. 없음/충돌/조회 실패는 임의 도구 선택으로 대체하지 않는다."
    "registry_contract":
      "input": "현재 주체·검색 조건 또는 저장된 implementationId/contractVersion/deploymentRef"
