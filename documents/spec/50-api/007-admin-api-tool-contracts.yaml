    "verification_cases":
      - "도구 T의 현재 API A와 변경 후보 B는 T가 함께 점유한다. B 후보 하나를 취소해도 다른 작업 중 B 후보가 남으면 B를 해제하지 않는다"
      - "T가 A를 마지막 대응으로 폐지된 경우 A에 새 toolId 등록을 거부하고 T의 새 후보로 복원한다"
      - "T의 A→B 실제 반영 후 A의 작업 중/현재/폐지 대응이 모두 사라지면 A 점유를 해제하되 A의 과거 판은 보존한다. 단순 역사만으로 A를 영구 차단하지 않는다"
      - "API/도구 후보의 그룹 계약이 미완성·조회 실패이면 고정/반영하지 않는다. API가 미래 오픈 또는 원천 무효인 경우 내부 승인만으로 노출/호출하지 않는다"
      - "현재 변경 권한 없음·낡은 기준 리비전·필수 참조/기술 계약 오류는 전체 직접 저장을 거부하고 현재값/이력을 유지한다."
      - "전체 이력 일부 실패는 같은 저장 단위의 현재값/리비전도 롤백한다. 동일 명령 재전송은 원 결과만 반환한다."
      - "사용처 조회가 연결 지식 본문 수집/업무 의미 영향 판단/보완 작업 생성으로 확대되면 실패다."
