feature_contracts:
  FEAT-001:
    security_domain_scope: "ARCH-050.admin_account_contract. 관리 명령의 인증·ACTOR_ID·지문·원 결과 소유 비교는 system 관리자 영역이다. Portal 주체/같은 문자열 ID로 실행·재생하지 않으며 Portal 대상 이용자와 처리자를 구분한다"
    design_status: "draft"
    implementation: "planned"
    request_rule: "모든 관리 호출은 현재 AUTHZ-090 액션 권한을 검사한다. service POST/body·ApiResponse·SearchRequest/PageResponse를 재사용하며 주체·반영 시각은 서버가 정한다. 이 절의 DTO 이름은 설계명이며 현재 Java 구현이 아니다"
    response_rule: "저장된 관리 정의와 현재 연결 관측을 별도 값으로 반환한다. API 연결의 읽기 전용 표시 정보는 REQ-604.connection_display에 따라 ConnectionDisplay로 반환한다. 접속 주소 원문·인증값·고정 헤더·비밀은 반환하지 않으며 저장 성공이 배포 완료·모든 API 호출 가능을 뜻하지 않는다. DATA_SOURCE의 주소·계정·풀 설정 비노출은 유지한다"
    shared_write_contract:
      scope: "FEAT-001·002의 직접 변경에만 적용한다. 다른 소유 자산의 전체 직접 저장·실제 업무 실행 요청과 별도이며 새로운 결재 단계를 추가하지 않는다"
      identity: "commandKey는 한 저장 의도를 식별하는 소문자 UUID 표준 문자열이며 X-Request-Id/traceId와 다르다. 같은 입력 재수신은 같은 키, 편집 의도 변경은 새 키를 사용한다. 생성 ID는 JPA TABLE/SYS_SEQUENCE의 Long이며 JSON에서는 모든 BIGINT 식별자·관리/기대/반영 버전·변경 순서를 양의 십진 문자열(1~9223372036854775807)로 주고받는다. 증가 시 최대값을 넘으면 저장을 거부한다. 기존 system DTO를 바꾸지 않는다"
      input_digest: "서버가 인증 주체·기능/작업·요청 대상 ID(신규는 null)·기대 버전·정규화한 전체 관리 입력/집합·사유·배포 참조 정정 근거를 정해진 필드 순서의 UTF-8 JSON으로 직렬화해 SHA-256 지문을 만든다. 집합은 중복 거부 후 식별자 순으로 정렬하고 null/빈값/생략을 합치지 않는다. 신규 채번 ID·traceId·서버 현재 시각·관측 시각은 지문에서 제외한다. 비밀값과 임의 미등록 입력은 거부한다"
      preflight: "현재 권한과 명령 형식을 먼저 확인한다. 같은 키의 기존 결과는 주체·기능·입력 지문이 모두 일치할 때만 반환하며 다른 입력은 409, 다른 주체는 403이다. 기존 성공의 조회/재생은 대상이 삭제됐어도 가능하지만 현재 권한 검사를 생략하지 않는다"
      transaction: "admin DB READ COMMITTED에서 같은 부모의 모든 소유 관리 쓰기를 직렬화한다. 원 명령 재조회·현재 권한/기대 버전/참조 검증 뒤 HISTORY_NO와 주입 Clock의 HIST_DTM을 한 번 발급한다. 현재값/전체 자식과 원본별 _HIST 복사 행·세트 전체·ENT-019 성공 결과(historyNo 포함)를 같은 트랜잭션에 저장한다. 모든 _HIST 행의 HIST_ID는 별도 서로게이트 키다. 최초 등록·수정은 반영 후 전체, 삭제는 제거 직전 전체와 DELETE 근거다. 행별 부분 성공은 기존 단위를 유지하며 세트 일부 실패는 해당 저장 전체 롤백이다. 커밋 전 결과를 공개하지 않는다."
      concurrency: "기대 버전은 신규만 null, 기존 변경/삭제는 현재 양의 버전과 일치해야 한다. 같은 이전 버전의 두 변경 중 하나만 성공하며 충돌을 자동 병합/재시도하지 않는다. 명령 키 유일성 경합으로 트랜잭션이 실패하면 그 트랜잭션에서 계속 조회하지 않고 종료 후 새 읽기에서 동일 주체/입력의 성공 결과를 확인한다. 결과가 아직 없으면 불명으로 안내하고 같은 키로 확인/재시도한다"
      reference_guard: "연결 허용 집합/기본값 축소·삭제와 API/신원 참조의 추가/교체는 동일 대상 시스템 부모 행을 잠근 뒤 검사/반영한다. 데이터소스 그룹 축소/삭제와 하위 카탈로그·그룹/신원 참조 쓰기도 같은 데이터소스 부모를 잠근다. 여러 부모는 대상 종류+숫자 ID 정렬 순으로 잠그며 실제 참조 쓰기 경로 모두가 참여해야 보호된다. 단순 목록/상세 조회에는 잠금을 걸지 않는다. 후속 자산 반영 구현이 이 계약을 지키기 전 경합 안전을 구현 완료로 표시하지 않는다"
      result: "ENT-019는 성공한 결과만 보관한다. 같은 키/입력 재수신은 새 버전·이력·생성 ID를 만들지 않는다. 응답 유실 뒤 getCommandResult가 미발견을 반환하면 UNKNOWN이며 미실행 확정이 아니다. 클라이언트는 새 키로 생성하지 않고 원 키를 사용한다. 재생 봉투의 traceId는 이번 HTTP 요청의 값이고 data.appliedAt은 원 반영 시각이다"
      deletion: "현재 참조 검증을 통과한 삭제는 마지막 관리 구성에 deleted=true와 삭제 반영 버전을 붙인 동형 복사 이력 세트을 기록하고 자식 집합/현재 행을 함께 제거한다. 이력·명령 결과는 남기며 현재 대상/주체 FK나 ON DELETE CASCADE를 두지 않는다. 삭제 동형 복사 이력 세트의 구성은 마지막 설정이지 현재 유효 설정이 아니다. 같은 ID는 재사용하지 않고 과거 조회는 현재 행과 내부 조인하지 않는다"
      retention: "@defer P3 audit_trace — ENT-019 결과/키 보존과 늦은 동일 키 재수신 차단을 관리 이력 정책과 함께 정한다. 보존 종료 뒤 미발견 키를 신규 명령으로 잘못 수용하지 않는 계약을 갖추기 전 결과 파기를 활성화하지 않는다"
    types:
      TargetSystemValues: "systemName:필수 1~100자, description:nullable text, useYn:Y/N, allowedConnectionIds:필수 집합(빈 집합 가능), defaultConnectionId:nullable/집합 소속. 연결 식별자는 배포 원문과 정확히 비교하며 공백/대소문자 변환·절단하지 않는다. 연결 ID 최대 100자를 넘는 배포 후보는 미지원 사유를 표시하고 저장하지 않는다"
      TargetSystemSave: "commandKey:UUID, id:신규 null/기존 양의 십진 문자열, expectedVersion:신규 null/기존 양의 십진 문자열, values:TargetSystemValues 전체, reason:필수 비공백. 누락 필드를 기존값으로 자동 보충하는 부분 변경은 받지 않는다"
      AssetDelete: "commandKey:UUID, id:필수, expectedVersion:필수, reason:필수. 대상 종류는 API 경로로 서버가 결정한다"
      AssetDetailKey: "id:필수 양의 십진 문자열. 과거 이력 상세는 id와 historyNo를 함께 검증하며 다른 대상 이력을 섞지 않는다"
      AssetCommandKey: "commandKey:필수 UUID. 조회에도 같은 주체 및 해당 기능의 현재 READ·SAVE 권한을 서버에서 요구한다. 같은 주체라도 API 경로의 대상 종류와 일치해야 한다. 다른 주체/종류의 키와 미발견은 동일 UNKNOWN으로 응답해 존재/결과를 노출하지 않는다"
      AssetMutationResult: "commandKey, targetKind, id, version, action, appliedAt:서버 Instant, historyNo:신규 포함 필수 양의 이력 세트 번호. 처리 결과만 반환하며 전체 민감 관리값을 재생 사본에 넣지 않는다"
      AssetCommandResult: "status:APPLIED/UNKNOWN, result:APPLIED일 때 AssetMutationResult. UNKNOWN은 진행 중·롤백·미접수를 구분할 근거가 없다는 뜻이다"
      TargetSystemDetail: "저장된 id/version/values·REG/MOD 근거·변경 사유와 별도 ConnectionObservation을 반환한다. 값 수정 권한과 배포 연결/신원 사용 권한은 구분한다"
      AssetReferencePage: "권한 있는 사용처의 대상 종류/안정 ID·기본/특정 연결·참조 목적과 PageResponse. 화면 페이지가 비었다는 이유로 서버 참조 검사 전체가 없음으로 판정하지 않는다"
      AssetHistoryDetail: "이력 종류·원 id·historyNo·histStoredAt·historyActorId·action·reason·changeSummary·historySchemaVersion과 그 시점의 master/전체 소유 자식 행. 데이터는 _HIST의 타입별 컬럼으로 반환한다. JSON 원문/스냅샷 뷰어 DTO를 반환하지 않는다. 현재 행이나 현재 자식·현재 관측과 조인하지 않는다."
      TargetSystemFilter: "systemName:선택 부분 일치, useYn:선택 Y/N. 검색·정렬·페이지는 공통 SearchRequest의 현재 필드/제한을 사용하며 허용 정렬은 systemName/id/modifiedAt이다. 동률은 id로 정렬한다"
      TargetSystemRow: "id/version/systemName/description/useYn/defaultConnectionId/modifiedAt/lastChangeReason. 상단 그리드의 모든 1:1 현재값을 반환하며 lastChangeReason은 현재 CHANGE_REASON의 읽기 값이다. 새 명령 reason과 구분한다. allowedConnectionIds와 현재 관측은 상세/각 탭 계약으로 조회하며 비밀은 반환하지 않는다"
      ConnectionCandidates: "nodeId/bootId/appliedSettingsId/observedAt, page:PageResponse<ConnectionCandidate>. 전체 조회 실패는 503이며 빈 page로 성공하지 않는다"
      ConnectionCandidate: "connectionId·비밀 없는 표시 설명·현재 선택 가능 여부. API는 display:ConnectionDisplay를 포함하며 node/boot/appliedSettings/observedAt는 ConnectionCandidates의 같은 불변 조회 근거를 따른다. DATA_SOURCE는 DBMS/지원 파서 근거를 포함하고 display는 제공하지 않는다. 개별 기존 연결의 정확한 상태는 ConnectionObservation으로 별도 표시한다"
      ConnectionDisplay: "displayBaseUrl:nullable string(이동 링크가 아닌 표시 텍스트), authenticationType:nullable string(실제 채택한 방식의 허용 코드/명칭), displayStatus:AVAILABLE/REDACTED/UNAVAILABLE, displayReason:nullable 비밀 없는 사유 코드/표시. REQ-604.connection_display의 서버 정제 결과만 제공한다. AVAILABLE은 전체 안전한 기본 주소, REDACTED는 제거/가림을 포함한 안전한 주소이며 displayBaseUrl을 제공한다. 안전한 주소 구성 불가·MISSING·관측 실패는 UNAVAILABLE/displayBaseUrl=null이다. 인증 방식 자체가 확인되면 주소 표시 제한과 별도로 제공할 수 있으나 MISSING·관측 실패에서는 authenticationType도 null이다. 자유 입력 설정 문자열을 인증 방식/사유에 반사하지 않는다. 문자열은 화면에서 텍스트로 이스케이프한다"
      ConnectionFilter: "keyword:선택 식별자 검색, assetId:선택 기존 관리 대상 ID. 연결 종류는 API 경로에서 결정하고 현재 주체의 허용 조회 범위에서만 검색한다"
      ConnectionObservation: "nodeId/bootId/appliedSettingsId/observedAt와 connectionId별 PRESENT/MISSING/UNAVAILABLE, 비밀 없는 사유. API는 동일 불변 정의의 display:ConnectionDisplay를 덧붙인다. 연결 존재 상태와 displayStatus를 혼합하지 않는다. DATA_SOURCE에만 관측 제품명/버전·관측 성공/미확인과 관리값 대조 결과, 지원 DBMS/파서 후보·호환성 근거를 덧붙인다. 후보 페이지에서 ID가 안 보인다는 이유로 MISSING을 판정하지 않고 선택 ID 정확 조회를 수행한다"
      AssetHistoryFilter: "원 관리 화면별 HistoryFilter를 사용한다. id는 직접 진입을 위한 선택 원 ID이며 현재 행 존재를 검사하지 않는다. histFrom/histTo는 이력 저장일시의 시작 포함·끝 제외 UTC Instant이며 둘 다 지정/생략한다. 결과 정렬은 histStoredAt DESC, historyNo DESC로 안정화하고 원 관리 조건은 보존된 당시 컬럼에 적용한다."
      AssetHistoryRow: "원 화면별 HistoryRow를 사용한다. 원 마스터의 전체 표시 컬럼과 changeSummary만 보이는 열로 제공한다. historyNo/histStoredAt/historyActorId/action/historySchemaVersion은 이력 문맥이다. REG/MOD 표시값은 복사 원본 값이고 이력 저장일시를 MOD_DTM처럼 바꾸지 않는다."
      AssetHistoryKey: "id/historyNo:필수 양의 십진 문자열. 경로로 결정한 이력 종류·원 ID·세트 번호의 소유 관계와 현재 이력 메뉴 READ/열람 범위를 함께 검사한다. 다른 대상/종류의 세트는 404다. HIST_ID는 테이블별 내부 행 키이며 선택 세트 번호로 대신 쓰지 않는다."
      TargetSystemHistoryFilter: "TargetSystemFilter의 systemName/useYn + 선택 id + histFrom/histTo. 원 화면의 조건 의미를 유지하고 과거 _HIST 행에서 검색한다."
      DataSourceHistoryFilter: "DataSourceFilter의 alias/DBMS·관리 조건 + 선택 id + histFrom/histTo. 정확한 원 조건 필드는 DataSourceFilter를 상속하며 현재 테이블의 값으로 검색하지 않는다."
      TargetSystemHistoryRow: "TargetSystemRow의 당시 관리 컬럼 + changeSummary, 숨은 historyNo/histStoredAt/historyActorId/action/historySchemaVersion. allowedConnections는 같은 세트의 ENT-044로 읽으며 현재 연결 display는 포함하지 않는다."
      DataSourceHistoryRow: "DataSourceRow의 당시 관리 컬럼 + changeSummary, 숨은 historyNo/histStoredAt/historyActorId/action/historySchemaVersion. 그룹/코드 정의·파라미터·바인딩은 같은 세트의 ENT-045~048을 읽는다."
    integration_public_contract:
      implementation: "planned"
      interface: "integration 소유의 로드 연결 목록/정확 식별 조회 계약. admin은 읽기만 하며 연결/풀을 만들거나 설정 파일을 수정하지 않는다. 외부 연동 IF나 구현된 Java 메서드로 가장하지 않는다"
      input: "연결 종류(API/DATA_SOURCE), 선택 식별자 집합, 현재 주체의 허용 조회 범위. 명령 저장은 클라이언트가 보낸 정상 표시 대신 서버가 다시 조회한다"
      output: "nodeId·bootId·appliedSettingsId·observedAt와 식별자별 PRESENT/MISSING/UNAVAILABLE 결과. API는 REQ-604.connection_display의 ConnectionDisplay를 현재 불변 로드 정의에서 함께 생산한다. 주소 원문·인증값·헤더·비밀과 DB 주소·계정·풀 설정은 제외한다. 목록 조회 전체 실패는 빈 배열로 반환하지 않는다"
      display_boundary: "READ와 현재 연결 조회 범위를 서버에서 검사하고 EXPORT도 같은 안전한 표시만 제공한다. 원 설정 객체/암호문/비밀 참조를 직렬화한 뒤 화면에서 가리지 않는다. 표시값은 관리 values·명령 지문·스냅샷·결과 저장에 넣지 않고 Portal/LLM/실행 인자로 제공하지 않는다. 배포 파일 예정값이나 다른 노드의 마지막 관측을 현재값으로 대체하지 않는다. 표시 생성 불가를 연결 MISSING·호출 불가로 판정하지 않으며 실제 실행 검증은 ARCH-028을 따른다"
      validation: "저장 시 현재 로드된 정확한 선택 ID/지원 근거를 검증한다. 조회 뒤 배포가 바뀔 수 있으므로 이 관측을 미래 호출 허가로 저장하지 않는다. 실제 소비는 ARCH-028·030의 동일 연결/현재 권한·노드 효력을 다시 검증한다. 기존 참조 부재/조회 장애에서는 저장값을 삭제·대체하지 않는다"
      parser_catalog: "DATA_SOURCE 조회는 지원 DBMS 코드·기본 파서 제안·파서 식별/호환성 근거를 제공한다. 기본 제안은 편집 초기값일 뿐 미지정/미지원 파서를 런타임 자동 대체하지 않는다"
      dependencies:
        - "ARCH-028"
        - "ARCH-030"
        - "ARCH-050"
        - "REQ-403"
        - "REQ-603"
        - "REQ-604"
    exception_map:
      UC-015.E1: "409 err.admin.asset.referenceConflict"
      UC-015.E2: "400 err.admin.asset.invalidInput"
      UC-015.E3: "503 err.admin.asset.dependencyUnavailable"
    errors:
      validation: "400 err.admin.asset.invalidInput — 필수/길이/상태값·집합 중복·기본값 이탈·미지원 파서/연결. 개인정보/비밀 입력은 원문을 오류/로그에 반사하지 않는다"
      conflict: "409 err.admin.asset.versionConflict 또는 commandConflict 또는 referenceConflict — 현재 권한 안에서 충돌·사용처를 안내하고 전체 롤백한다"
      unavailable: "503 err.admin.asset.dependencyUnavailable — 필요한 배포/정책/참조 조회 실패. 빈 후보/미사용으로 치환하지 않는다. 이력/DB 저장 자체 실패는 기존 500 봉투로 처리한다"
      authorization: "401/403 및 404는 공통 규약. MSG 키의 실제 등록·시드와 문구는 화면/구현 단계에서 연결한다"
    history_contract:
      rules_from:
        - "REQ-601.change_history"
        - "ADR-035"
      naming: "원본 테이블명 + _HIST. 모든 이력 표의 PK HIST_ID는 테이블별 SYS_SEQUENCE/JPA TABLE 발급이다. HISTORY_NO는 세트 번호이며 원본 키/시각을 합성 키로 쓰지 않는다."
      mapping: "ENT-001→ENT-003(AI_ADMIN_TARGET_SYSTEM_HIST), ENT-017→ENT-044(AI_ADMIN_TARGET_SYSTEM_CONN_HIST). 원본의 전체 허용 관리 컬럼을 복사하고 실제 변경 요약은 기준 정보/허용 연결을 비교한다."
      time: "HIST_DTM은 마스터 이력에만 명시 저장한다. 자식은 HISTORY_NO와 원 부모 키로 같은 마스터를 참조하고 기간 검색/반출 시 마스터 시각을 조인한다. 원 REG_DTM/MOD_DTM은 그대로 보존한다."
      view: "SCR-040은 SCR-001의 조회조건·컬럼·배치/탭을 읽기 전용으로 상속한다. 변경 요약과 이력 저장일시 범위만 추가한다. 별도 HISTORY 메뉴 READ/EXPORT를 검사하며 현재 관리 화면 변경 이력 탭/JSON 모달은 제거한다."
      query: "API-007 목록은 TargetSystemHistoryFilter, API-008 상세는 AssetHistoryKey로 조회한다. 원 ID+historyNo+종류를 함께 검증하고 같은 세트 전체만 반환한다. 삭제된 원본도 _HIST로 조회한다. 누락/파기/미지원 구조는 현재값으로 대체하지 않는다."
      outside: "타 화면 소유 사용처·배포 연결 관측/display/비밀은 복사하지 않는다. 해당 탭은 과거 저장 대상 아님을 안내하고 현재값을 호출해 넣지 않는다."
      save_point: "REQ-601.change_history.save_point. 현재 권한자의 직접 저장으로 실제 적용된 전체 구성을 같은 트랜잭션의 HIST로 보존한다. 로컬 편집/검증 실패·미반영 과거 요청은 적용 이력을 만들지 않는다."
  FEAT-002:
    code_lookup_contract:
      responses: "CodeQueryRow: dataSourceId/codeQueryId/queryName/description와 권한 있는 버전/상태 요약. CodeQueryRevisionDetail: 정확 key/revisionNo/editVersion/status/저장된 SQL·결과 대응·fetchMode/TTL/전체 parameter definitions/서버 검수 근거/사용처·현재 실행 가능 사유. READ 권한 없이 SQL·사용처·코드값을 노출하지 않는다"
      state_commands: "CodeQueryReviewCommand: commandKey/정확 key/expectedEditVersion/reason/reviewEvidence와 일시 시험 바인딩·검수 의도. 서버가 정적/원천 검증 근거와 검수 주체/시각을 결정한다. CodeQueryStateCommand: commandKey/정확 key/expectedStateVersion/reason. 상태 전환은 서버가 정의하며 임의 status 입력은 거부한다"
      command_result: "CodeQueryCommandResult: commandKey/정확 dataSourceId/codeQueryId/codeQueryRevisionId/revisionNo/editVersion/stateVersion/원 성공 상태·성공시각. 현재 후속 상태는 별도 열람하며 재수신에 원 결과를 덮지 않는다. 검수/활성 실패는 입력/현재 통제를 보존하고 부분 상태 전환을 하지 않는다"
      source: "REQ-603.code_lookup_definition, ENT-041/042/043, SCR-002. 코드 조회 자산 저장은 데이터소스 현재값/그룹 저장과 별도 명령이다"
      types: "CodeQueryFilter: dataSourceId 필수·queryName/status 선택, offset 페이지. CodeQueryRevisionKey: dataSourceId/codeQueryId/codeQueryRevisionId와 소유 검사. CodeQueryDraftSave: commandKey/key 또는 신규 clientKey/expectedEditVersion/reason/queryName/querySql/valueResultColumn/nameResultColumn/optionalDescriptionResultColumn/fetchMode/cacheTtlSeconds/전체 typed parameter definitions. 서버 검수자/상태/성공 근거는 임의 입력받지 않는다"
      lifecycle: "DRAFT 저장은 불완전 검수 상태를 보존하되 SQL/파라미터 구조 오류는 거부한다. verify는 권한 있는 검수 의도/근거·정적 검사와 제한된 시험 결과를 대조하여 VERIFIED를 확정한다. VERIFIED 이후 계약은 불변이며 copyFromRevisionId로 새 DRAFT를 만든다. activate는 VERIFIED 정확 버전만 ACTIVE로, deactivate는 ACTIVE 정확 버전을 INACTIVE로 전환한다. 새 활성 버전이 이전 pin을 바꾸지 않는다. 재활성화는 현재 검수/통제/참조 유효성을 다시 검사한다"
      commands: "save/verify/activate/deactivate는 현재 READ와 해당 관리/검수/활성 액션·원 주체를 검사한다. commandKey+정규화 전체 입력+기대 버전·주체 지문으로 재수신과 충돌을 구분한다. 결과 불명이면 새 키/새 작업으로 중복 실행하지 않는다. 구체 결과 원장/확인 API·잠금 순서/버전 원자성은 아래 pending이며 미완성 상태에서 제품 명령을 노출하지 않는다"
      preview: "CodeQueryPreviewRequest는 정확 key와 일시 typed parameter values, 검수 목적/정의 expectedEditVersion(초안이면 필수)을 받는다. READ만으로 임의 SQL을 실행하지 않으며 저장된 검수 대상 또는 ACTIVE 정확 SQL만 현재 미리보기 실행 권한·정적 read-only/객체 참조·현재 정책 검사를 거쳐 제한 실행한다. 초안 시험 성공은 VERIFIED/ACTIVE가 아니다. 미저장 SQL을 실행 입력으로 받지 않는다"
      result: "CodeQueryPreviewResult는 queryRef/typed binding summary/rows(valueType,value,name,description)/observedAt/usedAt/cacheHit/expiresAt/completeness/status/validationIssues/보호된 evidenceRef다. 실패/빈 목록/한도 초과를 성공 완전 목록과 구분하며 SQL·결과를 일반 로그나 데이터소스 스냅샷에 복제하지 않는다. 시험 바인딩은 저장 기본값이 아니다"
      current_checks: "정의/정확 버전의 같은 데이터소스·현재 상태/검수/권한·등록 원천 객체/행 정책을 실행 때와 캐시 적중 때 확인한다. 원천 코드 데이터 최신화는 SQL 정의 변경/카탈로그 후보 저장과 별개다. 비활성화와 실행 경합의 선후를 확정하고 회수된 권한 결과를 캐시에서 재사용하지 않는다"
      pending: "@defer P3 integration_assets·integration·access_policy·audit_trace — 관리/검수/활성/미리보기의 구체 액션 키·원장/결과 확인 API·물리 스키마·락 순서/멱등·SQL 허용 분석/실행 상한·캐시/무효화·보호된 근거 보존을 완성한다. 미완성 통제를 READ/SAVE로 대체하지 않는다"
    dbms_contract: "REQ-603.dbms_context. DBMS 후보는 활성 DBMS 공통코드와 실행 지원 목록을 대조한다. dbmsVersion은 관리 문자열로 저장/조회/명령 지문/ENT-004 전체 스냅샷에 포함한다. 제품/버전 관측 결과는 초기 제안이며 실제 관리 변경은 명시 저장한다. 관측 실패는 값 삭제/임의 버전 보충 사유가 아니다. 확인된 불일치는 저장 시 안내하고 정정 전 SQL 생성/실행을 막는다. 카탈로그 소비 응답은 dataSourceId·dbmsCode·dbmsVersion·managementVersion·parserId를 함께 반환한다. DBMS 변경 뒤 하위 자료형 코드의 PARENT가 달라지면 영향을 표시하고 재선택/재검수 전 의존 조회를 차단한다. 버전 변경은 자료형 후보 목록을 바꾸지 않는다"
    design_status: "draft"
    implementation: "planned"
    request_rule: "FEAT-001의 shared_write_contract·오류·공통 DTO를 사용한다. 데이터소스의 적용 가능 그룹은 매핑 어휘이며 런타임 권한 게이트가 아니다"
    response_rule: "저장된 관리값과 연결/파서 관측을 분리한다. 기존 ID가 로드 목록에 없어도 관리 레코드와 당시 값을 반환하며 관측은 MISSING/UNAVAILABLE로 구분한다"
    connection_key_validation: "사용자 확인: yml 연결 키는 connectionId이며 표시용 alias와 구분한다. 신규/변경 저장 때 서버가 현재 로드된 정확 ID의 존재를 다시 검증한다. 미등록/제거된 ID는 400 invalidInput, 검증 조회 장애는 503 dependencyUnavailable로 거부하고 변경 전 값을 유지한다. 파일에만 추가되고 아직 로드되지 않은 키를 정상으로 간주하지 않는다. 기존 참조 부재는 조회에 MISSING으로 보존하며 삭제는 현재 참조 보호로 별도 판정한다"
    types:
      DataSourceValues: "connectionId:필수 정확 식별자 1~100자, alias:필수 1~100자, description:nullable text, dbmsCode:활성 DBMS 공통코드 1~30자, dbmsVersion:필수 앞뒤 공백 제거 후 1~100자 실제 버전 문자열(semver 강제/목록 선택 없음), parserId:nullable 1~100자, sourceType:DB/DW, timeZoneId:nullable IANA 시간대 1~100자, dataBasis:nullable 설명, applicableGroupIds:필수 중복 없는 그룹 ID 집합. 시간대/기준 시각 미지정은 미확인으로 표시하며 서버 시각이나 임의 UTC로 채우지 않는다"
      DataSourceSave: "commandKey/id/expectedVersion/reason은 FEAT-001 공통 계약, values:DataSourceValues 전체. 기존 connectionId 변경은 correctionEvidence:필수 비밀 없는 동일 대상 확인 근거를 추가한다. 나머지 변경에는 정정 근거를 새로 만들지 않는다"
      DataSourceDetail: "id/version/values·REG/MOD·변경 사유/정정 근거와 별도 연결/파서 관측. aliasKey는 서버 검사값이며 편집 입력으로 받지 않는다"
      DataSourceFilter: "alias:선택 표시명 부분 일치, connectionId:선택 정확 일치, dbmsCode/sourceType:선택. 공통 SearchRequest를 사용하며 허용 정렬은 alias/id/modifiedAt, 동률은 id다"
      DataSourceRow: "id/version/alias/connectionId/description/dbmsCode/dbmsVersion/parserId/sourceType/timeZoneId/dataBasis/modifiedAt/lastChangeReason/lastCorrectionEvidence. 상단 그리드의 모든 1:1 현재값을 반환한다. lastChangeReason/lastCorrectionEvidence는 현재 저장된 읽기 근거이며 새 명령의 reason/correctionEvidence와 구분한다. 전체 그룹 집합·관측·이력은 각 상세/탭 계약으로 조회한다"
    alias_contract: "REQ-603.alias_identity에 따라 표시 별칭은 Unicode NFC와 앞뒤 공백 제거 후 보관한다. 유일성 키는 같은 문자열을 Unicode 16.0.0의 Default Full Case Folding(C/F 매핑, 언어별 T 매핑 제외)을 적용하고 다시 NFC로 만든 값이다. 서버/검증 도구에서 동일 정규화 함수를 사용하며 DB 정렬 규칙의 자동 대소문자 변환에 의존하지 않는다. ALIAS_KEY UNIQUE와 저장 전 검증을 함께 적용하고 동시 충돌은 409로 전체 롤백한다. 공백은 같은 Unicode 버전의 White_Space 속성의 코드 포인트로 통일하며 내부 공백은 보존한다. 표시 별칭의 대소문자는 유지한다. 길이는 코드 포인트 기준으로 정규화 후 별칭 1~100자·비교 키 1~300자를 검사하고 초과 시 절단 없이 거부한다. 공백뿐인 값은 거부한다"
    alias_verification: "ERP/erp/앞뒤 공백 ERP는 같은 키, ΟΣ/οσ/ος는 같은 키, Straße/STRASSE는 같은 키다. ERP A와 ERPA의 내부 공백, 전각 ＥＲＰ와 ERP는 다른 키로 유지한다. NFC 외의 호환 정규화는 적용하지 않는다. 같은 키의 동시 등록은 하나만 성공하며 기존 행 자신의 대소문자 표시 변경은 허용한다. 단순 소문자 변환으로 바꾸면 그리스어 반례가 실패해야 한다. 실제 함수·DB 유일성 경합 시험은 verification/구현에서 수행한다"
    alias_reference: "Unicode 16.0.0 §3.13·§5.18의 기본 case folding/정규화: https://www.unicode.org/versions/Unicode16.0.0/core-spec/chapter-3/ 및 https://www.unicode.org/versions/Unicode16.0.0/core-spec/chapter-5/ . 정규화 버전은 전체 저장소에 하나로 고정하며 변경 시 기존 키 재계산·충돌 해결·전환을 별도로 검토한다"
    parser_contract: "신규 초안은 parserId 미지정을 허용하지만 조회 불가로 표시한다. 지정한 파서는 소유 지원 목록/DBMS 호환성을 검증하고 무효한 값을 정상으로 저장하지 않는다. 배포 연결 정상과 SQL 실행 지원은 별도 판정이다"
    timezone_contract:
      source: "sources/backend/support/src/main/java/com/aiagent/support/time/Timezones.java의 candidates(calendar.zone())와 isKnown을 재사용한다. 원천은 해당 서버 JVM의 ZoneId.getAvailableZoneIds()다. 별도 고정 목록·DB 시드·브라우저 시간대 목록을 만들지 않는다"
      candidates: "API-062는 현재 HUB_DATA_SOURCE READ 권한으로 조회하는 독립 admin 경로이며 system의 배치 스케줄 메뉴 권한과 결합하지 않는다. 기존 공통 유틸의 업무 시간대 우선·이후 오름차순을 유지한다. 같은 ID가 두 번 나오면 화면 옵션은 첫 항목을 유지해 중복 제거한다"
      selection: "시간대 ID를 표시·저장값으로 사용하는 검색 콤보다. 검색어는 후보 필터에만 쓰며 자유 입력을 값으로 저장하지 않는다. 기본값과 선택 해제는 null(미지정)이고 업무 시간대/목록 첫 값/서버 시간대를 자동 선택하지 않는다"
      validation: "저장 서버는 null 또는 Timezones.isKnown(timeZoneId)인 값만 허용한다. 빈 문자열·오타·고정 오프셋을 포함한 목록 밖 값은 400 err.admin.asset.invalidInput으로 거부한다. 값의 대소문자/공백을 임의 보정하지 않는다"
      failure: "목록 로딩/실패는 미지정·빈 성공 목록과 구분한다. 실패한 후보 조회로 기존 선택을 지우거나 대체하지 않으며 조회 재시도 후 선택한다. 현재 JVM에서 사라진 기존 ID는 원문과 미지원 표시를 유지하고 재선택/명시 해제 전 정상 값으로 저장하지 않는다. 이력의 과거 ID는 그대로 읽는다"
    group_contract: "그룹 전체 집합은 ENT-018에 저장한다. 추가는 현재 존재/선택 가능 그룹을 검사하고 제거는 하위 테이블/컬럼 매핑을 같은 부모 잠금 아래 검사한다. @defer P3 access_policy — 그룹 원천 식별·FK·삭제/매핑 경합의 물리 계약을 확정한다"
    correction_contract: "배포 ID 변경은 관리자가 동일 연결 대상임을 확인한 근거와 서버가 관측한 새 정확 ID를 남긴 명시 변경이다. 자동 호스트/이름 추정은 하지 않는다. 기존 Hub ID와 하위 카탈로그 연결을 유지하며 원천 주소/비밀을 근거 사본에 넣지 않는다"
    exception_map:
      UC-016.E1: "400 err.admin.asset.invalidInput"
      UC-016.E2: "400 err.admin.asset.invalidInput"
      UC-016.E3: "409 err.admin.asset.referenceConflict 또는 조회 실패 시 503 err.admin.asset.dependencyUnavailable"
      UC-016.E4: "503 err.admin.asset.dependencyUnavailable"
    history_contract:
      rules_from:
        - "REQ-601.change_history"
        - "ADR-035"
      mapping: "ENT-002→ENT-004(AI_ADMIN_DATA_SOURCE_HIST), ENT-018→ENT-045(AI_ADMIN_DATA_SOURCE_GROUP_HIST), ENT-041/042/043→ENT-046/047/048. 코드 정의·파라미터·바인딩의 실제 반영된 유효 판의 전체 관리 자식을 포함한다. 논리 원본의 _HIST 물리는 원본과 함께 소유 G3 전에 완성한다."
      time: "HIST_DTM은 마스터 이력에만 명시 저장한다. 자식은 HISTORY_NO와 원 부모 키로 같은 마스터를 참조하고 기간 검색/반출 시 마스터 시각을 조인한다. 원 REG_DTM/MOD_DTM은 그대로 보존한다."
      view: "SCR-041은 SCR-002를 상속한다. API-016 목록은 DataSourceHistoryFilter, API-017 상세는 AssetHistoryKey로 ENT-004/045~048의 같은 historyNo 세트만 반환한다. 기본정보/그룹/코드 정의/조회 파라미터/코드 바인딩 중 실제 변경 영역만 요약한다."
      boundary: "테스트 입력/실시간 코드 조회 결과·연결/파서/원천 관측은 관리 이력으로 복제하지 않는다. 독립 코드 판 저장과 승인/검수 상태는 기존 업무 의미를 유지하고 해당 판을 세트에 연결한다."
