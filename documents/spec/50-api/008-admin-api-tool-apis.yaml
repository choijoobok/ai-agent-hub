# 업무 API·도구 관리 API — 운영 반영은 공통 세트 계약 소유
apis:
  - id: API-037
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getList
    action: READ
    summary: "업무 API 목록"
    request: "body=SearchRequest<BusinessApiFilter>"
    response: "ApiResponse<PageResponse<BusinessApiRow>>"
  - id: API-038
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getOne
    action: READ
    summary: "현재 업무 API"
    request: "body=BusinessApiKey"
    response: "ApiResponse<BusinessApiDetail>"
  - id: API-039
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getRevisions
    action: READ
    summary: "API 내용 판 목록"
    request: "body=SearchRequest<BusinessApiKey>"
    response: "ApiResponse<PageResponse<BusinessApiRevisionRow>>"
  - id: API-040
    feature: FEAT-004
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/businessApi/getRevision"
    action: "READ"
    summary: "명시한 현재/적용 이력의 전체 구성"
    request: "body=BusinessApiRevisionKey"
    response: "ApiResponse<BusinessApiRevisionDetail>"
    contract: "kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다."
  - id: API-041
    feature: FEAT-004
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/businessApi/saveCreate"
    action: "SAVE"
    summary: "업무 API 신규 직접 저장"
    request: "body=ManagementChange"
    response: "ApiResponse<ManagementResult>"
    contract: "신규 baseRevision=0/원본 미존재·업무키 유일성·현재 변경 권한/필수 참조·기술 검증과 전체 이력/명령 결과를 원자 반영한다."
  - id: API-042
    feature: FEAT-004
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/businessApi/saveChange"
    action: "SAVE"
    summary: "업무 API 전체 구성 직접 저장"
    request: "body=ManagementChange"
    response: "ApiResponse<ManagementResult>"
    contract: "commandKey/targetId 또는 신규 업무키/baseRevision/reason/전체 구성. 서버가 현재 변경 권한·기대 버전·입력/참조·기술 계약을 검증해 직접 저장하며 관리자 요청/전결은 없다."
  - id: API-044
    feature: FEAT-004
    implementation: "planned"
    method: "POST"
    path: "/api/service/admin/businessApi/getReferences"
    action: "READ"
    summary: "현재 사용처/참조 조회"
    request: "body=SearchRequest<AssetReferencesQuery>"
    response: "ApiResponse<PageResponse<AssetReferenceRow>>"
    contract: "대상 안정 ID/종류·표시명·적용 리비전·연결 경로·현재 참조 여부를 현재 열람 권한 안에서 조회한다. 연결 지식 본문/사용 설명 자동 수집·업무 의미 영향 판단/보완 작업은 제공하지 않는다."
  - id: API-045
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getValidation
    action: READ
    summary: "API 후보 검수/누락 확인"
    request: "body=AssetValidationQuery"
    response: "ApiResponse<AssetValidationResult>"
  - id: API-046
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getReferenceCandidates
    action: READ
    summary: "API 정형 참조 선택 후보"
    request: "body=SearchRequest<AssetReferenceQuery>"
    response: "ApiResponse<PageResponse<AssetReferenceCandidate>>"
  - id: API-047
    feature: FEAT-004
    implementation: planned
    method: POST
    path: /api/service/admin/businessApi/getConnectionCheck
    action: READ
    summary: "API 현재 연결/지원 관측"
    request: "body=ApiConnectionQuery"
    response: "ApiResponse<ApiConnectionResult>"
  - id: API-048
    feature: FEAT-004
