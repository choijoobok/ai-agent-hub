# 카탈로그 관리 API — admin 소유 G3 승인 및 SLICE-003 생산 구현
apis:
  - id: API-019
    feature: FEAT-003
    implementation: "implemented"
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: "POST"
    path: "/api/admin/service/catalog/getList"
    action: "READ"
    summary: "카탈로그 목록"
    request: "body=SearchRequest<CatalogQueryService.Filter>"
    response: "ApiResponse<PageResponse<CatalogRow>>"
    contract: "현재 카탈로그 목록과 페이지 정보. businessName/dataSourceId/objectType 조건을 사용한다."
  - id: API-020
    feature: FEAT-003
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: POST
    path: /api/admin/service/catalog/getOne
    action: READ
    summary: "카탈로그 현재 항목"
    request: "body={id}"
    response: "ApiResponse<CatalogQueryService.Detail>"
    contract: "row/values/dependencies를 반환한다. 전체 wire 필드는 FEAT-003.implementation_transport가 정본이다."
  - id: API-022
    feature: FEAT-003
    implementation: "implemented"
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: "POST"
    path: "/api/admin/service/catalog/getRevision"
    action: "READ"
    summary: "명시한 현재/적용 이력의 전체 구성"
    request: "body={id,kind,revision?,historyNo?}"
    response: "ApiResponse<CatalogDetail|ManagedHistory.Event>"
    contract: "CURRENT는 현재 구성, 그 외 명시한 revision 또는 historyNo의 typed 전체 이력이다. 소유와 세트 일치를 검사한다."
  - id: API-023
    feature: FEAT-003
    implementation: "implemented"
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: "POST"
    path: "/api/admin/service/catalog/saveCreate"
    action: "SAVE"
    summary: "카탈로그 신규 직접 저장"
    request: "body=ManagedCommand"
    response: "ApiResponse<ManagementResult>"
    contract: "신규 MASTER만 허용한다. targetId/expectedRevision=null, values=마스터 필드. HUB_CATALOG READ·SAVE·필수 참조·중복을 검사하고 전체 이력과 명령 결과를 원자 반영한다."
  - id: API-024
    feature: FEAT-003
    implementation: "implemented"
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: "POST"
    path: "/api/admin/service/catalog/saveChange"
    action: "SAVE"
    summary: "카탈로그 지정 영역 직접 저장"
    request: "body=ManagedCommand"
    response: "ApiResponse<ManagementResult>"
    contract: "commandKey/targetId/expectedRevision/scope/values/reason. 모든 영역은 HUB_CATALOG READ·SAVE를 검사한다. 클릭한 영역만 반영하고 전체 HIST·리비전·원 명령 결과를 원자 확정한다."
  - id: API-026
    feature: FEAT-003
    implementation: "implemented"
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: "POST"
    path: "/api/admin/service/catalog/getReferences"
    action: "READ"
    summary: "연관 지식 역조회"
    request: "body={id}"
    response: "ApiResponse<{state,rows}>"
    contract: "현재 지식 생산자가 연결되지 않아 NOT_CONNECTED와 빈 rows를 반환한다. 정상 참조 0건이 아니다. 지식 역조회 데이터는 후속 소유 기능에서 연결한다."
  - id: API-027
    feature: FEAT-003
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: POST
    path: /api/admin/service/catalog/getRelatedJoins
    action: READ
    summary: "양쪽 역할에서 보는 권장 관계"
    request: "body={id}"
    response: "ApiResponse<{state,rows}>"
    contract: "현재 카탈로그의 양쪽 관계를 같은 소유 정본에서 READY/rows로 반환한다. 자기조인은 한 관계의 matchedSides=[LEFT,RIGHT]로 구별한다. 실제 모델 소비는 별도다."
  - id: API-028
