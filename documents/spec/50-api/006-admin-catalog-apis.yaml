# 카탈로그 관리 API — 소유 G3 전 미구현 설계
apis:
  - id: API-019
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/admin/service/catalog/getList"
    action: "READ"
    summary: "카탈로그 목록"
    request: "body=SearchRequest<CatalogFilter>"
    response: "ApiResponse<PageResponse<CatalogRow>>"
    contract: "CURRENT 적용본만 조회한다. 최초 미적용 요청·초안·반려 제출본은 제외한다."
  - id: API-020
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getOne
    action: READ
    summary: "카탈로그 현재 항목"
    request: "body=CatalogKey"
    response: "ApiResponse<CatalogDetail>"
  - id: API-022
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/admin/service/catalog/getRevision"
    action: "READ"
    summary: "명시한 현재/적용 이력의 전체 구성"
    request: "body=RevisionKey"
    response: "ApiResponse<RevisionDetail>"
    contract: "kind=CURRENT이면 안정 자산 ID, HISTORY이면 안정 자산 ID+appliedRevision 또는 historyNo로 실제 적용 전체 구성을 읽는다. 서버가 소유·현재 열람 권한·세트 일치를 검사하고 명시한 과거 문맥을 현재값으로 대체하지 않는다. REQUEST 문맥은 지원하지 않는다."
  - id: API-023
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/admin/service/catalog/saveCreate"
    action: "SAVE"
    summary: "카탈로그 신규 직접 저장"
    request: "body=ManagementChange"
    response: "ApiResponse<ManagementResult>"
    contract: "신규는 saveTarget=MASTER와 마스터 areaValues만 허용하고 자식 영역은 거부한다. 마스터 발급 후 각 탭 영역을 저장한다. baseRevision=0/원본 미존재·업무키 유일성·현재 변경 권한/필수 참조·기술 검증과 전체 이력/명령 결과를 원자 반영한다."
  - id: API-024
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/admin/service/catalog/saveChange"
    action: "SAVE"
    summary: "카탈로그 지정 영역 직접 저장"
    request: "body=ManagementChange"
    response: "ApiResponse<ManagementResult>"
    contract: "REQ-301.save_reason. commandKey/targetId/baseRevision/saveTarget/reason/areaValues. 고정 대상과 허용 필드를 확인해 해당 영역만 반영하고 그 시점 전체 HIST를 원자 복사한다. 다른 탭 로컬 변경은 반영하지 않는다."
  - id: API-026
    feature: FEAT-003
    implementation: "planned"
    method: "POST"
    path: "/api/admin/service/catalog/getReferences"
    action: "READ"
    summary: "연관 지식 역조회"
    request: "body=SearchRequest<RevisionKey>"
    response: "ApiResponse<PageResponse<CatalogKnowledgeReferenceRow>>"
    contract: "FEAT-003.types.CatalogKnowledgeReferenceRow. 조회 시점의 연관 지식과 매핑 활성 여부를 현재 열람 권한 안에서 반환하고 기술 참조 문맥은 별도로 보존한다. 연결 지식 본문/사용 설명 자동 수집·업무 의미 영향 판단/보완 작업은 제공하지 않는다."
  - id: API-027
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getRelatedJoins
    action: READ
    summary: "양쪽 역할에서 보는 권장 관계"
    request: "body=SearchRequest<RevisionKey>"
    response: "ApiResponse<PageResponse<CatalogRelationReferenceRow>>"
    contract: "FEAT-003.types.CatalogRelationReferenceRow. 소유 관계와 양쪽 정확 객체/판·역할을 현재 관리 열람 권한 안에서 반환한다. 자기조인은 한 관계 행의 두 역할을 유지한다. FEAT-011.relation_read_contract의 모델/예제 작성용 필터 결과를 대신하지 않는다."
  - id: API-028
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getResolvedObject
    action: READ
    summary: "선정 공개 객체의 정확 식별"
    request: "body=SourceObjectQuery"
    response: "ApiResponse<SourceObjectResult>"
  - id: API-029
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getStructure
    action: READ
    summary: "데이터소스 일괄 비교에서 재사용할 등록 객체 구조 사실 조회"
    request: "body=StructureQuery"
    response: "ApiResponse<StructureResult>"
  - id: API-030
    scope_status: "현재 화면/구현 범위 제외. @defer 사용자 재요청 시 — 샘플 조회 필요성과 통제 재검토"
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/runSample
    action: EXECUTE
    summary: "허용된 등록 컬럼 수동 샘플링"
    request: "body=SampleRequest"
    response: "ApiResponse<SampleResult>"
  - id: API-031
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getEvidenceList
    action: READ
    summary: "카탈로그 변경 근거 목록"
    request: "body=SearchRequest<EvidenceFilter>"
    response: "ApiResponse<PageResponse<EvidenceRow>>"
  - id: API-032
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getEvidenceOne
    action: READ
    summary: "카탈로그 변경 근거 상세"
    request: "body=EvidenceKey"
    response: "ApiResponse<EvidenceDetail>"
  - id: API-033
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/saveEvidence
    action: SAVE
    summary: "변경 통지·업무 변경 근거 접수"
    request: "body=EvidenceSave"
    response: "ApiResponse<DraftResult>"
  - id: API-034
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getCommandResult
    action: READ
    summary: "초안 편집·근거 접수 결과 확인"
    request: "body=CatalogCommandKey"
    response: "ApiResponse<CatalogCommandResult>"
  - id: API-035
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getValidation
    action: READ
    summary: "후보 전체 구성의 현재 검증"
    request: "body=ValidationRequest"
    response: "ApiResponse<ValidationResult>"
  - id: API-036
    feature: FEAT-003
    implementation: planned
    method: POST
    path: /api/admin/service/catalog/getReferenceCandidates
    action: READ
    summary: "등록 객체·컬럼·키 참조 후보"
    request: "body=SearchRequest<ReferenceCandidateFilter>"
    response: "ApiResponse<PageResponse<CatalogReferenceCandidateRow>>"
    contract: "FEAT-003.types.ReferenceCandidateFilter·CatalogReferenceCandidateRow. 요청한 종류의 후보만 반환하며 정확 객체/판·컬럼 또는 전체 키·신규 편집 문맥을 구분한다. 현재 권한/참조를 검증하고 조회 실패·권한 제한·불완전을 정상0건으로 바꾸지 않는다."
