  - id: API-035
    feature: FEAT-003
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: POST
    path: /api/admin/service/catalog/getValidation
    action: READ
    summary: "후보 전체 구성의 현재 검증"
    request: "body={id}"
    response: "ApiResponse<{state,sqlSupport}>"
    contract: "현재 원천 미연결 상태 NOT_CONNECTED를 알린다. 편집 전체의 독립 검증이나 SQL 지원 판정 완료를 뜻하지 않는다. 저장 시 기술 검증은 각 영역 명령에서 수행한다."
