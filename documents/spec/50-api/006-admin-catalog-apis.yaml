    summary: "데이터소스 일괄 비교에서 재사용할 등록 객체 구조 사실 조회"
    request: "body={id,revision}"
    response: "ApiResponse<CatalogSource.Observation>"
    contract: "현재 등록 카탈로그의 기대 리비전을 확인하고 같은 원천 구조 관측 포트를 호출한다. 일괄 비교 실행은 별도다."
