    request: "body=CatalogMasterValues"
    response: "ApiResponse<CatalogSource.Observation>"
    contract: "등록 데이터소스와 정확 이름으로 PostgreSQL 객체·컬럼·키·인덱스를 관측한다. 원천 업무값·비밀은 반환하지 않는다."
  - id: API-029
    feature: FEAT-003
    implementation: implemented
    source_contract: sources/backend/modules/admin/src/main/java/com/aiagent/admin/api/catalog/CatalogController.java
    method: POST
    path: /api/admin/service/catalog/getStructure
