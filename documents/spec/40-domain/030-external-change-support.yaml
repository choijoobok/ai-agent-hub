    identifier_generation: 내부 단일 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 공개 UUID는 별도 유일 키이며 BIGINT wire는 십진 문자열이다.
    history_storage:
      mode: not_management_history
      reason: 요구 기반 불변 관측/계량 또는 해당 소유 투영·수신 보조 기록. 관리 HIST를 복제하지 않는다.
    delete_policy: 소유 보존/참조 종료 계약의 원자 파기만 허용. 일반 CRUD·CASCADE 삭제 금지. 기간 미설정 시 자동 파기 비활성.
    rules:
      - 서명키/검증 설정 세대와 사건 원천 epoch·계정 연결 BINDING_KEY는 다르다. 키 교체/프로세스 재시작으로 커서를 초기화하지 않는다.
      - 원천 검증기는 이전 cursor판과의 비교/최신 상태 근거를 반환하며 보호 구간에서는 같은 cursor판인지 재검사한다. NO_CHANGE도 검증된 진전은 기록한다. 현재 연결이 바뀌면 옛 binding 사건은 자동 적용하지 않는다.
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
