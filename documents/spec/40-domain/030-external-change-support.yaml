        physical_name: RECIPIENT_POLICY_VERSION
        description: RECIPIENT_POLICY_VERSION
    physical:
      attributes:
        - name: NOTIFICATION_LINK_ID
          type: bigint
          nullable: false
          default: null
        - name: RECEIPT_ID
          type: bigint
          nullable: false
          default: null
        - name: ADMIN_USER_ID
          type: character varying(30)
          nullable: false
          default: null
        - name: NOTI_ID
          type: bigint
          nullable: false
          default: null
        - name: STORED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: RECIPIENT_POLICY_VERSION
          type: character varying(128)
          nullable: false
          default: null
      constraints:
        - name: PK_CHANGE_NOTIFICATION
          definition: PRIMARY KEY (NOTIFICATION_LINK_ID)
        - name: UK_CHANGE_NOTIFICATION_1
          definition: UNIQUE (RECEIPT_ID, ADMIN_USER_ID)
        - name: UK_CHANGE_NOTIFICATION_2
          definition: UNIQUE (NOTI_ID)
