    physical:
      attributes:
        - name: CURSOR_ID
          type: bigint
          nullable: false
          default: null
        - name: SOURCE_KEY
          type: character varying(100)
          nullable: false
          default: null
        - name: SOURCE_EPOCH
          type: character varying(128)
