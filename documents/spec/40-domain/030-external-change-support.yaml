          definition: FOREIGN KEY (RECEIPT_ID) REFERENCES AI_PORTAL_USER_CHANGE (RECEIPT_ID) ON DELETE RESTRICT
      indexes: []
    identifier_generation: 내부 단일 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 공개 UUID는 별도 유일 키이며 BIGINT wire는 십진 문자열이다.
    history_storage:
      mode: not_management_history
      reason: 요구 기반 불변 관측/계량 또는 해당 소유 투영·수신 보조 기록. 관리 HIST를 복제하지 않는다.
    delete_policy: 소유 보존/참조 종료 계약의 원자 파기만 허용. 일반 CRUD·CASCADE 삭제 금지. 기간 미설정 시 자동 파기 비활성.
    rules:
      - system 공개 포트가 확정한 정확 수신자+인앱 ID만 같은 트랜잭션에 기록한다. 상대 Repository 직접 접근/Portal ID 대체 없음.
      - 기존 인앱 보존 종료 후에도 이 참조를 이유로 알림을 재생성하지 않는다. 현재 알림 행 FK/CASCADE를 두지 않으며 저장 시 소유 결과로 검증한다. 사건 기록 파기와 함께 정리하며 최소종결표에 수신자/알림ID를 복사하지 않는다.
    sources:
