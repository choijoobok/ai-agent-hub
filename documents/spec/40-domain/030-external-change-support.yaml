    reqs:
      - REQ-103
      - REQ-107
    implementation: implemented
    design_stage: physical
    table: AI_PORTAL_CHANGE_NOTIFICATION
    attributes:
      - name: NOTIFICATION_LINK_ID
        physical_name: NOTIFICATION_LINK_ID
