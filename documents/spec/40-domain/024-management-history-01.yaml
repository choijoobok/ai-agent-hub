        - name: UK_QUERY_POLICY_HIST_SET
          definition: UNIQUE (HISTORY_NO, POLICY_ID)
        - name: UK_QUERY_POLICY_HIST_NO
          definition: UNIQUE (HISTORY_NO)
        - name: UK_QUERY_POLICY_HIST_REV
          definition: UNIQUE (POLICY_ID, RESULT_REVISION)
