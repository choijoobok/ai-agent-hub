entities:
  - id: ENT-251
    name: Portal 자체 비밀번호 이력
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_PORTAL_PASSWORD_HISTORY
    features:
      - FEAT-005
    reqs:
      - REQ-616
    term: TRM-245
    domain: Portal 이용
    attributes:
      - name: PORTAL_USER_ID
        physical_name: PORTAL_USER_ID
        pk: true
        description: Portal 안정 이용자 참조
      - name: PASSWORD_VERSION
        physical_name: PASSWORD_VERSION
        pk: true
        description: 계정별 자격 변경 세대
      - name: PASSWORD_HASH
        physical_name: PASSWORD_HASH
        description: 재사용 검증 전용 일방향 비밀번호 해시
      - name: CHANGED_DTM
        physical_name: CHANGED_DTM
        description: 암호 변경 시각
    physical:
      attributes:
        - name: PORTAL_USER_ID
          type: bigint
          nullable: false
          default: null
        - name: PASSWORD_VERSION
          type: bigint
          nullable: false
          default: null
        - name: PASSWORD_HASH
          type: character varying(255)
          nullable: false
          default: null
        - name: CHANGED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_PORTAL_PASSWORD_HISTORY
          definition: PRIMARY KEY (PORTAL_USER_ID, PASSWORD_VERSION)
        - name: FK_PORTAL_PASSWORD_HISTORY_USER
          definition: FOREIGN KEY (PORTAL_USER_ID) REFERENCES AI_ADMIN_PORTAL_USER (PORTAL_USER_ID) ON DELETE RESTRICT
        - name: CK_PORTAL_PASSWORD_HISTORY_VERSION
          definition: CHECK (PASSWORD_VERSION > 0)
      indexes: []
    history_storage:
      mode: not_management_history
      reason: 암호 재사용 검증 전용 비밀 이력이며 관리 HIST/일반 조회와 분리한다.
    delete_policy: 현재 AuthPasswordProps와 동등한 최근 재사용 금지 개수만 계정별 보존하고 자격 변경과 같은 트랜잭션에서 오래된 해시를 제거한다. 기존 SYS_USER 이력을 복사하지 않는다. 계정 파기는 별도 소유 보존 계약을 따른다.
    rules:
      - 초기 발급/관리자 reset/본인 변경 모두 자격 세대에 맞춘 해시를 같은 트랜잭션으로 기록한다. 실패횟수/잠금 해제만으로 새 암호 이력을 만들지 않는다.
      - 해시·이력은 인증 포트 내부에서만 읽으며 관리 API/HIST/로그/원 명령 결과로 노출하지 않는다.
    sources: []
