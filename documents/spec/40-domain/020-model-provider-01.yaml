          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_MODEL
          definition: PRIMARY KEY (MODEL_ID)
        - name: UK_MODEL_1
          definition: UNIQUE (PROVIDER_CD, CONNECTION_KEY, MODEL_CD, EFFORT_MODE, EFFORT_CD)
        - name: CK_MODEL_1
          definition: CHECK (EFFORT_MODE IN ('OMIT','EMPTY','VALUE'))
        - name: CK_MODEL_2
          definition: CHECK (EFFORT_MODE='VALUE' OR EFFORT_CD='')
        - name: CK_MODEL_PORTAL_USE_YN
          definition: CHECK (PORTAL_USE_YN IN ('Y','N'))
      indexes: []
