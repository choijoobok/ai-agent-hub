# 영역: 공통 명령·이력 보호·Portal 이용 기반 논리 모델
entities:
  - id: ENT-099
    name: 공통 관리 명령 성공 결과
    term: TRM-292
    domain: 관리 변경
    module: admin
    implementation: implemented
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/001-managed-storage.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/002-command-recorded-time.sql
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/managed/
    design_stage: physical
    features:
      - FEAT-040
    reqs:
      - REQ-601
    attributes:
      - name: 원 명령 키
        physical_name: COMMAND_KEY
        pk: true
        description: 원 명령 키
      - name: 소유 기능
        physical_name: OWNER_FEATURE
        description: 소유 기능
      - name: 실제 ADMIN 처리자
        physical_name: ACTOR_ID
        description: 실제 ADMIN 처리자
      - name: 정규 입력 SHA-256
        physical_name: REQUEST_DIGEST
        description: 정규 입력 SHA-256
      - name: 정규화 버전
        physical_name: DIGEST_VERSION
        description: 정규화 버전
      - name: 대상 종류
        physical_name: TARGET_KIND
        description: 대상 종류
      - name: 정확 대상 자연/대리 키
        physical_name: TARGET_KEY
        description: 정확 대상 자연/대리 키
      - name: 결과 부모 리비전
        physical_name: RESULT_REVISION
        description: 결과 부모 리비전
      - name: 새 성공 이력 번호
        physical_name: HISTORY_NO
        description: 새 성공 이력 번호
      - name: 처리 결과
        physical_name: OUTCOME_CD
        description: 처리 결과
      - name: 실제 반영 시각
        physical_name: APPLIED_DTM
        description: 실제 반영 시각
      - name: 명령 결과 기록 시각
        physical_name: RECORDED_DTM
        description: NO_CHANGE를 포함한 성공 결과 보존 기간의 시작 시각. 실제 반영 시각이나 새 HIST 시각으로 반환하지 않는다.
    rules:
      - FEAT-040.command_identity가 정본이다. ENT-019/028/036을 사용하는 소유 명령은 여기에 중복 기록하지 않는다.
      - 대상/처리자 현재 행 삭제와 CASCADE하지 않는다. 결과 파기는 승인된 ADR-044·FEAT-040.command_identity를 따르며 고객사 보존 기간 미설정이면 자동 파기는 비활성이다.
      - 파기와 재수신은 commandKey 해시별 공통 잠금 아래 ENT-113을 먼저 확인한다. 주체/대상 현재 행 FK는 두지 않는다.
      - 결과 보존 기간은 RECORDED_DTM으로 판정한다. NO_CHANGE는 APPLIED_DTM/HISTORY_NO 없이 결과만 기록하고, 파기해도 현재 데이터/이력은 변경하지 않는다.
    delete_policy: 원 결과/늦은 재수신 방지 근거를 함께 검증한 보존 계약만 파기할 수 있다.
    table: AI_ADMIN_MANAGED_COMMAND
    physical:
      attributes:
        - name: COMMAND_KEY
          type: character(36)
          nullable: false
          default: null
        - name: OWNER_FEATURE
          type: character varying(20)
          nullable: false
          default: null
        - name: ACTOR_ID
          type: character varying(50)
          nullable: false
          default: null
        - name: REQUEST_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: DIGEST_VERSION
          type: character varying(20)
          nullable: false
          default: null
        - name: TARGET_KIND
          type: character varying(40)
          nullable: false
          default: null
        - name: TARGET_KEY
          type: character varying(128)
          nullable: true
          default: null
        - name: RESULT_REVISION
          type: bigint
          nullable: true
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: true
          default: null
        - name: OUTCOME_CD
          type: character varying(20)
          nullable: false
          default: null
        - name: APPLIED_DTM
          type: timestamp with time zone
          nullable: true
          default: null
        - name: RECORDED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_MANAGED_COMMAND
          definition: PRIMARY KEY (COMMAND_KEY)
        - name: CK_MANAGED_COMMAND_1
          definition: CHECK (OUTCOME_CD IN ('APPLIED','NO_CHANGE'))
        - name: CK_MANAGED_COMMAND_2
          definition: CHECK (OUTCOME_CD <> 'APPLIED' OR (HISTORY_NO IS NOT NULL AND APPLIED_DTM IS NOT NULL))
      indexes:
        - name: IX_MANAGED_COMMAND_1
          unique: false
          method: btree
          definition: (OWNER_FEATURE, TARGET_KEY)
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 공통 Liquibase와 실제 DB 적용/롤백을 검증했다.
    history_storage:
      mode: not_management_history
      reason: 기술/불변 업무 기록 또는 비밀 저장 단위
    relations: []
