    uniqueness: 소비 모듈/종류/안정 참조 + 대상 종류/안정 ID/적용 리비전 + 목적
    rules:
      - 등록/해제/파기는 같은 이력 세트 잠금에서 직렬화한다.
      - 소비자의 보존 종료가 확인되기 전 자동 만료하지 않는다. 전이 참조도 같은 보호 집합으로 완성한 뒤 성공한다.
      - FEAT-040.history.shared_dependencies에 따라 같은 소비 기록/목적의 공유 하위 판은 하나로 보호한다. PARENT_REFERENCE_ID는 대표 경로이며 개별 가지 종료에 따른 해제나 참조 횟수를 뜻하지 않는다. 해당 소비 기록/목적 전체의 적법한 종료 때만 집합을 해제한다.
      - 다형 자산 참조는 허용 종류별 정확 HIST 어댑터로 검사한다. 가짜 공통 현재 테이블 FK를 만들지 않는다. 전이 참조 고리를 거부하고 같은 이력 잠금으로 등록/파기를 직렬화한다.
    delete_policy: 소유 소비 기록의 적법한 파기/참조 종료와 원자 인계한 뒤 해제한다. 후행 조회 UI는 해제 권한이 없다.
