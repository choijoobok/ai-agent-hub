          nullable: false
          default: null
      constraints:
        - name: PK_HISTORY_REF
          definition: PRIMARY KEY (REFERENCE_ID)
        - name: UK_HISTORY_REF_1
          definition: UNIQUE (CONSUMER_MODULE, CONSUMER_KIND, CONSUMER_KEY, ASSET_KIND, ASSET_KEY, APPLIED_REVISION, PURPOSE_CD)
        - name: FK_HISTORY_REF_1
          definition: FOREIGN KEY (PARENT_REFERENCE_ID) REFERENCES AI_ADMIN_HISTORY_REF (REFERENCE_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_HISTORY_REF_1
          unique: false
          method: btree
          definition: (ASSET_KIND, ASSET_KEY, HISTORY_NO)
