        - name: PK_TOKEN_RATE_ACTUAL_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_TOKEN_RATE_ACTUAL_HIST_SET
          definition: UNIQUE (HISTORY_NO, ACTUAL_ID)
        - name: FK_TOKEN_RATE_ACTUAL_HIST_PARENT
