entities:
  - id: ENT-228
    name: 인증 예제의 SQL 전체 변경 이력
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_EXAMPLE_SQL_HIST
    features:
      - FEAT-023
      - FEAT-040
    reqs:
      - REQ-302
      - REQ-601
    term: TRM-043
    domain: 업무 지식
    sources: []
    attributes:
      - name: 안정 SQL 번호
        physical_name: SQL_ID
        pk: false
        description: 안정 SQL 번호
      - name: 소유 예제
        physical_name: EXAMPLE_ID
        description: 소유 예제
        pk: false
      - name: 표시 순번
        physical_name: ORDER_NO
        description: 표시 순번
        pk: false
      - name: 간단한 제목
        physical_name: TITLE
        description: 간단한 제목
        pk: false
      - name: SQL 설명
        physical_name: DESCRIPTION
        description: SQL 설명
        pk: false
      - name: SQL 원문
        physical_name: SQL_TEXT
        description: SQL 원문
        pk: false
      - name: SQL과 원천 구조 추출 지문
        physical_name: EXTRACTION_DIGEST
        description: SQL과 원천 구조 추출 지문
        pk: false
      - name: 서버 추출 근거
        physical_name: EXTRACTION_SOURCE
        description: 서버 추출 근거
        pk: false
      - name: 추출 시각
        physical_name: EXTRACTED_DTM
        description: 추출 시각
        pk: false
      - name: 이력 행 식별자
        physical_name: HIST_ID
        pk: true
        description: 이력 행 식별자
      - name: 전체 이력 세트 번호
        physical_name: HISTORY_NO
        pk: false
        description: 전체 이력 세트 번호
    physical:
      attributes:
        - name: SQL_ID
          type: bigint
          nullable: false
          default: null
        - name: EXAMPLE_ID
          type: bigint
          nullable: false
          default: null
        - name: ORDER_NO
          type: integer
          nullable: false
          default: null
        - name: TITLE
          type: character varying(200)
          nullable: false
          default: null
        - name: DESCRIPTION
          type: text
          nullable: false
          default: null
        - name: SQL_TEXT
          type: text
          nullable: false
          default: null
        - name: EXTRACTION_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: EXTRACTION_SOURCE
          type: text
          nullable: false
          default: null
        - name: EXTRACTED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: HIST_ID
          type: bigint
          nullable: false
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_EXAMPLE_SQL_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_EXAMPLE_SQL_HIST_SET
          definition: UNIQUE (HISTORY_NO, SQL_ID)
        - name: FK_EXAMPLE_SQL_HIST_PARENT
          definition: FOREIGN KEY (HISTORY_NO, EXAMPLE_ID) REFERENCES AI_ADMIN_QUERY_EXAMPLE_HIST (HISTORY_NO, EXAMPLE_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_EXAMPLE_SQL_HIST_LOOKUP
          unique: false
          method: btree
          definition: CREATE INDEX IX_EXAMPLE_SQL_HIST_LOOKUP ON AI_ADMIN_EXAMPLE_SQL_HIST (SQL_ID, HISTORY_NO)
    history_storage:
      mode: immutable_snapshot
      source: ENT-142
      root_history: ENT-227
    delete_policy: 현재값·보호 참조가 없는 보존 종료 전체 세트만 소유 파기 명령으로 자식→루트 순서 삭제한다. 현재 테이블 FK/cascade 없음. ADR-044의 원 명령 종료키 등록과 원장 파기를 원자 처리한다.
    rules:
      - 원본의 모든 소유 열을 타입/null까지 동형 복사한다. 이력 PK는 HIST_ID이며 원본 PK는 일반 원값이다.
      - 신규/변경은 반영 후 전체, 삭제는 직전 전체와 새 RESULT_REVISION/DELETE 사건을 보존한다. 정확 성공 판 조회는 DELETE를 제외한다.
      - HISTORY_NO는 루트와 모든 자식에 동일하다. 자식은 HISTORY_NO+소유 부모 키의 복합 FK로 같은 세트의 소속까지 보장한다. HIST_DTM은 루트만 소유하고 자식 조회는 부모 체인을 통해 루트를 조인한다.
      - 원 REG/MOD 값은 원본 시점 그대로 보존한다. 보호 등록과 파기는 같은 세트 잠금이며 부분 누락을 현재값으로 메우지 않는다.
    relations:
      - entity: ENT-227
        cardinality: N:1
        description: HISTORY_NO → HISTORY_NO; DB RESTRICT 참조
    history_copy_of: ENT-142
    history_parent: ENT-227
    storage_role: history
