# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-020
    name: 카탈로그 구성 식별
    term: TRM-264
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-003
      - FEAT-011
    reqs:
      - REQ-301
    attributes:
      - name: 컬럼·관계의 안정 식별자
        physical_name: MEMBER_ID
        pk: true
        description: 컬럼·관계의 안정 식별자
      - name: 생성 시 고정한 소유 카탈로그
        physical_name: CATALOG_ID
        description: 생성 시 고정한 소유 카탈로그
      - name: 구성 종류
        physical_name: MEMBER_KIND
        description: COLUMN/RELATION
      - name: 생성 주체
        physical_name: REG_ID
        description: 생성 주체
      - name: 생성 시각
        physical_name: REG_DTM
        description: 생성 시각
      - name: CLIENT_KEY
        physical_name: CLIENT_KEY
        description: 카탈로그 서버 소유 CLIENT_KEY
      - name: COMMAND_KEY
        physical_name: COMMAND_KEY
        description: 카탈로그 서버 소유 COMMAND_KEY
      - name: CREATED_REVISION
        physical_name: CREATED_REVISION
        description: 카탈로그 서버 소유 CREATED_REVISION
    relations:
      - entity: ENT-005
        cardinality: 소유 판·구성의 복합 키로 참조
        description: 명시된 physical 외래키를 따른다. 보존·고정과 현재 권한 판정은 별도 계약이다
      - entity: ENT-005
        cardinality: N:1
        description: CATALOG_ID → CATALOG_ID; DB RESTRICT 참조
    rules:
      - 소유 카탈로그·종류·식별자는 생성 후 불변이다. 이름 변경이나 미사용/폐기 뒤 다른 구성에 ID를 재사용하지 않는다
      - 카탈로그 부모 잠금 아래 실제 초안 구성과 함께 생성하며 관계의 관리측 이전을 차단한다
    delete_policy: 소유 리비전/근거의 불변성과 보존을 따른다. 현재 후보에서 제거해도 과거 판/안정 식별/성공 결과를 연쇄 삭제하지 않는다. 초안 자식 교체는 부모 잠금 아래 같은 트랜잭션으로 처리한다
    table: AI_ADMIN_CATALOG_MEMBER
    physical:
      attributes:
        - name: MEMBER_ID
          type: bigint
          nullable: false
          default: null
        - name: CATALOG_ID
          type: bigint
          nullable: false
          default: null
        - name: MEMBER_KIND
          type: character varying(40)
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: CLIENT_KEY
          type: character varying(100)
          nullable: true
          default: null
        - name: COMMAND_KEY
          type: character(36)
          nullable: true
          default: null
        - name: CREATED_REVISION
          type: bigint
          nullable: true
          default: null
      constraints:
        - name: PK_CATALOG_MEMBER
          definition: PRIMARY KEY (MEMBER_ID)
        - name: FK_CATALOG_MEMBER_1
          definition: FOREIGN KEY (CATALOG_ID) REFERENCES AI_ADMIN_CATALOG (CATALOG_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
        - name: UK_CATALOG_MEMBER_CLIENT
          definition: UNIQUE(COMMAND_KEY,CLIENT_KEY)
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/028-catalog.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/033-catalog-member-mapping.sql
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/catalog/CatalogService.java
    history_storage:
      mode: not_management_history
  - id: ENT-021
    name: 카탈로그 식별키
    term: TRM-265
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-003
    reqs:
      - REQ-301
    attributes:
      - name: CATALOG_ID
        physical_name: CATALOG_ID
        pk: true
        description: 현재 소유 마스터의 안정 식별자
      - name: 판 안의 키 번호
        physical_name: KEY_NO
        pk: true
        description: 판 안의 키 번호
      - name: 식별키 종류
        physical_name: KEY_KIND
        description: PRIMARY/UNIQUE
      - name: 확인한 원천 키 이름. 논리 유일성 근거는 null 가능
        physical_name: SOURCE_NAME
        description: 확인한 원천 키 이름. 논리 유일성 근거는 null 가능
      - name: 검수 상태 UNKNOWN/VERIFIED/INVALID
        physical_name: REVIEW_STATUS
        description: 검수 상태 UNKNOWN/VERIFIED/INVALID
      - name: 실제 검수자
        physical_name: REVIEWER_ID
        description: 실제 검수자
      - name: 실제 검수 시각
        physical_name: REVIEWED_DTM
        description: 실제 검수 시각
      - name: 검수 근거. 샘플 원값이나 비밀을 넣지 않는다
        physical_name: REVIEW_EVIDENCE
        description: 검수 근거. 샘플 원값이나 비밀을 넣지 않는다
      - name: DECLARED_UNIQUE_CD
        physical_name: DECLARED_UNIQUE_CD
        description: 카탈로그 서버 소유 DECLARED_UNIQUE_CD
      - name: SUPPORT_STATUS
        physical_name: SUPPORT_STATUS
        description: 카탈로그 서버 소유 SUPPORT_STATUS
    relations:
      - entity: ENT-005
        cardinality: 소유 현재 구성 1:N
        description: 과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다.
      - entity: ENT-005
        cardinality: N:1
        description: CATALOG_ID → CATALOG_ID; DB RESTRICT 참조
    rules:
      - 업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다.
      - 현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다.
      - 같은 명시 전체 변경의 임시 내부 참조는 저장 트랜잭션에서 새 적용 리비전/구성 ID로 확정한다. 외부 정확 기술 참조는 자동 최신화하지 않는다.
    delete_policy: 허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다.
    description: 소유 마스터의 현재 적용 구성. 성공한 과거 전체 구성은 같은 HISTORY_NO의 동형 HIST에서 읽는다.
    storage_contract: REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다.
    audit: 원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다.
    copy_mapping:
      history: ENT-071
    table: AI_ADMIN_CATALOG_KEY
    physical:
      attributes:
        - name: CATALOG_ID
          type: bigint
          nullable: false
          default: null
        - name: KEY_NO
          type: bigint
          nullable: false
          default: null
        - name: KEY_KIND
          type: text
          nullable: false
          default: null
        - name: SOURCE_NAME
          type: text
          nullable: true
          default: null
        - name: REVIEW_STATUS
          type: character varying(40)
          nullable: false
          default: null
        - name: REVIEWER_ID
