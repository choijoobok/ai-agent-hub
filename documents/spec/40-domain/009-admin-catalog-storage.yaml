# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-020
    name: "카탈로그 구성 식별"
    term: "TRM-264"
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "logical"
    features:
      - "FEAT-003"
      - "FEAT-011"
    reqs:
      - "REQ-301"
    attributes:
      - name: "컬럼·관계의 안정 식별자"
        physical_name: "MEMBER_ID"
        pk: true
        description: "컬럼·관계의 안정 식별자"
      - name: "생성 시 고정한 소유 카탈로그"
        physical_name: "CATALOG_ID"
        description: "생성 시 고정한 소유 카탈로그"
      - name: "구성 종류"
        physical_name: "MEMBER_KIND"
        description: "COLUMN/RELATION"
      - name: "생성 주체"
        physical_name: "REG_ID"
        description: "생성 주체"
      - name: "생성 시각"
        physical_name: "REG_DTM"
        description: "생성 시각"
    relations:
      - entity: "ENT-005"
        cardinality: "소유 판·구성의 복합 키로 참조"
        description: "명시된 physical 외래키를 따른다. 보존·고정과 현재 권한 판정은 별도 계약이다"
    rules:
      - "소유 카탈로그·종류·식별자는 생성 후 불변이다. 이름 변경이나 미사용/폐기 뒤 다른 구성에 ID를 재사용하지 않는다"
      - "카탈로그 부모 잠금 아래 실제 초안 구성과 함께 생성하며 관계의 관리측 이전을 차단한다"
    delete_policy: "소유 리비전/근거의 불변성과 보존을 따른다. 현재 후보에서 제거해도 과거 판/안정 식별/성공 결과를 연쇄 삭제하지 않는다. 초안 자식 교체는 부모 잠금 아래 같은 트랜잭션으로 처리한다"
    pending:
      - "@defer G3 전 — 새 current/HIST 소유 마스터와 업무 키/FK의 물리 계약 확정"
  - id: ENT-021
    name: "카탈로그 식별키"
    term: "TRM-265"
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "logical"
    features:
      - "FEAT-003"
    reqs:
      - "REQ-301"
    attributes:
      - name: "CATALOG_ID"
        physical_name: "CATALOG_ID"
        description: "현재 소유 마스터의 안정 식별자"
      - name: "판 안의 키 번호"
        physical_name: "KEY_NO"
        pk: true
        description: "판 안의 키 번호"
      - name: "식별키 종류"
        physical_name: "KEY_KIND"
        description: "PRIMARY/UNIQUE"
      - name: "확인한 원천 키 이름. 논리 유일성 근거는 null 가능"
        physical_name: "SOURCE_NAME"
        description: "확인한 원천 키 이름. 논리 유일성 근거는 null 가능"
      - name: "검수 상태 UNKNOWN/VERIFIED/INVALID"
        physical_name: "REVIEW_STATUS"
        description: "검수 상태 UNKNOWN/VERIFIED/INVALID"
      - name: "실제 검수자"
        physical_name: "REVIEWER_ID"
        description: "실제 검수자"
      - name: "실제 검수 시각"
        physical_name: "REVIEWED_DTM"
        description: "실제 검수 시각"
      - name: "검수 근거. 샘플 원값이나 비밀을 넣지 않는다"
        physical_name: "REVIEW_EVIDENCE"
        description: "검수 근거. 샘플 원값이나 비밀을 넣지 않는다"
    relations:
      - entity: "ENT-005"
        cardinality: "소유 현재 구성 1:N"
        description: "과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다."
    rules:
      - "업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다."
      - "현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다."
      - "같은 명시 전체 변경의 임시 내부 참조는 저장 트랜잭션에서 새 적용 리비전/구성 ID로 확정한다. 외부 정확 기술 참조는 자동 최신화하지 않는다."
    delete_policy: "허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다."
    pending:
      - "@defer G3 전 — 현재 적용값/HIST의 타입·업무키/내부 FK·기대 버전·전체 복사/멱등 결과 원자성과 물리 계약을 확정한다."
    description: "소유 마스터의 현재 적용 구성. 성공한 과거 전체 구성은 같은 HISTORY_NO의 동형 HIST에서 읽는다."
    storage_contract: "REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다."
    audit: "원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다."
    copy_mapping:
      history: "ENT-071"
