# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-029
    name: API 필드 안정 식별
    term: TRM-273
    domain: 연동 자산
    module: admin
    implementation: planned
    design_stage: physical
    features:
      - FEAT-004
    reqs:
      - REQ-608
    attributes:
      - name: API 안의 안정 필드 식별자
        physical_name: FIELD_ID
        pk: true
        description: API 안의 안정 필드 식별자
      - name: 소유 안정 API
        physical_name: API_ID
        description: 소유 안정 API
      - name: 최초 작성 주체
        physical_name: REG_ID
        description: 최초 작성 주체
      - name: 최초 작성 시각
        physical_name: REG_DTM
        description: 최초 작성 시각
    rules:
      - 같은 API 안에서만 ID를 사용하고 다른 API로 이전/재사용하지 않는다. 이름/위치가 같다고 다른 필드를 자동 동일시하지 않는다
      - 새 후보는 같은 필드 ID와 새 판의 경로/의미를 보존한다. 제거된 필드 ID는 과거 조회 때문에 남고 새 판에서 자동 복구하지 않는다
    delete_policy: 고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다
    table: AI_ADMIN_API_FIELD_ID
    physical:
      attributes:
        - name: FIELD_ID
          type: bigint
          nullable: false
          default: null
        - name: API_ID
          type: bigint
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_API_FIELD_ID
          definition: PRIMARY KEY (FIELD_ID)
        - name: FK_API_FIELD_ID_1
          definition: FOREIGN KEY (API_ID) REFERENCES AI_ADMIN_BUSINESS_API (API_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
    history_storage:
      mode: not_management_history
    relations:
      - entity: ENT-011
        cardinality: N:1
        description: API_ID → API_ID; DB RESTRICT 참조
  - id: ENT-030
    name: API 필드 정의 값
    term: TRM-274
    domain: 연동 자산
    module: admin
    implementation: planned
    design_stage: physical
    features:
      - FEAT-004
    reqs:
      - REQ-608
    attributes:
      - name: API_ID
        physical_name: API_ID
        description: 현재 소유 마스터의 안정 식별자
      - name: 소유 필드
        physical_name: FIELD_ID
        pk: true
        description: 소유 필드
      - name: 필드 안의 정의 순서
        physical_name: VALUE_NO
        pk: true
        description: 필드 안의 정의 순서
      - name: ENUM/FIXED/DEFAULT/MEANING
        physical_name: VALUE_ROLE
        description: 허용값·고정값·기본값·의미 매핑 역할 구분. MEANING은 허용값을 자동 변경하지 않는다.
      - name: STRING/NUMBER/BOOLEAN/NULL
        physical_name: VALUE_TYPE
        description: STRING/NUMBER/BOOLEAN/NULL
      - name: 정형 스칼라 값. NULL 타입만 null
        physical_name: VALUE_TEXT
        description: 정형 스칼라 값. NULL 타입만 null
      - name: 역할·타입·정형 값 SHA-256
        physical_name: VALUE_KEY
        description: 역할·타입·정형 값 SHA-256
      - name: 값의 의미·사용 조건
        physical_name: MEANING
        description: 직접 등록 또는 열거 값의 업무 의미·적용 조건
      - name: 코드 명칭
        physical_name: CODE_NM
        description: MEANING 역할의 사용자 표시명. 물리명 미정
      - name: 정의 값 안정 식별자
        physical_name: VALUE_ID
        description: 최초 등록 시 부여하는 논리 itemId. 명칭/원값/정렬 변경에도 유지한다. 신규 값은 valueClientKey로 전체 구성 안에서 참조하고 저장 시 itemId로 해석한다. 물리명 미정
    rules:
      - 업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다.
      - 현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다.
      - 같은 명시 전체 변경의 임시 내부 참조는 저장 트랜잭션에서 새 적용 리비전/구성 ID로 확정한다. 외부 정확 기술 참조는 자동 최신화하지 않는다.
    delete_policy: 허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다.
    description: 소유 마스터의 현재 적용 구성. 성공한 과거 전체 구성은 같은 HISTORY_NO의 동형 HIST에서 읽는다.
    relations:
      - entity: ENT-011
        cardinality: 소유 현재 구성 1:N
        description: 과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다.
      - entity: ENT-013
        cardinality: N:1
        description: API_ID, FIELD_ID → API_ID, FIELD_ID; DB RESTRICT 참조
    storage_contract: REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다.
    audit: 원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다.
    copy_mapping:
      history: ENT-081
    table: AI_ADMIN_API_FIELD_VALUE
    physical:
      attributes:
        - name: API_ID
          type: bigint
          nullable: false
          default: null
        - name: FIELD_ID
          type: bigint
          nullable: false
          default: null
        - name: VALUE_NO
          type: bigint
          nullable: false
          default: null
        - name: VALUE_ROLE
          type: text
          nullable: false
          default: null
        - name: VALUE_TYPE
          type: character varying(40)
          nullable: false
          default: null
        - name: VALUE_TEXT
          type: text
          nullable: false
          default: null
        - name: VALUE_KEY
          type: character(64)
          nullable: false
          default: null
        - name: MEANING
          type: text
          nullable: false
          default: null
        - name: CODE_NM
          type: text
          nullable: true
          default: null
        - name: VALUE_ID
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_API_FIELD_VALUE
          definition: PRIMARY KEY (FIELD_ID, VALUE_NO)
        - name: UK_API_FIELD_VALUE_1
          definition: UNIQUE (VALUE_ID)
        - name: FK_API_FIELD_VALUE_1
          definition: FOREIGN KEY (API_ID, FIELD_ID) REFERENCES AI_ADMIN_API_FIELD (API_ID, FIELD_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
    history_storage:
      mode: full_owned_snapshot
      parent: ENT-013
      entity: ENT-081
      root: ENT-011
