# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-029
    name: "API 필드 안정 식별"
    term: TRM-273
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "logical"
    features:
      - FEAT-004
    reqs:
      - REQ-608
    attributes:
      - name: "API 안의 안정 필드 식별자"
        physical_name: "FIELD_ID"
        pk: true
        description: "API 안의 안정 필드 식별자"
      - name: "소유 안정 API"
        physical_name: "API_ID"
        description: "소유 안정 API"
      - name: "최초 작성 주체"
        physical_name: "REG_ID"
        description: "최초 작성 주체"
      - name: "최초 작성 시각"
        physical_name: "REG_DTM"
        description: "최초 작성 시각"
    rules:
      - "같은 API 안에서만 ID를 사용하고 다른 API로 이전/재사용하지 않는다. 이름/위치가 같다고 다른 필드를 자동 동일시하지 않는다"
      - "새 후보는 같은 필드 ID와 새 판의 경로/의미를 보존한다. 제거된 필드 ID는 과거 조회 때문에 남고 새 판에서 자동 복구하지 않는다"
    delete_policy: "고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다"
    pending:
      - "@defer G3 전 — 새 current/SNP/HIST 소유 마스터와 업무 키/FK의 물리 계약 확정"
  - id: ENT-030
    name: "API 필드 정의 값"
    term: TRM-274
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "logical"
    features:
      - FEAT-004
    reqs:
      - REQ-608
    attributes:
      - name: "API_ID"
        physical_name: "API_ID"
        description: "현재 소유 마스터의 안정 식별자"
      - name: "소유 필드"
        physical_name: "FIELD_ID"
        pk: true
        description: "소유 필드"
      - name: "필드 안의 정의 순서"
        physical_name: "VALUE_NO"
        pk: true
        description: "필드 안의 정의 순서"
      - name: "ENUM/FIXED/DEFAULT"
        physical_name: "VALUE_ROLE"
        description: "ENUM/FIXED/DEFAULT"
      - name: "STRING/NUMBER/BOOLEAN/NULL"
        physical_name: "VALUE_TYPE"
        description: "STRING/NUMBER/BOOLEAN/NULL"
      - name: "정형 스칼라 값. NULL 타입만 null"
        physical_name: "VALUE_TEXT"
        description: "정형 스칼라 값. NULL 타입만 null"
      - name: "역할·타입·정형 값 SHA-256"
        physical_name: "VALUE_KEY"
        description: "역할·타입·정형 값 SHA-256"
      - name: "열거 값의 의미/코드 표시명"
        physical_name: "MEANING"
        description: "열거 값의 의미/코드 표시명"
    rules:
      - "업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다."
      - "현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다."
      - "같은 세트 후보 참조는 REQUEST_NO+대상 종류/안정 ID+구성 ID로 표현한다. 반영 트랜잭션에서 모든 대상의 새 적용 리비전으로 함께 확정하고 외부 참조를 자동 최신화하지 않는다."
    delete_policy: "운영 삭제도 요청/전결 검증·전체 이력과 원자 처리한다. 요청 제출본·과거 이력은 현재 삭제로 연쇄 제거하지 않는다."
    pending:
      - "@defer G3 전 — 변경된 current/SNP/HIST 논리 모델의 타입·업무키/내부 FK·복사 스키마와 Liquibase 물리를 확정한다. 기존 판별 PK/FK 물리 초안은 철회했으며 구현된 것으로 보지 않는다."
    description: "소유 마스터의 현재 적용 구성. 현재값은 한 세트이며 요청/과거 구성은 별도 동형 _SNP/_HIST에서 읽는다."
    relations:
      - entity: ENT-011
        cardinality: "소유 현재 구성 1:N"
        description: "과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다."
    storage_contract: "REQ-601.management_storage. 본 테이블=현재값, 원본별 _SNP=요청 전체 구성, _HIST=성공 적용 전체 구성. 현재 업무 속성은 두 복사에 동형 보존한다. 저장·승인·반려 상태는 요청 원장 소유다."
    audit: "원 등록/수정 감사값을 보존하고 현재/요청/이력의 작성·처리 근거를 구분한다. 정확 적용 리비전은 마스터 _HIST의 HISTORY_NO로 해석한다."
    copy_mapping:
      snapshot: ENT-080
      history: ENT-081
