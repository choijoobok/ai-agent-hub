  - id: ENT-032
    name: API 계약 참조
    term: TRM-276
    domain: 연동 자산
    module: admin
    implementation: planned
    design_stage: physical
    features:
      - FEAT-004
    reqs:
      - REQ-608
    attributes:
      - name: 소유 안정 식별자
        physical_name: OWNER_API_ID
        pk: true
        description: 현재 구성의 소유 마스터. 참조 대상 API_ID와 구분한다.
      - name: 판 안의 참조 번호
        physical_name: REFERENCE_NO
        pk: true
        description: 판 안의 참조 번호
      - name: 입력/값/코드명의 소유 필드. API 전체 후속이면 null
        physical_name: OWNER_FIELD_ID
        description: 입력/값/코드명의 소유 필드. API 전체 후속이면 null
      - name: INPUT_LOOKUP/FIELD_CODE/FOLLOWUP
        physical_name: ROLE_CD
        description: 입력 확보·명시 허용값·후속 참조. 의미 매핑의 참조 가이드를 자동 CODE_NAME 조회 설정으로 만들지 않는다.
      - name: API/CATALOG/TOOL
        physical_name: TARGET_KIND
        description: API/CATALOG/TOOL
      - name: 참조 안정 API
        physical_name: API_ID
        description: 참조 안정 API
      - name: 선택 API 내용 판. API_LOOKUP은 고정하지 않고 null
        physical_name: API_REVISION_ID
        description: 선택 API 내용 판. API_LOOKUP은 고정하지 않고 null
      - name: 참조 공개 카탈로그
        physical_name: CATALOG_ID
        description: 참조 공개 카탈로그
      - name: 선택 카탈로그 내용 판
        physical_name: CATALOG_REVISION_ID
        description: 선택 카탈로그 내용 판
      - name: 참조 안정 도구
        physical_name: TOOL_ID
        description: 참조 안정 도구
      - name: 선택 도구 내용 판
        physical_name: TOOL_REVISION_ID
        description: 선택 도구 내용 판
      - name: 업무 역할·선택 조건 설명
        physical_name: PURPOSE
        description: 업무 역할·선택 조건 설명
    rules:
      - 업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다.
      - API_LOOKUP은 안정 API_ID만 참조하고 API_REVISION_ID는 null이다. 다른 정확 기술 참조의 *_REVISION_ID는 해당 판을 보존한다. 관리 HIST는 당시 안정 ID/가이드를 복사하며 실제 호출에 사용한 대상 판은 실행 이력에서 확인한다.
      - API_LOOKUP은 대상 API의 필드/판 변경에 따라 소유 설정을 다시 저장하거나 정확 판을 맞추지 않는다. 나머지 명시 구성/기술 참조는 기존 저장 시 정확 판 검증을 유지한다.
