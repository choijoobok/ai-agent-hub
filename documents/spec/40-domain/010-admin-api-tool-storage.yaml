    relations:
      - entity: ENT-011
        cardinality: 소유 현재 구성 1:N
        description: 과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다.
      - entity: ENT-011
        cardinality: N:1
        description: OWNER_API_ID → API_ID; DB RESTRICT 참조
