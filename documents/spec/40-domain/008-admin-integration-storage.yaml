# 첫 물리 묶음의 집합·명령 처리 — 제품 구현 전 설계 초안
entities:
  - id: ENT-017
    cleanup_mapping: CONNECTION_RECORD_ID는 재등록 시 새 번호다. 정리에서 정확 내부 ID를 확인하고 부모+CONNECTION_ID의 소속을 대조한다. 같은 지문 재기동은 제거 메타를 부활시키지 않는다. 후속 API/워크플로우 제공자는 현재/대기 참조와 정확 내부 ID 검사를 연결한다.
    configuration_cleanup: REQ-601.configuration_cleanup. 낡은 세대 재기동의 부활 금지, 새 유효 배포에서 같은 의미 키 재등장은 새 내부 ID로 등록하며 과거 권한/참조를 복원하지 않는다.
    name: 대상 시스템 연결 메타와 표시 보완
    term: TRM-261
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    table: AI_ADMIN_TARGET_SYSTEM_CONN
    features:
      - FEAT-001
    reqs:
      - REQ-604
    attributes:
      - name: 대상 시스템 식별자
        physical_name: TARGET_SYSTEM_ID
        description: 허용 집합의 소유 시스템
      - name: 배포 API 연결 식별자
        physical_name: CONNECTION_ID
        description: 현재 로드 정의에서 선택한 비밀 없는 참조. 주소/인증/헤더 사본이 아니다
      - name: 연결명 재정의
        physical_name: CONNECTION_NM
        description: 관리자 이름 재정의; null은 YAML 기본/키
      - name: 연결 설명 재정의
        physical_name: DESCRIPTION
        description: 관리자 설명; null은 기본, 빈 문자열은 명시 공란
      - name: YAML 기본 연결명
        physical_name: YAML_CONNECTION_NM
        description: 비밀 없는 기본 표시명
      - name: YAML 기본 연결 설명
        physical_name: YAML_DESCRIPTION
        description: 비밀 없는 기본 설명
      - name: 정상 확인 설정 세대
        physical_name: SYNC_CONFIG_ID
        description: 현재 적용 세대와 소속/존재 대조
      - name: REG_ID
        physical_name: REG_ID
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: REG_DTM
        physical_name: REG_DTM
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: MOD_ID
        physical_name: MOD_ID
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: MOD_DTM
        physical_name: MOD_DTM
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: REG_SOURCE_CD
        physical_name: REG_SOURCE_CD
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: MOD_SOURCE_CD
        physical_name: MOD_SOURCE_CD
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
      - name: 내부 연결 안정 식별자
        physical_name: CONNECTION_RECORD_ID
        pk: true
        description: 내부 연결 안정 식별자
    relations:
      - entity: ENT-001
        cardinality: 허용 연결마다 시스템 하나
        description: YAML 소속과 표시 보완 저장의 부모 잠금/세대를 공유한다.
      - entity: ENT-001
        cardinality: N:1
        description: TARGET_SYSTEM_ID → TARGET_SYSTEM_ID; DB RESTRICT 참조
    rules:
      - YAML에 선언된 시스템/연결 키만 추가/갱신한다. 기본 연결 소속 FK·화면 집합 교체는 없다.
      - YAML 제거도 현재 행/참조와 표시 재정의를 보존하고 ENT-098의 적용 설정 버전별 저장 판정으로 불일치를 알린다.
      - Base URL/인증 표시·접속 테스트는 현재 YAML 정의에서 얻으며 비밀/주소 원문을 이 테이블이나 이력에 복제하지 않는다.
      - CONNECTION_ID는 배포의 문자열 키, CONNECTION_RECORD_ID는 서버 발급 BIGINT다. 정리 후 같은 배포 키가 재등장해도 새 내부 번호를 발급한다. API 현재 매핑과 과거 이력은 내부 번호까지 대조한다. 기존 부모와 다른 연결로 자동 재연결하지 않는다.
    delete_policy: REQ-601.configuration_cleanup. 현재 정확 누락·미참조·배포 안전성을 확인한 명시 일괄 정리만 허용한다. 소유 현재 자식만 제거하고 이력/명령/판정/경고/실행 근거와 외부 참조 자산은 보존한다. 연결만 제거하면 부모는 존속한다.
    physical:
      attributes:
        - name: TARGET_SYSTEM_ID
          type: bigint
          nullable: false
          default: null
        - name: CONNECTION_ID
          type: character varying(100)
          nullable: false
          default: null
        - name: CONNECTION_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: YAML_CONNECTION_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: YAML_DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: SYNC_CONFIG_ID
          type: character varying(100)
          nullable: true
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: MOD_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: REG_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: MOD_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: CONNECTION_RECORD_ID
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_TARGET_SYSTEM_CONN
          definition: PRIMARY KEY (CONNECTION_RECORD_ID)
        - name: UK_TARGET_SYSTEM_CONN_1
          definition: UNIQUE (TARGET_SYSTEM_ID, CONNECTION_ID)
        - name: FK_TARGET_SYSTEM_CONN_1
          definition: FOREIGN KEY (TARGET_SYSTEM_ID) REFERENCES AI_ADMIN_TARGET_SYSTEM (TARGET_SYSTEM_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    description: YAML 소유 연결 식별/소속과 비밀 없는 이름·설명 기본값/관리자 재정의. 현재 URL·인증 비밀 사본이 아니다.
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources:
