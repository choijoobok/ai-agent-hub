      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
    history_storage:
      mode: full_owned_snapshot
      parent: ENT-001
      entity: ENT-044
      root: ENT-001
    copy_mapping:
      history: ENT-044
  - id: ENT-018
    name: 데이터소스 적용 가능 그룹
    term: TRM-262
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-002
    reqs:
      - REQ-603
    attributes:
      - name: 데이터소스 식별자
        physical_name: DATA_SOURCE_ID
        pk: true
        description: 매핑 어휘 집합의 소유 데이터소스
      - name: 그룹 안정 식별자
        physical_name: GROUP_ID
        pk: true
        description: FEAT-006의 관리 그룹 참조. 현재 BIGINT 설계는 소유 영역과 물리 계약 대조가 필요하다
      - name: 매핑 활성 여부
        physical_name: ACTIVE_YN
        description: 소유 매핑의 mappingActive. 현재/과거 값 보존; 자산 자체 useYn과 구분
      - name: REG_ID
        physical_name: REG_ID
        description: 최초 등록 주체
      - name: REG_DTM
        physical_name: REG_DTM
        description: 최초 등록 시각
      - name: MOD_ID
        physical_name: MOD_ID
        description: 최종 변경 주체
      - name: MOD_DTM
        physical_name: MOD_DTM
        description: 최종 변경 시각
    mapping_active: REQ-601.asset_mapping_active.datasource_boundary·history. 현재 행과 동형 이력에 매핑 활성 여부를 보존한다. 비활성화는 삭제가 아니며 활성 하위 참조를 남긴 부모 OFF는 거부한다. 물리 컬럼은 소유 G3 전에 확정한다.
    relations:
      - entity: ENT-002
        cardinality: 그룹 매핑마다 데이터소스 하나
        description: 집합 교체와 참조 보호를 부모 변경에 포함한다
      - entity: ENT-002
        cardinality: N:1
        description: DATA_SOURCE_ID → DATA_SOURCE_ID; DB RESTRICT 참조
      - entity: ENT-102
        cardinality: N:1
        description: GROUP_ID → GROUP_ID; DB RESTRICT 참조
    rules:
      - 접근 가능 사용자 그룹의 안정 매핑. 하위 카탈로그/컬럼 허용 매핑 어휘이며 별도 DB 전체 접근권 부여가 아니다. 사용 중인 하위 매핑이 남은 축소는 거부한다.
      - ENT-002 메타·가이드와 같은 전체 저장/이력 세트다.
