  - id: ENT-019
    configuration_cleanup_result: REQ-601.configuration_cleanup.retry. 한 원 명령 아래 전체 대상의 정확 ID/종류/부모·기준/결과 버전·HISTORY_NO 집합과 전체 성공을 보존한다. 기존 단일 대상 컬럼 하나로 묶음 결과를 대체하지 않는다. 일괄 결과 집합의 물리 저장 매핑은 후속 P3에서 확정한다.
    name: 연동 자산 변경 처리
    term: TRM-263
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    table: AI_ADMIN_ASSET_COMMAND
    features:
      - FEAT-001
      - FEAT-002
    reqs:
      - REQ-601
    attributes:
      - name: 명령 기록 시각
        physical_name: RECORDED_DTM
        description: NO_CHANGE를 포함한 원 명령의 보존 기산 시각. 실제 반영 시각과 구분한다.
      - name: 명령 식별자
        physical_name: COMMAND_KEY
        pk: true
        description: 한 저장 의도를 식별하는 UUID 문자열. HTTP 추적 ID와 별개다
      - name: 처리 주체
        physical_name: ACTOR_ID
        description: 서버가 현재 인증 주체에서 확정한다
      - name: 입력 지문
        physical_name: REQUEST_DIGEST
        description: 정규화한 대상/작업/기대 버전/전체 입력/사유/주체의 SHA-256. 원문/비밀을 보관하지 않는다
      - name: 대상 종류
        physical_name: TARGET_KIND
        description: 대상 시스템/연결 또는 데이터소스와 일괄 정리 범위
      - name: 대상 식별자
        physical_name: TARGET_ID
        description: 단일 명령의 생성 결과 또는 변경한 기존 대상. 일괄 명령은 configuration_cleanup_result의 정확 대상 집합을 사용한다
      - name: 작업 종류
        physical_name: ACTION_CD
        description: CREATE/CHANGE/REFERENCE_CORRECTION/DELETE/CONFIGURATION_CLEANUP
      - name: 반영 버전
        physical_name: RESULT_VERSION
        description: 성공한 새 관리 버전. 삭제도 마지막 버전+1
      - name: 이력 세트 번호
        physical_name: HISTORY_NO
        description: 신규 포함 원 성공이 원자 저장한 HISTORY_NO. 각 이력 표의 HIST_ID PK와 구분한다.
      - name: 반영 시각
        physical_name: APPLIED_DTM
        description: 성공 트랜잭션의 서버 시각
      - name: 소유 기능
        physical_name: OWNER_FEATURE
        description: 소유 기능
      - name: 처리 결과
        physical_name: OUTCOME_CD
        description: 처리 결과
      - name: 정규화 버전
        physical_name: DIGEST_VERSION
        description: 정규화 버전
    relations:
      - entity: ENT-001
        cardinality: 시스템 명령이면 당시 대상 하나
        description: 삭제 뒤 현재 행은 없어도 처리 결과는 남는다
      - entity: ENT-002
        cardinality: 데이터소스 명령이면 당시 대상 하나
        description: 현재 행에 물리 FK를 두지 않는다
    rules:
      - 50-api.feature_contracts.FEAT-001.shared_write_contract의 같은 주체/명령/입력 판정과 권한 검사를 따른다
      - 성공 결과만 현재값/집합/이력과 같은 트랜잭션으로 남긴다. 롤백은 명령 결과도 남기지 않는다
      - 처리 중은 미커밋 트랜잭션이며 조회에서 미발견을 미실행 확정으로 반환하지 않는다
      - 일괄 정리는 단일 대상/판/이력 열 null이며 ENT-168 전체 결과 행을 사용한다. 단일 APPLIED는 해당 열 필수, NO_CHANGE는 새 이력/반영 시각 null이다.
    delete_policy: 현재 자산 삭제에 연쇄 삭제하지 않는다. 아래 보존/재수신 경계가 확정되기 전 파기 기능을 활성화하지 않는다
    physical:
      attributes:
        - name: RECORDED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: COMMAND_KEY
          type: character(36)
          nullable: false
          default: null
        - name: ACTOR_ID
          type: character varying(50)
          nullable: false
          default: null
        - name: REQUEST_DIGEST
          type: character varying(64)
          nullable: false
          default: null
        - name: TARGET_KIND
          type: character varying(20)
          nullable: false
          default: null
        - name: TARGET_ID
          type: bigint
          nullable: true
          default: null
        - name: ACTION_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: RESULT_VERSION
          type: bigint
          nullable: true
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: true
          default: null
        - name: APPLIED_DTM
          type: timestamp with time zone
          nullable: true
          default: null
        - name: OWNER_FEATURE
          type: character varying(20)
          nullable: false
          default: null
        - name: OUTCOME_CD
          type: character varying(20)
          nullable: false
          default: null
        - name: DIGEST_VERSION
          type: character varying(20)
          nullable: false
          default: null
      constraints:
        - name: PK_ASSET_COMMAND
          definition: PRIMARY KEY (COMMAND_KEY)
        - name: CK_ASSET_COMMAND_1
          definition: CHECK (ACTION_CD IN ('CREATE','CHANGE','REFERENCE_CORRECTION','DELETE','CONFIGURATION_CLEANUP'))
        - name: CK_ASSET_COMMAND_2
          definition: CHECK (OUTCOME_CD IN ('APPLIED','NO_CHANGE'))
