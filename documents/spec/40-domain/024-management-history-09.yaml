entities:
  - id: ENT-232
    name: 조회 정책 행 스코프 전체 변경 이력
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_QUERY_SCOPE_HIST
    features:
      - FEAT-009
      - FEAT-040
    reqs:
      - REQ-611
      - REQ-103
      - REQ-601
    term: TRM-054
    domain: 업무 지식
    sources: []
    attributes:
      - name: 스코프 번호
        physical_name: SCOPE_ID
        pk: false
        description: 스코프 번호
      - name: 부모 정책
        physical_name: POLICY_ID
        description: 부모 정책
        pk: false
      - name: 스코프명
        physical_name: SCOPE_NM
        description: 스코프명
        pk: false
      - name: WHERE 조건식 조각
        physical_name: CONDITION_SQL
        description: WHERE 조건식 조각
        pk: false
      - name: 파라미터 추출 지문
        physical_name: EXTRACTION_DIGEST
        description: 파라미터 추출 지문
        pk: false
      - name: 조건 사용
        physical_name: USE_YN
        description: 조건 사용
        pk: false
      - name: 정책 해제 허용
        physical_name: RELEASE_ALLOWED_YN
        description: 정책 해제 허용
        pk: false
      - name: 이력 행 식별자
        physical_name: HIST_ID
        pk: true
        description: 이력 행 식별자
      - name: 전체 이력 세트 번호
        physical_name: HISTORY_NO
        pk: false
        description: 전체 이력 세트 번호
    physical:
      attributes:
        - name: SCOPE_ID
          type: bigint
          nullable: false
          default: null
        - name: POLICY_ID
          type: bigint
          nullable: false
          default: null
        - name: SCOPE_NM
          type: character varying(200)
          nullable: false
          default: null
        - name: CONDITION_SQL
          type: text
          nullable: false
          default: null
        - name: EXTRACTION_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: USE_YN
          type: character(1)
          nullable: false
          default: null
        - name: RELEASE_ALLOWED_YN
          type: character(1)
          nullable: false
          default: null
        - name: HIST_ID
          type: bigint
          nullable: false
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_QUERY_SCOPE_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_QUERY_SCOPE_HIST_SET
          definition: UNIQUE (HISTORY_NO, SCOPE_ID)
        - name: FK_QUERY_SCOPE_HIST_PARENT
          definition: FOREIGN KEY (HISTORY_NO, POLICY_ID) REFERENCES AI_ADMIN_QUERY_POLICY_HIST (HISTORY_NO, POLICY_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_QUERY_SCOPE_HIST_LOOKUP
          unique: false
          method: btree
          definition: CREATE INDEX IX_QUERY_SCOPE_HIST_LOOKUP ON AI_ADMIN_QUERY_SCOPE_HIST (SCOPE_ID, HISTORY_NO)
    history_storage:
      mode: immutable_snapshot
      source: ENT-146
      root_history: ENT-200
    delete_policy: 현재값·보호 참조가 없는 보존 종료 전체 세트만 소유 파기 명령으로 자식→루트 순서 삭제한다. 현재 테이블 FK/cascade 없음. ADR-044의 원 명령 종료키 등록과 원장 파기를 원자 처리한다.
    rules:
      - 원본의 모든 소유 열을 타입/null까지 동형 복사한다. 이력 PK는 HIST_ID이며 원본 PK는 일반 원값이다.
      - 신규/변경은 반영 후 전체, 삭제는 직전 전체와 새 RESULT_REVISION/DELETE 사건을 보존한다. 정확 성공 판 조회는 DELETE를 제외한다.
      - HISTORY_NO는 루트와 모든 자식에 동일하다. 자식은 HISTORY_NO+소유 부모 키의 복합 FK로 같은 세트의 소속까지 보장한다. HIST_DTM은 루트만 소유하고 자식 조회는 부모 체인을 통해 루트를 조인한다.
      - 원 REG/MOD 값은 원본 시점 그대로 보존한다. 보호 등록과 파기는 같은 세트 잠금이며 부분 누락을 현재값으로 메우지 않는다.
    relations:
      - entity: ENT-200
        cardinality: N:1
        description: HISTORY_NO → HISTORY_NO; DB RESTRICT 참조
    history_copy_of: ENT-146
    history_parent: ENT-200
    storage_role: history
