          nullable: false
          default: null
        - name: "SOURCE_KIND"
          type: "character varying(16)"
          nullable: false
          default: null
        - name: "SOURCE_REF"
          type: "character varying(200)"
          nullable: true
          default: null
        - name: "OBSERVATION_STATUS"
          type: "character varying(12)"
          nullable: false
          default: null
        - name: "EVIDENCE_FORMAT"
          type: "integer"
          nullable: false
          default: null
        - name: "EVIDENCE_BODY"
          type: "text"
          nullable: false
          default: null
        - name: "RECEIVED_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "OBSERVED_DTM"
          type: "timestamp with time zone"
          nullable: true
          default: null
        - name: "PLANNED_SOURCE_DTM"
          type: "timestamp with time zone"
          nullable: true
          default: null
        - name: "ACTUAL_SOURCE_DTM"
          type: "timestamp with time zone"
          nullable: true
          default: null
        - name: "ACTOR_ID"
          type: "character varying(30)"
          nullable: false
          default: null
        - name: "COMMAND_KEY"
          type: "character varying(36)"
          nullable: false
          default: null
      constraints:
        - name: "PK_CATALOG_EVIDENCE"
          definition: "PRIMARY KEY (EVIDENCE_ID)"
        - name: "UK_CAT_EVIDENCE_COMMAND"
          definition: "UNIQUE (COMMAND_KEY)"
        - name: "CK_CAT_EVIDENCE_STATE"
          definition: "CHECK (SOURCE_KIND IN ('NOTICE','STRUCTURE','MEANING') AND OBSERVATION_STATUS IN ('UNCONFIRMED','COMPLETE','PARTIAL','FAILED') AND EVIDENCE_FORMAT >= 1)"
      indexes:
        - name: "IX_CAT_EVIDENCE_TIME"
          unique: false
          method: "btree"
          definition: "(RECEIVED_DTM DESC, EVIDENCE_ID DESC)"
