# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-005
    name: 카탈로그 항목
    term: TRM-223
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-003
    reqs:
      - REQ-301
      - REQ-603
    description: 실제 적용된 최신 데이터의 안정 마스터. 소유 전체 구성의 REVISION을 실제 반영 때만 증가시킨다.
    attributes:
      - name: 카탈로그 안정 식별자
        physical_name: CATALOG_ID
        pk: true
        description: 카탈로그 안정 식별자
      - name: Hub 데이터소스 참조. 과거 보존을 위해 현재 행 FK를 두지 않는다
        physical_name: DATA_SOURCE_ID
        description: Hub 데이터소스 참조. 과거 보존을 위해 현재 행 FK를 두지 않는다
      - name: 원천 서버 한정자. 해당 없음은 null
        physical_name: SERVER_NAME
        description: 원천 서버 한정자. 해당 없음은 null
      - name: 실제 DB/카탈로그명. 해당 없음은 null
        physical_name: DATABASE_NAME
        description: 실제 DB/카탈로그명. 해당 없음은 null
      - name: 실제 스키마명. 해당 없음은 null
        physical_name: SCHEMA_NAME
        description: 실제 스키마명. 해당 없음은 null
      - name: 원천 객체명
        physical_name: OBJECT_NAME
        description: 원천 객체명
      - name: DBMS 식별 해석 규칙의 버전. 이름 변환을 임의 적용하지 않는다
        physical_name: IDENTITY_PROFILE
        description: DBMS 식별 해석 규칙의 버전. 이름 변환을 임의 적용하지 않는다
      - name: 전체 물리 식별의 SHA-256 비교 키. 전체 원문과 함께 대조한다
        physical_name: OBJECT_KEY
        description: 전체 물리 식별의 SHA-256 비교 키. 전체 원문과 함께 대조한다
      - name: ACTIVE/RETIRED
        physical_name: LIFECYCLE_CD
        description: 실제 적용된 수명주기 상태
      - name: 세트 소유 기능의 실제 반영 결과 참조
        physical_name: APPLY_RESULT_REF
        description: 세트 소유 기능의 실제 반영 결과 참조
      - name: 실제 반영 시각
        physical_name: APPLIED_DTM
        description: 실제 반영 시각
      - name: 최초 작성 주체
        physical_name: REG_ID
        description: 최초 작성 주체
      - name: 최초 등록 시각
        physical_name: REG_DTM
        description: 최초 등록 시각
      - name: REVISION
        physical_name: REVISION
        description: 실제 적용 성공마다 한 번 증가하는 마스터 업무 리비전. 신규 적용은 1
      - name: 수동 사용 여부
        physical_name: USE_YN
        description: REQ-601.asset_availability의 관리자 Boolean 설정. 효력/검수/자동 참조 유효성과 별도이며 전체 이력에 포함
      - name: 수락 시각
        physical_name: ACCEPTED_DTM
        description: 수락 시각
      - name: 변경 사유
        physical_name: CHANGE_REASON
        description: 변경 사유
      - name: SAVE_TARGET_CD
        physical_name: SAVE_TARGET_CD
        description: 카탈로그 서버 소유 SAVE_TARGET_CD
      - name: SOURCE_OBJECT_TOKEN
        physical_name: SOURCE_OBJECT_TOKEN
        description: 카탈로그 서버 소유 SOURCE_OBJECT_TOKEN
      - name: SOURCE_SETTINGS_ID
        physical_name: SOURCE_SETTINGS_ID
        description: 카탈로그 서버 소유 SOURCE_SETTINGS_ID
    relations:
      - entity: ENT-002
        cardinality: 항목마다 데이터소스 하나
        description: 같은 연결 안의 여러 DB/스키마 객체를 각각 전체 식별한다
      - entity: ENT-002
        cardinality: N:1
        description: DATA_SOURCE_ID → DATA_SOURCE_ID; DB RESTRICT 참조
    rules:
      - 업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다.
      - 현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다.
      - 같은 명시 전체 변경의 임시 내부 참조는 저장 트랜잭션에서 새 적용 리비전/구성 ID로 확정한다. 외부 정확 기술 참조는 자동 최신화하지 않는다.
    audit: 원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다.
    delete_policy: 허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다.
    rules_from:
      - REQ-301.business_rules
      - ARCH-028.asset_versions
      - UC-007
    storage_contract: REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다.
    copy_mapping:
      history: ENT-051
    manual_use_contract: REQ-601.asset_availability. 현재 수동 OFF는 과거 리비전/저장된 정의/워크플로우로 우회하지 않는다. 자동 오류·복구는 수동 값을 덮어쓰지 않는다. 실제 구현/기존 데이터 이행은 G3 후 수행한다.
    table: AI_ADMIN_CATALOG
    physical:
      attributes:
        - name: CATALOG_ID
          type: bigint
          nullable: false
          default: null
        - name: DATA_SOURCE_ID
          type: bigint
          nullable: false
          default: null
        - name: SERVER_NAME
          type: character varying(500)
          nullable: true
          default: null
        - name: DATABASE_NAME
          type: character varying(500)
          nullable: true
          default: null
        - name: SCHEMA_NAME
          type: character varying(500)
          nullable: true
          default: null
        - name: OBJECT_NAME
          type: character varying(500)
          nullable: false
          default: null
        - name: IDENTITY_PROFILE
          type: character varying(100)
          nullable: false
          default: null
        - name: OBJECT_KEY
          type: character varying(200)
          nullable: false
          default: null
        - name: LIFECYCLE_CD
          type: character varying(40)
          nullable: false
          default: null
        - name: APPLY_RESULT_REF
          type: character varying(128)
          nullable: false
          default: null
        - name: APPLIED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: REVISION
          type: bigint
          nullable: false
          default: null
        - name: USE_YN
          type: character(1)
          nullable: false
          default: null
        - name: ACCEPTED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: CHANGE_REASON
          type: text
          nullable: false
          default: null
        - name: SAVE_TARGET_CD
          type: character varying(40)
          nullable: false
          default: null
        - name: SOURCE_OBJECT_TOKEN
          type: character varying(100)
          nullable: true
          default: null
        - name: SOURCE_SETTINGS_ID
          type: character varying(128)
          nullable: true
          default: null
      constraints:
        - name: PK_CATALOG
          definition: PRIMARY KEY (CATALOG_ID)
        - name: UK_CATALOG_1
          definition: UNIQUE (DATA_SOURCE_ID, OBJECT_KEY)
        - name: FK_CATALOG_1
          definition: FOREIGN KEY (DATA_SOURCE_ID) REFERENCES AI_ADMIN_DATA_SOURCE (DATA_SOURCE_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
        - name: CK_CATALOG_USE_YN
          definition: CHECK (USE_YN IN ('Y','N'))
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/028-catalog.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/031-catalog-source-evidence.sql
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/catalog/CatalogService.java
    history_storage:
      mode: full_owned_snapshot
      parent: root
      entity: ENT-051
      root: ENT-005
    revision_column: REVISION
