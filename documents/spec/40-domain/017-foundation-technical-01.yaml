# 영역: 017-foundation-technical — 물리 설계 초안
entities:
  - id: ENT-113
    name: 파기 완료 명령의 최소 키 보호
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_COMMAND_GUARD
    features:
      - FEAT-040
    reqs:
      - REQ-601
    term: TRM-292
    domain: 관리 변경
    attributes:
      - name: 정규 UUID의 SHA-256
        physical_name: COMMAND_HASH
        pk: true
        description: 정규 UUID의 SHA-256
      - name: 소유 기능
        physical_name: OWNER_FEATURE
        description: 소유 기능
      - name: 종결 표시
        physical_name: TERMINAL_CD
        description: 종결 표시
    physical:
      attributes:
        - name: COMMAND_HASH
          type: character(64)
          nullable: false
          default: null
        - name: OWNER_FEATURE
          type: character varying(20)
          nullable: false
          default: null
        - name: TERMINAL_CD
          type: character varying(16)
          nullable: false
          default: null
      constraints:
        - name: PK_COMMAND_GUARD
          definition: PRIMARY KEY (COMMAND_HASH)
        - name: CK_COMMAND_GUARD_1
          definition: CHECK (TERMINAL_CD='EXPIRED')
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    rules:
      - ADR-044. 다른 컬럼·주체·대상·입력/결과·감사 시각을 추가하지 않는다. 설치 수명 동안 보존하며 모든 원장 어댑터가 재수신 전에 확인한다.
      - FEAT-305는 외부 안정 namespace+sourceEpoch+eventId의 event/v1 해시도 같은 최소 구조로 보존한다. 서버 UUID 해시와 도메인을 구분하며 source subject/본문지문/시각을 추가하지 않는다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
    history_storage:
      mode: not_management_history
      reason: 기술/불변 업무 기록 또는 비밀 저장 단위
    delete_policy: conventions.foundation_physical.deletion 및 소유 요구의 참조 보호를 따른다. 불변 업무/관측 기록은 보존 종료·소비 보호 해제 후 별도 파기하며 관리 화면에서 일반 삭제하지 않는다.
    relations: []
