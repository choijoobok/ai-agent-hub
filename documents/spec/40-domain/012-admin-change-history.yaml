# 관리 변경 이력 — 원본과 이력은 동형이며 현재 소스 구현 전 설계다.
entities:
  - id: ENT-044
    name: 대상 시스템 연결 메타와 표시 보완 전체 변경 이력
    term: TRM-261
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    table: AI_ADMIN_TARGET_SYSTEM_CONN_HIST
    features:
      - FEAT-001
      - FEAT-040
    reqs:
      - REQ-604
      - REQ-601
    description: 당시 YAML 비밀 없는 메타와 관리자 표시 재정의의 동형 이력. 원본 REG/MOD 보존과 이력 기록자/시각 기본 감사 둘을 구분한다.
    attributes:
      - name: 대상 시스템 식별자
        physical_name: TARGET_SYSTEM_ID
        description: 허용 집합의 소유 시스템
        pk: false
      - name: 배포 API 연결 식별자
        physical_name: CONNECTION_ID
        description: 현재 로드 정의에서 선택한 비밀 없는 참조. 주소/인증/헤더 사본이 아니다
        pk: false
      - name: 연결명 재정의
        physical_name: CONNECTION_NM
        description: 관리자 이름 재정의; null은 YAML 기본/키
        pk: false
      - name: 연결 설명 재정의
        physical_name: DESCRIPTION
        description: 관리자 설명; null은 기본, 빈 문자열은 명시 공란
        pk: false
      - name: YAML 기본 연결명
        physical_name: YAML_CONNECTION_NM
        description: 비밀 없는 기본 표시명
        pk: false
      - name: YAML 기본 연결 설명
        physical_name: YAML_DESCRIPTION
        description: 비밀 없는 기본 설명
        pk: false
      - name: 정상 확인 설정 세대
        physical_name: SYNC_CONFIG_ID
        description: 현재 적용 세대와 소속/존재 대조
        pk: false
      - name: REG_ID
        physical_name: REG_ID
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: REG_DTM
        physical_name: REG_DTM
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: MOD_ID
        physical_name: MOD_ID
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: MOD_DTM
        physical_name: MOD_DTM
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: REG_SOURCE_CD
        physical_name: REG_SOURCE_CD
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: MOD_SOURCE_CD
        physical_name: MOD_SOURCE_CD
        description: 등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다.
        pk: false
      - name: 내부 연결 안정 식별자
        physical_name: CONNECTION_RECORD_ID
        pk: false
        description: 내부 연결 안정 식별자
      - name: 이력 행 식별자
        physical_name: HIST_ID
        pk: true
        description: 이력 행 식별자
      - name: 전체 이력 세트 번호
        physical_name: HISTORY_NO
        pk: false
        description: 전체 이력 세트 번호
    relations:
      - entity: ENT-017
        cardinality: 원본 식별자를 값으로 보존
        description: 현재 행에 FK/연쇄 삭제를 두지 않는다
      - entity: ENT-003
        cardinality: 같은 HISTORY_NO의 마스터 이력 하나
        description: 원본 부모가 아니라 이력 세트 내부의 부모를 검증한다
      - entity: ENT-003
        cardinality: N:1
        description: HISTORY_NO → HISTORY_NO; DB RESTRICT 참조
    rules:
      - 원본의 모든 소유 열을 타입/null까지 동형 복사한다. 이력 PK는 HIST_ID이며 원본 PK는 일반 원값이다.
      - 신규/변경은 반영 후 전체, 삭제는 직전 전체와 새 RESULT_REVISION/DELETE 사건을 보존한다. 정확 성공 판 조회는 DELETE를 제외한다.
      - HISTORY_NO는 루트와 모든 자식에 동일하다. 자식은 HISTORY_NO+소유 부모 키의 복합 FK로 같은 세트의 소속까지 보장한다. HIST_DTM은 루트만 소유하고 자식 조회는 부모 체인을 통해 루트를 조인한다.
      - 원 REG/MOD 값은 원본 시점 그대로 보존한다. 보호 등록과 파기는 같은 세트 잠금이며 부분 누락을 현재값으로 메우지 않는다.
    delete_policy: 현재값·보호 참조가 없는 보존 종료 전체 세트만 소유 파기 명령으로 자식→루트 순서 삭제한다. 현재 테이블 FK/cascade 없음. ADR-044의 원 명령 종료키 등록과 원장 파기를 원자 처리한다.
    rules_from:
      - REQ-601.change_history
      - ADR-035
    history_copy_of: ENT-017
    physical:
      attributes:
        - name: TARGET_SYSTEM_ID
          type: bigint
          nullable: false
          default: null
        - name: CONNECTION_ID
          type: character varying(100)
          nullable: false
          default: null
        - name: CONNECTION_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: YAML_CONNECTION_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: YAML_DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: SYNC_CONFIG_ID
          type: character varying(100)
          nullable: true
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: MOD_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: REG_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: MOD_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: CONNECTION_RECORD_ID
          type: bigint
          nullable: false
          default: null
        - name: HIST_ID
          type: bigint
          nullable: false
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_TARGET_SYSTEM_CONN_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_TARGET_SYSTEM_CONN_HIST_SET
          definition: UNIQUE (HISTORY_NO, CONNECTION_RECORD_ID)
        - name: FK_TARGET_SYSTEM_CONN_HIST_PARENT
          definition: FOREIGN KEY (HISTORY_NO, TARGET_SYSTEM_ID) REFERENCES AI_ADMIN_TARGET_SYSTEM_HIST (HISTORY_NO, TARGET_SYSTEM_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_TARGET_SYSTEM_CONN_HIST_LOOKUP
          unique: false
          method: btree
          definition: (CONNECTION_RECORD_ID, HISTORY_NO)
    history_parent: ENT-003
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/018-target-system.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
    history_storage:
      mode: immutable_snapshot
      source: ENT-017
      root_history: ENT-003
    storage_role: history
