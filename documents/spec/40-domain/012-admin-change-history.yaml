    rules_from:
      - "REQ-601.change_history"
      - ADR-035
    history_copy_of: ENT-018
    physical:
      attributes:
        - name: "HIST_ID"
          type: "bigint"
          nullable: false
          default: null
        - name: "HISTORY_NO"
          type: "bigint"
          nullable: false
          default: null
        - name: "DATA_SOURCE_ID"
          type: "bigint"
          nullable: false
          default: null
        - name: "GROUP_ID"
          type: "bigint"
          nullable: false
          default: null
      constraints:
        - name: "PK_ADM_SOURCE_GROUP_HIST"
          definition: "PRIMARY KEY (HIST_ID)"
        - name: "UK_ADM_SOURCE_GROUP_HIST_SET"
          definition: "UNIQUE (HISTORY_NO, DATA_SOURCE_ID, GROUP_ID)"
        - name: "FK_ADM_SOURCE_GROUP_HIST_SET"
          definition: "FOREIGN KEY (HISTORY_NO, DATA_SOURCE_ID) REFERENCES AI_ADMIN_DATA_SOURCE_HIST (HISTORY_NO, DATA_SOURCE_ID) DEFERRABLE INITIALLY DEFERRED"
      indexes:
        - name: "IX_ADM_SOURCE_GROUP_HIST_SET"
          unique: false
          method: "btree"
          definition: "(HISTORY_NO)"
