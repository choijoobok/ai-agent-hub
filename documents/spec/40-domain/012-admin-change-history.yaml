    rules:
      - "원본의 모든 허용 관리 컬럼·자료형과 REG/MOD 값을 그대로 복사한다. 비밀 및 실시간 관측은 제외한다."
      - "HIST_ID는 각 이력 행의 PK이며 HISTORY_NO는 집합 연결 키다. 이력 저장일시는 마스터에만 있으며 HISTORY_NO와 원 부모 키로 참조한다."
      - "현재값/세트 전체/명령 결과는 원자 저장하고 동일 명령 재전송은 원 historyNo를 재사용한다."
