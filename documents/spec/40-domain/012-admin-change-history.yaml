    rules: ["REQ-601.change_history·REQ-604.synchronization. 당시 비밀 없는 메타와 관리자 재정의·원본 REG/MOD를 복사한다. 현재 연결 주소/비밀은 복제하지 않는다.", "기본 감사둘은 이력 기록자/시각이며 원본 감사는 당시 구성의 값으로 보존한다."]
