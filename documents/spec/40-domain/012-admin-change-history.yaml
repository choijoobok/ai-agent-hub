  - id: ENT-096
    name: 데이터 조회 가이드
    term: TRM-288
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-002
    reqs:
      - REQ-603
      - REQ-301
      - REQ-601
    description: 데이터소스 하위의 여러 제목/상세 설명. 별도 조회 SQL 정의/검수/활성 판이 아닌 수동 관리 메타
    attributes:
      - name: 가이드 식별자
        physical_name: GUIDE_ID
        pk: true
        description: 서버가 발급하는 데이터소스 소유의 안정 ID. 표시하지 않는 내부 저장/이력 참조
      - name: 데이터소스 참조
        physical_name: DATA_SOURCE_ID
        description: ENT-002의 안정 내부 ID. 다른 데이터소스로 이전/동명 대체 금지
      - name: 제목
        physical_name: TITLE
        description: 공통 코드 조회 가이드·참조 코드 조회 가이드·권한 적용 가이드 등 자유 제목. 비공백
      - name: 상세 설명
        physical_name: DETAIL_TEXT
        description: 조회 방법·필요 원천·업무 조건·참고 예시를 설명하는 비공백 텍스트. 인가 정책을 대체하지 않음
      - name: REG_ID
        physical_name: REG_ID
        description: 최초 등록 주체
      - name: REG_DTM
        physical_name: REG_DTM
        description: 최초 등록 시각
      - name: MOD_ID
        physical_name: MOD_ID
        description: 최종 변경 주체
      - name: MOD_DTM
        physical_name: MOD_DTM
        description: 최종 변경 시각
    relations:
      - to: ENT-002
        type: N:1
        description: 같은 데이터소스 전체 저장/이력의 자식
      - entity: ENT-002
        cardinality: N:1
        description: DATA_SOURCE_ID → DATA_SOURCE_ID; DB RESTRICT 참조
    rules:
      - REQ-603.data_query_guides. 여러 건 추가/수정/허용 제거·기본 감사4개, 독립 버전/타입코드/별도 검수·활성화 없음.
      - 데이터소스 메타·그룹·가이드의 전체 기대 리비전/현재 권한 검증과 원자 저장·전체 HIST를 따른다.
      - 가이드는 서버 인가·read-only·객체/행/마스킹·신원·상한을 완화하지 않으며 원천 조회 결과는 관리값에 저장하지 않는다.
    delete_policy: 현재 데이터소스 전체 저장에서 명시 제거하고 적용 전후 세트 이력을 보존한다. YAML 데이터소스 제거는 자식 가이드를 삭제하지 않는다.
    table: AI_ADMIN_QUERY_GUIDE
    physical:
      attributes:
        - name: GUIDE_ID
          type: bigint
          nullable: false
          default: null
        - name: DATA_SOURCE_ID
          type: bigint
          nullable: false
          default: null
        - name: TITLE
          type: text
          nullable: false
          default: null
        - name: DETAIL_TEXT
          type: text
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: MOD_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_QUERY_GUIDE
          definition: PRIMARY KEY (GUIDE_ID)
        - name: FK_QUERY_GUIDE_1
          definition: FOREIGN KEY (DATA_SOURCE_ID) REFERENCES AI_ADMIN_DATA_SOURCE (DATA_SOURCE_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources:
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/datasource/DataSourceService.java
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/025-data-source.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
