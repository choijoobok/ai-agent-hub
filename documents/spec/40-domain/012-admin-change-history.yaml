    history_copy_of: ENT-017
    physical:
      attributes:
        - name: "HIST_ID"
          type: "bigint"
          nullable: false
          default: null
        - name: "HISTORY_NO"
          type: "bigint"
          nullable: false
          default: null
        - name: "TARGET_SYSTEM_ID"
          type: "bigint"
          nullable: false
          default: null
        - name: "CONNECTION_ID"
          type: "character varying(100)"
          nullable: false
          default: null
        - name: "CONNECTION_NM"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "DESCRIPTION"
          type: "text"
          nullable: true
          default: null
        - name: "YAML_CONNECTION_NM"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "YAML_DESCRIPTION"
          type: "text"
          nullable: true
          default: null
        - name: "SYNC_CONFIG_ID"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "REG_ID"
          type: "character varying(50)"
          nullable: true
          default: null
        - name: "REG_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "MOD_ID"
          type: "character varying(50)"
          nullable: true
          default: null
        - name: "MOD_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "REG_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
        - name: "MOD_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
      constraints:
        - name: "PK_ADM_TARGET_CONN_HIST"
          definition: "PRIMARY KEY (HIST_ID)"
        - name: "UK_ADM_TARGET_CONN_HIST_SET"
          definition: "UNIQUE (HISTORY_NO, TARGET_SYSTEM_ID, CONNECTION_ID)"
        - name: "FK_ADM_TARGET_CONN_HIST_SET"
          definition: "FOREIGN KEY (HISTORY_NO, TARGET_SYSTEM_ID) REFERENCES AI_ADMIN_TARGET_SYSTEM_HIST (HISTORY_NO, TARGET_SYSTEM_ID) DEFERRABLE INITIALLY DEFERRED"
      indexes:
        - name: "IX_ADM_TARGET_CONN_HIST_SET"
          unique: false
          method: "btree"
          definition: "(HISTORY_NO)"
    history_parent: ENT-003
  - id: ENT-045
