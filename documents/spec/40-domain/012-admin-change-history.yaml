        physical_name: "YAML_CONNECTION_NM"
        description: "비밀 없는 기본 표시명"
        origin: "ENT-017 당시 값"
        pk: false
      - name: "YAML 기본 연결 설명"
        physical_name: "YAML_DESCRIPTION"
        description: "비밀 없는 기본 설명"
        origin: "ENT-017 당시 값"
        pk: false
      - name: "정상 확인 설정 세대"
        physical_name: "SYNC_CONFIG_ID"
        description: "현재 적용 세대와 소속/존재 대조"
        origin: "ENT-017 당시 값"
        pk: false
      - name: "REG_ID"
        physical_name: "REG_ID"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
      - name: "REG_DTM"
        physical_name: "REG_DTM"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
      - name: "MOD_ID"
        physical_name: "MOD_ID"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
      - name: "MOD_DTM"
        physical_name: "MOD_DTM"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
      - name: "REG_SOURCE_CD"
        physical_name: "REG_SOURCE_CD"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
      - name: "MOD_SOURCE_CD"
        physical_name: "MOD_SOURCE_CD"
        description: "등록/수정 감사. 주체 종류와 관리자 ID를 구분하고 서버가 기록한다."
        origin: "ENT-017 당시 값"
        pk: false
