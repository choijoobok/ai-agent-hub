          nullable: true
          default: null
        - name: "REG_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "MOD_ID"
          type: "character varying(50)"
          nullable: true
          default: null
        - name: "MOD_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "REG_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
        - name: "MOD_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
      constraints:
        - name: "PK_ADM_TARGET_CONN_HIST"
          definition: "PRIMARY KEY (HIST_ID)"
        - name: "UK_ADM_TARGET_CONN_HIST_SET"
          definition: "UNIQUE (HISTORY_NO, TARGET_SYSTEM_ID, CONNECTION_ID)"
        - name: "FK_ADM_TARGET_CONN_HIST_SET"
          definition: "FOREIGN KEY (HISTORY_NO, TARGET_SYSTEM_ID) REFERENCES AI_ADMIN_TARGET_SYSTEM_HIST (HISTORY_NO, TARGET_SYSTEM_ID) DEFERRABLE INITIALLY DEFERRED"
      indexes:
        - name: "IX_ADM_TARGET_CONN_HIST_SET"
          unique: false
          method: "btree"
          definition: "(HISTORY_NO)"
