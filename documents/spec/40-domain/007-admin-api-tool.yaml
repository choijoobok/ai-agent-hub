      - name: "안정 식별자"
        physical_name: "API_ID"
        pk: true
        description: "안정 식별자"
      - name: "DRAFT/ACTIVE/DISABLED/RETIRED"
        physical_name: "LIFECYCLE_CD"
        description: "DRAFT/ACTIVE/DISABLED/RETIRED"
      - name: "공통 세트 실제 반영 결과 참조"
        physical_name: "APPLY_RESULT_REF"
        description: "공통 세트 실제 반영 결과 참조"
