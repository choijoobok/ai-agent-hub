# admin 현재/요청/이력 저장의 논리 설계 — 물리 상세는 소유 G3 전 확정
entities:
  - id: ENT-011
    name: "업무 API"
    term: "TRM-199"
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "logical"
    features:
      - "FEAT-004"
      - "FEAT-021"
    reqs:
      - "REQ-608"
    description: "실제 적용된 최신 데이터의 안정 마스터. 소유 전체 구성의 REVISION을 실제 반영 때만 증가시킨다."
