        physical_name: "APPLIED_DTM"
        description: "실제 반영 시각"
      - name: "최초 작성 주체"
        physical_name: "REG_ID"
        description: "최초 작성 주체"
      - name: "최초 작성 시각"
        physical_name: "REG_DTM"
        description: "최초 작성 시각"
      - name: "REVISION"
        physical_name: "REVISION"
        description: "실제 적용 성공마다 한 번 증가하는 마스터 업무 리비전. 신규 적용은 1"
    relations:
      - entity: "ENT-015"
        cardinality: "API마다 대응 등록 도구 0개 또는 1개"
        description: "REQ-612.api_tool_mapping. 도구 등록 전에는 없을 수 있으며 과거 내용 판 여러 개를 여러 도구로 세지 않는다"
    related_features:
      - "FEAT-014"
      - "FEAT-021"
      - "FEAT-033"
    rules:
      - "업무 속성/검수 규칙은 소유 REQ와 50-api의 전체 구성 계약을 따른다. 저장 문맥은 REQ-601.management_storage가 정본이다."
      - "현재 구성의 소유 키에는 독립 REVISION_ID를 두지 않는다. 외부 자산의 *_REVISION_ID는 정확 적용 리비전 참조로 보존하며 _HIST 공개 조회로 해석한다."
      - "같은 명시 전체 변경의 임시 내부 참조는 저장 트랜잭션에서 새 적용 리비전/구성 ID로 확정한다. 외부 정확 기술 참조는 자동 최신화하지 않는다."
    audit: "원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다."
    rules_from:
      - "REQ-608.business_rules"
      - "REQ-608.lifecycle"
      - "REQ-612.api_tool_mapping"
      - "ARCH-028.asset_versions"
      - "REQ-105"
    delete_policy: "허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다."
    storage_contract: "REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다."
    pending:
      - "@defer G3 전 — 현재 적용값/HIST의 타입·업무키/내부 FK·기대 버전·전체 복사/멱등 결과 원자성과 물리 계약을 확정한다."
    copy_mapping:
      history: "ENT-059"
