          type: bigint
          nullable: true
          default: null
        - name: CATALOG_REVISION_ID
          type: bigint
          nullable: true
          default: null
        - name: TOOL_ID
          type: bigint
          nullable: true
          default: null
        - name: TOOL_REVISION_ID
          type: bigint
          nullable: true
          default: null
        - name: PURPOSE
          type: text
          nullable: false
          default: null
      constraints:
        - name: PK_TOOL_REFERENCE_1
          definition: PRIMARY KEY (OWNER_TOOL_ID, REFERENCE_NO)
        - name: FK_TOOL_REFERENCE_2
          definition: FOREIGN KEY (OWNER_TOOL_ID) REFERENCES AI_ADMIN_BUSINESS_TOOL (TOOL_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
