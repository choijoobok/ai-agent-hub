    name: 도구 계약 참조
    term: TRM-276
    domain: 연동 자산
    module: admin
    implementation: planned
    design_stage: physical
    features:
      - FEAT-021
    reqs:
      - REQ-612
    attributes:
      - name: 소유 안정 식별자
        physical_name: OWNER_TOOL_ID
        pk: true
        description: 현재 구성의 소유 마스터. 참조 대상 API_ID와 구분한다.
      - name: 판 안의 참조 번호
        physical_name: REFERENCE_NO
        pk: true
        description: 판 안의 참조 번호
      - name: 입력/값/코드명의 소유 필드. 도구 전체 후속이면 null
        physical_name: OWNER_FIELD_ID
        description: 입력/값/코드명의 소유 필드. API 전체 후속이면 null
      - name: INPUT_LOOKUP/FIELD_CODE/FOLLOWUP
        physical_name: ROLE_CD
        description: 입력 확보·명시 허용값·후속 참조. 의미 매핑의 참조 가이드를 자동 CODE_NAME 조회 설정으로 만들지 않는다.
      - name: 도구/CATALOG/TOOL
        physical_name: TARGET_KIND
        description: API/CATALOG/TOOL
      - name: 참조 안정 도구
        physical_name: API_ID
        description: 참조 안정 API
      - name: 선택 도구 내용 판. 도구_LOOKUP은 고정하지 않고 null
        physical_name: API_REVISION_ID
        description: 선택 API 내용 판. API_LOOKUP은 고정하지 않고 null
      - name: 참조 공개 카탈로그
        physical_name: CATALOG_ID
        description: 참조 공개 카탈로그
      - name: 선택 카탈로그 내용 판
        physical_name: CATALOG_REVISION_ID
        description: 선택 카탈로그 내용 판
      - name: 참조 안정 도구
        physical_name: TOOL_ID
        description: 참조 안정 도구
      - name: 선택 도구 내용 판
        physical_name: TOOL_REVISION_ID
        description: 선택 도구 내용 판
      - name: 업무 역할·선택 조건 설명
        physical_name: PURPOSE
        description: 업무 역할·선택 조건 설명
    rules:
      - 같은 TOOL_ID 소유 필드·값·참조만 바인딩한다. 호출 위치는 INPUT/RESPONSE이며 HTTP PATH/QUERY/HEADER를 사용하지 않는다. 다형 참조는 종류별 정확 판을 서버 검사한다.
    delete_policy: 허용된 삭제는 현재 변경 권한·기대 버전·참조 검증·전체 이력을 원자 처리한다. 과거 이력에 현재 행 삭제의 연쇄 삭제 FK를 두지 않는다.
    description: 소유 마스터의 현재 적용 구성. 성공한 과거 전체 구성은 같은 HISTORY_NO의 동형 HIST에서 읽는다.
    relations:
      - entity: ENT-015
        cardinality: 소유 현재 구성 1:N
        description: 과거 판의 FK 대신 안정 소유 마스터를 참조한다. 요청/이력은 복사 세트 문맥으로 제한한다.
      - entity: ENT-015
        cardinality: N:1
        description: OWNER_TOOL_ID → TOOL_ID; DB RESTRICT 참조
    storage_contract: REQ-601.management_storage. 본 테이블은 현재 적용값, 원본별 HIST는 성공한 전체 적용 이력이다. 현재값·REVISION·전체 HISTORY_NO·멱등 결과는 직접 저장의 같은 트랜잭션으로 확정한다. 관리자 요청/SNP는 없다.
    audit: 원 등록/수정 감사와 실제 직접 변경자·시각·사유를 보존한다. 정확 과거 적용 리비전은 해당 마스터 HIST/HISTORY_NO로 해석하며 현재값으로 바꾸지 않는다.
    copy_mapping:
      history: ENT-241
    ownership:
      owner_key: OWNER_TOOL_ID
      parent_key: TOOL_ID
    table: AI_ADMIN_TOOL_REFERENCE
    physical:
      attributes:
        - name: OWNER_TOOL_ID
          type: bigint
          nullable: false
          default: null
        - name: REFERENCE_NO
