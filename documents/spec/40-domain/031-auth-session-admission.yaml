entities:
  - id: ENT-267
    name: 인증 저장소 설정판
    term: TRM-309
    domain: 인증
    module: common
    workstream: integration
    implementation: implemented
    design_stage: physical
    table: AI_AUTH_DOMAIN_STATE
    features: [FEAT-301]
    reqs: [REQ-501, REQ-616]
    attributes:
      - { name: AUTH_DOMAIN, physical_name: AUTH_DOMAIN, pk: true, description: ADMIN 또는 PORTAL 고정 영역 }
      - { name: PROVIDER_TYPE, physical_name: PROVIDER_TYPE, description: JDBC 또는 REDIS }
      - { name: PROVIDER_EPOCH, physical_name: PROVIDER_EPOCH, description: 운영 전환 때만 교체하는 UUID }
      - { name: STORE_INSTANCE, physical_name: STORE_INSTANCE, description: 선택 저장소 설치 식별자 }
      - { name: STATE_CD, physical_name: STATE_CD, description: ACTIVE 또는 DRAINED }
      - { name: CHANGED_AT, physical_name: CHANGED_AT, description: DB UTC 설정판 확정 시각 }
    physical:
      attributes:
        - { name: AUTH_DOMAIN, type: character varying(8), nullable: false, default: null }
        - { name: PROVIDER_TYPE, type: character varying(8), nullable: false, default: null }
        - { name: PROVIDER_EPOCH, type: uuid, nullable: false, default: null }
        - { name: STORE_INSTANCE, type: character varying(100), nullable: false, default: null }
        - { name: STATE_CD, type: character varying(8), nullable: false, default: null }
        - { name: CHANGED_AT, type: timestamp with time zone, nullable: false, default: null }
      constraints:
        - { name: PK_AUTH_DOMAIN_STATE, definition: PRIMARY KEY (AUTH_DOMAIN) }
        - { name: CK_AUTH_DOMAIN_STATE_DOMAIN, definition: "CHECK (AUTH_DOMAIN IN ('ADMIN','PORTAL'))" }
        - { name: CK_AUTH_DOMAIN_STATE_PROVIDER, definition: "CHECK (PROVIDER_TYPE IN ('JDBC','REDIS'))" }
        - { name: CK_AUTH_DOMAIN_STATE_STATUS, definition: "CHECK (STATE_CD IN ('ACTIVE','DRAINED'))" }
      indexes: []
    history_storage: { mode: not_management_history, reason: 인증 수락 설정판이며 관리 업무 전체 HIST가 아니다. 전환의 운영 근거는 기존 배포/복구 기록에 남긴다. }
    delete_policy: 영역당1행 유지. 운영 전환에서 expected epoch CAS로만 변경하며 프로세스 기동/정리 배치에서 삭제·자동 증가하지 않는다.
    rules:
      - integration 영향 G3에서 동결한 CR-036 물리 모델이다. FEAT-301.session_store_v2가 동작/운영 전환 정본이며 승인 상태는 project.state.yaml을 따른다. 실제 마이그레이션은 SLICE-308에서 새 changeset과 rollback으로 작성하고 검증한다.
      - 두 영역 모두 같은 배포 provider 설정을 쓰되 설정판/epoch·grant/인덱스는 분리한다. 활성화되지 않은 Portal API를 이 설정판 존재만으로 열지 않는다.
    sources:
      - sources/backend/core/src/main/java/com/aiagent/core/security/v2/SessionAdmissionLedger.java
      - sources/backend/api/src/main/java/com/aiagent/api/auth/v2/JdbcSessionAdmissionLedger.java
      - sources/backend/api/src/main/java/com/aiagent/api/auth/v2/SessionProviderTransition.java
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/platform/db.changelog-platform.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/platform/002-auth-session-v2.sql
  - id: ENT-268
    name: 인증 세션 수락 원장
    term: TRM-310
    domain: 인증
    module: common
    workstream: integration
    implementation: implemented
    design_stage: physical
    table: AI_AUTH_SESSION_GRANT
    features: [FEAT-301, FEAT-501]
    reqs: [REQ-501, REQ-616]
    attributes:
      - { name: GRANT_ID, physical_name: GRANT_ID, pk: true, description: SYS_SEQUENCE Long 대리키·재사용 금지·HTTP 비노출 }
      - { name: AUTH_DOMAIN, physical_name: AUTH_DOMAIN, description: ADMIN 또는 PORTAL }
      - { name: PROVIDER_TYPE, physical_name: PROVIDER_TYPE, description: 발급 시 선택 provider }
      - { name: PROVIDER_EPOCH, physical_name: PROVIDER_EPOCH, description: 현재 설정판과 비교할 전환 UUID }
      - { name: GENERATION, physical_name: GENERATION, description: grant 내 양의 현재 세대·회전 때 증가 }
      - { name: COOKIE_HASH, physical_name: COOKIE_HASH, description: domain 결합 인증 쿠키 SHA-256·원 쿠키 없음 }
      - { name: MANAGEMENT_REF, physical_name: MANAGEMENT_REF, description: 독립 난수 관리 참조·현재 세대에 결합 }
      - { name: SUBJECT_ID, physical_name: SUBJECT_ID, description: 영역 안정 ID·익명 null·SYS_USER와 Portal 자동 연결 없음 }
      - { name: AUTH_LEVEL, physical_name: AUTH_LEVEL, description: ANONYMOUS 또는 PASSWORD_CHANGE_REQUIRED 또는 AUTHENTICATED }
      - { name: STATE_CD, physical_name: STATE_CD, description: PENDING 또는 ACTIVE 또는 REVOKED }
      - { name: AUTHENTICATED_AT, physical_name: AUTHENTICATED_AT, description: 인증 시각·익명 null }
      - { name: CREATED_AT, physical_name: CREATED_AT, description: 최초 grant 생성 DB 시각 }
      - { name: LAST_ACCESS_AT, physical_name: LAST_ACCESS_AT, description: DB가 확인한 최종 수락 시각 }
      - { name: EXPIRES_AT, physical_name: EXPIRES_AT, description: DB 정본 sliding 기한 }
      - { name: PUBLISH_DEADLINE_AT, physical_name: PUBLISH_DEADLINE_AT, description: Redis PENDING 발행 활성화 기한·최대60초 }
      - { name: FIRST_USED_AT, physical_name: FIRST_USED_AT, description: 현재 쿠키의 첫 실제 보호 요청 확정 시각·미확인은 null }
      - { name: CONFIRM_DEADLINE_AT, physical_name: CONFIRM_DEADLINE_AT, description: 새 ACTIVE 세대 첫 사용 확인 기한·활성화부터60초 }
      - { name: TERMINAL_AT, physical_name: TERMINAL_AT, description: 회수/발행실패 확정 시각·보존 기준 }
      - { name: SCHEMA_VERSION, physical_name: SCHEMA_VERSION, description: 수락 원장 형식판 }
    physical:
      attributes:
        - { name: GRANT_ID, type: bigint, nullable: false, default: null }
        - { name: AUTH_DOMAIN, type: character varying(8), nullable: false, default: null }
        - { name: PROVIDER_TYPE, type: character varying(8), nullable: false, default: null }
        - { name: PROVIDER_EPOCH, type: uuid, nullable: false, default: null }
        - { name: GENERATION, type: bigint, nullable: false, default: null }
        - { name: COOKIE_HASH, type: character(64), nullable: false, default: null }
        - { name: MANAGEMENT_REF, type: character varying(43), nullable: false, default: null }
        - { name: SUBJECT_ID, type: character varying(100), nullable: true, default: null }
        - { name: AUTH_LEVEL, type: character varying(32), nullable: false, default: null }
        - { name: STATE_CD, type: character varying(16), nullable: false, default: null }
        - { name: AUTHENTICATED_AT, type: timestamp with time zone, nullable: true, default: null }
        - { name: CREATED_AT, type: timestamp with time zone, nullable: false, default: null }
        - { name: LAST_ACCESS_AT, type: timestamp with time zone, nullable: false, default: null }
        - { name: EXPIRES_AT, type: timestamp with time zone, nullable: false, default: null }
        - { name: PUBLISH_DEADLINE_AT, type: timestamp with time zone, nullable: true, default: null }
        - { name: FIRST_USED_AT, type: timestamp with time zone, nullable: true, default: null }
        - { name: CONFIRM_DEADLINE_AT, type: timestamp with time zone, nullable: true, default: null }
        - { name: TERMINAL_AT, type: timestamp with time zone, nullable: true, default: null }
        - { name: SCHEMA_VERSION, type: integer, nullable: false, default: '2' }
      constraints:
        - { name: PK_AUTH_SESSION_GRANT, definition: PRIMARY KEY (GRANT_ID) }
        - { name: FK_AUTH_SESSION_GRANT_DOMAIN, definition: FOREIGN KEY (AUTH_DOMAIN) REFERENCES AI_AUTH_DOMAIN_STATE (AUTH_DOMAIN) }
        - { name: CK_AUTH_SESSION_GRANT_GENERATION, definition: CHECK (GENERATION > 0) }
        - { name: CK_AUTH_SESSION_GRANT_STATE, definition: "CHECK (STATE_CD IN ('PENDING','ACTIVE','REVOKED'))" }
        - { name: CK_AUTH_SESSION_GRANT_PROVIDER, definition: "CHECK (PROVIDER_TYPE IN ('JDBC','REDIS'))" }
        - { name: CK_AUTH_SESSION_GRANT_LEVEL, definition: "CHECK (AUTH_LEVEL IN ('ANONYMOUS','PASSWORD_CHANGE_REQUIRED','AUTHENTICATED'))" }
      indexes:
        - { name: UX_AUTH_SESSION_COOKIE, definition: '(AUTH_DOMAIN, COOKIE_HASH)', unique: true, method: btree }
        - { name: UX_AUTH_SESSION_MANAGEMENT, definition: (MANAGEMENT_REF), unique: true, method: btree }
        - { name: IX_AUTH_SESSION_PRINCIPAL, definition: '(AUTH_DOMAIN, SUBJECT_ID, STATE_CD, EXPIRES_AT)', unique: false, method: btree }
        - { name: IX_AUTH_SESSION_EXPIRY, definition: (EXPIRES_AT), unique: false, method: btree }
        - { name: IX_AUTH_SESSION_TERMINAL, definition: (TERMINAL_AT), unique: false, method: btree }
    relations: ['AUTH_DOMAIN -> ENT-267.AUTH_DOMAIN']
    history_storage: { mode: not_management_history, reason: 인증 허용/회수의 현재 보안 근거만 저장한다. 원 비밀/payload 및 관리 업무 HIST를 복제하지 않는다. }
    delete_policy: FEAT-301.session_store_v2.ledger.retention. 행 부재는 항상 인증 거부이며 ID/관리 참조를 재사용하지 않는다.
    rules:
      - 인증/CSRF payload는 선택 store에만 저장한다. 원장·설정판은 두 provider 모두 PostgreSQL에 존재하며 Redis를 쓴다고 원천 DB 수락 검사를 생략하지 않는다.
      - grant 생성/회전/회수는 DB 행잠금과 현재 기대 세대/CAS로 보호한다. 관리 참조만으로 인증할 수 없으며 현재 권한/USER_ID/영역/세대를 서버 재검사한다.
      - 동일 grant 회전은 generation·cookie 지문·관리 참조를 함께 교체한다. PENDING은 보호 업무에 사용할 수 없고 기한 경과/폐기 후 ACTIVE로 되돌릴 수 없다.
    sources:
      - sources/backend/core/src/main/java/com/aiagent/core/security/v2/SessionAdmissionLedger.java
      - sources/backend/api/src/main/java/com/aiagent/api/auth/v2/JdbcSessionAdmissionLedger.java
      - sources/backend/api/src/main/java/com/aiagent/api/auth/v2/SessionRuntime.java
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/platform/db.changelog-platform.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/platform/002-auth-session-v2.sql
