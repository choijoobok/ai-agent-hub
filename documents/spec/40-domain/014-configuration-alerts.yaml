    rules:
      - 환경/적용 설정 버전/대상 종류/안정 키 유일성. 정상 행도 명시 저장하고 구/신 버전은 공존한다.
      - 현재 메타 갱신은 배포 제어가 선택한 세대만 수행한다. 메타 동기화와 판정/고정 비교 기준 묶음을 원자 확정하며 구 세대는 현재 메타를 옛값으로 쓰지 않는다. 각 기동은 자기 판정 묶음과 로드 검증 후 준비를 연다. 같은 지문인 다른 기동의 성공은 자기 준비를 대신하지 않는다.
      - API별 판정 사본·현재 관리 HIST 복사는 없다. 경고/사건은 ENT-094/095가 소비하며 일반 조회가 재검사/쓰기를 유발하지 않는다.
      - 진행 중 배포·실행·역사 참조가 필요한 버전을 무조건 최신 하나로 덮거나 삭제하지 않는다.
      - 판정은 추가 전용이며 현재 포인터는 최신 정상 세대 조건으로 조회한다. 미확인/로드 실패를 불일치 확정으로 처리하지 않는다. 비밀/주소 원문을 저장하지 않는다.
