          nullable: true
          default: null
        - name: COVERAGE_CD
          type: character varying(20)
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: MOD_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_CONFIG_ALERT
          definition: PRIMARY KEY (ALERT_ID)
        - name: UK_CONFIG_ALERT_1
          definition: UNIQUE (ENVIRONMENT_ID, TARGET_KIND, TARGET_KEY, CONFIG_ID)
        - name: CK_CONFIG_ALERT_1
          definition: CHECK (STATUS_CD IN ('OPEN','RECOVERED','UNKNOWN'))
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
