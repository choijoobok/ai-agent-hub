# 연결 설정 진단의 논리 초안 — 제품 구현/물리명은 G3 후속
entities:
  - id: ENT-094
    name: "현재 연결 설정 경고"
    term: TRM-286
    domain: "운영 진단"
    module: "admin"
    design_stage: "logical"
    implementation: "planned"
    features: [FEAT-001, FEAT-002]
    reqs: [REQ-601, REQ-604, REQ-603]
    attributes:
      - name: "원인 경고 식별자"
        key: "alertId"
        pk: true
      - name: "환경·원인 시스템/연결·설정 세대 키"
        key: "causeKey"
      - name: "현재 경고 상태"
        key: "status"
        description: "OPEN/RECOVERED/UNKNOWN; 다중 상태"
      - name: "최초 발견/최근 확인/복구 시각"
        key: "observationTimes"
      - name: "권한/범위가 적용된 참조 영향 건수와 점검 범위"
        key: "impactSummary"
        description: "미지원/실패는null·확인필요; 0정상과구분"
      - name: "등록자·등록일시·수정자·수정일시"
        key: "audit"
    rules: ["REQ-601.configuration_alerts가 원인 묶음/해소·표시의 정본이다. 자동 진단은 수동 자산 사용 값을 수정하지 않는다.", "현재 집계는 갱신되므로 감사4. 실제 세대/원인키 유일성·낡은 점검 덮어쓰기 방지와 동기화 뒤 사건 저장의 원자/재처리 경계는 G3에서 물리화한다.", "TARGET_SYSTEM/TARGET_CONNECTION/DATA_SOURCE 종류와 안정 대상 키·설정 세대로 원인을 구분한다. 데이터소스 경고는 URL/계정 대신 정확 DS키와 허용 카탈로그 영향만 표시한다."]
    deployment_scope: "REQ-601.configuration_alerts.deployment_scope. 버전별 원인 상태를 보존하고 현재 허용 배포 집합만 현역 집계한다. 다른 버전 복구/구 버전 적용 종료를 해당 버전의 실제 복구로 덮지 않는다."
    pending: ["@defer G3 전 — 용어/업무 영역을 기반으로 물리명·타입·유일성/인덱스·동기화 및 진단 사건 일관성 경계를 확정한다."]
  - id: ENT-095
    name: "연결 설정 경고 사건"
    term: TRM-287
    domain: "운영 진단"
    module: "admin"
    design_stage: "logical"
    implementation: "planned"
    features: [FEAT-001, FEAT-002]
    reqs: [REQ-601, REQ-603]
    attributes:
      - name: "사건 식별자"
        key: "eventId"
        pk: true
      - name: "원인 경고 참조"
        key: "alertId"
      - name: "사건 유형·설정 세대·비밀 없는 검사 근거"
        key: "eventEvidence"
        description: "발생/실제 복구/확인 불가와 배포 허용 종료를 구분한다. 새 버전 복구는 같은 안정 대상의 이전 원인 참조를 남기며 구 버전의 OPEN 근거는 보존한다."
      - name: "등록자·등록일시"
        key: "audit"
        description: "추가 전용 기록; 이미 기록된 사건을 수정하지 않음"
    relations:
      - entity: ENT-094
        cardinality: "원인 경고별 사건0개이상"
        description: "발생/해소/확인불가 전이를 추가 기록한다."
    rules: ["실패한 조회를 복구 사건으로 기록하지 않는다. 동일 원인/세대/전이의 중복 감지를 새 사건으로 무제한 누적하지 않는다.", "TARGET_SYSTEM/TARGET_CONNECTION/DATA_SOURCE 종류와 안정 대상 키·설정 세대로 원인을 구분한다. 데이터소스 경고는 URL/계정 대신 정확 DS키와 허용 카탈로그 영향만 표시한다."]
    pending: ["@defer G3 전 — 현재 경고와 사건의 일관성·중복 방지·재처리/보존 물리를 정한다."]
  - id: ENT-098
    name: "연결 설정 판정"
    term: TRM-290
    domain: "운영 진단"
    module: "admin"
    design_stage: "logical"
    implementation: "planned"
    features: [FEAT-001, FEAT-002]
    reqs: [REQ-601, REQ-603, REQ-604, REQ-608]
    attributes:
      - { name: "판정 식별자", key: "diagnosisId", pk: true }
      - { name: "환경 식별자", key: "environmentId" }
      - { name: "적용 설정 버전", key: "appliedSettingsId", description: "비밀 제외 정규 지문. 전체 배포/자격증명/기동 식별자가 아님" }
      - { name: "대상 종류", key: "targetKind", description: "TARGET_SYSTEM/TARGET_CONNECTION/DATA_SOURCE" }
      - { name: "안정 대상 키", key: "targetKey", description: "시스템 키, 시스템+연결 키, 데이터소스 키를 종류별로 정확하게 구분" }
      - { name: "판정 상태", key: "configurationMismatch", description: "false=일치, true=불일치, null=확인 필요. 행 없음은 정상 아님" }
      - { name: "안전한 판정 사유", key: "mismatchReason", description: "비밀/원문 주소 없이 누락·소속 오류·검증 불가를 설명" }
      - { name: "고정 비교 기준", key: "comparisonBasis", description: "판정 당시 YAML 소유 DB 메타의 필요한 비밀 없는 값/근거 버전. 현재 메타가 새 세대로 바뀌어도 구 판정의 근거는 불변이며 주소/비밀 정의 사본은 없음" }
      - { name: "검사 시각", key: "checkedAt" }
      - { name: "비교 규칙 버전", key: "comparisonRuleVersion", description: "허용 속성·변환·정규화/검사 정책이 바뀌면 변경" }
      - { name: "서버 기록 감사", key: "audit", description: "신뢰 동기화의 최초/최종 기록 근거. 관리자가 편집하지 않음" }
    relations:
      - { entity: ENT-001, cardinality: "대상 시스템별 적용 설정 버전당 판정 하나", description: "시스템 자체 정의 판정. 자식 집계와 구분" }
      - { entity: ENT-017, cardinality: "시스템 연결별 적용 설정 버전당 판정 하나", description: "부모 정의 누락 포함, 다른 자식 오류 전파 금지" }
      - { entity: ENT-002, cardinality: "데이터소스별 적용 설정 버전당 판정 하나", description: "해당 데이터소스의 하위 SQL 사용 차단 근거" }
    rules_from: ["REQ-601.configuration_diagnosis", ADR-040]
    rules: ["환경/적용 설정 버전/대상 종류/안정 키 유일성. 정상 행도 명시 저장하고 구/신 버전은 공존한다.", "현재 메타 갱신은 배포 제어가 선택한 세대만 수행한다. 메타 동기화와 판정/고정 비교 기준 묶음을 원자 확정하며 구 세대는 현재 메타를 옛값으로 쓰지 않는다. 각 기동은 자기 판정 묶음과 로드 검증 후 준비를 연다. 같은 지문인 다른 기동의 성공은 자기 준비를 대신하지 않는다.", "API별 판정 사본·현재 관리 HIST 복사는 없다. 경고/사건은 ENT-094/095가 소비하며 일반 조회가 재검사/쓰기를 유발하지 않는다.", "진행 중 배포·실행·역사 참조가 필요한 버전을 무조건 최신 하나로 덮거나 삭제하지 않는다."]
    pending: ["@defer G3 전 — 허용 속성/물리 컬럼별 비교표·물리 키/타입/인덱스와 동기화 일관성, 기동 준비·배포 버전 선택·보존 경계를 확정한다. 제품 테이블/서비스는 아직 없다."]
