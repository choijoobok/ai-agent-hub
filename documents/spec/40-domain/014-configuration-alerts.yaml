      - REQ-601.configuration_alerts가 원인 묶음/해소·표시의 정본이다. 자동 진단은 수동 자산 사용 값을 수정하지 않는다.
      - 현재 집계는 갱신되므로 감사4. 실제 세대/원인키 유일성·낡은 점검 덮어쓰기 방지와 동기화 뒤 사건 저장의 원자/재처리 경계는 G3에서 물리화한다.
      - TARGET_SYSTEM/TARGET_CONNECTION/DATA_SOURCE 종류와 안정 대상 키·설정 세대로 원인을 구분한다. 데이터소스 경고는 URL/계정 대신 정확 DS키와 허용 카탈로그 영향만 표시한다.
      - 영향 건수는 요청자 현재 권한을 적용한 조회 투영이며 저장한 전역 건수를 그대로 반환하지 않는다.
