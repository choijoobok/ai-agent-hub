entities:
  - id: ENT-167
    name: 도구 필드 안정 식별
    term: TRM-273
    domain: 연동 자산
    module: admin
    implementation: planned
    design_stage: physical
    features:
      - FEAT-021
    reqs:
      - REQ-612
    attributes:
      - name: 도구 안의 안정 필드 식별자
        physical_name: FIELD_ID
        pk: true
        description: API 안의 안정 필드 식별자
      - name: 소유 안정 도구
        physical_name: TOOL_ID
        description: 소유 안정 도구
      - name: 최초 작성 주체
        physical_name: REG_ID
        description: 최초 작성 주체
      - name: 최초 작성 시각
        physical_name: REG_DTM
        description: 최초 작성 시각
    rules:
      - 같은 TOOL_ID 소유 필드·값·참조만 바인딩한다. 호출 위치는 INPUT/RESPONSE이며 HTTP PATH/QUERY/HEADER를 사용하지 않는다. 다형 참조는 종류별 정확 판을 서버 검사한다.
    delete_policy: 고정 내용/과거 판은 불변이며 현재 쓰기 API로 제거하지 않는다. 점유는 FEAT-021의 명시 해제 조건에서만 제거하고 편집 결과는 보존 경계를 따른다
    table: AI_ADMIN_TOOL_FIELD_ID
    physical:
      attributes:
        - name: FIELD_ID
          type: bigint
          nullable: false
          default: null
        - name: TOOL_ID
          type: bigint
          nullable: false
          default: null
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_TOOL_FIELD_ID_1
          definition: PRIMARY KEY (FIELD_ID)
        - name: FK_TOOL_FIELD_ID_2
          definition: FOREIGN KEY (TOOL_ID) REFERENCES AI_ADMIN_BUSINESS_TOOL (TOOL_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
    history_storage:
      mode: not_management_history
    relations:
      - entity: ENT-015
        cardinality: N:1
        description: TOOL_ID → TOOL_ID; DB RESTRICT 참조
