        - name: CK_CALL_OBSERVATION_PHASE
          definition: CHECK (OBSERVATION_PHASE IN ('START','STREAM','TERMINAL','POST_TERMINAL','RESUME','UNKNOWN'))
        - name: CK_CALL_OBSERVATION_ATTRIBUTION
          definition: CHECK (ATTRIBUTION_STATE IN ('VERIFIED','UNVERIFIED'))
        - name: CK_CALL_OBSERVATION_FINAL
          definition: CHECK (FINAL_YN IS DISTINCT FROM 'Y' OR (USAGE_SOURCE = 'PROVIDER' AND ATTRIBUTION_STATE = 'VERIFIED') IS TRUE)
