      constraints:
        - name: PK_MODEL_CALL
          definition: PRIMARY KEY (CALL_RECORD_ID)
        - name: UK_MODEL_CALL_1
          definition: UNIQUE (CALL_KEY)
        - name: UK_MODEL_CALL_2
          definition: UNIQUE (OWNER_DOMAIN, OWNER_KIND, OWNER_REF, ATTEMPT_ORDINAL)
        - name: UK_MODEL_CALL_3
          definition: UNIQUE (PERMIT_REF)
        - name: CK_MODEL_CALL_1
          definition: CHECK (ATTEMPT_ORDINAL > 0 AND VERSION > 0)
        - name: CK_MODEL_CALL_2
          definition: CHECK (QUOTA_SCOPE IN ('PORTAL','OPERATIONS'))
        - name: CK_MODEL_CALL_DISPATCH
          definition: CHECK (DISPATCH_STATE IN ('ADMITTED','UNKNOWN','NOT_SENT','ACCEPTED'))
        - name: CK_MODEL_CALL_RESPONSE
          definition: CHECK (RESPONSE_STATE IN ('NONE','PARTIAL','COMPLETED','FAILED','UNKNOWN'))
        - name: CK_MODEL_CALL_CANCEL
          definition: CHECK (CANCEL_STATE IN ('NONE','REQUESTED','ACKNOWLEDGED','CONFIRMED','UNKNOWN'))
        - name: CK_MODEL_CALL_RECORD
          definition: CHECK (RECORD_STATE IN ('READY','RECOVERY_REQUIRED','RECONCILED'))
        - name: CK_MODEL_CALL_TURN
          definition: CHECK (OWNER_KIND <> 'TURN_WORK' OR (TURN_ID IS NOT NULL AND TURN_ATTEMPT_REF IS NOT NULL AND TURN_REVISION IS NOT NULL AND EXECUTION_FENCE IS NOT NULL))
        - name: CK_MODEL_CALL_OWNER_SCOPE
          definition: CHECK ((ACTOR_DOMAIN = 'PORTAL' AND OWNER_DOMAIN = 'AGENT' AND OWNER_KIND IN ('TURN_WORK','EMBEDDING_TASK') AND QUOTA_SCOPE = 'PORTAL' AND TURN_ID IS NOT NULL AND ALLOCATION_ID IS NOT NULL) OR (ACTOR_DOMAIN = 'ADMIN' AND OWNER_DOMAIN = 'ADMIN' AND OWNER_KIND IN ('ADMIN_OPERATION','EMBEDDING_TASK') AND QUOTA_SCOPE = 'OPERATIONS' AND TURN_ID IS NULL AND ALLOCATION_ID IS NULL) OR (ACTOR_DOMAIN = 'SERVER' AND OWNER_DOMAIN = 'ADMIN' AND OWNER_KIND = 'EMBEDDING_TASK' AND QUOTA_SCOPE = 'OPERATIONS' AND TURN_ID IS NULL AND ALLOCATION_ID IS NULL))
        - name: CK_MODEL_CALL_FENCE
          definition: CHECK ((TURN_ID IS NULL AND TURN_ATTEMPT_REF IS NULL AND TURN_REVISION IS NULL AND EXECUTION_FENCE IS NULL) OR (TURN_ID IS NOT NULL AND TURN_ATTEMPT_REF IS NOT NULL AND TURN_REVISION IS NOT NULL AND EXECUTION_FENCE IS NOT NULL AND TURN_REVISION >= 0 AND EXECUTION_FENCE > 0))
      indexes: []
    identifier_generation: 내부 단일 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 공개 UUID는 별도 유일 키이며 BIGINT wire는 십진 문자열이다.
    history_storage:
      mode: not_management_history
      reason: 요구 기반 불변 관측/계량 또는 해당 소유 투영·수신 보조 기록. 관리 HIST를 복제하지 않는다.
    delete_policy: 소유 보존/참조 종료 계약의 원자 파기만 허용. 일반 CRUD·CASCADE 삭제 금지. 기간 미설정 시 자동 파기 비활성.
    rules:
      - 전송 전 고정 설정/입력·현재 통제 참조·단일 permit와 같은 트랜잭션에 기록한다. DB 접수와 외부 송신 사이 UNKNOWN을 삭제/자동 재송으로 없애지 않는다.
      - MODEL_STEP_REF는 실제 추론 실행 시작을 관측한 뒤 소유 스텝에 연결한다. 모든 호출/임베딩을 미리 LLM 스텝으로 세지 않는다.
      - 턴 식별은 소유 서버가 검증한다. 초기 ADMIN_OPERATION은 TURN_ID를 만들지 않는다. Portal 턴 원장/점유가 미구현이면 실제 Portal 전송을 닫는다.
      - 최소 저장 구조가 agent 전체 턴/시도/리스·쿼터 상태 모델을 대신하지 않는다. 사용된 정확 설정 판은 FEAT-040의 참조 보호를 같은 접수 트랜잭션에서 등록한다.
      - actor/owner/quotaScope의 허용 조합을 DB CHECK와 서버 admission 양쪽에서 검사한다. Portal 작업을OPERATIONS/ADMIN_OPERATION으로 보내는 입력은 거부한다. SERVER는 등록된 admin 지식 임베딩 작업만이며 사용자 요청의 운영용 플래그로 지정하지 않는다. 월은 모든 호출의 고정 업무 시간대로 산출한다.
    sources: []
