        - name: CK_CALL_OBSERVATION_1
          definition: CHECK (KIND_CD IN ('DISPATCH','RESPONSE','CANCEL','USAGE','RECORD_FAILURE','RECOVERY'))
        - name: FK_CALL_OBSERVATION_CALL_RECORD_ID
          definition: FOREIGN KEY (CALL_RECORD_ID) REFERENCES AI_AGENT_MODEL_CALL (CALL_RECORD_ID) ON DELETE RESTRICT
        - name: CK_CALL_OBSERVATION_USAGE_META
          definition: CHECK ((KIND_CD = 'USAGE' AND USAGE_SCOPE IS NOT NULL AND COUNTER_SEMANTICS IS NOT NULL AND OBSERVATION_PHASE IS NOT NULL AND ATTRIBUTION_STATE IS NOT NULL) OR (KIND_CD <> 'USAGE' AND USAGE_SCOPE IS NULL AND COUNTER_SEMANTICS IS NULL AND OBSERVATION_PHASE IS NULL AND ATTRIBUTION_STATE IS NULL))
        - name: CK_CALL_OBSERVATION_USAGE_SCOPE
          definition: CHECK (USAGE_SCOPE IN ('CALL','TURN','THREAD','SESSION','ACCOUNT','UNKNOWN'))
        - name: CK_CALL_OBSERVATION_COUNTER
