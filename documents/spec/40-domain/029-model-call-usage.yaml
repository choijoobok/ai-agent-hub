      - 월중/늦은 정정은 새 스냅샷에서만 보인다. 기존 admin 월 단가 실적 사본의 근거를 소급 바꾸지 않는다. UNKNOWN/지원 불명/필수 기록 불명 호출을 제외한 부분합을 COMPLETE로 반환하지 않는다.
