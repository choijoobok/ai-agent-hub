    rules:
      - append-only. 같은 call/key/내용만 재수락하며 다르면409이다. 검증 시각/수신 시각은 공급 사건 지문에 섞지 않는다.
      - 원 응답/추론/청크/헤더를 보관하는 테이블이 아니다. 사용량 원천 항목은 ENT-260에만 저장한다. 늦은 관측은 기존 호출에만 추가하며 현재 턴을 되살리지 않는다.
      - 사용량 귀속·원천 범위·누적 의미·관측 경로는 FEAT-211.minimal_producer.attribution을 따른다. 원천이 보고한 실행 참조는 PROVIDER_REQUEST_REF에 보존하고 수신 turnId만으로 검증됨을 만들지 않는다. 네 메타 필드를 관측 지문에 포함한다. UNVERIFIED의 수신 숫자는 원 관측 항목으로만 보존하며 head/ledger/쿼터 선택 대상이 아니다.
