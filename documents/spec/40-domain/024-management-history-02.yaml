        description: 등록 관리자
        pk: false
      - name: 등록 시각
        physical_name: REG_DTM
        description: 등록 시각
        pk: false
      - name: 수정 관리자
        physical_name: MOD_ID
        description: 수정 관리자
        pk: false
      - name: 수정 시각
        physical_name: MOD_DTM
        description: 수정 시각
        pk: false
      - name: 이력 행 식별자
        physical_name: HIST_ID
        pk: true
        description: 이력 행 식별자
      - name: 전체 이력 세트 번호
        physical_name: HISTORY_NO
