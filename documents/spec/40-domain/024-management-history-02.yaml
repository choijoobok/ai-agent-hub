          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_USER_IDENTITY_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_USER_IDENTITY_HIST_SET
          definition: UNIQUE (HISTORY_NO, PORTAL_USER_ID, TARGET_KIND, TARGET_ID)
        - name: FK_USER_IDENTITY_HIST_PARENT
          definition: FOREIGN KEY (HISTORY_NO, PORTAL_USER_ID) REFERENCES AI_ADMIN_PORTAL_USER_HIST (HISTORY_NO, PORTAL_USER_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_USER_IDENTITY_HIST_LOOKUP
          unique: false
          method: btree
          definition: CREATE INDEX IX_USER_IDENTITY_HIST_LOOKUP ON AI_ADMIN_USER_IDENTITY_HIST (PORTAL_USER_ID, TARGET_KIND, TARGET_ID, HISTORY_NO)
    history_storage:
      mode: immutable_snapshot
      source: ENT-104
      root_history: ENT-201
    delete_policy: 현재값·보호 참조가 없는 보존 종료 전체 세트만 소유 파기 명령으로 자식→루트 순서 삭제한다. 현재 테이블 FK/cascade 없음. ADR-044의 원 명령 종료키 등록과 원장 파기를 원자 처리한다.
    rules:
      - 원본의 모든 소유 열을 타입/null까지 동형 복사한다. 이력 PK는 HIST_ID이며 원본 PK는 일반 원값이다.
      - 신규/변경은 반영 후 전체, 삭제는 직전 전체와 새 RESULT_REVISION/DELETE 사건을 보존한다. 정확 성공 판 조회는 DELETE를 제외한다.
      - HISTORY_NO는 루트와 모든 자식에 동일하다. 자식은 HISTORY_NO+소유 부모 키의 복합 FK로 같은 세트의 소속까지 보장한다. HIST_DTM은 루트만 소유하고 자식 조회는 부모 체인을 통해 루트를 조인한다.
      - 원 REG/MOD 값은 원본 시점 그대로 보존한다. 보호 등록과 파기는 같은 세트 잠금이며 부분 누락을 현재값으로 메우지 않는다.
    relations:
      - entity: ENT-201
        cardinality: N:1
        description: HISTORY_NO → HISTORY_NO; DB RESTRICT 참조
    history_copy_of: ENT-104
    history_parent: ENT-201
    storage_role: history
