entities:
  - id: ENT-171
    name: 파기 완료 월 최종배정 종결
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_QUOTA_FINAL_GUARD
    features:
      - FEAT-045
    reqs:
      - REQ-116
      - REQ-118
    term: TRM-195
    domain: 쿼터 운영
    attributes:
      - name: 최종 처리 월
        physical_name: TARGET_MONTH
        pk: true
        description: 최종 처리 월
      - name: 종결 표시
        physical_name: TERMINAL_CD
        description: 종결 표시
    physical:
      attributes:
        - name: TARGET_MONTH
          type: character(7)
          nullable: false
          default: null
        - name: TERMINAL_CD
          type: character varying(16)
          nullable: false
          default: null
      constraints:
        - name: PK_QUOTA_FINAL_GUARD
          definition: PRIMARY KEY (TARGET_MONTH)
        - name: CK_QUOTA_FINAL_GUARD_1
          definition: CHECK (TERMINAL_CD='FINALIZED')
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    rules:
      - 월 파기 전에 같은 월 잠금으로 등록하고 입력/결과 전체 파기와 원자 반영한다. 개인정보·실행 키/시각·금액/등급은 보존하지 않는다. 월 최종 진입은 현재 RUN과 이 표를 먼저 확인한다. 이미 종결된 월은 재배정/자동 신규 실행하지 않는다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources: []
    history_storage:
      mode: not_management_history
    delete_policy: conventions.foundation_physical.deletion 및 소유 요구의 참조 보호를 따른다. 불변 업무/관측 기록은 보존 종료·소비 보호 해제 후 별도 파기하며 관리 화면에서 일반 삭제하지 않는다.
    relations: []
