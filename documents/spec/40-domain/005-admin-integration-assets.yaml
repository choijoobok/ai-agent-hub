# 영역: admin 연동 자산 — 대상 시스템 구현, 데이터소스 후속 설계
entities:
  - id: ENT-001
    configuration_cleanup: REQ-601.configuration_cleanup. 낡은 세대 재기동의 부활 금지, 새 유효 배포에서 같은 의미 키 재등장은 새 내부 ID로 등록하며 과거 권한/참조를 복원하지 않는다.
    name: 대상 시스템
    term: TRM-040
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    table: AI_ADMIN_TARGET_SYSTEM
    features:
      - FEAT-001
    reqs:
      - REQ-601
      - REQ-604
    description: YAML의 안정 시스템 키/비밀 없는 기본 표시 메타와 관리자 이름/설명 재정의. API 접속 및 Portal 대상 계정 매핑의 시스템 기준이다. 기술 연결 정의/비밀은 소유하지 않는다.
    attributes:
      - name: 대상 시스템 식별자
        physical_name: TARGET_SYSTEM_ID
        pk: true
        description: Hub가 부여하고 재사용하지 않는 안정 식별자. 표시명·연결명이 바뀌어도 유지한다
      - name: 시스템명
        physical_name: SYSTEM_NM
        description: 관리자 시스템명 재정의. null은 YAML 이름/식별자 표시를 사용한다.
      - name: 설명
        physical_name: DESCRIPTION
        description: 관리자 설명 재정의. null은 YAML 기본, 빈 문자열은 명시 공란이다.
      - name: 현재 관리 버전
        physical_name: MANAGEMENT_VERSION
        description: 정의·허용 집합·기본값의 편집 기준과 저장 충돌을 대조하는 버전. 배포 적용 설정 식별자와 별개다
      - name: 생성 주체
        physical_name: REG_ID
        description: 현재 주체 종류가 관리자면 인증 관리자 ID, 설정 동기화면 null이며 SOURCE_CD로 기술 작업을 구분한다. 사람 계정을 꾸며내지 않는다.
      - name: 생성 시각
        physical_name: REG_DTM
        description: 최초 등록이 반영된 시각. 후속 변경 뒤에도 유지한다
      - name: 최종 변경 주체
        physical_name: MOD_ID
        description: 현재 주체 종류가 관리자면 인증 관리자 ID, 설정 동기화면 null이며 SOURCE_CD로 기술 작업을 구분한다. 사람 계정을 꾸며내지 않는다.
      - name: 최종 변경 시각
        physical_name: MOD_DTM
        description: 현재 관리 버전이 반영된 시각. 최초 등록에서는 생성 시각과 같다
      - name: 변경 사유
        physical_name: CHANGE_REASON
        description: 현재 관리 버전을 만든 등록/변경의 업무 사유
      - name: 변경 작업 참조
        physical_name: COMMAND_KEY
        description: 현재 관리 버전을 만든 실제 작업·처리 결과를 연결하는 근거. 표시 시각만으로 동일 작업을 추정하지 않는다
      - name: YAML 시스템 안정 키
        physical_name: SYSTEM_KEY
        description: YAML 정의의 불변·재사용 금지 키. 내부 PK와 구분
      - name: YAML 기본 시스템명
        physical_name: YAML_SYSTEM_NM
        description: 관리자 재정의와 별도 저장하는 비밀 없는 기본 이름
      - name: YAML 기본 설명
        physical_name: YAML_DESCRIPTION
        description: 비밀 없는 기본 설명
      - name: 마지막 정상 확인 설정 세대
        physical_name: SYNC_CONFIG_ID
        description: 현재 활성 세대와 정확 존재를 대조한다. 미제공/로드 실패를 제거로 확정하지 않음
      - name: 최초 등록 주체 종류
        physical_name: REG_SOURCE_CD
        description: CONFIG_SYNC/ADMIN 구분
      - name: 최종 수정 주체 종류
        physical_name: MOD_SOURCE_CD
        description: CONFIG_SYNC/ADMIN 구분
      - name: 수락 시각
        physical_name: ACCEPTED_DTM
        description: 수락 시각
    relations:
      - entity: ENT-017
        cardinality: 시스템마다 허용 연결 0개 이상
        description: YAML이 소유한 연결 키/메타와 관리자 표시 재정의. 제거 행은 보존한다.
      - entity: ENT-019
        cardinality: 성공 변경마다 처리 근거 하나
        description: 최종 명령 참조와 결과를 연결한다
      - entity: ENT-003
        cardinality: 현재 대상 하나에서 반영 후 이력 0개 이상
        description: 원 식별자와 변경 버전/순서로 연결한다. 삭제 후 이력이 현재 행의 존재에 의존하지 않게 한다
    related_features:
      - FEAT-004
      - FEAT-005
    external_observations: 연결 정의의 현재 로드 여부·불변 적용 설정 식별자·노드/확인 시점·조회 실패는 ARCH-028의 공개 관측으로 받는다. 이 엔티티의 편집 가능한 정상 상태로 저장하거나 배포 정의 사본으로 만들지 않는다
    rules:
      - REQ-604.authority·synchronization에 따라 YAML 기술 메타와 관리자 보완을 필드별로 분리한다. 일반 UI 신규/삭제·기본 연결·수동 시스템 사용 상태는 없다.
      - 명시 정리 전까지 성공한 전체 설정에서 제거된 키도 현재 행과 참조를 보존하고 불일치/실행 차단·경고로 연결한다.
      - 실제 비밀 없는 변경과 관리자 재정의만 관리 버전/이력을 갱신한다. 단순 재기동 관측은 최초/수정 감사를 덮지 않는다.
    configuration_diagnosis: 적용 설정 버전별 저장 판정은 ENT-098을 참조한다. 수동 편집/현재 자산 HIST 값으로 복제하지 않는다.
    state_machine:
      configuration: REQ-601.configuration_diagnosis에 따라 ENT-098에 저장한 적용 설정 버전별 정확 ID/소속 판정. 보존 행은 제거되지 않으며 관리자 입력 상태로 위조하지 않는다.
      availability: 개별 API의 명시 연결 및 REQ-601.asset_availability와 현재 호출자 검사로 판정한다.
    audit: 반영 후 전체 구성은 ENT-003, 현재 생성/최종 변경 근거는 본 엔티티에 연결한다
    delete_policy: REQ-601.configuration_cleanup. 현재 정확 누락·미참조·배포 안전성을 확인한 명시 일괄 정리만 허용한다. 소유 현재 자식만 제거하고 이력/명령/판정/경고/실행 근거와 외부 참조 자산은 보존한다. 연결만 제거하면 부모는 존속한다.
    rules_from:
      - REQ-604
      - REQ-601.business_rules
      - ARCH-028.api_connection_resolution
      - UC-015
    storage_contract: REQ-604.synchronization과 FEAT-001의 기존 대상 표시 보완 저장. 동기화는 전체 검증된 설정에서 메타만 갱신하고 관리자 재정의는 보존한다. 구성 제거 행은 보존한다. SLICE-001에서 구현했으며 CONFIG_SYNC와 ADMIN 출처·nullable 관리자 참조를 구분한다.
    physical:
      attributes:
        - name: TARGET_SYSTEM_ID
          type: bigint
          nullable: false
          default: null
        - name: SYSTEM_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: MANAGEMENT_VERSION
          type: bigint
          nullable: false
          default: '1'
        - name: REG_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: REG_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: MOD_ID
          type: character varying(50)
          nullable: true
          default: null
        - name: MOD_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: CHANGE_REASON
          type: text
          nullable: false
          default: null
        - name: COMMAND_KEY
          type: character(36)
          nullable: true
          default: null
        - name: SYSTEM_KEY
          type: character varying(100)
          nullable: false
          default: null
        - name: YAML_SYSTEM_NM
          type: character varying(100)
          nullable: true
          default: null
        - name: YAML_DESCRIPTION
          type: text
          nullable: true
          default: null
        - name: SYNC_CONFIG_ID
          type: character varying(100)
          nullable: true
          default: null
        - name: REG_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: MOD_SOURCE_CD
          type: character varying(30)
          nullable: false
          default: null
        - name: ACCEPTED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_TARGET_SYSTEM
          definition: PRIMARY KEY (TARGET_SYSTEM_ID)
        - name: UK_TARGET_SYSTEM_1
          definition: UNIQUE (SYSTEM_KEY)
      indexes: []
    identifier_generation: 단일 내부 대리 BIGINT PK는 SYS_SEQUENCE/JPA TABLE. 자연/복합 키·UUID는 발급 대상이 아니다. BIGINT는 API 십진 문자열이다.
    physical_validation: 형식·열거값·필수 조건·금액 유한성·현재 권한/참조는 소유 API와 함께 검증한다. DB 제약은 그 검증을 대신하지 않는다. 제품 Liquibase는 소유 G3 뒤 작성한다.
    sources:
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/018-target-system.sql
      - sources/backend/bootstrap/src/main/resources/db/changelog/modules/admin/db.changelog-admin.yaml
      - sources/backend/bootstrap/src/main/resources/db/changelog/db.changelog-master.yaml
    history_storage:
      mode: full_owned_snapshot
      parent: root
      entity: ENT-003
      root: ENT-001
    copy_mapping:
      history: ENT-003
    revision_column: MANAGEMENT_VERSION
  - id: ENT-002
    configuration_cleanup: REQ-601.configuration_cleanup. 낡은 세대 재기동의 부활 금지, 새 유효 배포에서 같은 의미 키 재등장은 새 내부 ID로 등록하며 과거 권한/참조를 복원하지 않는다.
    name: 데이터소스
    term: TRM-041
    domain: 연동 자산
    module: admin
    implementation: implemented
    design_stage: physical
    features:
      - FEAT-002
    reqs:
      - REQ-601
      - REQ-603
    description: YAML 외부 데이터소스의 안정 참조와 수동 업무 메타. Hub 자체 DB는 등록하지 않는다.
    attributes:
      - name: 데이터소스 식별자
        physical_name: DATA_SOURCE_ID
        pk: true
        description: 자산·신원·정책이 참조하는 안정된 Hub 식별자. 배포 ID 정정으로 바꾸지 않는다
      - name: 별칭
        physical_name: ALIAS_NM
        description: 관리 화면과 모델 문맥의 수정 가능한 유일 표시명. REQ-603.alias_identity와 50-api의 FEAT-002.alias_contract에 따라 비교한다; YAML 별칭/지원 JDBC URL에서 동기화하는 읽기 전용 기술 메타
      - name: 설명
        physical_name: DESCRIPTION
        description: 조회 대상 업무 범위와 선택에 필요한 설명
      - name: DBMS 종류
        physical_name: DBMS_CD
        description: 질의 해석·파서 선택의 기술 기준; YAML 별칭/지원 JDBC URL에서 동기화하는 읽기 전용 기술 메타
      - name: DBMS 버전
        physical_name: DBMS_VERSION
        description: 제품의 실제 버전 문자열. LLM 문맥과 연결 대조에 사용하며 관리 편집 버전/자료형 목록 분류 키와 구분한다
      - name: DW 동기화 방식 메모
        physical_name: DW_SYNC_MEMO
        description: REQ-603.dw_sync_note의 선택 참고 메모. 논리 필드 syncMethodNote, 물리 매핑은 후속. DW에서 편집하고 DB 전환 시에도 보존한다. 실행/스케줄/최신성 판정에 사용하지 않는다
      - name: 운영 DB·DW 유형
        physical_name: SOURCE_TYPE_CD
        description: 조회 원천의 업무 유형. 실제 연결 주소나 접속 권한을 대신하지 않는다
      - name: 시각 체계
        physical_name: TIME_ZONE_ID
        description: 조회 원천 시각을 해석하는 업무 메타데이터. Hub 감사 시각이나 브라우저 시간대와 구분한다
      - name: 데이터 기준 시각 정보
        physical_name: DATA_BASIS
        description: 조회 결과의 원천 기준 시각을 설명하는 관리 정보. 실제 갱신/최신성의 관측 결과를 꾸며 저장하지 않는다
      - name: 현재 관리 버전
        physical_name: MANAGEMENT_VERSION
        description: 메타데이터·배포 참조·그룹 집합의 편집 기준 버전. 배포 세대·권한/캐시 버전과 별개다
      - name: 생성 주체
        physical_name: REG_ID
        description: 최초 등록을 처리한 system 관리자 계정 참조. 후속 변경자가 덮어쓰지 않는다
      - name: 생성 시각
        physical_name: REG_DTM
        description: 최초 등록이 반영된 시각. 후속 변경 뒤에도 유지한다
      - name: 최종 변경 주체
        physical_name: MOD_ID
        description: 현재 관리 버전을 실제 반영한 system 관리자 계정 참조. 최초 등록에서는 생성 주체와 같다
      - name: 최종 변경 시각
        physical_name: MOD_DTM
        description: 현재 관리 버전이 반영된 시각. 최초 등록에서는 생성 시각과 같다
      - name: 변경 사유
        physical_name: CHANGE_REASON
        description: 현재 관리 버전을 만든 등록/변경의 업무 사유
      - name: 변경 작업 참조
        physical_name: COMMAND_KEY
        description: 현재 관리 버전을 만든 실제 작업·처리 결과를 연결하는 근거
      - name: 안정 YAML 데이터소스 키
        physical_name: DATA_SOURCE_KEY
        description: app.external-datasources의 고정 키. 내부 안정 ID와 1:1, 별칭 변경으로 참조 교체하지 않음
      - name: 동기화 설정 세대
        physical_name: SYNC_CONFIG_ID
        description: 검증 성공한 YAML 동기화 근거. 비밀 해시/원문 저장 아님
      - name: 등록 주체 종류
        physical_name: REG_SOURCE_CD
        description: 기동 동기화/관리자 영역의 실제 기록 주체 구분
      - name: 변경 주체 종류
        physical_name: MOD_SOURCE_CD
        description: YAML 기술 메타 동기화와 수동 업무 보완 구분
      - name: 수락 시각
        physical_name: ACCEPTED_DTM
        description: 수락 시각
    relations:
      - entity: ENT-018
        cardinality: 데이터소스마다 적용 가능 그룹 0개 이상
        description: 전체 집합 교체와 하위 매핑 보호를 같은 변경에서 검사한다
      - entity: ENT-019
        cardinality: 성공 변경마다 처리 근거 하나
        description: 생성과 수정·삭제의 재수신 결과를 연결한다
      - entity: ENT-004
        cardinality: 현재 대상 하나에서 반영 후 이력 0개 이상
        description: 원 식별자와 변경 버전/순서로 연결하며 허용 삭제 뒤에도 과거 구성을 조회할 수 있다
    related_features:
      - FEAT-003
      - FEAT-005
      - FEAT-006
      - FEAT-007
      - FEAT-014
      - FEAT-023
    external_observations:
      - REQ-601.configuration_diagnosis의 ENT-098 저장 판정과 현재 node/boot 준비·안전한 연결 관측을 분리한다. 판정은 기동 때 저장하고 일반 조회는 재대조하지 않는다. 누락/로드 실패를 이전 연결로 대체하지 않는다.
    rules:
      - REQ-603.yaml_authority·data_query_guides를 따른다. YAML 검증 성공 시 안정 키 upsert, 수동 메타·그룹·가이드·최초 감사 보존. 일반 UI 신규/삭제/연결 정정 없음.
      - 명시 정리 전 제거 항목의 현재 참조·이력을 보존하고 불일치 배지/업무 호출 차단/경고를 제공한다. JDBC URL·계정·비밀 참조 원문은 이 엔티티/관리 HIST에 저장하지 않는다.
      - 수동 메타·ENT-018 그룹·ENT-096 가이드를 같은 기대 리비전/전체 스냅샷으로 원자 적용한다. 원천 조회 결과/구조 비교는 별도 관측이다.
    state_machine:
      - PRESENT/MISSING/UNKNOWN은 현재 YAML 존재 상태다. DB 메타 완성과 실행 가능은 별도 판정이다.
