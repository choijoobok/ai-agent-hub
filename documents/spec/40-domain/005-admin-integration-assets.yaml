    rules: ["REQ-603.yaml_authority·data_query_guides를 따른다. YAML 검증 성공 시 안정 키 upsert, 수동 메타·그룹·가이드·최초 감사 보존. UI 신규/삭제/연결 정정 없음.", "제거 항목의 현재 참조·이력을 보존하고 불일치 배지/업무 호출 차단/경고를 제공한다. JDBC URL·계정·비밀 참조 원문은 이 엔티티/관리 HIST에 저장하지 않는다.", "수동 메타·ENT-018 그룹·ENT-096 가이드를 같은 기대 리비전/전체 스냅샷으로 원자 적용한다. 원천 조회 결과/구조 비교는 별도 관측이다."]
    state_machine: ["PRESENT/MISSING/UNKNOWN은 현재 YAML 존재 상태다. DB 메타 완성과 실행 가능은 별도 판정이다."]
