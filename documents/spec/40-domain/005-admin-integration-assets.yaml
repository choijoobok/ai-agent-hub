        origin: "관리자·지원 목록"
      - name: "운영 DB·DW 유형"
        physical_name: "SOURCE_TYPE_CD"
        description: "조회 원천의 업무 유형. 실제 연결 주소나 접속 권한을 대신하지 않는다"
        origin: "관리자"
      - name: "시각 체계"
        physical_name: "TIME_ZONE_ID"
        description: "조회 원천 시각을 해석하는 업무 메타데이터. Hub 감사 시각이나 브라우저 시간대와 구분한다"
        origin: "관리자"
      - name: "데이터 기준 시각 정보"
        physical_name: "DATA_BASIS"
        description: "조회 결과의 원천 기준 시각을 설명하는 관리 정보. 실제 갱신/최신성의 관측 결과를 꾸며 저장하지 않는다"
        origin: "관리자"
      - name: "현재 관리 버전"
        physical_name: "MANAGEMENT_VERSION"
        description: "메타데이터·배포 참조·그룹 집합의 편집 기준 버전. 배포 세대·권한/캐시 버전과 별개다"
        origin: "서버"
      - name: "생성 주체"
        physical_name: "REG_ID"
        description: "최초 등록을 처리한 system 관리자 계정 참조. 후속 변경자가 덮어쓰지 않는다"
        origin: "서버 인증 근거"
      - name: "생성 시각"
        physical_name: "REG_DTM"
        description: "최초 등록이 반영된 시각. 후속 변경 뒤에도 유지한다"
        origin: "서버"
      - name: "최종 변경 주체"
        physical_name: "MOD_ID"
        description: "현재 관리 버전을 실제 반영한 system 관리자 계정 참조. 최초 등록에서는 생성 주체와 같다"
        origin: "서버 인증 근거"
      - name: "최종 변경 시각"
        physical_name: "MOD_DTM"
        description: "현재 관리 버전이 반영된 시각. 최초 등록에서는 생성 시각과 같다"
        origin: "서버"
      - name: "변경 사유"
        physical_name: "CHANGE_REASON"
        description: "현재 관리 버전을 만든 등록/변경의 업무 사유"
        origin: "관리자"
      - name: "변경 작업 참조"
        physical_name: "COMMAND_KEY"
        description: "현재 관리 버전을 만든 실제 작업·처리 결과를 연결하는 근거"
        origin: "서버"
      - name: "안정 YAML 데이터소스 키"
        physical_name: "DATA_SOURCE_KEY"
        description: "app.external-datasources의 고정 키. 내부 안정 ID와 1:1, 별칭 변경으로 참조 교체하지 않음"
      - name: "동기화 설정 세대"
        physical_name: "SYNC_CONFIG_ID"
        description: "검증 성공한 YAML 동기화 근거. 비밀 해시/원문 저장 아님"
      - name: "등록 주체 종류"
        physical_name: "REG_SOURCE_CD"
        description: "기동 동기화/관리자 영역의 실제 기록 주체 구분"
      - name: "변경 주체 종류"
        physical_name: "MOD_SOURCE_CD"
        description: "YAML 기술 메타 동기화와 수동 업무 보완 구분"
    relations:
      - entity: ENT-018
        cardinality: "데이터소스마다 적용 가능 그룹 0개 이상"
        description: "전체 집합 교체와 하위 매핑 보호를 같은 변경에서 검사한다"
      - entity: ENT-019
        cardinality: "성공 변경마다 처리 근거 하나"
        description: "생성과 수정·삭제의 재수신 결과를 연결한다"
      - entity: ENT-004
        cardinality: "현재 대상 하나에서 반영 후 이력 0개 이상"
        description: "원 식별자와 변경 버전/순서로 연결하며 허용 삭제 뒤에도 과거 구성을 조회할 수 있다"
    related_features: [FEAT-003, FEAT-005, FEAT-006, FEAT-007, FEAT-014, FEAT-023]
