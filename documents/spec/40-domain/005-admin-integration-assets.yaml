      - "원본의 모든 허용 관리 컬럼·자료형과 REG/MOD 값을 그대로 복사한다. 비밀 및 실시간 관측은 제외한다."
      - "HIST_ID는 각 이력 행의 PK이며 HISTORY_NO는 집합 연결 키다. 이력 일시는 모든 관련 행에 같으며 조인 키로 사용하지 않는다."
