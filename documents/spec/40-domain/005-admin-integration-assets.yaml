    delete_policy: REQ-601.configuration_cleanup. 현재 정확 누락·미참조·배포 안전성을 확인한 명시 일괄 정리만 허용한다. 소유 현재 자식만 제거하고 이력/명령/판정/경고/실행 근거와 외부 참조 자산은 보존한다. 연결만 제거하면 부모는 존속한다.
