# 영역: admin 연동 자산 — 대상 시스템·데이터소스 물리 설계 초안 (미구현)
entities:
  - id: ENT-001
    name: "대상 시스템"
    term: TRM-040
    domain: "연동 자산"
    module: "admin"
    implementation: "planned"
    design_stage: "physical"
    table: "AI_ADMIN_TARGET_SYSTEM"
    features: [FEAT-001]
    reqs: [REQ-601, REQ-604]
    description: "YAML의 안정 시스템 키/비밀 없는 기본 표시 메타와 관리자 이름/설명 재정의. API 접속 및 Portal 대상 계정 매핑의 시스템 기준이다. 기술 연결 정의/비밀은 소유하지 않는다."
    attributes:
      - name: "대상 시스템 식별자"
        physical_name: "TARGET_SYSTEM_ID"
        pk: true
        description: "Hub가 부여하고 재사용하지 않는 안정 식별자. 표시명·연결명이 바뀌어도 유지한다"
        origin: "서버"
      - name: "시스템명"
        physical_name: "SYSTEM_NM"
        description: "관리자 시스템명 재정의. null은 YAML 이름/식별자 표시를 사용한다."
        origin: "관리자"
      - name: "설명"
        physical_name: "DESCRIPTION"
        description: "관리자 설명 재정의. null은 YAML 기본, 빈 문자열은 명시 공란이다."
        origin: "관리자"
      - name: "현재 관리 버전"
        physical_name: "MANAGEMENT_VERSION"
        description: "정의·허용 집합·기본값의 편집 기준과 저장 충돌을 대조하는 버전. 배포 적용 설정 식별자와 별개다"
        origin: "서버"
      - name: "생성 주체"
        physical_name: "REG_ID"
        description: "현재 주체 종류가 관리자면 인증 관리자 ID, 설정 동기화면 null이며 SOURCE_CD로 기술 작업을 구분한다. 사람 계정을 꾸며내지 않는다."
        origin: "서버 인증 근거"
      - name: "생성 시각"
        physical_name: "REG_DTM"
        description: "최초 등록이 반영된 시각. 후속 변경 뒤에도 유지한다"
        origin: "서버"
      - name: "최종 변경 주체"
        physical_name: "MOD_ID"
        description: "현재 주체 종류가 관리자면 인증 관리자 ID, 설정 동기화면 null이며 SOURCE_CD로 기술 작업을 구분한다. 사람 계정을 꾸며내지 않는다."
        origin: "서버 인증 근거"
      - name: "최종 변경 시각"
        physical_name: "MOD_DTM"
        description: "현재 관리 버전이 반영된 시각. 최초 등록에서는 생성 시각과 같다"
        origin: "서버"
      - name: "변경 사유"
        physical_name: "CHANGE_REASON"
        description: "현재 관리 버전을 만든 등록/변경의 업무 사유"
        origin: "관리자"
      - name: "변경 작업 참조"
        physical_name: "COMMAND_KEY"
        description: "현재 관리 버전을 만든 실제 작업·처리 결과를 연결하는 근거. 표시 시각만으로 동일 작업을 추정하지 않는다"
        origin: "서버"
      - name: "YAML 시스템 안정 키"
        physical_name: "SYSTEM_KEY"
        description: "YAML 정의의 불변·재사용 금지 키. 내부 PK와 구분"
        origin: "YAML"
      - name: "YAML 기본 시스템명"
        physical_name: "YAML_SYSTEM_NM"
        description: "관리자 재정의와 별도 저장하는 비밀 없는 기본 이름"
        origin: "YAML"
      - name: "YAML 기본 설명"
        physical_name: "YAML_DESCRIPTION"
        description: "비밀 없는 기본 설명"
        origin: "YAML"
      - name: "마지막 정상 확인 설정 세대"
        physical_name: "SYNC_CONFIG_ID"
        description: "현재 활성 세대와 정확 존재를 대조한다. 미제공/로드 실패를 제거로 확정하지 않음"
        origin: "서버"
      - name: "최초 등록 주체 종류"
        physical_name: "REG_SOURCE_CD"
        description: "CONFIG_SYNC/ADMIN 구분"
        origin: "서버"
      - name: "최종 수정 주체 종류"
        physical_name: "MOD_SOURCE_CD"
        description: "CONFIG_SYNC/ADMIN 구분"
        origin: "서버"
    relations:
      - entity: ENT-017
        cardinality: "시스템마다 허용 연결 0개 이상"
        description: "YAML이 소유한 연결 키/메타와 관리자 표시 재정의. 제거 행은 보존한다."
      - entity: ENT-019
        cardinality: "성공 변경마다 처리 근거 하나"
        description: "최종 명령 참조와 결과를 연결한다"
      - entity: ENT-003
        cardinality: "현재 대상 하나에서 반영 후 이력 0개 이상"
        description: "원 식별자와 변경 버전/순서로 연결한다. 삭제 후 이력이 현재 행의 존재에 의존하지 않게 한다"
    related_features: [FEAT-004, FEAT-005]
    external_observations: "연결 정의의 현재 로드 여부·불변 적용 설정 식별자·노드/확인 시점·조회 실패는 ARCH-028의 공개 관측으로 받는다. 이 엔티티의 편집 가능한 정상 상태로 저장하거나 배포 정의 사본으로 만들지 않는다"
    rules: ["REQ-604.authority·synchronization에 따라 YAML 기술 메타와 관리자 보완을 필드별로 분리한다. UI 신규/삭제·기본 연결·수동 시스템 사용 상태는 없다.", "성공한 전체 설정에서 제거된 키도 현재 행과 참조를 보존하고 불일치/실행 차단·경고로 연결한다.", "실제 비밀 없는 변경과 관리자 재정의만 관리 버전/이력을 갱신한다. 단순 재기동 관측은 최초/수정 감사를 덮지 않는다."]
    state_machine:
      configuration: "현재 적용 YAML 정의와 정확 ID/소속 대조에 따른 PRESENT/MISSING/UNKNOWN 파생 상태. 보존 행은 제거되지 않으며 관리자 입력 상태로 위조하지 않는다."
      availability: "개별 API의 명시 연결 및 REQ-601.asset_availability와 현재 호출자 검사로 판정한다."
    audit: "반영 후 전체 구성은 ENT-003, 현재 생성/최종 변경 근거는 본 엔티티에 연결한다"
    delete_policy: "UI/관리 API 물리 삭제 없음. YAML 제거는 DB 잔재·이력·참조를 보존하며 보존 종료 파기는 별도 정책이다."
    rules_from: [REQ-604, "REQ-601.business_rules", "ARCH-028.api_connection_resolution", UC-015]
    storage_contract: "REQ-604.synchronization과 FEAT-001의 기존 대상 표시 보완 저장. 동기화는 전체 검증된 설정에서 메타만 갱신하고 관리자 재정의는 보존한다. 구성 제거 행은 보존한다. 현재 물리 설계는 미구현 초안이며 추가/수정 actor 종류와 nullable 관리자 참조를 구분한다."
    pending: ["@defer P3 integration_assets — FEAT-001 공개 계약의 실제 연결 관측·참조 보호를 후속 API/카탈로그·신원 쓰기 경로와 대조한다. 화면 요건/목업·오류 MSG·경합 시험은 후속이다"]
    physical:
      attributes:
        - name: "TARGET_SYSTEM_ID"
          type: "bigint"
          nullable: false
          default: null
        - name: "SYSTEM_NM"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "DESCRIPTION"
          type: "text"
          nullable: true
          default: null
        - name: "MANAGEMENT_VERSION"
          type: "bigint"
          nullable: false
          default: "1"
        - name: "REG_ID"
          type: "character varying(30)"
          nullable: true
          default: null
        - name: "REG_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "MOD_ID"
          type: "character varying(30)"
          nullable: true
          default: null
        - name: "MOD_DTM"
          type: "timestamp with time zone"
          nullable: false
          default: null
        - name: "CHANGE_REASON"
          type: "text"
          nullable: false
          default: null
        - name: "COMMAND_KEY"
          type: "character(36)"
          nullable: true
          default: null
        - name: "SYSTEM_KEY"
          type: "character varying(100)"
          nullable: false
          default: null
        - name: "YAML_SYSTEM_NM"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "YAML_DESCRIPTION"
          type: "text"
          nullable: true
          default: null
        - name: "SYNC_CONFIG_ID"
          type: "character varying(100)"
          nullable: true
          default: null
        - name: "REG_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
        - name: "MOD_SOURCE_CD"
          type: "character varying(30)"
          nullable: false
          default: null
      constraints:
        - name: "PK_ADM_TARGET_SYSTEM"
          definition: "PRIMARY KEY (TARGET_SYSTEM_ID)"
        - name: "CK_ADM_TARGET_SYSTEM_VER"
          definition: "CHECK (MANAGEMENT_VERSION >= 1)"
        - name: "UK_ADM_TARGET_SYSTEM_KEY"
          definition: "UNIQUE (SYSTEM_KEY)"
      indexes:
        - name: "IX_ADM_TARGET_SYSTEM_NAME"
          unique: false
          method: "btree"
          definition: "(SYSTEM_NM, TARGET_SYSTEM_ID)"
  - id: ENT-002
    name: "데이터소스"
    term: TRM-041
    domain: "연동 자산"
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_DATA_SOURCE
    features: [FEAT-002]
    reqs: [REQ-601, REQ-603]
    description: "등록 공개 객체와 SQL 조회가 참조하는 Hub 관리 단위. 하나의 배포 DB/DW 연결을 가리키며 여러 DB/카탈로그·스키마의 객체가 같은 내부 식별자를 사용할 수 있다"
    attributes:
      - { name: "데이터소스 식별자", physical_name: DATA_SOURCE_ID, pk: true, description: "자산·신원·정책이 참조하는 안정된 Hub 식별자. 배포 ID 정정으로 바꾸지 않는다", origin: "서버" }
      - { name: "배포 데이터소스 참조", physical_name: CONNECTION_ID, description: "현재 로드된 yml 데이터소스 식별자에서 선택한 연결 참조. 기존 값이 사라져도 자동 대체하지 않는다", origin: "관리자 선택" }
      - { name: "별칭 비교 키", physical_name: ALIAS_KEY, description: "별칭 정규화 계약으로 계산한 유일성 검사값. 관리자가 직접 편집하지 않는다", origin: "서버" }
      - { name: "별칭", physical_name: ALIAS_NM, description: "관리 화면과 모델 문맥의 수정 가능한 유일 표시명. REQ-603.alias_identity와 50-api의 FEAT-002.alias_contract에 따라 비교한다", origin: "관리자" }
      - { name: "설명", physical_name: DESCRIPTION, description: "조회 대상 업무 범위와 선택에 필요한 설명", origin: "관리자" }
      - { name: "DBMS 종류", physical_name: DBMS_CD, description: "질의 해석·파서 선택의 기술 기준", origin: "관리자·지원 목록" }
      - { name: "DBMS 버전", physical_name: DBMS_VERSION, description: "제품의 실제 버전 문자열. LLM 문맥과 연결 대조에 사용하며 관리 편집 버전/자료형 목록 분류 키와 구분한다", origin: "연결 관측 제안·관리자 확인" }
      - { name: "SQL 파서 선택", physical_name: PARSER_ID, description: "DBMS 기본값을 참고하되 별도 지정하는 파서. 미지정/미지원은 조회 불가이며 기본 파서로 조용히 대체하지 않는다", origin: "관리자·지원 목록" }
      - { name: "운영 DB·DW 유형", physical_name: SOURCE_TYPE_CD, description: "조회 원천의 업무 유형. 실제 연결 주소나 접속 권한을 대신하지 않는다", origin: "관리자" }
      - { name: "시각 체계", physical_name: TIME_ZONE_ID, description: "조회 원천 시각을 해석하는 업무 메타데이터. Hub 감사 시각이나 브라우저 시간대와 구분한다", origin: "관리자" }
      - { name: "데이터 기준 시각 정보", physical_name: DATA_BASIS, description: "조회 결과의 원천 기준 시각을 설명하는 관리 정보. 실제 갱신/최신성의 관측 결과를 꾸며 저장하지 않는다", origin: "관리자" }
      - { name: "현재 관리 버전", physical_name: MANAGEMENT_VERSION, description: "메타데이터·배포 참조·그룹 집합의 편집 기준 버전. 배포 세대·권한/캐시 버전과 별개다", origin: "서버" }
      - { name: "생성 주체", physical_name: REG_ID, description: "최초 등록을 처리한 system 관리자 계정 참조. 후속 변경자가 덮어쓰지 않는다", origin: "서버 인증 근거" }
      - { name: "생성 시각", physical_name: REG_DTM, description: "최초 등록이 반영된 시각. 후속 변경 뒤에도 유지한다", origin: "서버" }
      - { name: "최종 변경 주체", physical_name: MOD_ID, description: "현재 관리 버전을 실제 반영한 system 관리자 계정 참조. 최초 등록에서는 생성 주체와 같다", origin: "서버 인증 근거" }
      - { name: "최종 변경 시각", physical_name: MOD_DTM, description: "현재 관리 버전이 반영된 시각. 최초 등록에서는 생성 시각과 같다", origin: "서버" }
      - { name: "변경 사유", physical_name: CHANGE_REASON, description: "현재 관리 버전을 만든 등록/변경의 업무 사유", origin: "관리자" }
      - { name: "변경 작업 참조", physical_name: COMMAND_KEY, description: "현재 관리 버전을 만든 실제 작업·처리 결과를 연결하는 근거", origin: "서버" }
      - { name: "배포 참조 정정 근거", physical_name: CORRECTION_EVIDENCE, description: "현재 배포 참조로 명시 정정할 때 확인한 동일 대상의 비밀 없는 근거. 정정 이력이 없다면 없는 값으로 구분한다", origin: "관리자 및 공개 검증 결과" }
    relations:
      - { entity: ENT-018, cardinality: "데이터소스마다 적용 가능 그룹 0개 이상", description: "전체 집합 교체와 하위 매핑 보호를 같은 변경에서 검사한다" }
      - { entity: ENT-019, cardinality: "성공 변경마다 처리 근거 하나", description: "생성과 수정·삭제의 재수신 결과를 연결한다" }
      - { entity: ENT-004, cardinality: "현재 대상 하나에서 반영 후 이력 0개 이상", description: "원 식별자와 변경 버전/순서로 연결하며 허용 삭제 뒤에도 과거 구성을 조회할 수 있다" }
    related_features: [FEAT-003, FEAT-005, FEAT-006, FEAT-007, FEAT-014, FEAT-023]
    external_observations: "현재 연결 정상/끊김과 확인 불가, 파서 지원 여부는 ARCH-030과 소유 공개 조회의 관측 결과다. 연결 주소·계정·비밀·풀 설정을 속성으로 복제하지 않으며 정상 상태를 수동 저장하지 않는다"
    rules:
      - "별칭 유일성과 내부 식별자 안정성을 유지한다. 배포 참조 자체에 새 유일성 제약을 가정하지 않는다"
      - "적용 가능 그룹 제거 시 하위 테이블·컬럼 매핑이 남아 있으면 저장을 차단한다(AUTHZ-010 및 22-authz.mapping_rules). 참조 조회 실패는 남은 매핑 없음이 아니다"
      - "배포 참조 정정은 같은 대상임을 확인한 명시적 관리 변경이며 기존 내부 식별자·카탈로그 귀속을 유지한다"
      - "대상 시스템·단일 필수 DB 스키마·DB 허용 목록·사용자별 스키마 권한을 추가하지 않는다. 같은 연결의 전체 객체 식별·현재 권한·SQL 통제는 REQ-301·603의 소비 계약에서 검사한다"
      - "반영 후 전체 메타데이터·배포 참조·그룹 집합의 ENT-004 기록과 현재값 변경은 함께 성공한다. 배포 정의나 실시간 관측은 이 스냅샷의 복제 대상이 아니다"
    state_machine:
      connection_observation: "REQ-603.lifecycle의 정상↔끊긴 연결은 로드 설정과 참조의 대조 결과다. 관측 실패는 확인 불가로 구분한다. 설정 복구/명시적 참조 정정 뒤 다시 확인하며 운영자가 상태값만 바꿔 정상화하지 않는다"
      query_eligibility: "연결 관측과 파서 지정/지원, 현재 사용자 신원·객체/행 권한을 별도로 검증한다. 연결 정상이나 적용 가능 그룹 포함만으로 조회를 허용하지 않는다"
    audit: "반영 후 전체 구성은 ENT-004, 현재 생성/최종 변경 근거는 본 엔티티에 연결한다"
    delete_policy: "REQ-601·603의 유효 참조를 검사하고 사용 중 카탈로그 등의 참조를 끊는 삭제는 거부한다. 허용 삭제 뒤 원 식별자를 재사용하지 않는다"
    rules_from: ["REQ-603", "REQ-601.business_rules", "ARCH-030", "AUTHZ-010", "UC-016"]
    storage_contract: "50-api의 FEAT-001.shared_write_contract를 따르는 직접 변경이다. BIGINT는 SYS_SEQUENCE의 JPA TABLE 전략으로 생성하며 배포 관측을 DB 상태로 복제하지 않는다. 신규 일시는 timestamptz, 긴 텍스트는 NCLOB 매핑의 PostgreSQL text를 사용한다."
    pending: ["@defer P3 access_policy·integration — 그룹 원천 모델의 물리 FK와 삭제 보호, 연결/파서 공개 계약 구현과 같은 대상 정정 검수를 연결한다. 현재 초안은 미구현이며 화면/경합 시험은 후속이다"]
    physical:
      attributes:
        - {"name":"DATA_SOURCE_ID","type":"bigint","nullable":false,"default":null}
        - {"name":"CONNECTION_ID","type":"character varying(100)","nullable":false,"default":null}
        - {"name":"ALIAS_NM","type":"character varying(100)","nullable":false,"default":null}
        - {"name":"ALIAS_KEY","type":"character varying(300)","nullable":false,"default":null}
        - {"name":"DESCRIPTION","type":"text","nullable":true,"default":null}
        - {"name":"DBMS_CD","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"DBMS_VERSION","type":"character varying(100)","nullable":false,"default":null}
        - {"name":"PARSER_ID","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"SOURCE_TYPE_CD","type":"character varying(10)","nullable":false,"default":null}
        - {"name":"TIME_ZONE_ID","type":"character varying(100)","nullable":true,"default":null}
        - {"name":"DATA_BASIS","type":"text","nullable":true,"default":null}
        - {"name":"MANAGEMENT_VERSION","type":"bigint","nullable":false,"default":"1"}
        - {"name":"REG_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"REG_DTM","type":"timestamp with time zone","nullable":false,"default":null}
        - {"name":"MOD_ID","type":"character varying(30)","nullable":false,"default":null}
        - {"name":"MOD_DTM","type":"timestamp with time zone","nullable":false,"default":null}
        - {"name":"CHANGE_REASON","type":"text","nullable":false,"default":null}
        - {"name":"COMMAND_KEY","type":"character(36)","nullable":false,"default":null}
        - {"name":"CORRECTION_EVIDENCE","type":"text","nullable":true,"default":null}
      constraints:
        - {"name":"PK_ADM_DATA_SOURCE","definition":"PRIMARY KEY (DATA_SOURCE_ID)"}
        - {"name":"UK_ADM_DATA_SOURCE_ALIAS","definition":"UNIQUE (ALIAS_KEY)"}
        - {"name":"CK_ADM_DATA_SOURCE_VER","definition":"CHECK (MANAGEMENT_VERSION >= 1)"}
        - {"name":"CK_ADM_DATA_SOURCE_TYPE","definition":"CHECK (SOURCE_TYPE_CD IN ('DB','DW'))"}
      indexes:
        - {"name":"IX_ADM_DATA_SOURCE_CONN","unique":false,"method":"btree","definition":"(CONNECTION_ID, DATA_SOURCE_ID)"}

