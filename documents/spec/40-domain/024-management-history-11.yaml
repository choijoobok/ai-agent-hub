entities:
  - id: ENT-240
    name: 도구 필드값 의미 매핑 전체 변경 이력
    module: admin
    implementation: planned
    design_stage: physical
    table: AI_ADMIN_TOOL_FIELD_MEANING_HIST
    features:
      - FEAT-021
      - FEAT-040
    reqs:
      - REQ-612
      - REQ-601
    term: TRM-258
    domain: 연동 자산
    sources: []
    attributes:
      - name: TOOL_ID
        physical_name: TOOL_ID
        description: 현재 소유 마스터의 안정 식별자
        pk: false
      - name: 소유 입력/응답 필드
        physical_name: FIELD_ID
        pk: false
        description: 같은 도구의 등록 스칼라 필드. 방향·위치·경로/PATH 순서를 안정 FIELD_ID로 식별한다.
      - name: 참조 가이드/직접 등록 구분
        physical_name: METHOD_CD
        description: GUIDE/INLINE 두 방식. 미확정은 정상 소비 불가. 구 RESPONSE/CATALOG/API 자동 방식은 대체한다.
        pk: false
      - name: 참조 가이드
        physical_name: REFERENCE_GUIDE
        description: 허용 조회 원천·그룹·조건·값 출처·해석 방법의 자연어 안내. 물리명 미정
        pk: false
      - name: 설명
        physical_name: DESCRIPTION
        description: 이 필드 코드가 나타내는 업무 의미. 물리명 미정
        pk: false
      - name: 이력 행 식별자
        physical_name: HIST_ID
        pk: true
        description: 이력 행 식별자
      - name: 전체 이력 세트 번호
        physical_name: HISTORY_NO
        pk: false
        description: 전체 이력 세트 번호
    physical:
      attributes:
        - name: TOOL_ID
          type: bigint
          nullable: false
          default: null
        - name: FIELD_ID
          type: bigint
          nullable: false
          default: null
        - name: METHOD_CD
          type: character varying(40)
          nullable: false
          default: null
        - name: REFERENCE_GUIDE
          type: text
          nullable: true
          default: null
        - name: DESCRIPTION
          type: text
          nullable: false
          default: null
        - name: HIST_ID
          type: bigint
          nullable: false
          default: null
        - name: HISTORY_NO
          type: bigint
          nullable: false
          default: null
      constraints:
        - name: PK_TOOL_FIELD_MEANING_HIST
          definition: PRIMARY KEY (HIST_ID)
        - name: UK_TOOL_FIELD_MEANING_HIST_SET
          definition: UNIQUE (HISTORY_NO, FIELD_ID)
        - name: FK_TOOL_FIELD_MEANING_HIST_PARENT
          definition: FOREIGN KEY (HISTORY_NO, FIELD_ID) REFERENCES AI_ADMIN_TOOL_FIELD_HIST (HISTORY_NO, FIELD_ID) ON UPDATE NO ACTION ON DELETE RESTRICT
      indexes:
        - name: IX_TOOL_FIELD_MEANING_HIST_LOOKUP
          unique: false
          method: btree
          definition: CREATE INDEX IX_TOOL_FIELD_MEANING_HIST_LOOKUP ON AI_ADMIN_TOOL_FIELD_MEANING_HIST (FIELD_ID, HISTORY_NO)
    history_storage:
      mode: immutable_snapshot
      source: ENT-158
      root_history: ENT-067
    delete_policy: 현재값·보호 참조가 없는 보존 종료 전체 세트만 소유 파기 명령으로 자식→루트 순서 삭제한다. 현재 테이블 FK/cascade 없음. ADR-044의 원 명령 종료키 등록과 원장 파기를 원자 처리한다.
    rules:
      - 원본의 모든 소유 열을 타입/null까지 동형 복사한다. 이력 PK는 HIST_ID이며 원본 PK는 일반 원값이다.
      - 신규/변경은 반영 후 전체, 삭제는 직전 전체와 새 RESULT_REVISION/DELETE 사건을 보존한다. 정확 성공 판 조회는 DELETE를 제외한다.
      - HISTORY_NO는 루트와 모든 자식에 동일하다. 자식은 HISTORY_NO+소유 부모 키의 복합 FK로 같은 세트의 소속까지 보장한다. HIST_DTM은 루트만 소유하고 자식 조회는 부모 체인을 통해 루트를 조인한다.
      - 원 REG/MOD 값은 원본 시점 그대로 보존한다. 보호 등록과 파기는 같은 세트 잠금이며 부분 누락을 현재값으로 메우지 않는다.
    relations:
      - entity: ENT-067
        cardinality: N:1
        description: HISTORY_NO → HISTORY_NO; DB RESTRICT 참조
    history_copy_of: ENT-158
    history_parent: ENT-237
    storage_role: history
