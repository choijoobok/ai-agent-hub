entities:
  - id: ENT-252
    name: Portal 인증 세션
    module: portal
    workstream: integration
    implementation: planned
    design_stage: physical
    table: AI_PORTAL_SESSION
    features:
      - FEAT-301
    reqs:
      - REQ-616
      - REQ-103
    term: TRM-295
    domain: Portal 인증
    attributes:
      - name: PRIMARY_ID
        physical_name: PRIMARY_ID
        description: Spring Session 내부 UUID
        pk: true
      - name: SESSION_ID
        physical_name: SESSION_ID
        description: 회전되는 불투명 쿠키 ID
      - name: CREATION_TIME
        physical_name: CREATION_TIME
        description: UTC epoch milliseconds
      - name: LAST_ACCESS_TIME
        physical_name: LAST_ACCESS_TIME
        description: UTC epoch milliseconds
      - name: MAX_INACTIVE_INTERVAL
        physical_name: MAX_INACTIVE_INTERVAL
        description: 유휴 만료 초
      - name: EXPIRY_TIME
        physical_name: EXPIRY_TIME
        description: UTC epoch milliseconds
      - name: PRINCIPAL_NAME
        physical_name: PRINCIPAL_NAME
        description: PORTAL:<안정ID>; 익명은 null
    physical:
      attributes:
        - name: PRIMARY_ID
          type: character(36)
          nullable: false
          default: null
        - name: SESSION_ID
          type: character(36)
          nullable: false
          default: null
        - name: CREATION_TIME
          type: bigint
          nullable: false
          default: null
        - name: LAST_ACCESS_TIME
          type: bigint
          nullable: false
          default: null
        - name: MAX_INACTIVE_INTERVAL
          type: integer
          nullable: false
          default: null
        - name: EXPIRY_TIME
          type: bigint
          nullable: false
          default: null
        - name: PRINCIPAL_NAME
          type: character varying(100)
          nullable: true
          default: null
      constraints:
        - name: PK_PORTAL_SESSION
          definition: PRIMARY KEY (PRIMARY_ID)
      indexes:
        - name: UX_PORTAL_SESSION_ID
          definition: CREATE UNIQUE INDEX UX_PORTAL_SESSION_ID ON AI_PORTAL_SESSION (SESSION_ID)
          unique: true
          method: btree
        - name: IX_PORTAL_SESSION_EXPIRY
          definition: CREATE INDEX IX_PORTAL_SESSION_EXPIRY ON AI_PORTAL_SESSION (EXPIRY_TIME)
          unique: false
          method: btree
        - name: IX_PORTAL_SESSION_PRINCIPAL
          definition: CREATE INDEX IX_PORTAL_SESSION_PRINCIPAL ON AI_PORTAL_SESSION (PRINCIPAL_NAME)
          unique: false
          method: btree
    history_storage:
      mode: not_management_history
      reason: 인증 운영/임시 보호 기록. 관리 전체 HIST를 생성하지 않는다.
    delete_policy: 만료 즉시 수락 거부, FEAT-301의 내부 만료 정리가 만료 행만 청크 삭제. 로그아웃/회전의 원 세션은 즉시 삭제한다.
    rules:
      - Spring Session PostgreSQL 표준 스키마에서 테이블/인덱스 이름만 분리한다. 제품 DDL은 라이브러리 스크립트와 대조해 새 Liquibase로 생성하며 자동 초기화는 금지한다.
      - 인증 원장/채팅 세션과 별개다. SYS_USER/AI_ADMIN_PORTAL_USER FK를 두지 않고 현재 계정은 공개 포트로 검사한다. 속성 직렬화 허용 목록과 원자 저장은 FEAT-301.portal_session_storage.
    sources: []
  - id: ENT-253
    name: Portal 인증 세션 속성
    module: portal
    workstream: integration
    implementation: planned
    design_stage: physical
    table: AI_PORTAL_SESSION_ATTRIBUTES
    features:
      - FEAT-301
    reqs:
      - REQ-616
      - REQ-103
    term: TRM-295
    domain: Portal 인증
    attributes:
      - name: SESSION_PRIMARY_ID
        physical_name: SESSION_PRIMARY_ID
        description: 부모 세션 내부 ID
        pk: true
      - name: ATTRIBUTE_NAME
        physical_name: ATTRIBUTE_NAME
        description: 서버 허용 속성 키
        pk: true
      - name: ATTRIBUTE_BYTES
        physical_name: ATTRIBUTE_BYTES
        description: 버전 있는 최소 인증/CSRF 문맥
    physical:
      attributes:
        - name: SESSION_PRIMARY_ID
          type: character(36)
          nullable: false
          default: null
        - name: ATTRIBUTE_NAME
          type: character varying(200)
          nullable: false
          default: null
        - name: ATTRIBUTE_BYTES
          type: bytea
          nullable: false
          default: null
      constraints:
        - name: PK_PORTAL_SESSION_ATTR
          definition: PRIMARY KEY (SESSION_PRIMARY_ID, ATTRIBUTE_NAME)
        - name: FK_PORTAL_SESSION_ATTR
          definition: FOREIGN KEY (SESSION_PRIMARY_ID) REFERENCES AI_PORTAL_SESSION (PRIMARY_ID) ON DELETE CASCADE
      indexes: []
    history_storage:
      mode: not_management_history
      reason: 인증 운영/임시 보호 기록. 관리 전체 HIST를 생성하지 않는다.
    delete_policy: 부모 세션 삭제와 함께 삭제하며 별도 보존/조회 이력을 만들지 않는다.
    rules:
      - 형식은 Spring Session과 동일하다. 계정 비밀번호·해시·외부 토큰·어설션·업무 요청 본문·역할/그룹 원장은 저장 금지.
      - 세션/CSRF 문맥은 운영 비밀이며 일반 조회·백업 열람 권한을 분리한다. 세션 객체의 serialVersionUID와 배포 호환 버전을 관리한다.
    sources: []
  - id: ENT-254
    name: 외부 로그인 요청 문맥
    module: portal
    workstream: integration
    implementation: planned
    design_stage: physical
    table: AI_PORTAL_LOGIN_CHALLENGE
    features:
      - FEAT-301
    reqs:
      - REQ-616
      - REQ-103
    term: TRM-296
    domain: Portal 인증
    attributes:
      - name: CHALLENGE_ID
        physical_name: CHALLENGE_ID
        description: 서버 내부 불투명 상관 ID
        pk: true
      - name: SOURCE_KEY
        physical_name: SOURCE_KEY
        description: 설치된 검증 원천 키
      - name: STATE_DIGEST
        physical_name: STATE_DIGEST
        description: 브라우저 state SHA-256
      - name: BROWSER_BIND_DIGEST
        physical_name: BROWSER_BIND_DIGEST
        description: 익명 Portal 문맥 바인딩 난수 SHA-256
      - name: NONCE_DIGEST
        physical_name: NONCE_DIGEST
        description: 프로토콜 nonce 지문
      - name: RETURN_PATH
        physical_name: RETURN_PATH
        description: 정규화한 Portal 허용 복귀 경로
      - name: CREATED_DTM
        physical_name: CREATED_DTM
        description: 시작 시각
      - name: EXPIRES_DTM
        physical_name: EXPIRES_DTM
        description: 수락 종료 시각
      - name: CONSUMED_DTM
        physical_name: CONSUMED_DTM
        description: 성공한 일회 소비 시각
    physical:
      attributes:
        - name: CHALLENGE_ID
          type: character(36)
          nullable: false
          default: null
        - name: SOURCE_KEY
          type: character varying(100)
          nullable: false
          default: null
        - name: STATE_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: BROWSER_BIND_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: NONCE_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: RETURN_PATH
          type: character varying(500)
          nullable: false
          default: null
        - name: CREATED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: EXPIRES_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: CONSUMED_DTM
          type: timestamp with time zone
          nullable: true
          default: null
      constraints:
        - name: PK_PORTAL_LOGIN_CHALLENGE
          definition: PRIMARY KEY (CHALLENGE_ID)
        - name: UX_PORTAL_LOGIN_STATE
          definition: UNIQUE (STATE_DIGEST)
        - name: CK_PORTAL_LOGIN_EXPIRY
          definition: CHECK (EXPIRES_DTM > CREATED_DTM)
      indexes:
        - name: IX_PORTAL_LOGIN_EXPIRY
          definition: CREATE INDEX IX_PORTAL_LOGIN_EXPIRY ON AI_PORTAL_LOGIN_CHALLENGE (EXPIRES_DTM)
          unique: false
          method: btree
    history_storage:
      mode: not_management_history
      reason: 인증 운영/임시 보호 기록. 관리 전체 HIST를 생성하지 않는다.
    delete_policy: FEAT-301의 내부 만료 정리가 EXPIRES_DTM 이전 행만 제거한다. 세션/계정 FK 없이 수락 시 현재 브라우저 바인딩과 계정을 검증한다.
    rules:
      - 원 state/nonce·인증 코드/토큰은 기록하지 않는다. 프로토콜 비밀의 보관이 필요한 어댑터는 고객 계약에서 암호화·파기·키를 별도 검수하며 이 테이블에 원문을 추가하지 않는다.
      - 동일 트랜잭션에서 소비 시각·증거·인증 세션·성공 사건을 확정한다. 미소비도 기한이 지나면 거부한다.
    sources: []
  - id: ENT-255
    name: 소비한 외부 인증 증거
    module: portal
    workstream: integration
    implementation: planned
    design_stage: physical
    table: AI_PORTAL_AUTH_EVIDENCE
    features:
      - FEAT-301
    reqs:
      - REQ-616
      - REQ-103
    term: TRM-297
    domain: Portal 인증
    attributes:
      - name: SOURCE_KEY
        physical_name: SOURCE_KEY
        description: 검증 어댑터 원천
        pk: true
      - name: EVIDENCE_DIGEST
        physical_name: EVIDENCE_DIGEST
        description: 원천별 증거 식별의 정규 지문
        pk: true
      - name: CHALLENGE_ID
        physical_name: CHALLENGE_ID
        description: 소비한 요청 문맥
      - name: PORTAL_USER_ID
        physical_name: PORTAL_USER_ID
        description: 검증된 안정 주체
      - name: CONSUMED_DTM
        physical_name: CONSUMED_DTM
        description: 일회 소비 확정
      - name: EXPIRES_DTM
        physical_name: EXPIRES_DTM
        description: 증거를 더는 수락할 수 없는 시각
    physical:
      attributes:
        - name: SOURCE_KEY
          type: character varying(100)
          nullable: false
          default: null
        - name: EVIDENCE_DIGEST
          type: character(64)
          nullable: false
          default: null
        - name: CHALLENGE_ID
          type: character(36)
          nullable: false
          default: null
        - name: PORTAL_USER_ID
          type: bigint
          nullable: false
          default: null
        - name: CONSUMED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: EXPIRES_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_PORTAL_AUTH_EVIDENCE
          definition: PRIMARY KEY (SOURCE_KEY, EVIDENCE_DIGEST)
        - name: UX_PORTAL_EVIDENCE_CHALLENGE
          definition: UNIQUE (CHALLENGE_ID)
        - name: CK_PORTAL_EVIDENCE_EXPIRY
          definition: CHECK (EXPIRES_DTM > CONSUMED_DTM)
      indexes:
        - name: IX_PORTAL_EVIDENCE_EXPIRY
          definition: CREATE INDEX IX_PORTAL_EVIDENCE_EXPIRY ON AI_PORTAL_AUTH_EVIDENCE (EXPIRES_DTM)
          unique: false
          method: btree
    history_storage:
      mode: not_management_history
      reason: 인증 운영/임시 보호 기록. 관리 전체 HIST를 생성하지 않는다.
    delete_policy: EXPIRES_DTM 이후 FEAT-301의 내부 만료 정리가 삭제한다. 삭제된 증거도 만료/요청 문맥 없음으로 거부하므로 재사용할 수 없다.
    rules:
      - 증거 원문/서명키를 저장하지 않는다. 동일 원천+증거 중복 삽입은409이며 새 세션을 만들지 않는다.
      - 주체/요청 문맥은 일회 소비 시 서버에서 검증한다. 청소 순서와 운영 계정 수명을 묶는 FK는 두지 않는다.
    sources: []
  - id: ENT-256
    name: Portal 인증 보안 사건
    module: portal
    workstream: integration
    implementation: planned
    design_stage: physical
    table: AI_PORTAL_AUTH_EVENT
    features:
      - FEAT-301
    reqs:
      - REQ-616
      - REQ-103
    term: TRM-298
    domain: Portal 인증
    attributes:
      - name: AUTH_EVENT_ID
        physical_name: AUTH_EVENT_ID
        description: SYS_SEQUENCE로 발급하는 사건 ID
        pk: true
      - name: EVENT_KEY
        physical_name: EVENT_KEY
        description: 서버 생성 중복 방지 키
      - name: EVENT_TYPE
        physical_name: EVENT_TYPE
        description: LOGIN_SUCCESS/LOGIN_FAILURE/LOGOUT/PASSWORD_CHANGED/SESSION_REJECTED
      - name: PORTAL_USER_ID
        physical_name: PORTAL_USER_ID
        description: 식별된 안정 주체, 미식별 실패는 null
      - name: AUTH_MODE
        physical_name: AUTH_MODE
        description: LOCAL/EXTERNAL
      - name: RESULT_CODE
        physical_name: RESULT_CODE
        description: 안전한 내부 결과 분류
      - name: REQUEST_TRACE_ID
        physical_name: REQUEST_TRACE_ID
        description: 비밀 아닌 관측 상관 ID
      - name: OCCURRED_DTM
        physical_name: OCCURRED_DTM
        description: 사건 발생 시각
      - name: RECORDED_DTM
        physical_name: RECORDED_DTM
        description: DB 기록 시각
    physical:
      attributes:
        - name: AUTH_EVENT_ID
          type: bigint
          nullable: false
          default: null
        - name: EVENT_KEY
          type: character(36)
          nullable: false
          default: null
        - name: EVENT_TYPE
          type: character varying(40)
          nullable: false
          default: null
        - name: PORTAL_USER_ID
          type: bigint
          nullable: true
          default: null
        - name: AUTH_MODE
          type: character varying(10)
          nullable: false
          default: null
        - name: RESULT_CODE
          type: character varying(60)
          nullable: false
          default: null
        - name: REQUEST_TRACE_ID
          type: character varying(100)
          nullable: false
          default: null
        - name: OCCURRED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
        - name: RECORDED_DTM
          type: timestamp with time zone
          nullable: false
          default: null
      constraints:
        - name: PK_PORTAL_AUTH_EVENT
          definition: PRIMARY KEY (AUTH_EVENT_ID)
        - name: UX_PORTAL_AUTH_EVENT_KEY
          definition: UNIQUE (EVENT_KEY)
        - name: CK_PORTAL_AUTH_EVENT_MODE
          definition: CHECK (AUTH_MODE IN ('LOCAL','EXTERNAL'))
      indexes:
        - name: IX_PORTAL_AUTH_EVENT_TIME
          definition: CREATE INDEX IX_PORTAL_AUTH_EVENT_TIME ON AI_PORTAL_AUTH_EVENT (OCCURRED_DTM)
          unique: false
          method: btree
        - name: IX_PORTAL_AUTH_EVENT_USER
          definition: CREATE INDEX IX_PORTAL_AUTH_EVENT_USER ON AI_PORTAL_AUTH_EVENT (PORTAL_USER_ID, OCCURRED_DTM)
          unique: false
          method: btree
    history_storage:
      mode: not_management_history
      reason: 인증 운영/임시 보호 기록. 관리 전체 HIST를 생성하지 않는다.
    delete_policy: FEAT-301.auth_audit의 보존/아카이브 활성화 조건을 따른다. SESSION 청소가 이 사건을 삭제하지 않는다.
    rules:
      - Portal 영역 전용이며 ADMIN 참조를 넣지 않는다. 계정 삭제에 연쇄 삭제되지 않도록 FK를 두지 않고 사건 당시 안정 ID만 유지한다.
      - 원 로그인 입력/비밀번호/해시/쿠키/CSRF/state/nonce/외부 토큰·업무 본문/IP/UA는 기록하지 않는다. 안전한 코드/상관 ID만 허용한다.
      - 긍정 인증·암호 변경은 업무 확정 트랜잭션에 append한다. 현재 요청 일반 로그의 비동기/REQUIRES_NEW 성공을 이 원장 확정으로 보지 않는다.
    sources: []
