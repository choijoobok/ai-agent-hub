# 영역: 연동 자산의 변경 이력
terms:
  - id: TRM-250
    term: "대상 시스템 변경 이력"
    key: "targetSystemHistory"
    group: "정책"
    definition: "대상 시스템/연결의 실제 비밀 없는 YAML 메타 동기화 또는 관리자 표시 보완의 전체 구성과 행위자·시각·사유를 보존한 불변 기록"
    relation: "REQ-601·604·ADR-038. 기본 연결·UI삭제는 철회됐으며 원본 감사와 이력 기록 감사·현재 관측을 구분한다."
  - id: TRM-251
    term: "데이터소스 변경 이력"
    key: dataSourceHistory
    group: "정책"
    definition: "데이터소스의 생성·수정·참조 정정의 확정 후 전체 구성과 삭제 상태의 마지막 구성을 보존하고 실제 변경 주체·시각·사유·순서와 연결한 불변 기록"
    relation: "REQ-601·603. 당시 배포 참조·업무 메타데이터·적용 가능 그룹 집합을 포함한다. 데이터소스(TRM-041)의 현재 정의와 배포 연결 원본·실행 감사는 별개다"
  - id: TRM-286
    term: "연결 설정 경고"
    key: "configurationAlert"
    group: "운영"
    definition: "현재 적용 설정에서 시스템/연결 누락·소속/참조 무효를 확인하고 원인과 영향 ID 관계를 묶어 관리자에게 제공하는 진단"
    relation: "REQ-601.configuration_alerts·REQ-604·ADR-038"
  - id: TRM-287
    term: "연결 설정 경고 사건"
    key: "configurationAlertEvent"
    group: "운영"
    definition: "원인 경고의 발생/해소·확인 불가 전이를 시각·근거와 함께 추가만 하는 운영 기록"
    relation: "REQ-601.configuration_alerts·REQ-604·ADR-038"
  - id: TRM-290
    term: "연결 설정 판정"
    key: "configurationDiagnosis"
    group: "운영"
    definition: "기동/검증된 비교 대상 변경 때 비밀을 제외한 명시 속성과 등록 참조를 대조해 적용 설정 버전별로 저장한 일치·불일치·확인 필요 결과"
    relation: "REQ-601.configuration_diagnosis·ENT-098·ADR-040. 경고가 없는 것과 정상 판정은 다르며 수동 사용/인증 성공·기동 준비는 별도다."
  - id: TRM-291
    term: "신원 확인 토큰"
    key: "identityVerificationToken"
    group: "보안"
    definition: "대상 시스템에 사용자 아이디를 직접 노출하지 않고 Hub의 인증된 서버 간 검증·일회 소비로 해당 대상의 신원을 해석하도록 발급한 불투명 난수값"
    relation: "REQ-609.identity_verification·IF-009·ADR-041. 모델 사용량 토큰·Portal 세션·서비스 접속 자격증명과 다르며 자체 업무 권한을 부여하지 않는다."
