    key: "targetSystemHistory"
    group: "정책"
    definition: "대상 시스템/연결의 실제 비밀 없는 YAML 메타 동기화 또는 관리자 표시 보완의 전체 구성과 행위자·시각·사유를 보존한 불변 기록"
