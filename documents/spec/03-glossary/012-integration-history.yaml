    group: "정책"
    definition: "데이터소스의 생성·수정·참조 정정의 확정 후 전체 구성과 삭제 상태의 마지막 구성을 보존하고 실제 변경 주체·시각·사유·순서와 연결한 불변 기록"
    relation: "REQ-601·603. 당시 배포 참조·업무 메타데이터·적용 가능 그룹 집합을 포함한다. 데이터소스(TRM-041)의 현재 정의와 배포 연결 원본·실행 감사는 별개다"
  - id: TRM-286
