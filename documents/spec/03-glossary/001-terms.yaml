    relation: "REQ-116·118·613 및 NFR-010·011. 월별 계획·배정 기준이며 실제 사용 합계나 개인 집행의 절대 상한은 아니다. 풀 밖 추가 승인·계량 차이는 별도 근거로 관리한다"
