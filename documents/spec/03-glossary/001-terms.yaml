    definition: "컨텍스트 필터링·구문 검증·조건 주입·결과 마스킹을 순서대로 적용하는 서버 통제. 모델이 제안한 SQL을 그대로 신뢰하지 않는다"
    relation: "REQ-103·611 및 AUTHZ-030"
  - id: TRM-182
