    group: "대화"
    definition: "허용된 관련 지식과 연결 카탈로그에서 요청에 필요한 객체·컬럼·관계를 선별해 모델 입력을 줄이는 처리. 필요한 데이터소스를 선행 선택으로 누락하지 않는다"
