    group: "실행"
    definition: "조회 도구 종류·계약 버전·데이터소스·SQL·업무 인자·기본 필터 제외 명세를 담은 검증된 실행 입력"
    relation: "REQ-202·207. 저장 시 agent가 검증·정규화해 보존하며 실행 때 현재 권한·정책을 다시 판정한다. 과거 결과 데이터 자체가 아니다"
  - id: TRM-210
    term: "파라미터화"
    key: parameterization
    group: "실행"
    definition: "저장 전 조회 요청의 고정 값을 이름 있는 입력 항목으로 바꾸고, 사용자가 확인한 형식·조건에 맞는 값을 실행 때 받도록 하는 처리"
    relation: "REQ-203. 저장된 SQL을 임의 편집하는 기능과 구분한다"
  - id: TRM-211
