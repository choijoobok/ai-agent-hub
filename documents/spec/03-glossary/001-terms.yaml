    relation: "REQ-005·017·026·105. 관리자 관리값 직접 저장과 별개이며 실제 실행 직전 현재 권한도 검사한다."
  - id: TRM-180
    term: "물리명"
    key: physicalName
    group: "데이터"
    definition: "DB 스키마·테이블·컬럼 등 실제 저장소 객체를 식별하는 이름. 사용자에게 설명하는 업무 명칭과 구분한다"
    relation: "REQ-104·301·603. Portal에는 SQL과 함께 노출하지 않는다"
  - id: TRM-181
