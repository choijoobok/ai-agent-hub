terms:
  - id: TRM-001
    term: 세션
    key: session
    group: 대화
    definition: "하나의 채팅 창. 맥락 유지와 컨텍스트 관리의 단위. 제목을 가지며, 사용자는 논리 삭제로 자신의 목록에서 숨길 수 있다"
  - id: TRM-002
    term: 턴
    key: turn
    group: 대화
    definition: "**사용자 질의 1건과 그에 대한 최종 응답까지의 처리 단위.** 한 세션은 여러 턴을 가진다"
    relation: "턴 ID와 시작 시각·원본/재시도 참조의 정본은 REQ-107이다. 모든 상태의 원 질의에 대한 명시 재요청은 REQ-013의 원본 연결 새 턴이며 대화 표시 순서는 턴 묶음이 아니라 REQ-019의 메시지 기록 순서를 따른다"
  - id: TRM-003
    term: 스텝
    key: step
    group: 대화
    definition: "**Hub에서 식별·관측하는 모델 응답 실행 1회.** 클라이언트 요청·연결·세션·스트리밍 청크·콘텐츠 블록 개수와는 구분한다. 동일 실행의 변경은 기존 스텝에 사건을 추가하고, 공급자 자동 후속이나 Hub 재요청이 새 응답 실행을 만들면 별도 스텝을 연결한다. 실패·중단·결과 불명 실행도 보존한다. SQL·API·임베딩 및 그래프 노드는 별도 작업 단위다. 식별/시작 관측·대체 관계·사용량의 정본은 REQ-107.history_storage다"
  - id: TRM-004
    term: 회차
    key: revision
    group: 대화
    definition: "**한 턴 안에서 입력 변경으로 되돌려 다시 수행한 흐름의 구분.** 원 질의의 명시 재요청은 원본과 연결된 새 턴/시도로 시작하며 원 턴의 회차를 수정·승계하지 않는다(REQ-013). 스텝은 턴·회차·순번뿐 아니라 어느 실행 시도에 속하는지도 식별한다. 구체적인 결합 키는 P3에서 정한다"
  - id: TRM-005
    term: 스텝 역할
    key: stepRole
    group: 대화
    definition: "스텝이 LLM 에게 요구하는 작업의 성격. **주 추론**(계획 수립·SQL 생성·최종 응답 작성·실패 원인 분석)과 **보조 판정**(업무 연관성 판정·지식에 연결된 허용 카탈로그의 관련 객체/컬럼 선별·질의 키워드 추출·과거 턴 요약·처리 중 입력의 의도 분류)으로 구분한다. 세부 역할은 ARCH-040, 카탈로그 선별과 데이터소스별 실행 경계는 REQ-021을 따른다"
    note: "**모델 선택의 단위다**"
  - id: TRM-006
    term: 도구 호출
    key: toolCall
    group: 대화
    definition: "스텝의 결과로 LLM 이 agent 에게 요청하는 단위 작업 (SQL 조회·API 실행·지식 검색·과거 이력 참조·사용자 확인 요청 등)"
  - id: TRM-007
    term: 도구
    key: tool
    group: 대화
    definition: "agent 가 LLM 에게 노출하는, 호출 가능한 기능의 명세"
  - id: TRM-008
    term: 사용자 개입
    key: interaction
    group: 대화
    definition: "턴 처리 중 사용자에게 추가 정보나 승인을 요청하고 응답을 받는 것"
  - id: TRM-009
    term: 컨텍스트
    key: context
    group: 대화
    definition: "특정 턴을 처리하기 위해 LLM에 전달하는 지시·지식·스키마 정보·사용자 입력 등의 정보 집합. 세션 맥락·과거 턴 요약의 유지는 REQ-001·003의 문맥·총량 관리를 따르고, 과거 결과 사본의 활용은 REQ-002의 명시 참조·현재 권한·보존 조건을 따른다"
    relation: "과거 결과 참조는 보존된 Hub 사본의 활용이며 원천 DB/API 자동 재실행을 뜻하지 않는다(REQ-002·003·021). 데이터 전송 동의는 REQ-106을 따른다"
  - id: TRM-010
    term: 품질 신고
    key: qualityReport
    group: 대화
    definition: "사용자가 특정 턴의 응답 품질에 이의를 제기하는 건. 상태를 가지며 관리자의 처리로 종결된다"
  - id: TRM-011
    term: 실행 점유
    key: executionLease
    group: 대화
    definition: "한 턴을 특정 agent 인스턴스가 처리 중임을 나타내는 **시한부 소유권**. 만료 시각을 가지며 갱신되지 않으면 회수된다"
  - id: TRM-012
    term: 점유 토큰
    key: fenceToken
    group: 대화
    definition: "실행 점유가 바뀔 때마다 증가하는 값. 점유를 잃은 인스턴스의 뒤늦은 쓰기를 무효화하는 데 쓴다"
  - id: TRM-013
    term: 질의 처리 유형
    key: queryProcessingType
    group: 대화
    definition: "자연어 질의를 처리 계획으로 나눌 때 쓰는 경로 구분. 지식 검색·요약, SQL 또는 조회 API 기반 데이터 조회, 승인 필요 액션 실행, LLM 없는 결정적 데이터 가공·표현, 정책상 허용된 제한 데이터의 LLM 해석으로 구분하며 한 턴에 둘 이상이 함께 있을 수 있다"
    relation: "유형은 처리 순서와 필요한 통제를 고르는 입력일 뿐, 데이터 접근·외부 모델 전송·액션 실행을 허용하는 근거가 아니다(REQ-038)"

# ── 실행과 자동화 ────────────────────────────────────────────
  - id: TRM-020
    term: 워크플로우
    key: workflow
    group: 실행
    definition: "기본 기능(도구)을 조합해 사용자가 정의한 자동 처리 절차"
  - id: TRM-021
    term: 잡
    key: job
    group: 실행
    definition: "워크플로우의 실행 인스턴스. 주기 실행·조건 실행·수동 실행으로 생성된다"
  - id: TRM-022
    term: 액션
    key: action
    group: 실행
    definition: "데이터를 변경하거나 외부에 영향을 주는 실행 (조회와 구분)"
  - id: TRM-023
    term: 승인 필요 액션
    key: approvalRequiredAction
    group: 실행
    definition: "실행 전 요청 사용자의 명시적 승인이 강제되는 액션. RM-P1에서는 등록된 모든 실행 액션이 여기에 해당한다"
  - id: TRM-024
    term: 커스텀 도구
    key: customTool
    group: 실행
    definition: "설정으로 표현할 수 없는 다중 시스템 데이터 가공을 위해 agent 안에 서비스 빈으로 구현하는 도구. 도구 레지스트리에 등록되어 다른 도구와 같은 통제를 받는다"
    note: "PRN-08 의 명시적 예외다"
  - id: TRM-025
    term: 질의 즐겨찾기
    key: savedPrompt
    group: 실행
    definition: "사용자가 저장한 **자연어 질의문**. 실행하면 새 턴으로 처리된다 — LLM 을 거치므로 토큰을 소모하고 결과가 매번 달라질 수 있다"
  - id: TRM-026
    term: 저장된 조회
    key: savedQuery
    group: 실행
    definition: "성공한 최종 조회 결과를 만든 LLM의 조회 실행 요청을 검증·정규화해 보존한 개인 조회. 생성 SQL·업무 인자·파라미터·기본 필터 제외 명세를 복원해 최초 조회와 같은 agent 검증·실행 경로를 사용한다. 현재 권한·정책을 다시 판정하며 턴·LLM 호출·토큰 사용량을 만들지 않는다"
    relation: "과거 결과가 아니라 실행 요청을 재현한다. 저장 가능한 호출·빈 제외 목록의 보존·개별 실행 이력은 REQ-202·203·207을 따른다"
  - id: TRM-027
    term: 대시보드
    key: dashboard
    group: 실행
    definition: "저장된 조회를 위젯(TRM-216)으로 배치한 개인 화면. 각 위젯은 저장된 조회와 표현 형식을 결합하며 기본 실행은 위젯별 수동 조회다(REQ-206)"

# ── 정책과 권한 ──────────────────────────────────────────────
  - id: TRM-040
    term: 대상 시스템
    key: targetSystem
    group: 정책
    definition: "Hub와 연동하여 업무 API를 제공하는 시스템. 여러 시스템을 등록할 수 있으며, 개별 API를 등록할 때 이 API를 제공하는 대상 시스템을 지정한다. **데이터소스와는 관계를 갖지 않는다**"
    note: "**저장소 밖의 레거시든(SHAPE-01) 함께 짓는 업무 확장이든(SHAPE-02) 대상 시스템이다** — 차이는 연동 방식(TRM-135)뿐이며, agent 위쪽의 등록·권한·감사 계약은 같다"
  - id: TRM-041
    term: 데이터소스
    key: dataSource
    group: 정책
    definition: "조회 대상 DB 또는 DW 연결 단위. 접속 정보는 yml 설정이 원천이고, admin 에 등록된 데이터소스 레코드(표시용 별칭·DBMS 종류·파서)가 그 ID 를 연결한다. **대상 시스템과 관계를 갖지 않는다**"
    not: "DB 스키마 하나와 같은 단위가 아니며, 다중 DB 스키마·권한·매핑 경계는 REQ-603을 따른다"
  - id: TRM-042
    term: 지식 검색 태그
    key: knowledgeSearchTag
    group: 정책
    definition: "고정 태그 ID로 지식에 연결하는 검색 표지. 검색 텍스트·동의어는 태그 정의가 소유하고 지식은 태그 ID 매핑을 소유한다. 텍스트만 바뀌면 지식 매핑·리비전은 유지한다. 관리·승인·과거 표현 재현은 REQ-607을 따른다"
    not: "대상 시스템·데이터소스·접근 권한 또는 자산을 귀속시키는 별도 업무 도메인 분류가 아니다"
  - id: TRM-043
    term: 인증 예제 쿼리
    key: certifiedQuery
    group: 정책
    definition: "사람이 검수해 등록한 업무 질의와 SQL·파라미터 명세의 쌍. 지식의 예시로 주입하거나 직접 실행에 사용한다. 직접 실행은 LLM이 SQL을 다시 작성하지 않고 파라미터만 채우되 현재 권한과 SQL 통제 4단계를 적용한다(REQ-302)"
    relation: "개인 저장 조회의 승격 후보는 REQ-205·305·306의 검토·승인 절차를 거쳐 등록한다. 절차 사용/전결은 REQ-601을 따른다"
  - id: TRM-044
    term: 조회 계획
    key: queryPlan
    group: 정책
    definition: "조회·실행 전에 사용자에게 **업무 용어로** 제시하는 처리 예정 내역 — 질의 해석문, 대상 데이터 영역의 업무 명칭, 적용 조건·기간·집계 단위. **액션이 포함된 턴에서는 실행할 액션과 순서도 포함한다**"
    note: "DBMS 실행 계획(EXPLAIN)과는 다른 개념이다. **이 용어를 유지할지는 미확정** — 액션 목록까지 담게 되어 이름과 범위가 어긋난다"
    relation: "계획 확인은 실행 대상·실제 파라미터를 확인하는 사용자 실행 승인(TRM-179)을 대신하지 않는다. 계획 확인 조건은 REQ-022·023·026을 따른다"
  - id: TRM-045
    term: 사용자 그룹
    key: userGroup
    group: 정책
    definition: "지식·스키마 카탈로그 등 Hub 업무 자산 접근 통제의 기본 단위. system의 메뉴·기능 역할과 별개인 전역 개념으로 업무상 직무 단위로 정의한다(예: 급여담당·평가관리자). 사용자는 여러 그룹에 속할 수 있고, 현재 활성 그룹들이 허용하는 접근 범위의 합집합을 적용한다(REQ-103·605·609)"
  - id: TRM-046
    term: 쿼터 등급
    key: quotaGrade
    group: 정책
    definition: "사용자별로 하나를 부여해 **월별 기본 토큰 한도**를 정하는 등급. **적용 월 단위**로 부여하며 당월·지난 달의 등급은 바꿀 수 없다. 신규 사용자는 등록 때 관리자가 부여한 등급(기본 선택값은 가장 낮은 등급)을 그 달부터 쓴다. 사용자의 승급 요청 승인 또는 관리자의 직접 변경은 대상 월 시작 전이면 첫 수동 예정 생성 여부와 무관하게 해당 미래 월부터 적용한다. 관리자 직접 변경은 사유를 남긴다. 이번 달 추가 사용은 등급 변경이 아니라 별도 추가 토큰 승인으로 처리한다"
    relation: "그룹은 업무 자산 접근 통제, 등급은 토큰 배분 기준이다. 모델 조합(TRM-232)은 모든 사용자에게 공통이며 REQ-602·606에 따라 그룹·등급별로 제한하지 않는다"
  - id: TRM-047
    term: 마스킹
    key: masking
    group: 정책
    definition: "민감한 값의 전부 또는 일부를 가리는 변환. 사용자에게 값을 보여 줄 때뿐 아니라 조회 결과·API 응답의 저장 사본을 만들 때도 적용한다. 변환의 적용 범위는 REQ-111, 그룹별 열람 처리와 공통 변환은 REQ-611을 따른다"
    not: "마스킹 열람(TRM-166)이라는 접근 처리와 변환 자체를 구분한다. 원본 열람 권한이 있어도 저장 사본의 마스킹 원칙을 해제하지 않는다"
  - id: TRM-048
    term: 기본 필터
    key: defaultFilter
    group: 정책
    definition: "삭제·취소·상태 등 업무 기본 조회 범위를 정하는 테이블별 필터 항목. 등록과 항목별 선택 제외의 업무 규칙은 REQ-611을 따른다. LLM은 사용자 의도에 따른 제외 명세를 제안하고 agent 서버가 검증한 항목만 주입하지 않는다"
    note: "**권한 통제가 아니다** — 정확도를 위한 장치다. 행 스코프와 한 항목으로 합치지 않는다: 하나는 볼 수 있는 범위이고 하나는 세어야 할 범위다"
  - id: TRM-049
    term: 신원 매핑
    key: identityMapping
    group: 정책
    definition: "Hub 사용자와 각 대상 시스템·데이터소스의 사용자 식별자를 직접 연결하는 매핑. 직접 저장하여 현재 유효한 매핑을 API의 사용자 신원 파라미터와 행 스코프 바인딩 값에 사용한다(REQ-609)"
    note: "누구의 신원으로 처리하는지 정하는 매핑이며 자산 접근 권한 자체를 부여하지 않는다. 현재 그룹·자산 정책과 함께 검사하고 변경 이력을 남긴다(REQ-103·609)"
  - id: TRM-050
    term: 프롬프트 규칙
    key: promptRule
    group: 정책
    definition: "관리자가 편집하는 시스템 공통 자연어 지침과 적용 조건·우선순위 등 관리 속성. 리비전별 내용을 보존해 실제 사용한 지시를 확인한다(REQ-610)"
    not: "자연어 본문에 서버 입력값 검증 규칙·통신 스키마를 작성하는 기능이 아니다. 소스 계약·현재 권한·필수 실행 승인은 프롬프트와 별도로 강제한다(REQ-009·112·610)"
  - id: TRM-051
    term: 개인 기본 지시
    key: personalDirective
    group: 정책
    definition: "사용자가 등록하는 개인화 지시. 프롬프트 규칙에 종속되며 이를 무력화할 수 없다"
  - id: TRM-052
    term: 지식
    key: knowledge
    group: 정책
    definition: "업무 용어·규칙·설명 등 검색되어 컨텍스트에 주입되는 자료. 안정적인 지식 식별자 아래 여러 지식 리비전을 가질 수 있다"
    note: "**물리 테이블·컬럼명과 SQL 을 담지 않는다** — 특정 공개 데이터 인터페이스에 관한 것이면 참조 링크로 표현한다"
  - id: TRM-053
    term: 쿼터
    key: quota
    group: 정책
    definition: "사용자별 **달력 월 단위 토큰 사용 기준 한도**. 기본 배정(월중 신규 사용자는 일할 배정)과 승인된 추가 사용분으로 구성하며, 개인 한도 소진 뒤의 사용은 승인으로 남긴다. 전사 예산이나 회계 예산과 구분한다"
  - id: TRM-054
    term: 행 스코프
    key: rowScope
    group: 정책
    definition: "회사·조직·담당 업무 등의 행 단위 권한 범위를 제한하는 테이블별 규칙 목록. 모든 유효 규칙을 AND로 결합하며 LLM이 선택하거나 제외하지 않는다. 신원 바인딩·필수 적용은 REQ-611, 권한 원천을 참조하는 주입 모델은 AUTHZ-020을 따른다"
  - id: TRM-055
    term: 지식 리비전
    key: knowledgeRevision
    group: 정책
    definition: "하나의 지식 식별자에 속한 내용·접근 그룹·태그 ID 매핑·참조 링크의 불변 후보 또는 이력 판. 활성 지식을 직접 고치지 않고 새 리비전으로 등록하며 승인된 리비전만 Agent가 사용한다. 공통 태그 텍스트·동의어는 별도 태그 버전으로 관리하며 당시 표현 재현은 REQ-607을 따른다"
  - id: TRM-056
    term: 반영 세트
    key: releaseSet
    group: 정책
    definition: "함께 서비스에 반영해야 하는 업무 자산의 전체 후보와 변경 사유·근거·시험 증빙을 묶은 단위. 지식·카탈로그·인증 예제·태그·API·도구의 단독/복합 변경과 매핑을 포함한다. REQ-305·306의 일괄 반영과 REQ-601의 업무별 승인 설정·전결·혼합 세트 규칙을 따르며 태그의 변경 대상과 영향 확인 대상 구분은 REQ-607을 따른다"
    relation: "승인/전결 대상은 전체 후보 스냅샷이며 기준 버전과 참조의 유효성을 검사해 승인된 구성만 함께 반영한다. 상세 원자성·충돌 처리는 REQ-305·306을 따른다"
  - id: TRM-057
    term: 공개 데이터 인터페이스
    key: publishedDataInterface
    group: 정책
    definition: "고객사가 AI Hub의 조회·컨텍스트 대상으로 선택해 등록한 DB/DW의 뷰 또는 테이블. 업무 DB/DW 전체 물리 스키마와 같지 않으며, 민감 원본 객체는 등록하지 않는다"

# ── 실행 기반 어휘 (구현 수준) ───────────────────────────────
# **업무 용어가 아니라 구현 어휘다.** 그래도 우리가 정한 것이므로 `key` 를 갖고 명명의
# 기준이 된다 — 정본은 documents/design/turn-execution.md 이고 여기는 그 색인이다.
  - id: TRM-060
    term: 획득
    key: acquire
    group: 실행기반
    definition: "진입 가능한 상태의 턴을 잡고 **점유 토큰을 +1** 한다"
  - id: TRM-061
    term: 갱신
    key: renew
    group: 실행기반
    definition: "처리 중에 점유 만료 시각을 미룬다. **중단 요청과 처리 중 입력도 이 왕복에서 함께 읽는다**"
  - id: TRM-062
    term: 해제
    key: release
    group: 실행기반
    definition: "처리를 끝내고 점유를 놓으면서 다음 상태로 전이시킨다"
  - id: TRM-063
    term: 회수
    key: sweep
    group: 실행기반
    definition: "만료된 점유를 찾아 중단 상태로 돌리는 배치. 그 배치를 **스위퍼**라 부른다"
  - id: TRM-064
    term: 점유 상실 신호
    key: leaseLost
    group: 실행기반
    definition: "점유를 잃었음을 알리는 신호(LeaseLostException). 이를 받은 인스턴스는 현재 턴을 실패로 바꾸는 것을 포함해 상태 전이를 하지 않고 처리를 포기한다"
    relation: "ARCH-070의 점유 보호와 REQ-107.history_storage를 따른다. 이전 호출에서 관측한 감사 사실을 추가하는 것과 현재 실행 상태를 갱신하는 것은 구분한다"
  - id: TRM-065
    term: 점유 유지 시간
    key: leaseDuration
    group: 실행기반
    definition: "기호 **L**. 갱신 없이 이 시간을 넘기면 만료된다"
    note: "값은 미확정이다 — 실측이 필요하다"
  - id: TRM-066
    term: 갱신 주기
    key: renewInterval
    group: 실행기반
    definition: "기호 **R**. `L / 3` 이하로 둔다"
  - id: TRM-067
    term: 회수 주기
    key: sweepInterval
    group: 실행기반
    definition: "기호 **S**. 스위퍼가 도는 주기"
    note: "**인스턴스가 죽고 회수되기까지 최악 `L + S` 가 걸린다** — 사용자에게 보이는 복구 시간의 상한은 L 이 아니라 이 합이다"
  - id: TRM-068
    term: 창 A
    key: windowA
    group: 실행기반
    definition: "중복 실행이 열리는 구간 하나 — **프로세스가 정지했다가 회수된 뒤 되살아날 때**"
    note: "현실성이 낮다 — 최소 L 동안 얼어 있어야 한다"
  - id: TRM-069
    term: 창 B
    key: windowB
    group: 실행기반
    definition: "중복 실행이 열리는 구간 둘 — **도구 실행이 L 보다 길어져 정상 처리 중인 인스턴스가 회수될 때**"
    note: "**장애 없이도 열린다.** 그래서 L 은 실행 API 의 타임아웃·재시도까지 포함해 산정한다 — exactly-once 를 약속하지 않는 근거가 이 창이다"
  - id: TRM-070
    term: 액션 실행 표시
    key: actionExecuted
    group: 실행기반
    definition: "**이 턴에서 액션이 나갔을 수 있다**는 표시. **성공 여부가 아니다.** 호출 디스패치 직전에 쓴다"
    note: "응답을 기다렸다가 쓰면 점유 회수 뒤에도 값이 거짓으로 남아 이전 실행을 미전송으로 오인해 같은 액션을 다시 낼 수 있다(REQ-013.execution_boundary). 원 질의의 새 턴 접수 자체를 차단하는 표식은 아니다"
  - id: TRM-071
    term: 조건부 쓰기
    key: conditionalWrite
    group: 실행기반
    definition: "`WHERE` 절에 점유 조건을 걸어 **0행이면 점유 상실로 판정하는** 쓰기 방식"
  - id: TRM-072
    term: 체크포인트 upsert
    key: checkpointUpsert
    group: 실행기반
    definition: "갱신할 행이 없으면 삽입으로 흘러내리는 것. **시간여행이 저장소에 없는 id 로 갱신을 걸기 때문에 필요하다**"

# ── 처리 중 입력의 어휘 ──────────────────────────────────────
  - id: TRM-080
    term: 해석문
    key: interpretation
    group: 처리중입력
    definition: "LLM이 사용자 질의를 명료하게 재정리한 문장. 지식·API 탐색, SQL 생성과 의도 분류에 사용하며 사용자가 계획·결과와 함께 원래 의도에 맞는지 확인하는 근거다(REQ-015)"
    relation: "작업 계획(TRM-248)의 목적·조건 근거이며 그 자체가 작업 목록이나 실제 완료 상태는 아니다"
  - id: TRM-081
    term: 처리 중 입력의 세 갈래
    key: inflightIntent
    group: 처리중입력
    definition: "처리 중 들어온 입력의 분류 셋 — **변경**(`AMEND`) · **별개**(`NEW`) · **중단**(`STOP`)"
    note: "`AMEND`는 보강·교정의 이름을 가르지 않고 변경 항목과 무효화 시작 단계로 처리한다. 명시적 `STOP`은 분류 없이 즉시 처리하며, 애매한 자연어 입력은 사용자 확인으로 보낸다"
  - id: TRM-082
    term: 분류 불능
    key: UNSURE
    group: 처리중입력
    definition: "분류가 서지 않을 때. **차단형 확인으로 넘긴다** — 추측해서 갈래를 고르지 않는다(REQ-025)"
  - id: TRM-083
    term: 병행형 확인
    key: inlineConfirm
    group: 처리중입력
    definition: "턴을 **멈추지 않고** 분류 결과를 기본값으로 보여주며 되돌릴 창을 주는 것. **기본값이다**"
  - id: TRM-084
    term: 차단형 확인
    key: blockingConfirm
    group: 처리중입력
    definition: "`의도 확인 대기`(WT-03)로 전이해 **사용자 선택 없이는 진행하지 않는** 것. **되돌릴 수 없는 것이 걸렸을 때만** 쓴다"
    note: "확인 때문에 멈추는 것 자체가 비용이다"
  - id: TRM-085
    term: 일괄 승인
    key: batchApproval
    group: 처리중입력
    definition: "연속 실행에서 예정된 액션 전체를 한 번에 승인받는 것(REQ-026)"
    note: "**파라미터가 앞 액션의 결과에 의존하는 액션은 개별 승인한다** — 일괄에 넣으면 승인 시점에 무엇을 승인하는지 알 수 없다"
# ── 모델 공급과 비용 (ADR-004) ──────────────────────────────
# **「공급사」를 셋으로 가른 결과다.** 가르기 전에는 *약관을 심사하는 대상* 과 *값을 청구하는
# 곳* 이 한 낱말이었고, 같은 모델을 여러 경로로 사면 그 둘이 갈라진다.
  - id: TRM-086
    term: 모델 제작사
    key: modelVendor
    group: 비용
    definition: "모델을 만든 곳. 데이터 학습·저장 미사용 약관과 정보보호 인증의 **심사 대상이다**"
    note: "**과금 주체가 아니다.** 게이트웨이를 경유하면 청구는 경로가 한다(TRM-087)"
  - id: TRM-087
    term: 공급 경로
    key: supplyChannel
    group: 비용
    definition: "그 모델을 **실제로 사서 호출하는 통로.** 제작사 직접 API 이거나 게이트웨이(Bedrock · Vertex 등)다. **단가·엔드포인트·인증·리전이 여기 붙는다**"
    relation: "계획 1M 기준 단가의 가격 원천은 **공급 경로 · 모델 · 계량 단위 · 적용 시작일**별 관리 가격이다(REQ-613.price_history_contract). 기본·할인·프로모션·인상 가격을 수동 등록하며 같은 모델도 경로마다 요금이 다르므로 경로가 빠지면 기준을 설명할 수 없다"
    note: "**심사는 제작사와 경로 둘 다** 를 대상으로 한다 — 경유하면 데이터가 지나는 곳이 둘이다(ACT-007)"
  - id: TRM-088
    term: 계량 단위
    key: meteringUnit
    group: 비용
    definition: "**무엇을 세어 값을 매기는가** — 입력 토큰 · 출력 토큰 · 캐시 읽기 · 캐시 쓰기(유지 시간별로 갈릴 수 있다) · 시간 · 요청 건수 등"
    relation: "**공통코드 그룹으로 관리한다**(knowledge/sys/code.md 의 표 넷). 새 과금 정책의 대부분이 *새로운 계량 단위* 이므로 **코드 없이 행 추가로 대응된다**"
    note: "**항목 수를 고정 컬럼으로 두지 않는다** — 경로마다 항목 집합이 다르다"
  - id: TRM-089
    term: 과금 모드
    key: billingMode
    group: 비용
    definition: "**어떻게 곱하는가** — 토큰당(수량 × 단가) · 시간당 · 배치(할인율)"
    note: "**계량 단위와 달리 열려 있지 않다.** 새 모드는 산식이므로 개발이 필요하며 그것이 정상이다 — 산식을 데이터로 두면 검증이 불가능해지고 테스트가 못 잠근다. **시간당은 지금 범위 밖이고 자리만 둔다**(ADR-004 §5)"
  - id: TRM-090
    term: 계획 단가 기준 판
    key: priceBookVersion
    group: 비용
    definition: "월별 USD/100만 토큰 단가와 용도/조합/단위별 요금·수량·원 스냅샷/수동 가정·보완을 묶은 기준. SCR-016 저장 때는 수정 가능하며 같은 년월 SCR-021 월 기준 저장 성공과 함께 메모 포함 단가 전체를 고정한다. 개인 배분 실행과는 다른 시점이다"
    relation: "월별 토큰 풀에 적용한 기준 판을 남긴다(NFR-010·011) — 그래야 당시 단가의 실적/가정과 월 계획의 환산율·수동 보정 근거를 재현할 수 있다"
    note: "공급사의 실제 가격표 전체를 복제하거나 호출별 예상 비용을 산정하는 단가표가 아니다"
  - id: TRM-091
    term: effort
    key: effort
    group: 비용
    definition: "**모델별 추론 레벨**(낮음 · 중간 · 높음 등). 토큰 소모량과 응답 소요 시간에 영향을 준다. effort에서 단가를 자동 추론하지 않는다"
    relation: "**그래서 단가의 키가 아니라 사용량 기록의 축이다**(NFR-010). 소비량이 달라지므로 *어느 effort 로 얼마를 썼나* 를 남겨야 역할별 라우팅을 조정할 수 있다(ARCH-040)"
    note: "월 산정의 용도/모델/effort 소비 구성 행에 가격·수량 스냅샷을 보존한다. 동일 경로/모델/계량 단위의 동일 공개요금 근거는 일치해야 한다. 단가 산식은 REQ-613.calculation_contract를 따른다"
  - id: TRM-092
    term: 토큰 풀 보정률
    key: tokenPoolCorrectionFactor
    group: 비용
    definition: "대상 월의 확정 USD 기준 단가를 계획 통화로 한 번 환산한 뒤 총 토큰 풀 산정에 곱하는 관리자 수동 조정값. 기본1.0이며 변경 사유를 보존한다. 당월 실적 구성은 기준 단가에 반영하므로 최근3개월 괴리율 자동 보정 제안은 사용하지 않는다"
    note: "공급사 청구서·회계 정산값이나 개별 호출의 예상 비용이 아니다. 관리자가 기본1.0에서 수동 조정하면 근거를 남긴다"

# system 공통 운영 언어
  - id: TRM-142
    term: 시스템 관리자
    key: systemAdministrator
    group: 운영
    definition: "계정·메뉴·역할·권한·공통코드·다국어 메시지·시스템 설정과 공통 운영 기능을 관리하는 사람"
    relation: "AI 지식·정책을 관리하는 ACT-002~005와 구분하며 ACT-012가 이 역할을 맡는다"
  - id: TRM-143
    term: 유효 권한
    key: effectiveAuthority
    group: 인가
    definition: "현재 시점의 계정·역할·메뉴 상태와 역할 권한·개인 예외를 합성해 사용자가 실제로 행사할 수 있다고 판정한 메뉴 액션 집합"
    relation: "메뉴 노출과 서비스 API 허용은 같은 유효 권한을 사용하며 역할명이나 URL 자체는 허용 근거가 아니다"
  - id: TRM-144
    term: 메뉴 액션
    key: menuAction
    group: 인가
    definition: "메뉴 하나에서 허용할 수 있는 읽기·저장·내보내기·실행 권한 단위"
    relation: "역할 권한과 개인 예외가 이 단위로 부여되고 서비스 API가 요구하는 액션과 일치해야 호출이 허용된다"
  - id: TRM-145
    term: 공통코드
    key: commonCode
    group: 기준정보
    definition: "여러 화면과 서버가 같은 값의 뜻과 선택 후보를 공유하기 위해 사용하는 코드 그룹·코드·참조 속성"
    relation: "코드명은 다국어 메시지 값이며 시스템 보호 코드와 운영 코드의 변경 규칙이 다르다"
  - id: TRM-146
    term: 메시지 키
    key: messageKey
    group: 기준정보
    definition: "화면·서버·메뉴·공통코드가 문구를 직접 쓰지 않고 언어별 값을 찾기 위해 사용하는 안정된 식별자"
    relation: "소스 상수·시드 생성 또는 데이터가 만들고 관리 화면은 언어별 값을 채우거나 미사용 키를 정리한다"
  - id: TRM-147
    term: 캐시 버전
    key: cacheVersion
    group: 운영
    definition: "공통코드·메시지·시스템 설정의 원천 값이 바뀌었음을 다른 인스턴스와 클라이언트에 알리는 증가 번호"
    relation: "저장한 행 수가 아니라 성공한 저장 요청 한 번에 한 번 증가한다"
  - id: TRM-148
    term: 운영 이력
    key: operationalLog
    group: 감사
    definition: "로그인·API 사용·예외·배치 실행처럼 시스템에서 실제로 일어난 일을 사후 재구성하기 위해 업무 화면에서는 수정·삭제할 수 없게 한 기록"
    relation: "화면에는 저장·삭제 경로를 두지 않고 보존·파기는 별도 정책과 배치가 맡는다"
  - id: TRM-149
    term: 알림 요청
    key: notificationRequest
    group: 운영
    definition: "사용자가 계정·권한 관련 조치를 관리자에게 요청하고 관리자가 처리 또는 반려 상태와 사유를 남기는 기록"
    relation: "처리 판정 자체가 실제 계정·권한 변경을 수행하지 않는다"
  - id: TRM-150
    term: 사용자 공통 상태
    key: sharedUserState
    group: 운영
    definition: "즐겨찾기·그리드 설정·저장 조회조건·메뉴 사용 통계처럼 관리 콘솔과 portal이 함께 사용하는 사용자별 상태"
    relation: "portal 전용 대화·개인화 상태와 구분하며 system이 한 번만 소유한다"
  - id: TRM-152
    term: AI 처리 오류
    key: aiProcessingError
    group: 품질
    definition: "portal이 접수한 턴을 agent가 요청·응답 계약, 컨텍스트, 모델·도구, SQL 검증·실행 또는 응답 구성 단계에서 처리하지 못한 개별 발생 이력"
    relation: "system 예외 이력·사용자 품질 신고·턴 없는 저장 조회 실행 실패와 원본을 구분한다. 관련성 확인 뒤 오류·품질 조사에 함께 연결할 수 있다(REQ-115)"
  - id: TRM-154
    term: 적용 월
    key: effectiveMonth
    group: 정책
    definition: "사용자별 쿼터 등급이 효력을 갖는 달력 월. 당월과 지난 적용 월의 등급은 바꾸거나 지울 수 없고, 변경은 다음 적용 가능한 월부터 효력을 갖는다"
    relation: "다음 적용 가능한 월은 아직 시작하지 않은 미래 월이다. 그 월 시작 전 승인/저장된 변경은 첫 수동 예정 배분 생성 여부와 무관하게 해당 월부터 적용하며 월말 배치의 마감 효력 기준으로 사용한다(REQ-116·117·118)"
  - id: TRM-155
    term: 신규 일할 배정
    key: newUserProratedAllocation
    group: 정책
    definition: "월말 최종 마감 스냅샷에 없던 신규/재활성 이용자에게 해당 월 고정 기준과 등록/활성 유효일을 포함한 남은 일수로 자동 배정하는 한도. 월 전체 재생성과 별개이며 기존 사용자의 한도는 다시 나누지 않는다"
    relation: "사용자가 신청하는 추가 사용 승인(REQ-119)이 아니며, 기존 사용자의 한도를 다시 계산하지 않는다. 일반 배정·추가 승인과 구분해 기록한다"
  - id: TRM-156
    term: 승계 확정
    key: carriedOverConfirmation
    group: 정책
    definition: "월말 배치에서 다음 달 월 금융기준이 없어 새 행을 만들고 바로 직전 월 유효 금액·원 단가·당시 환산율/보정 기준을 그대로 이어받는 처리. 사용자·효력 등급/가중치는 두 경우 모두 다음 달 기준이다"
    relation: "다음 달 월 기준이 이미 저장돼 있으면 그 설정을 적용한다. 조회 실패/잘못된 값은 부재로 취급하지 않는다. 원 금융 월과 대상 월 등급/인원 출처를 구분한다(REQ-118)"
  - id: TRM-157
    term: 배분 가중치
    key: allocationWeight
    group: 정책
    definition: "쿼터 등급마다 두는 0보다 큰 수. 개인 기본 한도는 월 총 토큰 풀을 전 활성 사용자의 가중치 합으로 나눈 1단위에 본인 등급 가중치를 곱한 값이다. 순위가 높은 등급은 낮은 등급 이상의 값을 갖는다"
    not: "합이 100%인 등급별 배분 비율이 아니다 — 등급 인원이 적을수록 1인 몫이 커지는 역전을 막기 위해 비율 방식을 쓰지 않는다"
  - id: TRM-158
    term: 판정 고정
    key: policyDecisionPin
    group: 정책
    definition: "한 턴에서 프롬프트 규칙·지식·스키마/업무 API 카탈로그의 내용 버전을 처음 필요할 때 선택하고 같은 턴에서 유지하는 것. 접근 권한은 고정 대상이 아니며 매 접근 시점에 현재 유효값으로 검사한다(REQ-108)"
    relation: "사용자대기가 재판정 기준 시간(기본 60분)을 넘긴 뒤 이어가거나 원 질의를 별도 새 턴으로 요청하면 내용 버전 고정을 풀고 다시 선택한다. 이 시간은 권한 재검사를 미루는 시간이 아니다(REQ-108). 정책 스냅샷(REQ-103)과 다르다 — 스냅샷은 저장된 정책의 판이고, 판정 고정은 한 턴이 그중 어느 판을 썼는가다"
  - id: TRM-159
    term: 오류·품질 조사
    key: errorQualityInvestigation
    group: 품질
    definition: "담당자가 관련성을 확인한 채팅 오류·사용자 품질 신고·저장 조회 실행 실패·추적 감사 근거를 연결해 배정·분석·조치·검증하는 업무 단위(REQ-107·115)"
    not: "원본 발생 기록이나 자동 원인 묶음이 아니다. 조사 완료·신고 종결·저장 조회의 활성 복귀는 서로 다른 상태다"
  - id: TRM-161
    term: DB 스키마
    key: dbSchema
    group: 데이터
    definition: "DB 내부에서 테이블·뷰 등 물리 객체를 구분하는 이름 공간. sales·archive·dbo·public 등이 예이며, sales.orders와 archive.orders는 서로 다른 객체다"
    not: "DB 구조 정의 전체나 Hub의 스키마 카탈로그를 뜻하지 않는다. 별도 사용자/그룹 권한 단위를 만들지 않는 경계는 REQ-603을 따른다"
    relation: "카탈로그 객체의 DB 스키마명·물리 식별은 REQ-301이 갖는다"
  - id: TRM-162
    term: 스키마 카탈로그
    key: schemaCatalog
    group: 데이터
    definition: "Hub 공개 대상으로 선택한 테이블·뷰·컬럼의 구조 사실, 업무 의미·관계 및 정책을 등록한 업무 메타데이터 목록. 등록·검수·공개 범위는 REQ-301을 따른다"
    not: "DB 스키마 하나의 복제본이나 전체 DB 구조의 사본이 아니다. 카탈로그 항목은 개별 공개 테이블·뷰를 식별하며 서로 다른 데이터소스·DB 스키마의 항목을 포함할 수 있다"
# ── 관리 승인 ────────────────────────────────────────────────
  - id: TRM-165
    term: "원본 열람"
    key: originalRead
    group: "정책"
    definition: "현재 권한으로 허용된 컬럼·API 응답 경로의 값을 마스킹 없이 열람하는 처리. 마스킹되어 저장된 값의 복원이나 저장 사본 정책의 해제를 뜻하지 않는다"
    relation: "REQ-111·611"
  - id: TRM-166
    term: "마스킹 열람"
    key: maskedRead
    group: "정책"
    definition: "컬럼·API 응답 경로에 접근은 허용하되 공통 마스킹 변환을 적용한 값만 열람하게 하는 처리"
    relation: "REQ-611. 변환 자체는 TRM-047, 저장 사본은 TRM-183이다"
  - id: TRM-167
    term: "접근 제한"
    key: restrictedAccess
    group: "정책"
    definition: "현재 권한으로 해당 자산·컬럼·API 응답 경로를 이용하지 못하게 하는 처리. 가린 값을 보여 주는 마스킹 열람과 구분한다"
    relation: "REQ-103·111·611"
  - id: TRM-168
    term: "LLM 전송 동의"
    key: llmTransferConsent
    group: "정책"
    definition: "사용자가 안내받은 데이터 범위·목적·공급 경로에 대해 모델 전송을 허용한 의사. 직접 제공 자료는 전송 안내가 있는 입력창의 제출을 동의로 기록한다"
    relation: "REQ-106. 동의 범위 확인과 현재 권한·마스킹 검사는 실제 전송 전에 별도로 수행한다"
  - id: TRM-169
    term: "API 응답 경로"
    key: apiResponsePath
    group: "데이터"
    definition: "API 응답에서 필드나 배열 항목의 위치를 지정하는 등록 경로. 경로별 민감도·접근 처리를 판정하는 기준이다"
    relation: "REQ-111·608·611. 허용 경로 문법과 미등록 경로 처리는 REQ-111을 따른다"
  - id: TRM-170
    term: "정보주체 식별자"
    key: dataSubjectIdentifier
    group: "감사"
    definition: "처리한 자료가 누구에 관한 것인지 추적하는 식별 정보. Hub에서 요청·실행한 사용자와 자료의 정보주체는 다를 수 있다"
    relation: "REQ-111. 식별자와 민감값을 구분해 감사·마스킹한다"
  - id: TRM-171
    term: "민감값"
    key: sensitiveValue
    group: "정책"
    definition: "개인정보·업무 비밀 등 노출을 제한해야 하는 데이터 값. 등록된 컬럼·API 경로의 분류와 정책에 따라 마스킹·접근·전송을 통제한다"
    relation: "REQ-106·111·611"
  - id: TRM-172
    term: "불변 스냅샷"
    key: immutableSnapshot
    group: "감사"
    definition: "특정 요청·승인·판정 당시의 내용과 구성을 고정해 나중에도 같은 근거를 확인할 수 있게 보존한 판"
    relation: "REQ-103·107·305·306·607·608·612. 스냅샷 보존이 과거 접근 권한의 계속 사용을 허용하지는 않는다(REQ-108)"
  - id: TRM-173
    term: "생성 SQL"
    key: generatedSql
    group: "데이터"
    definition: "LLM이 제안한 조회 SQL. 서버의 구문·권한 검사와 조건 주입 전 내용으로, 실제 실행 SQL과 구분해 기록한다"
    relation: "REQ-104·107·611"
  - id: TRM-174
    term: "실제 실행 SQL"
    key: executedSql
    group: "데이터"
    definition: "서버가 검증하고 행 스코프·유효 기본 필터 등을 반영해 DB에 실제 전달한 SQL"
    relation: "REQ-104·107·611. 생성 SQL과 함께 내부 감사 근거로 남기며 Portal 노출 정책은 REQ-104를 따른다"
  - id: TRM-175
    term: "기본 필터 제외 명세"
    key: defaultFilterExclusion
    group: "정책"
    definition: "사용자 요청에 따라 제외를 제안하거나 확정한 기본 필터 항목의 구조화된 목록. 서버가 항목별 허용 여부를 검사하며 행 스코프는 제외 대상이 아니다"
    relation: "REQ-611. 저장된 조회는 제외 없음인 빈 목록까지 보존·복원한다(REQ-202·203·207)"
  - id: TRM-176
    term: "프롬프트 인젝션"
    key: promptInjection
    group: "정책"
    definition: "사용자 입력·지식·조회 결과 등에 섞인 문장이 상위 지시나 권한 통제를 바꾸도록 유도하는 공격 또는 입력"
    relation: "REQ-112. 자료와 지시를 구분하고 실제 권한·실행 통제는 서버가 강제한다"
  - id: TRM-177
    term: "접근 허용 그룹"
    key: "allowedAccessGroup"
    group: "정책"
    definition: "특정 업무 자산에 접근할 수 있도록 그 자산에 연결한 사용자 그룹 목록. 사용자 자신의 그룹 소속과 자산의 허용 그룹을 함께 판정한다"
    relation: "REQ-103·605. 매핑/소속 변경은 원 소유 현재 권한·기대 버전·참조 검증·전체 이력의 직접 저장이다."
  - id: TRM-178
