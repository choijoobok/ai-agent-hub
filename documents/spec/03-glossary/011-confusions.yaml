confusions:
  - pair:
      - "TRM-161"
      - "TRM-162"
    title: "DB 스키마 ≠ 스키마 카탈로그"
    severity: "객체 식별 정보와 사용자 권한 단위를 섞으면 중복 매핑과 잘못된 전체 공개가 생긴다"
    left: "DB 스키마는 물리 객체의 이름 공간이다(TRM-161)"
    right: "스키마 카탈로그는 선별 공개 객체의 업무 메타데이터 목록이다(TRM-162)"
    rule: "객체 식별은 REQ-301, 다중 DB 스키마와 별도 스키마 권한·중복 매핑 제외는 REQ-603, 예제·지식 참조는 REQ-302·REQ-303을 따른다"
  - pair:
      - "TRM-136"
      - "TRM-137"
    title: "차수 ≠ 작업흐름"
    severity: "일정과 승인 범위를 섞으면 다른 모듈의 소스까지 열린다"
    left: "**차수** — 이번 통합 출시에 무엇을 내는가"
    right: "**작업흐름** — 같은 차수 안에서 어느 모듈·계약이 어디까지 성숙했는가"
    evidence: "admin·agent를 먼저 만들고 portal 상세 설계를 뒤로 미루려 했을 때 전역 단계 하나로는 두 상태를 함께 표현할 수 없었다(ADR-006)"
  - pair:
      - "TRM-102"
      - "TRM-003"
    title: "노드 ≠ 스텝"
    severity: "가장 자주 어긋난다"
    left: "**노드** — LangGraph4j 가 정한 그래프의 작업 하나. 쓰임은 **실행 편의**"
    right: "**스텝** — Hub에서 식별·관측하는 모델 응답 실행 1회. 공급자가 자동 생성한 후속 실행도 포함하고 같은 실행의 청크/콘텐츠 블록은 묶는다. 실제 계량 범위의 원장과 연결한다"
    evidence: "PoC 에서 훅을 전 노드에 걸었더니 스텝 이력이 5행이 아니라 **9행**으로 나왔다 — `reason` 노드와 `tool` 노드가 각각 행을 만들었다"
    rule: "**노드·공급자 콘텐츠 step과 모델 응답 실행을 구분한다.** 스텝 행이나 사건 수가 토큰 사용량은 아니며 호출별 유효 계량값을 합산한다. 훅은 실제 호출 경계와 일치할 때만 기록 근거로 사용한다(REQ-107·NFR-010)"
  - pair:
      - "TRM-012"
      - "TRM-004"
    title: "점유 토큰 ≠ 회차"
    left: "**점유 토큰** — 어느 **인스턴스**가 처리했나. 인프라 층. 점유가 바뀔 때 오른다"
    right: "**회차** — 입력 변경으로 되돌린 어느 **처리 흐름**인가. 업무 흐름 층. 되돌려 다시 할 때 오르며 중단 후 재시도의 실행 시도와 구분한다(REQ-013)"
    evidence: "**직교한다.** 같은 턴의 한 회차가 유효한 대기 후 이어가기로 여러 점유에 걸칠 수 있고, 한 점유 안에서 회차가 오를 수도 있다(교정). 점유 만료로 중단된 뒤 원 질의를 새 턴으로 요청하면 원 회차를 이어받지 않는다(REQ-013). 과거 PoC에서는 fence는 1로 고정인데 회차만 0→1로 바뀌었다"
    rule: "둘 다 이력에 함께 남긴다. 하나로 합치지 않는다"
  - pair:
      - "TS-04"
      - "TS-05"
    title: "중단 ≠ 실패"
    left: "**중단** — 원 턴과 현재 시도가 끝난 종결 상태. 서버 재시작 · 점유 만료 · 대기 만료 · 사용자 중단이 원인이다. 원 턴을 되살릴 수 없으며 원 질의로 새 턴을 요청하는 조건은 REQ-013.request_boundary를 따른다. 이전 실행용 상태는 REQ-109에 따라 정리한다"
    right: "**실패** — 해당 시도의 처리 불가가 확정된 종결. 원 턴은 재개하지 않으며 원 질의의 별도 새 턴 요청은 현재 권한·쿼터 등 REQ-013 조건으로 처리한다"
    rule: "**액션 실패를 보고할 때 이 구분을 담는다** — 사용자의 다음 행동이 갈린다"
  - pair:
      - "REQ-013"
      - "REQ-024"
    title: "재시도 ≠ 처리 중 변경으로 인한 되돌림 ≠ 결과 교정 재요청"
    severity: "셋 다 *다시 한다* 인데 전부 다르다"
    left: "**원 질의의 새 턴 재시도**(REQ-013.request_boundary) — 원 턴의 모든 상태에서 원 질의로 별도의 새 턴을 요청한다. 원 턴의 진행/종결은 유지한다. 새 턴이 자체 회차·실행 시도로 첫 단계부터 처리하므로 원 턴의 회차를 올리거나 승계하지 않는다. **이어가기**는 만료되지 않은 유효 사용자대기에서 같은 턴/시도를 계속하는 경우다"
    middle: "**처리 중 변경으로 인한 되돌림**(REQ-030~035 의 `AMEND`) — 턴이 처리 중일 때, 변경이 이전 체크포인트를 무효화하면 **되돌려서** 다시 한다. 그때만 회차를 올린다"
    right: "**결과 교정 재요청**(REQ-024) — 턴이 **완료**됐을 때. **새 턴**을 만든다. 회차 해당 없음"
  - pair:
      - "TRM-044"
      - "NFR-001"
    title: "조회 계획 ≠ DBMS 실행 계획(EXPLAIN)"
    left: "**조회 계획** — 실행 전에 사용자에게 **업무 용어로** 보여주는 예정 내역. 물리명과 SQL 은 보여주지 않는다"
    right: "**DBMS 실행 계획(EXPLAIN)** — DB 가 쿼리를 어떻게 처리할지에 대한 내부 계획. 대량 조회 방어의 사전 판정(NFR-001)에 쓴다"
    rule: "이름이 비슷하지만 **대상도 독자도 다르다**"
    note: "조회 계획은 액션이 포함된 턴에서 실행할 액션과 순서도 담게 되어(REQ-026) **이름과 범위가 어긋난 상태다.** 용어를 바꿀지는 미확정이다"
  - pair:
      - "TRM-025"
      - "TRM-026"
    title: "질의 즐겨찾기 ≠ 저장된 조회"
    left: "**질의 즐겨찾기** — **자연어 문장**을 저장한다. 실행하면 새 턴이 생기고 LLM 을 거친다. 결과가 매번 달라질 수 있고 **토큰을 소모한다**"
    right: "**저장된 조회** — REQ-202의 성공한 조회 실행 요청을 보존·복원한다. SQL과 업무 인자·기본 필터 제외를 함께 복원해 같은 agent 실행 경로를 사용하며 턴·LLM 호출·토큰 사용량은 없다. 현재 데이터·권한·정책에 따라 결과는 달라질 수 있다"
  - pair:
      - "TRM-113"
      - "REQ-107"
    title: "체크포인트 ≠ 감사 이력"
    severity: "같은 DB 에 있고 같은 턴을 다루지만 목적이 다르다"
    left: "**체크포인트** — 유효한 현재 시도를 **어디서부터 이어가나.** 완료·실패·중단된 시도 및 무효화된 회차는 사용 차단·정리한다(REQ-109). 중단 재시도의 실행 입력은 아니다. **갱신된다**"
    right: "**감사 이력** — **무슨 일이 있었나.** 보관 기간 정책을 따른다. **append-only** 이며 지난 행을 수정하지 않는다"
    rule: "원천은 하나이고 표가 둘인 것은 **분업이다** — 어느 한쪽을 다른 쪽으로 대신할 수 없다"
  - pair:
      - "TRM-110"
      - "TS-04"
    title: "인터럽트 ≠ 중단(상태)"
    left: "**인터럽트** — LangGraph4j 가 노드 진입 직전에 멈추는 것. **재개 가능한 멈춤**을 뜻하며 **승인 대기도 인터럽트다**"
    right: "**중단** — 턴 상태 여섯 중 하나(TS-04)"
    rule: "승인 대기로 멈춘 것은 인터럽트지만 **중단 상태가 아니다.** 그리고 **점유를 잃었을 때는 인터럽트가 아니라 예외여야 한다** — 점유를 잃은 인스턴스는 그 턴에 아무 권한이 없어 *재개 가능한 멈춤* 이 성립하지 않는다"
  - pair:
      - "TRM-040"
      - "TRM-041"
    title: "대상 시스템 ≠ 데이터소스"
    left: "**대상 시스템** — 실행·조회용 업무 API를 제공하는 레거시 시스템. **개별 API 등록 시 이 API를 제공하는 시스템으로 지정한다**"
    right: "**데이터소스** — 조회할 DB/DW 연결 하나. **테이블·컬럼이 여기 귀속된다**"
    rule: "**둘은 서로 관계를 갖지 않는다**(ARCH-030) — *이 대상 시스템의 DB 는 저 데이터소스* 라는 연결을 두지 않는다. 조회 경로와 실행 경로가 독립한 두 축이고 권한 매핑도 각각 따로 걸린다"
  - pair:
      - "TRM-045"
      - "TRM-046"
    title: "사용자 그룹 ≠ 쿼터 등급"
    left: "**사용자 그룹** — 무엇에 **접근**할 수 있나. **여러 개** 가질 수 있고 범위는 합집합이다"
    right: "**쿼터 등급** — 월 기본 토큰 배분 몫을 정한다(TRM-046). 모델 선택지는 그룹·등급과 무관하게 공통이다(TRM-232). 사용자별로 하나를 부여하며 사용자 그룹의 접근 범위와 독립이다"
  - pair:
      - "TRM-133"
      - "TRM-134"
    title: "Hub 모듈 ≠ 업무 확장"
    severity: "**낱말 하나로 규칙이 잘못 적용된다**"
    left: "**제품 모듈** — system·admin·portal·agent. 한 애플리케이션과 AI 전용 DB를 공유하되 소스·API·쓰기 소유권을 나눈다(ARCH-010 · ADR-007)"
    right: "**업무 확장** — 함께 짓는 업무 시스템(WMS 등). **자기 업무 DB 를 소유한다.** 고객사마다 는다"
    rule: "**ARCH-010의 제품 모듈 경계는 Hub 내부 넷에만 적용한다.** 업무 확장을 제품 모듈이라 부르면 고객사 업무 DB의 독립 수명주기와 ARCH-017의 별도 데이터소스 규칙이 흐려진다. 늘어나는 것은 제품 모듈이 아니라 **대상 시스템과 업무 확장**이다."
  - pair:
      - "TRM-136"
      - "TRM-133"
    title: "차수(RM-Pn) ≠ 방법론 단계(P0~P6)"
    severity: "**같은 글자 `P1` 이 두 뜻이다**"
    left: "**차수** `RM-P1` — *무엇을 언제 출시하나*. 제품 출시 단계이며 spec 항목의 `roadmap:` 이 갖는다"
    right: "**단계** `P1` — *지금 어디까지 설계했나*. 방법론 단계이며 `project.state.yaml` 의 `current.phase` 가 갖는다"
    rule: "**차수 하나를 만들기 위해 P0~P6 을 한 바퀴 돈다**(00-charter/_index.yaml `roadmap_notes`). 그래서 같은 화면이 다음 차수에 다시 P1(요구사항)부터 시작할 수 있으며 **그것은 후퇴가 아니다.** spec 에서 차수를 적는 필드 이름은 `roadmap:` 이다 — `phase:` 로 적으면 두 축이 같은 글자를 쓴다."
  - pair:
      - "TRM-049"
      - "TRM-177"
    title: "신원 매핑 ≠ 접근 허용 그룹"
    left: "신원 매핑은 대상 시스템·데이터소스에서 누구의 신원으로 처리하는지 연결한다"
    right: "접근 허용 그룹은 어떤 업무 자산을 사용할 수 있는지 판정하는 근거다"
    rule: "매핑이 있어도 자산 접근 권한이 자동으로 생기지 않는다. 현재 신원 매핑과 승인된 그룹·자산 정책을 함께 검사한다(REQ-103·609)"
  - pair:
      - "TRM-054"
      - "TRM-048"
    title: "행 스코프 ≠ 기본 필터"
    left: "행 스코프는 사용자가 볼 수 있는 행을 제한하는 필수 권한 조건이다"
    right: "기본 필터는 평소 조회에서 적용하는 업무 조건으로, 항목별로 검증한 사용자 제외 요청을 반영할 수 있다"
    rule: "사용자 요청이나 기본 필터 제외 명세로 행 스코프를 해제하지 않는다(REQ-611)"
  - pair:
      - "TRM-179"
      - "TRM-168"
    title: "사용자 실행 승인과 LLM 전송 동의"
    left: "사용자 실행 승인은 실제 상태 변경의 대상·순서·전체 파라미터를 사용자가 최종 확인한다."
    right: "LLM 전송 동의는 안내한 데이터 범위·목적·경로의 모델 전송을 허용한다."
    rule: "관리자 자산 직접 저장과 별개이고 어느 하나가 다른 통제를 대신하지 않는다(REQ-005·106)."
  - pair:
      - "TRM-173"
      - "TRM-174"
    title: "생성 SQL ≠ 실제 실행 SQL"
    left: "생성 SQL은 LLM이 제안한 내용이다"
    right: "실제 실행 SQL은 서버 검증·조건 주입을 거쳐 실제 DB 호출에 사용한 내용이다"
    rule: "둘을 감사에서 구분해 확인하고 Portal에는 노출하지 않는다(REQ-104·107·611)"
  - pair:
      - "TRM-165"
      - "TRM-183"
    title: "원본 열람 권한 ≠ 원본 그대로 저장할 권한"
    left: "원본 열람은 현재 권한으로 허용된 원래 값을 화면에 제공하는 처리다"
    right: "저장 사본은 후속 참조·감사를 위해 마스킹해 보존하는 자료다"
    rule: "원본 열람 권한으로 저장용 마스킹을 생략하거나 이미 마스킹된 과거 값을 복원하지 않는다. 실행 파라미터 임시본은 별도의 제한된 예외다(REQ-005·111·611)"
  - pair:
      - "TRM-237"
      - "TS-03"
    title: "개인 실행 대기 ≠ 사용자대기"
    left: "개인 실행 대기는 동시 실행 한도가 날 때까지 서버 접수 순서에서 기다리는 것이다"
    right: "사용자대기는 실행 승인·확인·추가 정보 등 사용자의 응답을 기다리는 것이다"
    rule: "접수 순서·실행 한도와 사용자대기 만료/응답 계약을 섞지 않는다. 이어가기 응답도 개인 실행 순서를 따른다(REQ-005·036)"
