terms:
  - id: TRM-261
    term: "대상 시스템 허용 연결"
    key: "targetSystemConnection"
    db_token: "TARGET_SYSTEM_CONN"
    db_token_reason: "30자 테이블 제한에 맞춰 connection을 기존 의미가 명확한 CONN으로 축약한 물리 설계 초안"
    group: "정책"
    definition: "대상 시스템에 YAML로 소속된 정확 연결 ID와 비밀 없는 기본 표시 메타/DB 보완. 기본 연결·화면 허용 집합 편집은 두지 않는다."
    relation: "REQ-604·ADR-038. 현재 로드 정의의 안전한 표시·존재/소속과 관리자 표시 재정의를 구분하며 제거 참조는 보존·차단·경고한다."
  - id: TRM-262
    term: "데이터소스 적용 가능 그룹"
    key: dataSourceGroup
    group: "정책"
    definition: "하위 카탈로그의 테이블·컬럼에 매핑할 수 있는 관리 그룹의 데이터소스별 집합 원소"
  - id: TRM-263
    term: "연동 자산 변경 처리"
    key: assetCommand
    group: "정책"
    definition: "대상 시스템·데이터소스의 한 성공 변경 명령과 입력 일치·반영 결과를 보존하는 근거. HTTP 추적이나 자산 승인 요청과 구분한다"
