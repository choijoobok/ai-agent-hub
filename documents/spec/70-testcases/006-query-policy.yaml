    then: "두 값과 모두 일치하는 행만 조회한다. deleted_yn의 Y·NULL은 N과 일치하지 않아 제외된다. 선행 0 보존·빈값의 NULL 치환 금지. OFF/유효 해제 외 필터 유지"
    verification: "등록값 제외 방식으로 뒤집거나 두 기본 필터를 OR로 적용하면 실패해야 한다. 실제 SQL/DB 시험은 제품 구현 후 수행한다."
