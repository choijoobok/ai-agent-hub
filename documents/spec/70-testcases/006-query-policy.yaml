  - id: TC-0126
    feature: FEAT-012
    usecase: UC-026
    reqs: [REQ-611, REQ-103, REQ-601]
    screens: [SCR-009]
    type: business_exception
    title: "기본 상태 조건과 타입·NULL 경계"
    actor: ACT-003
    given: "컬럼별 상태값·선행0·NULL 행·useYn/removable"
