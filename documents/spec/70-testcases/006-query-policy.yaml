    then: "서버 검증한 해제만 반영한다. 스코프/기본 필터 AND, 필수 조건은 남은 후보 OR이며 일부 해제로 나머지 미충족을 통과시키지 않는다. 남은 후보 0개는 제약 없음이지만 독립 통제 유지. 실제 충족·미충족 대안·비사용·해제를 구분해 결과 안내하며 날짜 불필요를 해제로 기록하지 않는다."
    verification: "반대 규칙을 허용하면 실패해야 한다. 목업은 편집/전환/잠금 시연이며 실제 서버·DB·파서·정책 집행은 제품 구현 후 시험한다."
    status: planned
