  - id: TC-0127
    feature: FEAT-012
    usecase: UC-026
    reqs: [REQ-611, REQ-103, REQ-601]
    screens: [SCR-009]
    type: business_exception
    title: "필수 조건 OR와 자료형·30일 경계"
    actor: ACT-003
    given: "사용 ON인 주문번호 동일 값과 주문일 날짜 범위 최대 차이 30, 문자/숫자/날짜 후보"
    when: "주문번호만·기간만·둘 다 없음·31일만·31일과 주문번호·문자 범위·타입 변경을 요청한다"
    then: "주문번호만 또는 30일 이하 범위만 충족하면 통과한다. 둘 다 미충족·31일만이면 보완/거부한다. 31일과 정상 주문번호는 주문번호로 통과하고 사용자 날짜 조건은 유지한다. 문자 범위는 설정 거부, 동일값 전환 시 최대 차이 정리. 참조마다 하나 이상 실제 SQL/동일 바인딩 검증"
    verification: "OR를 AND로 바꾸거나 미충족 후보 때문에 정상 주문번호 조회를 거부하면 실패해야 한다. 다른 테이블/한 분기의 충족을 전체로 재사용하거나 SQL OR 우회를 허용해도 실패해야 한다. 실제 서버 시험은 구현 후 수행한다."
    status: planned

  - id: TC-0128
    feature: FEAT-012
    usecase: UC-026
    reqs: [REQ-611, REQ-103, REQ-601]
    screens: [SCR-009]
    type: business_exception
    title: "세 조건 사용/해제 집행과 결과 안내"
    actor: ACT-003
    given: "각 종류 useYn/removable 조합·현재 리비전·명시 사용자 근거"
