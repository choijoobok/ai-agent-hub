# 조회 제약의 소유 화면과 실행 경계 — 구현 전 설계 시험
testcases:
  - id: TC-0121
    feature: FEAT-012
    usecase: UC-026
    screens: [SCR-009]
    type: business_exception
    title: "두 입력 값 차이와 인증 바인딩 분리"
    actor: ACT-003
    given: "REQ-611의 기간 상한 항목 하나만 사용 중이며 사용자 입력 두 개와 서버 인증 신원 바인딩이 있다"
    when: "누락·역전·형식 오류·상한 초과·경계값을 입력하거나 사용자 ID 바인딩을 요청 값으로 덮으려 한다"
    then: "정상 경계만 수락하고 나머지는 SQL 실행 전에 거부/보완 질문한다. 인증 바인딩은 서버 신원에서만 얻는다"
    verification: "잘못된 차이를 WHERE false에 넣어 빈 결과 성공으로 처리하거나 신원 덮어쓰기를 허용하면 실패해야 한다"
    status: planned
  - id: TC-0122
    feature: FEAT-012
    usecase: UC-026
    screens: [SCR-009]
    type: business_exception
    title: "입력 검증과 실제 SQL 조건 일치"
    actor: ACT-003
    given: "등록한 기간 후보를 충족하는 두 값과 대상 컬럼이 있으며 다른 충족 후보는 없다"
    when: "SQL이 다른 컬럼/값을 사용하거나 조건을 생략하거나 OR·하위 질의·UNION의 일부 참조에서 제약을 우회한다"
    then: "모든 실제 대상 참조에 등록 후보 중 하나 이상과 동일 바인딩이 적용됐음이 검증되지 않으면 실행하지 않는다"
    verification: "모델의 충족 표식 또는 두 값 차이만 검사하여 우회 SQL이 실행되면 실패해야 한다. 지원 밖 구문은 검증 불가로 처리한다"
    status: planned
  - id: TC-0123
    feature: FEAT-012
    usecase: UC-026
    screens: [SCR-003, SCR-009]
    type: business_exception
    title: "현재 정책 역조회와 카탈로그 버전 복원 분리"
    actor: ACT-003
    given: "현재 조회 제약 2건과 이전 카탈로그 버전, 정책 조회 실패/권한 제한 상태"
    when: "카탈로그를 복원하고 조회 제약 셀을 열거나 정책을 변경한 뒤 저장 조회를 새로 실행한다"
    then: "복원은 정책을 바꾸지 않는다. 조회 성공 시만 유효 건수를 표시하고 catalogId·QUERY_CONSTRAINT로 정책 화면을 연다. 새 실행은 현재 정책 리비전으로 재검증한다"
    verification: "미로드/실패를 0건으로 표시하거나 카탈로그 복사에 정책 사본을 포함하거나 해제 불가 제약을 선택 제외하거나 해제 허용·명시 근거를 검증하지 않으면 실패해야 한다"
    status: planned

  - id: TC-0071
    feature: FEAT-007
    features: [FEAT-003, FEAT-004, FEAT-008]
    usecase: UC-026
    reqs: [REQ-611, REQ-111]
    screens: [SCR-003, SCR-004]
    type: business_exception
    title: "소스 마스킹 유틸의 정보 유형 목록·공통 적용·실패 처리"
    actor: ACT-002
    given: "회사 합의 구현 유형과 길이/형식별 가상 기대 결과, 이름/유선·휴대전화/주소/차량/이메일/연봉/계약금, 미지원 코드·자료형 불일치·유형 목록/변환 실패·기존 이력"
    when: "카탈로그/API가 같은 유틸 유형을 조회·선택·저장/이력 조회하고 MASK 열람/개인정보 사본 저장을 수행한다"
    then: "유틸의 실제 지원 유형만 {value,text}로 같은 원천에서 제공하고 원응답 text를 label(item.text)로 번역해 기존 SelectOption의 완성된 text로 전달한다. 언어 전환·번역 수정/누락으로 선택·저장 코드와 실제 변환이 달라지지 않는다. 필드에 안정 유형 코드를 보존한다. 실제 변환은 회사 요건대로 같은 유틸을 적용한다. 규칙/정규식/자릿수 편집·별도 정의 원장/이력 메뉴는 없으며 목록 실패 시 기존 선택 보존·편집/검수 잠금, 실행 실패/미지원은 원값 노출/저장으로 대체하지 않는다."
    verification: "P4 구현 후 계약/통합/E2E 및 고객사 합의의 길이·형식별 기대 결과 시험. 미구현 후보 제공·프런트 별도 목록·공통 콤보에 메시지 키를 미번역 전달·별도 코드/명칭 필드 계약 추가·한글 표시명을 저장/호출 값으로 사용·누락/중복 유형 코드/메시지 키·언어 전환으로 선택 유실·임의 코드/자료형 수락·첫 값 자동 대체·금액 가림을 0원으로 치환·실패 원값 반환/저장·소스 변경으로 과거 사본 재변환을 허용하면 실패해야 한다. 목업 검증은 선택 후보/입력 보존만 확인한다."
    screen_cases: ["documents/screen/admin/hub/catalog/requirements.md#CAT-37", "documents/screen/admin/hub/business-api/requirements.md#SCR-004-UI-09"]
    status: planned

  - id: TC-0072
    feature: FEAT-007
    features: [FEAT-008]
    usecase: UC-026
    reqs: [REQ-103, REQ-105, REQ-111, REQ-601]
    screens: [SCR-003, SCR-004]
    type: business_exception
    title: "통합 그룹/예외 편집의 영역별 권한·참조·소유 이력"
    actor: ACT-003
    given: "카탈로그 조회 전용 관리자와 READ·SAVE 보유 관리자, API의 정책/정의별 권한 관리자, 현재 소유 구성과 유효 마스킹 참조가 있다. 카탈로그 정의·정책 권한은 CR-055에 따라 같은 SAVE로 통합한다"
    when: "소유 화면에서 그룹/예외를 추가·제거하거나 허용 영역 밖 필드를 직접 전송하고, 중복·그룹 밖 대상·미등록 응답 경로·MASK 원천 누락·오래된 기준 리비전으로 저장한다"
    then: "영역별 현재 권한과 필드 허용 범위·참조·기대 리비전을 검사해 잘못된 변경을 거부하고 기존 권한/입력/다른 구성을 보존한다. 정상 저장은 소유 현재 구성과 전체 이력·사유에 원자 반영한다. 독립 그룹 매핑 메뉴/저장소/리비전은 없다"
    verification: "P4 계약·통합에서 카탈로그 READ 전용의 저장 허용 또는 READ·SAVE 보유자의 정의/그룹/예외 저장에 별도 정책 권한을 요구하면 실패해야 한다. API의 분리 권한은 소유 계약을 유지한다. 누락 탭을 삭제로 해석·부분 이력·미지원 MASK·전송 동의 우회·조회 실패의 0건 처리를 허용해도 실패해야 한다. 목업에서는 기존 입력 보존·로컬 행 추가/제거·잠금만 확인한다"
    screen_cases: ["documents/screen/admin/hub/catalog/requirements.md#CAT-41", "documents/screen/admin/hub/business-api/requirements.md#API-ACL-01"]
    status: planned

