testcases:
  - id: TC-0409
    feature: FEAT-040
    usecase: UC-006
    screens:
      - SCR-001
      - SCR-011
    type: business_exception
    title: 서로 다른 원장의 같은 명령 UUID
    actor: ACT-004
    given: ENT-019와 ENT-099의 다른 기능/주체가 같은 UUID로 동시에 명령
    when: 명령 해시 공통 잠금에서 모든 활성 원장/종료키를 검사
    then: 한 소유 효과만 발생하고 다른 입력은409. 한 원장 파기 후 다른 원장의 유효 결과가 가려지는 상태가 생기지 않는다.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-04010
    feature: FEAT-040
    usecase: UC-006
    screens:
      - SCR-005
      - SCR-011
    type: business_exception
    title: 동형 이력과 삭제·파기 경쟁
    actor: ACT-004
    given: 현재 부모/전체 자식의 두 판, 보호 등록과 파기 경합
    when: 삭제 사건 생성·정확 과거판 조회·보호/파기 동시 수행
    then: DELETE는 직전 원값+새 결과판, 이전 적용판 불변. 전체 열 타입/null 일치·루트만 HIST_DTM·자식은같은HISTORY_NO. 보호가 먼저면 파기없음, 파기가 먼저면 재현실패. 현재값 대체 금지.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-04511
    feature: FEAT-045
    usecase: UC-042
    screens:
      - SCR-021
    type: business_exception
    title: 월 FINAL 파기 뒤 재실행 금지
    actor: ACT-004
    given: 소비 보호가 끝난 보존 종료 월과 원 입력의 개인정보
    when: 월 종결표와 원 입력/결과 전체 파기 후 같은 월 FINAL 재요청
    then: 개인/등급/금액/실행시각은 남지 않고 월+FINALIZED만 남는다. 같은 월 재배정 불가, 다른 월 정상. 파기중실패는 전부롤백.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-04512
    feature: FEAT-045
    usecase: UC-042
    screens:
      - SCR-005
      - SCR-021
    type: business_exception
    title: 0명 최초활성과 일할 입력 재현
    actor: ACT-004
    given: 마감0명 이후 최초 활성, 추가사용자 활성과 월초 지연복구
    when: FINAL과 ensureAllocation 및 catch-up 중복 실행
    then: 원 마감 입력과 최초활성/개별입력의 서로 다른 참조 보존. 사용자별1회, 분모1회, 재활성중복없음. ASSSESSED의NULL/0분모는DB제약실패.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-0243
    feature: FEAT-024
    usecase: UC-011
    screens:
      - SCR-010
    type: business_exception
    title: 태그 정규화와 연결 독립
    actor: ACT-004
    given: 대표 WMS와 공백·전각·대소문자 표현, 동일 부모 동의어
    when: 중복 저장과 검색 후 태그 OFF/표현 변경
    then: 정규화동일 대표/동의어 중복 거부, 원문보존. 다른태그동의어일치는복수검색. 연결지식본문/판/매핑불변이며OFF검색경로만제외.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
