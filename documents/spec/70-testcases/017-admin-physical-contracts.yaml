  - id: TC-04012
    feature: FEAT-040
    usecase: UC-006
    screens:
      - SCR-004
      - SCR-019
    type: business_exception
    title: 도구/API 소유와 내부값 대응
    actor: ACT-004
    given: 같은 숫자 ID의 API/도구 필드 및 순수내부 바인딩
    when: 도구저장에 API자식삽입 또는 referenceNo=null 내부값대응 저장
    then: 혼입거부, 정상내부값대응성공. 도구HIST는도구루트만참조하며 API 원장/이력에부수쓰기없음.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-0138
    feature: FEAT-013
    usecase: UC-020
    screens:
      - SCR-013
    type: business_exception
    title: 전체 프롬프트 검토의 미저장 편집과 지연 결과
    actor: ACT-004
    given: 현재전체규칙+미저장추가/삭제/사용전환/설명변경
    when: 완전집합을병합해검토하고검토중다른규칙변경
    then: 서버전체규칙+편집집합실제가공본만검토. 설명제외,부분조회차단,늦은응답은원지문에만귀속. 같은키재조회로실제호출중복없음.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
