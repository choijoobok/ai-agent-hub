  - id: TC-0058
    feature: FEAT-005
    usecase: UC-006
    screens:
      - SCR-005
    type: business_exception
    title: 자체 자격 초기화 응답 유실
    actor: ACT-004
    given: LOCAL 이용자와EXTERNAL 이용자 및 같은 초기화명령재전송
    when: 임시비밀번호발급성공후응답유실·원키결과조회
    then: LOCAL만첫응답1회표시, 원장/HIST/로그에는비밀없음. 같은키재발급없고SECRET_NOT_REPLAYABLE. 잠금해제가그룹/기간권한을풀지않음.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
