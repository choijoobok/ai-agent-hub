    verification: SLICE-012의 실제 저장/현재 정책 조회 시험.
    status: planned
  - id: TC-0139
    feature: FEAT-013
    usecase: UC-020
    screens: [SCR-013]
    type: normal
    title: 프롬프트 규칙 변경 집합의 정상 저장
    actor: ACT-004
