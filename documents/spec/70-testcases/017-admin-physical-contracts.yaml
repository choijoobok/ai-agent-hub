testcases:
  - id: TC-00325
    feature: FEAT-003
    usecase: UC-007
    screens: [SCR-003]
    type: normal
    title: 카탈로그 편집 영역의 정상 전체 저장
    actor: ACT-004
    given: 현재 SAVE 권한과 기대 리비전이 일치하고 소유 입력·참조 검증을 통과한 카탈로그 편집본
    when: 허용된 편집 영역을 새 원 명령 키와 사유로 저장
    then: 편집 영역과 소유 전체 HIST·부모 리비전·원 결과를 한 번 반영하고 다른 탭의 현재값과 관측값을 보존한다. 저장 자체로 미검수 구성을 VERIFIED로 올리지 않는다.
    verification: SLICE-003의 실제 저장·정확 판 재조회 시험. 공통 원자성 시험은 SLICE-040 근거를 재사용한다.
    status: planned
  - id: TC-00432
    feature: FEAT-004
    usecase: UC-018
    screens: [SCR-004]
    type: normal
    title: 업무 API 소유 구성의 정상 저장
    actor: ACT-004
    given: 현재 권한·기대 판과 유효 연결 참조를 갖춘 API 마스터 및 허용 탭 편집본
    when: 변경 사유와 새 원 키로 저장하고 적용 판을 재조회
    then: API 소유 마스터/자식과 전체 HIST·결과가 같은 판으로 조회된다. 실제 업무 호출을 실행하지 않으며 도구 소유 자식은 변경하지 않는다.
    verification: SLICE-004의 실제 API 저장 어댑터와 DB 연결 시험.
    status: planned
  - id: TC-0073
    feature: FEAT-007
    usecase: UC-026
    screens: [SCR-003]
    type: normal
    title: 카탈로그 그룹·필드 예외의 정상 저장
    actor: ACT-004
    given: 현재 편집 권한·유효 그룹 참조와 필드 허용 범위를 만족하는 소유 구성
    when: 소유 카탈로그의 기대 판과 사유를 붙여 그룹/필드 예외 영역을 저장
    then: 소유 현재 구성과 전체 HIST에 함께 반영되고 다음 현재 정책 조회에 나타난다. 독립 그룹 매핑 원장이나 중복 리비전을 만들지 않는다.
    verification: SLICE-007에서 실제 카탈로그 저장/정책 조회 연결을 검증한다.
    status: planned
  - id: TC-0091
    feature: FEAT-009
    usecase: UC-026
    screens: [SCR-009]
    type: normal
    title: 행 스코프 구성과 파라미터의 정상 저장
    actor: ACT-004
    given: 카탈로그 선택과 현재 권한·기대 판이 유효하고 스코프별 파라미터 추출이 최신인 편집본
    when: 부모의 행 스코프 구성과 소유 파라미터 전체를 저장
    then: 안정 ID와 본문·파라미터 설명이 유지되고 부모/자식·전체 HIST·원 결과가 원자 반영된다. 서버 예약 신원은 실행 시 서버 공급 규칙으로 남는다.
    verification: SLICE-009의 실제 저장/재조회 시험. 실행 SQL의 적용 검증은 실행 소유 슬라이스다.
    status: planned
  - id: TC-0108
    feature: FEAT-010
    usecase: UC-021
    screens: [SCR-014]
    type: normal
    title: 고정 안내 본문의 정상 저장
    actor: ACT-004
    given: 고정 안내 코드 하나의 현재 판과 SAVE 권한·유효한 형식/본문
    when: 기대 판과 사유·원 키를 붙여 본문 저장
    then: 지정 코드의 형식/원문과 전체 HIST·새 판·원 결과만 반영되고 다른 안내 코드는 유지된다. 재조회 시 원문과 적용 판이 일치한다.
    verification: SLICE-010의 실제 저장/재조회 시험. 선행 CR-046 고정 코드 키 기반은 ManagedTargetKeysTest/ManagedNaturalKeyLiveTest에서 형식·소유 집합·원장/재수신·동형 HIST와 숫자 소유 거부를 검증하며, 형식/본문 관리 화면의 완료 근거로 대신하지 않는다.
    verification_status: ChatHelpLiveTest.selectedCodeAtomicSaveReplayConflictAndExactProtectedVersion 및 migrationRollbackAndReapply
    status: implemented
  - id: TC-01110
    feature: FEAT-011
    usecase: UC-008
    screens: [SCR-039]
    type: normal
    title: 관계 양끝점과 복합 컬럼 쌍의 정상 저장
    actor: ACT-004
    given: 동일 데이터소스의 유효한 두 카탈로그와 완전한 컬럼 쌍·현재 SAVE 권한
    when: 관계 관리측에서 기대 판·사유와 함께 관계 전체를 저장
    then: 관계 역할·설명·전체 컬럼 쌍을 소유 현재/HIST에 한 번 저장하고 반대편은 같은 관계를 역조회한다. 관계를 양쪽에 복제하지 않는다.
    verification: SLICE-011에서 실제 소유 저장과 양방향 조회를 검증한다.
    status: planned
  - id: TC-01212
    feature: FEAT-012
    usecase: UC-026
    screens: [SCR-009]
    type: normal
    title: 기본 필터·필수 조회 제약의 정상 저장
    actor: ACT-004
    given: 현재 권한·기대 판과 자료형/컬럼 참조 검증을 만족한 부모별 정책 편집본
    when: 허용 정책 영역을 사유·원 키와 함께 저장
