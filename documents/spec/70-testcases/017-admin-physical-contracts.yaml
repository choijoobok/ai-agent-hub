  - id: TC-0409
    feature: FEAT-040
    usecase: UC-006
    screens:
      - SCR-001
      - SCR-011
    type: business_exception
    title: 서로 다른 원장의 같은 명령 UUID
    actor: ACT-004
    given: ENT-019와 ENT-099의 다른 기능/주체가 같은 UUID로 동시에 명령
    when: 명령 해시 공통 잠금에서 모든 활성 원장/종료키를 검사
    then: 한 소유 효과만 발생하고 다른 입력은409. 한 원장 파기 후 다른 원장의 유효 결과가 가려지는 상태가 생기지 않는다. 활성 원장 장애는503이며 미발견이 아니다. 미설치는 쓰기 경로도 없음을 확인한 설치 명세로만 허용하고 테이블 없음 예외를 삼켜 우회하지 않는다.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
    status: planned
  - id: TC-04010
