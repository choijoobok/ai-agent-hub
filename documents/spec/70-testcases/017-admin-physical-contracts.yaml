  - id: TC-04011
    feature: FEAT-040
    usecase: UC-006
    screens:
      - SCR-012
      - SCR-009
    type: business_exception
    title: 추출 근거 위조와 자식 재귀속 거부
    actor: ACT-004
    given: 다른 예제/정책 부모의 자식 ID와 클라이언트가 만든 추출지문
    when: SQL/조건식 변경 뒤 위조근거로 저장
    then: 선택부모에서 서버소유FK고정, 재귀속422. 서버에서정확SQL/원천판을재검증하고실패시현재/이력전부불변.
    verification: 소유 구현 슬라이스의 DB/API 계약 시험 계획. 해당 차단/잠금/소유 검사를 제거한 변형에서 실패해야 한다. 설계 정합 검사 통과와 제품 시험 실행을 구분한다.
