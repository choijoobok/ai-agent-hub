  - { id: TC-0180, feature: FEAT-043, usecase: UC-040, type: permission, title: "사용 통계 인가/반출·비중복 계량과 조회 전용", actor: ACT-004, given: "권한 회수·다른 사용자/운영 계정·누적 재수신/재시도·캐시 포함 관계", when: "사용자별/월별 상세 이동·반출/수정 시도", then: "현재 범위와 마스킹·별도 EXPORT 검사. 비중복 계량/원 기록 유지·실패0 치환/원장·배정 직접 수정·개별 예상 청구액 계산 금지", status: planned }
  - { id: TC-0181, feature: FEAT-017, usecase: UC-027, type: validation, title: "월별 화면 단일 기준월·메모 textarea·완료 결과 스위치", actor: ACT-004, given: "미래 예정본/현재 최종본·금액/메모 편집·조회 불명", when: "더블 클릭 textarea 줄바꿈/반영/Escape·탭/월 왕복", then: "기준년월 하나·확정자/일시 분리·두 탭. 완료 스위치 직접 조작 금지·불명은 확인 필요. 계산 입력 변경은 낡음·메모/행 원복/다른 행 입력 보존", status: planned }
