testcases:
  - { id: TC-0161, feature: FEAT-016, usecase: UC-022, type: normal, title: "월별 USD 기준 단가의 동일 배율 불변", actor: ACT-004, given: "수동 턴 또는 월 실적의 비중복 수량·USD/1M 단가", when: "전체 예상 비용/비중복 토큰으로 산정 후 전 행 수량을 같은 배율로 변경", then: "전체 비용과 토큰이 같은 배율로 변해 기준 USD 단가가 동일하며 월별 당시 산정 방법/수량/단가 근거를 재현", status: planned }
  - { id: TC-0162, feature: FEAT-016, usecase: UC-022, type: validation, title: "캐시·추론 토큰의 중복 합산 방지", actor: ACT-004, given: "입력총량100만 중 캐시80만·출력10만, USD/1M 요금2/0.2/10", when: "비캐시20만·캐시80만·출력10만으로 산정", then: "비용1.56USD·비중복110만 토큰·기준1.4181818…USD/1M. 캐시/출력 포함 추론을 다시 더하면 실패", status: planned }
  - { id: TC-0163, feature: FEAT-016, usecase: UC-022, type: validation, title: "미상·0분모·세부 과금 단위 미지원", actor: ACT-004, given: "총량만 있음 또는 캐시 읽기/쓰기 가격·정규화 근거 미비", when: "유효 단가 저장/쿼터 기준 저장 시도", then: "미상을0으로 채우거나 서로 다른 캐시 요금을 합치지 않으며 분모0/비용0·음수/비유한값은 유효 저장/참조 차단. 관리자 보완은 원 상태와 사유 보존", status: planned }
  - { id: TC-0164, feature: FEAT-016, usecase: UC-022, type: concurrency, title: "실제 소비와 누적 재수신·지연 계량의 스냅샷 경계", actor: ACT-004, given: "실패/중단/재시도/대체와 동일 실행의 추정700→계량900 정정", when: "기준 서버 시각까지 당월 실적 집계", then: "각 실제 호출 소비는 포함·동일 실행 중복 제외. 기준 시각 전의 유효값만 고정하며 이후 정정은 확정 기준을 바꾸지 않음", status: planned }
  - { id: TC-0165, feature: FEAT-016, usecase: UC-022, type: permission, title: "현재 설정과 다른 실제 조합·귀속의 집계", actor: ACT-004, given: "현재 미지정/삭제 모델의 주 추론·사용자 질의 임베딩·시스템 운영/지식 재임베딩", when: "당월 실적 초안 생성", then: "당시 역할/안정 조합과 사용자 귀속을 포함하며 현재 지정 목록으로 제한하지 않음. 시스템 귀속은 개인 풀 표본과 분리", status: planned }
  - { id: TC-0166, feature: FEAT-016, usecase: UC-022, type: concurrency, title: "월 기준 단가 고정·예정 교체·월말 최종 배분의 보호", actor: ACT-004, given: "월 기준 저장·단가 편집/고정·미래 재생성·월말 최종 배분이 병행", when: "두 처리 순서와 응답 유실 후 재확인", then: "최초 기준 저장/단가 고정 부분 성공 금지. 수동 미래 생성은 교체 가능, 월말 마감 뒤 전체 재생성/소급 변경·중복 최종 배분을 거부하고 원 작업을 확인", status: planned }
  - { id: TC-0167, feature: FEAT-016, usecase: UC-022, type: business_exception, title: "자동 초안 재생성과 관리자 편집 보존", actor: ACT-004, given: "당월 실적 초안을 관리자가 보완 중 또는 생성/저장 권한 없음", when: "재생성/저장 시도", then: "미저장 입력을 자동 덮어쓰거나 초안을 자동 고정/배분하지 않음. 비교/명시 선택과 현재 권한 검사", status: planned }
  - { id: TC-0168, feature: FEAT-017, usecase: UC-027, type: validation, title: "USD 단가의 월 수동 환산과 이중 보정 방지", actor: ACT-004, given: "USD 기준5·수동환산1000원/USD·보정률1.1·계획금액1000만원", when: "월 총 풀 계산 및 환산율 누락/옛3개월 보정률 재적용", then: "계획 통화 보정단가5500·풀1818181818. 환율은 한 번·기본 보정1.0 또는 근거 있는 수동값만, 옛 자동 제안 중복 적용/환산 근거 누락 거부", status: planned }
