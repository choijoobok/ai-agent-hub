  - { id: TC-0155, feature: FEAT-015, usecase: UC-017, type: validation, title: "기본/필수 지정 보호와 Portal OFF 분리", actor: ACT-004, given: "기본 주 추론과 필수 보조·운영·임베딩 지정이 유효", when: "대체 없이 마지막 지정을 제거하거나 기본 모델의 Portal 선택 스위치만 끔", then: "마지막 지정 제거·임베딩의 주 추론 기본 지정은 거부한다. Portal OFF는 지정 제거가 아니므로 참조를 유지해 저장할 수 있으나 OFF 기본은 새 Portal 선택에 자동 적용하지 않고 사용자 선택을 기다린다. 다른 모델 자동 선택/전송 금지", status: planned }
  - { id: TC-0156, feature: FEAT-015, usecase: UC-017, type: validation, title: "외부 모델 단일 참조와 표시명/전송 코드 분리", actor: ACT-004, given: "공급사별 모델 코드·지원 effort 코드가 다르고 미전송 모델도 등록됨", when: "공급사 / 모델 표시명 / effort 표시명 단일 콤보로 외부 모델 식별값 선택 후 실제 실행 계약 대조", then: "등록 화면은 모델/effort 표시명과 코드 두 쌍을 기본 표시하며 각각 편집 가능. 용도 콤보는 표시명 조합만 보여주고 유효한 등록 조합의 식별값 하나만 선택 가능하며 표시 문자열 파싱/별도 모델-effort 재조합 없음. 표시명을 호출 값으로 쓰지 않으며 미전송은 임의 문자열 없이 생략. 당시 경로/코드/등록·용도 버전을 기록", status: planned }
