testcases:
  - { id: TC-01510, feature: FEAT-015, usecase: UC-017, screens: [SCR-015, SCR-062, SCR-101], type: business_exception, actor: ACT-004, title: "Portal 선택 스위치와 내부 용도 사용 분리", given: "기술 유효한 텍스트/임베딩 등록·내부/보조 용도 지정·진행 중인 턴과 저장된 사용자 선택", when: "텍스트 조합의 사용 여부를 끄고 내부 후보·Portal 신규 선택/새 턴·진행 턴을 확인", then: "Portal 새 후보에서만 제외. 내부 지정·보조 후보·가격 참조와 진행 턴 고정 조합은 유지. 저장된 OFF 선택은 다음 새 턴 전 목록 갱신·선택 해제 후 재선택/명시 전송. 자동 대체/재전송 금지. 임베딩 ON 저장 거부·Portal 불노출, ON도 현재 연결/지원 유효성 필수", status: planned }
