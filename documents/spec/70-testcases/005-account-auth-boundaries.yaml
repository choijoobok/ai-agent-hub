testcases:
  - { id: TC-0051, feature: FEAT-005, usecase: UC-023, type: normal, title: "Portal 자체 계정 독립 등록과 초기화", actor: ACT-004, given: "Portal 계정 관리 액션이 있는 관리자와 관리자 계정 없는 신규 업무 이용자", when: "Portal 자체 계정 등록·초기화·잠금 해제를 요청", then: "별도 Portal 원장에서 처리하고 SYS_USER 생성/연결이나 system 관리자 계정 명령을 호출하지 않는다. 관리자는 대상 이용자로 로그인한 것으로 간주하지 않는다", change: CR-028, verification_status: "PortalUserLiveTest 독립 등록·초기화·LOCAL 정책 포트와 실제 PostgreSQL 전체 이력 롤백 검증. 실제 세션301 후속" }
  - { id: TC-0052, feature: FEAT-005, usecase: UC-023, type: validation, title: "Portal 외부 주체 충돌과 이메일 자동 병합 거부", actor: ACT-004, given: "같은 이메일/로그인 ID를 가진 관리자와 서로 다른 외부 원천/주체의 Portal 후보", when: "SSO/대상 인증 연결 또는 원천 변경을 요청", then: "검증된 Portal 원천/주체로 대조하며 관리자 계정이나 다른 외부 주체에 자동 병합하지 않는다. 원천 신원/프로필은 읽기 전용이다", change: CR-028, verification_status: "PortalExternalLiveTest 검증 Directory 대역으로 원천/subject 충돌·관리자 동명 분리·원천 실패·프로필 보호 검증. 실제 SSO/원천305/306 후속" }
  - { id: TC-0053, feature: FEAT-005, usecase: UC-023, type: business_exception, title: "Portal 등록 부분 실패와 재요청", actor: ACT-004, given: "Portal 계정/외부 연결은 저장됐지만 이용 활성화 또는 월 배정이 실패함", when: "원 등록 결과를 확인하고 같은 요청을 재처리", then: "Portal 계정·배정을 중복 생성하지 않고 미완료 이용자의 실행을 차단한다. 실제 미완료 절차만 재처리하고 관리자 계정/세션은 변경하지 않는다", change: CR-028, verification_status: "PortalUserLiveTest 현재 원장/전체 이력/명령 결과 원자성과 재수신 검증. 실제 월 배정 실패/복구045 후속" }
  - { id: TC-0054, feature: FEAT-005, usecase: UC-023, type: business_exception, title: "외부 인사 사건의 Portal 적용 범위", actor: ACT-004, given: "외부 원천에 연결된 Portal 계정과 같은 문자열 ID의 관리자 및 원천 미연결 Portal 자체 계정", when: "외부 퇴직/조직 변경 사건과 재전송을 수신", then: "검증된 연결의 Portal 이용 중지·그룹 재확인·후속 접근/실행 검사에만 적용하고 관리자 계정·세션과 미연결 자체 계정에는 전파하지 않는다. 결과·중복·실패를 조회할 수 있다", change: CR-028, verification_status: "SLICE-305 SourceChangeLiveTest에서 실제 제품 HTTP/Portal 원장·HIST/동시 재수신·알림 및 동일 문자열 관리자 불변을 검증했다. 원천 HMAC은 합성 시험이며 고객 인사 연동 운영 검수는 후속이다." }
  - { id: TC-0055, feature: FEAT-005, usecase: UC-023, type: permission, title: "이력·원 결과의 관리자 처리자와 Portal 대상 구분", actor: ACT-004, given: "관리자와 Portal에 같은 문자열 ID/다른 이름이 있고 관리 명령 결과와 대상 이용자 이력이 존재함", when: "관리 결과 재조회·재전송·과거 이력과 대상 Portal 계정을 조회", then: "관리자 처리자와 Portal 대상을 구분하고 Portal 세션으로 관리 명령 결과/이력을 재생하지 않는다. 현재 SYS_USER 이름으로 Portal 이력을 잘못 표시하지 않는다", change: CR-028, verification_status: "PortalUserLiveTest ADMIN 처리자/PORTAL 대상 이력과 원 결과 검증. 실제 Portal 세션의 관리자 API 교차 수락은301 후속" }
  - { id: TC-3011, feature: FEAT-301, usecase: UC-023, type: permission, title: "관리자 인증으로 Portal 로그인·업무 API 접근 거부", actor: ACT-012, given: "Portal 계정 없는 관리자와 관리자 자체 자격증명/세션", when: "Portal 로그인·딥링크·질의/신청 API에 관리자 인증 근거를 제출", then: "Portal 인증으로 수락하지 않고 Portal 계정/세션을 자동 발급하지 않는다. 별도 Portal 인증과 현재 이용 조건이 모두 유효할 때만 허용한다", change: CR-028, verification_status: "서버 인증 경계 구현·실제 원장/HTTP 검증. PC·모바일 화면 및 업무 접점은 FEAT-128/각 소유 기능 후속" }
  - { id: TC-3012, feature: FEAT-301, usecase: UC-023, type: business_exception, title: "영역별 동시 세션·안전한 복귀·개인 상태 분리", actor: ACT-001, given: "별도 관리자/Portal 계정 세션이 같은 브라우저의 두 탭에 존재하고 로그인 ID 문자열은 같음", when: "한쪽 재로그인·로그아웃·만료와 상대 영역 목적지 복귀 및 알림/개인 설정 조회를 요청", then: "다른 영역 세션/주체를 덮어쓰거나 수락하지 않는다. 현재 영역의 허용 목적지로만 복귀하고 SYS_USER 기반 관리자 알림/개인 설정을 Portal 사용자에게 노출/갱신하지 않는다", change: CR-028, verification_status: "서버 인증 경계 구현·실제 원장/HTTP 검증. PC·모바일 화면 및 업무 접점은 FEAT-128/각 소유 기능 후속" }
  - { id: TC-3013, nfrs: [NFR-028], feature: FEAT-301, usecase: UC-023, type: normal, title: "Portal PC·모바일·딥링크의 인증 모드와 이용 차단", actor: ACT-001, given: "SSO/대상 인증 연동 또는 자체 모드별 Portal 사용자와 미등록/비활성·그룹/등급 미충족 사용자", when: "PC·모바일·딥링크로 Portal에 접속하고 현재 상태를 회수한 뒤 다음 업무 접근/실행을 요청", then: "모든 접점이 동일한 Portal 인증 경계를 적용한다. 외부 인증 성공이나 과거 세션만으로 미등록/비활성·회수된 이용을 허용하지 않으며 관리자 로그인으로 자동 우회하지 않는다", change: CR-028, verification_status: "서버 인증 경계 구현·실제 원장/HTTP 검증. PC·모바일 화면 및 업무 접점은 FEAT-128/각 소유 기능 후속" }
