# 영역: 공통 저장·이력·권한의 경합 반례
testcases:
  - id: TC-0401
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-005, SCR-011]
    type: business_exception
    title: "전체 저장의 이력/결과 실패 롤백"
    actor: ACT-004
    given: "기존 부모/미변경 탭/매핑이 있고 자식 HIST 또는 성공 결과 기록에 실패 주입"
    when: "한 탭을 변경해 저장"
    then: "현재값·모든 자식·부모 리비전·모든 HIST·성공 결과가 전부 원상태다. 재시도 성공은 전체 이력1세트/리비전1증가만 만든다."
    verification: "실제 DB 통합; HIST를 별도 커밋하는 변형에서 실패해야 한다."
    status: planned
  - id: TC-0402
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-005, SCR-006]
    type: business_exception
    title: "명령 재수신·응답 유실·주체 격리"
    actor: ACT-004
    given: "동일 키 두 동시 요청과 성공 응답 유실"
    when: "원 키 조회/재수신, 같은 키 다른 입력/다른 주체, 대상 삭제 후 재조회"
    then: "원 성공1회·같은 결과만 반환, 다른 입력409/다른 주체 UNKNOWN, 미발견은 미실행 확정이 아니다. 새 키 자동 발급 없음."
    verification: "DB 동시성·API 계약; 결과 없음=신규 수락 변형을 탐지한다."
    status: planned
  - id: TC-0403
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-002, SCR-003, SCR-006]
    type: business_exception
    title: "참조 생성과 삭제/부모 매핑 OFF의 두 순서 경합"
    actor: ACT-004
    given: "하위 카탈로그 그룹 생성과 부모 그룹 OFF/삭제 요청"
    when: "배리어로 두 순서를 각각 강제"
    then: "부모 차단이 먼저면 하위 생성 거부, 하위가 먼저면 부모 OFF/삭제 거부. 비활성 참조도 물리 삭제 보호. 고아/잘못된 허용 경로0건."
    verification: "실제 DB 다중 연결; 참조 조회만 하고 부모 잠금을 빼면 실패해야 한다."
    status: planned
  - id: TC-0404
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-011]
    type: business_exception
    title: "정확 판 보호 등록과 이력 파기의 두 순서"
    actor: ACT-004
    given: "현재가 아닌 과거 지식/전이 참조 이력이 보존 종료 후보"
    when: "실행 보호 등록과 세트 파기를 경합"
    then: "등록 선행이면 전체 전이 세트 보존, 파기 선행이면 실행 시작/재현 거부. 일부 자식만 파기하거나 현재값 대체 없음. 소비자 장애로 보호 자동 해제 없음. 여러 상위 경로가 같은 하위 판을 사용해도 소비 기록/목적 전체 종료 전에는 대표 부모나 한 가지 종료만으로 해제하지 않는다."
    verification: "DB 통합/consumer 계약; 전이 참조나 공유 잠금을 제거하면 실패해야 한다."
    status: planned
  - id: TC-0405
    feature: FEAT-005
    usecase: UC-023
    screens: [SCR-005]
    type: business_exception
    title: "관리자와 Portal 동일 문자열 신원 격리"
    actor: ACT-004
    given: "이름/로그인 ID가 같은 관리자와 Portal 계정 및 두 세션"
    when: "Portal 세션으로 관리 저장, 관리자 세션으로 Portal 데이터 실행을 호출"
    then: "양쪽 교차 수락 거부. 관리 처리자는 ADMIN, 대상은 PORTAL이며 한쪽 비활성/비밀번호 변경이 다른 계정을 바꾸지 않는다."
    verification: "system/integration 계약+실분리 세션 시험; 대역 통과를 실연동 완료로 세지 않는다."
    status: planned
  - id: TC-0406
    feature: FEAT-005
    usecase: UC-024
    screens: [SCR-005, SCR-006]
    type: business_exception
    title: "현재 권한 회수·세션 캐시·다른 화면 소속 저장 경합"
    actor: ACT-004
    given: "오래된 세션 그룹과 동일 사용자 소속을 편집 중인 두 화면"
    when: "회수 확정 뒤 접근/실행을 요청하고 양쪽 소속을 같은 기준본으로 저장"
    then: "다음 판정은 회수를 반영, 낡은 편집은409. 마지막 활성 그룹 회수는 명시 이용자 비활성화와 함께만 성공하며 소속 물리 삭제 없음. 원천 장애는 UNAVAILABLE이고 빈 권한 성공 없음. 이미 외부로 전송한 호출은 소급 취소로 표시하지 않는다."
    verification: "DB/인가 계약; 세션 그룹만 사용하는 변형에서 실패해야 한다."
    status: planned
  - id: TC-0407
    feature: FEAT-005
    usecase: UC-024
    screens: [SCR-005]
    type: business_exception
    title: "신원 매핑 직접 저장과 실행용 신원 확인의 분리"
    actor: ACT-004
    given: "현재 변경 권한과 근거를 가진 대상별 매핑, 동일 매핑의 회수/실행 소비 경합"
    when: "직접 매핑 저장·현재 대상 검증 실패·원 명령 재수신과 신원 소비를 대조"
    then: "매핑 저장에 별도 신원 토큰 발급/소비를 요구하지 않음. 대상/기준본 실패는 기존값 유지. 회수 선행이면 실행 소비 거부, 소비 선행이면 해당 요청만 고정 신원 사용. 비밀/토큰 원문은 HIST/지문/로그에 남지 않음."
    verification: "admin 저장 DB 시험과 FEAT-205/IF-009 소비 계약 대역·후속 실연결 검증을 구분한다."
    status: planned
  - id: TC-0408
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-015, SCR-062, SCR-016, SCR-064, SCR-021, SCR-006, SCR-005, SCR-001, SCR-002, SCR-003, SCR-039, SCR-004, SCR-019, SCR-010, SCR-011, SCR-012, SCR-009, SCR-013, SCR-014]
    type: normal
    title: "19화면 저장 단위와 생산/소비 경계 계약 행렬"
    actor: ACT-004
    given: "FEAT-040.screen_matrix의 각 소유 저장 단위/역투영/소비 대역"
    when: "현재 권한 저장·실패·원 결과 조회와 비밀/관측 제외를 매개변수 시험"
    then: "행별/복합 원자성 유지, 역투영 중복 저장 없음, 소유 전체 HIST 보존. FEAT-003 등 소유 무변경 규칙은 NO_CHANGE/리비전·HIST 불증가다. 미구현 연동은 UNSUPPORTED이며 검수 성공/0건이 아니다. 후행 감사/품질 목업은 입력하지 않는다."
    verification: "SLICE-040은 저장 단위/소유 어댑터 계약 행렬을 대표 실제 DB fixture로 검증한다. 19화면의 실제 스키마/입력·현재 권한 연결 시험은 각 소유 슬라이스에서 수행한다. fixture나 설계 검사 통과를 실제 화면 연결 완료로 세지 않는다."
    status: planned
  - id: TC-04013
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-006]
    type: business_exception
    title: 관리 명령 진입과 기존 인증 보호의 잠금 순서
    actor: ACT-004
    given: 명령 키 잠금을 기다리는 관리 요청과 ADMIN 권한 회수, 정상 system 요청
    when: 실제 HTTP 인증 경계와 공통 저장을 같은 DB에 연결해 저장/회수 양순서와 진입 증거 위조·재사용을 검증
    then: 명령 키 → ADMIN 보호 순서이며 같은 물리 트랜잭션에서 현재값/HIST/결과를 커밋한다. 회수 선행이면 효과0, 저장 선행이면 한 번만 반영한다. 다른 트랜잭션/스레드/명령·종료된 증거는 거부한다. 일반 system 요청의 기존 수락/회수 규칙을 유지한다.
    verification: SLICE-040에서 기존 ADMIN 필터를 포함한 대표 저장 fixture와 실제 DB 다중 연결로 검증한다. auth 전체·Redis 전체 시험을 반복하지 않고 변경된 진입 조립/현재 권한·커밋 경계만 시험한다.
    status: planned
  - id: TC-04014
    feature: FEAT-040
    usecase: UC-006
    screens: [SCR-006, SCR-064]
    type: business_exception
    title: 독립 행 요청의 부분 성공과 복합 저장의 전체 원자성
    actor: ACT-004
    given: 서로 독립된 세 행의 고정 원 키와 부모/자식 전체를 한 번에 저장해야 하는 등급 세트
    when: 두 번째 행의 기준본 충돌·응답 유실·행 사이 권한 회수를 각각 발생시키고 복합 저장 자식 하나를 실패시킴
    then: 기준본 충돌은 해당 행만 실패하고 다른 독립 행 성공은 유지한다. 응답 유실/권한 회수면 남은 전송을 중단하고 성공/불명/미전송을 구분한다. 불명 행의 원 키 확인/재수신은 효과1회다. 복합 저장은 전체 롤백이며 자식을 행별 요청으로 분해하지 않는다.
    verification: SLICE-040은 독립 HTTP 요청/복합 단일 요청의 서버·DB 계약을 검증한다. 화면의 결과 모으기·미전송 표시·원 키 유지 시험은 첫 소비 SLICE-006에서 실제 호출부에 연결하고 등급 세트는 SLICE-042에서 검증한다.
    status: planned
