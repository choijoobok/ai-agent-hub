testcases:
  - { id: TC-0061, feature: FEAT-006, usecase: UC-025, type: normal, actor: ACT-002, title: "그룹별 다섯 매핑 탭과 현재 접근 구분", given: "두 그룹·지식/인증 예제·내부 빈/API 도구 매핑이 있음", when: "그룹/탭을 선택", then: "다섯 탭의 종류·안정 식별자·현재 매핑/접근과 비활성 후보를 구분하고 대상 시스템 자체 그룹을 만들지 않음", status: planned }
  - { id: TC-0062, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "그룹·탭별 매핑 편집본 보존", given: "그룹A 지식과 API 및 그룹B 사용자 스위치를 편집", when: "그룹/탭 왕복·한 탭 저장", then: "그룹별 입력·선택을 유지하고 선택 그룹/탭/처리 종류의 후보만 전달. 다른 그룹/탭 자동 포함과 숨은 매핑 삭제 금지", status: planned }
  - { id: TC-0063, feature: FEAT-006, usecase: UC-025, type: validation, actor: ACT-002, title: "설정 스위치 편집·원복과 효력 분리", given: "현재 활성 매핑과 다른 행/탭 미저장 편집", when: "스위치 클릭·변경 사유 입력·한 행 원복", then: "로컬 수정 상태만 변경. 저장 전 현재 접근 효력은 유지하고 원복은 해당 행만 되돌림. 미상·잠긴 스위치 조작 금지", status: planned }
  - { id: TC-0064, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "그룹 정의와 소유 매핑의 직접 저장 범위 분리", given: "그룹 정의 및 사용자/자산 매핑의 미저장 편집본", when: "상단 저장·선택 그룹의 한 탭 저장", then: "그룹 정의 저장에 하단을 반영하지 않음. 사용자 부여/회수와 자산 저장 단위를 혼합하지 않고 다른 그룹·본문·예외를 보존. 현재 변경 권한·전체 검증 후 값과 전후 이력을 원자 저장하며 승인요청/전결을 만들지 않음", status: planned }
  - { id: TC-0065, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "사용자 소속 재부여·회수와 마지막 그룹 보호", given: "중지된 소속과 마지막 활성 그룹·철회 이전 미반영 부여 요청", when: "ON/OFF 직접 저장·옛 요청 지연 승인 시도", then: "ON은 현재 부여 권한으로 직접 추가/재부여, OFF는 직접 회수. 마지막 그룹은 이용자 비활성화와 원자 처리. 원 부여/회수 이력·감사 넷 유지·물리 삭제 금지. 옛 요청의 지연 부활 금지", status: planned }
  - { id: TC-0066, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "원 소유 권한과 미상/실패 보호", given: "그룹 READ만 있음 또는 원천 일부/권한 밖/조회 실패·매핑 미상", when: "탭 열람·스위치 조작·저장/반출", then: "원 소유 현재 범위/행위 권한·저장 중 잠금을 적용. 미상/실패를 비활성0·전체없음으로 치환하거나 숨은 매핑 제거/개인정보 우회 금지. 일반 admin 지위나 조회권한만으로 저장 거부", status: planned }
  - { id: TC-0067, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "그룹 매핑과 최종 자산 접근의 차이", given: "카탈로그 컬럼/행 제약·사용자 대상 신원·API/도구 독립 허용", when: "그룹 포함 스위치 및 실제 후보 구성/실행 검사", then: "컬럼 예외·행 스코프·계약·신원·노출/연결 지식을 유지. API와 도구 또는 지식 연결이 다른 소유 권한을 자동 부여하지 않음", status: planned }
  - { id: TC-0068, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "그룹/자산 기준본 경합·중복 결과 확인", given: "다른 관리자가 같은 자산/그룹을 변경했거나 저장 응답 유실·이력 기록 실패", when: "탭 직접 저장·현재 권한 재검사·원 결과 확인", then: "소유 전체 구성/공통 잠금·현재 권한을 재검사하고 낡은 기준본·중복 반영·부분 권한 반영을 거부. 이력 실패는 변경값도 롤백. 실패 입력 보존·같은 명령은 원 결과 반환", status: planned }
