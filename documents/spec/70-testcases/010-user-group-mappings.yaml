testcases:
  - id: TC-00611
    feature: FEAT-006
    usecase: UC-025
    screens: [SCR-006]
    type: business_exception
    actor: ACT-002
    title: CR-040 그룹 정의·전체 이력·연결 포트 완료 경계
    given: 그룹 정의 화면과 ADMIN 현재 권한, 미연결 원 소유자 및 원 명령 응답 유실
    when: 생성·수정·삭제·원 결과 재수신·조회 전용 저장·오래된 기준본·HIST 실패·독립 행 혼재 저장
    then: 서버 번호·현재값/전체 HIST/성공 결과 원자 보존, 최초 감사 유지, 중복 반영/하단 덮어쓰기 금지, 실패 행만 유지, 미연결/실패를 빈 참조나 OFF로 취급하지 않고 삭제 차단, 완전 참조 없음에서만 삭제 직전 이력 보존
    verification: UserGroupDeletionLiveTest의 제품 조립 실제 미참조 삭제·비활성 관계 보존과 UserGroupStorageQueryServiceTest의 저장소 확인 실패/부분 설치, UserGroupLiveTest/UserGroupDefinitionTest/UserGroupLinksTest 및 userGroupApi.test.ts, 실제 화면 검토. 원 소유자 실연결 TC-0061~00610은 해당 소유 슬라이스에 남긴다.
    status: implemented
  - { id: TC-0069, feature: FEAT-006, usecase: UC-024, screens: [SCR-005, SCR-006], type: business_exception, actor: ACT-002, title: "소속 추가의 사용자 조회 팝업·그룹 기준정보 콤보", given: "선택 그룹/사용자와 현재·중지·미저장 소속 및 후보 조회 실패/0건", when: "추가·팝업 검색/선택/닫기와 신규 소속의 그룹 콤보 선택", then: "각 탭의 추가 버튼은 하나. 그룹 화면은 Portal 사용자 선택, 사용자 화면은 현재 그룹 기준정보 콤보. 부모 고정·중복/권한·실패 보호·신규 행 제거·기존 행 재활성화를 유지하며 저장 전 소속/서버 감사 효력 없음. 자산 탭 조회 전용 유지", status: planned }
  - { id: TC-0061, feature: FEAT-006, usecase: UC-025, type: normal, actor: ACT-002, title: "소속 공통 8항목과 네 자산 매핑 조회", given: "사용자 기준/그룹 기준 두 탭과 현재 자산 매핑", when: "같은 사용자–그룹 소속을 두 탭에서 조회", then: "사용자 아이디·그룹 식별자·활성화 여부·소속 감사 넷·메모가 같고 추가 상태/최종 접근/이력 번호 컬럼이 없음. 자산 네 탭의 읽기 전용과 현재 제약 조회는 유지", status: planned }
  - { id: TC-0062, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "자산 탭 조회 중 사용자 소속 편집본 보존", given: "그룹A 사용자 소속 미저장 입력과 그룹B 사용자 소속 입력", when: "자산 네 탭·그룹을 왕복하고 사용자 탭으로 복귀", then: "각 그룹의 사용자 소속 입력·탭별 선택 유지. 자산 탭에는 편집본이 없으며 다른 그룹 소속 자동 포함·미열람 매핑 삭제 금지", status: planned }
  - { id: TC-0063, feature: FEAT-006, usecase: UC-025, type: validation, actor: ACT-002, title: "소속 활성·메모 편집과 자산 조회 스위치 구분", given: "현재 사용자 소속과 자산 매핑이 있음", when: "두 소속 탭의 활성화 여부·메모 편집/원복과 자산 스위치 변경 시도", then: "소속만 로컬 수정/원복 가능하고 저장 전 접근 효력 유지. 감사 넷·기존 사용자/그룹 참조는 직접 수정 불가. 자산 스위치는 항상 잠기며 값·행 상태·자산 리비전/이력이 바뀌지 않음", status: planned }
  - { id: TC-0064, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "그룹 정의·사용자 소속 저장과 자산 조회 분리", given: "그룹 정의와 사용자 소속의 미저장 입력·현재 자산 매핑", when: "상단 저장·사용자 탭 저장·자산 탭 조회", then: "그룹 정의 저장에 하단을 반영하지 않고 사용자 탭은 소속만 원자 저장. 자산 네 탭에는 행 추가/저장/삭제/사유 입력·쓰기 명령을 제공하지 않음. 자산 현재값·리비전·이력 유지", status: planned }
  - { id: TC-0065, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "동일 소속 원장의 재부여·회수·감사와 경합", given: "두 화면에서 같은 소속을 열었고 중지된 소속/마지막 활성 그룹이 있음", when: "한 화면에서 활성·메모 저장 후 다른 화면에서 낡은 기준본 저장·재부여", then: "동일 현재 행을 변경하고 중복 소속/별도 원장을 만들지 않음. 낡은 기준본은 거부. 최초 등록자/일시는 보존하고 수정자/일시는 성공시에만 갱신. 변경 전후 이력·마지막 그룹 비활성화 원자성·물리 삭제 금지 유지", status: planned }
  - { id: TC-0066, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "자산 변경 권한과 무관한 그룹 자산 탭 조회 전용", given: "자산 SAVE 권한도 있거나 원천 일부/권한 밖/조회 실패·미상", when: "자산 탭 열람·변경 시도·사용자 소속 저장/반출", then: "자산 변경 권한이 있어도 그룹 자산 탭은 쓰기 불가. 현재 열람 범위를 지키며 미상/실패를 비활성0·전체없음으로 치환하지 않음. 사용자 소속은 별도 현재 변경 권한이 필요하며 개인정보 우회 반출 금지", status: planned }
  - { id: TC-0067, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "그룹 매핑 조회와 최종 자산 접근의 차이", given: "카탈로그 컬럼/행 제약·사용자 대상 신원·API/도구 독립 허용", when: "그룹 자산 탭의 현재 매핑 조회와 실제 실행 검사", then: "조회는 매핑을 변경하지 않고 컬럼 예외·행 스코프·계약·신원·노출/연결 지식의 현재 제약을 유지. API와 도구 또는 지식 연결이 다른 소유 권한을 자동 부여하지 않음", status: planned }
  - { id: TC-0068, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "원 자산 전체 저장·매핑 이력과 그룹 조회", given: "원 자산 화면에서 다른 관리자가 그룹 매핑을 포함한 전체 구성을 변경", when: "원 소유 전체 저장 후 그룹 자산 탭 재조회", then: "자산 본문/계약·모든 매핑·기대 버전을 검증하고 현재값과 전체 매핑 이력을 같은 자산 리비전으로 원자 저장. 이력 실패는 전체 롤백. 그룹 재조회는 저장된 결과만 보여주고 별도 부분 이력/리비전을 만들지 않음. 사용자 소속 경합/중복 결과는 UC024 소유 규칙 유지", status: planned }

  - id: TC-00610
    feature: FEAT-006
    features: [FEAT-002, FEAT-003, FEAT-007, FEAT-008, FEAT-020, FEAT-021, FEAT-023, FEAT-024, FEAT-034]
    usecase: UC-025
    screens: [SCR-002, SCR-003, SCR-004, SCR-005, SCR-006, SCR-010, SCR-011, SCR-012, SCR-019, SCR-039]
    type: business_exception
    title: "모든 관리 자산 링크의 매핑 활성·소유/역조회·전체 이력"
    actor: ACT-003
    given: "현재 소유 매핑 true/false·미상·현재 자산 사용/상위 권한·SQL 자동 참조가 있다"
    when: "원 소유 설정 스위치 변경/원복·저장·역조회/이력·후보/검색/예제/실행 필터와 직접 API 변경을 시도한다"
    then: "소유 현재 권한/기대 버전·영역·사유/참조 검증 후 현재 링크와 전체 HIST에 활성값을 보존한다. 신규 기본 true·저장 전 효력 없음·OFF 행 보존. 역조회는 같은 원값 읽기 전용이며 활성 경로만 소비하고 다른 접근 통제는 유지한다"
    verification: "목업/후속 계약·통합에서 역조회 편집/별도 원장·OFF 물리 삭제/예외 유실·모두OFF를전체허용으로해석·미상 false 치환·자산 useYn 혼용·상위/필수 SQL 참조/실행 권한 우회·예제 직접 그룹 신설·현재값으로 과거 이력 재계산을 허용하면 실패해야 한다"
    status: planned
  - id: TC-00224
    feature: FEAT-002
    features: [FEAT-007]
    usecase: UC-026
    screens: [SCR-002, SCR-003]
    type: business_exception
    title: "데이터소스 그룹 활성 어휘와 하위 매핑 보호"
    actor: ACT-003
    given: "적용 가능 그룹과 활성/비활성 카탈로그 그룹 링크가 있다"
    when: "부모 OFF·신규/재활성 자식·부모 재활성·물리 제거를 시도한다"
    then: "활성 자식이 남으면 부모 OFF 거부, 자식 OFF 후 부모 OFF 가능. 비활성 자식 보존·부모 OFF의 신규/재활성 후보 제외·부모 ON의 자식 자동 ON 금지. 비활성 포함 남은 참조의 물리 제거 보호. 새 데이터소스 런타임 권한 게이트는 만들지 않는다"
    verification: "P4 통합에서 활성 참조를 남긴 OFF·하위 삭제/자동 ON·후보 어휘를 직접 데이터 열람권으로 사용하거나 실패를 빈 참조로 처리하면 실패해야 한다"
    status: planned
