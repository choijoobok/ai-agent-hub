testcases:
  - { id: TC-0061, feature: FEAT-006, usecase: UC-025, type: normal, actor: ACT-002, title: "사용자 소속 관리와 네 자산 매핑 조회", given: "두 그룹·지식/인증 예제·내부 빈/API 도구 매핑이 있음", when: "그룹/다섯 탭을 선택", then: "사용자 탭은 소속 관리, 자산 네 탭은 종류·안정 식별자·현재 매핑/접근 제약 조회. 자산 스위치는 읽기 전용이고 대상 시스템 자체 그룹을 만들지 않음", status: planned }
  - { id: TC-0062, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "자산 탭 조회 중 사용자 소속 편집본 보존", given: "그룹A 사용자 소속 미저장 입력과 그룹B 사용자 소속 입력", when: "자산 네 탭·그룹을 왕복하고 사용자 탭으로 복귀", then: "각 그룹의 사용자 소속 입력·탭별 선택 유지. 자산 탭에는 편집본이 없으며 다른 그룹 소속 자동 포함·미열람 매핑 삭제 금지", status: planned }
  - { id: TC-0063, feature: FEAT-006, usecase: UC-025, type: validation, actor: ACT-002, title: "사용자 소속 편집과 자산 조회 스위치 구분", given: "현재 사용자 소속과 자산 매핑이 있음", when: "사용자 소속 스위치·사유 편집/원복과 자산 스위치 클릭/더블 클릭 시도", then: "사용자 소속만 로컬 수정/원복 가능하고 저장 전 접근 효력 유지. 자산 스위치는 항상 잠기며 값·행 상태·자산 리비전/이력이 바뀌지 않음. 미상은 꺼짐이 아님", status: planned }
  - { id: TC-0064, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "그룹 정의·사용자 소속 저장과 자산 조회 분리", given: "그룹 정의와 사용자 소속의 미저장 입력·현재 자산 매핑", when: "상단 저장·사용자 탭 저장·자산 탭 조회", then: "그룹 정의 저장에 하단을 반영하지 않고 사용자 탭은 소속만 원자 저장. 자산 네 탭에는 행 추가/저장/삭제/사유 입력·쓰기 명령을 제공하지 않음. 자산 현재값·리비전·이력 유지", status: planned }
  - { id: TC-0065, feature: FEAT-006, usecase: UC-025, type: business_exception, actor: ACT-002, title: "사용자 소속 재부여·회수와 마지막 그룹 보호", given: "중지된 소속과 마지막 활성 그룹·철회 이전 미반영 부여 요청", when: "ON/OFF 직접 저장·옛 요청 지연 승인 시도", then: "ON은 현재 부여 권한으로 직접 추가/재부여, OFF는 직접 회수. 마지막 그룹은 이용자 비활성화와 원자 처리. 원 부여/회수 이력·감사 넷 유지·물리 삭제 금지. 옛 요청의 지연 부활 금지", status: planned }
  - { id: TC-0066, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "자산 변경 권한과 무관한 그룹 자산 탭 조회 전용", given: "자산 SAVE 권한도 있거나 원천 일부/권한 밖/조회 실패·미상", when: "자산 탭 열람·변경 시도·사용자 소속 저장/반출", then: "자산 변경 권한이 있어도 그룹 자산 탭은 쓰기 불가. 현재 열람 범위를 지키며 미상/실패를 비활성0·전체없음으로 치환하지 않음. 사용자 소속은 별도 현재 변경 권한이 필요하며 개인정보 우회 반출 금지", status: planned }
  - { id: TC-0067, feature: FEAT-006, usecase: UC-025, type: permission, actor: ACT-002, title: "그룹 매핑 조회와 최종 자산 접근의 차이", given: "카탈로그 컬럼/행 제약·사용자 대상 신원·API/도구 독립 허용", when: "그룹 자산 탭의 현재 매핑 조회와 실제 실행 검사", then: "조회는 매핑을 변경하지 않고 컬럼 예외·행 스코프·계약·신원·노출/연결 지식의 현재 제약을 유지. API와 도구 또는 지식 연결이 다른 소유 권한을 자동 부여하지 않음", status: planned }
  - { id: TC-0068, feature: FEAT-006, usecase: UC-025, type: concurrency, actor: ACT-002, title: "원 자산 전체 저장·매핑 이력과 그룹 조회", given: "원 자산 화면에서 다른 관리자가 그룹 매핑을 포함한 전체 구성을 변경", when: "원 소유 전체 저장 후 그룹 자산 탭 재조회", then: "자산 본문/계약·모든 매핑·기대 버전을 검증하고 현재값과 전체 매핑 이력을 같은 자산 리비전으로 원자 저장. 이력 실패는 전체 롤백. 그룹 재조회는 저장된 결과만 보여주고 별도 부분 이력/리비전을 만들지 않음. 사용자 소속 경합/중복 결과는 UC024 소유 규칙 유지", status: planned }
