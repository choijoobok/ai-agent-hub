# 요구 검수 계획. 구현/통합·침해 반례 시험 완료를 뜻하지 않는다.
testcases:
  - id: TC-2051
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-608]
    type: normal
    title: "권장 신원 토큰 발급·소비·대상 권한 확인"
    actor: ACT-006
    given: "검수된 권장 계약·유효 주체/매핑/연결·확정 요청과 필요한 실행 승인"
    when: "Hub가 발급 저장 후 업무 요청을 보내고 인증된 대상이 검증·소비한다"
    then: "DB에는 원문 없는 해시/바인딩/상태가 확정되고 신원은 해당 대상에만 반환된다. 대상은 자체 권한·인자·멱등성을 검사한 뒤 실행하며 토큰은 사용 완료다. 저장 전 전송·소비 전 신원 반환·권한 검사 생략은 실패다."
    status: planned
    verification: "후속 계약·통합. 발급 저장/소비 확정/대상 권한 검사 순서를 뒤집으면 실패해야 한다."
  - id: TC-2052
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-103]
    type: permission
    title: "원 호출자·소비자 인증과 대상 범위 강제"
    actor: ACT-006
    given: "유효 토큰을 얻은 다른 서버·다른 대상/환경/연결·Portal 세션과 위조된 프록시 신원 헤더"
    when: "원 업무 요청 또는 토큰 소비 요청에서 Hub/대상 서버 인증과 바인딩을 우회한다"
    then: "토큰 소지나 입력 시스템 ID만으로 신원을 반환/업무 실행하지 않는다. Hub 인증서/키 결합과 인증된 소비자의 허용 범위를 검사하고 다른 대상 토큰은 소모하지 않는다. Hub DB 직접 접근을 제공하지 않는다."
    status: planned
    verification: "후속 보안·통합. 탈취 토큰만으로 통과·타 대상 조회·Portal 세션 수락·직접 게이트웨이 우회 변이를 검출한다."
  - id: TC-2053
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-105]
    type: validation
    title: "동일 요청 ID의 실제 요청 변조와 만료 차단"
    actor: ACT-006
    given: "유효 토큰/같은 요청 ID에 API·method/path·쿼리/중요 헤더/본문·계약 버전 변형과 만료 경계"
    when: "대상이 실제 받은 요청 근거로 소비하며 중복 키·직렬화/프록시 변환 모호성과 정리 전 만료 행을 포함한다"
    then: "정규 요청 결합/만료를 검사하고 미지원/변조는 신원 없이 거부한다. 요청 ID 일치만으로 허용하지 않으며 잘못된 요청이 토큰을 먼저 소모하지 않는다. 정리 배치가 안 돌아도 만료는 거부한다."
    status: planned
    verification: "후속 계약·경계. 요청 본문/대상 검사를 제거하거나 만료 정리에만 의존하면 실패해야 한다."
  - id: TC-2054
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609]
    type: concurrency
    title: "다중 노드의 동시 일회 소비"
    actor: ACT-006
    given: "같은 토큰을 여러 Hub 노드에 동시에 제시한 요청과 잘못된 대상 요청"
    when: "검증·사용 완료·감사 확정 시점을 경합시키고 저장 실패를 주입한다"
    then: "유효한 소비 성공과 신원 반환은 정확히 한 요청에만 발생한다. 실패 검증은 소비하지 않고 저장 실패/롤백은 신원 반환을 하지 않는다. 외부 왕복 동안 DB 잠금은 유지하지 않는다."
    status: planned
    verification: "후속 DB 경합·장애 주입. 조회 뒤 무조건 쓰기·노드별 소비 상태·확정 전 신원 반환이면 실패해야 한다."
  - id: TC-2055
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-103]
    type: concurrency
    title: "매핑·기본 규칙·권한 회수와 소비 선후"
    actor: ACT-006
    given: "발급 뒤 아이디/기본·변환 규칙 변경, 이용자/그룹/자산/연결 중지·회수와 동시 소비"
    when: "변경·회수와 소비의 확정 순서를 각각 먼저 실행하고 소비 확정 직후 응답 구성 전에 아이디 A를 B로 교체한다"
    then: "변경/회수 선행이면 옛 매핑 토큰을 거부하고 새 아이디로 조용히 해석하지 않는다. 소비 선행이면 이미 허용된 한 요청을 소급 취소한 것으로 기록하지 않으며 다음 발급/소비는 차단한다. 소비와 같은 경계에서 해석·고정한 A를 반환하며 응답 시 재조회로 B를 반환하지 않는다. 대상의 실행 전 자체 권한 검사는 유지된다."
    status: planned
    verification: "후속 통합·경합. 개별 행만 비교해 기본 규칙 변경을 놓치거나 유효성 검사와 소비 사이의 회수를 무시하면 실패해야 한다."
  - id: TC-2056
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-105, REQ-113]
    type: business_exception
    title: "소비 응답 유실과 업무 재전송의 중복 실행 방지"
    actor: ACT-006
    given: "소비 확정 후 응답 유실·대상 실행 결과 유실·멱등성/결과 확인 지원 및 미지원 계약"
    when: "같은 토큰 재소비와 새 토큰 발급을 이용한 재시도를 시도한다"
    then: "재소비는 신원 없이 거부하고 사용 상태를 되돌리지 않는다. 새 토큰만으로 업무를 재전송하지 않는다. REQ-105·113 조건을 통과한 기술 재시도만 새 토큰/전송 시도와 동일 논리 업무 요청 키를 사용하며 중복 실행을 방지한다. 결과 미확인은 수동 확인/재승인 경계를 유지한다."
    status: planned
    verification: "후속 장애 주입. 토큰 만료/소비 실패를 업무 미실행으로 치환하거나 새 토큰을 새 업무 키로 보내면 실패해야 한다."
  - id: TC-2057
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-105]
    type: business_exception
    title: "확인 경로 장애·자원 고갈과 보안 하향 대체 금지"
    actor: ACT-006
    given: "Hub DB/검증 API 장애·발급 저장 실패·만료/소비 거부·내부 콜백 용량 부족"
    when: "외부 호출 대기와 콜백 처리 실패/타임아웃을 발생시킨다"
    then: "해당 신원 확인과 신규 업무 실행을 닫고 평문 ID·공용 계정·인증 없음으로 대체하지 않는다. 기존 검수된 다른 계약은 선택 계약에만 적용한다. 원 호출 대기로 콜백 처리가 교착하지 않게 자원 경계를 검수하며 결과 불명을 성공/미실행으로 만들지 않는다."
    status: planned
    verification: "후속 통합·부하. 콜백 실패 무시·공통 자원 고갈·잠금 유지·보안 하향 대체 변이를 검출한다."
  - id: TC-2058
    feature: FEAT-205
    usecase: UC-044
    reqs: [REQ-609, REQ-111]
    type: permission
    title: "토큰·신원 응답의 비노출과 최소 감사"
    actor: ACT-006
    given: "식별 가능한 시험용 난수 토큰과 대상 사용자 아이디, 정상/오류/재시도 요청"
    when: "DB·모델·브라우저·URL·화면/엑셀·관리 HIST·실행 인자 보관·일반 감사·프록시/APM 로그를 검사한다"
    then: "원문 토큰은 지정 보호 통신 외에 없고 DB에는 해시만 있다. 신원 응답은 인증된 대상의 같은 요청에서만 사용하고 캐시하지 않는다. 일반 감사는 별도 사건 참조·안전한 결과만 남기며 다른 대상/사용자 정보가 오류로 새지 않는다."
    status: planned
    verification: "후속 통합·로그 수집. 정상/예외 로깅·전체 인자 저장·반출·응답 캐시에 원문을 넣는 변이는 실패해야 한다."
  - id: TC-00422
    feature: FEAT-004
    usecase: UC-018
    screens: [SCR-004]
    reqs: [REQ-608, REQ-609]
    type: validation
    title: "신원 필요 컬럼 제거와 연결 계약 참조"
    actor: ACT-004
    given: "업무 API 화면과 선택 연결의 정상/미설정/검수되지 않은 신원 계약"
    when: "전체 화면·탭·열 선택을 확인하고 신원 필요 플래그/업무 입력으로 검사를 우회한다"
    then: "신원 필요 컬럼/숨김 선택 열/편집 스위치와 토큰 발급/소비·노출이 없다. 선택 연결의 검수된 계약을 사용하고 미설정은 호출 차단한다. 신원 불필요를 임의 입력해 검사/매핑을 해제하지 못한다."
    status: planned
    verification: "목업 열 제거 검수 및 후속 제품 계약·통합. 열 재등장·임의 플래그 수락·미설정 무신원 허용 변이에서 실패해야 한다."
