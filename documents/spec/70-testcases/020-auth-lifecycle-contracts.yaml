testcases:
  - id: TC-50112
    feature: FEAT-501
    usecase: UC-501
    type: normal
    actor: ACT-012
    title: ADMIN 익명 CSRF와 로그인 수락
    given: ADMIN 준비 문맥과 정상 관리자 자격
    when: API-601 후 정상/다른 영역 CSRF로 API-501/503/504/505 호출
    then: 정상만 해당 계약으로 처리, 위조/교차403; 정책 GET은 비밀 없음. public prefix 우회 변이는 실패한다.
    status: planned
    verification: 소유 G3 후 실제 PostgreSQL/HTTP/다중노드 시험에서 단계별 장애/규칙 반전을 검증한다. 명세 작성과 제품 시험 통과는 별개다.
  - id: TC-50113
    feature: FEAT-501
    usecase: UC-501
    type: business_exception
    actor: ACT-012
    title: 현재 상태·제한 세션·회수 경로 전체
    given: 같은 날의 기존 ADMIN 세션과 두 노드
    when: 비활성/기간만료/잠금·역할/개인/메뉴/API 변경 경로 각각 뒤 보호 요청 및 실패 로그인 임계 잠금과 보호 저장 경합
    then: 계정 불가401·현재 액션 불가403·판정 장애503. dirty를 끄거나 각 변경 경로의 보호를 제거한 변이는 실패한다. API-501을 shared로 낮춰 자동 잠금/보호 저장 순서가 어긋나면 실패한다.
    status: planned
    verification: 소유 G3 후 실제 PostgreSQL/HTTP/다중노드 시험에서 단계별 장애/규칙 반전을 검증한다. 명세 작성과 제품 시험 통과는 별개다.
