  - id: TC-30116
    feature: FEAT-301
    usecase: UC-045
    type: normal
    title: 공통 영역 조립의 저장소/트랜잭션 전달
    actor: ACT-001
    given: 격리된 ADMIN/PORTAL repository와 등록된 테스트 API
    when: 공통 필터 한 개로 영역별 요청/CSRF·SecurityContext·REQUIRED 세션 저장 계약 실행; 두 repository 무자격 주입·PORTAL Primary·ADMIN 인덱스 prefix 변경·TM 분리·기본 filter 중복을 각각 주입한다
    then: v1/JDBC baseline은 각 영역 repository만 호출·동일 DB 롤백 참여·익명/인증 구분·6항목 오조립 기동실패·ADMIN raw인덱스/Portal prefix 실조회다. v2 JDBC는 이를 보존하며 Redis는 DB원장/자격 REQUIRED와 커밋후 publication을 구분한다. 공통 보안 수락/현재세대·영역 경계는 양 provider에 적용하고 TC-30121~30128로 별도 검증한다. 실제 Portal 업무 완료를 주장하지 않는다.
    status: implemented
    verification: SLICE-307 소유 공통 계약은 core SessionContractTest와 api SessionBoundaryTest의 실제 HTTP/PostgreSQL·JPA/동시 트랜잭션 시험으로 검증한다. 실행 결과·G4 상태는 project.state.yaml이다. 실제 ADMIN 자격/권한 소비는 SLICE-520, Portal 확정 자격/복구·고객SSO는 SLICE-301/306의 후속 검증이며 공통 생산자 대역 시험으로 대신하지 않는다.
  - id: TC-30117
    feature: FEAT-301
    usecase: UC-045
    type: security
    title: 이중 필터·미등록 경로·저장소 폴백 차단
    actor: ACT-001
    given: 기본 자동 SessionRepositoryFilter 중복 등록·오타 namespace·미등록 API·저장소 장애
    when: 기동 검수와 교차 쿠키 요청을 실행; 정확 public 카탈로그 대신 /api/public/** 예외·Portal의 ADMIN interceptor 통과·SessionPrincipal 직접 saveContext·임의 SessionDelta·응답 전 cookie 발급을 주입한다
    then: 이중 등록/잘못된 namespace는 기동 실패·미등록/교차 거부·메모리 폴백0. 전체 public 허용·상대 영역 기본repository 변이는 실패한다. 각 우회는 기동/구조 또는 HTTP 계약 시험에서 실패해야 한다. API-601은 headerName만 JSON에, 실제 CSRF/세션은 올바른 영역 cookie로 발급하고 rollback 시 새 발급0이다. CredentialAdmission의 다른 요청/영역/주체/만료/재사용은 세션 저장과 쿠키 발급 없이 거절되고, CsrfIssue의 toString/디버그 직렬화에 합성 비밀이 나타나면 실패다.
    status: implemented
    verification: SLICE-307 소유 공통 계약은 core SessionContractTest와 api SessionBoundaryTest의 실제 HTTP/PostgreSQL·JPA/동시 트랜잭션 시험으로 검증한다. 실행 결과·G4 상태는 project.state.yaml이다. 실제 ADMIN 자격/권한 소비는 SLICE-520, Portal 확정 자격/복구·고객SSO는 SLICE-301/306의 후속 검증이며 공통 생산자 대역 시험으로 대신하지 않는다.
  - id: TC-5086
    feature: FEAT-508
    usecase: UC-508
    type: concurrency
    actor: ACT-012
    title: 수동 접수와 권한 회수의 두 확정 순서
    given: 두 노드의 API-572와 계정 중지/EXECUTE 회수
    when: 회수 선행과 RUNNING 접수 커밋 선행 순서로 실행
    then: 회수 선행401/403·신규 접수0; 접수 선행 작업은 대기 중이어도 유지·실제 결과 종결, 새 명령은 거부
    status: planned
    verification: system 소유 G3 후 실제 PostgreSQL/두 노드·큐 대역에서 실행한다. guard 제거·REQUIRES_NEW start·커밋 전 submit·회수 뒤 cancel 허용·lease token 검사 제거 변이는 실패해야 한다. TC-5088은 동일노드 이전실행 종료/지연heartbeat가 새실행 lease를 바꾸지 못하고 cooldown 소유종료 뒤 heartbeat0인지 검증한다. 실제 ABA RED를 재현했으며 접수/세대열 구현은 SLICE-520 후속이다.
  - id: TC-5087
    feature: FEAT-508
    usecase: UC-508
    type: concurrency
    actor: ACT-012
    title: 중단 접수와 권한 회수·실제 종결 경합
    given: RUNNING 실행과 현재 EXECUTE 관리자. 같은 HIST_ID의 cancel/finish/markLost를 별도 DB 트랜잭션에서 경합시키고 오래된 엔티티를 먼저 읽은 경우도 준비
    when: API-575와 계정/권한 회수를 양 순서로 확정하고 cancel↔finish 및 markLost↔finish의 양 잠금/커밋 순서, 중복 요청·역순 다중 이력 입력을 실행
    then: 회수 선행이면 cancelReqDtm 불변, 중단 선행이면 최초 요청 시각 유지. 다른 권한 관리자의 중단은 가능하고 실제 정상 완료는 SUCCESS. finish 선행 뒤 cancel은 기존 중단 불가 오류·결과 변경0. markLost 선행 뒤 실제 finish는 실제 결과로 교정, finish 선행 뒤 markLost는 무변경. 최신 중단 시각 유실·종결 필드 초기화·ADMIN 역순 잠금0
    status: planned
    verification: system 소유 G3 후 실제 PostgreSQL/두 노드에서 barrier로 각 잠금/커밋 순서를 고정해 실행한다. ADMIN guard 제거·회수 뒤 cancel 허용·이력 행 잠금 제거·잠금 뒤 최신 조회 생략·최초 중단 시각 덮기 변이는 실패해야 한다. 목업이나 문서 검사를 실제 경합 시험으로 대체하지 않는다.
  - id: TC-5088
    feature: FEAT-508
    usecase: UC-508
    type: business_exception
    actor: ACT-012
    title: 수동 배치 커밋과 큐 인계 장애
    given: RUNNING 접수/분산 잠금과 커밋 후 실행기
