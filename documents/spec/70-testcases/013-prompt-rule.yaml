# 프롬프트 규칙 편집·전체 가공본 검토 — 실제 서버 시험은 소유 구현 단계에서 수행

testcases:
  - id: TC-0131
    feature: FEAT-013
    usecase: UC-020
    reqs: [REQ-610, REQ-112]
    screens: [SCR-013, SCR-050]
    type: business_exception
    actor: ACT-003
    title: "단순 규칙 목록과 행별 두 본문 편집"
    given: "기존 규칙·신규 미발급 행·사용/미사용 및 조회전용"
    when: "목록 표시·행 전환·추가/삭제/원복·편집/저장"
    then: "ID 기본숨김/서버숫자/불변, 제목·사용 여부·감사4 및 우측 설명/본문2. 행별 입력 분리·보존, 신규 사용false. 우선순위/적용조건 입력을 요구하지 않음"
    verification: "제목 편집·행 원복 때 다른 행 본문이 유실되면 실패. 감사 값 임의 변경·조회전용 입력·새 ID 임의발급을 허용하면 실패"
    status: planned

  - id: TC-0132
    feature: FEAT-013
    usecase: UC-020
    reqs: [REQ-610, REQ-112]
    screens: [SCR-013, SCR-050]
    type: business_exception
    actor: ACT-003
    title: "큰 편집창·안전 Markdown 미리보기 원문 보존"
    given: "Markdown 제목·목록·표·인용·코드·링크·HTML/script/외부이미지와 관리자 설명"
    when: "본문 크게 편집의 모달 모서리를 마우스로 끌어 확대/축소한 뒤 반영/취소/Esc와 미리보기 전환"
    then: "모달 가로·세로 크기와 본문 영역이 함께 변하고 입력을 유지하며 화면 안에서 반영/취소 버튼에 접근할 수 있다. 반영만 같은 행 본문 변경, 취소는 열기전 원문 유지. 미리보기는 현본문만 안전 표시하고 HTML/위험URL/외부이미지 자동요청 없음. 설명·원문·변경/사용 상태 불변"
    verification: "raw HTML·script·위험링크 실행/외부요청이나 취소본문 반영·미리보기HTML 저장/전송을 허용하면 실패"
    status: planned

