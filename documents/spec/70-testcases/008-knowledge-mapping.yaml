    type: "normal"
    title: "직접·예제 경유 참조 현황"
    actor: ACT-003
    given: "카탈로그X에 지식A 직접 참조와 인증 예제E 경유 지식B 참조가 있고 B의 연결이 변경됨"
    when: "현재 사용처를 다시 조회"
    then: "현재 허용 범위에서 직접/예제 경유 참조 경로를 구분한다. 사용처 변화만으로 업무 의미 영향을 판정·보완 작업 생성·지식 자동 수정하지 않는다. 삭제/비활성화 참조 보호와 자기 기준본 검증은 유지한다."
    status: "planned"
    group_boundary: "REQ-302.catalog_access. 예제 직접 그룹 매핑 없음. 현재 사용자 그룹 전체의 허용 카탈로그 합집합에 그 SQL 변형의 모든 필수 카탈로그가 있어야 사용 가능. 하나라도 미허용/미확인이면 해당 SQL 변형 전체 제외. 같은 묶음의 다른 허용 SQL 변형은 유지한다."
    verification: "요구사항 검수 시 반례 대조. 제품 구현 시 단위/통합 시험으로 연결하며 문서 검증을 실제 저장/동시성 실행 시험으로 표시하지 않는다."
