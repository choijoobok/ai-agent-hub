      - SCR-019
    type: "normal"
    title: "지식 편집 중 API 독립 변경 허용"
    actor: ACT-003
    given: "지식K의 미저장 편집본이 API A를 연결하고 현재 운영 지식에는 연결이 없음. A의 현재 리비전은3"
    when: "A를 현재 변경 권한으로 리비전4에 직접 저장"
    then: "K의 로컬 입력은 A 저장을 점유하지 않는다. A4 저장은 K 매핑·본문·리비전을 자동 변경하지 않으며 신규K 적용본이나 승인대기를 만들지 않는다. K 저장 때는 자신의 기준 리비전과 현재 참조·권한을 다시 검사한다."
    status: "planned"
    verification: "요구사항 검수 시 반례 대조. 제품 구현 시 단위/통합 시험으로 연결하며 문서 검증을 실제 저장/동시성 실행 시험으로 표시하지 않는다."
