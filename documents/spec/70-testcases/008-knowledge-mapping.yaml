    usecase: UC-012
    screens: [SCR-003, SCR-004, SCR-011, SCR-006]
    type: "permission"
    title: "관리자 승인 메뉴·명령 철회"
    actor: ACT-003
    given: "현재 변경 권한을 가진 관리자와 철회 이전 미반영 요청 근거"
    when: "관리 메뉴·액션 조회와 과거 승인/전결 명령 호출"
