    then: "현재 권한 안의 지식 식별자·이름·리비전·참조 경로만 조회한다. 본문 일괄 수집·LLM 의미 판정·보완 판단·검토 작업 배정/완료·필수 영향 검토를 제품 기능으로 수행하지 않는다. 의미 적합성은 운영 조직의 자체 절차이고 기술 검증·변경 이력은 유지한다."
    status: "planned"
    verification: "요구사항 검수 시 반례 대조. 제품 구현 시 단위/통합 시험으로 연결하며 문서 검증을 실제 저장/동시성 실행 시험으로 표시하지 않는다."
