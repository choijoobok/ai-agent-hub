      - SCR-019
    type: "normal"
    title: "지식 소유 매핑과 외부 상세 분리"
    actor: ACT-003
    given: "지식 K가 태그·카탈로그·예제·API·도구를 연결하고 사용 설명을 변경"
    when: "지식 직접 저장·전체 구성·관리 이력을 확인"
    then: "본문·그룹·안정 ID 매핑과 설명·당시 표시 근거만 보존한다. 외부 상세/하위 테이블·운영 고정 리비전을 지식 소유 스냅샷에 넣지 않는다."
    status: "planned"
    verification: "요구사항 검수 시 반례 대조. 제품 구현 시 단위/통합 시험으로 연결하며 문서 검증을 실제 저장/동시성 실행 시험으로 표시하지 않는다."
  - id: TC-0142
    feature: FEAT-014
    usecase: UC-012
    screens:
