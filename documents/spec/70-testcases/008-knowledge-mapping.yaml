  - id: TC-01421
    feature: FEAT-014
    usecase: UC-012
    reqs: [REQ-303, REQ-302, REQ-103]
    screens: [SCR-011, SCR-012]
    type: business_exception
    title: "지식 연결 예제의 SQL 변형별 전체 카탈로그 접근 필터"
