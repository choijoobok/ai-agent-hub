  - id: TC-0104
    feature: FEAT-107
    features: [FEAT-010]
    usecase: UC-021
    reqs: [REQ-308, REQ-106, REQ-009, REQ-601]
    screens: [SCR-014, SCR-069, SCR-101]
    type: business_exception
    actor: ACT-003
    title: "agent 제공 Portal 표시 계약과 초기 안내"
    given: "세 고정 코드·유효/미설정 판·미지원 형식·표시 실패"
    when: "도움말 열기·새 대화·제출 전 입력창 표시·재조회"
    then: "정해진 위치/시점에 같은 code/name/format/body/revision 판을 agent 계약으로 표시. 모델 재작성·새 턴/모델 호출·admin 직접조회·임의 업무문구 폴백 없음. 원문 언어 정책 유지"
    verification: "표시명으로 코드를 추측·서로 다른 판 조합·본문을 모델로 재작성·초기 표시를 새 턴으로 접수하면 실패"
    completion_boundary: CR-047. 후속 FEAT-107/agent 실제 표시·제출 검증. SLICE-010의 생산 포트 시험으로 이 사례 전체를 통과 처리하지 않는다.
    status: planned

  - id: TC-0105
    feature: FEAT-010
    features: [FEAT-107]
    usecase: UC-021
