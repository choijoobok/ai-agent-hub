    when: "현재 저장·보호된 정확 과거 판 포트 조회·조회 전용 편집 시도"
    then: "과거 코드의 당시 형식/원문/버전·사유/시각을 독립 이력에서 읽고 현재값으로 합성하지 않는다. 조회 전용은 미리보기만, 권한 없음은 본문 미제공. 지식 이력/원천 불변"
    verification: "과거 판을 최신본문으로 대체·이력에서쓰기·조회 권한만으로 수정·지식 이력에 혼입하면 실패"
    verification_status: ChatHelpPage.test.tsx·SafeContentRendererTest·ChatHelpLiveTest의 변경 범위 시험. 실제 Portal 소비/표시는 후속 FEAT-107 소유.
    followup: SCR-069 검색·반출·읽기 전용 상속 화면은 FEAT-033의 TC-0333/0335/03311에서 별도 검증한다.
