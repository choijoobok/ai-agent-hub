  - id: TC-0106
    feature: FEAT-107
    features: [FEAT-010]
    usecase: UC-021
    reqs: [REQ-308, REQ-106, REQ-009, REQ-601]
    screens: [SCR-014, SCR-069, SCR-101]
    type: business_exception
    actor: ACT-003
    title: "제출 당시 주의사항·동적 전송 정보와 지식 경계"
    given: "INPUT_NOTICE 표시 뒤 콘텐츠/공급경로 변경·누락·버전/범위 불일치·사용법 질문"
    when: "직접 입력 제출 및 실제 모델 전송 전 검사·대화형 안내"
    then: "실제 표시한 정적 안내 판과 처리 목적/자료 범위/후보 경로·설정 근거를 요청에 연결해 검증한다. 누락/불일치/표시불가는 전송 전 차단하고 재표시 후 사용자 제출을 받는다. 이미 전송한 사실을 사후동의로 바꾸지 않음. 사용법 질문은 허용 활성 지식 검색이며 표시 콘텐츠 자동복제/임베딩 없음"
    verification: "최신 안내로 제출 당시판 덮기·본문 변수치환으로 동적경로 위조·실패를정상동의·모델생성동의·구분저장으로 지식자동변경하면 실패"
    completion_boundary: CR-047. 후속 FEAT-107/agent 실제 표시·제출 검증. SLICE-010의 생산 포트 시험으로 이 사례 전체를 통과 처리하지 않는다.
    status: planned
