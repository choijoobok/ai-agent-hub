testcases:
  - id: TC-0101
    feature: FEAT-010
    features: [FEAT-107]
    usecase: UC-021
    reqs: [REQ-308, REQ-106, REQ-009, REQ-601]
    screens: [SCR-014, SCR-069, SCR-101]
    type: business_exception
    actor: ACT-003
    title: "구분별 단일 본문과 선택 문맥 보존"
    given: "고정 세 구분과 서로 다른 미저장 원문/형식"
    when: "구분 왕복·형식 변경·선택 구분 조회/취소"
    then: "코드/명칭/위치/시점은 고정이고 콘텐츠 목록/자산매핑은 없다. 구분별 편집본을 유지하며 형식 변경은 원문을 변환하지 않는다. 다른 구분의 편집본은 재조회/취소로 바뀌지 않는다"
    verification: "구분을 임의 추가/삭제하거나 다른 구분 본문을 덮거나 형식 변경으로 원문을 변환하면 실패"
    verification_status: ChatHelpPage.test.tsx·SafeContentRendererTest·ChatHelpLiveTest의 변경 범위 시험. 실제 Portal 소비/표시는 후속 FEAT-107 소유.
    status: implemented

