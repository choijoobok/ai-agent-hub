testcases:
  - { id: TC-5017, feature: FEAT-501, usecase: UC-501, type: normal, title: "관리자와 Portal 겸임자의 별도 계정 발급", actor: ACT-012, given: "관리자 계정만 있는 운영자와 별도 Portal 계정을 발급받은 같은 사람", when: "관리자 등록 뒤 Portal 이용 및 두 영역 로그인을 요청", then: "관리자 등록으로 Portal 계정을 자동 발급/연결하지 않는다. Portal 이용에는 별도 Portal 계정/인증이 필요하고 관리자 계정은 자체 인증으로만 관리 콘솔을 이용한다", change: CR-028, verification_status: "계약 시험 예정·미구현" }
  - { id: TC-5018, feature: FEAT-501, usecase: UC-501, type: business_exception, title: "계정 상태·인증정보·회수의 영역별 비전파", actor: ACT-012, given: "같은 사람이 가진 별도 관리자/Portal 계정과 각각의 세션", when: "각 영역에서 등록·비활성화·잠금·비밀번호 초기화·로그아웃·권한 회수를 각각 수행", then: "대상 영역에만 적용되고 다른 계정·비밀번호·권한·세션을 생성/변경/종료하지 않는다. SYS_USER 물리 삭제는 기존 규칙대로 거부하며 Portal 삭제/보존은 확정된 별도 계약에 따른다", change: CR-028, verification_status: "계약 시험 예정·미구현" }
  - { id: TC-5019, feature: FEAT-501, usecase: UC-501, type: permission, title: "Portal 인증으로 관리자 API 접근과 계정 변경 거부", actor: ACT-001, given: "Portal 자체 계정/SSO/대상 인증 주체 및 Portal 세션과 같은 문자열 ID의 관리자", when: "Portal 인증 근거로 관리 콘솔·system/admin 관리 API·관리자 초기화/잠금 해제를 요청", then: "관리자 인증으로 수락하지 않고 관리자 세션을 발급/교체하지 않는다. 현재 관리자 인증과 해당 메뉴/액션 권한을 통과한 요청만 허용한다", change: CR-028, verification_status: "계약 시험 예정·미구현" }
  - { id: TC-5016, feature: FEAT-501, usecase: UC-501, type: normal, title: "초기 관리자 비밀번호와 강제 변경", actor: ACT-012, given: "기본 시드 admin과 비밀번호를 이미 바꾼 admin을 각각 준비", when: "초기 비밀번호 보정 적용 후 로그인·직접 URL 이동·비밀번호 변경", then: "기본 시드만 admin 해시·PWD_INIT_YN=Y·PWD_CHG_DTM=NULL로 보정, 대상의 기존 세션과 속성도 종료하고 변경한 계정·세션과 다른 계정은 불변. 제한 세션은 변경 폼과 로그아웃만 제공하고 업무 API를 차단하며 변경 실패 시 제한 유지·성공 후 해제" }
  - { id: TC-5011, feature: FEAT-501, usecase: UC-501, type: normal, title: "허용 계정 로그인과 세션 발급", actor: ACT-012, given: "사용·기간·잠금·휴면·IP·비밀번호가 모두 유효", when: "API-501 로그인", then: "세션과 현재 authzVersion 발급, ENT-505 성공 이력 1건" }
  - { id: TC-5012, feature: FEAT-501, usecase: UC-501, type: validation, title: "계정과 IP 입력 검증", actor: ACT-012, given: "잘못된 기간 또는 IPv4/IPv6 CIDR", when: "API-511 또는 API-516 저장", then: "400, ENT-501·503 불변" }
  - { id: TC-5013, feature: FEAT-501, usecase: UC-501, type: business_exception, title: "로그인 조건 하나만 실패해도 세션 거부", actor: ACT-012, given: "잠금·휴면·기간·IP 중 하나씩 실패하는 표", when: "API-501 로그인", then: "모든 행 401, 세션 0건, 내부 결과 코드가 원인별 기록" }
  - { id: TC-5014, feature: FEAT-501, usecase: UC-501, type: permission, title: "타 사용자 세션 종료 차단", actor: ACT-012, given: "USER_MGMT EXECUTE 권한 없음", when: "API-518 직접 호출", then: "403, 대상 세션 유지" }
  - { id: TC-5015, feature: FEAT-501, usecase: UC-501, type: normal, title: "계정 기능 경로 전환과 데이터 무손실", actor: ACT-012, given: "ENT-501~505 기준선과 기존 계정 API 응답", when: "신규 경로로 전환", then: "신규 응답 동등, 테이블·행·PK·해시 동일, 구 경로와 참조 0건" }

  - { id: TC-5021, feature: FEAT-502, usecase: UC-502, type: normal, title: "역할과 개인 예외의 유효 권한 합성", actor: ACT-012, given: "역할 READ와 기간 내 개인 SAVE 예외", when: "API-537 조회", then: "READ·SAVE가 한 유효 권한으로 반환" }
  - { id: TC-5022, feature: FEAT-502, usecase: UC-502, type: validation, title: "존재하지 않는 권한 대상 저장 거부", actor: ACT-012, given: "없는 사용자·역할·메뉴 중 하나", when: "API-528·532·534 저장", then: "400 또는 404, ENT-507~509 불변" }
  - { id: TC-5023, feature: FEAT-502, usecase: UC-502, type: business_exception, title: "권한 회수 후 오래 열린 세션의 후속 요청 거부", actor: ACT-001, given: "세션 발급 뒤 권한 회수·무효화 표식 저장과 정상 동작하는 사용 이력 기록기", when: "회수된 액션으로 후속 서비스 호출", then: "현재 권한 재계산 뒤 403, 업무 서비스 미호출, 회수 대상 권한 행 삭제, 권한 변경 API의 SYS_LO_ACCESS 사용 이력 1건. 권한 해시 불일치만으로 재인증을 요구하지 않는다" }
  - { id: TC-5024, feature: FEAT-502, usecase: UC-502, type: permission, title: "역할 겸임 허용과 데이터 기반 판정", actor: ACT-012, given: "운영·감사·AI 품질 역할을 같은 사용자에게 부여", when: "저장 후 유효 권한 조회", then: "하드코딩 거부 없이 부여 데이터의 액션 합집합 반환" }
  - { id: TC-5025, feature: FEAT-502, usecase: UC-502, type: normal, title: "권한 기능 경로 전환과 데이터 무손실", actor: ACT-012, given: "ENT-506~509 기준선과 기존 응답", when: "신규 경로 전환", then: "부여 행·유효 기간·유효 권한 결과 동일, 구 경로 0건" }
  - { id: TC-5026, feature: FEAT-502, usecase: UC-502, type: concurrency, title: "같은 역할 권한의 동시 전체 저장", actor: ACT-012, given: "관리자 둘이 같은 역할의 전건 트리를 조회하고 서로 다른 메뉴를 변경", when: "두 저장을 차례로 완료", then: "나중에 완료된 전체 스냅샷이 이기며 조용한 병합을 만들지 않고 두 요청의 접근 이력을 남김" }
  - { id: TC-5027, feature: FEAT-502, usecase: UC-502, type: concurrency, title: "재계산 도중 새 권한 회수 신호 보존", actor: ACT-001, given: "기존 무효화 표식을 읽은 JDBC 세션과 재계산 중 새 회수", when: "회수 표식 저장 뒤 이전 계산 결과를 늦게 저장", then: "다음 요청은 표식 불일치를 감지해 재계산하고 회수된 액션을 403으로 거부한다. 최초 계산과 같은 메모리 세션 경합도 확인한다" }
  - { id: TC-5028, feature: FEAT-502, usecase: UC-502, type: concurrency, title: "로그인 등록 전 권한 회수 재검사", actor: ACT-001, given: "로그인 권한 계산 뒤 세션이 저장소에 등록되기 전 회수 가능성", when: "로그인 후 첫 보호 요청", then: "최초 세션 권한을 반드시 재계산하고 이후 표식·업무일자가 같으면 캐시를 재사용한다" }

  - { id: TC-5031, feature: FEAT-503, usecase: UC-503, type: normal, title: "등록·매핑·액션 일치 API 허용", actor: ACT-001, given: "API와 메뉴 READ 매핑 및 사용자 READ 권한", when: "해당 신규 service API 호출", then: "업무 서비스 실행과 접근 이력 1건" }
  - { id: TC-5032, feature: FEAT-503, usecase: UC-503, type: validation, title: "순환 메뉴와 중복 URL 저장 거부", actor: ACT-012, given: "자기 하위로 이동하거나 이미 사용 중인 URL", when: "API-539~542 호출", then: "409, ENT-510 트리 불변" }
  - { id: TC-5033, feature: FEAT-503, usecase: UC-503, type: business_exception, title: "인가 사슬 한 연결씩 제거하면 실패 폐쇄", actor: ACT-001, given: "API 등록·메뉴 매핑·액션 권한을 하나씩 제거한 표", when: "service API 직접 호출", then: "모든 행 403, 업무 서비스 호출 0회" }
  - { id: TC-5034, feature: FEAT-503, usecase: UC-503, type: permission, title: "URL 또는 역할명만으로 우회 불가", actor: ACT-001, given: "ADMIN 이름 역할 또는 화면 URL만 알고 액션 권한 없음", when: "신규 service API 호출", then: "403" }
  - { id: TC-5035, feature: FEAT-503, usecase: UC-503, type: normal, title: "system API 경로와 메뉴 시드 단독 등록", actor: ACT-012, given: "현재 service API 시드99개와 구현된 common API-600. common 경로는 메뉴 매핑 시드에서 제외하고 정확 인증 설치 목록으로 검증", when: "시드 생성과 저장소 정적 검사", then: "신규 경로·액션·메뉴 매핑 일치, system 없는 구 경로·별칭·포괄 라우터 0건" }
  - { id: TC-5036, feature: FEAT-503, usecase: UC-503, type: business_exception, title: "프로파일 필수와 local 전용 빌드 변형", actor: ACT-012, given: "local·dev·운영 프로파일과 프로파일 누락, includeSample·skipFrontend 명시 옵션 조합", when: "bootRun 또는 패키지 JAR을 기동하고 빌드 태스크 그래프를 검사", then: "프로파일 누락은 데이터소스와 무관하게 기동 거부, local 기본은 sample 포함·프론트 생략, 그 밖의 기본은 sample 제외·프론트 포함, 명시 옵션은 기본값보다 우선" }

  - { id: TC-5041, feature: FEAT-504, usecase: UC-504, type: normal, title: "일반 코드와 참조값 저장", actor: ACT-012, given: "일반 그룹과 유효 참조 정의", when: "API-549·551·553 저장", then: "ENT-513~516과 코드명 원자 반영" }
  - { id: TC-5042, feature: FEAT-504, usecase: UC-504, type: validation, title: "정의 없는 참조값 저장 거부", actor: ACT-012, given: "REF_CD 정의가 없는 값", when: "API-551 저장", then: "400, 모든 코드 테이블 불변" }
  - { id: TC-5043, feature: FEAT-504, usecase: UC-504, type: business_exception, title: "시스템 코드와 자식 보유 그룹 삭제 거부", actor: ACT-012, given: "SYS_YN=Y 또는 자식 코드 존재", when: "삭제 상태로 저장", then: "409, 원본·코드명·참조값 유지" }
  - { id: TC-5044, feature: FEAT-504, usecase: UC-504, type: permission, title: "공통 조회와 관리 저장 권한 분리", actor: ACT-001, given: "로그인했지만 CODE_MGMT SAVE 없음", when: "API-554 조회 후 API-551 직접 호출", then: "조회 성공, 저장 403" }
  - { id: TC-5045, feature: FEAT-504, usecase: UC-504, type: normal, title: "코드 경로 전환과 4개 테이블 무손실", actor: ACT-012, given: "코드 기준선과 기존 응답", when: "신규 경로 전환", then: "정렬·참조값·코드명 동일, DB 해시 동일, 구 경로 0건" }

  - { id: TC-5051, feature: FEAT-505, usecase: UC-505, type: normal, title: "언어별 값 저장과 번들 갱신", actor: ACT-012, given: "생성된 키와 한국어·영어 값", when: "API-556 저장 후 API-557 조회", then: "값 반영과 MESSAGE cacheVersion 정확히 1 증가" }
  - { id: TC-5052, feature: FEAT-505, usecase: UC-505, type: validation, title: "관리 화면 임의 메시지 키 생성 거부", actor: ACT-012, given: "ENT-517에 없는 MSG_KEY 신규 행", when: "API-556 저장", then: "400, 키와 값 생성 0건" }
  - { id: TC-5053, feature: FEAT-505, usecase: UC-505, type: business_exception, title: "미번역 메시지 폴백", actor: ACT-001, given: "요청 언어 값 없음과 기본 언어 값 없음 두 경우", when: "API-557 조회와 표시 계층 처리", then: "기본 언어 값이 있으면 사용한다. 둘 다 없으면 번들에서 키 생략, label·text는 키 문자열, 서버 오류는 ErrorCode 기본문구로 표시한다" }
  - { id: TC-5054, feature: FEAT-505, usecase: UC-505, type: permission, title: "메시지 값 저장 권한 차단", actor: ACT-001, given: "MESSAGE_MGMT SAVE 없음", when: "API-556 직접 호출", then: "403, ENT-518·519 불변" }
  - { id: TC-5055, feature: FEAT-505, usecase: UC-505, type: normal, title: "메시지 경로 전환과 캐시 무손실", actor: ACT-012, given: "키·값·버전 기준선과 다중 인스턴스", when: "신규 경로 전환", then: "응답 동등, 커밋 인스턴스 즉시·타 인스턴스 TTL 내 갱신, 구 경로 0건" }
  - { id: TC-5056, feature: FEAT-505, usecase: UC-505, type: concurrency, title: "동시 저장의 메시지 버전 증가와 롤백", actor: ACT-012, given: "서로 다른 메시지 변경과 기존 버전 N", when: "두 트랜잭션 커밋 또는 한 저장 롤백", then: "두 커밋은 N+2, 롤백한 저장은 증가하지 않는다. 초기 버전행이 없는 단독 저장도 초기화한다" }
  - { id: TC-5057, feature: FEAT-505, usecase: UC-505, type: concurrency, title: "무효화 뒤 이전 메시지 캐시 재등록 방지", actor: ACT-012, given: "이전 DB 본문을 읽는 캐시 적재와 저장 커밋", when: "무효화 뒤 이전 적재가 늦게 종료", then: "새 캐시는 이전 본문으로 채워지지 않고 후속 조회는 새 문구를 읽는다" }
  - { id: TC-5058, feature: FEAT-505, usecase: UC-505, type: concurrency, title: "공개 번들 버전과 본문 일치", actor: ACT-001, given: "다른 노드의 오래된 TTL 캐시 또는 번들 조회 중 메시지 저장", when: "API-557로 새 번들 요청", then: "DB 본문과 전후 버전이 일치한 결과만 반환하며 3회 연속 불일치하면 409와 본문 없음, 같은 클라이언트 버전은 기존 unchanged 응답" }

  - { id: TC-5061, feature: FEAT-506, usecase: UC-506, type: normal, title: "설정 오버라이드 적용과 기본값 복원", actor: ACT-012, given: "편집 가능 키와 배포 기본값", when: "값 저장 후 오버라이드 삭제", then: "저장값 적용 뒤 기본값 복원, CONFIG 버전 저장마다 1 증가" }
