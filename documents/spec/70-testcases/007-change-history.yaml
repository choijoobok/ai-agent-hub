      - SCR-042
    type: "validation"
    title: "_HIST 이름·서로게이트 PK·세트 동일 시각"
    actor: ACT-004
    given: "단일 그리드/마스터·탭 저장과 직접 변경, 삭제·부분 실패·권한/보존 경계의 합성 데이터"
    when: "저장 트랜잭션·원본/이력 행·별도 이력 메뉴의 검색/선택/반출을 대조"
    then: "원본명_HIST, HIST_ID 단일 PK, HISTORY_NO+원 키 유일성, 마스터 HIST_DTM 필수·자식 HIST_DTM 부재와 부모 참조를 검사한다."
    verification: "단위/DB 통합/계약/E2E; 제목의 규칙을 반대로 허용했을 때 실패해야 한다. 미구현 제품 시험 명세다."
    status: "planned"
  - id: TC-0337
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-040
      - SCR-041
      - SCR-042
    type: "business_exception"
    title: "직접 저장 반영 시점·철회 이전 근거 보존"
    actor: ACT-004
    given: "미저장 입력·저장 실패와 과거 승인/반려/미반영 요청 근거가 있음"
    when: "직접 저장·실패·과거 이력 열람·늦은 옛 승인 시도"
    then: "실제 직접 저장 성공과 전체 이력이 원자 반영된다. 미저장/실패는 실제 변경 이력을 추가하지 않는다. 과거 승인·반려 근거는 읽기 전용으로 보존하고 철회된 대기 요청·늦은 승인은 현재값을 바꾸지 않는다."
    verification: "단위/DB 통합/계약/E2E; 제목의 규칙을 반대로 허용했을 때 실패해야 한다. 미구현 제품 시험 명세다."
    status: "planned"
  - id: TC-0338
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-040
      - SCR-041
      - SCR-042
    type: "permission"
    title: "비밀·현재 관측 배제와 세트 보존 경계"
    actor: ACT-004
    given: "단일 그리드/마스터·탭 저장과 직접 변경, 삭제·부분 실패·권한/보존 경계의 합성 데이터"
    when: "저장 트랜잭션·원본/이력 행·별도 이력 메뉴의 검색/선택/반출을 대조"
    then: "비밀/해시/토큰/현재 관측·다른 소유 사용처 미복제, 미지원/파기 세트는 현재값으로 복구하지 않음"
    verification: "단위/DB 통합/계약/E2E; 제목의 규칙을 반대로 허용했을 때 실패해야 한다. 미구현 제품 시험 명세다."
    status: "planned"
  - id: TC-0339
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-003
      - SCR-042
    type: "business_exception"
    title: "적용본 관리·제한된 변경 권한·관리자 승인 철회"
    actor: ACT-004
    given: "READ만 가진 admin, 대상 변경 권한을 가진 업무 전문가, 권한이 회수된 관리자가 같은 적용본을 조회"
    when: "REQ-601.direct_management와 management_storage에 따라 직접 저장을 시도"
    then: "READ/일반 admin 계정만으로 저장 불가. 저장 직전 대상별 현재 변경 권한과 전체 구성을 검사해 적합한 변경만 현재값·전후 이력·행위자·시각·사유와 원자 반영한다. 관리자 승인 요청/전결/승인 사용 설정·SNP를 새로 만들지 않는다. Portal발 신청 승인은 해당 소유 계약대로 유지한다."
    status: "planned"
    verification: "제품 구현 시 단위/통합 시험. 명세 검사는 제품 트랜잭션 실행 시험을 대신하지 않는다."
  - id: TC-03310
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-003
      - SCR-042
    type: "business_exception"
    title: "직접 저장의 마스터 리비전·기준/결과 보존"
    actor: ACT-004
    given: "마스터 REVISION12와 전체 소유 자식, 같은 기준12를 가진 두 관리자의 편집본"
    when: "자식만 변경해 BASE_REVISION12로 저장한 뒤 같은 명령 재전송·뒤늦은 다른 저장"
    then: "최초 성공은 마스터13·HIST13·명령 결과를 원자 기록한다. 같은 명령 재전송은 원 결과를 반환하고 추가 증가하지 않는다. 뒤늦은 다른 기준12 저장과 이력 실패는 현재값·이력을 변경하지 않는다."
    status: "planned"
    verification: "제품 구현 시 단위/통합 시험. 명세 검사는 제품 트랜잭션 실행 시험을 대신하지 않는다."
  - id: TC-03311
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-003
      - SCR-042
    type: "business_exception"
    title: "현재 구성·과거 이력 문맥 분리와 이력 불변"
    actor: ACT-004
    given: "현재 전체 구성과 서로 다른 HISTORY_NO의 두 이력 세트, 과거 내용 기반 새 편집"
    when: "이력 조회 또는 현재 기준 리비전을 가진 직접 저장"
    then: "서로 다른 HISTORY_NO나 현재 자식을 섞어 과거 내용을 합성하지 않는다. 과거 이력은 변경 불가. 과거 내용을 참고한 새 변경은 현재 권한·기준 리비전·참조 검증을 거친 새 현재값·이력으로 남긴다. REQUEST/DRAFT/SNP 신규 흐름은 제공하지 않는다."
    status: "planned"
    verification: "제품 구현 시 단위/통합 시험. 명세 검사는 제품 트랜잭션 실행 시험을 대신하지 않는다."
  - id: TC-03312
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-003
      - SCR-042
    type: "business_exception"
    title: "과거 실행 리비전과 참조 보호"
    actor: ACT-004
    given: "현재 적용본·동시 직접 저장과 진행/대기 실행이 참조하는 과거 이력"
    when: "REQ-601.management_storage의 저장·이력 조회·보존 규칙을 대조"
    then: "새 리비전 반영 뒤 진행/대기 실행은 이전 HIST 전체 세트를 읽는다. 참조 중인 이력 파기를 거부하고 현재 권한 회수는 즉시 적용한다. 세트 내부 후보 참조는 모두 새 적용 리비전으로 확정하며 외부 참조는 자동 최신화하지 않는다."
    status: "planned"
    verification: "제품 구현 시 단위/통합 시험. 명세 검사는 제품 트랜잭션 실행 시험을 대신하지 않는다."
