testcases:
  - id: TC-0331
    feature: FEAT-033
    usecase: UC-031
    screens:
      - SCR-040
      - SCR-041
      - SCR-042
    type: "normal"
    title: "단일 그리드 성공 행 전체 복사·부분 성공"
    actor: ACT-004
    given: "단일 그리드/마스터·탭 저장과 직접 변경, 삭제·부분 실패·권한/보존 경계의 합성 데이터"
    when: "저장 트랜잭션·원본/이력 행·별도 이력 메뉴의 검색/선택/반출을 대조"
    then: "성공한 변경 행만 전체 컬럼 복사, 실패 행/현재 페이지 전체 복사 없음"
    verification: "단위/DB 통합/계약/E2E; 제목의 규칙을 반대로 허용했을 때 실패해야 한다. 미구현 제품 시험 명세다."
    status: "planned"
