    type: "normal"
    title: "마스터/탭 전체 세트·원 시각 보존"
    actor: ACT-004
    given: "단일 그리드/마스터·탭 저장과 직접 변경, 삭제·부분 실패·권한/보존 경계의 합성 데이터"
