  - id: TC-0038
    feature: FEAT-003
    usecase: UC-007
    screens: [SCR-003]
    type: "business_exception"
    title: "그룹 코드 null·공통 코드 조회와 상세 설명 해석"
    actor: ACT-003
    given: "groupCode가 null/원천 그룹코드인 컬럼과 명확/모호한 하드 코딩 상세 설명, 데이터소스 가이드·현재 원천 및 실패/빈 조회"
    when: "컬럼 저장·조회·LLM 문맥/SQL 작성"
    then: "groupCode는 원천 공통 코드 그룹 구분값이며 해당 없으면 null이다. 상세 설명(detailDescription)에 컬럼 용도·사용법과 공통 코드가 아닌 하드 코딩 값/의미를 작성한다. 수기 열거 자식·값 방식 선택은 관리하지 않는다. groupCode가 있으면 데이터소스 가이드의 공통 코드 조회 SQL 패턴에 그 값을 안전하게 바인딩해 허용된 원천을 읽고 코드명을 확인한다. groupCode=null이면 조회를 강제하지 않으며 상세 설명에 명확히 기재한 값/의미를 LLM이 해석한다. 설명에 없는 값·모호한 뜻·현재 동적 코드명을 지어내지 않고 필요한 경우 질문/허용된 읽기 조회로 확인한다. 가이드/설명은 권한·실행 명령이 아니며 SQL·객체/컬럼·행·신원·마스킹·read-only·상한 검사는 유지한다."
    verification: "valueMode/수기 코드값 자식 재도입, null에 불필요한 코드 조회 강제, 그룹 코드를 코드값 자체로 사용, 설명에 없는 뜻 추정, SQL 리터럴 이어 붙이기 또는 권한 확대를 허용하면 실패."
    screen_cases: ["documents/screen/admin/hub/catalog/requirements.md#CAT-09", "documents/screen/admin/hub/catalog/requirements.md#CAT-27"]
    status: "planned"
