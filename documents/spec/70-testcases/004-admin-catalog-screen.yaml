  - id: TC-0119
    feature: FEAT-011
    usecase: UC-008
    reqs: [REQ-301]
    screens: [SCR-039]
    type: business_exception
    title: "관계 설명의 양방향 매칭 누락과 질문별 JOIN 의미"
    actor: ACT-003
    given: "왼쪽 주문·오른쪽 고객의 N:1 관계와 tenant_id/customer_id 전체 쌍, 고객 미매칭 주문·주문 없는 고객이 가능한 예시 설명 및 매칭 근거 미확인 사례"
    when: "설명을 편집/원복·소유 관계 영역 저장/이력 조회하고 FEAT-202가 주문 전체·매칭 주문만·고객 전체 질문의 SQL을 작성한다"
    then: "기존 description과 전체 HIST에 양방향 가능성/근거를 보존하고 테이블 관계 가이드에 전달한다. 주문 전체면 주문 기준 LEFT JOIN으로 미매칭 고객을 NULL 표현하고, 매칭 주문만이면 그 범위로 제한한다. 고객 전체면 고객을 SQL 기준으로 주문 없는 고객을 유지한다. 전체 쌍은 AND로 연결한다. 기준 전체 보존 요청의 상대 조건은 ON/WHERE 의미와 필수 행/신원 정책을 함께 충족한다. 1:N/NULL 허용이나 화면 좌우로 필수 매칭/JOIN을 단정하지 않고 결과 의미를 바꾸는 미확인은 질문/허용 조회로 확인한다"
    verification: "목업은 장문 설명/예시·편집/원복을 확인한다. 실제 저장/HIST·agent 계약/통합은 후속이며, 고정 JOIN 필드 추가·미매칭 기준 행 누락·화면 좌우에 SQL 방향 고정·복합 쌍 생략·상대 WHERE 조건으로 의도하지 않은 미매칭 제거·유일성/매칭 근거 창작·행/신원 정책 우회를 허용하면 실패해야 한다"
    screen_cases: ["documents/screen/admin/hub/catalog-relation/requirements.md#REL-07"]
    status: planned
