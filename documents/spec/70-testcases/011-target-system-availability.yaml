  - id: TC-00123
    feature: FEAT-001
    usecase: UC-015
    reqs: [REQ-601, REQ-604]
    screens: [SCR-001, SCR-004]
    type: "business_exception"
    title: "판정 원자 저장과 해당 기동 준비 전 차단"
    actor: ACT-004
    given: "이전 정상 판정·등록 행과 새 기동의 전체 설정 검증 실패 또는 판정 묶음 저장 실패"
    when: "메타 동기화·판정 저장·준비 개방 사이에서 실패시키고 화면/호출을 수행한다"
    then: "실패 기동은 사용을 열지 않고 이전/다른 기동의 정상값을 자기 준비로 사용하지 않는다. 부분 메타/판정 확정·전량 삭제·실행 전송이 없고 정상 행도 저장된 성공 묶음에서만 재사용한다."
    status: implemented
    verification: "제품 구현 후 통합·장애 주입. 판정 저장 성공 전에 준비를 열거나 행 없음/읽기 실패를 일치로 바꾸면 실패해야 한다."
    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
  - id: TC-00124
    feature: FEAT-001
    usecase: UC-015
    reqs: [REQ-601, REQ-603, REQ-604]
    screens: [SCR-001, SCR-002]
    type: "validation"
    title: "명시 비교 속성·비밀 제외 정규 지문"
    actor: ACT-004
    given: "같은 최종 설정의 주석/키 순서/순서 무관 목록 변형·프로파일/환경변수 재정의·비밀값 및 비밀 포함 URL/헤더·관리자 표시 재정의"
    when: "서비스 허용 비교표로 비밀 없는 최종 설정을 투영·정규화해 appliedSettingsId를 생성하고 기동 판정한다"
    then: "동일 의미/동일 환경/비교 규칙은 같은 지문, 비밀만 교체해도 같음. 연결 삭제/소속/안전한 접속 대상/인증 방식/비교 규칙 변경은 다른 지문. 의미 있는 배열 순서·자료형/null/빈값·식별자 대소문자는 보존. 관리자 재정의는 YAML 불일치로 보지 않는다. 비밀/암호문/비밀 해시가 입력·로그·DB 근거에 없고 비밀 해석 실패는 지문 일치와 별도로 해당 기동/사용을 차단한다."
    status: implemented
    verification: "제품 구현 후 단위·계약. 비밀값/전체 원문 객체를 지문에 넣거나 최종 우선순위를 무시·모든 배열을 정렬·접속 대상 변경을 무시하는 변이에서 실패해야 한다."
    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
  - id: TC-00125
    feature: FEAT-001
    usecase: UC-015
    reqs: [REQ-601, REQ-603, REQ-604, REQ-105]
    screens: [SCR-001, SCR-002, SCR-004]
    type: "concurrency"
    title: "서로 다른 설정 버전과 같은 지문의 다른 기동 분리"
    actor: ACT-004
    given: "구/신 설정 노드가 같은 키의 YAML 기본명/별칭을 다르게 사용하며 공존하고, DBMS 변경처럼 구 실행과 비호환인 경우 및 같은 비밀 제외 지문인 별도 기동 한 개의 비밀 해석 실패 상태"
    when: "각 노드의 동기화·판정 조회·실제 호출·배포 해제와 이전 노드 재가입을 교차 실행한다"
    then: "환경/적용 버전/종류/정확 키별 판정과 고정 DB 비교 근거를 분리해 상대 버전·정상 노드를 덮지 않는다. 현재 메타는 배포가 선택한 한 세대만 갱신하고 구 노드는 자기 근거를 재사용한다. 비호환 메타 변경은 기존 배출 후 전환을 따른다. 배포 허용과 자기 기동 준비·정확 연결 객체를 통과한 노드만 자기 버전 판정을 사용한다. 지문 문자열 정렬로 현역을 정하지 않으며 같은 지문은 인증/실행 승인 재사용 근거가 아니다."
    status: implemented
    verification: "제품 구현 후 다중 노드 통합. 단일 전역 플래그·같은 지문이면 준비 완료·구 기동 자동 재가입·정상 다른 노드 일괄 UNKNOWN 변이에서 실패해야 한다. 신 버전 복구가 아직 허용된 구 버전 OPEN을 닫으면 실패, 구 버전 배포 종료는 복구와 다른 사건/현역 집계 제외로 검수하고 과거 근거와 새 복구의 연결을 보존한다."
    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
