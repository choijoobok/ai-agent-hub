    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
  - id: TC-00420
    feature: FEAT-004
    usecase: UC-018
    screens: [SCR-004]
    type: "validation"
    title: "명시 연결과 수동 사용·연결 진단 분리"
    given: "제공 시스템 변경·연결 미선택·수동 OFF·YAML 연결 누락/미확인"
    when: "선택/저장·목록 조회·직접/저장된 실행 경로 호출"
