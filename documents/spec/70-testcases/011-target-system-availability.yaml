# YAML 대상 시스템·자산 사용/연결 경고 승인 보완의 계획 시험
testcases:
  - id: TC-00120
    feature: FEAT-001
    usecase: UC-015
    screens: [SCR-001]
    type: "concurrency"
    title: "기동 동기화 재정의 보존·검증·멱등성"
    given: "이름/설명 보완값과 기존 감사·동일 내용 재기동·잘못된 전체 YAML"
    when: "설정 동기화와 보완 저장을 교차 실행"
    then: "기존 관리자 재정의/최초 감사 보존, 같은 내용은 버전/이력 불변, 전체 YAML 오류는 부분 반영/전 연결 삭제로 처리하지 않음"
    actor: ACT-004
    status: implemented
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
  - id: TC-00121
    feature: FEAT-001
    usecase: UC-015
    screens: [SCR-001, SCR-004, SCR-525]
    type: "business_exception"
    title: "제거 연결 영향 경고와 다른 유효 연결 보존"
    given: "한 시스템에 두 연결·각 연결을 쓰는 API·삭제 연결을 참조한 저장 워크플로우"
    when: "YAML에서 연결 하나를 제거하고 조회/실행"
    then: "상단 집계는 불일치 배지이며 스위치/편집 없이 일치·확인 필요와 구분한다. 다른 유효 연결 API는 일괄 차단하지 않는다. 제거 연결 호출은 전송 전 오류, DB/신원/정의 참조 보존·원인 경고 및 영향 표시"
    actor: ACT-004
    status: implemented
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
    delivery_boundary: CR-049 A. 현재 시스템/연결 판정·원인 경고·Portal 신원 보존은 SLICE-001 실제 DB로 검증하며 실제 업무 API·워크플로우 전송과 대시보드는 FEAT-004/118/510 연결 뒤 검증한다.
    verification_scope: FEAT-001.delivery_boundary의 CR-049 A 생산 범위. 핵심 반례는 TargetSystemLiveTest·TargetConnectionsTest·BusinessApiInvokerTest·ConnectionDisplayTest와 대상 화면 API 시험/브라우저로 확인한다. 실제 후속 소비를 통과로 세지 않는다.
