# YAML 대상 시스템·자산 사용/연결 경고 승인 보완의 계획 시험
testcases:
  - id: TC-00120
    feature: FEAT-001
    usecase: UC-015
    screens: [SCR-001]
    type: "concurrency"
    title: "기동 동기화 재정의 보존·검증·멱등성"
    given: "이름/설명 보완값과 기존 감사·동일 내용 재기동·잘못된 전체 YAML"
    when: "설정 동기화와 보완 저장을 교차 실행"
    then: "기존 관리자 재정의/최초 감사 보존, 같은 내용은 버전/이력 불변, 전체 YAML 오류는 부분 반영/전 연결 삭제로 처리하지 않음"
    actor: ACT-004
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
  - id: TC-00121
    feature: FEAT-001
    usecase: UC-015
    screens: [SCR-001, SCR-004, SCR-525]
    type: "business_exception"
    title: "제거 연결 영향 경고와 다른 유효 연결 보존"
    given: "한 시스템에 두 연결·각 연결을 쓰는 API·삭제 연결을 참조한 저장 워크플로우"
    when: "YAML에서 연결 하나를 제거하고 조회/실행"
    then: "상단 집계 불일치는 ON이지만 다른 유효 연결 API는 일괄 차단하지 않는다. 제거 연결 호출은 전송 전 오류, DB/신원/정의 참조 보존·원인 경고 및 영향 표시"
    actor: ACT-004
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
  - id: TC-00122
    feature: FEAT-001
    usecase: UC-015
    screens: [SCR-001]
    type: "permission"
    title: "YAML 접속 테스트 안전 범위와 조건"
    given: "테스트 미설정/설정·누락 연결·READ+EXECUTE 또는 SAVE만 있는 사용자"
    when: "행 버튼 또는 API070 직접 호출"
    then: "현재 설정·소속·READ/EXECUTE 재검사. 임의 URL/메서드/비밀입력·변경 요청을 받지 않으며 시간 제한된 GET/HEAD 결과만 비밀 없이 반환"
    actor: ACT-004
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
  - id: TC-00420
    feature: FEAT-004
    usecase: UC-018
    screens: [SCR-004]
    type: "validation"
    title: "명시 연결과 수동 사용·연결 진단 분리"
    given: "제공 시스템 변경·연결 미선택·수동 OFF·YAML 연결 누락/미확인"
    when: "선택/저장·목록 조회·직접/저장된 실행 경로 호출"
    then: "시스템별 정확 연결을 필수 재선택하며 기본/타 소속 연결을 대체하지 않는다. 수동 입력과 현재 적용본 진단을 분리하고 실패/복구가 수동 값을 덮지 않음"
    actor: ACT-004
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
  - id: TC-5106
    feature: FEAT-510
    usecase: UC-510
    screens: [SCR-525]
    type: "permission"
    title: "연결 설정 경고 공개 소비와 복구 경계"
    given: "원인 중복 감지·admin 데이터 권한 없음·부분/미지원 참조 점검·설정 복구"
    when: "대시보드 API071 조회와 관련 화면 이동"
    then: "admin 소유 원인 묶음/권한 요약만 표시, 실패/미지원 건수는 null/확인 필요. 성공 복구 검증 후 해소하며 자산 OFF나 단순 조회 실패로 정상 표시/업무 재실행하지 않음"
    actor: ACT-004
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
  - id: TC-11820
    feature: FEAT-118
    usecase: UC-018
    type: "business_exception"
    title: "워크플로우 모든 호출 경로의 현재 자산·설정 차단"
    actor: ACT-011
    given: "과거 발행/자동 승인된 워크플로우와 현재 수동 OFF 또는 제거 연결"
    when: "예약·대화 수동·재시도·재개 실행 시작 및 매 액션 전송"
    then: "현재 사용/참조 조건을 모두 검사해 미전송 단계를 차단·실패/부분 실패 이력과 운영 경고를 연결한다. 이미 전송/완료한 업무를 미실행으로 바꾸거나 자동 전체 재실행하지 않음"
    reqs: [REQ-404, REQ-405, REQ-601]
    status: "planned"
    verification: "제품 구현 후 계약·통합/E2E; 현재 검사 제거·다른 연결 대체·0건 정상 치환·수동 값 자동 덮어쓰기·전체 재실행을 허용하는 반례에서 실패해야 한다."
