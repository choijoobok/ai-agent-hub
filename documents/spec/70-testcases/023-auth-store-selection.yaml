testcases:
  - id: TC-30121
    feature: FEAT-301
    usecase: UC-045
    type: integration
    actor: ACT-009
    title: 같은 artifact의 JDBC/Redis 설정 선택과 엄격한 기동
    given: CR-036 v2 조립·실제 PostgreSQL과 격리 Redis·영역별 설정판
    when: 두 provider 설정으로 같은 artifact 기동 및 누락/미지원/namespace 중복/DB판 불일치/Redis 연결 실패 주입
    then: 선택 구현1개·영역별 filter/resolver1개. 자동 기본 세션 filter0·WAS/in-memory/상대provider 폴백0. 정상 노드 재시작은 epoch/다른 노드 세션을 임의 변경하지 않는다.
    status: planned
    verification: SLICE-308 변경 G3 후 실제 두 저장소/HTTP로 실행. factory의 JDBC 구체 결합·fallback·설정판 검사 삭제 변이는 실패해야 한다. 전용 PostgreSQL/Windows native Redis의 실제 공통 fixture를 실행했으며 제품 설치와 Linux 운영 배포 수락은 별도다.
