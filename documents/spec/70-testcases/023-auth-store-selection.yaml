    given: 실제 SYS_USER/암호이력·현재권한·ADMIN/PORTAL세션·동일제품HTTP
    when: 양provider로그인/본인암호/복구·DBrollback/commit불명·Redis발행실패·응답유실·로그인재시도·한도1동시로그인역순발행/예약만료·제한 변경/프로필의503응답·Portal/디버그주소직접진입
    then: JDBC는암호/이력/회수/새세션전체원자성. Redis는DB확정전전체롤백·확정후새세션실패면새암호재로그인outcome·구접속불수락·쿠키0. 종료admission/원POST자동재실행0·Portal변경0·UIprovider분기0. PENDING예약을포함한기존prevent-login/밀어내기보존·역순발행초과수락0·실패/만료예약해제. API508의503 PASSWORD_CHANGED_REAUTH_REQUIRED는두폼의ADMIN상태/암호입력정리후기존재로그인흐름으로전환하고일반503은구분한다. 성공후새쿠키의API506첫사용을확인하며제한세션을자동해제하지않는다. ADMIN초기조회/신호/wildcard가다른영역을가로채지않고미구현진입을닫힌소유슬롯으로유지한다.
    status: planned
    verification: SLICE-520 v2소비·실제PG/JPA/Redis/HTTP·첫방문/기존쿠키/새로고침과frontend시험. Redis발행대기동안별도권한회수트랜잭션이완료하고후속ACTIVE가거부되는반례로잠금밖publication을확인한다. 503코드분기제거·원POST자동재전송·전역ADMIN라우팅변이는실패해야한다. CR-037의 /admin/login·/admin/password/change 진입/로그아웃/강제변경/재인증/안전복귀와 구 /login·/password/change의 alias/redirect 부재를 검증한다. 실제SMTP는테스트Mailer만사용한다. 제품Portal화면의구현수락은포함하지않는다.
