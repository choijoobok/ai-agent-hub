consistency_review:
  reviewed_at: 2026-10-27
  scope: "RM-P1 admin G1 종료 점검 — admin 소유·공유 현재 차수 요구사항 50건과 연결 프로세스·권한·조회/실행·기준정보 계약. 기존 integration·system 검토 근거를 유지하며 REQ-615는 기존 사용자 결정에 따라 현재 차수 제외"
  unresolved: []
  pairs:
    - ids:
        - "REQ-009"
        - "REQ-027"
      tension: "엄격한 요청·응답 계약과 새 표현 형식의 확장이 충돌할 수 있다"
      resolution: "표현 확장·모르는 블록의 안전한 원문 대체 표시·계약 주 버전 불일치 처리는 ARCH-019·REQ-027을 따른다. REQ-009의 알 수 없는 제어/작업 유형은 실행 차단 대상이며 표시용 표현 블록과 구분한다"
    - ids:
        - "REQ-103"
        - "REQ-108"
      tension: "현재 권한 반영과 한 턴 안에서의 정책 일관성이 충돌할 수 있다"
      resolution: "REQ-108에 따라 최초 필요 시 선택한 내용 버전과 매 접근 시점의 현재 권한을 분리한다. REQ-103의 권한 회수는 같은 턴의 이후 접근·기존 자료 재사용에도 적용하며 승인 유효 시간이나 과거 내용 버전이 이를 대신하지 않는다. 장기 대기 후 내용 재선택은 REQ-102·108을 따른다"
    - ids:
        - "REQ-106"
        - "REQ-107"
      tension: "외부 전송 최소화와 전송 내용 전량 감사가 충돌할 수 있다"
      resolution: "허용·마스킹을 먼저 적용한 실제 전송분만 외부로 보내고, 감사 이력도 그 실제 전송분을 기록한다. 차단된 원문을 감사 목적으로 새로 복제하지 않는다"
    - ids:
        - "REQ-105"
        - "REQ-113"
      tension: "Hub의 실행 통제와 대상 시스템의 중복 실행 책임이 겹칠 수 있다"
      resolution: "REQ-105·113에 따라 별도의 정상 실행 의도와 동일 실행의 재시도를 구분한다. 대상 시스템의 멱등성 보장 선언과 실행 식별을 사용하며 파라미터가 같다는 이유만으로 중복으로 판정하지 않는다. 결과 불명 후 후속 실행은 REQ-105.manual_reexecution의 최신 사용자 확인과 현재 실제 값에 대한 새 승인을 따른다"
    - ids:
        - "REQ-502"
        - "REQ-503"
      tension: "권한을 편집하는 모델과 실제 화면·API 접근 판정이 서로 다른 원천을 볼 수 있다"
      resolution: "역할과 개인 예외는 유효 권한 하나로 합성하고 메뉴 렌더링·로그인 이동·서비스 API가 모두 그 결과를 사용한다"
    - ids:
        - "REQ-505"
        - "REQ-506"
      tension: "메시지 값과 시스템 설정을 함께 바꾸면 다중 인스턴스의 반영 시점이 같아야 한다고 오해하기 쉽다"
      resolution: "메시지는 노드별 번들 캐시를 두므로 공유 버전과 고객사별 TTL 안의 재조회가 필요하다. 설정은 노드 캐시가 없어 다음 작업 스코프가 DB 오버라이드를 다시 합성한다. 두 저장 모두 값과 버전 변경을 부분 성공으로 남기지 않는다"
    - ids:
        - "REQ-107"
        - "REQ-109"
      tension: "전량 감사와 조회 결과 원문의 차등 보관이 충돌할 수 있다"
      resolution: "처리 사실·상태·사용량의 기록 의무와 자료별 보관·파기를 구분한다. 조회 결과 원문의 마스킹 사본은 REQ-107.retention_policy, 실행 원값의 암호화 임시본은 REQ-005, 대화 본문과 파생 사본은 REQ-109를 따른다. 감사 목적이라는 이유로 본문의 파기 기한을 늘리지 않는다"
    - ids:
        - "REQ-105"
        - "REQ-111"
      tension: "업무 API 실행 등록과 API 응답 경로의 전송·마스킹 통제가 서로 다른 admin 화면에서 중복 정의될 수 있다"
      resolution: "API 응답 스키마·마스킹·미지정 경로 경고의 단일 등록 원천은 FEAT-004(SCR-004)다. LLM 전송은 REQ-106의 요청·동의 정책을 따르며 FEAT-019(SCR-017)는 전송 정책·동의 근거와 결과 보존 정책을 참조한다. 과거 허용 플래그 이관은 P3에서 정한다"
    - ids:
        - "REQ-116"
        - "REQ-117"
        - "REQ-118"
        - "REQ-119"
      tension: "다음 달 기본 배정·등급 승급과 이번 달 긴급 추가 사용을 한 흐름으로 처리하면 이미 유효한 한도를 소급 변경하거나 예외 승인의 근거를 잃을 수 있다"
      resolution: "PRC-12에서 쿼터 등급을 적용 월 단위로 잠가 당월·지난 달을 바꾸지 않고, 미래 월 배정과 승급은 대상 월 시작 마감의 효력 기준으로 적용하며 첫 수동 예정 생성 여부로 적용 월을 미루지 않는다. 월중 신규 사용자는 기존 사용자를 재계산하지 않는 일할 자동 배정으로 처리하고, 이번 달 부족은 별도 추가 토큰 신청·승인으로 즉시 반영한다. 승인 이력·예외 승인 근거·월말 만료를 구분해 남긴다"
    - ids:
        - "REQ-107"
        - "REQ-507"
      tension: "감사·이력 화면 자체가 개인정보 열람 경로인데 그 열람을 기록하지 않으면 누가 무엇을 봤는지 사후에 추적할 수 없다"
      resolution: "감사·이력의 목록·상세 열람은 system 공통 사용 이력으로 남기며, REQ-107은 열람자·시각·이력 유형·검색 또는 상세 조회 여부를 감사 사실로 보존한다"
    - ids:
        - "REQ-601"
        - "REQ-105"
        - "REQ-026"
        - "REQ-611"
      tension: "내부 관리 승인을 사용하지 않는 설정이 실제 업무 실행 승인까지 생략하는 것으로 해석될 수 있다"
      resolution: "REQ-601의 관리자 직접 저장은 자산/권한 변경에만 적용하고 실제 업무 액션의 사용자 확인은 REQ-026·105를 따른다. 실행 통제·코드/배포 검수를 면제하거나 하지 않은 관리자 승인을 기록하지 않는다."
    - ids:
        - "REQ-303"
        - "REQ-021"
        - "REQ-003"
      tension: "관계가 있는 지식·카탈로그를 모두 주입하거나 참조만으로 접근 권한을 확대할 수 있다"
      resolution: "REQ-303의 연결은 후보·사용 설명의 근거다. REQ-021의 중복 제거·현재 권한·질의 관련성·필수 객체 보존과 REQ-003의 입력 예산을 거치며 참조 연결 자체가 접근 권한이나 전량 주입을 허용하지 않는다"
    - ids:
        - "REQ-615"
        - "REQ-110"
        - "REQ-115"
      tension: "평가 기능의 기존 유예 결정이 현재 차수의 should와 충돌하거나 오류 신고·감사·개발 시험까지 유예하는 것으로 확대될 수 있다"
      resolution: "REQ-615.deferral의 기존 사용자 결정을 현재 차수 제외(wont)에 반영하고 카드 성숙도는 elaborated로 유지한다. 평가 후보의 재검토와 REQ-110·115의 기존 신고·조사·조치, 필요한 감사와 개발 회귀 시험을 분리한다"
