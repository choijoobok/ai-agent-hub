    open: ["@defer P3 — ARCH-050의 관리자/Portal 인증 수락·세션·경로·API 경계와 같은 문자열 ID 충돌, 로그/알림/개인 설정의 참조 분리를 상세 설계한다. 기존 관리자 자체 등록·인증은 유지하며 Portal 계정 원장은 공유하지 않는다"]
    maturity: {"level":"confirmed","at":"2026-10-29","by":"AI — CR-028 사용자 명시 변경 반영","confirmed_by":"사용자 — 공통 계정 요구 철회, 관리자/Portal 계정 개별 등록과 별도 로그인 인증, 겸임자의 별도 Portal 계정 발급을 명시했다. 상세 설계·구현 승인은 별도다"}

  - id: REQ-502
    type: functional
    priority: must
    priority_reason: "역할과 개인 예외가 하나의 유효 권한으로 합성되지 않으면 같은 사용자에게 화면과 API가 서로 다른 답을 하므로 RM-P1 필수다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-06-02
    title: "역할 권한과 개인 예외를 합성해 현재 유효 권한을 계산한다"
    detail: "시스템 관리자는 역할, 사용자별 역할, 역할별 메뉴 액션과 사용자별 예외를 부여·회수하고 영향 사용자를 확인할 수 있어야 한다"
    note: "@defer P6 — 고객사 인수 전에 대리 역할의 원 승인자·부여 사유를 남기는 전용 위임 기록이 감사 요구인지 확인한다. 요구되면 변경 요청으로 정하며, 그전에는 역할 부여의 유효 기간과 일반 시스템 사용 이력으로 운영한다"
    acceptance: "역할 부여와 개인 예외를 현재 데이터·유효 기간으로 합성한다. 공유 세션 저장소의 변경 표식 저장이 끝난 뒤 해당 표식이 아직 반영되지 않은 세션의 보호 요청은 현재 권한을 재계산하며, 겹쳐 실행된 이전 계산이 늦게 저장돼도 후속 요청에서 회수된 권한을 계속 재사용하지 않는다"
    source: "현재 구현 역추적 — 역할·역할 권한·개인 권한 화면, 세션 무효화 표식과 권한 내용 해시"
    evidence:
      frontend: ["modules/system/features/role","modules/system/features/roleauth","modules/system/features/userauth","shared/authz"]
      backend: ["sources/backend/domain/src/main/java/com/aiagent/domain/authz/service/EffectiveAuthorityService.java","sources/backend/modules/system/src/main/java/com/aiagent/system/domain/role/RoleAuthService.java","sources/backend/modules/system/src/main/java/com/aiagent/system/api/authz/AuthorizationInterceptor.java","sources/backend/api/src/main/java/com/aiagent/api/authz/AuthzSession.java","sources/backend/api/src/main/java/com/aiagent/api/authz/AuthzInvalidator.java"]
      tables: [SYS_ROLE, SYS_USER_ROLE, SYS_ROLE_MENU_AUTH, SYS_USER_MENU_AUTH]
      screens: ["/admin/system/role","/admin/system/role-auth","/admin/system/user-auth"]
    roadmap: RM-P1
    summary: "역할 권한과 개인 예외를 합성해 현재 유효 권한을 계산한다"
    intent: {"problem":"역할·개인 예외 또는 권한 회수 반영이 어긋나면 이전 권한으로 업무에 접근할 수 있다","goal":"현재 역할·개인 예외를 합성하고 변경 뒤 세션이 오래된 권한을 재사용하지 않게 한다","not":["이번 기록은 기존 구현의 대조·개별 확정이며 새 기능·권한·보존 정책을 추가하지 않는다"]}
    goal_trace: ["IN-07"]
    decider: "제품 오너(사용자)"
    preconditions: ["기존 system 작업흐름 승인과 UC-502·FEAT-502 및 해당 화면 요건을 전제로 현재 소스에 대조한다"]
    data: [{"item":"SYS_ROLE·SYS_USER_ROLE·SYS_ROLE_MENU_AUTH·SYS_USER_MENU_AUTH","origin":"기존 system 기능의 관리 입력과 서버 처리","sensitivity":"기존 행위별 권한과 데이터 보호 규칙 적용","retention":"기존 엔티티·화면·운영 보존 규칙을 따른다. 이번 확정으로 기간을 변경하지 않는다"}]
    business_rules: ["권한 내용 해시는 유효 메뉴·액션 집합의 해시이며 단조 증가 버전이나 재인증 요구가 아니다","부여·회수 뒤 영향 사용자의 공유 세션에 매번 새로운 무효화 표식을 남기고 다음 보호 요청에서 계정 상태·현재 권한을 재계산한다","계산 전에 읽은 표식과 계산 결과를 한 속성으로 저장하며, 재계산은 무효화 표식을 지우지 않는다. 후속 회수 표식과 다르면 다시 계산한다","로그인 세션의 첫 보호 요청은 세션 색인 등록 전 변경을 놓치지 않도록 재계산한다. 표식·업무일자가 같으면 이후 요청은 캐시를 사용한다","이미 인가를 통과해 진행 중인 업무를 소급 취소하는 계약은 아니다. 회수된 액션은 재계산 후 403으로 거부하며 계정 자체가 사용 불가하면 401과 세션 종료를 적용한다"]
    exceptions: ["없는 대상 저장 거부와 액션별 403·계정 사용 불가 401은 UC-502 및 기존 화면 계약을 따른다"]
    lifecycle: "부여·회수 저장 → 영향 세션에 변경 표식 → 다음 보호 요청에서 재계산 → 관측 표식과 결과 저장. 날짜 경과와 로그인 첫 보호 요청도 재계산하며 비활성 계정은 종료한다"
    permissions: "UC-502·연결 화면/API의 기존 public·common·service 구분과 행위별 유효 권한을 적용한다"
    audit: "기존 구현의 이력과 UC-502의 처리 근거를 유지한다. 이번 카드 작성으로 별도 감사 저장소를 추가하지 않는다"
    volume: "현재 화면·API의 조회/처리 범위와 기존 제한을 유지한다. 새로운 용량·성능 목표를 부여하지 않는다"
    config: "공유 세션은 인덱스 있는 저장소와 ON_SET_ATTRIBUTE 저장 모드를 사용한다. 인덱스 없는 개발용 컨테이너 세션은 현재 요청 세션만 무효화할 수 있다. 세션 형식 변경 시 노드 일괄 전환과 기존 세션 종료·재로그인을 적용한다"
    risk: "실제 JDBC 세션 저장 경합과 메모리 세션을 검사했다. 권한 변경 트랜잭션은 모의 입력이며 PostgreSQL·Redis 배포, 무효화 저장 자체의 실패, 이미 인가된 요청의 소급 취소를 검증한 것은 아니다. 운영 반영은 일괄 전환·기존 세션 종료 조건을 따른다"
