    volume: "현재 화면·API의 조회/처리 범위와 기존 제한을 유지한다. 새로운 용량·성능 목표를 부여하지 않는다"
    config: "기존 계정·암호·세션 설정과 UC-501의 조건을 적용한다"
    risk: "CR-028의 계정·인증 영역 분리를 실제 라우트·공개 API·세션 저장/수락·인가에 집행하는 상세 설계와 계약/회귀 시험이 필요하다. 기존 관리자 자체 인증 소스가 Portal 분리 구현 완료를 뜻하지 않는다"
    relations: {"depends_on":[],"constrains":["REQ-616"],"conflicts_with":[],"nfr":[],"interfaces":[]}
    realization: {"features":["FEAT-501","FEAT-301"],"screens":["SCR-501","SCR-502","SCR-503","SCR-505","SCR-506"]}
    examples: [{"kind":"정상","case":"허용된 사용자 user01이 유효 기간과 허용 IP로 로그인","result":"성공 세션과 현재 유효 권한을 발급하고 로그인 이력을 남긴다"},{"kind":"예외","case":"user01의 계정을 잠그거나 허용 IP 밖에서 로그인","result":"세션을 만들지 않고 해당 실패 이력을 남긴다"}]
    volatility: {"level":"low","what":"이미 구현된 system 기준선이다. 향후 업무 규칙·범위 변경은 기존 변경 절차를 따른다"}
    source_review: {"at":"2026-10-26","result":"기존 관리자 로컬 인증의 소스 대조 기록이다. CR-028의 별도 Portal 인증·세션 경계 구현 완료를 뜻하지 않는다","scope":"변경 전 관리자 계정·로그인·비밀번호·세션 구현과 기존 테스트를 대조했다","tests":["sources/backend/modules/system/src/test/java/com/aiagent/system/api/auth/LoginSlice501Test.java","sources/backend/domain/src/test/java/com/aiagent/domain/user/PasswordChangeServiceTest.java","sources/backend/domain/src/test/java/com/aiagent/domain/user/PasswordResetServiceTest.java"],"findings":[]}
