    data: [{"item":"SYS_MESSAGE_KEY·SYS_MESSAGE·SYS_CACHE_VERSION","origin":"기존 system 기능의 관리 입력과 서버 처리","sensitivity":"기존 행위별 권한과 데이터 보호 규칙 적용","retention":"기존 엔티티·화면·운영 보존 규칙을 따른다. 이번 확정으로 기간을 변경하지 않는다"}]
    business_rules: ["키 생성은 기존 소스 상수·시드 생성기만 수행하고 관리 화면은 값과 미사용 키를 관리한다","값 변경과 캐시 버전 원자 증가는 한 트랜잭션이며 둘 중 하나가 실패하면 함께 롤백한다. 코드명·메뉴명 변경의 메시지 버전도 같은 증가 규칙을 사용한다","무효화 전에 시작한 조회 결과를 무효화 후 새 캐시로 재등록하지 않는다. 이미 진행 중인 조회 결과를 소급 바꾸는 계약은 아니다","일반 서버 문구 조회에는 기존 노드별 TTL을 유지한다. 공개 번들은 노드의 오래된 TTL 캐시를 새 버전으로 포장하지 않고 DB 본문과 전후 버전 일치를 확인한다","공개 번들 읽기 중 변경되면 최대 3회 확인하고 계속 경합하면 본문을 성공 응답으로 보내지 않고 409를 반환한다. 브라우저 버전 비교 시점은 기존 로그인·세션 복원·번들 요청이며 실시간 강제 푸시를 추가하지 않는다","요청 언어·기본 언어 값이 모두 없으면 공개 번들에서 키를 생략하고 화면 label과 MessageService.text는 키를 표시한다. 서버 오류는 ErrorCode의 기본문구로 폴백한다"]
    exceptions: ["관리 화면의 임의 키 생성은 거부한다. 값·버전 저장 실패는 함께 롤백하고 공개 번들 읽기의 반복 경합은 409로 응답한다"]
    lifecycle: "키 생성·값 저장 → 같은 트랜잭션의 원자 버전 증가 → 커밋 후 현재 노드 무효화. 일반 서버 문구는 노드별 TTL, 공개 번들은 버전·본문 일치 검사 후 제공한다"
