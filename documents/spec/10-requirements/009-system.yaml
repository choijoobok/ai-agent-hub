# 영역: 백오피스 공통 운영 기반
requirements:
# ── system — 현재 백오피스 코어의 요구사항과 구현 근거 ───────────
# **신규 기능을 상상해 적은 것이 아니다.** 2026-09-12 현재 소스·Liquibase·화면 문서의
# 구현 사실을 역추적해 system 소유 요구로 올렸다. P2는 이 경계를 이동 규칙으로, P3는
# FEAT·ENT·API·TC와 무손실 회귀 계약으로 구체화한다. G3 승인 전에는 소스를 옮기지 않는다.
  - id: REQ-501
    type: functional
    priority: must
    priority_reason: "계정 판정이 없으면 모든 화면과 API의 인증 전제가 성립하지 않으며 현재 백오피스의 기존 동작을 잃으므로 RM-P1 필수다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-06-01
    title: "관리자 계정 상태와 접속 조건을 한 판정으로 관리한다"
    detail: "시스템 관리자는 관리 콘솔 전용 자체 계정을 등록·수정하고 역할 부여, 사용 기간, 잠금·휴면, 접속 허용 IP, 비밀번호 변경·초기화와 활성 세션 종료를 관리할 수 있어야 한다. 관리자 계정은 system이 소유하며 Portal 계정·자격증명·인증과 분리한다. SSO·대상 시스템 계정 연동은 Portal 요구이며 관리자 인증에 확대 적용하지 않는다. ITO 운영자도 관리자 계정으로 관리 콘솔만 이용하고 Portal 이용에는 별도 계정을 발급받는다"
    acceptance: "상태·기간·잠금·휴면·IP 중 하나라도 실패한 관리자 계정은 관리자 세션을 얻지 못한다. Portal 계정·SSO 응답·Portal 세션을 관리자 인증으로 수락하지 않으며 반대 방향도 같다. 관리자 계정의 등록·비활성화·비밀번호·세션 변경이 Portal 계정을 생성·연결·수정하지 않는다. SYS_USER 물리 삭제 금지는 유지한다"
    source: "기존 관리자 자체 인증 구현 역추적 및 2026-10-29 사용자 CR-028 결정 — CR-027의 공통 계정 방향을 철회하고 관리자와 Portal의 계정·로그인 인증을 분리한다"
    evidence:
      frontend: ["modules/system/features/user","modules/system/public/auth","modules/system/public/profile","modules/system/public/settings"]
      backend: ["sources/backend/modules/system/src/main/java/com/aiagent/system/api/auth/LoginService.java","sources/backend/domain/src/main/java/com/aiagent/domain/user/service/UserAccountService.java","sources/backend/domain/src/main/java/com/aiagent/domain/user/service/PasswordChangeService.java","sources/backend/domain/src/main/java/com/aiagent/domain/user/service/PasswordResetService.java"]
      tables: [SYS_USER, SYS_USER_PWD_HIST, SYS_USER_IP_ALLOW, SYS_USER_PWD_RESET, SYS_LO_LOGIN]
      screens: ["/admin/system/user","_standalone/system/login","_standalone/system/profile","_standalone/system/settings","_standalone/system/pwd-change","_standalone/system/session-expire"]
    roadmap: RM-P1
    summary: "관리자 계정 상태와 접속 조건을 한 판정으로 관리한다"
    intent: {"problem":"계정 상태·기간·접속 조건과 비밀번호·세션 처리가 갈리면 허용되지 않은 로그인이 성립한다","goal":"기존 로그인·계정 관리의 판정과 이력·세션 종료 경계를 보존한다","not":["공통 Hub 계정 원장을 만들거나 같은 사람·이메일·로그인 ID를 근거로 관리자와 Portal의 계정·세션을 연결하지 않는다"]}
