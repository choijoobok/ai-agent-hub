    data: [{"item":"SYS_USER·SYS_USER_PWD_HIST·SYS_USER_IP_ALLOW·SYS_USER_PWD_RESET·SYS_LO_LOGIN","origin":"기존 system 기능의 관리 입력과 서버 처리","sensitivity":"기존 행위별 권한과 데이터 보호 규칙 적용","retention":"기존 엔티티·화면·운영 보존 규칙을 따른다. 이번 확정으로 기간을 변경하지 않는다"}]
    business_rules: ["업무 범위와 판정은 이 카드의 detail·acceptance 및 UC-501를 따른다"]
    exceptions: ["정상·예외 판정은 examples와 기존 UC-501·TC의 거부/실패 기준을 적용한다"]
    lifecycle: "계정 관리·인증·비밀번호 변경/초기화·세션 종료는 UC-501과 해당 화면 요건의 기존 전이를 따른다"
    permissions: "UC-501·연결 화면/API의 기존 public·common·service 구분과 행위별 유효 권한을 적용한다"
