    data: [{"item":"SYS_SCHEDULE_BATCH·SYS_BATCH_HISTORY","origin":"기존 system 기능의 관리 입력과 서버 처리","sensitivity":"기존 행위별 권한과 데이터 보호 규칙 적용","retention":"기존 엔티티·화면·운영 보존 규칙을 따른다. 이번 확정으로 기간을 변경하지 않는다"}]
    business_rules: ["스케줄의 쿨다운 건너뜀과 잠금 선점 실패는 각각 SKIP_COOLDOWN·SKIP_LOCK이다. 수동 실행은 RUNNING 여부를 확인하고 쿨다운 락을 해제·재획득하며 실행 중이면 새 실행을 시작하지 않는다","중단 API는 요청 시각을 기록한다. 작업이 안전 지점에서 이를 확인하고 중단 결과를 반환할 때만 CANCELED다. 강제 스레드 종료나 이미 완료한 업무의 롤백을 뜻하지 않는다","유실 실행은 LOST, 작업 예외는 FAIL, 정상 완료는 SUCCESS다. 중단 요청과 정상 완료가 겹쳤다는 이유만으로 정상 결과를 실패나 중단으로 바꾸지 않는다"]
    exceptions: ["수동 요청에서 이미 RUNNING인 배치는 새 실행 대신 현재 실행 정보를 반환한다. 스케줄의 잠금·쿨다운 건너뜀과 유실 판정은 기존 결과 코드로 구분한다"]
    lifecycle: "스케줄 건너뜀 또는 RUNNING → 실제 SUCCESS·FAIL·CANCELED·LOST로 종결한다. 중단 요청 시각은 실행 결과와 별도로 보존한다"
    permissions: "UC-508·연결 화면/API의 기존 public·common·service 구분과 행위별 유효 권한을 적용한다"
    audit: "기존 구현의 이력과 UC-508의 처리 근거를 유지한다. 이번 카드 작성으로 별도 감사 저장소를 추가하지 않는다"
    volume: "현재 화면·API의 조회/처리 범위와 기존 제한을 유지한다. 새로운 용량·성능 목표를 부여하지 않는다"
    config: "기존 cron·timezone·잠금 만료·쿨다운과 BatchJob 등록을 사용한다"
    risk: "기존 실행·중단 규칙의 회귀 검사이며 각 고객사 BatchJob의 안전 지점과 실제 외부 업무 중단·롤백을 보증하지 않는다"
    relations: {"depends_on":[],"constrains":[],"conflicts_with":[],"nfr":[],"interfaces":[]}
    realization: {"features":["FEAT-508"],"screens":["SCR-519","SCR-520"]}
    examples: [{"kind":"정상","case":"쿨다운 중 수동 즉시 실행 요청이며 실행 중인 배치는 없음","result":"쿨다운을 우회하되 잠금을 다시 선점해 실행한다"},{"kind":"예외","case":"정상 완료 직전 중단 요청이 도착했지만 작업이 정상 결과를 반환","result":"중단 요청 시각은 남기고 실제 결과 SUCCESS를 유지한다"}]
    volatility: {"level":"low","what":"이미 구현된 system 기준선이다. 향후 업무 규칙·범위 변경은 기존 변경 절차를 따른다"}
    source_review: {"at":"2026-10-29","result":"문서 정정·경합 보완과 회귀 검사 완료","scope":"수동 쿨다운 우회·협조적 중단의 기존 구현에 맞게 REQ·PRC·UC·FEAT·TC를 정정했다. 중단 요청이 있어도 정상 반환이면 SUCCESS인 회귀 시험을 추가했다. 요청 유무를 실제 결과로 오용하는 반전에서 중단/정상 완료 시험 2건이 실패했다. 배치 제품 코드는 변경하지 않았다","tests":["sources/backend/domain/src/test/java/com/aiagent/domain/batch/BatchScheduleServiceTest.java","sources/backend/domain/src/test/java/com/aiagent/domain/batch/BatchRunnerTest.java","sources/backend/domain/src/test/java/com/aiagent/domain/batch/BatchCooldownTest.java","sources/backend/domain/src/test/java/com/aiagent/domain/batch/BatchCancelServiceTest.java","sources/backend/domain/src/test/java/com/aiagent/domain/batch/BatchGhostSweeperTest.java"],"findings":[]}
