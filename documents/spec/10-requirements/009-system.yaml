  - id: REQ-508
    type: functional
    priority: must
    priority_reason: "배치의 중복·유령 실행을 성공으로 오인하면 자동화 결과를 신뢰할 수 없으므로 현재 운영 기준선을 RM-P1에서 보존해야 한다"
    workstream: system
    actors: [ACT-012]
    process_step: PRC-08-02
    title: "등록된 배치를 일정과 시간대에 따라 실행하고 결과를 추적한다"
    detail: "시스템 관리자는 배치 일정 등록·활성화·즉시 실행·중단과 최근·전체 이력 조회를 할 수 있어야 한다"
    acceptance: "미등록 구현·잘못된 크론·시간대·잠금 설정을 거부하고 같은 배치의 중복 실행을 막는다. 스케줄 실행은 쿨다운을 지켜 SKIP_COOLDOWN을 기록하고 수동 즉시 실행은 쿨다운을 우회한다. 중단 요청만으로 결과를 바꾸지 않으며 작업이 중단을 보고하면 CANCELED, 정상 완료하면 SUCCESS로 기록한다"
    source: "현재 구현 역추적 — 배치 스케줄·실행 이력 화면과 스케줄러"
    evidence:
      frontend: ["modules/system/features/batchschedule","modules/system/features/batchhistory","shared/batch"]
      backend: ["sources/backend/domain/src/main/java/com/aiagent/domain/batch/schedule/BatchScheduleService.java","sources/backend/domain/src/main/java/com/aiagent/domain/batch/run/BatchRunner.java","sources/backend/domain/src/main/java/com/aiagent/domain/batch/history/BatchCancelService.java","sources/backend/domain/src/main/java/com/aiagent/domain/batch/run/BatchGhostSweeper.java"]
      tables: [SYS_SCHEDULE_BATCH, SYS_BATCH_HISTORY]
      screens: ["/admin/system/batch/schedule","/admin/system/batch/history"]
    roadmap: RM-P1
    summary: "등록된 배치를 일정과 시간대에 따라 실행하고 결과를 추적한다"
    intent: {"problem":"쿨다운·중단·유실 결과의 범위가 모호하면 실제 수행과 운영 판단이 달라진다","goal":"등록된 일정·수동 실행·협조적 중단과 결과 이력을 일관되게 관리한다","not":["이번 기록은 기존 구현의 대조·개별 확정이며 새 기능·권한·보존 정책을 추가하지 않는다"]}
    goal_trace: ["IN-07"]
    decider: "제품 오너(사용자)"
