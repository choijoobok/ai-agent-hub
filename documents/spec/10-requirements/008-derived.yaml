      goal: "사용자가 정한 반복 업무를 재현 가능한 실행 정의로 관리하고 변경 영향과 승인 범위를 확인해 실행한다"
      not: ["임의 소스 코드·미등록 API·쓰기 SQL을 생성해 실행하는 범용 프로그래밍 기능이 아니다", "저장된 조회의 수정 금지 정책(REQ-202)을 변경하거나 워크플로우를 RM-P1에 포함하지 않는다"]
    hard_rule: "발행한 실행 정의는 변경 불가능한 버전으로 보존하고 각 실행은 선택한 버전과 현재 실행자에 연결한다. LLM이 운영본을 조용히 덮어쓰거나 승인된 범위를 넓힐 수 없다. 일정 활성화·계획 확인·관리자 자동 승인 활성화·실제 실행은 서로 다른 행위다"
    preconditions: ["현재 사용자가 접근 가능한 데이터·지식과 등록된 허용 API/도구만 사용한다. 읽기 SQL과 업무 변경 도구의 기존 경계를 유지한다", "계획의 지시·순서·조건·입력 출처·의존 관계를 사용자와 관리자가 확인할 수 있어야 한다"]
    data:
      - item: "워크플로우 식별자·소유자·자연어 지시·버전·단계/분기·SQL/API/도구 참조·값 매핑/계산·완료 기준"
        origin: "사용자 입력 및 검증한 모델 제안"
