    business_rules: ["초안·검증·발행·일정 활성/정지와 자동 승인 상태를 구분한다. 수정본은 새 후보 버전이며 기존 발행본이나 자동 승인 범위를 덮어쓰지 않는다. 스케줄이 사용할 발행 버전도 명시한다", "정적 SQL·API 선택·값 매핑·계산은 검증한 정의로 재사용하고 날짜·대상 목록·조회 결과 등 실행별 값은 새로 확보한다. 기간은 해당 실행의 기준 시각/시간대로 구체화해 실행 도중 임의로 바꾸지 않는다. 현재 신원·권한·정책·동의는 과거 결과를 재사용하지 않는다", "정적 조회는 REQ-207의 공통 검증·정책 경로로 실행한다. 계획 생성/변경이나 업무 자체가 모델 판단을 요구하는 단계만 모델을 호출하고 실제 사용량을 기록한다. 모델의 제안이 승인된 액션·분기·입력 범위를 벗어나면 새 승인 없이 실행하지 않는다", "지식·실제 SQL 참조·카탈로그 의미/제약·API/도구 계약의 의존 관계를 연결해 변경 시 영향받는 정의만 식별한다. 참조를 모델의 자기 신고에만 의존하지 않고 실제 실행 참조와 대조한다. 이 매핑은 영향 확인용이며 연결 지식 전체를 LLM 입력으로 확장하지 않는다", "실행 시작과 영향받는 호출 직전에 의존 계약의 현재 유효성을 검사한다. 참조 폐기·단위/코드/조건/업무 의미 변경 또는 영향 미확인은 재사용을 보류한다. 무관하거나 호환성이 확인된 변경만 검증 근거와 함께 허용한다. 컬럼 타입 일치·SQL/API 성공만으로 의미 호환성을 확정하지 않는다", "대상 시스템의 미통지 의미 변경은 Hub 단독으로 완전히 탐지할 수 없다. 공개 데이터/API 계약의 변경 통지·등록·검수 근거를 갖추며 런타임의 필요한 전제·단위·상태·식별자 검증과 연결한다", "대화창에서 수동 실행을 선택하면 자동 승인 활성 여부와 관계없이 실행 액션에 REQ-005·017·026의 실제 값 확인·수동 승인을 적용한다. 워크플로우 이름 언급·열람·선택만으로 실행하거나 자동 모드로 바꾸지 않는다", "예약 실행에서는 REQ-405가 유효한 액션만 자동 승인 판정한다. 자동 승인이 없는 액션은 기존 사용자 승인 대기로 전환하고 해당 실행의 이후 작업은 기다린다. 모든 실행 액션이 승인 범위 안에 있어야 전 과정을 무인 실행할 수 있으며 예약/정의 화면에 수동 개입 필요 여부를 표시한다", "같은 예약 발생 건의 중복 전달은 실행을 중복 만들지 않는다. 별도 주기/사용자의 명시적 새 실행은 새 식별자를 사용하되 동일 업무의 이전 처리·결과 불명과 멱등성은 REQ-105로 별도 검사한다. 같은 인자만으로 같은 실행을 판정하지 않는다", "중단·부분 실패·결과 불명·변경 보류 시 이미 수행한 사실은 남기고 미전송 후속 작업을 차단한다. 재계획 때문에 성공 액션을 다시 보내거나 원 실행을 자동 롤백하지 않는다. 실행 중 버전 변경을 최신 정의로 조용히 치환하지 않는다", "같은 워크플로우는 기본적으로 중첩 실행하지 않는다. 발행 버전이 달라도 안정 워크플로우 식별자가 같으면 같은 범위로 검사하고 사용자 입력/승인 대기인 미종결 실행도 포함한다. 이전 실행이 남아 있는 상태의 다음 예약 회차는 기본적으로 생략하고 예정 시각·사유·관련 실행을 기록한다. 생략은 업무 성공이 아니며 수동 요청이 겹치면 실행 불가 사유를 안내하고 암묵적 예약으로 바꾸지 않는다", "회차별 처리가 필요한 업무는 순차 대기를 명시적으로 선택할 수 있다. 같은 워크플로우의 실행은 여전히 하나씩 처리하고 각 대기 회차의 원래 예정 시각·시간대·대상 기간과 발생 식별자를 유지한다. 실행 시작 시 현재 권한·의존 계약·승인 범위와 실제 값을 다시 확인하며 REQ-036의 개인 실행 대기와 사용자대기 상태를 구분한다. 대기 회차의 적재·기한에는 유한 한도를 설계하고 한도 초과를 조용히 버리지 않는다", "서버 중단·일정 비활성 등으로 접수되지 않은 미실행 회차는 복구나 일정 재활성 때 자동 소급 실행하지 않는다. 원래 기록된 순차 대기 회차와 구분해 목록·사유를 제공하고 사용자가 회차·대상 기간을 확인하여 명시적으로 실행을 요청해야 한다. 요청은 원 미실행 회차와 연결된 새 실행이며 대화창 수동 승인·현재 검증과 결과 불명 후속 실행 통제를 따른다", "중첩 처리 방식·회차 순서/대상 기간·스케줄을 바꾸어 기존 자동 승인 범위를 우회하지 않는다. 영향 있는 변경은 REQ-405의 새 요청·검토·승인을 거친다. 순차 대기나 누락 회차 실행도 이전 동일 업무의 결과 불명·현재 권한 실패·의존 계약 무효를 정상 실행으로 보정하지 않는다"]
    exceptions: ["권한 회수·의존 버전 불일치·입력 범위 위반이면 그 이유와 영향받는 단계·이미 처리한 범위를 구분한다", "추가 입력/사용자 승인 대기는 기존 실행 점유 해제·이어가기·만료 규칙을 적용하며 스레드에서 사람의 응답을 기다리는 설계를 전제하지 않는다"]
    lifecycle: "초안 작성 → 계획 검증·사용자 확인 → 실행 정의 발행 → 수동 실행 또는 일정 활성/예약 실행 → 단계별 검사·처리 → 결과/부분 처리 기록; 변경은 새 후보와 영향 검토로 연결"
    permissions: "소유자의 현재 실행 권한으로 처리하며 관리자 승인자의 권한을 대신 사용하지 않는다. 정의 조회/수정·수동 실행·일정 활성/정지·자동 승인 요청·승인 권한을 구분한다"
    audit: "정의 버전·실행 발생 근거/모드·실행자·입력 출처·사용 자산 버전·단계 결과와 수동/자동 승인 근거를 REQ-107·109로 연결한다. 실제 모델 호출이 없으면 가상 스텝/사용량을 만들지 않는다"
    config: "스케줄·시간대와 기본 생략/선택적 순차 대기 설정을 관리하고 변경 영향은 REQ-405에 연결한다. 중첩 검사·미실행 이력·대기 회차 한도/보존의 물리 계약은 RM-P3 설계에서 정하며 자동 승인 상태를 일반 실행 설정이나 스케줄 켜기로 대체하지 않는다"
    risk: "형식은 맞지만 업무 의미가 바뀐 정의의 반복 실행, 예약 중복·부분 처리 재전송과 관리자 권한 대행 실행을 막아야 한다"
    acceptance: "발행 버전·의존 근거·스케줄·수동/자동 상태를 확인하고 실행별로 실제 값과 승인 근거를 추적할 수 있다. 대화 수동 실행은 실제 값 카드 승인을 거치고 예약 실행은 액션별 자동 승인 적합성 또는 사용자대기로 분기한다. 영향 미확인 변경·현재 권한 실패·중복 예약은 정상 실행으로 통과하지 않는다. 같은 워크플로우의 미종결 실행이 있으면 기본 생략 또는 명시적으로 선택한 순차 대기 정책이 적용된다. 미접수된 누락 회차를 자동 소급 실행하지 않고 사용자 확인·명시 요청으로 연결한다."
