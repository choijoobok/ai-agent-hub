      screens: []
    examples:
      - { kind: 정상, case: "DB 비밀번호·order_api 인증 헤더·LLM API 키를 배포 yml의 ENC(...)로 관리하고 설정 마스터 키 하나만 외부에 둔다. SYS-ORDER와 주문 API는 연결 참조만 관리하며 서버가 필요한 인증정보를 해석해 사용한다" }
      - { kind: 예외, case: "order_api의 필수 비밀 참조가 해석되지 않으면 주문 호출을 거부한다. LLM이 다른 호스트나 Authorization 헤더를 제시해도 그 값으로 대신 실행하지 않으며 오류·로그에 비밀을 남기지 않는다" }
      - { kind: 예외, case: "JDBC 세션·메일 미사용 환경을 시작할 때 Redis·SMTP 비밀번호를 요구하지 않는다. 고객사 레거시 개인정보 복호화 키를 연결 프로필에 추가하라는 요청도 수용하지 않는다" }
