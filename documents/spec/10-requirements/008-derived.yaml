# 영역: 로드맵·제약에서 유도한 것
requirements:
# ── 로드맵·제약에서 유도한 것 ─────────────
# **지어낸 사실이 아니라 함축을 드러낸 것이다.** 로드맵이 "알림 발송" 을 P3 포함
# 항목으로, 개발 표준이 "프로파일 로컬/개발/운영" 을 규정했으나 요구사항으로 적힌 적이
# 없어 실현체(FEAT-214 · FEAT-302)가 역추적되지 않았다. `derived: true` 가 그 표시이며
# **P1 게이트에서 사용자 확인 대상이다.**
  - id: REQ-401
    type: functional
    priority: should
    derived: true
    derived_from: "00-charter/_index.yaml RM-P3 (알림 발송) · CON-031 (메일 발송 경로)"
    actors: [ACT-001, ACT-009]
    title: "워크플로우·잡의 결과를 사용자에게 알린다"
    detail: "워크플로우·잡의 실패·부분 실패·결과 불명·사용자 확인 필요를 기본으로 통지하고 성공 알림은 사용자가 선택한다. 소유자와 권한 있는 지정 운영 담당자에게 최소 요약·상태 및 결과 확인 링크를 제공하며 발송 채널은 고객사 설정을 따른다(CON-031)"
    open:
      - "@defer RM-P3 확정한 알림 발생 조건·수신자·성공 알림 선택을 워크플로우/잡 설정과 화면 요건/목업에 연결한다. 미실행 회차 자체는 이력으로 남기며 사용자 개입이 필요한 경우 기본 통지 조건으로 연결한다"
      - "@defer RM-P3 고객사 채널 연동·발송 시도/전달 결과·중복 사건 식별·재전송 한도/간격·알림 빈도 제어와 수신자 권한 회수·링크 만료의 물리/시험 계약을 정한다"

    roadmap: RM-P3
    summary: "RM-P3에서 실행 결과와 알림 전달 결과를 분리하고 허용된 수신자에게 필요한 정보만 통지한다"
    scope_status: "RM-P3 후속 차수 — 알림 기본 정책은 본 카드로 확정하며 채널 연동·재전송·화면·물리 계약은 해당 차수에서 설계한다. 현재 RM-P1 필수 범위로 앞당기지 않는다"
    preconditions:
      - "워크플로우/잡 결과와 통지 대상의 권한·고객사 발송 경로가 정의되어야 한다"
    data:
      - item: "원 실행/결과 참조·알림 사건·수신 대상/경로·전달 시도/결과·중복 식별 근거"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "업무 실행 결과와 통지 전송 상태를 구분한다. 알림 실패가 업무 실패나 업무 재실행의 근거가 되지 않는다"
      - "동일 결과의 중복 이벤트/재전송은 같은 알림 사건으로 대조한다. 채널의 실제 전달 보장 범위를 넘어서 정확히 한 번 도착을 약속하지 않으며 재전송 한도·정책은 RM-P3에서 정한다"
      - "수신 대상은 허용된 사용자/관리 대상과 통지 정책으로 결정한다. 모델이 임의 주소를 만들거나 결과 본문의 주소를 수신자로 승격하지 않는다"
      - "민감 결과·비밀·실행용 파라미터 원값을 알림 본문에 자동 첨부하지 않는다. 허용된 최소 요약·상태와 Hub의 인증/현재 권한 검사를 거치는 결과 확인 링크를 기본으로 제공한다"
      - "알림 확인·메일 답장·링크 열람을 업무 실행 승인이나 자동 재시도 요청으로 간주하지 않는다. 후속 실행은 해당 승인/재요청 계약을 따른다"
      - "기본 알림 조건은 실패·부분 실패·결과 불명·사용자 확인 필요다. 사용자 확인 필요에는 추가 입력·수동 승인 대기와 참조/승인 조건 변경 등으로 사람이 판단해야 하는 보류를 포함한다. 성공 알림은 기본 비활성이며 워크플로우/잡별 설정으로 선택한다. 접수·전송 성공·예약 생략을 업무 성공으로 통지하지 않는다"
      - "수신자는 소유자를 기본으로 하며 해당 업무/결과의 수신 권한이 있는 운영 담당자를 명시적으로 추가할 수 있다. 설정 권한이 결과 열람 권한을 부여하지 않으며 발송 시 수신 적격성과 공개 범위를 검사하고 링크 열람 시 현재 권한을 다시 확인한다"
      - "알림은 실제 상태가 발생·변경한 사건에 연결한다. 같은 대기를 계속 조회하거나 복구 과정에서 동일 사건을 재수신해도 별개 알림을 무제한 만들지 않는다. 필요한 반복 안내·재전송은 유한 정책으로 설계하고 필수 사용자 확인이 해소됐다는 뜻으로 전달 성공을 사용하지 않는다"
    exceptions:
      - "채널 장애·수신자 권한 회수·결과 보존 만료 때 잘못된 성공 통지나 다른 수신자로의 임의 대체를 하지 않는다"
    lifecycle: "실행 결과 또는 사용자 확인 필요 상태 발생/갱신 → 통지 조건/수신 적격성 확인 → 발송 시도 → 전달 결과 기록·제한된 후속 처리"
    permissions: "통지 설정 권한과 수신자의 결과 열람 권한을 구분하고 실제 열람 시 현재 권한을 다시 검사한다"
    audit: "원 실행과 통지 사건·수신/전달 시도의 관계를 연결하되 원문·비밀을 중복 저장하는 알림 전용 무기한 이력을 만들지 않는다"
    config: "고객사에서 설정한 발송 채널을 사용하며 특정 외부 서비스를 강제하지 않는다. 워크플로우/잡별 성공 알림 선택·허용된 운영 담당자 추가와 전달 정책을 관리한다. 알림 설정 변경이 실행 정의·자동 승인 범위를 확대하지 않는다"
    risk: "알림 실패를 업무 실패로 취급하면 중복 실행하고, 무분별한 수신자/본문 구성은 결과를 누출한다"
    acceptance: "기본 알림 대상 상태와 선택한 성공 알림이 실제 업무 상태에 따라 허용된 소유자/지정 운영 담당자에게 최소 정보로 전달되고 인증된 결과 링크로 연결된다. 성공 알림 비활성·중복 사건·권한 회수·전달 실패가 업무 결과를 바꾸거나 업무 재실행을 유발하지 않는다"
    verification:
      - "업무는 성공했으나 메일 전송이 실패한 경우 업무를 재실행하지 않는다"
      - "같은 종료 이벤트의 중복과 수신 권한 회수·만료된 결과 링크를 검증한다"
      - "결과 본문에 포함된 외부 주소로 통지를 보내거나 메일 답장을 승인으로 처리하지 않는다"
      - "실패·부분 실패·결과 불명·추가 입력/승인 대기는 기본 통지하고 성공 알림은 기본 비활성이다. 성공 알림을 선택한 경우에도 접수 성공·미실행/생략을 업무 성공으로 통지하지 않는다"
      - "소유자와 허용된 지정 운영 담당자에게만 최소 요약·상태·인증된 결과 링크를 보내고 권한 없는 지정·발송 전 회수·본문의 외부 주소를 수신자로 사용하지 않는다"
      - "동일 사용자대기의 반복 조회·중복 이벤트는 새 알림을 무제한 만들지 않는다. 전송 실패·링크 열람·메일 답장을 업무 재실행·승인으로 취급하도록 규칙을 뒤집으면 검증이 실패해야 한다"
    intent:
      problem: "알림 실패를 업무 실패로 취급하면 중복 실행하고, 무분별한 수신자/본문 구성은 결과를 누출한다"
      goal: "RM-P3에서 실행 결과와 알림 전달 결과를 분리하고 허용된 수신자에게 필요한 정보만 통지한다"
    goal_trace:
      - "GOAL-1"
    decider: "제품 오너(사용자)"
    relations:
      depends_on: []
      constrains: []
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features:
        - "FEAT-214"
        - "FEAT-118"
        - "FEAT-119"
      screens: [SCR-106]
    examples:
      - kind: "정상"
        case: "RM-P3의 정해진 통지 조건을 만족한 업무 결과를 허용된 수신자에게 최소 요약으로 알리고 전달 결과를 따로 기록한다"
      - kind: "예외"
        case: "결과 본문에 포함된 외부 주소로 통지를 보내거나 메일 답장을 승인으로 처리하지 않는다"
    volatility:
      level: "medium"
      what: "업무 경계는 유지하고 상세 메시지·저장·화면 계약은 소유 작업흐름의 후속 설계에서 정한다"
    volume: "기존 호출·문맥·보존·실행 한도를 따른다. 이 카드에서 새로운 고정 처리량을 약속하지 않는다"
    source: "2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다 2026-10-27 사용자 요청으로 실패/확인 필요 기본 알림·선택적 성공 알림·소유자/허용 운영 담당자·최소 요약/결과 링크와 고객사 채널 정책을 권장안대로 보완하고 최신 전체 카드를 명시 확정했다."
    maturity:
      level: confirmed
      at: "2026-10-27"
      by: "AI — 사용자 권장안 보완 및 명시 확정 요청 반영"
      confirmed_by: "사용자 (2026-10-27 미확정 4건 REQ-020·401·404·405를 권장안대로 보완하고 확정 처리 요청). REQ-401의 최신 전체 보완본을 확정했으며 후속 차수·상세 설계/검증·단계 게이트·소스 구현 승인은 별도로 유지한다."

  - id: REQ-402
    type: functional
    priority: must
    priority_reason: "고객사별 실행 환경을 분리하고 비밀 값을 평문으로 남기지 않기 위한 배포 전제다"
    derived: true
    derived_from: "CON-011 (비밀 값) · CON-033 (프로파일로 Provider 전환) · hub-conventions §3"
    actors: [ACT-009]
    process_step: PRC-01-01
    title: "환경별 설정과 프로파일을 분리해 관리한다"
    detail: "프로파일은 **로컬 / 개발 / 운영**으로 구분하고 모듈별 yml 을 파일로 분리한다. **비밀 값은 설정 파일에 평문으로 두지 않는다.** LLM Provider 선택(개발기 CLI ↔ 운영 API)도 프로파일 설정으로 전환된다"
    hard_rule: "DB·API·LLM 연결 정의는 배포 yml에서 관리하고 화면은 매핑과 설정 참조만 관리한다. 비밀 설정값의 암호화 yml·공통 복호화 연동·외부 마스터 키 관리는 REQ-403을 따른다. yml에만 둔다는 것은 비밀 원문을 파일에 넣으라는 뜻이 아니다"
    relations:
      depends_on: [REQ-403]
      constrains: []
      conflicts_with: []
      nfr: []
      interfaces: []
    summary: "환경·모듈·배포 설정을 구분하고 잘못된 연결/비밀 설정을 다른 환경의 값으로 대체하지 않는다"
    preconditions:
      - "CON-011·033과 REQ-403의 비밀 관리 정책 및 현재 빌드/실행 프로파일 경계를 따른다"
    data:
      - item: "실행 환경·모듈·활성 프로파일·연결 참조·설정 원천/버전과 비밀을 제외한 적용 근거"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "로컬/개발/운영 실행 환경과 product/local 산출물·sample 포함 설정은 서로 다른 선택이다. 기존 sources/settings.gradle.kts의 프로파일·산출물 판정을 유지하며 이름이 같다는 이유로 결합하지 않는다"
      - "설정 우선순위에 따라 최종 선택된 환경·모듈·Provider/연결 참조를 확인할 수 있어야 한다. 확인 출력에는 비밀 원문·비밀 헤더·키를 포함하지 않는다"
      - "필수 설정 누락·잘못된 참조·허용되지 않은 환경/Provider 조합은 관련 구성요소의 기동/호출 전에 거부한다. 개발 설정을 운영으로, 운영 API를 CLI로 또는 다른 연결/계정으로 조용히 대체하지 않는다"
      - "배포 yml과 운영 DB 오버라이드의 허용 경계는 REQ-506·614를 따른다. admin 화면에서 연결 참조를 바꾼다고 배포 비밀이나 보호된 연결 정의를 편집할 수 있는 것은 아니다"
      - "비밀 해석·키 교체는 REQ-403을 따르며 비활성 선택 연동의 설정을 일률 필수화하지 않는다. 설정 변경의 적용 시점은 항목별 정본을 따르고 재시작이 필요한 연결을 즉시 반영된 것으로 표시하지 않는다"
    exceptions:
      - "잘못된 프로파일/설정 원천·필수 비밀 해석 실패는 비밀 없는 운영 오류로 알리고 평문/다른 환경 설정으로 폴백하지 않는다"
    lifecycle: "배포 설정 선택 → 우선순위/환경/참조 검증 → 비밀 해석 → 구성요소 시작 → 허용된 변경의 적용/복구"
    permissions: "배포 담당자의 설정 권한과 화면 운영 권한을 구분하며 연결 정보/비밀의 일반 열람을 허용하지 않는다"
    audit: "환경·모듈·참조·설정 버전과 적용/실패 근거를 비밀 없이 운영 기록에 남긴다"
