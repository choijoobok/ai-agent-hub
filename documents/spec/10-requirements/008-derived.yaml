  - id: REQ-403
    type: functional
    priority: must
    priority_reason: "접속·인증 비밀과 복호화 키의 관리 경계가 흩어져 있으면 평문 저장이나 화면·모델·로그 유출을 일관되게 차단할 수 없다"
    workstream: integration
    actors: [ACT-009]
    source: "2026-10-02 사용자 요청: API 공통 연결 설정과 흩어진 비밀정보 관리 대상을 공통 요구사항으로 정리. 같은 날 Jasypt 기본안을 검토한 뒤 Spring Security Crypto로 yml 암복호화와 공통 설정 연동을 직접 구현하도록 명시 변경했다(ADR-022, ADR-021 대체). 환경별 외부 활성 마스터 키 하나의 운영 정책은 유지하며 카드 전체 확정은 별도다 2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다"

    process_step: PRC-01-01
    title: "배포 접속 설정·비밀정보 보호와 관리 대상 통합"
    detail: "고객사 인프라 담당자는 Hub가 사용하는 비밀 설정값을 Spring Security Crypto 기반 공통 도구로 암호화해 배포 yml의 ENC(...) 값으로 관리하고, 환경별 활성 설정 암복호화 마스터 키 하나만 OS 환경 변수 등 외부에서 관리해야 한다. Hub 서버는 직접 구현한 공통 설정 연동으로 필요한 값의 복호화 결과를 접속 코드에 전달하되 yml 파일을 평문으로 바꾸거나 admin·portal·LLM에 원문을 제공하지 않아야 한다. 전체 관리 대상·적용 조건·관리 책임·현재 구현 여부는 이 요구사항에서 확인한다"
    roadmap: RM-P1
    acceptance: "여러 연결의 합성 비밀을 공통 도구로 암호화한 ENC(...) yml과 외부 마스터 키 하나로 해석하며 비밀별 환경 변수를 요구하지 않는다. Spring Security Crypto를 사용하는 공통 설정 연동이 기존 프로파일·설정 우선순위를 보존하고 DB 등 설정 소비 전에 복호화 결과를 전달하며 원본 yml은 암호문으로 유지한다. 마스터 키 누락·오류, 변조·미지원 암호문 또는 필수 비밀 해석 실패 시 해당 구성요소의 기동/호출을 거부하고 평문·다른 연결/계정으로 대체하지 않는다. DB·API·LLM과 활성화한 선택 연동의 성공·실패·설정 조회·바인딩 예외·로그·도구 출력·이력·LLM 컨텍스트에 원문이 노출되지 않는다. 실제 비밀 원문·마스터 키를 소스에 넣거나 암호문과 키를 함께 보관하지 않는다. 미사용 선택 연동의 비밀은 요구하지 않는다"
    summary: "비밀 설정값은 암호화 yml에 모으고 외부 관리 값은 환경별 활성 마스터 키 하나로 줄인다. Spring Security Crypto의 암복호화를 재사용하고 설정 자동 복호화·초기화·운영 도구·실패 보호를 직접 공통 구현한다. 전체 대상과 공통 정책은 이 카드가 정본이다"
    intent:
      problem: "yml에만 둔다는 표현과 환경 변수·키 파일·암호화 규칙이 혼재하여 비밀 원문의 저장 위치와 화면 관리 범위를 오해하기 쉽다"
      goal: "비밀 종류가 늘어도 개별 외부 주입 관리 부담 없이 같은 보호 원칙을 적용하고 결정·현재 구현·조건부 대상·미결 설계를 구분한다"
      not:
        - "비밀 원문을 등록·조회·수정하는 system/admin 공통 설정 화면이나 Hub 비밀 저장소를 새로 만들지 않는다"
        - "모든 접속에 고정 API 키를 강제하거나 Spring Security Crypto 의존성만으로 설정 자동 복호화·암호화 키 처리가 이미 구현됐다고 간주하지 않는다"
        - "암호 알고리즘·YAML 파서를 직접 개발하거나 각 업무 모듈·접속 코드가 개별 복호화 로직을 복제하게 하지 않는다"
        - "YAML 전체 자동 편집·비밀/키 관리 화면·무중단 키 교체·Jasypt 암호문 호환을 이번 기본 구현으로 요구하지 않는다"
        - "여러 실행 환경이나 고객사가 같은 마스터 키를 공유하라는 뜻이 아니다"
        - "연결 URL·일반 공통 헤더까지 모두 비밀이라고 분류하지 않는다. 비밀이 아닌 연결 설정도 호출 대상을 바꾸므로 배포 관리 범위로 보호한다"
        - "고객사 레거시 개인정보의 복호화 키를 Hub에 들여오지 않는다(REQ-111)"
    goal_trace: [IN-06, INV-01]
    decider: "제품 오너(사용자). 실제 비밀 발급·보관·배포 권한은 고객사의 인프라·보안 운영 체계가 결정한다"
    preconditions:
      - "환경별 설정 분리는 REQ-402, Spring Security Crypto와 자체 공통 설정 연동의 결정 근거는 ADR-022, 일반 운영 설정과 보호된 배포 설정의 화면 경계는 기존 REQ-506을 따른다"
      - "현재 system 구현의 인증·설정 허용 목록을 변경하는 작업이 아니며 기존 승인된 동작은 유지한다"
    data:
      - { item: "연결 정의: 연결 식별자·접속 대상·인증 방식·공통 헤더·암호화된 비밀 설정값", origin: "환경별 배포 yml", sensitivity: "서버 보호 설정 — 비밀을 포함하는 URL·헤더·연결 문자열도 암호화 대상", retention: "환경별 배포 설정 수명주기. admin DB에는 허용된 참조와 업무 메타데이터만 저장" }
      - { item: "실제 비밀: 비밀번호·API 키·서비스 인증정보 및 설정 마스터 키", origin: "고객사 발급. 비밀 설정값은 암호화 yml, 마스터 키는 외부 관리", sensitivity: "비밀 — 화면·모델·일반 설정 API·로그·이력에 원문 금지", retention: "고객사 비밀 보관·교체·폐기 정책. Hub 업무 이력에 원문 사본을 만들지 않음" }
    managed_items:
      - category: "DB 접속 인증"
        targets: "Hub 자체 DB 및 고객사 업무 DB·DW의 접속 계정·비밀번호/인증정보"
        condition: "각 데이터소스를 사용할 때. Hub 사용자별 업무 신원과 서비스 접속 계정은 별개"
        basis: "REQ-402·REQ-603·CON-018"
        implementation: "Hub DB의 환경 변수 바인딩은 현재 소스에 있다. local에는 합성 개발 기본값이 있으며 운영 자격증명으로 재사용하지 않는다. 업무 DB·DW 연결은 integration 설계 대상"
      - category: "대상 시스템 API 접속 인증"
        targets: "서비스 계정·API 키·인증용 헤더/토큰. 채택한 인증 방식에 클라이언트 비밀·갱신 토큰이 있으면 함께 포함"
        condition: "등록된 업무 REST API가 사용하는 인증 방식에 필요한 비밀만 적용"
        basis: "REQ-604·REQ-608·CON-003·CON-004"
        implementation: "배포 연결 설정과 admin 참조 계약을 정련 중이며 인증 방식별 구현 완료를 의미하지 않음"
      - category: "LLM·임베딩 공급 경로 인증"
        targets: "제작사 직접 API·사내/클라우드 게이트웨이의 API 키·서비스 계정 인증정보"
        condition: "채택한 공급 경로가 요구할 때. 외부 신원 기반 인증이면 별도 고정 키를 강제하지 않음"
        basis: "REQ-602·CON-035"
        implementation: "공급 경로별 접속·인증 주입 계약은 P2 정련 대상"
      - category: "Redis 접속 인증"
        targets: "세션 저장소의 계정·비밀번호/인증정보"
        condition: "Redis 세션 저장소를 선택했을 때만. JDBC 세션은 Hub DB 인증 사용"
        basis: "CON-010 · sources/backend/bootstrap/src/main/resources/application.yml"
        implementation: "현재 Redis 선택 구성은 있고 기본은 JDBC 세션. 고객사 Redis 비밀 설정값은 암호화 yml 정책 대상이며 공통 설정 복호화 연동은 아직 구현되지 않음"
      - category: "메일 서버 접속 인증"
        targets: "SMTP 계정·비밀번호/인증정보"
        condition: "메일 발송을 켜고 고객사 SMTP 서버가 인증을 요구할 때"
        basis: "CON-031 · sources/backend/bootstrap/src/main/resources/application.yml"
        implementation: "현재 메일 발송 경로와 MAIL_PASSWORD 주입 예시는 있다. 메일 미사용 또는 무인증 릴레이면 비밀을 강제하지 않음"
      - category: "외부 사용자 인증 연동"
        targets: "채택한 SSO/계정 연동이 요구하는 클라이언트 비밀·연동 서비스 계정·검증용 인증정보"
        condition: "고객사 외부 인증 연동을 도입하고 해당 계약이 요구할 때"
        basis: "REQ-103·ARCH-050"
        implementation: "연동별 비밀 계약은 미정. 현재 자체 로그인은 서버 세션 기반이므로 JWT 서명키를 필수 관리 대상으로 추가하지 않음"
      - category: "설정 복호화 키·Hub 자체 데이터 암호화 키"
        targets: "Spring Security Crypto 기반 설정 암복호화 마스터 키와, 향후 Hub 자체 개인정보 분리보관 등 암호화를 도입할 때의 데이터 암호화 키"
        condition: "각 암호화를 실제 도입했을 때. 서로 다른 목적의 키이며 레거시 개인정보 복호화 키는 제외"
        basis: "CON-011 · aidd-guide/standard/build-deploy.md · aidd-guide/standard/backend/pii-vault.md · REQ-111"
        implementation: "Spring Security Crypto 의존성은 현재 domain 모듈에 있으나 YAML 설정 복호화 연동·운영 도구와 Hub 개인정보 암호화는 구현 없음. 외부 키 하나는 설정 암복호화 마스터 키이며 Hub 업무 데이터 암호화에 동일 키를 직접 재사용하는 결정이 아님. 향후 데이터 암호화 키의 저장·보호는 해당 설계에서 구체화"
      - category: "TLS 인증서의 개인키·키 저장소 비밀번호"
        targets: "HTTPS 종단이나 고객사 인증 연동에서 사용하는 개인키·키 저장소 비밀번호. 공개 인증서 자체와 구분"
        condition: "해당 배포 환경이 개인키를 보유하는 구성일 때"
        basis: "CON-003 · aidd-guide/standard/safety/secrets.md"
        implementation: "Hub yml의 키 저장소 비밀번호 등 문자열 비밀은 공통 암호화 yml 정책 대상. 인증서 개인키 파일·프록시 등 외부 종단의 비밀은 고객사 인프라 책임이며 이를 모두 yml에 넣거나 Hub가 관리하는 결정이 아님"
      - category: "배포·운영 기반 도구 인증"
        targets: "사용하는 배포 도구·아티팩트 저장소·백업 저장소·모니터링 등의 서비스 인증정보"
        condition: "고객사 운영 구성에서 해당 도구를 실제 사용할 때"
        basis: "ACT-009·CON-027·CON-037 · aidd-guide/standard/safety/secrets.md"
        implementation: "고객사 운영 도구의 비밀 관리 책임이며 admin DB나 운영 화면으로 모으지 않음. 제품에 새 외부 도구 연동을 추가하는 요건이 아님"
    business_rules:
      - "배포 yml은 연결 식별자·대상·인증 방식·일반 공통 헤더와 비밀 설정값의 ENC(...) 암호문을 관리한다. 실제 비밀번호·API 키·비밀 헤더를 평문으로 보관하지 않으며 admin의 관리 저장값은 허용된 연결 식별자와 참조다. 대상 시스템의 비밀 없는 현재 Base URL·인증 방식 표시는 REQ-604.connection_display를 따르며 배포 설정 편집이나 비밀 열람을 허용하지 않는다"
      - "실제 비밀 원문과 마스터 키는 소스·시드·형상 관리에 넣지 않는다. 암호문은 환경별 배포 yml로 관리하며 고객사 정책에 따라 형상 관리할 때도 복호화 키를 같은 파일·저장소·배포 산출물에 함께 두지 않는다"
      - "2026-10-02 사용자 결정: Spring Security Crypto로 비밀 설정값을 암복호화하고 YAML 설정 자동 복호화 연동을 직접 공통 구현한다(ADR-022). 활성 설정 마스터 키 하나만 OS 환경 변수 등 외부에서 관리한다. 비밀별 환경 변수·외부 저장소 주입은 기본 운영 방식으로 요구하지 않는다. 현재 환경 변수 바인딩은 구현 현황으로만 기록하며 정해진 정책의 구현 완료를 뜻하지 않는다"
      - "직접 구현할 범위는 암호문 형식/외부 키 읽기, Crypto 호출/설정 조회 어댑터, 조기 초기화, 암호문 생성·검증·재암호화 명령행 도구, 실패 차단/출력 보호와 회귀 시험이다. ENC(...)는 암호문 식별 규약이며 Jasypt 암호문과의 호환성을 뜻하지 않는다. 실제 암호 알고리즘과 키 생성·난수 처리는 검증된 라이브러리 기능을 재사용한다"
      - "공통 설정 연동은 DB·메일 등 설정 소비 전에 적용하며 프로파일·외부 yml·환경 변수의 기존 우선순위와 바인딩 동작을 보존한다. yml 파일은 암호문으로 유지하고 메모리에서 필요한 서버 코드에 복호화된 값을 전달한다. 모듈이나 비밀 항목이 늘어도 개별 복호화 코드를 복제하지 않는다"
      - "마스터 키의 관리 단위는 고객사·실행 환경이며 하나의 환경에서 system·admin·portal·agent가 같은 설정 해석 경로를 사용한다. 고객사 간·운영/개발 간 키를 공유하지 않고 환경별 활성 키 하나를 사용한다. 키 자체를 ENC(...)로 넣어 자기 자신으로 복호화하도록 만들지 않는다"
      - "키와 암호화 도구는 허가된 배포 담당자만 사용한다. 암호화 알고리즘·난수 salt/IV·키 유도 강도를 명시해 암호화/복호화에서 일치시키며 취약한 예제·기본값을 검토 없이 채택하지 않는다. 비밀이나 키를 명령행 인자·셸 이력·도구 출력에 남기지 않는다"
      - "비밀 원문은 관리자 권한이 있어도 일반 설정 조회·업무 화면·변경 이력·로그·오류 응답·LLM 컨텍스트에 노출하지 않는다. 필요한 서버 접속 코드만 해석된 비밀을 사용하고 모델과 업무 도구 인자는 이를 읽거나 출력하지 못한다(REQ-102·REQ-114)"
      - "필수 참조 누락·해석 실패·인증 실패 시 관련 연결을 사용하지 않고 운영 담당자에게 비밀 없는 오류를 남긴다. 다른 연결·계정·무인증 경로로 자동 대체하지 않는다. 미사용 선택 연동 때문에 무관한 기능까지 실패시키지 않는다"
      - "개별 비밀 교체는 같은 활성 마스터 키로 해당 값만 재암호화한다. 마스터 키 교체는 해당 환경의 대상 암호값을 모두 재암호화하고 키/yml이 일치하는 단위로 검증·반영·복구한다. DB 연결 재구성은 REQ-603의 재기동 규칙을 유지하고 다른 연결의 반영 시점은 P2에서 정한다. 기록은 참조 식별자·버전·결과만 남기며 키 유출 시 해당 환경의 실제 자격증명도 교체 대상으로 판단한다"
      - "자체 로그인 비밀번호는 현재 PasswordEncoder의 단방향 해시 대상이지 외부 시스템 접속을 위해 복호화하는 비밀이 아니다. Hub 업무 데이터·개인정보의 보존·마스킹 규칙을 이 카드로 대체하지 않는다"
      - "설정 우선순위에서 선택된 비밀 값의 형식·버전·변조 검증이 실패하면 낮은 우선순위의 다른 값이나 평문으로 다시 시도하지 않는다. ENC 표시가 잘못된 값을 일반 문자열 비밀로 넘기지 않는다"
      - "암호문 생성/재암호화는 같은 비밀에도 안전한 난수 재료를 사용하고 변조를 검출하는 기존 P2 암호 계약을 따른다. 인증 전 복호화 중간값을 설정 소비자·로그·오류에 공개하지 않는다"
      - "마스터 키 교체 전 대상 암호값과 새 키의 일치 여부를 합성/비노출 검증하고 실패하면 혼합된 키/yml로 일부 연결만 시작하지 않는다. 복구 시에는 검증된 이전 키와 암호문 묶음을 함께 사용하며 자동 무중단 교체를 요구하지 않는다"
      - "암호화/검증 도구와 배포 검증의 종료 상태는 성공·실패를 구분해야 한다. 실패한 출력/부분 파일을 성공 산출물로 채택하지 않으며 원문·키·복호화 값을 일반 임시 파일·표준 출력에 남기지 않는다"

    exceptions:
      - "공정 단계의 요청 실패 처리는 PRC-01-01, 연결 참조 선택 실패는 각 관리 요구사항을 따른다"
      - "무인증 API·SMTP 등 계약상 인증 비밀이 없는 구성은 비밀 미설정 오류로 거부하지 않는다. 계약에 없는 인증 생략은 허용하지 않는다"
    lifecycle: "비밀의 발급·교체·폐기는 고객사 비밀 운영 정책이 소유한다. Hub 기준정보의 활성/비활성 상태나 사용자 신원 매핑 상태와 혼합하지 않는다"
    permissions:
      - "배포 설정·비밀 발급/교체 권한은 고객사 인프라·보안 운영 체계가 관리한다. admin 메뉴 권한만으로 비밀 원문 읽기·변경 권한을 부여하지 않는다"
      - "일반 운영 설정 허용 목록과 보호된 배포 설정의 기존 경계는 REQ-506을 유지한다"

    audit: "관리 참조 변경은 REQ-601, 고객사 비밀 발급·배포·교체 이력은 고객사 운영 정책을 따른다. Hub의 공통 비밀 원문 이력 테이블을 신설하지 않는다"
    volume: "환경별 연결 수·교체 주기는 고객사 구성에 따라 다르다. 새 정량 목표를 추정하지 않는다"
    config:
      - "대상 목록과 조건은 managed_items가 정본이다. DB·API·LLM 개별 카드에서 같은 암호화·저장 정책을 다시 정의하지 않는다"
      - "일반 공통 헤더와 비밀 헤더를 구분하고 인증·서버 신원용 보호 헤더는 LLM·사용자 업무 인자로 덮어쓰지 못한다"
    risk: "Spring Security Crypto는 암복호화 기능이지 설정 자동 복호화 starter가 아니므로 공통 연동의 초기화 순서·설정 우선순위·바인딩 예외와 출력 보호를 직접 검증·유지보수해야 한다. 현재 Spring Boot 4·JDK 25에서 사전 검증하고 실패 시 사용자에게 보고한 뒤 대안을 결정한다. 마스터 키 유출은 해당 환경 전체 암호값에 영향을 주며 키 유실은 설정 복구를 막으므로 별도 안전 보관·교체/복구 시험이 필요하다. 근거는 ADR-022"
    relations:
      depends_on: []
      constrains: [REQ-102, REQ-402, REQ-602, REQ-603, REQ-604, REQ-608]
      conflicts_with: []
      nfr: []
