    detail: "사용자는 자연어로 업무 지시·작업 순서·조건과 실행 스케줄을 작성하고, LLM이 현재 허용 지식·카탈로그·API·도구를 근거로 만든 계획을 확인해 실행 정의로 발행할 수 있어야 한다. 검증된 실행 정의를 반복 배치로 실행하고, 대화창에서 자신이 설정한 워크플로우를 선택해 수동 승인하며 실행할 수도 있어야 한다. 액션별 자동 승인 활성화는 REQ-405를 따른다"
    summary: "검증한 계획을 버전으로 재사용하면서 현재 조건을 검사하고 예약 자동 실행과 대화형 수동 실행을 구분한다"
    intent:
