        retention: "REQ-107·109의 근거 연결과 RM-P3 계약 적용"
    business_rules: ["사용자는 워크플로우를 작성·검증한 뒤 자동 승인할 액션을 선택해 요청한다. 제출본은 불변 스냅샷으로 보존하고 수정은 취소/종결 결과 확인 후 새 요청으로 처리한다. 요청 중 운영 정의를 바꿔 검토한 내용과 다른 것을 활성화하지 않는다", "관리자는 업무 목적·실행 순서/조건·대상 시스템·액션 효과·입력 출처/변동 범위·허용 한도·현재 실행 권한·참조 자산 변경 영향·부분 실패/중복 위험과 검증 근거를 확인한다. 스냅샷이나 참조가 승인 전에 바뀌었으면 차이를 해소한 새 요청을 받으며 최신본으로 자동 치환하지 않는다", "승인은 특정 워크플로우 버전·실행자·선택 액션·순서/분기·고정값과 동적 값 생성 규칙/허용 범위·스케줄/유효 조건에 결합한다. 미래에 구할 값은 승인 시 미확보일 수 있으나 그 출처와 허용 조건이 검토돼 있어야 하고 실제 전송 전에는 모든 값이 확보·검증돼야 한다", "활성화 승인은 RM-P3 예약 실행의 해당 액션에 한정한다. 대화창 수동 실행은 REQ-404의 수동 승인 경로를 따른다. 승인 액션을 같은 API의 다른 호출·다른 워크플로우·다른 실행자로 확대하지 않는다", "자동 승인을 실제 적용하는 주체는 서버다. 매 액션 전송 직전에 현재 활성 상태·승인 버전·유효 조건·실행 모드·의존 계약·실제 값/범위·현재 실행자 권한과 정책을 검사하고 해당 실행/호출에 승인 근거를 연결한다. LLM 출력이나 화면의 활성 표시만으로 통과시키지 않는다", "조건을 만족하지 못한 자동 승인은 실행 허용으로 보정하지 않는다. 단순히 자동 승인이 없는 액션은 REQ-404의 수동 승인 대기로 보낼 수 있지만 권한/정책 위반·불명확 입력·변경 영향 미확인은 수동 승인으로 우회하지 않는다", "자동 승인 유효 기간과 필요한 빈도/건수/금액 등 업무 한도는 워크플로우별 요청·승인 범위에 명시한다. 유효 기간은 시작·종료가 있는 유한 기간이며 적용하지 않는 업무 한도도 이유를 검토·기록한다. 모든 업무에 같은 고정 숫자를 강제하지 않고 해당 업무의 값·단위·검사 근거를 관리자가 검토한다. 만료 시 자동 갱신하지 않고 계속 사용하려면 새 요청·검토·승인을 거친다", "작성자는 자신의 자동 승인 활성 상태를 해제할 수 있고 유효한 관리 권한자도 정지/해제할 수 있다. 해제·만료·의존 계약 무효는 미전송 후속 실행부터 적용하며 이미 전송/성공한 업무를 소급 취소하지 않는다. 재활성화·범위 확대·실행 정의 변경에는 새 요청/검토/승인이 필요하다", "새 정의 버전·영향 있는 지식/카탈로그/API/도구 변경에는 이전 승인을 자동 승계하지 않는다. 영향 미확인이면 보류하며 변경된 실제 실행 범위에 대해 재검토한다. 수정 중인 별도 초안은 현재 발행본과 구분하되 현재 발행본의 참조 계약까지 바뀐 경우에는 그 영향도 검사한다", "관리자 활성화 승인 권한과 일반 수정/일정 활성 권한을 분리한다. 자격은 현재 유효 메뉴·액션 권한으로 판정하고 역할명/계정명을 하드코딩하지 않는다. 동일인이라도 별도 승인 권한이 있을 때만 명시 요청·검토·승인 단계를 수행할 수 있으며 작성 권한만으로 전결하지 않는다(ADR-019)", "관리자의 자산 직접 저장은 Portal 사용자의 이 활성화 신청·관리자 승인 절차를 생략하지 못한다. 관리자 승인은 실행자의 현재 권한·신원·개인정보/전송·쿼터·실행 한도·도구 정책·멱등성 통제를 대신하지 않는다", "결과 불명 이후 동일 업무의 후속 실행은 자동 승인 범위나 다음 예약 회차로 우회하지 않는다. REQ-105.manual_reexecution의 최신 대상 시스템 확인·새 수동 최종 승인과 원 실행 연결을 적용한다. 등록 계약이 허용하는 자동 재시도 자체의 기존 제한도 확대하지 않는다", "자동 승인 활성화의 유효 기간과 REQ-026의 사람 승인 대기/승인 후 호출 시작 기한은 별개다. 자동 경로는 승인 카드를 가짜로 생성·클릭하거나 일반 사용자 승인 시간을 연장하는 방식으로 구현하지 않는다. 실행별 값 확정·승인 적합성 판정과 실제 전송 사이 변경 경합은 조건부 검증으로 차단한다", "실제 값의 원문 보호는 REQ-005.execution_parameter_storage·ADR-025를 적용한다. 자동 승인 판정 대상과 실제 호출에 같은 검증된 원값 버전을 사용하고 재조회/값 변경 시 다시 판정한다. 암호화 임시 보관의 승인 연결 키·유한 기한·삭제는 후속 설계에서 자동 경로를 포함해 구체화하며 일반 감사/로그에 원문을 남기지 않는다", "승인 스냅샷에는 REQ-404의 중첩 금지와 기본 생략/선택적 순차 대기 설정, 회차별 대상 기간 규칙도 포함한다. 대기 후 실행 시점에도 유효 기간·한도·현재 권한을 다시 검사하며 요청 시각이나 원 예정 시각이 승인 기간 안이었다는 이유로 만료된 근거를 사용하지 않는다", "업무 한도의 값·단위·집계 범위/기간과 적용하지 않는 사유가 검토되지 않았거나 필요한 한도를 현재 검사할 수 없으면 해당 액션의 자동 승인을 활성화하지 않는다. 수치·단위의 변경으로 승인 범위를 넓히거나 만료된 승인을 수동 설정으로 되살리지 않는다"]
    approval_target: "자동 승인 대상에는 REQ-105.approval_target_binding의 실제 연결·업무 목적지·실행 주체 해석 근거를 포함한다. 의미 변경이나 동일성 확인 불가 시 영향받는 자동 승인을 무효화하고 새 활성화 요청·검토·승인을 요구한다. 검증된 동일 주체의 비밀 교체 예외와 이미 전송한 호출의 보존도 같은 정본을 따른다"
    exceptions: ["승인/해제 경합·중복 제출·여러 인스턴스 검사에서도 같은 요청을 두 번 승인하거나 해제된 근거로 신규 호출하지 않는다", "자동 승인 근거 기록·활성 상태 확인 실패는 실행 허용으로 처리하지 않는다. 전송 여부 불명은 기존 결과 불명 통제를 따른다"]
    lifecycle: "비활성 → 사용자 활성화 요청 → 관리자 검토 → 승인/반려/취소 → 승인 범위 활성 → 실행별 적합성 검사 → 해제/만료/변경 무효 → 필요 시 새 요청. 단계 이름은 논리 상태이며 물리 코드는 후속 설계에서 정한다"
    permissions: "요청자는 자기 워크플로우 범위에서 신청하고 관리 승인 권한자가 검토·활성화한다. 실행은 소유자의 현재 권한으로 판단하며 승인자의 데이터 권한을 빌리지 않는다"
    audit: "요청·검토·승인·반려·취소·해제·무효와 실제 실행별 자동 승인 적용/거부를 서로 연결한다. 관리자 사전 승인 시각과 서버의 실행 시점 판정을 구분하고 매번 사람이 승인한 것으로 기록하지 않는다"
    config: "활성화는 승인 상태이며 단순 Boolean 설정 저장으로 변경하지 않는다. 워크플로우별 유한 유효 기간·필요 한도/미적용 사유를 요청·승인본에 기록하고 자동 갱신하지 않는다. 한도 단위/집계·해제 전파·경합 계약은 RM-P3 설계에서 검증한다"
    risk: "포괄 승인·오래된 계약·검사와 전송 사이 변경·결과 불명 예약 재실행이 반복적인 업무 오처리를 확대할 수 있다"
    acceptance: "사용자 요청 후 관리자 검토·승인 전에는 자동 승인되지 않는다. 승인된 버전/액션/동적 값 규칙 범위에서만 예약 실행이 진행되고 수동 실행은 기존 카드 승인을 거친다. 범위 변경·만료·해제·권한 실패·결과 불명은 자동 승인으로 우회되지 않으며 당시 승인 근거와 실행별 판정을 재현할 수 있다. 워크플로우별 유한 유효 기간·필요 한도/미적용 사유가 승인 근거에 남고 만료 후 대기 회차도 새 승인 없이 실행되지 않는다."
