    detail: "워크플로우 작성자는 발행할 실행 정의와 자동 승인 대상 액션을 지정해 활성화를 요청한다. 유효한 관리 승인 권한자는 요청 스냅샷의 업무 목적·액션/순서·파라미터 출처/허용 범위·지식/카탈로그/계약·스케줄과 위험을 검토하고 활성화 승인 또는 반려한다. 승인된 범위와 현재 조건을 만족하는 예약 실행만 실행 시 수동 승인 카드를 대신할 수 있다"
    summary: "관리자가 검토한 워크플로우 버전·액션·입력 규칙에 한정해 예약 실행의 자동 승인을 활성화한다"
    intent:
      problem: "매 실행마다 사람이 승인하면 자동 배치가 되지 않고, 작성자 임의 자동 승인이나 무제한 포괄 승인은 반복적인 잘못된 업무 실행을 허용한다"
      goal: "사용자 요청과 관리자의 명시 검토를 근거로 제한된 반복 실행을 허용하고 변경·해제 시 후속 호출을 차단한다"
      not: ["API 전체·사용자 전체에 대한 포괄적인 승인 면제 설정이 아니다", "지식/API/도구 등록 승인이나 REQ-601의 전결을 워크플로우 자동 승인으로 간주하지 않는다"]
    hard_rule: "기본값은 자동 승인 비활성이다. 요청 제출·기술 검증·스케줄 활성만으로 효력이 생기지 않으며 관리자 활성화 승인과 현재 실행별 적합성 검사를 모두 통과해야 한다. 승인 없는 액션·다른 버전·범위 밖 값·만료/해제 상태에는 자동 승인 근거를 사용할 수 없다"
    preconditions: ["REQ-404의 검증 가능한 실행 정의와 현재 소유자/실행자·등록 액션·입력 출처 및 통제 근거가 준비돼 있다", "검토자가 판단할 수 없는 미정 액션·의미 불명 입력·제약 없는 동적 확장 상태는 활성화 승인 대상으로 통과하지 않는다"]
