        case: "사용자가 전일 미출고 주문의 지정 창고 출고 액션과 입력 규칙을 신청한다. 관리자가 검토·활성화한 버전의 예약 실행은 매번 현재 주문/수량을 확보해 승인 범위 안인지 확인한 뒤 호출한다"
      - kind: "예외"
        case: "승인 뒤 창고·단위·계산식이 바뀌거나 실행자가 권한을 잃으면 기존 활성 상태만으로 호출하지 않는다. 출고 결과가 불명이면 다음 예약으로 재전송하지 않고 수동 확인·새 승인을 요구한다"
    verification: ["요청만 제출·승인 전 수정·현재 권한 없는 승인·전결 설정·다른 워크플로우/실행자 재사용을 차단한다", "고정값 변경·동적 값 허용 범위 초과·사용 계약 버전 변경·기한 만료에서 전송하지 않는다", "관리자 해제와 호출 전 검사가 경합할 때 미전송/이미 전송 사실을 구분하고 소급 취소를 주장하지 않는다", "수동 실행·부분 자동 승인·결과 불명 후 다음 예약·자동 판정 기록 실패·중복 승인/예약을 검증한다", "서로 다른 업무는 각자 검토한 기간·건수/금액/빈도 한도를 적용하고 미적용 한도는 사유를 기록한다. 유효 기간 누락·필요 한도 검증 불가·단위/집계 범위 미정 상태는 활성화하지 않는다", "순차 대기 회차가 승인 만료 뒤 실행 대상으로 선택돼도 과거 접수/예정 시각의 승인으로 호출하지 않는다. 만료 자동 갱신·순차 대기 설정 변경에 따른 승인 범위 확대·한도 단위 바꾸기를 허용하면 검증이 실패해야 한다"]
    open: ["@defer RM-P3 관리자 검토 화면·요청 스냅샷·상태/권한, 확정한 워크플로우별 유한 유효 기간·필요 한도/미적용 사유의 필드·단위/집계와 실제 값 검사 계약을 설계한다", "@defer RM-P3 승인/무효/해제와 전송의 경합·다중 인스턴스 전파·외부 계약 변경·자동 경로 원값 임시 보관과 기록 실패 시험을 구체화한다"]
    asset_availability: "2026-11-01 사용자 승인: REQ-601.asset_availability·configuration_alerts를 적용한다. 발행/저장/과거 승인된 정의도 실행 시작 전과 각 호출 전 지식·카탈로그·API·도구의 현재 수동 사용과 필수 참조/시스템/연결을 재검사한다. 예약·대화 수동 실행·재시도·재개 경로가 우회하지 않는다. 설정 오류는 해당 단계 전송 전 차단·실패/부분 실패 근거를 남기고 이전 수행 결과를 보존한다. 원인 경고는 관리자에게 연결하되 이미 접수/전송된 업무를 소급 취소하거나 자동 전체 재실행하지 않는다. RM-P3 상세 실행/영향 제공자는 해당 차수에서 실현한다."
