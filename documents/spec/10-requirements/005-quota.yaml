    "title": "이번 달 추가 토큰 사용 신청·승인"
    "detail": "사용자는 이번 달에 필요한 추가 토큰량과 업무 사유를 신청하고, 운영·비용 관리자는 계획 총 풀 대비 일반 배정·미배정 계획량·예외 승인 여부를 확인해 승인 또는 반려한다. 승인된 추가 한도는 즉시 해당 월 개인 한도에 더하며 월말에 만료되고 이월되지 않는다"
    "hard_rule": "계획 총 풀은 절대 차단선이 아니나, 총 풀 밖 예외 승인은 사유·승인자·승인량·처리 시각을 일반 배정과 구분해 남긴다. 승인·반려·취소 이력은 수정하지 않으며, 이미 발생한 사용량이나 당시 유효 한도를 소급 변경하지 않는다"
    "source": "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(부분 승인·미처리 자동 만료·알림) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    "roadmap": "RM-P1"
