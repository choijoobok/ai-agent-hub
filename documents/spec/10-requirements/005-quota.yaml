      - { item: "고정 USD/100만 토큰 단가·계획 통화/USD 수동 환산율·보정률·보정 단가", origin: "REQ-613 저장 시 고정 USD 단가·관리자 월 환산율/근거·수동 보정", sensitivity: "내부(비용)", retention: "월별 이력 보존" }
      - { item: "자동 산정값·관리자 보정값·보정 근거", origin: "Hub 계산·admin 입력", sensitivity: "내부(비용)", retention: "수정 불가 이력" }
    business_rules:
      - "다음 달 사용자/효력 등급 스냅샷은 REQ-116의 사용기간 자격을 함께 고정한다. 대상 월 1일에 미래 시작/만료인 사용자는 예정/최종 배분과 인원에서 제외하고 월중 자격 개시는 별도 일할 배정으로 처리한다. 기간 변경으로 미래 예정이 낡으면 재생성하며 확정 당월/과거 배정은 다시 나누지 않는다"
      - "월 총 토큰 풀의 정본 산식은 NFR-010이다. USD 단가×월 계획 통화/USD 환산율×수동 보정률로 보정 단가를 계산하며 환율은 한 번만 적용한다. 보정률은 기본1.0·근거 있는 수동 조정만 유지하고 최근3개월 자동 보정 제안을 중복 적용하지 않는다"
      - "화면 식별은 기준년월 하나다. 단가 원 월/기준본·승계 출처는 비표시로 보존하고 환산 근거 단독 컬럼 대신 메모와 원 이력에 설명을 연결한다. 메모는 largeText 셀 위 textarea이며 완료 여부는 실행 결과의 읽기 전용 스위치다"
      - "수동 행 추가는 같은 월 유효 저장 단가·현재 권한·월 중복을 검사한다. 없거나 미완료·조회 실패면 행을 추가하지 않는다. 추가만으로 단가를 잠그지 않는다. 최초 월 기준 저장과 원 단가 고정은 실적 고정 상한 재대조/명시 확인·자기 기준본 검증을 함께 성공/실패시킨다"
      - "최초 고정 뒤 금액/환산율/수동 보정/메모는 대상 월 시작 전 수정 가능하지만 원 USD 단가·스냅샷/상한은 바꾸지 않는다. 월 기준 삭제·저장 후 기준년월 변경·단가 교체/잠금 해제는 제공하지 않는다. 월말 자동 생성은 참조한 직전 월 원 단가를 유지하며 미사용 M월 단가를 임의로 고정하지 않는다"
      - "수동 예정 배분은 저장본으로 대상 월 시작 전 여러 번 생성/교체할 수 있다. 과거 예정본은 이력으로 보존하고 같은 월의 유효 세트만 배정/통계에 사용한다. 월 시작 전 금액/환산율/보정·등급 기준/효력 등급 변경은 예정본을 낡음으로 표시한다. 메모만 바뀌면 계산 결과를 무효화하지 않는다"
      - "미래 완료 스위치는 현재 기준의 유효 예정본을 나타내고, 월 시작 뒤는 월말 최종 배분 완료를 나타낸다. 조회 실패/불명·0명 개인 기준 미산정을 미완료=false로 대체하지 않는다. 스위치를 직접 켜서 배분하거나 끄고 재처리하지 않는다"
      - "월말 스케줄 배치는 M월 시작 경계를 마감으로 삼고 이미 저장된 유효 M월 금융기준이 있으면 그 값을 사용한다. 기준 부재가 확인된 경우에만 M월 행을 새로 만들며 바로 직전 월의 유효 금액·원 USD/단가 참조·당시 환산율·수동 보정을 그대로 복사한다. 더 오래된 임의 월이나 현재 공개 요금으로 대체/재환산하지 않는다"
      - "M월 기준 조회 실패·손상·잘못된 설정은 부재가 아니며 직전 월로 몰래 덮어쓰지 않는다. M월과 직전 월 모두 유효 금융기준이 없으면 임의 금액/단가를 만들지 않고 배분 불가를 표시한다"
      - "배치의 사용자·활성 효력·승인된 사용자 등급과 적용 등급 가중치는 두 경우 모두 M월 기준이다. 가중치는 M월 이하 시작월 중 최신 기준을 쓰고 기존 월별 기준 전체의 과거 가중치를 금융값과 함께 무조건 승계하지 않는다. 미승인 신청/마감 뒤 승인·유효하지 않은 등급 대응을 임의 반영하지 않는다"
      - "월말 배치는 수동 예정본 유무/낡음과 무관하게 최신 저장/승인 효력 기준으로 최종 산정한다. M월 금융기준 자동 생성이 필요한 경우 그 생성과 전체 최종 배분을 함께 성공/실패시키고 기존 수동 저장 행을 배치 실패로 지우지 않는다"
      - "마감 스냅샷·소유 금융 원 기준과 M월 등급/대상자 기준을 각각 보존하고 같은 M월 최종 배분 효과는 한 번만 적용한다. 동일 작업의 실패 재처리는 원 마감 스냅샷 복구이며 M월 시작 뒤 현재 설정으로 수동 재생성하는 예외가 아니다. 결과 불명은 원 작업을 먼저 확인한다"
      - "M월 시작 이후 전체 수동 재생성과 해당 월 기준/효력 등급의 소급 변경을 금지한다. 신규/재활성 등록의 개별 일할·0명 월 최초 활성 기준 산정·첫 사용 전 최초 등급 정정은 REQ-116의 별도 자동 개별 배정으로 유지하며 다른 사용자의 기존 한도를 다시 나누지 않는다"
      - "활성0명이어도 월 금융/등급 준비와 배치 완료는 가능하지만 개인 배분 기준은 미산정으로 남긴다. 최초 활성자 산정/중복 방지는 REQ-116.empty_population을 따른다. 개인 사용 시작에는 유효 월/개인 한도가 필요하다"
      - "등급 기준 편집은 REQ-606/SCR-064, 공급사 대조값 입력은 종합 통계, 사용자별/월별 원 근거 조회는 SCR-066/067이 소유한다. 월별 기준에는 수동 보정/산정 처리 근거 탭을 복제하지 않는다"
    exceptions:
      - "필수 금융/등급 기준·사용자 대응·권한/기준본 검증 실패는 배분을 거부한다. 확인 불가를0/없음/최저 등급으로 대체하지 않는다"
      - "월말 스케줄 미실행/실패·결과 불명은 운영 담당자가 원 작업/고정 마감 기준으로 확인·복구한다. 현재 월 임의 재배분·다른 사용자 한도 재계산으로 복구하지 않는다"
      - "첫 도입 등 유효 월 기준/개인 한도가 아직 없으면 기존 질의 시작 차단을 유지한다"
    lifecycle:
      - { state: 작성중, next: [예정생성, 최종배분], note: "저장·단가 고정 후 미래 예정 생성은 선택이다. 월말 배치가 최신 저장본으로 최종 생성한다" }
      - { state: 예정생성, next: [예정생성, 최종배분], note: "대상 월 시작 전 교체 가능. 변경 시 낡음을 표시하고 최종 배치가 최신 기준을 적용한다" }
      - { state: 최종배분, next: [], note: "대상 월 시작 경계에서 최종 적용. 이후 전체 수동 재생성 금지. 원 배치 복구·자동 개별 배정은 별도" }
    permissions:
      - "입력·보정·확정: ACT-004"
    audit: "월 기준 메모/금융 입력·단가 고정·예정 생성/교체·월말 최종 배분을 구분한다. 원 금융기준의 소유 월/리비전·M월 등급 기준/효력 대상자·마감 시각·수행 주체·시각·유효 세트와 원 작업을 보존한다. 금융 승계는 직전 월, 사용자/등급 기준은 M월이라는 출처를 각각 남기고 과거 결과를 덮어쓰지 않는다"
    volume: "월말 대상 월별 최종 배분 효과1회. 미래 예정 생성은 월 시작 전 여러 번 가능. 운영 규모/상한은 미확인"
