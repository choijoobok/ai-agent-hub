    detail: "월별 기준은 기준년월당 한 행의 금액·USD 단가/참조·수동 환산율·보정·메모다. 수동 행 추가는 같은 월 유효 저장 단가를 자동 참조하고 최초 저장과 단가 고정을 함께 처리한다. 수동 실행은 대상 월 시작 전 예정 배분을 생성/교체하며 월 시작 뒤 재생성하지 않는다. 월말 스케줄 배치는 다음 달 M월 기준이 이미 저장돼 있으면 그 설정값을 적용하고, 없으면 새 M월 행을 만들며 바로 직전 월의 유효 금융기준을 그대로 승계한다. 어느 경우나 사용자·효력 등급·배분 가중치는 M월 기준으로 최종 산정하고 같은 M월 최종 배분 효과를 한 번 적용한다"
