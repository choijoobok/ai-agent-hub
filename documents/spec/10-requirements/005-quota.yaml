# 영역: 쿼터·비용
requirements:
# ── 쿼터·비용 ───────────────────────────────────────────────
  - id: REQ-116
    type: functional
    priority: must
    actors: [ACT-004]
    source: "2026-10-31 사용자 결정 — 상대 가중치 유지·독립 등급 기준·월 시작 전 예정 재생성·월말 배치가 다음 달 사용자/효력 등급으로 최종 배분. 첫 수동 배분 실행 전후로 효력 월을 미루지 않는다. 기존 모델 제한 없음·신규 일할/0명·첫 사용 전 최초 정정 유지"
    process_step: PRC-12-01
    title: "개인별 쿼터 등급·토큰 한도 관리"
    detail: "Hub는 사용자 그룹과 독립적으로 활성 Portal 이용자마다 쿼터 등급 하나를 부여한다. 등급은 월 기본 토큰 배분 가중치와 적용 월만 정하며 모델 선택을 제한하지 않는다. 신규 이용자는 등록 때 부여한 등급(기본 선택값은 가장 낮은 등급)을 등록한 달부터 적용한다. 관리자의 직접 등급 변경은 사유를 기록하고 기존 적용 월 규칙을 따른다"
    hard_rule: "사용자 그룹/역할은 자산 접근 통제이고 쿼터 등급은 개인 토큰 배분 가중치/적용 월이다. 당월·지난 적용 월은 변경/삭제하지 않는다. 대상 월 시작 전 승인/저장한 승급·직접 등급 변경은 해당 미래 월부터 효력을 갖고 첫 수동 예정 생성 여부로 그다음 달로 미루지 않는다. 월말 배치는 다음 달 효력 사용자/등급과 적용 등급 기준을 고정해 최종 배분한다. 기존 승인 효력 월/과거 이력을 재생성으로 임의 변경하지 않으며 이번 달 부족분은 추가 승인(REQ-119)이다"
    why: "업무 자산 접근 범위와 월별 토큰 배분을 분리하고 사용자 활용도에 맞춰 사용량을 배분한다. 모델 선택지는 REQ-602의 공통 등록 조합을 사용한다"
    roadmap: RM-P1
    acceptance: "같은 사용자 그룹이라도 개인별 쿼터 등급·토큰 한도를 다르게 관리할 수 있으며 모든 이용자에게 같은 유효 모델 조합 목록을 제공한다. 등급 변경·승급으로 모델 선택지는 바뀌지 않는다. 신규 등록·당월/지난 월 잠금·직접 변경 사유·다음 적용 월·일할 배정 규칙은 유지한다"
    summary: "개인별 쿼터 등급은 월 기본 토큰 배분 몫과 적용 월을 정한다. 사용자 그룹·등급·system 역할은 모델 선택지를 제한하지 않는다"
    intent:
      problem: "같은 접근 범위의 사용자라도 Hub 활용도와 필요한 사용량이 달라, 그룹 하나로 권한과 사용량을 함께 묶으면 과소·과다 배정이 생긴다"
      goal: "사용량 배분을 사람 단위로 조정하되, 월중 변경이 이번 달 계산을 흔들지 않게 한다"
      not:
        - "사용자 그룹이 아니다 — 그룹은 업무 자산 접근 통제(REQ-103)이고 등급은 월별 토큰 배분 기준이다"
        - "system 역할이 아니다 — 역할·메뉴 권한(REQ-502)으로 등급을 정하지 않는다"
        - "보조 판정 역할의 모델 선택이 아니다 — 관리자 지정 후보 순서와 일시 장애 대체는 REQ-602를 따른다"
    goal_trace: [IN-06, MET-02]
    decider: "제품 오너(사용자). 고객사별 등급 체계와 값은 도입 시 ACT-004가 정한다"
    preconditions:
      - "Portal 이용자(REQ-616)가 Hub에 등록·활성 상태다 — 관리자 계정 존재와는 별개이며 활성 Portal 이용자 수가 개인 기본 한도의 분모다"
    data:
      - { item: "쿼터 등급 정의(등급명·순위·배분 가중치)", origin: "admin 입력", sensitivity: "일반", retention: "발효 월별 이력 보존" }
      - { item: "사용자별 적용 월별 쿼터 등급(사용자·적용 월·등급·근거: 신규 등록·직접 변경·승급 승인)", origin: "admin 입력·REQ-117 승인", sensitivity: "일반", retention: "당월·지난 월은 수정 불가" }
      - { item: "신규 사용자 일할 배정(등록일·적용 등급·그 달 등급 개인 기본 한도·남은 일수·그 달 일수·배정량)", origin: "Hub 계산", sensitivity: "일반", retention: "수정 불가 이력" }
      - { item: "직접 변경 사유·처리자·처리 시각", origin: "admin 입력", sensitivity: "일반", retention: "수정 불가 이력" }
    business_rules:
      - "REQ-616 사용기간과 이용 상태·유효 그룹/등급을 함께 적용해 배분 자격을 정한다. 대상 월 1일에 사용기간 전/만료인 이용자는 월 배분 대상·가중치 인원에서 제외한다. 월중 시작/재활성으로 자격이 생기면 계정 선등록일이 아니라 해당 효력일부터 기존 일할 규칙으로 한 번만 배정한다. 종료일 포함 만료 뒤 이용은 막되 기존 배정·사용 이력을 소급 재배분하지 않는다"
      - "쿼터 등급 정의는 REQ-606/SCR-064에서 시작월별 전체 세트로 관리한다. 월별 화면에서 매달 정의를 복제/편집하지 않으며 대상 월 이하 최신 시작월 기준 하나를 계속 사용한다"
      - "미래 월금액·환산율/보정·적용 등급 기준·효력 등급 변경은 수동 예정본을 낡음으로 표시한다. 월말 배치는 수동 예정본을 선행 조건으로 요구하지 않고 다음 달 최신 저장/승인 효력 기준으로 최종 산정한다. 신규 등록만으로 현재 월 기존 사용자를 재분배하지 않는다"
      - "월 기준 저장은 단가 고정과 금융 기준 보관이다. 수동 실행은 미래 예정 배분이며 여러 번 교체할 수 있다. 월말 배치의 다음 달 시작 마감이 개인 배정·효력 등급·인원과 실제 적용 기준을 최종 고정하는 경계다"
      - "2026-10-01 사용자 확정: 관리자 시스템 운영용 LLM 호출은 관리자 사용자별 토큰 사용량을 집계하되 쿼터 등급·개인 한도·턴 시작 및 호출 직전 쿼터 제한을 적용하지 않는다. 전체 실제 사용량·비용에는 포함하고 Portal 쿼터 소모와 구분해 기록한다"
      - "동일인이 관리자와 Portal 이용자를 겸해도 Portal 질의에는 기존 쿼터를 적용한다. 관리자 자격만으로 우회할 수 없으며 서버가 인가한 운영 기능 호출만 운영용으로 분류한다. 운영용 모델·effort는 REQ-602의 별도 설정을 사용한다"
      - "신규 사용자 등록 화면의 등급 기본 선택값은 순위가 가장 낮은 등급이다"
      - "신규 사용자 일할 배정 = floor(그 달 해당 등급의 개인 기본 한도 × Hub 이용 등록일(REQ-103)을 포함한 남은 일수 ÷ 그 달의 일수). 등록 즉시 자동으로 주며 신청·승인을 거치지 않는다"
      - "신규 일할 배정은 일반 배정·추가 승인(REQ-119)과 구분해 기록한다. 기존 사용자의 그 달 한도는 다시 계산하지 않는다"
      - "계획 총 풀은 절대 차단선이 아니므로, 신규 일할 배정이 미배정 계획량을 넘어도 지급하고 초과량을 따로 집계한다"
      - "월말 마감에 등록·승인 효력이 있는 다음 달 대상자는 최종 배분에 포함한다. 마감 스냅샷에 없는 신규/재활성 이용자는 기존 개별 일할 규칙으로 추가하며 1일 등록/활성이면 한 달 몫이다. 기존 이용자 전체 한도를 다시 나누지 않는다"
      - "그 달 배정 기록이 없는 사용자는 재활성화·재입사도 신규 일할 배정 대상이다. 그 달 배정 기록이 있으면 기존 배정을 그대로 둔다"
      - "등록 때 부여한 등급은 그 사용자의 첫 사용 기록이 생기기 전까지만 정정할 수 있고, 정정하면 신규 일할 배정을 새 등급으로 다시 계산한다. 첫 사용 뒤에는 당월 잠금을 따른다"
      - "개인 기본 한도 = floor(월 총 토큰 풀 × 본인 등급의 배분 가중치 ÷ Σ(등급별 배분 가중치 × 그 등급 활성 사용자 수)). 인원 분포와 관계없이 사람 사이의 한도 비율이 가중치 비율과 같다"
      - "배분 가중치는 등급 정의에 두며 사람마다 따로 주지 않는다. 0보다 큰 수이고 소수점 둘째 자리까지 쓴다"
      - "순위가 높은 등급의 배분 가중치는 낮은 등급 이상이어야 한다. 어기면 월 배정을 확정할 수 없다"
      - "개인별 버림으로 남은 토큰은 미배정 계획량으로 둔다"
      - "모델의 등록·지원/활성 상태와 선택 목록 복구는 REQ-602가 소유한다. 모델 변경으로 당월 배정이나 등급을 바꾸지 않으며 등급 변경·승급으로 모델을 허용/차단하지 않는다"
    empty_population:
      monthly_plan: "활성 Portal 이용자가 0명이면 월 금융 기준·M월 등급 기준은 최종 준비할 수 있지만 개인 배분 기준은 미산정으로 남긴다. 가중치 합 0으로 나누거나 임의의 분모·0 한도를 확정값으로 만들지 않는다. 개인 배분 기준의 미산정은 월말 최종 배분 준비 상태와 구분한다"
      first_allocation: "대상 월의 배분 기준이 미산정이면 적용 월 시작 시 활성 이용자가 있을 때, 또는 그달 최초 등록·재활성화로 활성 이용자가 생길 때 해당 월 총 풀과 고정 가중치·그 시점의 활성 인원으로 배분 기준을 한 번 산정한다. 이 최초 배정의 일할 시작일은 해당 월의 등록·재활성화 유효일이며, 월 시작 시 이미 활성인 이용자는 1일로 한다. 과거 최초 가입일을 사용해 비활성 기간까지 소급 배정하지 않는다. 최초 활성화와 기준 산정·해당 이용자 배정은 일관되게 반영하며 동시 등록·재처리에도 월별 기준과 개인 배정을 중복 생성하지 않는다"
      later_allocation: "최초 기준에는 산정 시각·활성 인원/가중치 합·등급별 기본 한도와 근거를 남긴다. 이후 등록자는 이 기준으로 남은 일수를 일할 배정하고 기존 사용자의 한도와 분모는 다시 계산하지 않는다. 이후 다시 전원이 비활성화돼도 이미 산정한 기준을 미산정으로 되돌리지 않는다"
      boundary: "확정된 월 계획 자체가 없으면 기존 첫 확정 전 시작 차단을 유지한다. 기준 산정 실패 시 미산정 상태로 남기고 개인 한도가 없는 실행을 허용하지 않으며 재처리도 같은 월 기준으로 수렴한다. 이 처리는 월 총 풀·단가·가중치의 월중 재확정이나 기존 배정 수정이 아니다"
    exceptions:
      - "공정 단계의 예외는 PRC-12-01이 갖는다"
      - "당월·지난 적용 월의 등급 변경·삭제 요청은 거부하고, 다음 적용 가능한 달을 안내한다"
      - "등급 폐지·통합은 그 변경 기준의 시작월 S부터만 효력을 갖는다. S 이전 월은 유지하고 이후 효력 예약/후속 기준의 대응을 검증한다. 소속 사용자를 옮길 등급을 지정하기 전에는 그 달 배정을 확정할 수 없다"
    lifecycle:
      - { state: 예정, next: [적용중], note: "다음 달 이후 적용 월 — 대상 월 시작 전까지 변경 가능. 월말 마감에 최종 반영" }
      - { state: 적용중, next: [종료], note: "당월 — 바꾸거나 지울 수 없다" }
      - { state: 종료, next: [], note: "지난 달 — 바꾸거나 지울 수 없다" }
    permissions:
      - "등급 정의와 사용자별 등급 직접 변경: ACT-004"
      - "본인 등급과 토큰 한도 조회: ACT-001(본인만)"
    audit: "등급 정의 변경, 신규 등록 시 등급 부여, 사용자별 직접 변경, 신규 일할 배정은 근거·처리자·처리 시각·적용 월을 수정 불가 이력으로 남긴다"
    volume: "사용자 수와 등급 수는 고객사마다 다르며 아직 확인한 값이 없다"
    config:
      - "등급 목록·순위·배분 가중치는 admin 데이터로 배포 없이 바꾼다(PRN-06). 적용은 다음 적용 가능한 월부터다(TRM-154)"
    risk: "해당 없음 — 기술적으로 새로 검증할 구성요소가 없다"
    relations:
      depends_on: [REQ-103, REQ-616]
      constrains: ["REQ-006","REQ-117","REQ-118","REQ-119","REQ-602"]
      conflicts_with: []
      nfr: [NFR-011]
      interfaces: []
    realization:
      features: [FEAT-005, FEAT-015, FEAT-017, FEAT-101, FEAT-209, FEAT-211, FEAT-042, FEAT-043, FEAT-044, FEAT-045]
      screens: [SCR-005, SCR-062, SCR-021, SCR-101, SCR-064, SCR-066, SCR-067]
    examples:
      - { kind: 정상, case: "관리자 김관리의 운영 프롬프트 검토가 2,000토큰을 사용하면 김관리의 운영 사용량과 전체 비용에는 집계하되 Portal 개인 쿼터에서 차감하지 않는다" }
      - { kind: 예외, case: "같은 김관리가 Portal에서 개인 쿼터를 소진한 뒤 새 질의를 보내면 관리자 권한이 있어도 기존 시작 전 쿼터 검사로 차단한다" }
      - { kind: 정상, case: "관리자가 9/10에 김대리를 B→A로 직접 변경하고 사유를 남긴다. 10월 배정이 아직 확정 전이라 10/1부터 A가 적용되고, 9월 한도는 B 그대로이고 모델 선택지는 등급과 무관하게 같다" }
