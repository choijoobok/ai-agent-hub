# 영역: Portal 반응형 웹
requirements:
  - id: REQ-041
    type: functional
    priority: must
    category: "Portal 이용 환경"
    workstream: portal
    actors: [ACT-001]
    process_step: PRC-02-01
    roadmap: RM-P1
    title: "Portal의 PC·모바일 반응형 웹 지원"
    summary: "현업 담당자는 PC와 모바일 브라우저에서 같은 Portal 업무를 수행할 수 있어야 한다. 화면 폭·방향·입력 방식에 맞게 배치하되 메뉴·기능·업무 상태와 통제의 의미는 같아야 한다"
    detail: >-
      제품 Portal은 PC·모바일 반응형 웹으로 제공한다. 각 출시 차수에 포함된 제품 Portal의
      모든 사용자 기능과 그 기능을 이용하는 로그인·재인증·메뉴 이동·공통 화면을 지원한다.
      채팅 입력·이력·진행 상태·결과 표/차트·추가 입력·승인·개인 관리 기능을 모바일이라는
      이유로 생략하거나 단순 조회 전용으로 축소하지 않는다. 후속 차수 기능은 해당 차수에
      포함될 때 같은 기준을 적용하며 이번 변경으로 출시 시기를 앞당기지 않는다.
    source: "2026-10-28 사용자: portal의 반응형 모바일 웹을 추가하는 요건으로 변경 요청"
    why: "PC 전용이라는 기존 제외 범위를 바꾸고 모바일 이용을 설계·검증의 공통 조건으로 추적하기 위함이다"
    intent:
      problem: "PC 전용 범위에서는 모바일 사용자가 채팅·조회·승인과 개인 업무를 완료할 수 있음을 보장하지 않는다"
      goal: "같은 Portal 기능을 PC와 모바일에서 화면 크기와 입력 방식에 맞게 이용한다"
      not: "네이티브 앱·앱스토어 배포·오프라인 업무 실행·모바일 푸시 알림의 추가 요구가 아니다. admin/system 관리 화면 및 integration 계약 시험 화면의 모바일 지원으로 범위를 확대하지 않는다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "CON-015의 고객사 허용 단말·접속 경로에서 보호된 Portal 업무는 유효한 인증 후 접근한다. 로그인·재인증 진입은 기존 공개/만료 세션 계약을 따른다. 모바일 지원 자체로 인터넷 공개나 접근 정책 완화를 허용하지 않는다"
      - "해당 차수·사용자에게 허용된 기존 Portal 기능과 서버 계약을 사용한다"
    business_rules:
      identity: "PC·모바일은 동일 메뉴·기능·화면 ID의 반응형 표현이다. 모바일용 기능/API/화면을 일괄 복제하지 않는다. 독립된 공통 화면 계약이 필요한 경우에만 기존 화면 분리 규칙을 적용한다"
      shared_entry: "Portal 진입의 SCR-113 로그인·SCR-114 자체 비밀번호 변경·SCR-115 세션 만료 안내는 별도 Portal 인증 영역의 공통 화면이다. system 관리자 로그인/비밀번호/세션 화면을 재사용하지 않는다. Portal/integration P3에서 SSO/대상 계정/자체 모드·PC/모바일·안전한 재인증 복귀를 요건/목업과 공개 계약으로 설계하며 현재 구현 완료로 세지 않는다"
      layout: "메뉴·탭·모달·승인 상세와 입력 영역은 작은 화면에서도 열기·읽기·입력·제출·닫기가 가능해야 한다. 필수 조작·오류·권한/비활성 사유·경고를 화면 밖에 잘라 두거나 마우스 올리기만으로 제공하지 않는다"
      input: "터치·키보드를 지원하며 가상 키보드가 열린 상태에서도 입력 내용·유효성 오류·전송/승인 조작에 접근할 수 있어야 한다. 같은 페이지에서 화면 회전·폭 변경·키보드 열기/닫기만으로 작성 중 입력을 잃거나 자동 제출하지 않는다. 페이지 종료 뒤 미제출 초안 영속 보관은 이번 요구가 아니다"
      results: "표/차트는 필드별 상세 보기·영역 내부 스크롤 등 화면에 맞는 표현을 사용하되 REQ-011·027의 원값·타입·단위·부분 범위·경고·마스킹과 NFR-001~003의 페이징 의미를 보존한다. 모바일 표시를 위해 데이터 통제를 우회하거나 전체 결과를 자동 수집하지 않는다"
      approval: "REQ-005·017·026·032의 승인 대상·전체 실제 값·기한·질문/보류·거절과 현재 유효 조작을 모바일에서도 확인·수행한다. 화면 축소로 필수 확인을 생략하거나 승인 의미·기한을 바꾸지 않는다"
      lifecycle: "앱 전환·화면 잠금·네트워크 단절 뒤 복귀는 REQ-006·016·040의 서버 처리 지속·현재 상태 조회·인증/권한 재확인 규칙을 따른다. 화면 복귀·회전·통신 재개만으로 새 요청·승인·재시도·중복 실행을 만들지 않는다. 백그라운드 폴링 지속이나 실시간 알림 도착을 보장하는 요구는 아니다"
      download: "REQ-011·NGOAL-10의 클라이언트 내보내기·선행 통제/감사를 모바일에도 적용한다. 지원 브라우저에서 파일 저장/열기 흐름을 검증하며 실패·취소·확인 불가를 성공으로 표시하지 않는다. 플랫폼 제약이 확인되면 Portal 설계에서 대체 조작 또는 지원 범위의 명시적 판정을 받고, 모바일 기능을 조용히 제외하거나 서버 파일 생성으로 바꾸지 않는다"
    permissions: "기존 인증·현재 권한·소유권·마스킹·실행 승인 규칙을 참조한다. 단말 종류만으로 권한을 부여하지 않는다"
    data: "기존 Portal 기능의 데이터와 보존 정책을 사용한다. 모바일 전용 데이터 사본이나 영속 오프라인 저장소는 추가하지 않는다"
    exceptions: "통신 불가·인증 만료·권한 회수·승인 만료는 원래 기능의 예외로 처리한다. 마지막 확인 상태와 조회 실패를 구분하고 오래된 카드/캐시로 유효 조작을 허용하지 않는다"
    lifecycle: "별도 업무 상태 없음 — 화면 크기·방향·입력 방식은 기존 턴·승인·개인 업무의 상태를 변경하지 않는다"
    audit: "업무 실행·승인·내보내기의 기존 감사 계약을 유지한다. 반응형 배치 변경 자체는 업무 실행 이력이 아니다"
    volume: "기존 조회 상한·페이징·개인 한도를 유지한다. 모바일 지원으로 별도 실행 용량이나 성능 수치를 약속하지 않는다"
    config: "화면 전환 폭과 지원 환경은 NFR-028의 검증 행렬로 설계한다. 고객사 단말·네트워크 허용은 CON-015가 소유한다"
    risk: "모바일 브라우저의 가상 키보드·다운로드·백그라운드 제한과 데이터 집약 화면의 조작성은 Portal P3에서 검증하고 지원 범위를 확정한다"
    acceptance: "해당 차수의 제품 Portal 기능을 NFR-028에서 확정한 PC·모바일 환경에서 완료할 수 있다. 크기/방향 전환으로 기능·필수 정보·입력을 잃지 않고, 재접속·승인·내보내기에서 기존 서버 통제를 유지한다"
    relations:
      depends_on: []
      constrains: []
      conflicts_with: []
      nfr: [NFR-028]
      interfaces: []
    realization:
      features: [FEAT-101, FEAT-102, FEAT-103, FEAT-104, FEAT-105, FEAT-106, FEAT-107, FEAT-108, FEAT-109, FEAT-111, FEAT-112, FEAT-113, FEAT-114, FEAT-115, FEAT-116, FEAT-117, FEAT-118, FEAT-119, FEAT-120, FEAT-121, FEAT-122, FEAT-123, FEAT-124, FEAT-125, FEAT-127, FEAT-301, FEAT-128]
      screens: [SCR-101, SCR-102, SCR-103, SCR-104, SCR-105, SCR-106, SCR-107, SCR-108, SCR-109, SCR-110, SCR-111, SCR-113, SCR-114, SCR-115]
    examples:
      - kind: 정상
        given: "휴대전화에서 수량 12·단가 3500인 실행 요청의 승인을 기다린다"
        when: "승인 상세를 열어 전체 실제 값을 확인하고 명시적으로 승인한다"
        then: "PC와 같은 대상·값·기한을 확인할 수 있고 같은 서버 유효성 검사 후 한 번만 접수된다"
      - kind: 예외
        given: "모바일 브라우저를 떠난 동안 승인 요청이 만료됐다"
        when: "복귀해 이전 승인 카드를 연다"
        then: "현재 서버 상태로 만료를 표시하며 화면 복귀나 오래된 카드 클릭으로 승인·재실행·기한 연장이 발생하지 않는다"
    verification:
      - "지원 환경별 해당 차수 전체 메뉴·공통 화면·필수 조작을 완료하고 PC와 모바일에서 권한·입력값·결과 의미를 대조한다"
      - "최소 지원 폭·넓은 화면·전환 경계 전후·가로/세로에서 키보드 열기/닫기·회전·긴 내용·오류·모달·탭을 검사한다. 정보가 잘리거나 조작에 접근할 수 없으면 실패다"
      - "긴 표·차트·부분 결과를 표시해 허용 필드 상세와 페이징·정렬 범위·경고가 유지되는지 확인한다. 전체 자동 재조회나 마스킹 우회는 실패다"
      - "백그라운드 복귀·재인증·통신 실패·중복 터치·승인 만료에서 새 실행/승인 중복과 오래된 조작 허용이 없는지 원 기능의 서버 이력과 대조한다"
      - "모바일 내보내기 성공·실패·취소/미확인과 감사 기록을 확인한다. 실제 저장 확인 불가를 성공으로 표시하면 실패다"
    volatility:
      level: high
      what: "고객사의 허용 단말·접속 경로와 브라우저 버전은 달라질 수 있다. 반응형 지원 방향은 고정하고 구체 지원 환경·검증 행렬은 관리한다"
    open:
      - "@defer P3 Portal의 최소/최대 지원 폭·화면 전환 경계·PC 및 Android/iOS 브라우저/버전과 실제 단말 검증 행렬을 확정한다. 사용자 요청으로 확정된 것은 PC·모바일 반응형 웹 지원 범위이며 특정 수치·버전은 아직 확정하지 않았다"
      - "@defer P3 CR-028·ARCH-050에 따른 별도 Portal 인증 화면 SCR-113~115와 PC·모바일·딥링크의 반응형 배치·터치/키보드·재인증/복구·안전한 복귀를 설계한다. system 관리자 인증/세션·계정 원장을 재사용하지 않는다"
      - "@defer P3 기존 기능과 같은 ID를 참조하는 유즈케이스·화면 테스트 케이스에 PC/모바일 정상·예외 조건을 연결한다. P4/P5 실제 브라우저·단말 시험과 매뉴얼의 조작/캡처로 검증한다"
    maturity:
