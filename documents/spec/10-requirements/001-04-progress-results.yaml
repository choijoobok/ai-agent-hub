  - id: REQ-011
    type: functional
    priority: must
    category: "응답·표현"
    actors: [ACT-001]
    process_step: PRC-02-05
    title: "결과 표현·필드 타입·사용자 포맷과 감사 가능한 내보내기"
    detail: "목록형 조회 결과는 그리드, 특정 값·상황 설명·브리핑은 텍스트를 기본으로 표시하고 사용자가 요청하면 차트를 제공한다. 목록이 한 페이지 상한을 넘으면 페이징이 필요함을 알리고 portal이 다음 페이지 요청 또는 페이징 지원 그리드로 처리한다. 그리드는 엑셀, 차트는 이미지 다운로드를 지원하되 원천의 반출 허용·현재 접근 권한·행 수 상한과 필수 감사 기록을 적용한다. 필드별 자료형과 표시 정보를 전달해 시스템 기본 숫자/날짜 형식과 사용자 그리드 옵션을 적용한다"
    hard_rule: "엑셀·이미지 파일 생성은 portal의 클라이언트 컴포넌트가 담당하고 서버는 파일을 생성하지 않는다. 서버는 결과/타입·현재 반출 정책·한도·감사 기록을 담당한다. REQ-009·027에 따라 공통 의미 블록과 데이터를 전달하고 특정 그리드/차트 라이브러리 전용 옵션은 portal 어댑터에서 변환한다. 모델이 형식·반출 허용·타입을 주장했다는 이유만으로 서버 검증을 생략하지 않는다"
    source: "2026-10-13 결과 표현·타입/포맷·반출 정책·엑셀 상한·감사를 포함한 전체 보완본을 명시 확정했다. 2026-10-26 사용자 요청으로 조회 상한 초과 안내와 portal의 후속 페이지 요청/페이징 그리드 책임을 추가한다. 이번 방향 결정에 따른 보완본 전체 재확정과 상세 화면/구현 승인은 별도다"
    why: "업무 결과의 성격에 맞게 읽고 가공하도록 하면서 타입·표시 형식·다운로드 범위가 달라져 값이나 의미가 손상되는 것을 막고 공식 내보내기의 근거를 추적한다"
    summary: "그리드·텍스트·요청 차트에 타입과 표시 계약을 적용한다. 페이지 상한 초과 시 portal이 안내·후속 페이지 조작을 맡고 반출 정책·상한·감사를 거쳐 클라이언트 파일을 생성한다"
    intent:
      problem: "동적 결과의 자료형·표시·반출 근거가 불명확하면 숫자/날짜가 문자열로 오인되고 파일에 무엇이 나갔는지 추적하기 어렵다"
      goal: "표현과 원래 값의 의미를 유지하며 사용자가 형식을 조정하고 허용된 결과를 감사 가능한 방식으로 내려받게 한다"
    goal_trace: [GOAL-1, GOAL-2, INV-01]
    decider: "제품 오너(사용자)"
    preconditions:
      - "조회·가공 결과는 기존 접근/행 스코프/마스킹 통제를 통과한다. 모델로의 실제 데이터 전송은 REQ-039·106의 사용자 요청·동의로 별도 판정한다"
      - "필드 의미·자료형의 근거는 검증된 실제 결과와 등록 카탈로그/API 계약에서 얻고 반출 판정은 현재 사용자와 원천 정책을 사용한다"
    presentation:
      selection: "목록 결과는 그리드, 특정 값·상황 설명·브리핑은 텍스트를 기본으로 한다. 단일 행이어도 사용자가 목록을 요구하면 목록 의미를 유지하며 단순 건수만으로 형식을 바꾸지 않는다. 차트는 사용자 요청 시 제공하고 요청 없이 차트를 기본 추가하지 않는다. 복합 요청의 각 결과는 필요한 의미 블록으로 구분한다"
      text: "정확한 특정 값은 서버가 검증한 결과와 단위로 표시하고 설명/브리핑의 데이터 범위와 기준을 구분한다. 실제 업무 데이터를 모델이 해석해야 하면 REQ-039·106의 사용자 요청·동의 범위와 마스킹·상한을 적용한다. 텍스트라는 표현 선택만으로 원 결과 전체를 모델에 보내지 않는다"
      chart: "차트 계열·축·집계는 허용된 조회 결과의 결정적 가공으로 구성하고 REQ-039를 따른다. 차트 요청 자체는 원 결과의 LLM 전송 허가가 아니다. 차트 종류별 구체 계약·지원 범위는 P3에서 선택 컴포넌트와 함께 정한다"
      empty_partial: "조회 0건·조회 실패·일부 결과·전체 결과를 구분하고 제한/부분 범위를 전체처럼 표시하거나 내려받지 않는다. 복합 처리의 실패/계속 여부는 REQ-038을 유지하며 표시 편의로 실행 정책을 바꾸지 않는다"
      paging: "NFR-002·003의 페이지 상한 초과/다음 페이지 정보를 받으면 한 번에 표시할 수 있는 범위를 넘어 페이징 조회가 필요함을 사용자에게 알린다. portal이 다음 페이지 조회 조작 또는 페이징 지원 그리드 등으로 제공하며 agent가 특정 UI·컴포넌트를 결정하지 않는다. 이미 받은 데이터의 화면 내 페이지 이동과 원천 후속 조회가 필요한 조작을 구분한다"
    response_contract:
      owner: "REQ-009의 소스 응답 타입/버전 계약과 REQ-027의 의미 블록을 사용한다. portal은 선택 컴포넌트가 요구하는 컬럼·행·차트 설정으로 변환한다. 구체 JSON 필드·라이브러리 옵션·변환기는 상세 설계/구현에서 정하고 운영 프롬프트에 별도 형식을 중복 정의하지 않는다"
      columns: "결과 필드마다 안정된 결과 내 식별자·사용자용 제목·논리 자료형·값과 필요한 단위/정밀도/날짜 종류·표시 힌트를 연결한다. 원본 DB 물리명·내부 프롬프트·권한 밖 메타데이터를 응답에 노출하지 않는다. 코드값/코드명 관계와 가공된 값의 실제 타입을 구분할 수 있어야 한다"
      typing: "문자·숫자·불리언·날짜/일시 등 값의 의미를 실제 결과 메타데이터·등록 계약과 대조한다. 식별자의 앞자리 0, 큰 정수·소수 정밀도, 날짜와 일시/시간대, null·빈 값·0을 보존하고 전송 자료형과 논리 자료형을 구분한다. 집계/파생 필드와 모든 값이 null인 열도 명시 타입 근거를 갖고 모델이나 첫 행의 문자열 모양만으로 임의 확정하지 않는다"
      result_identity: "턴·시도와 결과 블록/버전, 원 조회·가공 범위와 서버 측 원천/정책 참조를 연결해 화면·엑셀·차트와 감사 기록이 어떤 결과를 사용했는지 알 수 있게 한다. 사용자에게는 필요한 허용 참조만 제공하며 재조회로 데이터가 달라지면 이전 결과와 같은 것으로 기록하지 않는다"
      paging: "페이지 데이터·초과/다음 페이지 존재·조회 가능/만료/실패·이어가기 참조와 조회 기준의 의미는 NFR-002가 정본이다. portal은 서버 계약을 선택 UI에 맞게 변환하되 미상인 전체 건수/총 페이지 수를 임의 계산하지 않고 조회된 범위와 더 조회할 수 있음을 구분한다"
    paging_interaction:
      request: "사용자의 다음 페이지 선택이나 그리드 탐색을 후속 페이지 요청으로 전달하고 로딩·조회 완료·마지막 페이지·실패·만료를 구분한다. 매 페이지 새 자연어 질의를 입력하거나 같은 계획을 다시 확인하도록 강제하지 않으며 화면 복원만으로 미조회 페이지를 실행하지 않는다"
      current_view: "요청 대상 결과·페이지와 현재 화면을 연결해 중복 클릭/재전송·늦은 응답이 페이지를 중복 추가하거나 다른 결과를 덮지 않게 한다. 실패하면 현재 유효한 표시 범위를 유지하고 해당 페이지 재요청 또는 새 조회가 필요한 사유를 알린다. 권한 회수·보존/이어가기 만료의 표시·조작은 현재 서버 판정을 따른다"
      sorting_filtering: "현재 받은 페이지에만 적용한 정렬/필터/합계는 그 범위를 명시한다. 전체 결과 대상 정렬/필터를 제공하면 NFR-002의 검증된 새 조회 범위·첫 페이지부터 시작하고 이전 페이지를 섞지 않는다. 원천 조회 없이 현재 페이지를 정렬한 것을 전체 정렬로 표시하지 않는다"
      export_and_analysis: "페이징 허용은 모델 전송·전체 집계/차트·후속 액션·전체 엑셀의 허용을 뜻하지 않는다. 현재 페이지/수신 범위/전체를 구분하고 해당 목적의 완전성·동의·권한·반출/행 상한을 적용한다. 전체 요청 없이 백그라운드에서 모든 페이지를 수집하거나 페이지별로 나눠 기존 상한을 우회하지 않는다"
      ownership: "agent는 원천 후속 조회·서버 검증·공통 결과/안내 계약을 맡고 portal은 사용자 안내·페이지 요청·화면과 그리드 선택을 맡는다. 버튼 위치·페이지 번호/더 보기·누적/교체 표시·구체 그리드 기능은 P3 화면 요건/목업에서 정하며 이번 요구사항 보완만으로 화면 구현을 시작하지 않는다"
    formatting:
      defaults: "시스템이 숫자와 날짜의 기본 표시 형식을 정하고 사용자는 그리드 옵션에서 필드 타입에 맞는 숫자/날짜 포맷을 변경할 수 있다. 숫자의 소수 자릿수·구분자, 날짜 표기 등 허용 옵션·저장 범위·기본값 복원과 명시 자연어 형식 요청의 우선순위는 P3에서 정한다"
      semantics: "표시 설정만 바꿀 때 원래 값과 논리 자료형을 유지하고 숫자 정렬·필터·집계와 차트 계산에 표시 문자열을 잘못 사용하지 않는다. 금액 정밀도·날짜/시간대 의미·식별자 앞자리 0을 손실시키지 않으며 임의 실행 코드 형태의 포매터를 모델 응답에서 실행하지 않는다"
      code_names: "코드성 값은 검수된 공통코드/업무 코드 관계를 사용해 조인 또는 허용된 매핑으로 코드명을 제공한다. API 응답의 코드명 제공 방법·명시적 참조·현재 권한·실패 처리와 원 업무 상태 보존은 REQ-608.field_value_mapping을 따른다. 코드값·표시명·그룹/관계가 혼동되지 않게 하고 미등록 코드를 임의 이름으로 번역하지 않는다. 원천 DB와 Hub 코드 저장소가 다르면 직접 SQL 조인을 가정하지 않고 허용 조회/매핑 방식을 설계한다. 표시를 위한 콤보/라벨은 업무 값 수정·저장 기능을 새로 요구하지 않는다"
      sql_formatting: "사용자가 자연어로 날짜/숫자 형식을 요청하면 허용된 SQL 함수 등으로 형식화할 수 있으나 REQ-037의 SQL 검증과 REQ-009의 값 의미 규칙을 따른다. SQL이 문자열로 반환한 값은 실제 문자열 타입과 형식화 사실로 전달하고 숫자/날짜 원본인 것처럼 다시 계산하지 않는다. 원래 자료형을 유지하는 portal 표시 형식 적용도 가능하며 구체적인 선택 기준은 P3에서 정한다"
      excel: "표시용 숫자/날짜 포맷과 엑셀 셀 타입·표시 형식, 코드값/코드명 출력 범위를 일치시키거나 차이를 명시한다. 기본적으로 타입을 유지하고 셀 서식을 적용하되 정밀도/문자 식별자 보존 등 예외와 문자열 수식 오인 방지는 상세 설계·시험으로 확인한다"
    export_policy:
      source: "스키마 카탈로그(REQ-301)와 조회용 API 계약(REQ-608)에서 반출 허용 여부를 관리하고 변경자·시각·적용 정책 근거를 남긴다. 열람 허용과 공식 내보내기 허용을 구분한다. 객체/컬럼·API/응답 경로의 적용 단위·상속·초깃값·승인/직접 정책 경계는 기존 REQ-103·601과 맞춰 P3에서 정하며 미설정 값을 임의 허용으로 간주하지 않는다"
      enforcement: "portal의 공식 엑셀/차트 이미지 동작은 서버가 판정한 현재 사용자·결과·반출 정책에 따라 허용하고 조작 직전에 다시 확인한다. 화면에 예전에 표시한 허용값이나 모델이 만든 허용 플래그로 검사를 대신하지 않는다. 권한·행 스코프·마스킹으로 제한된 값이나 숨긴 내부 필드를 파일용 데이터에 추가하지 않는다"
      derived: "조인·복수 API·집계·차트 등 파생 결과도 원천 정책과 연결하고, 한 원천이 허용됐다는 이유로 다른 제한 원천까지 허용하지 않는다. 차트 이미지로 바꿔 같은 데이터의 반출 제한을 우회하지 않는다. 혼합 결과의 합성 규칙과 허용 부분만의 별도 내보내기는 P3에서 설계하며 판정할 수 없는 요청은 다운로드를 시작하지 않는다"
      boundary: "공식 다운로드 동작과 이력의 통제 범위다. 브라우저에 이미 열람 제공한 데이터의 수동 복사·화면 캡처·임의 로컬 저장까지 차단하거나 전부 감사한다고 보장하지 않는다. 원문 제공 전 통제는 기존 조회 권한/마스킹이 담당한다"
    export_limits:
      rule: "엑셀은 적용된 행 수 상한을 지킨다. 현재 공통 설정 ui.excel.max-rows를 적용 기준으로 사용하고 agent/portal 전용 중복 상한을 임의로 만들지 않는다. 현재 공통 설정 기본값은 50,000행이며 실제 적용값과 대상 범위는 운영 설정 및 P3 계약으로 확인한다"
      overflow: "대상 범위가 상한을 넘으면 파일 생성 전에 거부하고 조건 축소/집계 등을 안내한다. 조용히 잘라 전체 파일처럼 제공하거나 여러 파일로 자동 분할해 제한을 우회하지 않는다. 대상 건수를 미리 모르면 수집 중 상한 초과를 발견해 중단하고 일부 파일을 전체로 저장하지 않는다"
      scope: "현재 페이지·전체·필터/정렬/선택 열 등 제공할 내보내기 범위를 상세 설계에서 정하고 실제 범위·건수·필드를 사용자와 감사 이력에서 구분한다. 전체 결과를 새로 수집해야 하면 기존 조회 통제와 반출 정책·상한을 서버에서 적용하고 조회/다운로드 대상의 일관성을 정한다. 행 상한은 LLM 전송 행 수 상한(REQ-106)과 별개다"
      evidence: "2026-10-13 현재 공통 구현은 UiExcelProps·application.yml·DataGrid/useGridController에 상한이 있다. API 전체 조회는 상한을 검사하지만 API 없는 인메모리 그리드는 기존 fetchAll에서 행을 바로 반환하므로 portal의 모든 공식 엑셀 경로 적용은 P3/P4에서 검증한다. 기존 구현 존재만으로 신규 portal 적용 완료라 간주하지 않는다"
    export_audit:
      required: "엑셀과 차트 이미지의 공식 내보내기 요청·허용/거부·시도 결과를 필수 저장하고 사용자·대화·턴/시도·결과 블록/버전과 연결한다. 상세 감사 계약은 REQ-107·108·109의 저장/보존 원칙을 따르며 파일 자체나 결과 원문을 추가 복제하도록 요구하지 않는다"
      fields: "서버가 확인한 사용자·요청/판정 시각·내보내기 식별자·결과/원 조회 참조·파일 종류·요청 범위·필드/행 수 또는 차트 계열/집계 범위·적용 정책/한도·허용/거부 사유·표시/가공 형식 근거와 클라이언트 보고 결과를 연결한다. 서버 검증 사실과 클라이언트 주장, 건수 확정 전/후를 구분하고 원 SQL·민감 값·로컬 저장 경로를 화면/로그에 무분별하게 복제하지 않는다"
      sequence: "공식 경로는 현재 정책/한도 판정과 내보내기 시도에 필요한 감사 기록이 서버에 저장된 뒤 클라이언트 파일 생성/다운로드를 시작한다. 선행 필수 기록 실패 시 다운로드를 시작하지 않고 재시도 안내를 제공한다. 파일은 계속 portal이 생성하며 이 사전 요청은 사용자에게 추가 승인을 받는 절차가 아니다"
      completion: "클라이언트의 생성·브라우저 다운로드 개시·실패/취소 보고를 같은 내보내기 식별자에 연결하고 중복 전송은 중복 사건으로 세지 않는다. 브라우저 종료/통신 실패로 후속 보고가 없으면 결과 미확인으로 남기고 성공으로 추정하지 않는다. 브라우저 개시나 보고를 사용자 디스크 저장/열람 완료의 서버 검증 사실로 표현하지 않는다"
      current_gap: "현재 공통 grid/excel의 recordDownload는 파일 생성 뒤 비동기 보고하고 기록 실패를 무시하는 운영 이력이다. portal의 필수 감사 충족을 위해 사전 기록·후속 결과·재전송/미확인과 차트 이미지 경로를 P3에서 설계하고 기존 공통 함수 재사용 가능 범위를 검증한다. 현재 system 구현을 이 요구사항 확정만으로 변경하지 않는다"
    business_rules:
      - "서버는 허용된 결과·타입·정책과 감사 계약을 제공하고 portal이 표현/파일 생성을 담당한다. 컴포넌트 선택 때문에 agent 업무 처리·권한·LLM 전송 계약을 바꾸지 않는다"
      - "사용자 포맷 변경과 내보내기는 기본적으로 새 LLM 호출이 필요하지 않다. 새로운 집계/조회나 의미 해석이 필요한 요청만 기존 실행·보안·감사 규칙으로 처리한다"
      - "LLM 전송 상한 초과 시 엑셀을 안내하더라도 반출 허용과 엑셀 행 수 상한을 함께 확인한다. 엑셀 불가이면 조건 축소·허용 집계 등 가능한 방법을 안내하고 내보내기를 우회 경로로 삼지 않는다"
    data:
      - { item: "의미 블록·필드 타입/제목/단위·원 값/표시 힌트·코드명 관계·결과 범위", origin: "검증된 실제 조회 결과·카탈로그/API 계약과 가공", sensitivity: "기존 공개 필드·마스킹·전송 규칙", retention: "REQ-107·109 기존 결과 보존 정책" }
      - { item: "원천별 반출 정책과 현재 판정·내보내기 요청/결과 메타데이터", origin: "관리 정책·서버 검증·클라이언트 보고", sensitivity: "서버 근거와 클라이언트 보고 구분·민감 값 제외", retention: "기존 감사 보존·조사 보호 정책" }
    exceptions:
      - "표현할 결과가 없거나 차트 구성이 불가능하면 이유와 가능한 표현을 안내하고 데이터/계열을 만들지 않는다"
      - "반출 불가·현재 권한 회수·상한 초과·필수 감사 기록 실패는 다운로드 시작 전에 구분해 안내한다. 후속 보고 유실은 결과 미확인으로 관리한다"
    lifecycle:
      - { state: "허용 결과 수신", next: ["텍스트/그리드/요청 차트 표시", "형식/결과 오류 안내"], note: "결과 타입·범위를 검증한다" }
      - { state: "공식 내보내기 요청", next: ["현재 정책/한도 판정·감사 기록", "거부 안내"], note: "파일 생성은 portal에서 한다" }
