  - id: REQ-019
    type: functional
    priority: must
    category: "세션 독립·재연결"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "대화 메시지 시간순 표시·역방향 페이징과 관련 위치 이동"
    detail: "대화 본문은 사용자 입력과 응답 블록의 서버 기록 순서로 표시한다. 재진입 시 최신 메시지 묶음을 우선 조회하고 위로 스크롤하면 이전 메시지를 묶음 조회한다. 중단 재시도는 새 턴/입력/응답을 아래에 추가하고 원본·재시도 또는 확인된 관련 메시지를 양방향 링크로 연결한다. 메시지 순서와 읽던 위치를 유지하며 현재 페이지 밖 링크 이동·신규 메시지·내용 갱신·중복/지연 응답에도 누락/중복이 없게 한다"
    hard_rule: "과거 대화 조회는 저장된 턴의 읽기이며 새 LLM/도구 실행·승인·재시도·카드 만료 연장을 만들지 않는다. 턴의 상태 갱신/완료 시각으로 대화 순서를 바꾸지 않고, 과거 카드가 보인다는 이유로 조작을 활성화하지 않는다. 현재 권한과 보존/삭제 정책을 서버에서 적용한다"
    source: "2026-10-13 사용자 요청으로 기존 마지막 턴 우선·역방향 페이징에 턴 단위·안정된 순서·읽던 위치 유지·중복/누락 방지·오류/빈 대화/조회 끝·이전 미종결 이동·보존/권한·검증 기준을 보완했다. REQ-006의 턴 내부 이력과 REQ-040의 화면 복원/유효 조작에 연결했다. 같은 날 사용자 명시 승인으로 전체 보완본을 확정했으며 상세 설계·실행 검증은 후속이다 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다."
    why: "오래된 대화를 모두 읽어 오지 않고 필요한 과거 내용에 접근하게 하며, 추가 로딩으로 읽던 위치가 튀거나 상태 갱신 때문에 순서가 바뀌는 혼란을 막는다"
    summary: "입력/출력을 메시지 기록 순서로 표시하고 과거 메시지를 역방향으로 조회한다. 원본·재시도/관련 메시지는 양방향 위치 이동으로 연결한다"
    intent:
      problem: "많은 과거 턴을 일괄 조회하면 초기 부하가 커지고 추가 로딩/동시 변경에서 대화가 중복·누락되거나 읽던 위치를 잃을 수 있다"
      goal: "현재 권한으로 조회 가능한 과거 턴을 안정된 순서로 필요한 만큼 읽고 동일한 문맥에서 계속 탐색한다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "현재 인증된 사용자의 본인 대화이며 REQ-040에 따라 접근·삭제 여부를 확인한다"
      - "턴 식별·접수 순서와 보존된 본문/결과가 서버에 저장돼 있다. 처리 이력·결과의 공개 범위는 REQ-006·109와 기존 보안 규칙을 따른다"
    paging:
      unit: "대화 본문의 정렬·페이징 단위는 사용자 입력과 응답 블록 등 대화 메시지다. 처리 이력의 턴/시도/회차는 실행·감사 귀속을 식별하며 대화 표시 순서를 결정하지 않는다. 메시지마다 소속 턴·응답 대상 입력·관련 원본/재시도 참조를 연결한다. 큰 결과/상세 처리 이력은 지연 조회하며 진행 이벤트/스트리밍 청크마다 독립 메시지를 무한 추가하지 않는다"
      initial: "재진입 시 최신 대화 메시지 묶음을 우선 표시하고 과거는 역방향으로 읽는다. 질의와 응답이 다른 페이지에 걸리면 응답 대상/참조를 표시하고 필요한 위치를 직접 조회한다. 묶음은 최근 메시지의 한 페이지이며 고정된 턴 수를 뜻하지 않는다. 초기/추가 페이지의 메시지 개수는 아직 정하지 않았고 P3에서 결정한다. 한 쌍을 모으려고 기록 순서를 바꾸거나 전체 대화를 초기 로드하지 않는다. 빈 대화·조회 불가 안내는 기존 권한/보존 정책을 따른다"
      ordering: "서버 영속 기록 시 각 메시지에 부여한 불변 순서와 동률 구분 근거로 입력·출력 기록 순서를 유지한다. 턴 생성 순서나 응답 완료 시각으로 질의/응답 묶음을 재정렬하지 않는다. 병렬/지연 응답도 그 응답 블록이 실제 기록된 위치에 추가하고 이후 같은 블록의 내용/진행 갱신은 위치를 바꾸지 않는다. 물리 키/구간은 P3에서 정한다"
      boundary: "현재 구간의 가장 오래된 메시지보다 이전 범위를 서버 기준으로 조회한다. 신규 메시지·진행/내용 갱신·재시도·링크 이동에서도 불변 경계로 접근 가능한 메시지를 빠짐/중복 없이 읽는다. 페이지 크기·경계 유효성·보존 파기 경합은 P3에서 정한다"
      merge: "같은 메시지를 페이지/폴링/직접 이동에서 받으면 메시지 식별자로 한 번만 표시한다. 같은 턴의 다른 입력/응답 메시지를 턴 아이디만으로 하나로 합치지 않는다. 같은 블록의 최신 유효 내용/상태는 REQ-006·040을 따르고 메시지 위치를 바꾸지 않는다"
      scroll: "과거 메시지를 위에 추가해도 사용자가 읽던 메시지와 화면 내 위치를 유지한다. 과거를 읽는 중 새 턴 생성·진행 상태 갱신만으로 화면을 강제로 최신 위치로 이동시키지 않는다. 명시적 메시지 이동은 사용자가 선택한 대상으로 이동하며 실제 위치 유지 방식은 P3에서 설계한다"
      pending: "같은 과거 범위를 연속 요청해도 중복 추가하지 않는다. 로딩 중임을 구분하고 조회 실패 시 기존 본문·읽던 위치·성공한 조회 경계를 보존해 같은 범위를 재조회할 수 있게 한다. 과거 페이지 실패를 턴 실패나 대화 종료로 해석하지 않는다"
      end: "더 읽을 과거 메시지가 없는 상태와 조회 실패를 구분한다. 서버가 이전 범위의 끝을 확인하면 추가 과거 조회를 멈춘다. 결과 파기·권한 선별 등으로 표시 본문이 비었다는 이유만으로 과거 전체가 끝났다고 추정하지 않으며 다음 범위/끝의 판정 계약은 P3에서 정한다"
      related_navigation: "원본·재시도 또는 서버가 확인한 관련 질의/응답은 양방향 링크로 이동한다. 조회된 참조 관계에서 양쪽 링크를 구성하고 메시지/업무 결과를 복제하지 않는다. 대상이 현재 페이지 밖이면 필요한 구간을 조회해 정확한 메시지로 스크롤 이동하며 안 읽은 중간 범위를 조회 완료로 처리하지 않는다. 이동·돌아가기의 위치를 유지한다. 이동은 실행/재시도/승인을 만들지 않는다. 현재 권한·삭제·보존으로 대상이 불가하면 사유와 허용된 참조 정보만 표시한다"
    connections:
      query_list_preview: "REQ-014의 질의 목록/응답 레이어는 이 카드의 본문 직접 이동과 별개다. 목록의 질의 선택·응답 조회는 본문 로드 구간·페이징 경계·스크롤 위치에 반영하지 않는다. 본문 안의 관련 메시지 링크와 REQ-040의 미종결 안내는 기존 명시적 이동 계약을 따른다"
      active_turns: "이전 미종결 턴의 상태 안내·이동은 REQ-040.restoration.initial_scope·selection을 따른다. 요약과 과거 본문 페이징은 구분하며 직접 조회한 턴과 페이지에 포함된 같은 턴은 중복 표시하지 않는다"
      direct_navigation: "멀리 떨어진 미종결 턴으로 이동했을 때 아직 조회하지 않은 중간 범위를 읽은 것으로 간주하지 않는다. 대상 주변/원래 구간의 연속 범위를 구분하고 대상보다 과거도 계속 조회할 수 있어야 한다. 화면 배치·구간 병합·돌아가기 방식은 P3에서 정한다"
      live_updates: "이미 표시한 미종결 턴의 상태·시간·유효 조작은 REQ-006·040의 폴링 기준으로 갱신한다. 과거 페이지 조회 경계와 현재 상태 갱신을 구분하고 상태 변경 때문에 목록을 재정렬하지 않는다"
      cards: "과거 카드·승인 사실은 이력으로 표시할 수 있으나 현재 유효한 조작만 REQ-040으로 제공한다. 응답 제출 때 현재 상태·기한·권한을 재검사하며 조회만으로 카드를 되살리거나 승인하지 않는다"
    business_rules:
      - "현재 대화의 과거 메시지 본문 조회가 범위다. 전체 대화 검색·검색어/필터 기능은 이 요구사항으로 새로 정의하지 않는다"
      - "새 메시지 삽입·기존 메시지/턴 상태 갱신·직접 이동·이전 페이지 조회를 같은 식별/순서 기준으로 병합한다. 실제 보존/접근 정책으로 조회할 수 없는 데이터와 페이징 오류로 빠진 데이터를 구분한다"
      - "보존 기간 만료·파기 또는 마스킹 사본 생성 불가로 원문을 제공할 수 없으면 남은 허용 사실과 조회 불가 안내만 표시한다. 비공개 내용이나 이미 파기한 내용을 복원/재생성하기 위해 실행하지 않는다"
