    detail: "agent가 표준 응답 스키마와 버전·의미 블록·데이터를 정의하고 portal 표현 어댑터가 사용하는 컴포넌트의 설정으로 변환한다. portal이 응답 일부나 버전을 이해하지 못해도 사용자가 표시 불가 범위를 알 수 있어야 하며, 사용자가 원하면 공개 가능한 응답 원문을 확인하거나 원하는 형식의 재가공을 요청할 수 있다"
