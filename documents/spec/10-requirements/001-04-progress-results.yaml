# 영역: 진행 상황과 결과 표현
requirements:
  - id: REQ-006
    type: functional
    priority: must
    category: "진행 상태·표시"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "처리 진행·상세 이력·수행 시간 표시"
    detail: "portal은 비동기 폴링으로 서버에 저장된 실제 턴 처리 이력을 조회하여 현재 무엇을 하는지와 지금까지 수행한 내용을 표시한다. 현재 진행은 현재 시도에서 유효하고 사용자에게 공개 가능한 최신 처리 이력을 기준으로 하며, 누적 수행 내역은 같은 턴의 공개 가능한 처리 이력을 순서대로 보여준다. 매출 조회·미수금 조회처럼 업무 대상이 드러나게 기록·표시하고 예상되는 세세한 실행 단계는 미리 나열하지 않는다. 현재 작업과 턴 누적 처리 시간을 기본 표시하고, 상세 보기 버튼/화살표로 실제 작업 목록과 작업별 수행 시간·접수 후 경과 시간을 펼쳐 확인한다"
    hard_rule: "전체 감사 기록의 마지막 행이나 마지막 기록 시각만으로 현재 진행을 결정하지 않는다. 서버가 확정한 현재 턴 상태·시도·회차와 일치하는 유효 이력을 선택하며, 늦은 이전 응답·사용량 정정·중복 기록으로 종결 상태를 되돌리지 않는다. 실제 수행하지 않은 작업·완료·진행률을 생성하거나 모델의 예정 문장·미완성 스트리밍을 실제 진행으로 취급하지 않는다"
    source: "2026-10-13 사용자 결정 — 예상 세부 단계 대신 실제 턴 처리 이력을 폴링해 현재 진행과 누적 수행 내역을 표시한다. 복합 업무의 위치는 별도 계획 위치/분수 표시가 아니라 매출 조회·미수금 조회처럼 이력 자체에 업무 대상이 드러나는 뜻이다. 복합 요청의 업무·순서는 기존 계획 확인 때 제시하고 수정받는다. 후속 요청으로 위 내용을 006에 추가 보완했으며, 같은 날 사용자가 기존 보완본을 명시 확정했다. 이후 사용자 요청으로 기존 018의 상태·경과 시간 표시를 006에 통합하고 펼침형 작업 목록·작업별 시간·진행 중 카운트·턴 누적 처리 시간과 시간 예외/검증 기준을 보완했다. 같은 날 사용자 명시 승인으로 시간 표시를 포함한 통합 보완본을 확정했다. 상세 설계·실행 검증은 후속이다 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-19 사용자 요청으로 통합 REQ-007의 이전/대체 실행 구분과 실제 결과·미사용 표시를 보완했다. 기존 확정 내용을 유지하고, 같은 날 사용자가 동일 실행 변경과 별도 후속 실행의 표시·이전 결과 미사용·실제 수행 시간 보존·가상 작업/중복 방지 및 추가 검증 3건을 검토한 뒤 전체 보완본을 명시 확정했다. 상세 설계·실환경 시험과 단계 게이트 승인은 후속이다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."

    why: "이미 남기는 실제 처리 이력을 활용해 사용자가 무엇을 기다리고 무엇이 수행됐는지 확인하게 하고, 예측 계획과 실제 실행을 혼동하거나 별도 진행 사실을 중복 관리하는 것을 막는다"
    summary: "실제 이력에서 현재 작업·턴 누적 처리 시간을 표시하고, 펼친 상세 목록에서 업무별 수행 내역·시간과 접수 후 경과 시간을 확인한다. 각 질의·응답에 사용 토큰을 함께 표시하고 채팅창 별도 영역에서 당월 잔여 토큰과 과거 사용량 기준 추가 질의 예상 횟수를 확인한다"
    intent:
      problem: "진행 표시가 단순 대기 문구이거나 예상 계획에만 의존하면 실제 수행 내용을 알 수 없고, 전체 감사 이력을 그대로 노출하면 현재 상태 오인과 민감 정보 노출이 생긴다"
      goal: "저장된 실제 처리 사실을 원천으로 현재 진행·수행 내역·사용 토큰을 일관되게 표시하고, 본인의 당월 잔여 한도와 추가 질의 규모를 판단하게 한다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "접수·턴/시도·현재 상태·이력 연결은 REQ-009·016·036을 따르고 조회자는 현재 인증된 본인 턴의 접근 권한을 가진다"
      - "Agent가 실제 처리 경계의 시작·완료·실패·대기·중단 사실과 업무 대상을 기록한다. 세부 기록 수준은 아래 history_contract를 기준으로 P3에서 정한다"
    history_contract:
      source: "REQ-107.history_storage의 턴/스텝 현재 상태와 불변 처리 이력을 표시 원천으로 사용하고 REQ-108·109를 함께 따른다. 시작 기록·상태 갱신·전이 사건을 같은 실행 건으로 연결하며 한 작업을 중복 표시/합산하지 않는다. 사용자 표시용 조회·선별·문구 변환은 허용하되 별도 진행 사실을 임의로 만들지 않는다. 별도 진행 이력 테이블을 필수로 추가하지 않으며 기존 저장 구조로 충족하는지 먼저 검토한다"
      identity: "턴·시도·회차·관련 스텝/호출, 이력 식별과 순서·발생 시각, 실제 처리 종류·결과, 사용자에게 허용된 업무 대상/설명, 표시 메시지 코드와 인자를 연결한다. 필드명과 물리 스키마는 P3에서 확정한다 대화 메시지의 불변 기록 순서와 원본/재시도 턴·메시지 참조를 연결하며 대화 순서는 REQ-019를 따른다"
      granularity: "분석·검색·조회 구성·데이터 조회·업무 실행·결과 정리 등 실제 수행 중 사용자에게 필요한 사실을 기록한다. 모든 내부 메서드·모델 토큰마다 표시하지 않으며 기록 종류·시점·저장 실패 경계를 설계한다. 시작·완료·재시도 사실을 모델의 의도 문장만으로 기록하지 않는다"
      business_context: "처리 이력 자체에서 어떤 업무를 수행했는지 알 수 있게 한다. 예를 들어 조회 시작 대신 매출 조회 시작·미수금 조회 시작으로 구분한다. 업무 항목과 연결이 필요하면 서버가 검증한 계획/작업 참조를 사용하되 전체 계획의 몇 번째인지나 완료 비율을 별도로 표시하는 요구는 아니다"
      current: "현재 진행 문구는 서버가 확정한 현재 상태·시도·회차와 맞는 최신 공개 가능 처리 이력에서 얻는다. 상태 전이에 실패한 기록, 이전 시도/무효 회차의 늦은 결과, 사용량 정정·기술 기록은 현재 진행으로 올리지 않는다. 일치하는 진행 이력이 없으면 현재 상태만 표시하고 임의 단계를 추정하지 않는다"
      accumulated: "누적 수행 내역은 공개 가능한 처리 사실을 순서대로 표시한다. 폴링 사이에 끝난 짧은 작업도 저장된 내역으로 조회할 수 있어야 하며, 지난 시도·회차를 표시할 때는 현재 실행과 구분한다. 특정 업무의 완료를 복합 요청 전체의 완료로 해석하지 않는다"
      disclosure: "표시할 이력 종류·필드를 서버가 선별하고 현재 권한·마스킹 규칙을 적용한다. SQL 원문·테이블/컬럼 물리명·내부 프롬프트·인증 비밀·원본 예외·권한 밖 업무 정보는 진행 문구로 노출하지 않는다. 표시 문구는 기존 MSG 키와 label() 등 메시지 체계를 따르고 서버 계약으로 코드·허용 인자를 제공한다"
      intervention: "REQ-007의 변경으로 실제 모델 응답 실행을 대체하면 이전 작업과 변경 조건의 새 작업을 상세 수행 내역의 별도 항목으로 연결해 보여준다. 이전 작업에는 실제 종료/취소 확인과 변경으로 결과 미사용을 구분하고 새 작업에는 자체 시작·진행·종료/시간을 표시한다. 시작/종료 사건은 같은 항목이며 같은 업무명이라는 이유로 원/대체 실행을 합치지 않는다. 명시 중단에는 자동 새 항목이 없고 미실행 계획·중복 이벤트를 작업으로 표시하지 않는다. 같은 턴/시도의 실제 이전·새 작업 시간은 둘 다 포함하며 최신 진행은 현재 유효 작업만 반영한다. 공급자 종료와 계량 미확인은 REQ-107.history_storage에 따라 표시하고 사용자 공개 범위는 유지한다 동일 실행 변경은 기존 작업의 실제 진행과 변경 안내를 갱신하고 변경 사건으로 조회한다. 공급자 자동 후속도 실제 별도 실행이 시작되면 새 항목으로 연결한다. 변경 접수/도구 대기를 새 실행으로 표시하거나 같은 응답 청크·콘텐츠 블록·재연결마다 항목을 추가하지 않는다"

    personal_usage:
      source: "2026-10-22 사용자 요청: 각 질의·응답의 토큰량을 채팅창 수행 시간과 함께 표시하고, 별도 영역에 해당 월 잔여 총 토큰과 예상 추가 질의 가능 횟수를 안내한다. 사용자는 본인의 이번 달 정상 완료 질의 이력을 선택했으며, 후속 요청으로 해당 질의들의 사용 토큰 합계를 질의·응답 횟수로 나눈 1회 평균 사용량과 잔여 토큰으로 예상 횟수를 계산하도록 변경했다. 새 요구사항을 만들지 않고 앞으로 리뷰할 기존 6일차 REQ-006에 보완하며 상세 계산·예외를 포함한 전체 보완본은 재검토 대상이다"
      placement: "채팅창에서 각 원 질의와 연결 응답을 한 턴으로 묶어 time_display의 수행 시간과 사용 토큰량을 함께 표시한다. 채팅창의 별도 영역에는 현재 사용자의 모든 대화 세션을 합한 당월 잔여 총 토큰과 평균 사용량 기준 예상 추가 질의 가능 횟수를 표시한다. 내 사용량 화면도 같은 서버 집계와 규칙을 참조하며 화면별로 독립 계산하지 않는다. 구체 위치·컴포넌트·갱신 주기는 P3 화면 요건서·목업에서 정한다"
      turn_usage: "질의 1건은 서버가 접수한 원 질의의 턴 단위다. 같은 턴의 주 추론·보조 판정·질의 임베딩·변경 분류·재시도 등 본인 쿼터에 귀속되는 모든 모델 호출의 실제 사용량을 NFR-010과 REQ-107.history_storage에 따라 한 번씩 합산한다. 중간 메시지·추가 정보/승인 응답·동일 실행의 누적 계량을 별도 질의로 세거나 중복 합산하지 않는다. 새 턴 재요청은 별도 질의로 집계하며 원 턴 사용량을 복사하지 않는다. 관리자 운영용·시스템 귀속 사용량은 개인 Portal 사용량에 섞지 않는다"
      metering: "처리 중에는 현재까지 기록된 사용량임을 표시하고, 완료·실패·중단 뒤에도 실제 발생한 토큰을 표시한다. 공급사 계량·Hub 추정·미상은 NFR-010의 구분을 유지한다. 추정값이 포함되면 그 사실을 표시하고, 일부 계량이 미상이면 확인된 소계와 미상 포함 여부를 구분해 전체 확정값으로 표시하지 않는다. 늦은 정정은 원 호출·턴 사용량과 해당 귀속 월에 반영하며 턴 종결 상태나 수행 시간을 되돌리지 않는다"
      monthly_balance: "동일한 사용자·적용 월·조회 기준 시점의 개인 기본 배정과 현재 유효한 추가 승인 한도를 합친 값을 당월 총 한도 H로, 같은 월에 귀속된 개인 쿼터 차감 사용량을 U로 둔다. 신규 사용자 일할 배정은 해당 사용자의 기본 배정으로 반영해 이중 가산하지 않는다. 화면 잔여 토큰 R = max(0, H - U)이며 U가 H를 넘으면 잔여 0과 초과 사용량을 구분한다. 월 전체 계획 총 풀의 초과를 이유로 개인 한도를 줄이지 않는다. 월 경계 호출의 사용량은 기존 발생 월 귀속을 따르고 과거 월 정정을 현재 월에서 다시 차감하지 않는다"
      sample: "표본은 본인이 이번 달에 접수하고 같은 달에 정상 완료한 Portal 질의 턴 중 전체 쿼터 차감 토큰량이 확인 가능하고 0보다 큰 건이다. 정상 완료 턴 안에서 실제 발생한 실패 호출·재시도 사용량도 turn_usage에 포함한다. 실패·중단·진행 중 턴, 월 경계에 걸친 턴, 총량 일부가 미상인 턴과 0토큰 턴은 횟수 계산 표본에서 제외한다. 이 제외가 월 실제 사용량 U를 줄이는 근거는 아니다. Hub 추정 계량으로 총량이 계산된 표본은 포함하되 추정 계량 포함 사실을 표시한다. 다른 사용자·지난달 이력을 대신 쓰거나 이상값을 임의 제거하지 않는다"
      estimate: "유효 표본의 질의·응답 횟수를 N, 그 동일 표본에 포함된 턴별 총 사용 토큰의 합계를 S로 둔다. 질의·응답 1회 평균 사용 토큰 A = S / N이며, R이 유효하고 양수이고 N > 0·S > 0이면 예상 추가 질의 횟수 = floor(R / A) = floor(R * N / S)로 계산한다. 화면 표시용으로 반올림한 평균을 계산에 다시 사용하지 않고 최종 횟수의 소수점만 버린다. 표본 1건이면 그 턴의 사용량이 평균이며 표본 1건임을 안내한다. S와 N은 반드시 같은 유효 표본 집합을 사용하며, 실패·중단·진행 중 등 표본에서 제외한 턴의 사용량까지 포함한 월 사용량 U를 N으로 나누지 않는다. 세션별 평균을 다시 단순 평균하지 않고 모든 본인 세션의 S와 N을 합쳐 계산한다. 모델·질의 복잡도 변화에 따라 실제 추가 사용량은 평균과 달라질 수 있다"
      presentation: "당월 잔여 토큰과 함께 '이번 달 완료 질의의 평균 사용량 기준, 추가 질의 예상 약 16회'처럼 과거 이력 기반 단일 예상 횟수를 표시한다. 적용 월·서버 조회 기준 시점·표본 건수·표본 사용 토큰 합계·질의·응답 1회 평균 사용 토큰과 추정 계량 포함 여부를 확인할 수 있게 한다. 실제 완료 가능 횟수의 보장·예약량으로 안내하지 않는다. 추가 모델 호출 없이 저장된 계량값과 산식으로 계산한다"
      unavailable: "당월 한도 미확정·사용량 조회 실패·미상 계량으로 유효한 잔여를 산정할 수 없으면 원인을 구분하고 횟수는 산정 불가로 표시한다. 유효 잔여가 0이면 횟수는 0회로 표시한다. 잔여가 양수여도 유효 표본이 없으면 '산정할 완료 질의 이력 없음'을 표시하고 0회·무한대·타인 평균을 만들지 않는다. 처리 중 호출의 아직 반영되지 않은 사용량이 있으면 현재까지 기록된 기준임을 알린다. 조회 오류 시 이전 값이 있다면 마지막 확인값과 시각임을 명시하고 최신 값처럼 표시하지 않는다"
      refresh: "화면 진입·재접속·질의 종결·추가 한도 승인 반영·사용량 정정·월 변경을 인지하면 서버 값을 다시 조회한다. 같은 응답의 대상 사용자·월·기준 시점으로 잔여와 예상 횟수를 함께 갱신하며 늦은 이전 월/이전 조회 응답으로 현재 값을 덮지 않는다. 다른 탭·세션의 사용량도 포함하고 화면에 로드한 메시지 개수로 합계를 계산하지 않는다. 원문 파기·대화 논리 삭제로 보존 중인 월 사용량이 환급되거나 표본에서 임의 제거되지 않으며, 원문 없이 계량 집계만 사용한다"
      enforcement: "잔여·횟수 표시는 NFR-012의 시작 전 개인 쿼터 검사나 선택적 처리 중 재검사를 대체하지 않는다. 잔여가 양수여도 질의·응답 1회 평균 사용량보다 작아 예상 횟수가 0회일 수 있으며, 이 예측만으로 새 질의를 차단하거나 한도를 예약하지 않는다. 추가 한도는 REQ-119, 등급 승급과 적용 월은 REQ-116·117의 기존 규칙을 따른다"

    time_display:
      collapsed: "현재 턴 상태·최신 유효 작업과 그 작업의 진행 중 소요 시간, 턴 전체의 누적 처리 시간을 기본 표시한다. 병렬 작업이 있으면 다른 진행 중 작업도 있음을 알리고 상세 목록에서 각각의 상태·시간을 확인하게 한다"
      expanded: "상세 보기 버튼 또는 화살표로 지난 작업과 진행 중 작업을 펼치고 접는다. 작업명/업무 대상·결과 상태·수행 시간을 표시하며 지난 시도·회차·재시도를 구분한다. 접수 후 경과 시간과 실행 순서/인계·사용자대기 시간은 상세 정보에서 구분해 확인한다. 공개 이력의 종류·정보 제한은 history_contract를 따른다"
      task_duration: "실제 작업의 시작·종료 이력을 동일 작업으로 연결해 NFR-008의 합산 단위로 표시한다. 시작 이벤트와 완료 이벤트를 별도 작업으로 더하지 않는다. 완료·실패·중단한 작업도 실제 소비한 시간은 남기며, 아직 시작하지 않은 작업에는 수행 시간을 임의로 부여하지 않는다"
      turn_total: "턴 누적 처리 시간은 해당 턴에 실제 발생한 시도·회차·작업의 시간만 합산한다. 명시적 중단 재시도는 새 턴이므로 원 턴 시간은 새 턴 합계에 넣지 않고 원본 이력으로 보존한다. 연관 턴 전체 합계가 필요한 조회는 관계에 속한 각 작업을 한 번만 합산하고 개별 턴 시간과 명확히 구분한다. 서버 전체 범위 합계와 공개 정책은 유지한다"
      elapsed: "접수 후 실제 경과 시간은 각 턴의 서버 접수 시각과 종결 시각을 기준으로 표시한다. 재시도 턴은 새 접수 기준을 사용하고 원 턴은 기존 종결 기준을 유지한다. 서로 다른 턴 사이 미실행 간격을 새 턴의 처리/경과 시간으로 합산하지 않는다. 연관 전체 기간을 조회한다면 개별 턴 소요와 구분한다. 병렬 작업 합계를 벽시계 경과로 표시하지 않는다"
      waiting: "개인 실행 순서·시작 전 인계·사용자 입력/승인 대기는 별도 대기 구간이다. 다른 실제 진행 작업이 없는 동안 누적 처리 시간은 늘지 않고 접수 후 경과 시간은 계속 흐른다. 유효 카드의 만료 기한·취소/응답 조작은 기존 계약을 따르며 경과 시간 표시 때문에 만료를 연장하지 않는다"
      continuation: "유효한 사용자대기 응답은 같은 턴/시도의 작업 시간·접수 기준을 유지한다. 중단 후 명시적 재시도는 원본과 연결된 새 턴/시도의 작업 목록·소계·접수 시각으로 시작하고 원 턴의 중단 이력/시간은 고정한다. 원본과 재시도 이력은 양방향 링크로 조회하며 연관 누적과 개별 턴 시간을 혼합하지 않는다"
      clock: "시작·종료 시각과 계산 기준은 서버 기록을 사용한다. 폴링 사이의 카운트는 서버가 반환한 기준 시각/누적값에 로컬 단조 경과를 더하는 등 PC 시계 변경에 흔들리지 않는 방식으로 갱신하고 다음 유효 응답에서 보정한다. 이는 표시용 경과일 뿐 작업 진전·성공·점유 유지의 근거가 아니다. 다중 인스턴스의 시각 일관성·정밀도·보정 계약은 P3에서 정한다"
      terminal: "완료·실패·중단 시 현재 시도의 경과 카운트를 서버 종결 시각으로 고정하고, 작업별 시간은 실제 종료 또는 서버가 확정한 실행 구간 종료 근거로 고정한다. 폴링 수신 시각을 종료 시각으로 사용하지 않는다. 중단 요청 접수만으로 카운트를 종결하지 않으며 외부 호출 결과 불명을 성공/취소 완료로 바꾸지 않는다"
      recovery: "새로고침·재접속 때 서버의 기존 시각·누적값을 복원한다. 조회 오류에는 마지막 확인 상태·시간임을 표시하고 진행 중 표시 카운트의 임의 연장을 멈춘 뒤 재조회로 보정한다. 누락된 시작/종료 근거는 확인 불가로 구분하고 0초나 정확한 합계로 꾸미지 않는다. 필요한 경우 확인된 합계임을 명시하며 늦은 사실 보정은 현재 상태를 되돌리지 않는다"
      limits: "수행/경과 시간은 예상 완료 시간·진행률·턴 전체 시간 제한이 아니다. NFR-013의 개별 호출·대기 만료·정체 탐지 등 종결 장치와 분리하며 시간 카운트만으로 정상 동작 여부를 판정하지 않는다"
    business_rules:
      - "턴의 업무 상태와 사용자에게 보여 줄 실제 처리 내용을 구분한다. 분석·조회 구성·조회 등의 표시 때문에 별도의 턴 상태를 계속 추가하지 않는다. 시간의 화면 표시 계약은 아래 time_display, 공통 측정·합산 기준은 NFR-006·008이 갖는다"
      - "006의 화면은 실제 수행 내역을 보여준다. 미래의 세세한 스텝 목록·예상 내부 호출 순서·근거 없는 진행률이나 완료 예상 시간을 표시하지 않는다. 최대 스텝 수 대비 사용한 스텝 수를 업무 완료율로 변환하지 않는다"
      - "복합 요청은 REQ-022·023에 따라 사용자 요청을 업무 단위·순서·조건으로 정리해 필요한 계획 확인 시 제시하고 자연어 수정을 받는다. 모든 턴에 확인을 강제하지 않으며 실제 업무 실행 승인은 REQ-026·105의 대상·액션·순서·파라미터 범위에 별도로 적용한다. 표시 과정에서 사용자가 요청하지 않은 업무를 계획이나 실행에 추가하지 않는다"
      - "개인 순서 대기·자동 시작·취소 안내는 REQ-036, 추가 정보·계획 확인·실행 승인 대기는 각각의 기존 카드 계약을 따른다. 처리 중 화면을 사용자대기와 혼동하지 않게 하며 기존 카드의 유효성·기한을 바꾸지 않는다"
      - "허용된 호출 재시도는 실제 시도 근거와 순번을 표시하고 NFR-022의 소진·결과 불명·수동 확인 안내를 따른다. 중단 요청 접수만으로 중단 완료를 표시하거나 마지막 개별 작업 완료만으로 턴 전체 완료를 표시하지 않는다"
      - "모델의 스트리밍 수신과 portal 진행 폴링은 별개다. 모델 원문 청크를 그대로 진행 이력으로 노출하거나 이력 표시를 위해 새 LLM 호출을 생성하지 않는다"
    polling:
      response: "각 조회에서 현재 턴 상태와 사용자에게 허용된 최신 진행·누적 수행 내역·작업별 시간·턴 합계·서버 시간 기준을 일관되게 제공한다. 동일 이력의 재수신으로 화면 항목을 중복 추가하지 않고 오래된 폴링 응답으로 최신 표시가 되돌아가지 않게 한다. 여러 턴·시도의 내역이 섞이지 않아야 한다"
      history_read: "이력 전체 재조회 또는 증분 조회·페이징 방식, 순서/중복 판정 근거와 페이지 경계는 P3에서 정한다. 마지막 이력 한 건만 조회해 폴링 사이의 수행 내역을 영구 누락시키지 않는다. 저장된 기록이 없는데 단계를 보인 것처럼 재생하지 않는다"
      failure: "조회 통신 오류는 연결 문제로 표시하고 턴 실패·완료로 추정하지 않는다. 마지막 확인 상태임을 구분하며 현재 권한 회수는 일시 통신 오류로 취급하지 않는다"
      reconnect: "재접속은 REQ-016·040에 따라 기존 대화의 상태·공개 가능한 수행 내역·유효 대기 카드를 다시 조회한다. 이력 조회는 새 실행·승인·재시도 또는 만료 연장을 만들지 않는다"
