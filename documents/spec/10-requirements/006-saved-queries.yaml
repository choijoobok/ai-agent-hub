      - { kind: 예외, case: "같은 조회를 두 탭의 위젯에서 연속 클릭해도 대기 중에는 업무 조회·오류 발생을 추가하지 않는다. 오류 횟수는 실제 실패 한 건이다" }
      - { kind: 정상, case: "권한 회수로 거부됐던 조회는 오류로 남지만 삭제되지 않는다. 권한 재부여 후 실제 재시도가 성공하면 활성으로 복구된다" }
      - { kind: 예외, case: "조회 123이 스키마 오류와 연결 장애로 세 번 실패하면 관리자 목록은 한 행, 상세는 실행별 세 건이며 같은 원인으로 자동 병합하지 않는다" }
