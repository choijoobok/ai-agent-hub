    maturity: {"level":"confirmed","at":"2026-10-27","by":"AI — 사용자 권장안 반영 요청 적용","confirmed_by":"사용자 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 민감 상수 저장 차단 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."}

  - id: REQ-203
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-29 사용자 결정(모델 생성 SQL 저장·실행마다 정책 실시간 적용 · 파라미터화 토큰 쿼터 차감 · 확정 근거로만 무효화 · 논리 삭제 · 판정 일치 시에만 캐시 · 대시보드 여러 개) · 2026-09-30 사용자 변경 결정(수정·덮어쓰기 대신 신규 저장 · 삭제 시 연결 위젯 자동 제거 · 인증 예제는 AI 활용 자산이며 공용 즐겨찾기가 아님) · 2026-09-30 사용자 결정(즐겨찾기 수정·위젯 제외, 오류 상태·재시도 복구, 조회별 실패 이력·신고·통합 조사 연결)"
    process_step: PRC-02-07
    title: "저장 시점에 파라미터화를 강제한다"
    detail: "날짜·기간을 상수로 저장하면 하루 만에 무용지물이 된다. 저장 시 LLM 이 파라미터화 후보를 뽑아 사용자에게 확인받으며 **토큰은 저장할 때 한 번만** 쓴다. 파라미터 유형은 셋으로 제한한다 — ① 상대 시점·기간 ② 사용자 입력 값 ③ 실행자 신원"
    hard_rule: "**임의 표현식은 허용하지 않는다**(그 자체가 인젝션 표면이다). 바인딩은 **바인드 변수로만** 하고, 파서 검증은 파라미터가 바인딩된 형태를 대상으로 수행한다"
    roadmap: RM-P1
    acceptance: "저장 시 상대 시점·사용자 입력·실행자 신원 이외의 파라미터 표현식은 거부되고, 허용 파라미터는 바인드 변수로만 주입된다. 파라미터가 적용된 SQL은 실행 전 파서 검증을 다시 통과해야 한다"
    summary: "저장할 때 모델이 파라미터 후보를 뽑아 사용자에게 확인받고, 상대 시점·기간·사용자 입력 값·실행자 신원 셋만 허용한다. 값은 바인드 변수로만 넣고 바인딩된 형태로 다시 검증한다"
    intent:
      problem: "날짜를 상수로 저장하면 하루 만에 쓸모없어지고, 반대로 임의 표현식을 허용하면 그 자체가 인젝션 경로가 된다"
      goal: "한 번 저장한 조회를 매일 다시 쓰되, 파라미터가 SQL 구조를 바꾸지 못하게 한다"
      not:
        - "임의 표현식·SQL 조각 파라미터가 아니다"
        - "실행할 때마다 모델을 부르는 기능이 아니다 — 토큰은 저장할 때 한 번만 쓴다"
    goal_trace: [INV-01, ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "저장 대상 SQL이 성공한 조회에서 나왔다(REQ-202)"
      - "실행자 신원 파라미터는 데이터소스별 사용자 신원 매핑이 있어야 채울 수 있다(CON-021)"
    data:
      - { item: "파라미터 명세(이름·유형·상대 시점 표현·입력 형식·기본값)", origin: "저장 시 모델 후보 + 사용자 확인", sensitivity: "내부", retention: "저장된 조회와 같다" }
    business_rules:
      - "파라미터 유형은 ① 상대 시점·기간 ② 사용자 입력 값 ③ 실행자 신원 셋뿐이다"
      - "상대 시점·기간은 제품이 정해 둔 닫힌 목록(오늘·어제·이번 주·지난주·이번 달·지난달·최근 N일 등)에서만 고른다"
      - "사용자 입력 값은 유형·형식을 검증하고 바인드 변수로만 넣는다"
      - "실행자 신원은 실행하는 시점 사용자의 현재 신원 매핑으로 채운다 — 저장한 사람의 값이 아니다"
      - "사용자가 비민감 후보를 거절하면 그 값은 상수로 남는다. 민감 후보는 sensitive_constants에 따라 실행 시 입력하도록 전환해야 하며 거절하면 저장하지 않는다. 확인 화면은 남는 일반 상수와 매 실행에 필요한 입력을 해석문 기준으로 구분한다"
      - "파라미터를 바인딩한 형태로 실행 전 파서 검증을 다시 통과해야 한다"
      - "REQ-202의 실행 요청 안에서 사용자 확인을 받은 상수와 바인드 변수만 파라미터화한다. 조회 대상·도구 종류·기본 필터 제외 명세를 변경하지 않고 원 호출·성공 결과와의 연결을 유지한다"
    sensitive_constants:
      scope: "SQL 리터럴·업무 인자·파라미터 기본값 중 기존 저장 사본 정책상 원값 보관이 금지되는 민감 값·인증 비밀을 검사한다. 분류는 카탈로그/API 입력 메타데이터와 REQ-111.privacy_metadata·two_axes를 따르며 개인정보라는 이유만으로 금지 범위를 넓히지 않는다. 원값 보존이 허용된 정보주체 식별자와 일반 업무 상수는 기존 정책을 유지한다. 원 컬럼/입력 필드와 값의 관계를 추적하며 모델의 후보 제안·사용자 동의만으로 비민감이라고 판정하지 않는다"
      storage: "민감 원값을 실행 정의·기본값·저장용 설명·위젯 설정에 보관하지 않는다. 식별한 민감 원값이 저장용 질의문/해석문에도 있으면 제거하거나 안전한 설명으로 바꾸며, 안전한 저장본을 만들 수 없으면 저장을 거부한다. 일반 비민감 상수는 유지할 수 있다. 암호화했다는 이유로 장기 저장을 허용하지 않으며 ADR-025의 실행 파라미터 임시 보관 예외를 저장된 조회에 확대하지 않는다"
      binding: "민감 업무 값은 사용자 확인을 거쳐 기본값 없는 필수 사용자 입력으로 전환한다. 실행자 신원은 기존 서버 신원 바인딩을 사용하며 인증 비밀은 사용자 입력 파라미터로 바꾸지 않고 등록된 서버 연결 계약을 따른다. 안전하게 분리할 수 없거나 사용자가 필수 입력 전환을 거절하면 저장을 거부한다"
      runtime: "매 실행 시 현재 정책으로 정의·입력 자격을 검사한다(REQ-207). 필수 민감 입력은 그 실행에서만 사용하며 이전 실행·감사·임시 원값 보관소로부터 자동 복원하지 않는다. 위젯 자동 실행 등 입력을 받을 수 없는 경로는 원천을 호출하지 않고 수동 입력이 필요함을 안내한다. 재실행 입력값과 감사 사본의 보호는 기존 REQ-107·111을 따른다"
      failure: "민감 여부나 원 필드 대응을 확인하지 못하면 저장을 보류/거부하고 안전한 파라미터화로 다시 저장하도록 안내한다. 검사·거부 이력에도 원값을 복제하지 않으며 구조·대상·실패 유형만 남긴다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
      - "허용 유형 밖의 표현식은 저장을 거부한다"
      - "저장 시 파라미터화의 모델 호출 토큰은 사용자 쿼터에서 차감하며, 한도가 모자라면 저장을 거부하고 사유를 안내한다(REQ-116~119)"
    lifecycle: "해당 없음"
    permissions:
      - "파라미터 확인·저장: 본인의 ACT-001"
      - "Portal 화면/API 접근은 ARCH-050.portal_account_contract.access의 별도 Portal 인증·현재 이용 조건·본인 범위로 판정한다. system 관리자 역할/메뉴 권한이나 특정 역할명으로 Portal 접근을 허용하지 않는다"
    audit: "저장 시 모델 호출과 사용자 확인 결과를 남긴다(REQ-107)"
    volume: "저장 1건당 모델 호출 1회 — 그 토큰은 사용자 쿼터에서 차감한다"
    config: "해당 없음 — 상대 시점 목록은 제품이 정한다"
    risk: "모델의 후보 누락은 민감값 저장 허가가 아니다. 서버가 민감 상수·기본값을 별도 검증하고, 일반 상수의 업무 적절성은 확인 화면에서 사용자가 검토한다"
    relations:
      depends_on: [REQ-202]
      constrains: [REQ-207]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: [FEAT-122]
      screens: [SCR-104]
    examples:
      - { kind: 정상, case: "'9월 A창고 출고 건수'를 저장하면 '9월'이 '이번 달' 후보로 제시되고, 사용자가 확인하면 10월에 실행할 때 10월 기준으로 조회한다" }
      - { kind: 예외, case: "창고 코드 입력 값에 A' OR '1'='1 을 넣어도 바인드 변수 값으로만 들어가 SQL 구조는 바뀌지 않는다" }
      - { kind: 정상, case: "개인 전화번호 조건을 기본값 없는 필수 입력으로 전환하면 정의에는 바인드 변수만 남고, 다음 실행은 새 입력을 받아 수행한다. 일반 창고 코드는 사용자 거절 시 상수로 유지할 수 있다" }
      - { kind: 예외, case: "모델이 민감 후보를 누락하거나 파라미터 기본값·저장 설명에 전화번호를 남기면 서버 검사가 저장을 거부한다. 사용자 확인이나 암호화로 우회할 수 없다" }
      - { kind: 예외, case: "현재 정책에서 민감 상수로 판정되는 과거 정의는 실행을 막고 새 저장을 안내한다. 필수 입력 없는 위젯은 이전 입력을 재사용하거나 원천 조회를 시작하지 않는다" }
      - { kind: 정상, case: "기존 정책에서 원값 보존이 허용된 고객 ID·주문번호는 식별자라는 이유만으로 저장을 금지하지 않는다. 연락처 등 원값 비보관 대상은 같은 입력에 있어도 별도로 필수 파라미터화한다" }
    volatility: { level: low, what: "허용 유형 셋은 보안 원칙이라 고정한다" }
    open:
      - "@defer P3 sensitive_constants의 원 필드 추적·서버 검사·저장 설명 정제와 저장/복원·위젯 입력 누락 차단을 계약 시험으로 검증한다"
    maturity: {"level":"confirmed","at":"2026-10-27","by":"AI — 사용자 권장안 반영 요청 적용","confirmed_by":"사용자 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 기존 원값 비보관 정책에 따른 민감 상수·기본값의 필수 입력 전환 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."}

  - id: REQ-204
    type: functional
    priority: should
    actors: [ACT-001, ACT-005, ACT-003, ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-29 확정 근거로만 무효화·논리 삭제 · 2026-09-30 사용자 결정(신규 저장만 허용, 삭제 시 연결 위젯 제거, 오류 상태·재시도 제한·성공 시 복구, 조회별 오류 목록·개별 실행 이력)"
    process_step: PRC-02-07
    title: "저장된 조회 오류 상태·재시도·복구와 삭제"
    detail: "저장된 조회마다 전역 고유 ID와 소유자를 두고, 사용자에게 활성·오류 상태를 표시한다. 스키마 불일치·실행 장애·현재 권한 거부 등으로 실행할 수 없으면 사유와 재시도 가능 시각을 안내한다. 오류 상태에서도 삭제·관리자 문의·품질 신고가 가능하고, 대기시간 뒤 사용자가 다시 실행해 성공하면 같은 조회가 활성으로 복구된다. 관리자 오류 목록은 조회 ID별 한 행이고 상세에서 REQ-207의 개별 실패·신고·조사를 본다"
    hard_rule: "오류나 권한 상실만으로 정의·위젯을 삭제하지 않는다. SQL·파라미터 명세는 수정하지 않으며 다른 정의는 REQ-202에 따라 신규 저장한다. 재시도 제한은 서버에서 사용자·저장 조회 ID 단위로 적용해 직접 실행·모든 연결 위젯·여러 탭이 공유한다. 대기 중 요청은 실제 조회를 실행하지 않고 새 실행 오류를 만들지 않는다"
    roadmap: RM-P1
    acceptance: "같은 조회를 여러 탭·위젯에서 반복 실행해도 대기 중 업무 조회·새 오류 발생은 없다. 대기시간이 지나도 자동 복구·자동 재실행하지 않으며 사용자 재시도에서 현재 권한·스키마를 다시 검사해 성공하면 활성으로, 실패하면 오류로 남긴다. 오류 목록은 조회 ID당 한 행이고 실패 상세는 개별 실행별로 보인다. 사용자 삭제 확인 시 조회를 논리 삭제하고 모든 연결 위젯을 제거하되 다른 위젯·대시보드·과거 이력은 유지한다"
    summary: "오류 조회는 사유를 보여 주고 잠시 재실행을 제한한다. 사용자가 다시 실행해 성공하면 활성으로 복구하며, 관리자는 조회별 한 행과 개별 실패 이력을 본다. 삭제는 사용자 확인으로만 하며 연결 위젯도 함께 제거한다"
    intent:
      problem: "낡은 조회와 권한 변경으로 반복 실패할 때 연속 클릭이 부하·오류 이력을 늘린다. 영구 차단하면 스키마 원복이나 권한 재부여 뒤에도 사용할 수 없다"
      goal: "반복 실행을 제한하면서 실제 재실행 결과로 복구하고, 개인 조회별 문제와 과거 발생을 추적한다"
      not:
        - "오류 상태는 모두 시스템 장애라는 뜻이 아니다 — 정상 권한 거부와 처리 장애는 실패 유형으로 구분한다"
        - "당일 전체 차단이나 다음 날 자동 활성화가 아니다"
        - "관리자 문의·조사 완료·대기시간 경과만으로 활성 복구하지 않는다"
        - "어떤 권한 밖 객체 때문에 막혔는지는 사용자에게 노출하지 않는다(REQ-101)"
    goal_trace: [INV-01, SUC-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "전역 고유 조회 ID와 소유자, 개별 실행 식별자·결과가 있다(REQ-207)"
      - "변경 통지·구조 변화 후보 처리가 있다(REQ-304·FEAT-217)"
      - "관리자가 필요한 실패·신고를 오류·품질 조사에 연결할 수 있다(REQ-115)"
    data:
      - { item: "조회 ID·소유자·현재 상태·최근 사유·실행 결과·재시도 가능 시각", origin: "agent", sensitivity: "내부, 사용자 표시 사유는 정제", retention: "저장된 조회 보관 정책" }
      - { item: "관리자 조회별 오류 현황(이름·소유자·상태·최초/최근 오류 시각·횟수)", origin: "REQ-207의 실행별 실패 집계", sensitivity: "내부", retention: "발생 원본은 REQ-207을 참조" }
    business_rules:
      - "확정된 컬럼 삭제·타입 변경·공개 객체 소멸 통지가 참조 객체에 닿으면 오류 상태로 표시하고 소유자에게 알린다(REQ-509). 변경 통지는 실행 실패가 아니므로 가짜 실행 오류 이력을 만들지 않는다"
      - "구조 변화 후보만으로는 오류 상태로 바꾸지 않고 확인 필요를 표시한다. 실제 스키마 불일치나 실행 실패가 확인되면 오류로 전이한다"
      - "현재 권한·신원 매핑·사용자 상태 때문에 거부되거나 스키마 오류·일시 장애가 나면 오류 사유를 구분해 남긴다. 권한 거부는 정상 정책 판정으로 기록하며 지식 보완을 자동 요청하지 않는다"
      - "실패 후 재시도 대기시간을 적용하고 연결 위젯에도 같은 상태·사유·재시도 가능 시각을 보인다. 서버가 직접 실행·위젯 자동 실행·여러 탭의 중복 재시도를 제한한다"
      - "같은 사용자·조회 ID의 동시 실행 요청은 하나만 실행에 진입한다. 나머지는 진행 중 실행 또는 재시도 가능 시각을 안내받으며, 제한 확인과 실행 진입 사이의 경합으로 중복 실행·실패 이력이 생기지 않아야 한다"
      - "대기 중 요청에는 기존 사유와 재시도 시각만 안내한다. 업무 DB에 다시 조회하지 않고 새 오류 발생 횟수를 늘리지 않으며, 반복 클릭으로 대기시간을 연장하지 않는다"
      - "대기시간 후 오류 상태에서 사용자가 다시 실행할 수 있다. 화면 진입 자동 실행은 오류 조회를 재시도하지 않는다. REQ-207의 현재 권한·스키마·마스킹 검사를 거쳐 성공하면 활성, 실패하면 오류 유지와 새 대기시간을 적용한다"
      - "복구 확인은 실제 새 실행의 성공을 기준으로 하고 이전 캐시 결과만으로 활성 복귀시키지 않는다. 권한 재부여·스키마 원복 뒤 같은 SQL이 성공하면 교체 없이 복구된다"
      - "관리자 목록은 조회 ID별 한 행에 소유자·이름·현재 상태·최근 오류 사유/시각·오류 횟수를 보인다. 기본은 현재 오류 상태만, 전체 상태 조회는 복구된 항목의 과거 이력도 보인다"
      - "조회 상세에서 개별 실패와 신고·연결 조사를 확인한다. 같은 조회의 실패를 모아 보여 주는 것은 동일 원인 판정이 아니며 조사 생성·연결은 REQ-115를 따른다"
      - "사용자는 오류 사유 확인·관리자 문의·삭제 또는 REQ-110에 따른 개별 실행 오류 신고를 할 수 있다. 담당자에게 문의했다는 확인을 재시도의 필수 조건으로 두지 않는다"
      - "조회 삭제 전 연결 대시보드 수·위젯 수를 안내하고 확인받는다. 취소하면 조회·위젯은 유지한다"
      - "삭제 완료 시 조회는 논리 삭제하고 본인의 모든 대시보드에서 연결 위젯을 제거한다. 일부 연결 위젯이 남아 실행 가능한 상태를 삭제 완료로 처리하지 않는다. 다른 위젯·대시보드와 실행 이력·신고·조사·승격 근거는 유지한다"
      - "삭제와 위젯 추가가 동시에 요청되어도 삭제된 조회를 참조하는 위젯을 남기지 않는다. 삭제 영향 확인 뒤 연결 구성이 달라졌으면 최신 영향으로 다시 확인받고, 삭제 완료 후의 연결 생성은 거부한다"
      - "삭제된 조회는 실행·재시도할 수 없으며 보관 기간 뒤 배치로 물리 파기한다. 조사를 위한 근거 보관은 REQ-109·REQ-110을 따른다"
    exceptions:
      - "처리 장애와 권한 거부는 같은 사용자 상태인 오류로 표시해도 내부 실패 유형·조치 판단은 구분한다"
      - "오류 상세나 문의 안내는 SQL·물리명·권한 밖 객체를 노출하지 않는다"
    lifecycle:
      - { state: 활성, next: [오류, 삭제 표시], note: "구조 변화 후보는 확인 필요 표시만 붙인다" }
      - { state: 오류, next: [활성, 삭제 표시], note: "대기 종료 후 사용자 재시도의 실제 성공으로만 활성 복귀. 실패 시 오류 유지와 재시도 제한 갱신" }
      - { state: 삭제 표시, next: [파기], note: "사용자 목록·연결 위젯에서 제거하고 실행 금지, 관련 근거는 보존" }
      - { state: 파기, next: [], note: "보관 기간 뒤 일괄 처리로 물리 삭제" }
    permissions:
      - "본인 조회 실행·오류 확인·재시도·신고·삭제: ACT-001, 비활성 사용자·권한 없는 요청의 실행은 허용하지 않는다"
      - "저장 조회 오류 목록·상세: 유효 메뉴 권한 보유자(업무 자산·보안·품질·운영 담당). 내부 SQL·정책 근거는 별도 유효 열람 권한을 따른다"
      - "관리 화면 권한은 system 데이터로 판정하며 특정 역할을 하드코딩하지 않는다(AUTHZ-091)"
    audit: "실행별 근거는 REQ-207, 상태 변화·사용자 삭제·연결 위젯 제거 결과와 관리자 열람은 감사한다"
    volume: "한 조회를 여러 위젯·탭에서 실행할 수 있어 서버의 같은 재시도 제한을 공유한다"
    config: "실패 후 재시도 대기시간은 FEAT-025의 운영 설정이다. 당일 차단은 쓰지 않으며 구체적인 기본값은 P2에서 확정한다"
    risk: "단순 대기 종료·캐시 조회·조사 완료로 복구하면 아직 실패하는 조회가 활성으로 표시된다. 실제 재실행 성공을 확인한다"
    relations:
