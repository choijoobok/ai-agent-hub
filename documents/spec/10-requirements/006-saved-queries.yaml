      - "주기 폴링·자동 새로고침은 설정할 수도 실행할 수도 없다"
      - "자동 실행은 동시 실행 수 제한 안에서 차례로 나가고, 같은 위젯의 연속 실행은 쿨다운을 지킨다(NFR-005)"
      - "위젯 결과는 그리드·차트의 클라이언트 기능으로 내려받는다(NGOAL-10)"
      - "결과 캐시는 사용자별이다. 캐시를 쓸 때도 권한 판정은 매번 하고, 판정 결과(허용 범위·행 스코프·기본 필터·마스킹 모드)가 캐시할 때와 같을 때만 캐시 결과를 보인다 — 다르면 새로 조회한다"
      - "사용자는 대시보드를 여러 개 둘 수 있다. 개수 상한은 admin 설정(FEAT-025)이다"
      - "새 조회를 쓰려면 REQ-202에 따라 새 위젯을 추가한다. 기존 조회의 사용자 삭제에 따른 연결 위젯 제거는 REQ-204를 따른다"
      - "오류 상태의 조회를 쓰는 위젯은 상태·사유·재시도 가능 시각과 사용자 재실행·신고 경로를 보인다. 재시도 제한·오류 상태 자동 실행 금지·성공 복구는 REQ-204를 따른다"
    exceptions:
