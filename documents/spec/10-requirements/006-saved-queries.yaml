# 영역: 저장된 조회·개인 대시보드
requirements:
# ── 저장된 조회와 개인 대시보드 ────────────────────────────
  - id: REQ-201
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-10-20 사용자 요청으로 전체 질의 목록의 등록 진입을 연결했다. 후속 지적으로 변경·추가 입력의 단독 등록을 제외하고 기존 입력 분류/문맥 관계를 재사용하는 자격·판정 전 처리를 보완했다. 전체 보완 카드 확정은 별도다. 2026-09-15 사용자 결정 (CR-023) · 2026-09-29 사용자 결정(모델 생성 SQL 저장·실행마다 정책 실시간 적용 · 파라미터화 토큰 쿼터 차감 · 확정 근거로만 무효화 · 논리 삭제 · 판정 일치 시에만 캐시 · 대시보드 여러 개) · 2026-09-30 사용자 변경 결정(수정·덮어쓰기 대신 신규 저장 · 삭제 시 연결 위젯 자동 제거 · 인증 예제는 AI 활용 자산이며 공용 즐겨찾기가 아님) · 2026-09-30 사용자 결정(즐겨찾기 수정·위젯 제외, 오류 상태·재시도 복구, 조회별 실패 이력·신고·통합 조사 연결) · 2026-09-30 사용자 재확정(승격 후보의 요청·기술 검토·최종 승인 후 반영)"
    process_step: PRC-02-07
    title: "질의 즐겨찾기와 저장된 조회를 구분한다"
    detail: "질의 즐겨찾기는 자연어 질의문을 저장하고 실행하면 새 턴으로 처리된다(LLM 호출·토큰 소모). 저장된 조회는 REQ-202의 성공한 조회 실행 요청과 해석문을 저장하고, 실행 요청을 복원해 턴·LLM 호출 없이 agent의 공통 조회 실행 경로에서 처리한다. 요청의 재현이지 과거 결과나 권한의 재현은 아니다"
    why: "성격이 반대이므로 하나의 기능으로 합치지 않는다"
    roadmap: RM-P1
    acceptance: "세션의 모든 사용자 질의 목록에서 favorite_eligibility에 따른 독립 질의를 턴 상태와 무관하게 본인 즐겨찾기로 등록하고 기존 관리에서 조회·수정·삭제할 수 있다. 등록 자체에는 새 턴·모델 호출이 없다. 본인 즐겨찾기는 성공 조회 여부와 무관하게 문장을 수정할 수 있고 전송 시 일반 질의 통제를 거쳐 새 턴·모델 사용량을 만든다. 즐겨찾기는 위젯으로 등록되지 않는다. 저장된 조회는 REQ-202의 실행 요청을 복원해 실행하며 새 턴·모델 호출·토큰 사용량을 만들지 않는다"
    summary: "질의 즐겨찾기는 자연어 문장을 저장해 매번 새 턴으로 처리하고, 저장된 조회는 성공한 실행 요청을 보존·복원해 턴·모델 호출 없이 처리한다. 두 경로를 한 기능으로 합치지 않는다"
    intent:
      problem: "매일 같은 조건으로 조회하는 사용자에게 대화는 느리고 토큰을 쓴다(ECO-02). 반대로 조건이 매번 달라지는 질문은 SQL로 고정하면 쓸 수 없다"
      goal: "반복 조회는 토큰 없이 같은 조회로, 자유 질문은 대화로 — 사용자가 두 경로를 구분해 고른다"
      not:
        - "즐겨찾기를 저장된 조회로 자동 전환하는 기능이 아니다"
        - "사용자 간 공유 기능이 아니다(REQ-205·NGOAL-09)"
    goal_trace: [ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "저장된 조회는 성공한 조회에서만 만들어진다(REQ-202)"
    data:
      - { item: "질의 즐겨찾기(자연어 질의문)", origin: "portal 사용자 입력", sensitivity: "일반(자유 문장 — REQ-107 open 참고)", retention: "사용자가 지울 때까지(portal 소유)" }
      - { item: "저장된 조회 실행 정의(REQ-202의 조회 실행 요청·해석문·저장 근거·현재 상태)", origin: "agent 저장 처리", sensitivity: "내부(SQL·물리명은 portal에 내보내지 않음 — REQ-104)", retention: "논리 삭제 뒤 보관 기간 배치로 파기(REQ-204·agent 소유)" }
    favorite_eligibility:
      basis: "목록에서의 등록 자격은 기존 질의 처리에서 확정한 입력 종류·응답 대상·문맥 의존 관계로 판정한다(REQ-007·031·035·107). 카드 종류·연결 관계는 서버가 확인하고 자연어 해석은 기존 처리의 분류 결과를 재사용한다. 즐겨찾기 자격 판정을 위한 별도 LLM 호출·문장 생성·키워드 추측은 하지 않는다"
      allow: "독립 질의로 분류됐고 과거 질의/결과를 필수 전제로 하지 않는 사용자 질의문을 등록한다. 원 턴의 접수·대기·처리·완료·실패·중단 여부와 성공 결과 유무는 자격 조건이 아니다. 새 턴이라는 사실만으로 독립 질의라고 간주하지 않는다"
      exclude: "기존 질의의 조건 변경, 추가 정보/확인 질문에 대한 답변, 승인·거절·중단 조작, 이전 질의/결과에 의존하는 후속 입력은 문장 그대로 등록하지 않는다. 변경·추가 입력은 목록에서 유지하고 등록 불가 사유와 확인된 원 질의 참조 정보를 표시한다. 원 질의는 목록에서 선택해 REQ-014의 응답 레이어로 확인하며 본문 원본 위치로 이동시키지 않는다"
      pending: "기존 처리의 분류가 미완료·불명확하거나 저장된 문맥 의존 근거가 없으면 등록 가능으로 추정하지 않고 판정 전으로 표시한다. 정상 처리에서 결과가 확정되면 갱신하며 등록을 위해 별도 분류 호출을 보내지 않는다. 누락된 관계/분류 기록은 REQ-107.history_storage에서 보완한다"
      editing: "조건을 바꿔 저장하려면 독립된 원 질의를 등록하고 기존 즐겨찾기 관리에서 사용자가 문장을 수정할 수 있다. 여러 입력이나 이전 답변을 자동 합성해 완성 질의로 저장하지 않는다. 사용자가 직접 작성·수정하는 즐겨찾기는 기존 관리 기능이며 의미 검사를 위해 별도 LLM을 호출하지 않는다"
    business_rules:
      - "REQ-014의 세션 사용자 질의 목록에서 '자주 쓰는 질의로 등록' 버튼으로 현재 접근 가능한 질의문을 개인 질의 즐겨찾기에 등록할 수 있다. 원 턴의 상태·성공 여부와 무관하게 제공하되 favorite_eligibility에 따라 변경·추가 응답·문맥 의존 입력과 판정 전 항목은 등록을 비활성화하고 사유를 표시한다. 질의문만 저장하고 답변·SQL·실행 상태·승인·결과 사본을 자동 복제하지 않는다"
      - "목록에서 등록한 항목도 기존 즐겨찾기 관리의 조회·수정·삭제와 입력창 반영을 동일하게 제공한다. 등록/관리 자체는 별도 LLM 호출·새 턴·도구 실행을 만들지 않으며 저장된 조회나 위젯을 생성하지 않는다. 동일 등록 요청의 연타·응답 유실 재전송은 기존 등록 결과를 확인한다"
      - "즐겨찾기를 누르면 질의문이 채팅 입력란에 들어가고, 사용자가 보내야 새 턴이 된다"
      - "본인의 질의 즐겨찾기 문장은 자유롭게 수정·삭제한다. 성공 조회 여부나 기존 질문과의 의미 일치는 저장·수정 조건이 아니며, 실제 전송 시에는 일반 질의의 현재 권한·정책·쿼터 검사를 적용한다"
      - "질의 즐겨찾기는 대시보드 위젯으로 등록할 수 없다. 위젯 대상은 저장된 조회뿐이다(REQ-206)"
      - "저장된 조회 실행은 REQ-202·207의 요청 복원·현재 정책 검증으로 처리하며 턴·모델 호출·토큰 사용량을 만들지 않는다. 원 요청이 같아도 현재 업무 데이터·권한·기본 필터 정책에 따라 실행 결과는 달라질 수 있다"
      - "저장된 조회 실행은 쿼터에서 차감하지 않는다 — 대신 유량 제한(NFR-005)이 브레이크다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
    lifecycle: "해당 없음 — 저장된 조회의 상태는 REQ-204가 갖는다"
    permissions:
      - "본인의 즐겨찾기·저장된 조회만 보고 실행한다: ACT-001"
      - "Portal 화면/API 접근은 ARCH-050.portal_account_contract.access의 별도 Portal 인증·현재 이용 조건·본인 범위로 판정한다. system 관리자 역할/메뉴 권한이나 특정 역할명으로 Portal 접근을 허용하지 않는다"
    audit: "즐겨찾기 실행은 일반 턴 이력(REQ-107)으로, 저장된 조회 실행은 경로를 구분한 실행 이력(REQ-207)으로 남는다"
    volume: "사용자당 저장 개수 상한은 NFR-005 — 실측 후 정한다"
    config:
      - "저장 개수 상한은 admin 설정(FEAT-025)으로 배포 없이 바꾼다"
    risk: "사용자가 둘을 혼동하면 즐겨찾기로 토큰을 계속 쓰거나 저장된 조회에 자유 질문을 기대한다 — 화면 문구로 구분한다(03-glossary 헷갈리는 짝)"
    relations:
      depends_on: []
      constrains: [REQ-014, REQ-202, REQ-206, REQ-207]
      conflicts_with: []
      nfr: [NFR-005]
      interfaces: []
    realization:
      features: [FEAT-106, FEAT-121, FEAT-122, FEAT-220]
      screens: [SCR-101, SCR-103, SCR-104]
    examples:
      - { kind: 정상, case: "매주 월요일 '지난주 A창고 출고 건수'를 보는 사용자는 저장된 조회를 눌러 토큰 없이 같은 조회를 받는다" }
      - { kind: 정상, case: "완료·중단·처리 중인 독립 질의의 목록 항목에서 자주 쓰는 질의로 등록하면 같은 개인 즐겨찾기 관리에 나타난다. 등록으로 질의를 실행하지 않으며 이후 입력창에 불러와 사용자가 전송할 때 새 턴이 된다" }
      - { kind: 예외, case: "'요즘 반품이 왜 늘었지?'처럼 매번 다른 분석이 필요한 질문은 즐겨찾기로 저장하고, 입력창에 불러와 전송할 때마다 새 턴으로 처리돼 토큰을 쓴다" }
    volatility: { level: low, what: "두 경로의 구분은 제품 원칙이다. 상한값만 고객사마다 다르다" }
    verification:
      - { case: "독립 질의로 분류된 완료·실패·중단·진행 중 항목", expected: "상태·성공 여부와 무관하게 등록하고 등록만으로 새 턴·모델 호출을 만들지 않는다" }
      - { case: "아니 1번 창고 말고 2번 창고 / 추가 정보 답변인 2번 창고", expected: "변경 입력·대기 응답의 기존 분류/연결을 근거로 등록을 비활성화하고 사유와 원 질의 참조 정보를 표시한다. 목록/레이어에서 본문 원본 위치로 이동하지 않는다" }
      - { case: "그중 재고가 없는 것만 / 그 결과를 표로", expected: "별도 새 턴이어도 이전 문맥에 의존하면 단독 등록하지 않는다" }
      - { case: "새로운 독립 질의에 아니·추가 같은 단어가 포함됨", expected: "단어 검색으로 제외하지 않고 확정된 입력 종류·문맥 관계를 따른다" }
      - { case: "분류 전·불명확·과거 기록의 관계 누락", expected: "판정 전으로 표시하고 등록 전용 모델 호출은 0건이다. 정상 처리 결과 확정 시 갱신한다" }
      - { case: "원 질의 등록 후 사용자 문장 수정·다시 사용", expected: "기존 관리에서 수정하며 여러 입력을 자동 합성하지 않는다. 선택은 입력창 반영이고 전송 시 새 턴을 만든다" }
    open:
      - "@defer P3 입력 종류·문맥 관계·판정 전/불가 사유의 저장/조회 계약과 목록 등록 자격 검증 6건을 구체화한다. 기존 일반 질의 분류를 재사용하며 즐겨찾기 전용 LLM 호출을 추가하지 않는다"
    maturity: {"level":"confirmed","at":"2026-10-22","by":"AI — 사용자 명시 요청으로 추가 보완본 재확정","confirmed_by":"사용자 — 2026-10-22 추가 보완되어 재확정이 필요한 네 요구사항의 전체 보완본을 명시 확정했다. 전체 질의 목록에서 기존 개인 즐겨찾기 등록, 변경·추가 응답·문맥 의존 입력의 단독 등록 제외와 기존 입력 분류 재사용·판정 전 처리를 포함하며 단계 게이트·상세 설계·소스 구현 승인은 별도다."}
  - id: REQ-202
    type: functional
    priority: should
    actors: [ACT-001]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-29 사용자 결정(모델 생성 SQL 저장·실행마다 정책 실시간 적용 · 파라미터화 토큰 쿼터 차감 · 확정 근거로만 무효화 · 논리 삭제 · 판정 일치 시에만 캐시 · 대시보드 여러 개) · 2026-09-30 사용자 변경 결정(수정·덮어쓰기 대신 신규 저장 · 삭제 시 연결 위젯 자동 제거 · 인증 예제는 AI 활용 자산이며 공용 즐겨찾기가 아님) · 2026-09-30 사용자 결정(즐겨찾기 수정·위젯 제외, 오류 상태·재시도 복구, 조회별 실패 이력·신고·통합 조사 연결) · 2026-10-02 사용자 명확화·요구사항 반영 요청(기본 필터 제외를 포함한 성공한 LLM 조회 실행 요청을 보존하고 agent 입력으로 재현)"
    process_step: PRC-02-07
    title: "성공한 조회를 새 항목으로 저장 — 수정·덮어쓰기 없음"
    detail: "사용자는 최종 응답에 사용된 성공한 조회 결과에서 해당 결과를 만든 LLM의 조회 실행 요청을 새 항목으로 저장할 수 있어야 한다. 저장 대상은 SQL 문자열만이 아니라 기본 필터 제외 명세와 업무 인자를 포함한 실행 요청이며, 재실행에서는 같은 계약의 agent 입력으로 복원한다. 사용자 SQL 입력과 저장 실행 정의의 수정·덮어쓰기는 제공하지 않으며 다른 조회는 채팅에서 새로 조회·저장한다"
    why: "기존 조회를 교체하면 연결 위젯의 컬럼·타입·집계 단위·업무 의미가 달라질 수 있다. 수정과 신규 SQL을 모델이 구분하거나 결과 호환성을 판정하는 경로 대신, 저장 항목을 분리해 기존 대시보드가 바뀌지 않게 한다"
    roadmap: RM-P1
    acceptance: "최종 응답에 사용된 성공한 결과의 도구 종류·계약 버전·데이터소스·생성 SQL·업무 인자·기본 필터 제외 명세가 실행 요청으로 함께 보존되어 같은 계약의 agent 입력으로 복원된다. 취소 필터 제외는 복원 후에도 남아 있고 삭제·상태 필터 제외로 바뀌지 않는다. 사용자 SQL 입력과 기존 실행 정의의 수정·덮어쓰기는 제공되지 않으며 새 저장 항목이 기존 조회·위젯을 바꾸지 않는다. 과거 정책 적용 결과·허용 판정은 재사용하지 않는다(REQ-207·611)"
    summary: "성공한 조회의 실행 요청 전체를 재현 가능한 단위로 보존한다. SQL·업무 인자·기본 필터 제외를 함께 복원하며, 새 요청은 새 항목으로만 저장하고 기존 실행 정의와 위젯은 바꾸지 않는다"
    intent:
      problem: "사용자 SQL 입력은 검증·출처 추적을 우회하고, 기존 실행 정의의 교체는 연결 위젯의 결과 구조와 의미를 바꿀 수 있다"
      goal: "성공한 조회 실행 요청의 구조·조회 의도를 보존해 LLM 없이 같은 agent 입력으로 재현하고, 새 조회가 기존 대시보드를 바꾸지 않게 한다"
      not:
        - "SQL 편집기가 아니다"
        - "실패하거나 상한으로 거부된 조회를 저장하는 기능이 아니다"
        - "저장된 조회의 자연어 수정·새 버전 교체 기능이 아니다 — 기존 SQL을 모델에 전달해 수정 여부나 위젯 호환성을 판정하지 않는다"
        - "실행할 때 이미 정의된 파라미터 값을 입력하는 것은 실행 정의 수정이 아니다(REQ-203)"
        - "LLM의 대화 메시지 전체·사고 과정·공급사별 응답 포맷·과거 실행 결과를 그대로 재생하는 기능이 아니다"
    goal_trace: [INV-01, ECO-02]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "조회 턴의 생성 SQL과 실행 SQL이 이력으로 남아 있다(REQ-104·REQ-107)"
    data:
      - { item: "저장 근거(원 턴·회차·결과 블록·성공한 조회 도구 호출 식별자·원 질의문·해석문·저장 시각)", origin: "agent 이력", sensitivity: "일반(자유 문장)", retention: "저장된 조회와 같다" }
      - { item: "저장된 조회 실행 요청(조회 도구 종류·계약 버전·대상 데이터소스·정책 주입 전 생성 SQL·업무 인자·REQ-203의 파라미터 명세·REQ-611의 기본 필터 제외 명세와 사용자 요청 근거)", origin: "성공한 LLM 조회 도구 호출을 agent가 검증·정규화한 입력", sensitivity: "내부 — REQ-203.sensitive_constants에 따라 민감 상수·기본값을 제거한 실행 정의만 저장", retention: "저장 후 교체하지 않으며 보관·파기는 REQ-204를 따른다" }
    business_rules:
      - "등록은 최종 응답을 만든 회차에서 실행에 성공한 조회 결과 블록에서만 한다. 버려진 회차·실패·상한 초과로 거부된 조회(REQ-106)는 저장할 수 없다"
      - "한 턴에 조회가 여럿이면 결과 블록마다 따로 저장한다"
      - "2026-10-02 사용자 결정: 저장 단위는 최종 성공 결과를 만든 LLM의 조회 도구 호출을 agent가 검증·정규화한 실행 요청이다. 공급사별 메시지 원문이 아니라 조회 도구 종류·계약 버전과 그 계약이 허용하는 실행 인자를 빠짐없이 보존한다. 임의 도구·업무 변경 API 호출·자유 프롬프트를 실행 요청으로 저장하거나 재현하지 않는다"
      - "정규화는 허용 필드를 같은 계약 구조로 담는 처리이며 SQL·대상·기본 필터 제외 의도를 임의 변경하지 않는다. 저장 시 파라미터화는 REQ-203의 사용자 확인과 검증을 거친 변경만 허용하며 제외 명세는 보존한다. 거절한 비민감 후보만 원 값으로 남으며, 민감값은 REQ-203.sensitive_constants를 통과하지 못하면 저장하지 않는다"
      - "SQL은 서버 정책 주입 전의 생성 SQL을 보존한다. 권한·행 스코프·기본 필터·마스킹의 적용 결과와 과거 허용 판정은 복원할 실행 인자에 넣지 않으며, 당시 판정의 감사 보존과 재실행 입력을 구분한다(REQ-107·207)"
      - "기본 필터 제외 명세는 실행 요청의 일부이며 원 요청 근거와 함께 보존한다. 빈 제외 목록도 명시적으로 표현해 전부 기본 적용과 요청 정보 유실을 구분하고, 복원 시 명세를 누락하거나 문구에서 다시 추론하지 않는다(REQ-611)"
      - "저장할 때마다 별도 식별자의 새 항목을 만든다. 기존 항목의 실행 요청·파라미터 명세·기본 필터 제외 명세를 수정하거나 새 리비전으로 교체하지 않는다"
      - "저장된 조회 화면은 해석문과 파라미터만 보이고 SQL 원문·물리명은 보이지 않는다(REQ-104)"
      - "조건·결과 구성을 바꾸려면 채팅에서 새로 조회하고 성공한 결과를 별도 항목으로 저장한다. 기존 조회와 연결 위젯은 그대로 두고, 새 조회를 쓰는 위젯은 사용자가 새로 추가한다"
      - "기존 조회의 삭제는 사용자가 직접 요청한다. 삭제 영향 안내와 연결 위젯 제거는 REQ-204를 따른다"
      - "저장 실행 정의의 SQL·업무 인자·파라미터 기본값과 저장용 설명은 REQ-203.sensitive_constants의 서버 검사를 통과해야 한다. 원 호출 식별자로 출처를 연결하되 민감 원값을 저장 자산에 복제하지 않으며, 마스킹 문자열을 실제 실행 상수로 저장해 조회 의미를 바꾸지 않는다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-07이 갖는다"
      - "사용자당 저장 개수 상한(NFR-005)을 넘으면 저장을 거부한다"
    lifecycle: "해당 없음 — 저장된 조회의 상태는 REQ-204가 갖는다"
    permissions:
      - "본인 조회 결과에서만 저장한다: ACT-001"
      - "Portal 화면/API 접근은 ARCH-050.portal_account_contract.access의 별도 Portal 인증·현재 이용 조건·본인 범위로 판정한다. system 관리자 역할/메뉴 권한이나 특정 역할명으로 Portal 접근을 허용하지 않는다"
    audit: "저장 요청과 근거 턴·회차·성공한 조회 도구 호출·결과 블록을 연결하고, 저장 시 정규화·파라미터화의 검증 및 사용자 확인을 남긴다. 원 호출 식별자는 출처 참조이며 재실행의 실행 식별자로 재사용하지 않는다(REQ-107·207)"
    volume: "해당 없음 — 개수는 REQ-201·NFR-005"
    config: "해당 없음"
    risk: "성공한 조회라도 정확성을 보증하지 않으며 오류는 품질 신고(REQ-110)로 처리한다. 실행 요청 정규화·파라미터화·계약 호환 처리에서 인자나 제외 의도가 유실되는 위험은 P3의 실제 저장/복원 계약 시험으로 검증한다"
    relations:
      depends_on: [REQ-104, REQ-201, REQ-611]
      constrains: [REQ-203, REQ-205]
      conflicts_with: []
      nfr: [NFR-005]
      interfaces: []
    realization:
      features: [FEAT-122, FEAT-220]
      screens: [SCR-104]
    examples:
      - { kind: 정상, case: "'이번 달 A창고 출고 건수' 조회가 성공하면 결과 블록의 저장 버튼으로 저장되고, 목록에는 해석문 'A창고 · 이번 달 · 출고 건수'가 보인다" }
      - { kind: 정상, case: "'반품을 제외한 출고 건수'가 필요하면 채팅에서 새로 조회하고 별도 항목으로 저장한다. 기존 '출고 건수' 조회와 위젯은 유지되고, 새 조회를 보려면 새 위젯을 추가한다" }
      - { kind: 예외, case: "기존 조회는 일자·건수, 새 조회는 상품·수량·금액을 반환해도 별도 항목으로 저장되므로 기존 위젯의 필드와 결과는 바뀌지 않는다. 기존 항목을 새 결과로 덮어쓰는 경로는 없다" }
      - { kind: 정상, case: "'취소 주문도 포함한 이력'의 성공한 도구 호출에서 데이터소스·생성 SQL·업무 인자·취소 필터 제외 식별자/리비전·요청 근거를 하나의 실행 요청으로 저장한다. 재실행 입력에서도 그 제외 명세가 그대로 남으며 회사·조직·업무 권한은 현재 값으로 판정한다" }
      - { kind: 예외, case: "버려진 회차의 최초 SQL과 성공한 재작성 SQL이 다르면 최종 결과에 연결된 성공 호출만 저장한다. 다른 호출의 기본 필터 제외 목록을 섞지 않는다" }
      - { kind: 예외, case: "전화번호 상수를 포함한 조회의 파라미터화를 거절하면 저장을 거부한다. 전화번호 원값이나 마스킹 문자열을 실행 정의·기본값·저장 설명에 대신 남기지 않는다" }
    volatility: { level: low, what: "등록 경로 제한은 통제 원칙이라 고객사마다 달라지지 않는다" }
    open:
