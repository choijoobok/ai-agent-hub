  - id: REQ-207
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-29 사용자 결정(모델 생성 SQL 저장·실행마다 정책 실시간 적용 · 파라미터화 토큰 쿼터 차감 · 확정 근거로만 무효화 · 논리 삭제 · 판정 일치 시에만 캐시 · 대시보드 여러 개) · 2026-09-30 사용자 변경 결정(수정·덮어쓰기 대신 신규 저장 · 삭제 시 연결 위젯 자동 제거 · 인증 예제는 AI 활용 자산이며 공용 즐겨찾기가 아님) · 2026-09-30 사용자 결정(즐겨찾기 수정·위젯 제외, 오류 상태·재시도 복구, 조회별 실패 이력·신고·통합 조사 연결) · 2026-10-02 사용자 명확화·요구사항 반영 요청(저장된 실행 요청을 LLM 도구 호출과 같은 agent 입력으로 복원하되 현재 정책으로 실행) 2026-10-26 사용자 결정: RM-P3 워크플로우는 자연어로 정의한 예약 배치와 대화창 수동 실행을 지원하며, 액션별 자동 승인은 사용자 요청·관리자 검토·활성화 승인을 거친다. REQ-404·405의 한정된 예외를 연결하며 전체 보완본 확정은 별도다"

    process_step: PRC-02-07
    title: "LLM 을 거치지 않는 실행 경로의 통제"
    detail: "저장된 조회와 REQ-404의 검증된 정적 워크플로우 조회 단계는 LLM을 호출하지 않으므로 실행 시 모델용 컨텍스트 필터링이 없다. 워크플로우의 계획 생성/변경 또는 별도로 정의한 모델 판단 단계는 REQ-404와 공통 모델 호출 통제를 따른다. 저장된 조회는 REQ-202의 실행 요청을 최초 LLM 조회 도구 호출과 같은 계약의 agent 입력으로 복원하고 동일한 SQL 검증·정책 적용·실행 경로로 전달해야 한다. 참조 객체 대조를 주 방어선으로 삼고 현재 권한·신원·기본 필터 제외 허용·마스킹·조회 상한과 시간 제한을 다시 판정한다"

    hard_rule: "**정의는 과거의 권한으로 만들어졌고 실행은 현재의 권한으로 판정한다.** 저장 시점의 판정 결과를 캐시해 재사용하지 않는다 — 캐시하면 그룹 변경이 반영되지 않아 과거 권한으로 실행된다"
    roadmap: RM-P1
    acceptance: "저장된 조회는 기본 필터 제외를 포함한 실행 요청을 복원해 최초 조회와 같은 agent 검증·실행 경로를 거치고 LLM을 호출하지 않는다. 계약 미지원·필수 인자/제외 명세 유실·현재 정책 검증 실패 시 SQL만으로 대신 실행하지 않는다. 제외 필터의 리비전 변경·제외 불가이면 과거 허용을 재사용하지 않는다(REQ-611). 각 실행에는 새 실행 ID와 현재 권한·신원·필터·마스킹·상한 판정이 있으며 실패도 고유 발생으로 기록한다. 재시도 대기 중 차단은 실행 오류를 만들지 않는다"
    summary: "저장된 실행 요청을 LLM 조회 도구 호출과 같은 agent 입력으로 복원해 공통 검증·실행 경로에서 처리한다. 모델 호출은 없고 모든 권한과 정책은 현재 값으로 판정한다. 요청 재현과 과거 허용 재사용을 구분한다"
    intent:
      problem: "이 경로에는 컨텍스트 필터링이 없다 — 이미 SQL이 있기 때문이다. 저장 당시 판정을 믿으면 권한이 줄어도 과거 권한으로 실행된다"
      goal: "정의는 과거에 만들어졌어도 실행은 언제나 지금의 권한으로 판정한다"
      not:
        - "채팅 턴의 내용 버전 고정(REQ-108·TRM-158)이 아니다 — 턴이 없으므로 실행 한 번이 내용 선택 단위다. 접근 권한은 두 경로 모두 실제 접근 시점에 확인한다"
        - "상한을 채팅보다 완화하는 경로가 아니다(NFR-005)"
    goal_trace: [INV-01]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023. 판정 규칙은 고객사별 조정 대상이 아니다"
    preconditions:
      - "저장된 조회에 파라미터 명세가 있다(REQ-203)"
      - "카탈로그의 접근 그룹·마스킹·행 스코프 정책과 신원 매핑이 있다(REQ-101·CON-021)"
    data:
      - { item: "저장된 조회 실행 이력(전역 고유 조회 ID·소유자·개별 실행 ID·사용자·경로(수동·위젯 자동·워크플로우)·시각·바인딩 마스킹 사본·실행 SQL·판정 결과·적용 정책/스키마 근거·성공/실패·결과 지문·행 수·소요 시간)", origin: "agent", sensitivity: "업무 데이터 값은 마스킹 사본(PRN-07)", retention: "감사 이력 보존 정책(REQ-107)" }
      - { item: "개별 실행 실패(오류 발생 ID·실행 ID·실패 단계·실패 유형·오류 코드·정제된 사유·관련 자산)", origin: "agent 판정·실행", sensitivity: "내부, 권한 거부와 처리 장애 구분", retention: "실행 이력 보관 정책. 신고·조사 증거는 별도 보존(REQ-110·REQ-115)" }
    business_rules:
      - "실행마다 ① 참조 객체 재추출 ② 현재 사용자 그룹 대조 ③ 데이터소스 접근 그룹 판정 ④ 현재 신원 매핑으로 행 스코프·현재 기본 필터 재주입 ⑤ 현재 컬럼 모드로 마스킹 재적용 ⑥ 조회 상한·타임아웃 적용을 모두 한다"
      - "2026-10-02 사용자 결정: 저장 조회는 REQ-202의 실행 요청에서 REQ-203의 현재 파라미터를 바인딩해 원래 조회 도구 호출과 같은 계약의 입력을 복원한다. LLM 직접 호출·저장 조회·위젯 조회는 FEAT-204의 동일한 SQL 검증·정책 적용·실행 경로를 사용하고 별도 SQL 직접 실행으로 우회하지 않는다"
      - "복원 시 조회 도구·계약 버전·필수 실행 인자·명시적 제외 목록을 검증한다. 계약 미지원·입력 불완전·제외 명세 유실이면 실행을 거부한다. SQL만 꺼내거나 과거 문구에서 제외를 추론해 대신 실행하지 않는다. 계약 호환 처리도 조회 의도와 제외 명세를 보존한 경우에만 허용한다"
      - "저장된 신원·인증정보·권한 바인딩·과거 승인/허용 결과는 실행 인자로 재사용하지 않는다. 서버가 현재 실행자 신원을 신뢰된 경로로 바인딩하고 참조 객체를 재추출해 현재 정책을 판정한다. 기본 필터 제외 명세도 현재 리비전·해제 허용·사용자 의도를 다시 검증한다(REQ-611)"
      - "빈 제외 목록은 현재 기본 필터 전부 적용을 뜻한다. 유효한 제외 항목만 빼고 나머지 기본 필터와 모든 행 스코프를 적용한다. 필터 변경·제외 불가 시 실행을 거부하며 원 요청의 의미를 조용히 바꾸지 않는다(REQ-611)"
