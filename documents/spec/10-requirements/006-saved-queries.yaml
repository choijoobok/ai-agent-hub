      - { item: "위젯 결과 캐시", origin: "agent 실행 결과", sensitivity: "업무 데이터(메모리 전용)", retention: "TTL 안에서만 메모리에 둔다 — DB에 저장하지 않는다(NFR-005)" }
    business_rules:
