  - id: REQ-205
    type: "functional"
    priority: "should"
    actors:
      - "ACT-001"
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-29 사용자 결정(모델 생성 SQL 저장·실행마다 정책 실시간 적용 · 파라미터화 토큰 쿼터 차감 · 확정 근거로만 무효화 · 논리 삭제 · 판정 일치 시에만 캐시 · 대시보드 여러 개) · 2026-09-30 사용자 변경 결정(수정·덮어쓰기 대신 신규 저장 · 삭제 시 연결 위젯 자동 제거 · 인증 예제는 AI 활용 자산이며 공용 즐겨찾기가 아님) · 2026-09-30 사용자 결정(즐겨찾기 수정·위젯 제외, 오류 상태·재시도 복구, 조회별 실패 이력·신고·통합 조사 연결) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: "PRC-02-07"
    title: "개인 조회를 AI용 인증 예제 쿼리로 승격한다"
    detail: "관리자가 유용한 개인 저장 조회를 현재 인증 예제 변경 권한으로 선택해 SQL/참조 검증과 노출 그룹을 갖춰 인증 예제 전체 구성으로 직접 저장한다. 개인 조회는 원 소유자에게 그대로 남고 다른 사용자의 즐겨찾기/위젯을 만들지 않는다. 실제 AI 활용은 REQ-302의 현재 자격·SQL 통제를 따른다."
    traces_to:
      - "NGOAL-09"
    roadmap: "RM-P1"
    acceptance: "인증 예제 현재 변경 권한·SQL/참조 기술 검증·기대 버전·전체 이력 성공 후에만 노출 그룹의 AI 활용 후보로 제공한다. 관리자 승인 요청/전결·지식 영향 검토 작업을 만들지 않고 원 개인 조회를 공유/복제하지 않는다."
    summary: "사용 빈도를 참고해 관리자가 개인 조회를 검수하고 AI용 인증 예제 후보로 등록하고 세트 승인 절차를 거쳐 반영한다. 허용 그룹은 채팅에서의 예제 활용 범위이며, 공용 즐겨찾기나 공용 조회 메뉴를 만드는 것이 아니다"
    intent:
      problem: "정의를 공유하면 같은 위젯이 사람마다 다른 결과를 보이거나 누군가에게는 거부되는데, 존재 은닉 때문에 그 이유를 설명할 수 없다(NGOAL-09)"
      goal: "좋은 조회를 검수된 전사 자산으로 모아 정확도와 재사용을 함께 높인다"
      not:
        - "사용자 간 공유·복사 기능이 아니다"
        - "사용 빈도로 자동 승격하는 기능이 아니다 — 관리자 검수를 거친다"
        - "그룹 공용 즐겨찾기나 사용자가 목록에서 눌러 실행하는 공용 조회 메뉴가 아니다"
    goal_trace:
      - "SUC-02"
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "인증 예제의 검수·노출 그룹과 반영 세트 요청·기술 검토·최종 승인 절차가 있다(REQ-302·305·306)"
    data:
      - item: "저장된 조회 사용 빈도(사용자 수·실행 수·기간)"
        origin: "실행 이력 집계"
        sensitivity: "내부"
        retention: "실행 이력 보존 정책(REQ-107)"
      - item: "승격 근거(원 저장된 조회·검수자·시각·노출 허용 그룹)"
        origin: "admin"
        sensitivity: "내부"
        retention: "인증 예제 쿼리 이력"
    business_rules:
      - "사용자 간 공유는 제공하지 않는다"
      - "노출 허용 그룹은 누구의 채팅에서 예제를 활용할 수 있는지를 제한한다. 승격으로 사용자별 즐겨찾기·저장된 조회·대시보드 위젯을 만들지 않는다"
      - "승격해도 원 개인 저장된 조회는 소유자에게 그대로 남는다"
      - "승격된 예제 쿼리도 실행할 때 SQL 통제를 면제받지 않는다(REQ-302)"
      - "승격은 현재 인증 예제 변경 권한자가 REQ-302·305·306의 직접 저장·기술 검증·전체 이력으로 수행한다. 개인 조회나 원 소유자 권한을 자동 확대하지 않는다."
    exceptions:
