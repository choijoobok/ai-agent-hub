    business_rules:
      - "2026-10-06 사용자 정정: 대상 시스템에는 사용자 그룹 매핑이나 적용 가능 그룹 목록을 두지 않는다. 개별 API의 호출 허용 그룹과 현재 권한 판정은 REQ-105·REQ-611을 따른다. 이 시스템의 API라는 이유로 다른 API의 호출 권한을 부여하거나 제한하지 않는다"
      - "API 연결 설정은 도메인/기본 주소·인증 방식과 비밀 참조·공통 고정 헤더를 한 묶음으로 정의하고 식별자를 붙인 것이다. 주소·인증·헤더는 한 설정의 구성 항목이다. 설정 원천은 배포 yml이며 보호 규칙은 REQ-403을 따른다"
      - "배포 설정에서는 같은 도메인에 인증 없음·토큰 인증 등 서로 다른 인증·헤더 구성을 여러 연결 식별자로 정의할 수 있다. 여러 호스트/인증 구성 때문에 대상 시스템을 강제로 나누지 않는다. 인증 여부는 조회/실행 유형과 별도로 실제 API 계약에 따라 정한다"
      - "대상 시스템 관리에서는 로드된 연결 식별자 중 이 시스템에서 사용할 목록을 매핑하고, 그 목록에서 기본 연결을 지정한다. 추가로 허용하는 연결도 이미 배포 설정에 정의된 연결이다. 화면에서 실제 접속 주소·인증값·공통 고정 헤더를 새로 정의하거나 복제하지 않는다"
      - "API별 연결 선택은 REQ-608을 따른다. 시스템 허용 연결 목록은 선택 가능한 범위이고 기본 연결은 공통 선택값이다. 연결 하나를 사용하도록 허용해도 실제 API 호출 권한은 별도로 판정한다"
      - "기본 연결 변경·허용 연결 제거 전에 영향받는 API를 확인하고 REQ-601의 참조 검증을 적용하고 반영 후 확정 스냅샷을 저장한다. 해당 시스템이 제공하는 API가 사용 중인 연결 참조를 끊거나 모르는 연결로 자동 대체하지 않는다"
      - "시스템 변경만으로 API 계약·자격증명·신원 매핑을 자동 변환하지 않는다. 공동 오픈 근거는 REQ-113·REQ-608에서 관리한다"
    connection_display:
      decision: "2026-10-30 사용자 요청: 관리자가 화면만 보고 현재 연결의 Base URL과 인증 방식을 확인한다. 접속 설정 편집·비밀 열람과 구분한 읽기 전용 표시다"
      source: "연결 후보와 정확 식별자 관측에서 현재 프로세스에 로드된 동일 불변 연결 정의를 사용한다. nodeId·bootId·appliedSettingsId·observedAt를 함께 제공하고 배포 파일의 다음 기동 예정값이나 다른 노드 값을 현재 적용값처럼 표시하지 않는다"
      scope: "허용 연결 선택 후보와 저장된 각 허용 연결의 현재 관측에 Base URL·인증 방식·표시 상태를 제공한다. 같은 호스트라도 경로·포트·인증 방식이 다른 연결을 구분하며 기본 연결도 해당 식별자의 표시를 따른다"
      safe_url: "서버가 표시 전용 주소를 구성한다. scheme·host·port와 비밀이 없음을 확인한 기본 경로만 표시하고 userinfo·query·fragment는 제거한다. 경로의 비밀 구간 또는 비밀 여부를 확인하지 못한 구간은 표시 제한으로 가린다. 안전한 주소를 구성할 수 없으면 값을 제공하지 않고 표시 제한 사유를 반환한다. 원문·ENC 암호문·비밀 참조·설정 객체를 브라우저에 보낸 뒤 가리는 방식을 허용하지 않는다"
      authentication: "실제 채택한 인증 방식의 허용된 코드/명칭만 표시한다. 토큰·API 키·계정·비밀번호·인증/공통 헤더 값·마스터 키와 비밀값 해시는 제공하지 않는다. 방식 표시는 해당 방식의 구현·인증 성공 보장이 아니다"
      states: "AVAILABLE=정상 표시, REDACTED=일부 주소 정보를 제거/가림, UNAVAILABLE=안전한 현재 표시값 없음이다. 연결 존재 관측 PRESENT/MISSING/UNAVAILABLE와 별개이며 표시 제한을 연결 누락이나 접속 실패로 바꾸지 않는다. MISSING/관측 실패에서는 이전 주소·인증 방식을 현재값으로 재사용하지 않고 비워 사유를 안내한다"
      permissions: "서버가 대상 시스템 메뉴 READ와 현재 주체의 연결 조회 범위를 검사한다. SAVE 없이 조회할 수 있고 EXPORT는 READ·EXPORT를 함께 검사해 같은 안전한 표시 열만 제공한다. Portal·LLM·실행 도구 인자로 전달하지 않으며 READ 회수/대상 변경/재조회 실패 때 화면의 이전 표시를 제거한다"
      persistence: "표시는 관리 저장 입력·이력 스냅샷·명령 지문/성공 결과에 포함하지 않는다. 클라이언트가 주소·인증 방식을 저장/덮어쓰려 하면 거부하며 실제 호출은 표시 문자열이 아니라 ARCH-028의 서버 연결 해석·현재 권한·승인 대상 대조를 사용한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "기본/개별 연결 참조가 해석되지 않으면 해당 API 호출을 차단한다. 업무 사용자가 보낸 임의 주소·인증정보로 복구하지 않는다"
    lifecycle: "신규 선택 가능 여부·폐지·사용 중 참조 보호는 REQ-601을 따른다. 연결 없는 등록 초안과 실제 호출 가능 상태는 구분하며 호출에 필요한 유효 연결은 사용 전에 확인한다"
    permissions:
      - "ACT-003·ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601", "REQ-403"]
      constrains: ["REQ-608"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-001"]
      screens: ["SCR-001"]
    examples:
      - {"kind":"정상","case":"예시로 같은 기본 주소 https://order.example.com에 ORDER-PUBLIC(인증 없음)·ORDER-AUTH(토큰 인증과 공통 고정 헤더) 두 연결을 배포 설정에 정의한다. 주문 시스템 SYS-ORDER의 허용 연결 목록에 두 식별자를 매핑하고 기본 연결은 ORDER-PUBLIC으로 지정한다. 공개 주문 조회 API는 시스템 기본 연결 사용, 주문 저장 API는 ORDER-AUTH를 선택한다. 조회/저장에 따른 인증을 자동 추정하는 규칙은 아니다"}
      - {"kind":"정상","case":"같은 주문 시스템이 제공하는 주문 조회 API의 호출 허용 그룹은 G-VIEW, 주문 저장 API의 호출 허용 그룹은 G-WRITE로 각각 매핑한다. 대상 시스템에 그룹 목록을 만들지 않으며 G-VIEW 소속만으로 주문 저장 API의 호출 권한을 얻지 않는다. 호출 권한·신원 매핑의 나머지 조건은 REQ-105·REQ-609·REQ-611을 따른다"}
      - {"kind":"예외","case":"다른 시스템 전용 BILLING-AUTH가 배포 설정에 있어도 SYS-ORDER의 허용 연결 목록에 없으면 주문 API에서 선택·저장할 수 없다. 주문 저장 API가 사용하는 ORDER-AUTH를 허용 목록에서 제거하려 하면 차단하고 해당 API를 안내한다"}
      - {"kind":"예외","case":"주문 API가 시스템 기본 연결 사용을 선택했는데 기본 연결이 없거나 그 식별자를 해석할 수 없으면 호출을 차단한다. ORDER-AUTH 등 다른 연결로 자동 대체하지 않는다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    approval_target: "연결 기본값·설정 재적재로 승인 후 실제 호출 대상이 바뀌는 경우는 REQ-105.approval_target_binding을 따른다. 기본/개별 선택의 해석과 변경 적용 설계는 이 승인 결합·전송 직전 대조를 포함한다. connection_display는 관리 화면의 관측이며 실행 승인 근거를 대체하지 않는다"
    open: ["@defer P2 연결 선택·해석·승인 대상 비교의 구조는 ARCH-028에 정리했다. API 연결 설정의 재적재/변경 반영 시점·노드 간 현재 효력·적용 식별자와 검수 근거 전달은 ARCH-028.deployment_contract.pending에서 확정한다"]
    maturity: {"level":"confirmed","at":"2026-10-27","by":"AI — 사용자 권장안 반영 요청 적용","confirmed_by":"사용자 — REQ-604 전체 카드 명시 확정. API별 제공 시스템 지정·허용 연결 목록/기본값·API별 연결 선택·대상 시스템 그룹 매핑 제외를 포함하며 P2 연결 해석/변경 반영 계약은 후속 설계로 유지 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 연결 변경과 실행 승인 결합 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."}

  - id: REQ-605
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
    source: "2026-10-31 사용자 후속 정정 — 사용자 그룹의 자산 네 탭은 조회 전용, 사용자 소속 탭만 직접 관리. 자산 매핑은 각 자산 전체 저장·이력에 포함한다. 최초 다섯 탭 요청과 관리자 간 승인 철회 결정(ADR-037), 2026-09-30 기준정보 분석·2026-10-06 대상 시스템 그룹 제외 결정을 따른다."
    process_step: "PRC-13-01"
    title: "Hub 사용자 그룹 정의·참조 현황 관리"
    detail: "보안 담당자는 전역 Hub 사용자 그룹을 생성·수정하고 사용자 소속을 직접 부여/회수한다. 지식/인증 예제·스키마 카탈로그·API·커스텀 도구 네 탭은 현재 매핑과 접근 제약의 조회만 제공한다. 자산 매핑 변경은 각 자산 관리 화면에서 전체 구성과 함께 저장하며 같은 자산 리비전의 전체 이력에 포함한다. 사용 중인 그룹의 삭제는 차단한다."
    roadmap: "RM-P1"
    acceptance: "그룹 등록 후 사용자·자산 매핑에서 같은 안정 그룹을 참조한다. 사용자 탭은 활성화 여부·메모를 편집해 원 소유 부여/회수 계약으로 직접 저장한다. 자산 네 탭은 읽기 전용 스위치와 현재 제약을 표시하며 변경 권한이 있어도 행 추가·저장·삭제·사유 입력을 제공하지 않는다. 조회·행 선택으로 자산 현재값·리비전·이력이 바뀌지 않는다. 상단 그룹 정의 저장은 사용자 소속이나 자산 매핑을 포함하지 않는다."
    summary: "업무 자산 접근의 공통 그룹 어휘를 한 곳에서 관리하고 소속·자산 매핑 사용처를 확인한다"
    intent:
      problem: "업무 자산 접근 그룹과 메뉴 역할·쿼터 등급이 혼용되거나 사용 중인 그룹이 삭제되면 접근 통제가 무너진다"
      goal: "업무 자산 접근의 공통 그룹 어휘를 한 곳에서 관리하고 소속·자산 매핑 사용처를 확인한다"
      not:
        - "system 메뉴·액션 역할이나 조직도 자체가 아니다"
        - "쿼터 등급이나 주 추론 모델 허용 기준이 아니다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
