# 영역: 기준정보 공통·모델·연동·그룹
requirements:
  - id: REQ-601
    approved_change:
      change: "CR-026"
      at: "2026-10-27"
      contract: "ARCH-029"
      status: "사용자 방향 승인·상세 계약/구현 대기"
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
      - "ACT-003"
      - "ACT-004"
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — 기존 기준정보 관리 기능 전반과 사용자 요청; 2026-10-01 정련 질문 사용자 결정 반영 · 2026-10-08 사용자 결정: 구축/운영 공통 관리 승인 설정과 저장자 전결 처리(ADR-023) · 2026-10-22 사용자 요청: 동일 대상의 미종결 변경 요청 제한·제출본 고정·취소 후 재요청을 관리 승인 전반의 공통 원칙으로 정리 · 2026-10-31 사용자 명시 결정: 관리자 간 모든 권한·자산 변경 승인 철회, 제한된 변경권한자의 직접 저장과 이력 유지"
    process_step: "PRC-13-01"
    title: "기준정보 관리 범위·공통 속성·참조 보호"
    detail: "관리자는 Hub가 반복 참조하는 정의·매핑·운영 기준을 항목별로 조회·등록·변경하고, 사용처와 변경 영향을 확인할 수 있어야 한다. 각 상세 항목은 REQ-602~616에 둔다. 이 묶음은 모든 기준정보를 한 화면이나 범용 코드 테이블에 저장하라는 요구가 아니다"
    roadmap: "RM-P1"
    acceptance: "자산·권한·사용자 그룹 소속 변경은 현재 변경 권한자가 직접 저장하며 별도 관리자 승인 대기·전결·승인 사용 설정을 만들지 않는다. 권한/참조/기준 버전 검증 실패나 이력 저장 실패는 해당 현재값 변경도 함께 실패한다. 변경 전후 전체 구성·실제 변경자·시각·사유·결과를 재현한다. Portal 사용자가 관리자에게 신청하는 승인과 실제 실행의 사용자 명시 확인은 유지한다."
    summary: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
    intent:
      problem: "관리 기능이 분산되어 관리 원천·식별자·사용처·변경 영향이 불명확하다"
      goal: "대상별 속성·사용처·관리 권한·적용 경계를 명시하고 참조를 깨뜨리는 변경을 막는다"
      not:
        - "고객·상품·창고 같은 레거시 업무 기준정보를 Hub에 복제하는 통합 마스터 관리가 아니다"
        - "지식·인증 예제·스키마 카탈로그의 기존 정본이나 system 구현을 새로 만드는 요구가 아니다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "기존 요구사항·정책·자산 변경 절차와 system의 구현된 관리 기능을 우선 참조한다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - item: "공통 식별: 변하지 않는 내부 식별자, 표시명, 설명, 해당 대상의 업무 키"
        origin: "관리자 입력·Hub 발급"
        sensitivity: "내부 관리 정보 — 비밀값 원문 제외"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "사용 상태와 적용 기준: 신규 선택 가능 여부, 적용 시점 또는 적용 월, 대상별 상태"
        origin: "대상별 기존 규칙 및 신규 초안"
        sensitivity: "내부 관리 정보 — 비밀값 원문 제외"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "관리 근거: 소유 관리 영역, 변경자·시각·사유, 변경 전후 값 또는 리비전 참조"
        origin: "Hub 변경 이력"
        sensitivity: "내부 관리 정보 — 비밀값 원문 제외"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "참조 현황: 참조하는 기준정보·매핑·업무 자산과 설정, 해당 대상의 과거 사용 기록 연결"
        origin: "Hub 참조 조회"
        sensitivity: "내부 관리 정보 — 비밀값 원문 제외"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
    field_usage:
      - attribute_group: "공통 식별"
        used_for: "이름 변경과 관계없이 참조·이력을 연결한다"
      - attribute_group: "사용 상태와 적용 기준"
        used_for: "현재 사용할 값과 과거 기록을 구분한다. 모든 대상에 동일 상태 기계를 강제하지 않는다"
      - attribute_group: "관리 근거"
        used_for: "어떤 관리값이 왜 변경됐는지 추적한다"
      - attribute_group: "참조 현황"
        used_for: "삭제·사용 중지·연결 변경 전에 영향을 확인한다"
    consumers:
      - where: "admin 기준정보 관리"
        when: "등록·변경·삭제 검토 시"
        how: "항목별 상세 정의와 기존 승인·월 적용·배포 경계를 사용한다"
      - where: "agent·portal"
        when: "선택지 제공·컨텍스트 구성·실행·권한 판정 시"
        how: "해당 목적의 유효 기준만 참조한다. 화면 선택 제한만으로 서버 판정을 대체하지 않는다"
    business_rules:
      - "2026-10-01 사용자 결정(ADR-017): 그룹·쿼터 등급·태그 등 기준정보의 특성에 따라 참조·이력을 명확히 조회할 수 있으면 삭제·비활성화 전에 유효성을 검증한다. 참조나 이력이 있다는 이유만으로 모든 항목을 일괄 삭제 금지하지 않으며 기존 항목별 규칙상 제약이 없으면 삭제할 수 있다. 참조 조회 실패는 참조 없음이 아니다"
      - "대상 시스템·데이터소스 직접 변경은 ADR-035의 반영 후 확정 전체 스냅샷을 별도 이력에 저장한다. 다른 대상의 시점은 각 소유 계약을 따른다. 대상 식별·변경 순서·처리자·시각·사유·작업 종류를 연결한다. 스냅샷 저장과 현재 데이터 갱신은 같은 트랜잭션으로 처리하며 동시 변경은 같은 이전 버전을 중복 덮어쓰지 않게 검증한다"
      - "관리자 계정·메뉴·역할·공통코드·메시지·시스템 설정·배치 정의는 REQ-501~508을 참조하며 admin에 중복 등록하지 않는다. Portal 이용자는 REQ-616의 별도 관리 메뉴를 두고 조직 정보는 인증·인사 원천을 구분한다. 컬럼 의미 유형·값 도메인·조인 정보는 REQ-301, 지식 태그·동의어는 REQ-303을 따른다"
      - "월별 배정·실제 사용량·품질 신고·오류·조사·평가 실행 결과·개인 저장 조회는 처리 기록 또는 사용자 자산이다. 기준정보와 연결하되 기준정보 목록으로 혼합하지 않는다"
      - "신규 공통안: 내부 식별자를 재사용하지 않고 표시명 변경으로 참조가 바뀌지 않게 한다. 삭제·연결 변경으로 유효 참조를 고아로 만들지 않으며, 제거가 막히면 사용처를 권한 범위 안에서 안내한다"
      - "변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
      - "등록·수정·비활성화·허용된 삭제와 사용자 그룹 소속 추가/중지·자산 매핑 변경 모두 같은 직접 관리 경계를 적용한다. 원 소유의 전체 세트·현재 권한·참조 보호와 쿼터 적용 월을 유지한다."
      - "관리 화면은 현재 적용본과 로컬 편집본을 구분한다. 서버 저장 초안·제출본·관리자 요청 원장·SNP를 새로 만들지 않는다. 과거 보존 근거와 실제 적용 이력은 변경하거나 삭제하지 않는다."
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "사용 중인 데이터소스를 삭제하려 하면 관련 카탈로그가 있다는 사실과 조치 대상을 안내하고 삭제하지 않는다"
    request_integrity:
      scope: "Portal 사용자가 관리자에게 신청하는 쿼터 승급·추가 토큰의 승인에만 적용한다. RM-P3 자동화 활성화는 REQ-405의 별도 계약을 따른다. 관리자 자산/권한/그룹 변경은 direct_management의 직접 저장이다."
      target_identity:
        - kind: "쿼터 등급 승급"
          key: "Portal 이용자. REQ-117의 월을 넘겨 유지되는 사용자당 처리 대기 1건을 따른다"
        - kind: "추가 토큰 사용"
          key: "Portal 이용자 + 신청 적용 월. 같은 달 미종결 신청은 1건이며 앞 신청의 종결 후 필요하면 별도 신규 신청할 수 있다"
      single_pending: "각 Portal 신청의 업무 키별 미종결 신청은 최대 1건이다. 승인 후 반영/복구 중·결과 불명도 포함하고 신청자·탭·전송키 변경으로 우회하지 않는다. 쿼터 예약 성공은 처리 완료다."
      immutable_submission: "접수한 요청의 대상·작업 종류·변경 내용·요청 사유·기준 버전·참조 스냅샷을 고정한다. 요청자·검토자·승인자도 대기 중 이를 편집·교체하지 않는다. 검토 의견·승인/반려 사유·실제 승인량 등 단계별 처리 결과는 별도 이력으로 추가하며 제출 원문을 덮어쓰지 않는다"
      change_and_resubmit: "제출 후 내용을 바꾸려면 현재 유효 요청/변경 권한을 확인해 기존 요청을 취소하거나 반려 등 미반영 종결을 확인한 뒤 새 요청을 제출한다. 기존 요청·단계별 근거와 연결을 보존하고 새 요청 ID·스냅샷으로 필요한 검토·승인을 다시 받는다. 이전 요청의 승인·검토 완료 상태를 새 요청에 승계하지 않는다"
      decision_binding: "승인·반려·취소는 요청 ID·버전·허용 선행 상태·현재 처리 권한과 기준 유효본을 함께 확인한다. 취소·반려·만료·제거로 무효화된 건과 변경 전 요청에 대한 늦은 승인으로 권한·운영 데이터·한도를 만들거나 되살리지 않는다. 동일 처리 재전송은 중복 활성화·중복 지급 없이 기존 결과를 반환한다"
      race_and_completion: "접수·상태 전이·반영의 경합은 서버에서 검증해 동시에 성공하지 않게 한다. 취소와 승인 중 먼저 유효하게 확정된 상태를 기준으로 나머지 처리를 거부하거나 이미 처리된 결과를 안내한다. 승인 후 반영 중이거나 결과가 불명인 건을 단순 취소 완료로 바꿔 제한을 풀지 않는다. 반영 완료 또는 미반영 종결을 확정한 뒤 다음 요청을 허용하며 이미 반영된 변경의 되돌리기는 새 변경 절차를 따른다"
      scheduled_effect: "쿼터 승급처럼 원래 미래 적용을 정한 업무는 REQ-117·116의 적용 예약 기록을 성공적으로 확정하면 요청 처리가 완료된 것으로 본다. 업무가 의도한 미래 발효일 대기를 반영 실패/미완료로 취급하지 않으며 적용 월 잠금·예약 충돌 등 기존 규칙은 유지한다"
      domain_results: "REQ-119의 신청량 이하 부분 승인과 REQ-117의 승인 적용 월은 제출 내용 변경이 아닌 처리 결과다. 원 신청량·희망 등급·신청 시각을 보존하고 동일 신청을 중복 지급/예약하지 않는다."
      verification:
        - case: "기존 요청 취소 후 새 내용 제출과 이전 승인 도착"
          expected: "새 요청만 검토·승인 대상이며 이전 승인으로 활성화하지 않는다. 전후 요청과 취소 이력을 보존한다"
        - case: "두 담당자·탭의 동시 접수 또는 취소/승인 동시 처리"
          expected: "대상별 미종결 요청은 한 건이고 상태 전이는 허용된 하나만 성공한다. 중복 지급·활성화가 없다"
        - case: "승인 뒤 반영 실패 또는 복구 중 같은 대상 신규 요청"
          expected: "기존 처리 결과가 확정될 때까지 새 요청을 거부한다. 임의 종결로 제한을 풀지 않는다"
        - case: "동월 추가 토큰 중복 신청·부분 승인, 승급 미래 적용 예약"
          expected: "미종결 추가 신청은 한 건, 부분 승인량은 별도 결과로 한 번만 지급한다. 승급 예약 확정은 요청 처리 완료이며 적용 월 정책은 유지한다"
