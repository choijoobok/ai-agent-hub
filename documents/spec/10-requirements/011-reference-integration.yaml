    change_history:
      decision: "2026-10-30 사용자 명시 결정·답변. 단일 그리드는 성공한 변경 행 전체 컬럼, 마스터/하단 탭은 모든 소유 관리 테이블을 한 이력 번호로 저장하고 원 관리 화면과 같은 구조의 별도 메뉴에서 조회한다. 공통 절차는 aidd-guide/artifact/screen/overlay/history-pattern.md다."
      single_grid: "기존 행별 저장/부분 성공 단위를 유지하며 성공한 변경 행의 전체 관리 컬럼을 복사한다. 전체 테이블·현재 조회 페이지를 복사하지 않는다."
      master_tabs: "기준 정보 또는 한 탭만 저장해도 같은 실제 반영된 소유 저장 문맥의 마스터와 모든 관리 자식을 같은 HISTORY_NO로 복사한다. 미변경 탭도 포함하며 기존 독립 저장을 현재 마스터 전체 수정으로 바꾸지 않는다. 대상별 소유 테이블과 판/후보 문맥을 history_mapping에 선언한다."
      naming: "이력 테이블은 원본 테이블명 뒤 _HIST를 붙인다. PK는 모든 이력 테이블마다 HIST_ID 단일 BIGINT 서로게이트 키이며 기존 SYS_SEQUENCE/JPA TABLE 발급 규칙을 사용한다. HISTORY_NO는 세트 연결 키이고 원 키와 HISTORY_NO의 중복은 별도 유일 제약으로 차단한다."
      time: "원본 REG_DTM/MOD_DTM은 당시 값을 그대로 복사한다. HIST_DTM은 이력 저장일시로 마스터 이력(단일 그리드는 해당 행 이력)에만 저장한다. 서버가 UTC Instant를 한 번 정하고 자식은 HISTORY_NO와 원 부모 키로 마스터 시각을 참조한다. 자식 HIST_DTM·자식별 now/시각 기본값은 두지 않는다. 미변경 원본 MOD_DTM은 갱신하지 않으며 커밋 완료 시각을 뜻하지 않는다."
      summary: "서버가 저장 전후의 업무 값/집합을 비교해 기준 정보와 실제 변경된 탭 이름을 원 화면 순서로 중복 없이 열거한다. 복사한 모든 탭을 변경 목록으로 적거나 클라이언트 요약을 신뢰하지 않는다. 생성/삭제·특수 명령의 작업 종류를 별도로 보존하고 값이 같은 명시 성공 저장은 변경 없음으로 구분한다."
      atomicity: "동일 부모의 모든 소유 쓰기는 같은 잠금/일관성 경계에서 현재값 변경과 전체 복사·HISTORY_NO/시각·성공 결과를 한 트랜잭션으로 확정한다. 자식 복사 실패 시 전체를 롤백한다. 동일 명령 재전송은 원 HISTORY_NO를 반환하고 행별 부분 성공은 각 성공 단위별로만 남긴다."
      view: "각 관리 화면의 별도 이력 메뉴·SCR·READ/EXPORT를 둔다. view_kind=change_history와 source_screen으로 원 관리 화면의 조회조건/컬럼/배치/탭을 상속하고 상단 변경 요약과 이력 저장일시 범위만 추가한다. 별도 이력 요건서/목업은 수기로 복사하지 않는다. 관리 화면의 변경 이력 탭·JSON 스냅샷 모달은 제거한다."
      grid_audit: "2026-11-01 사용자 확정: 추가 전용 이력 그리드의 기본 감사 컬럼은 등록자·등록일시 두 개이며 이력 기록자와 이력 저장일시에 매핑한다. 원본 등록/수정 감사값은 스냅샷으로 그대로 보존한다. 자식 기록일시는 같은 HISTORY_NO 마스터의 HIST_DTM을 참조하며 자식 시각 컬럼을 신설하지 않는다. 사용자 업무 컬럼 목록에 없어도 기본 표시하고 사용자 명시 제외만 허용한다."
      query: "원 조회조건은 당시 복사값에 적용한다. 이력 저장일시 범위는 histFrom/histTo로 UTC Instant를 사용하고 시작 포함·끝 제외다. 양끝을 함께 지정하거나 함께 생략하며 시작>=끝은 거부한다. 기본값·상한은 기존 조회 제한을 따르고 미정 숫자를 운영 기본값으로 추정하지 않는다. 선택은 이력 종류+원 ID+HISTORY_NO로 검증하며 현재 행이 삭제돼도 이력만 읽는다."
      read_only: "별도 이력 메뉴의 현재 READ/EXPORT와 대상별 열람/반출 정책을 서버에서 검사한다. 저장·추가·삭제·승인·실행·복원 동작은 제거한다. 원본 변경 권한을 이력 READ에 강제하지 않으며 이력 권한이 현재 변경 권한을 부여하지 않는다."
      exclusions: "배포 원문·비밀·비밀번호 해시/토큰, 타 소유 사용처, 실시간 관측/샘플/세션/캐시/실행 로그는 복사하지 않는다. 당시 관리 저장 대상이 아닌 탭은 현재 조회로 채우지 않는다. 실제 적용본의 과거 내용은 HIST로 읽는다."
      retention: "일반 관리 기능은 이력을 append만 한다. 파기는 소유 보존/조사 보호 정책에 따라 세트 전체를 처리하고 현재 원본 삭제에 연쇄 삭제하지 않는다. 타입/스키마 변경은 원본과 모든 _HIST를 같은 변경에서 현행화하며 누락/미지원 과거 구조를 현재값으로 대체하지 않는다. 적용 이력이 실행용 정확 리비전도 제공하므로 management_storage.history_resolution의 참조 보호를 함께 검사한다."
      rollout: "admin 화면 요건·목업을 먼저 확정한 뒤 해당 관리 구성의 물리/공개 계약과 구현을 진행한다. system 이력 도입 계획은 사용자 정정으로 철회했다. 계획 합의와 G3/구현 승인은 별개다."
      save_point: "권한자의 직접 저장으로 실제 반영된 관리/운영값을 같은 트랜잭션에서 HIST로 보존한다. 로컬 편집·검증 실패·미반영 과거 요청은 적용 이력으로 만들지 않는다. 과거 요청 원문·판정 근거는 legacy 정책으로 보존하며 새 관리자 요청/SNP는 생성하지 않는다."
      scope: "이번 동형 변경 이력은 admin 모듈의 관리 데이터에만 적용한다. system 모듈에는 새 변경 이력 저장 테이블/메뉴를 추가하지 않는다. system의 기존 로그·업무 이력은 현재 소스 계약을 따른다."
    direct_management:
      decision: "2026-10-31 사용자 명시 결정·ADR-037"
      scope: "admin 사용자가 다른 admin 사용자에게 요청하던 자산·권한·그룹 추가 등 모든 관리 변경 승인 절차를 철회한다. 단독 매핑·본문·계약·노출·그룹·활성/중지·삭제에도 같다."
      permissions: "변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
      atomicity: "전체 실제 변경 대상의 현재 권한·필수 참조·기대 버전과 업무 제약을 검증한다. 본 데이터·전체 변경 이력·리비전·멱등 성공 결과는 기존 소유 저장 단위마다 함께 성공/실패한다. 복합 변경의 일부만 반영하지 않는다."
      audit: "변경 전후 전체 관리 구성 또는 이를 정확히 재현하는 이력 참조, 실제 변경자·시각·사유·작업 종류·기준/결과 버전·검증 근거를 보존한다. 저장자를 승인자로 가장하거나 별도 전결 기록을 생성하지 않는다."
      least_privilege: "소수의 업무 전문가와 관리자에게 대상별 메뉴/액션의 변경 권한을 명시 부여하고 조회·반출·변경을 분리한다. ADMIN 역할명이나 화면 표시만으로 허용하지 않고 모든 쓰기 경로에서 현재 유효 권한을 검사한다."
      preserved: "Portal 사용자의 쿼터 승급·추가 토큰 및 RM-P3 자동화 활성화 신청 승인, 실제 실행의 사용자 명시 확인, 배포·코드 검수·고객사 외부 API 공동 오픈과 프로젝트 단계 게이트는 각각의 소유 계약을 유지한다."
      legacy: "과거 요청·제출/검토·승인/반려 근거는 보존 정책에 따라 읽기 전용으로 유지한다. 기존 미반영 요청을 자동 승인/반영하거나 전결·직접 저장으로 변환하지 않는다. 늦은 승인 API/콜백은 현재값을 변경할 수 없다. 필요한 변경은 최신 적용본과 현재 권한으로 새 직접 저장한다."
      verification:
        - case: "일반 조회자가 자산 매핑 또는 사용자 그룹 추가 저장 API를 호출"
          expected: "서버 현재 변경 권한 검사로 거부하고 현재값·이력 불변"
        - case: "변경 권한자가 자산 또는 그룹 소속을 저장"
          expected: "관리자 요청/승인/전결 기록 없이 즉시 검증·원자 반영하고 전후 전체 이력을 남김"
        - case: "과거 승인 대기 건 또는 늦은 승인 콜백 도착"
          expected: "과거 근거만 유지하며 현재값·권한을 자동 반영/부활시키지 않음"
        - case: "전체 이력 저장 실패·기준 버전 충돌"
          expected: "현재값과 리비전을 바꾸지 않고 입력/원 명령 근거로 결과 확인"
    management_storage:
      scope: "지식·카탈로그·예제·태그·업무 API·도구·권한 등 admin 관리 구성의 현재 직접 저장과 적용 이력에 적용한다."
      management_view: "목록·상세는 최신 적용본을 조회한다. 수정 중에는 기준 리비전과 로컬 편집값을 유지하고 저장 성공 뒤 실제 적용본을 다시 읽는다. 별도 관리자 요청 메뉴·서버 초안·제출/반려 상태를 제공하지 않는다."
      save_action: "현재 변경 권한자의 저장 하나로 전체 입력·참조·현재 권한·기대 버전을 검증하고 실제 반영과 이력을 원자 확정한다. 승인 요청/검토 완료/승인/전결 버튼·설정을 두지 않는다."
      stores: "본 테이블은 최신 적용값, 원본명_HIST는 실제 적용된 전체 관리 구성을 동형 컬럼으로 보존한다. 새 관리자 요청 원장·원본명_SNP는 만들지 않는다. 지식은 소유 본문·그룹·매핑/설명만 복사하고 외부 상세는 복사하지 않는다."
      revision: "업무 리비전 REVISION은 저장 단위인 원본 마스터에만 둔다. 탭만 바뀌어도 해당 마스터의 REVISION을 실제 반영 성공 시 정확히 한 번 증가시킨다. 자식 행에는 독립 리비전 카운터를 두지 않는다. 다른 자산의 정확 버전을 가리키는 참조 키는 이 카운터와 구분한다. 모든 자식 변경 경로는 같은 부모 잠금·기준 리비전 검사에 참여한다. 지식 소유 매핑은 REQ-303.reference_mapping에 따라 외부 자산의 안정 ID를 저장하며 참조 리비전 카운터/자동 동기화 대상을 만들지 않는다. 실제 실행용 정확 버전 근거와 구분한다."
      apply: "서버가 실제 변경 대상의 부모를 공통 순서로 잠그고 BASE_REVISION·신규 부재/업무키 유일성·필수 참조/기술 계약·현재 변경 권한을 검증한다. 본 데이터와 전체 자식·실제 수정자/시각·결과 REVISION·전체 HIST/HISTORY_NO·멱등 성공 결과를 같은 트랜잭션으로 확정한다. 하나라도 실패하면 모두 롤백한다. 같은 명령은 원 결과만 반환한다. 지식의 외부 안정 ID 매핑은 외부 리비전 상승만으로 거부하지 않는다."
      conflicts: "기준 리비전 불일치·권한 회수·참조 오류는 현재값/이력을 변경하지 않고 입력을 유지해 최신값 확인으로 연결한다. 저장 성공만 마스터 리비전을 한 번 증가시키고 자식은 독립 리비전을 두지 않는다. 결과 불명은 원 명령키로 확인하며 새 키의 중복 적용을 금지한다."
      history_resolution: "적용 이력 마스터는 원본 안정 ID+적용 REVISION에 대해 유일한 성공 반영 HISTORY_NO를 제공한다. 실행 소비자는 이 공개 조회로 정확한 _HIST 전체 세트를 읽고 현재값으로 대체하지 않는다. 삭제 직전 복사 이력은 삭제 사건으로 구분하여 동일 리비전의 성공 반영 매핑을 덮지 않는다. 실행 중·장기 대기·다른 보존 자산이 참조하는 이력과 그 전이 참조는 보호한다. 파기는 참조/보존 보호 확인과 새 참조 등록이 경합하지 않는 경계에서 세트 전체로 수행한다. 현재 권한·폐기 상태는 소비 시 별도 검사한다. 지식 운영 매핑이 과거 외부 리비전을 고정한다는 뜻이 아니며 실제 실행에서 기록한 정확 리비전 참조를 보호한다."
      legacy: "과거 요청·제출/검토·승인/반려 근거는 보존 정책에 따라 읽기 전용으로 유지한다. 기존 미반영 요청을 자동 승인/반영하거나 전결·직접 저장으로 변환하지 않는다. 늦은 승인 API/콜백은 현재값을 변경할 수 없다. 필요한 변경은 최신 적용본과 현재 권한으로 새 직접 저장한다."
  - id: REQ-602
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-004"]
    source: "2026-10-31 사용자 결정 — 외부 모델 사용 여부는 Portal 사용자 선택 허용 스위치다. 내부 용도·보조/운영 호출의 사용 여부와 분리한다. 기존 표시명/코드 분리·용도별 순위·그룹/등급 제한 없음·보조 판정만 자동 대체 결정을 유지한다."
    process_step: PRC-13-01
    title: "공급사·모델 조합과 용도별 사용 관리"
    detail: "운영 관리자는 공급 경로·모델·effort의 표시명/코드·실제 지원 조합과 Portal 선택 허용 여부를 등록한다. 사용자는 Portal 선택이 켜진 기술적으로 유효한 텍스트 생성 조합을 주 추론으로 선택한다. 내부 보조·운영·임베딩 용도는 Portal 선택 스위치와 독립인 관리자 지정 조합을 사용한다. 자동 대체는 보조 판정만 auxiliary_fallback을 따른다."
    roadmap: RM-P1
    acceptance: "동일 모델을 직접 경로와 게이트웨이 경로에 등록해 구분 선택·계량할 수 있다. 지원하지 않는 effort·기술적으로 무효/미확인 조합은 거부하고 그룹·쿼터 등급에 따른 모델 제한은 하지 않으며, 보조 판정 모델은 사용자 선택에 따라 바뀌지 않는다. Portal의 모델 선택 복구는 model_selection_recovery를 따른다. 모델 사용 불가 응답 뒤 브라우저 새로고침 없이 현재 허용 목록을 재조회하고, 목록에서 제외된 선택은 미선택으로 바꾸며 질의는 유지한다. 남은 모델이 하나여도 자동 선택·자동 재전송하지 않고 사용자가 다시 선택·전송한다. 허용 목록 없음과 재조회 실패를 구분해 안내하며 서버의 시작 전 유효성 검사를 유지한다. 보조 판정의 승인된 일시 장애만 auxiliary_fallback에 따라 후보를 전환하며 후보 소진·금지 오류·미동의·예산 소진은 더 호출하지 않는다. 주 추론의 일시 장애는 primary_availability_recovery로 안내한다."
    summary: "등록 조합의 Portal 선택 허용과 내부 용도·우선순위를 구분한다. Portal 후보는 모든 사용자에게 동일하며 그룹·등급별 모델 제한은 두지 않는다."
    intent:
      problem: "표시명만으로는 실제 API/CLI 호출 값을 알 수 없고 공급사별 모델·effort 지원 범위가 달라 임의 조합이 만들어질 수 있다"
      goal: "공급사→모델→지원 effort의 표시명/코드를 등록한 뒤 유효한 조합을 골라 업무 용도·우선순위·설명을 설정한다"
      not: ["자동 난이도 판정이나 주 추론·시스템 운영·임베딩의 자동 대체 라우팅이 아니다","화면에 API 키·비밀번호를 저장하는 기능이 아니다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - { item: "외부 모델 기준정보: 공급사 표시명/관리코드·배포 연결 참조, 모델 표시명/호출 모델 코드·유형, 모델별 effort 표시명/전송 방식/전송 코드·Portal 선택 허용 여부", origin: "관리자 등록 — 실제 연결/어댑터의 지원 근거 대조", sensitivity: "일반 관리 정보, 접속 주소·키·비밀번호 비노출", retention: "REQ-601의 적용 이력" }
      - { item: "용도 설정: 등록 모델·effort 참조, 용도·우선순위·설명", origin: "관리자 선택 — 기준정보의 기술 유효 조합만 후보(Portal OFF 포함)", sensitivity: "일반 관리 정보", retention: "REQ-601의 별도 적용 이력" }
      - { item: "실행 근거: 조합 안정 식별자·용도별 후보 설정 버전·선택한 순번·실제 공급 경로/호출 모델 식별값", origin: "검증된 등록 조합과 실제 실행", sensitivity: "내부 제어 정보", retention: "REQ-107의 소유 실행 이력" }
    field_usage:
      - { attribute_group: "공급사·모델·effort", used_for: "기준정보에서 표시명과 호출 코드를 구분해 등록하고 유효 지원 조합별 외부 모델 식별값을 정의한다. 용도 화면은 이 식별값 하나를 선택한다" }
      - { attribute_group: "용도", used_for: "주 추론 선택지 또는 보조 판정의 구체 작업·시스템 운영·임베딩의 관리자 지정 조합을 정한다. 사용자별 모델 사용 자격을 제한하는 값이 아니다" }
      - { attribute_group: "우선순위", used_for: "같은 보조 판정 용도의 1~3순위 자동 대체 순서다. 주 추론·시스템 운영·임베딩에는 적용하지 않는다" }
    registry_contract:
      screen: SCR-015
      row_unit: "한 행은 하나의 실제 공급사 연결·모델·effort 지원 조합이며 자동 부여하는 불변 외부 모델 식별값 하나를 갖는다. 물리 PK/API 필드명은 후속 설계다"
      fields: "외부 모델 식별값, 공급사 표시명/관리 코드·배포 연결 참조, 모델 표시명/호출 코드·유형, effort 표시명/전송 방식/전송 코드, 사용 여부(Boolean: Portal 사용자 선택 허용)·설명"
      presentation: "모델 표시명/모델 코드와 effort 표시명/effort 코드는 각각 별도 입력값이며 초기 그리드에 나란히 기본 표시한다. 표시명에서 전송 코드를 추론하거나 덮어쓰지 않는다. 용도 콤보에는 등록 표시명만 조합하며 실행은 안정 참조의 검증된 코드/전송 방식을 사용한다"
      identity: "표시명을 식별자로 쓰지 않는다. 같은 공급사/모델도 effort·실제 호출 경로/전송 코드가 다르면 다른 조합이다. 같은 유효 경로·모델 코드·effort 전송 방식/코드 조합의 중복 등록은 거부한다"
      validation: "공급사별 모델·effort의 명시 지원 조합만 등록한다. 표시명은 화면용이고 실제 API/CLI 호출은 해당 경로에서 검증한 정확한 모델/effort 코드를 사용한다. API/개발 CLI 코드가 다르면 해당 호출 경로별로 구분한다. 코드 입력만으로 미지원 어댑터가 생기지 않는다"
      effort: "값 전송이면 전송 코드 필수, 미전송이면 코드가 비어야 한다. 문자열 none/default 또는 숫자 단계로 임의 변환하지 않는다"
      changes: "현재 용도에서 외부 모델 식별값을 참조 중이면 기술 무효/보완 필요 참조도 포함해 삭제를 차단한다. 사용처 확인 실패도 삭제 불가다. 참조 이전/제거를 먼저 저장한 뒤에만 삭제 가능하며 용도 저장/등록 삭제 경합을 일관 검사한다. 참조 중 호출 코드·effort 전송 방식/코드·연결 교체도 거부하고 새 조합 등록 후 참조 이동을 안내한다. 표시명 변경은 안정 식별값을 유지하고 과거 실행/이력을 소급 변경하지 않는다"
      inactive: "사용 여부는 Portal 사용자 선택 허용 스위치다. OFF는 Portal의 새 주 추론 선택지에서만 제외하며 내부 용도·보조/운영 후보·가격 참조를 무효화하거나 호출을 일괄 중단하지 않는다. ON도 텍스트 유형·현재 연결/지원 조합이 유효해야 한다. 임베딩은 OFF만 허용하며 Portal 선택 대상이 아니다. 실행 중 시도의 고정 조합은 보존하고 다음 새 턴의 선택 검사는 model_selection_recovery를 따른다."
      price_history: "하단 단일 기간별 단가 그리드은 REQ-613.price_history_contract를 따른다. 같은 실제 경로/모델의 effort 조합 간 가격 이력을 공유하며 표시명 변경으로 가격 키를 바꾸지 않는다. 등록 편집본과 변경한 가격 구성은 같은 저장에서 원자 반영한다. 용도 참조뿐 아니라 가격/월 산정 참조도 삭제·호출 코드 교체 때 보호한다"
      history: "SCR-051이 탭 없는 상하 등록/단가 그리드을 함께 상속한다. 등록과 용도 설정은 각각 자기 기준본·실제 적용 이력을 갖는다"
    screen_contract:
      screen: SCR-062
      fields: [외부 모델, 용도, 우선순위, 설명]
      cell_editing: "외부 모델과 용도는 그리드 셀 안의 일반 콤보이며 선택 팝업/별도 적용 버튼을 두지 않는다. 설명은 일반 텍스트 셀 입력이다. 기존 DataGrid의 셀 편집과 후보 옵션 계약을 재사용한다"
      option_loading: "내부 용도용 외부 모델 후보는 SCR-015의 기술적으로 유효한 등록 조합에서 얻으며 Portal OFF도 포함한다. 표시명과 안정 식별값을 구분하고 로딩/실패/0건·기존 기술 무효 참조와 입력을 보존한다. 실제 조회 경로/전달 형식은 후속 설계다."
      purpose_source: "용도는 REQ-610·ADR-020에 따른 agent의 스텝 유형/LLM 통신 계약 소스가 정본이다. 소스가 제공하는 안정 코드·표시명 목록을 읽어 일반 셀 콤보를 구성하고 저장도 같은 계약으로 검증한다. 운영 공통코드 그룹이나 admin의 중복 하드코딩 목록으로 정의하지 않는다. purposes는 업무 표시명 목록이며 실제 소스 코드값은 개발 단계에 연결한다"
      selection: "외부 모델 콤보 하나의 표시값은 공급사 / 모델 표시명 / effort 표시명이다. 저장값은 SCR-015의 외부 모델 식별값 하나다. 실제 코드·연결·전송 방식은 그 식별값의 검증된 등록 리비전으로 해석하고 표시 문자열을 분해/재조합하지 않는다. 같은 표시명의 다른 연결은 연결명으로 구분한다"
      row_unit: "한 행은 용도에 지정한 외부 모델 참조·우선순위·설명이다. 모델/effort를 따로 입력하거나 중복 정의하지 않는다"
      purposes: [주 추론, 업무 연관성 판정, 카탈로그 선별, 질의 키워드 추출, 과거 턴 요약, 처리 중 입력 분류, 시스템 운영, 임베딩]
      primary_selection: "모든 사용자는 Portal 선택이 켜진 기술적으로 유효한 텍스트 생성 조합 전체에서 주 추론을 선택한다. 용도 미지정 및 보조/운영용 지정도 이 조건을 만족하면 포함한다. 임베딩과 Portal OFF는 제외하고 그룹·쿼터 등급·system 역할별 제한은 두지 않는다."
      default: "주 추론 기본 지정은 정상 최초 미선택에 적용할 수 있지만 Portal ON과 기술 유효성을 만족할 때만 자동 표시한다. 기본 지정이 OFF이면 현재 허용 후보에서 사용자 선택을 기다리고 다른 조합을 자동 선택하지 않는다. OFF는 기본/내부 용도 참조 삭제가 아니며 사용 불가 후 복구도 하나만 남아도 재선택·명시 전송을 기다린다."
      priority: "각 보조 용도는 1순위 필수·2/3순위 선택, 연속/유일·최대3개다. 주 추론 기본·시스템 운영·활성 임베딩은 용도별 한 조합이며 순위 해당 없음이다. 보조 판정에만 기존 허용 오류/동의/예산 검증 후 자동 대체한다"
      editing: "전체 용도 설정은 직접 원자 저장한다. 활성 업무의 필수 용도/기본 마지막 지정 제거는 대체 전 거부한다. 기술 무효/제거 참조는 이전 가능하게 보존한다. Portal OFF만으로 내부 지정·후보를 무효화하거나 제거하지 않는다."
      description: "용도별 선정 이유·사용 상황 메모이며 전송 코드/시스템 프롬프트/동의를 대신하거나 모델 입력에 자동 삽입하지 않는다"
      boundary: "코드/지원 조합은 등록 화면, 용도·순위·설명은 용도 화면 정본이다. 비밀은 배포 설정 참조이고 제품 구현·새 물리/API 상세는 전체 화면/업무 흐름 합의 뒤 별도다"
    consumers:
      - {"where":"portal 모델 선택","when":"새 턴·중단 후 새 시도 시작 전 및 모델 사용 불가 응답 수신 시","how":"screen_contract.primary_selection의 Portal ON·기술 유효 텍스트 조합을 선택지로 제공하고 model_selection_recovery에 따라 선택 목록을 복구한다"}
      - {"where":"agent 모델 호출·사용량 이력","when":"스텝 호출 시","how":"역할별 설정을 적용하고 공급 경로·모델·effort·역할을 기록한다"}
      - {"where":"지식 검색·임베딩","when":"본문/질의 벡터 생성 시","how":"동일 임베딩 모델·설정을 사용하며 교체 시 재임베딩한다"}
    business_rules:
      - "2026-10-01 사용자 확정: 관리자 프롬프트 검토 등 시스템 운영용 LLM 호출은 Portal 주 추론·보조 판정과 구분한 별도 공급 경로·모델·effort 설정을 사용한다. 관리자에게 쿼터 등급을 부여해 모델을 고르게 하지 않는다. 활성 경로·지원 모델/effort 조합을 검증하고 미설정·사용 불가 시 다른 모델로 자동 대체하지 않는다. 사용량은 REQ-116을 따른다"
      - "2026-10-01 사용자 확정: 주 추론 기본 모델이 Portal OFF·제외·미지원 상태이면 새 턴·새 시도를 시작하지 않고 현재 허용 모델 재선택을 안내한다. 다른 모델로 자동 대체하지 않으며 허용 모델이 없으면 관리자 확인을 안내한다"
      - "공급 경로와 제작사는 별개다. 같은 제작사 모델을 서로 다른 경로로 제공할 수 있고 단가는 경로·모델 단위다(ADR-004)"
      - "공급 경로 접속 주소는 LLM 공급사 또는 사내 게이트웨이의 API 호출 주소다. 연결 정의는 배포 설정에서 관리하고 화면은 설정 참조만 관리한다. 비밀 설정값의 암호화 yml·공통 복호화 연동·외부 마스터 키 관리·비노출과 현재 구현 여부는 REQ-403을 따르며 이 카드에서 별도 저장 정책을 정의하지 않는다"
      - "주 추론은 screen_contract.primary_selection의 공통 조합 중 사용자 선택 또는 관리자 기본값을 사용한다. 보조 판정은 사용자가 고르지 않는 관리자 지정 후보 순서를 사용하고 auxiliary_fallback에 한해서만 자동 대체한다. 사용자의 주 추론 설정을 대체 후보로 끌어오지 않는다(ARCH-040)"
      - "Portal 선택 OFF·기술 무효 조합은 당월에도 새 사용자 선택지에서 제외하며 이미 진행 중인 실행 시도는 시작 때 고정한 조합을 유지한다. 실행 시점의 현재 권한·보안/연결 검사는 유지한다. 중단 후 새 시도의 재선택은 ARCH-040을 따른다. 주 추론 기본 모델이 Portal OFF·제외·미지원이면 허용되지 않은 모델을 몰래 선택하지 않는다"
      - "임베딩 교체 시 기존 벡터 재생성과 본문·질의 임베딩 일치 조건은 ARCH-040을 따른다"
    auxiliary_fallback:
      decision: "2026-10-28 사용자 승인 — 보조 판정의 공급사 일시 장애에 한해 관리자 지정 총 3개 이내 후보를 순차 적용한다. 주 추론은 수동 재선택을 유지하고 시스템 운영·임베딩은 이번 자동 대체 범위에서 제외한다. 상세 설계 게이트·구현 승인은 별도다"
      scope: "ARCH-040의 보조 판정 역할 전체에 적용한다. 역할별 설정은 Portal 사용자 선택과 독립이며 사용자의 주 추론 선택을 보조 후보에 적용하지 않는다. 그룹·등급별 허용 모델 집합은 두지 않는다. 사용자 사용량 귀속·쿼터 통제는 REQ-116·NFR-012를 유지한다"
      candidates: "역할마다 1순위 필수, 2·3순위 선택으로 총 1~3개의 공급 경로·모델·effort 조합을 순서대로 관리한다. 순번은 연속·유일하며 같은 조합의 중복을 거부한다. 1순위 없는 저장, 미등록/비활성 연결·기술 무효 모델, 미지원 effort/역할 기능은 거부한다. 공급 경로가 모두 같으면 장애 분산의 한계를 안내하되 제작사 차이를 필수 조건으로 강제하지 않는다"
      compatibility: "각 후보의 배포 연결·호출 모델 식별값·입력/출력 한도·구조화 응답과 해당 역할의 필수 제어 지원 근거를 검증한다(REQ-003·009, ARCH-032). 미확인/미지원 후보를 저장·호출 가능으로 표시하지 않는다. 필수 입력·보안 조건·응답 계약을 줄여 후보에 맞추지 않는다"
      snapshot: "하나의 논리적 보조 작업을 시작할 때 후보 순서·설정 버전·입력 버전·목적을 고정한다. 대체 중 관리자 편집으로 후보를 끼워 넣거나 순서를 바꾸지 않는다. 같은 작업의 재접속·재개는 사용한 순번과 마감/예산을 보존한다. 별도 보조 작업은 당시 설정의 1순위부터 시작하며 이전 성공 후보로 영구 고정하지 않는다. 현재 권한·동의·보안/연결 유효성 검사는 후보마다 다시 수행한다"
      eligible_errors: "공급자 계약과 검증 근거로 일시적 수용량 부족 또는 일시 서비스 불가가 확인되고, 원 호출이 명확히 거절/오류 종료되어 적용 가능한 응답이나 진행 중 원격 작업이 없을 때만 다음 후보를 검토한다. at capacity 같은 문구나 HTTP 상태 하나만으로 판정하지 않는다. 원인·접수/종료 근거가 불명확하면 자동 대체하지 않는다"
      forbidden_errors: "인증·권한·정책/안전 거부, 계정 결제/쿼터 소진, 미지원 기능, 입력 한도 초과, 설정/계약·비밀 해석 실패, 빈/잘린/잘못된 응답, 접수/종료 불명, 부분 응답 뒤 단절·타임아웃·취소 미확인은 자동 대체 사유가 아니다. 단순 공급자 호출 제한도 일시 수용량 장애로 검증되지 않으면 대체하지 않는다"
      execution: "agent가 오류 분류와 다음 후보 전환을 결정한다. 후보 하나당 실제 전송은 최대 1회이며 SDK·HTTP·개발 CLI의 숨은 재전송을 허용하지 않는다. 1→2→3 순으로 이동하고 성공 즉시 종료한다. 미설정 후보는 호출하지 않으며 후보의 사전 검사 실패를 다른 후보로 건너뛰어 우회하지 않는다. 모든 실제 호출은 같은 논리 작업에 연결하고 현재 유효 결과 하나만 채택한다. 사용자 주 추론 변경·업무 재실행·새 턴 자동 생성은 없다"
      budget: "후보 전체의 합산 실제 전송은 최대 3회이며 동일 후보 재시도는 없다. 첫 후보 전송 허용 직전에 ARCH-033.calls의 해석된 모델 호출 상한으로 전체 사슬의 마감을 고정하고 각 후보는 남은 시간만 사용한다. 재개·동의 대기·후보 변경으로 마감이나 시도별 스텝/분류 예산을 초기화하지 않는다. 대기 중 만료하면 자동 호출 없이 종료한다. 호출 제한·쿼터·현재 중단/점유·필수 기록 검사를 매번 통과해야 하며 하나라도 불충족하면 남은 후보가 있어도 종료한다"
      consent: "자료 전송 범위의 정본은 REQ-106.consent.auxiliary_candidates다. 후보 경로를 사전 안내·동의 범위에 포함하고 실제 전송 직전 현재 범위를 검사한다. 관리자 후보 등록·기존 성공·다른 경로에 대한 동의는 해당 경로 동의를 대신하지 않는다. 범위 밖이면 미전송 상태로 사용자 확인에 인계하고 승인되지 않은 경로를 건너뛰어 다른 후보를 호출하지 않는다"
      history: "REQ-107에 논리 작업·후보 설정 버전/순서·원/후속 호출 관계·실제 공급 경로/모델/effort·오류 분류와 근거·전환/미전송 사유·현재 채택 결과를 연결한다. 호출 전 실패는 시도/이벤트로 기록하고 관측하지 않은 모델 응답 실행 스텝을 만들지 않는다. 실제 실행이 새로 관측되면 별도 스텝을 연결한다. 실패·늦은 응답의 사용량도 NFR-010에 따라 기록하며 모르는 비용을 0으로 확정하지 않는다"
      completion: "허용 후보가 소진되거나 전환 불가 오류·마감/예산·현재 정책 검사로 막히면 해당 보조 역할의 기존 실패/확인 경로로 연결한다(REQ-001·007·039). 모든 경우를 사용자 중단으로 기록하지 않는다. Portal에는 대체 처리 중/최종 실패와 가능한 다음 행동을 안내하고, 관리자 설정 문제를 사용자 주 추론 재선택으로 해결하라고 안내하지 않는다. 완료 업무·유효 원자료는 보존한다"
      design_handoff: "P3에서 역할 정책과 순서별 후보의 논리 관계, 설정 버전·호출 관계·동의 근거를 모델링하고 독립 API/화면/테스트에 연결한다. 물리명 확정 뒤 테이블 명세·구현 승인 후 새 Liquibase changeset과 활성 include·소스를 동기화한다. 이번 요구 확정으로 물리 설계나 구현이 완료된 것은 아니다"
    primary_availability_recovery:
      behavior: "주 추론 공급 경로의 일시 장애는 원인과 현재 실패 결과를 안내하고 자동으로 다른 모델을 호출하지 않는다. 현재 선택이 여전히 허용되면 보존하며 장애만으로 비활성 처리하거나 선택을 해제하지 않는다. 사용자가 현재 허용된 다른 조합을 선택하고 명시적으로 전송하면 REQ-013·ARCH-040의 새 턴·새 실행 시도로 시작한다. 기존 시도 중간의 모델 변경·완료 업무 재실행·자동 전송은 하지 않는다"
      distinction: "Portal 선택 OFF·기술 무효/제외·지원 조합 변경은 model_selection_recovery를 따르고, 일시 공급 장애 안내와 구분한다. 새 전송 시 현재 선택 자격·전송 동의를 다시 검증한다. 보조 대체 성공이 주 추론 설정을 바꾸지 않는다"
    model_selection_recovery:
      trigger: "새 턴·새 시도 시작 전 서버가 현재 선택한 또는 기본 주 추론 공급 경로·모델·effort 조합의 Portal 선택 OFF·기술 무효/제외·미지원으로 시작을 거부하면 그 사유를 Portal에 전달한다. 진행 중인 실행 시도의 설정 유지 규칙은 ARCH-040과 이 카드의 business_rules를 따른다"
      refresh: "Portal은 모델 사용 불가 응답을 받으면 모든 사용자에게 공통인 현재 Portal ON·기술 유효 공급 경로·모델·effort 목록을 자동 재조회해 선택 콤보를 갱신한다. 브라우저 전체 새로고침을 요구하지 않는다. 서버의 현재 허용 판정과 목록 조회를 사용하며 LLM이 대체 모델을 고르거나 목록을 추정하지 않는다"
      selection: "재조회가 성공하면 갱신 시점의 현재 선택을 새 허용 목록과 대조한다. 목록에서 제외된 선택은 해제해 미선택 상태로 표시하고 모델 사용 불가 사유와 재선택 안내를 제공한다. 현재 선택이 여전히 유효하면 유지하며 다른 모델로 바꾸지 않는다. 남은 허용 모델이 하나여도 자동 선택하지 않는다"
      submission: "작성한 질의는 유지한다. 선택이 해제됐으면 사용자가 허용 모델을 직접 선택한 뒤 명시적으로 전송해야 새 요청을 보낸다. 목록 재조회·선택 해제·모델 재선택만으로 질의를 자동 재전송하거나 새 턴·새 시도를 시작하지 않는다. 진행 중인 다른 턴의 모델과 상태도 변경하지 않는다"
      empty: "재조회에 성공했지만 현재 허용 모델이 없으면 선택 가능한 모델 없음과 관리자 확인 필요를 안내하고 질의 시작을 허용하지 않는다. 미등록·Portal OFF·기술 무효/미지원 모델로 대체하지 않는다"
      failure: "허용 목록 재조회에 실패하면 목록을 확인하지 못했음을 알리고 화면 안에서 다시 조회할 조작을 제공한다. 작성한 질의를 보존하며 조회 실패를 허용 모델 0개로 확정하거나 이미 사용 불가로 판정된 선택으로 시작을 허용하지 않는다. 재조회 복구 자체는 질의를 재전송하지 않는다"
      enforcement: "목록 갱신이나 사용자의 재선택은 서버 검사를 대신하지 않는다. 사용자가 다시 전송할 때에도 새 턴·새 시도 시작 전 현재 허용 조합과 권한을 확인하고, 그 사이 다시 사용 불가가 됐으면 같은 복구 경로를 적용한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "모델 M이 effort 'high'만 지원하는데 'ultra' 조합을 저장하면 유효 조합이 아니라는 오류를 보여 준다"
    lifecycle: "모델 조합 등록/제거는 registry_contract를, 용도 참조/순위는 screen_contract를, 실행 경계는 business_rules를 따른다. Portal 선택 OFF와 연결/지원 조합의 기술 무효는 새 Portal 선택지에 반영하며 내부 용도 지정은 Portal 스위치와 분리한다. 진행 시도는 ARCH-040의 고정 규칙을 따른다. 제작사·경로 폐지의 참조 보호는 REQ-601 공통 제약이다"
    permissions:
      - "ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601", "REQ-403", "REQ-106", "REQ-107", "REQ-116"]
      constrains: ["REQ-001","REQ-003","REQ-006","REQ-007","REQ-009","REQ-039","REQ-021","REQ-031","REQ-032"]
      conflicts_with: []
      nfr: ["NFR-010", "NFR-012", "NFR-013", "NFR-020"]
      interfaces: ["IF-003"]
    realization:
      features: ["FEAT-015","FEAT-101","FEAT-209","FEAT-210","FEAT-211","FEAT-304"]
      screens: ["SCR-015", "SCR-062", "SCR-101"]
    examples:
      - {"kind":"정상","case":"모델 M을 경로 P와 Q에 각각 등록하고, 주 추론은 P/M, 보조 판정은 Q/M으로 지정한다"}
      - {"kind":"예외","case":"모델 M이 effort 'high'만 지원하는데 'ultra' 조합을 저장하면 유효 조합이 아니라는 오류를 보여 준다"}
      - {"kind":"정상","case":"Portal에 A 모델이 선택된 채로 A가 Portal 선택 OFF 또는 기술 무효여서 새 전송이 거부되면 현재 허용 목록을 다시 조회한다. A가 없고 B만 남아도 미선택으로 바꾸고 작성한 질의를 유지한다. 사용자가 B를 선택하고 전송해야 새 요청을 보낸다"}
    fallback_tests: [TC-01510, TC-0151, TC-0152, TC-0153, TC-0154, TC-0155, TC-0156, TC-0157, TC-0158, TC-1011, TC-1012, TC-2091, TC-2092, TC-2093, TC-2094, TC-2095, TC-2096, TC-2097, TC-2101, TC-2111, TC-3041, TC-3042]
    validation_cases:
      - { case: "등록 표시명과 전송 코드가 다름", expected: "선택 화면은 표시명으로 안내하되 실행은 당시 검증된 모델/effort 코드와 연결 리비전을 고정한다. 표시명 변경·공급사 간 같은 이름으로 코드가 바뀌지 않는다" }
      - { case: "공급사별 모델과 effort 지원 범위가 다름", expected: "용도 설정은 해당 모델의 유효 조합만 선택 가능하며 이전 모델의 effort를 자동 이월/변환하지 않는다. 미전송 조합은 effort 값을 보내지 않는다" }
      - { case: "용도 참조 중 호출 코드 변경/삭제와 Portal 선택 OFF", expected: "참조 해소 전 의미 변경/삭제는 거부한다. Portal OFF는 새 사용자 선택에서만 제외하고 내부 용도/보조 후보·가격 참조를 보완 필요로 바꾸지 않는다. 진행 시도 고정/이력·현재 연결/동의 검사를 유지한다" }
      - { case: "열린 화면의 선택 A가 Portal OFF·기술 무효/제거/미지원으로 새 시작 거부", expected: "Portal이 허용 조합 목록을 자동 재조회하며 브라우저 새로고침을 요구하지 않는다. A가 목록에서 제외됐으면 현재 선택을 해제하고 사유·재선택을 안내한다" }
      - { case: "재조회 결과 허용 모델이 B 하나만 남음", expected: "B를 자동 선택하지 않고 미선택을 유지한다. 질의 원문을 보존하며 자동 재전송·새 턴/새 시도 시작 없이 사용자의 선택과 전송을 기다린다" }
      - { case: "재조회 시점의 현재 선택이 새 목록에서도 유효함", expected: "유효한 현재 선택을 유지하고 다른 모델로 바꾸지 않는다. 목록 갱신만으로 원 요청을 자동 재전송하지 않는다" }
      - { case: "목록 재조회 성공·현재 허용 모델 0개", expected: "허용 모델 없음·관리자 확인 안내를 제공하고 질의 시작을 차단한다. 작성한 질의는 유지한다" }
      - { case: "허용 목록 재조회 실패 후 화면 내 재조회", expected: "목록 확인 실패와 재조회 조작을 제공한다. 빈 목록으로 확정하거나 사용 불가 선택으로 시작하지 않고 질의를 유지하며, 재조회 성공 후에도 자동 전송하지 않는다" }
      - { case: "허용 목록 갱신·모델 재선택 뒤 전송 전에 해당 조합이 다시 사용 불가가 됨", expected: "서버가 시작 전 현재 조합을 재검사해 실행하지 않고 같은 목록 복구·재선택 경로로 안내한다" }
      - { case: "다른 턴이 처리 중인 상태에서 새 요청의 모델 선택 복구", expected: "이미 진행 중인 실행 시도의 고정 모델과 상태는 유지하고 새 요청의 선택·질의만 복구한다" }
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    implementation_status: "미구현 — 현재는 요구·설계 계약이며 실제 공급 경로의 오류 분류/종료·계량 시험 전"
    open:
      - "@defer P2 모델 공급 경로별 접속·인증 설정 참조와 배포 시 비밀값 주입 계약을 구체화한다. 문서상 암호화 방식을 현재 구현 완료로 간주하지 않는다"
      - "@defer P3 모델 사용 불가 사유와 허용 조합 목록의 응답 계약, Portal 콤보의 미선택·조회 중·실패·빈 목록 표시, 늦은 재조회 응답과 사용자 선택 경합 보호, 모델 사용 불가 안내의 메시지 키와 실제 화면·시작 전 경합 시험을 구체화한다. 업무 동작의 정본은 model_selection_recovery다"

    maturity: { level: confirmed, at: "2026-10-30", by: "AI — 사용자 모델 화면 단순화 결정 반영", confirmed_by: "사용자 — 공급사·모델·effort·용도·우선순위 중심 단순화, 그룹/등급별 모델 제한 제거와 보조 판정만 자동 전환 유지. 2026-10-31 후속 결정으로 Portal 선택은 ON·기술 유효 텍스트 집합으로 한정" }

  - id: REQ-603
    code_lookup_definition:
      owner: "2026-10-29 사용자 결정: SCR-002에서 같은 데이터소스의 코드 조회 정의를 여러 개 관리한다. ENT-041은 안정 정의, ENT-042는 불변 SQL/결과 대응/파라미터 계약의 버전, ENT-043은 그 버전의 typed 파라미터다. 컬럼 선택/바인딩과 코드 목록 소비는 REQ-301.value_domain이 정본이다"
      query: "관리자가 읽기 전용 단일 조회 SQL을 작성하고 허용된 등록 원천 객체만 참조하는지 검수한다. named 파라미터는 값 바인딩만 허용하며 이름/식별자/ORDER BY/SQL 조각 치환을 받지 않는다. 그룹·상세 조인/서브쿼리를 허용하되 고객사 고정 테이블 구조를 추정하지 않는다. 코드값·코드명·선택 설명의 반환 컬럼 대응과 코드값의 자료형을 검증한다"
      lifecycle: "정의 버전은 DRAFT→VERIFIED→ACTIVE이며 INACTIVE는 신규 선택/실행 불가다. VERIFIED 이후 SQL·결과 대응·파라미터 계약은 불변이고 변경은 새 DRAFT 복사다. 검증은 서버의 현재 검수 권한/근거로 VERIFIED를 만들며 초안 저장/시험 성공만으로 운영 사용하지 않는다. ACTIVE는 명시 활성화 명령 뒤 사용한다. 새 버전 활성화로 기존 컬럼의 정확 버전을 자동 최신화하지 않으며 이전 버전은 명시 비활성화 전까지 계속 활성일 수 있다. 사용 중 정의/버전의 물리 삭제는 금지하고 비활성화 전 사용처·영향을 표시한다"
      parameters: "버전마다 파라미터명·STRING/NUMBER/BOOLEAN/DATE/DATETIME 자료형·필수/NULL 허용·업무 설명을 정의한다. SQL placeholder와 선언 이름의 일치·중복·형식을 검사한다. 시험 바인딩은 요청의 일시 입력이며 기본값/공유 영구 설정으로 저장하지 않는다. 언어/회사/사용여부를 무조건 강제하지 않으며 비활성 과거 코드 조회 목적도 명시한다"
      runtime: "실시간 조회를 기본으로 하고 명시 CACHE 모드이면 TTL 초를 설정한다. 캐시는 데이터소스 연결/설정 세대·정의 정확 버전·정규화 typed 바인딩·현재 권한/정책·회사/언어/보안 문맥별로 격리하고 상태/권한을 캐시 적중 시에도 검사한다. 비활성화·권한 회수·정의 변경에 무효화하며 만료/오류를 오래된 성공으로 대체하지 않는다. 실행 시간·반환 건수·바이트/프롬프트 상한은 서버에서 강제하고 초과를 전체 목록 성공으로 절단하지 않는다"
      permissions: "정의 작성/검증/활성화와 원천 코드 미리보기 실행은 구분한다. HUB_DATA_SOURCE READ만으로 임의 SQL 실행을 허용하지 않는다. 검수된 정확 정의의 현재 미리보기/운영 실행 권한·원천 객체/행 정책·전송/개인정보 정책을 각각 검사한다. SQL/바인딩/결과의 평문 로그와 권한 밖 반출을 금지한다"
      storage: "정의/버전/파라미터 변경은 코드 조회 자산 자체의 명령/검수/활성화 이력으로 남긴다. 데이터소스 기본설정 저장/성공 스냅샷과 별도 저장 단위이며 다른 소유 참조 변경이나 조회 실행으로 데이터소스 변경 이력을 추가하지 않는다. SQL/파라미터/결과 대응·검수 근거는 정확 버전으로 보존하고 원천 코드 갱신 결과는 실행/턴 근거로 추적한다"
      pending: "@defer P3 integration_assets·integration·agent·access_policy·audit_trace — 실제 실행 권한 키·DBMS read-only 판별/바인딩·SQL 참조 추출/정책 주입·한도 값·시간중단·캐시 구현/무효화 경합·물리 스키마/잠금/멱등 원장·보호된 결과 스냅샷/보존을 공개 계약과 제품 시험으로 완성한다. 이 통제가 준비되지 않은 배포에서는 실행/활성화를 제공하지 않는다"
      audit: "코드 정의 초안/검수/활성의 명령과 판·처리 원장은 데이터소스 기본설정 명령과 독립이다. 초안 저장·검수·반려는 운영 _HIST를 만들지 않는다. 실제 활성/비활성 등 유효값 반영 성공 때는 REQ-601.change_history에 따라 데이터소스 마스터와 모든 유효 관리 자식을 같은 HISTORY_NO와 마스터의 HIST_DTM의 _HIST 세트로 복사한다. 원 제출/검수 원장을 이 복사로 대체하지 않는다."
    dbms_context: "2026-10-29 사용자 결정: 데이터소스에 DBMS 코드와 DBMS 버전을 관리하고 소속 테이블/컬럼을 LLM에 제공할 때 함께 전달한다. 버전은 공통코드 목록이 아닌 관리 문자열이며 관리 편집 버전과 다르다. 연결 메타데이터의 제품/버전 관측은 초기 제안·대조 근거로 사용하고 저장값을 자동 변경하지 않는다. 관측 실패는 미확인, 관리값과 실제 연결이 다르면 불일치로 표시하며 확인/정정 전 그 정보로 SQL 생성·실행하지 않는다. 버전별 자료형 목록은 만들지 않고 REQ-301.source_type_catalog를 따른다. 관리 DBMS/버전 변경은 확정 후 전체 스냅샷에 보존한다"
    alias_identity: "2026-10-28 사용자 선택: 데이터소스 별칭은 앞뒤 공백과 대소문자 차이를 무시해 유일성을 판정한다. 표시 이름의 대소문자는 유지하되 다른 데이터소스와 같은 별칭이 되는 등록/이름 변경은 허용하지 않는다. 정규화·저장·동시 요청의 일관성은 ENT-002와 FEAT-002 물리/공개 계약에서 구체화한다"
