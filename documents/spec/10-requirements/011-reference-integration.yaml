      owners: "그룹 정의는 FEAT-006/UC-025, 사용자 소속은 SCR-005·REQ-609/UC-024가 소유한다. 자산 매핑 쓰기는 지식/예제 SCR-011/012·REQ-305/306, 카탈로그 SCR-003/007·UC-026, API SCR-004/008·REQ-608, 도구 SCR-019·REQ-612의 전체 자산 저장만 사용한다. 그룹 화면의 자산 탭은 현재 매핑 역조회이며 별도 쓰기 경로·사본 원장을 만들지 않는다."
