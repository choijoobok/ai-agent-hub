      assets: "그룹 관점에서는 현재 매핑·접근 제약을 조회만 한다. 변경은 각 원 소유 자산 화면에서 전체 구성·기대 버전·사유·현재 변경 권한/필수 참조를 검증해 직접 저장한다. 본문/계약·다른 그룹·컬럼 예외와 매핑 전체를 같은 자산 리비전의 변경 전후 이력 사본(HIST)으로 원자 반영한다. 그룹 화면의 매핑 부분 저장·별도 자산 이력이나 승인 대기 사본은 만들지 않는다."
      effective_access: "매핑 포함은 해당 그룹 기준의 허용 근거다. 사용자 대상 신원·다른 소속 그룹·카탈로그 컬럼 HIDE/MASK·행 스코프·업무 API 입력/원 시스템 권한·도구 노출/연결 지식/유효 계약의 기존 최종 검사를 대체하지 않는다. API 기반 도구는 API와 도구 양쪽 권한을 검사하며 한쪽 스위치가 다른 쪽 매핑을 자동 변경하지 않는다"
      history: "그룹 정의·사용자 부여/회수 이력과 원 소유의 자산 전체 변경 이력을 안정 참조로 구분한다. 자산 조회는 새로운 이력을 만들지 않는다. 자산 그룹 매핑 변경은 원 자산의 전체 이력에 포함하며 그룹 정의 과거 이력을 현재 다른 소유 매핑으로 채우지 않는다."
    business_rules:
