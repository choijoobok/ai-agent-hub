  - id: REQ-604
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-003","ACT-002"]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-001·REQ-105·ARCH-030·ARCH-050 · 2026-10-02 사용자 보완 요청: API 주소·인증·공통 헤더는 배포 연결 설정에서 관리하고 대상 시스템·API는 연결 참조로 매핑한다 · 2026-10-06 사용자 설명 개선 요청: 배포 연결 구성 정의 → 시스템의 허용 연결 목록·기본값 지정 → API별 연결 선택 순서를 명시한다 · 같은 날 사용자 정정: 사용자 그룹은 데이터소스와 개별 API에 매핑하며 대상 시스템에는 그룹 매핑을 두지 않는다. 사용자 용어 개선 요청에 따라 API별 제공 시스템 지정으로 쉽게 설명한다. 2026-10-06 사용자 명시 요청으로 카드 전체를 확정했다"
    process_step: PRC-13-01
    title: "대상 시스템 정의와 API별 제공 시스템 지정"
    detail: "관리자는 업무 API를 제공하는 대상 시스템의 명칭·설명·사용 상태와 관련 API·신원 매핑 현황을 관리할 수 있어야 한다. 배포 담당자가 주소·인증 방식·공통 고정 헤더를 한 묶음의 API 연결 설정으로 정의하면, 관리자는 대상 시스템에서 사용할 연결 식별자 목록을 매핑하고 그중 기본 연결을 지정한다. 화면에서 현재 적용 Base URL(기본 접속 주소)과 인증 방식을 비밀 없는 읽기 전용 정보로 확인할 수 있어야 한다. 개별 API에서 이 API를 제공하는 대상 시스템과 사용할 연결을 선택하는 절차는 REQ-608을 따른다"
    roadmap: RM-P1
    acceptance: "대상 시스템별 API·신원 매핑·허용 연결 목록·기본 연결을 조회할 수 있다. 연결 후보·허용 연결·관측에서 connection_display의 현재 Base URL·인증 방식·표시 상태와 적용 근거를 읽기 전용으로 확인하고 비밀을 포함한 주소는 안전하게 정제하거나 표시 불가로 안내한다. 같은 도메인이라도 인증·공통 고정 헤더 구성이 다른 연결을 한 시스템의 허용 목록에 함께 매핑할 수 있다. 기본 연결은 그 목록에서 지정하며 목록 밖 연결을 기본 연결이나 해당 시스템이 제공하는 API의 연결로 지정하면 거부된다. 대상 시스템에는 사용자 그룹을 매핑하지 않으며 API 호출 허용 그룹의 판정은 REQ-105·REQ-611을 따른다. 유효 연결이 없거나 해석되지 않으면 호출을 차단하고 비밀을 표시하지 않는다. 데이터소스는 독립적으로 유지된다"
    summary: "업무 API를 제공하는 시스템을 구분하고, 배포 설정에 있는 연결의 현재 접속 대상을 확인하며 사용할 목록과 기본값을 지정한다"
    intent:
      problem: "업무 API를 제공하는 시스템과 사용할 연결을 명확히 관리하지 않으면 API 계약·접속 구성·신원 매핑을 잘못 연결한다"
      goal: "업무 API를 제공하는 시스템과 그 시스템의 관리·연동 기준을 식별한다"
      not: ["데이터소스·카탈로그를 대상 시스템 아래에 강제 귀속시키지 않는다","고객사 업무 시스템의 기준정보와 계정을 Hub가 대신 관리하지 않는다","시스템과 도메인 주소를 반드시 일대일로 묶거나 화면에서 실제 인증정보·공통 접속 헤더 값을 편집하지 않는다"]
    goal_trace: ["IN-06"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
