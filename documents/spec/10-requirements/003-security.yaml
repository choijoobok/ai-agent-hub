  - id: REQ-106
    type: functional
    priority: must
    actors: [ACT-001, ACT-002, ACT-005, ACT-007]
    source: "2026-10-14 사용자 결정 — 시스템의 자동 결과 전송을 금지하고 사용자 요청·동의가 있으면 전송을 허용하며 필수 감사한다. 직접 입력 자료는 전송 안내가 있는 입력창에서 해당 요청을 제출한 행위를 동의로 기록한다. 기존 허용 목록 중심 차단과 원 결과 전체의 일률적 금지를 변경한 보완본은 2026-10-14 확정됐다. 2026-10-22 사용자 요청: Portal 개인정보 직접 입력 주의 안내와 패턴/기존 의도 파악 LLM의 개인정보 의심 판정 경계를 연결한다. 2026-10-22 후속 사용자 명시 요청으로 개인정보 보호·턴 이력 보관 보완을 포함한 전체 카드를 재확정했다. 2026-10-28 사용자 승인: 보조 대체 후보 경로의 사전 안내·동의와 실제 전송 직전 재검사 반영."
    process_step: PRC-02-03
    title: "사용자 요청·동의에 따른 LLM 데이터 전송과 감사"
    detail: "시스템이 조회·보관한 업무 결과는 사용자 요청과 해당 데이터에 대한 전송 동의 없이 LLM에 자동 전달하지 않는다. 사용자가 자료의 요약·가공·해석·검증을 요청하고 대상·범위의 전송에 동의하면 현재 열람 가능한 범위의 데이터를 전달할 수 있다. 직접 입력한 자료는 전송 안내가 있는 입력창에서 요청을 제출하면 그 자료와 목적에 대한 동의로 기록한다"
    hard_rule: "사용자 동의는 데이터 접근 권한·실행 승인·파일 반출 허용·마스킹·크기 제한을 해제하지 않는다. 기존 테이블/컬럼/API 경로의 LLM 전송 허용 목록에 없다는 이유만으로 사용자 요청·동의 경로를 차단하지 않으며, 그 플래그가 동의 없는 자동 전송을 허용하지도 않는다. 시스템 비밀·내부 프롬프트·사용자 권한 밖 데이터는 동의 대상으로 제공하지 않는다"
    summary: "직접 제출 또는 확인된 결과 전송 동의를 근거로 LLM을 호출하고 대상·목적·범위·실제 전송을 감사한다"
    intent:
      problem: "자동 결과 재전송과 사용자가 의도한 자료 활용을 구분하지 않으면 유용한 요청을 막거나 동의 없는 데이터 전송이 발생한다"
      goal: "사용자 의도를 확인한 범위에서 자료를 처리하고 누가 무엇을 왜 보냈는지 감사할 수 있게 한다"
    goal_trace: [ECO-05, INV-01]
    decider: "제품 오너(사용자). 요청·동의 주체는 해당 사용자이며 서버가 유효 범위를 검사한다"
    preconditions: ["요청 사용자 신원과 처리할 자료 버전/범위를 확인한다", "공급 경로·모델은 등록된 경로를 사용한다"]
    lifecycle: "안내·요청/동의 기록 → 호출 전 범위 검사 → 전송 시도 기록 → 호출 결과/사용량 기록. 거부·만료·취소는 후속 전송을 막는다"
    permissions: ["자료 열람은 현재 사용자 권한, 동의는 해당 사용자, 감사 조회는 현재 감사 권한으로 검증한다"]
    volume: "자료별 크기와 모델 입력 한도는 기존 제한을 따르며 새 수치를 임의로 정하지 않는다"
    config: "전송 안내·동의 범위 계약과 크기 기준은 P3에서 정하고 기존 허용 플래그 관리 화면은 해당 계약에 맞춰 이관한다"
    risk: "붙여넣기는 실제 출처·권한·민감정보를 완전히 검증할 수 없으며 동의가 입력 데이터의 신뢰성을 보장하지 않는다"
    examples:
      - { kind: 정상, case: "전송 안내된 입력창에 제공한 회의록 요약 요청은 해당 제출을 동의로 남기고 처리한다" }
      - { kind: 예외, case: "사용자가 기존 결과의 일부 열만 동의했는데 모델이 전체 결과를 요구하면 범위 밖 입력을 보내지 않는다" }
    consent:
      direct_input: "LLM 전송 안내를 확인할 수 있는 입력창에서 사용자가 자료를 직접 입력하고 처리 요청을 제출하면 해당 자료·요청 목적에 동의한 것으로 기록한다. 매 제출에 별도 동의 버튼을 요구하지 않는다. 안내 버전·제출자·시각·입력 버전/지문·요청 근거를 기록하며 안내 없는 제출이나 모델이 만들어 낸 동의는 인정하지 않는다"
      existing_result: "기존 응답/조회 결과는 결과 식별자·버전·대상 범위·처리 목적·전송할 모델 공급 경로를 안내해 사용자 요청·동의를 확보한다. 명확한 요청과 안내가 같은 동작에서 충족되면 불필요하게 중복 확인하지 않되, '분석해 줘'만으로 숨은 다른 결과·전체 대화까지 동의한 것으로 확대하지 않는다. 구체 UI·카드·만료 계약은 P3에서 정한다"
      scope: "동의는 자료 버전·필드/행 또는 문서 범위·목적·공급 경로에 연결한다. 같은 범위의 연속 처리/필요한 재시도는 계약상 유효 기간 안에서 같은 동의를 참조할 수 있지만 새 자료·범위 확대·목적/공급 경로 변경·새 시도는 유효 범위를 다시 검사하고 필요하면 재동의를 받는다. 세션 전체·향후 모든 조회에 대한 포괄 허용으로 간주하지 않는다"
      auxiliary_candidates: "REQ-602의 보조 대체를 사용할 자료는 직접 입력 전송 안내 또는 기존 결과 동의에 실제 사용할 후보 공급 경로 집합·처리 목적을 미리 표시하고 안내/후보 설정 버전과 함께 기록한다. 해당 자료·범위·목적의 유효 동의에 포함된 후보만 자동 전송 가능하다. 새 공급 경로 추가·자료/목적 변경은 기존 동의를 확장하지 않는다. 각 후보 직전 현재 권한·동의·기한·마스킹·입력 범위를 재검사하고 범위 밖이면 미전송 상태로 기존 사용자 확인 경로에 인계한다. 거부/만료는 후속 호출을 차단하며 주 추론 재선택이나 다른 후보 건너뛰기로 우회하지 않는다. 확인 후에도 논리 작업의 남은 마감/예산·현재 자격을 만족해야 하고 만료된 작업을 되살리지 않는다. 모델을 사용자가 고르지 않는 보조 역할이라는 사실도 전송 경로 안내를 생략할 근거가 아니다"
      enforcement: "각 호출 직전 서버가 실제 입력과 동의 범위를 대조한다. 원래 요청의 자료가 아닌 조회 결과를 나중에 자동 추가하지 않는다. 분류·요약·임베딩·과거 맥락 재주입을 명목으로 범위 밖 자료를 보내지 않는다. 원래 요청 처리에 필요한 등록 지식/카탈로그 메타데이터 사용은 기존 권한 통제를 유지하며 실제 업무 결과 전송 동의와 구분한다"
      withdrawal: "취소·동의 거부/만료는 이후 미전송 호출을 중단한다. 이미 전송한 호출·사용량을 없던 것으로 기록하거나 외부 전송을 되돌렸다고 보장하지 않는다"
    input_notice:
      content: "Portal 입력창에서 요청 제출 전에 개인정보를 직접 입력·붙여넣기하거나 첨부 자료에 포함하지 않도록 안내한다. LLM 전송 안내와 함께 확인할 수 있어야 하며 도움말을 별도로 열어야만 알 수 있게 숨기지 않는다. 구체 문구·메시지 키·배치는 P3 화면 요건서에서 정한다"
      assessment: "개인정보 포함 의심은 REQ-111.input_privacy_assessment의 패턴 검사와 기존 의도 파악 LLM 판단을 함께 사용한다. LLM의 판단은 해당 입력이 전송된 뒤 얻는 감사용 표식이므로 사전 차단·익명화 완료나 안전한 입력이라는 안내를 하지 않는다"
      consent: "안내된 직접 제출의 동의 범위는 consent.direct_input을 유지한다. 검사 결과를 받은 뒤 새 동의를 받아 이미 전송한 사실을 소급 정당화하지 않으며, 의심 판정을 위해 입력 범위·공급 경로를 확대하지 않는다. 개인정보 주의 안내와 실제 적용된 전송 안내 버전을 제출 근거에 연결한다"
    verification_input_notice:
      - { case: "새 대화·기존 대화에서 사용자 입력 제출", expected: "제출 전에 개인정보 직접 입력 금지 주의와 모델 전송 안내를 확인할 수 있고 적용 안내 버전이 기록된다" }
      - { case: "모델 전송 후 개인정보 의심 판단 도착", expected: "실제 전송 사실과 사전 제출 근거를 유지한다. 사후 동의로 전송 시점을 바꾸거나 검사 완료를 익명화로 표시하지 않는다" }
    data_boundary:
      results: "동의 범위가 전체 결과라면 현재 열람 가능·마스킹·크기 조건을 충족한 전체도 전송할 수 있다. 원 결과 전체라는 이유만으로 일률적으로 금지하지 않는다. 필요한 부분만 선택·집계할 수 있으며 실제 사용 범위를 결과에 명시한다"
      masking: "기존 카탈로그 컬럼·API 응답 경로에 따른 마스킹과 저장 사본 마스킹은 유지한다. 동의를 개인정보 마스킹 해제로 해석하지 않는다. 임의로 붙여 넣은 자유 문장은 원천 컬럼/경로를 신뢰성 있게 복구할 수 없으며, 자유 문장의 개인정보 의심 판정은 REQ-111.input_privacy_assessment를 따르고 자동 마스킹·차단은 REQ-107.open의 후속 범위다. 이번 변경으로 완전한 탐지·차단 기능이 생긴다고 보장하지 않는다"
      access: "기존 결과는 제공 시 현재 사용자 접근 권한과 보존 상태를 다시 확인한다. 파기된 결과를 복원하거나 원본 재조회로 조용히 바꾸지 않는다. 자료 검증/요약 동의는 원천 시스템 조회·실행 권한이 아니다"
      limits: "행 수·입력 크기·모델 문맥·개인 쿼터 등 기존 제한을 유지한다. 상한 초과는 임의 자르기나 분할 전송으로 우회하지 않고 범위 축소·집계를 안내한다. 자유 문장/표의 적용 크기·행 판정 계약은 P3에서 정한다. 엑셀 행 상한과 LLM 입력 상한은 별개다"
      pasted_data: "사용자가 외부 추출/수동 가공해 붙여 넣은 자료는 사용자 제공 자료로 표시한다. 시스템이 추출 출처·원본 일치·권한을 검증했다고 표시하지 않는다. Hub 결과 식별자로 선택한 경우에는 출처를 유지한다. 붙여넣기 자료의 실제 출처를 완전히 추적할 수 있다는 보장은 하지 않는다"
    business_rules:
