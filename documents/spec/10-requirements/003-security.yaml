    audit: "감사·이력 열람 자체도 열람자·시각·대상 유형·검색·상세 조회 여부로 기록한다"
    volume: "턴/스텝·호출·상태 전이·결과 행 수와 보존 기간·조사 보호량에 비례한다. 전체 대상의 결과 사본을 보존하므로 대상별 유입량과 일일 파기 처리량을 산정한다(CON-025)"
    config: "조회 결과 기간 설정·읽기 전용 조회·일일 파기는 retention_policy, 질의·응답 본문은 REQ-109.conversation_body_retention을 따른다. 두 항목은 별도 YAML 설정이며 관리자 화면에서 편집하지 않는다. 그 밖의 감사 메타데이터는 별도 정책을 따르며 일괄 7일을 적용하지 않는다"
    risk: "상태 갱신만으로 감사 사실이 소실되거나 조사 보호가 무기한 저장으로 변질될 수 있다. 변경 이력·보호 재검토·쓰기 부하·파기 처리량을 함께 검증한다"
    verification:
