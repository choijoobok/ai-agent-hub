    "lifecycle": "자산·소속·신원·정책은 원 소유 현재 변경 권한과 검증을 거쳐 직접 저장하고 전체 이력을 원자 보존한다. 현재 접근은 REQ-108에 따라 매 접근 시 판정한다."
