    "source": "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-28 사용자 결정(Hub 이용 등록 단계·활성 사용자 그룹 1개 이상 필수·정책 변경 사유와 알림) · 2026-09-30 사용자 재확정(자산 접근 그룹의 세트 승인·사용자 소속 그룹 직접 관리) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    "process_step": "PRC-02-02"
    "title": "데이터 접근 통제 — 그룹 판정 · 행 스코프 · SQL 4단계"
    "detail": "상세 모델은 22-authz/_index.yaml 이 갖는다. 접근 제한·마스킹·행 스코프·전송 정책은 스키마 카탈로그 등록부터 함께 적용한다. 카탈로그 컬럼은 관리자가 등록한 뒤 예외 매핑이 없으면 테이블 허용 그룹을 상속하고, 원천 DB/DW에서 감지됐지만 카탈로그에 미등록인 신규 컬럼은 차단한다"
    "note": "초기 오픈 전 고객사 통합 검수와 실제 정책 적용 확인은 유지한다. 관리자 간 자산/권한·사용자 그룹 변경 승인은 전면 철회한다. 사용자 소속 전체·지식/카탈로그 구성·자산 그룹/컬럼 예외·행 스코프/마스킹/전송 정책은 각 원 소유 단위의 직접 저장과 불변 전체 이력으로 남기며 과거 복원도 현재 권한의 새 직접 저장으로 처리한다."
    "traces_to":
      - "REQ-104"
    "acceptance": "그룹 매핑·행 스코프·마스킹·전송 정책 중 하나라도 현재 정책에서 판정되지 않으면 요청은 허용 범위 밖으로 처리된다. 사용자 그룹·지식 접근 그룹과 태그·카탈로그·카탈로그 그룹 매핑을 각각 변경한 뒤 과거 시각을 조회하면 해당 관리 대상의 전체 당시 상태, 변경자·시각·사유·근거가 조회되고, 과거 상태 복원은 새 이력으로 남는다"
    "summary": "사용자 그룹과 객체 허용 그룹의 교집합으로 데이터소스·테이블·컬럼·API·지식의 접근을 판정하고, 행 스코프·기본 필터·마스킹·전송 정책을 카탈로그 등록부터 함께 적용한다. 정책 변경은 관리 대상 전체의 불변 스냅샷으로 남겨 과거 상태를 재구성한다"
    "intent":
      "problem": "여러 업무 시스템의 데이터를 한 창구에서 다루면, Hub가 각 시스템의 권한 체계를 우회하는 통로가 된다"
      "goal": "원 시스템에서 볼 수 없던 것이 Hub에서도 보이지 않게 하고, 어느 시점의 정책이든 그대로 다시 보여 줄 수 있게 한다"
      "not":
        - "system 메뉴 역할이 아니다 — 메뉴 권한과 데이터 접근 그룹은 분리한다(AUTHZ-001)"
        - "레거시 권한을 복제하는 것이 아니다 — 행 스코프는 레거시의 권한 정보 테이블을 조인한다(AUTHZ-020, PRN-09)"
        - "LLM이 그룹별 스코프를 선택하거나 필수 규칙 사이를 OR로 넓히는 조합 엔진이 아니다. 복수 권한 규칙의 필수 적용과 기본 필터별 제외는 REQ-611을 따른다(AUTHZ-020·050)"
        - "쿼터 등급이 아니다(REQ-116)"
    "goal_trace":
