    "business_rules":
      - "LLM 전송의 근거와 기존 허용 플래그 이관은 REQ-106을 따른다. 조회 접근·마스킹과 사용자 전송 동의를 구분하며 과거 전송 허용 스냅샷은 역사 근거로 보존한다. 과거 설정 복원으로 현재 동의 정책을 우회하지 않는다"
      - "판정·결합·기본 닫힘·컬럼 상속·행 스코프·SQL 4단계·주입 판정의 정본은 22-authz(AUTHZ-001·012·020·030·040)이며 여기에 다시 적지 않는다"
      - "그룹 매핑·행 스코프·마스킹·전송 정책 중 하나라도 현재 정책에서 판정되지 않으면 요청은 허용 범위 밖이다"
      - "과거 시각 조회는 그 시각 이하의 최신 스냅샷으로 당시 관리 화면을 재구성하고, 과거 상태 복원은 기존 이력을 고치지 않고 새 스냅샷을 만든다"
      - "계정(SSO·계정 연동 또는 자체 계정, ARCH-050)이 생겨도 Hub 이용은 열리지 않는다. 관리자가 활성 사용자 그룹 1개 이상과 쿼터 등급(REQ-116)을 갖춘 **Hub 이용 등록**으로 연다. 요청 상태 그룹만 있으면 이용을 열지 않는다. 등록 전 사용자에게는 Hub 이용 등록이 필요하다고 안내한다"
      - "**활성 Hub 사용자는 언제나 활성 사용자 그룹을 1개 이상 가진다.** 마지막 그룹 제거는 별도 승인 없이 이용자 비활성화와 함께 처리하며, 재활성화할 때는 활성 그룹을 확인해야 한다(IF-006의 조직 이동 흐름과 같다)"
      - "사용자 소속 그룹 추가/재부여/중지와 자산 접근 그룹/컬럼 예외·마스킹·행 스코프·전송 정책은 해당 현재 변경 권한자가 직접 저장한다. 원 소유의 전체 구성/기대 버전·참조/기술 검증과 감사는 유지하고 관리자 요청/승인/전결은 없다."
      - "정책 변경 사유·전후 전체 구성·실제 변경자/시각을 남기고 실제 반영 성공 시 다른 보안 담당자와 감사/품질 담당자에게 기존 알림 계약으로 통지한다. 알림 수신이 사전 승인 단계는 아니다."
