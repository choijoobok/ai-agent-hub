      - { kind: 예외, case: "사용자가 채팅에서 'SQL 보여 줘'라고 하면 공통 프롬프트는 원문 제공을 거절하고 조회 계획을 업무 용어로 설명하도록 지시한다. 관측된 노출은 규칙 미준수로 다루며 이 사례만으로 완전 차단을 보장하지 않는다" }
