      - "조회 결과 원문의 유한 기한·조사 보호·파기는 retention_policy, 실행용 재개 상태 정리는 REQ-109가 정본이다"
      - "등록된 개인정보 값은 마스킹 사본만 저장하고 사본 생성 불가는 별도 보안 예외로 남긴다(PRN-07). 저장 실패로 원문 보존을 생략하지 않는다"
      - "원문 사본 파기 배치는 agent가 소유한 BatchJob 빈으로 등록하고 system 스케줄 화면(FEAT-508)을 사용한다. 공통 RetentionPurger를 재사용하되 조사 보호 판정 계약은 P3에서 확인한다. system RetentionPurgeJob의 대상에 agent 테이블을 넣지 않는다(ADR-013)"
      - "실행 이력에는 파라미터 마스킹 사본·승인·결과와 실행 턴의 재조회 SQL·기준 시각·결과 지문을 남긴다(REQ-105). 모든 조회의 결과 지문은 원본 값으로 계산한다"
    exceptions:
