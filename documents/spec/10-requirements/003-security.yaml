    detail: "Portal의 응답 정책은 내부 SQL 원문·물리 테이블/컬럼명을 제공하지 않고 조회 계획과 결과를 업무 용어로 설명하는 것이다. 초기 자유문장 응답에는 initial_control의 전사 공통 프롬프트 규칙을 적용하고 기술적 출력 통제 강화는 후속으로 둔다. SQL 원문은 admin 조회 이력에서 메뉴 권한을 가진 사용자만 읽기 전용으로 보며 편집·직접 실행은 제공하지 않는다"
    why: "사용자가 고친 SQL 을 실행하면 그 SQL 은 LLM 이 만든 것도 관리자가 검수한 것도 아니게 되어, 통제 전제와 감사 이력의 의미가 함께 흔들린다. 일반 사용자가 SQL 원문을 볼 업무상 이유가 없고, 원문에는 스키마 구조가 드러난다"
    note: "SQL 감사 기록과 사용자 공개 정책을 구분한다. 생성·실행 SQL은 REQ-107에 기록하며 Portal 원문 열람 기능은 제공하지 않는다. 기존 구조화된 진행 이력·결과 필드의 공개 범위 통제(REQ-006·011)는 유지하고, 이번 후속 유예는 LLM 자유문장의 SQL·물리명 노출을 막는 추가 기술 통제에 적용한다"
    acceptance: "전사 공통 프롬프트에 initial_control의 비노출 지침을 등록하고 사용자용 설명·계획·응답 작성 호출에서 적용 리비전을 확인할 수 있다. 대표 정상 질의와 SQL/스키마 공개·우회 요청 사례에서 업무 용어 설명·거절 안내를 검증한다. Portal에 SQL 원문 열람 기능을 제공하지 않으며 admin은 메뉴 권한으로 생성 SQL·실제 실행 SQL을 읽기 전용 조회한다. 이 검증은 LLM 자유문장의 모든 변형에서 비노출을 보장하는 시험이 아니며 기술적 강화는 open을 따른다"
    summary: "SQL 원문·물리명 비노출 지침을 우선 전사 공통 프롬프트로 적용하고 업무 용어로 응답한다. 자유문장 노출 가능성과 후속 기술 보완을 명시하며 SQL 감사 기록·관리자 권한 조회는 유지한다"
    intent:
      problem: "SQL과 물리명이 보이면 스키마 구조가 새고, 사용자가 SQL을 고쳐 실행하려는 요구가 생겨 통제 전제가 무너진다"
      goal: "사용자는 업무 용어로 계획을 확인하고, 원문은 감사·운영에 필요한 사람만 admin에서 본다"
      not:
        - "SQL 편집기가 아니다 — 고친 SQL 실행 경로를 두지 않는다"
