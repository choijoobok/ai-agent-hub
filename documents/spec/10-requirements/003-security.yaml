    data:
      - { item: "기록 대상 전체 — 항목의 정본은 이 REQ의 detail이다", origin: "agent·admin", sensitivity: "업무 데이터 값은 마스킹 사본만 저장. 사용자 질의·모델 응답의 자유 문장은 개인정보가 남을 수 있어 의심 판정과 접근/보관 통제를 적용(REQ-111·109)", retention: "본문은 REQ-109.conversation_body_retention, 조회 결과는 retention_policy, 그 밖의 감사 메타데이터는 CON-032의 별도 정책" }
