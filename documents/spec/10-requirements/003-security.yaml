    volume: "해당 없음"
    config: "비노출 자연어 지침과 적용 리비전은 REQ-112·610의 전사 공통 프롬프트 규칙 관리 절차를 따른다. Portal 원문 열람 기능을 여는 설정은 두지 않는다"
