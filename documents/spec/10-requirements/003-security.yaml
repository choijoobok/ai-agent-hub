    audit: "REQ-107에 사용자 입력/기존 결과 출처·요청/동의·적용 마스킹/상한·실제 전송분·공급 경로/모델·시각·성공/실패/미확인을 연결한다. 분류용 호출도 비용과 이력을 기록한다"
