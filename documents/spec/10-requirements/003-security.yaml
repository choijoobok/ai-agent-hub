      step: "스텝(TRM-003)은 Hub에서 식별·관측하는 모델 응답 실행 1회의 기록이다. 클라이언트 요청 수·HTTP/WebSocket 연결 수·대화/세션 수·스트리밍 청크/콘텐츠 블록 수와 일치한다고 가정하지 않는다. Hub가 직접 시작하는 실행은 외부 전송 전에 시작 시도/근거를 저장하고 미전송·시작 불명을 실제 공급자 시작과 구분한다. 공급자 자동 후속은 이를 유발하는 제어의 허용/전송 기록을 먼저 저장하고, 개별 실행 시작은 실제 시작 이벤트/조회·응답 식별 근거를 확인한 때 별도 스텝으로 기록한다. 아직 시작하지 않은 예상 후속은 스텝이 아니다. 정상 응답 없이 실패·중단·결과 불명으로 끝난 실행도 보존한다. SQL·API·임베딩과 그래프 노드는 별도 작업/호출 기록이며 LLM 스텝으로 일괄 변환하지 않는다"
      facts: "사용자·세션·턴·시도·회차·스텝/실행 건·부모 작업·호출/재시도·이벤트 식별자, 업무 대상·실제 처리 유형·자료 출처·감사 표식, 이전/이후 상태·전이 사유·행위자, 발생 시각·기록 시각·서버 확정 순서/버전, 접수/시작/대기/종료 시각, 인스턴스·점유 토큰, 요청/응답 참조·정책/프롬프트/계약 버전·오류/결과 불명·사용량 원장 참조를 연결한다. 실제 수행 시간 구간은 NFR-008·REQ-006을 따르고 관측되지 않은 종료 시각을 꾸미지 않는다. 필요한 근거 요약은 기록하되 모델 내부 추론 전문을 요구하지 않는다 대화 메시지 식별/기록 순서·응답 대상 입력·원본/직전 재시도/최초 원 요청과 새 턴 참조를 기록하고 물리 관계/키는 P3에서 정한다. 기존 처리에서 확정한 입력 종류·대상 질의/대기 카드·과거 질의/결과의 문맥 의존 관계와 분류 미완료/불명확 여부를 함께 보존해 REQ-201.favorite_eligibility가 재사용한다. 관계 미기록을 독립 질의로 추정하지 않고 이를 채우기 위한 즐겨찾기 전용 모델 호출은 하지 않는다"
      append_only: "현재 상태 행의 UPDATE는 허용하지만 상태 전이 사건은 INSERT로 추가해 과거를 덮어쓰지 않는다. 시작과 종료는 같은 실행 건에 연결한다. 분류가 나중에 결정되거나 관리자 검토로 보정되면 판정 주체·시각·버전·근거를 추가하고 원 판정을 유지한다. 현재 상태·최신 분류·턴 단위 검색 요약은 이 사실들과 일치해야 한다. 접수/턴 범위 분류와 실제 스텝별 분류를 연결하며 모든 행에 무관한 분류값을 복제하지 않는다"
      atomicity: "Hub의 유효한 현재 상태 갱신과 해당 상태 전이 사건 저장은 함께 확정되거나 함께 실패해야 한다. 이를 외부 업무 트랜잭션과 분리된 감사 기록 원칙과 혼동하지 않는다. 단계 결과 감사는 점유와 무관하게 남길 수 있으나 현재 상태/스텝 진행 요약 갱신은 유효 시도·회차·점유/전이 주체·예상 버전 조건을 통과해야 한다. 동일 이벤트/접수/호출의 중복은 한 사실로 처리한다. 물리 트랜잭션·고유키·조건부 갱신 계약은 P3에서 정한다 동일 실행 변경 시 시작 회차만으로 모든 후속 결과를 버리지 않으며 서버에 저장된 적용 사건·현재 조건 버전과 유효 실행 연결을 함께 검사한다. 변경 적용이 확인되지 않은 결과는 채택하지 않는다"
      handoff: "인계 요청·성공·실패/복구, 점유 획득·해제·만료 회수, 사용자 중단 요청과 실제 중단 확정, 사용자대기 만료를 각각 근거와 함께 기록한다. 점유를 잃은 인스턴스의 늦은 응답은 이전 호출의 관측 사실로만 추가하고 현재 상태를 되살리거나 새 시도의 결과를 덮어쓰지 않는다(ARCH-070). 서버 장애로 종료 기록이 없으면 서버 회수/대조 경로가 중단·결과 불명과 확인 근거를 추가한다. 이전 외부 작업의 미관측 결과를 성공·실패로 단정하지 않는다"
      failure: "필수 접수/시작·동의·전송 시도/실행 직전 기록(ARCH-070의 action_executed 선행 표시 포함)을 확정하지 못하면 접수 성공이나 후속 외부 호출을 진행하지 않는다. 외부 호출 후 기록이 실패하면 신규 후속 작업과 최종 성공 공개를 멈추고 장애·확인 필요를 드러내며 별도 운영 오류/대조 경로로 남긴다. DB 복구 후 같은 식별자로 감사 기록을 보완하고 실제 외부 실행을 무조건 반복하지 않는다. 실행 결과 불명은 REQ-105의 확인/수동 확인 규칙을 따른다. 최종 결과·필수 감사·서버 종결 상태가 일치하기 전에 성공 응답을 확정하지 않는다"
      consumers: "Portal 폴링/진행·상세 시간은 REQ-006·019·040에 따라 현재 유효 상태와 공개 가능한 이력을 사용한다. 감사는 모든 실제 시도/회차와 분류·근거를 조회한다. REQ-036의 한도는 현재 실행 상태, 월 쿼터는 호출 원장과 집계가 기준이며 감사 사건 수를 실행 수나 토큰 사용량으로 세지 않는다. 조회 결과 원문 만료로 상태·시각·분류·전송/사용량 근거까지 함께 지우지 않는다"
      retry_lineage: "명시 재시도는 새 턴의 접수/상태/시도/스텝/호출/시간/사용량을 독립 저장하고 원 턴은 중단 이력으로 유지한다. 서버가 검증한 원본/직전/최초 참조와 메시지 관계를 접수 사실에 연결한다. 양방향 조회는 동일 관계에서 얻으며 단순 관련 참조와 재시도 관계를 구분한다. 각 사실은 실제 실행 턴/시도에 한 번만 귀속하고 연관 조회/합산으로 중복 집계하지 않는다. 관계가 같아도 동일 오류/조사로 자동 병합하지 않는다"
      intervention_lineage: "REQ-007의 변경 방식과 원/후속 실행 관계를 저장한다. 동일 응답 실행 안의 변경이 확인되면 스텝을 유지하고 입력/접수/실제 적용·조건 버전·회차/유효성 변경 사건을 추가한다. 원 시작 회차와 과거 입력을 덮어쓰지 않으며 현재 유효 조건은 적용 사건으로 판정한다. 공급자 자동 후속 또는 Hub 재요청이 실제 새 응답 실행을 만들면 같은 턴·시도 안에 별도 스텝/실행을 생성하고 원본/후속·제어 이벤트·변경 원인과 범위를 연결한다. 같은 연결/세션의 유지나 클라이언트가 새 생성 요청을 보내지 않았다는 이유로 합치지 않는다. 의도 분류도 별도 실제 응답 실행이면 보조 판정 스텝이다. 명시 중단·미실행 계획·카드/제어 접수·대기/적용 통지만으로 새 스텝을 만들지 않는다. DB 조회 등의 원/대체 호출도 별도 연결하고 관계로 시간/사용량을 복제하지 않는다"
      execution_outcome: "제어 요청 접수/반영, 취소 요청/확인, Hub 호출 수신·실행 구간의 종료 시각/근거, 공급자/DB/업무의 실제 종료·통신/업무 결과, 결과 채택/미사용 사유를 분리해 기록한다. 취소 미지원으로 원 모델 응답이 정상 도착했으면 완료·변경으로 결과 미사용이며 취소 완료가 아니다. 취소 요청만 했거나 원격 종료를 확인하지 못하면 해당 사실을 미확인으로 남긴다. Hub가 호출 처리를 끝냈다고 공급자 생성/과금 종료 시각을 꾸미지 않는다. 이미 채택했던 결과가 변경으로 무효화되면 원 채택 사실과 후속 무효화 사건을 모두 보존한다. 실행용 체크포인트 폐기와 원문 보존 기한은 감사 사실·사용량 삭제 사유가 아니다 공급자 변경 종료·Hub 취소·정상 완료를 구분하고 후속 응답이 있다는 이유로 원 실행을 취소 성공으로 바꾸지 않는다. 공급자 세션/응답의 종료를 Hub 턴 전체 종결로 자동 변환하지 않는다"
      usage_attribution: "사용량은 확인된 모델 응답 실행/도구 호출의 계량 범위에 한 번 귀속하고 사용자·턴/시도·스텝/역할·회차 및 조건 변경 사건·공급 경로/모델·외부 실행 식별과 원장 참조를 연결한다. 같은 실행의 청크/누적 usage 갱신은 같은 원장에 대조하고 공급자 자동 후속·Hub 재요청의 별도 실행은 각각 기록한다. 공급자가 실행별 값과 전체 요청/세션 누적값을 함께 보내면 중첩 범위를 합산하지 않는다. 합계만 제공하면 적용 범위를 기록하고 개별 실행 값은 미상으로 남기며 임의 배분하지 않는다. 계량의 확정/추정/미상·단위/계산기 버전·관측 범위와 추론/캐시 중복 방지는 NFR-010을 따른다. 실패·중단·미사용 실행도 포함하고 전체 미상분이 있으면 확인된 소계를 턴 전체 확정 합계로 표시하지 않는다"
      usage_correction: "늦은 계량·공급자 대조는 원 호출의 원장에 기존 근거를 보존한 정정으로 추가한다. 동일 응답 실행/계량 범위의 중복 이벤트/누적 usage 스냅샷은 합산하지 않고 호출의 유효 계량값 하나로 대조한다. 추정 700이 확정 900으로 바뀌면 유효 합산은 900이며 기존 700에 900을 다시 더하지 않는다. REQ-036 집계에는 유효값 차이만 한 번 반영하거나 같은 결과가 되는 재집계를 적용한다. 이미 닫힌 턴·무효 회차의 사용량도 원 귀속을 유지하고 현재 턴 상태·새 호출 사용량을 덮어쓰지 않는다. 사용 월/쿼터와 월별 공급자 대조는 REQ-036·NFR-010·011의 기존 기준을 따르며 회차 변경으로 예산이나 사용량을 초기화하지 않는다 연결 재사용·동일 실행 변경은 별도 사용량을 만들지 않고 각 공급자의 누적/증분 의미를 확인해 정규화한다"
      execution_identity: "Hub 실행 식별자와 공급자/API/계정 경로·응답/메시지/상호작용 또는 개별 모델 실행 식별자·부모 실행·원 제어 요청·연결 세대를 함께 대조한다. 재연결·이벤트 재수신은 같은 실행에 연결하고 공급자가 새 실행을 확인한 경우에만 새 스텝을 추가한다. 외부 ID는 저장된 Hub 범위에서 대조하고 서로 관계없는 계정/실행 문맥의 동일 문자열을 합치지 않으며 같은 실행의 재연결은 기존 이력에 연결한다. 고유 ID가 없으면 문서화·시험된 실행 경계/순서로 Hub ID를 부여한다. 메시지/블록/agent run 하나에 여러 실행이 있는 API는 개별 실행 근거를 매핑하며, 내부 경계가 비공개면 관측 가능한 응답 실행만 기록하고 미관측 실행 수·사용량 분할을 추측하지 않는다. 같은 ID라도 별도 실행을 명시하는 공급자 계약은 그 경계/실행 순번을 함께 기록한다"
      start_observation: "공급자 후속 시작을 관측한 시각과 공급자가 제공한 실제 시작 시각을 분리한다. 시작 시각이 없으면 관측 시각을 실제 시작으로 꾸미지 않는다. 시작 이벤트가 유실돼 종료/결과로 실제 실행 존재가 확인되면 같은 식별자로 이력을 보완하고 시작 시각은 미상/관측 범위를 남긴다. 중복 시작·역순 종료·종결 뒤 도착한 후속 실행도 사실/사용량은 기록하되 현재 진행을 되살리거나 후속 도구를 실행하지 않는다. 저장 장애 중 발생한 자동 실행을 기록 완료로 추정하지 않고 기존 failure 경로로 대조한다"

    verification_intervention_history:
      - {"case":"변경으로 원 요청 취소 후 새 모델 요청 및 별도 의도 분류 호출","expected":"각 실제 요청마다 시작·종료를 가진 별도 스텝/호출을 저장하고 동일 턴/시도·각 회차·원/대체 연결과 분류 역할을 보존한다. 예를 들어 1000+100+2000토큰이면 동일 호출 중복 없이 3100이다"}
      - {"case":"원 모델 응답 정상 완료지만 변경으로 미사용","expected":"완료 결과와 미사용 사유를 분리하고 취소 성공으로 기록하지 않는다. 새 스텝이 원 스텝의 시각·결과·사용량을 덮어쓰지 않는다"}
      - {"case":"명시 중단·시작 전 변경·중복 제어 이벤트","expected":"실제로 시작하지 않은 대체 모델 스텝이 없고 동일 접수/사건 재수신으로 호출·이력·사용량을 복제하지 않는다"}
      - {"case":"Hub 수신 종료 뒤 원격 생성 종료/최종 사용량 미확인","expected":"Hub 종료와 원격 미확인을 각각 기록한다. 수신된 본문 추정과 미상 내부 추론을 구분하고 원격 종료 시각·확정 0토큰을 만들지 않는다"}
      - {"case":"원 호출 추정 700 → 공급자 확정 900 → 동일 계량 재수신","expected":"원 추정 근거·정정 사실은 보존하되 유효 합계는 900이며 증분 200이 한 번 반영된다. 1600 또는 2500으로 중복 합산하지 않는다"}
      - {"case":"무효 회차/종결 턴의 늦은 계량·현재 턴은 새 호출 진행","expected":"사용량은 원 호출·원 귀속에만 정정되고 현재 진행·종결·새 호출 계량은 유지된다"}
      - {"case":"DB 조회 취소 뒤 새 조건 조회와 모델 재생성","expected":"원/새 DB 호출을 각각 기록하고 실제 새 모델 요청만 별도 모델 스텝으로 남긴다. 도구 호출/노드마다 가상의 LLM 스텝을 만들지 않는다"}
      - {"case":"확정 2000토큰과 원 호출의 일부 추정/미상 혼재","expected":"확정·추정 소계와 미상 포함 여부가 분리되고 알려진 2000을 전체 확정 사용량으로 표시하지 않는다"}
