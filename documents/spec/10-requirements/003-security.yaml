    lifecycle: "턴/스텝 현재 상태는 기존 실행 상태 계약에 따라 전이한다. 감사 사건은 추가 후 불변이며 관리자 보정은 추가 이력이다. 자료의 보존·조사 보호·만료·파기는 retention_policy에 따라 관리한다"
    permissions:
