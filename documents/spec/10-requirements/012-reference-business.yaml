    actors: [ACT-003, ACT-002]
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-004·REQ-105·REQ-111·REQ-113·PRC-11 · 2026-10-02 사용자 보완 요청: 배포 API 연결 참조와 API별 상대 경로·입출력 계약을 분리한다 · 2026-10-06 REQ-604 설명 개선 요청과 연계해 대상 시스템 선택 후 허용된 연결을 선택하는 절차를 명시한다. 같은 날 사용자 보완 요청: API 입력 필드별 값의 출처·채우기 가이드는 API 관리에, 업무별 입력 확보·조회·선택 절차는 지식에 두고 지식에 업무 API 매핑을 추가한다. 같은 날 조회/실행 승인 구분과 REQ-107의 YAML 원문 보존 정책을 함께 검토한 뒤 사용자가 카드 전체를 명시 확정했다 · 2026-10-08 사용자 결정: API 관리도 독립 승인 설정과 전체 후보·책임자 승인/전결로 처리 · 2026-10-08 사용자 추가 지시: API의 업무별 용도·사용 조건을 각 지식 매핑 건에서 관리하고 전체 카드 재검토 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-608 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다. · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다. · 2026-11-01 사용자 승인으로 기본 연결 철회·명시 연결/수동 사용·자동 유효성·워크플로우 호출 검사·경고 표시를 보완했다."
    process_step: "PRC-13-01"
    title: "업무 API 계약·입출력 명세 기준정보 관리"
    detail: "관리자는 API별로 제공 시스템을 지정하고 업무 API 계약·입력 필드별 값의 출처와 채우기 가이드·검증 조건·응답 경로 통제를 관리하며 고객사 공동 개발·시험·검수·오픈 근거를 연결할 수 있어야 한다. 지식에는 사용할 업무 API를 매핑하고 각 매핑 건에 용도·사용 조건만 작성하며 API의 공통 입력 명세와 가이드는 연결된 API 정보를 참조한다. API 공통 결과 안내·후속 처리 가이드는 result_handling_guide에 따라 관리하고, 업무 전체 절차는 REQ-303의 본문, 연결별 용도·조건은 매핑에서 참조한다. 입력·응답 코드 의미의 참조 가이드/직접 등록과 실패 처리는 field_value_mapping에서 관리한다."
    roadmap: "RM-P1"
    acceptance: "API 관리에서 이 API를 제공하는 대상 시스템을 선택하면 REQ-604의 허용 연결 목록에서 사용할 연결을 선택할 수 있다. 각 API의 명시 연결과 선택 연결 기준 서버 설정 불일치 배지를 목록에서 확인하고 안전한 사유를 배지 설명/경고에서 확인한다. API 한 건에서 연결 선택·상대 경로·HTTP 메서드·입력·응답·결과 확인·오픈 근거와 입력 필드별 자료형·필수 여부·허용값·값의 출처·채우기 가이드·검증 조건을 확인할 수 있다. 사용자 입력·데이터 조회·고정값·계산/형식 변환·서버 제공 값을 구분하고, 필요한 입력이 없거나 조회 결과에서 대상을 선택할 수 없으면 추가 확인 또는 실패 안내 없이 임의 값으로 호출하지 않는다. 지식에는 업무 API를 0개 이상 연결하고 같은 API를 여러 지식에서 참조할 수 있다. API 연결 추가·제거·교체와 매핑별 사용 설명 수정은 지식 후보 리비전의 현재 권한·기대 버전·기술 검증과 직접 저장/이력 성공 후 반영된다. 연결만으로 API 호출 권한을 얻지 않으며 실행 API는 완성된 파라미터를 제시해 승인받고 승인 후 값이 바뀌면 다시 승인받는다. 누락/미허용 연결이나 임의 절대 URL은 실행되지 않는다. 업무 인자·LLM 출력으로 고정값·서버 제공 신원·인증용 보호 헤더를 덮어쓰지 못한다. 명세 밖 응답 경로는 노출되지 않고 경고에 남으며 자격증명 원문은 화면에 나타나지 않는다 API 자체 변경도 REQ-601의 현재 변경 권한으로 직접 저장해 전체 이력을 보존하고 기존 유효본·역사·계약 검증을 유지한다 같은 API를 두 지식에서 사용하면 각 매핑에 다른 용도·사용 조건을 작성할 수 있다. 지식 본문에 API의 공통 호출 명세를 복제하지 않으며 설명만 변경해도 지식 전체 직접 저장·이력을 따른다. result_handling_guide의 공통 안내와 REQ-303의 업무별 설명을 결과 처리에도 적용하며 verification의 접수·질문/선택·조회·종료·타임아웃·승인 경계를 만족한다. 요청·응답 모두 field_metadata의 구조·의미/형식·필수/NULL·코드·개인정보 속성을 검수하고 누락/미확인을 정상 계약으로 확정하지 않는다. 실행 후 응답 검증 실패를 미실행이나 자동 재실행 근거로 사용하지 않는다. 입력·응답의 등록 필드에서 field_value_mapping의 참조 가이드/직접 등록을 관리하고 사용자 표현과 코드값을 양방향으로 해석한다. 결과 판정은 응답 직접 등록 항목을 참조한다. 권한·등록 계약을 통과한 실제 근거로 코드명을 표시하며 코드명 조회 실패는 원 업무 결과와 구분하고 원 실행을 재전송하지 않는다."
    summary: "API 공통 입력 확보·호출/응답·질문/후속 가이드는 API 관리, 업무 전체 절차는 지식 본문, 연결별 용도·사용 조건은 지식 매핑에서 관리한다"
