    process_step: PRC-13-01
    title: "프롬프트 규칙 정의·적용 조건·리비전 관리"
    detail: "권한을 가진 관리자는 프롬프트 규칙별 식별자·우선순위·적용 조건·자연어 지침 본문·활성 여부·리비전을 관리하고 변경 이력을 확인할 수 있어야 한다. 본문은 일반 자연어 문장으로 작성하며 변수 치환·데이터 필드·자료형·응답 스키마를 운영자가 정의하지 않는다. 기술 템플릿과 통신 계약은 소스에서 관리하고 agent가 호출별 동적 입력을 별도로 조합한다"
    roadmap: RM-P1
    acceptance: "운영자는 자연어 지침과 규칙 관리 속성을 편집하고 변수 치환 목록·기술 템플릿·통신 스키마는 편집하지 않는다. agent는 고정한 지침 리비전과 소스의 기술 템플릿·출력 계약·호출별 동적 입력을 조합한다. 저장 시 관리 데이터 검증, 반영 전 agent 경유 LLM 의미 검토와 관리자 판단, 소스 및 실제 입출력의 계약 검증을 prompt_contract에 따라 구분한다. 의미 검토 실패를 통과로 기록하지 않으며 자연어의 모든 모순을 서버가 기계적으로 검출한다고 보장하지 않는다. 운영 문구나 관리자 반영 판단으로 소스 계약·권한·필수 실행 승인이 바뀌지 않는다"
    summary: "허용된 안내·응답 규칙을 운영 데이터로 관리하고 실제 사용 리비전을 확인한다"
