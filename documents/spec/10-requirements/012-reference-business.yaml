    direct_management: REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다.
    text_normalization:
      decision: '2026-11-09 사용자 A 승인: 앞뒤 공백·문자 표현을 정리하고 영문 대소문자 구분 없이 중복 판정한다.'
      algorithm: NFKC → 앞뒤 Unicode 공백 제거 → ASCII A-Z를 a-z로 변환. 내부 공백은 보존. 원문과 정규화 값 모두 저장하며 정규화 버전 v1을 계약에 고정한다.
      uniqueness: 대표 표현은 태그 사이 유일, 동의어는 해당 태그 안에서 유일하며 같은 부모 대표 표현과 중복 금지. 서로 다른 태그의 동의어 일치는 검색의 복수 결과로 처리한다.
      validation: 정규화 후 빈 값·입력200자/정규화400자 초과는422. 정규화 알고리즘 변경은 전체 중복 사전 검사와 이관이 필요하다.
  - id: REQ-608
    input_api_lookup:
      selection: "입력값 확보 유형이 API 조회(API_LOOKUP)이면 현재 허용된 등록 조회 API를 검색·선택하고 안정 apiId만 저장한다. API 이름/주소 문자열로 식별하지 않는다. 대상 API의 특정 리비전·요청 필드·응답 필드 ID와 고정 입력/추출 바인딩은 저장하지 않는다."
      resolution: "LLM은 선택 API의 호출 시점 현재 유효한 입력/응답 명세와 사용 가이드, 원 입력 필드의 값 확보 가이드 및 허용된 실행 문맥을 읽어 파라미터를 구성하고 실제 응답에서 필요한 값을 해석한다. 원 API/도구에 대상 명세 사본·필드 간 대응표를 만들지 않는다. 값 출처가 API 조회인 경우 다른 API를 이름 유사성이나 모델 판단으로 대체하지 않는다."
      validation: "서버는 선택 대상 존재·현재 사용/연결 상태·조회 유형·호출 주체 권한과 최종 실제 입력의 필수·자료형·허용값을 검증한다. LLM이 값을 확정하지 못하거나 0건/복수 후보로 모호하면 추가 질문 또는 확인 불가로 처리한다. 보호 인증/신원은 서버가 주입하며 가이드/모델이 덮지 못한다. 조회 의존 순환·무한 재호출은 기존 실행 한도/정체 통제로 중단한다."
      change: "대상 API의 명칭·필드·리비전 변경만으로 참조 API/도구에 고정 매핑 수정이나 리비전 맞추기 저장을 요구하지 않는다. 실제 호출에는 그때 해석한 명세 판을 고정하고 실제 사용 판·호출/결과 근거를 실행 이력에 남긴다. 호출 준비 후 명세가 바뀌면 검증한 판과 다른 요청을 전송하지 않도록 다시 해석/검증한다. 삭제·비활성·권한 회수·조회 유형 변경/확인 실패는 호출을 막는다."
      ownership: "원 입력 필드와 조회 API 안정 ID의 연결·가이드는 소유 API/도구 전체 저장과 동형 이력에 포함한다. 내부 업무 도구 입력에도 같은 규칙을 적용하며 API_ID 소유 자식을 도구에 혼용하지 않는다."
    conditional_settings: "화면의 고정/기본값은 해당 값 출처, 마스킹 유형/수준은 실제 마스킹 적용, 식별 용도는 개인정보 식별 계약, 형식/시간대/단위는 해당 의미 유형, 별도 검증 조건은 실제 계약 제약이 있을 때만 요구한다. 비적용 값은 null이며 문자열 없음으로 대체하지 않는다. 출처/분류 변경에 따른 설정 해제는 명시 확인과 전체 저장 검증으로 처리한다."
    schema_sync:
      preserved_reference: "기존 참조가 보존 불일치 필드/재확인 설정을 가리키는 경우 정확 대상과 오류 상태를 유지해 전체 구성 저장은 허용하되 해당 자산의 정상 실행 계약 제공을 차단한다. 임의 없는 ID·다른 소유 ID·참조 위조는 저장 자체를 거부한다. 참조 해소 전 필드 삭제는 금지한다. 다른 결과/필드 참조 저장 검증보다 이 명시 보존 예외를 우선한다."
      decision: "2026-11-04 사용자 요청. API 바디/응답 원본은 상단 목록의 현재 내용 마스터에 저장하고 필드는 원천에서 자동 도출한다. 도구는 상단 서비스 빈 정보 리로드로 현재 명세를 확인한다. 불일치 필드 보존·설정 복사/붙여넣기·탭별 일괄 삭제를 제공한다."
      ownership: "업무 API의 바디/응답 JSON 스키마는 상단 목록 행의 현재 내용 ENT-012의 두 소유 속성으로 저장하며 ENT-061에 동형 보존한다. 안정 ID/REVISION은 ENT-011 소유다. 필드 ENT-013/063에 원본을 복제하지 않고 대조한 원본/리비전 근거를 보존한다. 원본·도출 필드·판정/보충 설정·정리·전체 이력/명령 결과는 같은 원자 저장 단위다."
      source: "저장 원본은 JSON Schema 구조 정의이며 실제 업무 요청/응답 샘플 값이 아니다. 정적 properties/type/items/required와 null 허용을 도출한다. API 탭의 JSON 스키마 편집 창에서 원본을 편집하고 JSON 샘플은 구조 초안 생성에만 사용한다. 샘플 값은 저장/이력/프롬프트로 보내지 않는다. 본문 없음은 명시적인 상태다. 빈 입력·파싱 실패·미지원/부분 해석을 빈 스키마로 간주하지 않는다. 제품의 버전/지원 어휘·복합/참조 계약은 후속 상세 설계에서 선언하며 지원하지 않는 구조는 명시 오류로 거부한다."
      identity: "방향·영역·정적 PROPERTY/ITEM 토큰의 정확 일치로 식별한다. 신규 경로만 새 안정 ID/clientKey로 도출하고 수동 추가·경로/형/필수 편집은 금지한다. 같은 경로는 안정 ID·설명/가이드/정책을 유지하고 경로 변경은 신규+기존 불일치로 처리한다. 이름 유사도로 자동 이동하지 않는다. 배열 []·특수 키·루트 스칼라 $ 구분은 api_workspace.sample_import를 따른다."
      match: "schemaMatched는 현재 유효 원본에 해당 경로가 있으면 true, 없으면 false, 유효 대조 근거가 없으면 null이다. 현재 원천 버전/관측 근거·사유를 함께 보존하고 서버가 저장/삭제 때 재판정한다. false 필드도 ID와 보충 설정을 유지하여 이후 이관할 수 있다. 같은 경로의 자료형/필수/NULL 변경은 true인 채 기존 보충 설정의 재확인을 요구한다. 구조 변화 자체는 삭제 자격이 아니다."
      preservation: "유효한 전체 원본으로만 두 구조를 대조한다. 파싱/리로드 실패·부분 관측·동적 미확정·취소는 기존 원본·그리드·판정을 유지한다. 도구 빈 선택이 바뀌면 이전 관측으로 신규 빈 일치를 주장하지 않고 리로드 필요로 표시한다. 필드 경로가 다시 나타나면 보존한 안정 ID/설정을 재사용하되 형·제약 변경을 재검증한다."
      clipboard: "같은 자산/같은 탭의 선택 필드에서 설명·값 출처/확보/해석 가이드·고정/기본값·개인정보/마스킹·결과 역할/설명 등 그리드의 보충 설정만 복사한다. 호환 자료형·현재 변경/정책 권한을 검증하고 대상값 변경 미리보기/명시 덮어쓰기 확인 후 반영한다. 경로/방향/자료형/필수/NULL/소유 필드 안정 ID/일치 판정/원천 버전·비밀/서버 보호값은 복사하지 않는다. 별도 의미 매핑·코드 항목·결과 판정/다른 필드 참조는 자동 복제/이동하지 않고 명시 재연결한다. 타 자산/탭 또는 비호환 자료형은 거부한다. API 조회의 대상 API 안정 ID는 값 출처/가이드와 함께 복사할 수 있는 보충 설정이다. 현재 대상 허용 여부를 재검증하며 대상 API의 판/필드 ID는 복사 설정에 존재하지 않는다."
      cleanup: "바디/응답 및 내부 입력/응답 필드 그리드의 행 삭제 컬럼을 없애고 탭 툴바에 스키마 불일치 필드 일괄 삭제를 둔다. 해당 탭의 전체 false 행만 건수/경로를 확인하며 true/null은 제외한다. 현재 의미/코드·결과 판정·값 출처·응답 접근 예외/외부 기술 참조가 있으면 전체 삭제를 막고 해소할 참조를 안내한다. 참조 해소 후 명시 확인으로 로컬 삭제 표시하며 전체 저장 시 서버가 최신 원본/기대 버전/판정/권한/참조를 다시 검사한다. 과거 HIST/실행 근거는 삭제하지 않는다."
      consumption: "불일치 필드는 정리 전 전체 저장으로 보존할 수 있지만 현재 실행/모델 명세와 신규 의미/결과/응답 정책 선택 후보에서는 제외한다. 현재 유효 참조가 불일치 필드를 가리키거나 변경 구조의 설정 검증이 미완료이면 정상 실행 계약으로 사용하지 못한다. 저장 가능한 보존 정보와 실행 가능한 계약을 구분한다."
    runtime_tool: "ADR-042·REQ-612.api_tool_mapping. 현재 API 계약에서 agent 실행 기술자를 구성한다. SCR-019의 내부 도구 등록·별도 toolId/이중 그룹 매핑은 요구하지 않는다. 지식 API 연결·API 사용/권한·연결 설정 일치·신원·실행 승인 등 현재 통제는 유지한다."
    response_access:
      source: "응답 필드가 개인/민감 분류·정보 유형·이력 마스킹 수준의 원천이며 그룹 예외는 해당 API의 활성 호출 허용 그룹과 등록 응답 경로만 참조한다. API 정책 변경 권한과 정의 변경 권한을 분리한다."
      default: "별도 그룹 예외가 없으면 개인/민감 필드는 이력과 같은 유형·수준으로 Portal에 제공한다. 분류가 검수된 비민감 필드는 원문을 제공한다. 미확인/미등록/마스킹 누락은 원문 허용으로 바꾸지 않는다."
      modes: "그룹별 전달 방식은 기본값 사용·별도 마스킹·원문 허용·미전송이다. 별도 마스킹은 원 필드와 같은 정보 유형의 배포 유틸 지원 수준만 선택하고 방법은 읽기 전용으로 표시한다. 임의 유형 변경·정규식·스크립트·노출 자릿수 편집은 제공하지 않는다."
      merge: "사용자의 현재 활성 소속과 API 활성 허용 그룹의 교집합만 대상으로 각 그룹의 기본값/예외를 먼저 계산한다. 어느 그룹에서든 원문이 허용되면 원문, 원문 없이 마스킹만 허용되면 같은 정보 유형·같은 유틸 버전의 등록 수준 중 덜 엄격한 수준(가리는 정도가 낮은 순위)을 선택한다. 미전송은 다른 그룹의 허용을 취소하지 않는다. 모든 그룹이 미전송이면 미전송이다. 타입이 다르거나 순위가 없거나 비교 불가능한 수준은 권한 합집합의 근거로 쓰지 않고 설정 오류로 처리해 해당 값을 내보내지 않는다."
      boundary: "그룹 예외·합집합은 Portal 전달에만 적용한다. 이력 사본은 항상 필드의 이력 마스킹을 유지하며 원문 권한으로 해제하지 않는다. 모델 전송은 REQ-106의 현재 요청/동의·보안 검사를 별도로 적용한다. 마스킹은 서버에서 전송/저장 전에 수행하며 브라우저에 원문을 보내 가리지 않는다."
    api_extension:
      decision: "CR-050 B·ADR-051. 공통 ENT-011 API_ID와 API_KIND_CD를 유지한다. 현재 REST_JSON만 지원하며 신규 시 서버가 고정하고 일반 수정으로 종류를 전환하지 않는다. ENT-059 전체 이력에 종류를 함께 보존한다."
      common_content: "ENT-012/061의 명칭·제공 시스템·연결·HTTP 기본 계약·공통 가이드/검수는 공유한다. 후속 SAP 자식은 같은 API_ID와 마스터 버전/HISTORY_NO를 사용한다. 그룹·지식 등은 공통 API_ID를 참조하며 연결 목록에 종류별 자식의 필수 내부 조인이나 REST 전용 필터를 넣지 않는다."
      followup: "@defer SAP OData — ADR-051의 착수 확인 목록을 따라 버전·실제 서비스·전용 자식/이력·선택 전용 메뉴·쿼리/페이지·CSRF·ETag·배치를 설계한다. 현재 화면/실행의 지원 완료가 아니며 별도 메뉴여도 공통 자산/권한/참조를 유지한다."
    api_workspace:
      decision: "2026-11-04 사용자 승인. 업무 API는 상단 기본 계약과 10개 하단 탭으로 관리하며 요구사항·목업·HTML을 함께 보완한다. 제품 구현·G3 게이트 승인은 별도다."
      tabs:
        - "API 사용 가이드"
        - "경로 변수"
        - "쿼리 파라미터"
        - "헤더 파라미터"
        - "바디 JSON 스키마"
        - "응답 JSON 스키마"
        - "필드값 의미 매핑"
        - "사용자 그룹"
        - "응답 데이터 접근 제한 설정"
        - "연결 지식"
      transport: "HTTP/HTTPS REST이며 요청·응답 본문은 JSON만 지원한다. XML·SOAP·폼 인코딩·multipart·파일/바이너리 본문은 지원하지 않는다. 본문 없는 요청과 계약에 명시한 본문 없는 정상 응답은 허용한다. Content-Type/Accept는 계약에서 JSON으로 정하며 사용자/모델이 변경하지 못한다. 비JSON 오류 응답은 계약/통신 오류로 처리하고 원문을 화면·이력·모델로 전송하지 않는다."
      master: "상단에 멱등성 보장 여부와 메모를 둔다. 기본 미보장과 API 자체의 보장 여부는 REQ-105.idempotency_contract를 따른다. 검수 근거 별도 탭·구조화 입력은 없으며 메모에 계약·담당자·시험/오픈 근거를 자유 기록한다. 메모를 자동 파싱해 검수/오픈 완료·승인으로 판정하지 않는다. 고객사 공동 시험·오픈 책임은 IF-002를 유지하고 별도 미래 적용일 스케줄을 새로 만들지 않는다. 바디·응답 JSON 스키마 원본은 상단 API 내용 마스터의 두 속성으로 저장하고 각 상세 탭의 편집 창에서 수정한다."
      guide: "자유 작성 textarea 하나에 파라미터 생성 순서·주의점, 응답 해석, 호출 전후 사용자 확인·대화·후속 처리 안내, 멱등성 보장 여부에 대한 선택 설명, 재실행 제한과 결과 확인 방법을 작성하고 허용된 API의 모델 문맥에 주입한다. result_handling_guide의 자연어 가이드를 통합하며 권한·실행 승인·입력 검증·서버 결과 판정·재시도 제한을 변경하지 못한다. 인증 비밀·실사용자 식별값·신원 토큰은 예시/가이드에 넣지 않는다. 호출 계약의 설명은 이 가이드에 통합하고 별도 창/입력 항목을 두지 않는다. 자유문을 파싱해 REQ-105의 서버 실행 조건을 변경하지 않는다."
      path_variables: "경로 변수는 이름 컬럼 없이 API 판 안의 변수 순서(1부터 연속)를 키로 하고 설명·자료형·값 출처·값 확보 가이드를 관리한다. 순서는 URL 전체 세그먼트 번호가 아니라 상대 경로 템플릿을 왼쪽부터 읽은 변수 자리의 등장 순서다. /companies/{companyId}/orders/{orderId}의 1은 회사, 2는 주문이다. 이름은 서버 템플릿에 있을 수 있으나 사용자 입력 식별키로 중복 관리하지 않는다. 고정 구간을 보존하며 각 값은 단일 경로 세그먼트로 인코딩한다. 값으로 슬래시/상위 경로/쿼리/호스트를 주입할 수 없다. 모두 필수이며 null·빈 값·순서 중복/누락·자리수 불일치를 거부한다. 템플릿 변경은 기존 바인딩을 자동 이동하지 않고 재검증한다."
      parameters: "쿼리·헤더는 각각 이름을 키로 하는 별도 탭이다. 값 출처·자료형·필수·기본/고정값·값 확보 가이드를 관리한다. 헤더명은 대소문자를 무시해 중복 검사한다. 쿼리 배열의 반복 키/구분자와 인코딩은 계약에 명시한다. 인증·신원·요청 키·보호 헤더는 서버 제공으로 잠그고 비밀 원값을 저장/모델에 주입하지 않는다. 요청의 경로·쿼리·헤더·본문에도 field_metadata.privacy를 적용한다."
      sample_import: "JSON 샘플은 JSON 스키마 편집 창의 구조 초안 생성 보조 수단이다. 원샘플은 저장하지 않고 명시 검토한 스키마만 상단 내용 마스터에 저장한다(schema_sync). 객체/배열·루트 배열·스칼라를 유지하며 배열은 items[].productId, 루트 배열은 [].id, 스칼라는 $다. 점/대괄호/달러가 든 실제 키는 PROPERTY 토큰과 JSON 따옴표로 구별한다. 중복 키/잘못된 JSON은 거부한다."
      inference: "샘플의 배열 항목 합집합으로 구조 초안을 만들지만 필수·NULL·개인정보·업무 의미를 확정하지 않는다. 빈 배열·null만 있는 값·혼합형은 원본 스키마 보완을 요구한다. 필드 동기화·보존·재확인·정리는 schema_sync가 정본이다. 도출 필드 수동 추가/행별 삭제·구조 편집은 금지한다."
      response: "응답은 값 확보 가이드 대신 의미·해석 가이드, 개인/민감정보 여부, 이력 마스킹 유형/수준·읽기 전용 방법 설명, 결과 관련 여부·역할·설명을 관리한다. 결과 코드/상태/메시지/요청 식별자를 구분하고 값별 성공·실패·접수/처리 중 판정을 구조화한다. HTTP 성공과 업무 완료를 구분하고 비동기 접수를 완료로 간주하지 않는다. 미등록 값·응답 부재는 결과 불명이며 자동 재전송하지 않는다. 결과 해석은 서버의 허용된 처리 안에서 수행하고 공개/저장/모델용 사본에 각각 통제를 적용한다."
      placement: "field_value_mapping이 입력/응답 공통 코드 의미의 정본이며 응답 JSON 다음 탭으로 배치한다. 기존 코드명 설정 창을 대체한다. 구조화 결과 판정만 응답 상세 창에 두고 응답 직접 등록 항목을 참조한다. 호출 계약 설명은 API 사용 가이드에 통합한다. 연결 지식은 열 번째 조회 전용 탭이며 입력/저장 대상이 아니다. 10탭과 상세 창의 편집 입력은 하나의 API 전체 구성·기대 버전·변경 이력 단위다. 대응 도구 표시는 제공하지 않는다."
    timeout_policy:
      editor: "상단 호출 제한(초)은 선택 숫자 입력이며 ARCH-033.calls의 허용 범위 정수를 사용한다. 공란은 null로 저장해 공통값을 상속하고 공통값 사용 문구는 placeholder/설명으로만 표시한다. 문자·소수·0·음수·범위 초과를 받지 않는다."
      decision: "2026-10-27 사용자 요청 — 공통 호출 제한을 기본으로 사용하되 오래 걸리는 API는 API별 타임아웃을 별도 설정할 수 있다"
      definition: "API 관리 계약에 선택적인 전체 호출 제한(초)을 둔다. 미지정이면 ARCH-033.calls의 일반 외부 도구 기본값, 지정하면 해당 API 계약 리비전의 값을 우선한다. 입력 범위는 같은 항목의 허용 범위를 적용하고 0·음수·무제한을 받지 않는다. 연결 제한은 유효 전체 제한 이하로 검증한다"
      ownership: "admin API 소유의 비밀 아닌 계약 속성이다. 제공 시스템/연결 주소·인증이나 업무 입력으로 옮기지 않고 API 전체 현재 권한·기대 버전·기술검증·직접 저장/이력으로 관리한다."
      application: "호출 전 검증해 확보한 API 계약 리비전·최종 제한값·공통값/개별값의 출처를 호출 이력에 연결하고 그 호출 동안 고정한다. 이미 전송한 호출의 타이머를 설정 변경으로 줄이거나 늘리지 않는다. 모델·사용자 업무 입력·헤더가 제한값을 덮지 못한다"
      approval: "REQ-026의 승인 후 호출 시작 기한과 실행 지속 시간을 구분한다. 기한 안에 시작한 호출은 API의 유효 호출 제한을 따르며 승인 만료만으로 이미 전송된 외부 작업이 취소됐다고 간주하지 않는다. 후속 액션은 전송 직전 별도로 승인 기한을 검사한다"
      validation: "개별값 변경의 후보 검수·유효본 반영과 실행 전 검사에서 ARCH-070의 점유 유지/갱신·허용 재시도 경로·실제 연결/프록시 제한과 함께 대조한다. 긴 API는 ARCH-033.technical_parameters.lease_validation의 검증된 독립 갱신 경로를 사용할 수 있으며, 숫자만 길게 설정하거나 미지원 경로로 자동 전환하지 않는다. 현재 실행 경로/고정 점유와 맞지 않으면 호출을 전송하지 않고 필요한 설정/지원 조건과 미충족 사유를 알린다"
      failure: "타임아웃은 외부 취소 성공·업무 실패의 확정 근거가 아니다. 전송한 실행/결과 불명은 REQ-105·NFR-022의 확인·새 승인 경계를 적용한다. 요청을 오래 기다렸다는 이유로 자동 재전송하지 않는다"
      verification: ["개별값 미지정은 공통 기본값, 지정은 개별값으로 해석하고 원천·리비전을 기록한다", "같은 물리 연결을 쓰는 두 API에 서로 다른 값을 지정해도 각각의 계약값을 사용한다", "호출 시작 뒤 개별값 변경은 진행 중 타이머를 바꾸지 않고 업무 입력의 제한값 변조도 거부한다", "승인 기한 안에 시작한 장기 API는 자체 호출 제한으로 제어하며 다음 액션의 승인 만료를 우회하지 않는다", "600초 API와 360초 점유는 본문 갱신 없는 경로에서 거부한다. 독립 갱신·고정 호출 기한·프록시 검수가 된 경로에서는 허용하고, 갱신 성공만으로 600초를 연장하지 않는다"]
    type: "functional"
    priority: "must"
