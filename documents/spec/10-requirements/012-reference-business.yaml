  - id: REQ-608
    timeout_policy:
      decision: "2026-10-27 사용자 요청 — 공통 호출 제한을 기본으로 사용하되 오래 걸리는 API는 API별 타임아웃을 별도 설정할 수 있다"
      definition: "API 관리 계약에 선택적인 전체 호출 제한(초)을 둔다. 미지정이면 ARCH-033.calls의 일반 외부 도구 기본값, 지정하면 해당 API 계약 리비전의 값을 우선한다. 입력 범위는 같은 항목의 허용 범위를 적용하고 0·음수·무제한을 받지 않는다. 연결 제한은 유효 전체 제한 이하로 검증한다"
      ownership: "admin API 소유의 비밀 아닌 계약 속성이다. 제공 시스템/연결 주소·인증이나 업무 입력으로 옮기지 않고 API 전체 현재 권한·기대 버전·기술검증·직접 저장/이력으로 관리한다."
      application: "호출 전 검증해 확보한 API 계약 리비전·최종 제한값·공통값/개별값의 출처를 호출 이력에 연결하고 그 호출 동안 고정한다. 이미 전송한 호출의 타이머를 설정 변경으로 줄이거나 늘리지 않는다. 모델·사용자 업무 입력·헤더가 제한값을 덮지 못한다"
      approval: "REQ-026의 승인 후 호출 시작 기한과 실행 지속 시간을 구분한다. 기한 안에 시작한 호출은 API의 유효 호출 제한을 따르며 승인 만료만으로 이미 전송된 외부 작업이 취소됐다고 간주하지 않는다. 후속 액션은 전송 직전 별도로 승인 기한을 검사한다"
      validation: "개별값 변경의 후보 검수·유효본 반영과 실행 전 검사에서 ARCH-070의 점유 유지/갱신·허용 재시도 경로·실제 연결/프록시 제한과 함께 대조한다. 긴 API는 ARCH-033.technical_parameters.lease_validation의 검증된 독립 갱신 경로를 사용할 수 있으며, 숫자만 길게 설정하거나 미지원 경로로 자동 전환하지 않는다. 현재 실행 경로/고정 점유와 맞지 않으면 호출을 전송하지 않고 필요한 설정/지원 조건과 미충족 사유를 알린다"
      failure: "타임아웃은 외부 취소 성공·업무 실패의 확정 근거가 아니다. 전송한 실행/결과 불명은 REQ-105·NFR-022의 확인·새 승인 경계를 적용한다. 요청을 오래 기다렸다는 이유로 자동 재전송하지 않는다"
      verification:
        - "개별값 미지정은 공통 기본값, 지정은 개별값으로 해석하고 원천·리비전을 기록한다"
        - "같은 물리 연결을 쓰는 두 API에 서로 다른 값을 지정해도 각각의 계약값을 사용한다"
        - "호출 시작 뒤 개별값 변경은 진행 중 타이머를 바꾸지 않고 업무 입력의 제한값 변조도 거부한다"
        - "승인 기한 안에 시작한 장기 API는 자체 호출 제한으로 제어하며 다음 액션의 승인 만료를 우회하지 않는다"
        - "600초 API와 360초 점유는 본문 갱신 없는 경로에서 거부한다. 독립 갱신·고정 호출 기한·프록시 검수가 된 경로에서는 허용하고, 갱신 성공만으로 600초를 연장하지 않는다"
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-003"
      - "ACT-002"
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-004·REQ-105·REQ-111·REQ-113·PRC-11 · 2026-10-02 사용자 보완 요청: 배포 API 연결 참조와 API별 상대 경로·입출력 계약을 분리한다 · 2026-10-06 REQ-604 설명 개선 요청과 연계해 대상 시스템 선택 후 허용된 연결을 선택하는 절차를 명시한다. 같은 날 사용자 보완 요청: API 입력 필드별 값의 출처·채우기 가이드는 API 관리에, 업무별 입력 확보·조회·선택 절차는 지식에 두고 지식에 업무 API 매핑을 추가한다. 같은 날 조회/실행 승인 구분과 REQ-107의 YAML 원문 보존 정책을 함께 검토한 뒤 사용자가 카드 전체를 명시 확정했다 · 2026-10-08 사용자 결정: API 관리도 독립 승인 설정과 전체 후보·책임자 승인/전결로 처리 · 2026-10-08 사용자 추가 지시: API의 업무별 용도·사용 조건·입력 확보 설명을 각 지식 매핑 건에서 관리하고 전체 카드 재검토 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-608 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다. · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다."
    process_step: "PRC-13-01"
    title: "업무 API 계약·입출력 명세 기준정보 관리"
    detail: "관리자는 API별로 제공 시스템을 지정하고 업무 API 계약·입력 필드별 값의 출처와 채우기 가이드·검증 조건·응답 경로 통제를 관리하며 고객사 공동 개발·시험·검수·오픈 근거를 연결할 수 있어야 한다. 지식에는 사용할 업무 API를 매핑하고 각 매핑 건에 용도·사용 조건과 업무별 입력 확보·조회·선택 절차를 작성하며 API의 공통 입력 명세와 가이드는 연결된 API 정보를 참조한다. API 공통 결과 안내·후속 처리 가이드는 result_handling_guide에 따라 관리하고, 업무별 설명은 REQ-303의 매핑에서 참조한다. 응답 코드명 제공 방법·원천과 실패 처리는 code_name_resolution에서 관리한다."
    roadmap: "RM-P1"
    acceptance: "API 관리에서 이 API를 제공하는 대상 시스템을 선택하면 REQ-604의 허용 연결 목록에서 사용할 연결을 선택할 수 있다. 시스템 기본 연결 사용을 선택한 경우와 특정 연결 식별자를 직접 선택한 경우를 구분하고 적용되는 연결을 확인할 수 있다. API 한 건에서 연결 선택·상대 경로·HTTP 메서드·입력·응답·결과 확인·오픈 근거와 입력 필드별 자료형·필수 여부·허용값·값의 출처·채우기 가이드·검증 조건을 확인할 수 있다. 사용자 입력·데이터 조회·고정값·계산/형식 변환·서버 제공 값을 구분하고, 필요한 입력이 없거나 조회 결과에서 대상을 선택할 수 없으면 추가 확인 또는 실패 안내 없이 임의 값으로 호출하지 않는다. 지식에는 업무 API를 0개 이상 연결하고 같은 API를 여러 지식에서 참조할 수 있다. API 연결 추가·제거·교체와 매핑별 사용 설명 수정은 지식 후보 리비전의 현재 권한·기대 버전·기술 검증과 직접 저장/이력 성공 후 반영된다. 연결만으로 API 호출 권한을 얻지 않으며 실행 API는 완성된 파라미터를 제시해 승인받고 승인 후 값이 바뀌면 다시 승인받는다. 누락/미허용 연결이나 임의 절대 URL은 실행되지 않는다. 업무 인자·LLM 출력으로 고정값·서버 제공 신원·인증용 보호 헤더를 덮어쓰지 못한다. 명세 밖 응답 경로는 노출되지 않고 경고에 남으며 자격증명 원문은 화면에 나타나지 않는다 API 자체 변경도 REQ-601의 현재 변경 권한으로 직접 저장해 전체 이력을 보존하고 기존 유효본·역사·계약 검증을 유지한다 같은 API를 두 지식에서 사용하면 각 매핑에 다른 용도·사용 조건을 작성할 수 있다. 지식 본문에 API 호출 안내를 중복하지 않으며 설명만 변경해도 지식 전체 직접 저장·이력을 따른다. result_handling_guide의 공통 안내와 REQ-303의 업무별 설명을 결과 처리에도 적용하며 verification의 접수·질문/선택·조회·종료·타임아웃·승인 경계를 만족한다. 요청·응답 모두 field_metadata의 구조·의미/형식·필수/NULL·코드·개인정보 속성을 검수하고 누락/미확인을 정상 계약으로 확정하지 않는다. 실행 후 응답 검증 실패를 미실행이나 자동 재실행 근거로 사용하지 않는다. 응답 코드 필드에서 code_name_resolution의 네 제공 방법과 필요한 참조/대응 조건을 관리할 수 있다. 권한·등록 계약을 통과한 실제 근거로 코드명을 표시하며 코드명 조회 실패는 원 업무 결과와 구분하고 원 실행을 재전송하지 않는다."
    summary: "API의 검증된 계약·공통 파라미터 구성 가이드는 API 관리에, 업무별 용도·사용 조건·입력 확보 절차는 지식의 각 API 매핑 설명에 두고 참조한다"
