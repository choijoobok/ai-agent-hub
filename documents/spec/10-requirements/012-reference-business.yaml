    preconditions: ["공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다", "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"]
    idempotency_link:
      policy: "API·도구 자체의 멱등성 보장 여부만 boolean으로 관리하며 기본값은 false다. 기간·키 조건을 Hub의 별도 설정이나 보장 판정 필수값으로 관리하지 않는다. 제공자/구현 책임자의 확인을 근거로 설정하고 설명은 자유 메모에 남긴다. REQ-105.idempotency_contract가 정본이며 모델이나 HTTP 메서드로 보장을 추정하지 않는다."
      usage: "멱등성 설정은 최초 실행 승인·자동 재시도 제한을 면제하지 않는다. 결과 불명 뒤 사용자 대상 시스템 확인·새 승인·후속 실행/반복은 REQ-105.manual_reexecution과 NFR-022를 따른다."
    data:
      - {"item":"기본 계약: API 식별자·명칭·설명·대상 시스템·조회/실행 유형·HTTP 메서드·기본 주소에 대한 상대 경로·연결 선택(허용 목록의 명시적 필수 연결 식별자)","origin":"고객사 API 계약·관리자 등록 및 REQ-604의 허용 연결 목록","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"인증·신원·입력: 참조 연결의 인증 방식과 REQ-609.identity_verification의 신원 전달 계약 확인·파라미터 명세와 개인정보 표시. 독립 신원 필요 스위치는 두지 않는다","origin":"계약 검수 결과·배포 연결 참조. 실제 인증값·공통 고정 헤더는 배포 설정 원천","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"입력 필드별 구성: 필드 식별자·전달 위치·업무 의미·자료형·필수 여부·허용값/검증 조건·값의 출처·출처 선택 조건·채우기 가이드·고정값/기본값·조회 API 안정 ID와 자연어 값 확보 가이드 또는 기존 허용 데이터 조회 참조·계산/형식 변환 안내·입력 부족/모호성 처리","origin":"검수된 API 계약과 관리자 등록. 공통 조회·질문 순서는 API 사용 가이드, 업무 전체 흐름은 지식 본문 참조","sensitivity":"업무 입력 명세 — 인증 비밀값 제외, 실제 파라미터의 개인정보 처리는 REQ-111","retention":"API 계약·관리 변경 이력과 실행에 사용한 내용 버전은 REQ-108·REQ-601을 따른다"}
      - {"item":"실행·후속 확인: 타임아웃·재시도 정책·멱등성 보장 여부·자기 응답의 성공 의미(완료/접수)·결과 확인에 사용할 API 가이드 안내(구체 입력/응답은 조회 API 자체 명세 사용)","origin":"고객사 계약","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"응답 통제: 응답 경로·의미 유형·마스킹 대상·정보주체 식별자 여부·LLM 전송 정책 참조(REQ-106)","origin":"검수된 응답 스키마","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"변경 근거: 상단 메모에 업무 설명·계약/담당자·시험/공동 오픈 근거 자유 기록. 별도 구조화 필수 양식/미래 적용일 자동 오픈 없음","origin":"고객사 공동 오픈 자료","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"API 사용 가이드: 입력 생성·주의점·응답 해석·호출 전후 확인/대화·후속 처리의 통합 자유 작성 안내","origin":"검수된 계약을 참조하는 관리자 자연어 작성","sensitivity":"내부 업무 명세 — 비밀값 원문 제외","retention":"API 전체 후보·불변 스냅샷과 기존 관리/실행 이력 정책"}
      - {"item":"필드값 의미 매핑: 5위치의 안정 필드·설정 방식·설명·참조 가이드 또는 자료형 보존 코드값/명칭/의미·사용 조건. 결과 판정은 응답 직접 등록 항목을 참조","origin":"관리자 등록과 허용된 실제 코드 조회 근거","sensitivity":"업무 명세 — 실제 비밀/민감 원값과 신원 토큰 제외","retention":"API 전체 구성/동형 이력과 실행 당시 버전 정책"}
    field_usage:
      - attribute_group: "기본 계약"
        used_for: "계획 수립과 허용된 업무 API 호출"
      - attribute_group: "인증·신원·입력"
        used_for: "인증·사용자 신원 전달·입력 검증·저장 사본 마스킹"
      - attribute_group: "입력 필드별 구성"
        used_for: "사용자 질문·허용 데이터 조회·고정값 적용·변환·서버 주입을 통한 값 구성과 호출 전 검증"
      - attribute_group: "지식 연결"
        used_for: "업무별 API 선택과 입력 확보 순서 안내, 지식 변경 승인 및 당시 참조 근거 재현"
      - attribute_group: "실행·후속 확인"
        used_for: "재시도 안전성·접수 후 결과 확인·사용자 결과 안내"
      - attribute_group: "응답 통제"
        used_for: "등록 경로 기반 결과 공개/마스킹·감사와 REQ-106의 요청·동의 기반 전송 통제"
      - attribute_group: "변경 근거"
        used_for: "PRC-11의 동기화된 등록·변경 판단"
      - attribute_group: "공통 결과 안내·후속 처리 가이드"
        used_for: "허용된 결과 설명·질문과 사용자 응답 이후의 검증된 후속 처리 제안"
    consumers:
      - where: "agent 계획·실행"
        when: "허용 API 선택부터 응답 처리까지"
        how: "REQ-105·REQ-111·REQ-113의 실행/개인정보/공동 오픈 통제를 적용한다"
      - where: "지식 관리·agent 업무 해석"
        when: "지식 후보 작성·검색/주입·파라미터 구성 시"
        how: "지식에서 등록된 API를 정형으로 매핑하고 해당 매핑의 사용 설명과 API 공통 입력 명세를 함께 참조한다. 내용 버전은 REQ-108, 지식 매핑 변경 승인은 REQ-305·306을 따른다"
      - where: "API 그룹·도구 노출 관리"
        when: "그룹·도구 매핑 시"
        how: "등록된 API 식별자를 참조하고 계약·응답 속성을 복제하지 않는다"
    field_metadata:
      source: "2026-10-22 사용자 보완 요청: 요청뿐 아니라 응답의 필드명·경로·자료형·업무 의미/형식·필수/NULL·공통코드 참조와 개인정보 관리 범위를 요구사항에서 명시한다. 실제 속성명·저장·화면 표현은 P3에서 정한다"
      attributes: "요청 파라미터와 응답의 각 값 필드에 이름/경로·업무 명칭/설명·전달 자료형·의미 유형, 경로/값의 필수 여부와 NULL 허용 여부·허용값/검증 조건을 관리한다. 객체·배열의 하위 값은 경로로 식별하며 응답 경로 표현은 REQ-111의 정적 경로·배열 와일드카드 범위를 유지한다. 날짜·일시·금액·수량·코드 등은 전달 자료형과 구분하고 해석에 필요한 형식·시간대 또는 단위를 해당하는 경우 명시한다. 필드 부재와 NULL·0·빈 문자열을 자동으로 같은 값으로 취급하지 않는다"
      value_domain: "코드 의미는 field_value_mapping의 참조 가이드/직접 등록이 정본이다. 입력 허용값·기본/고정값은 별도 명세이며 의미 매핑 등록으로 자동 변경하지 않는다. 실제 전송값은 서버가 기존 필수·타입·허용값을 검증한다. API 제공 시스템에서 데이터소스/동명 코드 그룹을 추정하지 않는다. 미등록 값·모호한 의미를 만들어내거나 매핑을 지식별로 복사하지 않는다."
      privacy: "요청·응답 모두 REQ-111.privacy_metadata의 개인정보 해당 여부/유형·식별 용도·마스킹 참조·검수 상태를 이 API 명세 원천에서 관리한다. 그룹 매핑 화면은 원천을 참조하며 공통 변환·열람 모드는 REQ-611, 전송 동의는 REQ-106을 따른다. 등록된 필드라는 사실만으로 개인정보 검수나 원본 제공·전송 허용이 완료된 것으로 보지 않는다"
      validation: "후보 검수·운영 반영 전에 경로와 타입·의미/형식·필수/NULL·코드 참조·개인정보 기준의 완전성과 일관성을 검사한다. 미완성/미확인 후보를 정상 운영 계약으로 확정하지 않는다. 호출 전에는 실제 입력과 필수값·타입·허용값·형식을 대조하고, 응답은 등록 계약과 실제 경로·타입·필수/NULL·값 의미를 대조한다. 필수 누락·형식 불명·명세 불일치를 임의 값·코드명·날짜로 보정하지 않고 보완 또는 REQ-111·115의 가림·경고/오류로 처리한다. 이미 상태 변경이 발생한 API의 응답 검증 실패를 미실행으로 단정하거나 자동 재실행하지 않으며 결과 확인은 REQ-105·NFR-022를 따른다"
      boundary: "입력 확보 출처/질문/고정/서버 주입 규칙은 입력 계약을 따른다. 응답에 입력 절차/DB외래키를 강제하지 않는다. 속성 변경은 API 전체 직접 저장/이력이며 비밀·보호 헤더는 이곳에 복제하지 않는다."
    field_value_mapping:
      schema_boundary: "schema_sync.consumption. 불일치 필드의 기존 매핑은 설정 이관/참조 해소를 위해 표시하되 신규 후보/실행 명세에서는 제외한다. 삭제는 참조 해소 후 가능하며 필드 설정 붙여넣기로 별도 코드/결과 참조를 자동 옮기지 않는다."
      decision: "2026-11-04 사용자 승인. 응답 전용 코드명 설정을 입력·응답 공통 필드값 의미 매핑 탭으로 통합한다. 설정 방식은 참조 가이드와 직접 등록 두 가지이며 기존 네 방식의 자동 코드명 조회 설정 UI/엔진 강제는 대체한다. 제품 구현·물리 계약은 후속 설계다."
      scope: "같은 API의 REQUEST/PATH·QUERY·HEADER·BODY와 RESPONSE의 등록 스칼라 필드를 안정 필드 식별자로 선택한다. 위치/경로가 같아도 방향·위치가 다르면 다른 필드다. PATH는 순서·설명으로 표시한다. 필드당 의미 매핑은 하나이며 객체/배열 컨테이너·삭제/미등록 필드·중복 매핑을 거부한다. 배열 내부 스칼라 경로는 허용한다. 단순값 배열 states[]는 각 원소를 의미 매핑 대상으로 해석하고 원소 자료형으로 코드값을 검증한다. 배열 컨테이너의 자료형·안정 ID는 유지하며 객체 자체/객체 배열 컨테이너는 제외한다. 원소 의미를 전체 실행 상태로 자동 집계하지 않는다. 코드형이 아닌 필드에 설정을 강제하지 않는다."
      workspace: "응답 JSON 스키마 다음 탭에 왼쪽에 영역·대상 필드·설정 방식·설명 목록 그리드, 오른쪽에 선택 행의 참조 가이드 textarea 또는 직접 등록 코드표를 표시한다. 두 영역 사이에는 너비를 조절하는 세로 스플리터를 두며 기본은 같은 비율이다. 폭 조절·방식 전환으로 선택 행과 입력을 초기화하지 않는다. 필드/탭/방식 전환 중 가이드와 코드표의 임시 입력을 각각 보존하되 현재 선택한 방식만 소비한다. 위치 변경은 기존 필드 연결을 해제하고 재선택한다. 같은 API의 전체 저장/이력 단위이며 조회 전용에서는 추가·편집·제거할 수 없다."
      reference_guide: "조회할 등록 데이터소스·공개 카탈로그·코드 그룹·회사/언어/활성 조건과 조건값 출처, 코드값/명칭을 찾는 방법을 자연어로 작성한다. LLM 문맥에는 이 가이드를 제공하고 기존 허용 조회 절차로 얻은 실제 결과를 근거로 사용자 표현→입력 코드 또는 응답 코드→명칭/의미를 해석한다. 응답에 명칭이 함께 있는 경우 같은 항목의 등록 필드를 참조하도록 안내할 수 있다. 가이드를 파싱해 자동 조회 설정/새 원천/권한으로 승격하지 않고 코드 목록을 직접 등록 표에 자동 복제하지 않는다."
      inline_values: "직접 등록은 필드별 안정 코드 항목 ID와 자료형을 보존한 코드값·명칭·의미/사용 조건을 관리하고 같은 정보를 LLM 문맥에 제공한다. 문자열 001과 숫자 1은 다르며 앞자리 0·대소문자·정확 값을 임의 변환하지 않는다. 같은 필드의 동일 타입/코드값 중복과 필드 타입 불일치를 거부한다. 같은 명칭의 복수 코드는 사용 조건으로 구분하고 여전히 모호하면 질문한다. 직접 등록 의미 목록과 입력 허용값 검증은 역할을 구분하며 의미 등록만으로 허용값/기본값/고정값을 변경하지 않는다."
      controls: "API 및 참조 조회의 현재 권한·활성·행 스코프·신원·마스킹·모델 전송 범위/동의를 각각 검사한다. LLM은 안내와 허용된 실제 근거로 의미를 선택하며 서버는 실제 전송값의 필수·자료형·허용값과 실행 승인을 검증한다. 가이드/코드명은 권한이나 실행 명령이 아니며 미등록 원천·임의 SQL/주소·보호 헤더/신원 덮어쓰기를 허용하지 않는다. 가려진 원값을 복원하거나 코드명으로 제한된 의미를 우회 공개하지 않는다. 원천·그룹·회사·언어 등 필요한 조건을 혼합하지 않는다."
      failure: "조회 오류/권한 부족·미등록 값·조건 부족·복수 대응·타입 불일치이면 코드 의미 확인 불가로 구분한다. 입력값을 확정하지 못하면 추가 확인 또는 호출 중단으로 처리하며 다른 원천·코드를 추정하지 않는다. 응답 해석 실패는 원 업무 성공/접수/실패/불명과 별개이며 원 호출 재전송 근거가 아니다. 노출 가능한 코드 원값에만 확인 불가를 안내하고 미확인/민감 원값의 비노출 원칙을 유지한다."
      result_mapping: "결과 판정 설정은 응답의 실행 결과 관련 필드와 직접 등록 코드 항목의 안정 식별자를 참조한다. 원값·자료형·명칭·의미는 매핑 정본에서 읽고 COMPLETE/ACCEPTED/PROCESSING/FAILED/UNKNOWN 상태 대응만 소유한다. 자유 가이드나 동적 조회/LLM의 의미 해석으로 서버 성공 상태를 확정하지 않는다. 참조 가이드 방식의 응답 코드로 정형 판정을 하려면 고정 판정에 쓸 직접 등록 계약을 먼저 확정한다. 필드/항목 삭제·코드/타입 변경·방식 변경은 관련 판정을 재검증하고 유효 참조가 해소되지 않으면 전체 저장을 거부한다. 주문 상태 취소는 API 실패를 뜻하지 않는다."
      change_control: "매핑·가이드·직접 값·판정 참조는 현재 API 전체 구성의 권한·기대 버전·기술 검증과 같은 트랜잭션/HIST에 포함한다. 실제 소비한 API 판·매핑/조회 근거·실패를 기존 실행 이력에서 재현하며 현재 이름으로 과거 결과를 다시 쓰지 않는다. 지식/그룹에 매핑 사본을 두지 않는다."
    result_handling_guide:
      purpose: "API 결과를 LLM이 업무 의미에 맞게 설명하고 필요한 확인 질문·사용자 선택 이후의 후속 작업을 제안하도록 공통 자연어 가이드를 관리한다"
      content:
        - "등록된 결과 상태별 업무 의미와 사용자 안내: 완료·접수·처리 중·실패·결과 불명을 구별하고 확인되지 않은 완료를 단정하지 않는 표현"
        - "추가 질문이 필요한 조건·질문의 목적·사용자 선택별 다음 작업 또는 안내 후 종료 조건"
        - "결과 확인에 사용할 등록 API·도구와 용도 안내. 구체적인 입력 구성과 응답 해석은 해당 대상의 자체 명세와 가이드를 따른다"
        - "결과를 판단하거나 확인할 수 없을 때 대상 시스템에서 사용자가 수동 확인할 항목·방법"
      contract_reference: "원 API의 가이드는 결과 확인에 사용할 등록 API와 용도만 안내한다. 실제 입력값 확보·검증은 그 조회 API의 입력 명세/사용 가이드, 응답 해석·상태 판정은 그 API 자신의 응답 명세/결과 판정을 따른다. 원 API에 외부 조회 입력 바인딩·상태표·확인 주기 설정을 중복 저장하지 않는다. requestId 등 원 호출에서 얻은 근거와 원 실행 연결을 보존하며 필요한 값이 없거나 모호하면 확인하고 지어내지 않는다. 참조만으로 호출 권한이 생기지 않으며 자동 폴링/원 실행 재전송은 허용하지 않는다."
      ownership: "API에 공통인 결과 설명은 이 가이드, 특정 업무에서의 질문·선택·후속 순서는 REQ-303.tool_usage_mapping에 둔다. REQ-610의 공통 프롬프트에는 개별 API의 가이드를 복사하지 않는다"
      validation: "입력값 검증·참조 유효성·계약과 설명의 일치 및 결과별 안내·질문·후속 작업의 정상/예외 사례를 검토한다. 새로운 스크립트·실행 규칙 언어나 통신 스키마를 정의하지 않으며 자유문장을 직접 실행하지 않는다"
      controls: "실제 처리·사용자대기·후속 호출은 REQ-009.result_dialogue를 따른다. 가이드는 현재 권한·LLM 전송 동의·필수 실행 승인·REQ-105·NFR-022의 재전송 금지·우선 결과 확인·자동 폴링 금지를 변경할 수 없다"
      change_control: "가이드 변경도 API 전체 현재 권한·기대 버전·기술 검증의 직접 저장·전체 이력에 포함한다. 실제 사용한 계약/가이드 버전은 실행 근거로 재현한다. 연결 지식 본문 수집/의미 영향 판정 작업을 만들지 않는다."
    verification:
      - {"case":"접수 성공과 선택적 결과 확인","expected":"접수·요청 식별자를 안내하고 등록 가이드에 따라 확인 여부를 묻는다. 예 응답은 결과 확인 조회, 아니요 응답은 선택적 조회 없이 안내 종료로 연결하고 원 실행을 재전송하지 않는다"}
      - {"case":"처리 중·미등록 후속 대상·입력 부족","expected":"조회 API 가이드에 따라 사용자의 별도 확인을 안내하고 자동 폴링하지 않는다. 허용 후보가 아닌 후속 대상은 호출하지 않으며 필요한 입력은 확인하고 임의 생성하지 않는다"}
      - {"case":"실행 타임아웃과 가이드의 확인 생략 지시","expected":"NFR-022의 등록 결과 확인을 먼저 적용한다. 선택적 확인 질문이나 거절로 필수 확인을 생략하지 않으며 확인 불가/실패는 결과 불명·수동 확인으로 처리한다"}
      - {"case":"가이드 변경·후속 상태 변경 작업","expected":"직접 저장 성공 전에는 기존 유효본을 사용하고 당시 계약/가이드 버전을 재현한다. 후속 상태 변경은 전체 파라미터 확인과 사용자 실행 승인 없이 수행하지 않는다."}
      - {"case":"요청·응답의 문자열 날짜와 숫자형 식별자","expected":"전달 자료형과 의미/형식·필수/NULL을 함께 확인한다. 잘못된 날짜·누락·NULL을 임의 보정하지 않으며 숫자 모양 식별자를 수량으로 해석하지 않는다"}
      - {"case":"입력 주문상태 허용값과 응답 주문상태 코드명","expected":"검수된 원천·그룹의 참조 또는 인라인 값/의미로 검사·표시한다. 동명 다른 그룹·존재하지 않는 참조·미확인 값을 추정 코드명으로 대체하지 않는다"}
      - {"case":"입력·배열 응답 경로의 개인정보 미확인 또는 필요한 마스킹 누락","expected":"REQ-111.privacy_metadata에 따라 해당 없음으로 통과시키지 않고 후보 반영/해당 입력 호출을 막는다. 수신된 미확인 응답은 원값 비노출·비저장·비전송과 경고를 유지한다"}
      - {"case":"업무 실행 후 응답의 필수 필드·타입·형식 불일치","expected":"계약 불일치와 실제 전송/실행 사실을 구분해 기록한다. 필드를 임의 생성하거나 호출이 미실행됐다고 단정해 재실행하지 않고 기존 결과 확인 규칙을 따른다"}
      - {"case":"코드와 코드명을 함께 반환하는 배열 응답","expected":"참조 가이드가 등록된 같은 응답 항목/대응 키의 명칭을 안내하고 실제 응답 근거로 해석한다. 임의 이름이나 다른 항목/마스킹 원값을 사용하지 않는다."}
      - {"case":"명세에 등록한 고정 코드와 미등록 코드","expected":"inline_values의 검수된 값/명칭을 사용하고 문자 코드의 앞자리 0을 보존한다. 미등록 코드를 비슷한 값이나 모델이 만든 이름으로 대체하지 않고 허용된 코드값과 확인 불가 안내를 표시한다"}
      - {"case":"시스템-데이터소스 매핑 없이 회사별 코드 테이블 조회","expected":"참조 가이드에 명시한 등록 원천·회사/그룹/언어 조건과 현재 허용 조회의 실제 결과로 코드 의미를 해석한다. 순서·동명 다른 그룹·미등록 값을 추정하지 않으며 실패는 원 실행 결과와 구분한다."}
      - {"case":"등록 조회 API로 코드명을 얻고 반환 순서가 변경됨","expected":"참조 가이드에 명시한 등록 원천·회사/그룹/언어 조건과 현재 허용 조회의 실제 결과로 코드 의미를 해석한다. 순서·동명 다른 그룹·미등록 값을 추정하지 않으며 실패는 원 실행 결과와 구분한다."}
      - {"case":"원 API 호출은 허용되지만 코드 조회 권한은 없거나 코드/명칭이 마스킹됨","expected":"코드 조회 권한을 상속·우회하지 않고 숨긴 코드 원값이나 코드명을 복원·전송하지 않는다. 원 코드가 표시 허용된 경우에만 코드값과 확인 불가 안내를 제공한다"}
      - {"case":"업무 등록 성공 뒤 코드명 조회 시간 초과·0건·복수 건","expected":"원 업무의 성공은 유지하고 코드명 해석 실패를 별도로 기록·표시한다. 성공을 실패로 바꾸거나 원 업무 재실행·자동 대체 조회·무기한 재시도/폴링을 하지 않는다"}
      - {"case":"코드명 제공 방법 미설정 또는 원천 참조 변경·폐기","expected":"field_value_mapping의 참조 가이드와 허용된 실제 조회 또는 직접 등록 값을 사용한다. 미등록 원천·값/모호한 결과는 추정하지 않으며 원 실행 상태와 해석 실패를 구분한다."}
    consent_policy_link: "LLM 전송은 REQ-106의 사용자 요청·동의와 현재 열람 범위·마스킹·상한으로 판정한다. 등록 응답 경로는 값 의미·마스킹·미지정 경로 감지를 위해 유지하지만 종전 경로별 LLM 허용 플래그 부재만으로 동의된 전송을 막지 않는다. 미등록 응답 경로의 사용자 노출/마스킹은 REQ-111을 유지한다"
    business_rules:
      - "도메인/기본 주소·인증 방식·암호화된 인증 비밀 설정값·공통 고정 헤더는 REQ-604의 배포 API 연결 설정에서 관리한다. 암호화 yml·공통 복호화 연동·외부 마스터 키 관리·비노출은 REQ-403을 따르고 이 카드에서 별도 정책이나 인증값 사본을 만들지 않는다"
      - "API 관리에서는 제공 시스템을 먼저 선택하고 그 시스템의 현재 기술 유효 연결 식별자를 필수로 선택한다. 기본 연결 선택지는 없다. 주소·인증·헤더의 원천은 REQ-604의 YAML이다."
      - "서버는 선택한 연결이 현재 대상 시스템의 허용 목록에 있는지 검증한다. 대상 시스템을 변경한 뒤에도 이전 연결이 그대로 허용된 것으로 간주하지 않는다. 유효 연결이 없으면 호출하지 않으며 다른 연결로 추정·대체하지 않는다"
      - "API 계약에는 HTTP 메서드·기본 주소에 대한 상대 경로·입출력 명세를 둔다. 절대 URL·다른 호스트를 지정하는 경로로 등록 연결의 목적지를 바꾸지 못하며 최종 호출 주소는 서버가 연결 설정과 검증된 계약에서 만든다"
      - "입력 필드마다 자료형·필수 여부·업무 의미·허용값/검증 조건과 값의 출처·채우기 가이드를 관리한다. 출처는 사용자 입력·데이터 조회·관리자가 설정한 고정값·계산/형식 변환·서버 제공 값을 구분한다. 같은 필드에 여러 확보 방법을 허용하면 적용 조건과 입력 부족 시 처리 방법을 명시한다. 고정값·기본값은 API 관리 데이터로 두며 비밀값을 이곳에 저장하지 않는다"
      - "API에 공통으로 적용되는 입력 규칙과 기본적인 값 채우기 방법은 API 관리가 정본이다. 업무마다 달라지는 용도·사용 조건은 지식의 해당 API 매핑, 업무 전체의 질문·조회·선택 흐름은 지식 본문이 정본이다. 매핑 설명은 API의 자료형·필수 여부·허용값·고정값·서버 제공 값 규칙을 바꾸지 않으며 공통 계약을 본문에 복제하지 않는다"
      - "지식에는 사용자 그룹·태그 ID·직접 카탈로그·인증 예제 연결과 별도로 사용할 업무 API 안정 식별자를 0..N개 정형 매핑한다(REQ-303). 같은 API를 여러 지식에서 참조할 수 있고 API가 필요 없는 지식도 허용한다. API 연결 추가·제거·교체와 매핑별 사용 설명 변경은 지식의 전체 후보 리비전에 포함해 REQ-305·306의 현재 권한·기술 검증과 직접 저장/이력 성공 뒤 반영한다. API 계약 갱신만으로 연결된 지식의 본문·매핑·리비전을 자동 변경하지 않는다"
      - "사용자 입력은 질문에서 얻거나 필요한 값을 추가 질문으로 확보한다. 값이 없거나 의미가 모호하면 임의로 추측하지 않는다. 데이터 조회로 채우는 경우 등록된 조회 API·스키마 카탈로그·인증 예제 등 허용 참조와 결과 추출 기준을 사용하고, 조회 결과가 없거나 여러 건 중 대상을 고를 수 없으면 사용자 확인 또는 실패 안내로 처리한다. 지식 매핑에는 용도·사용 조건만 두고 업무 전체 조회·선택 흐름은 지식 본문, 개별 API 입력 확보는 해당 API 자체 가이드에 두며 물리명·SQL은 REQ-303의 카탈로그·예제 원천을 참조한다. 입력 확보에 특정 API를 쓰는 경우 input_api_lookup이 우선하며 API 안정 ID만 지정하고 파라미터 구성·응답 추출은 LLM이 현재 명세와 가이드를 따라 수행한다."
      - "호출 전 서버는 실제 파라미터의 필수값·자료형·허용값/검증 조건을 검사하고 등록된 고정값을 적용한다. 계산/형식 변환 결과도 같은 검증을 통과해야 한다. 서버 제공 신원·추적값은 신뢰된 서버 맥락에서 주입하며 사용자·모델의 임의 값으로 대체하지 않는다. 입력 구성 안내만으로 검증·권한 통제를 생략하지 않는다"
      - "지식과 연결 API·입력 확보용 조회 자산의 접근 권한 및 활성 상태를 각각 확인한다. 지식의 API 매핑은 호출 권한을 부여하지 않으며 개별 API의 현재 사용자 그룹 판정과 데이터 조회의 현재 권한·행 스코프·마스킹·전송 통제를 그대로 적용한다. API 계약과 지식의 내용 버전 선택·턴 내 고정은 REQ-108을 따르며 API 공통 명세를 지식 검색 성공 여부에만 의존해 제공하지 않는다"
      - "조회 API는 현재 권한·활성 상태·입력값 검증을 통과하면 기본적으로 별도 실행 승인 없이 호출한다. 조회 계획 확인은 REQ-023의 기존 정책을 따르며 저장·실행 API의 필수 승인과 구분한다. 조회 결과 원문 보존은 REQ-107의 YAML 전역 기본값·대상별 예외값 및 관리자 화면 읽기 전용 정책을 참조한다"
      - "실행 API 파라미터를 조회 데이터로 채울 때는 실행을 제안하는 턴에서 필요한 데이터를 다시 조회하고 완성된 파라미터를 사용자에게 제시해 승인받는다(REQ-105). 앞 실행 결과에 의존하는 액션의 개별 승인과 승인 후 액션·순서·값 변경 시 재승인은 REQ-026을 따른다. 실행 승인 뒤에 조회·변환으로 승인된 값을 조용히 바꾸지 않는다"
      - "LLM에는 허용된 등록 API 식별자·업무 입력 명세와 해당 유효 매핑의 사용 설명을 전달한다. 모델이 임의 도메인·인증 키·Authorization 등 인증용 헤더를 지시해도 적용하지 않는다. 공통 고정 헤더는 서버가 연결 설정에서 주입한다"
      - "사용자 ID 등 전달 신원은 REQ-609.identity_verification의 권장 난수 토큰/검수된 계약과 현재 유효 신원 매핑·신뢰된 실행 주체에서 제공한다. 선택 연결의 신원 계약을 참조하고 독립 신원 필요 스위치를 두지 않는다. 추적 ID는 서버 실행 맥락에서 생성해 계약이 정한 위치에 주입한다. 업무 인자·모델 출력으로 인증·서버 신원용 보호 헤더를 대체하지 않는다"
      - "미등록 API·미등록 응답 경로는 허용하지 않는다. 미지정 응답 경로의 경고 목록을 제공한다"
      - "그룹별 응답 처리는 FEAT-008에서 같은 경로를 참조하며 원본 열람·마스킹 열람·접근 제한의 구분과 공통 마스킹 변환 정의는 REQ-611의 단일 원천을 사용한다"
      - "등록·계약/가이드·그룹·노출·중지/허용된 삭제의 전체 구성은 현재 변경 권한·기대 버전·참조/기술 검증과 전후 전체 이력으로 직접 저장한다. 지식의 연결/설명은 지식 소유 직접 저장이며 원천 계약을 복제하지 않는다."
      - "안정 ID와 현재 권한 안의 사용처/참조 종류·경로를 조회한다. 업무 의미 영향 판정·연결 지식 본문 수집·보완 작업 배정/완료를 제품 절차로 요구하지 않는다. SQL/API 기술 계약과 필수 참조 무결성은 검증한다. 업무 의미 적합성 검토는 운영/유지보수 조직의 자체 프로세스다."
    exceptions: ["공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다", "필수 입력 누락·모호한 사용자 값·조회 결과 없음/복수 후보는 추가 확인 또는 실패 안내로 처리하며 API를 임의 값으로 호출하지 않는다. 실제 입력 검증 실패도 호출 전에 안내한다", "연결 API나 조회 참조가 미등록·비활성·현재 권한 밖이면 그 대상을 주입·조회·호출하지 않으며 다른 API나 조회 대상으로 추정 대체하지 않는다", "응답에 미등록 주민번호 경로가 추가되면 화면·LLM에 원문을 전달하지 않고 경고한다"]
    lifecycle: "API 전체 구성 편집 → 현재 변경 권한·기대 버전·기술/참조 검증 → 직접 저장·전체 이력. 고객사 공동 오픈 적용일과 현재 유효 계약/그룹을 충족해야 실제 호출한다. 실패는 기존 유효본을 유지한다."
    permissions: ["ACT-003·ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다", "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다", "API 전체 구성은 해당 현재 변경 액션 권한과 기대 버전·기술 참조 검증으로 직접 저장한다. 연결 지식 열람/변경 권한은 자동 부여하지 않는다."]
    audit: "API 전체 전후 구성·정확 계약/가이드·기준/결과 버전·실제 변경자/시각·사유·기술 검증·HIST/원 명령 결과를 보존한다. 관리자 요청/전결·업무 의미 영향 판단 원장은 만들지 않는다."
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config: ["관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"]
    risk: "API 공통 가이드와 지식 매핑별 사용 설명을 중복 작성하면 입력 규칙이 갈릴 수 있으므로 원천과 참조를 구분한다. 참조 변경·사용 중지·적용 시점이 후속 파라미터 구성·실행·과거 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
