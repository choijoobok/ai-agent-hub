    field_metadata:
      source: "2026-10-22 사용자 보완 요청: 요청뿐 아니라 응답의 필드명·경로·자료형·업무 의미/형식·필수/NULL·공통코드 참조와 개인정보 관리 범위를 요구사항에서 명시한다. 실제 속성명·저장·화면 표현은 P3에서 정한다"
      attributes: "요청 파라미터와 응답의 각 값 필드에 이름/경로·업무 명칭/설명·전달 자료형·의미 유형, 경로/값의 필수 여부와 NULL 허용 여부·허용값/검증 조건을 관리한다. 객체·배열의 하위 값은 경로로 식별하며 응답 경로 표현은 REQ-111의 정적 경로·배열 와일드카드 범위를 유지한다. 날짜·일시·금액·수량·코드 등은 전달 자료형과 구분하고 해석에 필요한 형식·시간대 또는 단위를 해당하는 경우 명시한다. 필드 부재와 NULL·0·빈 문자열을 자동으로 같은 값으로 취급하지 않는다"
      value_domain: "코드형 필드는 공통코드 참조·인라인 값/의미 열거·해당 없음의 구분과 원천/그룹 식별·검수의 공통 기준을 REQ-301.value_domain에서 참조한다. catalog_reference는 카탈로그 컬럼에 적용하는 DB 참조 규칙이며 API 제공 시스템에서 데이터소스를 추정·자동 연결하는 근거로 사용하지 않는다. API 필드는 해당 계약에 명시된 코드 참조 또는 인라인 값/의미를 사용한다. 입력 허용값 검사와 응답 코드명 표시는 같은 필드의 검수된 근거를 사용하고, 다른 원천의 동명 그룹이나 모델이 만든 코드명으로 대체하지 않는다. API 필드의 코드 참조를 지식별 매핑 설명에 복사하지 않는다"
      privacy: "요청·응답 모두 REQ-111.privacy_metadata의 개인정보 해당 여부/유형·식별 용도·마스킹 참조·검수 상태를 이 API 명세 원천에서 관리한다. 그룹 매핑 화면은 원천을 참조하며 공통 변환·열람 모드는 REQ-611, 전송 동의는 REQ-106을 따른다. 등록된 필드라는 사실만으로 개인정보 검수나 원본 제공·전송 허용이 완료된 것으로 보지 않는다"
      validation: "후보 검수·운영 반영 전에 경로와 타입·의미/형식·필수/NULL·코드 참조·개인정보 기준의 완전성과 일관성을 검사한다. 미완성/미확인 후보를 정상 운영 계약으로 확정하지 않는다. 호출 전에는 실제 입력과 필수값·타입·허용값·형식을 대조하고, 응답은 등록 계약과 실제 경로·타입·필수/NULL·값 의미를 대조한다. 필수 누락·형식 불명·명세 불일치를 임의 값·코드명·날짜로 보정하지 않고 보완 또는 REQ-111·115의 가림·경고/오류로 처리한다. 이미 상태 변경이 발생한 API의 응답 검증 실패를 미실행으로 단정하거나 자동 재실행하지 않으며 결과 확인은 REQ-105·NFR-022를 따른다"
      boundary: "입력 확보 출처/질문/고정/서버 주입 규칙은 입력 계약을 따른다. 응답에 입력 절차/DB외래키를 강제하지 않는다. 속성 변경은 API 전체 직접 저장/이력이며 비밀·보호 헤더는 이곳에 복제하지 않는다."
    code_name_resolution:
      source: "2026-10-22 사용자 요청: API 응답의 코드명 제공 방법을 응답 내 코드명·명세의 값/명칭·등록 코드 테이블 조회·등록 코드 조회 API의 네 방식으로 보완한다. 원천 참조와 조회 실패 처리까지 기존 REQ-608에서 관리하며 시스템-데이터소스 귀속을 새로 만들지 않는다"
      scope: "조회·실행 API 응답의 코드형 값 필드별로 코드값 경로와 코드명 제공 방법·필요한 참조를 명시한다. 응답에 검수된 코드명 필드가 있으면 응답 내 코드명 방식을 우선 선택하고, 코드값만 제공하면 나머지 방식 중 해당 계약에 적합한 하나를 선택한다. 코드형이 아닌 필드에 설정을 강제하지 않는다. 제공 방법 미설정·미완성을 해당 없음으로 확정하지 않으며 운영 중 해석 실패는 failure를 따른다"
      methods:
        response_field: "응답 안의 코드값 경로와 코드명 경로를 연결한다. 객체·배열에서는 같은 항목 또는 검수된 대응 키의 코드와 이름을 연결하고 배열 순서만으로 다른 항목의 이름을 붙이지 않는다. 두 경로 모두 등록된 응답 명세와 개인정보 통제를 따른다"
        inline_values: "종류가 적고 변경이 드문 고정 코드에 코드값·표시명 쌍을 명세로 등록한다. 값의 자료형·앞자리 0을 보존하며 중복·모호한 코드 정의를 허용하지 않는다. 외부 코드 목록의 자동 복제본으로 만들지 않고 명시적으로 선택한 계약 정의로 관리한다"
        catalog_lookup: "조회할 Hub 데이터소스와 공개 카탈로그의 코드 테이블/뷰를 명시적으로 참조하고 코드값·코드명 컬럼, 필요한 그룹 구분·회사 등 추가 식별 조건과 값의 출처를 지정한다. 물리 식별·참조 검수는 REQ-301, 연결·단일 SQL 범위는 REQ-603을 따른다. 카탈로그 컬럼과 달리 API에는 소속 데이터소스가 없으므로 제공 시스템에서 추정하지 않고 이 필드의 코드 조회 대상으로 직접 연결한다"
        api_lookup: "활성·검수된 조회용 업무 API를 참조하고 조회 입력과 코드값/코드명 응답 경로 및 대응 키를 지정한다. HTTP 메서드와 별개로 상태를 변경하지 않는 조회 계약이어야 하며 업무 실행 API를 코드명 조회용으로 호출하지 않는다. 대상의 실제 등록 응답값을 사용하고 다른 코드명 제공 규칙을 재귀적으로 호출하지 않는다"
      mapping: "그룹·회사·언어 등 해석에 필요한 조건이 있으면 검수된 고정값·원 호출의 요청값·응답값·신뢰된 서버 문맥 중 어디서 값을 얻는지 명시한다. 값이 없거나 여러 후보가 남으면 추정하지 않는다. 같은 코드값이라도 원천·그룹·회사 등의 조건이 다르면 별도로 해석하며 반환 항목의 순서가 아닌 전체 대응 조건으로 확인한다. 서버 제공 신원·보호 헤더는 기존 입력 계약을 따르고 응답값으로 덮어쓰지 않는다"
      controls: "서버가 명세와 실제 값을 대조해 코드명을 결정하고 LLM이 이름이나 조회 대상을 생성하지 않는다. 원 API 호출 권한과 코드 조회 대상의 현재 권한·활성 상태·신원·행 스코프·마스킹을 각각 검사하며 참조 등록만으로 권한을 부여하지 않는다. 가려진 코드 원값을 복원해 조회하거나 코드명으로 제한된 의미를 우회 노출하지 않는다. 조회 결과의 코드명에도 REQ-111을 적용하고 LLM 전송은 REQ-106의 요청·동의 범위를 따른다. 코드명 조회는 REQ-009·103·105·108의 허용 조회 참조와 호출 통제를 따르며 업무 실행 후보나 권한을 확대하지 않는다"
      failure: "미등록 코드·코드명 누락·복수 대응·조건 부족·계약 불일치·대상 비활성·권한 부족·조회 오류/시간 초과는 코드명 확인 불가로 구분한다. 표시가 허용된 코드값은 원값과 코드명 확인 불가 안내를 제공하고, 숨김/마스킹 대상 코드나 이름은 기존 통제를 유지한다. 내부 원천·권한 상세를 사용자 안내에 노출하지 않으며 다른 원천·방법으로 자동 대체하거나 이름을 추측하지 않는다. 원 업무의 실제 성공·접수·실패·불명 상태와 코드명 해석 결과를 구분해 성공한 업무를 실패로 바꾸거나 원 실행을 재전송하지 않는다. 코드명 확인을 위해 무기한 재시도·자동 폴링하지 않는다. 계약 자체가 미등록이거나 개인정보가 미확인인 값은 이 예외로 원값 표시를 허용하지 않고 field_metadata·REQ-111을 따른다"
      presentation: "원 코드값과 표시명을 별도로 유지하고 REQ-011의 화면·엑셀·차트 표시 계약에 같은 검수 근거와 해석 상태를 전달한다. 코드명만으로 원 코드값을 덮어쓰거나 업무 성공을 판정하지 않는다. 성공 의미·필수 결과 확인은 기존 실행 계약과 result_handling_guide를 따른다"
      change_control: "방법·참조·경로·조건·값/명칭 변경은 API 전체 직접 저장·불변 이력·기술 참조 검증 대상이다. 지식/그룹/프롬프트에 규칙을 복제하지 않고 실제 코드명 해석의 계약/참조·결과/실패를 실행 이력으로 남긴다. 과거 결과를 현재 코드명으로 바꾸지 않는다."
    result_handling_guide:
      purpose: "API 결과를 LLM이 업무 의미에 맞게 설명하고 필요한 확인 질문·사용자 선택 이후의 후속 작업을 제안하도록 공통 자연어 가이드를 관리한다"
      content:
        - "등록된 결과 상태별 업무 의미와 사용자 안내: 완료·접수·처리 중·실패·결과 불명을 구별하고 확인되지 않은 완료를 단정하지 않는 표현"
        - "추가 질문이 필요한 조건·질문의 목적·사용자 선택별 다음 작업 또는 안내 후 종료 조건"
        - "후속으로 사용할 등록 API·도구 참조와 용도, 원 호출의 요청 식별자·결과에서 필요한 입력을 얻는 방법 및 부족·모호할 때의 확인"
        - "결과를 판단하거나 확인할 수 없을 때 대상 시스템에서 사용자가 수동 확인할 항목·방법"
      contract_reference: "성공의 완료/접수 의미·결과 확인 API·상태 매핑·권장 재확인 시간은 기존 실행·후속 확인 계약을 참조한다. 자연어 설명에 별도 상태표·시간·입출력 계약을 복제하지 않는다. 등록된 후속 API·도구를 참조해도 후보 노출·호출 권한이 생기지 않는다"
      ownership: "API에 공통인 결과 설명은 이 가이드, 특정 업무에서의 질문·선택·후속 순서는 REQ-303.tool_usage_mapping에 둔다. REQ-610의 공통 프롬프트에는 개별 API의 가이드를 복사하지 않는다"
      validation: "입력값 검증·참조 유효성·계약과 설명의 일치 및 결과별 안내·질문·후속 작업의 정상/예외 사례를 검토한다. 새로운 스크립트·실행 규칙 언어나 통신 스키마를 정의하지 않으며 자유문장을 직접 실행하지 않는다"
      controls: "실제 처리·사용자대기·후속 호출은 REQ-009.result_dialogue를 따른다. 가이드는 현재 권한·LLM 전송 동의·필수 실행 승인·REQ-105·NFR-022의 재전송 금지·우선 결과 확인·자동 폴링 금지를 변경할 수 없다"
      change_control: "가이드 변경도 API 전체 현재 권한·기대 버전·기술 검증의 직접 저장·전체 이력에 포함한다. 실제 사용한 계약/가이드 버전은 실행 근거로 재현한다. 연결 지식 본문 수집/의미 영향 판정 작업을 만들지 않는다."
    verification:
      - case: "접수 성공과 선택적 결과 확인"
        expected: "접수·요청 식별자를 안내하고 등록 가이드에 따라 확인 여부를 묻는다. 예 응답은 결과 확인 조회, 아니요 응답은 선택적 조회 없이 안내 종료로 연결하고 원 실행을 재전송하지 않는다"
      - case: "처리 중·미등록 후속 대상·입력 부족"
        expected: "등록된 권장 시간 뒤 사용자의 별도 확인을 안내하고 자동 폴링하지 않는다. 허용 후보가 아닌 후속 대상은 호출하지 않으며 필요한 입력은 확인하고 임의 생성하지 않는다"
      - case: "실행 타임아웃과 가이드의 확인 생략 지시"
        expected: "NFR-022의 등록 결과 확인을 먼저 적용한다. 선택적 확인 질문이나 거절로 필수 확인을 생략하지 않으며 확인 불가/실패는 결과 불명·수동 확인으로 처리한다"
      - case: "가이드 변경·후속 상태 변경 작업"
        expected: "직접 저장 성공 전에는 기존 유효본을 사용하고 당시 계약/가이드 버전을 재현한다. 후속 상태 변경은 전체 파라미터 확인과 사용자 실행 승인 없이 수행하지 않는다."
      - case: "요청·응답의 문자열 날짜와 숫자형 식별자"
        expected: "전달 자료형과 의미/형식·필수/NULL을 함께 확인한다. 잘못된 날짜·누락·NULL을 임의 보정하지 않으며 숫자 모양 식별자를 수량으로 해석하지 않는다"
      - case: "입력 주문상태 허용값과 응답 주문상태 코드명"
        expected: "검수된 원천·그룹의 참조 또는 인라인 값/의미로 검사·표시한다. 동명 다른 그룹·존재하지 않는 참조·미확인 값을 추정 코드명으로 대체하지 않는다"
      - case: "입력·배열 응답 경로의 개인정보 미확인 또는 필요한 마스킹 누락"
        expected: "REQ-111.privacy_metadata에 따라 해당 없음으로 통과시키지 않고 후보 반영/해당 입력 호출을 막는다. 수신된 미확인 응답은 원값 비노출·비저장·비전송과 경고를 유지한다"
      - case: "업무 실행 후 응답의 필수 필드·타입·형식 불일치"
        expected: "계약 불일치와 실제 전송/실행 사실을 구분해 기록한다. 필드를 임의 생성하거나 호출이 미실행됐다고 단정해 재실행하지 않고 기존 결과 확인 규칙을 따른다"
      - case: "코드와 코드명을 함께 반환하는 배열 응답"
        expected: "등록된 response_field 방식으로 같은 항목/대응 키의 코드와 이름을 연결하고 불필요한 외부 조회를 하지 않는다. 다른 항목의 코드명이나 미등록·마스킹된 경로를 표시하지 않는다"
      - case: "명세에 등록한 고정 코드와 미등록 코드"
        expected: "inline_values의 검수된 값/명칭을 사용하고 문자 코드의 앞자리 0을 보존한다. 미등록 코드를 비슷한 값이나 모델이 만든 이름으로 대체하지 않고 허용된 코드값과 확인 불가 안내를 표시한다"
      - case: "시스템-데이터소스 매핑 없이 회사별 코드 테이블 조회"
        expected: "catalog_lookup에 명시된 데이터소스·등록 코드 객체와 전체 그룹/회사 조건으로 조회하고 유일하게 대응한 코드명을 사용한다. 필수 조건 누락·복수 대응·다른 데이터소스의 동명 테이블로 추정하지 않는다"
      - case: "등록 조회 API로 코드명을 얻고 반환 순서가 변경됨"
        expected: "api_lookup의 입력 매핑과 전체 대응 키로 코드/명칭을 연결한다. 상태 변경 API나 재귀적인 코드명 조회 규칙은 허용하지 않는다"
      - case: "원 API 호출은 허용되지만 코드 조회 권한은 없거나 코드/명칭이 마스킹됨"
        expected: "코드 조회 권한을 상속·우회하지 않고 숨긴 코드 원값이나 코드명을 복원·전송하지 않는다. 원 코드가 표시 허용된 경우에만 코드값과 확인 불가 안내를 제공한다"
      - case: "업무 등록 성공 뒤 코드명 조회 시간 초과·0건·복수 건"
        expected: "원 업무의 성공은 유지하고 코드명 해석 실패를 별도로 기록·표시한다. 성공을 실패로 바꾸거나 원 업무 재실행·자동 대체 조회·무기한 재시도/폴링을 하지 않는다"
      - case: "코드명 제공 방법 미설정 또는 원천 참조 변경·폐기"
        expected: "미완성 후보를 정상 운영 계약으로 확정하지 않는다. 방법/참조 변경의 승인·영향과 당시 계약·표시 근거를 추적하고 현재 코드명으로 과거 결과를 덮어쓰지 않는다"
    consent_policy_link: "LLM 전송은 REQ-106의 사용자 요청·동의와 현재 열람 범위·마스킹·상한으로 판정한다. 등록 응답 경로는 값 의미·마스킹·미지정 경로 감지를 위해 유지하지만 종전 경로별 LLM 허용 플래그 부재만으로 동의된 전송을 막지 않는다. 미등록 응답 경로의 사용자 노출/마스킹은 REQ-111을 유지한다"
    business_rules:
      - "도메인/기본 주소·인증 방식·암호화된 인증 비밀 설정값·공통 고정 헤더는 REQ-604의 배포 API 연결 설정에서 관리한다. 암호화 yml·공통 복호화 연동·외부 마스터 키 관리·비노출은 REQ-403을 따르고 이 카드에서 별도 정책이나 인증값 사본을 만들지 않는다"
      - "API 관리에서는 먼저 이 API를 제공하는 대상 시스템을 선택하고, 그 시스템의 허용 연결 목록을 제공받아 시스템 기본 연결 사용 또는 특정 연결 식별자를 선택한다. 기본 연결 사용을 선택하면 현재 적용할 연결 식별자도 확인할 수 있다. 여기서는 기존 연결을 선택하며 주소·인증·공통 고정 헤더 구성은 REQ-604의 배포 설정 원천을 따른다"
      - "서버는 선택한 연결이 현재 대상 시스템의 허용 목록에 있는지 검증한다. 대상 시스템을 변경한 뒤에도 이전 연결이 그대로 허용된 것으로 간주하지 않는다. 유효 연결이 없으면 호출하지 않으며 다른 연결로 추정·대체하지 않는다"
      - "API 계약에는 HTTP 메서드·기본 주소에 대한 상대 경로·입출력 명세를 둔다. 절대 URL·다른 호스트를 지정하는 경로로 등록 연결의 목적지를 바꾸지 못하며 최종 호출 주소는 서버가 연결 설정과 검증된 계약에서 만든다"
      - "입력 필드마다 자료형·필수 여부·업무 의미·허용값/검증 조건과 값의 출처·채우기 가이드를 관리한다. 출처는 사용자 입력·데이터 조회·관리자가 설정한 고정값·계산/형식 변환·서버 제공 값을 구분한다. 같은 필드에 여러 확보 방법을 허용하면 적용 조건과 입력 부족 시 처리 방법을 명시한다. 고정값·기본값은 API 관리 데이터로 두며 비밀값을 이곳에 저장하지 않는다"
      - "API에 공통으로 적용되는 입력 규칙과 기본적인 값 채우기 방법은 API 관리가 정본이다. 업무마다 달라지는 용도·사용 조건·질문 순서·조회 조건·대상 선택 기준은 지식의 해당 API 매핑 설명이 정본이다. 매핑 설명은 API의 자료형·필수 여부·허용값·고정값·서버 제공 값 규칙을 바꾸지 않으며 공통 계약을 본문에 복제하지 않는다"
      - "지식에는 사용자 그룹·태그 ID·직접 카탈로그·인증 예제 연결과 별도로 사용할 업무 API 안정 식별자를 0..N개 정형 매핑한다(REQ-303). 같은 API를 여러 지식에서 참조할 수 있고 API가 필요 없는 지식도 허용한다. API 연결 추가·제거·교체와 매핑별 사용 설명 변경은 지식의 전체 후보 리비전에 포함해 REQ-305·306의 현재 권한·기술 검증과 직접 저장/이력 성공 뒤 반영한다. API 계약 갱신만으로 연결된 지식의 본문·매핑·리비전을 자동 변경하지 않는다"
      - "사용자 입력은 질문에서 얻거나 필요한 값을 추가 질문으로 확보한다. 값이 없거나 의미가 모호하면 임의로 추측하지 않는다. 데이터 조회로 채우는 경우 등록된 조회 API·스키마 카탈로그·인증 예제 등 허용 참조와 결과 추출 기준을 사용하고, 조회 결과가 없거나 여러 건 중 대상을 고를 수 없으면 사용자 확인 또는 실패 안내로 처리한다. 해당 API 매핑 설명에는 업무상 조회·선택 절차를 두며 물리명·SQL은 REQ-303의 카탈로그·예제 원천을 참조한다"
      - "호출 전 서버는 실제 파라미터의 필수값·자료형·허용값/검증 조건을 검사하고 등록된 고정값을 적용한다. 계산/형식 변환 결과도 같은 검증을 통과해야 한다. 서버 제공 신원·추적값은 신뢰된 서버 맥락에서 주입하며 사용자·모델의 임의 값으로 대체하지 않는다. 입력 구성 안내만으로 검증·권한 통제를 생략하지 않는다"
      - "지식과 연결 API·입력 확보용 조회 자산의 접근 권한 및 활성 상태를 각각 확인한다. 지식의 API 매핑은 호출 권한을 부여하지 않으며 개별 API의 현재 사용자 그룹 판정과 데이터 조회의 현재 권한·행 스코프·마스킹·전송 통제를 그대로 적용한다. API 계약과 지식의 내용 버전 선택·턴 내 고정은 REQ-108을 따르며 API 공통 명세를 지식 검색 성공 여부에만 의존해 제공하지 않는다"
      - "조회 API는 현재 권한·활성 상태·입력값 검증을 통과하면 기본적으로 별도 실행 승인 없이 호출한다. 조회 계획 확인은 REQ-023의 기존 정책을 따르며 저장·실행 API의 필수 승인과 구분한다. 조회 결과 원문 보존은 REQ-107의 YAML 전역 기본값·대상별 예외값 및 관리자 화면 읽기 전용 정책을 참조한다"
      - "실행 API 파라미터를 조회 데이터로 채울 때는 실행을 제안하는 턴에서 필요한 데이터를 다시 조회하고 완성된 파라미터를 사용자에게 제시해 승인받는다(REQ-105). 앞 실행 결과에 의존하는 액션의 개별 승인과 승인 후 액션·순서·값 변경 시 재승인은 REQ-026을 따른다. 실행 승인 뒤에 조회·변환으로 승인된 값을 조용히 바꾸지 않는다"
      - "LLM에는 허용된 등록 API 식별자·업무 입력 명세와 해당 유효 매핑의 사용 설명을 전달한다. 모델이 임의 도메인·인증 키·Authorization 등 인증용 헤더를 지시해도 적용하지 않는다. 공통 고정 헤더는 서버가 연결 설정에서 주입한다"
      - "사용자 ID 등 전달 신원은 REQ-609의 현재 유효 신원 매핑과 신뢰된 실행 주체에서, 추적 ID는 서버 실행 맥락에서 생성·해석해 계약이 정한 위치에 주입한다. 업무 인자·모델 출력으로 인증·서버 신원용 보호 헤더를 대체하지 않는다"
      - "미등록 API·미등록 응답 경로는 허용하지 않는다. 미지정 응답 경로의 경고 목록을 제공한다"
      - "그룹별 응답 처리는 FEAT-008에서 같은 경로를 참조하며 원본 열람·마스킹 열람·접근 제한의 구분과 공통 마스킹 변환 정의는 REQ-611의 단일 원천을 사용한다"
      - "등록·계약/가이드·그룹·노출·중지/허용된 삭제의 전체 구성은 현재 변경 권한·기대 버전·참조/기술 검증과 전후 전체 이력으로 직접 저장한다. 지식의 연결/설명은 지식 소유 직접 저장이며 원천 계약을 복제하지 않는다."
      - "안정 ID와 현재 권한 안의 사용처/참조 종류·경로를 조회한다. 업무 의미 영향 판정·연결 지식 본문 수집·보완 작업 배정/완료를 제품 절차로 요구하지 않는다. SQL/API 기술 계약과 필수 참조 무결성은 검증한다. 업무 의미 적합성 검토는 운영/유지보수 조직의 자체 프로세스다."
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "필수 입력 누락·모호한 사용자 값·조회 결과 없음/복수 후보는 추가 확인 또는 실패 안내로 처리하며 API를 임의 값으로 호출하지 않는다. 실제 입력 검증 실패도 호출 전에 안내한다"
      - "연결 API나 조회 참조가 미등록·비활성·현재 권한 밖이면 그 대상을 주입·조회·호출하지 않으며 다른 API나 조회 대상으로 추정 대체하지 않는다"
      - "응답에 미등록 주민번호 경로가 추가되면 화면·LLM에 원문을 전달하지 않고 경고한다"
    lifecycle: "API 전체 구성 편집 → 현재 변경 권한·기대 버전·기술/참조 검증 → 직접 저장·전체 이력. 고객사 공동 오픈 적용일과 현재 유효 계약/그룹을 충족해야 실제 호출한다. 실패는 기존 유효본을 유지한다."
    permissions:
      - "ACT-003·ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
      - "API 전체 구성은 해당 현재 변경 액션 권한과 기대 버전·기술 참조 검증으로 직접 저장한다. 연결 지식 열람/변경 권한은 자동 부여하지 않는다."
    audit: "API 전체 전후 구성·정확 계약/가이드·기준/결과 버전·실제 변경자/시각·사유·기술 검증·HIST/원 명령 결과를 보존한다. 관리자 요청/전결·업무 의미 영향 판단 원장은 만들지 않는다."
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "API 공통 가이드와 지식 매핑별 사용 설명을 중복 작성하면 입력 규칙이 갈릴 수 있으므로 원천과 참조를 구분한다. 참조 변경·사용 중지·적용 시점이 후속 파라미터 구성·실행·과거 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
