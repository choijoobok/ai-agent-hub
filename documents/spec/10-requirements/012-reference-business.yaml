# 영역: 기준정보 쿼터·검색태그·API·신원·프롬프트
requirements:
  - id: REQ-606
    type: functional
    priority: must
    workstream: admin
    actors: ["ACT-004"]
    source: "2026-10-31 사용자 결정 — 쿼터 등급 독립 관리·기준 시작월별 전체 세트·한 번 설정 후 계속 사용. 상대 가중치 유지·추가/제거/배분율 변경·월별 화면 조회 전용"
    process_step: PRC-13-01
    title: "쿼터 등급 정의·배분 가중치 관리"
    detail: "운영·비용 관리자는 독립 쿼터 등급 화면에서 시작월·메모·등록 정보와 하단의 전체 등급/순위·상대 배분 가중치·폐지/이전 대상을 관리한다. 대상 월 이하 시작월 중 최신 한 기준을 다음 변경 전까지 계속 사용하고 월별 쿼터 화면은 해당 기준을 읽기만 한다. 현재/과거 적용 기준은 고치지 않고 변경은 새 미래 기준으로 관리한다"
    roadmap: RM-P1
    acceptance: "시작월별 메모/전체 등급 세트가 함께 저장되고 등록자/일시는 불변이다. 매월 기준을 복제하지 않으며 대상 월에 유효한 최신 시작월 기준을 조회한다. 상대 가중치·순위·등급 이전/참조 검증과 실제 적용 과거 보존을 지키며 모델 선택 제한을 만들지 않는다"
    summary: "등급 기준을 독립 관리하고 사용자별 월 적용·토큰 배분은 기존 규칙으로 연결한다"
    intent:
      problem: "쿼터 등급 정의와 사용자 월별 배정 기록이 섞이면 현재 등급 수정으로 과거 월 계산을 바꿀 수 있다"
      goal: "등급 기준을 독립 관리하고 사용자별 월 적용·토큰 배분은 기존 규칙으로 연결한다"
      not: ["사용자 그룹에 따른 접근 권한이 아니다","월별 토큰 배정·사용량·승급 신청 자체를 등급 정의로 저장하지 않는다"]
    goal_trace: ["IN-06","MET-02"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - {"item":"등급 정의: 식별자·등급명·순위·설명·배분 가중치","origin":"관리자 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"적용·폐지: 정의의 적용 월·폐지/통합 시 이전 등급·변경 근거","origin":"REQ-116·REQ-118의 월 단위 관리","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"등급 정의","used_for":"신규 사용자 기본 선택과 가중치 기반 개인 한도 산정"}
      - {"attribute_group":"적용·폐지","used_for":"다음 적용 가능한 월의 사용자 배정과 과거 이력 유지"}
    consumers:
      - {"where":"Hub 이용 등록·월별 배정","when":"등록·확정 시","how":"REQ-116의 기본 등급·가중치·일할 배정과 REQ-118 산식을 사용한다"}
    business_rules:
      - "등급 폐지/통합의 이전 효력은 그 변경 기준 시작월 S부터다. S 이전 사용자 등급/배정은 유지한다. 원 승인/효력 이력은 수정하지 않고 S부터 적용할 별도 이전 근거를 남긴다. 영향은 S~다음 기준 구간뿐 아니라 영향을 받은 사용자 효력 예약이 이어지는 후속 기준도 검사하며 필요한 후속 기준/대응을 보완하기 전 반영하지 않는다. 미래 기준 삭제 시 그 기준에서 파생한 미발효 이전 예약도 함께 대조하고 필요한 취소/대체 예약을 별도 이력으로 반영한다. 이미 발효한 사용자 등급/승인 이력은 삭제하지 않는다"
      - "등급 기준의 적용 구간은 시작월부터 다음 기준 시작 전까지다. 같은 시작월 중복·빈 세트·누락/0/순위 역전 가중치를 저장하지 않는다. 미래 시작월은 저장 후 변경하지 않고 새로운 미래 기준을 등록한다"
      - "같은 미래 기준의 메모·등급·순위·가중치·제거/이전 전체를 한 단위로 검증/저장한다. 현재/과거에 적용한 기준·사용자/승인/배정 참조는 보존한다. 미래 기준 변경의 영향 구간과 이전 대상 유효성을 확인한다"
      - "이름 변경/세트 복사는 안정 등급 참조를 유지하며 과거 기록의 이름 파싱이나 ID 재발급으로 기존 연결을 대체하지 않는다. 등급 제거/통합은 미래 효력 사용자/승인 예약의 이전 대상을 정하고 전체를 함께 반영한다"
      - "새 기준이 없으면 기존 최신 시작월 기준을 계속 사용한다. 월말 배치는 다음 달에 유효한 기준의 최신 저장본과 다음 달 사용자 효력 등급을 사용한다. 월별 화면이나 통계에서 기준을 중복 편집하지 않는다"
      - "가중치 자릿수·순위별 조건·월 잠금·첫 사용 전 정정·폐지 이전 등급은 REQ-116이 정본이다. 산식·월말 다음 달 최종 배분/금융 승계는 REQ-118이 정본이다"
      - "모델 선택지는 REQ-602가 소유하며 등급·그룹별 제한을 만들지 않는다. 등급 삭제나 이름 변경으로 과거 배정·사용량을 다시 계산하지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "소속 사용자가 있는 등급을 대체 등급 지정 없이 폐지하여 다음 월을 확정하려 하면 REQ-116에 따라 거부된다"
    lifecycle: "적용 월별 예정·적용중·종료와 폐지 규칙은 REQ-116을 참조한다"
    permissions:
      - "ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: []
      conflicts_with: []
      nfr: ["NFR-011"]
      interfaces: []
    realization:
      features: [FEAT-017, FEAT-042, FEAT-045]
      screens: [SCR-021, SCR-064, SCR-065]
    examples:
      - {"kind":"정상","case":"B 등급의 다음 적용 월 가중치를 바꾸면 당월 배정은 유지되고 다음 배정 검토에만 반영된다"}
      - {"kind":"예외","case":"소속 사용자가 있는 등급을 대체 등급 지정 없이 폐지하여 다음 월을 확정하려 하면 REQ-116에 따라 거부된다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    open: []
    maturity: { level: confirmed, at: "2026-10-30", by: "AI — 사용자 모델 제한 제거 결정 반영", confirmed_by: "사용자 — 등급 정의·배분 가중치·월 적용·폐지 이전과 기존 월 잠금 규칙을 유지하고 모델 허용 집합을 제거" }

  - id: REQ-607
    type: "functional"
    priority: "should"
    workstream: "admin"
    actors:
      - "ACT-003"
    source: "2026-10-01 사용자 정정 — 요청한 것은 검색용 태그 관리이며 별도 업무 도메인 관리·자산 귀속은 요청하지 않음. 기존 REQ-303·ARCH-060의 태그·동의어 검색을 상세화하며 화면 구성은 미확정 · 2026-10-06 사용자 정정: 태그에 고정 ID를 부여해 지식에 매핑한다. 태그 텍스트만 바뀌면 지식의 매핑·본문·리비전은 바꾸지 않는다. 2026-10-06 사용자 명시 요청으로 카드 전체를 확정했다 · 같은 날 사용자 추가 확정: 요청 당시 연결 지식의 리비전 보존·태그/지식 변경 상호 차단 제외·승인 당시 영향 비교·동일 변경 대상 중복 차단과 최소 유효성 검증을 추가한 카드 전체를 명시 확정했다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-13-01"
    title: "지식 검색 태그·동의어 관리"
    detail: "고정 태그 ID별 검색 텍스트·동의어는 태그 변경 권한자가 직접 저장하고 지식별 태그 ID 매핑은 지식 변경 권한자가 지식 전체 구성으로 저장한다. 태그 텍스트만 변경해 지식 본문/매핑/리비전을 바꾸지 않는다. 당시 태그·연결 지식의 근거와 검색 적용 버전을 보존한다."
    roadmap: "RM-P1"
    acceptance: "태그 직접 저장은 현재 변경 권한·기대 버전·연결 유효성·전체 이력을 검증하고 활성 정의만 검색에 사용한다. 태그와 지식은 독립 변경하며 태그 텍스트 변경만으로 지식 본문/매핑/리비전을 고치지 않는다. 태그 전후 전체 정의·행위자/시각·사유와 실제 실행 당시 표현은 정확 태그 버전/HIST로 재현한다. 사용처는 현재 안정 ID/경로를 조회하며 지식 본문 수집·업무 의미 영향 판단/보완 근거를 요구하지 않는다."
    summary: "태그 표현과 지식 태그 ID 매핑은 소유 권한으로 각각 직접 저장하고 과거 표현·연결/영향 이력을 재현한다."
    intent:
      problem: "검색 표현과 지식의 태그 연결을 함께 취급하면 태그 텍스트 수정만으로 연결된 모든 지식의 재작성·재승인이 발생할 수 있다"
      goal: "관리자가 검색 표현을 보완하면서 태그 ID와 연결된 지식의 매핑·내용을 유지한다"
      not:
        - "별도 업무 도메인 기준정보·자산 분류 계층을 만들지 않는다"
        - "태그로 접근 권한을 부여하지 않는다"
        - "태그를 카탈로그·인증 예제에 직접 붙이는 기능을 자동으로 추가하지 않는다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자)"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 태그 정의와 지식별 태그 ID 매핑의 변경 대상을 구분한다. 기존 지식 후보·요청·검토·승인 절차는 REQ-303·REQ-305·REQ-306을 따른다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다"
    data:
      - item: "태그 정의: 안정 태그 ID·검색 텍스트·동의어·활성/적용 리비전"
        origin: "현재 태그 변경 권한자의 직접 저장"
        sensitivity: "현재 관련 자산 열람 범위 적용"
        retention: "태그 전후 전체 정의·행위자/시각·사유·기준/결과 버전·HIST를 소유 보존 정책으로 보존한다."
      - item: "지식별 태그 ID 매핑과 지식 적용 리비전"
        origin: "지식 소유 현재 적용본/변경 이력"
        sensitivity: "그룹 제한 업무 지식"
        retention: "REQ-303·305의 소유 지식 전체 직접 변경 이력. 태그 텍스트 변경으로 덮어쓰지 않는다."
      - item: "현재 사용처: 안정 지식 ID·이름·적용 리비전·참조 경로·현재 참조 여부"
        origin: "원 소유 매핑의 현재 권한 내 읽기 전용 조회"
        sensitivity: "현재 열람 허용 범위만 공개"
        retention: "태그 변경의 지식 본문 사본·의미 영향 판단 원장은 만들지 않는다."
    field_usage:
      - attribute_group: "태그 정의"
        used_for: "현재 유효 활성 검색 표현을 질의 검색어와 매칭한다."
      - attribute_group: "지식별 태그 ID 매핑"
        used_for: "지식 소유의 안정 태그 연결로 검색 범위를 구성한다."
      - attribute_group: "현재 사용처"
        used_for: "안정 참조의 사용 현황을 조회하고 필수 참조 보호를 확인한다. 지식 본문/의미 영향 판단을 수집하지 않는다."
    consumers:
      - where: "agent 지식 검색"
        when: "질의 검색어 추출 후"
        how: "지식 태그 ID 매핑으로 현재 유효 활성 태그 정의를 조회해 ARCH-060의 검색을 사용한다."
      - where: "agent 컨텍스트 구성"
        when: "주입할 지식 선택 후"
        how: "REQ-303의 지식 직접 카탈로그·인증 예제 경유 카탈로그 합산 규칙을 적용한다"
      - where: "사용 안내"
        when: "지식 검색 무결과 시"
        how: "REQ-308에 따라 사용자에게 허용된 활성 지식의 태그만 안내한다"
    business_rules:
      - "태그 ID는 안정 참조이며 검색 텍스트·동의어는 태그 자체의 현재 적용본/이력으로 관리한다. 지식은 태그 ID 매핑만 소유한다."
      - "태그 저장만으로 연결 지식 본문·태그 ID 매핑·지식 리비전을 수정하거나 자동 재반영하지 않는다. 지식 매핑 수정도 태그 정의 자체를 바꾸지 않는다."
      - "태그·지식은 각각의 실제 변경 대상 기준 버전과 현재 변경 권한을 검사한다. 연결 지식 목록/리비전 또는 태그 텍스트의 단순 변화만으로 서로의 저장을 차단하지 않는다."
      - "검색은 현재 유효 활성 태그 정의와 사용자에게 허용된 활성 지식만 사용한다. 실행이 고정한 정확한 당시 태그 표현은 해당 버전/이력으로 재현한다."
      - "태그 부재/연결 불가·실제 변경 대상의 낡은 기준본·기술 검증 실패는 차단한다. 과거 복원은 최신 적용본을 기준으로 새 직접 저장하며 기존 이력을 수정하지 않는다."
      - "사용처는 현재 권한 안의 안정 지식 ID·이름·리비전·연결 경로·현재 참조 여부로 조회한다. 지식 본문 수집·업무 의미 영향 판단/보완 원장을 만들지 않는다."
    exceptions:
      - "미등록 표현으로 검색 무결과이면 REQ-308 안내를 따른다."
      - "기준 버전·현재 변경 권한·필수 참조·이력 저장 실패는 현재 태그/지식과 검색 적용값을 바꾸지 않는다."
      - "권한 밖 지식의 태그가 검색어와 같아도 본문이나 참조 객체를 노출하지 않는다."
    lifecycle: "현재 태그/지식 적용본 조회 → 소유 권한으로 로컬 편집 → 검증·직접 저장·이력 원자 반영. 별도 요청/기술 검토/최종 승인 상태를 두지 않는다."
    permissions:
      - "ACT-003의 관리 메뉴·액션 권한을 검사하며, 검색 시 지식의 접근 허용 그룹을 적용한다"
    audit: "태그 전후 전체 정의·실제 변경자/시각·사유·기준/결과 버전·HIST를 불변 보존하고 과거 실행의 정확 태그 표현은 당시 버전/이력으로 재현한다. 연결 지식 의미 영향 판단/본문 수집 원장은 만들지 않는다."
    volume: "고객사별 태그·동의어 수와 변경 빈도는 미확인이다"
    config: "태그 표현·동의어와 지식별 태그 ID는 관리자 관리 값이다. 승인 사용 설정 없이 검증된 현재 적용본을 검색에 사용한다."
