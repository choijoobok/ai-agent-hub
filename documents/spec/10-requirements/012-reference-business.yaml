      - item: "관리 이력: 등록/소속/활성/매핑 변경 전후·사유·원천·처리자·시각"
        origin: "관리자·인사 동기화"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "이용자 참조: Portal 이용자 ID·이름·현재 이용 상태의 읽기 전용 참조"
        origin: "REQ-616"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "사용자 그룹 소속 전체·활성 상태·변경 전후·사유·기준/결과 버전"
        origin: "현재 변경 권한자의 직접 설정"
        sensitivity: "접근 권한 정보"
        retention: "중지/회수 후에도 불변 변경 이력을 보존한다."
    field_usage:
      - attribute_group: "기본 신원 규칙"
        used_for: "대상별 기본 사용자 ID 산출"
      - attribute_group: "사용자별 예외"
        used_for: "기본 규칙으로 표현되지 않는 신원을 전달"
      - attribute_group: "관리 이력"
        used_for: "오인 매핑·조직 변경 후 재부여 여부를 추적"
      - attribute_group: "이용자 참조"
        used_for: "매핑 대상 식별과 비활성 사용자 구분"
    consumers:
      - where: "agent API 실행·SQL 행 스코프"
        when: "실행 전"
        how: "API는 identity_verification의 권장 신원 확인/검수 계약으로 같은 유효 매핑을 해석하고 SQL은 기존 권한 테이블 사용자 바인딩에 사용한다. 토큰을 SQL 사용자 ID로 바인딩하지 않는다"
      - where: "admin 권한 운영"
        when: "퇴직·조직 이동 후"
        how: "REQ-103의 비활성화·그룹 재확인·재부여를 처리한다"
    business_rules:
      - "이용자 등록·활성 상태·소속 그룹·쿼터 기록은 REQ-616·REQ-103·REQ-116을 참조하며 신원 매핑에 복제하지 않는다"
      - "데이터소스는 Hub 내부 데이터소스 식별자로 매핑하고 DB스키마를 사용자 신원/권한 매핑의 추가 차원으로 두지 않는다. 다중 DB스키마·객체·DB 접속 계정 경계는 REQ-603을 따른다"
      - "서비스 인증 계정과 업무 실행 사용자의 식별자는 별개다. SSO 로그인만으로 대상 신원 매핑이 충족된 것으로 보지 않으며 개인 레거시 비밀번호를 저장하지 않는다"
      - "필수 신원 매핑이 없거나 중지되면 신원 설정 오류로 거부한다. NULL 바인딩이나 권한 없는 정상 0건으로 처리하지 않는다. 유효 신원에 허용 행이 없는 경우는 정상 0건이다"
      - "사용자별 명시 설정은 해당 대상의 기본 신원 규칙보다 우선한다. 기본 규칙 산출값도 유효한 사용자별 직접 설정을 대신하지 않으며 대량 등록/동기화는 같은 직접 저장 검증과 감사를 따른다"
      - "신원 매핑 신규·아이디 교체·중지·재설정은 identity_management의 직접 관리이며 별도 요청/승인/전결과 승인 절차 설정을 적용하지 않는다. 저장 성공부터 새 현재 매핑을 사용하고 실패 시 기존 유효 매핑을 유지한다"
      - "사용자 그룹 소속 추가/재부여/중지는 현재 해당 사용자·그룹의 변경 권한으로 직접 저장한다. 저장 전후 전체 소속/활성 상태·사유·행위자·시각·버전을 보존하며 별도 승인/전결 기록을 만들지 않는다."
      - "그룹 소속은 물리 삭제하지 않고 중지/회수한다. 마지막 활성 그룹 중지는 이용자 비활성화와 함께 처리하고 재활성화는 유효 그룹/등급 등 현재 조건을 검사한다."
      - "현재 신원/소속만 접근 판정에 사용한다. 미설정·중지 신원이나 중지/회수 소속, 과거 미반영 요청을 유효 권한에 포함하지 않는다."
      - "신원·그룹 변경은 REQ-108의 매 접근 시점 현재 판정에 반영한다. 사용자/LLM이 서버 신원 바인딩을 덮을 수 없다. 과거 요청/승인 이력은 보존하고 늦은 승인으로 현재 설정을 변경하지 않는다."
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "재고 행 스코프에 필요한 사용자 매핑이 없으면 '조회 결과 없음'이 아니라 신원 설정 오류로 거부한다"
    membership_record:
      owner: "UC-024. SCR-005 사용자 그룹 탭과 SCR-006 사용자 탭은 동일한 소속 원장과 조회/저장 계약을 사용한다. 두 화면용 저장 테이블·감사 원장을 따로 만들지 않는다. 물리 테이블명과 키/버전 상세는 소유 설계에서 확정한다."
      key: "Portal 사용자 안정 참조 + 사용자 그룹 안정 참조. 화면에는 Portal 로그인 아이디와 사용자 그룹 식별자를 표시하고 같은 조합의 현재 소속 행은 하나만 둔다."
      fields: [사용자 아이디, 사용자 그룹 식별자, 활성화 여부, 등록자, 등록일시, 수정자, 수정일시, 메모]
      views: "사용자 그룹 화면에서는 선택 그룹을 고정하고 사용자를 조회하며, Portal 사용자 화면에서는 선택 사용자를 고정하고 그룹을 조회한다. Portal 사용자 화면의 사용자 그룹 탭은 그룹 식별자와 기준정보에서 조회한 그룹명을 합치지 않고 별도 컬럼으로 표시한다. 신규 그룹 선택 시 명칭을 자동 표시하며 직접 편집하지 않는다. 이름·최종 접근 판정·처리 상태·변경 가능 여부·이력 번호는 소속 저장 컬럼으로 복제하지 않는다."
      candidates: "SCR-006 사용자 탭의 추가는 Portal 사용자 조회 팝업에서 사용자 아이디/이름으로 현재 열람·부여 허용 사용자를 조회·선택한다. 선택 그룹은 고정한다. SCR-005 사용자 그룹 탭의 추가는 신규 소속 행 하나를 만들고 REQ-605 사용자 그룹 기준정보의 현재 허용 후보로 구성한 콤보에서 그룹을 선택한다. 선택 사용자는 고정하고 기존 소속의 그룹 키는 변경하지 않는다. 공통코드나 이름 하드코딩으로 기준정보 조회를 대체하지 않는다."
      addition: "각 탭은 추가 버튼 하나만 제공하며 표시명은 추가다. 팝업 닫기/미선택/조회 실패/정상 0건은 소속 행을 만들지 않는다. 선택·콤보는 저장 전 편집 행만 바꾸며 서버 소속·등록 감사값을 만들지 않는다. 현재/미저장 소속의 중복을 막고 중지된 기존 소속은 기존 행의 활성화 여부를 바꿔 재부여한다. 추가한 미저장 행은 제거할 수 있으나 저장된 소속은 물리 삭제하지 않는다. 저장 시 현재 권한·대상 유효성·기대 버전을 재검사한다."
      save: "활성화 여부·메모를 같은 현재 소속 행에 저장한다. 기존 사용자/그룹 키는 교체하지 않고 중지·재부여로 처리한다. 물리 삭제는 제공하지 않으며 마지막 활성 그룹 중지는 이용자 비활성화와 원자 처리한다."
      audit: "등록자·등록일시는 소속 최초 등록 시 서버가 기록하고 중지/재부여에도 보존한다. 수정자·수정일시는 활성/메모 변경 성공 시 서버가 기록한다. 계정/그룹 정의의 감사값과 구분하며 두 탭은 같은 소속 감사값을 표시한다."
      memo: "소속 메모는 기존 변경 사유를 겸하며 추가·활성 변경 시 공백을 거부한다. 메모 변경 전후도 불변 변경 이력에 포함한다."
      concurrency: "두 화면은 같은 소속의 기대 버전·현재 권한·중복/마지막 그룹 검증과 이력을 사용한다. 한 화면의 저장 뒤 다른 화면의 낡은 입력으로 덮어쓰지 않는다. 내부 안정 키·기준 버전·잠금/오류 근거는 서버 검증 자료이며 별도 그리드 컬럼을 강제하지 않는다."
    identity_verification:
      decision: "2026-11-03 사용자 승인·ADR-041. Hub의 권장 신원 확인 프로세스는 불투명 난수 토큰과 인증된 대상 시스템의 서버 간 검증·일회 소비다. 제품 구현 완료나 모든 기존 연동의 강제 전환을 뜻하지 않는다."
      scope: "업무 API의 사용자 위임 신원 확인에 적용한다. Portal 로그인·관리자 인증·서비스 접속 자격증명·데이터소스 SQL 행 스코프·모델 사용량 토큰과 구분하며 대상 시스템의 자체 업무 권한 검사를 대체하지 않는다."
      contract_source: "대상 시스템/명시 연결의 배포 기술 계약에서 신원 확인 방식·생성/해석·전달 위치·검증 주체를 정한다. 동일 연결 안에서 API별 차이가 있으면 검수된 계약 참조를 명시한다. API 목록의 신원 필요 스위치는 제거하고 계약 미설정/확인 불가를 신원 불필요로 바꾸지 않는다. 사용자 위임 없음도 검수된 계약으로만 허용한다."
      adoption: "고객사가 대상 시스템 또는 앞단 게이트웨이의 검증 기능과 보호된 내부 왕복 경로를 제공할 수 있을 때 권장 프로세스를 채택한다. PRN-09에 따라 기존 시스템 코드 변경을 일괄 요구하지 않는다. 기존 검수 계약은 유지할 수 있으나 토큰 경로의 장애/미지원으로 평문 ID·공용 계정·인증 없음으로 자동 하향하지 않는다."
      flow:
        - "Hub는 신뢰된 Portal 실행 주체와 현재 이용 상태·권한·유효 대상 신원 매핑 및 실제 실행 승인을 확인한다. 호출 목적지·명시 연결·계약과 최종 업무 입력을 확정하고 사용자/모델이 보호 신원을 덮지 못하게 한다."
        - "Hub 내부 실행 서비스가 호출 직전 암호학적으로 안전한 난수 토큰을 생성한다. 사용자 아이디의 인코딩/임베딩/암호문으로 토큰을 만들지 않는다. 토큰 해시와 최소 바인딩·만료·미사용 상태를 Hub DB에 확정한 뒤에만 외부 요청을 보낸다. 브라우저/모델용 자유 발급 기능은 두지 않는다."
        - "Hub는 계약이 지정한 보호 헤더를 기본으로 실제 업무 API에 토큰을 전달한다. 대상 시스템/게이트웨이는 원 요청의 Hub 호출자 증명을 검증하고 실제 받은 요청의 근거를 준비한다."
        - "인증된 대상 시스템/게이트웨이는 Hub의 전용 검증·소비 API에 토큰과 실제 요청 근거를 보낸다. 대상 시스템이 Hub DB에 직접 접속하지 않으며 Portal/관리자 세션이나 토큰 소지만으로 이 API를 이용하지 못한다."
        - "Hub는 인증된 소비자의 허용 대상/연결 범위와 토큰 바인딩·현재 신원/권한·만료·미사용 조건을 확인하고 미사용에서 사용 완료로 한 번만 원자 전이한다. 확정 성공 후에만 해당 대상의 사용자 아이디와 검증 요청 식별자를 최소 응답으로 반환한다."
        - "대상 시스템은 반환된 신원을 검증한 동일 요청에만 적용해 자체 현재 권한·업무 인자·중복 실행 검사를 수행한 뒤 실행한다. 신원 확인 성공이나 토큰 사용 완료를 업무 성공으로 간주하지 않는다."
      record:
        token: "원문은 저장하지 않고 높은 엔트로피의 난수 토큰 해시를 조회 키로 보관한다. 해시 충돌/중복이면 발급을 실패시키거나 재생성하고 기존 행을 덮지 않는다. 토큰은 사유·관리 속성·설정 불일치 판정용 설정 지문에 포함하지 않는다."
        subject: "Hub 실행 사용자·대상 시스템·명시 연결·현재 신원 매핑 참조와 유효 버전을 연결한다. 유효 버전은 실제 아이디 산출에 사용한 개별 설정뿐 아니라 기본/변환 규칙도 포함한다. 원 사용자 아이디의 별도 평문 사본 원장을 만들지 않고 현재 유효 매핑에서 소비와 같은 일관성 경계로 해석·고정한다. 소비 확정 후 현재 매핑을 재조회해 반환 아이디를 바꾸지 않으며 평문 사본의 영속 저장을 요구하지 않는다."
        binding: "환경·대상 시스템·명시 연결·API/신원 계약 버전·논리 업무 요청·전송 시도·허용 작업·확정 요청 내용의 근거와 허용 Hub 호출자 키/인증서 및 소비자 범위를 연결한다. 다른 환경·시스템·API·요청으로 전용할 수 없다."
        lifecycle: "발급 시각·짧은 만료 시각·사용 완료 여부/시각·검증 요청 식별자와 최소 감사 연결을 저장한다. 물리 테이블·정확 TTL·파기 주기는 후속 상세 설계에서 확정한다. 만료 확인은 정리 배치 실행 여부와 무관하게 매 소비에 강제한다."
      caller_proof: "원 업무 요청의 Hub 호출자 증명과 대상→Hub 소비 호출의 대상 인증을 모두 요구한다. mTLS(상호 인증 TLS)와 토큰에 결합된 인증서/키 소유 증명을 권장하며 동등한 방식은 공동 검수 계약으로 정한다. 소비자는 자기 대상/연결 범위만 확인할 수 있고 body에 적은 시스템 ID를 인증 근거로 쓰지 않는다. 프록시/게이트웨이의 인증 근거 전달은 신뢰 경로로 보호하고 직접 우회·위조 헤더를 막는다."
      request_binding: "대상이 실제 받은 메서드·목적지/경로·업무에 영향을 주는 쿼리/헤더/본문의 계약상 정규 근거를 발급 근거와 대조한다. 요청 식별자만 같다고 허용하지 않는다. 토큰 자체·전송용 가변값 제외와 직렬화/중복 키/프록시 변환 처리의 정규화 규칙은 공동 계약에서 확정하며 미지원·모호한 입력은 닫는다."
      atomic_consumption: "현재 이용자·그룹/자산/연결 효력·신원 매핑/규칙 버전의 유효성 검사·반환할 대상 사용자 ID 해석/고정과 미사용→사용 완료·최소 감사 확정은 일관된 원자 경계를 갖는다. 동일 토큰의 동시 소비는 한 번만 성공한다. 잘못된 인증/대상/요청·만료·회수·이미 소비된 토큰은 신원을 반환하지 않고 조건 실패 요청이 정상 토큰을 먼저 소모하지 못한다. Hub DB 확인/쓰기 실패도 닫는다."
      revocation_order: "아이디 교체·규칙 변경·이용/권한 회수와 소비의 선후를 결정한다. 회수/변경이 먼저 확정되면 이전 바인딩의 소비를 거부한다. 소비가 먼저 확정되면 뒤의 회수는 이미 허용된 한 요청을 소급 취소한 것으로 기록하지 않으며 다음 발급/소비를 막는다. 대상 시스템의 실행 직전 자체 권한 검사는 별도로 유지한다."
      retry: "사용 완료된 토큰의 재소비는 거부하고 사용자 아이디를 다시 반환하지 않는다. 소비 응답 유실·결과 불명·대상 실행 응답 유실에서는 실패를 미실행으로 단정하거나 토큰을 미사용으로 복원하지 않는다. 새 토큰을 만든다는 이유로 업무를 자동 재전송하지 않으며 REQ-105·113의 결과 확인/멱등성/실제 사용자 재승인 조건을 적용한다. 허용된 기술 재시도는 새 토큰·전송 시도와 같은 논리 업무 요청 키를 연결하고 대상 중복 실행 방지를 유지한다."
      failure: "토큰 발급/저장·호출자 확인·검증 API/DB 장애·신원 해석 실패이면 해당 업무 실행을 차단한다. 외부 응답에는 다른 사용자/대상/토큰 존재를 추론할 세부 정보를 내보내지 않으며 인증된 운영 근거만 안전하게 구분한다. 이미 전송한 업무의 결과 확인과 신규 실행 허용은 별개다."
      privacy: "토큰 원문과 신원 확인 응답은 해당 보호된 서버 경로에만 전달한다. 원문 토큰은 URL/쿼리 스트링·모델 문맥·브라우저·화면/엑셀·관리 HIST·실행 인자 보관/지문·일반 감사/오류·프록시/APM 로그에 넣지 않는다. 대상 사용자 ID는 대상 권한검사에 필요한 최소 범위로 반환하고 응답 캐시/재사용을 금지한다. 일반 감사에는 별도 발급/소비 사건 ID·안전한 대상/요청 참조·시각·결과만 남긴다."
      boundaries: "토큰 상태를 DB에 둔다고 대상 시스템의 업무 트랜잭션과 원자 커밋되는 것은 아니다. 외부 호출 중 Hub DB 쓰기 트랜잭션/행 잠금을 잡지 않는다. 콜백 처리가 원 호출 대기로 고갈되지 않도록 자원·타임아웃 경계를 검수하고 Hub 확인 장애 시 계속 실행을 허용하지 않는다."
      ownership: "admin은 현재 신원 매핑과 관리 계약을 제공하고 agent 업무 API 실행부는 발급·요청 결합·결과를 소유한다. integration은 대상 서버 인증·키 보호·내부 인바운드 경로를 담당한다. 구체 런타임 서비스 배치와 물리 저장/공개 API는 교차 상세 설계로 확정한다."
      verification: ["발급/매핑/요청 결합과 비밀 비노출", "인증 없는 소비·다른 환경/대상·요청 변조 거부", "동시 소비와 신원/권한 회수 경합", "소비 응답 유실과 업무 중복 실행 방지", "콜백/DB 장애 및 잘못된 요청의 토큰 소모 방지", "신원 필요 컬럼 제거와 계약 미설정 차단"]
      references: ["https://www.rfc-editor.org/rfc/rfc7662.html", "https://www.rfc-editor.org/rfc/rfc8705.html", "https://www.rfc-editor.org/rfc/rfc9700.html"]
      standard_boundary: "토큰의 상태/신원을 서버에 확인하는 표준 패턴을 참고하되 일회 소비·요청 결합은 Hub의 추가 계약이다. OAuth 인트로스펙션 자체가 일회 소비를 보장한다고 표현하지 않는다."
      pending: ["@defer P3 agent/integration·admin G3 교차 검수 — 논리/물리 저장 모델·서비스/API 경로와 오류 코드·인증서/키 교체·정규 요청 해시·만료/보존/파기 수치·부하/콜백 용량·결과 확인 계약을 확정하고 고객사 지원 여부를 공동 검수한다. 미확정 계약은 운영 활성화하지 않는다."]
