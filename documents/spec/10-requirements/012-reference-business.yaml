    examples:
      - {"kind":"정상","case":"주문 접수 API의 성공을 '접수'로 등록하고 요청 ID로 결과 확인 API를 연결해 완료 여부를 별도 확인한다"}
      - {"kind":"정상","case":"출고 지시 지식에 주문 조회 API와 출고 지시 API를 연결한다. 주문번호는 사용자에게 얻고 창고코드는 현재 주문 조회 결과에서 채우며 처리유형은 등록된 고정값 NORMAL, 출고예정일은 사용자 날짜를 지정 형식으로 바꾸고 요청자 ID는 서버 신원 매핑으로 제공한다. 출고 지시 전에 완성된 값을 제시해 승인받는다"}
      - {"kind":"정상","case":"같은 출고 API를 여러 업무 지식에서 참조해 각 매핑 설명에는 용도·사용 조건만 작성하고 업무별 질문·조회 흐름은 지식 본문에 작성하되 공통 파라미터 명세를 복사하지 않는다. API 연결 제거는 지식 전체 직접 저장 성공 뒤 적용하며 다른 지식의 연결이나 API 자산 자체를 삭제하지 않는다"}
      - {"kind":"예외","case":"창고 조회 결과가 여러 건인데 선택 기준이 없으면 사용자에게 창고를 확인한다. 모델이 첫 결과를 임의 선택하거나 등록 고정값·요청자 ID를 바꾸어 호출하지 못한다"}
      - {"kind":"예외","case":"지식 접근 그룹에는 속해도 연결 출고 API의 허용 그룹이 아니면 그 API를 호출하지 못한다. 출고 지식 연결만으로 호출 권한을 얻지 않는다"}
      - {"kind":"예외","case":"사용자가 출고예정일 A로 승인한 뒤 B로 바꾸면 변경된 파라미터를 다시 제시해 승인받고 실행한다"}
      - {"kind":"예외","case":"응답에 미등록 주민번호 경로가 추가되면 화면·LLM에 원문을 전달하지 않고 경고한다"}
    volatility:
      level: "high"
      what: "고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"
    approval_target: "API 연결 선택·계약 버전이 같아도 실제 목적지/실행 주체의 의미 변경은 REQ-105.approval_target_binding을 적용한다. API 명시 연결 해석과 호출 시 적용 근거를 승인 대상에 연결하며 비밀값은 일반 승인 자료에 복제하지 않는다"
    open: ["@defer P3 2026-10-13 사용자 요청으로 REQ-011.export_policy가 요구한 조회 API 반출 허용 속성의 관리 단위·응답 경로 상속·기본값·변경 권한/이력·파생 결과 추적을 기존 계약/정책 경계와 연결한다. 결과 필드 타입·코드명/가공 의미도 REQ-011의 표시 계약과 대조한다", "@defer P3 field_metadata의 실제 속성명·자료형/의미 유형 코드·경로/형식 표현·코드 참조와 개인정보 속성 저장·검증 계약·입력/응답 편집 화면을 구체화한다. 관리 범위와 누락 시 통제를 상세 설계 재량으로 축소하지 않는다", "@defer P3 field_value_mapping의 방법 선택·경로/참조·조건 매핑·코드/명칭 대응·조회 범위/시간 상한·실패 상태/메시지·이력 계약과 편집 화면을 구체화한다. 일괄 조회·캐시 적용 여부/유효성은 상세 설계에서 판단하되 현재 권한·회사/그룹 조건과 원 업무 상태 보존을 지킨다", "@defer P2 명시 연결 선택과 현재 적용 정의/승인 대상 비교는 ARCH-028.api_connection_resolution을 따른다. 배포 연결의 적용 시점·노드 간 효력과 검수 근거 전달은 같은 항목의 deployment_contract.pending에서 확정한다", "@defer P3 지식의 안정된 API 식별자 연결·내용 버전 선택·변경 영향·제출/승인/반영의 참조 검증은 ARCH-028.asset_versions를 물리 리비전·이력·조건부 반영 계약과 시험으로 구체화한다. 지식 매핑 승인과 API 자체의 공동 오픈 갱신 절차는 구분한다", "@defer P3 대상 시스템 선택 후 연결 후보를 제공하는 흐름을 화면 요건서·목업으로 구체화한다. 그리드의 연동 콤보박스 등 실제 입력 위치·컴포넌트는 화면 설계에서 확정한다", "@defer P3 기본 주소·상대 경로 결합, 보호 헤더 이름/우선순위, 신뢰된 동적 신원 주입 및 목적지 변경 우회 차단 시험을 구체화한다", "@defer P3 입력 필드·값의 출처·조회 결과 추출·형식 변환·고정값/기본값의 표현과 검증 계약, 누락/복수 후보 확인 흐름, API 가이드와 지식 API 매핑의 화면 요건서·목업을 구체화한다. 사용자·모델의 고정값/신원 덮어쓰기와 승인 후 값 변경 차단 시험을 포함한다", "@defer P3 결과 안내 가이드·후속 대상 참조의 입력 화면과 계약/매핑 설명 대조, 버전 선택·결과 문맥 구성·검증 사례를 화면 요건서·목업 및 계약 시험에 연결한다"]
    maturity:
      level: "confirmed"
      at: "2026-10-27"
      by: "AI — 사용자 권장안 반영 요청 적용"
      confirmed_by: "사용자 (2026-10-26 이번 보완으로 재확정 대기로 바뀐 REQ-608 전체 보완본 재확정 요청) 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 API 연결 해석과 실행 승인 결합 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."
    connection_selection: "REQ-604의 시스템을 먼저 선택한 뒤 그 시스템에 속한 현재 기술 유효 연결 식별자를 필수 명시한다. 기본 연결 모드/식별자는 없다. 시스템 변경은 이전 선택을 지우고 재선택하며 없는 선택·다른 소속·관측 실패를 다른 연결로 대체하지 않는다."
    asset_availability: "REQ-601.asset_availability. API useYn은 수동 설정 스위치이며 목록 진단은 REQ-601.configuration_diagnosis의 선택 연결 기준 서버 설정 불일치 배지다. 사용 가능 여부는 서버 내부 판정으로 유지하되 별도 목록/숨김 선택 컬럼으로 제공하지 않는다. YAML 제거·장애·복구가 수동 값을 바꾸지 않는다. 예약/저장된 정의·워크플로우 직접 호출도 전송 직전에 같은 검사를 받는다."
    configuration_alerts: "REQ-601.configuration_alerts. API 목록은 useYn과 선택 연결의 저장 판정을 참조한 서버 설정 불일치(일치/불일치/확인 필요)를 제공한다. 기존 진단 세 컬럼은 제거하고 안전한 사유는 배지 설명/경고로 제공한다. API별 판정 사본이나 시스템 전체 집계값을 저장하지 않는다. 누락 설정의 영향 참조는 경고에 연결하며 실제 접속 성공과 설정 유효를 구분한다."
  - id: REQ-609
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
    source: "2026-11-03 사용자가 Hub 권장 신원 확인 프로세스로 난수 매핑 토큰 발급·보호된 검증 API·DB 일회 소비와 신원 필요 컬럼 제거를 요구에 반영하도록 승인(ADR-041). 2026-10-31 사용자 명시 변경: 사용자 그룹 추가만 기존 승인 정책을 유지하고 신원 매핑은 승인 없이 직접 설정한다. 데이터소스와 대상 시스템 탭을 나누고 기준정보 후보에서 필요한 대상만 설정한다(ADR-036). 이전 2026-10-01 ADR-018·10-08 ADR-023의 신원 승인 범위를 대체하며 그룹·회수 규칙은 유지한다. · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-13-01"
    title: "Portal 이용자의 대상별 신원 매핑과 사용자 그룹 부여"
    detail: "관리자는 Portal 사용자의 대상별 신원 아이디 신규/교체/중지와 사용자 그룹 소속 추가/재부여/중지를 승인 없이 직접 설정·저장한다. 계정·그룹·신원 각각의 현재 권한과 업무 유효성·기대 버전·전체 변경 이력을 검증한다."
    roadmap: "RM-P1"
    acceptance: "기준정보의 현재 열람 허용 데이터소스/대상 시스템 후보를 조회해 필요한 아이디만 저장한다. 사용자 그룹 소속 추가·재부여·중지도 권한자가 직접 저장하며 물리 삭제 없이 감사 이력을 유지한다. 어느 작업도 별도 관리자 요청/승인/전결을 만들지 않는다. 마지막 활성 그룹 회수는 이용자 비활성화와 원자 처리한다."
    summary: "대상별 사용자 아이디와 사용자 그룹 소속은 권한자가 직접 설정하고 전후 감사 이력을 남긴다."
    intent:
      problem: "계정·Hub 소속·레거시 사용자 식별을 혼동하면 퇴직·이동 후 권한이 남거나 다른 사람의 신원으로 실행한다"
      goal: "Portal 이용자를 대상별 실제 사용자 신원과 연결한다"
      not:
        - "Portal 사용자 프로필·조직·이용 상태를 이중 관리하는 원장이 아니다"
        - "사용자 레거시 비밀번호나 사용자별 실제 행 접근 목록을 복제하지 않는다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
