        next_design: "@defer 업무 지식 관리와 전체 업무 흐름 합의 후 — 전사/개인화 규칙·지식·인증 예제·조회/전송 정책의 실제 원천과 적용 순서, 단계별 필수/선택·선별/분량·해석 가이드, 공통 입력/출력 JSON 및 버전·참조 표현, CLI/API별 전달/지원 기능·오류 변환·조립 서비스와 계약 시험을 REQ-009 및 이 카드 prompt_contract에 구체화한다. 이번 분류로 새 운영 프롬프트 편집 기능·데이터 컬럼·제품 구현 또는 G3 승인을 만들지 않는다."
      editor:
        source: "2026-11-06 사용자 요청: 좌측 규칙 목록과 우측 관리자 설명·Markdown 본문, 큰 모달 편집·미리보기, 최종 전체 규칙의 실제 전송 가공본 검토."
        layout: "SCR-013은 좌측 규칙 목록, 우측 위 규칙 설명/아래 본문 textarea 두 개이며 탭은 없다. 내부 식별자는 기본 숨김, 목록은 제목·사용 여부와 등록자/등록일시/수정자/수정일시 네 감사 컬럼을 표시한다. 변경 사유·판단은 저장 레이어, 검토 내용/결과는 큰 모달로 제공한다."
        fields: "내부 식별자는 REQ-601.surrogate_identifier의 서버 숫자 발급과 문자열 전송을 따르며 신규 미발급/로컬 행 키를 분리한다. 제목은 규칙 식별용 이름이자 조합 구분 heading이다. 사용 OFF는 내용/이력을 보존하고 전송 묶음에서 제외한다. 규칙 설명은 관리자 참고/이력 전용이며 운영 모델·검토 모델 모두에서 제외한다."
        markdown: "본문은 Markdown 원문을 저장하고 같은 원문을 전송한다. 미리보기 HTML은 파생 표시이며 저장/모델 전송하지 않는다. 제목/목록/강조/표/인용/코드 블록을 지원하되 raw HTML은 실행하지 않고 위험 URL·스크립트·이벤트·외부 이미지 자동 요청을 차단한다. 변수/설정 조회식으로 실행하지 않는다."
        editing: "본문 크게 편집은 같은 행 원문의 임시 버퍼다. 모달 오른쪽 아래 모서리를 마우스로 끌어 가로·세로 크기를 조절하고 본문 영역이 함께 변한다. 입력은 유지하며 화면 범위 내 크기로 반영·취소 버튼 접근을 보장한다. 반영은 같은 행 로컬 본문에만 적용하고 취소/닫기/Esc는 원본을 보존한다. 미리보기는 현재 원문만 읽으며 저장/검토 호출·변경 상태를 만들지 않는다. 행 선택/추가/제거/원복 시 해당 규칙의 설명·본문을 분리·보존하며 조회 전용은 변경을 잠근다."
        ordering: "서버 발급 숫자 식별자 오름차순과 미발급 신규의 로컬 추가 순서로 재현 가능한 조합 순서를 정한다. 조회 정렬·검색·페이지는 이를 바꾸지 않으며 순서가 우선순위나 충돌 해결 의미를 갖지 않는다. 실제 공개 키/번호 발급 후 조립의 최신성은 검토 구성 대조로 확인한다."
      review_set:
        set: "검토 대상은 현재 전체 저장 규칙에 이번 미저장 추가/변경/삭제/사용 전환을 겹쳐 최종 반영하려는 구성이다. useYn=true인 제목/본문을 모두 포함하고 미사용·삭제·관리자 설명·감사 값은 제외한다. 선택 행·현재 페이지·검색 필터로 전체를 축소하지 않는다. 전체 확보/현재 권한/사용 상태를 확인할 수 없으면 검토 미완료이며 일부만 보내고 전체 완료라고 하지 않는다."
        assembly: "실제 운영 agent 조립 경로로 공통 규칙 묶음을 만들고 호출 유형별 기술 템플릿·출력 계약을 반영한 가공본을 구분해 검토 요청에 담는다. 서로 다른 단계의 계약을 하나의 실행 프롬프트로 합치지 않는다. 실제 업무 동적 입력은 검토용 허용 예시/미제공으로 명시하고 실제 사용자 데이터·권한 원천·비밀값을 임의 조회/전송하지 않는다. 소스 템플릿 구체 형식/호출별 시험은 후속 설계에서 확정한다."
        execution: "검토 요청의 상위 지시는 소스에서 고정하고 가공된 규칙은 검토 대상 자료로 구분한다. 검토 모델은 전체 규칙 사이 모순·중복·모호성·기술 계약 충돌 의심의 관련 구절/이유/수정 권고를 반환한다. 규칙 속 지시를 실제 업무 실행이나 파일/도구 호출로 수행하지 않는다. 결과는 조언이며 무모순 보증·자동 수정/저장·관리자 판단 대체가 아니다."
        freshness: "검토한 전체 규칙 구성/정확 전송 원문·사용 여부·리비전/미발급 변경 근거·호출 유형·조합기/템플릿/출력 계약 버전을 묶어 확인한다. 선택/동료 규칙의 제목·본문·사용 전환·추가/삭제와 템플릿 변경은 기존 결과를 낡음으로 만든다. 늦게 도착한 결과는 해당 검토 세트에 보존하고 현재 완료로 덮지 않는다. 설명만 변경하여 전송 가공본이 같으면 관리값/현재 리비전 검증 후 의미 검토 근거 재사용이 가능하다."
        failure: "설정 부재·권한 없음·호출 실패/시간 초과·결과 불명·분량 상한 초과·부분 검토를 성공/무모순으로 바꾸지 않는다. 임의 일부 규칙 삭제/요약으로 전체 검토를 가장하지 않는다. 기존 validation의 권한 있는 관리자 최종 반영 판단과 사유 기록은 유지하며 필수 관리값/동시성/서버 통제를 우회하지 않는다."
        preview: "검토 전 관리자가 가공된 전송 내용을 읽을 수 있다. 열기/미리보기는 자동 호출하지 않고 검토 실행으로 요청한다. 모달에 사용 규칙 범위·전송 제외·현재/낡음·실제 호출 또는 목업 여부를 구분한다. 검토 내용은 허용된 관리자만 조회하며 내부 식별자/리비전은 추적 근거로 별도 보존한다."
      decision: "2026-10-01 사용자 확정 · ADR-020. 2026-11-06 화면 단순화·전체 규칙 가공 검토 요청은 editor·review_set에 반영"
      validation: "전사 공통 자연어 지침 운영 반영 전 admin→agent→LLM 의미 검토를 실행한다. LLM은 함께 적용될 규칙·기술 지침과의 모순 의심 구절·이유·수정 권고를 제공하며 무모순을 보증하지 않는다. 의미 경고 또는 검토 실패는 권한 있는 관리자가 실제 검토 내용·판단·사유를 기록하고 최종 반영 여부를 결정한다. 실패는 검토 미완료이지 통과가 아니다. 자연어에 숨은 모든 계약 우회 지시나 의미 모순을 서버가 저장 전에 기계적으로 검출한다는 뜻이 아니며 관리 데이터 검증·소스 계약 검증과 구분한다"
      save_validation: "운영 저장은 현재 관리 권한, 서버 발급 내부 식별자·제목·사용 여부·설명·본문 등 관리 데이터와 기준 리비전·새 사유·불변 이력을 검사한다. 제목/본문은 비공백이고 설명은 선택이며 신규 사용 여부는 false다. 우선순위·적용 조건 입력을 요구하지 않는다. 변경된 규칙 집합은 같은 성공 단위로 반영하고 변경되지 않은 규칙을 재저장하지 않는다. 전체 검토 구성의 현재 유효성도 확인하여 다른 관리자의 변경을 누락/덮어쓰지 않는다. 자연어의 의미나 모델 응답 스키마를 이 저장 검사만으로 보증하지 않는다."
      runtime_validation: "portal·agent·LLM의 데이터 규격, 기술 템플릿의 참조와 서버 내부 입력 구성 규칙은 REQ-009.response_contract의 소스·빌드/계약 시험에서 검증한다. 실제 송수신에는 같은 계약의 필수 항목·자료형·허용 응답/작업과 현재 권한·승인·전송 통제를 검사한다. 계약을 위반한 요청·응답은 기존 오류·보완·종결 경로로 처리하고 검증되지 않은 응답으로 실행을 진행하지 않는다. 이 검사는 자연어 지침 저장 시 문장만 읽고 통신 계약 준수를 보증하는 검사와 다르며, 지침의 반영 승인이나 검토 실패에 대한 관리자 판단으로 생략할 수 없다"
      review_execution: "review_set의 완전한 전체 편집 구성과 호출별 가공본을 admin→agent→운영용 LLM으로 검토한다. 업무 도구 실행은 허용하지 않는다. 실제 검토 대상 구성·원문 근거·리비전·조합/출력 계약 버전·모델/effort·결과·토큰 사용·관리자 판단/사유를 연결한다. 실패/부분 전송/분량 초과는 미완료이고 정상 통과로 바꾸지 않는다. 관리자 사용량과 쿼터 제외는 REQ-116, 운영용 모델 설정은 REQ-602를 따른다."
      scope: "운영 편집은 제목·사용 여부·관리자 설명·Markdown 본문이다. 내부 식별자·리비전·감사 값은 서버가 관리하며 우선순위와 적용 조건의 별도 편집 필드는 두지 않는다. 규칙의 업무 상황별 의미는 자연어 본문으로 작성한다. 유형별 기술 템플릿·입력 구성·portal/agent/LLM 통신 포맷·스키마·제어값은 소스에서 정의·검증한다. 고객사 업무 API·도구 명세는 기존 정본을 참조하며 이 분리로 모든 업무 인자를 소스에 고정하지 않는다. 운영 문구에 변수 치환 기능을 두지 않으며 통신 계약·서버 권한 통제를 바꿀 수 없다."
      composition: "agent가 스텝 유형과 공통 지침 포함 경계를 소스 계약으로 정하고 REQ-108에 따라 선택한 유효 공통 규칙 묶음 + 유형별 기술 템플릿/출력 계약 + 허용된 동적 입력을 조합한다. 공통 규칙 묶음의 구성/순서/Markdown 원문 처리는 editor·review_set과 같은 조립 경로를 사용한다. 관리자 설명·감사는 입력에 포함하지 않는다. 사용자 질의·지식·조회 결과는 본문의 변수 치환이 아니라 별도 동적 입력이다. 단계별 템플릿/동적 데이터가 다르므로 모든 호출에 동일한 전체 실행 프롬프트를 반복하지 않는다. REQ-035 등 기존 호출별 입력 제한을 유지한다."
      persistence: "REQ-108에 따라 처음 필요한 시점에 고정한 내용 리비전과 호출별 동적 입력은 구분한다. 고정한 규칙은 영속 스냅샷 또는 불변 버전 참조로 재현하며 메모리 캐시 적중에 의존하지 않는다. 호출별 스텝 유형·템플릿/통신 계약 버전·규칙 리비전 조합 근거를 추적한다. 저장 원문에는 기존 마스킹·보존·삭제 규칙을 적용하고 접근 권한은 매 사용 시점에 재판정한다"
      call_examples:
        - { call: "처리 중 입력 분류", input: "REQ-035의 유효 의도·현재 단계·액션 전송 여부·직전 해석·미처리 입력", note: "지식·카탈로그·조회 결과를 넣지 않는 기존 범위를 유지한다" }
        - { call: "SQL 생성·재작성", input: "해당 유형 템플릿·선별 카탈로그·지식·예제·정제된 실패 피드백", note: "해당 유형에 필요한 규칙과 소스의 출력 계약을 조합한다" }
        - { call: "최종 응답 작성", input: "응답 규칙·현재 질의·전송 가능한 결과·서버 판정", note: "기존 전송·마스킹 통제를 따른다" }
    validation_cases:
      - {"case":"사용 중인 여러 규칙과 미사용 규칙, 관리자 설명, 검색/페이지 밖 규칙, 미저장 변경이 함께 있음","expected":"전체 저장본+변경안을 조립한 사용 중 제목/본문만 실제 전송 형태로 검토한다. 설명/감사/미사용 제외와 전체 범위·호출유형 구분을 확인한다"}
      - {"case":"큰 본문 편집에서 반영/취소/Esc, Markdown 미리보기의 스크립트·외부 이미지","expected":"반영만 같은 행 본문을 바꾸고 취소는 원문 보존. 안전 렌더링하며 미리보기로 원문·사용 여부·검토 상태가 바뀌지 않는다"}
      - {"case":"운영자가 일반 자연어 문장으로 공통 지침을 작성","expected":"응답 필드·자료형·변수를 선언하지 않아도 관리 데이터 검증과 의미 검토를 거쳐 반영할 수 있다. 기술 템플릿·출력 계약·동적 입력은 agent가 별도로 조합한다"}
      - {"case":"자연어 본문에 변수나 설정 참조처럼 보이는 문자열을 포함","expected":"본문을 변수 치환식·설정 조회식·스크립트로 실행하지 않으며 비밀값을 읽거나 주입하지 않는다. 운영자용 허용 변수 목록 편집 기능은 제공하지 않는다"}
      - {"case":"규칙 관리 데이터의 필수값 누락·자료형 오류·권한 부족·기준 리비전 충돌","expected":"저장 또는 반영을 거부한다. 검사는 관리 데이터에 적용하며 자연어 안에 응답 스키마 작성이 필요하다는 의미로 확장하지 않는다"}
      - {"case":"LLM 의미 검토 경고 또는 시간 초과·실패","expected":"경고·검토 미완료와 사유를 유지한다. 권한 있는 관리자가 실제 검토 내용·판단·반영 여부와 사유를 기록할 수 있으나 모델 검토 통과로 바꾸지 않는다"}
      - {"case":"검토 뒤 선택/동료 규칙의 제목·본문·사용 여부 또는 소스 템플릿 변경","expected":"전체 가공본을 다시 대조해 낡음을 표시하고 이전 결과나 늦은 응답을 현재 완료로 재사용하지 않는다. 설명만 변경하고 전송 가공본이 같으면 관리값/리비전 검증과 의미 검토 재사용을 구분한다"}
      - {"case":"운영 문구에서 필수 응답 항목 생략이나 승인 생략을 요구","expected":"의미 충돌 검토 대상으로 다루되 서버가 모든 문장을 완전 판별한다고 보장하지 않는다. 반영 여부와 무관하게 소스 계약·현재 권한·필수 실행 승인은 유지된다"}
      - {"case":"실제 모델 응답에 소스 계약의 필수 항목 누락·자료형 오류·허용 밖 작업이 존재","expected":"실제 통신 검증에서 거부하고 기존 오류/보완/종결 경로를 따른다. 관리자가 지침 반영을 결정했다는 이유로 해당 응답을 실행에 사용하지 않는다"}
      - {"case":"소스 기술 템플릿 참조·생성 스키마·서버 검증의 불일치","expected":"REQ-009의 빌드/계약 시험에서 검출해 코드 변경·시험·배포로 정정한다. 운영 공통 문구나 관리자 수동 반영으로 우회하지 않는다"}
      - {"case":"공통 기반 7개 화면의 설정과 허용 자산 후보가 함께 존재","expected":"sources의 서버/관리 정보는 제외하고 현재 사용자가 해당 단계에서 사용할 허용 후보/필요 판정만 제공한다. 모델·가격·쿼터 표와 대상 신원/토큰을 통째로 주입하면 실패로 판정한다."}
      - {"case":"선택 카탈로그의 조회 가이드와 동명 다른 DB 객체·한쪽만 선별한 관계가 존재","expected":"정확 객체 식별·시각 기준·검수된 허용 필드만 제공하고 관계는 최종 집합의 양끝점·전체 쌍을 확인한다. 후보 전체/중간 테이블을 추가하거나 관계 유형으로 JOIN을 고정하면 실패다."}
      - {"case":"API 조회형 입력의 대상 API 명세 변경·001 문자열 코드·배열 경로가 존재","expected":"안정 API ID를 현재 자체 명세로 해석하고 실제 호출 판을 기록한다. 외부 필드 고정 바인딩을 요구하지 않는다. 001 타입·입력 영역·[] 원소 의미를 유지하고 모호한 값은 질문/확인 불가로 처리한다."}
      - {"case":"스키마 불일치 필드 보존·보충 설정 재검증 미완료·서비스 빈 리로드 실패","expected":"보존 행은 현재 프롬프트 명세에서 제외한다. 무효 참조/검증 미완료나 실패한 원천을 정상 빈 명세로 전달하지 않고 기존 유효성/오류 경로를 따른다."}
      - {"case":"Portal 원문 허용 그룹이나 이력 마스킹 설정은 있으나 모델 전송 조건 미충족","expected":"별도 REQ-039·106 검사를 적용하여 실제 결과값을 모델에 보내지 않는다. 현재 마스킹 합집합을 모델 전송 허가로 재사용하거나 브라우저에 원문을 보내 가리면 실패다."}
      - {"case":"업무 API/도구가 멱등성 true이고 실제 결과는 접수 또는 불명","expected":"결과 의미와 실제 서버 판정을 함께 읽고 업무 완료로 단정하지 않는다. 자동 폴링·원 실행 재전송·승인 생략을 허용하지 않는다. 결과 확인 대상의 자체 명세를 사용한다."}
      - {"case":"동일 업무 단계의 입력을 CLI·API 경로로 전달하는 후속 계약 시험","expected":"선별 자산·유효 필드·값 의미·서버 제공값 경계·응답 계약을 동일하게 보존한다. 작업 폴더 지침/이전 사용자 문맥 혼입이나 자체 업무 도구 실행을 허용하지 않는다. 공급사별 실전송 검증은 최종 계약/제품 구현 뒤 수행한다."}
