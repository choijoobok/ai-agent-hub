      goal: "허용된 안내·응답 규칙을 운영 데이터로 관리하고 실제 사용 리비전을 확인한다"
      not: ["사용자가 임의 명령으로 시스템 권한을 우회하게 하는 프롬프트 편집기가 아니다","업무 지식·사용 안내 지식이나 system 다국어 메시지 정본을 대체하지 않는다"]
