        case: "주문 접수 API의 성공을 '접수'로 등록하고 요청 ID로 결과 확인 API를 연결해 완료 여부를 별도 확인한다"
      - kind: "정상"
        case: "출고 지시 지식에 주문 조회 API와 출고 지시 API를 연결한다. 주문번호는 사용자에게 얻고 창고코드는 현재 주문 조회 결과에서 채우며 처리유형은 등록된 고정값 NORMAL, 출고예정일은 사용자 날짜를 지정 형식으로 바꾸고 요청자 ID는 서버 신원 매핑으로 제공한다. 출고 지시 전에 완성된 값을 제시해 승인받는다"
      - kind: "정상"
        case: "같은 출고 API를 여러 업무 지식에서 참조해 각 매핑 설명에 용도·사용 조건·질문·조회 순서를 다르게 작성하되 공통 파라미터 명세를 복사하지 않는다. API 연결 제거는 지식 후보 승인 뒤 적용하며 다른 지식의 연결이나 API 자산 자체를 삭제하지 않는다"
      - kind: "예외"
        case: "창고 조회 결과가 여러 건인데 선택 기준이 없으면 사용자에게 창고를 확인한다. 모델이 첫 결과를 임의 선택하거나 등록 고정값·요청자 ID를 바꾸어 호출하지 못한다"
      - kind: "예외"
        case: "지식 접근 그룹에는 속해도 연결 출고 API의 허용 그룹이 아니면 그 API를 호출하지 못한다. 출고 지식 연결만으로 호출 권한을 얻지 않는다"
      - kind: "예외"
        case: "사용자가 출고예정일 A로 승인한 뒤 B로 바꾸면 변경된 파라미터를 다시 제시해 승인받고 실행한다"
      - kind: "예외"
        case: "응답에 미등록 주민번호 경로가 추가되면 화면·LLM에 원문을 전달하지 않고 경고한다"
    volatility:
      level: "high"
      what: "고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"
    approval_target: "API 연결 선택·계약 버전이 같아도 실제 목적지/실행 주체의 의미 변경은 REQ-105.approval_target_binding을 적용한다. 시스템 기본 연결 해석과 호출 시 적용 근거를 승인 대상에 연결하며 비밀값은 일반 승인 자료에 복제하지 않는다"
    open:
      - "@defer P3 2026-10-13 사용자 요청으로 REQ-011.export_policy가 요구한 조회 API 반출 허용 속성의 관리 단위·응답 경로 상속·기본값·변경 권한/이력·파생 결과 추적을 기존 계약/정책 경계와 연결한다. 결과 필드 타입·코드명/가공 의미도 REQ-011의 표시 계약과 대조한다"
      - "@defer P3 field_metadata의 실제 속성명·자료형/의미 유형 코드·경로/형식 표현·코드 참조와 개인정보 속성 저장·검증 계약·입력/응답 편집 화면을 구체화한다. 관리 범위와 누락 시 통제를 상세 설계 재량으로 축소하지 않는다"
      - "@defer P3 code_name_resolution의 방법 선택·경로/참조·조건 매핑·코드/명칭 대응·조회 범위/시간 상한·실패 상태/메시지·이력 계약과 편집 화면을 구체화한다. 일괄 조회·캐시 적용 여부/유효성은 상세 설계에서 판단하되 현재 권한·회사/그룹 조건과 원 업무 상태 보존을 지킨다"
      - "@defer P2 기본/특정 연결 선택과 승인 대상 비교는 ARCH-028.api_connection_resolution을 따른다. 배포 연결의 적용 시점·노드 간 효력과 검수 근거 전달은 같은 항목의 deployment_contract.pending에서 확정한다"
      - "@defer P3 지식의 안정된 API 식별자 연결·내용 버전 선택·변경 영향·제출/승인/반영의 참조 검증은 ARCH-028.asset_versions를 물리 리비전·이력·조건부 반영 계약과 시험으로 구체화한다. 지식 매핑 승인과 API 자체의 공동 오픈 갱신 절차는 구분한다"
      - "@defer P3 대상 시스템 선택 후 연결 후보를 제공하는 흐름을 화면 요건서·목업으로 구체화한다. 그리드의 연동 콤보박스 등 실제 입력 위치·컴포넌트는 화면 설계에서 확정한다"
      - "@defer P3 기본 주소·상대 경로 결합, 보호 헤더 이름/우선순위, 신뢰된 동적 신원 주입 및 목적지 변경 우회 차단 시험을 구체화한다"
      - "@defer P3 입력 필드·값의 출처·조회 결과 추출·형식 변환·고정값/기본값의 표현과 검증 계약, 누락/복수 후보 확인 흐름, API 가이드와 지식 API 매핑의 화면 요건서·목업을 구체화한다. 사용자·모델의 고정값/신원 덮어쓰기와 승인 후 값 변경 차단 시험을 포함한다"
      - "@defer P3 결과 안내 가이드·후속 대상 참조의 입력 화면과 계약/매핑 설명 대조, 버전 선택·결과 문맥 구성·검증 사례를 화면 요건서·목업 및 계약 시험에 연결한다"
    maturity:
      level: "confirmed"
      at: "2026-10-27"
      by: "AI — 사용자 권장안 반영 요청 적용"
      confirmed_by: "사용자 (2026-10-26 이번 보완으로 재확정 대기로 바뀐 REQ-608 전체 보완본 재확정 요청) 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 API 연결 해석과 실행 승인 결합 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."
  - id: REQ-609
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
    source: "2026-10-31 사용자 명시 변경: 사용자 그룹 추가만 기존 승인 정책을 유지하고 신원 매핑은 승인 없이 직접 설정한다. 데이터소스와 대상 시스템 탭을 나누고 기준정보 후보에서 필요한 대상만 설정한다(ADR-036). 이전 2026-10-01 ADR-018·10-08 ADR-023의 신원 승인 범위를 대체하며 그룹·회수 규칙은 유지한다. · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-13-01"
    title: "Portal 이용자의 대상별 신원 매핑과 사용자 그룹 부여"
    detail: "관리자는 Portal 사용자의 대상별 신원 아이디 신규/교체/중지와 사용자 그룹 소속 추가/재부여/중지를 승인 없이 직접 설정·저장한다. 계정·그룹·신원 각각의 현재 권한과 업무 유효성·기대 버전·전체 변경 이력을 검증한다."
    roadmap: "RM-P1"
    acceptance: "기준정보의 현재 열람 허용 데이터소스/대상 시스템 후보를 조회해 필요한 아이디만 저장한다. 사용자 그룹 소속 추가·재부여·중지도 권한자가 직접 저장하며 물리 삭제 없이 감사 이력을 유지한다. 어느 작업도 별도 관리자 요청/승인/전결을 만들지 않는다. 마지막 활성 그룹 회수는 이용자 비활성화와 원자 처리한다."
    summary: "대상별 사용자 아이디와 사용자 그룹 소속은 권한자가 직접 설정하고 전후 감사 이력을 남긴다."
    intent:
      problem: "계정·Hub 소속·레거시 사용자 식별을 혼동하면 퇴직·이동 후 권한이 남거나 다른 사람의 신원으로 실행한다"
      goal: "Portal 이용자를 대상별 실제 사용자 신원과 연결한다"
      not:
        - "Portal 사용자 프로필·조직·이용 상태를 이중 관리하는 원장이 아니다"
        - "사용자 레거시 비밀번호나 사용자별 실제 행 접근 목록을 복제하지 않는다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - item: "기본 신원 규칙: 대상 시스템 또는 데이터소스·Hub 식별자 그대로 사용/변환 패턴"
        origin: "고객사 신원 계약·관리자 입력"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "사용자별 예외: Portal 사용자·대상·예외 레거시 사용자 식별자·매핑 근거"
        origin: "관리자 입력·대량 등록/동기화"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "관리 이력: 등록/소속/활성/매핑 변경 전후·사유·원천·처리자·시각"
        origin: "관리자·인사 동기화"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "이용자 참조: Portal 이용자 ID·이름·현재 이용 상태의 읽기 전용 참조"
        origin: "REQ-616"
        sensitivity: "개인 식별·권한 정보 — 열람 통제 필요"
        retention: "기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"
      - item: "사용자 그룹 소속 전체·활성 상태·변경 전후·사유·기준/결과 버전"
        origin: "현재 변경 권한자의 직접 설정"
        sensitivity: "접근 권한 정보"
        retention: "중지/회수 후에도 불변 변경 이력을 보존한다."
    field_usage:
      - attribute_group: "기본 신원 규칙"
        used_for: "대상별 기본 사용자 ID 산출"
      - attribute_group: "사용자별 예외"
        used_for: "기본 규칙으로 표현되지 않는 신원을 전달"
      - attribute_group: "관리 이력"
        used_for: "오인 매핑·조직 변경 후 재부여 여부를 추적"
      - attribute_group: "이용자 참조"
        used_for: "매핑 대상 식별과 비활성 사용자 구분"
    consumers:
      - where: "agent API 실행·SQL 행 스코프"
        when: "실행 전"
        how: "API 신원 파라미터와 권한 테이블 사용자 바인딩에 같은 매핑 결과를 사용한다"
      - where: "admin 권한 운영"
        when: "퇴직·조직 이동 후"
        how: "REQ-103의 비활성화·그룹 재확인·재부여를 처리한다"
    business_rules:
      - "이용자 등록·활성 상태·소속 그룹·쿼터 기록은 REQ-616·REQ-103·REQ-116을 참조하며 신원 매핑에 복제하지 않는다"
      - "데이터소스는 Hub 내부 데이터소스 식별자로 매핑하고 DB스키마를 사용자 신원/권한 매핑의 추가 차원으로 두지 않는다. 다중 DB스키마·객체·DB 접속 계정 경계는 REQ-603을 따른다"
      - "서비스 인증 계정과 업무 실행 사용자의 식별자는 별개다. SSO 로그인만으로 대상 신원 매핑이 충족된 것으로 보지 않으며 개인 레거시 비밀번호를 저장하지 않는다"
      - "필수 신원 매핑이 없거나 중지되면 신원 설정 오류로 거부한다. NULL 바인딩이나 권한 없는 정상 0건으로 처리하지 않는다. 유효 신원에 허용 행이 없는 경우는 정상 0건이다"
      - "사용자별 명시 설정은 해당 대상의 기본 신원 규칙보다 우선한다. 기본 규칙 산출값도 유효한 사용자별 직접 설정을 대신하지 않으며 대량 등록/동기화는 같은 직접 저장 검증과 감사를 따른다"
      - "신원 매핑 신규·아이디 교체·중지·재설정은 identity_management의 직접 관리이며 별도 요청/승인/전결과 승인 절차 설정을 적용하지 않는다. 저장 성공부터 새 현재 매핑을 사용하고 실패 시 기존 유효 매핑을 유지한다"
      - "사용자 그룹 소속 추가/재부여/중지는 현재 해당 사용자·그룹의 변경 권한으로 직접 저장한다. 저장 전후 전체 소속/활성 상태·사유·행위자·시각·버전을 보존하며 별도 승인/전결 기록을 만들지 않는다."
      - "그룹 소속은 물리 삭제하지 않고 중지/회수한다. 마지막 활성 그룹 중지는 이용자 비활성화와 함께 처리하고 재활성화는 유효 그룹/등급 등 현재 조건을 검사한다."
      - "현재 신원/소속만 접근 판정에 사용한다. 미설정·중지 신원이나 중지/회수 소속, 과거 미반영 요청을 유효 권한에 포함하지 않는다."
      - "신원·그룹 변경은 REQ-108의 매 접근 시점 현재 판정에 반영한다. 사용자/LLM이 서버 신원 바인딩을 덮을 수 없다. 과거 요청/승인 이력은 보존하고 늦은 승인으로 현재 설정을 변경하지 않는다."
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "재고 행 스코프에 필요한 사용자 매핑이 없으면 '조회 결과 없음'이 아니라 신원 설정 오류로 거부한다"
    membership_record:
