    relevance_guide:
      content: "전사 업무의 목적·범위·관련성 판단 관점·관련/비업무/모호 사례·짧은 판단 근거 작성 지침을 관리한다. 모든 직접 자료 가공 업무를 사전 열거/등록해야만 처리하는 방식은 아니다"
      behavior: "지식이 필요 없는 요청의 낮은 연관성은 REQ-101의 비업무 추정 감사 표식으로 이어지고 자동 거부로 사용하지 않는다. 지식 기반 조회·실행과 권한·승인·데이터 전송 동의는 서버 규칙을 따른다"
      contract: "가이드는 판단 내용만 관리한다. 요청/처리 유형·판정 상태·필드·코드와 버전은 REQ-009·107의 소스 계약이며 운영 프롬프트에서 임의 유형을 추가하거나 감사 이력을 지우지 못한다"
      validation: "변경 전 agent 경유 검토에서 관련·비업무·모호 요청과 주입 공격 사례를 대조하고 실제 적용 리비전·모델과 근거를 감사에 연결한다. 검토 실패/불명은 통과로 간주하지 않는다"
    field_usage:
      - {"attribute_group":"규칙 정의","used_for":"서버가 판정한 결과에 어떤 안내 규칙을 적용할지 결정"}
      - {"attribute_group":"문구","used_for":"존재 은닉·대안 안내·검색 무결과·열거 거절 안내 구성"}
      - {"attribute_group":"적용 이력","used_for":"운영 반영과 REQ-107/109의 당시 프롬프트 추적"}
    consumers:
      - {"where":"agent 응답 작성","when":"서버 권한·검색 결과 판정 후","how":"REQ-108에 따라 처음 필요한 시점에 판정한 규칙 리비전을 사용한다. 호출별 적용 범위와 동적 조합은 prompt_contract를 따른다"}
      - {"where":"portal 표시·감사","when":"사용자 안내·과거 턴 확인 시","how":"portal은 agent 문구를 원문 표시하고 당시 사용 근거를 조회한다"}
    business_rules:
      - "전사 공통 규칙의 업무 범위와 안내는 REQ-101·REQ-112·REQ-308을 따르며 SQL 원문·물리명 비노출 지침의 내용·초기 적용 범위·한계는 REQ-104.initial_control을 참조한다. 권한·검색 상한·일괄 열거 차단은 서버가 강제한다"
      - "공통 지침 본문은 자연어 일반 텍스트로 취급하며 변수 치환식·스크립트·설정 조회식으로 실행하지 않는다. 운영자에게 허용 변수 목록·기술 템플릿·응답 스키마의 편집 기능을 제공하지 않는다. 호출별 동적 입력의 출처·허용 범위는 소스 계약과 기존 접근·전송 통제로 관리하며 비밀 설정값을 주입하지 않는다"
      - "정책 대상의 최초 필요 시 판정·고정은 REQ-108을 따른다. 전체 완성 프롬프트를 턴 시작에 고정한다는 뜻이 아니며 호출별 구성은 prompt_contract를 따른다"
      - "admin의 대화·추론 LLM 직접 호출 금지는 ARCH-013을 따른다. 의미 검토는 agent를 경유하며 실행·비용·검토 근거는 prompt_contract를 따른다"
      - "업무 지식 및 사용 안내 지식의 내용·매핑 변경은 기존 지식 세트 절차다. 프롬프트 규칙을 사용 안내 지식의 우회 편집 경로로 쓰지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "본문의 변수처럼 보이는 문자열을 근거로 서버 설정이나 비밀값을 조회·치환하지 않는다. 자연어 의미 경고·검토 실패의 처리는 prompt_contract.validation을 따르고 실제 입출력 계약 위반은 prompt_contract.runtime_validation을 따른다"
    lifecycle: "활성/비활성과 리비전 이력을 관리한다. 최초 필요 시 판정·고정과 오래 대기한 뒤 재판정·재시도 예외는 REQ-108을 따른다"
    permissions:
      - "ACT-003·ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: ["REQ-009", "REQ-101", "REQ-104"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-013"]
      screens: ["SCR-013"]
    examples:
      - {"kind":"정상","case":"지식 검색 무결과 안내를 검토·반영하면 이후 적용 대상 응답에서 새 안내가 사용되며 기존 시도에서 이미 고정한 내용 리비전은 유지된다"}
      - {"kind":"정상","case":"분류 스텝에는 허용된 의도·단계 정보, SQL 생성에는 선별 카탈로그·지식, 최종 응답에는 전송 가능한 결과를 넣어 서로 다른 입력을 구성한다"}
      - {"kind":"예외","case":"의미 검토 호출이 실패하면 검토 미완료로 표시하고 권한 있는 관리자가 실제 검토 내용·판단·사유를 남겨 반영 여부를 정한다. 이후 실제 모델 응답에서 소스 계약의 필수 항목이 빠지면 그 응답은 검증을 통과하지 못하며 관리자 반영 판단으로 우회하지 않는다"}
      - {"kind":"정상","case":"운영자는 '결과를 먼저 설명하고 근거는 간결하게 제시한다'는 문장을 작성한다. 사용자 질의·선별 지식·허용 결과는 agent가 별도로 조합하며 본문에 동적 변수나 응답 스키마를 작성할 필요가 없다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    prompt_contract:
      decision: "2026-10-01 사용자 확정 · ADR-020"
      validation: "전사 공통 자연어 지침 운영 반영 전 admin→agent→LLM 의미 검토를 실행한다. LLM은 함께 적용될 규칙·기술 지침과의 모순 의심 구절·이유·수정 권고를 제공하며 무모순을 보증하지 않는다. 의미 경고 또는 검토 실패는 권한 있는 관리자가 실제 검토 내용·판단·사유를 기록하고 최종 반영 여부를 결정한다. 실패는 검토 미완료이지 통과가 아니다. 자연어에 숨은 모든 계약 우회 지시나 의미 모순을 서버가 저장 전에 기계적으로 검출한다는 뜻이 아니며 관리 데이터 검증·소스 계약 검증과 구분한다"
      save_validation: "운영 화면의 저장 요청에는 현재 관리 권한, 규칙 식별자·우선순위·적용 조건·본문·활성 여부 등 관리 데이터의 필수값·자료형·유효성, 기준 리비전과 변경 이력 저장을 검사한다. 누락·잘못된 관리 값·권한 또는 리비전 충돌은 반영하지 않는다. 여기서 필수값·자료형은 규칙 관리 데이터의 규격이며 운영자가 자연어 본문 안에 LLM 응답 필드·자료형·변수 선언을 작성하거나 서버가 그 문장의 의미를 완전히 판정한다는 뜻이 아니다"
      runtime_validation: "portal·agent·LLM의 데이터 규격, 기술 템플릿의 참조와 서버 내부 입력 구성 규칙은 REQ-009.response_contract의 소스·빌드/계약 시험에서 검증한다. 실제 송수신에는 같은 계약의 필수 항목·자료형·허용 응답/작업과 현재 권한·승인·전송 통제를 검사한다. 계약을 위반한 요청·응답은 기존 오류·보완·종결 경로로 처리하고 검증되지 않은 응답으로 실행을 진행하지 않는다. 이 검사는 자연어 지침 저장 시 문장만 읽고 통신 계약 준수를 보증하는 검사와 다르며, 지침의 반영 승인이나 검토 실패에 대한 관리자 판단으로 생략할 수 없다"
      review_execution: "변경안과 함께 적용될 규칙을 비교하며 업무 도구 실행은 허용하지 않는다. 검토 대상·비교 규칙 리비전·모델·effort·결과·토큰 사용·관리자 판단과 사유를 기록한다. 검토 뒤 문구가 바뀌면 새 변경안을 다시 검토한다. 관리자 사용량과 쿼터 제외는 REQ-116, 시스템 운영용 모델·effort 설정은 REQ-602를 따른다"
      scope: "운영 편집은 전사 공통 자연어 지침·안내·응답 규칙 본문과 식별자·우선순위·적용 조건·활성 여부 등 관리 속성이다. 운영 문구에 변수 치환 기능을 두지 않는다. 유형별 기술 템플릿·서버 내부 입력 구성 규칙과 portal·agent·LLM 사이 데이터 포맷·스키마·필수 필드·제어 값은 소스에서 정의·검증하고 코드 변경·시험·배포로 관리한다. 고객사 업무 API·도구 명세는 기존 정본을 참조하며 이 분리로 모든 업무 인자를 소스에 고정하지 않는다. 운영 프롬프트로 통신 계약이나 서버 권한 통제를 바꿀 수 없다"
      composition: "agent 서버가 스텝 유형을 정하고 그 유형에 필요한 자연어 공통 지침 리비전 + 소스의 유형별 기술 템플릿·출력 계약 + 해당 호출의 허용된 동적 입력을 별도로 조합한다. 사용자 질의·지식·조회 결과 등을 운영 문구의 변수 치환으로 끼워 넣지 않으며, 템플릿 참조·입력 출처·허용 변수의 기술 정의는 소스 계약으로 관리한다. 모든 스텝에 동일한 전체 프롬프트를 반복 주입하지 않는다. 동일 규칙이 여러 유형에 적용되면 각 호출에 포함한다"
      persistence: "REQ-108에 따라 처음 필요한 시점에 고정한 내용 리비전과 호출별 동적 입력은 구분한다. 고정한 규칙은 영속 스냅샷 또는 불변 버전 참조로 재현하며 메모리 캐시 적중에 의존하지 않는다. 호출별 스텝 유형·템플릿/통신 계약 버전·규칙 리비전 조합 근거를 추적한다. 저장 원문에는 기존 마스킹·보존·삭제 규칙을 적용하고 접근 권한은 매 사용 시점에 재판정한다"
      call_examples:
        - { call: "처리 중 입력 분류", input: "REQ-035의 유효 의도·현재 단계·액션 전송 여부·직전 해석·미처리 입력", note: "지식·카탈로그·조회 결과를 넣지 않는 기존 범위를 유지한다" }
        - { call: "SQL 생성·재작성", input: "해당 유형 템플릿·선별 카탈로그·지식·예제·정제된 실패 피드백", note: "해당 유형에 필요한 규칙과 소스의 출력 계약을 조합한다" }
        - { call: "최종 응답 작성", input: "응답 규칙·현재 질의·전송 가능한 결과·서버 판정", note: "기존 전송·마스킹 통제를 따른다" }
    validation_cases:
      - { case: "운영자가 일반 자연어 문장으로 공통 지침을 작성", expected: "응답 필드·자료형·변수를 선언하지 않아도 관리 데이터 검증과 의미 검토를 거쳐 반영할 수 있다. 기술 템플릿·출력 계약·동적 입력은 agent가 별도로 조합한다" }
      - { case: "자연어 본문에 변수나 설정 참조처럼 보이는 문자열을 포함", expected: "본문을 변수 치환식·설정 조회식·스크립트로 실행하지 않으며 비밀값을 읽거나 주입하지 않는다. 운영자용 허용 변수 목록 편집 기능은 제공하지 않는다" }
      - { case: "규칙 관리 데이터의 필수값 누락·자료형 오류·권한 부족·기준 리비전 충돌", expected: "저장 또는 반영을 거부한다. 검사는 관리 데이터에 적용하며 자연어 안에 응답 스키마 작성이 필요하다는 의미로 확장하지 않는다" }
      - { case: "LLM 의미 검토 경고 또는 시간 초과·실패", expected: "경고·검토 미완료와 사유를 유지한다. 권한 있는 관리자가 실제 검토 내용·판단·반영 여부와 사유를 기록할 수 있으나 모델 검토 통과로 바꾸지 않는다" }
