    relevance_guide:
      content: "전사 업무의 목적·범위·관련성 판단 관점·관련/비업무/모호 사례·짧은 판단 근거 작성 지침을 관리한다. 모든 직접 자료 가공 업무를 사전 열거/등록해야만 처리하는 방식은 아니다"
      behavior: "지식이 필요 없는 요청의 낮은 연관성은 REQ-101의 비업무 추정 감사 표식으로 이어지고 자동 거부로 사용하지 않는다. 지식 기반 조회·실행과 권한·승인·데이터 전송 동의는 서버 규칙을 따른다"
      contract: "가이드는 판단 내용만 관리한다. 요청/처리 유형·판정 상태·필드·코드와 버전은 REQ-009·107의 소스 계약이며 운영 프롬프트에서 임의 유형을 추가하거나 감사 이력을 지우지 못한다"
      validation: "변경 전 agent 경유 검토에서 관련·비업무·모호 요청과 주입 공격 사례를 대조하고 실제 적용 리비전·모델과 근거를 감사에 연결한다. 검토 실패/불명은 통과로 간주하지 않는다"
    field_usage:
      - {"attribute_group":"규칙 정의","used_for":"서버가 판정한 결과에 어떤 안내 규칙을 적용할지 결정"}
      - {"attribute_group":"문구","used_for":"존재 은닉·대안 안내·검색 무결과·열거 거절 안내 구성"}
      - {"attribute_group":"적용 이력","used_for":"운영 반영과 REQ-107/109의 당시 프롬프트 추적"}
    consumers:
      - {"where":"agent 응답 작성","when":"서버 권한·검색 결과 판정 후","how":"REQ-108에 따라 처음 필요한 시점에 판정한 규칙 리비전을 사용한다. 호출별 적용 범위와 동적 조합은 prompt_contract를 따른다"}
      - {"where":"portal 표시·감사","when":"사용자 안내·과거 턴 확인 시","how":"portal은 agent 문구를 원문 표시하고 당시 사용 근거를 조회한다"}
    business_rules:
      - "전사 공통 규칙의 업무 범위와 안내는 REQ-101·REQ-112·REQ-308을 따르며 SQL 원문·물리명 비노출 지침의 내용·초기 적용 범위·한계는 REQ-104.initial_control을 참조한다. 권한·검색 상한·일괄 열거 차단은 서버가 강제한다"
      - "공통 지침 본문은 Markdown 원문의 자연어 텍스트로 취급하며 변수 치환식·스크립트·설정 조회식으로 실행하지 않는다. 운영자에게 허용 변수 목록·기술 템플릿·응답 스키마의 편집 기능을 제공하지 않는다. 호출별 동적 입력의 출처·허용 범위는 소스 계약과 기존 접근·전송 통제로 관리하며 비밀 설정값을 주입하지 않는다"
      - "정책 대상의 최초 필요 시 판정·고정은 REQ-108을 따른다. 전체 완성 프롬프트를 턴 시작에 고정한다는 뜻이 아니며 호출별 구성은 prompt_contract를 따른다"
      - "admin의 대화·추론 LLM 직접 호출 금지는 ARCH-013을 따른다. 의미 검토는 agent를 경유하며 실행·비용·검토 근거는 prompt_contract를 따른다"
      - "업무 지식 및 사용 안내 지식의 내용·매핑 변경은 기존 지식 세트 절차다. 프롬프트 규칙을 사용 안내 지식의 우회 편집 경로로 쓰지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "본문의 변수처럼 보이는 문자열을 근거로 서버 설정이나 비밀값을 조회·치환하지 않는다. 자연어 의미 경고·검토 실패의 처리는 prompt_contract.validation을 따르고 실제 입출력 계약 위반은 prompt_contract.runtime_validation을 따른다"
    lifecycle: "활성/비활성과 리비전 이력을 관리한다. 최초 필요 시 판정·고정과 오래 대기한 뒤 재판정·재시도 예외는 REQ-108을 따른다"
    permissions:
      - "ACT-003·ACT-004의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력은 관련 요구사항을 따른다. 신규 관리 속성의 변경 근거는 REQ-601 공통안으로 확인하며 이력 없이 기존 근거를 덮어쓰지 않는다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
    relations:
      depends_on: ["REQ-601"]
      constrains: ["REQ-009", "REQ-101", "REQ-104"]
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features: ["FEAT-013"]
      screens: ["SCR-013"]
    examples:
      - {"kind":"정상","case":"지식 검색 무결과 안내를 검토·반영하면 이후 적용 대상 응답에서 새 안내가 사용되며 기존 시도에서 이미 고정한 내용 리비전은 유지된다"}
      - {"kind":"정상","case":"분류 스텝에는 허용된 의도·단계 정보, SQL 생성에는 선별 카탈로그·지식, 최종 응답에는 전송 가능한 결과를 넣어 서로 다른 입력을 구성한다"}
      - {"kind":"예외","case":"의미 검토 호출이 실패하면 검토 미완료로 표시하고 권한 있는 관리자가 실제 검토 내용·판단·사유를 남겨 반영 여부를 정한다. 이후 실제 모델 응답에서 소스 계약의 필수 항목이 빠지면 그 응답은 검증을 통과하지 못하며 관리자 반영 판단으로 우회하지 않는다"}
      - {"kind":"정상","case":"운영자는 '결과를 먼저 설명하고 근거는 간결하게 제시한다'는 문장을 작성한다. 사용자 질의·선별 지식·허용 결과는 agent가 별도로 조합하며 본문에 동적 변수나 응답 스키마를 작성할 필요가 없다"}
    volatility: {"level":"high","what":"고객사마다 기준 값·대상·규모가 다르므로 운영 데이터로 관리한다. 관리 원천과 승인·보안 경계는 고객사 값과 구분한다"}
    prompt_contract:
      admin_input_preparation:
        scope: "2026-11-05 사용자 승인. 검토한 공통 기반 7개·연동 관리 6개 화면의 프롬프트 입력 후보 분류·해석 가이드·호출 단계별 제공 조건을 정리한다. 이 정의는 업무상 포함/제외 기준이며 최종 JSON 키·통신 스키마·CLI/API 변환 규격이나 새 화면 편집 항목이 아니다."
        ownership: "분류와 공통 해석 기준은 이 절이 소유한다. 화면의 표시·편집 항목은 각 requirements.md §4, 실제 값·업무 규칙은 sources에 연결한 요구사항을 따른다. 이 절에는 운영 가이드 본문·업무 명세 사본을 저장하지 않는다. admin은 원천 관리, agent는 호출별 허용 정보 선별·조합, integration은 공통 계약/CLI·공급사 API 변환을 맡는다(REQ-009)."
        classification:
          llm: "이번 판단에 필요한 업무 명세·자연어 설명 또는 서버가 산출한 허용 결과만 제공한다. 후보 선택에는 필요한 식별·요약, 선택 후 입력 구성에는 해당 상세 명세를 사용한다. 원천 목록 전체를 자동 주입하지 않는다."
          server: "연결·인증·신원·모델 라우팅·권한·쿼터·필수 승인·검증·마스킹·전송 통제는 서버가 집행한다. 모델에 안내할 필요가 있는 현재 판정·허용 작업/부족 조건만 최소한으로 투영하며 원 설정·사용자/그룹 전체 목록을 보내지 않는다."
          audit: "작성자·변경자·시각·변경 사유·복원 근거·관리 이력·검수 근거·원천 진단은 관리/감사용이다. 프롬프트 본문에 통째로 포함하지 않는다. 실제 사용한 자산 식별자·내용 리비전·호출/결과 연결은 REQ-108·107에 따라 실행 근거로 보존한다."
          default: "새 컬럼이나 미분류 항목은 자동 포함하지 않는다. 원천·의미·사용 목적·전송 조건을 확인해 이 분류를 보완한다. 본 절의 LLM 후보도 현재 전송 통제를 통과해야 하며 포함 목록 자체가 전송 허가가 아니다."
        conditions:
          - "REQ-601의 유효 적용본·수동 사용·현재 참조/접근 권한과 원천별 필수 검수를 확인한 범위만 후보로 제공한다. 미저장 편집값·미완성/미검수 범위·수동 OFF·사용 가능 미확인을 정상 명세로 주입하지 않는다. 관리 화면 조회 권한과 Portal 사용자의 업무 사용 권한을 혼용하지 않는다."
          - "대상 시스템/선택 연결·데이터소스의 서버 설정 불일치 또는 판정 근거의 현재 유효성을 확인할 수 없으면 해당 연결의 신규/후속 호출 후보에서 제외하고 실행을 막는다. 이미 전송한 작업의 결과 불명·기존 결과 안내는 별도로 유지하며 이를 미수행·자동 재전송으로 바꾸지 않는다. 비밀 원문을 비교/진단/프롬프트에 복사하지 않는다."
          - "API/도구의 현재 스키마에 없는 보존 불일치 필드는 입력·응답 명세와 의미/결과 매핑 후보에서 제외한다. 일치 미확인, 미지원 구조, 유효 참조의 불일치 필드 지시 또는 타입 변경 후 보충 설정 검증 미완료를 정상 빈 명세로 대체하지 않는다(REQ-608.schema_sync)."
          - "내용 리비전은 REQ-108 및 각 자산의 호출 시점 해석 규칙에 따라 고정·추적하고 권한·사용/연결 상태는 실제 사용 직전에 다시 검사한다. 매핑에 외부 판을 저장하는 것과 실제 사용 판을 실행 근거로 기록하는 것을 구별한다. 과거 프롬프트나 모델의 허용 주장은 현재 사용 권한을 증명하지 않는다."
          - "모델 전송은 REQ-039·106의 현재 요청/동의·대상·전송량/보안 조건을 별도로 검사한다. Portal 원문/마스킹 허용 및 이력 마스킹 설정은 모델 전송 동의가 아니다. 금지한 결과값은 보내지 않고 필요한 경우 REQ-009의 서버 참조 처리로 연결한다."
          - "암호·API 키·인증 헤더 실제 값·대상 사용자 식별값·일회용 신원 토큰·접속 계정/비밀값은 모델에 제공하거나 생성/변조하게 하지 않는다. 가이드·고정값·예시·오류 메시지도 전송 전 같은 경계를 적용한다. 보호값 주입은 서버가 수행한다."
          - "접근 불가 대상의 이름·존재·진단을 오류 안내로 유출하지 않는다. 필요한 실패/부족 조건만 현재 열람 범위 안에서 전달한다. 조회 실패/미확인을 정상 0건·빈 배열·false로 바꾸지 않는다."
        stages:
          - {"name":"질의 해석·업무 후보 선택","content":"기존 검색/선별 규칙으로 얻은 허용 카탈로그·API·도구 후보의 식별자·이름·업무 설명과 관련 대상 시스템 설명만 필요 시 제공한다. 검색 범위·지식 연결을 새로 확대하지 않는다. 전체 입력/응답 스키마·DB 연결/모델/쿼터 설정을 일괄 주입하지 않는다."}
          - {"name":"DB 조회 준비·SQL 작성","content":"최종 선별한 카탈로그의 허용 구조·업무 의미·값 해석, 해당 데이터소스의 조회 가이드/DBMS·시각 기준, 양끝점이 포함된 유효 관계의 전체 쌍을 제공한다. 조회 제약·행 스코프는 소유 정책의 서버 검증을 유지한다. 지식·인증 예제의 추가 조합은 관련 메뉴/흐름 합의 뒤 연결한다."}
          - {"name":"API·도구 입력 확보·호출 요청","content":"선택 자산의 현재 유효한 사용 가이드·입력 명세·필드값 의미 및 입력 확보에 필요한 응답 명세를 제공한다. API 조회형은 선택된 조회 API의 자체 현재 명세/가이드와 허용 문맥을 추가 해석한다. 모델의 작업 요청을 서버가 검증·수행하며 모델 자체 HTTP/DB/서비스 빈 호출을 허용하는 뜻이 아니다."}
          - {"name":"실행 결과 해석·사용자 응답","content":"원 요청/실제 결과 연결, 서버의 성공·접수·실패·미수행·불명 판정, 허용된 결과와 해당 응답/코드 의미·결과 설명·후속 가이드만 제공한다. 스키마 예시는 실행 결과가 아니며 확인되지 않은 완료를 생성하지 않는다. 모델 전송이 불필요하거나 금지되면 서버/Portal의 기존 안내 경로를 따른다."}
          - {"name":"처리 중 입력 분류·서버 전용 처리","content":"REQ-035의 입력 제외를 유지하고 지식·카탈로그·결과를 추가 주입하지 않는다. 연결 진단·권한/쿼터 판정·마스킹·월별 배분·인증 토큰 발급 자체를 위해 새 LLM 호출을 만들지 않는다."}
        guides:
          identity: "이름·설명은 해석 보조이며 작업 대상을 식별자로 대조한다. 카탈로그는 데이터소스와 DB/스키마/객체 전체 식별, API·도구는 안정 자산 ID를 보존한다. 같은 이름을 같은 대상으로 치환하지 않는다. 식별자/실제 사용 판의 최종 전송 표현은 후속 계약에서 정한다."
          structure: "필드 구분(경로/쿼리/헤더/바디/응답 또는 도구 입력/응답)을 함께 해석한다. 경로 변수의 키는 등록 순서이고 설명은 파라미터명이 아니다. 바디/응답의 items[].status는 배열 원소의 status, states[]는 각 단순 원소를 뜻하며 []는 실제 인덱스나 전송할 필드명 문자가 아니다. 배열 항목 자료형과 객체/배열 컨테이너를 구별한다. 실제 키/정적 경로 구조는 원 JSON 스키마가 정본이다."
          values: "필수와 NULL 허용, 값 누락과 빈 문자열·빈 배열·0·false를 구별한다. 문자열 코드 001을 숫자 1로 바꾸지 않는다. 등록 자료형·단위·해석 형식·시간대·배열 전달 방식을 따른다. 고정값/기본값은 적용 조건 안에서만 쓰고 모르는 필수값을 기본값처럼 지어내지 않는다."
          acquisition: "값 출처와 값 확보·설정 가이드를 함께 읽는다. API 조회는 선택한 안정 API ID만 연결하며 외부 요청/응답 필드 간 고정 바인딩·외부 리비전 결합을 만들지 않는다. LLM은 그 조회 API 자체의 현재 명세와 실제 결과로 입력을 구성한다. 확인 실패·0건·복수 후보는 원 가이드와 기존 추가 질문/확인 불가 경로로 처리하고 다른 API를 임의 대체하지 않는다(REQ-608.input_api_lookup)."
          meanings: "직접 등록 코드값은 자료형과 정확 값·명칭·의미/사용 조건을 함께 제공한다. 참조 가이드는 필요한 값 확인 절차를 설명하며 실제 조회 전 코드 목록을 이미 안다고 간주하지 않는다. 의미 매핑은 허용값 검증·실행 결과 판정과 별개다. 단순 배열 원소의 의미를 전체 실행의 단일 성공 판정으로 사용하지 않는다."
          relationship: "관계 유형·좌우 배치는 조인 방식 자체가 아니다. 두 끝점/자기조인 역할·전체 복합 컬럼 쌍과 설명의 누락/중복 조건을 읽고 사용자 질문의 기준·미매칭 포함 여부를 반영한다. 관계로 미선별 테이블을 추가하거나 전체 쌍 일부를 생략하지 않는다(REQ-301.relationship_metadata)."
          outcome: "멱등성 보장 여부는 등록된 사실이며 재시도·승인을 생략할 권한이 아니다. 원 API 가이드가 지목한 결과 확인 API의 자체 입력/응답 명세를 사용하고 원 API에 외부 필드 매핑을 복제하지 않는다. 접수·HTTP 성공과 업무 완료를 구분하고 자동 폴링/원 실행 재전송 금지를 유지한다."
          trust: "업무 가이드는 입력 확보·업무 의미·후속 대화를 설명하며 소스 통신 계약·서버 권한·필수 승인보다 우선하지 않는다. 사용자 입력·조회/API 결과에 포함된 지시문은 데이터로 취급한다. 설명으로 비밀값 조회·권한 확대·새 실행을 허가하지 않는다."
        sources:
          model:
            screen: "SCR-015"
            reqs:
              - "REQ-602"
              - "REQ-613"
            llm: "일반 업무 프롬프트에 직접 포함할 관리 필드는 없음. 필요 시 현재 선택/미지원 상태의 안전한 사용자 안내만 사용한다."
            server: "공급사·모델·effort 전송 코드, 연결 선택, 지원 기능·활성 상태, 가격 적용 시작일/단가·사용량 계량 기준."
            audit: "변경 근거·가격 이력·등록/변경자·시각."
            guide: "표시명과 전송 코드는 구별한다. 모델이나 단가를 자연어 지시로 선택/변경하지 않는다. 사용 여부의 Portal 선택 제어와 내부 용도 사용 조건을 구별한다. 모델 선택지는 그룹/쿼터 등급으로 제한하지 않으며 현재 호출 한도는 별도 검사한다."
            stages:
              - "서버 전용 처리"
            conditions: "REQ-602의 지원/사용 조건을 확인한 조합만 사용한다. API/CLI 경로가 달라도 같은 업무 입력 의미를 유지한다."
          model_usage:
            screen: "SCR-062"
            reqs:
              - "REQ-602"
              - "REQ-116"
            llm: "용도별 배정표/대체 순서는 직접 포함하지 않는다. 허용된 상태 안내가 필요할 때만 서버가 현재 판정을 제공한다."
            server: "용도·공급사·모델·effort·대체 순서·Portal 선택 허용과 보조 호출 전환/쿼터 조건."
            audit: "배정 변경 사유·실제 선택/대체 시도 근거."
            guide: "사용자 주 추론 선택과 보조/운영 호출 배정을 구별한다. LLM의 추천으로 미허용 모델로 전환하지 않는다. 이 화면의 설명은 프롬프트/코드로 사용하지 않는다. 실제 자연어 규칙 본문·사용 여부와 호출별 조합 경계는 REQ-610 소유다."
            stages:
              - "서버 전용 처리"
            conditions: "용도별 명시 배정과 허용 오류/현재 전송·예산 검증을 적용하며 미배정/미지원 상태를 임의 조합으로 채우지 않는다. 일시 공급 장애의 대체 범위만 적용하고 인증·안전 거부·동의 부족·예산 소진을 대체 경로로 우회하지 않는다."
          portal_user:
            screen: "SCR-005"
            reqs:
              - "REQ-609"
              - "REQ-616"
              - "REQ-606"
              - "REQ-116"
            llm: "등록 프로필/신원/그룹/쿼터 행을 직접 포함하지 않는다. 이번 업무에 필요한 허용 후보·사용 불가/추가 확인 안내만 서버가 투영한다."
            server: "본인·계정 상태·대상 시스템별 신원 매핑·그룹 소속·월별 등급/쿼터·배정 상태·일회용 신원 토큰 처리."
            audit: "계정/신원/소속 변경·월별 배정 근거·처리자/시각."
            guide: "Hub 사용자와 대상 시스템 사용자를 혼용하지 않는다. 사용자 프로필을 개인화 규칙 본문으로 취급하지 않는다. 모델이 신원/소속/등급을 선언해도 서버 사실이 바뀌지 않는다."
            stages:
              - "후보 선별 전 서버 판정"
              - "실행 전 서버 판정"
            conditions: "현재 본인/계정·그룹 및 대상별 신원을 검증한다. 개인화 규칙의 실제 프롬프트 조합은 해당 관리 원천과 업무 흐름 합의 뒤 연결한다."
          user_group:
            screen: "SCR-006"
            reqs:
              - "REQ-605"
              - "REQ-103"
            llm: "그룹 정의·사용자/자산 매핑 목록 자체는 포함하지 않는다. 서버가 현재 사용자에게 허용한 자산 후보/필드를 제공한다."
            server: "그룹 유효성·현재 소속/활성 자산 매핑과 접근/마스킹 판정."
            audit: "그룹 변경 이력·사용처/참조 보호 확인 근거."
            guide: "그룹 설명은 업무 실행 지시가 아니며 그룹 정의만으로 소속·자산 권한·쿼터가 생기지 않는다. 실제 허용 범위는 소유 매핑과 정책으로 판단한다."
            stages:
              - "후보 선별 전 서버 판정"
              - "실행/전송 전 서버 판정"
            conditions: "권한 확인 실패를 허용이나 정상 무결과로 바꾸지 않고 타 그룹의 자산 존재를 노출하지 않는다."
          token_rate:
            screen: "SCR-016"
            reqs:
              - "REQ-613"
            llm: "일반 업무 프롬프트에 직접 포함할 필드 없음."
            server: "기준년월·대상 모델/effort별 가격/수량 스냅샷·정규화 단위·기준 단가 계산."
            audit: "산정 입력·가격 판·계산/수정 근거·이력."
            guide: "기준 단가는 비용/쿼터 계산 입력이며 업무 질의의 금액·환율·조회 조건이 아니다. 계량값 부재를 0으로 추정하지 않는다."
            stages:
              - "서버 전용 처리"
            conditions: "단가 계산과 검증은 결정적 서버 처리로 수행한다. 업무 데이터 조회 요청과 운영 비용 설정 조회를 혼용하지 않는다."
          quota_grade:
            screen: "SCR-064"
            reqs:
              - "REQ-606"
              - "REQ-116"
            llm: "일반 업무 프롬프트에 직접 포함할 필드 없음."
            server: "적용 시작월·등급/가중치·유효 기준 세트·월별 배정 및 정정 가능 조건."
            audit: "기준 변경·적용 근거·과거 배정 이력."
            guide: "등급/가중치는 개인화 지시나 자산 접근 권한이 아니다. 확정 전후 등급 정정 규칙은 소유 요구사항을 따른다. 가중치는 상대 배분값이며 100% 합계나 모델 선택 제한으로 해석하지 않는다."
            stages:
              - "서버 전용 처리"
            conditions: "대상월의 유효 기준과 개인별 확정 배정 상태를 확인하며 모델 설명으로 확정 상태나 과거 한도를 변경하지 않는다."
          quota_plan:
            screen: "SCR-021"
            reqs:
              - "REQ-118"
              - "REQ-613"
              - "REQ-606"
            llm: "월별 계획·예산·배분표 자체는 포함하지 않는다. 필요한 경우 현재 호출 불가 등 서버 판정 안내만 사용한다."
            server: "기준년월·예산/환산·기준 단가·대상 사용자/등급·계산/배분·확정 상태 및 실제 호출 한도."
            audit: "계획 메모·확정/계산·월별 배정 근거·처리자/시각."
            guide: "예정 계산과 확정 배정은 다르다. 모델이 비용 부족을 이유로 자동 새 턴/한도 우회 또는 임의 배분을 수행하지 않는다."
            stages:
              - "서버 전용 처리"
            conditions: "현재 월·기준·예정 계산 유효성과 사용자별 배정 상태를 서버가 검사한다. 필요하지 않은 재무/다른 사용자 배분 정보는 제공하지 않는다."
          target_system:
            screen: "SCR-001"
            reqs:
              - "REQ-604"
              - "REQ-601"
            llm: "허용된 API 후보를 구분하는 데 필요한 시스템 식별자·시스템명·업무 설명."
            server: "선택 연결 식별자·Base URL·인증 방식/보호값 주입·현재 서버 설정 판정·접속 테스트."
            audit: "연결 진단·사용 API 역조회 전체·변경 사유/이력."
            guide: "시스템명/설명은 업무 대상을 구별하는 보조 정보다. 실제 호출 주소·연결은 등록 API와 서버가 결정한다. 모델이 설명/URL 문자열로 다른 시스템을 호출하지 않는다."
            stages:
              - "질의 해석·업무 후보 선택"
              - "API 입력 확보의 대상 구별"
            conditions: "허용된 선택 API에 필요한 시스템 설명만 제공한다. 사용 API 역조회 전체를 새로운 호출 후보로 확대하지 않는다."
          data_source:
            screen: "SCR-002"
            reqs:
              - "REQ-603"
              - "REQ-301"
            llm: "선택 카탈로그에 필요한 데이터소스 식별·별칭/설명, 유효한 DBMS/버전·DB/DW 유형·시각 체계·데이터 기준 시각 정보, 조회 가이드 제목/상세 설명."
            server: "배포 연결·접속값·현재 로드/SQL 지원·서버 설정/DBMS 대조 판정, 그룹 후보 범위와 실제 접근 검사."
            audit: "관측 노드/시각·적용 설정 진단·구조 비교 상세·변경 사유·전체 카탈로그 역조회. DW 동기화 방식 메모는 REQ-603.dw_sync_note의 관리 참고 전용이며 DB 전환 시 보존하되 참고 대상에서 제외한다."
            guide: "DBMS는 SQL 문법, 시간대·기준 시각은 조건/최신성 해석에 사용한다. DW 동기화 메모를 프롬프트/SQL·최신성 판정·agent 실행 지시로 사용하지 않는다. 조회 가이드는 실제 허용 원천에서 값을 확인하는 설명이며 그 자체가 코드값/조회 결과가 아니다."
            stages:
              - "DB 조회 준비·SQL 작성"
              - "입력값 확보용 DB 조회"
            conditions: "최종 선택 카탈로그의 데이터소스 가이드만 REQ-603.data_query_guides에 따라 구성한다. 연결/SQL 지원 확인 실패를 모델 추정으로 보완하지 않는다. 그룹 후보 범위를 DB 전체 접근권으로 해석하지 않는다."
          catalog:
            screen: "SCR-003"
            reqs:
              - "REQ-301"
              - "REQ-103"
              - "REQ-611"
            llm: "선택 카탈로그/컬럼 식별자, 전체 물리 식별·객체 유형·업무명/설명, 허용 컬럼의 원천 자료형/치수·NULL·검수된 키/인덱스·유일성/구성순서, 의미 유형·그룹 코드/값 설명·해석 형식·시간대·단위."
