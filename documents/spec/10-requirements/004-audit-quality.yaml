    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 저장 사본 마스킹 · 2026-09-29 오류 분류·당일·주간 현황 · 2026-09-30 사용자 결정(자동 원인 묶음 폐지, 오류·품질 조사 통합, 세 종류 근거 연결, 완료 후 사후 연결·재발 구분, 조사 진단에서 변경 요청 직접 연결, 연결 취소 사유 필수와 연결·취소 이력 조회) · 2026-09-30 사용자 재확정(현재 조사 연결 최대 한 건·취소 이력 보존)"
    process_step: "PRC-10-01"
    title: "오류 발생 기록과 오류·품질 조사 통합 관리"
    detail: "채팅을 처리하는 portal·agent의 요청·응답 계약, 컨텍스트, 모델·도구, SQL 검증·실행, 응답 구성 실패를 발생별로 기록한다. 담당자는 관련 근거를 분석해 오류·품질 조사를 생성하고 담당자를 배정한다. 조사에는 채팅 오류 발생 이력, 사용자 품질 신고(REQ-110), 개인 저장 조회의 개별 실행 실패(REQ-207)와 REQ-107의 추적 감사 검토 근거를 함께 연결할 수 있다. 추적 감사는 실제 처리 오류가 없어도 조사 사유를 남겨 같은 조사 절차를 이용한다. 원본은 각각 보존하고 동일 코드·메시지·턴이라는 이유로 같은 원인이라고 자동 병합하지 않는다"
    hard_rule: "채팅 오류 원본·증거는 system의 SYS_LO_EXCEPTION과 분리된 admin 자산이며 수정·삭제하지 않는다. 저장 조회 실패는 REQ-207의 개별 실행 이력을 참조하고 채팅 오류 발생을 중복 생성하지 않는다. 조사 연결은 원본 오류·신고의 병합이나 자동 종결을 뜻하지 않는다. 연결된 조사 상태는 조사 미연결·조사 중·조사 완료 여부를 보여 주는 근거이지 그 발생의 해결 보증이 아니다. 조사 완료와 사용자 신고 종결은 별도이며 REQ-110의 개별 회신을 지킨다"
    note: "@defer P3 — 조사·오류·신고·저장 조회 실행·감사 검토 기록·변경 요청·지식 검토 작업 연결의 정확한 키, 무결성·동시 처리·연결 변경 이력을 설계한다. 오류 코드·메시지의 안정 지문으로 동일 원인을 자동 판정하는 설계는 하지 않는다"
    acceptance: "같은 오류 코드의 서로 다른 발생은 원본별로 남으며 자동 조사 건을 만들거나 병합하지 않는다. 담당자가 오류·신고·실행 실패·추적 감사 근거를 조사에 연결·배정하고 분석·조치·검증을 기록할 수 있다. 연결 취소는 사유가 있어야 가능하며 원본별 상세와 조사 상세에서 연결·취소·재연결 이력을 조회한다. 취소는 원본·기존 이력을 삭제하거나 조사·신고·저장 조회 상태를 자동 변경하지 않는다. 완료 조사에 조치 전 발생을 사후 연결하면 완료를 유지하되 연결 이력이 남고, 조치 후 같은 문제의 재발은 재개 또는 후속 조사로 처리한다. 발생마다 알림을 보내지 않으며 배정·지식 보완 요청 때 알린다"
    summary: "발생 기록과 조사·조치를 분리한다. 담당자가 자동 오류·품질 신고·저장 조회 실패·추적 감사 근거를 공통 조사에 연결해 처리하고, 완료 뒤 늦게 발견한 과거 발생도 연결하되 조치 후 재발은 별도로 검토한다"
    intent:
