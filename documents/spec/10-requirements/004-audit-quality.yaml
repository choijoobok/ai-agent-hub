  - id: REQ-113
    type: functional
    priority: must
    actors: [ACT-002, ACT-006]
    source: "2026-09-15 사용자 결정 (CR-023) 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-20 사용자 결정: 모든 질의의 새 턴 요청을 허용함에 따라 동일 접수의 중복 전송과 별도 명시 요청을 구분하고, 원본 실행 사실만으로 질의 접수를 막는 조건을 실제 실행의 승인/결과 확인 경계로 정리했다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-113 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다."
    process_step: PRC-11-01
    title: "중복 실행의 책임 경계"
    detail: "한 턴 안의 실행 중복은 Hub의 실행 점유·현재 상태·호출 계약으로 통제한다. 원 질의의 새 턴 요청은 REQ-013에 따라 모든 상태에서 제공하고, 같은 접수 요청 식별자의 중복 전송은 새 턴 1건으로 처리한다. 같은 질의를 사용자가 별도로 다시 요청하면 별도 접수로 인정한다. 서로 다른 턴의 업무 의미 중복은 대상 시스템이 처리하며 Hub는 최근 실행 이력·멱등성·결과 불명과 현재 승인 근거를 제공한다"
    why: "**후자를 막지 않는 것은 누락이 아니라 결정이다.** 두 사용자가 각자 다른 채팅에서 겹치는 대상을 처리하는 것은 정당한 병렬 업무이며, 파라미터가 일부 겹친다는 이유로 차단하면 정상 업무가 멈춘다. **무엇이 '같은 작업' 인지는 업무 의미론**이고 그 판단을 Hub 가 복제하는 것은 PRN-09 가 금지하는 방향이다"
    hard_rule: "Hub 가 이 층에서 제공하는 것은 차단이 아니라 **가시성**이다 — 승인 화면에 같은 API 의 최근 실행 이력(실행자·시각·파라미터·결과 — 결과 불명 포함)을 함께 제시해 **사람이 판단**하게 한다. 멱등하지 않은 것으로 등록된 실행 API 는 그 사실과 재시도 정책을 승인 화면에 함께 제시한다"
    roadmap: RM-P1
    acceptance: "동일 접수의 재전송은 하나의 새 턴만 생성하고 별도 명시 요청은 원 질의가 같아도 접수한다. 원 턴의 진행/종결은 유지한다. 새 실행 승인에는 최근 실행·결과 불명·멱등성을 표시하며 기존 승인/체크포인트를 자동 재사용하지 않는다. 이전 처리 중/결과 불명 실행의 재전송은 REQ-013.execution_boundary·REQ-105에 따라 확인하고 통제한다"
    summary: "Hub는 동일 접수의 중복 전송과 턴 내부 실행 중복을 막는다. 별도의 명시적 새 질의는 접수하고 실제 실행 단계에서 승인·최근 이력·결과 불명 경계를 검사한다"
    intent:
      problem: "서버가 재시작되거나 재시도가 겹치면 같은 실행이 두 번 나갈 수 있다. 반대로 Hub가 '같은 작업'을 추측해 막으면 정당한 병렬 업무가 멈춘다"
      goal: "Hub가 확실히 아는 범위(한 턴)는 막고, 업무 의미가 필요한 범위는 판단 근거를 보여 준다"
      not:
        - "업무 의미의 중복 판정이 아니다 — 무엇이 같은 작업인지는 대상 시스템의 일이다(PRN-09)"
    goal_trace: [GOAL-2]
    decider: "제품 오너(사용자) — 2026-09-15 CR-023"
    preconditions:
      - "실행 API의 멱등성·재시도 정책이 명세돼 있다(REQ-105)"
    execution_identity:
      scope: "업무 파라미터의 동일성만으로 중복·재시도·추가 실행을 판정하지 않는다. Hub가 관리하는 접수·실행 식별자, 원 수행/계획 작업 연결과 사용자 요청·승인 근거로 확실한 재전달을 통제한다. 모델의 새 번호만으로 별도 의도를 만들지 않고 불명확한 반복 제안은 필요한 사용자 확인을 받는다."
      contract: "대상 시스템의 실제 멱등성 보장 여부·기본 미보장·근거/적용 조건과 요청 키는 REQ-105.idempotency_contract가 정본이다. 사용자 확인 후 재승인 실행은 REQ-105.manual_reexecution을 따른다. 별도 실행 기록을 만들었다는 이유로 원 실행과의 관계를 숨기거나 멱등성 키를 임의 교체하지 않는다."
    data:
      - { item: "실행 점유(턴·액션·점유 시각)", origin: "agent", sensitivity: "내부", retention: "턴 종결까지" }
    business_rules:
      - "한 턴 안에서 유효한 이어가기·호출 재시도의 실행이 겹치면 점유·현재 상태·호출 식별로 통제하며 종결된 원 턴을 되살리지 않는다"
      - "서로 다른 턴의 업무 의미 중복을 Hub가 추측으로 차단하지 않는다. 다만 연관 원 실행의 처리 중/결과 불명은 REQ-013.execution_boundary에 따라 실제 재전송 전 확인한다"
      - "승인 화면에 같은 API의 최근 실행 이력(실행자·시각·파라미터·결과, 결과 불명 포함)과 멱등성·재시도 정책을 보인다. 새 턴 요청이나 즐겨찾기 등록을 실행 승인으로 취급하지 않는다"
      - "같은 접수 요청 식별자로 들어온 중복 전송은 기존 새 턴/접수 결과를 반환한다. 원 질의·최초 원 요청 참조는 계보와 실행 사실 확인에 사용하고 원본당 새 턴 수를 하나로 제한하는 키로 사용하지 않는다. 별도의 명시 요청에는 별도 식별자를 적용하고 개인 한도·쿼터를 각각 검사한다"
      - "원본의 과거 실행 전송/완료 사실만으로 새 질의 접수를 거절하지 않는다. 새 턴에서 다시 실행이 필요하면 현재 계획·인자·승인을 확보하고, 이전 실행의 처리 중/결과 불명이나 근거 부재를 미실행으로 추정해 재전송하지 않는다. 대상 시스템 확인과 새 승인 후 후속 실행은 REQ-105.manual_reexecution의 명시 경로로 처리하며 원 불명 기록을 유지한다"
    exceptions:
