    maturity: {"level":"confirmed","at":"2026-10-22","by":"AI — 사용자 명시 재확정 반영","confirmed_by":"사용자 — 2026-10-22 개인정보 보호·턴 이력 보관 관련 수정으로 검토 상태가 된 요구사항의 재확정을 명시 요청했다. 질의·응답 본문 기본 7일·YAML 수정/배포·새 자료부터 적용·만료 접근 차단·일일 파기와 별도 자산/감사 메타데이터 보관 경계를 포함한 전체 보완본을 확정하며 상세 설계·단계 게이트·소스 구현 승인은 별도다."}
