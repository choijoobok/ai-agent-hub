      - "각 원본의 목록·상세에 현재 유효한 연결 조사와 상태를 표시한다. 미연결·조사 중·조사 완료를 구분하되, 연결만으로 해결됐다고 표시하지 않는다. 취소된 연결은 현재 연결에서 제외하고 유효한 연결이 없으면 조사 미연결로 표시한다"
      - "2026-09-30 사용자 확정: 채팅 오류·품질 신고·저장 조회 개별 실행 실패 한 건의 현재 유효한 조사 연결은 최대 한 건이다. 조사 한 건에는 여러 원본을 연결할 수 있다. 완료 조사와의 연결도 취소 전에는 유효하므로 다른 조사에 연결하려면 사유를 남겨 기존 연결을 먼저 취소한다. 동시 요청도 서버에서 원본별 단일 연결을 보장한다"
