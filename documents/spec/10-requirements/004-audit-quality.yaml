      - "완료된 조사에도 과거 발생·신고를 사후 연결할 수 있다. 신고 접수 시각이 아니라 대상 턴·실행에서 문제가 발생한 시각이 조치 적용 전이고 같은 문제에 해당함을 확인하면 완료 상태를 유지하며 연결자·시각·사유를 남긴다"
