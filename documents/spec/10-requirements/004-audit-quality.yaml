    permissions:
      - "대화 이력 삭제(논리): 본인 대화의 ACT-001"
      - "삭제 표시 포함 감사 조회: ACT-005 — 현재 권한과 본문/메타데이터 각각의 보관 기한 적용"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "삭제 표시 조작도 이력으로 남는다(REQ-107)"
    volume: "대화 이력은 사용자·턴 수에 비례한다. 재개 상태는 스텝마다 메시지 전량을 담아 턴 안에서도 빨리 쌓인다(CON-025)"
    config:
      - "질의·응답 본문은 conversation_body_retention, 조회 결과는 REQ-107.retention_policy의 별도 YAML 설정을 수정·배포해 변경한다. 두 기본값은 각각 7일이며 관리자 화면에서는 읽기 전용이다. 고객별 조정 전에도 두 기본 정책의 일일 파기는 수행한다. 그 밖의 감사 메타데이터의 보관 기간·파기는 CON-032로 별도 합의하며 미합의 대상의 파기 배치만 비활성 상태로 둔다"
    risk: "재개 상태 정리가 실패하면 마스킹 사본이라도 보존 정책보다 오래 남는다 — 정리 실패를 운영 경고로 드러내야 한다"
    relations:
