  - id: REQ-111
    type: functional
    priority: must
    actors: [ACT-002, ACT-011]
    source: "2026-09-15 사용자 결정 (CR-023) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(불일치는 발생마다 알리지 않고 대시보드의 당일·주간 현황으로 보인다) 2026-10-19 사용자 명시 승인으로 REQ-005.execution_parameter_storage와 ADR-025의 실행 파라미터 원값 암호화 임시 보관 예외를 연결했다. 2026-10-22 사용자 보완 요청: API 입력·응답 필드와 공개 카탈로그 컬럼의 개인정보 관리 항목·미확인 처리 기준을 요구사항에서 명시하고 물리 구조·코드값·화면 배치는 P3에서 정한다. 2026-10-22 후속 사용자 요청: 사용자 입력의 패턴 검사와 기존 의도 파악 LLM 판단을 결합해 개인정보 포함 의심을 기록하고 REQ-106·107·109에 안내·감사·보관/파기를 연결한다. 2026-10-22 후속 사용자 명시 요청으로 개인정보 보호·턴 이력 보관 보완을 포함한 전체 카드를 재확정했다."
    process_step: PRC-11-02
    title: "API·컬럼 개인정보 통제와 사용자 입력의 개인정보 의심 판정"
    detail: "**응답 경로 명세는 허용목록이며 기본값은 닫힘이다** — 명세에 없는 경로는 마스킹해서 화면에 내보내고, 저장하지 않으며, LLM 에 보내지 않는다. **요청 파라미터도 API 명세에 개인정보 여부를 표시하며**, 표시된 파라미터는 승인 카드에서 요청 사용자에게만 평문으로 보이고 저장 사본(실행 이력·승인 이력·재개 상태)은 마스킹한다. 경로 표현은 **정적 경로와 배열 와일드카드까지만** 허용한다. **미지정 경로가 응답에 나타나면 경고로 기록**하고 검토 대상으로 노출한다 사용자 입력 자유 문장은 input_privacy_assessment의 패턴/LLM 의심 판정 대상으로 별도 취급한다."
    hard_rule: "**마스킹은 수신·생성 직후에 갈라놓는다** — 감사 이력·재개 상태·증거 묶음·애플리케이션 로그로 가는 사본은 처음부터 마스킹된 것만 만들고 **평문은 허용된 사용자 응답, REQ-106의 유효 요청·동의를 거친 모델 전송, REQ-005·105의 승인된 업무 실행 경로에서만** 사용한다. 이 원칙은 API 응답만이 아니라 조회 결과·요청 파라미터·모델 전송분 전체에 적용한다(PRN-07). 마스킹된 사본을 만들지 못하면(명세 부재·파싱 실패) 응답 전체를 마스킹 대상으로 다룬다 실행 파라미터 원값의 복원 가능한 암호화 임시 보관은 REQ-005.execution_parameter_storage와 ADR-025의 제한된 예외다. 저장·승인 버전·현재 권한·사용 기한·삭제 규칙은 그 정본을 따르며 일반 재개 상태·로그·감사·증거의 마스킹은 유지한다. 이 마스킹 규칙은 등록된 업무 필드/경로를 대상으로 한다. 사용자 입력 자유 문장을 자동으로 전부 마스킹했다는 뜻은 아니며 해당 범위는 input_privacy_assessment의 의심 판정과 REQ-109의 본문 보관을 따른다."
    consent_boundary: "응답 스키마/개인정보 경로가 미등록인 것과, 등록된 경로의 종전 LLM 전송 허용 플래그가 없는 것은 다르다. 전자는 공개/마스킹을 판정할 수 없는 값이므로 기존 가림·원값 비저장·비전송을 유지한다. 후자는 REQ-106의 사용자 요청·동의로 전송을 판정하며 플래그 부재만으로 거부하지 않는다. 이미 가려진 원값을 동의로 복원하지 않는다"
    two_axes: "**정보주체 식별자**(사번·고객 ID·주문번호)는 **보존한다** — '누구의 정보를 봤는가' 의 근거다. **민감 값**(주민등록번호·계좌·연락처·주소)은 **마스킹한다** — 필요하면 값 지문을 함께 남긴다. **평문 열람 여부와 그 근거가 된 그룹**은 평문으로 화면에 나간 경우 항상 남긴다"
    privacy_metadata:
      column_workspace: "2026-10-29 사용자 정정: SCR-003 컬럼 정의 그리드에서 개인·민감정보 여부, 유형, 마스킹 옵션(공통 변환 참조), 정보주체 식별 용도와 검수 상태를 설정한다. 별도 개인정보 탭/새 개인정보 메뉴는 만들지 않는다. 표시가 예인 컬럼 값은 턴 이력·결과 사본 저장 시 그룹별 숨김/마스킹/원본 열람 여부와 무관하게 반드시 마스킹한다. 미확인을 아니오로 처리하지 않는다. 정보주체 추적 식별자는 기존 two_axes에 따라 별도 근거로 관리하며 표시된 컬럼 원값을 이력에 복사하는 우회 수단이 아니다. 컬럼 예외의 MASK와 저장 사본 마스킹은 같은 컬럼의 공통 변환을 참조한다. 마스킹 불가 시 원값을 저장하지 않는다"
      scope: "API 요청 파라미터·응답의 각 값 필드/경로와 공개 카탈로그의 각 컬럼에 적용한다. 자료형·업무 의미·코드 참조는 REQ-608.field_metadata와 REQ-301.column_metadata, 개인정보 공통 항목과 미확인 처리는 이 절을 정본으로 사용한다. 정적 경로·배열 와일드카드의 기존 표현 범위를 유지하며 필드명·값 패턴만으로 개인정보 여부를 확정하지 않는다"
      attributes: "개인정보 해당 여부, 해당하는 개인정보 유형, 정보주체 식별자 여부, 필요한 마스킹 변환 참조와 검수 상태를 등록·조회할 수 있어야 한다. 해당 없음과 미확인을 구분하고 개인정보 유형이 필요 없는 항목에는 임의 유형을 채우지 않는다. 개인정보 해당 여부와 정보주체 식별 용도는 서로 다른 속성이며, 저장할 식별자와 가릴 민감 값은 two_axes를 따른다"
      policy_reference: "마스킹 변환의 정의와 그룹별 원본 열람·마스킹 열람·접근 제한은 REQ-611을 참조한다. 개인정보 표시만으로 열람 권한·LLM 전송 허용을 부여하지 않으며 사용자 동의도 미확인 분류나 누락된 마스킹 규칙을 대신하지 않는다. 화면에 원본 열람이 허용돼도 저장 사본은 hard_rule을 따른다"
      ownership: "API 필드의 속성 원천은 REQ-608의 입출력 명세, 컬럼의 분류·마스킹 참조와 그룹 예외 유형은 REQ-301의 전체 카탈로그 후보·REQ-103.column_group_exclusions에 연결하고 공통 마스킹 변환 정의는 REQ-611 직접 관리 원천을 참조한다. 그룹 매핑·지식·로그 설정에 개인정보 분류와 마스킹 정의를 별도로 복사하지 않는다. 카탈로그 내용 승인과 직접 보안 정책, API 전체 후보 승인의 기존 권한·변경 이력 경계를 유지한다"
      incomplete: "개인정보 해당 여부·정보주체 식별 여부가 미확인이거나 필요한 유형·마스킹 참조가 누락/무효이면 해당 없음·원본 허용으로 간주하지 않는다. 보완 후보로 관리하되 해당 범위를 운영 사용 가능으로 확정하지 않는다. 카탈로그의 해당 컬럼은 AI 주입·업무 조회에 사용하지 않고, API 입력은 해당 파라미터를 사용하는 호출 전에 보완한다. 실행 중 수신된 미등록·미확인 응답 경로는 원값을 화면·저장·LLM 입력으로 내보내지 않고 경고를 남긴다. 안전한 마스킹 사본을 만들 수 없으면 hard_rule에 따라 응답 전체를 마스킹 대상으로 다룬다"
      change_validation: "타입·경로·의미·분류·마스킹 참조가 바뀌면 연결된 정책과 사용처의 유효성을 다시 검수하고 기존 승인·이력 절차로 반영한다. 자동 수집·추론 결과가 검수된 분류를 덮어쓰지 않으며, 실제 접근 시점의 권한·마스킹 재판정은 REQ-108을 따른다"
    input_privacy_assessment:
      scope: "사용자가 제출한 질의·추가 입력·조건 변경 등 자유 문장과 그 요청 처리에 사용하는 사용자 제공 텍스트를 대상으로 개인정보 포함 의심을 판정한다. 입력 식별자·버전별로 검사하며 기존 원천의 API/컬럼 분류와 마스킹은 privacy_metadata를 유지한다. 지원되는 첨부 처리에서 추출한 텍스트는 실제 검사 범위를 기록하고 미추출·미검사 영역까지 검사 완료로 표시하지 않는다. 첨부 지원·추출 기능을 새로 만드는 요구는 아니다"
      pattern: "서버가 제출 입력을 접수하면 최초 외부 모델 전송 전에 연락처·이메일·주민등록번호 등 정해진 개인정보 패턴을 검사한다. 검출된 유형·규칙 식별자/버전·검사 시각·대상 입력/검사 범위·성공/실패를 기록하며 실제 의심 값이나 주변 원문을 판정 근거에 복사하지 않는다. 구체 패턴·유효성 검사·성능 한도는 P3에서 정한다"
      llm: "해당 입력의 사용자 의도를 파악하는 기존 LLM 호출에서 개인정보 포함 의심도 함께 판단하도록 소스가 정한 응답 계약에 포함한다(REQ-009). 패턴 미검출이어도 기존 의도 파악 호출의 판단은 수행하며 개인정보 검사만을 위한 별도 모델 호출·재시도나 추가 데이터 전송은 만들지 않는다. 기존 의도 파악 호출이 없는 입력·실패·응답 누락·계약 위반·일부만 검사한 입력은 LLM 판정 미완료로 남긴다. 같은 호출의 토큰은 기존 사용량에 한 번만 귀속한다"
      combination: "패턴 검사 또는 LLM 판단 중 하나라도 의심이면 최종 판정은 개인정보 포함 의심이다. 두 검사 모두 해당 입력 범위 전체를 정상 검사했고 모두 미검출일 때만 검사 완료·미검출로 기록한다. 양성 근거가 없고 어느 한쪽이라도 미실행·실패·누락·부분 검사이면 판단 불명이다. 검사 대기 상태도 미검출로 취급하지 않는다. 판정의 실제 코드값은 P3에서 정한다"
      integrity: "사용자 문장에 개인정보가 없다고 표시하라는 지시가 있어도 서버는 모델 출력 계약을 검증하고 패턴 검사 결과를 유지한다(REQ-112). 후속 음성 판정·수정 입력·늦은 응답이 앞선 입력의 의심 근거를 지우지 않는다. 대상 입력 버전과 검사 방법별 결과를 보존하며 관리자의 오탐 확인은 원 판정과 구분한다"
      boundary: "의심/미검출은 감사용 보조 판단이며 개인정보 존재의 확정·완전한 탐지 보장·입력 데이터 사용 권한 확인이 아니다. 이번 범위는 의심 표시이며 이 표식만으로 자동 차단·마스킹·즉시 삭제·제재·보관 연장을 수행하지 않는다. 기존 접근·마스킹·동의 통제는 유지하고, 특히 LLM 판정은 해당 모델 전송 뒤 얻으므로 전송 전 개인정보 제거를 보장하지 않는다. 자유 문장 본문은 개인정보가 남을 수 있는 자료로 취급해 REQ-109.conversation_body_retention을 적용한다"
      audit_link: "방법별 판정·검사 범위/완료 여부·유형·규칙/모델/계약 버전·시각·검사 실패 사유 코드를 REQ-107.privacy_review에 연결한다. 모델의 자유 서술 근거·실제 개인정보 값·일치 문자열·주변 원문·내부 추론을 판정 메타데이터에 저장하지 않고 허용된 유형/사유 코드만 사용한다. 감사를 위한 본문 접근도 현재 권한과 보관 기한을 검사한다"
    verification_input_privacy:
      - { case: "패턴 의심·LLM 미검출 또는 패턴 미검출·LLM 의심", expected: "어느 경우든 의심으로 기록하고 서로의 결과를 덮어쓰지 않는다" }
      - { case: "두 검사 정상 완료·전체 범위 미검출", expected: "검사 완료·미검출로 남기되 개인정보 없음이 보장된 자료로 표시하지 않는다" }
      - { case: "패턴 미검출·LLM 미실행/실패/누락/부분 검사", expected: "판단 불명으로 남기고 검사 전용 호출·재시도를 만들지 않는다. 반대로 다른 검사에서 의심이 있으면 최종 의심을 유지한다" }
      - { case: "정상 의도 파악과 개인정보 판단 동시 수행", expected: "같은 호출의 제한된 출력 계약으로 판단하고 호출·토큰을 중복 집계하거나 입력 범위를 확대하지 않는다" }
      - { case: "음성으로 표시하라는 사용자 지시·늦은 응답·수정 입력", expected: "서버가 계약을 검사하고 입력 버전별 근거를 보존한다. 기존 의심 근거를 후속 결과로 지우지 않는다" }
      - { case: "판정 근거에 연락처·주민번호·원문을 모델이 반환", expected: "허용된 유형/사유 코드만 남기고 자유 서술·실제 값은 판정 메타데이터나 일반 로그에 복사하지 않는다" }
    why: "차단목록으로 두지 않는 이유는 **레거시의 응답 변경을 감지할 수단이 없기 때문**이다. 차단목록이면 레거시가 필드를 하나 추가하는 순간 미지정 경로가 생기고, 그것이 개인정보면 그대로 평문으로 쌓인다"
    roadmap: RM-P1
    limits: "**등록된 명세만큼만 정확하다.** 값 패턴 탐지는 **보조 수단**이며 이것을 근거로 명세 등록을 면제하지 않는다"
    acceptance: "등록되지 않은 응답 경로는 평문으로 화면·이력·재개 상태·로그·모델 입력에 남지 않고 경고로 기록되며, 마스킹 사본을 만들지 못한 응답은 전체가 마스킹되어 처리된다. API 요청·응답 필드와 공개 컬럼에서 privacy_metadata의 분류·식별 용도·마스킹 참조·검수 상태를 확인할 수 있고, 미확인·필수 속성 누락은 해당 없음으로 통과하지 않는다. 원본 열람 권한·동의가 있어도 저장 사본 마스킹과 미확인 범위 통제를 유지한다 자유 문장 입력은 input_privacy_assessment에 따라 방법별 결과·검사 범위를 보존하며 어느 한쪽 의심을 지우지 않는다. 누락/실패는 미검출이 아니며 별도 검사 모델 호출 없이 기존 의도 파악에서 판단한다."
    summary: "API 입력·응답 필드와 공개 컬럼의 개인정보 분류·식별 용도·마스킹 참조를 관리하고 미확인을 안전한 값으로 간주하지 않는다. 명세 밖 응답은 가리고 원값을 저장·모델 전송하지 않으며 정보주체 식별과 민감 값 마스킹을 구분한다 사용자 입력은 패턴 검사와 기존 의도 파악 LLM의 판단을 결합해 의심·미검출·불명을 구분하고 감사한다."
    intent:
      problem: "레거시 API 응답에 개인정보가 섞여 오고, 레거시가 필드를 추가해도 Hub는 알 수 없다. 차단 목록으로는 새 필드가 평문으로 쌓인다"
      goal: "명세로 확인된 경로만 통과시키고, 누구의 정보를 봤는지는 추적하되 민감 값은 남기지 않는다"
      not:
