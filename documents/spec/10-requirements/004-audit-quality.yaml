  - id: REQ-112
    type: functional
    priority: must
    actors: [ACT-002]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 2026-10-22 사용자 결정: SQL 원문·물리명 비노출을 우선 전사 공통 프롬프트 규칙에 포함하고 추가 기술 통제는 후속 보완한다."
    process_step: PRC-02-03
    title: "프롬프트 인젝션·오염 대응과 전사 공통 응답 규칙"
    detail: "사용자 입력·조회된 데이터·지식 문서에 포함된 지시성 문장을 **명령으로 해석하지 않는다.** 개인 기본 지시는 시스템 프롬프트 규칙을 무력화할 수 없고 정책 판정은 항상 서버 규칙이 최종 결정한다. 관리자는 전사 공통 프롬프트 규칙으로 ① 권한 밖·미등록 대상의 존재 은닉과 고정 안내 문구 ② 지식 검색 무결과 시 접근 가능 태그 안내 ③ 전체 지식·문서·본문의 열거·일괄 요약 거절과 구체적 업무·사용법 질문 요청 ④ 지식 불필요 요청의 업무 연관성 판정 가이드와 비업무 추정/판단 불명 근거 작성 ⑤ agent가 생산한 사용자 문구를 portal이 그대로 표시하는 원칙 ⑥ REQ-104.initial_control의 SQL 원문·물리명 비노출과 업무 용어 설명 지침을 관리한다. 규칙의 운영 편집 항목과 검증·호출별 조합 경계는 REQ-610을 따른다"
    hard_rule: "프롬프트 규칙은 응답 문구·태도와 업무 연관성 판정 가이드를 정하며 권한 경계가 아니다. agent 서버는 접근 그룹 필터, 태그 중복 제거·정렬, 검색 결과 상한, 지식 전체 열람·내보내기 차단을 별도로 강제하며 LLM에 전체 지식 목록·본문을 제공하지 않는다"
    acceptance: "사용자 입력·조회 결과·지식 본문 또는 개인 기본 지시에 정책 우회·권한 확대·도구 직접 호출 지시가 포함돼도 서버 정책과 시스템 규칙이 변경되지 않고, 허용되지 않은 실행은 발생하지 않는다. 전체 지식을 보여 달라는 요청은 본문·제목·건수 열거 없이 구체적 업무 또는 사용법 질문을 요청하는 공통 문구로 응답하며, 태그 안내는 서버가 필터·중복 제거·정렬한 허용 태그만 사용한다. SQL·물리명 비노출 지침은 REQ-104.initial_control의 초기 적용·대표 검증·한계를 따르고 추가 기술 통제는 해당 open에서 후속 검토한다."
    summary: "사용자 입력·조회 데이터·지식 문서 속 지시성 문장을 명령으로 해석하지 않는다. 존재 은닉·무결과 안내·전체 열거 거절·문구 전달 원칙은 전사 공통 프롬프트 규칙으로 관리하되, 권한 경계는 서버가 따로 강제한다"
    intent:
      problem: "데이터나 지식에 섞인 '이전 지시를 무시하라' 같은 문장이 모델을 조종하면 통제가 모델에 달리고, 전체 지식을 나열하게 하면 접근 통제를 우회한다"
      goal: "어떤 입력이 와도 정책과 권한은 서버 규칙이 정하고, 응답 태도와 문구는 관리자가 한 곳에서 관리한다"
      not:
        - "프롬프트 규칙이 권한 경계가 아니다 — 규칙은 문구·태도·업무 연관성 판단 가이드를 정한다"
        - "개인 기본 지시로 시스템 규칙을 바꾸는 기능이 아니다"
    goal_trace: [INV-01]
