  - id: REQ-110
    type: functional
    priority: should
    actors: [ACT-001, ACT-005]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 저장 사본 마스킹 · 2026-09-29 대화 이력 보관 기간 내 신고 · 2026-09-30 사용자 결정(채팅 오류·응답 품질·저장된 조회 실행 오류 신고, 통합 조사 연결과 개별 회신) · 2026-09-30 사용자 재확정(신고·조사 분리와 연결 취소 이력)"
    process_step: PRC-02-06
    title: "품질 신고 — 채팅·저장된 조회의 문제 접수와 회신"
    detail: "사용자는 채팅의 처리 오류·응답 품질 문제 또는 개인 저장된 조회의 실행 오류를 신고한다. 채팅 신고는 대상 턴·응답 회차, 저장된 조회 신고는 조회 ID·개별 실행 ID를 지정하고, 특정 오류에서 신고하면 오류 발생 ID도 연결한다. 신고 원본을 보존하면서 REQ-115의 오류·품질 조사에 연결해 처리하고, 신고자에게 자신의 진행 상태와 처리 결과를 회신한다"
    hard_rule: "이미 조사 중이어도 신고를 접수하고 추가 설명·업무 영향을 보존한다. 같은 턴이라는 이유만으로 같은 문제라고 판정하지 않는다. 신고자는 자신의 질의·응답·실행 결과와 사용자용 진행 안내·처리 결과만 보며, 다른 사용자의 신고·내부 오류·프롬프트·정책·객체명은 노출하지 않는다. 내부 증거는 유효 권한 품질 담당자만 열람하고 모든 열람을 감사한다. 조사 완료만으로 신고를 자동 종결하지 않고 해당 신고에 대한 판단 사유·실제 조치·결과 회신을 남긴다"
    note: "@defer P3 — 조사 대상 삭제 유예의 식별·적용 범위, 파기와 조사 지정·완료·재개·연결 취소의 동시 처리, 열람 권한·암호화와 신고·실행·조사 연결의 정확한 키·무결성을 설계한다. 조사 완료까지 삭제 제외하고 완료 후 원래 보존 기한으로 복귀하는 정책은 확정이다"
    acceptance: "채팅 턴 또는 본인 저장 조회의 개별 실행을 지정해 신고하면 원본·실제 처리 근거가 보존된다. 같은 턴의 다른 증상은 자동 병합하지 않고, 이미 조사에 연결된 특정 오류의 신고는 접수 후 조사 중 안내를 받는다. 조사 완료 뒤에도 신고별 결과 회신 없이 종결되지 않으며, 신고자는 자신의 신고 상태·사유·조치만 조회한다"
    summary: "채팅 오류·잘못된 응답과 저장된 조회 실행 오류를 신고받는다. 신고를 오류·품질 조사에 연결하되 원본과 개별 회신을 유지하고, 턴이나 오류 코드만으로 같은 문제라고 자동 병합하지 않는다"
    intent:
      problem: "자동 오류와 사용자가 겪은 문제를 따로 조사하면 중복 조치가 생기고, 턴 없는 저장 조회의 실패는 신고 근거가 누락될 수 있다"
      goal: "문제가 발생한 응답·실행을 정확히 지정해 조사에 연결하고, 사용자에게 처리 결과를 돌려준다"
      not:
        - "조사 건으로 신고 원본을 합치거나 없애는 기능이 아니다"
        - "같은 턴의 신고를 같은 원인으로 자동 판정하는 기능이 아니다"
        - "신고자에게 내부 조사 근거나 다른 사용자의 정보를 공개하는 기능이 아니다"
    goal_trace: [SUC-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "신고 대상 턴 또는 본인 저장 조회 실행 이력이 남아 있다(REQ-107·REQ-108·REQ-207)"
      - "오류·품질 조사 연결과 회신 근거를 관리한다(REQ-115)"
    data:
      - { item: "신고(대상 유형·턴과 회차 또는 조회 ID와 실행 ID·선택 오류 발생 ID·사유·신고자·시각)", origin: "portal 입력", sensitivity: "일반(자유 문장)", retention: "신고 원본은 수정 불가 이력" }
      - { item: "불변 증거 묶음", origin: "agent 이력 복사", sensitivity: "내부, 업무 데이터는 마스킹 사본만(REQ-111)", retention: "각 원자료의 보존 기한을 승계하되 조사 대상이면 조사 완료까지 삭제 제외. 증거 복사·조사 완료로 원문 보존 기한을 다시 시작하지 않음" }
      - { item: "신고 처리와 조사 연결·연결 취소·사용자 회신 이력", origin: "admin", sensitivity: "사용자용 회신과 내부 근거를 분리", retention: "변경 이력 보존" }
    business_rules:
      - "되돌림이 있던 채팅은 최종 응답을 만든 회차에 신고를 연결하되 버려진 회차도 내부 조사에서 조회한다"
      - "채팅 증거는 실제 실행된 모든 회차·스텝의 순서·시각·입력·출력·상태 전이와 실제 모델 입력 전문(내부 프롬프트·지식·스키마·전사 및 개인 규칙·정책·모델 설정)을 보존한다(ASM-008)"
      - "저장 조회 신고는 조회 ID만 받지 않고 개별 실행 ID를 연결한다. 실제 SQL·바인딩·권한 판정·실패 근거는 REQ-207을 사용하며 없는 턴·모델 호출·프롬프트를 만들지 않는다"
      - "업무 데이터는 마스킹 사본만 복사하고 비밀 값은 참조 식별자·버전·지문만 남긴다. REQ-107에 따른 보존 중인 조회 결과를 채팅 증거에 확보해 실제 모델 입력과 대조한다. 만료·파기되었거나 마스킹 사본 생성 불가로 값이 없는 결과는 남은 SQL·메타데이터·지문·모델 전송분으로 조사하되 당시 전체 결과를 복원할 수 없다는 한계를 표시한다"
      - "조사에 필요한 원자료와 증거 사본의 보호·범위·담당자·해제·파기 경합은 REQ-107.retention_policy를 따른다. 신고 접수만으로 이미 없어진 원문이 복원되지는 않는다. 신고 증거 확보와 조사 보호 연결 사이에 유실되지 않도록 P3에서 원자적 연결/보호 인계 계약을 정한다"
      - "조사 완료 시 해당 조사의 삭제 유예를 해제하고 각 자료의 원래 보존 기한으로 복귀한다. 원문은 REQ-107의 기한이 이미 지났으면 이후 첫 일일 배치에서 삭제 대상이 되고, 아직 남았으면 원래 기한까지 보존한다. 완료일부터 보존 기간을 다시 부여하지 않는다. 다른 미완료 조사에 필요한 자료는 해당 보호가 해제될 때까지 제외한다. 기준은 REQ-115의 조사 완료이며 신고자 회신·신고 종결과 구별한다"
      - "동일 턴의 오류·조사는 관련 후보로만 제시하고 담당자가 신고 내용과의 관련성을 확인해 연결한다"
      - "특정 오류 발생 ID에서 접수한 신고는 이미 연결된 조사를 근거로 사용자에게 조사 중이라고 안내할 수 있다. 신고와 추가 설명은 보존하고 다른 문제라는 내용이 있으면 담당자가 연결을 재검토한다"
      - "오류·품질 조사에 연결된 신고라도 조사 완료를 자동 종결 근거로 삼지 않는다. 해당 신고에 대한 조치 적용 여부와 사용자용 결과를 확인·회신한 뒤 종결한다"
      - "완료 조사에 과거 신고를 사후 연결하거나 조치 후 재발을 처리하는 규칙은 REQ-115를 따른다"
      - "신고의 조사 연결 취소·재연결과 이력 조회는 REQ-115를 따른다. 취소된 연결을 현재 조사 중 안내의 근거로 사용하지 않으며, 과거 사용자 회신은 보존한다. 내부 연결·취소 사유와 이력은 신고자에게 자동 공개하지 않는다"
      - "대화 이력 보관 기간 안의 사용자 화면에 남은 턴 또는 본인의 실행 이력이 조회되는 저장 조회 오류를 신고할 수 있다. 삭제 표시된 대화는 사용자 신고 대상이 아니다"
      - "증거 열람 권한과 신고 대상 소유권은 현재 유효 권한으로 확인한다. 조사 연결이 다른 사용자의 정보 열람 권한을 부여하지 않는다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-06이 갖는다"
      - "같은 턴에서 SQL 오류가 재시도로 해소된 뒤 최종 답변의 계산 오류를 신고하면 기존 SQL 오류 조사로 자동 종결하지 않는다"
    lifecycle:
      - { state: 접수, next: [검토] }
      - { state: 검토, next: [종결] }
      - { state: 종결, next: [], note: "처리자·시각·판단 사유·실제 조치·사용자 회신이 필수. 조사 상태와 별도다" }
    permissions:
      - "신고와 본인 신고 결과 조회: ACT-001"
      - "검토·조사 연결·연결 취소·이력 조회·회신·종결과 내부 증거 열람: 유효 권한의 ACT-005"
      - "관리 화면 접근은 system 역할·메뉴 권한 데이터로 판정한다 — 특정 역할 하드코딩 없음(AUTHZ-091)"
    audit: "신고 접수·조사 연결과 연결 취소·재연결·회신·종결·내부 증거 열람을 기록한다. 연결 이력의 항목과 보존 규칙은 REQ-115를 따른다"
    volume: "채팅·저장 조회 사용자 신고 빈도에 비례하며 고객사별 미확인"
    config: "해당 없음"
    risk: "동일 턴에도 여러 문제가 있을 수 있다. 턴 일치로 자동 병합하면 별도 신고 사유가 누락된다"
    relations:
