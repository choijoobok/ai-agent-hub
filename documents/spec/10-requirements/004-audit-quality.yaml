# 영역: 감사·품질·보관
requirements:
# ── 감사·품질·보관 ───────────────────────────────────────────
  - id: REQ-108
    type: functional
    priority: must
    actors: [ACT-005]
    source: "2026-09-21 감사 요구 유지 · 2026-09-29 내용 버전의 최초 필요 시 고정·장기 대기 후 재판정 · 2026-10-01 사용자 결정: 권한은 지식 검색·쿼리 수행 등 접근마다 현재 값으로 확인(ADR-019)"
    process_step: PRC-02-04
    title: "이력 기록과 트랜잭션 분리"
    detail: "이력 기록은 **업무 트랜잭션과 분리**한다. 소모된 토큰과 이미 실행된 조회·API 호출은 되돌릴 수 없으므로 성공·실패나 롤백 여부와 무관하게 기록이 남아야 한다. 발생 즉시 **별도 트랜잭션으로 커밋**하고 이력 테이블은 **append-only** 로 운용한다"
    hard_rule: "**내용 버전 고정과 접근 권한 판정을 분리한다.** 전사 프롬프트 규칙·지식·스키마/업무 API 카탈로그의 내용 버전은 처음 필요할 때 선택하고 같은 턴에서 유지한다. 사용자 활성 상태·승인된 그룹 소속·대상별 신원 매핑·자산 접근·행 스코프·마스킹·전송 허용은 고정하지 않고 실제 지식 검색·모델 입력 구성·DB/조회 API 조회·업무 실행·결과 제공 시점의 현재 유효 권한으로 검사한다. 이전 허용 판정이나 캐시를 근거로 검사를 생략하지 않는다. 오래 대기한 뒤 이어갈 때의 기준 시간은 내용 버전 재선택에 적용하며 권한 재검사를 지연하는 시간이 아니다. 중단 후 새 시도는 내용도 새로 선택한다(REQ-013). 이미 외부로 전송한 호출·데이터나 완료된 업무를 소급 취소·복구한다고 보장하지 않는다(ADR-019)"
    note: "턴 이력에는 대상별로 판정에 쓴 관리 화면 스냅샷 식별자·프롬프트 규칙 ID·리비전과 판정 시각, 재판정 여부를 함께 남긴다. 주 추론 모델·effort·공급 경로를 실행 시도 시작에 고정하는 것은 이 규칙이 아니라 ARCH-040이 갖는다. 처리 중 개인 쿼터 재검사 설정의 다음 LLM 호출 직전 적용은 NFR-012를 따르며 정책 대상 판정 고정과 혼동하지 않는다"
    acceptance: "실패·취소·업무 롤백과 무관하게 발생 이력이 남는다. 같은 내용 버전을 쓰더라도 그룹·대상 매핑이 회수되면 이후 지식 검색·모델 입력·조회·실행·결과 제공에서 현재 권한으로 차단한다. 요청 상태의 신규 권한은 반영하지 않으며 권한 판정 근거와 내용 버전을 별도로 추적한다"
    summary: "감사 이력은 업무 트랜잭션과 분리한다. 내용 버전의 일관성은 유지하되 접근 권한은 매 접근 시점에 다시 확인한다"
    intent:
      problem: "토큰 소모와 이미 나간 조회·API 호출은 되돌릴 수 없는데, 업무 트랜잭션이 롤백되면 그 사실까지 사라진다. 또 내용 버전과 접근 권한을 함께 고정하면 회수된 권한으로 후속 접근할 수 있다"
      goal: "무슨 일이 일어났는지는 성공·실패와 무관하게 남기고, 내용의 일관성을 유지하면서 접근 권한은 현재 상태로 검사한다"
      not:
        - "업무 데이터의 트랜잭션 관리가 아니다 — 업무 시스템의 성공·롤백은 대상 시스템의 일이다"
        - "세션 단위 일관성이 아니다 — 세션은 여러 날에 걸칠 수 있어 경계로 삼지 않는다"
    goal_trace: [INV-01]
    decider: "제품 오너(사용자) — 감사 무결성 원칙이라 고객사별 조정 대상이 아니다"
    preconditions:
      - "내용 대상의 리비전과 매 접근에 사용한 권한 스냅샷·판정 시각을 구분해 추적할 수 있다(REQ-103)"
    data:
      - { item: "턴별·대상별 판정 스냅샷 식별자·프롬프트 규칙 ID·리비전·판정 시각·재판정 여부", origin: "agent 스텝 판정", sensitivity: "내부", retention: "감사 이력 보존 정책(REQ-107·REQ-109)" }
    business_rules:
      - "이력은 발생 즉시 업무 트랜잭션과 별도 트랜잭션으로 커밋하고 append-only로 운용한다"
      - "내용 대상은 스텝이 처음 필요로 할 때 현재 유효 버전을 선택해 같은 턴에서 유지한다. 새로운 지식 검색에서도 권한은 현재 값으로 검사하고 처음 사용하는 자산은 그때 내용 버전을 선택한다"
      - "권한 변경은 이후 접근의 현재 판정에 반영한다. 계정 비활성화·그룹 제거·대상 매핑 회수 후에는 같은 턴이라도 제거된 권한으로 접근하지 않는다. 사용자 실행 승인의 유효 시간 안이어도 현재 권한 검사를 생략하지 않는다"
      - "이전 스텝의 지식·조회 결과·대화 문맥을 재사용하는 경우에도 현재 권한을 확인한다. 회수된 근거는 후속 모델 입력·조회·실행·응답에 재사용하지 않는다. 혼합·요약된 데이터의 권한 출처를 분리할 수 없으면 해당 재사용을 차단하며 이미 전달된 정보의 회수는 보장하지 않는다"
      - "사용자대기에서 이어갈 때 권한은 대기 길이와 무관하게 현재 값으로 검사한다. 재판정 기준 시간을 넘기면 내용 버전 고정도 풀고 다시 선택한다. 현재 권한으로 허용되지 않은 대기 액션은 실행하지 않고 사유를 안내한다(REQ-102)"
      - "중단 후 원 질의 요청은 별도 새 턴/시도에서 첫 단계부터 처리하므로 이전 시도의 판정을 쓰지 않고 새로 판정한다(REQ-013)"
    exceptions:
      - "공정 단계의 예외는 PRC-02-04가 갖는다 — 필수 이력을 기록하지 못하면 응답을 성공 처리하지 않는다"
    lifecycle: "해당 없음 — 이력은 불변이고, 턴 상태는 03-glossary 003-turn-states가 정본이다"
    permissions: "해당 없음 — 기록 방식의 규칙이다. 이력 열람 권한은 REQ-107이 갖는다"
    audit: "턴 이력에 대상별 판정 스냅샷 식별자·프롬프트 규칙 ID·리비전·판정 시각과 재판정 여부를 남긴다"
    volume: "스텝마다 기록이 생긴다 — 규모는 REQ-107·CON-025와 같다"
    config:
      - "`sys-config.agent.policy.recheck-after-minutes` — 사용자대기에 들어간 뒤 응답까지 이 시간을 넘기면 고정한 내용 버전을 풀고 다시 선택한다. 접근 권한은 이 시간과 무관하게 매번 검사한다. 양의 정수 분, 기본 60분. 시스템 설정 DB 오버라이드로 배포 없이 바꾸며 저장 뒤 새로 대기에 들어가는 턴부터 적용한다"
    risk: "권한 검사와 실제 외부 호출 사이 경합, 인스턴스별 낡은 권한 캐시, 이전 문맥 재사용으로 통제가 우회될 수 있다. 호출 직전 검증·버전 확인·문맥 근거 추적 계약을 P2/P3에서 검증한다. 이미 전송한 호출의 취소와 외부 업무 원상복구는 보장하지 않는다. 감사 쓰기 부하는 NFR-027과 함께 검증한다"
    relations:
      depends_on: [REQ-103]
      constrains: [REQ-005, REQ-014, REQ-107, REQ-110, REQ-115, "REQ-608", REQ-017]
      conflicts_with: []
      nfr: [NFR-027]
      interfaces: []
    realization:
      features: [FEAT-210]
      screens: []
    examples:
      - { kind: 정상, case: "출고 API 호출 뒤 대상 시스템이 업무 트랜잭션을 롤백해도 Hub의 호출 이력과 소모 토큰은 별도 트랜잭션으로 이미 남아 있다" }
      - { kind: 예외, case: "10:01에 지식과 카탈로그를 사용했어도 10:02에 해당 사용자 권한을 제거하면 10:03의 다음 검색·조회·실행은 현재 권한으로 차단한다. 이전 스텝의 결과를 후속 모델 입력에 넣어 우회하지 않는다" }
      - { kind: 예외, case: "추가 정보 대기에 들어간 턴에 사용자가 3시간 뒤 답하면, 기준 60분을 넘겼으므로 이어가기 전에 현재 매핑으로 다시 판정한다. 그사이 그룹이 회수됐다면 그 테이블은 조회하지 않고 차단 사유를 안내한다" }
    volatility: { level: low, what: "감사 무결성 원칙이라 고객사마다 달라지지 않는다. 재판정 기준 시간만 운영 설정이다" }
    open: ["@defer P2/P3 다중 인스턴스 권한 변경 전파·호출 직전 판정과 경합, 내용 버전과 현재 정책의 결합, 기존 모델 문맥·파생 데이터의 출처 추적 및 차단 범위를 구체화한다"]
    maturity: { level: confirmed, at: "2026-10-01", by: "AI 정리", confirmed_by: "사용자 — 스텝별 지식 검색·쿼리 수행 시 실시간 권한 적용" }
  - id: REQ-109
    type: functional
    priority: must
    actors: [ACT-001, ACT-005, ACT-011]
    source: "2026-09-20 사용자 결정 (ASM-008) · 2026-09-28 사용자 결정(저장 사본은 항상 마스킹 — PRN-07 개정) · 2026-09-29 사용자 결정(대화 이력 보관 기간은 yml · 파기는 system 스케줄 화면에 빈 등록) · 2026-10-01 사용자 승인(중단 시 실행용 재개 상태 정리·감사 이력 분리·운영 시간과 보존 정책 분리) · 2026-10-13 사용자 승인: 대화 세션의 미종결 턴 취소·중단 및 종결 확인 후 논리 삭제 허용 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-19 사용자 명시 승인으로 REQ-005.execution_parameter_storage와 ADR-025의 실행 파라미터 원값 암호화 임시 보관 예외를 연결했다. 2026-10-22 사용자 결정: 질의·응답 본문 기본 보관은 7일, YAML 수정·배포로 변경하며 감사 메타데이터와 분리한다. 개인정보 의심 표식만으로 보관을 연장하지 않는다. 2026-10-22 후속 사용자 명시 요청으로 개인정보 보호·턴 이력 보관 보완을 포함한 전체 카드를 재확정했다."
    process_step: PRC-02-04
    title: "보관과 파기 — 논리 삭제만 허용"
    detail: "**사용자의 대화 이력 삭제는 논리 삭제만 허용한다.** 대화 세션 삭제는 session_deletion의 모든 턴 종결 조건을 충족해야 한다. 표시 여부 플래그만 갱신되며 데이터는 삭제되지 않는다. admin 은 감사를 위해 **삭제 표시된 이력도 현재 권한과 보관 기한 안에서 조회**할 수 있고, 사용자가 감사 대상 기록을 지울 수 있는 경로는 제공하지 않는다. 물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 수행한다"
    hard_rule: "**실행용 재개 상태(체크포인트)와 감사 이력은 별개다.** ① 완료·실패로 턴이 종결되거나 현재 시도의 중단이 확정되면 그 시도의 재개 상태를 즉시 실행 입력에서 제외하고 정리 대상으로 삼는다 ② 이전 회차의 무효화된 재개 상태도 턴 종결 전 정리한다 ③ 조회 결과 사본의 보관 기간은 원문 보존 기간을 넘지 않으며 대기·재시도로 연장하지 않는다 ④ 조회 결과와 API 응답은 마스킹된 사본만 상태에 싣는다(PRN-07). 만료되지 않은 사용자대기의 같은 턴 이어가기와 모든 상태의 원 질의 새 턴 요청은 REQ-013.request_boundary로 구분한다 실행 파라미터 원값은 일반 재개 상태에 복제하지 않고 REQ-005.execution_parameter_storage의 별도 암호화 임시 테이블 참조로 연결한다. 해당 임시본의 사용 차단·삭제는 그 정본을 따르며 감사/조회 결과 보존이나 조사 보호로 기한을 늘리지 않는다(ADR-025)."
    acceptance: "대화 세션에 미종결 턴이 있으면 삭제하지 않고 취소·중단 안내를 제공하며, 모든 턴 종결 확인 후에만 논리 삭제한다. 삭제 성공과 같은 세션의 새 실행 접수가 동시에 성립하지 않는다. 사용자가 이력 삭제를 요청해도 표시 상태만 바뀌고 감사 열람은 유지된다. 완료·실패·중단된 시도와 무효화된 회차의 실행용 재개 상태는 사용할 수 없고 정리된다. 정리 실패나 지연 중에도 재사용되지 않으며 이전 시도 정리가 새 시도 데이터를 지우지 않는다. 감사 이력은 각 보존 정책을 따르고, 재개 상태에 평문 조회 결과·API 응답을 담거나 대기·재시도로 원문 보존 기한을 연장하지 않는다 질의·응답 본문과 그 사본에는 conversation_body_retention의 기본 7일·만료 접근 차단·일일 파기를 적용한다. YAML 수정·배포로 새 자료의 기간을 변경하며 관리자 화면은 읽기 전용이다. 메타데이터·사용량은 본문과 별도로 보관한다."
    conversation_body_retention:
      scope: "대화·턴에 저장하는 사용자 질의/추가 입력과 모델 응답 본문을 대상으로 한다. 동일 내용이 포함된 실제 모델 입력·프롬프트·감사/증거 사본·실행용 메시지/체크포인트·자동 생성 요약/미리보기/검색 색인도 본문 정책을 우회해 보관하지 않는다. 본문과 별도로 사용자·시각·처리 결과·상태 전이·사용량·개인정보 판정/검토 등 감사 메타데이터를 관리한다. 사용자가 명시적으로 별도 저장한 즐겨찾기 질의·저장된 조회의 정의는 REQ-201·202의 독립 자산 보관 정책을 따르며 이 본문 자동 파기 대상으로 전환하지 않는다. 자산 저장이 원 대화/감사 본문의 기한을 늘리지 않으며 자동 사본을 독립 자산으로 간주하지 않는다. 조회 결과 마스킹 사본의 정본은 REQ-107.retention_policy다"
      duration: "질의·응답 본문 기본 보관 기간은 7일(7×24시간)이며 YAML의 전역 설정으로 관리한다. 0·음수·무기한은 허용하지 않는다. 조회 결과 보관 기간과 독립된 설정 항목이며 각각 기본 7일이다. 고객사별 조정은 CON-032의 합의와 YAML 수정·배포로 적용하고 운영 화면에는 현재 로드된 기간·기본값·원천·적용 시점을 읽기 전용으로 표시한다(REQ-614). 본문 기본값이 정해졌으므로 고객별 조정 전에도 기본 정책과 일일 파기를 적용한다"
      expiry: "사용자 입력은 서버 접수 시각, 모델 응답은 해당 응답 본문 최초 저장 시각부터 기산하고 해당 정책/버전·기준/만료 시각을 기록한다. 읽기·재접속·논리 삭제·검토·대기·재시도·기존 본문의 시스템 복사/재주입으로 원래 기한을 늘리지 않는다. 여러 원자료를 포함한 사본/요약은 해당 부분의 원래 기한을 승계하고 분리할 수 없으면 가장 이른 기한을 적용한다. 설정 변경은 적용 뒤 새로 접수/생성한 본문부터 적용하며 기존 자료 기한의 소급 변경은 별도 명시적 정책 변경으로 다룬다"
      access: "기한이 지나면 배치 실행 전이라도 본문 일반 열람·검색/미리보기·다운로드·모델 맥락 재주입·원 질의 새 턴 요청에 사용하지 않는다. 본문 만료를 안내하고 남은 메타데이터만 제공한다. 계속 처리·사용자대기는 필요한 입력의 잔여 기한 안에서만 허용하며 실행 중이라는 이유로 기한을 자동 연장하지 않는다. 조사 보호 중에는 권한 있는 감사 목적 열람만 허용한다"
      purge: "매일 1회 agent 소유 파기 배치가 만료됐고 유효 조사 보호가 없는 본문과 그 사본을 파기한다. 본문 없는 감사 메타데이터·사용량을 일괄 7일 삭제하지 않는다. 개인정보 의심·미검출·판단 불명과 사용자 논리 삭제 여부에 관계없이 같은 본문 정책을 적용한다. 실패·지연은 운영 경고와 재처리 대상으로 남기며 접근 차단을 해제하지 않는다. 배치 등록·청크 처리·중단은 기존 system 스케줄 화면과 RetentionPurger를 재사용한다"
      hold: "실제 조사에 필요한 본문의 보호·범위·담당자·사유·설정/해제·원래 만료 시각과 파기 직전 재검사는 REQ-107.retention_policy.investigation_hold·release 원칙을 따른다. 의심 표식·단순 검토만으로 보호하지 않고 마지막 유효 보호 해제 뒤에는 원래 기한을 적용한다. 실행용 재개 상태와 REQ-005의 원값 임시 보관 기한은 조사 보호로 연장하지 않는다"
      copies: "일반 애플리케이션 로그·판정 근거·검토 의견에 자유 문장 본문을 복사하지 않고 통제된 본문 참조를 사용한다. Hub 관리 저장소·캐시·색인·증거/프롬프트 사본의 기한과 파기 범위를 추적하고 백업 복구 시 만료 자료가 다시 일반 제공되지 않게 한다. 백업의 순환 폐기·외부 모델 공급자의 보존/삭제는 별도 운영·공급 계약으로 확인하며 Hub 배치가 외부 공급자 보관분까지 삭제했다고 표시하지 않는다"
    verification_conversation_body:
      - { case: "기본값과 YAML 변경·관리자 설정 조회", expected: "본문과 조회 결과가 별도 항목으로 각각 기본 7일이며 화면에서 수정할 수 없다. 배포로 새 설정을 적용해도 기존 자료의 만료 시각은 자동 변경되지 않는다" }
      - { case: "본문 접수/최초 저장 7일 경과·일일 배치 실행 전", expected: "본문 일반 열람·검색·맥락 재주입·재요청이 차단되고 해당 본문을 포함하는 사본도 같은 기한을 적용한다. 사용자·시각·사용량 등 별도 감사 메타데이터는 유지된다" }
      - { case: "개인정보 의심 또는 사용자 논리 삭제 표시된 본문", expected: "표식/삭제 표시만으로 기간이 늘어나거나 즉시 물리 삭제되지 않는다. 만료 시 동일하게 일반 접근을 차단하고 일일 파기한다" }
      - { case: "명시적 조사 보호·해제·파기 실패", expected: "보호 중 필요한 감사 열람만 허용하며 해제 뒤 원래 기한을 따른다. 실패는 경고·재처리되지만 일반 접근을 다시 허용하지 않는다" }
      - { case: "여러 본문 혼합 요약·프롬프트 사본·백업 복구", expected: "원자료 기한을 추적하고 분리 불가 사본은 가장 이른 기한을 적용한다. 원문 파기 뒤 사본/색인/복구본을 통해 다시 제공하지 않는다" }
    session_deletion:
      condition: "본인 대화 세션의 모든 현재 턴/시도가 완료·실패·중단 등 종결 상태일 때만 논리 삭제한다. 접수·개인 순서 대기·선택/인계·처리 중·사용자대기와 중단 처리 중은 미종결로 판단한다"
      interaction: "미종결 턴이 있으면 세션을 삭제하지 않고 먼저 취소·중단하도록 안내한다. 사용자의 명시적 취소·중단 요청은 REQ-036·REQ-013 등의 기존 규칙을 따르며 실제 종결을 확인한 뒤 삭제할 수 있다. 삭제 요청 자체를 완료된 취소·중단으로 처리하지 않는다"
      expiry: "사용자대기 만료는 기존 상태 전이로 종결한다. 시간 경과만으로 모든 턴 종결을 추정하지 않으며 서버가 실제 종결을 확인해야 한다. 모든 턴이 종결돼도 사용자의 삭제 요청 없이 자동으로 논리 삭제하지 않는다"
      concurrency: "삭제 직전에 서버가 소유권과 세션 내 전체 현재 턴/시도의 종결 여부를 다시 검사한다. 삭제와 신규 접수·재시도·이어가기의 경합을 제어해 삭제가 먼저 확정되면 해당 삭제 세션에 새 실행을 접수하지 않고, 미종결 턴이 먼저 생기면 삭제를 거부한다"
      retention: "논리 삭제는 사용자 목록의 표시만 바꾼다. 감사·사용량·이미 수행한 외부 업무 사실의 기록은 기존 보존 정책에 따라 유지하며 외부 업무의 취소·롤백을 뜻하지 않는다"
    summary: "대화 이력의 사용자 삭제는 논리 삭제이고 감사 이력의 물리 파기는 보존 정책을 따른다. 실행용 재개 상태는 완료·실패·중단 및 회차 무효화 시 사용을 차단하고 정리하며, 이 때문에 재시도에 필요한 원 질의나 감사 이력을 함께 지우지 않는다 질의·응답 본문은 기본 7일을 적용하고 만료 후 접근 차단·일일 파기하며 별도 감사 메타데이터와 구분한다."
    intent:
      problem: "사용자가 대화를 지우면 감사 대상 기록까지 사라지고, 재개 상태가 오래 남으면 원문 보존 정책을 우회하는 저장소가 된다"
      goal: "사용자 화면에서는 지울 수 있게 하되 감사 근거는 남기고, 재개 상태는 필요한 동안만 둔다"
      not:
        - "개인정보 삭제 요청(정보주체 권리) 처리가 아니다 — 법적 파기 요구는 고객사 법무 절차(CON-032)를 따른다"
        - "사용자가 감사 기록을 지우는 경로가 아니다"
    goal_trace: [ECO-05]
    decider: "제품 오너(사용자). 보관 기간은 고객사 ACT-011(CON-032)"
    preconditions:
      - "본문은 conversation_body_retention의 기본값을 적용하며 고객사 조정값과 별도 감사 메타데이터 보관·파기 정책은 CON-032로 합의한다"
      - "재개 상태에 담는 조회 결과·API 응답의 마스킹 사본을 만들 수 있다(REQ-111·PRN-07)"
    data:
      - { item: "대화 이력의 표시 여부 플래그와 삭제 표시 시각", origin: "portal 사용자 조작", sensitivity: "일반", retention: "대화 이력 보관 기간(yml)" }
      - { item: "실행용 재개 상태(시도·회차에 속한 메시지·도구 결과의 마스킹 사본)", origin: "agent", sensitivity: "업무 데이터 값은 마스킹 사본", retention: "완료·실패·중단된 시도 및 무효화된 회차는 사용 차단·정리 · 원문 보존 기한을 넘지 않음" }
    business_rules:
      - "2026-10-14 사용자 결정(ADR-024): 조회 결과 마스킹 사본은 REQ-107.retention_policy의 양의 유한 기간 동안 AI 전용 공용 DB에 보존한다. 턴의 진행·대기·완료·실패·중단과 독립된 수명이며 미보존 설정과 턴 종료 즉시 원문 삭제는 폐지한다. 대량 데이터·다중 인스턴스에서 결과 참조를 공유하고 세션 메모리나 Redis를 유일한 저장 원천으로 두지 않는다"
      - "사용자대기·실행 점유 만료를 포함해 완료·실패·중단으로 종결된 원 턴과 그 시도는 실행에 재사용하지 않는다. 실행용 체크포인트와 이어가기 자격은 즉시 무효화·정리하되 별도 결과 사본과 감사 이력은 함께 삭제하지 않는다. 결과는 원래 기한까지 남아 재접속·명시적 과거 결과 참조에 쓰일 수 있지만 종결된 실행을 재개시키지는 않는다. 원문 만료 시 일반 사용 차단·일일 파기·조사 보호는 REQ-107.retention_policy를 따른다"
      - "턴/스텝 현재 상태와 불변 전이 이력의 저장은 REQ-107.history_storage를 따르며 필수 감사 메타데이터는 별도 보관 정책, 실제 모델 전송분에 포함된 본문·원 질의는 conversation_body_retention을 따른다. 다른 agent 인스턴스는 유효 대기·현재 시도/회차/점유·권한·결과 기한을 확인해 같은 결과로 이어간다. 원 질의의 새 턴 요청은 이전 실행 상태·승인·결과를 자동 승계하지 않으며, 사용자가 과거 결과 가공을 명시 요청한 경우 REQ-002·106의 새 요청 경로로 구분한다"
      - "사용자의 대화 이력 삭제는 표시 여부 플래그만 바꾼다. admin은 현재 감사 권한과 보관 기한 안에서 삭제 표시된 이력을 조회한다"
      - "대화 이력·감사 이력의 물리 삭제는 보관 기간 정책에 따른 시스템 일괄 처리로만 한다. **배치 관리는 system 스케줄 배치 화면(FEAT-508)을 그대로 쓰고 새 메뉴를 만들지 않는다** — 대화 이력을 소유한 agent 모듈에 파기용 BatchJob 빈을 추가하면 스케줄 화면의 BEAN_ID 목록에 나타나고, 청크 분할·중단은 공통 RetentionPurger를 재사용한다(원문 사본 파기 REQ-107과 같은 방식)"
      - "실행용 재개 상태의 무효화·정리는 agent가 소유한다. 완료·실패·중단이 확정된 시도와 무효화된 회차를 대상으로 하며, 감사 이력 보존 기간이 끝날 때까지 정리를 미루지 않는다. 유효한 사용자대기나 브라우저 이탈 자체를 중단·정리 사유로 삼지 않는다(REQ-040)"
      - "실행용 재개 상태의 물리 정리가 지연·실패해도 즉시 실행 입력으로 사용할 수 없게 한다. 정리 대상은 턴뿐 아니라 시도·회차까지 식별해 새 시도 데이터를 보호하며, agent는 정리 실패를 재처리하고 운영 경고로 드러낸다. 정리 주기·완료 지연 목표는 P2에서 정한다"
      - "재시도에 필요한 원 질의와 중단 사유·시각·승인·실행·사용량 이력은 REQ-107의 저장 범위와 각 보존 정책을 따른다. 체크포인트 전체를 감사용이라는 이유로 복사해 원문 보존 정책을 우회하지 않는다"
      - "조회 결과 원문과 필요한 증거의 보존·조사 보호·파기는 REQ-107.retention_policy를 따른다. 완료·실패·중단으로 실행용 재개 상태를 정리해도 별도 보존 중인 조회 결과를 함께 삭제하지 않는다. 조사 보호는 감사·증거 보존에만 적용하며 실행용 체크포인트의 수명·유효성을 연장하지 않는다. 대기·재시도로 원문 보존 기한을 연장하지 않는다"
      - "2026-10-14 변경된 원문 기한 안에서도 사용자대기 선행 만료 조건을 유지한다. 장기 사용자대기를 위한 별도 보존 연장·만료 후 이어가기 흐름을 만들지 않는다. 승인·추가 정보·계획 확인의 대기 만료는 기존 상태 전이를 사용한다. 대기 만료가 필요한 결과의 보존 기한보다 앞서도록 설정·카드 발급 조건을 검증한다. 소스별로 더 짧은 기한을 적용하거나 여러 소스가 섞여도 이 조건을 지킨다. 이미 오래 처리된 결과도 카드 발급 당시 남은 기한으로 판정한다. 다음 작업의 입력 유효성을 시작 전 확인하고 만료된 결과에 의존하는 처리는 진행하지 않는다. 읽기·처리 중 만료와 파기의 경합·제한된 실행 구간은 P3에서 설계하며 처리 중이라는 이유로 원래 기한을 연장하지 않는다"
      - "원 질의의 재요청은 모든 상태에서 원본 참조를 가진 새 턴으로 접수하며 원 턴의 진행/기한·종결·시간·감사/메시지는 유지한다. 원 턴/시도/회차 정리로 재시도 턴의 실행 상태·참조·감사를 지우지 않는다. 참조가 있다는 사실로 결과 보존 기한을 연장하지 않고 삭제/권한/파기로 원본 조회가 불가하면 허용된 참조와 안내만 제공한다"
    exceptions:
      - "공정 단계의 예외는 PRC-02-04가 갖는다"
    lifecycle:
      - { state: 표시, next: [삭제 표시], note: "사용자 대화 목록에 보인다" }
