      - { kind: 정상, case: "인스턴스 A가 결과 사본을 DB에 보존하고 추가 정보를 기다린다. B가 현재 시도·점유·권한·기한을 확인해 이어간다. 완료 후 실행용 체크포인트는 정리하지만 결과 사본은 기한까지 남아 최종 폴링·재접속으로 표시한다" }
      - { kind: 정상, case: "사용자가 채팅에서 9월 대화 하나를 지우면 자기 목록에서는 사라지지만, 감사 담당자는 admin 대화 이력에서 '삭제 표시'와 함께 본다. 본문은 보관 기한 안에서만 열람한다" }
      - { kind: 예외, case: "되돌림으로 2회차가 시작되면 1회차의 재개 상태는 턴이 끝나기 전에 정리되고, 턴이 끝나면 2회차 재개 상태도 정리된다" }
      - { kind: 예외, case: "승인 응답 없이 대기가 만료되면 현재 시도를 중단하고 그 시도의 실행용 재개 상태를 사용할 수 없게 한다. 원 질의·만료 사유·감사 이력은 보존 정책에 따라 남기고, 사용자가 재시도를 요청하면 이전 승인·체크포인트 없이 첫 단계부터 새 시도로 처리한다" }
      - { kind: 예외, case: "장애로 중단된 시도 A의 정리 작업이 지연된 동안 새 시도 B가 시작돼도 A의 데이터는 재사용하지 않는다. 정리 재처리는 A만 지우며 B의 재개 상태와 보존 대상 감사 이력은 지우지 않는다" }
    volatility: { level: medium, what: "보관 기간은 고객사 규제마다 다르다. 논리 삭제 원칙은 고정한다" }
    open:
