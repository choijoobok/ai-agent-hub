      - "@defer P3 — 세션 삭제의 소유권·전체 턴 종결 검사와 신규 접수·재시도·이어가기 경합 제어의 저장/트랜잭션 계약, 중단 안내·종결 확인 UI와 시험을 구체화한다. 사용자별 한도 잠금과의 순서도 함께 검토한다"
      - "@defer P2 — 재접속 시 보존된 마스킹 결과를 표시하는 범위와 권한 확인·만료/파기/마스킹 사본 생성 불가 안내 계약을 REQ-016·REQ-040에 연결한다. 원문 보존은 평문 표시 캐시나 이전 실행 재개를 허용하는 결정이 아니며, 마스킹된 값을 복원하거나 재접속만으로 원천을 다시 조회하지 않는다. 현재 유효한 승인 카드의 실제 파라미터 표시는 REQ-005의 암호화 임시본·현재 권한·기한 검사 경로를 따른다"
      - "@defer P2 — DB 결과 사본의 분할 저장·읽기·참조 구조와 체크포인트의 참조 분리를 정한다. 완료·실패·중단·회차 무효화 시 실행용 상태 정리와 결과 만료 후 일일 파기를 구별하고 정리 지연·실패 재처리·운영 경고를 설계한다"
      - "@defer P2 — 사용자대기 만료가 필요한 결과의 보존 기한보다 앞서는지 설정과 카드 발급 시 검증한다. 소스별 짧은 보존·혼합 소스에서 조건을 만족할 수 없을 때는 카드 발급·설정을 허용하지 않고 안내하는 계약을 구체화한다. 만료된 데이터로 이어가거나 기한을 자동 연장하지 않는다"
