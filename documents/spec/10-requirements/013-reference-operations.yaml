    result_handling_guide:
      content: "내부 빈 커스텀 도구에도 REQ-608.result_handling_guide와 같은 범주의 공통 자연어 안내를 관리한다. 도구 계약의 결과 의미·접수/완료·결과 확인 방법·권장 시간에 따라 결과별 안내·질문 조건·사용자 선택별 등록 후속 작업/종료·입력 확보·수동 확인 방법을 설명한다"
      api_reference: "등록 API 기반 도구는 REQ-608의 해당 API 공통 가이드와 계약 버전을 참조하고 도구 관리에 사본을 만들지 않는다. 내부 빈은 REQ-114의 검증된 계약을 참조하며 업무별 차이는 REQ-303의 지식-도구 매핑 설명에 둔다"
      change_control: "가이드/원천 참조 변경은 도구 전체 직접 저장·기대 버전/기술 참조 검증·전체 이력 대상이다. 실제 실행은 사용한 계약/가이드 버전을 기록한다. 연결 지식 의미 검토·보완 작업은 생성하지 않는다."
      controls: "모델 전달·사용자 응답 처리·허용 후속 작업은 REQ-009.result_dialogue를 따르며 REQ-608.result_handling_guide.controls와 같은 기존 통제를 유지한다. 커스텀 구현이나 설명으로 별도 직접 실행·재전송·자동 폴링 경로를 만들지 않는다"
