        used_for: "개인 저장 조회와 대시보드 실행 부하·반복 실패 제어"
      - attribute_group: "읽기 전용 유효값"
        used_for: "관리자가 대상별 최종 적용값과 전역 기본값/개별 예외값 중 적용 원천을 확인하며 변경은 YAML 수정·배포로 수행한다"
    consumers:
      - where: "기존 시스템 환경설정"
        when: "지원 운영값 확인·변경 시"
        how: "기존 단일 그리드·조회·저장·기본값 복원을 사용한다. 항목의 단위·범위·적용 시점은 속성 설명과 소유 기능 요건을 따른다"
      - where: "agent·portal"
        when: "실행·폴링·저장 조회 시"
        how: "설정별 관련 요구사항의 유효 설정·적용 시점을 따른다. 모든 설정을 턴 시작에 일괄 고정하거나 진행 중 턴에 일괄 덮어쓰지 않는다"
    business_rules:
      - "고정된 보안 통제·쿼터 산식을 임의 설정으로 바꾸지 않는다"
      - "NFR-013에 따라 턴 전체 시간·턴당 누적 토큰 강제 종료 상한은 설정 항목으로 제공하지 않는다. 스텝 상한·개별 호출 타임아웃과 NFR-023의 개인별 동시 턴 한도는 별도로 관리한다"
      - "처리 중 스텝 LLM 호출 전 개인 쿼터 재검사는 시스템 공통 불리언 설정으로 관리하며 기본은 비활성화(false)다. 비활성화는 시작 전 검사·사용량 기록·보안 통제를 끄는 것이 아니다. 집행·초과 처리·설정 적용 경계의 정본은 NFR-012를 따른다"
      - "원문 사본은 REQ-107.retention_policy에 따라 모든 대상에 양의 유한 기간을 적용한다. 기본 7일이며 미보존·0·음수·무기한 설정을 거부한다. 기한·조사 보호·일일 파기는 같은 정본을 따른다. 보존 기간의 전역 기본값과 데이터소스·대상 시스템별 예외값은 모두 YAML에서 설정한다. SCR-017 등 소유 조회 화면은 대상별 최종 적용 정책과 적용 원천을 읽기 전용으로 조회하고 변경은 YAML 수정·배포로 수행한다. 재개 상태의 데이터 보존 제약과 중단·종결 시 정리는 REQ-109를 따르며, 이 제약을 별도의 재개 원문 보관 기간 편집 기능으로 해석하지 않는다"
      - "사용자대기·승인 유효 시간·실행 점유 시간은 처리를 언제까지 기다리거나 실행할 수 있는지 정하는 운영값이다. 정책 재판정 기준 시간은 오래 대기한 뒤 권한·정책을 다시 확인하는 기준이며 턴 만료 시간이 아니다. 이 값들을 바꿔 데이터 보존 기한을 연장하지 않는다. 사용자대기 만료와 원문 보존 기한의 선후 조건은 REQ-109를 검증하며 조사 자료 삭제 유예는 REQ-110의 별도 정책이다"
      - "설정별 기존 적용 규칙이 우선이며 모든 값을 즉시 진행 중 턴에 덮어쓰지 않는다. 기존 시스템 환경설정의 기본값·적용값 표시를 그대로 사용하며 별도 인스턴스 로드 관측 탭을 추가하지 않는다"
      - "미지원 키·자료형/범위 오류·상호 제약 위반은 적용하지 않고 오류 위치를 알려 준다. system 설정 관리(REQ-506)의 구현을 별도 admin 설정 저장소로 복제하라는 요구가 아니다"
      - "관리자 간 권한·자산 변경 승인 사용/미사용 설정은 철회한다. Portal 사용자 신청은 관리자 승인 경로를 유지하며 실제 실행 사용자 확인 설정은 각 소유 계약을 따른다."
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "yml 원문 보존 기간이 7일이면 SCR-017 등 소유 조회 화면에는 현재 적용값 7일을 읽기 전용으로 표시한다. 설정 변경 요청으로 5일이나 30일을 보내도 변경하지 않는다"
    lifecycle: "설정 변경·기본값 복원은 기존 system 동작을 유지한다. 소비자는 항목별 적용 경계에서 작업 단위로 값을 고정하며 설정 변경으로 과거 요청/실행의 근거를 덮어쓰지 않는다. 배포 설정은 기존 적용 경계를 따른다"
    permissions:
      - "기존 CONFIG_MGMT 메뉴·조회/저장 액션 권한으로 설정을 관리한다. admin 자산 관리 권한만으로 시스템 설정을 변경할 수 없으며 새로운 전용 설정 액션을 추가하지 않는다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "설정 자체는 현재 system의 값 저장·등록/수정자·시각·기본값 복원 범위를 재사용한다. system 설정 변경 이력이나 전역 설정 버전 기능을 추가하지 않는다. 처리 당시 사용한 설정값·승인 방식과 실패 근거는 소유 요청/실행 기록에 남기며 자산의 기준/결과 리비전과 실행 당시 정확 버전 기록은 유지한다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "시스템 운영용 LLM 공급 경로·모델·effort는 REQ-602의 별도 역할 설정을 참조한다. 일반 설정 화면에 중복 정본이나 API 키 원문을 만들지 않는다"
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "참조 변경·사용 중지·적용 시점이 후속 실행과 이력을 깨뜨리지 않는지 설계·시험에서 검증한다"
