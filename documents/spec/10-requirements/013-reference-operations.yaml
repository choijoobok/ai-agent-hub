    examples:
      - kind: "정상"
        case: "전화번호 컬럼과 API phone 경로가 동일 전화번호 마스킹 변환 정의를 참조한다"
      - kind: "정상"
        case: "전화번호의 고객지원 그룹은 원본 열람, 영업·배송 그룹은 마스킹 열람, 정산 그룹은 접근 제한으로 정한다. 영업과 배송에는 모두 같은 전화번호 변환을 적용하며 그룹별로 가리는 위치나 강도를 나누지 않는다"
      - kind: "정상"
        case: "영업·고객지원 그룹에 함께 속한 사용자는 전화번호 원본을 열람하고 영업·정산 그룹에 함께 속한 사용자는 마스킹된 전화번호를 열람한다. 정산 그룹의 접근 제한이 다른 그룹의 열람 허용을 취소하지 않는다"
      - kind: "예외"
        case: "정산 그룹만 가진 사용자가 허용된 고객번호와 제한된 전화번호를 요청하면 전화번호의 실제 값이나 일부 값을 제공하지 않는다. 전화번호를 제외한 조회가 완료되면 고객번호 결과와 정보 부재 안내를 제공하고 내부 이력에는 제한 사유를 남긴다"
      - kind: "예외"
        case: "기본 필터 해제 요청을 행 스코프 해제로 처리하려 하면 허용하지 않고 권한 조건을 유지한다"
      - kind: "정상"
        case: "사용자 u17의 회사 C1·조직 O10·업무 T100 권한을 각각 IN 서브쿼리로 등록하면 세 권한을 모두 만족하는 데이터만 조회한다. 회사만 일치하고 조직 또는 업무가 다른 행은 나오지 않는다"
      - kind: "정상"
        case: "취소·삭제·활성 상태 필터가 있는 주문에서 '취소된 것도 포함해'라고 요청하면 해제 허용된 취소 필터만 제외한다. 삭제된 주문과 비활성 주문 및 다른 회사·조직·업무의 주문은 계속 제외된다"
      - kind: "예외"
        case: "기본 필터 제외 목록에 회사 권한 규칙이나 다른 테이블의 취소 필터를 넣으면 실행하지 않는다. 모델 SQL의 OR 1=1도 서버의 모든 행 스코프를 무력화하지 못한다"
      - kind: "예외"
        case: "명세 수신 후 필터가 변경되거나 해제 불가로 바뀌면 이전 제외 허용을 재사용하지 않는다. 새 명세로 계획을 재구성하고 권한 조건은 유지한다"
      - kind: "예외"
        case: "취소 필터 제외 명세가 있어도 모델 SQL에 취소 제외 조건이 남아 있으면 사용자 의도와 맞게 재작성한다. 삭제 제외 조건까지 임의 삭제하지 않는다"
    query_constraint_verification:
      - case: "출고일 기간 필수·최대 31일을 등록한 예시 테이블에서 10월 1~31일 요청"
        expected: "등록한 경계·시간대 기준으로 범위를 검증하고 실제 SQL/바인딩도 충족하면 실행 가능하다. 31일은 이 시험의 설정값이지 제품 기본값이 아니다"
      - case: "같은 예시 테이블에서 기간 누락·시작일만 입력·역전·NULL·잘못된 날짜·32일 요청"
        expected: "누락/무효/최대 초과를 구분하고 실행하지 않는다. 임의 7일·31일 삽입이나 자동 분할로 통과시키지 않는다"
      - case: "시간대 경계·월말 접수 후 다음 달까지 대기한 이번 달 요청·최대 범위와 같은 값/초과 값"
        expected: "등록된 단위·경계와 입력 접수 기준으로 판정하며 계획에 표시한 구체 기간과 SQL 바인딩이 같다. 대기/재작성만으로 다음 달 기간으로 바꾸거나 날짜 문자열의 겉모양 비교로 초과 구간을 통과시키지 않는다"
      - case: "등록한 복합 식별키의 정확한 한 건 조회와 일부 키·부분 일치·여러 키 목록·분기/상관 조회로 분산한 복수 키"
        expected: "등록한 전체 키의 유효한 단일 동등 조건만 연결된 기간 제약을 대체한다. 집합 연산의 서로 다른 키 값이나 외부 여러 행의 키를 상관 조건/후속 조회로 전달하는 우회, 미등록 예외와 다른 제약의 면제는 거부한다"
      - case: "자기조인 한 별칭·집합 연산 한 분기의 기간 누락 또는 OR로 기간 밖 행 허용"
        expected: "각 객체 참조의 제한을 검증해 우회 SQL을 실행하지 않는다. 결과 행 제한이나 외부 조인 뒤의 무관 조건으로 충족을 대신하지 않는다"
      - case: "두 데이터소스의 테이블 중 한쪽만 기간 조건 충족"
        expected: "충족하지 않은 조회를 실행하지 않고 요청 전체를 처리 가능한 것으로 표시하지 않는다. 다른 원천의 제한을 대신 적용하지 않는다"
      - case: "제약 없음과 미검수/무효 컬럼/지원 불가 규칙"
        expected: "검수된 제약 없음만 제한 없이 다음 통제로 진행한다. 오류를 없음으로 간주하지 않고 권한 밖 컬럼 정보도 주입하지 않는다"
      - case: "계획 확인 뒤 기본 필터 제외·조건 변경 또는 생성 SQL에서 조건 누락"
        expected: "최종 SQL·바인딩을 다시 검증하고 필수 제약 면제를 거부한다. 정책 위반을 구문 오류 자동 재작성으로 처리하지 않는다"
      - case: "인증 예제·저장 조회·워크플로우 조회와 턴 내 카탈로그 버전 변경"
        expected: "동일 실행 검증 경로를 사용하고 카탈로그 참조 버전과 현재 조회 정책 리비전을 구분한다. 저장 조회 새 실행에는 그때 유효한 제약을 적용한다"
      - case: "자동 구조 수집·제약 완화/삭제 후보·검수 전 지식의 예외 문구"
        expected: "수집/문구로 운영 제약을 바꾸지 않는다. 정책 관리의 변경 권한·검수·적용 상태와 정책 리비전 이력에 따라 효력이 생기며 카탈로그 복원으로 정책을 덮지 않는다"
      - case: "두 파라미터 값 검증은 통과했으나 SQL에 기간 컬럼 조건 누락/다른 값 바인딩"
        expected: "최종 조건/바인딩 불일치로 실행하지 않는다"
      - case: "검증식이 거짓인 요청을 WHERE 조건으로만 제한"
        expected: "SQL 실행 전 검증 오류/추가 질문으로 반환하고 빈 정상 조회로 처리하지 않는다"
      - case: "카탈로그 과거 버전 복원과 현재 조회 제약 변경"
        expected: "현재 정책을 복원본으로 덮지 않고 해당 카탈로그의 유효 정책을 새 실행에 재검증한다"
    volatility:
