# 영역: 기준정보 정책·도구·단가·운영·평가·Portal 이용자
requirements:
  - id: REQ-611
    column_group_boundary: "컬럼의 접근 그룹은 REQ-103.column_group_exclusions의 테이블 승계·제외로 결정한다. 이 결과 안에서 기존 원본/마스킹/접근 제한 처리를 적용하며 직접 열람 모드 설정으로 제외 그룹이나 테이블 밖 그룹의 접근을 되살리지 않는다. API 응답 경로의 기존 정책은 유지한다"
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — REQ-103·REQ-105·REQ-106·REQ-111·FEAT-007~009·FEAT-012·FEAT-019; 2026-10-02 사용자 요청 — 복수 행 스코프의 AND 강제 적용과 기본 필터별 선택 제외를 반영; 2026-10-07 사용자 결정 — 그룹별 처리를 원본 열람·마스킹 열람·접근 제한으로 정리하고 마스킹 방식은 그룹별로 세분화하지 않는다. 같은 날 사용자 명시 요청으로 카드 전체를 확정했다"
    process_step: "PRC-13-01"
    title: "보안·조회 정책 정의와 적용 대상 매핑 관리"
    query_constraints:
      source: "2026-10-29 사용자 결정: 조회 제약을 행 스코프·필터 관리 요구사항과 SCR-009 상세 설계로 이관한다. 관리자 조건 템플릿에 두 입력 파라미터를 바인딩하고 그 값의 차이/범위를 검증하는 방식을 함께 설계한다"
      ownership: "필수 조회 제약(TRM-247)은 REQ-611·FEAT-012·SCR-009가 소유하는 조회 정책이다. 정책에서 대상 catalogId·등록 컬럼 안정 참조를 연결하며 카탈로그 내용 버전의 자식으로 저장/복사/복원하지 않는다. 관리 표면은 행 스코프·기본 필터와 통합하되 규칙 종류·강제 여부·입력값 출처를 구분한다. 지식/LLM은 규칙 수치나 예외 사본을 관리하지 않는다"
      attributes: "규칙 ID·정책 리비전·업무명·필요 이유·대상 데이터소스/카탈로그/컬럼, 조건 템플릿, 명명된 입력 파라미터의 업무명·자료형·필수/NULL·출처, 값 비교/차이 검증식·허용 범위/단위/경계, 사용자 질문 안내, 검수·적용 상태와 등록된 대체 키를 관리한다. 세부 입력 서식·지원 연산·표현식 문법·저장/공개 계약은 P3 access_policy에서 확정한다"
      supported_rules: "초기 업무 범위는 시작·종료가 필요한 기간 조건, 두 파라미터 차이의 허용 범위, 등록된 정확 식별키 대체다. 관리자에게 조건식을 작성하게 하되 허용 연산/함수와 명명 파라미터가 검증되는 템플릿으로 제한한다. 임의 프로그램 실행이나 무제한 SQL 조각을 허용하는 범용 엔진으로 확대하지 않는다. 복수 제약은 모두 충족하고 대체는 연결된 제약에만 적용한다"
      period: "기간 규칙은 기준일 컬럼·날짜/일시 형식·시간대·경계 포함/제외와 최대 범위의 값/단위를 검수된 메타데이터로 해석할 수 있어야 한다. 시작·종료 순서와 유효 범위를 검증하고 한쪽 경계만 있거나 NULL·형식 오류이면 충족으로 보지 않는다. 상대 날짜는 REQ-001.past_query_followup.amend의 요청 접수 시점·적용 시간대를 기준으로 구체화해 안내 범위와 실제 바인딩을 일치시킨다. 구체화한 기간은 대기·계획 생성·SQL 재작성 시각이 달라졌다는 이유로 재해석하지 않는다. 명시적 새 요청이나 REQ-007의 기간 변경 입력을 받으면 해당 입력 기준으로 바꾼 부분만 다시 해석·검증한다. 모든 테이블에 동일 기간이나 31일 같은 전역 기본값을 강제하지 않는다"
      exact_key_alternative: "관리자가 해당 제약의 대체로 등록·검수한 유일 식별키의 모든 구성 컬럼에 유효한 단일 값의 동등 조건을 준 경우만 기간 대체를 허용한다. 단일 값은 해당 대상의 조회 요청 전체 기준이다. 집합 연산 분기·상관 서브쿼리의 반복 평가·선행 결과 전달로 여러 키 값을 적용하는 경우를 단일 값으로 보지 않으며 하나의 고정된 전체 키임을 검증할 수 없으면 대체를 허용하지 않는다. 임의 식별자·복합 키 일부·NULL·부분 일치·와일드카드·여러 키 목록은 이 대체 조건이 아니다. 다른 제약·권한·실행 상한은 그대로 적용한다"
      management: "신규·변경·삭제·활성/검수·대체 키 변경은 REQ-611의 직접 조회 정책 관리와 정책 버전/이력 절차를 따른다. 관리 변경과 사용자 SQL 실행 승인은 별개다. 카탈로그 후보 저장/복사/과거 복원은 현재 조회 제약을 변경하지 않는다. 제약 없음은 정책 원천의 명시적 확인 상태이며 로드 실패/미검수/지원 불가는 없음이 아니다"
      context: "REQ-021의 허용 카탈로그 제공·선별에서 적용 제약과 필요한 허용 컬럼을 함께 유지한다. 테이블·컬럼 계획 후 REQ-025에 따라 이미 확보한 조건의 충족 여부를 확인하고 부족한 것만 질문한다. 제약 참조 컬럼이 권한 밖이면 존재·물리명을 노출하거나 권한을 확대하지 않고 해당 경로의 사용 불가로 처리한다"
      enforcement: "계획 단계 확인은 실제 실행 검증을 대신하지 않는다. 서버는 실행 전 현재 유효한 조회 정책과 정책 리비전을 직접 읽고 생성 SQL·인증 예제·저장 조회·워크플로우 등 공통 SQL 실행 경로 모두에서 실제 SQL과 바인딩 값이 제약을 충족하는지 검증한다. 모델이 제출한 충족 표식·계획 설명·조건 이름만으로 통과시키지 않는다"
      reference_coverage: "각 데이터소스의 SQL마다 자기조인 별칭·서브쿼리·공통 테이블 식·집합 연산 각 분기 등 실제 공개 객체 참조의 유효 조건을 확인한다. 다른 테이블의 기간이나 한 분기의 조건만으로 전체 충족을 인정하지 않는다. OR·함수·조인 위치 등으로 제한을 우회하거나 실제 적용을 입증하지 못하면 실행하지 않는다. 비공개 기반 테이블까지 새로 수집·노출하는 요구는 아니다"
      final_validation: "행 스코프·기본 필터 주입과 제외 처리 후 최종 SQL·바인딩에서도 제약 충족을 확인한다. 조건·대상·참조 버전이 바뀌면 영향받는 검증을 다시 하며 검사한 요청과 다른 요청을 실행하지 않는다. 위반·검증 불가이면 실행하지 않고 REQ-025로 부족 조건 또는 처리 불가 사유를 안내한다. 정책 거부를 REQ-037의 구문 오류 자동 재작성으로 바꾸지 않는다"
      non_waiver: "계획 확인·실행 승인·기본 필터 제외·'전체 기간으로 조회'라는 사용자 요청은 제약 면제가 아니다. 임의 기본 기간 삽입·요청 범위 축소·자동 분할 조회로 제약을 우회하지 않는다. 기간을 충족해도 저비용 조회를 보장하지 않으므로 NFR-001~003의 행·시간·결과 크기 통제를 유지한다"
      versions: "규칙은 카탈로그 내용 리비전과 독립된 정책 리비전으로 식별한다. 컨텍스트 구성·입력 확인·SQL 주입/최종 검증/실행은 같은 유효 규칙·정규화 값의 근거를 연결한다. 실행 전 정책이 변경되면 영향받는 계획/값/SQL을 재검증하며 과거 통과를 재사용하지 않는다. 저장 조회·워크플로우의 새 실행도 현재 유효 정책을 적용한다. 구체 갱신/경합 계약은 access_policy·agent·integration에서 공동 확정한다"
      audit: "적용 제약 식별자/리비전·대상 참조·조건 근거·판정/거부 이유를 해당 계획과 실행 요청에 연결한다. 조건 값의 보존·마스킹은 REQ-107·111을 따르며 원값의 무제한 로그 사본을 만들지 않는다"
      parameter_binding: "예: start/end 두 입력을 명시적으로 정의하고 start < end 및 min <= difference(end,start) <= max를 지정한 단위/시간대/경계로 판정한다. 행 스코프의 사용자 ID·회사 등은 인증 컨텍스트에서 서버가 바인딩하며 LLM/사용자 입력으로 덮지 못한다. 조회 기간 등 사용자 입력은 정규화·검증한 값을 SQL의 대응 명명 파라미터에 그대로 바인딩한다. 이름이 같다는 이유로 서로 다른 출처/테이블/규칙의 파라미터를 섞거나 문자열 치환으로 조건을 만들지 않는다"
      value_validation: "파라미터 검증은 SQL 실행 전에 수행한다. 누락/형식 오류/NULL/역전/차이 범위 위반이면 부족 값 질문 또는 오류로 반환한다. 차이 검증식을 WHERE에만 붙여 위반 요청을 빈 조회 결과로 처리하지 않는다. 달력 일수와 경과 초는 구분하고 미지원 함수/단위/표현식을 임의 해석하지 않는다"
      predicate_binding: "서버는 승인된 대상/컬럼 조건 템플릿을 실제 테이블 참조에 적용하고, 값 검증을 통과한 start/end가 그 SQL 조건에 사용되는지 확인한다. 파라미터 차이가 정상이어도 컬럼 조건 누락·다른 값 사용·OR 우회·누락 분기이면 실행하지 않는다. 각 별칭/서브쿼리/CTE/집합 분기의 조건 적용과 최종 SQL/바인딩 일치를 검증하는 책임은 유지한다"
      catalog_projection: "정책에서 target catalogId로 연결한다. 카탈로그 상단 목록은 현재 유효 QUERY_CONSTRAINT 규칙 건수를 정책 원천에서 역조회해 읽기 전용으로 표시하고 클릭 시 SCR-009를 catalogId·규칙 종류로 필터링한다. 이름 변경으로 연결이 끊기지 않으며 catalog revision에 규칙/정책 ID 목록을 복사하지 않는다. 미로드/실패/권한 제한은 0건이 아니고 정책 열람 권한 없이 상세를 노출하지 않는다. 건수/조회 상태·링크 입력 계약은 SCR-009 상세 설계에서 확정한다"
    column_exception_ui: "REQ-103.column_group_exclusions의 예외 입력은 숨김/마스킹 두 유형이고 예외 없는 테이블 허용 그룹은 원본 열람을 승계한다. 마스킹 방식은 SCR-003 컬럼 정의의 공통 변환 참조로 선택하며 그룹별 방식을 중복 설정하지 않는다. REQ-111.privacy_metadata의 저장 사본 마스킹과 열람 처리를 구분한다"
    detail: "보안 담당자는 마스킹 변환, 행 스코프, 기본 필터, 필수 조회 제약, LLM 전송 정책 및 그룹별 처리(원본 열람·마스킹 열람·접근 제한)의 정의와 적용 대상을 관리하고 유효 통제와 변경 이력을 확인할 수 있어야 한다. 마스킹 방식은 그룹별로 세분화하지 않고 대상이 참조하는 공통 변환을 사용한다. 테이블별 복수 권한 조건은 모두 적용하며, 복수 기본 필터는 사용자 요청에 따른 항목별 제외를 서버가 검증해 적용한다"
    roadmap: "RM-P1"
    acceptance: "회사·조직·담당 업무의 권한 조건을 함께 등록하면 모든 조건을 AND로 만족하는 행만 조회한다. 취소·삭제·활성 상태 기본 필터 중 취소 필터만 유효하게 제외하면 삭제·활성 상태 필터와 모든 행 스코프는 유지된다. 미등록·타 테이블·해제 불가·변경된 리비전 또는 행 스코프를 제외 대상으로 전달하면 실행하지 않는다. 그룹별 원본 열람·마스킹 열람·접근 제한을 구분하고, 같은 대상의 마스킹 열람 그룹들은 동일한 변환을 사용한다. 접근 제한 항목은 실제 값을 제공하지 않으며 해당 항목을 제외한 조회가 완료되면 정보 부재를 안내한다. 동일 마스킹 변환을 컬럼과 API 경로에서 참조하며, 과거 상태 복원에서 승인 대상과 직접 정책을 혼합 덮어쓰기하지 않는다"
    summary: "규칙 종류별 속성과 적용 위치를 분리하고 동일 규칙의 단일 원천을 참조한다"
    intent:
      problem: "행 스코프·기본 필터·조회 제약·마스킹·전송 정책을 같은 설정으로 취급하거나 여러 곳에 중복 정의하면 보안 경계가 달라진다"
      goal: "규칙 종류별 속성과 적용 위치를 분리하고 동일 규칙의 단일 원천을 참조한다"
      not:
        - "LLM이 임의 권한 조건·사용자 신원·그룹별 스코프 조합을 작성하거나 선택하는 정책 엔진이 아니다"
        - "기본 필터가 접근 권한이나 행 스코프를 대체하지 않는다"
    goal_trace:
      - "IN-06"
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
