        how: "REQ-103에 따라 당시 전체 상태와 직접/승인 변경 범위를 구분한다"
    consent_policy_link: "2026-10-14 사용자 결정: LLM 전송은 REQ-106의 요청·동의에 따른다. 테이블/컬럼/API 경로의 종전 LLM 허용 플래그만으로 전송을 승인하거나 거부하지 않는다. 접근·마스킹·행 스코프·기본 필터와 파일 반출 속성은 별개이며 과거 정책 이력은 유지한다. 기존 속성·화면의 이관은 P3에서 정한다"
    business_rules:
      - "2026-10-02 사용자 결정: 행 스코프와 기본 필터는 테이블당 각각 0..N개를 등록한다. 회사·조직·담당 업무 등 현재 유효한 행 스코프 규칙은 모두 AND로 결합한다. 각 규칙의 IN/서브쿼리 등으로 여러 허용 값을 표현할 수 있으나 규칙 사이를 OR로 넓히거나 일부만 선택하지 않는다. 실제 사용자별 허용 값은 레거시 권한 데이터가 원천이다"
      - "행 스코프는 조회 목적·사용자 지시·LLM 해석으로 동적 추가/제외하지 않는다. 모든 등록 권한 조건을 서버가 적용하며 정책 변경은 기존 관리 절차를 따른다. 바인딩은 REQ-609의 현재 유효한 대상 사용자 ID를 서버가 제공하고 LLM·요청 파라미터의 임의 ID로 대체하지 않는다. 매 접근 시점 현재 권한 판정(REQ-108)은 유지한다"
      - "권한 테이블의 중복 행 때문에 업무 결과·집계가 늘어나지 않도록 IN/EXISTS 또는 행 수 보존이 검증된 조인으로 조건을 적용한다. 필수 권한 규칙에서 사용자 허용 값이 없으면 허용 행이 없으며 해당 규칙을 생략하지 않는다. 신원 매핑 부재는 정상 0건이 아니라 조회 거부다(REQ-609)"
      - "기본 필터는 삭제 여부·취소 여부·상태 등의 항목으로 나누고, 별도 제외 요청이 없으면 모든 적용 항목을 AND로 주입한다. LLM에는 허용된 카탈로그와 함께 필터 식별자·리비전·업무 의미·기본 적용 설명·항목별 해제 허용 여부를 제공한다. 조건의 물리명은 해당 사용자의 카탈로그 허용 범위 안에서만 노출한다"
      - "사용자가 취소 이력 포함 등 기본 범위를 바꾸도록 요청하면 LLM은 해당 필터의 제외 명세를 SQL과 분리해 agent에 전달한다. 명세에는 데이터소스·테이블·필터 식별자/리비전·제외 사유·현재 사용자 요청 또는 보존된 조회 의도의 근거를 둔다. 자유 SQL 조건이나 해제 문구만으로 서버 정책을 변경하지 않는다"
      - "agent는 대상 테이블·등록 필터·현재 리비전·해제 허용 여부와 요청 근거를 검증한 항목만 제외하고 나머지 기본 필터와 모든 행 스코프는 유지한다. 미등록·타 테이블·변경된 리비전·행 스코프 대상·해제 불가 또는 근거 불명인 제외 요청은 해당 명세로 실행하지 않고 사유를 알려 명세 재구성 또는 사용자 확인으로 돌아간다. 해제 불가 항목은 유지하며 수정한 계획에서 그 사실을 알린다"
      - "모델은 관리자 기본 필터를 생성 SQL에 직접 복사하지 않고 필터 명세를 전달한다. 제외는 서버가 주입하는 해당 기본 필터에만 적용한다. 기존 생성 SQL·인증 예제에 같은 조건이 이미 있으면 임의 문자열 삭제로 해제하지 않으며 원 사용자 조건과 구별해 재작성·검증한다. '취소 건만' 같은 사용자 업무 조건은 유지한다. 실제 적용/제외 결과는 조회 계획·생성 SQL·실행 SQL과 함께 확인한다"
      - "기본 필터 명세와 제외 명세의 규칙은 인증 예제·저장된 조회·워크플로우 조회에도 동일하다. 예제의 해제 사례만으로 이번 조회의 필터를 제외하지 않는다. 저장 조회에서는 제외 명세가 REQ-202의 성공한 실행 요청과 함께 보존·복원되며 별도 SQL 실행 경로로 분리하지 않는다. 요청 재현·현재 정책 재검증과 과거 허용 판정 재사용 금지는 REQ-207을 따른다"
      - "2026-10-07 사용자 결정: 컬럼과 API 응답 경로의 그룹별 처리는 원본 열람·마스킹 열람·접근 제한 세 가지로 구분한다. 원본 열람은 값을 그대로 제공하고, 마스킹 열람은 대상이 참조하는 공통 변환을 적용한 값만 제공하며, 접근 제한은 해당 값의 열람을 허용하지 않는다. 마스킹 방식·강도·변환 설정은 그룹별로 세분화하지 않는다"
      - "여러 활성 소속 그룹의 접근 범위는 기존 합집합 원칙을 유지한다. 어느 그룹에서든 원본 열람이 허용되면 원본 열람, 원본 열람 없이 마스킹 열람만 허용되면 마스킹 열람, 어느 그룹에서도 열람을 허용하지 않으면 접근 제한으로 판정한다. 한 그룹의 접근 제한이 다른 그룹의 열람 허용을 취소하지 않는다"
      - "접근 제한 컬럼은 허용된 카탈로그와 조회 대상에서 제외하고 해당 값의 부분 마스킹으로 대신 제공하지 않는다. 제한 컬럼이 포함된 SQL은 AUTHZ-030의 검증·중립 피드백·재작성 절차를 따른다. 해당 항목을 제외한 조회가 완료되면 REQ-101에 따라 정보 부재를 안내하고 허용된 나머지 결과를 제공한다. 내부 이력에는 실제 제한 사유를 남기며 등록되지 않은 API 응답 경로의 처리는 REQ-111을 따른다"
      - "마스킹 변환 정의는 컬럼과 API 응답 경로가 공유한다. API 경로의 마스킹 여부·정보주체·전송 속성은 REQ-608 한 곳에서 등록한다. 그룹별 원본 열람 허용과 별개로 저장 사본의 개인정보 마스킹은 REQ-107·REQ-111을 유지한다"
      - "자산 접근 그룹과 직접 정책의 경계·과거 스냅샷 복원은 REQ-103을 따른다. API의 허용 그룹/응답 통제는 REQ-608, 도구는 REQ-612, 현재 변경 권한자의 직접 저장과 전체 이력은 REQ-601을 따른다"
      - "상태 변경 API의 사용자 실행 승인을 설정으로 끌 수 없다. 위험 등급·승인 강제 설정은 REQ-105의 실행 통제를 약화하지 않는다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "기본 필터 해제 요청을 행 스코프 해제로 처리하려 하면 실행을 거부하고 모든 권한 조건을 유지한다"
      - "자기조인·서브쿼리·집합 연산·외부 조인의 각 테이블 참조에서 권한 조건을 보장할 수 없거나 규칙·바인딩·제외 명세를 검증하지 못하면 조건 없이 실행하지 않는다(AUTHZ-030)"
    lifecycle: "정책 변경·과거 이력·복원은 REQ-103을 따르며 대상별 적용 상태를 보존한다"
    permissions:
      - "ACT-002의 해당 메뉴·조회/등록/수정/상태변경 액션 권한으로 관리한다. 화면 노출과 별개로 서버에서 검증한다"
      - "권한 밖 개인정보·비밀값·업무 데이터를 기준정보의 사용처 조회로 우회 열람하지 못한다"
    audit: "기존 정책·승인·월별 확정 이력과 기준정보 변경 전 스냅샷은 기존 요구사항을 따른다. 조회에는 실제 적용한 모든 행 스코프와 기본 필터, 제외/유지 판단한 필터의 식별자·리비전·사용자 요청 근거·판정 사유 및 생성/실행 SQL을 REQ-107의 이력으로 연결한다"
    volume: "고객사별 관리 항목 수·변경 빈도는 미확인이다. 기존 NFR을 임의 수치로 바꾸지 않는다"
    config:
      - "관리할 속성·원천·사용처는 이 카드의 data·field_usage·consumers를 따른다. 코드/배포 설정·관리 데이터·읽기 전용 참조를 혼합하지 않는다"
    risk: "복수 조건의 AND·IN·서브쿼리와 선택적 기본 필터 제외는 메모리 DB의 SQL 의미 검증으로 구현 가능성을 확인했다. 제품 파서·대상 DBMS별 구문/별칭/외부 조인 위치·권한 원천 조회 성능은 미검증이며 P3에서 검증해야 한다"
    relations:
      depends_on:
