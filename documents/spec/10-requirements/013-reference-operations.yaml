    source: "2026-10-31 사용자 추가 결정 — 외부 모델 하단에 적용 시작일별 수동 가격 이력, 다음 달 1일 유효 가격과 원 실적 스냅샷으로 초안 자동 구성. 2026-10-31 사용자 결정 — 월 요약을 상단에 병합, 최초 생성 정보/편집 메모, 산정 근거 탭·별도 단가 확정 제거, 같은 년월 쿼터 기준 저장 시 단가 고정. 2026-10-30 월별 USD 산정·실적 초안·수동 환산/보정 결정 유지"
    process_step: PRC-13-01
    title: "월별 토큰 풀 기준 단가와 산정 근거 관리"
    detail: "운영·비용 관리자는 년월별 총 예상 비용·비중복 토큰 합계·USD/100만 토큰 단가·초안 생성자/생성일시·메모를 한 행에서 확인한다. 외부 모델에서 관리하는 적용 시작일별 가격과 실적 스냅샷으로 산정 항목을 자동 구성한다. 하단은 산정 항목과 실적 스냅샷으로 구성하며 별도 산정 요약/근거 탭이나 단가 확정 버튼을 두지 않는다. 고정 전 월의 메모와 요금/수량·원 실적/보완 근거를 저장하고, 같은 년월 SCR-021 월 기준 저장 성공과 함께 단가 전체를 고정한다. 사용자 쿼터 배분은 별도 실행이다"
    roadmap: RM-P1
    acceptance: "최초 생성자/생성일시는 조회값이고 고정 전 메모는 그리드 셀에서 편집해 같은 월 산정 항목과 함께 저장한다. SCR-021 저장과 단가 고정은 함께 성공하거나 함께 실패하며 고정 뒤 메모/요금/수량/스냅샷/재생성을 막는다. 기준 저장만으로 개인 배정·승급 적용 월·활성 인원을 확정하지 않는다. 이후 가격/지연 계량은 잠긴 기준과 과거 배정을 바꾸지 않는다"
    summary: "월별 USD 산정 요약·최초 생성 정보·메모와 원 실적을 관리하고 쿼터 기준 저장 시 단가를 고정한다"
    intent:
      problem: "모델 요금·토큰 구성비와 적용 월을 관리하지 않으면 월 총 토큰 풀의 산정 근거를 재현할 수 없다"
      goal: "월별 산정 결과와 원 실적/보완을 재현하며 쿼터 기준 저장·개인 배분 실행을 구분한다"
      not: ["개별 호출 예상 비용·공급사 청구서·전사 예산·회계 정산 기능이 아니다","할인·이벤트·계약 특가·세금 등 모든 과금 정책을 구현하는 요금 엔진이 아니다"]
    goal_trace: ["IN-06","MET-02"]
    decider: "제품 오너(사용자). 고객사 실제 기준 값은 해당 관리 권한자가 설정한다"
    preconditions:
      - "공통 관리 범위는 REQ-601을 따르며 각 항목에서 명시한 기존 규칙을 변경하지 않는다"
      - "관리 메뉴·액션의 유효 권한으로 행위를 허용한다. 특정 역할명으로 권한을 하드코딩하지 않는다"
    data:
      - { item: "적용 월·USD/100만 단가·원 통화/USD 환산 근거·요금 출처/확인일", origin: "관리자 입력", sensitivity: "내부 비용 관리 정보", retention: "월 계획 단가·배정의 기존 이력 정책" }
      - {"item":"요금 기준: 공급 경로·모델·적용 시작일별 입력/캐시/출력 USD 단가·변경 구분/사유·출처/확인일","origin":"SCR-015에서 관리자가 확인한 가격 이력 입력","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
      - {"item":"월 산정 기준: 적용 월·용도/실제 조합/세부 단위별 USD 단가·수량·실적 스냅샷/수동 가정·완전성·관리자 보완·최초 생성자/일시·편집 메모·월 기준 저장에 따른 고정 결과","origin":"관리자 입력·Hub 산정","sensitivity":"내부 관리 정보 — 비밀값 원문 제외","retention":"기존 이력·보존 규칙 우선. 미정 항목은 REQ-601의 open 확인 대상"}
    field_usage:
      - {"attribute_group":"요금 기준","used_for":"요금의 단위와 근거를 명시하고 월 계획 계산에 참조"}
      - {"attribute_group":"월 산정 기준","used_for":"REQ-118 월 총 풀 산정의 단가 입력과 이력 재현"}
    consumers:
      - {"where":"월별 개인 쿼터 배분","when":"다음 달 총 풀 계획 시","how":"NFR-010·REQ-118의 저장/고정 단가·수동 환산/보정 산식을 사용한다"}
      - {"where":"비용 운영 대조","when":"월별 사용량 분석 시","how":"계획 단가와 공급사 대조값을 비교하되 대조 기록은 기준정보와 분리한다"}
    business_rules:
      - "최초 초안 생성자/생성일시는 생성 처리 기록에서 가져오고 수정 저장/재조회 때 바꾸지 않는다. 단가 고정자/일시와 구분한다. 메모와 산정 구성은 같은 월 저장 범위이며 고정 뒤에는 메모도 수정하지 않는다"
      - "월별 기준 단가와 쿼터 기준은 화면에서 년월 한 건으로 식별한다. 새 물리 키/API 필드를 이 요구사항으로 확정하지 않으며 비표시 자기 기준본·원 명령 식별 근거는 보존한다"
      - "단가 근거는 공급 경로·모델·세부 계량 단위다. 산정 행의 용도·effort는 소비 구성 축이며 effort에서 가격을 자동 추론하지 않는다. 동일 공개요금 근거의 단가는 일치해야 하며 현재 모델/용도 설정으로 과거 실제 호출 조합을 덮어쓰지 않는다"
      - "월별 구성비와 계획 단가 이력을 보존하며 요금 변경으로 과거 월 총 풀·배정·사용량을 소급 재계산하지 않는다"
      - "2026-10-30 사용자 결정: 기준 단가는 USD/100만 토큰으로 관리하고 월 계획 금액은 기존 고객 계획 통화를 유지한다. SCR-021에서 대상 월의 계획 통화/USD 수동 환산율과 근거를 한 번 적용한다. 원 요금이 USD가 아니면 USD 환산 근거를 먼저 확인한다. 자동 환율 수집은 제공하지 않는다"
      - "산식·초안·단가 고정은 calculation_contract와 NFR-010을, 월 예산 환산/수동 보정률은 REQ-118을 따른다. 최근 3개월 괴리율 자동 보정 제안은 실적 기반 단가 초안으로 대체한다. 기본 보정률은1.0이며 관리자의 근거 있는 수동 조정만 유지한다"
    exceptions:
      - "공정 단계의 입력·적용 실패 처리는 PRC-13을 따른다"
      - "USD 기준 단가와 계획 통화 금액을 대상 월 환산율 없이 계산하거나 환산율을 두 번 적용하면 유효하지 않은 입력으로 표시한다"
    price_history_contract:
      owner: "SCR-015 외부 모델 등록의 하단 기간별 단가 탭. 월 산정 결과와 원 실적은 SCR-016이 소유한다"
      key: "실제 공급 경로·모델·적용 시작일별 단가 한 세트. 같은 경로/모델의 effort 조합들은 같은 단가 이력을 공유하고 중복 입력하지 않는다. 표시명 또는 effort로 가격을 추론하지 않는다"
      fields: "적용 시작일(년월일), 입력·캐시 읽기·출력의 USD/100만 토큰 단가, 필요 시 별도 캐시 쓰기 단가(세부 계량 단위의 표시 투영이며 고정 물리 컬럼이 아님), 변경 구분(기본·할인·프로모션·인상·복원), 변경 사유, 요금 출처·확인일, 불변 단가 기준 식별값/리비전. 적용 종료일은 다음 시작일 전날로 표시한다"
      effective: "업무 날짜는 Asia/Seoul 기준이다. 시작일 당일부터 다음 시작일 직전까지 유효하며 마지막 행은 후속 시작일 전까지 계속 적용한다. 같은 가격 키/시작일의 현재 리비전은 하나이며 별도 신규 행 중복은 거부한다. 종료일은 직접 입력하지 않는다. 기간 한정 할인은 할인 시작 행과 종료 다음 날의 복원 가격 행을 함께 등록하며 이전 가격으로 자동 복귀한다고 추정하지 않는다"
      selection: "대상 월 1일 이하의 시작일 중 가장 늦은 한 세트를 선택한다. 생성 당일이나 실적 발생일의 단가를 쓰지 않으며 대상 월 1일 뒤의 예약 가격은 제외한다. 월중 변경을 일수/사용량으로 가중하지 않는다. 이는 월 계획 단가의 규칙이며 실제 청구 정산 규칙이 아니다"
      validation: "지원하는 계량 단위의 가격은 유한한 0 이상이며 0은 출처로 확인한 무료일 때만 입력한다. 해당 없음·미등록·조회 실패를 0으로 바꾸지 않는다. 입력은 비캐시 입력, 기본 캐시는 캐시 읽기이며 캐시 쓰기/기타 다른 과금 단위에 그 값을 재사용하지 않는다. 필요한 단위/환산 근거가 없으면 월 산정 미완료다. 등록 조합은 가격 이력이 없어도 관리할 수 있으나 유효 단가 산정은 별개다"
      history: "단가 변경은 REQ-601.change_history와 SCR-051에서 당시 전체 구성을 재현한다. 이미 적용이 시작된 가격은 수정/삭제하지 않고 새 시작일 행으로 변경한다. 신규 시작일은 저장일 이후(당일 포함)이며 과거로 소급 등록하지 않는다. 미래 가격은 초안이 참조했어도 새 리비전으로 정정/예약 취소할 수 있다. 이전 리비전과 기존 초안의 가격 스냅샷은 그대로 보존하고 취소는 현재 선택 대상에서만 제외한다. 기존 초안은 명시 재생성/재선택 또는 최초 고정 전 비교·재확인으로만 바꾼다. 같은 가격 키를 쓰는 다른 effort 조합·월 근거를 함께 검사하고 등록 삭제로 가격 이력을 우회 제거하지 않는다"
      boundary: "관리자가 확인한 할인·프로모션·인상 가격을 수동 등록한다. 가격/환율 자동 수집, 할인 조건 판정·세금/구독료·실시간 호출 청구 계산은 제공하지 않는다. 비USD 요금은 USD 환산값과 근거를 등록하며 월 예산 통화 환산은 SCR-021에서 별도로 한 번 수행한다"
    calculation_contract:
      row_unit: "소유 월·용도·외부 모델 안정 식별값(실제 공급 경로/모델/effort)·정규화한 토큰 구분/세부 계량 단위별 산정 행. 입력/캐시/출력은 표시 묶음이며 고정 물리 컬럼/API 구조를 확정하는 것이 아니다"
      formula: "행 예상 비용 USD = 해당 세부 단위의 추정량 × USD/100만 토큰 단가 ÷ 1,000,000. 기준 단가 USD/100만 토큰 = 전체 행 예상 비용 합계 ÷ 비중복 추정 토큰 합계 × 1,000,000"
      normalization: "입력 총량에 캐시가 포함되면 비캐시 입력으로 분리하고 캐시는 한 번만 합산한다. 출력에 포함된 추론량도 중복 가산하지 않는다. 캐시 읽기/쓰기 등 다른 과금 단위는 별도 근거로 두고 비용 중첩과 쿼터 토큰 중첩을 구분한다. 호환 정규화/가격 근거가 없는 단위는 산정 미완료이며 임의0·동일 캐시 단가로 대체하지 않는다"
      manual: "초기 또는 시나리오 보완 시 한 턴의 주 추론/보조 용도별 전체 예상 소비량을 입력한다. 용도별 반복·대체 호출을 포함한다. 해당 시나리오에서 발생하는 사용자 귀속 질의 임베딩 등 개인 쿼터 차감 대상은 모두 포함하고 관리자 운영/지식 재임베딩 등 시스템 귀속은 개인 풀 표본에서 분리한다"
      actual_draft: "다음 달 초안은 생성 요청의 고정 서버 상한 시각까지 대상 월 직전 월의 실제 발생 호출을 당시 용도·안정 조합ID·effort·계량 단위/출처별로 합산한 스냅샷에서 생성한다. 대상 월 1일 유효 가격을 price_history_contract로 선택해 실적 수량과 결합하고 월 요약·산정 항목·원 실적을 하나의 초안으로 생성한다. 초안 생성 시의 원 스냅샷·집계 기간/상한을 보존하고 고정 전 재대조 차이를 명시 확인한다. 현재 SCR-062 지정목록으로 제한하지 않아 미지정 조합의 사용자 주 추론도 포함한다. 실패/중단/재시도/대체 실제 소비는 포함하고 같은 실행의 누적 재수신은 중복 제거한다. 월 합계를 그대로 사용하며 턴 평균 표시 시 모든 행에 같은 턴 표본수를 적용한다"
      price_snapshot: "자동 산정 행에는 선택한 가격 세트의 식별값/리비전·적용 시작일·가격 기준일(대상 월 1일)·단가 값·출처/확인일을 복사 보존한다. 단가는 읽기 전용이며 같은 월의 모델/단위 변경 또는 수동 행 추가도 같은 규칙으로 가격을 선택한다. 가격 보완은 SCR-015에서 저장한 뒤 명시 재생성/재선택으로 반영하고 수량 보완은 원 실적과 사유를 별도 보존한다. 현재 단가표를 조회할 때마다 기존 초안을 덮어쓰지 않는다"
      regeneration: "같은 년월 재생성은 월 요약·산정 항목·실적 스냅샷·단가 스냅샷을 함께 비교/갱신하며 중복 월을 만들지 않는다. 기존 저장/미저장 보완과 메모를 자동 유실시키지 않고 차이·영향을 표시해 명시 선택을 받는다. 최초 생성자/일시는 유지한다. 가격 부재/세부 단위 미등록은 해당 행의 산정 미완료로 남기고 유효 저장/고정을 차단한다. 원천 조회 실패는 기존 초안을 보존하며 일부 영역만 교체하지 않는다"
      price_freeze: "최초 SCR-021 월 기준 저장의 고정 요청에서 실적뿐 아니라 대상 월 1일 유효 가격 세트도 재대조한다. 새 시작일 삽입 등으로 선택이 달라지면 당시 비교용 실적 상한과 가격 리비전을 고정해 차이를 제시하고 명시 재확인한다. 재확인 후 저장 전 또 변경되면 낡은 기준본을 거부한다. 고정 뒤에는 최신 가격 변경으로 기존 월을 바꾸지 않는다"
      incomplete: "공급사 계량·Hub 추정·미상과 집계 기준 시각/범위를 구분한다. 미상은0이 아니며 총량만 있는 호출을 입력/캐시/출력으로 임의 배분하지 않는다. 수량·단가는 유한한0이상이어야 하며 합계 비용/비중복 토큰은 양수다. 분모0·비용0·미보완 미상 또는 미확인 단가/정규화 근거는 유효 단가 저장과 쿼터 기준 참조/고정을 차단한다. 관리자 추정 보완은 원 미상 상태와 보완값·사유를 함께 보존한다"
      freeze: "단가 작성/저장과 고정을 분리한다. SCR-016 저장은 메모·산정 항목·원 실적/보완을 보관하며 사용자 배분/단가 고정을 하지 않는다. SCR-021이 같은 년월의 저장된 유효 단가를 추가 때 참조하고, 월 기준 저장 시 현재 권한·자기 기준본·단가 유효성을 재검사한다. 이 요청의 서버 상한 시각과 대상 실적 월을 고정해 추가/정정 실적을 재대조하며 차이가 있으면 새 스냅샷/보완을 비교·명시 재확인한다. 재확인 중 상한은 계속 이동하지 않는다. 실적 재대조/단가 고정은 최초 월 기준 저장에만 수행한다. 이후 월 기준 금액/환산율/보정 재저장은 원 고정 단가·스냅샷·상한 시각을 그대로 참조하며 다시 집계하거나 단가를 교체하지 않는다. 최초 월 기준 저장과 단가 전체 고정은 함께 성공하거나 함께 실패하며 고정 주체/시각과 원 단가/집계 기준을 보존한다. 월말 배치의 자동 승계 생성은 직전 월에 이미 고정한 원 단가 참조를 유지하는 별도 경로다. 고정 뒤 메모·요금/수량·스냅샷·재생성을 변경하지 않는다. 저장된 월 기준 삭제·단가 잠금 해제/교체는 제공하지 않는다. 수동 배분은 월 시작 전 예정 생성이며 개인 한도·효력 등급/인원의 최종 적용은 월말 배치의 대상 월 시작 마감이다. 늦은 계량은 원 사용 월에 정정하되 잠긴 단가/기존 배정은 바꾸지 않고 이후 초안에만 연결한다"
      currency: "USD 단가는 수동 최초 월 기준 저장 때 고정한다. 환산율·수동 보정과 월 금액은 미래 월 시작 전 수정 가능하고 월말 배치의 대상 월 시작 마감 스냅샷으로 최종 적용한다. 다음 달 월 기준 자동 생성은 직전 월 금융 원 기준/당시 환산값을 그대로 복사하며 미사용 다음 달 단가를 강제 고정하거나 재환산하지 않는다"
      boundary: "월 산정용 턴/실적 시나리오의 예상 비용이며 개별 실시간 호출의 예상 청구액·회계 정산·가격 수집 엔진이 아니다. 제품 구현과 새 물리/API 상세는 화면/업무 흐름 합의 후다"
    lifecycle: "작성·저장(수정 가능) → 같은 년월 쿼터 기준 저장 성공으로 고정(메모 포함 수정 불가). 쿼터 배분 실행·월말 승계는 REQ-118이 소유한다"
