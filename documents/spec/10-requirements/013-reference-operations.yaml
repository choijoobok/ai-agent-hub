  - id: REQ-612
    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-003"
      - "ACT-004"
    source: "2026-09-30 사용자 기준정보 요구사항 분석·작성 요청 — FEAT-021·REQ-105·REQ-114 · 2026-10-08 사용자 보완: 도구 전체 스냅샷·책임자 승인 후 활성화와 구축 기간 전결 처리(ADR-023). 같은 날 사용자가 업무별 독립 승인 설정을 포함한 카드 전체를 명시 확정했다 · 같은 날 REQ-038 검토 후 사용자 요청으로 지식 연결 후보·연결 지식 영향·참조 보호를 보완하고 전체 카드를 재검토 상태로 전환 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-612 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다. · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다."
    process_step: "PRC-13-01"
    title: "도구 등록·계약·노출 기준 관리"
    detail: "운영 관리자는 등록 업무 API와 Hub 내부 서비스 빈 기반 커스텀 도구의 식별자·설명·계약·통제 근거·실행 유형·허용 그룹·노출 상태를 관리할 수 있어야 한다 업무 질의의 후보 노출은 REQ-303·REQ-608의 지식 연결을 전제로 하며 도구를 참조하는 지식과 변경 영향을 확인할 수 있어야 한다. 커스텀 도구의 공통 결과 안내·후속 처리 가이드는 result_handling_guide로 관리한다."
    roadmap: "RM-P1"
    acceptance: "등록된 API 또는 검증된 빈을 참조해 사용자 그룹별 도구를 노출하고 미검증·권한 밖 도구 호출은 서버에서 거부한다. 전체 구성은 현재 변경 권한·기대 버전·기술/참조 검증과 직접 저장·전체 이력으로 반영하고 실패는 기존 유효본을 유지한다. 업무 API 도구는 지식의 API 링크, 커스텀 도구는 지식의 직접 도구 링크를 근거로 후보를 구성한다. 등록·그룹 허용·노출만으로 지식에 연결되지 않은 업무 도구를 제공하지 않는다. 연결 지식을 역참조하고 삭제·비활성화의 참조 검증에서 유효 연결을 깨뜨리는 변경을 차단하며 참조 조회 실패를 참조 없음으로 처리하지 않는다. result_handling_guide를 계약 원천 및 지식 매핑 설명과 함께 참조해 verification의 결과 안내·후속 처리·변경 승인 경계를 만족한다."
    summary: "검증된 업무 API 또는 배포된 커스텀 도구만 허용 범위에서 선택·실행하게 한다"
    api_tool_mapping:
      decision: "2026-10-28 사용자 결정(ADR-031): 동일한 안정 업무 API 하나에 등록 업무 도구 하나를 대응시킨다. 업무별 용도·질문·후속 절차는 REQ-608·303의 지식 API 매핑 설명에서 구분한다"
      registration: "도구 등록 전 API는 대응 도구가 없을 수 있다. 동일 API의 별도 도구 중복 등록을 후보·세트·탭을 바꾸어 우회하지 못한다. 비활성화/폐지 후 재등록·복원도 기존 등록과 참조를 확인한 새 후보로 처리하며 새 도구 ID로 중복 등록하지 않는다"
      consumption: "지식의 API 링크에서 대응 도구를 확인하고 현재 API/도구 양쪽의 유효 계약·그룹·노출 조건을 검사한다. 대응 없음·충돌·조회 실패를 허용 또는 임의 도구 선택으로 바꾸지 않는다. API 등록/승인만으로 도구를 자동 생성·승인·노출하지 않는다"
      history: "같은 도구의 과거 리비전과 참조 API 계약 판은 중복 도구가 아니다. API 참조 변경도 전체 후보 검증 대상이며 다른 등록과 충돌하면 반영하지 않는다. 과거 실행 근거를 현재 API/도구로 치환하지 않는다"
