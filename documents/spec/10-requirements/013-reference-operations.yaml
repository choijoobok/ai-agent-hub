    type: "functional"
    priority: "must"
    workstream: "admin"
    actors:
      - "ACT-002"
      - "ACT-004"
    source: "2026-10-31 사용자 요청: 로그인 아이디 중심 표시·사용기간·system 동등 비밀번호 정책·감사 넷·스위치와 그룹/등급/추가토큰/데이터소스/대상시스템 다섯 탭. 신원은 무승인 직접 설정, 그룹 추가는 기존 승인 정책. 기존 CR-028의 관리자와 Portal 계정/인증 분리를 유지한다. · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-13-01"
    title: "Hub Portal 사용자 등록·조회·이용 상태 관리"
    detail: "권한을 가진 관리자는 admin의 Portal 사용자 관리 메뉴에서 관리자 계정과 독립된 Portal 계정을 검색·등록·변경·활성/비활성 처리하고 조직·그룹·쿼터 등급·대상별 신원 매핑·변경 이력을 확인할 수 있어야 한다. Portal 계정 관리 원장은 admin이 소유하고 로그인 인증·세션 수락은 portal이 소유한다. 관리자 겸임자도 별도 Portal 계정을 발급받으며 공통 계정 등록·관리자 계정 선택 연결·자동 동기화를 두지 않는다"
    roadmap: "RM-P1"
    acceptance: "Portal 자체 계정은 이 메뉴에서 별도 등록·관리하고 외부 인증 모드는 검증된 SSO/대상 계정 신원에 연결한다. 어느 모드든 관리자 계정·자격증명·세션을 공유하지 않는다. 같은 사람·로그인 ID라도 두 영역의 계정은 별개이며 한쪽의 비활성화·삭제/보존 처리·잠금·비밀번호·로그아웃이 다른 쪽에 자동 전파되지 않는다. 외부 인증 성공만으로 미등록/비활성 이용자에게 질의·실행을 허용하지 않는다"
    summary: "admin의 독립 메뉴에서 Portal 사용자 생애주기를 관리하고 관리자 접근 권한과 구분한다"
    intent:
      problem: "관리자 계정 관리와 Portal 이용자 관리가 구분되지 않아 일반 이용자 등록·권한·한도를 어디서 처리하는지 모호하다"
      goal: "admin의 독립 메뉴에서 Portal 사용자 생애주기를 관리하고 관리자 접근 권한과 구분한다"
      not:
        - "Portal 사용자 등록으로 admin/system 메뉴·액션 권한을 자동 부여하지 않는다"
        - "관리자 등록만으로 Portal 이용 등록을 자동 완료하지 않는다"
        - "공통 Hub 계정 관리 메뉴·계정 원장·관리자 계정 참조 등록이나 관리자와 Portal 사이의 자동 계정/인증 동기화를 만들지 않는다"
