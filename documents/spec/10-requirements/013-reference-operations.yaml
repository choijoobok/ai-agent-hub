      - "평가셋 정의·사례와 실행 결과는 분리한다. 변경된 정답 기준으로 과거 실행 점수를 몰래 덮어쓰지 않는다"
      - "평가 실행도 기존 데이터 접근·개인정보·실행 승인 통제를 따른다. 기준정보 관리 권한이 업무 데이터 열람 권한을 대신하지 않는다"
      - "기대 기준은 데이터 시점에 따라 변하는 실제 결과값과 업무적으로 고정된 판정 조건을 구분해 적는다"
      - "다음 보완 역시 개발 완료 후 재검토할 후보 범위다. 운영 실행을 평가 대상으로 삼는 경우 사례 등록/평가 시작이 실제 업무 액션의 실행 승인이나 반복 호출을 자동 허용하지 않는다. 합성·비식별 자료 사용과 기존 권한·전송·보존 규칙을 우선한다"
      - "비교 결과에는 사용한 사례·기대 기준과 모델/프롬프트/지식 등 적용 구성의 확인 가능한 버전 근거를 연결하는 방향을 검토한다. 비교 불가능한 조건 차이를 성능 개선/저하로 단정하지 않고 지난 실행의 기준과 점수를 덮어쓰지 않는다"

    exceptions:
