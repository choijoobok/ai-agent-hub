      - kind: "정상"
        case: "처리 중 쿼터 재검사는 기본 false로 표시된다. 운영자가 활성화하면 NFR-012의 적용 경계에 따라 스텝 LLM 호출 전 재검사를 수행하며, 비활성 상태에서도 새 턴 시작 전 쿼터 검사와 모든 사용량 기록은 유지한다"
      - kind: "예외"
        case: "yml 원문 보존 기간이 7일이면 SCR-017 등 소유 조회 화면에 7일을 읽기 전용으로 표시한다. 화면·설정 변경 요청으로 5일이나 30일로 바꿀 수 없고, 별도의 재개 원문 보관 일수 입력 항목도 전제하지 않는다"
