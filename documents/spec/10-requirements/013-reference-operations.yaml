      boolean_columns: "이용 여부 등 두 값은 스위치로 표시하고 현재 권한/업무 조건이 허용한 설정만 편집한다. 잠금/변경 필요 같은 결과는 조회 전용이며 미상은 꺼짐이 아니다"
      membership: "REQ-609에 따라 그룹 추가/재부여/중지를 현재 변경 권한자가 직접 저장한다. 별도 승인/전결 없이 등록·수정 감사와 전체 소속 변경 이력을 남기며 물리 삭제하지 않는다. 마지막 활성 그룹은 이용자 비활성화와 함께 중지한다."
      quota: "일반 등급 추가/수정/비활성화는 미래 월만 가능하며 신규 당월 최초 부여·첫 사용 전 최초 정정은 REQ-116의 등록 예외다. 한도는 배분에서, 사용량은 실제 계량에서 생성하고 이 화면에서 입력하지 않는다"
      extra_tokens: "신규/재활성 일할 자동 배정과 추가 토큰 신청량/실제 승인량/상태를 조회만 한다. 신청/승인·현재 한도 반영·월말 만료는 REQ-119의 원 소유 업무다"
      identities: "데이터소스와 대상 시스템의 기준정보 후보 목록에서 필요한 대상만 각각 설정한다. 신원 직접 저장은 REQ-609.identity_management이며 API/DB스키마별 새 신원 차원을 추가하지 않는다"
      personnel: "하단 인사 변경 탭 대신 기존 SCR-031과 Portal 변경 이력 SCR-044의 원 사건/실제 반영 결과 연결을 유지한다"
    business_rules:
      - "CR-028 사용자 결정: 자체 계정 모드의 Portal 계정 등록·비밀번호 초기화·잠금 해제는 admin의 Portal 계정 관리 계약으로 처리하고 portal 인증이 이를 사용한다. system 관리자 계정 생성/변경 명령에 위임하지 않는다. 외부 모드의 인증·신원·프로필은 원천이 소유하며 Hub는 검증된 연결과 읽기 전용 참조를 사용한다"
      - "SCR-005/FEAT-005는 admin의 Portal 계정 관리, SCR-501/FEAT-501은 system의 관리자 계정 관리로 구분한다. 공통 Hub 사용자 관리라는 세 번째 메뉴와 공통 계정 원장을 만들지 않는다"
      - "진입 경로는 /와 /portal/**, /admin과 /admin/system/**·/admin/hub/**를 유지한다. Portal은 PC·모바일 반응형 웹과 별도 Portal 인증·세션으로, 관리 콘솔은 관리자 자체 인증·세션으로 접근한다. 단일 SPA/배포 여부는 계정·인증 공유를 뜻하지 않는다(ADR-034·ARCH-021)"
      - "SSO/계정 연동 기본·연동 없는 고객사의 자체 계정 모드는 ARCH-050을 따른다. 외부 인증 성공과 Portal 이용 활성은 별개다"
      - "활성 그룹 1개 이상과 쿼터 등급이 갖춰져야 Hub 이용을 연다. 요청 상태 그룹은 세지 않는다. 활성 사용자의 마지막 그룹은 비활성화와 함께만 제거한다(REQ-103)"
      - "퇴직·조직 이동에 의한 비활성화·그룹 재확인/재부여는 REQ-103·ARCH-050을 따르고, 다시 활성화할 때 이용 조건을 재검사한다"
      - "동일인이 관리자와 Portal 이용자를 겸하면 서로 다른 계정을 각각 발급한다. 이름·이메일·로그인 ID 일치로 계정을 병합/연결하거나 상대 영역 로그인·권한을 자동 발급하지 않는다"
      - "2026-10-29 CR-028 사용자 명시 결정이 CR-027을 대체한다. 관리자와 Portal의 계정 원장·자격증명·로그인·세션·권한 수락을 분리하고 SSO/대상 계정 연동과 인사 변경은 Portal 영역에만 적용한다. 사용자 개인의 레거시 비밀번호를 저장·대리 전송하는 방식은 ARCH-050의 기존 금지를 유지한다"
      - "사용자 그룹 추가/재부여/중지와 데이터소스/대상 시스템 신원은 REQ-609의 각 현재 변경 권한·기대 버전·전체 감사로 직접 저장한다. 소속은 물리 삭제하지 않고 마지막 그룹 회수는 이용자 비활성화와 함께 처리한다. 등급 효력 월은 REQ-116을 따른다."
