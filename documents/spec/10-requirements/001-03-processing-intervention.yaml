    category: "세션 독립·재연결"
    actors: [ACT-001]
    process_step: PRC-02-01
    title: "화면 세션과 무관한 턴 처리"
    detail: "서버에 접수된 요청은 대화 세션 창·브라우저를 닫거나 로그아웃해도 기존 대기·실행 규칙에 따라 처리되고 결과 또는 종결 사유가 저장된다. agent는 사용자 식별과 접수 근거를 처리 문맥으로 보유해 화면 세션에 의존하지 않는다. 다만 접수 당시 권한 복사본으로 실행하지 않고 매 접근 시점에 현재 권한을 검사한다(REQ-108)"
    source: "2026-10-13 사용자 결정 — 창 닫기는 처리를 유지하고, 대화 세션 삭제는 미종결 턴의 취소·중단 및 종결 확인 후 허용하는 권장안을 승인했다. 후속 요청으로 접수 성공 경계·화면과 독립적인 처리 문맥·인증 만료/권한 회수·외부 인증·서버 장애·종결 제한과 검증 기준을 구체화해 반영했다. 같은 날 사용자가 REQ-016 전체 보완본을 명시 확정했다. P3 상세 설계와 실행 검증은 후속이다"
    business_rules:
      - "대화 세션 창 닫기·화면 이탈·로그아웃과 대화 세션 삭제를 구분한다. 창 닫기는 턴 중단 요청이 아니며 개인 순서 대기·실행·유효 사용자대기를 기존 규칙대로 유지한다"
      - "대화 세션 삭제의 선행 조건·서버 재검사·감사 보존은 REQ-109.session_deletion을 따른다. 삭제 조작만으로 진행 중인 턴이 숨겨진 채 실행되는 경로를 만들지 않는다"
      - "사용자대기에는 만료 시각이 있고 미응답으로 만료되면 현재 시도를 중단한다. NFR-013에 따라 턴 전체 시간 상한은 없으며, 사용자가 화면을 조작하지 않았다는 이유만으로 실행 중인 턴이나 개인 순서 대기 요청을 일괄 종료하지 않는다. 실행 점유 만료는 처리 담당자의 점유 갱신 중단을 기준으로 하며 사용자 무응답 시간과 다르다"
      - "사용자대기 만료 등으로 해당 대화 세션의 모든 현재 턴/시도가 종결되면 삭제 조건을 충족한다. 만료 시각 경과만으로 화면이 종결을 추정하지 않고 서버의 실제 상태 전이를 확인한다. 조건 충족은 삭제 가능 상태이며 자동 삭제 요청을 생성하지 않는다"
    hard_rule: "서버 접수와 브라우저의 접수 응답 수신을 구분한다. 화면 연결·로그인 세션 객체는 접수된 턴의 실행 상태나 권한 판정의 유일한 근거가 될 수 없다. 접수 당시 권한으로 후속 접근을 허용하거나 재접속·상태 조회만으로 새 실행을 만들지 않는다. 세션 삭제는 REQ-109.session_deletion의 전체 현재 턴/시도 종결 확인을 따른다"
    why: "화면 연결이 끊겨도 접수된 요청·결과가 유실되지 않게 하고, 재전송·재접속에서 중복 실행하거나 회수된 권한으로 처리하는 것을 막는다"
    summary: "화면과 독립적으로 접수된 턴을 처리하고 현재 권한·실행 제한을 적용하며, 재접속은 기존 상태 조회로 복원한다"
    intent:
      problem: "브라우저 수명과 서버 실행을 묶으면 연결 종료로 작업이 유실되거나 응답 유실 뒤 재전송으로 같은 업무가 중복 실행된다"
      goal: "접수·인증·실행·재연결의 경계를 구분해 현재 사용자 권한 아래에서 요청을 처리하고 결과나 종결 사유를 남긴다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "요청은 REQ-009의 계약과 현재 사용자의 접수 자격 검사를 통과해야 하며, 개인 순서·중복 방지는 REQ-036을 따른다"
      - "기존 대화 세션·턴/시도·대기 카드를 식별할 수 있고 삭제·만료·현재 상태에 따른 수신 가능 여부를 서버가 판정한다"
    admission:
      success: "요청·턴/시도·대기 항목 등 이후 처리에 필요한 정보를 공용 영속 저장소에 커밋하고 접수에 필요한 필수 기록 조건을 충족한 뒤 접수 성공을 반환한다. 정확한 상태/감사 커밋 경계와 부분 저장 복구는 P3에서 정하며 메모리 적재나 화면의 전송 완료만으로 접수 성공을 확정하지 않는다"
      lost_response: "서버 접수 완료 뒤 응답이 유실돼도 처리를 유지한다. portal은 같은 요청 식별 근거로 기존 접수를 조회하거나 재전송하고 agent는 기존 턴·현재 상태를 반환한다. 접수 전에 연결이 끊겼거나 접수 여부를 확인할 수 없으면 성공·실패를 추정하지 않고 확인이 필요한 상태로 안내한다"
      duplicate: "조회·재전송은 현재 인증·소유권을 검사하고 REQ-036의 동일 요청 키·입력 비교·유일 제약을 따른다. 단순 응답 유실로 새 요청 식별자를 만들어 중복 실행하지 않는다"
    execution_context:
      separation: "대화 세션은 대화 묶음, 로그인 세션은 브라우저 인증 상태, 턴 실행 문맥은 서버 처리 근거로 구분한다. 로그인 세션이 종료돼도 접수된 요청의 사용자 식별과 실행 문맥을 잃지 않는다. 다른 인스턴스도 공용 영속 상태로 허용된 조회와 처리를 수행할 수 있어야 한다"
      references: "사용자·대화 세션·요청·턴/시도/회차/스텝 식별, 원 요청/저장 응답 참조, 접수 계약 버전·실행 설정 참조, 현재 상태·대기 카드·점유·결과·감사 참조를 연결한다. 이는 논리 정보 목록이며 물리 테이블·필드명은 P3에서 정한다"
      policy: "내용·모델 설정 고정 범위는 REQ-108·ARCH-040을 따르고 실제 접근 권한은 현재 값으로 검사한다. 사용자 식별자는 권한 증명이 아니며 인증 비밀값을 턴 실행 문맥·일반 로그에 복제해 화면 세션 독립성을 구현하지 않는다"
    authentication_boundaries:
      portal: "로그아웃 또는 로그인 세션 만료 자체는 접수된 턴의 중단 사유가 아니다. 상태·결과 조회나 추가 응답 제출에는 현재 유효한 인증이 필요하며 재인증 후 본인 대화 세션의 상태를 조회한다"
      authorization: "사용자 계정 비활성화·그룹/대상 권한 회수·신원 매핑 변경은 다음 보호 대상 접근 시 현재 값으로 검사한다. 지식 검색·모델 입력 구성·데이터 조회·업무 실행·결과 제공의 검사 범위는 REQ-108을 따르며 저장된 결과도 우회 제공하지 않는다. 이미 외부로 전송한 호출과 발생 사용량·업무 사실은 보존한다"
      external: "외부 시스템 인증은 portal 로그인과 구분한다. 등록된 연동 인증 방식이 허용하는 갱신·재발급만 정해진 상한 안에서 수행하며 다른 계정·더 높은 권한으로 임의 대체하지 않는다. 지원 인증 방식·갱신 책임·사용자 재인증 필요 여부와 실패 상태는 P3에서 정한다. 사용자 재인증 경로를 채택하면 만료·중단 기준을 함께 설계한다"
      replay: "인증 복구와 업무 호출 재전송을 분리한다. 외부 요청이 이미 전송됐거나 결과가 불명인 경우 인증을 복구했다는 이유만으로 재전송하지 않으며 REQ-013·105·NFR-022의 확인·재시도 규칙을 따른다"
    termination:
      execution: "NFR-013의 무기한 정체·반복 방지 기준을 적용해 실행 가능한 경로가 완료·실패 또는 현재 시도 중단으로 끝나도록 한다. 턴 전체 시간 상한은 추가하지 않는다. 새 입력·재시도가 없고 서버·만료/복구 처리가 정상 동작한다는 전제와 실제 상태 전이 근거를 구분한다"
      queue: "개인 순서 대기는 사용자 무응답 시간으로 임의 만료시키지 않는다. 앞선 요청의 종결·점유 해제와 서버의 다음 요청 선택·인계 미완료 복구는 REQ-036을 따른다. 화면 폴링에 의존하지 않는다"
      failure: "브라우저 연결 종료와 실행 담당 인스턴스 장애를 구분한다. 서버 종료·점유 만료는 ARCH-070의 중단·점유 해제 경로를 따르며 다른 인스턴스의 상태 조회가 자동 실행 인계를 뜻하지 않는다. 중단 뒤 재시도는 REQ-013의 명시 요청과 허용 조건을 따른다"
      evidence: "사용자대기 만료·점유 회수·대기열 재탐색과 종결 저장의 실패/지연은 탐지·복구 대상으로 남긴다. DB 장애 등으로 상태를 저장하지 못했으면 종결됐다고 표시하지 않는다. 감사·사용량·결과 불명 외부 업무를 정상 성공으로 바꾸지 않으며 늦은 응답으로 현재 상태를 되살리지 않는다"
    data:
      - { item: "접수 식별 근거와 실행 문맥 참조", origin: "검증한 사용자 요청과 서버 접수·실행 상태", sensitivity: "사용자별 업무 식별 정보", retention: "REQ-107·109의 기존 보존·파기 정책" }
      - { item: "원 요청·저장 응답·허용 결과", origin: "사용자 입력과 모델/업무 호출 처리", sensitivity: "업무·개인정보 포함 가능, 저장 마스킹 적용", retention: "REQ-107·109의 진행 중 저장과 종결 후 보존 구분" }
      - { item: "권한·인증 오류·연결 단절·종결 및 복구의 판정 근거", origin: "agent와 현재 권한/연동 인증 판정", sensitivity: "보안·감사 정보, 인증 비밀값 제외", retention: "REQ-107·108·109의 감사 정책" }
    exceptions:
      - "접수 응답 유실은 admission, 로그인 만료·권한 회수·외부 인증 만료는 authentication_boundaries를 따른다"
      - "실행 서버 장애·만료·기록 실패·복구 지연은 termination과 기존 점유·감사 규약을 따른다"
    lifecycle:
      - { state: "서버 접수 전/접수 여부 확인 필요", next: ["기존 접수 확인", "신규 접수", "거부"], note: "설명용 구분이며 새 턴 상태 코드를 만들지 않는다" }
      - { state: "접수·대기·실행", next: ["사용자대기", "완료·실패·중단"], note: "창 닫기·로그아웃은 업무 상태 전이를 만들지 않는다" }
      - { state: "재인증 후 기존 대화 열기", next: ["현재 상태·허용 결과 조회"], note: "REQ-040에 따라 유효 대기 카드만 복원하며 새 실행·승인을 만들지 않는다" }
    permissions:
      - "현재 인증된 사용자의 본인 세션·턴만 조회·응답·제어한다. 다른 사용자의 식별자를 입력해 상태나 결과에 접근하지 못한다"
      - "실제 업무 접근은 접수 당시 권한 복사본이 아닌 현재 유효 권한으로 검사한다"
    audit: "접수·권한 판정·호출·사용량·중단·만료·복구 사실과 연결 식별자를 기존 감사 규약으로 기록한다. 화면에서 결과를 읽었는지와 서버의 처리 완료를 구분한다"
    volume: "개인 한도·대기량·처리 시간 지표는 NFR-023·NFR-006을 참조하며 화면 연결 수로 서버 턴 수를 추정하지 않는다"
    config: "개인 한도·호출 타임아웃·재시도·사용자대기와 점유 만료는 기존 운영 설정과 적용 규칙을 따른다. 별도 턴 전체 시간 상한이나 공용 실행 한도를 만들지 않는다"
    risk: "접수 성공과 응답 수신, 로그인 만료와 권한 회수, 브라우저 종료와 서버 장애를 혼동하면 요청 유실·중복 실행·인가 우회가 생긴다. 호출 제한만 있고 내부 반복·정체가 제한되지 않으면 종결을 보장할 수 없다"
    acceptance: "서버에 접수된 요청은 창 닫기·로그아웃·로그인 세션 만료 뒤에도 기존 규칙대로 처리되고 결과나 종결 사유가 남는다. 응답 유실 뒤 재전송과 재접속으로 실행이 늘지 않으며 현재 권한이 없는 접근은 차단한다. 유효한 대기만 이어갈 수 있고 모든 현재 턴/시도 종결 뒤 세션 삭제를 허용한다. 무기한 정체·반복을 탐지·제한·복구하는 경로를 검증한다"
    verification:
      - { case: "접수 커밋 직전·직후 연결 단절과 같은 요청 재전송", expected: "실제 접수 여부와 안내가 일치하고 접수·턴·대기 항목이 중복되지 않는다. 부분 저장·필수 기록 실패의 복구 경계도 확인한다" }
      - { case: "처리 중 창 닫기·로그아웃", expected: "접수된 처리가 유지되고 결과 또는 종결 사유를 남긴다. 화면 연결 종료를 취소로 기록하지 않는다" }
      - { case: "개인 순서 대기 중 브라우저 종료", expected: "앞선 처리의 점유 해제 뒤 서버가 자동 선택한다. 재입력이나 상태 폴링이 필요하지 않다" }
      - { case: "로그인 만료 후 재인증해 기존 대화 열기", expected: "동일 턴·시도의 현재 상태를 조회하며 재접속 때문에 모델·도구 호출 횟수가 늘지 않는다" }
