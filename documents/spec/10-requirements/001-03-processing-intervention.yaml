# 영역: 처리 개입과 재시도
requirements:
  - id: REQ-005
    type: functional
    priority: must
    workstream: agent
    category: "사용자 대기·재개"
    actors: [ACT-001]
    title: "처리 중 사용자 개입과 재개"
    detail: "턴 처리 중 사용자에게 추가 정보를 요구하거나 승인을 요청할 수 있고, 응답을 받아 처리를 재개할 수 있다"
    hard_rule: "유효한 사용자대기 응답 중 현재 처리를 계속할 응답만 같은 턴·같은 실행 시도에 연결해 이어간다. 거절·중단·별개 질의 선택은 각각의 분기로 처리하며 원 턴의 실행 허용으로 해석하지 않는다. 중단 후 원본 연결 새 턴 재시도(REQ-013)와 구분하며, 이전·만료·종결된 대기 요청의 응답으로 실행을 되살리지 않는다. 실행 승인은 실제 호출에 사용할 모든 파라미터 값을 확보·검증하고, 사용자가 실행 대상·순서와 그 값 전체를 확인한 뒤 승인 카드에서 명시적으로 최종 승인해야 성립한다. 미정 값·자리표시자·승인 후 채울 값을 남긴 채 승인받거나 호출하지 않으며, 승인한 대상·순서·값 그대로만 실행한다. 추가 정보·자연어 답변·계획 확인·의도 확인은 최종 실행 승인이 아니다(REQ-017·026·105) 승인 카드와 호출은 execution_parameter_storage의 같은 원값 버전을 사용하고, 전용 임시본은 실행 목적 종료·만료·무효화 시 사용 차단·삭제한다."
    source: "기존 REQ-005 · 2026-10-19 사용자 순차 검토에서 모든 파라미터 값 확보·검증 → 사용자의 전체 실제 값 확인 → 최종 승인 → 같은 값으로 실행을 명확히 했다. 이어가기/재시도 구분·응답별 분기·거절 카드 무효화와 최초 기한까지 대기 유지·부분 입력 보완을 반영했다. 후속 사용자 제안과 명시 확정 요청으로 로그인 세션과 독립적인 공용 DB 전용 임시 테이블의 원값 암호화 보관·승인 버전 연결·실행 후 삭제와 제한된 마스킹 예외를 ADR-025로 기록하고 REQ-005 전체 보완본을 확정했다. 관련 요구사항은 이번 정책의 참조를 맞추며 다른 카드 전체 신규 승인·단계 게이트·상세 설계·소스 구현 승인은 별도다. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-005 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다. 2026-10-26 사용자 요청으로 승인 대기 고정 진입점·현재 승인 패널·질문/보류와 카드 교체 경계를 보완했다. 이어 사용자가 보완 때문에 재확정 대기로 돌아간 요구사항의 재확정을 명시 요청하여 REQ-005 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·구현 승인은 별도다. 2026-10-26 사용자 결정: RM-P3 워크플로우는 자연어로 정의한 예약 배치와 대화창 수동 실행을 지원하며, 액션별 자동 승인은 사용자 요청·관리자 검토·활성화 승인을 거친다. REQ-404·405의 한정된 예외를 연결하며 전체 보완본 확정은 별도다"

    roadmap: RM-P1
    summary: "처리에 필요한 추가 정보·실행 승인·차단형 의도 확인을 사용자에게 요청하고 처리를 계속할 유효 응답으로 같은 턴·시도를 이어간다. 실행은 모든 파라미터 값을 확보·검증한 뒤 사용자가 전체 값을 확인하고 최종 승인한 경우에만 허용한다. 응답 접수와 실제 실행을 구분해 개인 순서·만료·권한 변경·중복 입력을 처리한다 원값은 공용 DB 전용 임시 테이블에 암호화해 보관하고 승인한 버전으로 호출한 뒤 실행 목적이 끝나면 삭제한다."
    intent:
      problem: "빠진 입력이나 사용자 결정 없이 계속하면 추측·무승인 실행이 생기고, 응답을 어느 대기 요청에 적용하는지 불명확하면 이전 카드·다중 탭 응답으로 잘못된 처리가 이어질 수 있다"
      goal: "사용자가 요청 이유·대상·기한을 확인하고 응답할 수 있으며, 서버는 현재 유효한 요청에만 응답을 한 번 반영해 안전하게 이어간다"
      not:
        - "사용자대기 후 이어가기는 중단된 턴을 처음부터 재시도하거나 새 질의를 만드는 동작이 아니다(REQ-013)"
        - "모든 확인에 처리를 멈추지 않는다. REQ-032의 병행형 의도 확인은 처리중을 유지하고 이 카드의 차단형 사용자대기 경로와 구분한다"
        - "질의 해석문·조회 계획 확인과 데이터의 모델 전송 동의는 실행 승인을 대신하지 않는다(REQ-022·023·026·106)"
    goal_trace: [GOAL-0, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "현재 턴·시도·회차와 대기 요청의 유형·대상·유효 기한을 공용 영속 상태로 식별할 수 있다(REQ-009·016·107)"
      - "대기 유형과 상태 전이는 03-glossary의 wait_types·state_rules를 따르고, 이어갈 실행용 상태와 감사 이력을 구분한다(REQ-108·109)"
      - "응답 접수·개인 순서·실행 선택은 REQ-036을 따르며 실제 접근마다 현재 권한과 전송 허용을 판정한다(REQ-103·105·106·108)"
    manual_reexecution_link:
      confirmation: "REQ-105.manual_reexecution의 대상 시스템 확인은 원 결과 불명을 수정하는 조작이나 최종 실행 승인이 아니다. 새 턴의 현재 원 실행 참조·최신 확인·실행 목적에 연결하고 사용자 제공 확인으로 남긴다."
      approval: "현재 대상·순서·모든 값을 확인한 최종 승인과 원값 임시본은 이번 후속 실행에 새로 연결한다. 이전 턴·확인·승인·임시 원값은 자동 승계하지 않는다. 최종 승인 카드 중복 제출·만료/변경·권한 회수는 기존 검증을 따르며 같은 승인으로 1회만 실행한다."
    approval_presentation:
      entry: "현재 대화에 미종결 승인 관련 대기가 있으면 입력창 위에 승인 대기 영역을 고정해 본문 스크롤·추가 질의 길이와 무관하게 접근하게 한다. 승인 요청 단위 건수·업무 대상 요약·현재 처리 상태·만료 시각/남은 시간을 제공하고 여러 요청 중 대상을 선택할 수 있게 한다. 같은 요청을 본문·패널에서 표시한다고 건수를 늘리지 않는다. 거절 후 재승인 대기나 변경값 준비 중은 즉시 승인 가능한 카드와 구분한다. 승인 응답이 접수돼 개인 순서를 기다리면 기존 순서 대기 안내로 연결하며 다시 승인할 항목으로 남기지 않는다."
      panel: "승인 내용 확인을 선택하면 현재 서버 상태를 조회해 선택한 요청의 승인 상세 패널을 연다. 실행 대상·액션 순서·모든 실제 파라미터 값과 기한, 기존 정책상 필요한 최근 실행 사실을 보여주고 유효한 전체 내용을 확인한 뒤 승인·거절·질문하기를 제공한다. 고정 요약 영역에는 최종 승인 조작을 두지 않는다. 원 본문을 찾아 스크롤하거나 전체 과거 메시지를 로드할 필요가 없어야 한다. 패널 닫기 뒤 읽던 본문 위치와 작성 중 입력을 유지한다."
      same_request: "본문의 현재 카드와 승인 상세 패널은 같은 서버 승인 요청·카드·파라미터 버전을 표시한다. 조회·열기·재열기·닫기는 새 승인 카드/턴·모델/업무 도구 호출·순서 대기 등록·실행·기한 연장을 만들지 않는다. 과거 응답을 읽는 REQ-014.response_preview는 읽기 전용으로 유지하며 그 레이어에서 승인 조작을 실행하지 않는다."
      question: "질문하기는 선택한 원 승인 요청과의 관계를 표시한 질문 입력으로 연결하고 작성 중 입력을 덮거나 자동 제출하지 않는다. 사용자가 실제 제출한 추가 질문은 REQ-017의 별도 턴으로 처리한다. 질문·보류·패널 닫기는 거절이 아니며 기존 유효 카드와 최초 기한을 유지한다. 실제 실행 내용 변경은 REQ-007·017로 연결한다."
      version_change: "요청된 대상·순서·실행값의 변경이 서버에서 확정되면 REQ-007의 전송 경합 판정에 따라 이전 카드·승인·원값의 신규 사용을 먼저 차단하고 변경된 전체 값을 확보·검증한 새 버전으로 승인받는다. 단순 질문이나 변경 의도 판정 중인 모호한 입력만으로 교체를 확정하지 않는다. 새 카드 준비·저장이 실패해도 이전 카드의 사용 자격을 되살리지 않는다. 같은 승인 대상의 현재 유효 버전만 승인할 수 있으며 다른 승인 대상의 독립 카드까지 무효화하지 않는다."
      history: "교체·거절·만료된 본문 카드는 기존 감사·마스킹·보존 범위에서 당시 대상 참조와 처리 사실·무효 사유를 읽기 전용으로 표시한다. 실행 파라미터 원값의 사용 차단·삭제는 execution_parameter_storage를 따르며 과거 카드 열람을 위해 삭제된 원값을 복원하거나 보존 기한을 늘리지 않는다. 교체된 카드에는 승인 불가와 현재 승인 내용 확인 진입점을 제공한다. 최신 유효 요청이 없으면 현재 상태와 가능한 후속 행동을 안내하고 새 카드를 자동 발급하지 않는다. 과거 카드의 내용/시점을 새 내용으로 덮어쓰지 않는다."
      submission: "클라이언트가 확인한 요청·카드·버전에 사용자의 최종 조작을 결합한다. 제출 시 서버가 현재 사용자/소유권·턴/시도/회차·카드/파라미터 버전·현재 상태·권한·기한을 다시 검사하고 기존 조건부 처리로 중복과 경합을 판정한다. 오래된 화면의 승인을 최신 카드의 승인으로 자동 전환하지 않는다. 최신 내용을 다시 제시하고 사용자가 새로 승인해야 하며 같은 조작으로 업무 실행을 두 번 시작하지 않는다."
      refresh_failure: "변경·응답·만료·종결과 여러 탭의 상태는 REQ-006·040의 기존 조회/갱신으로 맞춘다. 화면 갱신이 늦어 이전 버튼이 남아 있어도 서버는 무효 요청을 거부한다. 패널에서 새 버전으로 바뀌면 변경 사실과 새 전체 내용을 확인시킨 뒤 새로운 조작을 받아야 한다. 상태 조회 실패·권한 회수·원값 부재/복호화 실패로 현재 승인 대상을 검증할 수 없으면 최종 승인 조작을 허용하지 않고 사유·재조회 또는 기존 보완 경로를 안내한다. 캐시나 과거 카드로 실행하지 않는다."
      ownership: "질문·보류·거절·재승인과 최초 대기/승인 후 기한의 업무 규칙은 REQ-017·026, 화면 복원은 REQ-040을 따른다. 고정 영역·상세 패널의 구체 배치/크기·반응형/키보드 접근·문구 키·요청/응답 필드는 P3 화면 요건서와 목업에서 정한다."
    data:
      - { item: "대기 요청의 턴/시도/회차 연결·유형·질문·대상·최초 요청 시각·만료 시각과 응답 연결", origin: "agent 요청과 portal 사용자 응답", sensitivity: "업무·개인정보 포함 가능, 저장 사본의 마스킹·보존은 REQ-107·109", retention: "대기/승인 유효 기한과 기록 보존 기한을 분리하며 각 정본 정책을 따름" }
      - { item: "추가 정보·승인/거절·의도 선택과 접수/무효/중복 판정 및 이어가기 상태", origin: "인증된 사용자 조작과 agent 판정", sensitivity: "사용자 결정·업무 값과 감사 정보", retention: "실행용 상태는 REQ-109, 응답/판정 감사는 REQ-107·108·109" }
      - { item: "실행 파라미터 원값의 암호화 임시본과 요청 사용자·턴/시도/회차·승인 대상·파라미터 버전·유효 상태·만료 시각", origin: "agent가 확보·검증한 실행 입력", sensitivity: "전용 임시 테이블에서만 복원 가능한 암호문으로 보관, 감사·로그·일반 재개 상태는 마스킹/참조만", retention: "execution_parameter_storage의 실행 목적·기한·삭제 조건, ADR-025" }
    result_followup_wait:
      scope: "REQ-009.result_dialogue의 결과 확인·다음 작업 선택이 이어가기의 필수 사용자 응답이면 기존 사용자대기로 처리한다. 결과 보고만으로 종료할 수 있으면 별도 대기를 만들지 않는다. 질문 목적·허용 응답·원 호출/결과·가이드/매핑 버전을 기존 턴·시도·회차·대기 식별자에 연결하며 새 상태 코드를 추가하지 않는다"
      response: "현재 대기의 유효한 응답만 반영하며 이 카드의 소유권·기한·중복·개인 순서·현재 권한·종결 검증을 동일하게 적용한다. 조회하겠다는 답은 원 실행이나 후속 상태 변경의 승인이 아니며 실행 승인은 기존 전용 카드로 받는다. 거절은 선택적 후속 처리를 하지 않고 무응답·모호한 답으로 동의를 추정하지 않는다"
      end: "필수 장애 확인은 NFR-022에 따라 먼저 처리한다. 처리 중 결과를 자동 폴링하거나 만료/종결된 대기를 복원하지 않는다. 종결 뒤의 새 확인 요청은 새 턴으로 받고 원 턴의 실행·결과 사실을 바꾸지 않는다"
    execution_parameter_storage:
      store: "agent가 AI 전용 공용 DB의 전용 임시 테이블에 실행에 필요한 파라미터 원값을 암호화해 저장한다. 여러 인스턴스가 같은 저장본을 참조하며 Redis·Spring Session·로그인 세션 속성에 의존하지 않는다. 원값 보관의 제한된 예외이며 일반 조회 결과·API 응답 전체·인증 비밀·감사 자료의 원값 저장으로 확대하지 않는다(REQ-111·PRN-07, ADR-025)"
      preparation: "실행 입력을 확보하는 동안 받은 유효 항목도 같은 보호 범위에서 보관해 부족한 항목만 보완받을 수 있다. 이 준비 상태는 승인이 아니며 최종 승인 요청 전에 모든 값을 확보·검증해 대상·순서·전체 파라미터 버전을 고정한다. 저장 성공이 확인된 같은 버전의 값을 승인 카드에 제시하고 사용자가 확인·최종 승인한 버전을 실제 호출에 사용한다"
      binding: "원값 임시본은 요청 사용자·대화/턴/시도/회차·승인 대상·파라미터 버전에 연결한다. 승인 대상으로 고정한 버전은 덮어쓰지 않으며 대상·순서·값 변경은 새 버전으로 확인·승인받고 이전 버전의 실행 자격을 무효화한다. 일반 재개 상태와 개인 대기 항목에는 임시본 참조를 연결하며 승인 여부의 정본은 기존 승인·턴 상태다"
      access: "agent의 승인 카드 제시와 등록된 업무 실행에 필요한 경로에서만 현재 소유권·권한·시도/회차·기한을 검사해 복호화한다. 승인 카드 원값은 현재 권한이 있는 요청 사용자에게만 제시한다. 암호화 키를 같은 행이나 일반 로그에 복제하지 않으며 원값·복호화된 입력을 감사·증거·일반 체크포인트·애플리케이션 로그에 저장하지 않는다. 모델 전송은 별도로 REQ-106을 따른다"
      execute: "사용자 승인 후 개인 실행 차례가 되면 유효 승인·대상/순서/버전·현재 권한·만료·취소·점유와 전송 이력을 다시 확인한 뒤 승인된 원값을 읽어 등록 API/도구를 호출한다. 서버가 저장한 원값과 승인 근거를 대조하며 클라이언트 재전송 값·마스킹 값·새 조회 값으로 대체하지 않는다. 임시본 조회나 존재 자체가 승인·실행권 또는 중복 방지 근거는 아니며 REQ-105·ARCH-070의 호출 전 방어를 유지한다"
      lifetime: "로그아웃·로그인 세션 만료·브라우저 종료가 승인된 실행값을 삭제하거나 그 기한을 연장하지 않는다(REQ-016). 준비 중 원값 임시본에는 입력 보관의 유한 기한을 두며 추가 정보 대기 중에는 그 대기 기한을 넘기지 않는다. 이는 턴 전체 처리 시간의 상한을 새로 정하는 것이 아니다. 승인 대기는 최초 요청 기한, 승인 뒤 호출 시작은 REQ-026의 승인 후 실행 기한을 적용하며 폴링·재접속·부분 입력·거절·재발급·순서 대기로 자동 연장하지 않는다. 기한 안에 시작한 호출과 기존 명세가 허용한 후속 처리의 보유 구간은 호출 타임아웃·재시도 상한 안으로 제한하며 무기한 보관하지 않는다"
      cleanup: "API 호출과 기존 규칙상 필요한 후속 처리·허용된 자동 재시도가 끝나 원값이 불필요해지면 해당 임시본을 삭제한다. 단순 조회 직후에는 삭제하지 않는다. 중단·종결·만료·회차/버전 무효화 시에는 즉시 신규 사용을 차단하고 삭제한다. 거절 후 재승인을 기다리는 원값은 REQ-017의 최초 기한까지만 유지한다. 결과 불명·수동 확인·조사 보호를 이유로 원값을 계속 보관하거나 금지된 재시도를 허용하지 않는다. 감사에는 마스킹한 값·버전/승인 참조·처리/삭제 결과만 남긴다"
      failure: "임시본 저장·읽기·복호화·승인값 대조에 실패하면 실행하지 않고 기존 실패/보완 경로로 안내한다. 평문 저장·이전 승인 재사용·승인 후 임의 재조회로 우회하지 않는다. 삭제 실패 시 사용 차단을 유지하고 삭제 재처리·운영 경고를 남기며 삭제 완료로 기록하지 않는다. DB 복구로 임시본이 돌아와도 원래 기한·종결·전송 사실을 대조하며 자동 실행·유효성 부활을 허용하지 않는다"
      retention_boundary: "암호화 임시본은 실행 목적의 단기 저장이며 REQ-107의 결과 보존 기간이나 조사 보호로 수명을 늘리지 않는다. 운영 테이블 삭제와 백업·복제본에서의 제거는 구분하고, 백업/키 보존과 복구 후 만료본 제거 계약은 P3에서 정한다. 암호화가 실제 삭제를 대신하거나 만료된 승인에 실행 자격을 주지는 않는다"
    business_rules:
      - "실행 승인 여부를 결정하는 주체는 요청 사용자다. LLM은 사용자 요청·허용 지식/API 후보와 입력 구성 가이드에 따라 호출 대상과 파라미터를 제안하고, agent는 등록된 조회/실행 유형·현재 권한·입력 계약으로 승인 필요 여부와 실행 가능성을 검사한다(REQ-102·105·038·608). 승인 카드 조작은 agent가 현재 요청과 승인 대상에 결합해 기록·검증하며, LLM에 승인/거절 해석을 맡기거나 모델의 승인 표식을 사용자 승인 근거로 쓰지 않는다"
      - "실행 승인 요청 전에 실제 호출에 사용할 모든 파라미터의 최종 값을 확보한다. 사용자 입력뿐 아니라 허용된 조회 결과·등록 기본값·시스템 신원 매핑 등으로 구성한 값도 포함한다. 필요한 값이 없거나 후보가 불명확하면 먼저 조회·추가 정보 요청으로 확보하고 agent가 등록 명세의 필수 여부·타입·범위와 현재 권한으로 검증한다. 미정 값·자리표시자·승인 후 입력/조회/기본값 적용으로 채울 값을 둔 채 최종 승인 카드나 실행 요청을 만들지 않는다(REQ-026·105·608)"
      - "모든 값의 확보·검증이 끝나면 실행할 API/도구·작업 순서와 각 파라미터의 항목명·실제 값을 사용자가 빠짐없이 확인할 수 있도록 승인 카드에 제시한다. 등록 계약에서 허용한 빈값·null·미전송도 미정 값과 구분해 표시하며 실행 시 임의로 채우지 않는다. 사용자가 이 전체 내용을 확인하고 최종 승인 버튼을 조작해야 실행 승인이 성립한다. 작업 개요만 제시한 동의·값 입력·계획 확인으로 최종 승인을 대신하지 않는다"
      - "승인 뒤 추가 입력·재조회·모델 제안 등으로 실행 대상·순서·파라미터 값이 달라지면 이전 승인으로 호출하지 않고 변경된 내용을 제시해 다시 승인받는다. 앞 액션의 실행 결과가 있어야 정할 수 있는 후속 액션은 값을 모르는 상태로 일괄 승인하지 않고, 결과와 필요한 사용자 입력을 확보한 뒤 해당 액션을 개별 승인한다(REQ-026). 추가 정보 입력 자체는 실행 승인이 아니다"
      - "사용자 응답 없이는 진행할 수 없을 때만 사용자대기로 전이한다. 추가 정보, 실행 승인, 차단형 의도 확인을 구분하고 무엇이 필요한지·대상과 선택지·유효 기한을 알린다. 대기별 세부 동작은 wait_types 및 REQ-017·026·032의 정본을 따른다"
      - "추가 정보를 일부만 받거나 일부 값이 형식·범위에 맞지 않으면 유효하게 확보한 값은 실행 입력이면 execution_parameter_storage의 암호화 임시본으로, 그 밖의 값이면 기존 보존·마스킹 정책 안에서 유지하고 부족하거나 잘못된 항목만 다시 요청한다. 현재 대기를 유지하며 불완전한 응답을 후속 처리·실행 대상으로 등록하지 않고 기존 기한을 자동 연장하지 않는다. 필요한 정보가 모두 확보되면 같은 시도에서 이어가며, 실행 승인은 모든 실행 파라미터의 확보·검증 뒤 별도로 받는다. 사용자가 답하지 않은 업무 값이나 승인 여부를 추측해 채우지 않는다. 무관한 새 질의·조건 변경·중단 입력은 기존 의도 분류/중단 경로로 연결한다(REQ-007·030·031·032)"
      - "대기 요청과 이어갈 현재 실행용 상태 및 필수 감사가 저장돼야 사용자에게 정상적인 대기 요청으로 공개한다. 사용자대기에서는 실행 점유를 해제하고 개인 실행 한도에서 제외한다. 저장 실패를 정상 대기로 표시하거나 대기 때문에 실행 자리를 계속 점유하지 않는다(REQ-036·107·109, ARCH-070)"
      - "응답은 현재 사용자·대화·턴/시도/회차·대기 요청·유형에 연결해 서버가 검증한다. 다른 사용자의 요청이나 대상이 특정되지 않은 일반 입력을 임의의 대기 응답으로 적용하지 않는다. 일반 입력의 의도 분류와 실행 승인 카드 조작은 구분한다(REQ-009·017·030)"
      - "응답 처리 시 서버 시각으로 미만료·현재 대기 여부를 검사한다. 만료 배치가 아직 실행되지 않아도 만료된 응답은 이어가지 못하며, 응답 접수와 만료·중단·이미 반영된 응답의 경합은 하나의 유효한 결과로 정한다. 같은 제출의 재전송은 기존 접수 결과와 현재 상태를 확인하고 새 이어가기를 추가하지 않는다"
      - "현재 처리를 계속할 수 있는 추가 정보·명시적 실행 승인·변경/계속 의도 선택만 현재 시도에 연결해 보관한 뒤 REQ-036의 개인 순서에 한 번 등록한다. 승인 거절은 REQ-017로 처리하며 이어가기 실행을 등록하지 않는다. 명시적 중단은 개인 실행 차례를 기다리지 않고 REQ-030·033의 중단 처리로 연결하되 이미 전송한 외부 실행의 취소를 보장하지 않는다. 별개 질의 선택은 원 입력을 새 턴으로 접수해 개인 순서를 적용하고 원 턴의 승인·추가 정보 응답으로 쓰지 않는다. 원 턴은 기존 처리 흐름으로 돌아가며 남아 있는 사용자대기와 기한을 임의로 해소·연장하지 않는다(REQ-030·032)"
      - "이어가기 응답 접수 뒤 앞선 요청이나 개인 한도 때문에 대기하면 자동 이어가기 예정·현재 상태·취소 조작을 제공하며 응답 재제출을 요구하지 않는다. 사용자 응답 대기와 접수 후 개인 순서 대기를 구분해 표시한다(REQ-040)"
      - "사용자 응답 접수 전의 대기 만료와 승인 후 실행 시작의 유효 기한은 state_rules·REQ-026을 따른다. 접수 성공이 실행 시작이나 승인 기한 연장을 뜻하지 않는다. 실제 차례에는 취소·현재 권한·대상/인자 일치·유효 승인·자료 기한을 다시 검사하고 무효면 실행하지 않는다(REQ-036·105·108·109)"
      - "실행 가능할 때 개인 한도와 유효 점유를 확보하고 같은 턴·같은 시도의 유효 실행 상태를 복원한다. 장기 대기 후 내용 버전 재선택은 REQ-108, 주 추론 모델 고정은 ARCH-040, 후속 모델 호출의 선택적 쿼터 재검사는 NFR-012를 따른다. 이어가기를 새 시도 시작으로 취급해 기존 결과를 전부 버리거나 모델을 임의로 바꾸지 않는다"
      - "승인 거절 뒤 카드 무효화·원 턴의 최초 기한까지 사용자대기 유지·추가 질문·후보 확인·재승인·만료 후 새 턴은 REQ-017의 정본을 따른다. 거절을 실행 승인이나 명시적 중단과 동일하게 처리하지 않는다. 중단·만료·종결이 확정되면 이 요청의 응답으로 다시 이어가지 않으며 새 턴 재시도 허용은 REQ-013·113을 따른다"
      - "재접속·폴링·다른 탭 열기는 현재 대기와 유효 조작의 복원이지 새 응답 제출이 아니다. 대기 중 다른 인스턴스로 응답해도 같은 요청에 반영하며, 이미 소비·만료·교체된 카드는 현재 상태를 보여주고 실행에 사용하지 않는다(REQ-016·040)"
    lifecycle: "처리중 → 사용자대기 → 처리를 계속할 유효 응답 보관·개인 순서/실행 선택 → 같은 시도 처리중. 일부 정보는 대기 유지·보완, 승인 거절은 REQ-017의 대기 유지·카드 무효화, 중단은 기존 중단 처리, 별개 질의는 새 턴 접수로 분기한다. 개인 순서·선택은 REQ-036의 개념이며 여기서 새 업무 상태 코드를 정의하지 않는다. 만료·중단·실패·종결은 기존 state_rules·REQ-109를 따르고 병행형 확인은 처리중을 유지한다"
    exceptions:
      - "추가 정보가 누락·부적합하면 유효한 항목을 유지하고 보완할 항목만 안내한다. 필요한 정보가 모두 확보되기 전에는 대기를 끝내거나 후속 실행에 사용하지 않는다. 부분 입력·응답 형식 오류·카드 재표시로 기존 기한을 임의 연장하지 않는다"
      - "이전 카드·다른 시도·만료·중단·종결 후 응답은 진행시키지 않으며, 중복 제출은 기존 접수 결과와 현재 상태를 안내한다. 대상 노출 범위는 현재 열람 권한을 따른다"
      - "응답 접수 성공 뒤 통신이 끊기면 같은 제출의 기존 접수/현재 상태를 확인한다. 화면 오류나 접수 응답 유실만으로 사용자대기 또는 실행을 새로 만들지 않는다"
      - "개인 순서 대기 중 취소·승인 기한 초과·권한 회수·필요 자료 만료가 생기면 REQ-036·105·108·109의 기존 차단/종결/재확인 경로로 처리하며 저장된 응답만으로 실행하지 않는다"
      - "체크포인트·현재 상태·필수 감사의 저장/복원이 실패하면 정상 접수·이어가기 성공으로 가장하지 않는다. 중복 처리·낡은 점유 쓰기를 막고 REQ-107.history_storage·REQ-109·NFR-027의 오류/복구 경로를 따른다"
    permissions: "인증된 요청 사용자의 현재 대화 소유권·Hub 이용 자격·대기 응답 가능 여부를 확인한다. 실행 승인자는 REQ-105의 요청 사용자이며, 응답 접수와 실행/조회/모델 전송/결과 제공은 각각 현재 권한으로 검사한다. 대상 식별자 보유·대기 진입 당시 권한·유효 시간 내 승인만으로 후속 접근을 허용하지 않는다(REQ-103·106·108)"
    audit: "대기 요청·유형/대상·시각/기한, 응답자·연결 요청·승인/거절/추가 정보/의도 선택, 유효/무효/중복/만료 판정, 개인 순서 접수·선택·취소와 이어가기 사실을 기존 턴/시도/회차에 연결한다. 현재 상태와 불변 전이·감사 기록, 업무 트랜잭션 분리·마스킹·보존·기록 실패는 REQ-107·108·109를 따르며 실제 추가 정보의 모델 전송은 REQ-106의 안내·동의 근거와 연결한다 원값 암호문 저장·참조 버전·사용 차단·삭제 성공/실패의 근거는 남기되 임시본의 원값·암호문·키를 감사 이력에 복제하지 않는다."
    volume: "대화에 여러 미종결 턴·서로 다른 대기 요청과 다중 탭/인스턴스 응답이 있을 수 있다. 개인 실행 한도·순서는 REQ-036·NFR-023을 따르고 새 서버 공용 대기열·응답 수 상한은 여기서 정하지 않는다"
    config: "대기 유형별 만료는 state_rules를 따르며 WT-02 추가 정보/계획 확인의 사용자 승인 초기값·범위·고정 시점은 ARCH-033.additional_info_wait가 정본이다. 승인 응답 대기/승인 후 호출 시작은 REQ-026, 의도 확인은 REQ-032, 장기 대기 후 내용 재선택은 REQ-108, 개인 한도·후속 모델 호출 쿼터 검사는 REQ-036·NFR-012·023을 참조한다. 설정 변경으로 기존 기한을 소급 연장하지 않는다"
    risk: "같은 시도의 그래프 저장/복원·대기 전이·개인 순서 선택과 만료/중단/중복 응답의 경합을 실제 다중 인스턴스로 검증해야 한다. LangGraph4j의 설계 재현은 ADR-048 기준으로 ASM-003을 확인했으나 실제 제품의 다중 인스턴스/응답·실행 경합 검증을 대신하지 않는다. 원값과 승인 버전의 불일치, 삭제/실행 경합, 키 유실·삭제 실패·복구 후 만료본 사용은 execution_parameter_storage의 P3 시험으로 검증한다."
