  - id: REQ-013
    type: functional
    priority: must
    category: "질의 재요청"
    actors: [ACT-001]
    title: "원 질의로 새 턴 요청"
    detail: "사용자는 원 턴의 접수·순서 대기·처리 중·사용자대기·중단·완료·실패 상태와 무관하게, 보존되고 접근 가능한 원 사용자 질의를 새 턴으로 다시 요청할 수 있다. 버튼과 자연어 요청 모두 원 질의 메시지·원 턴/직전 대상·최초 원 요청을 참조하는 별도 새 턴과 실행 시도를 발급한다. 원 턴의 진행·대기·종결과 기존 메시지를 유지하고 새 입력/응답은 현재 대화 아래에 기록 순서로 추가한다. 원 질의로 처음부터 처리하며 이전 계획·SQL·결과·추가 정보·승인·체크포인트를 실행 입력으로 자동 승계하지 않는다"
    hard_rule: "원 턴의 상태나 과거 실행 전송 사실만으로 새 질의 접수를 제한하지 않는다. 원 질의를 다시 요청하는 것과 이전 실행을 재전송하는 것은 구분한다. 기존 실행의 결과 불명·중복 실행·승인 통제는 execution_boundary와 REQ-105·113을 따른다. 새 요청마다 현재 소유권·권한·질의 보존·모델·시작 전 쿼터·개인 한도와 동의/자료 기한을 검사한다. 유효 사용자대기의 카드 응답은 같은 턴 이어가기이고 목록의 새 턴 요청 버튼은 독립된 질의 접수다. 원 턴을 자동 취소·종결·재개하거나 이미 종결된 턴을 되살리지 않는다"
    source: "기존 중단 재시도 규칙 · 2026-10-01 사용자 승인(이어가기와 처음부터 재시도 구분·중단 시 재개 상태 정리·새 시도의 모델 변경 허용) · 2026-10-14 다음 요구사항 상세 검토 요청으로 접수·개인 순서 대기·현재 권한/모델·동의·감사/보존·중복 접수 및 늦은 결과의 연결과 검증 기준을 정련했다. 후속 사용자 검토 제안으로 스텝 상한은 새 시도별 예산, 시간·사용량·감사는 턴 전체 누적으로 구분했다. 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-20 사용자 결정: 세션의 모든 사용자 질의에서 새 턴 요청을 제공한다. 중단 상태 한정 및 원본 실행 사실에 따른 질의 접수 금지를 해제하고, 이전 실행 재전송/결과 불명 통제는 실제 실행 경계에 유지한다. 동일 접수의 중복 전송과 사용자의 별도 명시 요청을 구분하도록 보완했다. 방향 결정과 전체 보완 카드 확정은 구분한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-013 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다."
    summary: "모든 상태의 원 질의를 별도 새 턴으로 다시 요청한다. 원 턴의 진행/종결은 유지하고 접수 중복 방지·새 계획과 승인·기존 실행 결과 확인을 각각 적용한다"
    request_boundary:
      terminal: "완료·실패·중단으로 종결된 원 턴은 실행에 재사용하지 않는다. 사용자대기 만료·실행 점유 만료로 중단된 경우도 같다. 기존 시도·회차·승인·체크포인트의 사용 차단·정리는 REQ-109를 따른다"
      new_request: "이 카드의 재시도는 원 질의 메시지로 별도 새 턴을 요청하는 뜻이다. 모든 상태에서 요청할 수 있고 이미 연결된 새 턴이 있거나 끝났다는 이유로 후속 명시 요청을 금지하지 않는다. 보존·권한·쿼터 등 현재 조건은 매 요청마다 확인한다"
      continuation: "유효한 사용자대기 카드 응답은 같은 턴/시도의 이어가기이고, 목록의 새 턴 요청은 원 턴의 대기/기한을 변경하지 않는다. 브라우저 재접속은 상태 조회이며 개별 호출 자동 재시도는 REQ-009의 별도 계약이다"
      expiry: "사용자대기·실행 점유 만료는 원 턴의 종결 조건이고 원 질의·자료의 보존 만료와 구분한다. 원 질의가 접근 불가하거나 보존 만료되면 숨은 체크포인트로 복원하지 않는다. 원 질의의 새 턴 요청을 위한 별도 경과 시간 상한은 현재 정의되어 있지 않다"
      wording: "문서·화면의 조작명은 '새 턴으로 다시 요청'을 사용한다. 원 턴을 재개·재시작하거나 중단 지점부터 계속한다는 표현을 쓰지 않는다. REQ-014는 전체 질의 목록·상태·선택과 즐겨찾기 등록 진입을 제공하고 새 턴 요청의 처리 규칙은 이 카드가 소유한다"
    intent:
      problem: "완료·실패·중단·진행 중인 질의를 다시 입력하는 부담이 있고, 마지막 단계부터 무조건 이어가면 중복 업무 실행·낡은 승인·이전 결과 혼입이 생길 수 있다"
      goal: "재시도를 편리하게 제공하면서 현재 조건 재검사와 시도별 이력 분리로 중복 실행·권한 우회를 막는다"
    goal_trace: [GOAL-1, GOAL-2]
    decider: "제품 오너(사용자). 2026-10-20 모든 질의의 새 턴 요청 방향을 반영한 전체 보완 카드이며 기존 확정본과 구분한다"
    preconditions:
      - "현재 인증과 대화/원 질의 메시지의 소유권·접근 권한을 확인하고 보존 정책상 사용할 수 있는 질의문을 확보한다"
      - "사용자가 새 턴 요청 의도와 대상 질의를 명시한다. 원 턴의 중단·종결 여부는 선행 조건이 아니다"
      - "이전 상태 변경 실행 기록은 질의 접수의 일괄 차단 근거가 아니라 실행 단계의 중복·결과 불명 확인 근거로 사용한다"
    data:
      - { item: "원 질의와 대화/턴·이전 시도·현재 상태·해당되는 중단 사유/시각", origin: "서버가 보존한 원 요청과 REQ-107 현재 상태/불변 사건", sensitivity: "원 질의의 업무 데이터·개인정보와 내부 처리 근거", retention: "REQ-107·109의 각 보관 정책. 재시도로 기존 기한을 연장하지 않는다" }
      - { item: "재시도 요청 식별자·새 시도·선택 모델/공급 경로/effort와 접수/대기/시작 상태", origin: "사용자 명시 요청과 서버 허용 판정", sensitivity: "개인 선택·실행 문맥", retention: "REQ-107의 접수/상태/사용량 및 감사 정책" }
      - { item: "이전 실행 전송·결과 불명·승인·늦은 응답/카드와 새 시도의 정책/동의 근거", origin: "스텝·호출·승인/동의·감사 기록", sensitivity: "업무 실행/전송의 감사 근거", retention: "REQ-105·106·107·109. 실행용 체크포인트와 결과 사본의 수명은 구분한다" }
    business_rules:
      - "버튼은 원 질의로 처음부터 새 턴을 요청한다. 자연어가 성공 결과 교정·추가 작업을 뜻하면 REQ-024 등 해당 경로로 구분하고 의도가 불명확할 때만 확인한다"
      - "원 턴이 진행·대기 중이어도 별도 새 턴을 요청할 수 있다. 새 요청 때문에 원 턴을 취소하거나 원 대기 카드에 응답한 것으로 처리하지 않는다"
      - "새 턴은 자체 회차·실행 시도·시간·감사와 NFR-013의 스텝 예산을 갖는다. 원 턴의 회차·상태·메시지·처리 이력은 수정·승계하지 않는다"
      - "주 추론 모델·effort·공급 경로는 새 턴/시도의 현재 허용 설정으로 선택한다(ARCH-040). 기존 시도의 설정은 바꾸지 않는다"
      - "개별 호출 자동 재시도는 REQ-009·105, 명시적 원 질의의 새 턴 요청은 이 카드, 질의 즐겨찾기 저장·입력 반영은 REQ-201을 따른다"
    retry_flow:
      - "REQ-014의 전체 사용자 질의 목록에서 질의문·현재 상태와 필요 시 응답 레이어를 확인하고 '새 턴으로 다시 요청' 버튼으로 명시 요청한다. 버튼 대상/의도 및 접수 조건 검사는 별도 LLM 호출 없이 처리한다"
      - "현재 인증·소유권·원 질의 보존·허용 모델·시작 전 쿼터 등 접수 조건을 확인한다. 원 턴의 상태/실행 이력만으로 새 질의 접수를 거절하지 않는다"
      - "새 턴/시도·접수 요청 식별자·원 질의 메시지·원본/직전 대상·최초 원 요청 참조·새 입력 메시지·필수 접수 사건을 함께 저장하고 접수 결과를 반환한다(REQ-016·036·107)"
      - "개인 실행 한도가 차면 REQ-036의 사용자별 순서에 대기하고 대기 안내·취소를 제공한다. 접수 성공은 실행 시작이 아니며 대기 항목은 실행 한도에서 제외한다"
      - "실행 차례에 현재 시작 조건을 재검사하고 원 질의로 해석·지식 검색·계획·조회/가공을 처음부터 구성한다. 자료의 현재 권한·보존·동의와 업무 통제는 REQ-038·106·108을 따른다"
      - "새 계획의 상태 변경 실행 전에는 execution_boundary와 REQ-026·105·113의 이전 실행 사실 확인·현재 승인·결과 불명 통제를 적용한다"
      - "입력/응답을 REQ-019의 메시지 기록 순서로 추가하고 원 질의와 새 턴 사이 양방향 이동을 제공한다. 원 턴이 진행 중이면 자체 진행을 계속 표시하고 종결됐으면 그 결과/시간을 유지한다"
    execution_boundary:
      admission: "질의문을 다시 보내는 요청은 이전 실행 API/도구의 재전송 요청으로 취급하지 않는다. 과거 실행 완료·전송·결과 불명 또는 기록 확인 불가만으로 질의문 선택·새 턴 접수를 막지 않는다"
      completed: "과거 실행 결과와 최근 이력은 새 실행의 승인 판단 근거로 제시한다(REQ-026·113). 새 턴에서 실행이 다시 필요하면 현재 대상·순서·모든 인자를 확인하고 별도 명시 승인을 받아야 한다. 새 턴 요청 버튼·자주 쓰는 질의 등록 자체는 실행 승인이 아니다"
      unknown: "이미 전송된 실행이 처리 중이거나 결과 불명이고 새 계획이 그 동일 실행을 반복하려는 경우에는 REQ-105·113의 결과 확인/수동 확인을 먼저 적용한다. 확인할 근거가 없으면 미실행으로 추정하거나 기존 실행을 자동/무확인 재전송하지 않는다. REQ-105.manual_reexecution의 최신 대상 시스템 확인과 새로운 최종 승인으로 새 턴의 후속 실행 1회를 허용하며 같은 결과 불명이 반복돼도 매번 새 확인/승인을 받는다. 원 불명·원 턴은 유지하고 질의 접수 성공과 실제 실행 허용을 구분해 안내한다"
      context: "이전 실행 사실은 중복 방지·결과 확인용으로 참조하며 기존 계획·승인·체크포인트를 새 실행 입력으로 자동 복원하는 근거로 쓰지 않는다"
    restart_scope:
      reuse: "원 사용자 질의를 재입력 없이 요청의 출발점으로 사용한다. 원문 보존이 끝났거나 접근할 수 없으면 숨은 체크포인트로 복원하지 않고 재입력 등 필요한 안내를 제공한다"
      discard: "이전 시도의 검색·선택 카탈로그·계획·SQL·중간 답변·추가 정보/승인 카드 응답·도구 결과·승인·실행용 체크포인트를 새 시도의 실행 입력으로 자동 사용하지 않는다. 필요한 자료는 새 흐름에서 확보/확인한다"
      reference: "원 질의가 과거 결과/직접 자료를 참조하더라도 자동 승계나 무조건 재전송의 근거가 되지 않는다. 출처·현재 권한·기한·목적과 동의 범위는 REQ-002·106·107을 따른다. 모델 공급 경로 등 범위가 바뀌면 필요한 확인 후 전송한다"
      counting: "스텝 상한은 NFR-013의 실행 시도별 예산을 적용한다. 재시도 새 턴의 실행 시도는 자체 예산으로 시작하고 같은 시도의 되돌림·이어가기·인계로 초기화하지 않는다. 각 턴/시도의 시간·스텝·사용량·감사는 독립 보존하며 연관 합계는 참조 관계로 집계해 개별 턴 합계와 구분한다. 이전 사용량은 개인 쿼터에 계속 반영한다. 전체 시간·턴 토큰 종료 상한은 추가하지 않는다"
    concurrency:
      - "같은 접수 요청 식별자의 연타·재전송·응답 유실 재확인은 새 턴 1건으로 처리한다. UI는 접수 중 동일 조작을 중복 제출하지 않고 재전송할 때 같은 식별자를 사용한다"
