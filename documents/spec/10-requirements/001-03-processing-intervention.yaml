    detail: "현재 대화 세션 창에 해당 세션의 모든 사용자 질의를 본문과 별도의 목록으로 표시한다. 접수·순서 대기·처리 중·사용자대기·완료·실패·중단을 구분하고 중단 항목은 문구와 표시로 바로 알아볼 수 있게 한다. 각 항목에 원 질의·접수 시각·현재 상태, '새 턴으로 다시 요청'과 '자주 쓰는 질의로 등록' 버튼을 제공한다. 질의 항목을 클릭하면 선택한 질의와 연결된 응답 내용을 현재 화면 위 모달 또는 팝업 레이어에서 확인한다. 목록과 레이어에는 본문 원본 위치로 이동하는 조작을 두지 않고 열람만으로 본문 조회 범위나 스크롤 위치를 변경하지 않는다. 원 턴 상태와 무관한 새 턴 요청은 REQ-013, 질의 즐겨찾기 등록·관리는 REQ-201을 따른다"
    hard_rule: "목록 조회·응답 레이어 열람·상태 표시·표준 안내·버튼 대상/의도 확인·접수 및 즐겨찾기 등록 자체에 별도 LLM 호출을 하지 않는다. 중단 상태나 새 턴 요청 허용 여부로 목록을 필터링해 다른 사용자 질의를 숨기지 않는다. 목록 조회·응답 레이어 열기/닫기·재접속·무관한 새 질의는 새 요청·승인·즐겨찾기 등록을 자동 생성하지 않는다. 새 턴 요청 접수 이후 실제 질의 처리의 모델 호출은 REQ-013·038을 따른다"
    source: "2026-10-20 사용자 결정: 중단 질의 목록으로 제한하지 않고 해당 세션의 모든 사용자 질의를 별도 목록에 표시한다. 중단 상태를 눈에 띄게 표시하고 모든 상태에서 새 턴 요청을 제공한다. 각 항목의 자주 쓰는 질의 등록 버튼을 기존 portal 질의 즐겨찾기 요구사항에 연결한다. 원 턴 종결과 새 턴 요청의 경계는 유지한다. 후속 사용자 지적으로 변경·추가 입력은 그대로 즐겨찾기에 등록하지 않고 REQ-201.favorite_eligibility의 기존 분류/문맥 관계로 등록 자격을 확인한다. 후속 사용자 요청으로 질의 항목 클릭 시 연결 응답을 모달/팝업 레이어에서 확인하는 요구와 상태·권한/보존·조회 오류·읽던 위치 유지 기준을 추가했다. 이어 사용자 요청으로 019의 최신 메시지 묶음 기준에 통일하고 014의 원본 위치 이동을 제거해 목록 클릭은 응답 레이어 열람으로 한정했다. 같은 날 사용자가 최종 검토한 전체 보완본을 명시적으로 확정했다. 상세 설계·구현·실행 검증은 후속이다"
    roadmap: RM-P1
    summary: "세션 전체 사용자 질의를 상태와 함께 탐색하고 항목 클릭으로 연결 응답을 레이어에서 확인하며, 새 턴 요청과 질의 즐겨찾기 등록을 선택한다"
