      matching: "REQ-019·107의 세션·질의 메시지·응답 대상 참조로 응답을 찾는다. 같은 문장·같은 턴이라는 이유로 다른 입력이나 연결된 재요청 턴의 응답을 섞지 않는다. 연결된 공개 응답 블록이 여럿이면 기록 순서로 표시하고 현재 본문 페이지 밖 응답도 필요한 범위만 조회한다. 변경/추가 입력에 개별 응답이 없으면 그 사실과 확인된 관련 원 질의/응답의 참조 정보만 표시하며 가장 가까운 응답을 임의로 붙이지 않는다"
      content: "대화 본문에 공개되는 응답 내용을 REQ-011·027의 텍스트·표·차트 등 기존 표현 규칙으로 보여준다. 긴 응답과 큰 결과는 레이어 내 스크롤·기존 지연 조회로 확인한다. 표현 미지원·부분 오류는 기존 안내를 적용하며 내부 추론·숨은 도구 출력·실행 원값을 추가 노출하지 않는다"
      state: "완료 응답과 처리 중의 공개된 부분 응답/상태를 구분한다. 처리 중에는 REQ-006·040의 기존 상태 조회/갱신과 연결하고 아직 응답이 없으면 응답 대기 중으로 표시한다. 실패·중단된 경우 보존된 공개 응답과 종결 사유를 표시하고 응답이 생성되지 않은 경우를 별도로 알린다. 부분 응답을 완료 답변으로 표시하지 않는다"
      access: "열람 시 현재 소유권·권한·마스킹·응답/결과 보존을 서버에서 확인한다(REQ-108·109). 삭제·보존 만료·권한 회수로 볼 수 없는 경우에는 해당 사유와 허용된 정보만 표시하고 캐시·체크포인트·재실행으로 내용을 복원하지 않는다. 열람으로 보존 기한을 늘리지 않는다"
      read_only: "응답 보기는 기존 공개 내용의 조회다. 열기·갱신·닫기로 새 턴·LLM/업무 도구 호출·원천 재조회·승인/실행·즐겨찾기 등록을 만들지 않는다. 과거 응답에 카드가 포함돼도 열람 중 승인/변경/중단 조작을 실행하지 않으며 현재 유효한 조작은 기존 대화 화면의 계약을 따른다. 목록/레이어에는 본문 위치 이동 수단을 추가하지 않는다"
      interaction: "불러오는 중·응답 없음·열람 불가·조회 실패를 구분하고 조회 실패에는 해당 응답 재조회 수단을 제공한다. 레이어만의 오류는 목록·본문·기존 턴 처리를 차단하지 않는다. 닫으면 목록/본문의 페이지·스크롤·선택 위치와 작성 중 입력을 유지한다. 다른 항목 선택·레이어 닫기·세션 전환 뒤 늦게 도착한 응답이 현재 선택 내용을 덮거나 레이어를 다시 열지 않게 한다"
