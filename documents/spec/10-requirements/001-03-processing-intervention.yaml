      fields: "대화·질의 메시지·원 턴 참조, 현재 권한/마스킹을 적용한 질의문 표시, 질의 접수 시각, 현재 처리 상태, 확정된 입력 종류·등록 자격/불가·판정 전 사유, 해당되는 중단 시각/공개 사유, 항목 클릭으로 여는 응답 보기와 두 조작을 제공한다. 내부 추론·실행 원값·비밀값은 공개하지 않는다"
      status: "접수·순서 대기·처리 중·사용자대기·완료·실패·중단을 구분한다. 중단은 상태 문구와 표식으로 즉시 식별하며 색만으로 구분하지 않는다. 중단 요청 접수/반영 중을 중단 확정으로 표시하지 않고 통신/조회 실패도 업무 중단으로 표시하지 않는다"
      actions: "모든 상태의 항목에 '새 턴으로 다시 요청'과 '자주 쓰는 질의로 등록'을 제공한다. 즐겨찾기 등록은 REQ-201.favorite_eligibility의 입력 종류·문맥 관계로 활성 여부를 구분하고 변경/추가 응답·문맥 의존 입력·판정 전은 비활성화와 사유를 표시한다. 새 턴 요청은 REQ-013의 현재 조건을 적용하고 개인 실행 한도 포화는 REQ-036의 접수/순서 대기로 처리한다. 현재 권한·질의 보존 등으로 사용할 수 없는 조작은 사유를 표시하며 그 이유로 조회 가능한 다른 목록 항목을 숨기지 않는다"
      linked_state: "원 턴 상태와 각 연결 새 턴의 진행을 구분한다. 기존 접수 결과를 확인하는 수단을 제공하되 연결 턴의 접수·처리·종결을 이유로 원 질의의 이후 명시적 새 요청 버튼을 영구 비활성화하지 않는다. 동일 조작의 접수 중 중복 제출과 별도 명시 요청은 REQ-013.concurrency로 구분한다"
      wording: "목록 제목은 '이 대화의 질의', 조작명은 '새 턴으로 다시 요청'과 '자주 쓰는 질의로 등록'으로 표시한다. 새 턴 요청은 원 턴의 재개가 아니고, 즐겨찾기 등록은 질의를 실행하지 않는다는 의미를 안내한다"
      refresh: "세션 열기·재접속·새 질의 접수·상태 변경·각 버튼 결과에 따라 목록/조작을 갱신한다. 빈 세션과 목록 조회 실패를 구분한다. 목록만 실패하면 해당 영역에 오류/재조회 수단을 두고 정상적인 본문 조회·신규 질의 입력을 막지 않는다. Portal 인증·현재 이용 권한·세션 삭제 오류에는 Portal 영역의 접근 통제를 적용한다"
      selection: "질의 항목 클릭은 response_preview의 모달/팝업 레이어만 연다. 목록/레이어에서 본문의 원본 위치로 이동하는 버튼·링크·자동 스크롤은 제공하지 않는다. 응답은 본문과 독립적으로 조회하며 본문의 로드된 구간·과거 페이지 조회 경계·읽던 위치를 바꾸거나 조회하지 않은 본문을 읽은 것으로 처리하지 않는다. 새 입력 메시지를 만들거나 본문 기록 순서를 바꾸지 않는다"
    response_preview:
