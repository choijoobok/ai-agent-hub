      - { case: "저장 실패·임시본 부재·복호화 오류·승인값 대조 실패", expected: "호출을 차단하고 사유를 남긴다. 평문 저장·마스킹 값 호출·승인 후 값 채움·클라이언트 값 대체로 우회하지 않는다" }
      - { case: "원값 삭제 실패·종결/만료된 임시본의 백업 복구", expected: "사용 차단을 유지하며 삭제 재처리·운영 경고를 남긴다. 복구된 임시본의 원래 기한·종결·전송 근거를 검사하고 자동 실행하지 않으며 감사 마스킹 사본은 별도 보존한다" }
      - { case: "결과 불명 수동 확인 응답만 제출 또는 예전 재승인 카드 재사용", expected: "현재 후속 실행의 최종 승인 없이는 호출하지 않는다. 확인/승인 대상·기한·전체 값이 이번 실행과 일치해야 한다" }
      - { case: "재승인 버튼 연타·다중 탭·응답 유실", expected: "같은 승인/실행의 접수 결과를 반환하고 후속 실행을 한 번만 시작한다" }
      - { case: "추가 질의로 승인 카드가 본문 위로 밀리거나 과거 페이지 밖에 있음", expected: "입력창 위 승인 대기에서 현재 요청을 찾아 전체 값을 확인·승인할 수 있다. 본문 전체 재조회·원 위치 이동·새 카드 발급이 필요하지 않다" }
      - { case: "같은 승인 요청을 본문·패널·여러 탭에서 표시", expected: "요청/카드/버전과 만료가 같고 요청 건수·승인·실행·개인 대기 항목이 늘지 않는다. 유효 응답은 한 번만 반영된다" }
      - { case: "복수 독립 승인 요청과 거절 후 재승인/변경값 준비 중 요청", expected: "대상을 명확히 선택하고 현재 가능한 행동을 구분한다. 한 요청의 교체로 다른 요청을 무효화하지 않으며 거절한 카드에 승인 버튼을 제공하지 않는다" }
      - { case: "질문하기·보류·패널 닫기·재열기", expected: "입력/스크롤과 현재 유효 카드·기한을 유지한다. 실제 질문 제출 전 새 턴/호출이 없고 제출 뒤에도 질문의 답을 승인/원 건 변경으로 자동 반영하지 않는다" }
      - { case: "내용 변경 확정 뒤 새 카드 준비/저장 실패", expected: "이전 승인/원값 사용은 차단된 상태로 유지하며 실패를 이유로 구카드를 복원하거나 새 값을 이전 승인으로 실행하지 않는다" }
      - { case: "다른 탭에서 카드 교체·승인·거절·만료 후 낡은 패널 승인", expected: "서버가 현재 요청/버전·기한을 재검사해 무효 또는 중복을 처리한다. 구카드의 클릭을 최신 카드 승인으로 변환하지 않는다" }
      - { case: "패널 열람 중 파라미터 버전 변경과 늦은 조회 응답", expected: "변경 사실과 현재 전체 값을 다시 제시하고 새 최종 조작을 받는다. 늦은 응답으로 과거 요청·값·승인 가능 상태가 복원되지 않는다" }
      - { case: "과거 응답 팝업·무효 본문 카드·삭제된 실행 원값", expected: "과거 응답은 읽기 전용이고 무효 원값을 복호화/재조회해 표시하지 않는다. 본문 구카드의 현재 내용 확인은 현재 권한·유효 요청 조회로 연결한다" }
      - { case: "현재 상태 조회 또는 원값 조회/복호화 실패", expected: "최종 승인을 허용하지 않고 사유와 재조회/보완을 안내한다. 마지막 캐시를 정상 최신 승인본으로 사용하지 않는다" }
    volatility: { level: medium, what: "대기 유형별 표시·입력 검증·동시 응답 및 그래프 저장/복원 계약, 기존 설정으로 조정되는 만료·내용 재선택 기준" }
    open:
