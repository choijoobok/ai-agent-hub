      - { case: "대기 저장·응답 보관·필수 감사·상태 복원 실패", expected: "성공으로 공개하거나 유효 상태 없이 실행하지 않으며 실패/복구 사실과 기존 접수를 대조할 수 있다" }
      - { case: "필요한 추가 정보 세 항목 중 두 항목만 유효하게 제출", expected: "유효한 두 항목을 실행 입력의 암호화 임시 보관 또는 해당 값의 기존 보존 정책 안에서 유지하고 나머지 항목만 요청한다. 현재 대기와 원래 기한을 유지하며 전체 정보 확보 전 이어가기·최종 승인·실행을 등록하지 않는다" }
      - { case: "승인 거절 뒤 같은 카드 승인 또는 기한 안 명시적 재승인 요청", expected: "거절한 카드의 승인은 거부한다. 원 턴은 최초 기한까지 사용자대기를 유지하며 후보 확인·전체 값 확인과 별도 새 승인 카드의 최종 승인 없이는 실행하지 않는다" }
      - { case: "개인 한도 포화 중 중단 선택 또는 별개 질의 선택", expected: "중단 처리는 개인 실행 순서를 기다리지 않는다. 별개 질의만 새 턴으로 접수하고 원 턴의 승인·추가 정보로 사용하지 않으며 남아 있는 원 대기와 기한을 임의로 해소·연장하지 않는다" }
      - { case: "승인 거절 뒤 최초 기한 만료와 이후 재요청", expected: "원 턴은 중단하고 기존 카드·승인 후보로 되살리지 않는다. 이후 명시적 새 계획·승인은 새 턴으로 처리하며 중단 재시도로 접수하면 REQ-013·113의 허용 조건을 적용한다" }
