  - id: REQ-024
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "성공한 턴의 결과 교정 재요청"
    detail: "성공한 결과가 의도와 다르면 사용자가 원 턴과 교정 내용을 지정해 새 턴으로 요청한다. 보존되고 현재 접근 가능한 이전 해석·계획·SQL을 재작성 참고로 사용해 원 질의를 전부 다시 입력하지 않게 하되, 원 턴의 성공 결과와 이력을 수정하거나 실행을 되살리지 않는다"

    note: "REQ-013(중단 후 원 질의로 새 턴 요청)과 **다른 경로**다"
    summary: "성공한 원 턴을 보존하면서 교정 요청을 원 턴에 연결된 새 턴으로 처리한다"
    preconditions:
      - "성공한 원 턴과 사용자의 교정 의도를 식별할 수 있다. REQ-013의 원 질의 새 요청 및 REQ-007의 미종결 턴 변경과 구분한다"
    data:
      - item: "원 턴/원 질의 참조·교정 입력·허용된 참고 산출물과 버전·새 턴/시도 연결"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
