      - { case: "거절 후 재승인 대기·승인 후 개인 순서 대기 중 기한 경과", expected: "거절은 최초 기한 안에서만 원값을 유지하며 대기 때문에 기한을 늘리지 않는다. 만료 즉시 사용을 차단하고 삭제하며 이미 기한 안에 시작한 호출의 한정된 후속 처리와 구분한다" }
