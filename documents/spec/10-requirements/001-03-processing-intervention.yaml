    list_contract:
      scope: "현재 세션에 서버 접수된 사용자 질의 메시지 전체를 대상으로 한다. 최초 질의·후속 질의·새 턴 재요청과 조건 변경·추가 정보 답변으로 기록된 사용자 입력을 포함하고 동일 문장이라도 별도 제출이면 구분한다. 승인/거절 카드 조작·시스템 진행 문구·AI 응답은 질의 항목으로 생성하지 않는다. 다른 사용자/세션의 질의를 섞지 않는다"
