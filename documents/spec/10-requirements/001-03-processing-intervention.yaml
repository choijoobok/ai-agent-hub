  - id: REQ-017
    type: functional
    priority: must
    category: "승인 대기·질문·보류·재승인"
    actors: [ACT-001]
    process_step: PRC-03-01
    roadmap: RM-P1
    title: "승인 전 추가 질문·보류와 거절 후 재승인"
    detail: "사용자는 승인 요청을 받은 뒤 결정하기 전에 원 승인 요청과 연결해 별도 질문을 할 수 있다. 질문·보류는 승인/거절이 아니며 유효한 기존 카드와 최초 대기 기한을 유지한다. 거절은 해당 카드를 무효화하고 원 턴을 최초 기한까지 사용자대기로 유지한다. 원 건 재승인을 명시하면 대상을 확인한 뒤 같은 최초 기한의 새 카드에서 전체 실제 값으로 승인받는다. 실행 내용이 변경되면 기존 승인 자격을 차단하고 새 전체 값을 검증한다. 아직 유효 최종 승인을 받지 못한 승인 대기가 기한을 넘으면 원 턴을 중단하며 이후 명시적 새 계획·승인은 새 턴으로 처리한다."
    hard_rule: "최종 실행 승인은 REQ-005의 전체 실제 값 확인과 승인 카드의 명시적 승인 조작으로만 성립한다. 질문의 답·후보 확인·자연어 동의·보류·패널 열람을 승인이나 원 요청 변경으로 소비하지 않는다. 거절·교체된 카드는 되살리지 않고 질문·재발급으로 최초 기한을 연장하지 않는다. 유효 최종 승인이 접수된 뒤에는 최초 대기 기한이 아니라 REQ-026의 승인 후 실행 시작 기한과 현재 실행 조건을 적용한다."
    source: "2026-10-19 사용자 동의로 거절 카드 무효화·최초 기한까지 원 턴 대기·만료 뒤 새 턴 경계를 반영했다. 2026-10-26 사용자 논의와 보완 요청으로 승인 전 질문/보류와 거절을 구분하고, 승인 대기 고정 진입점·현재 승인 패널·변경 시 구카드 무효화를 연결했다. 최초 대기와 승인 후 기한, 재발급 경합·별도 질문/변경·부분 실행/불명·감사 및 검증 기준을 정련했다. 이후 같은 날 사용자가 REQ-017도 확정 처리하도록 명시 요청하여 질문/보류·거절/재승인·화면 접근·기한·검증 기준 17건을 포함한 전체 보완본을 confirmed로 확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다."
    summary: "질문하거나 결정을 미루는 동안 유효 승인 요청을 유지하고, 거절/변경된 카드에는 새 확인·승인을 요구한다. 대기 기한과 승인 후 실행 기한을 구분하며 스크롤 없이 현재 승인 내용을 확인한다."
    intent:
      problem: "추가 확인을 원하는 사용자가 불필요하게 거절하거나 과거 카드를 찾아야 하고, 질문/변경/승인 연결 또는 기한이 잘못 해석되면 다른 요청 승인·중복 실행·승인 후 오중단이 생긴다"
      goal: "사용자가 현재 요청의 전체 내용을 확인해 결정하고 서버는 그 요청과 현재 유효 버전에만 승인·거절·재승인을 반영한다"
      not: ["질문·보류는 새 업무 상태나 승인 대기 기한 연장 사유가 아니다", "실행 결과 불명을 원 상태 변경이나 거절 카드 재활성화로 해소하지 않는다"]
    goal_trace: [GOAL-0, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "REQ-005의 원 요청·카드/입력 버전·소유권·기한·현재 상태 저장과 REQ-026의 승인 범위/기한을 적용한다"
      - "고정 승인 대기 진입점·현재 승인 상세 패널·구카드 표시·제출 재검사는 REQ-005.approval_presentation, 재접속 복원은 REQ-040을 따른다"
    before_decision:
      question: "질문하기 또는 대상이 명확한 일반 입력으로 승인 전에 추가 질문할 수 있다. 질문은 원 승인 요청·관련 입력/답변의 관계를 남긴 별도 턴으로 처리하며 새 질의의 현재 권한·개인 순서·쿼터와 자료 전송 통제를 따른다. 추가 질문의 실패·종결·답변 도착이 원 요청을 승인·거절·변경·중단시키지 않는다. 원 요청이 기다리는 동안 질문을 처리할 수 있게 기존 사용자대기의 점유/개인 실행 한도 해제 규칙을 적용한다."
      hold: "질문·보류·패널 닫기만으로 유효 카드/입력값을 무효화하거나 새로 발급하지 않는다. 별도 보류 상태를 추가하지 않고 기존 사용자대기를 유지하며 현재 남은 기한과 실행하지 않았음을 안내한다. 질문 처리가 길어져 원 대기가 만료돼도 질문 턴 자체를 그 이유로 중단하거나 원 턴을 되살리지 않는다."
      interpretation: "수량 5개이면 금액이 얼마인지 묻는 질문은 별도 질의이며 원 주문 수량을 바꾸지 않는다. 원 건 수량을 5개로 바꾸고 다시 승인하겠다는 요청은 REQ-007의 변경 경로로 연결한다. 대상·의도가 모호하면 REQ-007·032로 확인하고 최근 요청·질문 답을 임의 적용하지 않는다."
    decision_routes:
      approve: "현재 유효한 전체 실제 값에 대한 명시적 카드 승인만 REQ-005·036의 같은 턴/시도 이어가기 접수로 연결한다. 접수 성공과 실제 실행 시작은 구분한다."
      reject: "거절한 카드의 승인 자격을 무효화하고 거절 사실을 남긴다. 원 턴은 해당 승인 요청의 최초 기한까지 사용자대기를 유지하며 거절 자체로 이어가기 실행을 등록하지 않는다. 실행하지 않았음·현재 만료 시각·재승인과 중단의 차이를 안내한다."
      stop: "원 요청의 명시적 중단은 REQ-007에 따라 대기/이어가기 자격을 끝내고 기존 원값 사용 차단·정리를 적용한다. 거절과 구분하며 종결된 요청은 늦은 응답으로 재개하지 않는다."
    reapproval:
      target: "사용자가 거절한 원 건의 재승인을 명시하면 현재 소유권·대화/턴·대기 요청을 확인해 후보 요약으로 대상을 먼저 확인한다. 후보가 없으면 사유와 가능한 새 요청 경로를 안내하고 복수/불명확하면 사용자가 선택·확인하게 한다. 다른 사용자/권한 밖 후보를 노출하지 않는다. 후보 확인은 실행 승인도 새 카드 발급 성공도 아니다."
      issue: "원 턴이 미종결이고 해당 승인 대기가 최초 기한 안인 경우, 현재 대상·순서·전체 실제 값을 검증해 같은 만료 시각의 새 카드를 제시한다. 거절한 카드의 재활성화와 단순 패널 재열기를 구분한다. 필수 저장과 현재 상태 검사가 성공한 카드만 공개하며 저장 실패로 이전 카드를 되살리지 않는다."
      change: "실행 내용의 변경 확정은 REQ-007의 현재 상태·전송 경합 판정을 따른다. 이전 카드/승인과 원값 신규 사용을 무효화한 뒤 영향받는 계획·미전송 실행 범위와 모든 최종 값을 확보·검증해 새 승인받는다. 승인할 전체 내용을 사용자에게 다시 제시하고 이전 승인 조작을 새 카드에 옮기지 않는다."
      race: "발급 요청 연타·응답 유실·다중 탭/인스턴스에서도 같은 요청 재전송으로 유효 카드가 중복되지 않게 하고 교체된 카드는 승인할 수 없게 한다. 발급·최종 승인 각각에서 서버 시각·현재 대기/버전·소유권·권한을 확인한다. 승인·거절·교체·만료·중단 경합은 기존 조건부 처리로 하나의 유효 결과를 확정하고 과거 카드를 최신 승인으로 변환하지 않는다."
    deadlines:
      before_approval: "최초 승인 요청에 확정된 응답 대기 만료 시각은 추가 질문·보류·후보 확인·거절·같은 요청의 재발급·재접속으로 연장하지 않는다. 아직 유효 최종 승인이 접수되지 않은 승인 대기가 만료되면 원 턴을 중단한다. 만료 배치가 늦어도 서버 응답 처리 시각과 현재 상태를 검사하며 사용자의 버튼 클릭 시각만으로 미만료를 인정하지 않는다."
      after_approval: "최초 기한 안에 유효 최종 승인이 접수되면 사용자 승인 대기를 끝내고 REQ-005·026·036의 승인 후 호출 시작 기한·개인 순서·실행 직전 검사를 적용한다. 이후 최초 대기 시각이 지났다는 이유만으로 승인된 요청을 중단하거나 필요한 원값을 삭제하지 않는다. 승인 후 실행 기한도 순서 대기 때문에 자동 연장하지 않는다."
      after_end: "유효 승인 전 만료·명시 중단·종결 뒤에는 기존 카드·후보 확인 응답으로 원 턴을 되살리지 않는다. 이후 명시적 새 계획·승인은 REQ-013·113의 새 턴으로 처리한다. 상세 기한값과 적용 설정값·판정 시각은 REQ-026이 소유하며 이 카드에서 새 수치나 원 턴 전체 시간 상한을 만들지 않는다."
    execution_boundary:
      partial: "연속 액션 중 일부가 이미 수행됐다면 완료/전송 사실을 보존하고 REQ-007·026에 따라 현재 승인할 미전송 범위를 구분한다. 후속 승인 거절·재승인으로 완료 액션을 반복하거나 원복하지 않는다."
      unknown: "이미 전송한 실행의 처리 중·결과 불명을 거절 카드 재발급으로 우회하지 않는다. 결과 불명 뒤 후속 실행은 REQ-105.manual_reexecution의 최신 대상 시스템 확인·새 턴/새 승인 경로를 따르며 원 불명 기록을 유지한다."
    business_rules:
      - "질문/보류·거절·명시 중단은 before_decision과 decision_routes, 재발급/변경은 reapproval의 판정을 따른다. 화면 접근과 현재 버전 제출 검사는 REQ-005.approval_presentation을 적용한다"
      - "승인 전후 기한은 deadlines, 이미 수행/전송한 작업과 결과 불명은 execution_boundary의 경계를 적용한다"
    exceptions: ["후보 부재·권한 상실·조회/저장 실패·낡은 응답·만료/종결은 reapproval·deadlines 및 REQ-005의 실패 처리로 연결하며 이전 카드 재사용이나 자동 승인으로 보정하지 않는다"]
    volume: "같은 대화의 복수 독립 승인 요청·여러 탭·인스턴스의 동시 조작을 구분한다. 질문 턴은 기존 개인 실행 한도·쿼터를 따르며 별도 수치 상한을 만들지 않는다"
    config: "승인 전 응답 대기와 승인 후 호출 시작 기한의 값·효력 시점은 REQ-026을 따른다. 별도 보류 상태·기한 연장·자동 승인 설정을 추가하지 않는다"
    risk: "서로 다른 탭의 낡은 카드와 변경/승인/만료 경합이 잘못된 요청 승인·원값 재노출·중복 실행을 만들 수 있으므로 현재 버전 조건부 처리와 다중 인스턴스 시험을 P3에서 검증한다"
    data:
      - { item: "원 승인 요청·질문 턴·후보 확인·거절/재발급·현재 카드/파라미터 버전과 기한의 연결", origin: "사용자 조작·서버 검증", sensitivity: "업무 값은 기존 마스킹/접근 통제, 실행 원값은 REQ-005의 전용 암호화 임시본", retention: "REQ-005·107·108·109" }
    permissions: "질문 조회·후보 선택·카드 발급/열람·승인 제출·실제 실행 각각 현재 인증·요청 소유권·권한을 검사한다. 후보/카드 식별자 보유나 과거 승인으로 허용하지 않으며 요청 사용자 본인의 최종 승인을 적용한다(REQ-005·103·105·108)."
    audit: "원 승인 요청과 별도 질문/답변, 거절·후보 확인·재발급·교체 관계, 최종 승인/만료/중단의 사용자·시각·대상/버전·판정 근거를 REQ-107에 연결한다. 질문 내용·원값을 감사에 추가 복제하지 않고 마스킹·필수 저장 실패·원값 사용 차단/삭제는 REQ-005·107·109를 따른다."
    lifecycle: "기존 사용자대기에서 질문·보류는 대기 유지, 거절은 카드 무효화와 대기 유지, 유효 최종 승인은 같은 시도 이어가기, 명시 중단/승인 전 만료는 기존 중단 전이를 따른다. 별도 질문/새 요청의 턴과 원 요청의 상태를 구분하며 새 상태 코드를 추가하지 않는다."
    acceptance: "사용자는 과거 본문을 찾지 않고 현재 승인 내용을 확인해 질문·승인·거절할 수 있다. 질문/보류가 원 카드·값·기한·승인을 임의 변경하지 않고, 거절/변경된 카드와 만료·중단·종결 요청은 승인할 수 없다. 새 전체 값의 최종 승인은 현재 요청에 한 번만 적용되며 최초 대기 기한과 승인 후 실행 기한을 구분한다. 부분 실행·결과 불명·조회/저장 실패가 과거 카드 재사용이나 중복 실행으로 이어지지 않는다."
    verification:
      - { case: "승인 전 추가 질문·보류·패널 닫기", expected: "원 유효 카드·값·최초 기한이 유지되고 거절/승인/새 카드 발급으로 처리하지 않는다" }
      - { case: "원 승인 요청에 관한 별도 질문과 답변", expected: "질문은 별도 턴과 원 요청 관계로 기록하고 답변·질문 실패/종결이 원 건의 값·승인으로 자동 반영되지 않는다" }
      - { case: "조건을 가정한 질문과 명시적 원 요청 변경", expected: "질문은 별도 처리하며 확정된 변경만 기존 승인 자격을 차단하고 새 전체 값으로 승인받는다. 모호한 의도는 확인한다" }
      - { case: "승인 거절 뒤 같은 카드 승인", expected: "거절 카드는 무효이며 원 턴은 최초 기한까지 대기하고 거절만으로 이어가기 실행을 등록하지 않는다" }
      - { case: "거절 후 후보 0건·복수·다른 사용자 후보", expected: "후보 부재를 정상 재승인으로 만들지 않고 현재 허용 대상만 선택·확인한다. 임의 최신 요청 선택이나 권한 밖 노출이 없다" }
      - { case: "후보 확인 뒤 최종 승인 없이 자연어 동의", expected: "원 요청 확인과 실행 승인을 구분하며 최종 승인 카드 조작 전에는 호출하지 않는다" }
      - { case: "재발급 연타·응답 유실·다중 탭", expected: "같은 발급 요청의 중복 카드/이어가기가 없고 교체된 카드 승인은 거부한다. 응답 유실만으로 새 요청을 만들지 않는다" }
      - { case: "후보 확인·새 카드 준비 중 최초 기한 도달", expected: "발급/응답 처리의 서버 기한 검사로 만료 요청을 차단하며 원 기한을 다시 시작하지 않는다" }
      - { case: "최초 만료 직전 유효 재승인 후 개인 순서 대기", expected: "승인 후 실행 시작 기한을 적용한다. 최초 대기 시각 경과만으로 중단·원값 삭제하지 않으며 실제 차례의 현재 조건을 검사한다" }
      - { case: "개인 순서 대기 중 승인 후 실행 기한 초과", expected: "최초 접수 성공을 근거로 실행하거나 기한을 연장하지 않고 기존 만료/재확인 경로를 따른다" }
      - { case: "승인과 거절·교체·만료·중단의 동시 처리", expected: "하나의 유효 결과만 확정하며 늦은 응답·낡은 화면이 원 요청을 되살리거나 최신 승인으로 승격되지 않는다" }
      - { case: "현재 권한 회수·원값 만료·조회/복호화/필수 저장 실패", expected: "최종 승인/실행을 허용하지 않고 기존 실패/보완 경로로 안내한다. 캐시·마스킹 값·이전 승인으로 우회하지 않는다" }
      - { case: "새 카드 준비 실패와 과거 카드 열람", expected: "이전 카드의 무효화를 유지하고 역사에는 허용된 마스킹/참조·사유만 남긴다. 삭제된 실행 원값을 복원하지 않는다" }
      - { case: "연속 액션 일부 완료 후 다음 승인 거절/재승인", expected: "완료 사실을 유지하고 승인 대상 미전송 범위만 확인한다. 완료 액션 반복·자동 원복이 없다" }
      - { case: "이미 전송한 업무가 결과 불명인데 재승인 요청", expected: "REQ-105.manual_reexecution의 최신 확인·새 턴/새 승인으로 연결하며 017의 카드 재발급으로 우회하지 않는다" }
      - { case: "질문 처리 중 원 승인 대기 만료", expected: "원 승인 대기는 만료 규칙을 따르고 질문 턴은 자체 조건으로 처리한다. 뒤늦은 답변으로 원 턴을 복원하지 않는다" }
      - { case: "재접속·여러 미종결 승인 요청·본문 밖 카드", expected: "REQ-005·040의 고정 진입점에서 현재 요청을 선택하며 다른 요청/버전의 값·조작을 섞지 않는다" }
    relations:
      depends_on: [REQ-005, REQ-007, REQ-013, REQ-026, REQ-032, REQ-036, REQ-040, REQ-103, REQ-105, REQ-107, REQ-108, REQ-109, REQ-113]
      constrains: [REQ-005]
      conflicts_with: []
