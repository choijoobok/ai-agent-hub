      - { kind: 예외, case: "주문 수량을 3개에서 5개로 변경 확정한 뒤 다른 탭의 3개 카드 승인", result: "서버가 이전 카드/버전 승인을 거부한다. 새 카드 저장에 실패해도 이전 카드를 되살리지 않고 5개 주문의 전체 값을 다시 확인·승인받는다" }
