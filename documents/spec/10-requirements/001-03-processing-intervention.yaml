      - { case: "유효한 승인 대기 중 인스턴스 교체 또는 승인 접수 뒤 로그아웃·로그인 만료", expected: "다른 인스턴스가 공용 DB의 원 임시본을 현재 권한·기한·승인/점유 조건으로 사용한다. 로그인 세션 종료나 화면 조회가 원값의 삭제·기한 연장·중복 실행을 만들지 않는다" }
      - { case: "저장한 파라미터 버전 교체 뒤 이전 카드 승인·이전 승인으로 실행", expected: "기존 버전을 덮어쓰거나 새 버전에 이전 승인을 적용하지 않는다. 이전 버전의 사용을 차단하고 새 전체 값을 확인·승인받는다" }
