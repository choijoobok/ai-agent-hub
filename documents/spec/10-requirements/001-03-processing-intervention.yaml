      - { case: "세션 삭제와 새 요청·재시도·이어가기의 동시 처리", expected: "REQ-109.session_deletion에 따라 삭제된 세션에 미종결 실행이 남지 않고 감사·사용량은 보존된다" }
    validation_method: "시험마다 요청·턴·시도 식별자, 외부 호출 횟수, 현재 상태·점유, 사용량·감사 기록을 함께 대조한다. 브라우저·로그인 세션 종료와 서버 인스턴스 장애를 각각 주입하고 실제 PostgreSQL의 독립 트랜잭션·다중 인스턴스로 경합을 검증한다. 운영 API의 인증·타임아웃·취소는 CLI 시험으로 대신하지 않는다"
