      - "@defer P2 사용자대기·응답 접수 후 개인 순서·현재 상태 복원과 REQ-017·026·032의 개별 검토 결과를 대조한다. 기존 개요/상세 시퀀스는 검토 초안이며 관련 요구사항 전체 확정을 대신하지 않는다"
      - "@defer P3 대기 요청 식별자/버전·응답 계약·필드 검증·명시 승인 조작과 일반 입력의 구분, 응답 접수/만료/중단/개인 순서 취소의 원자성·중복 방지·승인 후 실행 기한 판정을 상세화한다"
      - "@defer P3 같은 시도의 체크포인트 저장/복원·대기 공개와 필수 감사·응답 보관의 실패 복구를 ASM-003과 연결해 재현하고 verification을 실제 테스트 ID 및 장애/경합 시험으로 연결한다"
