    actors: [ACT-001]
    title: "과거 턴 결과 재참조"
    detail: "같은 대화에서 다른 주제를 거쳤거나 맥락이 압축된 뒤에도 과거 턴의 보존 중인 결과를 특정하여 다시 열람·정렬·필터·집계·비교·요약할 수 있어야 한다. 실제 사용한 결과 버전·행/필드 범위·완전성·원 조회 기준 시각을 구분하고 현재 권한·마스킹·전송 동의·보존 기한을 적용한다. 과거 조건으로 원천을 새로 조회하는 요청과 구분한다"
    source: "2026-10-23 사용자 요청으로 과거 결과 대상 식별·부분 결과 한계·결정적 가공과 모델 전송의 구분·원본/가공 결과 연결·사용 불가와 실패 처리를 보완했다. 권장안 반영이며 전체 카드 확정·단계 게이트·소스 구현 승인은 별도다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    why: "요약이나 화면 일부만 보고 과거 결과 전체를 안다고 간주하면 잘못된 합계·비교와 불필요한 원천 재조회가 생긴다. 보관한 당시 결과와 새 조회 결과, 원본과 후속 가공 결과를 구분해야 사용자 판단과 감사 근거를 유지할 수 있다"
    summary: "현재 사용할 수 있는 과거 결과의 정확한 버전과 범위를 찾아 재사용한다. 부분 자료의 한계를 공개하고 필요한 가공만 수행하며 원본을 덮거나 만료 결과를 새 조회로 자동 대체하지 않는다"
    intent:
      problem: "과거 결과를 찾지 못하거나 비슷한 결과를 잘못 선택하고, 일부/마스킹된 자료로 전체 합계·비교를 제시할 수 있다"
      goal: "원 조회 시점의 사실과 사용 범위를 유지하며 안전하게 결과를 재참조하고 후속 가공한다"
      not: "세션 전체 데이터의 자동 전송·원천 자동 재조회·숨겨진 값 복원·과거 결과의 최신화·원본 덮어쓰기가 아니다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "현재 인증·본인 대화 소유권과 결과별 접근 권한을 확인한다. 과거 턴 탐색·참조 기록은 REQ-001, 열람/재접속은 REQ-014·019·040을 따른다"
      - "결과 사본은 REQ-107.retention_policy, 본문과 파생 사본은 REQ-109.conversation_body_retention, 호출별 동의와 권한 재검사는 REQ-106·108을 따른다"
      - "가공·응답은 REQ-039·027, 타입/표시/반출은 REQ-011, 새 요청·진행 중 변경·개인 순서/한도는 REQ-013·007·036의 기존 계약을 따른다"
    business_rules:
      - "참조할 과거 턴/결과 버전·범위를 식별하고 REQ-107.retention_policy의 유효 기한과 현재 접근 권한을 확인한다. 턴 종료 뒤에도 기한 내 마스킹 결과 사본을 명시적 후속 가공에 사용할 수 있다"
      - "과거 조회 조건을 가져와 기간 등 일부 조건을 변경해 다시 조회하는 요청은 REQ-001.past_query_followup의 새 조회로 처리한다. 이 요구사항의 보존 결과 비교·가공과 구분하며 참조 대상을 찾는 것만으로 원천을 재실행하지 않는다"
      - "LLM 전송은 REQ-106의 요청·동의·범위/정책 확인을 따르며 과거 이력을 자동 전송하지 않는다. 과거 결과가 남아 있어도 새 업무 실행의 재조회 원칙(REQ-105)은 유지한다"
      - "만료/파기·안전한 사본 부재 시 과거 결과를 사용할 수 없음을 알리고 남은 메타데이터만 제공한다. 자동 재조회하지 않으며 사용자가 새 조회를 명시 요청하면 현재 시점 결과임을 구분한다. 후속 가공·복사로 원래 결과 기한을 연장하지 않는다"
    reference_selection:
      locate: "REQ-001의 유효한 턴별 기록과 참조를 이용해 같은 대화의 과거 결과를 찾는다. 화면에 로드된 결과나 최근 몇 턴으로 제한하지 않고, 요약은 탐색 단서로만 사용한다. 요약 문장·차트 이미지·출력 미리보기를 전체 원 데이터로 간주하지 않는다"
      identity: "참조 대상마다 대화·원 턴/스텝·결과 식별자·버전·사용할 행/필드 또는 문서 범위를 고정한다. 한 턴에 결과가 여러 개이면 해당 결과까지 구분하며 처리 도중 최신 버전이나 다른 결과로 조용히 바꾸지 않는다"
      ambiguity: "업무명·조회 조건·시각·허용된 결과 설명으로 대상을 유일하게 특정할 수 없으면 후보를 제시해 사용자 선택을 받는다. 현재 권한 밖 후보의 내용은 노출하지 않으며 가장 최근 결과라는 이유만으로 임의 선택하지 않는다. 대상과 범위가 명확하면 불필요하게 다시 묻지 않는다"
      scope: "현재 허용된 범위만 읽는다. 화면에는 한 페이지만 있어도 서버에 동일 결과/버전의 유효 사본이 더 남아 있으면 요청 범위와 기존 한도 안에서 사본을 추가로 읽을 수 있다. 이는 Hub 보관 자료 조회이며 원천 재조회가 아니다. 현재 권한으로 범위가 줄면 원 결과 전체를 사용한 것처럼 표시하지 않는다"
    result_completeness:
      facts: "원 조회의 대상·조건·집계 단위·기준 시각, 반환/보관 범위와 가능한 행 수·전체 건수 근거, 상위 일부·페이지·잘림·부분 성공·생성 중 여부를 구분한다. 전체 건수를 확인할 수 없으면 미상으로 남기고 보관 행 수를 전체 건수로 추정하지 않는다"
      calculation: "전체 결과임이 확인되지 않으면 합계·순위·비교를 사용한 부분 범위로 한정해 명시한다. 전체 합계를 요청했는데 부분만 있으면 부분 합계를 전체 합계로 대신 내지 않고, 제한된 결과로 처리할지 또는 새 조회가 필요한지 안내한다. 필요한 범위 변경은 사용자 선택을 따른다"
      masking: "마스킹·누락된 값을 0·빈 값·동일 키로 간주하거나 원래 값을 추정하여 계산/결합하지 않는다. 가려진 값이 집계·비교에 필요하면 해당 계산의 불가 또는 유효 범위를 알린다. 현재 마스킹과 데이터 타입·단위·정밀도는 REQ-106·111·011을 따른다"
      empty: "정상 조회 0건·보관 자료에 적용한 필터 결과 0건·결과 접근 불가·부분만 확인된 상태를 구분한다. 읽기 실패나 만료를 조회 0건으로 표시하거나 이를 이유로 원천을 자동 호출하지 않는다"
    processing:
      deterministic: "대상과 연산이 정해진 정렬·필터·합계·형식 변환은 REQ-106·027의 지원 가능한 결정적 처리 경로를 사용하고 그 가공만을 위해 결과 데이터를 모델에 보내지 않는다. 자연어 의도/대상 해석에 필요한 기존 모델 호출까지 없다고 보장하지는 않으며 해당 호출에는 최소 단서만 사용한다"
      model: "자연어 분석·비교·요약 등 모델 가공이 필요하면 REQ-106에 따라 실제 사용할 결과 버전·범위·목적·공급 경로를 안내하고 유효한 요청·동의를 확인한다. 명확한 안내/요청으로 이미 충족된 동의는 중복 확인하지 않으며 범위 밖 결과·전체 이력·숨은 필드를 추가하지 않는다. 전체 자료도 유효 권한·동의·크기 조건을 충족하면 사용할 수 있다"
      limits: "REQ-003·106의 행/입력 크기·모델 문맥·쿼터 제한을 적용한다. 필요한 범위를 줄이거나 지원 가능한 집계를 안내하고 임의 자르기·자동 분할 전송으로 한도를 우회하지 않는다. 데이터의 지시문은 REQ-112에 따라 실행 지시로 취급하지 않는다"
      comparison: "각 결과의 기준 시각·조회 조건·대상 범위·집계 단위와 비교할 필드/대응 기준을 확인한다. 시점이나 범위가 다르면 차이를 표시하고 그 차이를 무조건 동일 조건의 증감으로 해석하지 않는다. 대응 키·단위·중복의 의미가 불명확하여 비교 의미가 달라지면 확인을 요청하며 임의 결합·단위 변환·누락값 보충을 하지 않는다"
      lifecycle_boundary: "단순 열람·화면 정렬/필터는 그 자체로 새 업무 실행이나 모델 호출을 만들지 않는다. 종결된 결과를 대상으로 한 별도 자연어 후속 요청은 관련 원 턴/결과를 연결해 새 턴에서 처리하며 원 턴을 되살리지 않는다. 유효한 진행 중 입력/사용자대기 응답은 REQ-007·005, 결과 교정 재요청은 REQ-024로 구분한다. 결과 재참조를 상태 변경 실행의 승인으로 사용하지 않는다"
    derived_result:
      provenance: "원 결과를 덮어쓰지 않고 가공 결과마다 입력 결과 식별자/버전·사용 범위·적용한 정렬/필터/집계 또는 비교 기준·가공 시각을 연결한다. 여러 결과를 사용하면 각각의 출처와 제한을 유지하며 원본과 가공본을 구분해 조회할 수 있어야 한다"
      presentation: "원 조회의 기준 시각과 가공 시각을 구분하여 당시 데이터에 대한 후속 결과임을 알린다. 실제 사용 범위·부분/마스킹/미상 제한과 계산·비교의 적용 기준을 표시하고 가공 시각을 최신 데이터 기준 시각으로 표시하지 않는다. 표현 형식·타입·다운로드는 REQ-011·012·027을 따른다"
      retention: "REQ-107·109에 따라 입력 원자료의 접근·보존 제한을 파생 결과/요약/프롬프트 사본에도 승계한다. 가공·복사·재열람으로 기한을 새로 시작하지 않고 분리 불가 혼합 자료는 가장 이른 기한을 적용한다. 원자료 권한 회수/만료 뒤 파생본·색인·캐시로 우회 제공하지 않는다"
    failure_handling:
      unavailable: "만료·파기·안전한 사본 부재·권한 없음·버전 확인 불가·필수 자료 부족을 구분해 가능한 다음 행동을 안내한다. 권한 밖 내용·비밀값은 이유에 노출하지 않는다. 남아 있는 허용 메타데이터만 제공하고 새 조회는 사용자 명시 요청과 현재 조건 확인을 거친다"
      processing_failure: "가공/비교/모델 전송·저장 실패를 원 조회 실패와 구분한다. 현재 유효한 원본과 기존 표시를 유지하되 사용할 권한/기한이 없어진 내용은 계속 제공하지 않는다. 실패한 가공을 완료로 표시하거나 원본을 덮지 않는다. 모델 오류·동의 거부·한도 초과만으로 원천 재조회·다른 공급 경로 전송·미동의 원본 전송을 시작하지 않는다"
      concurrent_change: "선택 후 처리/전송/결과 제공 전에 권한 회수·동의 만료·자료 만료/파기·결과 버전 변경이 발생하면 각 경계에서 재검사한다. 선택 때 유효했다는 이유로 그대로 사용하거나 다른 버전으로 대체하지 않는다. 이미 전송된 사실/사용량과 이후 미전송 차단을 구분하고 현재 유효한 결과만 제공한다"
    exceptions:
      - "참조 대상이 여러 개이거나 버전·범위가 불명확하면 reference_selection의 확인 절차를 따른다. 확인 대기·거절·만료는 기존 사용자대기 계약으로 처리한다"
      - "부분 결과·마스킹·누락·단위/대응 기준 불명은 result_completeness와 processing.comparison에 따라 제한을 안내한다. 요청한 전체 분석이 완료된 것으로 표시하지 않는다"
      - "읽기·가공 실패와 접근 불가는 failure_handling을 따르며 과거 결과를 새 조회로 자동 대체하지 않는다"
    lifecycle: "대상/버전·범위 식별 → 현재 유효성 확인 → 지원 가공 또는 동의된 모델 처리 → 출처/제한이 연결된 결과 제공의 흐름이다. 원 턴의 진행/종결 상태는 바꾸지 않고 실패/대기/취소는 REQ-009·005·007의 기존 상태를 사용한다"
    data:
      - { item: "원 결과 참조·버전·행/필드 범위·기준 시각·반환/보관 완전성", origin: "REQ-107의 보존 중 마스킹 결과 사본과 관련 턴/처리 기록", sensitivity: "현재 권한·마스킹·전송 동의의 적용 대상이며 메타데이터에도 원값을 복제하지 않음", retention: "REQ-107.retention_policy 및 본문은 REQ-109.conversation_body_retention" }
      - { item: "가공 결과·입력 출처/범위·가공 기준/시각·제한 표시", origin: "허용된 원 결과의 결정적 또는 동의된 모델 가공", sensitivity: "원자료의 민감도·권한/기한을 승계하며 가려진 원값 복원 금지", retention: "derived_result.retention을 따르며 새로 가공했다는 이유로 기한을 연장하지 않음" }
    permissions:
      - "결과 탐색·사본 읽기·모델 전송·가공 결과 제공마다 REQ-106·108의 현재 권한과 목적별 통제를 적용한다. 원 조회 성공·결과 식별자 보유·기존 동의만으로 현재 사용을 허용하지 않는다"
    audit: "REQ-107에 원본과 후속 처리 관계, 선택한 결과 버전/범위·완전성 근거·연산/비교 기준·실제 처리 유형·동의/전송 범위·성공/실패를 연결한다. 실제 모델 호출 사용량은 REQ-006·116의 기존 기록/표시를 따르며 단순 열람/결정적 가공을 모델 호출로 계상하지 않는다. 감사 항목에 결과 원문을 복제해 보존 기한을 우회하지 않는다"
    volume: "요청한 결과 수·행/필드/문서 범위와 보관 사본의 크기에 비례한다. 화면 로드량과 서버 사본량을 구분하며 결과 크기·처리 비용은 기존 상한 안에서 측정한다"
    config: "동의·보존·행/모델 입력·쿼터는 기존 정본의 설정을 사용한다. 지원 가공 연산·후보 조회·결과 버전/완전성 표현의 물리 계약은 P3에서 정하며 별도 무제한 저장/전송 설정을 추가하지 않는다"
    risk: "부분 사본·시점/단위가 다른 결과·마스킹 키를 완전하고 동일한 자료로 오인하면 합계/비교가 왜곡된다. 실제 반환/보관 범위와 타입·출처를 대조하고 불확실하면 확인/제한 안내로 처리한다"
    acceptance: "다른 주제와 압축 뒤에도 현재 유효한 과거 결과의 정확한 버전/범위를 찾아 열람·가공한다. 단순 가공은 불필요한 결과 모델 전송 없이 수행하며 모델 가공은 실제 요청·동의·한도 안에서만 처리한다. 부분 결과의 전체 가장·마스킹 값 복원·원본 덮어쓰기·가공 시각의 최신 데이터 가장·기한 연장·원천 자동 재조회가 없고, 실패/경합 시 사용 가능한 원본과 명확한 다음 행동을 제공한다"
    verification:
      - { case: "출고 조회 뒤 다른 업무를 거쳐 '아까 출고 결과를 수량 내림차순으로' 요청", expected: "올바른 원 결과/버전의 허용 범위를 정렬하고 원천을 다시 조회하지 않는다. 결정적 정렬을 위해 결과를 모델에 전송하지 않고 원 기준 시각을 유지한다" }
