    title: "컨텍스트 단계적 축소"
    detail: "현재 사용자에게 허용된 관련 지식을 검색하고 연결된 카탈로그를 합산한 뒤, 요청에 필요한 공개 객체·컬럼·관계를 선별해 컨텍스트를 구성한다. 데이터소스를 먼저 좁혀 업무 후보를 제한하지 않는다. 필요한 객체가 여러 데이터소스에 걸치면 모두 유지하고 각 소속 데이터소스별 조회와 agent의 결과 결합으로 처리한다"
    source: "2026-10-23 사용자 지적과 보완 요청: 데이터소스 우선 선별을 지식·카탈로그 기반 선별로 바꾸고 다중 데이터소스 조회·결합, 필수 근거 보존과 부분 실패 처리를 명시했다. 기존 카탈로그 항목의 물리 식별 구조를 유지한다. 같은 날 사용자가 검증 기준 14건을 포함한 REQ-021 전체 보완본을 명시 확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    why: "필요한 업무 데이터를 알기 전에 데이터소스부터 좁히면 여러 시스템에 걸친 필수 객체를 누락할 수 있다. 비용 절감을 위한 컨텍스트 축소와 조회를 실행할 데이터소스의 구분을 분리해야 한다"
    summary: "지식 → 연결 카탈로그 합산·현재 권한 확인 → 필요한 객체·컬럼·관계 선별 → 데이터소스별 조회 → 필요한 결과 결합 순으로 처리한다. 데이터소스는 단일 선택 대상이 아니라 조회 실행 경계다"
    intent:
      problem: "선행 데이터소스 선택·과도한 컬럼 축소로 업무 근거를 잃거나 일부 원천만 조회해 전체 답변처럼 제공할 수 있다"
      goal: "현재 허용된 근거 안에서 요청 수행에 필요한 원천을 빠짐없이 보존하고 불필요한 컨텍스트·조회만 줄인다"
      not: "모든 데이터소스의 무조건 조회·전체 카탈로그 공개·데이터소스 간 단일 SQL 조인·카탈로그 항목 하나의 다중 접속처 매핑·별도 업무 도메인 등록을 요구하지 않는다"
    goal_trace: [GOAL-1, GOAL-2, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "지식이 필요한 업무 조회의 후보 범위는 REQ-038, 지식 검색은 REQ-607·ARCH-060, 직접/예제 경유 카탈로그 합산과 버전은 REQ-303·108을 따른다"
      - "지식·예제·카탈로그와 데이터소스의 현재 권한·활성·검수 상태, 사용자 신원과 행/컬럼 통제는 REQ-103·108·301·302·603·609·611을 따른다"
      - "직접 제공 자료·보존 결과만으로 가능한 가공은 REQ-039·002의 별도 경로를 유지하며 이 요구사항을 이유로 지식 검색이나 원천 조회를 강제하지 않는다"
    business_rules:
      - "데이터소스의 명칭·설명이나 모델의 선행 추정으로 지식 검색·카탈로그 후보 범위를 특정 데이터소스에 한정하지 않는다. 사용자 요청 범위는 지식과 객체의 업무 의미로 확인한다"
      - "관련성 선별과 접근 허용 판정을 구분한다. 데이터소스를 먼저 고르지 않는다는 것은 데이터소스 이용 권한·신원 매핑·연결 유효성 검사를 생략한다는 뜻이 아니다"
      - "REQ-301의 카탈로그 항목은 특정 데이터소스의 공개 테이블·뷰 하나이며 DB/카탈로그·DB 스키마·객체명을 포함한 REQ-301의 전체 물리 식별로 구분한다. 한 지식의 카탈로그 목록은 여러 데이터소스에 걸칠 수 있으나 동명 객체를 하나로 합치거나 별도 소속 목록을 중복 저장하지 않는다"
      - "주입이 확정된 지식·인증 예제의 필수 참조 공개 인터페이스는 선별 결과에 유지한다. 일부 필수 참조를 버린 불완전한 예제를 주입·실행하지 않는다"
      - "모델은 업무 관련성을 판단하되 실제 권한·객체 식별·SQL 검증은 서버가 수행한다. 모델의 선별·사용자 확인·기존 조회 성공이 현재 접근 권한을 대신하지 않는다"
    selection_flow:
      knowledge: "현재 사용 가능한 지식에서 검색 태그·동의어 및 설정 시 벡터 검색으로 업무 근거를 찾는다. 권한 밖 지식·후보/반려 리비전을 모델에 제공한 뒤 나중에 숨기는 방식으로 처리하지 않는다"
      catalog_union: "REQ-303.example_catalog_mapping에 따라 지식 직접 카탈로그와 사용 가능한 인증 예제의 참조 카탈로그를 합산한다. 안정 식별자·참조 버전·직접/예제 경유 출처를 유지하며 데이터소스가 다르다는 이유로 제외하지 않는다"
      access: "검색·합산·주입의 각 경계에서 현재 사용자 그룹·자산 권한과 활성 상태를 적용한다. 모델에는 허용된 메타데이터만 주입하고 실제 조회 전에는 데이터소스 이용 자격·신원 매핑·객체 권한을 다시 검사한다"
      objects: "허용된 후보 안에서 요청과 관련된 공개 객체·컬럼을 선별하되 필터·집계·정렬·결합에 필요한 키·타입·단위·관계를 함께 유지한다. 결과에 표시하지 않는 컬럼도 필요한 경우 선별에서 빠뜨리지 않으며 접근 제한 컬럼을 필수라는 이유로 포함하지 않는다"
      required_conditions: "REQ-611.query_constraints의 적용 제약·리비전과 필요한 허용 컬럼도 선별/입력 예산에서 누락하지 않는다. 대상 계획 후 REQ-025의 부족 조건 확인에 연결하며 데이터소스별 실행에서도 같은 정본의 검증을 적용한다"
      budget: "REQ-003의 실제 호출 입력 예산 안에서 무관한 후보·중복 설명을 줄인다. 필요한 원천·필수 참조·결합 근거가 다 들어가지 않으면 범위 축소 등을 안내하고 임의 누락·전체 처리 가장·한도 우회를 하지 않는다"
      datasource_grouping: "필요한 객체를 정한 뒤 카탈로그의 소속 데이터소스로 조회 작업을 묶는다. 연결된 데이터소스를 모두 호출하거나 하나로 제한하지 않고 요청 충족에 필요한 원천을 유지한다. 데이터소스별 묶음은 접속·파서·검증 경계를 정하며 지식 후보의 선행 필터가 아니다"
    multi_source_query:
      execution: "ARCH-030에 따라 SQL 하나는 명시한 데이터소스 하나 안의 등록 객체만 사용한다. 여러 데이터소스가 필요하면 각 데이터소스의 방언·파서·신원·행 스코프·기본 필터·조회 상한을 적용한 별도 SQL로 실행한다. 같은 데이터소스에서도 의존 관계에 따라 여러 조회를 사용할 수 있다"
      dependencies: "선행 결과가 후속 조회의 조건에 필요하면 해당 결과의 유효 범위가 확보된 뒤 순차 처리한다. 독립 조회는 기존 개인 실행 제어와 호출 한도 안에서 병렬 처리할 수 있으나 병렬화를 필수로 요구하지 않는다. 원천 간 값 전달에도 현재 권한·마스킹·전송 정책을 적용한다"
      combination: "REQ-301.relationship_metadata와 사용 가능한 지식의 업무 근거에 따라 연결 키·복합 키 전체·관계의 다중성·집계 단위·타입/단위·누락/중복 의미를 확인한다. 이름이 같은 컬럼만으로 결합하거나 마스킹 문자열을 동일 키로 쓰지 않는다. 1:N 중복을 임의 중복 제거로 감추지 않고 근거가 부족하면 REQ-025의 확인/처리 불가로 연결한다"
      processing: "지원 가능한 결합·집계·비교는 REQ-039·027의 결정적 처리로 수행하고 모델의 설명을 검증된 계산 결과로 대신하지 않는다. 모델 처리가 필요하면 REQ-106의 요청·동의·범위·한도를 따르며 다중 원천 조회 자체가 전체 결과 전송 동의는 아니다"
      alternatives: "운영 DB와 DW·복제본처럼 같은 업무 데이터를 제공하는 후보는 조회 목적·범위·기준 시각과 등록된 근거로 원천을 정한다. 중복 원천을 모두 조회해 합산하거나 장애 시 의미가 다른 원천으로 자동 대체하지 않는다. 구분 근거가 없으면 확인한다"
      completeness: "각 원천의 실제 반환 범위·잘림·정상 0건·실패/접근 불가와 기준 시각을 구분한다. 여러 원천을 같은 순간의 일관된 스냅샷으로 보장하지 않으며 기준 시각 차이가 요청 의미에 미치는 영향을 설명한다. 조회별·결합 후 크기와 비용은 기존 한도 안에서 통제하고 별도 전체 COUNT·원천 페이지 추가 조회로 결과를 보충하지 않는다"
    presentation:
      plan: "REQ-022·023에 따라 필요한 업무 데이터 영역·원천별 역할·결합 목적/기준·의존 순서와 범위 제한을 업무 용어로 설명한다. 여러 원천이 필요하다는 이유로 하나를 고르게 하지 않고 실제 모호한 원천·조건만 확인한다. 계획 확인 정책과 실행 승인·전송 동의는 별개이며 물리명 비노출은 REQ-104.initial_control을 따른다"
      result: "REQ-011·012에 따라 실제 사용한 원천·조회 범위·기준 시각·결합/집계 기준과 부분/미상 제한을 결과에 연결한다. 일부 필수 원천이 없으면 전체 결합·전체 합계·비율이 완료된 것처럼 표시하지 않는다. 보존 결과의 재참조는 REQ-002를 따른다"
    failure_handling:
      missing_evidence: "허용된 지식·객체·필수 컬럼·관계가 부족하면 전체 카탈로그나 미등록 원천으로 탐색을 확대하지 않는다. 권한 밖 대상의 존재·내부 이름을 노출하지 않는 안내와 필요한 확인 또는 처리 불가로 연결한다"
      missing_source: "필수 원천의 권한/신원 부재·연결 장애·타임아웃·필수 범위 잘림이 있으면 해당 원천에 의존한 후속 조회·결합을 완료로 처리하지 않는다. 이미 확보한 허용 결과와 미완료 범위를 구분하며 정상 0건·값 0으로 대체하거나 다른 원천으로 몰래 전환하지 않는다. 최종 실패 시 독립 후속 작업의 새 시작도 REQ-038의 공통 중단·부분 실패 규칙을 따른다"
      changes: "선별 이후 권한·내용 버전·입력 조건이 바뀌면 REQ-108·007의 현재 유효성·영향 범위 검증을 적용한다. 계획 교정으로 달라진 원천/결합을 이전 계획 확인이나 실행 승인으로 처리하지 않는다"
      model_failure: "선별 보조 모델의 일시 공급 장애는 REQ-602.auxiliary_fallback을 적용하고 후보 소진/전환 불가 오류는 ARCH-040의 실패 처리를 따른다. 후보 없음과 모델 장애를 같은 근거 부족으로 취급하거나 성공한 선별처럼 진행하지 않는다"
    exceptions:
      - "원천 선택·결합 의미가 모호하면 필요한 사항만 확인하고 무응답·모호한 답을 동의로 해석하지 않는다. 대기·취소·만료는 REQ-005·007·009의 기존 상태를 사용한다"
      - "일부 결과를 별도로 제공할 수 있어도 요청 전체가 완료된 것으로 표시하지 않는다. 제한된 범위로 계속할지는 기존 사용자 입력·재요청 규칙을 따른다"
    lifecycle: "허용 지식 검색 → 참조 카탈로그 합산·현재 권한 확인 → 필수 객체/컬럼/관계 선별 → 데이터소스별 조회 계획 → 필요한 확인·검증·조회 → 근거 있는 결합·범위/출처 표시. 도구 결과에 따른 후속 계획도 같은 경계를 적용하며 턴/대기 상태를 새로 만들지 않는다"
    data:
      - { item: "지식·카탈로그·예제 식별자/버전·참조 경로·필수 객체/컬럼/관계", origin: "REQ-301·302·303의 사용 가능한 등록 메타데이터", sensitivity: "현재 권한 범위의 업무·기술 정보이며 비밀 접속값 제외", retention: "내용 참조·감사는 REQ-107·108, 본문 사본은 REQ-109" }
      - { item: "데이터소스별 조회·결과 참조·기준 시각·완전성·결합 기준/결과", origin: "실제 조회 및 agent 가공", sensitivity: "원천별 접근·마스킹·전송·반출 제한 승계", retention: "REQ-107·109의 기존 유한 보존 및 분리 불가 혼합 자료의 가장 이른 기한" }
    permissions:
      - "카탈로그 선별은 권한 부여가 아니며 조회·원천 간 값 전달·결합·모델 전송·최종 제공의 각 경계에 현재 권한과 목적별 정책을 적용한다. 결합·가공으로 접근 제한·마스킹·보존 기한을 우회하지 않는다"
