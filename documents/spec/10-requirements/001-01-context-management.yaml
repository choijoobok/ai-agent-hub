      - { case: "장기 대화의 반복 압축·압축 후에도 필수 입력이 예산을 초과", expected: "요약을 계속 덧붙이지 않고 각 호출의 총량을 검사한다. 필요 시 범위 축소/작업 분리를 안내하며 조건을 몰래 버리거나 길이만으로 새 세션을 강제하지 않는다" }
