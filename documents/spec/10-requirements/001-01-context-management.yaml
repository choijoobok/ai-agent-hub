  - id: REQ-003
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "컨텍스트 총량 제한 — 모델 호출마다 보내는 정보의 크기 관리"
    detail: "모델마다 한 번에 읽고 답변을 만드는 데 사용할 수 있는 정보량에 한계가 있다. Hub는 모델을 호출하기 전에 이번에 보낼 전체 입력의 토큰 수를 산정하고, 답변 생성에 필요한 공간을 남긴 허용량 안으로 입력을 구성해야 한다. 대화방에 저장하는 이력 전체의 크기를 제한한다는 뜻은 아니다"
    source: "2026-10-23 사용자 요청으로 모델별 컨텍스트 창·입력과 생성 공간·예시를 쉽게 설명했다. 2026-10-26 사용자 요청으로 호출별 허용량 산정·최종 입력 검사·축소/실패·설정 책임·검증 기준을 보완한다. 운영 수치와 공급 경로별 계산 구현은 후속 검증 대상으로 두고 이 카드 전체 확정은 별도로 받는다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    roadmap: RM-P1
    summary: "모델 호출마다 실제 입력 전체가 생성 공간을 남긴 허용량에 들어가는지 확인한다. 필요한 근거를 보존하며 선별·압축하고, 계산 또는 수용이 불가능하면 임의 전송하지 않는다"
    intent:
      problem: "질문 본문만 세거나 모델 한도를 입력 전용으로 오해하면 호출 거부·필수 맥락 유실·반복 압축과 비용 증가가 발생한다"
      goal: "모델·공급 경로·호출 목적에 맞는 입력 허용량과 재현 가능한 검사 근거를 두고 초과를 호출 전에 통제한다"
      not: "대화 DB 저장량 제한·월 쿼터·턴 누적 토큰 상한·고정 비율 압축·새 세션 강제·자동 모델 교체 정책이 아니다"
    goal_trace: [GOAL-1, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "사용 모델/공급 경로/effort의 선택·고정은 REQ-602·ARCH-040, 호출 목적별 입력 계약은 REQ-009·610을 따른다"
      - "과거 맥락은 REQ-001·002, 필수 카탈로그 근거는 REQ-021, 현재 계획/상태는 REQ-004·015, 전송 권한/동의는 REQ-106을 따른다"
    explanation:
      - "컨텍스트 창(context window)은 모델이 한 번의 응답 실행에서 사용하는 정보 공간의 최대 크기다. 입력만을 위한 공간이 아니라 읽을 입력과 생성할 답변이 함께 사용하며 모델·버전·공급 경로별 한도가 다를 수 있다"
      - "크기는 토큰(token)이라는 모델의 처리 단위로 센다. 글자 수나 단어 수와 같지 않으며 같은 글도 모델의 계산 기준에 따라 토큰 수가 달라질 수 있다"
      - "추론 모델에서는 사용자에게 보이는 답변 외에 내부 추론에도 생성 공간을 사용한다. 생성용 공간은 이를 포함해 확보하고, 공급 경로가 출력 토큰에 추론을 포함하면 따로 더해 중복 계산하지 않는다. 모델/API의 별도 최대 입력·최대 출력 한도도 함께 따른다"
      - "입력 예산은 금액이 아니라 이번 호출에 넣을 수 있도록 정한 입력 토큰 허용량이다. 이 카드에서는 '호출당 입력 토큰 허용량'이라는 뜻으로 쓴다. 컨텍스트 창 전체를 입력으로 채우지 않고 생성용 공간을 남겨 정한다"
      - "계산 오차가 없다고 보는 설명용 가정: 입력과 생성을 합쳐 최대 10만 토큰을 처리하고 생성용으로 2만 토큰을 확보한다면 입력은 최대 8만 토큰 이내다. 별도 입력 한도가 7만 토큰이면 7만 이내여야 한다. 실제 산정에 오차가 있으면 그 작은 한도에서 추가 여유를 뺀다. 이 숫자는 특정 모델의 사양·운영 기본값·고정 비율이 아니다"
    note: "REQ-001의 제한된 압축 요약과 필요할 때 찾는 턴별 기록/원본 참조를 병행한다. 여기서 원본 참조는 권한·보존 정책상 유효한 Hub 기록/사본의 조회이며 원천 DB/API의 자동 재실행이 아니다. 과거 결과의 사용은 REQ-002를 따른다. 최근 N턴만 남기거나 단일 요약만 유지하는 방식으로 과거 조건/결과 참조를 대체하지 않는다"
    budget_scope: "질문이나 요약 본문만 세지 않고 시스템/공통 지침·응답 형식·카탈로그·지식·도구 정의·선별한 과거 맥락·현재 질의·필요한 작업 계획/현재 상태·도구 결과 등 해당 호출의 실제 모델 입력 전체를 대상으로 한다. 사용할 모델·공급 경로의 계산 기준으로 호출 전에 산정하며 사전 추정치를 호출 후 공급자가 반환한 실제 계량값과 혼동하지 않는다. 한도·산정·축소·설정 책임은 아래 계약을 따르고 수치/계산기 구현은 open에서 구체화한다"
    limit_contract:
      effective_limit: "해당 모델/공급 경로의 컨텍스트 한도에서 호출 목적별 생성 예약량을 뺀 값과 별도 입력 한도 중 적용되는 작은 한도를 먼저 구하고, 그 값에서 산정 오차 여유를 빼 입력 허용량을 정한다. 별도 입력 한도가 더 작더라도 오차 여유가 사라지지 않아야 하며 생성 예약량도 지원 출력 한도 안이어야 한다. 예약량에는 해당 경로가 생성 예산으로 세는 추론을 포함하되 중복 차감하지 않는다. 여유를 확보할 수 없거나 값의 단위/포함 관계가 맞지 않으면 설정 오류로 해당 호출을 막는다"
      basis: "모델명만으로 한도를 추정하지 않고 실제 선택한 모델·버전·공급 경로·지원 기능의 검증된 계약과 적용 설정을 연결한다. 외부 사양의 자동 수집이나 전 모델의 동일 한도를 전제하지 않는다. 한도 미확인·계약 만료/변경·미지원 입력 종류를 임의 기본값으로 통과시키지 않는다"
      generation: "계획/질의 생성·분류·요약 등 호출 목적에 필요한 생성 예약량을 기술 응답 계약과 연결한다. 입력을 더 넣으려고 필요한 생성 공간을 조용히 줄이지 않는다. 실제 요청의 출력 제한 설정이 예약량과 일치하는지 확인하며 경로가 제공하는 파라미터·추론 계량 차이는 어댑터의 검증 대상이다"
    token_measurement:
      method: "해당 모델/경로에 맞게 검증한 계산기와 메시지·도구·출력 형식의 추가 입력 비용을 사용한다. 계산기 식별자/버전과 정확 계산 또는 추정 여부를 남긴다. 검증된 추정 방식은 오차 여유를 함께 적용할 수 있지만 글자 수 고정 환산·모델의 자기 보고 숫자만으로 통과시키지 않는다"
      final_input: "공급 경로용 입력 조립·필수 형식 추가 뒤의 최종 입력을 검사한다. 경로가 서버 쪽에 유지·재참조하는 문맥도 지원 계약에서 입력으로 세는 범위에 포함하며 요청 본문이 짧다는 이유로 0으로 취급하지 않는다. 그 범위를 검증할 수 없는 호출은 지원되는 입력 구성으로 해결하기 전 보내지 않는다"
      boundary: "최초·후속 도구 결과·추가 응답·조건 변경·허용 재요청 등 각 호출 직전에 검사한다. 검사 후 입력·도구·응답 형식·유효 설정이 바뀌면 다시 산정하고, 이전 요청의 통과 결과를 재사용하지 않는다. 서버가 자동으로 새 실행을 만드는 경로도 REQ-007의 사전 허용 통제를 우회하지 않아야 한다"
      unknown: "계산기 오류·필요 한도 부재·미지원 형식이면 자동 전송하지 않고 내부 설정/지원 문제와 사용자 자료 과다를 구분해 안내한다. 유효한 다른 계산 방식의 사용은 검증된 지원 계약 안에서만 허용하며 단순 계산 실패를 이유로 데이터를 다른 공급 경로에 보내지 않는다"
      accounting: "사전 입력량은 호출 허용 판단용이다. 실패한 사전 검사나 압축 없이 한 재산정을 모델 실행/사용량으로 기록하지 않고, 실제 압축 모델 호출과 실제 응답 실행은 REQ-107·NFR-010·013에 따라 별도 집계한다. 캐시 적중·사용량 할인은 입력 공간이 불필요하다는 근거가 아니다"
    overflow_handling: "허용량을 넘으면 REQ-001·021에 따라 불필요한 정보·중복을 줄이고 과거 맥락을 압축한 뒤 최종 입력량을 다시 확인한다. 필수 조건·현재 상태·권한/승인 관련 규칙을 조용히 버리지 않는다. 그래도 필수 입력이 들어가지 않으면 초과 상태로 호출하지 않고 범위 축소·작업 분리 등을 안내한다. 압축 실패·자료 선별·새 대화 안내의 세부 규칙은 REQ-001을 따른다"
    reduction_contract:
      order: "호출 목적과 무관한 후보·중복 자료를 먼저 제외하고 REQ-001의 관련 턴 기록/유효 요약·REQ-021의 필요한 카탈로그만 구성한다. 그래도 초과하면 허용된 과거 맥락을 압축하고 전체 입력을 다시 검사한다. 자료 축소와 계산만으로 충분한데 압축 모델을 불필요하게 호출하지 않는다"
      trigger_and_target: "최종 입력이 허용량을 넘으면 축소가 필요하다. 사전 압축 시작점과 목표 크기를 별도로 운영할 경우 현재 호출 허용량 안의 값으로 정하고 목표는 시작점보다 작아야 한다. 항상 80%에서 압축 같은 비율이나 고정 최근 턴 수를 제품 기본값으로 정하지 않는다. 기본값은 실제 경로별 측정으로 정한다"
      preserve: "현재 사용자 요청의 의미·필수 조건·권한/전송/승인 통제·응답 계약·현재 유효 작업 상태·필수 객체/관계는 삭제하지 않는다. 원자료와 근거 참조는 보존 정책 안에서 유지하고 요약을 실제 결과나 완료 증거로 바꾸지 않는다"
      bounded_failure: "축소 후에도 필수 입력이 들어가지 않거나 더 줄어들지 않으면 무한 재압축하지 않고 기존 유한 재시도/정체 제한 안에서 중단·범위 조정으로 연결한다. 압축 모델 자체의 호출도 이 검사를 적용한다. 요약 모델의 일시 공급 장애는 REQ-602의 보조 후보만 검토하며 후보마다 이 입력 검사를 다시 적용한다. 입력 초과·계산 실패는 대체 사유가 아니고 후보 소진/금지 오류는 REQ-001·ARCH-040의 실패 처리를 유지한다. 사용자 주 추론 설정을 대체 후보로 사용하지 않는다"
      provider_rejection: "사전 검사 통과 뒤 공급자가 입력 초과로 거부하면 실제 실패와 당시 산정/계약 근거를 남긴다. REQ-034·NFR-013의 허용 재시도 범위에서 입력과 한도를 재검사하며 무한 재전송·필수 규칙 제거·고정 모델/경로의 자동 변경으로 해결하지 않는다. 원천 업무 조회나 완료 액션을 재실행하지 않는다"
    scope_boundary: "한 번의 모델 호출 입력량 검사와 대화 이력의 DB 저장량, 월 누적 토큰 사용량/쿼터, 턴 전체 누적 토큰을 구분한다. 이 규칙으로 오래된 대화를 삭제하거나 새 창을 강제로 열게 하거나 턴 누적 토큰 상한을 신설하지 않는다(REQ-001·NFR-010·012·013). 비용·속도를 위해 모델 허용량보다 작은 운영 상한을 둘지는 별도 후속 정책이며 이 설명만으로 고정 상한을 도입하지 않는다"
    catalog_budget: "카탈로그의 선별 순서와 필수 근거 보존은 REQ-021을 따른다. 여러 데이터소스가 필요하면 입력 예산을 맞추려고 일부 원천·필수 객체/컬럼·결합 근거를 조용히 제외하지 않는다. 축소 후에도 부족하면 요청 범위 조정 등 기존 초과 처리로 연결하며 전체 처리처럼 표시하거나 자동 분할 전송으로 한도를 우회하지 않는다"
    data:
      - { item: "적용 모델/경로·한도 근거·계산기 버전·적용 한도값·판정 시각·입력 산정량·생성 예약량·오차 여유·허용/초과/계산 불가 판정", origin: "지원 계약·유효 설정과 서버의 최종 입력 검사", sensitivity: "내부 제어 정보이며 업무 원문을 집계 메타데이터에 복사하지 않음", retention: "REQ-107·109의 호출/감사/본문 보존 정책" }
    business_rules:
      - "입력 허용량 검사는 필수이며 REQ-106의 데이터 전송 동의·NFR-012의 쿼터 검사와 서로 대체하지 않는다"
      - "새 세션 안내는 REQ-001의 선택지다. 한도 회피용 새 턴 자동 생성·보존 자료 삭제·동의 밖 데이터 전송은 허용하지 않는다"
    exceptions: ["사용자 자료 과다는 범위 조정으로, 한도/계산기 설정 오류는 지원/운영 확인으로 구분한다", "필수 입력 수용 불가·압축 실패·공급자 초과 거부는 각각의 실제 원인을 기록하고 정상 호출 성공으로 표시하지 않는다"]
    lifecycle: "목적별 입력 조립 → 유효 한도/생성 예약 확인 → 최종 입력 산정 → 필요 시 선별/압축·재검사 → 허용 호출 또는 사유 있는 미전송/실패"
    permissions: "자료 선별·압축용 읽기와 모델 전송도 현재 권한·동의·마스킹·보존을 따른다. 입력을 줄이기 위한 목적이라고 예외로 취급하지 않는다"
    audit: "판정 근거·축소 사유와 실제 호출/실패를 REQ-107에 연결한다. 사전 추정과 실제 사용량을 구분하고 프롬프트 전문을 새 감사 필드에 복제하지 않는다"
    volume: "호출별 전체 입력을 검사한다. 토큰 수 산정 자체를 LLM 호출로 구현하도록 강제하지 않으며 크기·지연·추정 오차를 경로별로 검증한다"
    config: "한도/계량 방식은 REQ-602·ARCH-040의 모델/경로 지원 계약, 입력 조합과 생성 목적은 REQ-610의 기술 템플릿, 운영값의 관리/조회 경계는 REQ-614를 따른다. 기술 담당자는 계산 계약·지원 검증을, 운영 권한자는 허용된 운영값 적용을 담당한다. 임의 신규 편집 화면/설정 저장소를 만들지 않으며 구체 키·기본값·편집 여부·적용 시점은 open에서 정한다"
    risk: "메시지/도구 비용 누락·추론 중복 계산·검사 뒤 입력 변경·압축 모델의 입력 초과가 있으면 사전 검사만 통과하고 실제 호출은 실패할 수 있어 경계 사례를 함께 검증해야 한다"
    acceptance: "각 호출의 전체 입력·생성 예약·오차 여유와 모델/경로 한도를 근거로 허용 여부를 판정한다. 축소 뒤 재검사하고 필수 맥락을 보존하며 계산 불가/초과를 임의 통과시키지 않는다. 저장량·월 쿼터·턴 누적 한도와 혼합하지 않는다"
    verification:
      - { case: "시스템 지침·도구·응답 형식이 큰 짧은 질문", expected: "질문 본문뿐 아니라 최종 조립 입력 전체를 계산한다" }
      - { case: "컨텍스트 한도와 별도 입력/출력 한도가 다른 경로", expected: "생성 예약과 오차 여유를 반영해 모든 적용 한도를 동시에 만족시킨다. 설명 예시를 운영값으로 쓰지 않는다" }
      - { case: "별도 입력 한도가 더 작고 사전 토큰 수가 추정값", expected: "그 작은 한도에서도 오차 여유를 차감한다. 예를 들어 컨텍스트 10만·생성 예약 2만·입력 한도 7만·오차 여유 5천이면 입력 허용량은 6만5천이다. 예시 수치는 운영값이 아니다" }
      - { case: "출력에 추론이 포함되거나 별도 규칙을 가진 모델", expected: "해당 경로 계약으로 생성 공간을 확보하고 추론을 중복 차감하지 않는다" }
      - { case: "산정량이 허용량과 같음 또는 초과", expected: "동일 값은 이 크기 검사에서 허용하고 초과는 선별/압축·재검사 전 전송하지 않는다. 권한/동의 등 다른 검사는 유지한다" }
      - { case: "후속 도구 결과 추가 또는 검사 뒤 입력/형식 변경", expected: "변경된 최종 입력을 다시 산정하고 이전 통과 판정을 그대로 쓰지 않는다" }
      - { case: "계산기 실패·한도 미확인·경로가 유지하는 문맥을 산정할 수 없음", expected: "임의 환산/0 처리로 호출하지 않고 설정/지원 문제를 안내한다" }
