      - { kind: 예외, case: "상위 100행만 남은 출고 결과로 전체 출고 수량 합계 요청", result: "부분 결과의 한계를 알리고 전체 합계를 추정하지 않는다. 제한된 범위 처리 또는 새 조회 여부를 확인한다" }
