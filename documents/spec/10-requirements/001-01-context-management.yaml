      - { case: "비슷한 결과 여러 개 또는 한 턴 안에 여러 결과가 있고 대상 불명", expected: "허용된 후보 단서로 결과까지 선택하게 하며 최근 결과나 첫 결과를 임의로 쓰지 않는다" }
