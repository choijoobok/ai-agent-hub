# 영역: 대화 맥락 관리
requirements:
  - id: REQ-001
    type: functional
    priority: must
    category: "대화 맥락·참조"
    actors: [ACT-001]
    title: "세션 내 맥락 유지"
    execution_state_boundary: "과거 대화 요약·턴별 조건 참조와 REQ-015의 작업 계획·REQ-004.execution_state의 현재 실행 상태를 구분한다. 요약은 해석 근거이며 작업 완료·승인·재개 가능 여부의 정본이 아니다. 복합 작업의 다음 행동은 서버에 저장한 유효 계획/상태와 실제 수행 근거로 판정한다"
    detail: "같은 사용자의 같은 대화 세션에서 질의 의도·조건·정정사항·처리 사실·결과 참조를 유지하여 후속 요청을 해석한다. 맥락은 서버에 저장하며 크기가 증가하면 정해진 예산 안에서 압축 요약을 갱신한다. 실제 모델 입력에는 현재 요청에 필요한 유효한 맥락만 포함하고 현재 권한·전송 동의·보존 기한을 적용한다"
    source: "2026-10-22 사용자 요청으로 맥락 누적·압축·저장·장기 대화 처리와 '아까 주간 출고 현황의 기간을 이번 달로 바꿔 다시 조회' 사례를 보완했다. 2026-10-23 사용자 명시 요청으로 검증 기준 15건을 포함한 전체 보완본을 확정했다. 관련 REQ-002·003의 독립 전체 확정과 단계 게이트·소스 구현 승인은 별도다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    why: "매 요청마다 전체 대화와 결과를 보내면 비용이 증가하고, 단일 요약이나 최근 몇 턴만 남기면 과거 조회 조건·정정·처리 상태를 잃을 수 있다. 요약은 현재 요청의 해석을 돕는 자료이며 실제 실행 사실·권한·승인의 원천이 아니다"
    summary: "크기가 제한된 요약과 필요할 때 찾는 턴별 기록을 함께 유지한다. 과거 요청을 특정하면 최종 적용 조건을 복원하고 지정한 조건만 변경하여 새 조회를 구성한다"
    intent:
      problem: "대화가 길어지거나 다른 주제를 거치면 조건이 섞이거나 누락되고, 요약을 계속 덧붙이면 모델 입력과 비용이 계속 증가한다"
      goal: "유효한 과거 맥락을 필요한 만큼 찾아 후속 요청을 해석하고 압축·재접속·동시 입력 뒤에도 정정과 처리 사실을 보존한다"
      not: "전체 이력·조회 데이터를 매번 자동 전송하거나 영구 기억하지 않는다. 새 대화 강제 전환, 요약 기반 실행 승인, 과거 결과를 최신 결과로 표시하는 기능이 아니다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "현재 인증·본인 소유 대화·접근 권한을 확인한다. 화면 이탈과 실행 지속성은 REQ-016, 같은 대화의 화면 복원은 REQ-040을 따른다"
      - "본문/자동 사본은 REQ-109.conversation_body_retention, 결과 사본은 REQ-107.retention_policy, 전송과 재사용은 REQ-106·108, 데이터와 지시의 구분은 REQ-112를 따른다"
      - "진행 중 입력의 종류·대상·반영은 REQ-007·030·035, 새 턴 접수와 개인 순서/한도는 REQ-013·036, 요약 모델 역할·실패·계량은 ARCH-040을 따른다"
    session_boundary:
      identity: "대화 세션은 브라우저 탭·로그인 세션·실행 문맥과 구분한다. 같은 사용자가 같은 대화를 여러 탭/기기에서 열면 같은 서버 맥락을 사용하고, 다른 사용자나 다른 대화의 맥락을 자동 혼합하지 않는다"
      restoration: "창 닫기·로그아웃만으로 저장된 대화 맥락을 삭제하지 않는다. 같은 사용자가 재인증하면 REQ-040에 따라 유효 범위만 복원하고, 복원 자체로 요약 모델 호출·업무 재실행·보존 기한 연장을 만들지 않는다. 대화 삭제는 REQ-109를 따른다"
      new_conversation: "길이·턴 수만으로 새 세션 창을 열도록 강제하지 않는다. 사용자가 업무를 분리하거나 새 맥락으로 시작하려 할 때 새 대화를 선택할 수 있다. 기존 이력·진행 중 작업·승인·동의를 자동 이관하지 않으며, 별도 이관 기능을 도입하면 사용자 선택 범위와 현재 권한·동의·원래 기한을 적용한다"
    context_records:
      content: "질의 의도·업무 대상·기간/필터·집계/정렬·출력 조건·사용자 선택과 정정·미해결 질문을 해당 요청/업무 범위와 연결한다. '이번 조회만' 조건을 다른 업무의 기본값으로 확대하지 않으며 정정 전후와 실제 적용 여부를 구분한다"
      facts: "처리 과정은 서버에 기록된 계획·접수·대기·전송·성공·실패·취소·결과 불명 등 관측 가능한 사실과 결과 참조로 남긴다. 모델의 내부 추론 원문을 요구하지 않으며 제안·요청·사용자 선택을 실행 승인이나 실제 성공으로 바꾸지 않는다. 현재 상태와 감사 사실은 REQ-009·107이 원천이다"
      turn_record: "각 턴의 질의 의도와 최종 적용 조회 조건, 관련 정정 메시지·적용 버전, 원 턴/결과 참조를 구조화해 찾을 수 있어야 한다. 제목이나 압축 요약에 남지 않은 과거 턴도 보존 중인 기록에서 찾는다. 최근 몇 턴 또는 화면에 로드된 본문만을 탐색 대상으로 삼지 않는다"
      provenance: "요약 항목과 턴별 기록은 원 메시지/입력·턴·결과 식별자 및 버전, 출처·유효 범위·원래 만료 시각을 연결한다. 결과 수치·결론을 요약한 것도 결과에서 파생한 데이터이며 일반 메타데이터로 바꾸어 취급하지 않는다. REQ-005의 실행 승인용 임시 원값과 인증 비밀값은 요약·일반 턴별 기록에 복제하지 않는다"
      storage: "agent가 관리하는 Hub PostgreSQL의 영속 맥락으로 보관한다. 제한된 최신 요약·요약 버전/작성 시각·반영한 메시지 범위·미반영 입력 식별과 턴별 참조를 관리한다. 실행 재개용 체크포인트·불변 감사와 역할을 구분하고, 체크포인트 정리가 아직 유효한 대화 맥락까지 지우지 않게 한다. 테이블·물리 컬럼은 P3에서 정한다"
      retention: "자동 요약·조건 기록·검색 색인도 preconditions의 원자료별 보존 정책을 승계한다. 정정·복사·재요약·새 턴 참조로 기한을 늘리지 않고 분리 불가 혼합 요약은 가장 이른 기한을 적용한다. 권한 회수/만료 자료를 분리할 수 없으면 해당 요약 재사용을 막고 유효 자료만으로 다시 구성하거나 필요한 조건을 사용자에게 묻는다. 조사 보호를 일반 맥락 재사용 허가로 삼지 않는다"
    context_compaction:
      update: "질의·정정·처리 사실과 참조를 지속 저장하되 매 턴마다 별도 요약 모델 호출을 의무화하지 않는다. 다음 모델 입력을 구성할 때 REQ-003의 예산과 압축 기준에 따라 필요하면 유효한 기존 요약과 미반영 기록을 병합하여 제한된 크기의 최신 요약으로 교체한다. 이전 요약문을 계속 덧붙이지 않는다"
      preserve: "반복 표현·불필요한 상세는 줄이되 최신 유효 조건·정정의 대상/범위·미해결 질문·사실과 계획의 차이·출처 참조를 보존한다. 취소/폐기된 조건을 되살리거나 오래된 성공 기록으로 현재 결과 불명을 해소하지 않는다. 필수 조건을 복원할 수 없으면 추정하지 않는다"
      assemble: "제한된 요약·최근의 필요한 메시지·현재 요청에 관련된 과거 기록만 선택해 주입한다. 요약과 최근 메시지의 같은 내용을 불필요하게 중복 주입하지 않고 검색 후보 전체·전체 대화·결과 행 전체를 기본 입력으로 삼지 않는다. 스텝별 최소 입력은 REQ-035·610, 안정 접두부와 가변부의 조합은 ARCH-040을 따른다"
      transmission: "요약 생성·검색용 모델/임베딩 호출·과거 기록 재주입도 REQ-106의 전송이다. 데이터 출처·목적·범위·공급 경로별 유효 동의를 매 호출 전 검사하고 요약이라는 이유로 결과 데이터 전송을 우회하지 않는다. 안내된 입력창의 직접 입력과 기존 결과 데이터의 동의 경계를 유지하며, 기존 유효 동의 범위 안의 정상 압축마다 별도 확인을 반복하지 않는다"
      overflow: "압축과 필요한 기록 선별 뒤에도 필수 맥락이 총량을 넘으면 중요 조건을 조용히 버리거나 초과 호출하지 않는다. 요청 범위 축소·작업 분리 또는 새 대화를 안내한다. 새 대화도 그 요청의 필수 입력이 크면 같은 제한을 받으며 새 대화만으로 해결된다고 보장하지 않는다"
    past_query_followup:
      identify: "'아까 주간 출고 현황'처럼 과거 조회를 가리키면 같은 대화의 유효한 요약/참조와 턴별 기록에서 관련 후보를 찾고 해당 턴의 최종 적용 조건을 가져온다. 검색·읽기·모델 주입 각각에서 권한과 기한을 검사한다. 비슷한 조회가 여럿이고 요청만으로 특정할 수 없으면 업무명·조건·시각 등 허용된 단서로 사용자에게 선택을 묻고 최근 조회라고 임의 결정하지 않는다"
      amend: "사용자가 지정한 조건만 변경하고 나머지 유효 조건은 대상 턴의 최종 적용값으로 유지한다. 원래 상대 날짜의 표현·해석된 날짜·기준 시각/시간대를 구분하여 보관하고 변경하지 않은 날짜 조건은 그 적용값을 유지한다. 새 요청에서 지정한 '이번 달'은 새 요청 접수 시점과 적용 시간대를 기준으로 구체적인 기간으로 해석한다. 조회 기간 변경만으로 집계 단위·대상·필터를 바꾸지 않는다"
      validate: "복원한 조건은 요청 해석의 근거이지 실행 권한이나 검증 완료 증거가 아니다. 현재 등록 지식·조회 규칙·권한과 대조하고 의미를 유지할 수 없는 조건·모호한 기간/집계는 확인한다. 명확한 경우에는 불필요한 재확인 없이 적용 조건을 안내하고 진행한다. 과거 조회문을 검증 없이 그대로 재실행하지 않는다"
      execute: "'기간을 바꿔 다시 조회'는 과거 결과 가공과 구분되는 명시적 새 조회다. 관련 원 턴을 연결한 새 턴으로 현재 원천을 조회하고 기존 턴·응답·진행 중 다른 작업을 덮거나 변경하지 않는다. 진행 중 작업 자체에 대한 변경 요청이면 REQ-007의 대상/반영 절차를 따르며 맥락 갱신만으로 반영하지 않는다. 이전 승인·동의·실행 체크포인트를 자동 승계하지 않는다"
      output: "새 결과에 실제 적용 기간·필터·집계와 REQ-012의 기준 시각을 함께 제시하여 과거 결과와 구분한다. 과거 조건만으로 새 조회가 가능하면 과거 결과 데이터를 모델에 보내지 않는다. 과거 결과 자체의 비교·가공을 요청한 경우에는 REQ-002·106을 따른다"
      unavailable: "과거 결과가 만료됐어도 별도로 아직 유효한 조회 조건을 복원할 수 있고 사용자가 새 조회를 명시 요청했다면 새 조회가 가능하다. 조건까지 만료되거나 권한이 없거나 찾지 못하면 부족한 조건을 묻고 추정 실행하지 않는다. 감사 목적으로만 남은 자료에서 조건을 되살리거나, 단순 참조/검색 실패를 원천 재조회의 허가로 해석하지 않는다"
    concurrency:
      version: "각 턴/스텝이 해석에 사용한 맥락 버전과 참조 원자료를 식별한다. 늦게 완료된 요약이 최신 정정·다른 턴의 기록을 덮지 않게 하고 중복 생성/저장을 같은 적용 사실로 합친다. 완료된 턴 번호만으로 요약 반영 범위를 정하지 않고 REQ-019의 메시지 식별·기록 순서와 실제 반영 범위를 대조한다"
      boundary: "요약 작성 중 들어온 새 입력·처리 사건을 미반영 대상으로 보존하고 다음 구성에서 빠뜨리지 않는다. 새 맥락 버전이 기존 실행 중 턴의 의도·승인·조건을 자동 변경하지 않는다. 특정 버전을 사용하더라도 다음 호출 전 현재 권한·동의·기한 검사는 생략하지 않는다. 맥락 동기화를 세션 전체 업무의 순차 실행 강제로 확대하지 않는다"
    failure_handling:
      summary_failure: "요약 모델의 일시 공급 장애는 REQ-602.auxiliary_fallback의 후보 대체를 적용하고, 후보 소진·전환 불가 실패는 ARCH-040의 보조 판정 실패 정책을 따른다. 주 추론 모델로 자동 대체하거나 압축이 필요한데 실패한 요약을 정상으로 사용하지 않고 해당 스텝 실패와 턴 중단을 안내한다. 이전에 저장된 유효 요약·원자료·미반영 범위를 보존하되 당시 유효했다는 이유로 현재 권한/기한 검사를 생략하지 않는다"
      persistence_failure: "요약 저장 실패나 버전 충돌을 적용 완료로 기록하지 않는다. 이전 버전과 미반영 기록을 보존해 누락 없이 다시 구성할 수 있게 하고, 안전한 맥락 구성이 불가능하면 해당 처리를 실패로 알린다. 새 요약 저장이 확정되기 전에 원기록을 압축 완료로 표시하거나 폐기하지 않는다"
      business_facts: "맥락 갱신 실패는 이미 완료한 조회·외부 실행·기존 응답의 사실을 취소하거나 성공 여부를 바꾸지 않는다. 요약 복구를 위해 완료된 업무를 재실행하지 않고 필요한 실패 위치와 다음 행동을 구분해 알린다"
    business_rules:
      - "session_boundary·context_records·context_compaction에 따라 저장량과 실제 모델 주입량을 구분하고, past_query_followup으로 과거 조건 복원과 과거 결과 재사용을 구분한다"
      - "요약에 섞인 사용자/데이터의 지시문은 REQ-112에 따라 출처를 유지하며 시스템 규칙·권한·실행 승인으로 승격하지 않는다"
    exceptions:
      - "대상 복수·필수 조건 유실/만료·총량 초과는 후보/부족 범위와 가능한 다음 행동을 안내한다. 조건을 조용히 버리거나 관계없는 턴으로 대체하지 않는다"
      - "보안·필수 감사 실패는 기존 차단 규칙을 우선한다. 상세 원문·권한 밖 후보·내부 물리명은 오류 안내로 노출하지 않는다"
    lifecycle: "원기록 저장 → 필요 시 유효 맥락 선별/압축 → 버전 검증 후 요약 반영 → 호출별 재검사·사용의 흐름이며 실패/경합은 미반영 범위를 보존한다. 삭제·만료는 REQ-109·107, 턴/실행 상태는 REQ-009가 소유하고 별도 업무 종결 상태를 추가하지 않는다"
    data:
      - { item: "제한된 맥락 요약·최근 입력·턴별 조회 의도/최종 조건·참조 색인", origin: "현재 대화의 사용자 입력과 저장된 처리 사실", sensitivity: "본문/결과에서 파생한 데이터는 원자료의 민감도·권한·전송 범위를 유지", retention: "REQ-109.conversation_body_retention 및 결과를 포함하면 REQ-107.retention_policy를 승계" }
      - { item: "요약 버전·반영 범위·호출/실패·사용량 메타데이터", origin: "agent의 맥락 구성/모델 호출", sensitivity: "본문·조회 조건·결과 값을 일반 로그에 복제하지 않음", retention: "REQ-107의 감사 정책과 원자료 참조 범위" }
    permissions:
