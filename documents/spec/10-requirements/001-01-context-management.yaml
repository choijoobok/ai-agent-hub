      - { case: "필수 금액/비교 키가 마스킹·누락되어 합계/결합 불가", expected: "가려진 값의 복원·0 대입·마스킹 문자열의 동일 키 취급 없이 해당 계산 불가나 유효 범위를 알린다" }
      - { case: "조회 시각·기간·집계 단위가 다른 두 결과 비교", expected: "각 출처/시점/범위 차이를 표시하며 동일 조건 증감처럼 제시하지 않는다. 단위·대응 기준이 불명확하면 확인하고 임의 변환/결합하지 않는다" }
      - { case: "특정 결과의 두 열만 모델 요약에 동의했는데 다른 결과/필드까지 요구됨", expected: "실제 전송 직전에 범위를 검사해 확장 전송을 막는다. 명확한 기존 유효 안내/동의를 불필요하게 다시 묻지 않는다" }
      - { case: "요청·동의된 전체 결과가 모델 입력/행 한도 초과", expected: "범위 축소·지원 가능한 집계를 안내하고 임의 잘라 전체처럼 요약하거나 자동 분할로 한도를 우회하지 않는다" }
      - { case: "과거 결과 재가공 완료·복사·재열람", expected: "원본을 유지하고 입력 버전/범위·가공 기준/시각·원 조회 시각을 연결한다. 새 가공 시각으로 데이터 최신성이나 보존 기한을 갱신하지 않는다" }
      - { case: "모델/가공/저장 실패 또는 동의 거부", expected: "원 조회 사실과 구분해 실패/거부를 표시하고 현재 유효한 원본은 유지한다. 모델이 보조 역할이면 REQ-602의 명시된 일시 장애 대체와 REQ-106의 경로별 동의만 적용한다. 그 밖의 실패·동의 거부를 다른 경로·원천 재조회·미동의 재전송으로 우회하지 않는다" }
      - { case: "선택 뒤 전송/제공 전에 권한·동의·기한 만료 또는 결과 버전 변경", expected: "각 경계에서 재검사해 유효하지 않은 사용을 막고 임의 버전 대체를 하지 않는다. 이미 발생한 전송/사용량 사실은 보존한다" }
      - { case: "만료/파기·안전한 사본 없음·조사 보호 자료만 남음", expected: "허용 메타데이터와 사용 불가/다음 행동만 안내한다. 사본·파생본·색인으로 우회하거나 과거 자료인 것처럼 새 조회로 대체하지 않는다" }
      - { case: "기간을 이번 달로 바꿔 새 조회 요청과 과거 결과의 일부 필터 요청", expected: "전자는 REQ-001의 새 원천 조회, 후자는 보존 사본 가공으로 구분한다. 참조만으로 원천을 호출하거나 결과 재참조를 실행 승인으로 취급하지 않는다" }
      - { case: "실패/중단 턴의 유효 부분 결과 또는 아직 생성 중인 결과를 참조", expected: "사용 가능한 고정 버전과 부분 상태를 명시하고 전체 완료 결과로 가장하지 않는다. 가공 때문에 원 턴을 재개하거나 상태를 바꾸지 않는다" }
