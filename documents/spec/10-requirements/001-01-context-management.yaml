      - { case: "상위 100행만 보관되었거나 전체 건수가 미상인 결과로 전체 합계 요청", expected: "부분/미상 제한을 표시하고 전체 합계를 만들어 내지 않는다. 부분 범위 가공 또는 명시적 새 조회 등 선택을 안내한다" }
