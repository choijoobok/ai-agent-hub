      - "승인 카드 표시 언어를 바꿔도 같은 실행 대상·전체 실제 값·승인 요청 버전·유효 자격·최초 기한을 유지한다. 실제 업무 값 변경이면 REQ-017에 따라 기존 카드의 승인을 막는다"
