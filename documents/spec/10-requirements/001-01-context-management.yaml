    audit: "REQ-107에 요약 전후 버전·원 메시지 반영 범위·실제 참조한 과거 턴/조건 버전·압축 사유·성공/실패·호출 역할/공급 경로/모델·사용량을 연결한다. 원문 대신 통제된 참조를 남긴다. 요약 호출 사용량은 ARCH-040·REQ-116에 따라 해당 질의 사용자에게 귀속하며 REQ-006의 표시/불확실성 규칙을 따른다"
    volume: "대화 길이에 따라 서버의 보존 중 기록은 증가할 수 있지만 매 호출의 주입량은 REQ-003의 예산을 따른다. 과거 후보 탐색량·요약 빈도·지연·토큰 사용량과 다중 탭/턴 경합을 함께 측정한다"
    config: "전체 입력 예산·압축 시작 기준·요약 목표 크기·최근 메시지/검색 후보 선별량의 수치와 설정 방식은 REQ-003의 후속 설계로 정한다. 보존·모델 역할·쿼터 설정은 기존 정본을 참조하고 별도 세션 전용 값으로 중복 정의하지 않는다"
    risk: "요약의 과도한 압축·반복 재요약은 조건/출처 유실과 의미 변형을 일으킬 수 있다. 턴별 기록 대조·모호성 확인·현재 유효성 검사로 잘못된 자동 실행을 막고 실제 복원 정확도와 비용은 후속 시험으로 검증한다"
    acceptance: "다른 주제와 반복 압축을 거친 뒤에도 유효한 과거 조회의 최종 조건을 찾아 지정한 조건만 변경한 새 조회를 구성한다. 요약/최근 메시지/참조 기록은 예산 안에서 선택하고 전체 이력 자동 주입·새 세션 강제 전환·원자료 기한 연장·권한/승인 우회가 없다. 모호하거나 유실된 조건은 확인하며 재접속·동시 입력·요약 실패로 기록 유실·오래된 조건 부활·중복 실행을 만들지 않는다"
    verification:
