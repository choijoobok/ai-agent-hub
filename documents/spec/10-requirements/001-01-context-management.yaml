      - { case: "서울/부산센터의 주간 출고 조회가 모두 있고 어느 것인지 특정할 단서가 없음", expected: "허용된 후보 단서로 선택을 묻고 가장 최근 조회를 임의로 실행하지 않는다" }
      - { case: "조건 A를 B로 정정해 적용한 뒤 여러 차례 압축·과거 재참조", expected: "지정 대상의 최종 적용 B를 복원하고 A의 실제 과거 처리 이력은 덮지 않는다. 이번 조회 한정 조건을 다른 업무에 전파하지 않는다" }
      - { case: "오래된 조회가 최신 요약·최근 메시지·화면 로드 범위에서 빠졌지만 유효 턴별 기록은 남음", expected: "서버 기록에서 관련 후보/조건을 찾아 필요한 범위만 주입한다. 전체 대화·결과 행 일괄 전송이나 조회 망각으로 대체하지 않는다" }
      - { case: "월 경계를 지나 같은 절대 날짜 조건 재참조·새 요청에서 이번 달 지정·주별 집계 조회의 기간 변경", expected: "유지할 날짜는 원 적용값, 새 상대 날짜는 새 요청 시점/시간대로 구분한다. 기간만 변경했으면 주별 집계를 월별 집계로 바꾸지 않는다" }
      - { case: "과거 결과만 만료, 조회 조건은 별도 정책상 유효·사용자가 새 조회 명시 요청", expected: "유효 조건으로 새 조회하고 현재 결과임을 구분한다. 만료 결과를 복원하거나 최신 결과처럼 재사용하지 않는다" }
      - { case: "조회 조건까지 만료/유실·권한 회수·조사 보호 자료만 남음", expected: "금지된 기록/색인을 읽거나 재주입하지 않고 필요한 조건을 사용자에게 묻는다. 감사 자료나 추정 조건으로 원천을 자동 조회하지 않는다" }
