  - id: REQ-020
    type: "functional"
    priority: "could"
    category: "사용자 언어"
    actors:
      - "ACT-001"
    title: "사용자 언어와 원어의 분리"
    detail: "Portal에서 지정한 사용자 언어를 질의 결과 설명·요약, 승인 안내, 역질문·선택지와 상태·오류 안내 등 사용자 대상 소통의 기준으로 사용한다. 자연어 설명·질문은 LLM이 해당 언어로 생성하고 정형 문구는 등록된 다국어 메시지로 제공한다. 지식 검색과 SQL 생성은 등록된 원어·식별자 기준을 유지하며 조회 데이터와 실행 인자의 원값은 번역하지 않는다"
    roadmap: "RM-P4"
    note: "번역 과정에서 업무 용어가 왜곡되면 태그 매칭이 실패한다 — 지식 태그의 **동의어에 외국어 표현을 함께 등록**할 수 있어야 한다"
    summary: "RM-P4에서 Portal 지정 언어로 소통하되 LLM 설명·정형 메시지·업무 원값을 구분하고 승인 의미를 보존한다"
    scope_status: "RM-P4 후속 차수 — 현재 RM-P1의 구현·게이트 필수 범위로 앞당기지 않는다"
    business_rules:
      - "Portal에서 사용자가 명시적으로 지정한 지원 언어를 사용자 대상 소통에 적용한다. 시스템 기본 언어와 같은 경우에도 같은 기준을 사용하며 기본 언어가 다르거나 질의·지식·도구 결과가 다른 언어라는 이유로 출력 언어를 임의 변경하지 않는다. 초기 지원 언어는 한국어·영어이며 추가 언어를 확장할 수 있게 한다. 유효한 언어 선택은 Portal의 사용자 명시 지정 → 계정에 저장한 언어 → 시스템 기본 언어 순으로 결정하고 시스템 기본 언어는 지원 목록 안에서 설정한다. 미지원 값은 지원되는 다음 순위로 폴백하고 사용자에게 알리며 입력/원천 언어를 추정해 선택하지 않는다"
      - "Portal의 유효한 언어 선택을 agent의 사용자 소통 문맥으로 전달하고 REQ-009의 공통 메시지·모델 호출 계약에 연결한다. 사용자 대상 설명을 생성하는 최초·후속 모델 호출에 적용 언어를 제공한다. 결과 본문이나 모델의 추정으로 언어 설정을 덮어쓰지 않으며 내부 분류·제어 코드·작업 스키마는 번역하지 않는다"
      - "질의 결과의 설명·요약, 부족한 정보에 대한 역질문, 선택지의 설명과 승인할 작업의 목적·영향 설명은 검증된 처리 사실과 허용된 근거를 바탕으로 LLM이 처음부터 사용자 지정 언어로 작성한다. 한국어 등 시스템 기본 언어의 답변을 먼저 만든 뒤 번역용 모델을 추가 호출하는 방식을 기본 처리 경로로 두지 않는다"
      - "승인·거절 버튼, 처리 상태, 만료 안내와 정형 오류는 REQ-505의 등록된 다국어 메시지로 제공한다. 승인 카드 항목명·표 제목도 등록된 번역을 우선 사용한다. 정형 문구의 표시를 위해 모델 호출을 강제하지 않는다. 지정 언어 번역이 없으면 시스템 기본 언어의 등록 문구, 등록된 원문 순으로 대체하고 번역 미제공을 안내한다. 모델이 식별자·업무 값을 임의로 바꿔 채우지 않으며 항목명을 대체 표시하더라도 같은 업무 항목에 연결한다"
      - "지식의 식별자·태그 식별 관계·테이블/컬럼·코드·SQL과 실행 인자의 실제 값은 번역 대상으로 삼지 않는다. 설명 언어를 바꿔도 같은 업무 대상을 가리켜야 한다"
      - "외국어 동의어는 기존 지식/태그 관리 규칙으로 등록하고 서로 다른 업무 용어가 겹치면 임의 매핑하지 않고 의미를 확인한다"
      - "고객명·상품명·코드·금액·날짜 등 조회 값과 실제 실행 인자는 원천 값을 유지하며 설명·안내와 값의 구분을 보존한다. 표시 형식을 적용하더라도 수량·단위·정밀도·시점의 업무 의미와 실제 전송 값은 바꾸지 않는다"
      - "승인 카드의 실행 대상·전체 실제 값·유효 승인 요청은 REQ-005·017의 검증된 구조화 데이터가 기준이다. 번역된 설명에서 실행 인자를 다시 추출하거나 승인 범위를 재구성하지 않는다. 승인·거절 등 표시 문구의 언어가 달라도 동일한 서버 조작에 연결하며 자연어 설명을 실행 승인으로 간주하지 않는다"
      - "언어별 설명은 성공·실패·부분 처리·결과 불명, 조건·부정·금액·단위와 선택별 후속 처리의 의미를 유지해야 한다. LLM의 번역·생성 문장이 실제 수행 기록이나 승인 조건과 다르면 그 문장을 근거로 상태·값·승인을 바꾸지 않는다"
      - "언어 설정 변경은 변경 후 새로 생성하기 시작하는 응답부터 적용한다. 이미 생성된 대화 원문은 보존하고 자동 재번역하지 않으며, 생성·스트리밍 중인 한 응답은 시작 시 적용한 언어를 유지한다. 정형 화면 문구의 언어 전환도 기존 대화 내용·업무 사실의 변경으로 취급하지 않는다"
      - "언어만 변경해도 새 조회·업무 실행·원 실행 재시도·승인 요청 교체를 자동 유발하지 않는다. 기존 승인 요청의 대상·값·버전·유효 자격·최초 기한은 유지한다. 실제 업무 내용이 바뀌는 경우에는 언어 변경과 구분하여 REQ-017의 무효화·새 승인 규칙을 적용한다"
      - "언어 생성·번역 또는 해당 언어의 표시가 실패하면 등록된 정형 안내와 표현 생성/표시의 재시도 수단을 제공한다. agent에 연결할 수 없거나 응답을 표시할 수 없는 클라이언트 오류는 ARCH-019.local_failure의 portal 등록 메시지 경로를 적용한다. 이미 존재하는 사용자 공개용 원문은 현재 열람 권한·보존 범위 안에서 번역 미제공을 표시해 함께 제공할 수 있으며 내부 프롬프트·도구 원문·비밀을 대체 원문으로 노출하지 않는다. 원문이 없으면 새 업무 조회 없이 실패 안내와 표현 재시도를 제공한다. 재시도는 허용된 기존 근거로 설명을 다시 생성하거나 표시하는 범위이며 원천 업무 조회·실행을 다시 수행하지 않는다. 근거가 만료·부족하면 재생성 불가를 안내하고 임의 값을 추정하지 않는다. 업무 결과·승인 상태·대기 기한을 성공이나 연장 상태로 바꾸지 않는다"
      - "번역·설명을 위해 모델에 전달하는 정보도 REQ-009·106·111의 현재 권한·동의·마스킹·전송 제한을 적용한다. 승인 화면에 표시할 권한이 있다는 이유만으로 비밀·실행 파라미터 원값을 추가 전송하지 않으며 실제 값의 보호·렌더링은 REQ-005의 원값 보관/표시 경로를 따른다. 표현 재생성 호출도 기존 사용량·스텝·개별 호출 제한을 따른다"
    open:
      - "@defer RM-P4 확정한 초기 지원 언어·선택 우선순위·번역 누락 폴백의 설정/메시지 키, 확장 언어의 등록·검증과 화면 표기를 설계한다. 현재 system 공통 구현의 로그인 전 브라우저 폴백은 별도 범위로 보존하고 Portal 정책과의 연결을 대조한다"
      - "@defer RM-P4 Portal 언어 선택의 저장·계정/세션 동기화, agent 전달과 모델 호출별 적용 언어, 다중 탭·처리 중 변경의 메시지 경계 및 이력 연결 계약을 설계한다. system의 기존 관리자 계정 언어·메시지 번들과 기술 유틸의 재사용 범위를 대조하되 Portal 계정/세션/개인 설정을 관리자 계정에 연결하지 않는다"
