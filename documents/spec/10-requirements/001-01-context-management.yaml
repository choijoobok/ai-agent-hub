    acceptance: "Portal 지정 언어가 시스템 기본 언어·입력/원천 언어와 달라도 결과 설명·승인 안내·역질문·선택지와 정형 상태/오류가 각 생성 방식에 따라 지정 언어로 제공된다. 원천 데이터·식별자·실행 인자와 승인 의미는 유지되고, 언어 변경·표현 실패/재시도로 업무 조회·실행이 반복되거나 기존 승인 기한이 연장되지 않는다. 지원 범위 밖이거나 표현을 만들 수 없으면 정해진 안내·폴백으로 처리한다"
    verification:
