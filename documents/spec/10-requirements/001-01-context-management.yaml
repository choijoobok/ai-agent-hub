  - id: REQ-012
    type: functional
    priority: must
    category: "조회 결과 정보"
    actors: [ACT-001]
    title: "기준 시각 제공"
    detail: "처리 결과가 데이터 조회일 때는 기준 시각(DW 사용 시 동기화 시점)을 함께 제공한다"
    why: "사용자가 동기화 지연을 인지하지 못한 채 낡은 데이터로 판단하는 것을 막는다"
    summary: "조회 결과의 원천·데이터 기준 시각·조회 시각을 구분해 표시하고 최신성의 확인 가능 범위를 알린다"
    preconditions:
      - "REQ-011·NFR-002의 조회 결과와 해당 데이터소스 또는 응답 계약이 제공한 시각 메타데이터를 사용한다"
    data:
      - item: "결과/페이지 참조·원천 식별·기준 시각 종류와 값·시간대·확인 가능 여부·조회 시각"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "데이터 기준 시각은 원천이 제공한 업무 기준/스냅샷 시각 또는 해당 데이터에 대응하는 마지막 성공 동기화 시각이다. Hub의 요청·조회 완료·화면 표시 시각을 데이터 최신 시각으로 대체하지 않는다"
      - "기준 시각을 제공하지 않는 원천은 기준 시각 확인 불가로 표시하고 조회 시각은 별도 표시한다. 연결 성공이나 최신 조회라는 이유로 실시간·최신 데이터라고 단정하지 않는다"
      - "원천·대상별 기준 시각이 다르면 각 적용 범위를 구분한다. 여러 원천의 결과를 합쳐도 가장 최근 시각 하나를 전체 데이터의 기준 시각으로 표시하지 않는다"
      - "시각 값과 원천 시간대/오프셋을 함께 해석하며 REQ-011의 사용자 표시 형식으로 변환한다. 원천 시간대가 불명확하면 임의 시간대로 변환하지 않고 그 한계를 표시한다"
      - "동기화 실패 시 최근 성공 시각과 실패/지연 사실을 구분한다. 후속 페이지·보존 결과·재접속·허용된 내보내기는 해당 결과에 연결된 기준 시각을 유지하고, 새 원천 조회로 기준이 바뀌면 변경 사실을 표시한다. 페이지 간 동일 스냅샷을 보장한다는 뜻은 아니다"
    exceptions:
      - "시각 누락·해석 불가·상충은 확인 불가 또는 불일치로 표시하고 성공 시각을 만들어내지 않는다. 데이터 자체를 사용할 수 있는지는 기존 조회/원천 계약을 따른다"
    lifecycle: "결과 수신 시 출처와 시각 근거를 연결하고 이후 조회·복원 시 같은 근거를 사용한다. 새 조회의 시각을 과거 결과에 덮어쓰지 않는다"
    permissions: "기준 시각 표시는 해당 결과의 열람·반출 권한 안에서 제공하며 내부 접속 주소·계정은 표시하지 않는다"
    audit: "결과 참조와 기준 시각의 원천·확인 불가 사유를 REQ-107·109의 기존 기록 및 보존 범위에 연결한다"
    config: "새 고정 신선도 임계값은 두지 않는다. 원천별 시각 필드·의미·시간대 계약은 P2/P3에서 정한다"
    risk: "조회 시각을 최신성으로 오인하거나 혼합 원천의 지연을 숨기면 잘못된 업무 판단으로 이어진다"
    open:
      - "@defer P2 원천별 기준 시각의 제공 여부·의미와 혼합 결과 표시를 확인한다"
      - "@defer P3 시각 메타데이터·페이지/내보내기 연결 및 시간대 변환 계약을 설계한다"
    verification:
      - "DW가 09:00에 동기화되고 10:00에 조회되면 두 시각을 구분한다"
      - "기준 시각 없는 API 결과에 현재 시각을 최신성 근거로 넣지 않는다"
      - "서로 다른 기준 시각의 두 원천과 시간대 미상·동기화 실패·재접속·후속 페이지 사례를 대조한다"
    intent:
      problem: "사용자가 동기화 지연을 인지하지 못한 채 낡은 데이터로 판단하는 것을 막는다"
      goal: "조회 결과의 원천·데이터 기준 시각·조회 시각을 구분해 표시하고 최신성의 확인 가능 범위를 알린다"
    goal_trace:
      - "GOAL-1"
    decider: "제품 오너(사용자)"
    relations:
      depends_on: []
      constrains: []
