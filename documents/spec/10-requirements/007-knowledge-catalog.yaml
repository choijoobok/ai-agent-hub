      - "전체 지식의 제목·본문·일괄 요약 요청에는 구체적인 업무 또는 사용법 질문을 요청한다"
    lifecycle: "안내 지식은 REQ-305·306의 후보·승인·활성 수명주기를 따른다. 초기 안내 표시 자체는 새 턴이 아니다"
    permissions:
      - "안내 지식 관리는 해당 관리 액션 권한을 따르며 사용자는 허용된 활성 지식만 조회한다"
