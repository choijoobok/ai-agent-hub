    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(동일 지식의 승인 대기 중 신규 요청 차단을 반영 세트 간에도 적용, 조사·검토 근거를 가진 변경 요청과 반영 세트 승인을 하나의 절차로 관리) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-10-06 사용자 정정: 공통 태그 텍스트의 단독 변경에서는 연결된 지식이 영향 확인 대상이며 수정 대상이 아니다(REQ-607) · 2026-10-06 사용자 추가 확정: 태그/지식 변경은 상호 차단하지 않고 영향 목록·태그 텍스트 차이만으로 자동 반려하지 않으며 REQ-607의 실제 변경 대상 버전/태그 ID 유효성 검증을 적용한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 보완 요청: 지식 연결 도구의 승인 전 계약 변경 검증·당시 참조 버전 재현을 보완하고 전체 카드 재확정 대기 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록 · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다. · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-09-05"
    title: "전체 변경 세트 검증·직접 저장과 일괄 반영"
    detail: "지식·예제·카탈로그·태그·API·도구의 단독 또는 명시적인 복합 변경은 실제 변경 대상 전체의 현재 변경 권한·기대 버전·참조/기술 계약을 검증한 뒤 직접 저장으로 일괄 반영한다. 승인 절차를 두지 않고 일부 구성만 반영하지 않는다."
    hard_rule: "한 대상의 일부만 성공시키지 않는다. 참조/영향 조회만 하는 외부 자산은 실제 변경 대상에 자동 편입하거나 장기 선점하지 않는다. 명시적으로 함께 수정한 모든 대상만 같은 원자 변경 세트에 포함한다."
    why: "업무 정책 변경은 지식 하나, 관련 지식, 공개 뷰의 의미, 인증 예제 쿼리와 매핑을 함께 바꿀 수 있다. 일부만 서비스에 반영하면 Agent가 서로 다른 근거를 조합해 잘못된 답을 만들 수 있다"
    traces_to:
      - "REQ-301"
      - "REQ-303"
      - "REQ-304"
      - "REQ-305"
    acceptance: "동일한 저장의 모든 실제 변경 대상이 검증·반영·전체 이력 저장에 성공하거나 모두 실패한다. 자기 기준본 충돌·필수 참조 부재/폐기/권한 실패·기술 계약 오류는 차단한다. 외부 안정 ID 매핑의 참조 리비전 상승이나 영향 지식 변화만으로 자동 반려/갱신하지 않는다. 별도 관리자 요청/승인 상태는 없다."
    evidence: "실제 변경 대상의 전체 전후 구성·기준/결과 버전·실제 저장자/시각·사유·필수 기술 검증·성공 결과를 불변 보존한다. 별도 지식 영향 판단/보완 작업 원장은 만들지 않는다."
    catalog_boundary: "Hub 카탈로그 구조·업무 의미·값 도메인·조인과 테이블 그룹/컬럼 예외는 카탈로그 소유 전체 구성으로 직접 저장한다. 고객사 물리 DB는 변경하지 않는다. 사용자 소속/신원과 그 밖의 정책은 각 원 소유 직접 관리 단위를 따른다."
    version_guard: "실제 변경 대상의 기준 운영 리비전과 현재 최종 적용본을 비교해 동시 덮어쓰기를 막는다. 지식이 안정 ID로 매핑한 태그·예제·카탈로그·API·도구의 리비전은 지식의 저장 조건으로 고정하거나 현재값과 일치시킬 대상이 아니며 상승만으로 저장을 거부하지 않는다(REQ-303.reference_mapping). 매핑 대상의 존재·현재 연결 가능 상태·권한은 검사한다. 예제 SQL의 정확 카탈로그 참조, 가이드 기반 선행 조회 SQL의 현재 기술 검증, API/도구의 구현·입출력 계약 등 기술적 참조는 각 소유 자산의 검증을 유지하고 유효성 실패를 허용하지 않는다. 같은 세트에서 실제 변경하는 후보의 자기 기준본과 기술적 참조 정합성은 반영 직전까지 보호하며 부분 반영하지 않는다."
