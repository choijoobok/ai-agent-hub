    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-09-30 사용자 결정(인증 예제 SQL의 참조 객체를 예제에 자동 매핑하고 지식 직접 매핑과 조회 시 합산, 지식으로 매핑 복사 금지) · 2026-10-02 사용자 보완 요청: 실행 데이터소스를 지정하고 DB 스키마는 SQL·카탈로그 참조에서 식별하며 별도 수동 목록을 두지 않는다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: "PRC-09-02"
    title: "인증 예제 쿼리 — 직접 실행 경로를 우선한다"
    detail: "**예시 주입** — 질의와 유사한 예제 쿼리를 컨텍스트에 넣어 SQL 생성의 기준으로 삼는다. **직접 실행** — 질의가 예제 쿼리에 충분히 대응되면 LLM 이 SQL 을 새로 쓰지 않고 **파라미터만 채워** 실행을 요청한다"
    hard_rule: "**직접 실행도 SQL 통제 4단계를 건너뛰지 않는다** — 파라미터 값이 조건절을 바꾸므로 검증 없이 실행하면 통제가 무의미해진다. **예제 쿼리라는 이유로 면제되는 통제는 없다**"
    note: "축적 경로는 둘이다 — ① 관리자가 직접 등록 ② **성공한 조회 이력에서 관리자가 승격**. 예제 쿼리는 **등록 시점에 검수**하고, 추출된 **참조 공개 인터페이스는 정형으로 저장**되어 주입 판정과 공개 범위 영향 검수의 근거가 된다"
    why: "자주 쓰이는 질의를 예제 쿼리로 수렴시키면 정확도·조회 부하·검증 부담이 함께 줄어든다"
    acceptance: "등록·수정한 예제 SQL의 공개 테이블·뷰를 식별해 해당 예제 후보에 카탈로그를 자동 매핑하며, 미등록·추출 불확실 참조는 해결 전 반영하지 않는다. 관리자 등록 또는 성공 조회에서 승격한 인증 예제도 현재 변경 권한·기대 버전·SQL/참조 기술 검증과 직접 저장·전체 이력 성공 후에만 사용하며, 질의가 충분히 대응돼도 파라미터 바인딩 뒤 SQL 통제 4단계를 모두 통과해야 직접 실행된다. 실행 데이터소스 한 개의 연결로 접근 가능한 여러 DB/카탈로그·스키마를 참조하는 예제도 허용하며 별도 사용 DB/스키마 허용 목록 없이 SQL·카탈로그로 소속을 식별한다. 다른 데이터소스의 참조를 섞거나 객체 식별을 검증하지 못한 예제는 반영·실행하지 않는다"
    roadmap: "RM-P1"
    summary: "관리자가 검수한 업무 질문·SQL 쌍을 AI 작성 참고 또는 파라미터 채움 실행에 활용한다. 개인 즐겨찾기 공유가 아니며 모든 실행 통제는 그대로 적용한다"
    intent:
      problem: "반복되는 질문마다 SQL을 새로 생성하면 오류와 검증 부담이 커진다"
      goal: "검수된 예제와 파라미터 명세를 재사용하되 현재 권한과 실행 통제를 유지한다"
      not:
        - "사용자 그룹 공용 즐겨찾기가 아니다"
        - "인증되었다는 이유로 SQL 검증이나 권한 확인을 면제하지 않는다"
    goal_trace:
      - "GOAL-1"
      - "ECO-02"
    decider: "제품 오너(사용자)"
    preconditions:
      - "참조 공개 인터페이스가 카탈로그에 등록돼 있다"
      - "질의와 예제의 대응을 판단할 업무 질문·파라미터 명세가 있다"
    data:
      - item: "업무 질문·실행 대상 Hub 데이터소스 내부 식별자·SQL·파라미터·참조 인터페이스·노출 허용 그룹"
        origin: "관리자 직접 등록 또는 성공한 조회 이력의 승격"
        sensitivity: "내부 SQL·업무 메타데이터"
        retention: "검수·변경 이력과 원 조회 승격 근거 보존, 상세 보관 기간은 P3 설계"
    business_rules:
      - "등록 경로·검수·두 활용 방식은 본문의 detail·note를 따른다"
      - "예제의 실행 대상은 Hub 데이터소스 내부 식별자 한 개로 명시한다. DB/카탈로그명·DB 스키마명·물리 참조는 REQ-301을 따르며, REQ-603의 동일 연결로 접근 가능한 여러 DB·스키마의 등록 공개 객체를 하나의 SQL에서 사용할 수 있다. DB·스키마마다 별도 예제/데이터소스를 만들도록 강제하거나 SQL과 별개인 사용 DB/스키마 허용 목록·권한 매핑을 수동 관리하지 않는다"
      - "등록·수정하는 예제의 해당 후보 SQL에서 사용하는 공개 테이블·뷰를 추출하고 REQ-301의 DB/카탈로그·필요 서버 한정자를 포함한 전체 물리 식별로 중복 제거해 해당 인증 예제 후보에 카탈로그 식별자·버전을 자동 매핑한다. 별칭·임시 질의 이름은 실제 객체와 구분하며 공개 뷰 내부의 비공개 원본 테이블까지 자동 수집하지 않는다. 노출 허용 그룹을 매핑한다(FEAT-023)"
      - "참조 추출 실패·불확실성이나 카탈로그 미등록·식별 불가 객체를 누락으로 표시한다. 초안 저장은 허용하지만 해결되지 않은 참조를 완전한 목록으로 간주하거나 운영에 반영하지 않는다. 미등록 객체는 공개 범위 선정·등록·검수를 요구하며 자동 등록·공개하지 않는다. 같은 반영 세트의 검토 대상 카탈로그 후보를 연결할 수 있으며 버전 검사는 REQ-306을 따른다"
      - "개인 저장 조회 승격은 REQ-205를 따르며 다른 사용자의 즐겨찾기·위젯을 만들지 않는다"
      - "직접 실행은 SQL 재작성 없이 파라미터를 채우는 경로이며 SQL 통제 4단계를 생략하지 않는다"
      - "예제 SQL·정확 카탈로그 참조·파라미터/그룹의 전체 구성은 현재 변경 권한·기대 버전·기술 검증과 이력으로 직접 저장한다. 예제와 지식 매핑은 소유 구성을 분리하며 필수 참조 무결성을 유지한다."
    exceptions:
      - "참조 카탈로그와 관계가 끊기면 등록을 확정하지 않는다(PRC-09-02)"
      - "검증·권한 통과 실패 시 실행하지 않으며 인증 여부로 우회하지 않는다"
    lifecycle: "관리자 등록/승격의 전체 로컬 편집 → SQL/참조·현재 권한/기대 버전 검증 → 직접 저장과 전체 이력 → 활용. 수정·폐기도 같은 소유 검증을 적용한다."
    permissions:
      - "등록·검수·승격: 유효 메뉴 권한의 ACT-003"
      - "사용자 활용: 노출 허용 그룹과 현재 참조 객체 접근 권한을 판정한다"
    audit: "등록·검수·승격의 출처와 실행 때의 SQL 통제 결과를 추적한다"
    volume: "반복 질의를 예제로 축적한다. 수량 상한·매칭 규모는 실측 기반 P2 설계 대상이다"
    config: "노출 허용 그룹·파라미터 명세는 관리자 관리 값이다"
    risk: "질문이 비슷해도 업무 의미가 다르면 잘못된 예제를 고를 수 있으므로 단순 문구 유사성만으로 정확성을 보증하지 않는다"
    relations:
      depends_on:
        - "REQ-603"
        - "REQ-601"
      constrains:
        - "REQ-021"
        - "REQ-205"
        - "REQ-303"
        - "REQ-305"
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features:
        - "FEAT-023"
        - "FEAT-219"
      screens:
        - "SCR-012"
    examples:
      - kind: "정상"
        case: "검수된 월별 출고 집계 예제에 사용자가 요청한 기간을 바인딩하고 현재 권한을 다시 검사해 실행한다"
      - kind: "정상"
        case: "DS-1에서 sales.orders와 archive.order_events를 조인하는 예제를 등록하면 두 공개 객체의 카탈로그를 자동 연결한다. 예제에 별도 사용 스키마 목록을 입력하지 않는다"
      - kind: "예외"
        case: "예제의 SQL이나 실행 데이터소스를 바꾸면 해당 후보의 참조 카탈로그를 다시 추출·검증한다. archive.order_events의 접근 권한이 없으면 sales.orders 참조만 남겨 불완전한 예제를 주입·실행하지 않는다"
      - kind: "예외"
        case: "예제 등록 뒤 사용자의 창고 접근 권한이 회수되면 과거 인증을 이유로 실행을 허용하지 않는다"
    volatility:
      level: "high"
      what: "예제의 질문·SQL·노출 그룹은 고객 업무에 따라 바뀐다"
    open:
      - "@defer P3 — 인증 예제의 검수·변경·폐기 이력 보관 기간과 상세 상태를 설계한다"
    maturity:
      level: "confirmed"
      at: "2026-10-02"
      by: "AI 정본 보완"
      confirmed_by: "사용자 (2026-09-30 REQ-301~308 확정 · 2026-10-02 예제의 실행 데이터소스·DB 스키마 참조 보완 요청)"
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
  - id: REQ-303
    manual_use_contract: "2026-11-01 사용자 승인: 지식의 수동 사용 여부(useYn, 논리 Boolean)는 REQ-601.asset_availability를 따른다. 지식 전체 직접 저장·이력의 한 항목이며 효력/검수·그룹·임베딩 준비 상태와 분리한다. OFF 지식과 그 지식의 매핑 설명은 검색·LLM 주입 및 저장 정의/워크플로우의 후속 사용에서 제외한다. 연결된 API·도구 한 건의 기술 장애가 지식의 수동 값을 자동 OFF로 바꾸거나 지식 전체의 업무 의미 부적합을 판정하지 않는다. 실제 사용하는 지식·개별 참조는 각 사용 직전 현재 조건을 검사하고 이미 외부 전송한 업무를 소급 취소/재전송하지 않는다."
    type: "functional"
    priority: "must"
    actors:
      - "ACT-003"
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(인증 예제별 자동 카탈로그 매핑, 지식의 예제·카탈로그 독립 매핑과 조회 시 합산, 직접 매핑 복사 금지) · 2026-10-02 사용자 보완 요청: 여러 데이터소스·DB 스키마의 카탈로그를 참조할 수 있으나 지식에 소속 정보·스키마 권한을 중복 매핑하지 않는다 · 2026-10-06 사용자 정정: 지식에는 고정 태그 ID를 매핑하며 태그 텍스트만 바뀌면 지식 리비전·매핑은 유지한다(REQ-607). 같은 날 REQ-608 보완 요청에 따라 지식의 업무 API 매핑과 업무 절차/API 공통 입력 가이드의 역할 구분을 연결한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 보완 요청: REQ-038 검토에 따른 커스텀 도구 직접 매핑·승인 소유·후보 구성 보완, 변경 카드 전체 재확정 대기 · 같은 날 사용자 추가 지시: 도구의 용도·사용 조건은 지식 본문이 아닌 각 API·커스텀 도구 매핑 건의 설명으로 관리 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다."
    process_step: "PRC-09-01"
    title: "지식과 공개 데이터 인터페이스의 역할 경계 — 참조 링크"
    query_constraint_boundary: "테이블/뷰의 필수 조회 제약은 REQ-611.query_constraints를 참조한다. 지식은 출고 실적의 기준일 등 업무 의미와 조건 선택 근거를 설명하며 공통 제한 수치·대체 예외를 복제하거나 면제하지 않는다. 연결 카탈로그를 사용할 때 해당 제약도 함께 확인한다"
    detail: "지식 본문에는 물리 테이블·컬럼명과 SQL을 담지 않는다. 업무 설명은 지식, 공개 객체의 구조·의미는 카탈로그, SQL은 인증 예제가 정본이다. 지식은 접근 허용 그룹·태그 ID와 함께 인증 예제 0..N개, 카탈로그 직접 참조 0..N개, 업무 API 0..N개와 커스텀 도구 0..N개를 각각 독립적으로 매핑한다. 예제가 없거나 지식에 필요한 카탈로그 일부만 사용하는 경우도 허용한다. 예제의 카탈로그 매핑을 지식에 복사하지 않고 조회 시 직접 참조와 예제를 통한 간접 참조를 합산한다. 업무별 API·커스텀 도구의 용도·사용 조건·해당 도구의 입력 확보 절차는 각 지식-도구 매핑의 설명, 공통 파라미터 명세·값 채우기 가이드는 REQ-608의 API 관리가 정본이다. 접근 그룹이 없는 지식은 활성 상태여도 사용자 검색·주입 대상이 아니다"
    why: "Hub가 선택해 공개한 물리명·구조의 원천은 카탈로그 하나다. 다른 자산이 물리명을 자유 텍스트로 품으면 **통제와 변경 검수 밖에서 관리되는 스키마 사본**이 생긴다"
    link_uses: "① 지식·예제·카탈로그의 현재 접근 판정 ② 직접/예제 경유 카탈로그 합산을 통한 SQL 작성 범위 구성 ③ 안정 ID 사용처·직접/간접 참조 경로 조회 ④ 현재 지식 링크와 권한·유효 계약을 충족하는 API/도구 후보 구성"
    acceptance: "지식에 인증 예제와 카탈로그를 각각 0개 이상 연결할 수 있으며 예제 참조가 지식의 직접 매핑으로 복사되지 않는다. 조회 시 직접·간접 카탈로그를 중복 제거해 합산하고 예제가 없어도 직접 매핑을 사용한다. 예제 연결 해제 후 해당 경로만의 항목은 합산 목록에서 빠지지만 직접 또는 다른 예제 경로는 유지한다. 접근 판정 실패 자산은 주입하지 않고 필수 참조 일부를 숨긴 불완전한 예제도 주입하지 않는다. 과거 지식 이력은 당시 소유 매핑을 재현하고 실행 당시 합산 목록은 실제 사용한 자산 리비전 기록으로 재현한다. 서로 다른 데이터소스·DB 스키마의 항목을 같은 지식에 연결해도 별도 데이터소스/스키마 목록을 입력하지 않으며 참조 합산이 단일 SQL의 데이터소스 경계나 사용자 권한을 확대하지 않는다 커스텀 도구도 0개 이상 직접 연결하고 같은 도구를 여러 지식에서 참조할 수 있다. 링크 변경은 지식 전체 구성의 직접 저장·이력을 따르며 계약 자체는 도구 소유 직접 저장을 따른다. 그룹 권한만 있고 지식 연결이 없는 도구, 비활성·미검증·권한 밖 도구는 후보에 포함하지 않는다. 실행에서 선택한 자산들의 기술적 참조 버전이 충돌하면 임의 선택하지 않는다. 지식 저장에서 외부 리비전 상승만으로 거부하지 않는다. API·커스텀 도구의 용도·사용 조건은 매핑별로 작성하며 지식 본문에 특정 도구 호출 안내를 중복하지 않는다. 설명이 없는 매핑은 활성 반영하지 않고 설명 변경도 지식 직접 저장·이력을 따른다. 후보에서 제외한 매핑의 설명은 주입하지 않으며 같은 도구의 여러 설명은 출처를 유지한다. 결과 처리에도 tool_usage_mapping의 원천 가이드·업무별 후속 설명·출처를 제공하고 result_guidance.verification의 충돌·범위·버전 기준을 만족한다."
    roadmap: "RM-P1"
    summary: "지식은 일반 업무 설명·절차와 예제·카탈로그·업무 API·커스텀 도구의 독립 참조 및 매핑별 사용 설명를 갖는다. 인증 예제의 카탈로그는 SQL에서 추출하며 지식의 SQL 작성 범위는 직접·간접 참조의 합집합으로 구한다. API 공통 입력 규칙·가이드는 연결 API를 참조한다"
    intent:
      problem: "지식 본문에 SQL·물리명을 복제하면 권한 통제와 변경 영향 검수 밖의 스키마 사본이 생긴다"
      goal: "자산별 정본을 분리하고 정형 참조로 접근 통제와 영향 검수를 연결한다"
      not:
        - "지식 본문을 SQL 저장소로 쓰지 않는다"
        - "접근 그룹을 매핑하지 않은 지식을 전체 공개로 해석하지 않는다"
    goal_trace:
      - "GOAL-1"
      - "INV-01"
    decider: "제품 오너(사용자)"
    preconditions:
      - "참조할 공개 인터페이스와 업무 의미가 카탈로그에 있다(REQ-301)"
      - "지식 접근 그룹과 현재 사용자 그룹을 판정할 수 있다(REQ-103)"
    data:
      - item: "지식 본문·업무 절차·접근 그룹·태그 ID·0개 이상 예제 링크와 직접 카탈로그 링크·업무 API 링크·커스텀 도구 링크·매핑별 사용 설명(용도·사용 조건·입력 확보·결과 안내·질문/선택별 후속 절차)·연결 식별자와 요청 당시 표시 근거"
        origin: "업무 자산 관리자"
        sensitivity: "그룹 제한 업무 지식"
        retention: "REQ-305의 불변 리비전 전체 스냅샷. API 계약 내용 버전·실행 근거는 REQ-608·REQ-108을 따른다"
    business_rules:
      - "본문 금지 내용과 참조 링크의 용도는 본문의 detail·link_uses를 따른다"
      - "특정 데이터 객체를 참조하지 않는 일반 업무 지식도 허용하지만 접근 그룹 매핑은 필요하다"
      - "reference_mapping에 따라 실행에서 지식·예제·카탈로그의 개별 권한과 사용 가능한 내용 버전을 확인하고 example_catalog_mapping의 직접·간접 합산 규칙으로 카탈로그 후보 범위를 구성한다"
      - "지식은 여러 데이터소스·DB 스키마의 공개 카탈로그 항목과 인증 예제를 참조할 수 있다. 소속 데이터소스와 DB 스키마는 REQ-301·REQ-302의 카탈로그/예제 참조에서 얻으며 지식에 별도 소속 목록·스키마 권한 매핑을 중복 저장하지 않는다. 참조 합산을 데이터소스 간 SQL 조인 허용이나 접근 권한 부여로 해석하지 않으며 데이터소스 경계는 REQ-603을 따른다"
      - "본문 검수에서 물리명·SQL을 발견하면 카탈로그 링크·인증 예제 등록으로 유도한다(FEAT-014)"
      - "접근 그룹·태그 ID 매핑·참조 링크를 고치는 경우도 REQ-305의 지식 전체 구성 직접 저장·이력를 따른다. 공통 태그 텍스트·동의어의 자체 변경과 당시 표현 재현은 REQ-607을 따르며 지식 매핑·리비전을 바꾸지 않는다"
      - "업무 API 매핑의 개수·소유·권한·공통 입력 가이드와 업무 절차의 구분은 REQ-608을 따른다. API 링크와 매핑별 사용 설명 변경도 지식 후보의 전체 스냅샷과 현재 권한의 직접 저장에 포함한다. API 계약 자체는 지식 반영 세트의 변경 대상으로 옮기지 않는다"
    tool_usage_mapping:
      description: "업무 API·커스텀 도구의 각 매핑 건에 그 지식에서의 용도와 어느 경우에 사용하는지를 설명한다. 필요한 업무별 입력 확보·조회·선택·호출 순서와 결과별 안내·추가 질문·사용자 선택에 따른 후속 작업/종료 순서도 해당 매핑 설명에 둔다. 같은 도구를 여러 지식에 연결할 때 설명은 매핑별로 독립 작성한다"
      ownership: "일반 업무 설명·절차는 지식 본문, 특정 API·커스텀 도구의 이름·식별자·용도·사용 조건·호출 안내는 정형 매핑과 그 설명이 정본이다. 지식 본문에 특정 도구를 지칭하는 호출 안내를 중복 작성하지 않고 매핑 편집으로 유도한다. 공통 계약·파라미터 명세·결과 의미·공통 결과 안내 가이드는 REQ-608·612의 도구/API 원천을 참조하고 복제하지 않는다"
      validation: "사용 설명이 없거나 용도·사용 조건을 판단할 수 없는 매핑은 초안으로 보존할 수 있으나 활성 반영하지 않는다. 지식 본문과 매핑 설명의 역할·일치 여부를 검수하며 탐지·입력 방식은 P3에서 정한다. 설명은 권한·실행 승인·계약 검증·필수 결과 확인·재전송/자동 폴링 금지를 우회하는 지시로 사용할 수 없다. 원천 결과 계약과 충돌하는 설명은 유효 반영하지 않는다"
      lifecycle: "사용 설명만 바꿔도 지식 전체 구성의 현재 권한·기대 버전·참조 검증과 직접 저장/불변 이력에 포함한다. 연결을 제거하면 현재 설명도 제외하고 과거 HIST는 유지한다."
      delivery: "모델에는 도구 선택·입력 확보뿐 아니라 결과 처리·후속 질문/사용자 응답 해석에도 필요한 유효 매핑의 대상 식별자·원천 계약/공통 결과 안내 가이드와 해당 매핑의 사용 설명을 함께 전달한다. 당시 지식 리비전·매핑·계약/가이드 버전을 원 호출 및 결과와 연결한다. 제외된 매핑의 설명만 별도로 주입하지 않는다. 여러 검색 지식이 같은 도구를 참조하면 도구 정의는 중복 제거하되 각 설명의 지식·리비전·매핑 출처를 보존한다. 사용 조건이 충돌하거나 모호하면 임의 합성하지 않고 REQ-025에 따라 확인하거나 처리 불가로 안내한다"
    result_guidance:
      runtime: "후속 API·도구 참조는 현재 허용된 지식 연결 후보에서만 해석한다. 공통 가이드와 업무별 매핑 설명은 REQ-009.result_dialogue의 입력이며 등록된 작업·현재 권한·승인을 대신하지 않는다"
      verification:
        - "같은 도구를 여러 지식에 연결해 업무별 질문·후속 순서를 다르게 관리하되 공통 상태 의미·가이드 사본 없이 각 지식/매핑 출처를 유지한다"
        - "검색 지식 간 후속 설명이 충돌하면 임의 합성하지 않고 REQ-025에 따라 확인하거나 처리 불가로 안내한다. 제외·미승인 매핑의 가이드로 후속 호출하지 않는다"
        - "매핑 결과 안내 변경도 지식 전체 직접 저장/불변 이력에 포함하고 과거 실행은 당시 설명·원천 버전으로 재현한다."
    custom_tool_mapping:
      ownership: "지식에 등록 커스텀 도구의 안정 식별자를 0..N개 직접 매핑한다. 같은 도구를 여러 지식에서 참조할 수 있고 도구가 없는 지식도 허용한다. 업무 API는 REQ-608의 기존 API 링크를 사용하며 같은 API를 커스텀 도구 링크로 중복 관리하지 않는다"
      contract: "업무별 사용·입력 확보·결과 안내·질문/선택별 후속 순서는 해당 지식-도구 매핑의 설명에 두고 도구의 입출력·데이터 범위·마스킹·재시도·오류 계약은 REQ-612·REQ-114의 원천을 참조한다. 도구 코드·계약·자격증명을 지식 본문에 복사하지 않는다"
      validation: "지식 반영 전에 연결 도구의 존재·현재 연결 가능 상태·권한과 매핑 설명을 확인한다. 도구의 등록·계약 검증은 도구 자체의 승인 책임이며 지식 승인에서 도구 상세를 다시 심사하거나 리비전 상승만으로 반려하지 않는다. 미충족 초안은 보존할 수 있으나 유효 매핑으로 반영하지 않는다. 도구 변경만으로 지식 링크·본문·리비전을 자동 수정하지 않는다."
      candidates: "검색된 사용 가능 지식에 직접 연결된 커스텀 도구의 안정 식별자로 현재 사용 가능한 적용본을 찾고 사용자 권한·활성·노출·검증 조건을 만족한 도구만 선택 후보로 제공한다. 같은 도구는 안정 식별자로 중복 제거하고 실제 사용 버전은 reference_mapping.runtime을 따른다. 연결은 호출 권한이나 REQ-114의 사용자 승인을 대신하지 않는다."
      snapshot: "지식 전체 이력은 연결 안정 ID·사용 설명·당시 표시 근거만 보존한다. 외부 도구 상세/고정 계약 리비전을 지식 소유로 복사하지 않고 실제 실행 당시 정확 리비전은 실행 근거로 남긴다."
      direct_save: "도구 링크와 매핑별 설명은 지식 전체 직접 저장/이력에 포함한다. 도구 정의/계약은 도구 소유가 현재 권한·기대 버전·기술검증으로 직접 저장한다. 실제 함께 변경한 대상만 같은 원자 세트에 포함한다."
    example_catalog_mapping:
      ownership: "인증 예제→카탈로그는 REQ-302의 SQL 추출 결과를 예제 후보에 자동 매핑하고, 지식→예제와 지식→카탈로그 직접 매핑은 관리자가 독립적으로 선택한다. 두 종류의 지식 연결은 각각 0..N개이며 예제가 지식에 필요한 카탈로그 전체를 포괄할 필요가 없다. 예제 참조를 지식 직접 매핑에 복사하지 않는다"
      union: "지식의 SQL 작성용 카탈로그 후보는 직접 카탈로그 식별자와 연결된 사용 가능 인증 예제를 그 실행에서 해석해 얻은 카탈로그의 합집합이다. 데이터소스·스키마를 포함한 카탈로그 안정 식별자로 중복 제거하고 직접·예제 경유·양쪽 경로를 표시한다. 합산은 조회 결과이며 예제의 카탈로그 매핑을 지식에 저장하지 않는다. 실제 선택한 예제·카탈로그 리비전과 기술적 참조 정합성을 REQ-108·302에 따라 검사·기록한다. 이후 현재 권한 안의 질의 관련성·컬럼/필수 관계 선별과 입력 예산은 REQ-021·003을 따르며 데이터소스 간 SQL 조인이나 권한 확대를 허용하지 않는다."
      snapshot: "지식 요청·검토·승인 스냅샷은 당시 직접 카탈로그와 예제의 연결 식별자·표시 근거를 보존한다. 그 예제의 상세 SQL·카탈로그 매핑·내용 리비전은 지식 소유 스냅샷에 복사하지 않는다. 과거 실행의 직접/간접 합산 목록은 실제 선택한 예제·카탈로그 리비전과 출처 기록으로 재현하고 현재 운영본으로 과거 실행을 다시 계산하지 않는다."
      missing: "미등록 객체는 카탈로그 자체를 자동 신규 등록하지 않고 누락과 등록·검수 필요를 안내한다. 해결 전 초안은 보존하되 반영하지 않는다. 데이터소스·스키마까지 구분하고 추출 불확실성은 기술 검토에서 해소한다"
      remove: "지식에서 예제 연결을 해제하면 승인·반영된 버전부터 그 예제만을 통해 포함됐던 항목이 합산 목록에서 제외된다. 지식 직접 매핑이나 다른 연결 예제를 통해 필요한 항목은 유지하며 카탈로그 자산 자체는 삭제하지 않는다. 예제 SQL 변경으로 참조가 줄면 해당 예제 후보 매핑의 차이를 검토·승인하고 같은 합산 원칙을 적용한다"
      security: "참조 합산은 접근 허용 그룹을 확대하지 않는다. 지식과 그 직접 참조는 기존 현재 권한 판정을 통과해야 하며 예제도 자체 접근 권한과 모든 필수 참조의 사용 가능 판정을 통과해야 한다. 권한 밖 필수 참조가 있는 예제는 일부 참조만 제거해 제공하지 않고 예제 전체를 주입·직접 실행 대상에서 제외한다. 그 예제로만 포함되는 카탈로그는 제외하되 별도의 허용된 직접·다른 예제 경로는 유지한다. 운영 권한·마스킹 통제는 그대로 적용한다"
      direct_save: "지식의 예제/직접 카탈로그 안정 ID 링크는 지식 소유, 예제의 정확 SQL/카탈로그 참조는 예제 소유의 직접 저장/이력으로 관리한다. 외부 리비전 상승만으로 지식 매핑을 바꾸거나 자동 거부하지 않는다. 사용처 조회·기술 참조 무결성은 유지하고 업무 의미 영향 판정 작업은 없다."
    exceptions:
      - "그룹 매핑이 없거나 직접 참조 접근 판정에 실패하면 지식 주입에서 제외한다. 연결 예제의 접근·필수 참조 판정 실패는 example_catalog_mapping.security를 따른다"
      - "물리명·SQL 감지 방법과 검수 절차의 상세는 P3에서 설계하며 자동 탐지의 완전성을 가정하지 않는다"
    lifecycle: "지식 전체 직접 저장/활성 상태는 REQ-305·306, 원천 구조 관측은 REQ-304를 따른다. 업무 의미 영향 검토 작업/상태는 제품에 두지 않는다."
    permissions:
      - "본문·그룹·링크 관리: 유효 메뉴 권한의 ACT-003"
      - "검색·주입: 현재 허용 그룹과 참조 인터페이스 판정 통과 사용자"
    audit: "본문·접근 그룹·참조 링크의 변경은 REQ-305의 동일 리비전 근거로 남긴다"
    volume: "지식당 예제와 직접 카탈로그는 각각 0..N개이며 합산 후보 범위와 실제 주입 총량은 구분한다. 검색·주입 총량 통제는 기존 컨텍스트 계약을 따른다 커스텀 도구 링크의 개수와 후보 구성은 custom_tool_mapping을 따른다."
    config: "접근 그룹·태그 ID 매핑·직접 카탈로그 링크·인증 예제 링크·업무 API 링크·커스텀 도구 링크와 업무 절차는 지식 리비전의 관리 값이다. API 공통 입력 명세·값 채우기 가이드는 REQ-608의 API 관리 원천을 참조한다. 공통 태그 텍스트·동의어의 소유·버전·단독 변경은 REQ-607을 따른다. SQL 추출 카탈로그 매핑은 인증 예제 리비전이 소유한다"
    risk: "참조 링크 누락은 변경 영향 검수 누락으로 이어지므로 등록 때 업무 관계를 함께 검수한다"
    relations:
      depends_on:
        - "REQ-301"
        - "REQ-302"
        - "REQ-603"
        - "REQ-601"
      constrains:
