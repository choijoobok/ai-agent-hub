        case: "두 대상 중 하나의 기준본 또는 이력 저장이 실패하면 둘 다 현재값을 유지한다."
      - kind: "정상"
        case: "API 리비전만 상승했지만 안정 ID를 매핑한 지식 내용/설명이 그대로면 자동 지식 수정 없이 현재 영향 확인 근거만 남긴다."
    volatility:
      level: "medium"
      what: "원자적 반영 원칙은 고정하고 동시성 제어·실패 복구 방식은 설계에서 구체화한다"
