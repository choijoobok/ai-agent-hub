    realization:
      features: [FEAT-003, FEAT-011, FEAT-032, FEAT-034, FEAT-202, FEAT-204, FEAT-221]
      screens: [SCR-003, SCR-039, SCR-026, SCR-025]
    examples:
      - kind: "정상"
        case: "공개 출고 뷰 한 개를 등록하고 컬럼 타입은 수집하되 출고일·확정 수량의 업무 의미는 관리자가 검수한다"
      - kind: "정상"
        case: "DS-1의 sales.orders와 archive.orders는 서로 다른 카탈로그 항목이다. DS-2의 sales.orders도 DS-1의 객체와 구분한다"
      - kind: "예외"
        case: "DS-1의 sales.orders를 다른 그룹용이라는 이유로 다시 등록하면 중복으로 거부한다. dbo.orders의 스키마를 생략한 SQL은 기본 스키마를 추정해 실행하지 않고 명시적 참조 보완을 요구한다"
      - kind: "예외"
        case: "같은 DB에 급여 테이블이 있어도 공개 대상으로 등록하지 않았다면 수집·대사하지 않는다"
      - kind: "예외"
        case: "출고 뷰에 새 컬럼을 수집했어도 업무 설명이 미검수이면 초안에는 남지만 AI가 조건·출력 컬럼으로 사용하지 않는다"
      - kind: "정상"
        case: "지식·인증 예제·카탈로그·프롬프트 규칙이 함께 영향을 준 오답을 품질 신고로 접수하면 담당자가 근거를 확인하여 조사·개선한다"
      - kind: "예외"
        case: "카탈로그 설명 오탈자 수정에 평가셋이 없다는 이유만으로 요청을 차단하지 않는다. 별도의 기술 검토·최종 승인과 필요한 시험 근거는 유지한다"
    verification:
      - case: "문자열 주문일과 숫자형 주문 식별자"
        expected: "물리 자료형과 검수된 의미/형식을 각각 확인한다. 날짜 형식이 미확인이면 임의 파싱해 사용하지 않고 식별자를 합산 가능한 수량으로 추정하지 않는다"
      - case: "서로 다른 데이터소스·DB/카탈로그·DB 스키마의 동명 코드 테이블과 주문상태 그룹"
        expected: "대상 시스템 매핑 없이 선택 카탈로그 DS의 범용 가이드와 현재 허용 등록 객체/컬럼의 실제 읽기 조회로 코드/참조값을 확인한다. 실패·빈·모호함/권한 부족은 질문/보류하고 다른 DS·Hub 공통코드·생성 값으로 대체하지 않는다"
      - case: "FK 없는 주문·상세의 복합 키 1:N 관계"
        expected: "검수된 전체 조인 컬럼 쌍과 방향·1측 유일성 근거를 사용한다. 키 일부 누락과 관계 변경을 검수하고 상세 행 수만큼 주문 합계가 부풀어도 정상 집계로 확정하지 않는다"
      - case: "개인정보 미확인 컬럼·권한 밖 관계 대상·자동 구조 수집"
        expected: "REQ-111에 따라 미확인 컬럼 사용을 제외하고 관계로 접근 권한을 확대하지 않는다. 수집 결과는 기존 의미·코드·개인정보 정책을 덮지 않는다"
    volatility:
      level: "high"
      what: "공개 범위·업무 의미·값 도메인과 조인 관계는 고객사마다 다르다"
    open: ["@defer P3 column_metadata·value_domain·relationship_metadata의 속성명·코드값·참조키·저장 구조·조회/검증 계약·편집 화면을 설계한다. 관리할 정보의 종류와 미확인 사용 제한은 요구사항으로 유지한다", "@defer P3 2026-10-13 사용자 요청으로 REQ-011.export_policy가 요구한 카탈로그 반출 허용 속성의 관리 단위·기본값·변경 권한/이력·직접 정책/승인 경계·파생 결과 추적을 REQ-103·601과 연결한다. 코드명 조회는 기존 값 도메인·검수된 관계를 사용한다", "@defer P3 — DBMS별 식별자 대소문자·인용 부호·동일성 판정과 DB 스키마 개념이 없는 경우의 표현을 설계한다. 기본 스키마 추정 없이 물리 참조·카탈로그 식별이 일치하는지 확인하는 파서 시험을 구체화한다"]
    maturity:
      level: "confirmed"
      at: "2026-10-23"
      by: "AI — 사용자 명시 요청으로 전체 보완본 재확정"
      confirmed_by: "2026-10-23 사용자 명시 확정 — 보완으로 확정에서 재검토로 변경된 요구사항의 재확정 요청에 따라 당시 필수 조회 제약(query_constraints)과 검증 기준 14건을 포함한 REQ-301 전체 보완본을 재확정했다. 2026-10-29 사용자 결정으로 조회 제약은 REQ-611로 이관하고 관계 화면 분리 및 원천 조회권 없는 수동 등록을 보완했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다"
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
  - id: REQ-302
    authoring_relations: "2026-10-29 사용자 결정: 인증 예제 작성/수정에서 선택하거나 SQL로 추출한 카탈로그의 정확한 ID·리비전 집합으로 REQ-301.relationship_metadata.consumption_scope와 50-api FEAT-011.relation_read_contract를 사용한다. 양쪽이 그 집합 안이고 현재 권한·검수·전체 컬럼쌍 검증을 통과한 관계만 방향·역할·대응 수·근거와 함께 참고한다. SQL/실행 데이터소스/참조 판 변경 시 다시 조회하며 조회 실패·미검수·범위 밖 관계를 없는 관계나 추정 관계로 대체하지 않는다. 같은 세트 후보의 작성 참고와 운영 사용 가능성을 구분하고 관계 열람이 SQL 인증·실행 권한·참조 최신성 검사를 대신하지 않는다"
    type: "functional"
