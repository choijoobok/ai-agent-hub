    examples:
      - kind: "정상"
        case: "출고 집계 기준 지식은 공개 출고 뷰를 링크하고, 사용법 지식은 링크 없이 허용 그룹만 지정한다"
      - kind: "예외"
        case: "지식 접근 그룹에는 속해도 연결된 직접 참조한 출고 뷰 접근 권한이 없으면 그 지식을 주입하지 않는다"
      - kind: "정상"
        case: "지식 직접 매핑이 주문·반품이고 예제 A가 주문·주문상세, 예제 B가 거래처·주문을 참조하면 합산 후보는 주문·반품·주문상세·거래처다. 지식 직접 매핑은 주문·반품 그대로다"
      - kind: "예외"
        case: "예제 A 연결을 해제하면 주문상세만 합산 후보에서 빠지고 직접 연결된 주문·반품과 예제 B의 거래처는 남는다. 카탈로그 자산은 삭제하지 않는다"
      - kind: "정상"
        case: "예제가 없는 지식은 직접 연결한 카탈로그만 사용하며 특정 데이터를 참조하지 않는 사용법 지식은 두 종류 연결 모두 0개여도 허용 그룹 판정 후 사용할 수 있다"
      - kind: "정상"
        case: "지식에 DS-1/sales.orders와 DS-2/public.stock의 카탈로그를 연결하면 각 소속은 카탈로그에서 얻는다. 지식에는 별도 데이터소스·DB 스키마 목록을 저장하지 않고 실행은 데이터소스별 SQL로 나눈다"
      - kind: "예외"
        case: "예제 필수 참조인 거래처의 접근 권한이 없으면 거래처만 숨긴 채 예제를 제공하지 않는다. 예제 전체와 그 예제만의 간접 카탈로그를 제외하고 허용된 직접·다른 예제 경로만 유지한다"
      - kind: "예외"
        case: "과거 요청이 예제 A v1의 주문·주문상세를 참조했다면 현재 v2에서 거래처가 추가돼도 과거 합산 목록에는 거래처를 끼워 넣지 않는다"
      - kind: "예외"
        case: "사용자가 정산 도구의 허용 그룹에 속해도 검색된 지식에 정산 도구가 연결되지 않았다면 모델 후보에 제공하지 않는다"
      - kind: "정상"
        case: "지식 K가 API A 식별자를 연결해 승인 대기인 동안 A 리비전 3을 4로 별도 승인·반영한다. K의 매핑·리비전을 동기화하지 않고 K 요청도 버전 차이만으로 반려하지 않는다. 새 실행은 사용 가능한 A를 선택하고 실제 리비전을 기록한다."
    volatility:
      level: "high"
      what: "업무 지식·허용 그룹·참조 관계는 고객사마다 다르다"
    open:
      - "@defer P3 — 본문 물리명·SQL 감지와 사람 검수의 상세 흐름을 설계한다"
      - "@defer P3 매핑별 결과 안내·질문/선택별 후속 절차의 편집·원천 가이드 참조·충돌 검토와 전달 계약을 화면 요건서·목업 및 시험에 연결한다"
    maturity:
      level: "confirmed"
      at: "2026-10-30"
      by: "AI — 사용자 명시 확정 반영"
      confirmed_by: "사용자 — 안정 ID 매핑·독립 변경·자산 승인 시 연결 지식 영향 검토 방향으로 요구사항 수정·보완 요청. 단계 게이트·소스 구현 승인은 별도다."
    reference_mapping:
      decision: "2026-10-31 사용자 결정: 안정 ID 매핑·독립 변경·정확 실행 리비전은 유지하되 관리자 승인과 지식 영향 검토 절차를 철회한다."
      scope: "지식에서 태그·직접 카탈로그·인증 예제·업무 API·커스텀 도구로 연결하는 매핑에 적용한다. 인증 예제 SQL의 카탈로그 참조, 코드 조회 바인딩과 API/도구 자체의 구현·계약 참조는 각 소유 요구사항의 기술 검증을 유지한다."
      identity: "지식 소유 매핑은 대상 종류+변경되지 않는 자산 식별자로 연결하며 특정 내용 리비전을 운영 사용 버전으로 고정하지 않는다. 연결 추가·제거·교체와 매핑별 사용 설명은 지식의 관리 값이다. 참조 자산의 리비전이 올라가도 지식 매핑·본문·리비전을 자동 동기화하거나 연결 지식의 재승인을 강제하지 않는다."
      ownership: "지식의 현재 전체 구성/HIST는 본문·그룹·소유 매핑/설명과 당시 표시 근거만 포함한다. 외부 상세/하위 테이블을 지식 소유로 복사하지 않는다."
      independent_changes: "지식과 참조 자산은 현재 권한으로 독립 직접 저장한다. 참조만 하는 자산을 변경 대상으로 선점하거나 외부 리비전 상승·사용처 변화만으로 자동 반려/동기화하지 않는다."
      validation: "실제로 수정하는 지식 자신의 기대 버전·현재 변경 권한과 매핑 대상의 존재/연결 가능 상태·열람 권한·사용 설명 필수값을 직접 저장 시 검증한다. 외부 리비전 번호 차이만으로 실패시키지 않는다."
      runtime: "새 실행에서 지식의 연결 식별자로 당시 사용 가능한 적용본을 해석하고 REQ-108에 따라 처음 실제 필요해진 자산별 내용 리비전을 선택·기록해 해당 실행 중 유지한다. 카탈로그 합산도 같은 실행에서 선택한 예제/카탈로그와 기술적 참조 정합성을 사용하며 이미 선택한 버전을 조용히 교체하지 않는다. 매 접근 시 현재 권한·효력·SQL/API 계약 검증은 유지한다."
      history: "과거 지식 이력은 당시 소유 매핑/표시 근거를 재현한다. 실제 사용 외부 상세는 실행 당시 정확 리비전/HIST로 재현하며 현재값으로 치환하지 않는다. 업무 의미 영향 판단 원장은 만들지 않는다."
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
  - id: REQ-304
    manual_use_boundary: "REQ-601.asset_availability와 REQ-301/303.manual_use_contract에 따라 관측 차이·연결 장애는 수동 사용 여부를 덮어쓰지 않는다. 자동 사용 가능 진단과 수동 설정을 분리하고 복구만으로 관리자 OFF를 ON으로 바꾸지 않는다. 기술적으로 무효/미확인인 실제 사용은 차단하되 업무 의미 영향 검토·자동 지식 수정/폐기 작업은 만들지 않는다."
    batch_structure_comparison:
      view_scope: "등록된 TABLE/VIEW 모두 비교한다. 뷰 출력 컬럼의 이름·DBMS 원천 자료형·길이/정밀도는 원천이 제공하는 범위에서 비교한다. NULL은 YES/NO/UNKNOWN이며 원본 테이블 NOT NULL이나 표본 값으로 뷰의 NOT NULL을 확정하지 않는다. 원본 PK를 뷰 PK로 자동 승계하지 않고 일반 뷰에 물리 PK 비교가 적용되지 않으면 NOT_APPLICABLE, 조회/추론 불가는 UNKNOWN으로 구분한다. 별도 검수한 업무 논리키는 물리 제약과 구분한다. 인덱싱/물리화 뷰 등은 DBMS별 객체/속성 지원 행렬에서 실제 정의를 비교한다. 미지원·미관측을 없음이나 일치로 처리하지 않는다. 뷰 컬럼 구조 일치는 내부 조인/필터/업무 의미의 동일성 증명이 아니다"
      entry: "2026-10-29 사용자 결정: SCR-002 데이터소스 관리의 원천 구조 비교 버튼으로 선택 데이터소스에 등록된 카탈로그 객체를 일괄 비교한다. 카탈로그의 원천 구조/샘플 조회 탭은 제거한다. DB 전체 객체 탐색·자동 등록/수정·값 샘플 조회는 수행하지 않는다"
      baseline: "실행 시작 시 대상 데이터소스/설정 버전·실행 번호·주체/시각과 등록 객체별 catalogId/현재 유효 revisionId·정확 객체 식별을 고정한다. 운영본 없는 미반영 초안은 건너뜀으로 표시한다. 각 객체의 비교 가능한 구조 속성/전체성·관측 연결 근거를 남긴다"
      difference: "SQL 작성에 영향을 주는 등록 객체 종류/존재, 컬럼명·원천 자료형과 DBMS 의미·문자/바이트 길이와 단위·숫자 정밀도/소수자리·시간 정밀도/시간대 의미·NULL 허용·PK 여부/전체 구성 순서, 검수된 유일키, 인덱스의 종류/유일성/구성/정렬·포함 컬럼·필터/함수식과 그 밖의 관리 대상 구조 속성을 비교한다. 데이터값 샘플링은 하지 않는다. DBMS별 지원·관측 권한·범위/완전성을 속성 단위로 명시한다. 지원 불가·미관리·미확인을 일치로 통과하지 않는다"
      reconcile: "현재 미해결 불일치 정본은 ENT-040이다. 데이터소스/카탈로그/정확 비교 대상/속성/차이 종류로 중복 없이 저장하고 같은 차이는 최근 관측 값·시각/실행 근거를 갱신한다. 신규 차이는 추가한다. 기존 차이의 해당 대상/속성을 성공적으로 다시 비교해 일치를 확인했을 때만 현재 목록에서 제거한다. 다른 객체의 성공이나 전체 빈 결과로 미확인 범위를 일괄 삭제하지 않는다"
      failures: "NOT_REQUESTED/ACCESS_DENIED/UNAVAILABLE/PARTIAL/UNSUPPORTED는 확인 불가 또는 건너뜀이다. 기존 차이는 마지막 성공 근거와 함께 유지한다. 권한 있는 완전한 관측으로 실제 부재를 확인했을 때만 객체 없음 차이를 기록한다. 미해결 0건과 전체 일치 확인을 구분한다"
      concurrency: "동일 데이터소스의 실행 중 재요청은 기존 실행을 안내한다. 결과 반영 시 실행 세대·데이터소스 설정/연결·카탈로그 기준 버전을 재검사하고 오래된 결과는 목록을 갱신/삭제하지 않는다. 대상별 결과와 차이 갱신은 같은 트랜잭션으로 처리하며 중단/재시도·결과 불명은 실행 키로 확인한다. 구체 잠금/재시작 계약은 FEAT-003.batch_comparison_contract 후속이다"
      history: "목록에서 해소된 차이를 제거해도 ENT-039의 비교 실행·대상별 성공/실패/해소 기록과 ENT-010 변경 근거는 보존한다. 구조 일치 회복이 이미 생성된 지식 영향 검토 작업을 자동 종결하지 않는다. 데이터소스 설정 변경 이력과 비교 실행 이력은 구분한다"
      display: "SCR-002의 컬럼 불일치 탭은 테이블/업무명·컬럼별 한 행으로 이름·자료형·길이/정밀도·NULL 허용·PK 여부/순서의 카탈로그 값 → 원천 값을 같은 행에 표시한다. 인덱스 불일치 탭은 유일키/인덱스 정의별 한 행으로 종류·유일성·순서 있는 전체 구성·포함 컬럼·필터/표현식을 비교한다. 색상 없이도 변경 항목/상태를 식별하고 긴 전체 구성은 셀 상세로 열람한다. 조회 버튼은 저장 목록만 읽으며 원천 구조 비교 명령은 별도다"
      presence: "컬럼/인덱스 정의의 존재 상태는 카탈로그와 원천 각각 PRESENT/ABSENT/UNKNOWN으로 비교한다. 같은 전체 비교 범위에서 한쪽 ABSENT를 확인했을 때만 원천에만 있음 또는 카탈로그에만 있음으로 표시한다. 해당 항목이 없는 쪽의 모든 비교 값은 항목 없음으로 표현하고 실제 존재하는 정의의 빈 포함 컬럼/조건(없음), 자료형의 해당 없음, 관측 실패(확인 불가)와 구분한다. 카탈로그가 관리하지 않는 속성/아직 없는 저장 모델은 기준 미정의이지 항목 부재가 아니다. 권한 부족/부분 수집은 삭제나 원천 부재로 판정하지 않는다. 원천에만 있는 컬럼은 의도적 미등록일 수도 있으므로 자동 등록/공개하거나 반드시 등록할 오류로 확정하지 않는다. 이름이 유사한 누락/추가를 자동 rename으로 합치지 않는다. 새 기준의 완전 비교에서 양쪽 존재와 전체 일치가 확인되면 기존 단독 존재 차이를 해소한다"
      column_semantics: "NULL 허용 YES/NO/UNKNOWN은 별도 값이며 JOIN/IN/NOT IN 계획의 근거다. NO를 PK 표시만으로 추정하지 않는다. 이름 비교는 DBMS 식별 규칙을 따르고 동명 다른 객체/이름 유사도만으로 rename을 확정하지 않는다. 삭제/추가 후보를 구분하며 동일 객체 확인은 기존 identity_change를 따른다. 타입 별칭·길이 단위·정밀도는 DBMS 계약으로 의미를 비교하고 원문도 보존한다"
      key_index_semantics: "PK는 컬럼 참여/순서와 테이블 전체 정의를 함께 대조한다. 유일키와 유일 인덱스를 혼동하지 않으며 이름이 같아도 정의 종류를 구분한다. 인덱스 키는 순서·정렬 방향·NULL 정렬/정렬규칙(해당 DBMS)·표현식별로 대조하고 포함 컬럼은 키 구성과 분리한다. 필터/함수식·인덱스 방식·NULL 유일성 의미·유효/비활성 상태 등 지원 속성도 보존한다. 지원 밖 복합 정의를 단순 컬럼 인덱스로 축약하지 않는다. 읽은 표현식은 메타데이터이며 실행하지 않는다"
      completeness: "양쪽 정의의 지원 속성 전체를 같은 기준 버전/관측에서 확보해야 전체 일치다. 카탈로그에 해당 속성 모델이 아직 없으면 기준 미정의, 원천 드라이버/권한으로 읽지 못하면 확인 불가로 남긴다. 예전 차이 중 성공 재비교한 속성만 해소하고 실패 속성은 유지한다. 칼럼/인덱스 행 집계에서도 확인 불가가 남으면 전체 정상으로 표시하지 않는다"
      additional_scope: "문자열 정렬규칙·생성/계산 컬럼 정의 등 SQL 의미에 영향을 주는 관리 속성의 지원표를 integration과 확정한다. 원천 DEFAULT/DDL 관리 제외는 유지하며 뷰 내부 조인·행 필터와 업무 의미를 구조 비교만으로 검증했다고 하지 않는다. 물리 FK 관측이 등록된 논리 관계의 업무 검수를 대신하지 않는다"
    type: "functional"
    priority: "must"
    actors:
      - "ACT-003"
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(잠재적 오류 예방을 위한 고객사 변경 통지의 영향 검토와 변경 요청 근거 연결) · 2026-09-30 사용자 결정(고객사 DB와 Hub 반영 시점의 완전 동기화 비보장, 비중대한 변경의 일시적 시차 수용과 영향 검토 유지) · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023)"
    process_step: "PRC-09-04"
    title: "공개 데이터 인터페이스 구조 변화의 보조 감지"
    detail: "이미 등록한 공개 테이블/뷰에 대해 SCR-002의 수동 구조 일괄 비교와 권한 있는 결과 메타데이터 관측으로 카탈로그 정의/원천 구조의 차이·확인 불가를 보여준다. 고객사 업무 의미 변화의 적합성·연결 지식 보완 여부는 운영/유지보수 조직이 자체 프로세스로 관리한다. 제품은 지식 영향 검토 상태·작업 배정/종결·자동 본문 수집/판단을 제공하지 않는다."
    timing_policy: "고객사 DB 변경 시점과 Hub의 지식·예제·카탈로그 반영 시점을 완전히 일치시키는 것은 보장하지 않는다. 비중대한 변경의 일시적 불일치는 운영상 감수하되 변경 통지·영향 판정·고객사 적용 시점·Hub 실제 반영 시점과 미해결 검토 작업을 추적한다. 중대한 영향에는 이 허용을 일괄 적용하지 않으며 담당자의 별도 대응 판단이 필요하다. 시차 허용은 권한·마스킹 등 실행 통제의 유예가 아니다"
    limits: "구조 비교는 batch_structure_comparison의 컬럼·키·인덱스 지원 범위에서 변화 후보를 알릴 수 있다. 컬럼의 **의미 변경**, 뷰의 행 필터·원본 조인 변경, 보안상 등록하지 않은 객체의 변경은 자동 감지할 수 없다. 업무 자산 관리자가 카탈로그의 업무 의미·값 도메인을 고치면 같은 검토 필요 상태를 직접 남긴다. 따라서 구조 비교가 없거나 이상이 없더라도 영향 없음의 자동 판정 근거가 되지 않는다"
    hard_rule: "업무 DB 전체 대사/다운로드나 카탈로그/지식 자동 갱신·활성/비활성화를 하지 않는다. 관측 차이는 구조적 확인 사실이며 업무 의미 변경·지식 보완 필요를 자동 확정하지 않는다. 관리 변경은 현재 권한자의 직접 저장·참조/SQL/API 기술 검증과 변경 이력으로 처리한다."
    acceptance: "등록 공개 범위의 구조 비교는 차이·부재·미지원·조회 실패를 구분하고 기준/관측 시각을 재현한다. 자동 지식 검토 큐/배정/완료나 관련 지식 본문 수집/영향 판단을 만들지 않는다. 필요한 관리는 안정 ID 사용처 조회와 직접 저장·기술 참조 검증을 사용한다."
    note: "2026-10-29 사용자 요청으로 카탈로그 샘플 조회는 현재 화면/구현 범위에서 제외한다. @defer 사용자 재요청 시 — 다음은 재검토 시 유지할 통제다. **인라인 값 후보 샘플링은 다른 동작이다** — 실제 데이터를 읽으므로 ① 관리자가 대상 컬럼을 지정해 수동 실행 ② distinct 값 수 상한과 조회 행 상한 적용 ③ **조회 이력에 시스템 조회로 구분해 기록**. **개인정보 컬럼은 샘플링 대상에서 제외한다** — 값을 보여주는 것이 목적인 기능이므로 마스킹으로 해결되지 않는다"
    roadmap: "RM-P1"
    summary: "등록 공개 범위의 구조 차이만 보조 관측하고 업무 의미 영향 검토는 운영조직 자체 프로세스로 맡긴다."
    intent:
      problem: "DB 구조가 같아도 업무 의미가 바뀔 수 있고, 구조 차이만으로 자동 수정하면 잘못된 지식을 서비스할 수 있다"
      goal: "변경 근거와 참조 관계를 바탕으로 사람이 영향과 조치를 확인한다"
      not:
        - "원천 DB 전체 감시·대사가 아니다"
        - "구조 비교 이상 없음은 업무 영향 없음의 증명이 아니다"
    goal_trace:
      - "GOAL-1"
      - "SUC-02"
    decider: "제품 오너(사용자)"
    preconditions:
      - "등록된 공개 카탈로그 범위와 비교/열람의 현재 권한을 확인할 수 있다."
    data: []
    business_rules:
      - "안정 ID와 현재 권한 안의 사용처/참조 종류·경로를 조회한다. 업무 의미 영향 판정·연결 지식 본문 수집·보완 작업 배정/완료를 제품 절차로 요구하지 않는다. SQL/API 기술 계약과 필수 참조 무결성은 검증한다. 업무 의미 적합성 검토는 운영/유지보수 조직의 자체 프로세스다."
      - "업무 DB 전체 대사/다운로드나 카탈로그/지식 자동 갱신·활성/비활성화를 하지 않는다. 관측 차이는 구조적 확인 사실이며 업무 의미 변경·지식 보완 필요를 자동 확정하지 않는다. 관리 변경은 현재 권한자의 직접 저장·참조/SQL/API 기술 검증과 변경 이력으로 처리한다."
      - "구조 비교의 공개 범위·양쪽 존재/정의·DBMS 지원/관측 상태와 결과 저장은 batch_structure_comparison을 따른다. 조회 실패를 원천 부재/변경 없음으로 치환하지 않는다."
      - "사용처는 실제 원천 매핑의 현재 참조를 조회하며 본문 사본·영향 판정·보완 작업을 생성하지 않는다. 관리 변경이 필요한 경우 해당 현재 변경 권한자가 직접 저장한다."
