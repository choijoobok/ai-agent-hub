    business_rules:
      - "관리자 변경 요청·기술 검토 완료·최종 승인/반려·전결을 요구하지 않는다. 전체 구성과 현재 변경 권한·기대 버전·기술 계약 검증 및 실제 반영 이력은 생략하지 않는다. 기존 적용 이력은 수정하지 않고 복원도 새 직접 저장으로 남긴다."
