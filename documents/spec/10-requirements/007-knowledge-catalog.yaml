# 영역: 업무 메타데이터·지식
requirements:
# ── 메타데이터와 인증 예제 쿼리 ────────────────────────────
  - id: REQ-301
    manual_use_contract: "2026-11-01 사용자 승인: 카탈로그의 수동 사용 여부(useYn, 논리 Boolean)는 REQ-601.asset_availability를 따른다. 현재 효력 상태·공개/검수·접근/정확 참조 조건과 별도 입력이며 소수의 현재 변경 권한자가 전체 카탈로그 직접 저장·이력에 포함한다. OFF는 후속 LLM 컨텍스트·SQL 계획/실행·저장 정의 및 워크플로우 신규/재개/재시도에서 해당 카탈로그의 사용을 차단한다. ON만으로 초안·미검수·무효 연결의 사용을 허용하지 않는다. 물리 컬럼과 공개 DTO 이행은 소유 P3 상세 설계에서 확정한다."
    object_type_workspace: "TABLE/VIEW 구분은 OBJECT_TYPE 필수값으로 저장하고 상단 목록·조회조건·신규/테이블 정의에 테이블/뷰로 표시한다. 원천 조회권이 없으면 관리자가 직접 지정하고 원천 관측 여부와 분리한다. 객체 유형은 LLM 컨텍스트에도 제공하며 유형 변경으로 동일 물리 식별 중복을 허용하지 않는다"
    source_type_catalog: "2026-10-29 사용자 결정: DBMS별 지원 자료형은 system 공통코드로 관리하고 버전별 목록은 만들지 않는다. DBMS 코드 그룹은 DBMS, 자료형 그룹은 DBMS_DATA_TYPE으로 설계한다. 자료형마다 안정 DTL_CD 한 건을 두고 PARENT 참조값은 DBMS.DTL_CD, NATIVE_TYPE 참조값은 원천 자료형 이름을 보존한다. 동일 이름의 다른 DBMS 자료형은 별도 상세 코드이며 참조값 한 칸에 목록을 나열하지 않는다. CODE_REF_KEY에 NATIVE_TYPE 정의를 추가하는 것은 후속 구현/시드 범위다. 표시 메시지와 원천 타입명을 혼용하지 않는다. 콤보는 현재 DBMS와 PARENT가 같고 활성인 자료형만 제공하며 버전은 후보 필터/공통코드 키에 사용하지 않는다. 서버도 코드 존재·활성·DBMS 참조·원천 타입명 유효성을 검증한다. 공통코드 존재는 현재 DBMS 버전의 실제 타입/함수 지원을 보증하지 않으므로 관리자는 원천 정의·치수와 대조해 선택/검수한다. 원천 수집값은 근거로 보존하고 동의어·사용자 정의 타입을 임의 변환하지 않는다. 미등록/비활성/모호한 원천 타입은 원문을 유지하고 미확인으로 표시하며 필요한 코드 보완·재선택 전 검수 완료/의존 조회에 사용하지 않는다. 코드 조회 실패와 빈 목록을 구분하고 첫 값/유사 타입을 자동 선택하지 않는다. 신규/변경 후보는 현재 코드를 검증하되 과거 판의 코드·타입 원문은 현재 코드명으로 재구성하지 않는다"
    column_workspace: "2026-10-29 사용자 결정: SCR-003 컬럼 정의 그리드에서 PK 여부·PK 순서·업무명·자료형/사이즈·NOT NULL·코드/개인정보/마스킹을 관리한다. 복합 PK는 같은 테이블의 PK 표시 컬럼과 1부터 연속된 순서를 전체 PRIMARY 정의로 저장하며 일부만 검수하지 않는다. 키 구성 탭은 제거하고 PRIMARY 외 유일키는 기존 인덱스 탭에 정의 종류 UNIQUE_KEY/INDEX를 구분해 같은 단일 그리드로 관리한다. 유일 인덱스를 검수된 식별키로 자동 승격하지 않는다. 관계는 SCR-039, 구조 일괄 비교는 SCR-002가 소유하며 카탈로그에 FK/원천 구조/샘플 조회 탭을 두지 않는다. 나머지 1:N 직접 값·인덱스·그룹 예외는 건수로 해당 컬럼 문맥에 이동하며 전체 후보/정확 참조·미확인 보존 규칙을 유지한다"
    source_dimensions: "사이즈는 확인한 원천 자료형의 문자 길이/바이트 길이와 단위 또는 숫자 정밀도·소수자리로 구분해 카탈로그 후보에 보존한다. 해당 없음·미확인·원천 미지원은 별개이며 임의 0이나 varchar의 길이로 통일하지 않는다. 당시 확인 근거·검수와 함께 저장/복사/고정해야 하며 과거를 현재 원천 치수로 재구성하지 않는다. 이 속성 편집은 원천 ALTER가 아니다. @defer P3 integration_assets·integration — 원천별 치수 표현·물리 컬럼/타입·전체 후보 입출력과 이행을 정하고 기존 SOURCE_TYPE만으로 구조화 치수 저장이 완료됐다고 보지 않는다"
    key_workspace: "PRIMARY는 컬럼 정의의 PK 여부/순서와 테이블 정의의 PK 검수 근거를 ENT-021/022 전체 키로 연결한다. PK 여부만으로 복합 키 구성 컬럼 각각을 단일 유일키로 해석하지 않는다. UNIQUE_KEY는 인덱스 탭에서 종류·이름·순서·전체 구성·검수 근거를 입력하되 ENT-021/022에 연결하고 INDEX는 인덱스 저장 모델로 분리한다. 탭 통합은 물리 키와 인덱스 의미를 합치는 것이 아니다. 같은 이름의 키/인덱스도 구분한다"
    index_metadata: "2026-10-29 사용자 결정: 공개 테이블/뷰의 인덱스 메타데이터와 등록 컬럼의 참여를 카탈로그 후보로 관리한다. 이름·유일 여부(미확인 포함)·원천 종류/근거·검수 상태와 순서 있는 구성 컬럼·정렬 방향을 한 정의로 유지한다. 컬럼 건수는 참여하는 인덱스 정의 수이며 복합 구성의 일부만 읽고 전체로 검수하지 않는다. 함수식·부분/필터·포함 컬럼 등 지원 범위 밖 정의는 확인 불가/미지원으로 보존하고 단순 컬럼 인덱스로 축소하거나 임의 SQL을 입력받지 않는다. PK/유니크 제약과 인덱스는 같은 이름이어도 별개 근거이며 인덱스 유일 표시로 식별키 검수를 대신하지 않는다. 추가/수정/제거는 카탈로그 메타데이터 후보 편집이고 원천 CREATE/DROP INDEX가 아니다. 현재/후보/과거 전체 스냅샷과 기존 세트 반영을 따른다. @defer P3 integration_assets — 안정 정의 식별·순서 자식의 엔티티/물리 저장·전체 구성/복사/고정/검증 계약을 추가한다. 미구현 구조를 기존 ENT/API에 이미 존재하는 것으로 표시하지 않는다"
    identity_change: "원천 객체/컬럼의 이름만 바뀐 동일 실체임을 현재 근거로 확인하고 기존 카탈로그의 전체 직접 저장·기대 버전/기술 참조 검증으로 안정 ID를 유지한다. 과거 이력은 당시 이름/정확 식별을 보존한다. 삭제/재생성·다른 실체/데이터소스로 ID를 자동 이전하지 않는다."
    type: "functional"
    priority: "must"
    actors: [ACT-003, ACT-005]
    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(미완성·미검수 카탈로그 초안 저장 허용, 해당 범위의 AI 사용 제외) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-09-30 사용자 결정(평가셋의 변경 승인 강제 조건 제거, 모든 모델 입력 요소를 대상으로 사용자 질의 모니터링·대표 질의 평가를 일상 품질 관리로 운영) · 2026-10-01 후속 결정: 평가 기능은 REQ-615에 따라 전체 개발 완료 후 재검토 · 2026-10-02 사용자 보완 요청: DB 스키마와 카탈로그를 구분하고 다중 스키마 객체의 물리 식별을 명확히 한다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-29 사용자 결정: 컬럼 중심 단일 그리드 탭·사이즈/인덱스·이름 선택·FK 간편 입력·접근 그룹 설정"
    process_step: "PRC-09-01"
    title: "선별 공개 사실을 수집하고 업무 의미를 검수한다"
    detail: "Hub 카탈로그는 업무 DB/DW 전체 스키마의 사본이 아니라 **고객사가 선택한 공개 데이터 인터페이스(뷰·테이블)** 의 업무 모델이다. 등록된 공개 객체의 **스키마 사실**(타입·PK·유니크·NOT NULL·컬럼 목록)은 권한이 있을 때 자동 수집·비교할 수 있다. **업무 의미**(업무 명칭·설명·의미 유형·값 도메인)는 수기이며 초안은 자동 제안하되 **사람이 검수해야 확정된다.** 업무 자산 관리자는 데이터소스·공개 범위·개발 구현 상세와 업무 관계를 함께 검수해 지식·인증 예제 쿼리의 근거로 삼는다. **접근 허용 그룹**은 카탈로그 내용과 함께 전체 구성으로 직접 저장한다. 그 밖의 정책(마스킹·행 스코프·기본 필터, LLM 전송은 REQ-106의 요청·동의 정책 참조)은 등록 시부터 담당 권한자가 직접 관리하고 변경 이력을 남긴다(REQ-103)"
    hard_rule: "**Hub는 원본 DB/DW 전체를 수집·대사하지 않는다.** 민감 원본 객체는 등록하지 않으며, 자동 수집은 이미 선택·등록된 공개 객체 밖으로 범위를 넓히지 않는다. 자동 수집이 사람이 넣은 의미·정책을 덮지 않으며 DB 코멘트는 업무 명칭의 초안으로만 쓴다"
    why: "원본 테이블을 모두 노출하면 보안 경계가 무너지고, 복잡한 정형 조회를 뷰로 제공하는 고객사의 업무 모델과도 맞지 않는다. 정확도에 필요한 것은 전체 물리 스키마가 아니라 **검수된 공개 범위의 의미**다"
    note: "카탈로그와 접근 그룹/컬럼 예외는 같은 전체 구성의 직접 저장/이력 단위다. 원천 구조·필수 업무 속성·SQL/참조 기술 검증은 유지하고 별도 관리자 승인이나 지식 업무 의미 영향 검토 작업을 요구하지 않는다."
    traces_to: [PRN-10, CON-016, CON-018]
    acceptance: "선택된 공개 인터페이스의 구조 사실은 권한 안에서 수집·비교할 수 있으나 업무 의미·정책은 사람이 검수·확정하며, 등록 범위 밖 원본 객체는 수집·대사·노출되지 않는다. 자동 수집은 확정된 의미와 정책을 덮어쓰지 않는다. 업무 명칭·설명이 미완성 또는 미검수인 범위는 관리자 초안 저장만 가능하고 AI 컨텍스트 주입·업무 조회에는 사용되지 않는다. 같은 데이터소스의 서로 다른 DB/카탈로그 또는 DB 스키마에 있는 동명 객체는 별도 항목이고 같은 물리 객체의 중복 등록은 거부한다. 스키마를 갖는 DBMS의 실제 객체 참조는 DB 스키마명이 명시돼 카탈로그와 일치해야 하며, 스키마 생략·모호한 객체를 기본 스키마로 임의 보정해 실행하지 않는다. column_metadata·value_domain·relationship_metadata에 따라 물리 자료형과 업무 의미/형식·코드 출처·전체 조인 컬럼/관계의 검수 상태를 확인할 수 있다. 미확인·무효 참조를 추정으로 메우지 않고 해당 범위 사용을 제외하며 개인정보는 REQ-111.privacy_metadata를 따른다."
    roadmap: "RM-P1"
    summary: "고객사가 공개하기로 선택한 뷰·테이블만 등록한다. 컬럼의 구조·업무 의미·코드 출처·조인 관계를 검수하고 현재 조회 정책을 참조하며 REQ-111의 개인정보 기준을 연결한다. 제약은 계획 단계의 조건 확인과 서버의 실제 SQL 검증에 사용하며 수집 결과로 공개 범위나 정책을 자동 확대하지 않는다"
    intent:
      problem: "전체 물리 스키마를 그대로 제공하면 공개 범위를 넘고 업무 의미가 없어 잘못된 SQL을 만들 수 있다"
      goal: "선별된 데이터의 검수된 의미·관계·정책을 AI 조회의 근거로 제공한다"
      not: ["원본 DB/DW 전체 복제·대사 기능이 아니다", "자동 수집으로 업무 의미·정책을 확정하는 기능이 아니다"]
    goal_trace: [GOAL-1, INV-01]
    decider: "제품 오너(사용자)"
    preconditions: ["고객사가 공개할 뷰·테이블을 선정하고 데이터소스와 Hub 관리 권한을 준비한다. 원천 메타데이터 조회권이 없으면 manual_registration의 직접 등록·근거 검수를 사용한다(CON-016·CON-018)", "업무 자산 관리자가 업무와 데이터·구현 관계를 검수한다(PRC-09-01)"]
    data:
      - item: "공개 객체의 물리 식별: Hub 데이터소스 내부 식별자·DB/카탈로그명·DB 스키마명·객체명·객체 유형(TABLE/VIEW), 해당하는 경우 서버 한정자"
        origin: "공개 범위 선정·등록 객체 확인 — REQ-603의 동일 연결 범위"
        sensitivity: "내부 물리 객체 정보 — 공개·접근 통제 대상"
        retention: "카탈로그 리비전의 불변 이력 스냅샷"
      - item: "공개 객체·컬럼의 구조 사실과 업무 의미·값 도메인·조인 관계"
        origin: "등록 객체의 수집 결과 또는 수동 등록 근거와 업무 자산 관리자 검수"
        sensitivity: "내부 스키마·업무 메타데이터"
        retention: "등록 상태의 불변 이력 스냅샷, 보관 설계는 REQ-107을 따름"
    column_metadata:
      privacy_workspace: "REQ-111.privacy_metadata.column_workspace에 따라 컬럼 정의 그리드에서 개인·민감정보 여부와 공통 마스킹 옵션을 설정한다. 컬럼 그룹 예외는 REQ-103의 숨김/마스킹 유형을 따른다. 별도 개인정보 탭과 FK 요약 컬럼은 제거하며 관계 편집은 SCR-039가 소유한다"
      source: "2026-10-22 사용자 보완 요청: 컬럼명·설명·자료형·날짜 등의 의미/형식·공통코드 출처와 관계를 요구사항에 명시하고 개인정보 관리 항목은 REQ-111.privacy_metadata와 연결한다. 실제 필드명·물리 저장·화면 배치는 P3에서 정한다"
      attributes: "컬럼명·물리 자료형·기본키/유일키 여부·NULL 허용 여부, 업무 명칭·설명·의미 유형을 관리한다. 날짜·일시·금액·수량·코드 등은 물리 자료형과 구분하고 해석에 필요한 날짜/시간 형식·시간대 또는 단위를 해당하는 경우 명시한다. 문자열 저장 날짜나 숫자로 보이는 식별자를 이름·값 모양만으로 날짜·수량으로 추정하지 않는다"
      privacy: "각 컬럼에서 REQ-111.privacy_metadata의 분류·식별 용도·마스킹 참조·검수 상태를 확인할 수 있어야 한다. 보안 담당자의 정책 원천과 현재 권한은 REQ-103·611을 따르며 카탈로그에 별도 정책 사본을 만들지 않는다"
      incomplete: "업무 의미·필요한 형식·값 도메인이 미완성/미검수이면 해당 컬럼은 초안으로 저장하되 AI 주입·업무 조회에 사용하지 않는다. 개인정보 미확인은 REQ-111을 따른다. 필요한 조인 관계나 코드 참조가 미확인이면 그 관계/참조에 의존한 조회를 추정 실행하지 않는다. 이 조건은 코드·관계가 필요 없는 독립 컬럼까지 관계 등록을 강제하는 뜻이 아니다"
    value_domain:
      modes: "NONE/UNKNOWN/INLINE/CODE를 구분한다. INLINE은 고정된 직접 값/의미이며 CODE는 원천 조회로 현재 코드/참조값을 확인해야 하는 의미 표시다. CODE가 등록 SQL 정의/버전/파라미터 바인딩을 갖는 옛 모델은 철회한다."
      binding: "컬럼에 코드 조회 정의/정확 버전/typed 파라미터 바인딩을 저장하지 않는다. 원천 테이블·코드 구분 등 조회 방법은 REQ-603의 데이터소스별 범용 가이드에서 설명한다."
      refresh: "필요한 코드/참조값은 실제 읽기 조회로 확인한다. 정적 설명/지난 성공 목록으로 현재 원천값을 추정하지 않고 실패·빈 결과·모호함·상한을 구분한다."
      consumption: "REQ-603.data_query_guides의 선택·현재 권한·원천 선행 조회·실패 처리·턴 근거 계약을 따른다."
      validation: "INLINE의 실제 값·의미는 관리 검수를 유지한다. CODE 의존 질문은 현재 허용 스키마/가이드와 실제 조회 결과로 필요한 값을 확인한다. 실패/미확정 값을 추정하지 않는다."
      history: "가이드 적용 데이터소스/관리 리비전·가이드 ID/본문 근거와 실제 조회 SQL·정형 바인딩·결과 상태·조회시각·사용값의 보호된 근거를 턴 이력에 남긴다. 조회 결과는 데이터소스 전체 저장값이 아니며 조회 실행만으로 데이터소스 변경 이력을 생성하지 않는다. 과거 턴을 현재 가이드/코드명으로 재구성하지 않는다."
      workspace: "카탈로그는 컬럼의 값 방식·업무 의미와 INLINE 직접 값을 관리한다. 데이터 조회 가이드는 데이터소스에서 관리하며 카탈로그의 코드 바인딩·조회 코드 값·코드 조회 설정 창은 제거한다."
      query_guide: "REQ-603.data_query_guides. 선택 카탈로그의 데이터소스별 여러 가이드를 중복 제거하여 제공하고 원천 데이터의 코드/참조값을 실제 읽기 조회 후 업무 SQL에 사용한다. 개별 컬럼에 조회 정의 ID/버전/typed 바인딩을 저장하지 않는다."
    relationship_metadata:
      ownership: "2026-10-28 사용자 결정(ADR-030): 관계 작성 시 양쪽 공개 카탈로그 중 관리할 카탈로그를 명시 선택하고 이후 고정한다. 관계는 해당 카탈로그 전체 후보의 일부이며 반대쪽 화면은 같은 정본을 조회한다. 관리측은 업무상 1측/N측·화면 진입 방향과 별개이며 관계 수정으로 관리측을 이전하지 않는다. 대체가 필요하면 기존 관계 폐기와 새 관계 후보의 참조·영향 검증을 따른다"
      workspace: "2026-10-29 사용자 결정: 테이블 관계는 별도 화면 SCR-039에서 관리한다. 별도 화면은 관리 카탈로그의 같은 리비전·전체 후보·EDIT_VERSION과 API-023/024/025 계열을 재사용하는 편집 표면이며 독립 관계 리비전·별도 승인/부분 저장 모델을 만들지 않는다. SCR-003은 관계 건수의 읽기 전용 요약 및 별도 화면 참조만 제공한다. 전체 후보를 저장/복사/고정할 때 별도 화면 소유의 관계/전체 쌍을 보존하며 숨겨진 편집 영역·조회 실패·목록 생략을 빈 관계 목록이나 삭제로 해석하지 않는다. 화면 간 미저장 입력 확인·문맥 전달·권한 재검사·편집 버전 충돌 처리는 SCR-039 상세 설계에서 확정한다"
      attributes: "관계 양쪽의 공개 카탈로그 객체·연결 컬럼 쌍과 방향, 1:1 또는 1:N의 업무상 관계·설명을 관리한다. 복합 키는 필요한 컬럼 쌍 전체를 함께 정의하고 일부 컬럼만으로 같은 관계라고 취급하지 않는다. 물리 FK(외래키)로 확인된 관계와 FK 없이 사람이 검수한 논리 관계의 근거를 구분한다"
      validation: "공개된 대상·컬럼의 존재와 참조 유효성, 조인 값의 타입/의미 호환, 1측의 유일성 근거와 누락·중복 시 조회/집계 의미를 검수한다. 이름이 같다는 이유나 자동 수집한 FK만으로 업무상 권장 조인을 확정하지 않는다. FK가 없는 레거시도 검수된 관계를 사용할 수 있고, 관계 등록을 이유로 원천 DB 제약을 생성·변경하지 않는다"
      controls: "관계는 조인 근거이며 상대 객체의 접근 권한을 부여하지 않는다. 미등록·미검수·무효 관계는 권장 경로로 주입하지 않고 그 관계에 의존한 조회를 추정 실행하지 않는다. 변경 시 연결 지식·예제의 영향 확인과 기존 카탈로그 후보 승인 절차를 따른다. 1:N 관계를 1:1로 보거나 일괄 DISTINCT로 중복을 숨겨 집계를 확정하지 않는다"
      consumption_scope: "LLM(대규모 언어 모델)에 제공할 카탈로그 메타데이터 목록에는 각 카탈로그의 모든 관계 본문을 내장하지 않는다. 이번 호출에서 실제 조회/선택한 카탈로그의 정확한 catalogId/revisionId 집합을 공통 관계 조회 계약에 전달하고 관계 양쪽 참조가 모두 그 집합에 있을 때만 포함한다. 지식 합산의 전체 후보 목록이나 관리용 반대편 역조회를 최종 선택 집합으로 간주하지 않는다. 양쪽 현재 객체/컬럼 권한·검수/사용 가능 상태·정확 참조 판·전체 컬럼쌍을 함께 확인하고 프루닝으로 필수 쌍 컬럼이 빠지면 관계 전체를 제외한다. 자기조인은 집합 원소가 하나여도 두 역할·방향·전체 쌍을 유지한다. 없는 중간 테이블 자동 추가·권한 확대·동명 객체나 다른 버전의 대체는 금지한다. 인증 예제 작성도 같은 공통 조회 계약으로 선택/추출한 카탈로그 집합의 관계를 참고하며 후보와 운영 사용 가능 상태를 구분한다. 상세 공개 계약의 정본은 50-api의 FEAT-011.relation_read_contract다"
    manual_registration:
      entry: "신규 버튼에서 데이터소스와 완전한 물리 식별·컬럼을 직접 입력한다. 원천 객체 조회는 선택적인 입력 보조이며 스키마 메타데이터 조회권은 등록의 필수 조건이 아니다"
      identity: "서버가 데이터소스에 고정한 DBMS 식별 규칙으로 직접 입력한 정확 이름·해당 없음 차원을 검증하고 OBJECT_KEY 중복을 검사한다. 원천 메타데이터 조회와 이름 정규화를 분리한다. 미확인 차원·기본 스키마 추정·사용자 임의 규칙은 허용하지 않는다"
      evidence: "설계서·원천 담당자 확인 등 등록 근거는 ENT-010.EVIDENCE_BODY와 ENT-006.REVIEW_EVIDENCE로 연결한다. 원천 미조회·ACCESS_DENIED·UNAVAILABLE을 실제 관측 성공으로 바꾸지 않는다. 필요한 구조·자료형·의미를 근거로 검수하면 원천 조회 성공 없이도 직접 저장·반영할 수 있다"
      limits: "완전한 선언 식별이 없는 초안은 저장하지 않는다. 실제 부재가 신뢰할 수 있게 확인된 NOT_FOUND는 단순 조회권 부족과 구분하고 모순을 해소하기 전 사용 가능으로 검수하지 않는다. 실제 SQL 실행 권한과 현재 정책 검증은 유지한다. 기존 객체 이름 변경·ID 승계·복원은 identity_change의 동일 실체 증명과 재검증을 완화하지 않는다"
    query_constraint_reference: "조회 제약의 관리·바인딩·실행 검증 정본은 REQ-611.query_constraints다. 카탈로그는 대상 테이블/컬럼을 제공하고 현재 적용 규칙의 읽기 전용 역조회·SCR-009 이동만 제공한다"
    business_rules: ["수집 범위·업무 의미·정책의 경계는 본문의 detail·hard_rule을 따른다", "테이블/뷰별 필수 조회 제약은 REQ-611.query_constraints의 직접 정책을 참조한다. 조건 누락·초과·우회·무효 참조를 실행하지 않고 REQ-611.query_constraint_verification의 정상/예외 기준을 충족해야 한다", "DB 스키마와 스키마 카탈로그의 뜻은 TRM-161·TRM-162, 데이터소스의 다중 DB 스키마·권한 경계는 REQ-603을 따른다. 카탈로그 항목은 공개 테이블·뷰 하나이며 DB 스키마 전체를 등록·공개하는 단위가 아니다", "물리 객체는 `(Hub 데이터소스 내부 식별자, DB/카탈로그명, DB 스키마명, 객체명)`으로 구분해 같은 데이터소스 안의 물리 실체당 한 건만 등록한다. DBMS가 구분하는 서버 한정자가 있으면 그것도 식별에 포함한다. DBMS에 없는 차원은 해당 없음으로 표현하며 빈 값을 다른 DB/스키마 전체와 일치시키지 않는다. 데이터소스·DB·스키마 중 하나라도 다르면 동명 객체도 다른 항목이다. 그룹별 차등 공개를 위한 서로 다른 물리 뷰는 각각 등록할 수 있지만 같은 물리 객체를 그룹별로 중복 등록하지 않는다. 연결이 허용하는 교차 DB 조회와 별도 DB 허용 목록을 두지 않는 정책은 REQ-603·ADR-027을 따른다", "카탈로그에는 실제 DB/카탈로그명을 보존한다. SQL에서 DB명을 생략한 참조는 실행에 사용할 연결의 확정된 현재 DB로만 해석하고, 명시된 다른 DB명이나 서버 한정자를 버리지 않는다. 등록·수집·SQL 검증·행 스코프 주입·원본 컬럼 추적은 같은 전체 식별을 사용한다. 현재 DB를 확정할 수 없거나 연결의 이름 해석 환경과 검증 환경이 다르면 실행하지 않는다. 세션의 DB/검색 경로 전환이나 다른 연결로의 자동 대체로 검증을 우회하지 않는다", "스키마를 갖는 DBMS의 등록 객체에는 기본 스키마(dbo·public 등)도 실제 DB 스키마명을 보존하며 데이터소스의 표시용 별칭으로 대체하지 않는다. SQL의 실제 테이블·뷰 참조에는 DB 스키마명을 명시해 선언한 데이터소스의 등록 객체 전체와 대조한다. 스키마 생략·모호한 참조는 보완 대상이며 DB의 기본 스키마·검색 경로를 따라 임의 대체해 실행하지 않는다. 별칭·임시 질의 이름은 물리 객체와 구분한다", "업무 명칭·설명은 AI 사용 전 필수이며 미기재 항목은 미완성으로 표시한다. 미완성·미검수 객체·컬럼은 관리자 초안으로 저장할 수 있지만 해당 범위를 AI 컨텍스트 주입·업무 조회에 사용하지 않는다. 구조 사실 보조 수집과 관리자 검수는 허용하며, 보안 정책 적용만으로 검수를 대신하지 않는다", "컬럼 속성·값 도메인·관계는 column_metadata·value_domain·relationship_metadata를 따른다. 2026-10-29 컬럼 중심 화면·원천 사이즈·인덱스 메타데이터 추가는 column_workspace·source_dimensions·index_metadata를 따른다. DB 기본값과 원천 구조 변경은 관리하지 않는다", "카탈로그 신규·수정·폐기·복원과 접근 그룹/컬럼 예외는 REQ-305·306의 현재 권한·기대 버전·전체 구성 검증과 이력으로 직접 저장한다. 고객사 물리 DB는 변경하지 않는다.", "평가셋 보유/평가 통과나 별도 관리자 승인·지식 영향 검토 작업을 일률적인 저장 조건으로 강제하지 않는다. 필수 기술 검증과 고객사 외부 오픈/배포 검수는 유지한다."]
    quality_management:
      scope: "상시 품질 평가·평가셋 기능의 유예와 재검토 시점은 REQ-615가 정본이다. 현재 설계·구현·게이트 필수 범위로 두지 않는다"
      retained: "SQL/API 기술 계약·필수 참조 무결성·개발/외부 시험 근거와 현재 권한·기대 버전·전체 직접 저장/이력은 유지한다(REQ-305·306). 관리자 기술 검토/승인·업무 의미 영향 검토 작업은 없다."
      controls: "향후 평가를 도입해도 기존 열람 권한·마스킹·보관·실행 통제를 우회하는 근거가 되지 않는다"
    exceptions: ["수집 권한이 없으면 자동 수집으로 범위를 우회하지 않으며, 업무 근거가 불명확하면 지식·인증 예제 공개 전에 보완한다(PRC-09-01)"]
    lifecycle: "구조 사실 보조 수집·로컬 편집 → 현재 변경 권한·입력/참조·기술 검증 → 직접 저장/전체 이력 → 검증된 유효 범위만 AI 사용"
    permissions: ["업무 의미·관계 검수: 유효 메뉴 권한의 ACT-003", "오류·품질 조사: 해당 유효 액션 권한의 ACT-005, 변경 조치는 해당 자산 담당 권한으로 수행한다", "보안 정책 관리는 REQ-103·PRC-09-03의 권한 경계를 따른다"]
    audit: "공개 객체의 등록 컬럼·업무 의미 전체와 정책 변경의 과거 상태를 REQ-107에 따라 보존한다"
    volume: "고객사가 선택한 공개 객체만 대상으로 하며 조회 빈도 상위의 미완성 항목을 우선 확인한다"
    config: "등록 공개 범위·업무 의미·값 도메인·권장 조인 관계는 카탈로그 관리 값이며 필수 조회 제약은 REQ-611 소유 정책이다"
    risk: "원천 구조 관측만으로 업무 의미 적합성을 보증하지 않는다. 의미 검토는 운영조직 자체 프로세스이며 제품의 SQL/참조 기술 검증을 대체하지 않는다."
    relations:
      depends_on: [REQ-603, REQ-601, REQ-111]
      constrains: [REQ-021, REQ-025, REQ-303, REQ-304, REQ-305, REQ-608]
      conflicts_with: []
