      - "REQ-303"
    acceptance: "변경 권한자가 지식의 본문·그룹·링크/설명을 저장하면 별도 관리자 승인 없이 전체 검증·원자 반영·HIST를 완료한다. 일반 조회자·권한 회수된 사용자·낡은 기준본·유효하지 않은 참조의 저장은 거부한다. 저장 실패/로컬 편집을 검색에 노출하거나 과거 요청의 늦은 승인으로 현재값을 바꾸지 않는다."
