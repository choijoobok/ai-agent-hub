    volume: "초기 고정 안내는 모델 호출 0회이며 실제 질문의 검색·응답은 기존 컨텍스트 상한을 따른다"
    config: "사용 안내 내용은 지식 관리, 공통 응답 규칙은 기존 프롬프트 규칙 관리가 담당한다"
