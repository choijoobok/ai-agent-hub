    source: "2026-09-21 제품 오너(사용자) 요구사항 재점검 — 기존 정책 유지 · 2026-09-30 사용자 결정(동일 지식에 승인 대기 요청이 있으면 신규 변경 승인 요청 차단, 오류·품질 조사 또는 예방적 지식 검토를 변경 요청의 근거로 연결) · 2026-09-30 사용자 결정(예제·카탈로그 단독 변경도 요청·기술 검토·최종 승인, 동일인 겸임 허용·결재선 설정 제외, 세트 스냅샷·승인 시 최신성 검사) · 2026-10-06 사용자 정정: 태그 자체 변경과 지식 태그 ID 매핑 변경을 구분하며 공통 태그 단독 요청도 기존 승인 화면에서 처리한다(REQ-607) · 2026-10-06 사용자 추가 확정: 태그/지식 변경 상호 차단 제외와 실제 변경 대상별 중복 요청 제한·당시 지식 리비전 보존은 REQ-607을 따른다 · 2026-10-08 사용자 결정: 업무별 관리 승인 설정과 전결 처리(REQ-601·ADR-023) · 2026-10-08 사용자 추가 지시: API·커스텀 도구의 매핑별 사용 설명 변경을 지식 후보·스냅샷에 포함하고 전체 카드 재검토 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록 · 2026-10-30 사용자 확정: 지식은 안정 식별자 매핑을 관리하고 참조 리비전 상승으로 자동 반려하지 않는다. 연결 자산 승인에서 연결 지식의 영향과 보완 필요 여부를 판단한다. · 2026-10-31 관리자 간 승인 전면 철회·직접 관리 결정(ADR-037)"
    process_step: "PRC-09-05"
    title: "지식 변경 권한과 직접 저장·활성 상태 관리"
    detail: "지식 본문·접근 그룹·태그 ID 매핑·카탈로그/예제/API/도구 안정 ID 링크와 매핑별 사용 설명을 현재 변경 권한자가 직접 편집·저장한다. 저장 전까지 로컬 편집값은 검색/주입에 사용하지 않고 검증·전체 이력 저장에 성공한 적용 리비전만 사용한다. 인증 예제·카탈로그·태그·API·도구도 같은 공통 직접 저장 경계를 적용한다."
    hard_rule: "관리자 변경 요청·기술 검토 완료·최종 승인/반려·전결을 요구하지 않는다. 전체 구성과 현재 변경 권한·기대 버전·기술 계약 검증 및 실제 반영 이력은 생략하지 않는다. 기존 적용 이력은 수정하지 않고 복원도 새 직접 저장으로 남긴다."
    why: "변경 권한을 소수의 업무 전문가/관리자로 제한하고 반복 승인 부담을 줄이면서 AI가 사용하는 지식의 구성과 변경 근거를 재현하기 위해서다."
    traces_to:
