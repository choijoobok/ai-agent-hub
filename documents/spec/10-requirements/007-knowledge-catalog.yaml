      - "agent의 고정 초기 안내 계약을 portal이 표시한다"
    data:
      - item: "사용 안내 지식·허용 태그·접근 가능 업무 범주 요약"
        origin: "관리자의 승인된 지식과 현재 권한 판정"
        sensitivity: "사용자 그룹별 제한 정보"
        retention: "지식 변경·대화 이력의 기존 보관 정책"
    business_rules:
      - "초기 안내·검색 답변·무결과 태그 안내·전체 열거 거절은 detail·hard_rule을 따른다"
      - "상세 접근 목록 화면의 차수 경계는 hard_rule을 따르며 아직 제공되지 않는 화면으로 안내하지 않는다"
    exceptions:
