  - id: REQ-035
    type: functional
    priority: must
    category: "처리 중 입력·전송 최소화"
    actors: [ACT-001]
    title: "의도 분류 입력의 최소화"
    detail: "REQ-007에 따라 확인한 대상 턴의 현재 유효 의도·계획/상태 근거·진행 단계·액션 전송 사실과 이번 판정에 필요한 입력을 사용한다. 대상의 필요한 해석을 참조하되 다른 턴의 가장 최근 해석을 자동 대상 근거로 삼지 않는다. 미처리 입력은 대상·식별·순서를 보존한 필요한 유한 범위만 전달한다. 대화 이력 전체·스키마 카탈로그·지식/예제 쿼리·조회 결과 데이터는 분류 입력에 넣지 않는다"

    why: "의도 분류는 '무엇을 조회할지' 를 판단하지 않는다. 조회 결과 데이터를 넣지 않는 것은 토큰 문제만이 아니라 전송 최소화 원칙(REQ-106)이다"
    traces_to: [REQ-003, REQ-106]
    summary: "확인된 대상과 이번 분류에 필요한 유효 입력만 문맥·전송 한도 안에서 전달한다"
    preconditions:
      - "REQ-007의 대상 확인 및 REQ-003·106·111의 문맥 한도·현재 권한·전송 허용 경계를 적용한다"
    data:
      - item: "확인된 대상의 유효 의도·상태·전송 사실·이번 판정에 필요한 입력과 식별/순서 근거"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "여러 턴의 입력을 하나의 변경 묶음으로 합치지 않는다. 이미 반영·중복·무효화된 입력을 새 변경처럼 전달하지 않는다"
      - "문맥 한도를 넘으면 필수 철회·부정 표현이나 대상 근거를 임의로 잘라 확정 분류하지 않고 기존 확인/처리 불가 경로로 연결한다"
      - "사용자 직접 입력의 전송 안내·동의와 개인정보 의심 판정은 REQ-106·111을 따른다. 직접 입력의 제출 동의를 다른 결과 데이터의 추가 전송 동의로 확대하지 않는다"
      - "현재 접근할 수 없는 이전 해석·결과를 분류 편의를 이유로 복구하거나 전송하지 않는다. 실제 전송 근거와 범위는 REQ-107에 연결한다"
    exceptions:
      - "필수 대상/문맥 근거를 확보하지 못하면 추정 분류하지 않으며 명시적 중단은 별도 직접 경로를 유지한다"
    lifecycle: "대상 확인 → 유효 입력 선별·순서 구성 → 문맥/전송 검사 → 분류 또는 확인 경로"
    permissions: "현재 입력·참조 자료의 접근과 전송 허용을 검사하며 분류 모델에 특별한 데이터 열람 권한을 주지 않는다"
    audit: "사용한 입력/대상 버전과 전송 판단을 기존 기록에 연결하고 별도 분류용 원문 보존 기한을 만들지 않는다"
    config: "모델 문맥 한도와 입력 구성은 REQ-003·610의 계약을 사용하며 새로운 고정 토큰 수를 정하지 않는다"
    risk: "최근 턴의 문맥 혼입·입력 절단·과도한 전송은 오분류와 개인정보 노출을 만든다"
    open:
      - "@defer P3 입력 식별·순서·대상별 묶음과 문맥 부족 시 확인 계약을 설계한다"
    verification:
      - "최근 턴 B가 있어도 명시 대상 A의 유효 근거로 분류한다"
      - "긴 묶음의 철회 문장을 자르거나 다른 대상 입력을 합쳐 변경하지 않는다"
      - "직접 입력의 개인정보 처리와 조회 결과 전송을 혼합하지 않으며 중복 입력은 새 변경이 아니다"
    intent:
