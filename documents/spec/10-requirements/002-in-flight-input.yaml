    lifecycle: "영속 접수 → 유효 대상/순서 확인 → 실행 서버 제어 전달 → 실제 반영/거부 기록 → 현재 처리 표시 갱신"
    permissions: "입력 접수의 현재 소유권·권한과 실행 상태를 쓰는 점유/버전 자격을 별도 검사한다"
    audit: "불변 입력·추가 처리 사건·현재 상태의 역할과 보존은 REQ-107·109를 따르며 별도 무기한 원문 저장소를 만들지 않는다"
    config: "복구·점유·호출 정체는 REQ-113 및 NFR-013을 참조한다. 순번 발급·소비 주기는 P3에서 정한다"
    risk: "불변 입력을 덮거나 중복 소비·점유 상실을 놓치면 변경 유실·이중 실행·잘못된 호출 취소가 발생한다"
    open:
      - "@defer P3 순번 발급·조건부 저장·소비 표시·복구 주기·점유 상실과 취소 등록/해제 경합을 설계한다"
    verification:
