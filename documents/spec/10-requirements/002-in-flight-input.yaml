    traces_to: [REQ-007, REQ-009, REQ-030, REQ-033, CON-033, CON-034]
    summary: "스트리밍·실행 변경·실제 종료·결과 채택·계량을 구분하는 공통 공급자 계약을 검증한다"
    preconditions:
