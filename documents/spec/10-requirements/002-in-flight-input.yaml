    detail: "**병행형**(기본) — 턴은 처리중을 유지한 채 분류 결과를 기본값으로 표시하고 되돌릴 수단을 제공한다. 아무 조치도 하지 않으면 분류대로 반영된다. **차단형** — 진행 중 턴이 `승인 대기` 이거나 액션을 이미 실행한 경우 `의도 확인 대기` 로 전이하고 사용자의 선택 없이는 진행하지 않는다"
    auxiliary_fallback: "REQ-602의 허용된 일시 공급 장애에 대한 보조 후보 대체가 성공하면 유효한 분류 결과로 기존 확인/반영 절차를 수행한다. 이 카드의 분류 실패·오류는 후보 소진·전환 불가·마감/예산 차단으로 분류를 완료하지 못한 경우를 포함한다. 대체 처리 중 미확정 입력을 반영하거나 기존 의도 확인/후속 진행 보류를 해제하지 않는다. 최종 실패 뒤의 차단형 확인과 명시 중단은 기존 규칙을 유지한다"
    hard_rule: "분류 호출이 실패하거나 판정이 서지 않으면 차단형으로 폴백한다. 대상이 확정된 턴의 후속 진행을 확인 대기에서 보류하는 것이며 중단 종결을 뜻하지 않는다. 대상 미정 입력은 REQ-007의 대상 확인을 먼저 거친다. 이미 전송한 호출은 REQ-007의 결과/정리 경계를 지킨다. 제안 반영·되돌리기 직전에 현재 상태를 재검사하고 승인 대기·전송/실행·종결로 바뀌었으면 이전의 병행형 판정을 그대로 적용하지 않는다. 의도 확인은 실행 승인이 아니다(REQ-005)"
    why: "매 입력마다 차단형 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다. 병행형의 전제는 오분류가 복구 가능하다는 것인데, 액션이 걸린 턴에서는 그 전제가 성립하지 않는다"
    open:
