    business_rules:
      - "작업 유형과 복합 계획의 범위는 detail, 경로별 통제와 지식 무결과 처리의 경계는 hard_rule을 따른다"
      - "업무 데이터 조회·실행에 필요한 단계는 현재 사용자에게 허용된 활성 지식을 검색한 뒤 지식의 업무 맥락과 참조 매핑에서 후보를 구성한다. 카탈로그는 REQ-303의 직접·간접 참조 합산, 업무 API는 REQ-608의 지식 연결, 커스텀 도구는 REQ-303의 직접 매핑을 따르며 매핑은 권한을 부여하지 않는다"
      - "모델에는 유효한 API·커스텀 도구 매핑과 해당 매핑의 용도·사용 조건을 함께 제공한다(REQ-303.tool_usage_mapping). 지식 본문의 도구 언급으로 미매핑 도구를 추가하지 않는다"
      - "모델은 전달된 지식·참조 후보 안에서 필요한 대상을 선택한다. 사용자에게 접근 권한이 있더라도 검색된 지식의 후보 범위 밖 자산을 자동으로 추가하지 않는다"
      - "지식 안내는 사용 가능한 지식에 근거한 업무·사용법 설명이며 데이터 조회는 업무 데이터 읽기, 업무 실행은 등록된 업무 기능의 수행이다"
      - "정해진 데이터 가공은 합계·정렬·필터·표·차트용 데이터 구성이고, 결과의 의미·원인 해석은 REQ-039가 허용한 별도 처리다. 차트 요청만으로 업무 데이터를 모델에 보내지 않는다"
      - "복합 요청은 필요한 작업을 하나 이상 선택하고 선행 결과가 필요한 작업의 순서를 계획에 기록한다. 유형을 하나로 줄여 사용자의 다른 요청을 누락하지 않는다"
      - "조회·가공의 처리 의존 순서는 계획할 수 있지만 업무 실행의 대상·액션·순서는 REQ-026에 따라 사용자 요청에서 얻는다. 요청하지 않은 업무 실행을 추가하지 않으며 실행 범위나 순서가 불명확하면 확인한다"
      - "복합 작업의 중단·부분 결과·재요청은 composite_outcome을 따른다. 조회 유형으로 분류한 커스텀 도구도 REQ-114의 승인·통제를 생략하지 않는다"
      - "처리 근거나 대상·조건이 부족하면 REQ-025에 따라 추가로 확인하거나 처리 불가로 응답하며 임의 대상을 선택하지 않는다"
      - "사용자에게 보여 줄 해석문·계획과 필수 확인 조건은 REQ-015·REQ-022·REQ-023을 따른다. 계획 확인과 실제 실행 승인은 구분한다"
      - "실제 업무 실행의 사용자 승인은 REQ-026·REQ-105에 따르며 관리자의 자산 직접 저장으로 생략되지 않는다"
      - "후속 요청·변경·중단·재시도는 lifecycle의 연결 요구사항을 따른다. 이 카드의 유형 분류만으로 상태 전이나 재실행을 새로 허용하지 않는다"
    composite_outcome:
