  - id: REQ-033
    type: functional
    priority: must
    category: "처리 중 입력·다중 인스턴스"
    actors: [ACT-001]
    title: "중단·변경 입력은 영속 이벤트로 기록한다"
    detail: "중단·변경 입력은 실행 서버가 아닌 다른 인스턴스에 도착할 수 있다. 대상 턴·입력 식별/순번·접수 시점과 입력 사실을 추가 후 불변인 이벤트로 DB에 기록하고 반영·거부·중복·무효화·전달/처리 결과를 추가 사건으로 연결한다. 재탐색을 위한 현재 처리/소비 표시는 갱신할 수 있으나 원 입력 사실과 순서를 덮어쓰지 않는다. 물리 테이블 분리는 상세 설계에서 정한다. 접수 서버는 다른 서버의 스레드/호출 객체를 직접 제어하지 않으며 실행 서버의 독립된 제어 경로가 REQ-007.cancellation_control에 따라 해당 호출에 반영한다"

    hard_rule: "중단 시 진행 중이던 LLM 요청은 REQ-034의 구현체별 클라이언트 취소/종료 경로를 적용하되 실제 발생한 사용량은 원 호출에 기록한다. 응답 무효화·추론/표시 토큰·계량 유실의 구분은 REQ-007과 NFR-010을 따른다. 중단 이벤트 접수·전달과 실제 호출 취소 확인은 구분한다. 호출별 취소 가능 범위·타임아웃·후속 차단·사용자 보고는 REQ-007을 따르며 중단 이벤트가 존재한다는 이유만으로 취소 완료·실행 자리 해제를 기록하지 않는다"
    traces_to: [REQ-007, REQ-034]
    source: "2026-10-19 사용자 요청으로 DB 조회의 실행 중 취소와 처리 결과 보고를 지원하도록 동기 호출과 독립된 실행 서버 제어 경로를 보완했다. 물리 구현·경합 시험은 P3 후속이다 2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다"
    summary: "입력 사실을 영속·불변으로 남기고 현재 처리 표시와 분리해 여러 인스턴스에서 유효한 효과만 반영한다"
    preconditions:
      - "공유 영속 저장소와 REQ-007·107의 대상·실행 식별 및 점유 경계를 사용한다"
    data:
      - item: "불변 입력 사실·입력 순서·대상 턴/시도·처리 사건·갱신 가능한 현재 소비/처리 표시"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "동일 입력의 재전송은 기존 접수/현재 결과로 수렴한다. 여러 인스턴스의 중복 소비에도 현재 턴·시도·회차·점유·입력 순서를 검사해 하나의 유효 반영만 확정한다"
      - "접수 인스턴스의 영속 입력 저장에 실행 서버의 점유를 일률적으로 요구하지 않는다. 실제 진행 상태 갱신·취소 수단 제어는 현재 실행 자격을 검사한다"
      - "접수 저장 실패는 접수 성공으로 응답하지 않는다. 응답 유실 뒤 같은 입력 재전송은 새 변경을 만들지 않으며 저장된 사실을 대조한다"
      - "느린 분류나 개인 실행 순서가 명시적 중단 접수와 후속 차단을 막지 않는다. 먼저 받은 변경의 늦은 결과가 뒤의 유효 중단을 덮지 못한다"
