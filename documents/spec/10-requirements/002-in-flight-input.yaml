      reporting: "완료·실패·미수행·결과 확인 중인 항목을 구분하고 허용된 완료 결과만 부분 결과임을 표시해 제공한다. 조회 실패를 정상 0건으로 대체하거나 일부 결과로 전체 완료 보고서·발송을 수행하지 않는다. 접수만 확인된 실행과 결과 불명 실행은 완료로 표시하지 않는다(REQ-105)"
