      - {"provider":"Gemini Interactions / Generate Content","checked_at":"2026-10-19","basis":"일반 생성 스트리밍은 지원한다. Interactions의 interaction.created는 상호작용 시작, step.start는 출력/생각/도구 콘텐츠일 수 있으므로 Hub 모델 스텝과 일대일로 취급하지 않는다. 일반 API에서 OpenAI와 같은 처리 중 변경 계약은 확인되지 않아 Hub 제어 재요청을 기본 경로로 설계한다","source":"https://ai.google.dev/gemini-api/docs/streaming"}
