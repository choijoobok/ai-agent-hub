  - id: REQ-037
    type: functional
    priority: must
    category: "SQL 오류·재작성"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-02
    title: "SQL 오류의 재작성 분류와 런타임 상한"
    detail: "agent는 SQL 파싱·카탈로그 대조·DB/DW 실행의 실패를 각각 기록하고, DB/DW 실행 실패는 **데이터소스의 DBMS 종류·실행 단계·Spring 변환 예외·근본 SQLException의 SQLState와 공급사 오류 코드**를 함께 보존해 Hub 표준 유형으로 분류한다. 파싱 실패·카탈로그 대조 실패와, DB/DW가 공급사 오류 코드로 확인한 `SQL_SYNTAX`만 SQL 재작성 후보이며, LLM에는 원본 오류가 아닌 정제된 재작성 피드백만 전달한다"
    hard_rule: "DB/DW 실행 오류의 자동 재작성은 `SQL_SYNTAX`에 한정한다. 접근 거부·정책 거부·연결/인프라 장애·사용자/시스템 취소·알 수 없는 DB/DW 오류·쿼리 타임아웃·객체 부재·의미/타입 오류는 자동 재작성하지 않는다. `BadSqlGrammarException` 등 Spring의 넓은 예외 유형 하나만으로 재작성 가능 여부를 정하지 않는다. SQL 재작성 횟수는 최초 SQL 생성 뒤의 **추가 재작성**만 세며, 기본값은 3회다. **모델에 넘기는 재작성 피드백은 Hub 표준 오류 유형과 문제 위치(토큰·줄)만 담는다** — 호스트·포트·계정명·DB 이름·파일 경로·스택 트레이스와 DBMS 원본 메시지를 담지 않는다. **재작성하지 않는 오류**(연결·인프라 장애 등)는 사용자 응답과 모델 컨텍스트 모두에 agent 계약의 표준 문구만 보내고, 원본 예외는 운영 오류 이력에만 남긴다 — JDBC 연결 오류에는 접속 대상과 계정이 들어 있는 경우가 많다"
    source: "2026-09-28 사용자 결정(재작성 피드백 정제 기준·비재작성 오류의 표준 문구) 2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다"

    config: "`sys-config.agent.sql-regeneration.max-attempts`는 정수 0~5, 기본 3으로 관리한다. 변경은 배포 없이 저장 직후 **다음 재작성 판정**부터 적용하며, 진행 중 SQL 실행을 끊지는 않는다. 현재 턴에서 이미 쓴 재작성 횟수·적용 상한값·판정 시각을 각 판정에 남긴다"
    why: "DBMS마다 오류 코드와 SQL 방언이 다르므로 공통 예외 유형만으로는 재작성해도 되는 오류를 안전하게 가릴 수 없다. 반대로 SQL 오류를 무제한 재작성하면 같은 실패·토큰 비용·처리 시간이 반복된다"
    traces_to: [REQ-103, REQ-115]
    roadmap: RM-P1

# ── 질의 유형 · 결과 데이터 처리 · 재연결 ───────────────────
    summary: "재작성 가능한 SQL 오류만 정제해 전달하고 같은 실행 시도의 재작성 누계와 정책 검사를 유지한다"
    preconditions:
      - "REQ-103의 SQL 통제와 등록 데이터소스별 오류 분류 근거를 적용한다"
    data:
      - item: "DBMS/단계·표준 오류 유형·SQLState/공급사 코드·재작성 누계·판정 시 적용 상한값·시각·정제 피드백"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "공급사/버전별 확인 근거가 없거나 오류 정보가 상충하면 알 수 없는 오류로 처리하며 자동 재작성하지 않는다. 원본 메시지의 단어 또는 Spring 예외명만으로 SQL_SYNTAX를 추정하지 않는다"
      - "재작성된 SQL도 매번 현재 권한·카탈로그·정책·파라미터·실행 한도를 처음부터 검사한다. 이전 SQL의 통과 사실을 재사용하거나 차단 조건을 풀어 성공시키지 않는다"
      - "최초 SQL 생성은 재작성 횟수에 포함하지 않는다. 재작성용 모델 호출을 시작할 때 추가 재작성 1회를 사용하며 호출 실패도 누계에서 되돌리지 않는다. 같은 턴의 동일 실행 시도 안에서는 여러 SQL·오류 종류·계획 회차 변경이나 중간 성공으로 누계를 초기화하지 않는다"
      - "설정 0이면 자동 재작성하지 않는다. 상한을 낮춰 이미 사용한 누계 이상 여유가 없으면 다음 재작성을 막되 진행 중 실행을 끊지 않는다. 상향은 다음 판정에 적용하며 기존 누계를 유지한다"
      - "재작성 호출도 기존 모델 스텝·쿼터·정체 통제를 받고 여러 한도 중 하나라도 차면 후속 재작성을 하지 않는다. 새 턴/시도는 REQ-013의 현재 조건 검사를 따르며 자동으로 새 턴을 만들어 한도를 우회하지 않는다"
      - "모델 피드백은 표준 유형·안전한 위치 정보만 사용하고 문제 토큰에 비밀/개인정보/실제 값이 있으면 원문 토큰을 보내지 않는다. 원본 예외의 운영 이력도 기존 접근·비밀 비노출·마스킹 정책을 따른다"
    exceptions:
      - "권한/정책 거부·연결 장애·취소·타임아웃·객체 부재·의미/타입 오류·미확인 오류는 기존 표준 응답 경로로 종료한다"
      - "늦은 오류와 중단이 경합하면 현재 시도의 유효성을 검사하고 중단 뒤 새 재작성 모델 호출을 시작하지 않는다"
    lifecycle: "실패 기록 → 단계/DBMS 근거로 분류 → 현재 조건/누계 검사 → 정제 피드백 재작성 → 모든 SQL 통제 재검사 또는 종료"
    permissions: "재작성 모델·새 SQL 모두 현재 접근/조회 권한과 전송 통제 범위 안에서 수행한다"
    audit: "각 오류의 표준 분류·정제 근거·사용 누계·적용 상한값·판정 시각·실제 모델 호출은 REQ-107·115에 연결한다"
    risk: "넓은 예외명을 문법 오류로 간주하거나 회차마다 누계를 초기화하면 권한 우회·비용 반복·오류 원문 노출을 만든다"
    open:
      - "@defer P2 지원 DBMS/버전별 SQL_SYNTAX 분류 근거와 미확인 오류의 닫힌 기본값을 대조한다"
      - "@defer P3 재작성 누계 저장·설정 변경·중단 경합과 민감한 토큰/예외 정제 시험을 설계한다"
    verification:
      - "같은 Spring 예외라도 접근 거부·객체 부재·확인된 문법 오류를 구분한다"
      - "재작성 3회 소진 뒤 SQL/회차 변경으로 횟수를 초기화하지 않는다"
      - "0 설정·상한 하향·호출 실패·중단 경합에서도 추가 호출 조건을 검사한다"
