        case: "현재 대상과 입력에 연결된 유효한 구조화 분류가 검사를 통과하면 해당 변경 범위만 반영한다"
      - kind: "예외"
        case: "분류 한도/모델 오류 상태에서도 명시적 중단을 접수한다"
    volatility:
      level: "medium"
      what: "업무 경계는 유지하고 상세 메시지·저장·화면 계약은 소유 작업흐름의 후속 설계에서 정한다"
    volume: "기존 호출·문맥·보존·실행 한도를 따른다. 이 카드에서 새로운 고정 처리량을 약속하지 않는다"
    source: "2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    maturity:
      level: confirmed
