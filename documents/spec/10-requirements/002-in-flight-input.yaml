  - id: REQ-036
    type: functional
    priority: must
    category: "접수·개인 동시 한도"
    actors: [ACT-001, ACT-004]
    process_step: PRC-02-01
    title: "개인별 동시 실행 제한과 순서 대기·취소"
    detail: "Hub는 유효한 질의·사용자대기 응답과 page_requests의 원천 후속 페이지 요청을 접수하고, 개인 실행 한도가 차면 사용자별 실행 순서 대기에 영속 저장한다. 기존 실행의 종료나 사용자대기 전환으로 개인 실행 여유가 생기면 같은 사용자의 유효한 요청을 대기 등록 순서대로 자동 처리한다. portal은 개인 한도로 대기 중이라는 사유와 차례가 되면 자동 처리된다는 안내, 취소 버튼 또는 취소 가능한 카드를 제공한다. 서버 전체 한도와 사용자 간 공용 실행 순서 대기열은 두지 않는다"
    hard_rule: "개인 한도의 기본값·집계 대상은 NFR-023을 따른다. 순서를 기다리는 요청과 사용자대기는 실행 점유를 유지하지 않으며 개인 실행 한도에서 제외한다. 실행 대상으로 선택하는 순간 개인 한도를 원자적으로 확보하고, 시작 전 인계 구간과 처리 중을 중복 없이 집계한다. 동일 요청·응답의 재전송은 대기 항목·순번·개인 점유를 중복 생성하거나 기존 순서를 바꾸지 않는다. 같은 사용자의 앞선 유효 대기 요청을 새 요청이 추월하지 않는다"
    why: "개인 한도를 넘는 요청을 다시 입력하게 하지 않고 차례대로 처리하면서, 대기 이유와 취소 방법을 사용자가 알 수 있게 한다. 개인별 실행 제한과 멀티 인스턴스 중복 실행 방지를 유지한다"
    source: "2026-10-13 사용자별 순서 대기·자동 처리·취소, 저장 역할·짧은 잠금·중복 방지/복구를 포함한 전체 보완본을 확정했다. 2026-10-26 사용자 요청의 portal 결과 페이징을 연결해 원천 후속 페이지 요청의 개인 실행 집계·순서·해제 기준을 추가한다. 기본 한도·사용자 간 공용 대기열 없음은 유지하며 전체 보완본 재확정은 별도다"
    business_rules:
      - "대기 항목에는 원 요청 또는 유효한 사용자 응답과 기존 턴/시도·대기 카드의 연결을 보관한다. 신규 질의와 사용자대기 응답 모두 개인 대기 순서를 따르며, 이어가기는 기존 시도를 유지한다. 브라우저를 닫거나 재접속해도 서버의 순서 처리와 취소 결과는 유지한다"
      - "대기 취소가 시작보다 먼저 반영되면 실행 대상에서 제외하고 해당 시도를 기존 중단 규칙으로 끝내며 상태·감사를 기록한다. 시작이 먼저 반영됐다면 취소 성공으로 숨기지 않고 현재 상태와 기존 처리 중 중단 결과를 알린다. 이미 수행한 외부 업무의 취소·롤백을 보장하지 않는다"
      - "실행 차례가 되면 현재 권한·요청 유효성·취소 여부·기존 승인 유효 기한을 다시 확인한다. 만료·무효 요청은 실행하지 않고 기존 만료·재확인 규칙과 사유를 표시한다. 대기 때문에 승인·카드 유효 기한을 자동 연장하지 않는다. 신규 턴·새 시도의 시작 전 쿼터 검사와 이어가기의 호출별 재검사는 NFR-012를 따른다"
      - "접수 성공·순서 대기·실행 시작·종결을 구분한다. 실행 대상으로 선택한 뒤 인계에 실패하면 무한히 점유하지 않도록 실패/중단·감사·개인 집계 해제를 연결한다. 자리가 생겼을 때의 순서 처리는 클라이언트 폴링이나 재요청에 의존하지 않는다"
      - "모델·임베딩·DB·업무 API의 호출 제한·시간 초과·장애는 해당 호출 지점에서 NFR-020·021·022 등 기존 계약에 따라 처리한다. 허용된 경우만 정해진 한도 내 재시도하며, 업무 액션의 결과 불명을 자동 재전송하지 않는다"
      - "개인 한도와 대기 순서 판정은 모든 agent 인스턴스에서 같은 사용자 기준으로 성립한다. 개인 한도 확보와 같은 턴의 실행 점유를 각각 검사해 여러 요청의 한도 초과와 같은 턴의 중복 실행을 모두 막는다"
    summary: "개인 실행 한도가 차면 신규 질의·이어가기 응답·원천 후속 페이지 요청을 사용자별 순서에 보관하고 자동 처리하며 대기 안내와 취소를 제공한다"
    page_requests:
      scope: "NFR-002의 원천 후속 페이지 요청도 같은 사용자별 순서와 실행 제어에 접수한다. 보존 결과를 읽어 표시할 뿐 원천 호출이 없는 경우는 별도 원천 실행 점유를 만들지 않는다. 페이지 요청은 사용자대기 응답·원 턴 재개와 구분하며 아래 턴/시도 전이는 질의 처리 경로에 적용하고 페이지의 별도 상태/이력은 원 결과 참조와 연결한다"
      counting: "집계 대상/기본값은 NFR-023을 따른다. 원천 페이지 요청별 실행 선택/인계·처리 중 상태를 독립 현재 레코드로 연결하며 같은 원 턴의 여러 요청을 한 건으로 합치거나 종결 원 턴이라는 이유로 0건 처리하지 않는다. 동일 요청 재전송은 대기/개인 점유를 중복 생성하지 않는다"
      lifecycle: "신규 질의/이어가기와 같은 사용자별 순서·짧은 잠금·한도 확보·인계/실패 복구 규약을 적용한다. 차례가 되면 현재 권한·조회 기준·이어가기 기한·취소를 다시 검사하고 무효이면 조회하지 않는다. 대기 취소는 해당 페이지 요청만 취소하며 시작 뒤에는 해당 조회의 취소/실제 종료를 확인한다. 종결·실패·취소·만료 시 해당 점유만 한 번 해제하고 원 턴 상태나 다른 페이지 점유를 변경하지 않는다"
    intent:
      problem: "멀티 인스턴스에서 한도 집계·순서 선택·취소가 겹치면 한도 초과·중복 실행·대기 유실이 생길 수 있다"
      goal: "사용자별 순서와 실행 한도를 지키고 저장된 요청·응답을 재입력 없이 처리하며 실제 대기·취소 결과를 알린다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "인증된 사용자의 유효한 질의, 기존 시도·대기 카드에 연결된 유효 응답 또는 page_requests의 원천 후속 페이지 요청이다. 현재 권한·요청 계약과 해당 경로의 모델/조회 허용 범위를 검사한다"
      - "개인 실행 한도 설정과 공유 영속 상태를 모든 agent 인스턴스가 같은 기준으로 사용한다"
    data:
      - { item: "원 요청·이어가기 응답과 사용자·턴/시도·대기 카드 연결", origin: "사용자 입력과 기존 실행 상태", sensitivity: "업무·개인정보 포함 가능", retention: "REQ-107·109의 기존 보존·파기 정책" }
      - { item: "대기 순번·선택/취소/인계 상태·점유와 사용량 근거", origin: "agent의 접수·선택·실행·계량 처리", sensitivity: "사용자별 실행·사용량 정보", retention: "storage_design의 역할 구분과 기존 감사·사용량 보존 정책" }
    exceptions:
      - "중복 접수·같은 키의 다른 입력·취소/시작 경합·인계 실패·알림 유실은 concurrency_rules의 처리 기준을 따른다"
      - "권한 회수·승인/카드 만료·외부 호출 제한·결과 불명은 business_rules의 기존 통제와 오류 경로를 따른다"
    lifecycle:
      - { state: "접수·개인 순서 대기", next: ["실행 선택·인계", "취소·무효 처리"], note: "논리 흐름이며 물리 상태 코드는 P3에서 정한다. 대기열은 순서를 관리하고 감사 이력은 발생 사실을 보존한다" }
      - { state: "실행 선택·인계", next: ["처리 중", "실패·중단"], note: "선택 순간부터 개인 한도에 포함하며 인계 실패는 종결·감사·해제를 연결한다" }
      - { state: "처리 중", next: ["완료·실패·중단", "사용자대기"], note: "개인 점유를 해제하는 전이와 다음 요청의 자동 선택은 기존 업무 규칙을 따른다" }
      - { state: "사용자대기", next: ["응답 접수·개인 순서 대기", "만료·중단"], note: "실행 한도에서 제외하며 유효 응답은 같은 시도를 이어간다" }
    permissions:
      - "사용자는 본인의 요청·상태를 조회하고 취소한다. 현재 권한을 검사하며 요청 식별자만으로 다른 사용자의 상태·입력을 제공하지 않는다"
      - "운영 설정 변경은 REQ-614의 기존 관리자 권한·적용 규칙을 따른다"
    audit: "접수·순서 선택·한도 판정·취소·인계·시작·종결과 복구 근거를 storage_design의 감사 역할 및 REQ-107·108·109에 따라 남긴다"
    volume: "개인 실행 한도 기본값과 집계 대상은 NFR-023을 따른다. 사용자 수·대기량·처리량의 미확인 수치를 새로 정하지 않는다"
    config: "개인 실행 한도는 NFR-023·REQ-614의 기존 운영 설정으로 관리한다. 서버 전체 한도·사용자 간 공용 대기열 설정은 두지 않는다"
    risk: "현재 상태·대기열·사용량·감사의 역할을 혼동하거나 잠금 밖에서 개인 실행 수를 판정하면 중복 선택·점유 누수·이중 차감이 생긴다. concurrency_rules와 verification으로 검증한다"
    relations:
      depends_on: []
      constrains: [REQ-005, REQ-014, REQ-040, REQ-017]
      conflicts_with: []
      nfr: [NFR-012, NFR-015, NFR-020, NFR-021, NFR-022, NFR-023, NFR-027]
      interfaces: []
    realization:
      features: [FEAT-020, FEAT-102, FEAT-215, FEAT-216]
      screens: [SCR-515, SCR-101]
    volatility: { level: medium, what: "개인 한도는 운영 설정에 따라 달라진다. 저장 역할·동시성 기준은 유지하며 물리 구조와 복구 기한은 P3에서 구체화한다" }
    storage_design:
      principle: "아래는 구분해야 할 논리 저장 역할이다. 개인별 월 사용량 집계와 질의 처리 대기열은 별도 저장 구조로 관리하고, 나머지 역할의 물리 테이블 분리·결합은 P3에서 결정한다. 턴 이력만으로 매번 대기 순서·현재 실행 수를 복원하는 구조에 의존하지 않는다"
      roles:
        - { item: "개인별 월 쿼터 사용량 집계", content: "사용자·적용 월별 누적 사용량과 집계 근거를 보관한다. 호출별 사용량 원장으로 대조·재구축할 수 있어야 한다. 한도·귀속·검사 시점은 REQ-116·NFR-012·015를 따른다" }
        - { item: "호출별 사용량 원장", content: "호출·계량 이벤트 식별자, 사용자/시스템 귀속, 발생 시각, 토큰·비용, 공급자값/추정/미상 구분과 정정 근거를 보관한다. 원 기록을 덮어쓰지 않고 조정 근거를 연결하며 동일 이벤트를 월 집계에 중복 반영하지 않는다" }
        - { item: "사용자별 실행 제어", content: "사용자마다 실행 제어 행 1개를 두는 설계 기본안이다. 해당 행은 여러 agent 인스턴스가 같은 사용자의 순번 발급·실행 선택·한도 확보를 조정하는 공통 잠금 기준이며, 다음 발급 순번 등 발급 근거를 둔다. 월 쿼터 집계와 생명주기가 다르므로 실행 순서 제어를 월 사용량 행에 종속시키지 않는다" }
        - { item: "사용자별 질의 처리 대기열", content: "중복을 제거한 처리 요청마다 대기 항목 1개를 둔다. 사용자·턴/시도·신규/이어가기 구분, 접수 중복 방지 키, 대기 순번, 저장한 요청/응답 참조, 선택·취소·인계 상태를 보관하며 이 대기열에서 다음 처리 대상을 찾는다. 이어가기는 기존 시도·대기 카드와 연결한다" }
        - { item: "현재 턴·시도 실행 상태", content: "현재 업무 상태와 실행 담당 인스턴스, 점유 만료 시각, 이전 실행자의 쓰기를 막는 점유 토큰을 관리한다. 선택·인계 중과 처리 중인 현재 레코드가 개인 실행 수 집계의 근거다. 대기열의 배정 상태와 업무 상태의 대응·갱신 주체를 정해 서로 다른 두 현재 상태가 생기지 않게 한다(ARCH-070)" }
        - { item: "턴·스텝 감사 이력", content: "접수·선택·취소·인계·시작·종결 등 사건마다 발생 사실과 판정 근거를 추가 기록한다. 감사 이력을 매번 분석해 대기 순서나 다음 처리 대상을 결정하지 않는다. 현재 상태 요약과 불변 사건을 구별하며 접수/시작 시 생성·상태 갱신과 전이 사건의 동시 확정은 REQ-107.history_storage를 따른다. 외부 업무 트랜잭션과의 독립성·보존·조회는 REQ-107·108·109를 따른다" }
      selection_reference:
        purpose: "P3 상세 설계에서 사용자 제어 행·대기열·현재 상태·감사 이력을 구별해 구체화할 처리 예시다. 아래 순번과 상태 표현은 설명용이며 물리 필드명·상태 코드를 확정하지 않는다"
        example: "사용자 가의 제어 행은 1개이고 다음 발급 순번은 104다. 대기열에는 A=101(선택됨), B=102(대기), C=103(대기)가 각각 있다. 실행 여유가 생기면 유효한 B를 먼저 선택하며 제어 행에 질의 목록을 넣거나 감사 이력에서 다음 요청을 추론하지 않는다"
        steps:
          - "같은 사용자 가를 처리하는 모든 인스턴스는 동일한 제어 행 1개를 잠근다. 사용자 나는 별도 제어 행으로 조정하며 사용자 간 공용 순서를 만들지 않는다"
          - "잠금 획득 후 현재 레코드에서 선택·인계 중 및 처리 중인 요청 수를 중복 없이 집계해 개인 여유를 확인한다"
          - "여유가 있으면 해당 사용자의 대기열에서 등록 순번이 가장 앞선 유효 대기 항목을 찾는다. 취소·만료 등 무효 항목은 기존 규칙으로 처리한다"
          - "선택한 항목의 배정 상태와 개인 한도 확보에 필요한 현재 상태 변경 및 해당 전이 사건을 함께 커밋하고 잠금을 해제한다. 다음 인스턴스는 커밋된 선택 결과를 보고 중복 선택을 피한다"
          - "유효한 턴 점유·현재 권한·승인 등 실행 조건과 필수 기록을 확인한 뒤 외부 작업을 수행한다. 실제 처리·실패·종결은 기존 실행 및 감사 규약과 연결한다"
    concurrency_rules:
      - "사용자별 실행 제어 행에 짧은 DB 비관적 행 잠금을 적용하는 것을 설계 기본안으로 삼는다. 행 최초 생성도 사용자 유일 제약으로 경합을 처리한다. 잠금 획득 후 최신 커밋 상태로 개인 실행 수·대기 순서를 판정하며 오래된 조회/캐시 결과로 선택하지 않는다"
      - "개인 실행 수는 선택·인계 중 및 처리 중인 현재 레코드를 인덱스로 집계하는 방식을 우선한다. 별도 실행 수 카운터가 필요하면 상태와의 원자적 갱신·음수/중복 해제 방지·불일치 탐지·재집계 기준을 함께 설계한다"
      - "접수·순번 발급, 실행 선택·개인 한도 확보, 취소, 종결·사용자대기·만료에 따른 해제는 같은 사용자 잠금 규약과 일관된 잠금 순서를 따른다. 선택 시 여유 확인·앞선 유효 요청 선정·배정과 필요한 현재 상태 변경·전이 사건을 같은 짧은 트랜잭션으로 커밋한다"
      - "잠금 해제와 커밋 뒤 유효한 턴 점유·현재 상태·승인 조건을 확인해 외부 작업을 수행한다. LLM·임베딩·업무 API 호출이나 사용자 응답 대기 동안 DB 행 잠금 또는 @CustomLock을 유지하지 않는다. 긴 실행의 점유·만료·이전 실행자 차단은 ARCH-070을 따른다"
      - "@CustomLock은 기존 공통 유틸이지만 개인 제어 행을 잠글 수 있는 이 흐름에 자동 적용하지 않는다. 상세 설계에서 별도 적용이 필요하면 잠금 대상·트랜잭션 경계·충돌 정책·만료와 재진입 제약을 검토한다. 이 유틸을 턴 실행 점유의 대체 수단으로 삼지 않는다"
      - "동일 요청의 동시 접수는 서버 검사와 DB 유일 제약으로 한 번만 등록한다. 재전송은 기존 턴·대기 항목을 반환하며 순번을 다시 부여하지 않는다. 같은 키에 다른 입력이 오면 기존 입력을 덮어쓰거나 새 실행으로 해석하지 않고 계약 오류로 처리한다"
      - "실행 선택을 저장한 직후 인스턴스가 종료돼도 서버가 인계 미완료를 발견해 기존 실패/중단·감사 경로와 개인 집계 해제를 수행할 수 있어야 한다. 인계 복구와 기존 실행자의 시작이 겹치면 유효한 상태·점유 토큰을 가진 처리만 진행한다. 점유 만료 시도의 자동 재실행과 결과 불명 업무 API의 자동 재전송은 금지한다"
      - "종결·취소·만료·중복 알림·늦은 응답이 겹쳐도 해당 점유의 개인 한도 해제는 한 번만 반영한다. 늦은 호출 사용량·감사 사실은 원 시도에 기록하되 새 시도 상태나 개인 점유를 변경하지 않는다. 실행 자리 해제를 이미 발생한 토큰 사용량의 취소로 취급하지 않는다"
      - "접수/해제 알림 유실 또는 서버 재시작 뒤에도 서버가 영속 대기열과 인계 미완료를 다시 발견한다. 처리 가능한 요청을 무기한 방치하지 않으며, 중복 복구 실행도 같은 선택·해제 규약을 따른다. 감지 주기·복구 기한·알림 재전달 또는 재탐색 방식은 P3에서 확정한다"
      - "월 사용량 집계는 원장의 중복 방지·정정 근거와 연결해 갱신한다. 원장만 저장되거나 집계 응답이 유실된 경우도 탐지·대조·복구하며 중복 차감하지 않는다. 커밋된 사용량 검사와 토큰 선차감/예약 금지 등 기존 쿼터 정책은 유지한다(NFR-012·015)"
    acceptance: "개인 한도가 찼을 때 요청을 순서 대기로 접수하고 안내·취소 조작을 제공한다. 다른 턴의 종료 등으로 여유가 생기면 앞선 유효 요청부터 재요청 없이 처리하며 개인 한도를 넘지 않는다. 취소가 먼저 반영된 대기 요청은 실행되지 않고, 재접속과 다른 인스턴스에서도 동일한 순서·상태·취소 결과를 조회한다. 사용자 응답을 다시 입력시키지 않고 현재 시도를 이어가되 실제 실행 시점의 권한·승인 유효성을 검사한다"
    examples:
      - { kind: 정상, case: "개인 한도 3개를 실행 중일 때 새 질의 A와 B를 순서대로 접수한다. portal은 순서 대기와 취소 조작을 표시하고, 하나가 완료되면 A부터 자동 시작한다. 대기 중인 B는 개인 실행 한도에 포함하지 않는다" }
      - { kind: 정상, case: "추가 정보 응답을 받았으나 개인 한도가 찼으면 해당 응답을 저장하고 사용자별 순서에 넣는다. 차례가 되면 유효성을 다시 확인해 같은 시도를 이어간다" }
      - { kind: 예외, case: "B가 대기 중일 때 사용자가 취소하면 B를 실행 대상에서 제외한다. 취소와 시작이 겹치면 먼저 반영된 상태에 따라 대기 취소 또는 처리 중 중단으로 판정하고 결과를 표시한다" }
      - { kind: 예외, case: "실행 승인을 받은 뒤 개인 한도로 기다리는 동안 승인 유효 기한이 지나면 자동 실행하거나 기한을 늘리지 않고 기존 재확인·만료 경로로 안내한다" }
    verification:
      - { case: "개인 여유 1개에 여러 인스턴스가 서로 다른 요청을 동시에 선택", expected: "선택·인계 중을 포함해 추가 점유는 1개뿐이며 앞선 유효 요청이 선택된다. 다른 사용자의 진행은 공용 순서에 묶이지 않는다" }
      - { case: "같은 신규 요청 또는 같은 이어가기 응답의 동시 재전송", expected: "대기 항목·개인 점유가 늘거나 순번이 바뀌지 않는다. 신규 턴은 하나만 생성되고 이어가기는 기존 시도를 유지한다. 같은 키의 다른 입력은 거부한다" }
      - { case: "대기 취소와 실행 선택/시작의 동시 처리", expected: "취소가 먼저면 외부 실행 0건, 시작이 먼저면 기존 처리 중 중단 결과를 반환한다. 취소 성공과 실행 시작이 모순되게 확정되지 않는다" }
      - { case: "선택 커밋 직후 실행 인계 인스턴스 종료", expected: "서버가 미완료 인계를 발견하고 실패/중단·감사·점유 해제를 복구한다. 뒤늦은 이전 담당자는 실행하지 못하며 업무 API를 무조건 재전송하지 않는다" }
      - { case: "완료·취소·점유 만료·늦은 결과 또는 중복 해제의 경합", expected: "개인 점유는 한 번만 해제되고 음수가 되지 않는다. 새 시도 상태는 유지하며 이미 사용한 토큰과 이전 호출 사실은 보존한다" }
      - { case: "접수 또는 다음 요청 처리 알림 유실·서버 재시작", expected: "브라우저가 닫혀 있어도 영속 대기열을 재탐색해 설계한 복구 기한 내 다음 유효 요청을 처리한다. 복구 담당자가 여럿이어도 중복 선택하지 않는다" }
      - { case: "대기 중 권한 회수·승인/카드 만료 및 이어가기", expected: "무효 요청은 실행하지 않고 사유를 알린다. 유효한 저장 응답은 재입력 없이 같은 시도로 이어가며 신규 시작과 이어가기의 쿼터 검사 차이를 지킨다" }
      - { case: "같은 사용량 이벤트 재수신·원장 저장 후 집계 실패·늦은 계량 정정", expected: "월 집계에 중복 차감하지 않고 원장으로 대조·복구할 수 있다. 정정 근거와 월 귀속을 보존하며 실행 대기 순서·점유는 변하지 않는다" }
      - { case: "제어 행 최초 생성 경합·잠금 시간 초과·선택 트랜잭션 롤백", expected: "사용자 제어 행은 하나이며 대기 항목과 점유가 부분 반영되지 않는다. 재시도는 외부 부수효과를 반복하지 않고 잠금이 정상 해제된다" }
      - { case: "현재 실행 상태와 집계 불일치 또는 카운터 사용 시 오차 주입", expected: "기준 레코드로 불일치를 탐지·복구하며 복구와 신규 선택이 겹쳐도 개인 한도를 초과하거나 유효한 점유를 중복 해제하지 않는다" }
