    title: "사용자 질의 유형과 처리 경로의 명시"
    plan_execution_link: "이 카드의 작업 유형·요청 범위·업무 순서를 REQ-015의 구조화된 작업 계획에 표현하고 REQ-004의 DB 저장·현재 상태·반복 수행에 연결한다. composite_outcome의 최종 실패·부분 결과·재요청 통제는 그대로 유지하며 계획 저장을 새 실행 권한이나 자동 재개 허용으로 해석하지 않는다"
    detail: "agent는 먼저 요청 경로를 구분한다. 지식 불필요 직접 입력 가공·요약·검증·작성은 검색 성공 없이 처리하고 REQ-101의 AI 업무 연관성 판정과 감사 표식을 남긴다. 업무 데이터 조회·실행이나 등록 지식 안내가 필요한 단계는 사용자 질의를 바탕으로 사용 가능한 관련 지식을 검색하고, 검색된 지식의 일반 업무 설명·절차와 참조 매핑에서 구성한 허용 후보 및 매핑별 사용 설명를 모델에 제공해 필요한 작업을 선택하게 해야 한다. 카탈로그 후보는 REQ-303의 지식 직접 참조와 사용 가능한 인증 예제를 통한 간접 참조의 합산, 업무 API 후보는 REQ-608의 지식 연결, 커스텀 도구 후보는 REQ-303의 지식 직접 매핑을 기준으로 구성하며 도구의 노출·호출 조건은 REQ-612를 따른다. 처리 계획은 **지식 검색·요약**, **SQL·등록 조회 API 또는 등록된 조회 유형 커스텀 도구 기반 데이터 조회**, **등록 API·커스텀 도구의 액션 실행**, **LLM 없이 하는 결정적 데이터 가공·표현**, **사용자 요청·동의 자료의 LLM 가공/해석**, **사용자 제공 자료의 검증·작성** 중 하나 이상으로 구분한다. 복합 질의는 사용자 의도와 의존 순서에 따라 여러 유형의 단계를 하나의 계획에 함께 기록한다"
    independent_processing: "지식 검색이 불필요한 요청은 새 업무 기능을 사전 등록해야만 허용하는 방식으로 제한하지 않는다. 저연관성은 거부 대신 REQ-101의 감사 표식으로 남긴다. 요청 의도와 실제 스텝 유형·자료 출처는 REQ-107.audit_classification을 따른다. 내부 계산 검증·업무 규칙 검증·원본 대조를 구분하고, 원본 대조를 위해 시스템 데이터가 필요하면 그 단계부터 지식/조회 통제를 적용한다"
    consent_link: "직접 입력 제출 동의와 기존 결과 재전송 동의는 REQ-106을 따른다. 비업무 추정이 전송 동의를 대체하거나, 동의가 조회·액션 승인으로 확대되지 않는다"
    stages:
      - { name: "접수·분류·개인 한도", reqs: [REQ-009, REQ-015, REQ-036, REQ-038] }
      - { name: "맥락·지식·카탈로그 구성", reqs: [REQ-001, REQ-002, REQ-003, REQ-021, REQ-303, REQ-305, REQ-306, REQ-308] }
      - { name: "데이터 조회·결정적 가공·표현", reqs: [REQ-011, REQ-012, REQ-022, REQ-023, REQ-037, REQ-039, REQ-103, REQ-104] }
      - { name: "요청·동의 자료 LLM 처리", reqs: [REQ-039, REQ-106, REQ-111, REQ-112] }
      - { name: "액션 승인·실행", reqs: [REQ-017, REQ-026, REQ-105, REQ-113, REQ-114] }
      - { name: "응답·감사·사후 교정", reqs: [REQ-024, REQ-027, REQ-107, REQ-108, REQ-110, REQ-115] }
    lifecycle:
      - { name: "사용자 보강·변경·중단", reqs: [REQ-005, REQ-007, REQ-030, REQ-031, REQ-032, REQ-033, REQ-034, REQ-035] }
      - { name: "브라우저 이탈·재접속·수동 재시도", reqs: [REQ-013, REQ-014, REQ-016, REQ-019, REQ-040] }
      - { name: "대기·점유 만료와 상태 정리", reqs: [REQ-017, REQ-107, REQ-109], references: [ARCH-070, NFR-013, NFR-014, NFR-020, NFR-022, NFR-023] }
    hard_rule: "유형 판정은 데이터 접근·외부 모델 전송·도구 호출을 허용하는 근거가 아니다. 지식 검색은 활성 반영 세트만, 데이터 조회는 검색된 지식의 참조 후보와 현재 권한·카탈로그·API 계약만, 액션은 REQ-026의 명시적 승인만, LLM 해석은 REQ-039의 전송 정책을 각각 통과한 뒤에만 수행한다. 관련 지식을 확보하지 못한 새 업무 데이터 조회·실행 단계는 접근 가능한 전체 카탈로그·API·도구 목록을 대신 제공해 임의 조회·실행하지 않는다. REQ-025에 따라 질문을 구체화하도록 확인하거나 REQ-101·REQ-308의 존재 은닉·공통 안내·허용된 활성 지식 태그 안내로 처리한다. 지식 전체 열거·본문 일괄 요약은 처리 경로가 아니며 서버가 차단한다(REQ-112·REQ-308). 저장된 조회 실행은 LLM·턴을 만들지 않는 별도 경로(REQ-201~207)로 유지한다"
    why: "SQL 생성과 API 선택만으로는 지식 안내·결과 가공·분석 요청의 처리 책임과 통제 경계가 보이지 않는다. 유형을 먼저 드러내야 어떤 데이터를 어디까지 LLM에 보낼지, 어느 단계에서 사용자 확인을 받을지를 검토할 수 있다"
    acceptance: "지식 사용법 문의, SQL 조회, 등록 조회 API 호출, 승인 필요 실행, 차트용 집계, 결과 해석이 각각 단독·복합으로 들어왔을 때 계획에는 해당 유형과 순서가 기록되고, 유형 판정만으로 권한 없는 데이터·미등록 도구·미승인 액션·미허용 모델 전송이 발생하지 않는다 지식에 연결되지 않은 커스텀 도구는 그룹 권한이 있어도 후보로 주입·호출하지 않는다. 불명확한 업무 실행 순서는 확인하며 요청하지 않은 실행을 추가하지 않는다. 복합 작업의 최종 실패 시 독립 작업도 새로 시작하지 않고 사용자에게 계속 여부를 확인하며 완료·실패·미수행·결과 확인 중을 구분한다. 필수 결과가 없는 보고·발송과 결과 불명 실행의 재호출은 차단하고 스텝 상한을 자동 새 턴으로 우회하지 않는다. API·커스텀 도구는 각 매핑의 사용 설명을 함께 전달하며 설명이 연결 대상에서 분리되거나 지식 본문 언급만으로 후보가 추가되지 않는다."
    source: "2026-09-21 사용자 요구사항 재점검 — 사용자 질의 유형을 한 문서에서 관리 · 2026-10-08 사용자 요청: 기술적 구현 방식과 분리해 agent 업무 동작을 차례대로 한 건씩 검토한다. 같은 날 사용자 정정: 사용자 질의로 지식을 먼저 검색하고 그 지식에 매핑된 카탈로그·업무 API 도구 후보를 전달해 모델이 선택하는 흐름을 확인했다. REQ-303·REQ-608과 맞지 않던 지식 무결과의 독립 조회·실행 문구를 바로잡은 검토안이며 전체 카드 확정 전 · 같은 날 사용자 보완 요청: 커스텀 도구 지식 매핑·업무 실행 범위·복합 부분 실패를 보완하고 변경 요구사항을 재검토 상태로 전환한다. 최종 실패 시 독립된 나머지 작업도 중단하고 계속 여부를 확인하는 안을 선택했으며 전체 카드는 재확정 대기 · 2026-10-08 사용자가 변경된 요구사항 전체의 확정·커밋·푸시를 명시 요청하여 보완본을 confirmed로 기록"
    roadmap: RM-P1
    summary: "요청을 지식 필요 경로와 직접 입력 등 지식 불필요 경로로 구분하고 복합 계획의 각 단계에 권한·실행 승인·데이터 전송 동의·감사를 적용한다"
    intent:
      problem: "요청에 조회·가공·해석·실행이 섞이면 필요한 근거와 순서, 데이터 사용 범위와 사용자 승인을 구분하기 어렵다"
      goal: "사용자의 의도에 맞는 작업 유형과 처리 순서를 정하고 각 작업의 기존 통제를 적용한다"
      not:
        - "이 카드로 프레임워크·저장 구조·내부 호출 방식이나 통신 스키마를 확정하지 않는다"
        - "유형 판정은 권한 부여나 실행 승인이 아니며 모든 요청을 하나의 유형에만 넣지 않는다"
        - "계획 확인을 모든 질의에 강제하거나 등록되지 않은 실행 기능을 만들어 호출하지 않는다"
        - "보고서 요청만으로 서버 파일 생성·첨부 기능을 추가하지 않는다. 텍스트 서술은 REQ-039, 내보내기는 REQ-011·NGOAL-10, 등록 업무 기능의 실행은 해당 계약을 따른다"
        - "지식 검색이 무결과라는 이유로 사용자에게 허용된 전체 카탈로그·API·도구를 탐색 후보로 열지 않는다"
