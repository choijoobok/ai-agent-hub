    decider: "제품 오너(사용자)"
    preconditions:
      - "인증된 사용자의 자연어 요청과 사용할 수 있는 대화 맥락을 접수한다. 접수 자격·개인 한도는 REQ-036·REQ-103을 따른다"
      - "사용 가능한 관련 지식을 검색하고 그 지식의 직접·간접 카탈로그 참조와 연결 업무 API·커스텀 도구를 후보 근거로 삼는다(REQ-303·REQ-608·REQ-612). 후보·참조 도구는 각각 현재 권한과 활성·계약 검증을 통과해야 한다(REQ-103·REQ-305·REQ-306·REQ-612)"
      - "질의 해석과 불확실한 조건의 확인은 REQ-015·REQ-025, 계획 표시와 확인 조건은 REQ-022·REQ-023을 따른다"
    data:
      - { item: "사용자 질의와 필요한 대화 맥락", origin: "사용자 입력과 기존 턴 기록", sensitivity: "업무·개인정보가 포함될 수 있는 사용자 입력", retention: "REQ-107·REQ-109의 기존 이력·보존 정책" }
      - { item: "처리 가능 근거: 검색된 활성 지식과 그 지식에 연결된 사용 가능 예제·카탈로그·업무 API 및 직접 매핑된 커스텀 도구", origin: "지식의 참조 매핑과 현재 접근·활성 판정", sensitivity: "사용자별 접근 제한 정보 — 비밀 원문 제외", retention: "각 관리 자산의 기존 버전·이력 정책" }
