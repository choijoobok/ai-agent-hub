  - id: REQ-034
    type: functional
    priority: must
    category: "중단·스트리밍"
    actors: [ACT-001]
    title: "모델 스트리밍과 구현체별 변경·중단 제어"
    detail: "운영 API의 모델 응답은 스트리밍 수신을 기준으로 한다. 개발 CLI는 스트리밍·취소 지원 능력에 맞는 제어 경로를 사용하되 REQ-007의 사용자 변경 절차와 결과 의미를 유지한다. 스트리밍은 응답을 나누어 받는 방식이며 이미 보낸 프롬프트를 수정하는 수단이나 질의 변경 기능의 필수 전제는 아니다. 변경은 REQ-007.model_change_contract의 같은 실행 유지·공급자 자동 후속·Hub 종료 후 새 요청 중 검증된 경로로 처리한다. 스텝은 응답 실행 경계로 식별하며 스트리밍 조각이나 연결 재사용으로 결정하지 않는다"

    note: "모델 스트리밍과 portal의 비동기 폴링은 별개다. 진행·시간·변경 반영 표시는 REQ-006·007·040의 실제 서버 기록을 근거로 하며 모델 청크를 그대로 표시하지 않는다. 개발용 대체 경로가 운영 API의 스트리밍·실제 취소·계량·동시성 시험을 면제하지 않는다(CON-033·034) 실행 식별·개입 사건·계량 단위의 정규화는 REQ-107을 따르고 필수 공급자 지원은 REQ-007.provider_support를 따른다"

    hard_rule: "구현체는 스트리밍 수신 중단·API 클라이언트 취소·CLI 프로세스 종료 등 지원 수단과 종료 결과를 공통 계약으로 제공한다. 취소 미지원/실패면 원 호출의 유한 타임아웃·정체 제한 안에서 종료를 기다리고 무효 응답을 적용하지 않는다. 로컬 호출/프로세스 종료만으로 공급자 생성 종료·토큰 절감/환불을 단정하지 않는다. 청크가 없거나 비스트리밍 응답 대기 중이어도 입력 접수·점유 갱신·변경/중단 전달은 호출과 독립된 제어 경로에서 수행한다 변경 기능은 지원 방식·실제 적용/후속 시작·실행 식별·누적 계량 범위를 공통 계약으로 제공한다. 자동 후속을 접수한 뒤 중복 재요청하지 않으며 사전 통제와 유실/복구는 REQ-007.model_change_contract를 따른다"

    provider_reference:
