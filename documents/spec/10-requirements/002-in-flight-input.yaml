    title: "재접속 시 기존 대화의 상태·결과·유효 조작 복원"
    detail: "브라우저 종료·새로고침·네트워크 단절·로그아웃 뒤 같은 사용자가 유효한 인증으로 portal에서 기존 대화 세션을 열면, 서버에 저장된 현재 상태를 조회해 같은 턴·시도의 화면을 복원한다. 접수·개인 순서 대기·실행 인계·처리 중·사용자대기·종결 상태를 구분하고 REQ-006의 실제 처리 이력·작업별/턴 누적 시간과 보존 정책상 조회 가능한 결과, 현재 유효한 사용자 조작을 표시한다. 삭제된 대화는 자동 복원하지 않는다"
    hard_rule: "재접속·상태 조회 자체는 새 LLM 연결·도구 호출·승인·재시도·실행 점유 획득/갱신·대기 순서 재등록·만료 연장을 만들지 않는다. 브라우저 종료를 중단 요청으로 해석하지 않는다. 서버의 기존 실행·순서 대기·만료/점유 회수 처리는 독립적으로 계속되며, 재접속으로 그 실행을 중복 시작하지 않는다. 현재 인증과 소유권·접근 권한을 서버에서 검사한다"
    source: "2026-09-21 브라우저 종료 뒤 기존 턴 재연결 요구. 2026-10-13 사용자 요청으로 016의 서버 처리 지속성과 040의 화면 복원 책임을 구분하고, 006 통합 표시·036 순서 대기·019 초기 조회·109 보존/삭제에 연결해 만료/응답 경합·여러 탭·다중 인스턴스·검증 기준을 보완했다. 같은 날 사용자 명시 승인으로 전체 보완본을 확정했다. 상세 설계·실행 검증은 후속이다 2026-10-14 사용자 검토 제안으로 대화 메시지 시간순 표시·새 턴 재시도·원본/재시도 양방향 참조를 연결했다. 같은 날 사용자 명시 요청으로 REQ-013과 연관 변경 6건의 전체 보완본을 함께 확정했다. 2026-10-26 사용자 요청으로 승인 대기 고정 진입점·현재 승인 패널·질문/보류와 카드 교체 경계를 보완했다. 이어 사용자가 보완 때문에 재확정 대기로 돌아간 요구사항의 재확정을 명시 요청하여 REQ-040 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·구현 승인은 별도다."
    why: "서버 처리와 화면 연결의 수명이 다르므로 사용자가 돌아왔을 때 저장된 현재 사실과 유효 조작을 복원해야 한다. 화면 복원을 실행 재개로 취급하면 중복 실행·승인 우회가 생기고 초기 본문 범위 밖의 미종결 턴을 별도로 안내하지 않으면 진행 중인 작업을 놓칠 수 있다"
    summary: "기존 대화의 화면을 현재 서버 상태로 복원하고 실행 중복·만료 카드 재사용을 막는다"
    intent:
      problem: "화면 이탈 뒤 진행 상황과 결과를 찾기 어렵거나 오래된 카드·클라이언트 상태로 실행을 중복할 수 있다"
      goal: "현재 권한 아래에서 기존 턴 상태·이력·시간·허용 결과와 유효 조작을 복원한다"
    goal_trace: [GOAL-1, GOAL-2, IN-02, IN-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "유효한 인증으로 본인 대화에 접근한다. 로그인 만료 시 재인증한 뒤 조회하며 다른 계정의 이전 화면/캐시를 재사용하지 않는다"
      - "서버 접수 여부·식별과 실행 지속성은 REQ-016, 현재 상태와 이력은 REQ-009·107·108·109를 따른다"
    responsibility:
      execution: "화면 이탈 뒤 실행·대기·종결·인증/권한 경계와 서버 장애 처리는 REQ-016 및 기존 턴 수명주기가 소유한다. 040은 새 실행 정책을 정의하지 않는다"
      display: "진행·공개 이력·시간의 표시/계산·폴링 응답 순서/중복 방지는 REQ-006을 따른다. 040은 대화를 다시 열 때의 조회 범위·복원 순서·현재 유효 조작을 연결한다"
      actions: "개인 대기/취소는 REQ-036, 사용자 입력/승인은 원 카드 계약, 명시적 중단 후 새 시도는 REQ-013, 보존/삭제는 REQ-109를 따른다. 복원은 이 조건을 바꾸지 않는다"
    retention_link: "턴 종결 뒤에도 결과 사본은 REQ-107의 원래 기한까지 남아 재접속/최종 폴링으로 조회한다. 현재 권한·마스킹을 재확인하고 조사 보호만으로 일반 화면 조회 기한을 연장하지 않는다. 상태·시간·처리 이력은 REQ-107.history_storage와 각 감사 보관 정책을 따르며 결과 원문 만료와 함께 사라지는 것으로 해석하지 않는다"
    restoration:
      order: "현재 인증·소유권·대화 삭제 여부를 확인하고 최신 턴/시도 상태와 허용 이력·시간·결과·유효 조작을 조회한 뒤 화면을 구성한다. 캐시나 브라우저 저장값만으로 응답/승인/취소 버튼을 활성화하지 않는다. 서버 상태를 확인할 수 없으면 마지막 확인 상태 또는 조회 불가임을 구분한다"
      initial_scope: "대화 본문은 REQ-019의 최신 메시지 묶음과 역방향 메시지 페이징으로 복원한다. 이전 미종결 턴은 현재 상태·유효 조작과 해당 입력/응답 메시지로 이동하는 수단을 제공한다. 원 질의와 연결된 새 턴은 각각의 진행/종결 상태·시간·메시지를 복원하고 양방향 관계를 유지한다. 새 턴 결과로 원본 응답을 덮거나 위치를 옮기지 않는다"
      query_list: "REQ-014의 현재 세션 전체 사용자 질의 목록·상태/중단 표시·응답 레이어·새 턴 요청/즐겨찾기 등록 조작을 복원한다. 본문 페이지 밖 질의도 탐색하고 모든 상태의 명시적 재요청은 REQ-013, 등록은 REQ-201을 따른다. 목록 항목 클릭은 연결 응답 레이어만 열며 본문 원본 위치로 이동하지 않는다. 목록/레이어 조회로 본문 로드 구간·조회 경계·스크롤 위치를 바꾸지 않고 조회/복원만으로 새 턴·모델 호출·등록을 만들지 않는다"
      selection: "이전 미종결 안내에서 턴을 선택하면 같은 대화·턴의 현재 상태를 다시 검사해 해당 상세를 조회한다. 선택 전에 종결됐으면 최신 종결 결과를 보여주고 만료/삭제/권한 회수는 해당 안내로 처리한다. 선택 때문에 새 실행이나 대기 카드가 생기지 않는다"
      queued: "접수·개인 순서 대기에는 REQ-036의 대기 사유·자동 처리 안내·취소 조작을 복원한다. 기존 대기 항목과 순서를 유지하고 개인 한도를 새로 확보하거나 브라우저 조회가 있어야만 시작되게 만들지 않는다. 이미 선택/인계/실행됐다면 현재 상태에 맞는 중단 계약을 적용한다"
      running: "현재 작업·공개 상세 이력·시간 카운트·턴 누적 처리 시간·허용 부분 결과를 REQ-006으로 복원한다. 새로 열린 화면의 시각부터 시간을 다시 세지 않는다. 상태별 폴링으로 최신 상태를 이어서 조회한다"
      approval_access: "REQ-005.approval_presentation의 입력창 위 승인 대기 영역과 현재 요청 상세 패널을 서버 상태로 복원한다. 본문 페이지 밖 요청도 요청 단위로 찾고 질문/보류·거절 후 재승인·변경값 준비·승인 접수 후 순서 대기를 구분한다. 오래된 패널 선택은 최신 상태를 확인하며 교체된 카드의 승인을 최신 카드로 옮기지 않는다. 구체 화면 동작과 과거 응답 읽기 전용 경계는 005·014, 질문/재승인과 기한은 017·026을 따른다."
      waiting_user: "현재 시도·회차에서 아직 유효한 원 대기 카드와 원래 기한만 복원한다. 이미 응답/무효화/만료된 카드를 활성화하거나 새로운 승인을 대신 생성하지 않는다. 사용자가 실제 응답을 제출한 경우에만 기존 응답 접수·개인 순서/한도·이어가기 규칙을 적용한다"
      terminal: "완료·실패·중단의 결과·사유·시간을 보존 정책에 따라 표시하고 종결된 원 턴을 되살리지 않는다. 각 원 질의의 명시적 새 턴 요청은 모든 상태에서 REQ-013의 현재 조건으로 제공한다. 이전 실행의 결과 불명은 새 질의 접수 차단과 구분해 execution_boundary의 실제 실행 확인 경로를 따른다. 화면 복원만으로 실행/결과 확인 호출을 보내지 않는다"
      unavailable: "REQ-107.retention_policy의 기한 경과·파기 또는 마스킹 사본 생성 불가로 결과 원문을 조회할 수 없으면 그 사실과 남아 있는 허용 상태/이력만 보여준다. 삭제된 대화는 목록·직접 접근에서 복원하지 않으며 결과를 채우기 위해 LLM/도구를 재호출하지 않는다"
      multiple_instances: "재접속 요청이 원 실행 인스턴스와 달라도 공용 영속 상태와 동일한 조회 계약으로 복원한다. 브라우저 연결이나 특정 인스턴스 메모리를 실행 상태의 유일한 원천으로 사용하지 않는다"
    concurrency:
      read_then_action: "상태 조회와 사용자 조작 사이에 완료·만료·취소·권한 변경이 발생할 수 있다. 카드가 화면에 보였다는 사실은 실행 허가가 아니며 제출 시 서버가 현재 턴/시도/회차·카드 식별·상태·기한·권한을 다시 확인한다. REQ-009·033·036 및 기존 상태 규칙으로 선후와 중복을 판정한다"
      multiple_tabs: "여러 탭/기기에서 같은 턴을 조회해도 실행·점유·대기 항목이 늘지 않는다. 같은 카드에 대한 중복 또는 서로 다른 응답이 경합하면 유효한 응답 하나만 기존 조건부 접수 규약으로 반영한다. 나머지는 이미 처리됨/현재 상태를 반환하고 무조건 재전송하지 않는다. 다른 화면은 다음 조회에서 최신 상태로 맞춘다"
      stale_responses: "REQ-006의 응답 순서·중복 규칙으로 이전 조회가 현재 상태·시도·시간·카드를 되돌리지 못하게 한다. 다른 대화/계정으로 이동한 뒤 도착한 응답을 현재 화면에 붙이지 않는다. 조회 응답이 유효해도 카드 제출 시 재검사를 생략하지 않는다"
    business_rules:
      - "화면 복원과 유효 사용자대기 응답 후 이어가기, 중단 후 명시적 새 시도를 구분한다. 재접속 과정에서 자동 응답·자동 승인·임의 재시도를 만들지 않는다"
      - "상태·시간·카드의 공개 필드와 마스킹·현재 권한은 REQ-006·016 및 기존 보안 규칙을 따른다. 복원 편의를 위해 과거 권한 스냅샷을 현재 접근 허가로 사용하지 않는다"
      - "원 접수 응답이 유실돼 턴 식별을 모르는 경우 REQ-016.admission의 기존 요청 확인/중복 방지 계약으로 확인한다. 조회 실패를 미접수로 추정해 새 질의를 자동 제출하지 않는다"
    polling:
      policy: "처리/대기/종결 상태별 조회·중지/재시작·최종 이력 수신은 REQ-006을 따른다. 최신 메시지 묶음에 표시된 턴이 모두 종결돼도 이전 미종결 요약의 갱신 필요를 함께 판단하며 상세/요약 조회 범위·주기는 P3에서 정한다"
      failure: "일시 통신 실패는 턴 실패·중단으로 표시하지 않는다. agent 문구를 받지 못한 통신/표시 오류는 ARCH-019.local_failure에 따라 portal의 등록 메시지로 안내하며 업무 판정·승인 상태·기한은 바꾸지 않는다. 마지막 확인 상태/시간과 조회 실패를 구분하고 재조회한다. 인증 만료·권한 회수·세션 삭제·지원하지 않는 계약 버전은 일시 오류와 구분해 기존 안내/접근 차단을 적용한다"
    data:
      - { item: "대화·턴·시도·회차 식별, 현재 상태와 미종결 턴 요약", origin: "공용 DB의 현재 실행 상태·대기 항목·턴 이력", sensitivity: "본인 대화의 현재 권한으로 공개 가능한 필드", retention: "REQ-107·108·109의 기존 정책" }
      - { item: "공개 처리 이력·시간 기준·보존된 결과·원 카드/기한·허용 조작", origin: "REQ-006 표시 계약과 기존 카드/결과 저장", sensitivity: "서버의 공개 필드 선별·마스킹 적용", retention: "원 데이터의 보존·삭제 정책" }
    exceptions:
      - "조회와 제출 사이의 만료·종결·다른 탭 응답은 현재 상태를 기준으로 판정하고 오래된 조작을 거부한다"
      - "기한이 지났거나 안전한 사본이 없는 결과·삭제된 대화·권한 회수는 restoration.unavailable과 기존 보안/보존 정책을 따른다"
    lifecycle:
      - { state: "기존 대화 열기", next: ["인증/접근 확인", "조회 불가 안내"], note: "새 실행을 만들지 않는다" }
