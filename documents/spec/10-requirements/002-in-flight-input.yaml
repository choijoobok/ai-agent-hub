# 영역: 처리 중 입력·턴 수명주기
requirements:
# ── 처리 중 입력의 세 갈래 ──────────────────────────────────
  - id: REQ-030
    type: functional
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "세 갈래 분기 — 변경 · 별개 · 중단"
    detail: "① **변경**(`AMEND`) — 조건·범위·기간·지표·표현·실행 의도를 바꾸거나 철회한다. **보강과 교정을 구분하지 않는다.** 변경 항목과 이미 수행한 단계의 의존성을 기준으로 무효화 시작 단계를 판정하고, 그 지점부터 다시 수행한다. 무효화할 단계가 없으면 같은 처리 흐름을 이어간다. ② **별개**(`NEW`) — 진행 중 턴은 그대로 두고 별도 턴으로 접수한다. ③ **중단**(`STOP`) — REQ-007의 호출별 취소/결과 확인과 후속 차단을 거쳐 중단한다"
    why: "보강과 교정의 경계는 자연어만으로 안정적으로 가를 수 없다. **의미 꼬리표가 아니라 어떤 단계가 더 이상 유효하지 않은지가 실행을 결정한다.**"
    hard_rule: "입력 종류·대상·현재 상태 검사는 REQ-007을 따른다. 명시적 STOP은 LLM 분류 없이 즉시 처리한다. AMEND 반영이 확정되면 영향받는 결과와 후속 실행을 차단하고 REQ-007.change_policy의 단계별 정책을 적용한다. 모델은 REQ-007.model_change_contract의 같은 실행 유지·공급자 자동 후속·Hub 종료 후 새 요청을 구분하고, DB 조회는 원 조회 종료 확인 후 새 조회로 처리하며 무관한 진행 호출은 유지한다. 이전 체크포인트를 무효화하면 revision을 올리고, 이후 단계만 바뀌면 같은 revision을 이어간다. 전송된 상태 변경 실행은 원 사실/결과를 유지하고 미전송 변경 범위를 확인·재승인받는다. 개별 호출 취소를 턴 전체 중단으로 바꾸지 않으며 이력·사용량은 REQ-107, 사용자 표시는 REQ-006을 따른다"

    traces_to: [REQ-007, REQ-034]
    summary: "입력 종류와 대상을 먼저 확인한 뒤 변경·별도 요청·중단을 각 실행 경계에 맞게 반영한다"
    preconditions:
      - "REQ-007의 입력 종류·대상 확인을 통과한 일반 입력에 분류를 적용한다"
    data:
      - item: "입력 식별/순서·대상 턴/시도·변경 항목·무효화 범위·전송/완료 사실"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "유효 카드 응답은 REQ-005, 승인 전 질문·보류와 별도 질문 턴은 REQ-017을 따른다. 자연어 동의·질문 답변을 최종 실행 승인이나 원 건 변경으로 소비하지 않는다"
      - "명시적 중단은 REQ-007의 직접 경로로 처리하며 분류 모델의 응답을 기다리지 않는다. 대상이 여럿이면 최근 턴이나 모든 턴을 임의로 선택하지 않는다"
      - "변경은 같은 턴/시도의 영향받는 계획·결과·미전송 작업만 무효화한다. 완료·전송한 업무 사실은 보존하고 되돌릴 수 있다고 가정하지 않는다"
      - "계획 회차 변경을 실제 모델 스텝 생성으로 세거나 같은 시도의 사용량·스텝 예산 초기화로 사용하지 않는다"
    exceptions:
      - "종결·점유 상실·더 최신 변경/중단 뒤 도착한 분류는 현재 조건을 재검사하고 오래된 변경을 반영하지 않는다"
    lifecycle: "입력/대상 확인 → 분류 또는 직접 중단 → 필요 의도 확인 → 현재 상태 재검사 → 유효 범위만 반영"
    permissions: "입력 접수와 상태 변경 시 현재 소유권·권한·승인 경계를 REQ-007·105로 검사한다"
    audit: "분류 제안과 실제 반영·거부·무효화 결과를 구분해 REQ-107에 연결한다"
    config: "분류 입력·확인 방식·제어 이벤트는 REQ-031~035, 한도는 기존 NFR을 따른다"
    risk: "질문을 변경으로 소비하거나 전송한 업무를 지우면 사용자 의도와 실행 사실이 달라진다"
    open:
      - "@defer P3 입력 경로 분리·변경 범위·현재 상태 재검사와 경합 시험을 설계한다"
    verification:
      - "승인 대기 중 수량 5개의 가격 질문과 원 주문을 5개로 바꾸라는 지시를 구분한다"
      - "출력 형식만 바꾸면 영향 없는 조회를 유지한다"
      - "대상 여러 개·이미 전송된 액션·늦은 분류 결과를 임의 변경/취소로 처리하지 않는다"
    intent:
      problem: "보강과 교정의 경계는 자연어만으로 안정적으로 가를 수 없다. **의미 꼬리표가 아니라 어떤 단계가 더 이상 유효하지 않은지가 실행을 결정한다.**"
      goal: "입력 종류와 대상을 먼저 확인한 뒤 변경·별도 요청·중단을 각 실행 경계에 맞게 반영한다"
    goal_trace:
      - "GOAL-1"
    decider: "제품 오너(사용자)"
    relations:
      depends_on: []
      constrains:
        - "REQ-005"
      conflicts_with: []
      nfr: []
      interfaces: []
    realization:
      features:
        - "FEAT-105"
        - "FEAT-216"
      screens:
        - "SCR-101"
    examples:
      - kind: "정상"
        case: "사용자가 원 조회의 출력 형식만 변경하면 영향 없는 조회는 유지하고 표현 단계만 다시 수행한다"
      - kind: "예외"
        case: "대상 여러 개·이미 전송된 액션·늦은 분류 결과를 임의 변경/취소로 처리하지 않는다"
    volatility:
      level: "medium"
      what: "업무 경계는 유지하고 상세 메시지·저장·화면 계약은 소유 작업흐름의 후속 설계에서 정한다"
    volume: "기존 호출·문맥·보존·실행 한도를 따른다. 이 카드에서 새로운 고정 처리량을 약속하지 않는다"
    source: "2026-10-26 사용자 요청으로 system 외 미확정 요구사항을 권장안대로 보완했다. 내용 보완·커밋/푸시 위임이며 카드 최종 확정·단계 게이트·소스 구현 승인은 별도다"
    maturity:
      level: confirmed
      at: "2026-10-27"
      by: "AI — 사용자 명시 확정 반영"
      confirmed_by: "사용자 (2026-10-27 검토·확정 대상 18건 확정 처리 요청). REQ-030의 최신 전체 보완본을 확정했다. 흐름도 대조·상세 설계·검증 후속은 유지하며 단계 게이트·소스 구현 승인은 별도다."

  - id: REQ-031
    type: functional
    process_step: PRC-02-01
    priority: must
    category: "처리 중 입력"
    actors: [ACT-001]
    title: "변경 영향 판정은 LLM 분류 + 사용자 확인"
    detail: "자연어 입력을 규칙만으로 가르는 것은 신뢰할 수 없으므로, LLM은 `AMEND`·`NEW`·`STOP`의 분류와 함께 **변경 항목·추가/교체/철회 연산·무효화 시작 단계**를 구조화해 제안한다. 분류는 보조 판정 역할이며 REQ-602의 관리자 지정 후보 순서와 한정된 일시 장애 대체를 적용한다. 명시적 `STOP`은 분류하지 않는다"
    hard_rule: "분류·변경 영향은 모델의 제안이고 실제 반영은 REQ-007에 따라 agent가 현재 상태·권한·승인으로 검증한다. 판단이 서지 않으면 REQ-032의 확인 경로로 보내며 임의의 변경이나 중단 확정으로 처리하지 않는다. 대상 미정이면 기존 턴을 임의 정지하지 않고 먼저 대상을 확인한다. 확인 문구에는 대상·변경 내용과 무효화되어 다시 처리할 범위를 함께 제시한다"
    prompt_contract: "분류 출력 스키마·AMEND/NEW/STOP 제어 값·필수 필드는 소스 계약으로 관리한다. agent가 분류 스텝 유형에 맞는 템플릿·허용 공통 지침·입력을 조합하며 운영 편집으로 통신 계약을 바꾸지 않는다(REQ-610)"
    open:
      - "@defer P3 REQ-610에 따라 분류 스텝의 템플릿·입력 변수·출력 스키마 조합을 상세화한다"
      - "@defer P3 — ARCH-033.classification_budget의 사용자 승인 전용 상한·시도별 스텝과 사전 이중 검사·실제 실행/사용량 단일 귀속·소진 시 명시 선택을 물리 저장/경합/화면 계약으로 연결한다"
    classification_budget: "2026-10-27 사용자 승인: 턴별 전용 상한과 적용·소진 처리는 ARCH-033.classification_budget이 정본이다. 실제 분류는 시도별 전체 스텝에도 포함하고 새 턴 자동 생성으로 우회하지 않는다. 명시적 중단은 분류 예산을 기다리지 않는다"


    traces_to: [REQ-007]
    summary: "분류 모델의 구조화 제안을 입력·대상·당시 상태에 연결하고 반영 직전 유효성을 검사한다"
    preconditions:
      - "REQ-007의 대상 확인과 REQ-035의 최소 입력 구성을 적용한다"
    data:
      - item: "입력 식별/순서·대상 턴/시도·분류 당시 상태/계획 근거·구조화 제안·모델 실행/사용량"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "분류 결과를 입력 식별자·순서와 대상 턴/시도·분류 당시 계획/상태 근거에 연결한다. 반영 직전에 현재 상태·더 최신 입력·회차·권한·승인을 다시 검사한다"
      - "형식 오류·필수 필드 누락·모델 실패·판단 불명은 임의의 변경/별도 요청/중단으로 보정하지 않고 REQ-032의 확인 경로로 연결한다"
      - "모델 제안은 실행 승인이나 중단 확정이 아니다. 같은 입력의 재전송·늦은 분류로 새 턴 또는 변경 효과를 중복 생성하지 않는다"
      - "실제 분류 모델 실행과 사용량은 REQ-107 및 NFR-010·012·013에 귀속한다. 재분류·회차 변경으로 같은 시도 예산을 초기화하지 않으며 한도 도달 때 무한 분류하지 않는다"
      - "명시적 중단 접수와 후속 차단은 분류 호출 또는 분류 한도를 기다리지 않는다"
    exceptions:
      - "모델 응답이 도착하기 전에 대상이 종결되거나 더 최신 입력이 적용되면 기존 제안을 그대로 적용하지 않는다"
    lifecycle: "유효 입력 구성 → 분류 실행·기록 → 구조 검증 → 현재 조건 재검사 → 반영 또는 확인 경로"
    permissions: "분류 결과가 대상 접근 권한·도구 정책·승인 검사를 대체하지 않는다"
    audit: "분류 입력의 근거 참조·제안·채택/거절 이유와 실제 모델 사용량은 REQ-107·109로 연결한다"
    auxiliary_fallback: "분류 공급 경로의 일시 장애는 REQ-602의 보조 후보 정책만 적용한다. 후보별 실제 분류 실행도 ARCH-033.classification_budget과 전체 스텝 예산에 포함하며 후보 이동으로 한도를 초기화하지 않는다. 명시 중단·대상 확인에는 대체 분류 호출을 만들지 않는다"
    config: "분류 모델 선택은 REQ-602·610을 따르고 전용 분류 상한·범위·적용 시점은 ARCH-033.classification_budget의 사용자 승인 계약을 따른다"
    risk: "오래된 분류 채택·무한 재분류·오류의 강제 보정은 잘못된 실행과 쿼터 소진을 만든다"
    verification:
      - "첫 변경의 늦은 분류보다 최신 중단이 먼저 반영되면 변경으로 되살리지 않는다"
      - "JSON 누락·시간 초과·중복 입력이 임의 NEW/STOP이나 중복 효과를 만들지 않는다"
      - "분류 한도/모델 오류 상태에서도 명시적 중단을 접수한다"
    intent:
      problem: "오래된 분류 채택·무한 재분류·오류의 강제 보정은 잘못된 실행과 쿼터 소진을 만든다"
      goal: "분류 모델의 구조화 제안을 입력·대상·당시 상태에 연결하고 반영 직전 유효성을 검사한다"
    goal_trace:
