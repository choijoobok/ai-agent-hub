  - id: REQ-025
    type: functional
    priority: must
    category: "확신·처리 불가"
    actors: [ACT-001]
    title: "확신이 없으면 추측하지 않는다"
    source: "2026-10-23 사용자 제안 및 요구사항 보완 요청: 지식·카탈로그에서 필요한 테이블·컬럼을 정한 뒤 등록된 조회 조건과 필수 여부를 확인한다. 기간 제한은 테이블 카탈로그에서 관리하고 부족 조건 질문과 실제 실행 검증을 연결한다"
    detail: "대상 데이터 영역을 특정할 수 없거나, 조건 해석이 갈리거나, 카탈로그·지식·예제 쿼리로 근거를 세울 수 없으면 임의로 골라 실행하지 않고 사용자에게 확인을 요구하거나 처리 불가로 응답한다. 처리 불가 응답에는 **무엇이 부족했는지**를 함께 제시한다"
    hard_rule: "**자율 처리 비율보다 처리한 것의 정확도를 우선한다**"
    multi_source_evidence: "REQ-021의 필요한 원천·필수 컬럼·결합 관계/키·집계 단위·결과 완전성 근거가 부족하면 그 부족을 해소할 확인 또는 처리 불가로 연결한다. 여러 데이터소스가 필요하다는 사실 자체를 불확실성으로 보거나 하나를 임의 선택하지 않는다. 원천 장애·접근 불가를 정상 0건으로 대체하거나 부분 결과로 전체 합계·비율을 확정하지 않으며 권한 밖 대상의 존재·물리명은 안내에 노출하지 않는다"
    roadmap: RM-P1
    summary: "업무 대상·해석·근거가 부족하면 추측 실행하지 않는다. 필요한 테이블·컬럼을 정한 뒤 REQ-611 정책 원천의 필수 조회 제약과 확보한 조건을 대조하고, 해결 가능한 부족분만 질문하며 실제 SQL 검증까지 통과해야 조회한다"
    intent:
      problem: "기간 등 필수 조건이 빠졌거나 모호한데도 임의 기본값으로 조회하면 오답·과부하와 요청 범위의 왜곡이 발생한다"
      goal: "이미 확보한 유효 조건은 재사용하고 필요한 확인만 요청하되 근거 없는 조회는 실행하지 않는다"
      not: "모든 질의의 일률적 재확인·지식 본문만으로 강제 조건 집행·사용자 확인을 통한 제약 면제·새 승인 상태 도입이 아니다"
    goal_trace: [GOAL-1, SUC-02, SUC-03]
    decider: "제품 오너(사용자)"
    preconditions:
      - "업무 대상과 허용 근거의 선별은 REQ-021·303, 필수 조회 제약의 정의·관리·서버 검증은 REQ-611.query_constraints를 따른다"
      - "과거 조건 복원·현재 입력과의 결합은 REQ-001, 변경은 REQ-007, 사용자대기는 REQ-005, 내용 버전과 현재 권한은 REQ-108을 따른다"
    condition_resolution:
      timing: "필요한 공개 테이블/뷰·컬럼·관계의 계획이 서면 각 대상의 적용 제약과 사용자 조건을 대조한다. 대상이 바뀌면 새 대상의 조건을 다시 확인한다. 실제 원천 조회가 필요 없는 직접 입력/보존 결과 가공에 불필요한 조회 조건을 강제하지 않는다(REQ-039·002)"
      reuse: "현재 질의에 명시된 값과 REQ-001로 근거·유효성을 확인한 과거 조건 중 현재 요청이 바꾸지 않은 값은 재사용한다. '아까 주간 출고를 이번 달로'이면 원 질의의 기준일·업무 범위는 유효한 부분만 계승하고 기간은 이번 달로 바꿔 제약을 다시 검사한다. 참조 대상·기준일·기간이 모호하면 해당 부분만 확인한다"
      question: "사용자가 보완할 수 있는 필수 조건 누락·해석 모호성·범위 초과이면 필요한 업무 항목·이유·허용 범위를 함께 안내한다. 이미 유효한 값을 다시 묻지 않고 남은 부족 항목을 묶어 질문한다. 등록 제약을 충족하는 조건을 얻기 전에는 해당 조회를 실행하지 않는다"
      invalid_or_excessive: "유효하지 않은 날짜·역전·한쪽 경계만 있는 기간과 허용 범위 초과를 구분한다. 초과한 요청은 기간 조정 또는 등록된 대체 조건을 안내하고 사용자가 정하도록 한다. 임의 기본값·자동 기간 절삭·자동 분할로 요청을 바꾸지 않는다. '조건 없이 전체'라는 답변도 면제가 아니다"
      wait: "입력 없이는 진행할 수 없을 때 REQ-005의 추가 정보 사용자대기를 사용한다. 일부만 유효하게 답하면 그 값은 유지하고 남은 항목만 다시 묻되 원 대기 기한을 연장하지 않는다. 조건 확보는 실행 승인·계획 확인·모델 전송 동의가 아니며 각각의 기존 통제를 유지한다"
      unavailable: "제약 참조 무효·미검수·지원하지 않는 검증 표현·권한 제한·원천 장애는 단순 값 누락과 구분한다. 사용자가 날짜를 답해도 해결할 수 없는 사유에 같은 질문을 반복하지 않고 안전한 처리 불가 사유와 가능한 후속을 안내한다. 권한 밖 대상의 존재·물리명·정책 내부값은 노출하지 않는다"
      execution: "REQ-611.query_constraints에 따라 서버가 최종 SQL·바인딩의 실제 충족 여부를 검사한다. 거부 시 실행하지 않으며 조건 보완으로 해결 가능하면 그 경로로, 메타데이터/검증 문제이면 처리 불가로 연결한다. 이미 제공된 유효 조건이 SQL에서 빠진 경우 사용자에게 같은 값을 다시 묻지 않는다. 정책 거부를 REQ-037의 구문 오류 자동 재작성 대상으로 확장하지 않는다"
    data:
      - { item: "확정/부족 조건·질문 사유·조건 값의 입력/과거 턴 출처·대상 카탈로그와 제약 버전·검증 판정", origin: "사용자 입력과 허용된 근거·서버 검사", sensitivity: "값과 참조의 현재 권한·개인정보 보호 적용", retention: "REQ-001·107·109·111의 맥락/감사/본문 보존·마스킹을 따름" }
    business_rules:
      - "사용자 확인은 해석·값을 보완하는 수단이며 부족한 카탈로그 근거·등록되지 않은 관계·현재 접근 권한을 생성하는 수단이 아니다"
      - "필수 조회 제약의 규칙·예외·수치·판정은 REQ-611.query_constraints 한 곳에서 정의하고 지식·프롬프트·이 카드에 별도 사본을 만들지 않는다"
      - "여러 데이터소스의 필요한 대상에 각각 조건을 적용하며 한 원천의 충족으로 다른 원천의 충족을 대신하지 않는다. 의존 관계·일부 완료/최종 실패는 REQ-021·038을 따른다"
    exceptions:
      - "조건 부족·권한/근거 부재·검증 실패·실행 장애와 실제 정상 0건을 구분한다. 미실행·실패를 조회 결과 없음으로 응답하지 않는다"
      - "조건을 보완한 동안 대상·권한·내용 버전의 유효성이 달라지면 REQ-007·108에 따라 영향받는 계획·검증을 갱신하고 이전 통과를 재사용하지 않는다"
    lifecycle: "근거/대상 선별 → 조건 확인 → 부족 시 기존 추가 정보 대기와 보완 → 계획/SQL 구성 → 서버 최종 검증 → 조회 또는 사유 있는 처리 불가. 별도 턴 상태를 신설하지 않으며 중단·만료·개인 순서는 REQ-005·007·036을 따른다"
    permissions: "현재 허용된 대상·메타데이터만 질문·계획에 사용하며 사용자 답변·이전 성공·계획 확인으로 접근 범위를 확대하지 않는다"
    audit: "확인 사유·입력 출처·적용 제약 버전·판정·미실행/실패를 현재 턴·계획·요청에 연결한다. REQ-107·109·111의 보존·마스킹을 유지한다"
    volume: "모든 조회에서 적용하되 수치 목표·행/시간/크기 상한은 NFR-001~003을 따른다"
    config: "필수 조회 제약은 REQ-611, 대기 기한은 REQ-005의 기존 관리 원천을 사용한다. 이 카드에 별도 기본 기간·승인 면제 설정을 만들지 않는다"
    risk: "자연어 조건은 충분해도 SQL에서 빠지거나 다른 별칭에만 적용될 수 있으므로 계획 확인과 실제 실행 검증을 분리해야 한다"
    acceptance: "필수 조건이 없으면 누락 항목과 이유를 묻고 해당 조회를 실행하지 않는다. 이미 확보한 유효 값은 반복 질문하지 않으며 무효/초과 조건을 임의 보정하지 않는다. 조건 보완 뒤에도 실제 SQL·바인딩이 현재 조회 정책을 충족해야 실행한다. 질문으로 해결할 수 없는 근거/권한/검증 문제는 안전하게 처리 불가로 구분한다"
    verification:
      - { case: "기간 필수인 출고 현황 요청에 기간 없음", expected: "출고일의 필요한 기간과 이유를 질문하고 입력 전 원천 조회를 하지 않는다" }
      - { case: "현재 질의 또는 유효한 과거 조건에 기간이 이미 있음", expected: "조건 출처와 충족 여부를 검사해 재사용하고 동일 기간을 다시 묻지 않는다" }
      - { case: "이전 주간 출고를 이번 달로 변경", expected: "유효한 기준일·업무 조건만 유지하고 새 월 기간으로 제약을 다시 검증한다. 초과 시 사용자에게 범위 조정을 요청한다" }
      - { case: "기간 두 경계 중 하나·잘못된 날짜·최대 초과 또는 전체 기간 요청", expected: "부족/무효/초과를 구분하고 임의 기간 채움·절삭·분할·면제 없이 필요한 보완만 요청한다" }
      - { case: "등록한 정확한 식별키 대체 조건 충족 또는 미등록 예외 주장", expected: "REQ-611의 검증된 대체만 사용하고 모델·사용자 주장만으로 기간을 생략하지 않는다" }
      - { case: "부족 항목 여러 개 중 일부만 유효하게 답변", expected: "유효 값은 유지하고 나머지만 질문하며 기존 대기 기한을 연장하거나 실행 승인으로 간주하지 않는다" }
      - { case: "복수 원천의 기준일·필수 조건이 다름", expected: "업무상 차이를 설명해 필요한 조건을 각각 확인한다. 하나의 기간이 모든 원천에 자동으로 적합하다고 보지 않는다" }
      - { case: "제약 참조 컬럼이 무효·권한 밖이거나 검증 표현 미지원", expected: "조건 질문으로 해결되는 척하지 않고 해당 경로를 실행하지 않는다. 권한 밖 존재/물리명과 내부 정책값을 숨긴다" }
