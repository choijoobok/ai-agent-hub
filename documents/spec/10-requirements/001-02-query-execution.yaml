    maturity: {"level":"confirmed","at":"2026-10-27","by":"AI — 사용자 권장안 반영 요청 적용","confirmed_by":"사용자 (2026-10-27 검토·확정 대상 18건 확정 처리 요청). REQ-026의 최신 전체 보완본을 확정했다. 흐름도 대조·상세 설계·검증 후속은 유지하며 단계 게이트·소스 구현 승인은 별도다. 2026-10-27 사용자가 일관성 검토 권장안대로 수정을 요청하여 승인 실제 연결·실행 주체 재검사 보완을 반영했다. 기존 확정 상태와 단계 게이트를 유지한다."}
    approval_scope: "이 카드의 실제 값 확인·사용자 승인 카드 규칙은 RM-P1 일반 실행 및 RM-P3 대화 수동 실행에 적용한다. RM-P3 예약 워크플로우 중 REQ-405의 관리자 활성화 승인 범위를 현재 서버 검사로 충족한 액션만 사전 승인 예외로 처리한다. 현재 권한·정책·모든 실제 값 검증·원값 보호·전송/결과 불명 통제는 양쪽 모두 적용한다 자동 승인 활성화의 유효 조건과 사람 승인 요청의 기한은 별개며 REQ-405를 따른다. 일반 사용자 승인 기한 기본값은 바꾸지 않는다"
