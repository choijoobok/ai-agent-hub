  - id: REQ-022
    type: functional
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획을 업무 용어로 제시하고 자연어로 교정받는다"
    source: "2026-10-26 사용자 요청으로 4일차 잔여 요구사항의 세부 기준을 보완한다. 기존 업무 용어·자연어 교정·다중 원천/필수 조건 표시를 유지하고 표시 시점·미확정 표시·변경 반영·현재 계획 연결·예외/검증을 구체화한다. 전체 카드 확정은 별도다"
    roadmap: RM-P1
    summary: "현재 채택 계획의 목적·업무 대상·조건·순서·제한을 이해할 수 있게 보여 주고 자연어 교정을 서버의 유효 계획에 반영한다. 계획 표시·확인 대기·실제 수행 이력·실행 승인은 구분한다"
    intent:
      problem: "해석한 업무 범위와 계획을 알 수 없거나 낡은 계획을 현재 계획처럼 보이면 사용자가 실행 전 오류를 바로잡을 수 없다"
      goal: "사용자가 업무 언어로 의도와 계획을 대조하고 필요한 부분만 교정하며 반영 여부를 확인할 수 있게 한다"
      not: "SQL 편집기·내부 추론 공개·예상 진행률 표시·모든 계획의 승인 강제·계획 확인으로 실행 승인을 대체하는 기능이 아니다"
    goal_trace: [GOAL-1, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "채택/변경할 계획은 REQ-015, 현재 실행 상태와 수행은 REQ-004, 확인 필요성은 REQ-023을 따른다"
      - "업무 용어의 허용 근거는 REQ-021·303, 부족 조건은 REQ-025, 공개 통제는 REQ-104, 대기/교정은 REQ-005·007을 따른다"
    work_plan_link: "REQ-015의 현재 채택 작업 계획을 업무 용어로 제시하고 변경은 REQ-007·015의 계획/영향 범위에 연결한다. 계획 작업 목록은 REQ-004의 실제 수행 상태와 구분하며 계획 확인을 작업 완료나 실행 승인으로 해석하지 않는다"
    detail: "조회에 대해서는 질의 해석문·대상 데이터 영역의 업무 명칭·적용 조건·기간·집계 단위를, **액션이 포함된 턴에서는 실행할 액션과 순서를 함께** 제시한다. **기본 필터가 해제된 경우 그 사실을 함께 표시한다**"
    hard_rule: "**테이블·컬럼의 물리명과 SQL 원문은 노출하지 않는다.** 사용자는 계획을 보고 **자연어로 교정**하며, 물리명이나 SQL 을 직접 편집하게 하지 않는다. 사용자용 자연어 계획의 비노출 지침은 REQ-104.initial_control의 초기 프롬프트 적용 범위와 한계를 따르며 기술적 강화는 해당 open에 둔다."
    multi_source_plan: "REQ-021.presentation에 따라 필요한 여러 업무 데이터 영역의 역할·조회 의존 순서·결합 목적/기준과 범위 제한을 업무 용어로 표시한다. 데이터소스 하나를 선택하는 계획으로 축소하지 않으며 일부 원천의 부재·시점 차이·부분 결과가 전체 요청에 미치는 영향을 구분한다. 교정된 원천·조건·결합의 유효성은 REQ-007·108을 따른다"
    query_constraint_plan: "REQ-611.query_constraints·REQ-025에 따라 적용할 필수 조회 조건과 구체화한 기간·등록 대체 조건 사용 여부를 업무 용어로 표시한다. 부족 조건 확인과 계획 확인을 구분하며 계획 확인이 제약을 면제하거나 실제 SQL 검증을 대신하지 않는다"
    presentation_contract:
      timing: "서버가 검증한 현재 계획의 업무 범위가 정리되면 해당 업무 처리 전에 제시한다. REQ-023의 확인 대상이면 계획·확인 사유와 유효 응답 방법을 제시하고 해당 작업을 보류한다. 확인 대상이 아니면 간결히 제시하고 확인 응답을 기다리지 않고 진행할 수 있다. 계획 작성에 필요한 허용된 지식/카탈로그 탐색과 실제 업무 데이터 조회·실행은 구분한다"
      progressive_plan: "선행 업무 조회의 결과로 후속 대상/값이 정해지는 경우 REQ-015의 단계별 구체화를 따른다. 먼저 현재 근거로 수행 가능한 조회 범위와 후속 작업의 의존 관계를 제시·필요 확인하고, 실제 결과를 받은 뒤 후속 계획을 보완·필요 확인한다. 미정 값을 지어내거나 모든 후속 값을 얻을 때까지 선행 조회의 계획을 만들 수 없다고 처리하지 않는다"
      content: "목적/산출물·대상 업무 영역·조건과 구체 기간/기준일·집계 단위·비교/결합 기준·업무 순서/의존 관계·필수 제약/기본 필터 제외·부분/시점 제한 중 현재 요청에 해당하는 항목을 표시한다. 단순 요청은 짧게, 복합 요청은 필요한 작업별로 구분하며 해당하지 않는 빈 항목을 채우지 않는다"
      unresolved: "계획 후보·채택된 예정 작업·확인 필요한 값/관계·이미 수행한 사실을 구분한다. 미정 값은 확인 필요로 표시하고 임의 기본값으로 메우지 않는다. REQ-025의 확인으로 해결할 수 없는 권한/근거 부재를 사용자에게 승인받을 수 있는 선택지로 제시하지 않는다"
      current_plan: "표시 내용은 소속 턴·현재 계획/작업·유효 상태와 연결한다. 계획 변경 뒤 이전 표시를 현재 유효 계획처럼 쓰지 않고 변경된 업무 범위와 반영 여부를 알린다. 내부 식별자·회차/상태 제어값을 사용자에게 그대로 나열하도록 요구하지 않는다. 연결 키와 상세 배치는 P3에서 정한다"
      source_and_limits: "새 원천 조회인지 보존 결과 재가공인지, 필요한 여러 원천과 결합 목적, 결과의 기준 시각·부분/미상 제한을 구분한다. 계획 확인만으로 전체 결과 확보나 낮은 조회 비용을 보장하지 않는다"
      disclosure: "물리명/SQL·권한 밖 대상·비밀값·모델 내부 추론은 사용자용 계획에 제공하지 않는다. REQ-104.initial_control의 초기 프롬프트 적용 범위를 유지하며 별도 SQL 출력 필터·검사 모델·스트리밍 차단 계층을 이 카드에서 추가하거나 완전 차단을 보장하지 않는다"
    correction_contract:
      interpret: "자연어 교정의 대상 계획과 바꿀 업무 항목을 특정한다. 같은 대화의 여러 계획 중 대상이 모호하거나 기준일/기간/집계 의미가 갈리면 해당 부분만 확인한다. 단순 설명 요청·조건 변경·별개 질의·중단은 REQ-030의 기존 분류를 따른다"
      apply: "REQ-007·015에 따라 영향받는 계획/입력/결과·미전송 작업만 검증·변경한다. 사용자 요청 범위를 임의 확대하지 않고 기존 유효 조건은 유지한다. 교정 내용을 화면에 표시했거나 모델이 수락했다고 말한 것만으로 서버 반영 성공으로 처리하지 않는다"
      feedback: "반영되면 바뀐 조건·대상·순서와 남은 확인 필요 사항을 업무 용어로 알린다. 같은 회차의 변경도 현재 계획에 연결하며 실제 스텝 증가는 REQ-015를 따른다. 설명 문구만 바뀐 경우와 업무 의미가 바뀐 경우를 구분해 재확인은 REQ-023에 맡긴다"
      execution_boundary: "이미 수행/전송한 업무 액션은 계획 교정으로 취소·되돌림·재전송되지 않는다. 실제 수행 사실과 바꿀 수 있는 미전송 범위를 구분하고 실행 대상·순서·값 변경의 재승인은 REQ-026을 따른다. 종결된 턴의 별도 후속 요청은 새 턴으로 처리한다"
      failure: "현재 계획 식별/저장·변경 반영이 실패하면 수정 완료로 표시하지 않고 이전 유효 계획과 변경 요청의 상태를 구분한다. 확인이 필수인 계획을 정상적으로 제시/응답 연결할 수 없으면 해당 작업을 진행하지 않는다. 재접속은 REQ-040의 현재 상태 복원이며 새 확인 제출이 아니다"
    data:
      - { item: "사용자용 계획·근거 계획/작업 참조·미확정/제한 항목·교정 대상/내용·반영 결과", origin: "REQ-015의 검증한 계획·사용자 교정·서버 반영 사실", sensitivity: "현재 권한·마스킹·물리명 비노출 규칙 적용", retention: "REQ-004·107·109의 계획/본문/감사 보존" }
    business_rules:
      - "이 카드는 무엇을 어떻게 보여 줄지, REQ-023은 언제 확인을 기다릴지, REQ-005·026은 실제 실행 승인을 정의한다. 계획 표시는 실제 진행 이력(REQ-006)이 아니다"
      - "계획 설명/교정을 이유로 별도 모델 호출이나 전체 프롬프트·카탈로그 재전송을 강제하지 않는다. 필요 호출은 REQ-003·009·610의 목적별 입력 계약을 따른다"
    exceptions: ["업무 명칭/대상·조건이 모호하면 부족한 부분만 질문한다", "낡은 계획·만료/권한 회수·종결 뒤 교정은 현재 상태를 안내하고 기존 무효/새 턴 규칙을 따른다"]
    lifecycle: "계획 후보/근거 정리 → 서버 채택 → 업무 용어 제시 → 필요 시 확인/자연어 교정 → 검증·반영 결과 제시 → 유효 계획 수행"
    permissions: "사용자에게 허용된 업무 대상·조건만 제시하며 물리명·권한 밖 존재를 후보나 오류 설명에 노출하지 않는다"
    audit: "제시한 계획과 현재 채택 내용·교정 전후/근거·실제 반영 결과를 REQ-004·107에 연결한다. 실행 이력이나 완료 사실로 대체하지 않는다"
    volume: "요청의 업무 복잡도에 맞춰 간결히 제시하고 모델 토큰/청크·내부 상태 갱신마다 계획 전문을 반복하지 않는다"
    config: "확인 강제 조건은 REQ-023, 공개 규칙은 REQ-104, 내용의 운영 프롬프트와 기술 템플릿 경계는 REQ-610을 참조한다. 별도 계획 전용 모델/설정 저장소를 만들지 않는다"
    risk: "보기 좋은 계획 문장만 갱신하고 실제 서버 조건이 남아 있거나 수행된 액션을 예정으로 되돌려 표시하면 잘못된 교정/재승인으로 이어질 수 있다"
    acceptance: "현재 계획의 업무 목적·대상·조건·순서·제한을 이해할 수 있고 자연어 교정의 대상과 실제 반영 여부를 구분한다. 미정 값·낡은 계획·이미 수행한 사실을 섞지 않으며 계획 표시가 실행 승인이나 처리 완료가 되지 않는다"
    verification:
      - { case: "명확한 단일 영역 조회이고 확인 조건 없음", expected: "업무 용어 계획을 간결히 제시하며 확인 응답을 의무화하지 않는다" }
      - { case: "출고와 주문을 여러 데이터소스에서 조회·비교", expected: "각 업무 영역/조건·결합 기준·의존 순서와 제한을 표시하며 원천 하나 선택으로 축소하지 않는다" }
      - { case: "기간/기준일이 미정이거나 필수 제약 대체 조건 사용", expected: "미정 부분과 구체화한 조건·등록 대체를 구분하고 사용자 확인으로 제약을 면제하지 않는다" }
      - { case: "기본 필터 해제 또는 일부 원천 결과만 사용 가능", expected: "해제 사실·범위/시점 제한을 숨기거나 전체 처리로 표시하지 않는다" }
      - { case: "'출고일이 아니라 주문일 기준으로' 교정", expected: "대상/근거를 검증해 영향 범위만 변경하고 실제 반영된 조건을 제시한다" }
      - { case: "대상 계획이 여러 개이거나 '아까 것'이 모호", expected: "허용된 단서로 해당 계획/항목만 확인하고 임의로 최신 계획을 수정하지 않는다" }
      - { case: "SQL 원문·물리명 공개 또는 직접 편집 요청", expected: "REQ-104의 업무 용어 설명/공개 규칙을 적용하며 별도 기술 차단 계층이 구현됐다고 간주하지 않는다" }
      - { case: "계획 문구 수신 뒤 서버 저장/교정 반영 실패", expected: "현재 유효 계획과 실패를 구분하고 수정 완료·필수 확인 완료로 처리하지 않는다" }
      - { case: "이미 전송한 액션·일부 완료 뒤 계획 교정", expected: "실제 수행 사실을 보존하고 변경 가능한 미전송 범위와 필요한 재승인을 구분한다" }
      - { case: "계획 제시·조회 진행·실행 승인 카드가 함께 존재", expected: "예정 계획·관측된 수행 이력·확인/승인 목적을 구분하고 서로 대체하지 않는다" }
      - { case: "선행 조회 결과로 후속 액션의 대상/값 결정", expected: "조회 전 현재 가능한 범위의 계획을 제시·필요 확인하고 결과 뒤 후속 계획을 구체화한다. 실제 실행 승인은 모든 값 확보/검증 뒤 별도로 받는다" }
