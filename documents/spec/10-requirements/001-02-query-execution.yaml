      - "일괄 승인 뒤 두 번째 호출 전에 만료되면 두 번째 호출을 막는다"
      - "접수형 응답·변경된 승인 카드·권한 회수·다중 탭 승인 제출을 검증한다"
      - "A의 호출을 기한 안에 시작하고 12분 뒤 결과가 나와 B의 값을 처음 확보한 경우, B의 최초 개별 승인 요청은 그 제시 시각부터 자체 대기 기한을 갖는다. 반면 A의 동일 승인 카드 재발급은 기한을 연장하지 않는다"
    intent:
