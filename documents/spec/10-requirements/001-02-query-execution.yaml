      by: "AI — 사용자 명시 확정 반영"
      confirmed_by: "사용자 (2026-10-27 검토·확정 대상 18건 확정 처리 요청). REQ-010의 최신 전체 보완본을 확정했다. 흐름도 대조·상세 설계·검증 후속은 유지하며 단계 게이트·소스 구현 승인은 별도다."

  - id: REQ-015
    type: functional
    priority: must
    category: "질의 해석·처리 경로"
    actors: [ACT-001]
    title: "질의 해석과 복합 작업 계획 수립"
    detail: "LLM은 사용자 질의를 명료하게 재정리한 해석문으로 목표·대상·조건·원하는 산출물을 드러내고 지식 검색·SQL 생성·등록 업무 API/도구 탐색에 사용한다. 복합 요청은 필요한 작업·순서/의존 관계·완료 기준을 갖춘 작업 계획으로 구체화하며 서버가 허용 근거와 사용자 요청 범위를 검증해 채택한다. 결과에 해석문을 함께 제시해 의도와 대조할 수 있게 하고 작업 계획의 저장·상태 갱신·반복 수행은 REQ-004로 연결한다"
    source: "2026-10-23 사용자 제안 및 보완 요청: 단순 해석문을 넘어 복합 요청의 실행 계획을 세우고 작업 상태를 갱신하며 순차 수행해야 한다. 후속 논의의 계획·실행 상태 DB 저장과 대화 압축 요약 분리를 함께 반영한다. 같은 날 턴별 계획 소유와 동일 턴의 조건 변경·회차·실제 모델 스텝을 구분하고, 별도 계획 버전 번호를 강제하지 않고 현재 채택 계획과 변경 이력을 관리하도록 요청했다"
    roadmap: RM-P1
    summary: "해석문은 무엇을 원하는지, 작업 계획은 어떤 작업과 근거·순서로 충족할지를 표현한다. 계획은 실행 사실·승인이 아니며 검증된 계획과 실제 상태의 연결은 REQ-004를 따른다"
    intent:
      problem: "요청을 문장으로만 재작성하면 복합 요청의 일부 산출물·작업 의존성이 누락되고 실행 중 무엇이 남았는지 판단하기 어렵다"
      goal: "사용자의 목적과 요청 범위를 보존하는 작업 계획을 만들고 완료·변경 여부를 판정할 기준을 제공한다"
      not: "모델 내부 사고 과정 공개·요청하지 않은 업무 실행 추가·모든 질의의 계획 승인 강제·재사용 워크플로우 정의 기능이 아니다"
    goal_trace: [GOAL-1, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "과거 맥락/조건은 REQ-001, 작업 유형·허용 후보와 업무 실행 범위는 REQ-038, 지식/객체 선별은 REQ-021을 따른다"
      - "근거/필수 조건 부족은 REQ-025, 계획 표시·확인은 REQ-022·023, 업무 실행의 대상·순서·승인은 REQ-026을 따른다"
    plan_contract:
      interpretation: "최종 목적·요청한 산출물·대상과 범위·기간/조건·사용자가 정한 순서를 해석문에 반영하고 모호/미확정 부분을 구분한다. '이번 달' 등 과거 조건 변경의 접수 기준·시간대는 REQ-001을 유지하며 해석 과정에서 요청 범위를 임의 확대·축소하지 않는다"
      structure: "작업 계획(TRM-248)은 소속 턴·계획 식별자·현재 채택 내용·근거 입력/해석문 참조·변경 이력과 계획 작업(TRM-249) 목록을 갖는다. 작업별 안정 식별자·업무 목적/유형·필요 입력과 근거/결과 참조·선행 작업/순서·예정 산출물·완료 기준·미확정/확인 필요 항목을 연결한다. 입력 값이 없는 것을 임의 값이나 완료로 채우지 않으며 물리 필드/코드는 P3에서 정한다"
      turn_scope: "계획과 실행 상태는 해당 턴에 소속된다. REQ-030의 새 요청 판정이나 REQ-013의 명시 재요청으로 새 턴을 접수하면 그 턴의 계획/상태를 별도로 관리하고 원 턴의 계획/회차를 수정·승계하지 않는다. 과거 턴을 REQ-001·002의 근거로 참조할 수 있지만 여러 턴을 하나의 계획 버전 연속으로 묶도록 요구하지 않는다. 처리 중 조건 변경으로 판정된 입력은 REQ-007에 따라 같은 턴·시도 안에서 반영한다"
      revision_boundary: "회차(TRM-004)는 계획 수정 횟수가 아니라 같은 턴에서 입력 변경으로 되돌려 다시 수행한 흐름의 구분이다. REQ-007.change_policy.unaffected에 따라 이전 체크포인트가 무효면 회차를 올리고, 기존 결과/처리 지점을 유지한 채 이후 미수행 작업만 바뀌면 같은 회차를 유지한다. 따라서 같은 회차에서도 계획이 달라질 수 있으며 계획 변경·회차 증가·스텝 추가를 일대일로 묶지 않는다"
      step_boundary: "계획 작업(TRM-249)과 실제 모델 응답 실행인 스텝(TRM-003)을 구분한다. 한 작업에 여러 스텝/도구 호출이 연결되거나 모델 호출 없이 수행될 수 있다. 조건 변경 뒤 실제 새 모델 응답 실행이 시작되면 새 스텝을 연결하고, 검증된 동일 실행 안에서 반영되면 기존 스텝에 변경 사건을 추가한다(REQ-007.model_change_contract·107.history_storage). 계획 편집·상태 갱신·미수행 작업 추가·SQL/API 호출만으로 모델 스텝을 만들지 않으며 아직 시작하지 않은 작업에 가상 중단/대체 스텝을 남기지 않는다"
      progressive_detail: "초기에는 요청 목표·산출물·업무 순서를 정리하고 필요한 지식·허용 대상·입력 근거를 확보한 뒤 해당 작업을 구체화할 수 있다. 후보·테이블·API를 모르는 상태에서 추정으로 고정하지 않는다. 구체 실행 대상·필수 조건이 미정인 작업은 실행하지 않고 필요한 선행 탐색/확인에 연결한다"
      coverage: "사용자가 요구한 각 산출물이 어떤 작업/결과로 충족되는지 확인한다. 복합 요청을 한 유형으로 축소하거나 어려운 부분을 조용히 제외하지 않는다. 단순 질의는 필요한 최소 작업으로 표현하며 다단계 계획을 위해 불필요한 모델 호출/작업을 만들지 않는다"
      ordering: "사용자가 지정한 순서와 선행 결과 의존성을 기록하고 지킨다. 조회·가공의 기술적 순서는 근거 안에서 계획할 수 있으나 상태 변경 업무 액션의 대상·순서는 REQ-026의 사용자 요청에서 얻으며 불명확하면 확인한다. 순서/의존성이 없는 조회의 처리 선택은 REQ-021을 따른다"
      completion_criteria: "작업별로 등록 계약의 실제 성공/완료 의미, 필요한 입력·결과의 유효 범위와 산출물 존재 등 확인할 기준을 둔다. 조회 0건·부분 자료·외부 접수 성공·업무 완료·결과 불명을 구분한다. 서버가 확인 가능한 계약/결과 근거를 대조하며 자연어 품질이나 업무 의미 전체를 기계적으로 보증한다고 표현하지 않는다"
      adoption: "모델 출력은 계획 후보이며 REQ-009에 따라 서버가 요청 범위·허용 후보·순서/선행 참조·계약 유효성을 검증한 계획만 채택한다. 없는 선행 작업·순환 의존·서로 충돌하는 순서·누락된 필수 산출물은 그대로 실행 가능한 계획으로 저장하지 않는다. 사용자의 계획 확인은 REQ-023의 조건에 따르며 채택/확인은 실행 승인과 다르다"
      revisions: "사용자 조건 변경·추가 정보·유효한 실제 결과로 계획 보완이 필요하면 현재 채택 계획을 갱신하고 변경 전후 내용·사유·근거 입력·영향 작업·적용 시점과 해당 턴/회차·실제 수행 이력의 연결을 남긴다. 변경 없는 작업은 연결을 유지하고 미수행 작업은 필요에 따라 추가·수정·제외·대체한다. 무조건 뒤에 작업을 덧붙이지 않으며 이미 수행한 사실·당시 입력·시간·사용량을 덮어쓰거나 삭제하지 않는다. 완료 결과의 재사용은 입력·조건·출처/기한·현재 권한을 다시 대조하며 실패 항목 삭제로 전체 완료를 만들지 않는다. 요청 범위 변경·실행 순서/값 변경의 확인·승인 무효화와 이미 전송한 업무 실행의 보호는 REQ-007·026을 따른다"
      change_identification: "요구하는 것은 현재 유효 계획과 변경 전후·적용 근거의 구분이지 별도 계획 버전 번호나 버전별 독립 테이블이 아니다. 기존 턴·회차·상태 버전·변경 사건을 우선 활용하며 별도 계획 버전 번호의 필요 여부와 물리 식별/연결 방식은 P3에서 정한다. 단순 작업 진행·상태 갱신·모델 호출/재시도마다 새 계획 변경을 만들지 않는다. 같은 회차 안에서 계획이 바뀌어도 REQ-004의 요청 당시 계획/작업·유효 상태 연결과 응답 시점 재검증을 통해 무효가 된 제안/결과의 적용을 차단해야 한다"
      presentation: "사용자에게는 해석문과 REQ-022의 업무 용어 계획을 제공하고 내부 식별자·물리 SQL·전체 제어 상태를 그대로 노출하지 않는다. 계획의 예정 항목과 REQ-006의 실제 진행 이력을 혼합하지 않으며 상세 계획 생성·갱신마다 새 확인을 일률적으로 강제하지 않는다"
    data:
      - { item: "해석문·턴별 현재 채택 계획·계획 작업/의존성·입력/산출물 참조·완료 기준·변경 전후와 근거", origin: "사용자 입력·허용된 맥락/지식·검증한 모델 제안", sensitivity: "업무 조건/원문과 참조의 권한·개인정보 보호 적용", retention: "REQ-004.execution_state의 저장 역할과 원자료별 보존 정책" }
    business_rules:
      - "계획의 업무 의미·구성은 plan_contract, 실제 실행/상태의 DB 저장·반복 처리·완료 판정은 REQ-004가 소유한다. 해석문이나 계획의 존재를 처리 완료/실행 승인 증거로 사용하지 않는다"
      - "필수 조회 조건은 REQ-611.query_constraints·025를 연결하고 계획 확인·계획 변경으로 제약을 면제하지 않는다"
      - "계획 변경·회차 변경은 같은 시도의 누적 스텝 예산을 초기화하지 않는다. 스텝 한도는 NFR-013, 되돌림 한도는 NFR-014를 유지하며 계획 번호나 새 턴 자동 생성으로 우회하지 않는다"
    exceptions: ["대상·조건·순서가 모호하거나 허용 근거가 없으면 부족한 부분만 확인/처리 불가로 연결한다. 실제 최종 실패·부분 수행은 REQ-038을 따른다"]
    lifecycle: "질의/맥락 해석 → 초기 목표/작업 후보 → 근거 확보·필요 조건 보완 → 서버 검증·계획 채택 → REQ-004 수행 → 필요한 계획 변경 또는 종결. 이는 처리 흐름이며 새 턴 상태 코드를 정의하지 않는다"
    permissions: "허용된 지식/카탈로그·API/도구 후보로만 구체화하며 계획에 적었다는 이유로 대상 접근·전송·업무 실행을 허용하지 않는다"
    audit: "해석 근거·현재 채택 계획과 변경 전후/적용 근거·실제 작업 연결은 REQ-004·107에 남긴다. 모델의 내부 추론 전문은 요구하지 않는다"
    volume: "단순 요청에는 최소 계획, 복합 요청에는 요청 충족에 필요한 작업을 둔다. 입력/스텝/결과 상한은 기존 요구사항을 유지한다"
    config: "별도 계획 자동 승인·상태 저장소·계획 전용 모델 설정을 신설하지 않는다. 모델 역할과 기존 확인 정책을 사용한다"
    risk: "모델이 그럴듯한 작업 목록을 만들어도 필수 요청 누락·순환 의존·무효 근거·완료 오판이 있을 수 있어 구조와 요청 대응/결과 근거를 함께 검증해야 한다"
    acceptance: "복합 요청의 목표·조건·산출물·지정 순서가 해석문/계획에 보존되고 작업별 입력·선행 관계·완료 기준을 확인할 수 있다. 부족한 근거는 미확정으로 남겨 실행하지 않고 검증한 계획만 채택한다. 계획은 턴별로 관리하고 같은 턴의 변경에서는 되돌림 회차·실제 모델 스텝·계획 변경을 각각의 기준으로 판정한다. 변경 전후와 과거 수행 사실을 보존하고 같은 회차의 변경도 낡은 제안/결과를 차단하며 별도 계획 버전 번호는 강제하지 않는다"
    verification:
      - { case: "출고 조회 후 주문과 비교해 거래처별 미출고 수량 정리 요청", expected: "조회·비교/집계·정리의 필요한 작업과 산출물 대응을 계획에 유지하고 사용자 순서/선행 관계를 기록한다" }
      - { case: "짧은 단일 조회 또는 직접 입력의 결정적 계산", expected: "최소 작업으로 표현하고 계획 작성을 이유로 불필요한 탐색·모델 호출을 추가하지 않는다" }
      - { case: "초기 계획 시 테이블/API 또는 기간이 아직 미정", expected: "근거 확보/확인을 선행하도록 두고 임의 대상·기본 기간으로 실행하지 않는다" }
      - { case: "선행 작업 참조 누락·순환 관계·사용자 지정 순서와 충돌", expected: "유효 계획으로 채택해 실행하지 않으며 기술적 후보 보완과 사용자 확인이 필요한 모호성을 구분한다" }
      - { case: "보고 요청에 주문 취소 액션을 임의 추가하거나 계획 확인만 받은 실행", expected: "미요청 업무 실행·승인 우회를 허용하지 않는다" }
      - { case: "주간 출고 조회 후 같은 턴에서 기간을 이번 달로 변경", expected: "기존 조회/체크포인트가 무효면 같은 턴·시도에서 회차를 올려 영향 지점부터 다시 처리하고 계획 변경 전후·대체 작업을 연결한다. 실제 새 모델 응답 실행에만 새 스텝을 연결하고 과거 수행 사실·시간·사용량과 누적 스텝 예산은 보존한다. 무효 입력/결과·승인은 재사용하지 않는다" }
      - { case: "기존 조회 결과는 유효하고 미수행 출력 작업만 표에서 차트로 변경", expected: "같은 턴·회차에서 현재 계획과 변경 이력을 갱신한다. 무관한 조회를 반복하지 않고 무효가 된 이전 출력 제안을 차단한다. 실제 새 모델 실행이 없다면 스텝을 추가하지 않는다" }
      - { case: "진행 중 조건 변경을 제공자가 검증된 동일 모델 실행 안에서 반영", expected: "기존 스텝과 시작 당시 입력/회차를 보존하고 실제 적용 사건을 연결한다. 회차/계획 변경과 별개로 실제 새 응답 실행이 없으면 스텝을 늘리지 않는다" }
      - { case: "공급자 자동 후속 또는 Hub 재요청으로 실제 새 모델 응답 실행 시작", expected: "REQ-007·107의 실행 시작/식별 근거와 허용 조건에 따라 새 스텝을 연결한다. 계획 변경 이력이 새 스텝의 대체가 아니며 아직 시작하지 않은 후속 스텝을 미리 만들지 않는다" }
      - { case: "계획 내용이 그대로인 상태 갱신·모델 재시도 또는 미수행 작업 편집", expected: "전자는 진행/호출 사실만 기록하고 실제 새 모델 실행이면 스텝으로 센다. 후자는 계획 변경 이력을 남기되 편집만으로 실행/완료·중단/대체 스텝을 만들지 않는다. 각 경우 별도 계획 버전 번호를 강제하지 않는다" }
      - { case: "이전 턴 결과를 참조해 조건을 바꾼 새 요청 또는 원 질의 명시 재요청", expected: "새 턴에 별도 계획/상태를 두고 필요한 과거 근거만 연결한다. 원 턴의 계획/회차를 수정하거나 새 턴을 원 계획의 다음 버전으로 취급하지 않는다" }
      - { case: "필수 산출물 누락·실패 작업 삭제·외부 접수만 성공", expected: "전체 요청 완료로 보지 않고 남은 작업과 실제 결과 상태를 구분한다" }
      - { case: "다중 원천 조건 차이·과거 이번 달 요청의 대기/재계획", expected: "원천별 제약을 적용하고 기존 접수 기준의 구체 기간을 단순 재계획으로 바꾸지 않는다" }
