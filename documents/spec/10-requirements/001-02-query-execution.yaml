  - id: REQ-026
    type: functional
    process_step: PRC-03-01
    priority: must
    category: "액션 승인·실행"
    actors: [ACT-001]
    title: "연속 실행 — 여러 액션이 한 요청에 걸릴 때"
    detail: "실행할 액션과 순서는 **사용자 요청에서 얻고 Hub 가 추론해 정하지 않는다.** 등록된 실행 액션은 모두 REQ-005의 모든 파라미터 값 확보·검증과 사용자 전체 값 확인 후 최종 승인 절차를 거친다. 예정된 액션 전체를 제시해 일괄 승인받되, 파라미터가 앞 액션의 결과에 의존하는 액션은 그 결과와 모든 값을 확보한 뒤 개별 승인한다"
    hard_rule: "승인은 **승인 당시의 액션 식별자·순서·파라미터 값**에만 유효하며, 셋 중 하나라도 달라지거나 일괄 승인 유효 시간이 지나면 다시 승인받는다. **실패하면 그 지점에서 중단하고 보고**하며, 남은 액션의 처리 여부를 근거 없이 판단하지 않는다. 부분 실행 후의 재요청은 이미 실행된 것을 제시하고 사용자가 정한다"
    config: "`sys-config.agent.approval.wait-timeout-minutes`는 **최초 승인 요청을 제시한 시각부터** 사용자의 응답을 기다리는 시간이며 양의 정수 분, 기본 10분이다. 추가 질문·거절 뒤 후보 확인·재승인 카드 제시는 이 시각을 연장하거나 새로 시작하지 않는다. `sys-config.agent.approval.execution-ttl-minutes`는 사용자가 승인한 뒤 대상 시스템 호출을 시작할 수 있는 시간이며 양의 정수 분, 기본 5분이다. 두 값은 시스템 설정 DB 오버라이드로 배포 없이 변경하며, 저장 직후 **다음 승인 요청** 또는 **다음 사용자 승인**부터 적용한다. 이미 발급한 승인 요청·이미 받은 승인의 만료 시각은 바꾸지 않고, 적용한 기한값·승인 요청/승인 판정 시각을 승인 이력에 남긴다"
    roadmap: RM-P1
    traces_to: [REQ-005, REQ-025, REQ-105]
    summary: "사용자가 정한 액션 순서와 실제 값에 한정해 승인하고 실행별 결과 및 미실행 범위를 구분한다"
    preconditions:
      - "REQ-005·105의 등록·현재 권한·모든 값 확보/검증과 명시적 승인 조건을 만족한다"
    data:
      - item: "사용자 요청의 액션·순서·의존성·실제 파라미터·승인 버전/기한·개별 전송/결과·미실행 범위"
        origin: "해당 요청·원천·서버 처리에서 확인한 사실"
        sensitivity: "기존 접근·마스킹·비밀 비노출 정책 적용"
        retention: "해당 원천/참조와 기존 보존 정책 적용"
    business_rules:
      - "요청에서 순서·범위가 분명하지 않으면 먼저 확인하고 Hub가 업무 액션이나 순서를 추가하지 않는다. 여러 액션을 병렬 실행하는 의미로 일괄 승인을 해석하지 않는다"
      - "일괄 승인은 실제 값이 모두 확보된 표시 범위에만 유효하다. 앞 결과에 의존하는 액션은 예정 사실만 안내하고 실제 결과와 모든 값을 확보한 뒤 해당 내용으로 개별 승인받는다"
      - "각 액션의 전송 직전에 현재 권한·액션/참조 버전·값·순서·선행 결과·승인 만료와 REQ-105.approval_target_binding의 실제 연결/실행 주체를 다시 검사한다. 일괄 승인 후 첫 호출을 시작했어도 뒤 호출의 기한을 자동 연장하지 않는다"
      - "앞 액션의 응답이 단순 접수인지 업무 완료인지는 등록 계약을 따른다. 완료가 필요한 선행 조건을 접수 성공만으로 충족시키지 않는다"
      - "실패·결과 불명·선행 조건 미충족이면 후속 액션을 중단하고 성공/접수/실패/불명/미실행 범위를 사실대로 제시한다. 이미 성공한 액션의 자동 보상·롤백이나 남은 액션의 자동 재실행은 하지 않는다"
      - "부분 실행 뒤 새 요청은 기존 결과와 이번 실행 범위를 확인한다. 결과 불명이 포함되면 REQ-105.manual_reexecution의 최신 실행 확인·새 승인·반복 조건을 그대로 적용한다. 같은 인자라는 이유로 새 추가 작업을 재시도로 판정하지 않는다"
      - "같은 승인 요청의 질문·보류·의도 확인·카드 재발급·개인 순서 대기는 그 요청의 최초 승인 대기 기한이나 이미 받은 승인 기한을 새로 시작하지 않는다. 변경된 카드의 이전 승인은 REQ-017에 따라 사용할 수 없다"
      - "앞 결과에 의존해 실제 값을 아직 확보하지 못한 다음 액션의 예정 안내는 승인 요청이 아니다. 그 결과와 모든 값을 확보한 뒤 처음 제시하는 독립 개별 승인 요청은 해당 요청의 최초 제시 시각부터 대기 기한을, 사용자의 유효 승인 시각부터 실행 기한을 계산한다. 같은 대상 액션의 값 변경·카드 재발급을 독립 요청으로 위장해 기존 기한을 연장하지 않는다"
    exceptions:
      - "승인 후 값/순서/등록 계약 변경·권한 회수·만료 시 해당 승인으로 전송하지 않고 미전송 범위와 재확인 사유를 알린다"
      - "중단·전송 경합은 REQ-007·105를 따르며 중단 접수만으로 이미 전송한 업무가 취소됐다고 표시하지 않는다"
    lifecycle: "순서/값 확인 → 유효 범위 승인 → 액션별 직전 검사·전송·결과 기록 → 다음 조건 판정 또는 후속 중단 → 전체 결과 보고"
    permissions: "각 실행은 요청 사용자 본인의 명시 승인과 현재 권한이 필요하다. 일괄 승인이 권한·정책 위반을 면제하지 않는다"
    audit: "액션별 승인 버전·검사·전송·결과와 전체 요청 관계를 REQ-107에 연결하고 승인 중복 제출로 호출을 중복 시작하지 않는다"
    risk: "선행 접수를 완료로 오인하거나 일괄 승인으로 값 변경·만료를 우회하면 연속된 잘못된 업무 처리가 생긴다"
    open:
      - "@defer P3 일괄/개별 승인 범위·의존 결과 바인딩·부분 실행 표시와 승인/전송 경합을 설계한다"
    verification:
