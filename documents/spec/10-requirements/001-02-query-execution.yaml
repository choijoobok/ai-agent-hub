# 영역: 질의 해석과 실행
requirements:
  - id: REQ-004
    type: functional
    priority: must
    category: "오케스트레이션"
    actors: [ACT-001]
    title: "작업 계획·실행 상태 기반 반복 수행과 연속 도구 호출"
    detail: "한 턴의 복합 요청을 REQ-015의 작업 계획으로 관리하고, agent가 실제 수행 결과로 실행 상태를 갱신하며 다음 작업을 이어간다. LLM은 현재 유효 계획·상태를 받아 필요한 도구 호출·추가 확인·계획 보완을 연속적으로 제안할 수 있지만 실제 배정·수행·상태 확정은 서버가 담당한다. 채택한 계획과 실행 상태는 Hub DB에 영속 저장하며 대화 압축 요약으로 대체하지 않는다"
    source: "2026-10-23 사용자 제안 및 보완 요청: 복합 작업의 계획을 세우고 반복 모델 호출에 최신 작업 상태를 전달하며 순서대로 처리한다. 후속 논의에서 계획·실행 상태의 DB 저장, 대화 요약과의 분리, 의미 있는 변경 시점의 갱신 및 결과 불명/중복 실행 방지를 요구사항에 반영하도록 요청했다 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 REQ-004 전체 보완본의 확정을 명시 요청했다. 계획·실행 상태의 영속 저장과 반복 수행, 실행 의도/식별과 멱등성·사용자 확인 후 새 승인 정책 연결, 병렬 결과 반영·정상 0건·업무 결과와 답변 작성 실패 구분·정체 방지 및 검증 기준 18건을 포함해 confirmed로 확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다."
    roadmap: RM-P1
    summary: "채택한 계획과 현재 실행 상태를 서버 DB에 보존하고 필요한 최신 상태를 모델에 전달한다. 서버가 작업 제안을 검증·수행한 실제 결과로 상태를 갱신해 다음 작업 또는 기존 대기·종결 경로를 선택한다"
    intent:
      problem: "프롬프트의 서술이나 세션 메모리만 믿으면 완료 작업을 반복하거나 실패를 성공으로 보며, 대기·변경·인계 때 작업 위치와 근거를 잃을 수 있다"
      goal: "한 요청의 작업별 진행과 결과 근거를 유지해 사용자 순서·의존 관계에 따라 처리하고 중복 실행·허위 완료·무한 반복을 막는다"
      not: "매 작업마다 모델 호출·전체 이력 재전송·모델 내부 추론 저장·새 작업 관리 시스템/재사용 워크플로우·장애 턴의 자동 재실행을 요구하지 않는다"
    goal_trace: [GOAL-0, GOAL-1, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "계획의 의미·작업 구성과 변경 근거는 REQ-015, 작업 유형·후보/순서·최종 실패는 REQ-038을 따른다"
      - "모델의 구조화된 제안은 REQ-009, 현재 권한·조건·실행 승인·전송 통제는 REQ-025·103·105·106·108을 따른다"
    execution_state:
      authority: "agent가 관리하는 Hub PostgreSQL에 채택한 계획과 현재 실행 상태를 영속 저장한다. 계획 내용은 REQ-015.plan_contract를 참조하고 실행 상태는 실제 서버 판정·호출 결과로 갱신한다. LLM·대화 요약·화면 표시는 실행 상태의 정본이 아니며 모델이 제안한 완료/승인 상태를 그대로 저장하지 않는다"
      contents: "소속 턴·시도·현재 유효 회차·채택 계획과 변경 이력·상태 버전, 계획 작업 식별자별 진행 상태·시작/종료/변경 시각·대기/실패/미수행/결과 불명 사유, 확보한 입력/결과의 참조·버전·출처, 실제 모델 스텝/도구 호출과의 연결을 관리한다. 턴·회차·스텝과 계획 변경의 관계는 REQ-015.plan_contract를 따른다. 완료 여부는 해당 작업의 기준과 실제 근거를 함께 확인하며 별도 계획 버전 번호의 필요 여부·정확한 필드·상태 코드는 P3에서 정한다"
      separation: "REQ-001의 대화 요약은 과거 맥락 이해, 이 상태는 현재 작업 제어, REQ-107의 불변 이력은 발생 사실 보존을 담당한다. 그래프 실행용 체크포인트와도 논리 역할을 구분하되 서로 독립적으로 수정 가능한 실행 상태 정본을 중복하지 않는다. 물리 테이블 수를 강제하지 않고 기존 턴·작업·호출·체크포인트 구조에 연결한다"
      references: "계획/상태에 전체 조회 결과·대화 원문·프롬프트·실행 파라미터 원값을 복제하지 않고 기존 저장 대상의 참조를 둔다. 작업 제어에 필요한 최소 조건/근거에도 REQ-107·109·111의 마스킹·기한을 적용한다. 승인/호출용 원값의 제한적 암호화 임시 보관은 REQ-005.execution_parameter_storage를 그대로 사용한다"
      persistence_points: "서버가 계획을 채택/변경할 때, 실제 작업을 시작하기 전과 결과를 확인할 때, 추가 정보/승인 대기·유효 응답·조건 변경·실패·중단·종결 때 해당 유효 계획/상태와 변경 근거를 저장한다. 필수 기록 확정 전 외부 호출을 시작하지 않는다. 매 토큰·응답 청크마다 전체 계획을 저장하거나 상태 갱신만을 위해 별도 요약 모델을 호출하지 않는다"
      consistency: "현재 상태 갱신·불변 전이 사건·중복 처리·필수 기록 실패는 REQ-107.history_storage를 따른다. 실행 진행 갱신은 현재 시도·회차/계획·예상 상태 버전·유효 점유를 검사한다. 사용자대기 응답 접수·개인 순서 등록·명시 제어·만료 회수는 REQ-005·007·036·ARCH-070 등 기존 계약이 허용한 전이 주체와 현재 상태·기한·예상 버전 조건으로 처리하며 실행 점유를 일률적으로 요구하지 않는다. 이 구분으로 점유를 잃은 실행 서버의 늦은 갱신을 허용하지 않는다. 체크포인트와 상태가 불일치하면 임의로 앞선 것을 선택해 후속 실행하지 않으며 대조·차단/종결과 물리 원자성은 P3에서 구체화한다"
      recovery: "유효한 사용자대기에서 다른 인스턴스로 이어갈 때 같은 시도의 저장된 계획·상태·허용 입력을 복원하고 완료 작업을 무조건 다시 수행하지 않는다. DB 저장이 서버 장애·점유 만료 뒤 자동 재개 허용을 뜻하지 않는다. 만료 회수·중단/종결의 실행 상태 무효화와 원본 연결 새 턴 요청은 ARCH-070·REQ-013·109를 따른다"
      unknown_outcome: "외부 호출 뒤 결과 저장 전에 장애가 나면 완료 기록 부재를 미실행·실패 증거로 취급하지 않는다. 전송/실제 결과 근거를 대조하고 결과 불명은 REQ-105·NFR-022의 확인/수동 확인 경로를 사용한다. 저장·점유만으로 정확히 한 번 실행을 보장하거나 원 실행을 자동 재전송하지 않는다"
      retention: "실행용 참조/체크포인트는 REQ-109의 종결·무효화/정리, 계획 변경/수행 사실은 REQ-107의 감사, 포함된 본문·조건/결과 값은 각 원자료의 보존 정책을 따른다. 계획에 넣었다는 이유로 기한을 늘리거나 만료 값을 요약/이력에서 복원해 이어가지 않는다. 기술적 상태 메타데이터와 본문/결과의 기한을 혼합하지 않는다"
    execution_loop:
      next_work: "채택한 계획에서 사용자 지정 순서·선행 결과·현재 유효 조건을 만족하는 작업만 다음 대상으로 삼는다. 미해결 필수 조건은 REQ-025, 사용자 응답/승인은 REQ-005·026에 연결한다. 의존 작업은 선행 결과를 확보한 뒤 순차 수행하며 독립 조회의 선택적 병렬 허용은 REQ-021의 기존 경계를 유지한다"
      model_input: "모델 호출 직전에 해당 목적에 필요한 목표·현재 채택 계획/작업·유효 상태의 식별 근거·완료/대기/실패/미수행 범위·유효 입력/결과 참조·부족 조건을 최신 상태에서 구성한다. 이전 상태를 계속 덧붙이지 않는다. 데이터 값의 실제 전송은 REQ-106을 거쳐 필요한 범위만 제공하며 참조 식별자 제공을 데이터 전송 허용으로 해석하지 않는다. 의도 분류 같은 보조 호출은 REQ-035·610의 제한된 입력을 유지한다"
      proposal_validation: "REQ-009의 구조화된 제안을 요청 당시 계획/작업·상태 버전과 연결해 검증한다. 응답이 도착한 시점의 유효 상태·권한·선행 결과·실행 승인·입력 제약을 다시 검사하고 중단/변경으로 무효가 된 제안이나 중복 응답으로 새 작업을 실행하지 않는다. 같은 회차의 계획 변경도 검증 대상이며 별도 계획 버전 번호가 없다는 이유로 최신성 검사를 생략하지 않는다. 검증된 동일 모델 실행의 변경 적용 사건은 REQ-007·107에 따라 판정한다. 미완성 계획·자유 문장을 실행 명령으로 해석하지 않는다"
      perform_and_record: "서버가 검증한 호출 또는 결정적 처리를 수행하고 실제 완료·실패·미수행·결과 불명과 입력/출력 참조를 해당 계획 작업에 연결한다. 상태 저장이 확정된 뒤 필요한 후속 모델 호출/서버 처리를 이어간다. 작업 하나에 여러 모델 스텝·도구 호출이 연결될 수 있고 모델 없이 끝나는 작업도 있다. 계획 작업 수를 TRM-003의 실제 모델 응답 실행 수로 세지 않는다"
      replan: "사용자 변경·추가 정보·허용된 실제 결과로 계획 보완이 필요하면 REQ-015의 변경 규칙을 적용하고 영향받는 입력·결과·대기/승인만 기존 REQ-007·108 기준으로 재검증한다. 변경 전 수행 사실은 보존하며 단순 계획 변경으로 완료 작업을 재수행하거나 스텝 예산을 초기화하지 않는다"
      completion: "채택한 요청 범위의 모든 필수 작업이 실제 완료됐거나 execution_boundaries.not_required의 조건상 불필요 근거로 요청 목적을 충족하고 필요한 최종 결과·상태 기록이 확정돼야 전체 완료로 응답한다. 모델의 최종 문장만으로 미수행 작업을 완료 처리하거나 실패 작업을 계획에서 삭제해 완료로 만들지 않는다. 접수만 확인된 외부 실행·결과 불명·부분 자료는 실제 계약상의 상태와 범위를 그대로 알린다"
      stop: "최종 실패의 후속 차단·완료/미수행 보고는 REQ-038.composite_outcome을 따른다. 정상 0건을 실패와 혼동하지 않는다. NFR-013의 누적 스텝/정체 제한·기존 호출 재시도 규칙을 적용하며 모델이 반복 제안한다고 같은 실패 작업을 무한 수행하거나 새 턴으로 한도를 우회하지 않는다. 외부 비동기 업무의 상태 자동 폴링도 새로 허용하지 않는다(REQ-009.result_dialogue)"
    execution_identity:
      binding: "서버가 사용자 요청·채택 계획 작업·승인 근거에 연결한 실행 식별자와 실제 호출 시도를 관리한다. 같은 실행의 재시도는 원 실행과 연결하고, 명시적인 별도·추가 업무는 별도 실행 근거를 가진다. 모델의 새 호출번호·작업명만으로 새 실행 권한이 생기지 않는다. 같은 파라미터라는 이유로 업무 중복을 추정하거나 정상 별도 작업을 차단하지 않는다(REQ-113)."
      reproposal: "진행 중·완료·결과 불명인 기존 수행을 반복하려는 제안은 원 수행과 실제 사실·현재 승인에 대조한다. 중복 전달은 기존 처리에 연결하고, 반복/추가 의도가 불명확하면 필요한 사용자 확인으로 연결한다. 한 계획 작업의 일부 호출이 성공한 뒤 실패해도 성공한 호출 사실을 보존하며 계획 작업 재시도를 이유로 전부 재실행하지 않는다."
      policy: "멱등성 보장 여부와 기본 미보장는 REQ-105.idempotency_contract가 정본이다. 결과 불명 원 실행의 자동 재전송은 금지하며 사용자 대상 시스템 확인과 새 승인에 따른 후속 실행은 REQ-105.manual_reexecution·REQ-013을 따른다. 원 결과와 종결 턴을 바꾸거나 이전 승인/체크포인트를 재사용하지 않는다."
    execution_boundaries:
      parallel_results: "독립 조회를 병렬 수행할 때 다른 유효 작업의 진행으로 상태 버전만 바뀐 경우와, 해당 결과의 계획·입력·권한·기한·점유가 무효가 된 경우를 구분한다. 저장 충돌 시 현재 유효 조건으로 결과 반영 가능성을 다시 검사하고 유효한 독립 결과와 기존 완료 사실을 보존한다. 충돌만으로 도구를 재호출하지 않으며 필요한 선행 결과가 모두 유효하게 반영됐을 때 후속 작업의 시작을 한 번만 확정한다. 점유 상실·사용자 중단/변경을 이 경로로 우회하지 않는다."
      not_required: "사용자 요청의 조건과 실제 정상 결과로 후속 작업이 불필요해지면 해당 조건·결과 근거와 실행하지 않은 이유를 남긴다. 예를 들어 미출고 주문이 있으면 출고 요청하라는 조건에서 정상 0건이면 출고를 수행하지 않고 대상 없음·실행 없음을 알린다. 요청 목적이 충족된 경우 종결할 수 있으나 실제 실행 완료로 기록하지 않는다. 실패·권한 부족·잘림·부분 자료·확인 불가는 정상 0건/불필요로 대체하지 않고 필수 산출물을 임의 제외하지 않는다. 물리 상태 코드는 P3에서 기존 상태와 연결한다."
      response_failure: "이미 확인된 업무 수행 결과와 최종 설명/응답 작성의 성공·실패를 구분한다. 답변 작성 실패가 업무 성공을 실패·미실행으로 바꾸거나 원 업무 재실행의 근거가 되지 않는다. 필수 기록·현재 공개 권한을 충족한 확인 사실과 실패 위치를 안내하고 전체 요청 완료 여부는 completion 및 REQ-107을 따른다. 사용자가 응답 재작성을 요청하면 REQ-027·039·106에 따라 유효한 기존 결과만 이용하며 원 업무를 반복하지 않는다. 자동 모델 재호출 허용을 새로 만들지 않는다."
      no_progress: "계획 문구 변경·상태 저장·점유 갱신만을 업무 진전으로 세지 않는다. 필수 작업이 남았지만 실행 가능한 작업·진행 중 호출·유효 사용자대기가 모두 없으면 막힌 근거를 판정한다. 사용자 정보로 해소할 수 있는 부족분만 기존 확인 경로로 보내고 계약 오류/처리 불가는 기존 실패·중단 경로로 연결한다. NFR-013의 진전·정체 기준과 유한 제어를 적용하며 감지 횟수/시간은 P3에서 정한다."
    data:
      - { item: "현재 채택 계획·작업별 현재 상태·실제 수행/결과/입력 참조·변경 이력", origin: "사용자 의도·검증한 계획과 실제 서버 수행 사실", sensitivity: "업무 조건·개인정보를 포함할 수 있어 값은 기존 보호/보존 정책 적용", retention: "execution_state.retention 및 REQ-107·109" }
    business_rules:
      - "계획 구성은 REQ-015, 실행 상태의 저장·갱신·반복 수행은 execution_state·execution_loop, 공통 감사 원자성은 REQ-107.history_storage가 정본이다"
      - "계획의 예정 작업은 실제 진행 이력이 아니다. 사용자 표시·시간은 REQ-006, 계획 제시·확인은 REQ-022·023을 따르며 저장 기능 때문에 예상 진행률/세부 단계 표시를 추가하지 않는다"
    exceptions: ["기록 실패·낡은 상태·결과 불명·만료 입력을 정상 완료/미실행으로 보정하지 않는다. 해당 저장/실행/보존 정본의 안전한 대기·실패·종결 경로를 사용한다"]
    lifecycle: "계획 채택/저장 → 현재 상태로 다음 작업 판정 → 필요 시 모델 제안 → 서버 검증/수행 → 결과·상태 저장 → 후속 작업 또는 기존 대기/종결. 새 턴 상태 체계를 신설하지 않는다"
    permissions: "서버가 접근마다 현재 권한·전송·승인을 확인하며 저장된 계획·과거 허용 판정으로 대체하지 않는다"
    audit: "계획/작업과 실제 스텝·호출·상태 전이의 연결을 REQ-107에 남긴다. 모델 내부 추론 전문이나 전체 결과 사본을 새로 요구하지 않는다"
    volume: "작업 수와 실제 모델 스텝/호출 수를 구분한다. 기존 입력·결과·스텝·개인 실행 한도와 정체 제한을 유지한다"
    config: "별도 저장 주기·요약 모델·자동 재실행 설정을 도입하지 않는다. 필요한 모델·대기·한도 설정은 기존 정본을 따른다"
    risk: "계획·체크포인트·실제 외부 호출이 어긋나거나 상태 저장 전 장애가 나면 중복 실행·허위 완료가 발생할 수 있어 변경 경합·기록 실패·결과 불명 시험이 필요하다"
    acceptance: "복합 요청을 현재 유효 계획·작업 상태와 실제 결과에 따라 이어가고, 대기 후 다른 인스턴스에서도 같은 유효 시도를 복원한다. 대화 요약·모델 완료 주장·낡은 응답으로 작업 상태를 확정하지 않는다. 필수 기록 실패·만료/중단·결과 불명에서 자동 재실행/허위 완료 없이 해당 통제를 적용한다"
    verification:
      - { case: "출고 조회·주문 조회·비교 집계·결과 정리의 복합 요청", expected: "계획 작업에 실제 수행/결과를 연결하고 다음 호출에는 갱신된 필요한 상태만 제공한다. 필요한 모든 작업의 완료 기준을 확인한다" }
      - { case: "한 계획 작업에 여러 모델 호출 또는 모델 없는 결정적 집계", expected: "계획 작업·실제 모델 스텝·도구 호출을 구분해 기록하고 실제 새 모델 응답 실행만 스텝으로 센다" }
      - { case: "대화 요약은 완료라고 쓰였지만 DB 작업 상태는 대기/결과 불명", expected: "요약을 근거로 완료하거나 다음 의존 작업을 실행하지 않는다" }
      - { case: "계획 채택/작업 시작의 필수 저장 실패 또는 결과 수신 뒤 기록 실패", expected: "전자는 후속 외부 호출을 시작하지 않고 후자는 신규 후속 작업·최종 성공을 차단한다. 외부 호출을 무조건 반복하지 않는다" }
      - { case: "점유를 놓은 유효 사용자대기의 응답 접수 후 다른 인스턴스에서 이어가기", expected: "허용된 전이 주체가 점유 없이도 응답을 영속 접수·개인 순서 등록하고 실행 차례에 점유를 얻어 같은 유효 시도의 계획/상태를 복원한다. 현재 권한·기한을 검사하며 완료 작업을 무조건 다시 수행하지 않는다" }
      - { case: "만료 회수 주체의 종결 처리·중단/종결 뒤 저장된 계획 발견", expected: "기존 계약의 유효 만료 회수 주체는 실행 점유 없이도 상태/기한/예상 버전을 검사해 종결한다. 저장 존재로 재개하지 않고 기존 무효화/정리·명시적 새 턴 요청 규칙을 따른다" }
      - { case: "외부 실행 성공 가능성이 있지만 응답/결과 저장 전에 장애", expected: "미실행으로 추정하지 않고 결과 확인/수동 확인으로 연결한다. 원 실행 자동 재전송과 정확히 한 번 실행 보장을 하지 않는다" }
      - { case: "같은 회차의 계획 변경으로 무효가 된 모델 응답·중복 결과·유효 점유를 잃은 상태 갱신", expected: "현재 계획/조건/상태 버전과 점유를 대조해 실행·현재 상태 반영을 차단하고 필요한 과거 사실/사용량은 보존한다. 검증된 동일 모델 실행의 변경 적용 사건은 REQ-007·107에 따라 판정한다" }
      - { case: "선행 결과 만료·권한 회수 또는 체크포인트/상태 불일치", expected: "저장 참조가 있다는 이유로 사용하지 않으며 요약/감사에서 값을 되살리거나 임의 상태를 골라 후속 실행하지 않는다" }
      - { case: "모델이 미수행 작업을 빼고 최종 완료 선언", expected: "서버가 요청 범위·필수 작업·결과 근거를 대조해 전체 완료로 확정하지 않는다" }
      - { case: "같은 실패 제안 반복·재계획·회차 변경·독립 작업 잔여", expected: "기존 실패/재시도/정체/스텝 한도를 유지하고 최종 실패 뒤 독립 작업도 새로 시작하지 않는다. 새 턴 자동 생성으로 우회하지 않는다" }
      - { case: "보조 의도 분류·스트리밍 청크·전체 조회 결과 참조", expected: "호출 목적별 최소 입력을 유지하고 전체 상태/결과를 무조건 전송하지 않는다. 청크별 계획 전체 저장·상태 요약 전용 모델 호출·보존 기한 연장은 없다" }
      - { case: "같은 실행의 새 호출번호 재제안과 같은 인자의 명시적 추가 작업", expected: "서버 실행/원 수행·요청/승인 근거를 대조한다. 새 번호만으로 재실행하지 않고 정상 별도 작업은 파라미터 같음을 이유로 막지 않는다. 결과 불명 후속 실행은 REQ-105.manual_reexecution을 따른다" }
      - { case: "한 계획 작업의 여러 호출 중 앞 호출 성공 뒤 후속 실패", expected: "성공한 호출 사실·결과를 보존하며 작업 전체 재시도를 이유로 앞 호출을 자동 반복하지 않는다" }
      - { case: "독립 조회 두 개의 동시 결과·역순 도착·상태 버전 충돌", expected: "현재 유효성을 재검사해 정상 결과 둘을 한 번씩 반영하고 선행 합류 후 후속 작업을 한 번만 시작한다. 저장 충돌로 재조회하지 않으며 중단·계획 변경으로 무효가 된 결과는 채택하지 않는다" }
      - { case: "조건부 출고 요청의 정상 0건과 실패·부분 자료", expected: "정상 0건은 조건상 불필요 근거를 남겨 출고 실행 없이 요청 목적 충족을 알린다. 실패/잘림/권한 부족을 0건으로 바꾸거나 출고 실행 완료로 기록하지 않는다" }
      - { case: "업무 실행 성공 후 최종 답변 작성 실패", expected: "원 업무 성공과 응답 작성 실패를 구분한다. 허용된 기존 결과 재작성에서도 외부 업무 실행 횟수가 늘지 않는다" }
      - { case: "계획 표현만 반복 변경 또는 실행 가능한 작업 없는 상태", expected: "진전으로 오인하지 않고 부족 조건 확인 또는 기존 실패·중단으로 연결한다. 유효 대기·진행 중 호출은 잘못된 정체로 판정하지 않는다" }
