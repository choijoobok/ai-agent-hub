      - { kind: "정상", case: "B가 추가 정보 대기로 점유를 놓은 뒤 C가 유효한 사용자 응답을 받아 점유를 획득한다. 현재 시도의 상태를 이어가며 이전 단계의 완료된 액션을 임의로 다시 실행하지 않는다" }
      - { kind: "예외", case: "B의 점유 만료 후 이전 모델 응답이 도착한다. 중단 상태를 되살리지 않고 필요한 호출 감사·사용량의 기록 경계를 확인한다. 원 질의의 명시적 재요청은 원본에 연결된 별도 새 턴/시도로 접수한다" }
      - { kind: "예외", case: "portal의 일시적 폴링 실패 동안 턴은 완료된다. 재접속 조회로 현재 결과를 확인하며 질의나 업무 API를 다시 전송하지 않는다" }
      - { kind: "예외", case: "질의 임베딩이 실패하면 NFR-021의 태그 검색 경로를 따르고, 관리자 지식 재임베딩 비용을 해당 질의 사용자의 사용량으로 섞지 않는다" }
      - { kind: "예외", case: "업무 API 전송 후 응답을 받기 전에 실행 인스턴스가 종료된다. 결과 불명을 성공·미실행으로 단정하거나 자동 재전송하지 않고 기존 확인·재요청 경계를 따른다" }
    volatility: { level: medium, what: "관련 요구사항 정련과 실환경 검증에 따른 상세 분기·상태/메시지/저장 계약 및 운영 설정 적용 지점" }
    open:
      - "@defer P2 2026-10-27 전체 흐름도·상세 시퀀스 8개의 요구사항 대조·보완 결과를 소유 작업흐름의 상세 설계 승인 입력으로 사용한다. 요구사항 확정과 문서 대조는 완료했으며 상태·책임 경계의 설계 승인과 물리 계약·실행 시험은 별도다"
      - "@defer P2 관련 요구사항 검토 후 전체 개요와 각 주체의 상태·책임·분산 점유·데이터 저장 경계를 대조한다. ARCH-015의 폴링 규칙을 사용자대기·일시 조회 실패·재접속까지 상태별로 구체화한다"
