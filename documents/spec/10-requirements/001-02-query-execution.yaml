  - id: REQ-023
    type: functional
    process_step: PRC-02-01
    priority: must
    category: "계획·교정"
    actors: [ACT-001]
    title: "조회 계획 확인을 모든 턴에 강제하지 않는다"
    source: "2026-10-26 사용자 요청으로 확인 근거·대기/응답·계획 변경 재확인을 보완했다. 후속 명시 요청으로 규모 추정을 기본 전제에서 제외하고 예상 규모 초과·추정 불가에 의한 기본 계획 확인을 제거한다. 실제 페이지 상한·초과 감지와 portal의 후속 페이지 처리는 NFR-001~003·REQ-011을 따른다. 전체 카드 확정은 별도다"
    roadmap: RM-P1
    detail: "강제 조건은 정책으로 관리하고, 기본값은 ① 대상 업무 데이터 영역이 복수일 때 ② 대상/조건 해석·선별 근거가 모호할 때 ③ 업무 액션이 포함된 턴이다. 예상 결과 규모·규모 추정 불가는 기본 확인 조건으로 사용하지 않는다"
    hard_rule: "**③에서 계획 확인과 실행 승인을 하나로 합치지 않는다** — 전자는 '무엇을 하려는지 맞나'를, 후자는 '해당 대상·순서·실제 값으로 업무 액션을 실행해도 되나'를 묻는다"
    why: "매 조회마다 확인을 요구하면 대화가 느려지고 사용자가 확인을 습관적으로 넘긴다"
    multi_source_confirmation: "REQ-021의 다중 원천 조회에서도 위 강제 확인 정책을 유지한다. 확인 대상은 여러 업무 데이터의 사용·조건·결합 계획이지 데이터소스 하나를 고르는 조작이 아니다. 모두 필요한 원천은 유지하고 실제로 대체 가능한 원천이나 결합 기준이 모호할 때 해당 선택/조건을 확인한다. 계획 확인이 접근 권한·실행 승인·모델 전송 동의를 대신하지 않는다"
    summary: "현재 계획의 복수 업무 영역·해석 모호성·업무 액션과 운영 정책으로 확인 필요성을 판정한다. 규모 사전 추정을 요구하지 않고 실제 조회의 페이지 상한·후속 페이지 처리는 NFR-001~003·REQ-011에 연결하며 업무 실행 승인은 별도로 받는다"
    intent:
      problem: "모든 조회를 멈추면 불필요한 응답 부담이 생기지만 확인 생략 기준이 모호하면 잘못 해석한 범위나 큰 요청을 사용자 의도와 다르게 처리할 수 있다"
      goal: "같은 근거로 일관되게 확인 필요성을 판단하고 사용자가 확인한 현재 계획의 범위 안에서만 이어간다"
      not: "접근/실행 권한 부여·실행 승인 생략·모델 전송 동의 대체·결과 규모 추정을 위한 새 원천 조회·모든 턴의 일률적 확인이 아니다"
    goal_trace: [GOAL-1, IN-02]
    decider: "제품 오너(사용자)"
    preconditions:
      - "확인할 계획은 REQ-015·022의 현재 유효 내용이며 대상/필수 조건은 REQ-025의 확인 가능한 근거를 갖춘다"
      - "운영 정책의 설정/적용은 REQ-614, 대기/응답·교정은 REQ-005·007, 실제 실행 승인은 REQ-026을 따른다"
    confirmation_policy:
      decision: "서버가 현재 계획·판정 근거·적용 정책을 연결해 확인 필요/불필요와 사유를 정한다. 기본값은 detail의 세 조건 중 하나라도 충족하면 확인이다. 필요한 입력/대상이 바뀌면 다시 판정하고 LLM의 '확인 불필요' 문장이나 사용자 우회 요청만으로 건너뛰지 않는다. 정책 적용 자체가 불가능하면 해당 작업을 보류하고 설정 문제를 안내한다"
      business_areas: "복수 여부는 사용자가 구분해 이해할 업무 목적/데이터 영역의 단위로 판정한다. 주문과 출고를 함께 비교하면 복수 영역이며, 같은 출고 영역을 여러 데이터소스·스키마·테이블로 조회한다는 물리 개수만으로 복수 영역이라 세지 않는다. 허용된 지식/카탈로그의 업무 의미와 계획 대상을 근거로 연결하고 분류가 모호하면 그 부분을 확인한다. 별도 업무 영역 마스터 신설을 요구하지 않는다"
      uncertainty: "대체 가능한 대상·기준일·조건 해석·집계/결합 기준 등 업무 결과를 바꿀 복수 해석이 남으면 낮은 확신의 근거로 삼는다. 확인할 선택과 차이를 설명하며 모델의 자기 평가 점수 하나나 임의 확률 임계치만으로 판단하지 않는다. 카탈로그 근거 부재·권한 제한처럼 답변으로 해소할 수 없는 문제는 REQ-025의 처리 불가로 연결한다"
      size_boundary: "계획 단계의 정확한 건수·예상 규모·비용 추정을 진행 전제로 삼지 않는다. 추정치가 없거나 예상 규모가 크다는 이유만으로 기본 계획 확인을 만들지 않으며 전수 조회·COUNT·별도 모델 호출로 이를 보충하도록 요구하지 않는다. 필수 기간/최대 범위는 REQ-025·301로 검증하고 실제 반환 행·시간·크기 제한과 페이지 초과 판정은 NFR-001~003을 따른다"
      paging_boundary: "결과가 한 페이지의 상한을 넘으면 REQ-011에 따라 portal이 페이징 필요 안내와 다음 페이지 요청을 처리한다. 유효한 같은 조회의 페이지 이동마다 업무 계획 확인이나 새 모델 호출을 요구하지 않는다. 질의 의미·조건을 바꾸는 요청은 기존 교정/새 질의 규칙을 적용한다. 실행 계획 기반 비용 검토는 NFR-001의 선택 기능이며 이 카드의 기본 확인 조건과 분리한다"
      action: "업무 상태를 바꾸는 등록 액션이 포함된 경우의 기본 계획 확인은 목적·대상·업무 순서가 맞는지 묻는다. 모든 실제 파라미터 확보/검증과 최종 실행 승인은 REQ-005·026에서 별도로 받으며 두 판단을 한 번의 모호한 동의로 합치지 않는다"
      scope: "확인은 제시된 업무 범위·조건·순서·결합·제한과 그에 연결된 현재 계획에만 유효하다. 필수 조건 보완·대상 선택이 함께 답변됐더라도 목적별 충족 여부를 각각 판정한다. 확인 필요 여부 판정 자체를 위한 새 전용 모델이나 별도 승인 상태 체계를 만들지 않는다"
    confirmation_flow:
      before_work: "필수 확인이면 REQ-022의 계획과 확인 사유를 제시하고 확인 대상의 업무 조회/실행을 시작하기 전에 기존 사용자대기로 연결한다. 계획 수립에 필요한 허용된 지식/카탈로그 탐색은 구분한다. 복합 요청의 일부 범위만 확인받은 것으로 미확인 의존 작업까지 진행하지 않는다"
      wait_type: "계획 확인은 WT-02 추가 정보 대기에서 현재 계획에 대한 확인이 필요하다는 목적/요구 항목으로 연결한다. 실제 액션의 실행 승인인 WT-01이나 처리 중 새 입력의 의도 분류에 쓰는 WT-03으로 대신하지 않는다. 별도 턴 상태나 대기 유형을 신설하지 않는다"
      response: "계속할 뜻이 명확하고 현재 확인 요청/계획에 연결되는 응답만 유효하게 받는다. '진행해' 같은 자연어도 대상이 특정되면 계획 확인으로 처리할 수 있으나 실제 실행 승인은 아니다. 여러 대기 요청 중 대상이 모호하면 확인하고 무응답·단순 열람·화면 닫기를 동의로 보지 않는다"
      correction_or_decline: "수정 요청은 REQ-007·015·022에 따라 반영한 뒤 확인 필요성을 다시 판정한다. 계획을 거절하면 거절된 내용으로 진행하지 않고 기존 기한 안에서 수정 의도를 확인한다. 중단은 REQ-007·033, 별개 질의는 REQ-030으로 구분한다. 실제 실행 승인 거절의 REQ-017 절차와 계획 거절을 혼동하지 않는다"
      reconfirmation: "확인받은 목적·대상 업무 영역·기간/조건·집계/결합 기준·업무 순서·중요 제한이 달라지면 영향받는 확인을 무효화하고 새 계획으로 다시 판정한다. 여전히 확인 조건에 해당하면 변경 부분을 알리고 다시 확인받는다. 업무 의미가 같은 설명 문구 수정·실제 진행 상태 변화·모델 호출마다 재확인을 요구하지 않는다. 같은 회차의 의미 변경도 예외가 아니다"
      wait_and_resume: "대기 요청/유효 계획·필수 기록을 저장한 뒤 공개하고 REQ-005·036의 실행 점유 해제·개인 순서·원래 만료 시각을 따른다. 유효 응답 뒤에도 차례가 되면 현재 권한·계획·적용 정책/자료 유효성과 해당 확인을 다시 대조하며 정책 변경의 적용 시점은 REQ-614의 항목별 계약을 따른다. 응답·교정·재표시로 기한을 연장하지 않는다"
      stale_or_duplicate: "이전/교체된 계획·다른 턴/시도·만료·종결 뒤 응답으로 진행하지 않는다. 같은 응답 재전송·다중 탭·접수 응답 유실은 기존 접수 결과/현재 상태를 확인하며 확인 요청이나 이어가기 실행을 중복 생성하지 않는다. 화면 복원은 REQ-040을 따른다"
      fail_closed: "정책 조회·판정·대기 저장·현재 계획/응답 연결이 실패하면 정상 확인 또는 불필요로 보정하지 않고 해당 작업을 진행하지 않는다. 모델의 설명이나 과거 계획 확인 이력으로 현재 실패를 우회하지 않는다"
    data:
      - { item: "확인 필요/불필요 판정·업무 영역/모호성/액션 근거·정책 참조·현재 계획/확인 요청·유효 응답/교정/만료", origin: "유효 계획·운영 정책·사용자 응답·서버 판정", sensitivity: "허용된 업무 범위만 공개하고 정책 내부값·권한 밖 대상을 노출하지 않음", retention: "REQ-004·107·109의 현재 상태/불변 사건/본문 보존" }
    business_rules:
      - "계획 확인을 받았다는 이유로 조회 제약·접근 권한·데이터 전송 동의·실행 승인을 생략하지 않는다. 정책으로 확인을 생략하는 경우에도 나머지 통제는 그대로다"
      - "계획 표시와 사용자 응답을 기다리는 것은 다르다. 확인이 필요 없으면 REQ-022의 간결한 표시 후 기존 수행 경로를 사용한다"
      - "대기 응답·늦은 결과·정책/계획 변경의 경합은 현재 유효 상태로 판정하고 과거 확인 사실 자체는 이력으로 보존한다"
    exceptions: ["규모 추정 불가는 기본 확인 사유가 아니며 확인 정책 미로드/오류는 설정 문제로 구분한다", "조건/근거/권한 부족은 사용자 확인만으로 해소되지 않으며 REQ-025의 질문 또는 처리 불가를 따른다"]
    lifecycle: "현재 계획/근거로 정책 판정 → 불필요면 수행 / 필요하면 계획 제시·기존 사용자대기 → 확인/교정/거절·중단·만료 → 현재 유효성 검사 후 이어가기 또는 종결"
    permissions: "현재 사용자·대화·턴에 연결된 응답만 사용한다. 확인은 의도 확인이지 접근/실행 권한을 부여하는 행위가 아니다"
    audit: "확인 필요/생략 사유와 적용 정책·계획, 유효 응답·무효화/변경·만료를 REQ-107에 연결한다. 실제 실행 승인과 조회의 페이지 상한·후속 페이지 요청은 각각의 실제 사실로 구분해 기록한다"
    volume: "확인 판정은 현재 계획 근거를 활용하며 매 모델 스텝이나 단순 표시 갱신을 새로운 확인 요청으로 세지 않는다"
    config: "계획 확인의 정책 관리 원천은 REQ-614를 사용한다. 기본 조건은 이 카드, 실제 페이지 행/시간/크기 제한은 NFR-001~003이 소유한다. 정책의 가변 범위·설정 키·변경 적용 시점은 P2/P3에서 정하며 규모 확인 임계치나 별도 설정 저장소를 이 카드에서 신설하지 않는다"
    risk: "물리 원천 수를 업무 영역 수로 오인하거나 규모 미상을 확인 사유로 남기면 불필요한 대기가 생긴다. 낡은 계획 확인의 재사용과 페이지 이동을 계획 변경으로 오인하는 경합도 검증해야 한다"
    acceptance: "기본 확인 조건과 근거로 필요/불필요를 일관되게 판정하고 규모 사전 추정·규모 미상 확인을 요구하지 않는다. 필요한 작업은 현재 계획에 대한 유효 응답 전 시작하지 않으며 교정/만료/중복 응답·실행 승인의 경계를 지킨다. 페이지 상한 초과와 후속 조회는 NFR-001~003·REQ-011로 연결한다"
    verification:
      - { case: "명확한 단일 업무 영역·액션 없음·규모 추정치 없음", expected: "규모를 알 수 없다는 이유로 계획 확인을 강제하지 않으며 다른 권한/필수 조건 검사는 유지한다" }
      - { case: "한 데이터소스에서 주문과 출고를 비교", expected: "물리 원천이 하나여도 복수 업무 영역이라는 기본 사유로 확인한다" }
      - { case: "동일 출고 업무를 여러 데이터소스/테이블로 조회", expected: "물리 개수만으로 복수 영역이라고 판정하지 않고 모호성·업무 액션 등 나머지 확인 조건을 평가한다" }
      - { case: "대상/기준일/결합 의미가 복수 해석 가능", expected: "실제 차이를 제시해 확인하며 모델의 자신감 점수만으로 생략하지 않는다" }
      - { case: "예상 규모가 크거나 통계/과거 건수 근거가 없음", expected: "기본 계획 확인 사유로 사용하거나 사전 COUNT를 요구하지 않는다. 필수 조회 제약·실제 실행 상한은 유지한다" }
      - { case: "규모 추정 불가와 확인 정책 미로드", expected: "전자는 기본 확인/보류 사유가 아니고 후자는 설정 오류로 보류한다. 두 원인을 혼동하지 않는다" }
      - { case: "조회 후 상태 변경 액션이 포함된 요청", expected: "기본 계획 확인과 모든 값 확보 뒤의 실제 실행 승인을 분리하며 계획 동의만으로 실행하지 않는다" }
      - { case: "현재 계획에 대한 명확한 자연어 동의와 대상 불명 응답", expected: "WT-02의 해당 계획 확인 요구에 연결해 전자는 계획 확인으로만 사용하고 후자는 대상부터 확인한다. WT-01 실행 승인·WT-03 새 입력 의도 확인과 혼합하지 않으며 무응답/열람은 동의가 아니다" }
      - { case: "확인 뒤 같은 회차에서 기간/원천 역할/결합 기준 변경", expected: "영향받는 확인을 무효화하고 현재 계획으로 재판정하며 필요한 재확인 없이 진행하지 않는다" }
      - { case: "업무 의미가 같은 표현 수정·작업 상태 갱신·모델 후속 호출", expected: "그 이유만으로 같은 계획을 반복 확인하지 않는다" }
      - { case: "계획 거절·교정·중단·별개 질의", expected: "각 의도를 구분하고 거절된 계획으로 진행하거나 최초 대기 기한을 연장하지 않는다" }
