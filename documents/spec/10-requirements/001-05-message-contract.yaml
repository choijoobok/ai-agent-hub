# 영역: 공통 메시지·작업·프롬프트 계약
requirements:
  - id: REQ-009
    type: functional
    priority: must
    workstream: integration
    category: "요청·응답 계약"
    priority_reason: "portal·agent·모델 구현체가 같은 요청·작업·결과를 다르게 해석하면 잘못된 실행이나 승인·보안 우회가 발생하므로 RM-P1의 필수 기반이다"
    actors: [ACT-001, ACT-009]
    process_step: PRC-05-02
    title: "portal·agent·모델 간 공통 메시지와 작업·프롬프트 계약"
    detail: "Hub는 portal↔agent의 제품 메시지, agent↔모델의 공통 요청·응답 및 작업 요청·결과, CLI·공급사별 API의 변환 규약을 정의해야 한다. 메시지 유형·모델 호출 목적·요청 가능한 작업 유형을 구분하고, 반복적인 입력값 확보·조회·사용자 확인·실행·결과 전달의 모든 정상·예외 경로를 연결한다. 호출 목적별 허용 입력과 출력 계약, 프롬프트 구성 항목, 그래프의 상태·분기·대기·재개 연결 및 구현체 공통 시험을 설계에서 구체화한다"
    hard_rule: "Hub가 구성하는 업무 맥락·규칙·허용 작업·입출력 의미를 구현체 간에 유지한다. 모델의 작업 요청은 구조화된 제안이며 agent가 현재 단계·계약·권한·승인·입력값을 검증한 뒤에만 수행한다. 자유문장, 미완성 출력, 이전 시도나 무효화된 회차의 응답으로 작업을 실행하지 않는다. 공급자 전송 형식과 모델의 자연어 결과가 문자 단위로 같아야 한다는 뜻은 아니며, CLI 미지원 기능은 CON-033·034에 따라 드러내고 운영 API 기준 계약을 축소하지 않는다"
    note: "계약 버전·호환성·계약 시험의 소유자는 integration이다(ARCH-019). agent는 공통 메시지·작업 처리와 프롬프트 구성을, portal은 제품 메시지 표시·사용자 응답을 맡는다. 공급자 변환은 FEAT-304·IF-003, 프롬프트 규칙의 구성·변경·리비전은 REQ-610, Spring AI·LangGraph4j의 선택과 역할은 ADR-001·003을 따른다"
    source: "2026-10-12 사용자 요청 — 개발용 CLI와 운영용 구독 API의 업무 내용·통신 의미 일치, portal-agent-LLM 메시지 유형의 누락 없는 정의, 반복 파라미터 확보, 호출 목적별 프롬프트와 모델 작업 요청, LangGraph4j 연결을 REQ-009에 구체화한다. 같은 날 추가 요청으로 매 호출의 응답 형식·작성 지침 제공, 소스 계약과 실제 검증·분기의 일치, 응답 타입·단계별 계약·기술 템플릿의 관리와 어노테이션의 역할을 보완한다. 2026-10-12 사용자가 전체 보완본을 명시 확정했다. 카드 확정은 게이트·구현 승인과 별개다. 2026-10-21 사용자 승인: API·커스텀 도구의 공통 결과 안내와 지식 매핑별 업무 후속 절차를 자연어 가이드로 관리하고, LLM의 안내·질문 및 사용자 응답에 따른 후속 처리를 기존 통제 안에서 연결한다. 2026-10-26 사용자 요청으로 REQ-004 보완 논의와 멱등성 제공자 계약·기본 미보장, 대상 시스템 수동 확인·새 승인 후 후속 실행 및 반복 경계를 반영했다. 이번 요청은 요구사항 반영이며 전체 보완 카드 확정·단계 게이트·상세 설계·소스 구현 승인은 별도다. 이어서 2026-10-26 사용자가 이번 보완으로 재확정 대기로 바뀐 요구사항의 재확정을 명시 요청하여 REQ-009 전체 보완본을 confirmed로 재확정했다. 단계 게이트·상세 설계·소스 구현 승인은 별도다. 2026-10-28 사용자 승인: REQ-602의 보조 대체 권장안에 따른 관련 계약 보완."
    roadmap: RM-P1
    summary: "구현체를 바꿔도 같은 업무 의미와 통제를 유지하며 메시지·작업·결과를 주고받는다. 입력값 확보를 위한 반복 호출부터 사용자 승인·실행·실패·재접속까지 연결하고, 단계별 프롬프트·상태·계약 시험의 설계 범위를 명시한다"
    intent:
      problem: "같은 요청을 CLI·공급자 API·그래프·portal이 다르게 해석하거나 이전 응답·미완성 지시를 실행하면 파라미터 오류, 문맥 혼입, 중복 실행과 잘못된 완료 안내가 발생한다"
      goal: "전체 업무 흐름에서 누가 어떤 정보와 작업을 요청하고 어떤 검증을 거쳐 결과를 돌려주는지 일관되게 정의하고 시험한다"
      not:
        - "모델의 자연어 문장·판단 결과나 공급자 내부 동작을 동일하게 보증하지 않는다. 공통 계약의 의미·검증·통제 준수가 대상이다"
        - "이 카드에서 정확한 메시지 코드·필드·자료형·JSON 구조·프레임워크 메서드·프롬프트 문구를 확정하지 않는다"
        - "메시지 유형을 늘려 미등록 기능·임의 코드 실행·임의 모델 전환·새 실행 권한을 허용하지 않는다. REQ-602의 보조 대체는 서버 정책이며 모델 메시지가 이를 결정하지 않는다"
        - "모든 단계에 모델 호출이나 전체 이력·지식·데이터 전송을 강제하지 않는다. 결정적 서버 처리는 모델 호출 없이 수행할 수 있다"
    goal_trace: [GOAL-0, GOAL-1, IN-02, IN-06]
    decider: "제품 오너(사용자)"
    preconditions:
      - "REQ-038의 지식 기반 후보 범위·작업 유형·의존 순서·부분 실패 규칙을 메시지와 작업 계약에서 표현한다"
      - "REQ-608·REQ-612의 등록된 입력·출력 계약과 REQ-303의 매핑별 사용 설명을 사용하며, 유형별 프롬프트 구성·리비전 원칙은 REQ-610을 따른다"
      - "실행 자율성·권한·승인·전송 통제는 REQ-102·REQ-103·REQ-105·REQ-106·REQ-112를, 기존 진행·변경·재시도·재접속 경계는 REQ-013·REQ-030~035·REQ-040을 따른다"
      - "CLI 사용·운영 API 검증의 차이는 CON-033·034, 모델 호출 계층과 그래프 실행 계층의 선택은 ADR-001·003, 실환경 재현 전제는 ASM-003을 따른다"
    contract_scope:
      - { layer: "portal ↔ agent", subject: "접수·제어·상태·사용자 확인·결과의 제품 계약", owner: "integration — agent가 생산하고 portal이 표시·응답하며 ARCH-019의 버전·호환성 규칙을 적용" }
      - { layer: "agent ↔ 모델 공통 인터페이스", subject: "호출 목적·허용 입력·출력·작업 요청·작업 결과의 공통 의미", owner: "agent와 FEAT-304 — 공급자 전송 형식과 분리하고 서버 검증 경계를 유지" }
      - { layer: "CLI·공급사별 API 구현체", subject: "공통 요청을 실제 통신 형식으로 변환하고 응답·오류·지원 기능을 공통 계약으로 변환", owner: "FEAT-304·IF-003 — 역할·문맥·작업 인자·요청/결과 연결을 보존" }
      - { layer: "그래프 실행", subject: "검증한 메시지·작업과 상태·분기·대기·재개·종결의 연결", owner: "agent — LangGraph4j 실행 지점을 사용하되 업무 통제는 Hub가 소유" }
    message_coverage:
      rule: "다음은 누락 점검용 업무 범주이며 최종 메시지 코드 목록이 아니다. 정상·0건·복수 후보·실패·거절·변경·중단·만료·재접속의 각 경로에 송신자·수신자·선행 상태·허용 응답·후속 상태를 배정한다. 임베딩은 IF-004의 별도 계약으로 유지한다"
      portal_to_agent: ["신규 질의와 필요한 맥락", "추가 정보·대상 선택 응답", "계획 확인·교정", "실행 승인·거절", "처리 중 변경·별개 질의·중단", "상태·결과 조회와 재접속", "허용된 사용자 재시도", "저장된 조회의 별도 실행"]
      agent_to_portal: ["접수·대기·진행 상태", "추가 정보·의도·대상 확인 요청", "해석문·계획·실행 승인 요청", "결과·표현 블록·부분 처리 내역", "실패·중단·만료·미수행·결과 불명 안내", "권한·범위·경고·지식 태그·초기 안내", "지원하지 않는 계약 버전 안내"]
      agent_to_model: ["호출 목적·규칙·출력 계약·허용 작업·동적 입력", "검증·전송 통제를 거친 작업 결과", "정제된 오류·검증 피드백", "유효한 사용자 응답과 보완된 맥락"]
      model_to_agent: ["해석·분류·계획의 구조화된 제안", "허용 작업과 인자 요청", "부족한 값·복수 후보·추가 확인 필요", "최종 응답·허용된 결과 해석", "처리 불가·모델 거절"]
      transport_outcomes: ["수신 중·정상 완료·출력 잘림", "빈 응답·형식 오류·미지원 기능", "호출 실패·시간 초과·취소", "사용량 제공·미제공의 구분"]
    prompt_requirements:
      admin_input_preparation: "REQ-610.prompt_contract.admin_input_preparation을 공통 기반7·연동6 화면의 입력 분류·해석 가이드·단계별 제공 조건 정본으로 참조한다. 관리 화면 조회 응답을 통째로 모델에 전달하지 않는다. 지식 관리/전체 흐름 합의 뒤 본 카드의 공통 입출력·CLI/API 변환 계약과 연결하며 현재 단계에서 최종 JSON 키/기술 템플릿을 고정하지 않는다."
      current_plan_state: "REQ-004.execution_loop.model_input에 따라 호출 목적에 필요한 최신 계획/작업·실행 상태·유효 결과/부족 조건을 동적 입력에 연결한다. 현재 상태의 원천과 저장은 REQ-004.execution_state이며 이전 프롬프트·대화 요약을 실행 상태의 정본으로 삼지 않는다. 호출별 최소화·전송 통제는 아래 input_boundary·reduction을 유지한다"
      composition_owner: "REQ-610.prompt_contract를 정본으로 사용한다. 이 카드는 각 호출 목적과 메시지·작업·결과를 그 조합표에 연결할 것을 요구하며 운영 프롬프트 편집으로 통신 계약을 변경하지 않는다"
      per_call_output: "agent는 최초·반복·후속·허용 재요청을 포함한 모든 모델 호출에 해당 목적의 응답 형식·필수 항목·허용 응답 유형과 선택 기준·값 부족/처리 불가 시 반환 방법을 제공한다. 이전 호출에서 안내했다는 이유로 생략하지 않는다. 수행할 작업·적용 규칙·필요한 입력과 이번 응답의 형식/작성 지침을 함께 구성하며 원본·생성·검증의 연결은 response_contract를 따른다"
      purpose_coverage: ["질의 해석·처리 가능성 판단", "계획 구성·보완", "업무 입력값 확보·대상 선택", "SQL 생성·허용된 재작성", "업무 API·도구 선택과 인자 구성", "허용된 결과 해석·최종 응답 작성", "처리 중 입력 분류", "관리자 프롬프트 의미 검토"]
      matrix: "각 목적에 공통 규칙의 적용 여부·유형별 템플릿·출력 계약·허용 작업·입력 변수·출처·필수/선택·부족 시 처리·전송 금지 항목을 대응시킨다. 이전 결과와 사용자 응답을 어느 후속 호출에 넣는지, 서버 처리만으로 끝나는 단계인지도 표시한다"
      input_boundary: "사용자 질의·필요한 대화 맥락·지식·카탈로그·예제·등록 도구 계약·매핑별 사용 설명·확보한 값과 부족한 값·허용된 결과 참조·정제된 피드백 중 해당 목적에 필요한 것만 선택한다. REQ-035의 의도 분류 입력 제외와 REQ-039·106의 결과 데이터 전송 통제를 유지한다"
      context_control: "구현체가 이전 사용자·다른 대화의 이력이나 작업 폴더 지침을 자동 혼입하거나 자체 업무 도구를 실행하지 못하도록 통제·검증한다. 공급자 고유 동작과 Hub가 통제하는 입력의 경계를 지원 기능표에 밝히고, 필요한 격리·통제를 확보하지 못하는 조합은 해당 용도에 사용하지 않는다"
      reduction: "REQ-003·021의 문맥 축소에서도 필수 규칙·현재 실행 조건·요청/결과 연결을 보존한다. 요약문으로 권한·승인을 증명하지 않으며 필수 계약을 담지 못하면 임의로 잘라 실행하지 않는다. 세부 포함 순서·용량 판정과 실패 처리는 설계한다"
    portal_content: "REQ-308.portal_content의 고정 구분별 code/name/format/body/revision을 같은 판으로 전달한다. INPUT_NOTICE는 REQ-106의 동적 전송 안내/제출 근거와 연결한다. 표시·실패·원문/정책 버전 경계는 ARCH-019를 따르며 상세 wire 스키마는 integration P3에서 확정한다"
    response_contract:
      source_of_truth: "소스에서 버전 관리하는 응답 타입 정의와 단계별 계약 정의를 공통 원본으로 사용한다. 모델용 응답 스키마·필드 안내, 서버 역직렬화/형식 검증, 허용 응답 판정과 후속 처리기 연결은 이 원본에서 생성하거나 직접 참조한다. 서로 독립적인 형식 목록·분기 목록을 손으로 복사해 관리하지 않는다"
      response_types: "공통 응답 종류·필드·자료형·필수/선택·허용값과 짧은 업무 의미·단위 설명은 소스의 응답 타입 정의에 둔다. 타입·검증 선언이 이미 가진 필수 여부·허용값을 설명용 정의에 중복하지 않는다. 형식 변경 시 모델용 스키마와 서버 해석·검증이 같은 변경을 사용해야 한다"
      step_definitions: "호출 단계별로 허용 응답 타입·선택 기준·필요한 기술 템플릿·후속 처리기와 그래프 분기 연결을 소스 계약에서 정의한다. 모델에 제시한 응답은 실제 처리 경로를 가져야 하며 단계 밖 응답은 배정 전에 차단한다. 정확한 등록 방식과 자료 구조는 P3에서 정한다"
      technical_templates: "긴 판단·작성 지침과 예시는 소스와 함께 버전 관리·검토·배포하는 기술 템플릿 리소스에 둔다. 템플릿에는 해당 단계의 계약에서 생성한 응답 종류·필드·허용값 설명을 삽입하고 같은 목록을 별도로 손작성하지 않는다. 무엇을 반환할지 판단하는 의미 지침은 타입만으로 자동 추론할 수 없으므로 업무 사례와 실제 처리 로직으로 대조한다"
      annotations: "어노테이션은 소스 요소에 필드의 의미·단위 같은 메타정보를 붙이는 선택 수단이다. 응답 타입에 가까운 짧은 설명을 추출하는 데 사용할 수 있으나 필수 구현 방식으로 확정하지 않는다. 긴 업무 절차를 어노테이션에 몰아넣거나 어노테이션만으로 비즈니스 로직과의 일치를 보장한다고 간주하지 않는다. 사용 여부·추출/생성 도구는 P3에서 정한다"
      managed_data: "운영 편집 가능한 공통 자연어 지침 본문과 규칙 관리 속성은 REQ-610의 관리 데이터·리비전으로 유지한다. 운영자가 본문에 변수 치환식이나 응답 스키마를 작성하지 않으며 기술 템플릿·입력 구성은 소스가, 호출별 동적 입력 조합은 agent가 맡는다. 고객사별 업무 API/도구 입력 명세와 사용 설명은 REQ-608·612·303의 원천에서 읽으며 모든 업무 인자를 소스에 고정하지 않는다. 승인된 업무 명세와 현재 허용 후보를 공통 계약에 결합하고 요청 생성·응답 검증·실행에 사용한 계약/자산 버전의 일치를 확인한다"
      assembly: "agent가 현재 목적·단계·허용 후보를 판정하고 기술 템플릿 + 계약에서 생성한 형식/설명 + 적용 운영 지침 + 업무 명세 + 해당 호출의 동적 입력을 조합한다. 공통 요청을 CLI·공급자 API 형식으로 변환한 뒤에도 출력 계약을 보존한다. 공급자가 구조화 출력이나 도구 정의 영역을 지원하면 같은 계약의 지원 가능한 표현으로 전달하며 프롬프트 문구와 별도 영역의 필드·허용 유형이 어긋나지 않게 한다"
      exposure: "모델에는 이번 판단과 응답 생성에 필요한 계약만 제공한다. portal 통신 규약 전체나 인증·내부 점유·서버 승인 정보를 그대로 노출하지 않는다. 모델용 스키마·자연어 지침은 서버의 현재 권한·승인·입력값·실행 가능성 검증을 대신하지 않는다"
      consistency: "소스 계약의 응답 타입 누락·불명확한 처리기 연결·템플릿 참조 오류·생성 스키마/검증 불일치는 빌드 또는 계약 시험에서 실패시킨다. 동적으로 등록한 업무 명세와 현재 후보의 불일치는 호출/실행 전에 검증한다. 구조적 일치는 원본 공유와 기계 검사로, 응답 선택 기준과 업무 처리 의미의 일치는 정상·거부·예외 사례 시험으로 확인한다"
    action_contract:
      plan_binding: "REQ-015의 채택 계획/작업과 REQ-004의 유효 상태 버전을 실제 작업 요청·결과에 연결한다. 낡은/중복 제안의 실행 차단, 실제 결과 기반 상태 갱신과 완료 판정은 REQ-004를 따르며 모델이 제출한 상태로 서버의 완료·권한·승인을 덮지 않는다"
      coverage: "지식 검색·허용 데이터 조회·등록 업무 API/커스텀 도구 호출·정해진 계산/변환·사용자 확인 요청의 필요성을 설계에서 점검한다. 모든 범주를 모델 도구로 노출한다는 뜻은 아니며 서버 고정 처리와 모델이 요청할 수 있는 작업을 구분한다"
      request: "작업 유형·등록된 대상·업무 인자·요청/결과 연결 근거·선행 결과 의존성을 구조화한다. 정확한 필드와 작업 코드는 설계에서 정하고, 모델이 임의 실행 주소·인증값·서버 신원·권한·승인 상태를 지정할 수 없게 한다"
      validation: "agent는 현재 목적·단계에서 허용한 작업인지와 REQ-038의 후보 범위, 계약·입력값·현재 권한·실행 승인을 검증한 뒤 배정한다. 일반 답변 문장을 명령으로 파싱하거나 모델의 자체 도구 실행으로 이 경계를 우회하지 않는다"
      result: "각 요청에 실제 수행 결과·거부·실패·미수행·결과 불명을 연결하고 다음 호출에 제공 가능한 부분만 반환한다. 결과의 자연어 설명은 데이터이며 새로운 제어 명령으로 승격하지 않는다"
    result_dialogue:
      input: "agent는 실제 도구 호출/결과와 REQ-608·612의 적용 공통 가이드, REQ-303의 유효 업무별 매핑 설명을 연결해 결과 설명·질문·사용자 응답 이후의 모델 호출에 필요한 부분만 제공한다. 현재 접근·마스킹·REQ-106의 요청/동의·전송 상한을 검사하고 금지 결과나 비밀값을 가이드에 끼워 보내지 않는다"
      interpretation: "LLM은 허용된 결과와 계약의 상태 의미를 기준으로 안내·필요한 질문·선택별 다음 작업/종료를 구성한다. 접수나 전송 성공을 업무 완료로 단정하지 않는다. 설명은 자연어 가이드이며 실제 작업은 기존 구조화된 action_contract로 제안하고 agent가 검증·수행한다. 가이드가 없거나 설명이 불충분하면 검증된 계약/결과의 확인 가능한 사실만 안내하고 후속 대상·절차를 임의로 만들지 않는다"
      precedence: "실행 실패·타임아웃·결과 불명의 처리 순서는 REQ-105·NFR-022가 우선한다. 등록된 결과 확인이 필수이면 선택 질문 전에 먼저 확인하고, 방법 부재/확인 실패는 결과 불명·수동 확인을 안내한다. 가이드나 사용자의 선택적 조회 거절로 이 절차를 생략하지 않는다"
      waiting: "후속 처리에 사용자 선택이 실제로 필요하면 REQ-005의 기존 사용자대기에 질문 목적·허용 응답·원 도구 호출/결과 참조를 연결한다. 모든 결과에 대기를 만들지 않는다. 유효 대기 응답만 같은 턴·시도에서 이어가며 응답자·소유권·현재 대기/회차·기한·중복·중단/종결을 검증한다. 거절은 선택적 후속 작업을 하지 않는 것으로 처리하고 무응답·모호한 답을 동의로 만들지 않는다"
      followup: "결과 확인에 대한 예 응답은 해당 조회 선택이며 원 실행 재전송이나 새 상태 변경 작업의 승인이 아니다. 현재 지식 연결 후보·등록/활성·계약·입력 참조의 소유/유효성과 권한을 다시 확인한다. 상태 변경 후속 작업은 완성된 파라미터 전체를 별도 카드로 확인·승인받으며 순수 조회에는 기존 정책 외 새 실행 승인을 강제하지 않는다"
      completion: "처리 중이면 등록된 권장 시간 뒤 사용자가 별도 확인하도록 안내하고 Hub는 자동 폴링하지 않는다. 원 턴 종결 뒤의 사용자 확인 요청은 새 요청으로 접수해 현재 조건을 검증한다. 종결 턴을 되살리거나 원 실행을 자동 재전송하지 않고 과거 결과 불명을 나중 조회로 소급 변경하지 않는다. 결과 불명 후 사용자의 대상 시스템 확인·새 승인·후속 실행은 REQ-105.manual_reexecution에 연결하며 확인 응답을 최종 승인으로 처리하지 않는다"
      evidence: "원 호출·결과, 적용 계약/공통 가이드·지식 리비전/매핑, 질문·유효 사용자 응답·선택, 제안/실제 후속 작업과 거부 사유를 턴·시도·회차·대기/호출에 연결한다. REQ-107·108·109의 기존 감사·마스킹·보존에 포함하며 별도 로그 저장소나 금지 원문 사본을 만들지 않는다"
    parameter_exchange:
      progress: "입력값마다 확보·미확보·모호함·검증 실패와 출처를 구분한다. REQ-608의 입력 계약과 매핑별 사용 설명에 따라 질문·허용 조회·대상 선택·계산/변환을 반복하고, 확보한 값과 부족한 값이 후속 호출에서 섞이거나 유실되지 않게 한다"
      semantics: "미입력·명시적 빈 값·0·조회 0건·조회 실패를 구별하고 날짜·시간대·단위·금액 정밀도·식별자 앞자리 0·문자 인코딩을 변환 규약에 명시한다. API의 고정값·기본값·서버 제공 값은 REQ-608의 소유권과 검증을 따른다"
      protected_values: "파라미터 확보를 이유로 전송 금지 원문을 모델에 보내지 않는다. 필요한 경우 모델에는 허용된 선택·결과 참조를 전달하고 서버가 현재 권한·참조 소유자·유효성을 확인해 실제 값을 연결하도록 설계한다. 참조만 바꿔 다른 사용자 데이터에 접근할 수 없어야 한다"
      approval: "완성된 실행 내용과 값의 확인·승인, 승인 후 대상·순서·값 변경의 재승인은 REQ-026·105·608을 따른다. 모델 호출을 한 번 더 했다는 이유로 승인한 값을 조용히 보충·변환·교체하지 않는다"
    data:
      - { item: "메시지 유형·목적·계약 버전과 대화/턴/시도/회차/단계/호출 연결", origin: "서버 접수·실행 맥락과 검증한 요청", sensitivity: "내부 처리 식별 정보 — 식별자 자체는 접근 권한이 아님", retention: "REQ-107·108·109의 기존 이력·보존·정리 정책" }
      - { item: "공통 규칙·템플릿·출력 계약·허용 후보·호출별 동적 입력", origin: "소스 계약·REQ-610의 고정 리비전·현재 권한을 통과한 업무 자산", sensitivity: "업무·개인정보 포함 가능 — 비밀 원문·전송 금지 데이터 제외", retention: "REQ-610의 재현 근거와 REQ-107·109의 마스킹·보존 정책" }
      - { item: "작업 요청·실제 인자·값의 출처·결과 참조·검증 및 수행 결과", origin: "검증한 모델 제안·사용자 응답·서버·대상 시스템", sensitivity: "업무 실행·개인정보 포함 가능 — 전달 구간별 노출 통제", retention: "REQ-105·107·108·109·111의 기존 정책" }
      - { item: "구현체·모델·지원 기능·변환 결과·사용량·오류 구분", origin: "공통 호출 계층과 구현체", sensitivity: "운영 조사 정보 — 원본 접속 오류를 사용자·모델에 전달하지 않음", retention: "CON-034와 REQ-107·108·115의 기존 사용량·오류 이력" }
    business_rules:
      - "메시지 유형은 교환 정보, 호출 목적은 해당 모델 판단의 목표, 작업 유형은 agent가 수행할 요청을 뜻한다. 하나의 목적에 여러 메시지·작업이 이어질 수 있으며 서로를 하나의 코드 목록으로 합치지 않는다"
      - "공통 입력·출력의 의미와 역할·우선순위·작업/결과 연결은 구현체 변환 뒤에도 유지한다. 지원하지 못하는 기능을 정상 완료·0건·빈 사용량으로 바꾸거나 임의 기본값으로 채우지 않는다"
      - "구조가 맞더라도 현재 단계에 허용되지 않은 작업, 미등록 대상, 잘못된 자료형·값, 사용자 소유가 아닌 참조는 실행하지 않는다. 모델 출력은 검증 대상이며 권한 근거가 아니다"
      - "스트리밍 중 작업명·인자 일부가 도착해도 작업을 시작하지 않는다. 해당 작업 요청의 완료와 실행에 필요한 계약 검증 경계를 설계하고, 출력 잘림·취소·형식 오류를 완료로 간주하지 않는다"
      - "계약 오류·빈 응답·모델 거절·출력 잘림·미지원·공급자 장애·작업 실패를 구별한다. 복구·재요청의 허용 여부와 상한은 원인별로 설계하되 권한·정책 거부를 재시도로 우회하지 않고 SQL 오류 처리와 도구 재시도는 REQ-037·NFR-022를 따른다"
      - "중복·지연·순서 역전 응답은 현재 시도·회차·요청/결과 연결·점유 유효성을 확인해 적용한다. 무효 응답은 현재 계획·값·승인·상태를 바꾸지 못하며 취소한 모델 호출도 사용량·오류 이력 정책은 유지한다"
      - "복수 작업 제안의 의존 순서·병렬 허용·결과 합류를 정의한다. 병렬 실행을 보장하거나 업무 실행 순서를 모델에 새로 위임하지 않으며 REQ-026·038의 요청 범위·승인·최종 실패 후 새 작업 중단 규칙을 유지한다"
      - "구현체·agent·그래프의 재시도 책임과 호출 횟수를 연결해 숨은 중복 재시도를 막는다. 재개·재시도·단순 상태 조회를 구분하고 이미 전송한 실행·결과 불명 요청은 REQ-013·105·NFR-022를 따른다"
      - "같은 미확보 값을 진전 없이 계속 묻거나 실패한 작업을 반복하는 경우를 감지하고 확인·중단·실패 중 허용 경로로 끝내도록 설계한다. NFR-013의 최대 스텝과 개별 호출 제한을 따르며 새 턴 자동 생성으로 우회하거나 전체 시간·턴당 토큰 상한을 신설하지 않는다"
      - "최종 완료·실패·부분 처리의 사실은 서버 수행 기록과 대상 시스템의 계약상 결과를 기준으로 검증한다. 모델의 성공 문장만으로 완료시키거나 실패를 0건으로 바꾸지 않으며 REQ-038·105의 접수·완료·결과 불명 구분을 전달한다"
      - "portal의 문구·표현 블록·버전 불일치·저장된 조회 별도 경로는 ARCH-019·REQ-027을 따른다. 모델에 보낸 내부 메시지나 공급자 원문을 그대로 사용자 응답으로 노출하지 않는다"
    lifecycle:
      - "정상 처리는 접수·실행·사용자대기·응답·종결의 기존 상태를 사용하며 각 메시지의 수신 가능 상태와 전이 책임을 설계한다"
      - "유효한 사용자 응답은 기존 대기 단계의 이어가기, 중단 뒤 허용된 원 질의 요청은 원본에 연결된 별도 새 턴/시도, 브라우저 재접속은 상태 표시로 연결한다(REQ-013·040). 계약 추가로 자동 재개를 새로 허용하지 않는다"
      - "변경·중단·대기 만료·점유 상실 시 뒤늦은 결과와 무효화할 맥락을 구분한다. 이후 작업 중단을 이미 전송한 외부 실행의 취소·롤백으로 안내하지 않는다"
    exceptions:
      - "CLI의 자동 이력·지침·도구 실행을 통제할 수 없거나 필요한 의미를 보존할 수 없으면 해당 용도 미지원으로 처리하고 운영 API 기준을 낮추지 않는다"
      - "필수 데이터나 계약을 문맥 한도에 담지 못하면 필요한 항목을 조용히 빼지 않고 해당 목적의 대체 처리·사용자 확인·실패 경로를 설계한다"
      - "고객 후보가 0건·여러 건이거나 값이 누락·모호하면 REQ-025·608의 확인·실패로 연결하고 모델이 임의 값을 만들어 실행하지 않는다"
      - "알 수 없는 제어/작업 유형과 새로운 표시용 표현 블록을 구분한다. 전자는 실행하지 않고 후자는 ARCH-019의 호환성·안전한 대체 표시 규칙을 적용한다"
    permissions:
      - "메시지 식별자·참조·클라이언트 필드는 권한·신원·승인의 근거가 아니다. 현재 사용자와 요청 대상·값·상태를 서버에서 확인한다"
      - "사용자 입력·지식 본문·도구 결과를 규칙·제어 명령으로 승격하지 않는다. 등록 작업·현재 후보·전송 정책·승인 경계는 REQ-102·103·105·106·112를 따른다"
      - "관리자 프롬프트 의미 검토는 REQ-610의 별도 호출 목적·인가·업무 도구 실행 금지를 적용한다"
    audit: "REQ-107·108·109·115와 REQ-610에 따라 실제 적용한 모델·구현체·호출 목적·계약/템플릿 버전·규칙 리비전·입력 조합 근거·작업/결과 연결·검증/수행 결과를 추적한다. 재현을 이유로 전송 금지 원문이나 비밀값을 추가 저장하거나 기존 파기·마스킹 정책을 우회하지 않는다. 같은 모델 응답의 재생성을 보증하는 대신 당시 입력 구성과 판정 근거를 확인한다. 결과 후속 대화의 가이드/매핑 버전·질문/응답·제안과 실제 작업의 근거는 result_dialogue.evidence를 따른다."
    volume: "반복 호출·복수 작업·스트리밍은 기존 NFR-013·022·023의 한도와 처리 규칙을 따른다. 모델별 문맥·출력 한도와 구현체 지원 기능은 설계에서 대조하며 수치·새 쿼터를 임의로 확정하지 않는다"
    config: "통신 스키마·필수값·제어/작업 코드·검증은 소스 계약으로 관리한다(REQ-610). 운영 규칙은 기존 프롬프트 관리, 구현체 선택은 REQ-402의 배포 설정, 모델/공급 경로는 REQ-602의 기준정보를 참조한다. 미지원 기능을 묵시적으로 대체하지 않는다. 자동 모델 전환은 REQ-602.auxiliary_fallback의 보조 판정 일시 장애에만 한정하며 agent가 결정하고 어댑터가 자율 선택하지 않는다"
    auxiliary_failover_contract: "공급사별 오류 정규화·접수/종료 관측 근거는 ARCH-032, 후보 순서·허용 원인·전체 호출/시간 상한은 REQ-602가 소유한다. 도구 재시도·주 추론 재요청과 혼합하거나 후보마다 하위 재시도를 새로 부여하지 않는다"
    risk: "문맥 혼입, 잘못된 값 변환, 중단 뒤 늦은 응답 적용, 계층별 재시도 중첩과 승인 후 값 변경은 실제 업무를 잘못 실행할 수 있다. CLI 시험만으로 운영 스트리밍·사용량·동시성을 검증했다고 할 수 없으며 그래프 재현은 ASM-003의 검증 근거가 필요하다"
    acceptance: "정상·예외·사용자대기·변경·중단·재접속 흐름의 각 통신을 메시지/목적/작업·입출력·허용 상태·검증·후속 처리·시험에 연결하고 누락을 확인한다. 매 모델 호출에 해당 목적의 응답 형식·작성 지침이 포함되고, 소스 원본에서 파생한 모델 안내·검증·처리기 연결이 일치해야 한다. 공통 시험을 CLI·지원 API 구현체에 적용해 의미·통제 준수를 확인하며, 잘못된 형식·값·참조·미완성 출력·지연/중복 응답·만료된 승인으로 업무 실행이 발생하지 않는다. 운영 API 전용 항목은 실제 구독 확보 후 CON-033·034에 따라 검증하며 미지원·미검증을 통과로 세지 않는다. result_dialogue에 따라 결과 가이드·유효 사용자 응답을 다음 구조화된 제안으로 연결하고 관련 verification으로 선택적/필수 확인·조회/상태 변경·종결 경계를 검증한다."
    verification:
      - { case: "결과 안내·질문·사용자 선택", expected: "접수 결과를 완료로 안내하지 않고 가이드에 맞게 확인 여부를 묻는다. 유효한 예 응답으로 결과 조회만 제안/검증하며 거절은 선택적 후속 작업 없이 종료한다. 자연어 가이드/답변 자체로 실행하지 않는다" }
      - { case: "결과 후속 작업의 범위·권한·승인", expected: "미등록/비활성/지식 미연결·권한 없는 후속 대상과 만료/타 사용자 입력 참조는 거부한다. 신규 상태 변경은 전체 값의 별도 승인 전에는 호출하지 않는다" }
      - { case: "필수 결과 확인·처리 중·종결 뒤 별도 요청", expected: "NFR-022 우선 확인을 질문/거절로 생략하지 않는다. 처리 중은 권장 시간 안내 후 자동 폴링하지 않고 종결 뒤 요청은 새 턴으로 처리한다. 원 실행 재전송·과거 결과 불명 소급 변경은 없다" }
      - { case: "가이드 출처·충돌·금지 결과 전송", expected: "당시 계약/가이드·지식/매핑·원 결과를 연결한다. 충돌은 임의 합성하지 않고 확인/처리 불가로 연결하며 권한/동의/마스킹 통제를 통과한 부분만 모델에 보낸다" }
      - "같은 합성 입력과 고정 모델 응답으로 구현체별 요청 변환·응답 해석·작업 배정·오류 구분을 대조한다. 자연어 문장 일치가 아니라 계약 의미·서버 판정·수행 작업을 비교한다"
      - "최초·반복·후속 호출의 실제 전송 요청을 확인하여 각 목적의 응답 형식·필수값·허용 유형·선택 기준·부족/실패 반환 지침이 포함되는지 시험한다. 이전 호출의 형식 안내를 제거해도 다음 호출은 자신의 계약을 제공해야 하며 공급자 별도 스키마/도구 영역도 같은 원본과 대조한다"
      - "응답 필드/허용 유형을 바꾸거나 처리기 연결·기술 템플릿의 참조를 누락시키면 모델 안내·서버 검증·분기의 불일치 검사가 실패해야 한다. 검토용 예시 응답과 실제 처리 결과를 대조하고 승인 요청 준비 응답이 실행 승인 자체로 취급되지 않는지 시험한다"
      - "형식은 유효하나 허용 작업·인자·소유 참조·승인 조건을 어긴 응답과 스트리밍 중 잘린 요청을 주입하여 실행이 차단되는지 확인한다"
      - "중복 응답·순서 역전·이전 시도/회차 응답·취소 직후 결과·승인 더블 클릭·재접속을 주입하여 상태·인자·호출 횟수가 잘못 바뀌지 않는지 확인한다"
      - "무결과·복수 후보·0·빈 값·앞자리 0·소수 금액·시간대가 변환 후 같은 의미인지, 필요한 값이 전송 금지이면 서버 참조 경로에서도 현재 권한을 검증하는지 확인한다"
      - "공통 프롬프트 변경·문맥 축소·지원하지 않는 기능·모델 거절·형식 오류·무진전 반복에서 필수 계약 보존과 종료/확인 경로를 시험한다"
      - "검증 규칙을 뒤집어 미완성 호출 허용·지연 응답 적용·승인값 교체·필요한 확인/새 승인 없는 결과 불명 재실행을 허용하면 해당 시험이 실패해야 한다. 소스 구현 전에는 시험 설계 기준이며 실행 통과로 기록하지 않는다"
      - { case: "결과 불명 후 사용자 확인·최종 승인·새 실행 메시지", expected: "각 메시지를 원 실행과 이번 새 턴/실행에 연결하고 사용자 확인/승인/실제 결과를 구분한다. 재생된 확인/승인으로 새 실행을 만들지 않는다" }
