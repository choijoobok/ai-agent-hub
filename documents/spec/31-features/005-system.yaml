features:
# ══ system — 기존 백오피스 코어의 무손실 이행 (REQ-501~510) ══════
  - id: FEAT-501
    module: system
    workstream: system
    roadmap: RM-P1
    type: transaction
    title: "관리자 계정·인증·세션 운영"
    approved_change: "CR-028 — system 관리자 자체 계정/인증은 Portal 계정/인증과 분리한다. CR-027의 공통 계정 방향은 철회됐으며 ARCH-050·UC-501의 인증 영역/세션·API 경계와 회귀 계약은 상세 설계·구현 대기다"
    detail: "계정 상태·사용 기간·접속 IP·잠금·휴면·비밀번호를 한 로그인 판정으로 묶고, 관리자 계정 관리와 사용자 자기 서비스·활성 세션 종료를 같은 수명주기 계약으로 제공한다"
    hard_rule: "조건 하나라도 실패하면 세션을 만들지 않으며 SYS_USER는 물리 삭제하지 않는다"
    reqs: [REQ-501]
    usecases: [UC-501]
    entities: [ENT-501, ENT-502, ENT-503, ENT-504, ENT-505]
    apis: [API-501, API-502, API-503, API-504, API-505, API-506, API-507, API-508, API-509, API-510, API-511, API-512, API-513, API-514, API-515, API-516, API-517, API-518, API-519, API-520, API-521, API-522, API-523]
    screens: [SCR-501, SCR-502, SCR-503, SCR-504, SCR-505, SCR-506]
    actors: [ACT-001, ACT-012]
    complexity: high

  - id: FEAT-502
    module: system
    workstream: system
    roadmap: RM-P1
    type: master
    title: "역할·개인 예외와 유효 권한 관리"
    detail: "역할·사용자 역할·역할별 메뉴 액션·개인 예외를 관리하고 영향 사용자와 현재 유효 권한을 계산한다"
    hard_rule: "역할 겸임과 역할-메뉴 조합을 코드로 금지하지 않고 현재 데이터·유효 기간으로 판정한다. 권한 내용 해시와 세션 무효화 표식은 구분하며 늦은 재계산 저장이 후속 회수 신호를 지우지 않는다"
    reqs: [REQ-502]
    usecases: [UC-502]
    entities: [ENT-506, ENT-507, ENT-508, ENT-509]
    apis: [API-524, API-525, API-526, API-527, API-528, API-529, API-530, API-531, API-532, API-533, API-534, API-535, API-536, API-537]
    screens: [SCR-507, SCR-508, SCR-509]
    actors: [ACT-001, ACT-012]
    complexity: high

  - id: FEAT-503
    module: system
    workstream: system
    roadmap: RM-P1
    type: master
    title: "메뉴·API 카탈로그와 실패 폐쇄 인가"
    detail: "관리 메뉴 트리·배포 API 카탈로그·메뉴 액션 매핑을 관리하고 system/admin 관리 service 요청을 관리자 인증·등록·매핑·유효 권한으로 판정한다. 별도 Portal 업무 API의 인증/권한 수락은 ARCH-050을 따르며 관리자 메뉴 권한으로 대체하지 않는다"
    hard_rule: "어느 연결 하나라도 없으면 403이며 구 경로 별칭과 접두 변환 라우터를 남기지 않는다"
    reqs: [REQ-503]
    usecases: [UC-503]
    entities: [ENT-510, ENT-511, ENT-512, ENT-508, ENT-509]
    apis: [API-538, API-539, API-540, API-541, API-542, API-543, API-544, API-545, API-546, API-547]
    screens: [SCR-510, SCR-511, SCR-512]
    actors: [ACT-001, ACT-012]
    complexity: high
    traces_to: [AUTHZ-091, ARCH-023]

  - id: FEAT-504
    reference_combo_extension: "REQ-504.reference_combo에 따른 API-600과 shared/code의 참조 조건 콤보 유틸을 추가 설계한다. 현재 getList/CodeSelect/그룹 전체 캐시는 유지하며 필터 결과의 별도 키·CODE 버전 무효화·조회 실패/빈 결과 구분은 50-api.reference_combo_contract를 따른다. 구현은 소유 G3 승인 뒤 진행한다"
    module: system
    workstream: system
    roadmap: RM-P1
    type: master
    title: "공통코드와 참조 코드 관리"
    detail: "코드 그룹·코드·참조 정의·참조값과 다국어 코드명을 한 수명주기로 관리하고 모든 모듈에 공통 조회 계약을 제공한다"
    hard_rule: "시스템 보호 데이터와 참조 무결성은 서버에서 검사하고 원본·파생값 변경은 한 트랜잭션으로 처리한다"
    reqs: [REQ-504]
    usecases: [UC-504]
    entities: [ENT-513, ENT-514, ENT-515, ENT-516]
    apis: [API-548, API-549, API-550, API-551, API-552, API-553, API-554, API-600]
    screens: [SCR-513]
    actors: [ACT-012]
    complexity: high

  - id: FEAT-505
    module: system
    workstream: system
    roadmap: RM-P1
    type: master
    title: "다국어 메시지 값과 번들 관리"
    detail: "생성된 메시지 키의 언어별 값만 관리하고 화면·서버·메뉴·공통코드에 버전이 있는 같은 번들을 제공한다"
    hard_rule: "키 생성은 소스 상수와 시드 생성기만 수행하며 값과 캐시 버전은 한 트랜잭션으로 바꾼다"
    reqs: [REQ-505]
    usecases: [UC-505]
    entities: [ENT-517, ENT-518, ENT-519]
    apis: [API-555, API-556, API-557]
    screens: [SCR-514]
    actors: [ACT-001, ACT-012]
    complexity: medium

  - id: FEAT-506
    module: system
    workstream: system
    roadmap: RM-P1
    type: master
    title: "런타임 시스템 설정 관리"
    approved_change: "CR-026의 미구현 설정 버전 확장은 2026-10-30 사용자 결정으로 철회했다. 기존 SCR-515의 화면·권한·API·저장소와 작업 단위 설정 조회를 그대로 재사용한다"
    detail: "`sys-config.*` 아래 화면 노출용 일반 설정의 배포 기본값과 DB 오버라이드를 합성해 보여 주고 키별 타입·범위를 통과한 값만 적용·복원한다"
    hard_rule: "비밀값·임의 변경 금지 값은 별도 프로퍼티 경로로 배포 관리해 이 기능의 목록·응답·저장 대상에서 제외하며, 화면 대상 설정의 오버라이드와 캐시 버전은 원자적으로 바꾼다. 설정값은 노드 캐시를 두지 않고 다음 작업 스코프에서 DB 오버라이드를 다시 합성한다"
    reqs: [REQ-506]
    usecases: [UC-506]
    entities: [ENT-519, ENT-520]
    apis: [API-558, API-559, API-560]
    screens: [SCR-504, SCR-515]
    actors: [ACT-001, ACT-012]
    complexity: medium

  - id: FEAT-507
    module: system
    workstream: system
    roadmap: RM-P1
    type: inquiry
    title: "로그인·사용·오류 감사 이력 조회"
    detail: "세 이력과 요청·오류 상세를 기간·사용자·경로·결과·trace ID로 조회해 사건을 재구성한다"
    hard_rule: "원 이력의 수정·삭제 API를 만들지 않고 상세 전문도 목록과 같은 해당 메뉴의 현재 READ 권한을 검사한다"
    reqs: [REQ-507]
