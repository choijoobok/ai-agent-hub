    apis: [API-561, API-562, API-563, API-564, API-565, API-566]
    screens: [SCR-516, SCR-517, SCR-518]
    actors: [ACT-005, ACT-012]
    complexity: medium

  - id: FEAT-508
    module: system
    workstream: system
    roadmap: RM-P1
    type: batch
    title: "배치 일정·실행·중단과 이력"
    detail: "등록된 BatchJob만 cron·timezone·분산 잠금·쿨다운 규칙으로 실행하고 즉시 실행·중단·유령 상태와 결과를 추적한다"
    hard_rule: "중복 실행을 막고 스케줄 쿨다운·잠금 충돌·유실을 각각 기록한다. 수동 즉시 실행은 쿨다운을 우회한다. 중단은 협조적 요청이며 작업이 중단을 보고하면 CANCELED, 정상 완료하면 요청 유무와 무관하게 SUCCESS로 기록한다"
    reqs: [REQ-508]
    usecases: [UC-508]
    entities: [ENT-523, ENT-524]
    apis: [API-567, API-568, API-569, API-570, API-571, API-572, API-573, API-574, API-575]
    screens: [SCR-519, SCR-520]
    actors: [ACT-012]
    complexity: high

  - id: FEAT-509
    module: system
    workstream: system
    roadmap: RM-P1
    type: transaction
    title: "공지·관리 요청·알림함 운영"
    detail: "공지 게시·팝업 기간, 계정·권한 관련 요청 판정과 사용자 알림 전달을 관리한다"
    hard_rule: "요청 승인·반려는 실제 계정·권한 데이터를 암묵 변경하지 않으며 admin은 system 알림 테이블을 직접 쓰지 않는다"
    reqs: [REQ-509]
    usecases: [UC-509]
    entities: [ENT-525, ENT-526, ENT-527]
    apis: [API-576, API-577, API-578, API-579, API-580, API-581, API-582, API-583, API-584, API-585, API-586, API-587, API-588]
    screens: [SCR-521, SCR-522, SCR-523, SCR-524]
    actors: [ACT-001, ACT-012]
    complexity: medium

  - id: FEAT-510
    module: "system"
    workstream: "system"
    roadmap: "RM-P1"
    type: "transaction"
    title: "관리 콘솔 공통 사용자 상태 저장"
    detail: "관리자 계정의 즐겨찾기·그리드 설정·저장 조회조건·관리 메뉴 통계를 system 공개 계약과 기존 테이블에 저장한다. Portal 계정/세션의 개인 상태를 같은 USER_ID로 연결하지 않는다"
    hard_rule: "소유자는 현재 관리자 세션 계정으로 고정한다. Portal의 계정·대화·개인 상태와 platform 테이블은 포함하지 않는다"
    reqs: [REQ-510]
    usecases: [UC-510]
    entities: [ENT-528, ENT-529, ENT-530, ENT-531]
    apis: [API-589, API-590, API-591, API-592, API-593, API-594, API-595, API-596, API-597, API-598, API-599]
    screens: [SCR-525]
    actors: [ACT-012]
    complexity: "medium"
    configuration_warning_widget:
      status: "CR-030 사용자 승인 설계 확장·미구현. 기존 위젯 슬롯/관리자 개인 상태 구현은 유지한다."
      owner: "현재 경고/ID 참조의 원천은 admin FEAT-001(API-071)이다. system은 관리자 셸에서 허용된 요약/링크만 소비하며 admin DB/비밀 설정을 직접 읽지 않는다."
      display: "SCR-525에 연결 설정 오류 위젯을 추가한다. 원인별 묶음·영향 건수/점검 범위·최초/최근 확인·해소 상태와 현재 권한으로 원 관리 목록에 이동한다. 권한 없음/장애/미지원은 0건 정상으로 표시하지 않는다."
