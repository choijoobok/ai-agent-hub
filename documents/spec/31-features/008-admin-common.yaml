# 영역: admin 공통 관리 승인·오류 접수
features:
  - "id": "FEAT-040"
    "module": "admin"
    "roadmap": "RM-P1"
    "design_status": "draft"
    "title": "관리 직접 저장·전체 이력 무결성 공통 처리"
    "type": "transaction"
    "reqs":
      - "REQ-601"
    "usecases":
      - "UC-001"
      - "UC-003"
      - "UC-004"
      - "UC-005"
      - "UC-006"
    "traces_to":
      - "ARCH-029"
    "trigger": "admin 관리 기능이 자산·권한·그룹 전체 변경을 직접 저장할 때 내부에서 사용한다"
    "detail": "현재 변경 권한·전체 입력·참조/기술 계약·기대 버전을 검증하고 적용값·전체 이력·리비전·원 명령 결과를 같은 성공 단위로 확정한다. 관리자 승인 단계·원장·SNP·전결 모드는 제공하지 않는다."
    "inputs":
      - "실제 변경 대상 종류·안정 ID·기대 버전·전체 편집 구성·변경 사유·원 명령키"
      - "현재 변경 권한·참조/기술 검증 결과와 원 소유 저장/효력 계약"
    "outputs":
      - "직접 반영 현재값·결과 리비전·HISTORY_NO·행위자/시각·원 명령 결과"
      - "권한·기준본·참조 충돌 또는 실패/결과 불명 근거"
    "rules_from":
      - "REQ-601.direct_management"
      - "REQ-601.management_storage"
      - "REQ-601.change_history"
    "boundaries":
      - "전용 관리자 승인 UI/요청 원장/SNP를 만들지 않는다. 각 소유 관리 화면이 공통 저장 검증을 소비한다."
      - "조회/영향만 확인하는 외부 자산은 실제 변경 대상으로 선점하지 않고 명시 복합 변경은 일부만 반영하지 않는다."
      - "Portal 사용자 신청 승인·실제 실행 사용자 확인·외부 코드/배포 검수는 소유 계약을 유지한다."
    "pending":
      - "@defer P3 — 현재 권한·기대 버전/부모 잠금·전체 이력·리비전·멱등 결과/불명 복구를 소유 데이터/API에 연결한다."
    "entities": []
    "storage_contract": "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: FEAT-041
    module: admin
    roadmap: RM-P1
    design_status: draft
    type: interface
    title: "처리 오류 발생·불변 증거 접수"
    reqs: [REQ-115]
    usecases: [UC-038]
    trigger: "agent·portal에서 채팅 처리 실패가 발생해 admin 공개 접수 계약으로 인계할 때"
    detail: "REQ-115의 발생 원본·불변 증거를 admin 소유로 접수하고 원 턴/회차/스텝·관련 자산·원천 근거를 연결한다. agent의 FEAT-210 감사 원본과 admin 오류 발생 원본을 구분하며 FEAT-035가 접수된 발생을 조회·조사한다"
    inputs: ["정제한 오류 발생 근거와 원 턴/회차/스텝·추적 참조", "현재 확보 가능한 마스킹 증거와 원자료의 보존·접근 제한 근거"]
    outputs: ["불변 발생/증거 접수 참조와 확인된 저장 결과", "미확보 증거·저장 실패와 재수신 대조에 필요한 근거"]
    rules_from: ["REQ-115.hard_rule", "REQ-115.business_rules", "REQ-110.business_rules", "REQ-107.retention_policy", "REQ-109.conversation_body_retention"]
    boundaries:
      - "전용 메뉴를 만들지 않는다. 조회·사람의 조사 처리는 SCR-033·FEAT-035가 소유한다"
      - "동일 전달의 재수신과 같은 코드·메시지를 가진 별도 발생을 구분한다. 발생 접수로 조사 생성·알림·무기한 보호를 자동 수행하지 않는다"
      - "저장 조회 실패는 REQ-207의 원 실행 이력을 참조하며 채팅 오류를 중복 생성하지 않는다. system 예외 이력은 원천으로 사용하지 않는다"
      - "비밀 원문이나 이미 파기된 자료를 복원·재조회해 증거로 채우지 않는다. 증거의 범위·보존·보호는 참조 요구사항을 따른다"
    pending:
      - "@defer P3 — 생산자 인증·발생 식별/재수신·부분 실패·저장 실패/복구·증거 확보 경합의 공개 계약과 시험을 admin·agent·portal·integration에서 대조한다. 새 전달 수단·재시도 수치·물리 저장 구조를 현재 확정하지 않는다"
