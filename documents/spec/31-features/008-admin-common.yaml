# 영역: admin 공통 관리 승인·오류 접수
features:
  - id: FEAT-040
    delivery_boundary: 선행 admin 공통 저장의 기능이다. 원 변경과 전체 이력·리비전·명령 결과의 원자성, 비밀/관측값 제외·불변성·보존/파기 경계를 G3 전에 확정하고 조회 UI와 독립 검증한다. 후행 FEAT-033은 생산 결과를 읽기만 한다.
    workstream: admin
    module: admin
    roadmap: RM-P1
    design_status: approved
    title: 관리 직접 저장·전체 이력 무결성 공통 처리
    type: transaction
    reqs:
      - REQ-601
    usecases:
      - UC-001
      - UC-002
      - UC-003
      - UC-006
    traces_to:
      - ARCH-029
    trigger: admin 관리 기능이 자산·권한·그룹 전체 변경을 직접 저장할 때 내부에서 사용한다
    detail: 현재 변경 권한·전체 입력·참조/기술 계약·기대 버전을 검증하고 적용값·전체 이력·리비전·원 명령 결과를 같은 성공 단위로 확정한다. 관리자 승인 단계·원장·SNP·전결 모드는 제공하지 않는다.
    inputs:
      - 실제 변경 대상 종류·안정 ID·기대 버전·전체 편집 구성·변경 사유·원 명령키
      - 현재 변경 권한·참조/기술 검증 결과와 원 소유 저장/효력 계약
    outputs:
      - 직접 반영 현재값·결과 리비전·HISTORY_NO·행위자/시각·원 명령 결과
      - 권한·기준본·참조 충돌 또는 실패/결과 불명 근거
    rules_from:
      - REQ-601.direct_management
      - REQ-601.management_storage
      - REQ-601.change_history
    boundaries:
      - 전용 관리자 승인 UI/요청 원장/SNP를 만들지 않는다. 각 소유 관리 화면이 공통 저장 검증을 소비한다.
      - 조회/영향만 확인하는 외부 자산은 실제 변경 대상으로 선점하지 않고 명시 복합 변경은 일부만 반영하지 않는다.
      - Portal 사용자 신청 승인·실제 실행 사용자 확인·외부 코드/배포 검수는 소유 계약을 유지한다.
    pending:
      - '@defer 각 소유 슬라이스 — SLICE-040 공통 서비스는 구현됐다. SLICE-006부터 실제 화면·현재 테이블·HIST 어댑터를 연결하고 소유 전체 구성/참조 규칙을 시험한다. 19개 화면·76개 HIST의 제품 연결 완료를 뜻하지 않는다.'
    implementation: implemented
    sources:
      - sources/backend/modules/admin/src/main/java/com/aiagent/admin/managed/
      - sources/backend/bootstrap/src/test/java/com/aiagent/admin/managed/ManagedStorageLiveTest.java
    implementation_evidence:
      storage: 현재값·전체 동형 HIST·리비전·원 결과를 ADMIN 권한 보호와 같은 물리 트랜잭션에서 확정한다. 원장/현재값/이력 어댑터는 같은 DataSource만 등록한다.
      admission: ManagedRequestFilter는 등록 경로의 입력만 준비하며 ManagedAdmission이 원 명령 키 잠금→기존 AdminAuthorityGuard→같은 요청·스레드·트랜잭션 증거 순서로 진입을 보호한다. API-082는 원 소유 READ+SAVE와 처리자를 다시 검사한다.
      retention: 고객사 기간 미설정 시 비활성이고 스케줄러/공개 파기 API는 없다. 보관 중인 상위 HIST도 전이 참조를 보호한다. NO_CHANGE 결과 보존 시작 시각 누락을 Low 보완하여 ENT-099.RECORDED_DTM으로 계산한다.
      validation: 전용 PostgreSQL의 실제 인증·HTTP·제품 공통 서비스와 부모/자식 소유 시험 어댑터를 사용한다. 소유 기능별 입력 규칙은 공통 어댑터 연결 계약만 확인하고 실제 제품 규칙은 각 소유 슬라이스에서 구현한다.
