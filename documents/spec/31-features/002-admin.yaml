    auxiliary_fallback: "REQ-602의 역할별 후보 목록·설정 버전·지원 검증·전송 동의 영향과 변경 이력을 관리한다. UC-017·SCR-062·TC-0151~0153에 연결하고 논리 모델/독립 관리 API/화면 요건·목업은 P3에서 같은 계약으로 상세화한다"
