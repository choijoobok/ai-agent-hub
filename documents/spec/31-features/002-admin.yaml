    operation_boundary: 각 원 소유 전체 구성은 현재 변경 권한·기대 버전·기술 참조 검증으로 직접 저장하고 현재값/전체 이력을 원자 반영한다. 별도 관리자 요청/승인·전결·지식 영향 검토 작업은 없다. 소유별 기술 계약/쿼터 효력 경계는 유지한다.
