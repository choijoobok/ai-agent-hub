    detail: "사용자 사유·이번 달 추가 토큰 신청 · 미배정 계획량과 계획 총 풀 대비 초과 여부 확인 · 운영·비용 관리자의 승인(신청량 이하 부분 승인 가능) 또는 반려 · 승인분 즉시 반영 · 월말 자동 만료와 이월 금지 · 월말 미처리 신청 자동 만료 · 결과의 알림함 통지(REQ-509 공개 계약). 승인자는 계획 총 풀 밖의 예외 승인도 할 수 있고, 그 사유·승인자·승인량은 일반 배정과 구분해 남긴다"
