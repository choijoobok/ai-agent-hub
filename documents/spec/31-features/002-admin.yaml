    module: "admin"
    screen: SCR-019
    roadmap: "RM-P1"
    title: "업무 도구 관리"
    design_status: "draft"
    entities:
      - "ENT-011"
      - "ENT-012"
      - "ENT-015"
      - "ENT-016"
      - "ENT-035"
      - "ENT-036"
      - "ENT-038"
      - "ENT-059"
      - "ENT-061"
      - "ENT-067"
      - "ENT-069"
      - "ENT-093"
    trigger: "SCR-019에서 API/내부 구현 기반 도구를 조회하거나 등록·계약/가이드·그룹/노출·비활성화/삭제 후보를 작성할 때"
    operation_boundary: "UC-019의 등록 업무 도구와 전체 후보·노출 구성을 소유한다. 실제 구현/배포·호출은 agent, API 공통 계약은 FEAT-004, 업무별 도구 연결·사용 설명은 지식이 소유한다"
    inputs:
      - "조회: 안정 도구/명칭·원천 유형·조회/실행 유형·그룹/노출·후보/유효/과거 판과 원천 계약/검수 근거"
      - "후보: ENT-016의 API 또는 배포 구현/계약 판·전체 그룹/노출·공통 결과 가이드와 작업 종류·사유·기준/참조 판"
      - "검수: 내부 구현의 코드·보안·고객사 시험·배포 대응 근거, 현재 API/구현 계약 유효성 및 연결 지식 영향"
    outputs:
      - "안정 도구·전체 내용 판·원천 계약/가이드 참조와 연결 지식/매핑의 읽기 전용 역조회"
      - "FEAT-014·040에 인계할 고정 후보·영향/검수 근거와 관리 판정·실제 반영 결과. 저장/승인 성공을 호출 성공으로 표시하지 않는다"
    processing:
      read: "ENT-015와 ENT-016의 요청한 판을 조회하고 당시 원천 계약/검수 근거와 현재 효력을 구분한다. 지식 매핑은 원천 역조회이며 별도 편집 사본을 만들지 않는다"
      create: "API 기반은 REQ-612.api_tool_mapping에 따라 ENT-011의 기존 도구 대응을 확인하고 ENT-012 계약을 참조한다. 내부 서비스 기반은 agent의 검증된 구현/계약 식별을 참조한다. 미완성 초안은 누락을 표시하며 임의 코드·클래스 실행 등록이나 배포 사실만으로 정상 도구를 만들지 않는다"
      validation: "조회/실행 유형·입출력·데이터 범위·마스킹·재시도/멱등성·오류/결과 확인 계약과 구현 검수/배포 대응을 확인한다. 결과 확인 API 없음 또는 멱등성 미보장을 모든 도구의 등록 금지로 확대하지 않는다. 설정/환경변수/자격증명을 읽거나 반환하는 금지 도구는 등록·노출하지 않는다"
      guide: "API 기반은 공통 입력/결과 계약·가이드를 원천 판으로 참조한다. 내부 구현은 검증된 계약에 따른 자연어 공통 가이드를 전체 후보에 포함하고 지식별 질문·선택·사용 설명은 지식 매핑에 둔다"
      change: "전체 소유 구성·그룹/예외·가이드·중지/허용된 삭제를 현재 변경 권한·기대 버전·필수 참조/기술 계약으로 검증해 직접 저장한다. 현재값/전체 이력/원 명령 결과는 원자 확정하고 외부 공동 오픈·배포 검수·실제 실행 사용자 확인은 면제하지 않는다."
      consumption: "지식의 API 연결은 REQ-612.api_tool_mapping의 대응 도구 하나로, 커스텀 도구 연결은 해당 안정 도구로 해석한다. 대응 없음·충돌·조회 실패를 구분하고 현재 그룹·노출·원천 유효성·입력/신원/마스킹과 실행 승인을 검증한다. 등록·그룹·노출만으로 모든 도구를 제공하지 않는다"
      references: "현재 권한 안에서 안정 ID·이름·적용 리비전·연결 경로·현재 참조 여부만 조회한다. 연결 지식 본문/설명 자동 수집·업무 의미 영향 판정/보완 작업은 없다. 유효 참조를 끊는 삭제/중지는 기술 참조 검증으로 차단한다."
    public_contract_needs:
      - owner: "admin"
        purpose: "API 계약/가이드·지식 역참조·전체 후보와 혼합 세트 반영"
        boundary: "API 원천과 지식 매핑을 도구에 복제하거나 참조 판을 조용히 교체하지 않는다"
        refs:
          - "REQ-303"
          - "REQ-306"
          - "REQ-608"
          - "REQ-612"
      - owner: "agent"
        purpose: "검증된 구현 레지스트리·계약/배포 대응·현재 유효성 및 호출 검사"
        boundary: "필요 계약의 초안이며 현재 레지스트리 구현 완료를 뜻하지 않는다. 배포·관리 승인과 실행 승인을 구분한다"
        refs:
          - "REQ-105"
          - "REQ-108"
          - "REQ-114"
          - "REQ-612"
    failure_contract:
      - "금지 구현·검증 무효·계약 부재는 정상 등록/노출하지 않는다. 미완성 초안·과거 판과 현재 호출 가능한 유효본을 구분한다"
      - "참조 조회 실패를 연결 없음으로 간주하지 않는다. 기준/참조 판 충돌·검수 무효화·반영 실패는 기존 유효본을 유지하며 일부만 반영하지 않는다"
      - "승인 뒤 API/구현 계약이 달라지면 옛 승인으로 새 계약을 사용하지 않는다. 폐지 반영은 이후 호출을 중단하지만 이미 외부 접수/완료된 실행을 소급 취소하지 않는다"
      - "가이드는 실행 스크립트나 우회 호출 경로가 아니다. 결과 불명·중복 가능성은 REQ-105·113의 수동 확인/새 승인 경계를 따르며 임의 재전송·자동 폴링하지 않는다"
    permissions: "REQ-612.permissions의 현재 관리 권한과 각 원천/연결 지식의 접근 권한을 검사한다. 이력의 과거 그룹이나 구현 검수 기록으로 현재 권한을 대신하지 않는다"
    rules_from:
      - "REQ-612"
      - "REQ-114"
      - "REQ-105"
      - "REQ-113"
      - "REQ-306.version_guard"
      - "REQ-601.management_storage"
      - "ARCH-028.asset_versions"
    physical_contract: "40-domain/007·010 및 50-api/007·008의 물리/관리·모듈 계약 초안을 따른다. 그룹/세트/실행의 소유 pending과 G3 승인은 별도다"
    pending:
      - "@defer P3 integration_assets·agent — 50-api의 FEAT-021 초안을 구현 레지스트리/계약 판·배포 근거·현재 검증/무효화 경합의 실제 공개 계약에 연결한다. API 대응 점유의 후보 종료/복구는 knowledge 소유 계약으로 완성한다"
      - "@defer P3 integration_assets·knowledge — 가이드 참조/편집·지식 역조회·혼합 세트·반영/폐지와 이력의 소유 연결 및 화면·목업·시험을 설계한다"
    detail: "도구 참조·계약·검증 근거·실행 유형·그룹·노출·중지/삭제와 공통 결과 가이드를 현재 변경 권한으로 직접 저장한다. API 기반 도구는 원천 계약/가이드를 참조하고 현재 권한·기준 버전·참조 보호·전체 이력을 유지한다(REQ-601·612)."
    reqs:
      - "REQ-105"
      - "REQ-114"
      - "REQ-612"
    screens:
      - "SCR-054"
    management_boundary: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
