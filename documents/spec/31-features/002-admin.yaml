    processing:
      read: ENT-011의 안정 식별과 ENT-012의 요청한 내용 판을 조회한다. 저장된 연결 선택 방식과 현재 적용 연결 근거를 구분하며 조회 실패를 연결 없음으로 치환하지 않는다
      create: 안정 API와 후보를 작성하고 미완성 근거/필드를 표시한다. 조회/실행 유형은 메서드·인증 유무와 독립이다. 결과 확인 API 없음이나 멱등성 미보장을 일괄 등록 금지 조건으로 만들지 않으며 정상 운영 반영에는 필요한 검수/오픈 근거를 확인한다
      connection: 제공 시스템 다음 현재 허용된 명시 연결을 필수 선택한다. 주소·인증/공통 헤더 원천은 YAML이며 상대 경로로 다른 호스트를 지정하지 못한다. 시스템 변경은 재선택하고 호출 전 현재 연결/사용/권한을 재검사한다.
      fields: ENT-013의 요청/응답 경로·타입·의미/형식·필수/NULL·코드·개인정보를 검수한다. 부재/NULL/0/빈 문자열을 구분하고 입력 확보 가이드는 요청에만 둔다. API 원천 정의를 지식·그룹 화면에 복제하지 않는다
      input_guide: 사용자·허용 조회·비밀 아닌 고정값/기본값·계산/변환·서버 제공의 출처와 선택/추출·부족/모호성 처리를 명세한다. 실제 값 검증과 보호 신원/추적값 주입은 서버가 수행하고 업무별 질문/선택 순서는 지식 매핑이 소유한다
      code_names: ENT-014는 요청/응답 등록 필드의 참조 가이드 또는 직접 등록 의미 매핑을 소유한다. 직접 값은 ENT-030의 의미 매핑 역할로 명칭·의미/사용 조건과 자료형을 보존한다. LLM의 허용된 조회/해석과 서버 입력 검증·결과 판정은 REQ-608.field_value_mapping을 따른다. 기존 네 방식 자동 해석 규칙을 강제하지 않는다.
      call_contract: 완료/접수·요청 식별·결과 확인 유무/상태 매핑·재시도/멱등성 근거와 선택적 호출 제한을 검수한다. 미지정은 공통값, 지정은 해당 판의 값이며 실제 점유/갱신·연결/프록시 조건을 별도 검사한다
      change: 전체 소유 구성·그룹/예외·가이드·중지/허용된 삭제를 현재 변경 권한·기대 버전·필수 참조/기술 계약으로 검증해 직접 저장한다. 현재값/전체 이력/원 명령 결과는 원자 확정하고 외부 공동 오픈·배포 검수·실제 실행 사용자 확인은 면제하지 않는다.
      consumption: ARCH-028·REQ-108의 선택 내용 판과 현재 공개/그룹/신원/정책·실제 연결을 검사한다. 상태 변경 인자는 제안 턴에서 필요한 데이터를 다시 조회해 완성·검증하고 REQ-105·026의 실제 대상/액션/순서/값 승인을 받는다. 관리 승인·가이드는 이 승인을 대신하지 않는다
      references: 현재 권한 안에서 안정 ID·이름·적용 리비전·연결 경로·현재 참조 여부만 조회한다. 연결 지식 본문/설명 자동 수집·업무 의미 영향 판정/보완 작업은 없다. 유효 참조를 끊는 삭제/중지는 기술 참조 검증으로 차단한다.
