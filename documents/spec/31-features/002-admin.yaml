    detail: 업무 DB/DW 전체가 아닌 **Hub 공개 대상으로 선택한 뷰·테이블**만 관리한다. 관리자는 공개 테이블을 먼저 등록하고 접근 그룹을 매핑한 뒤 컬럼을 등록한다. 속성을 스키마 사실 / 업무 의미로 구분해 다루며, 등록 공개 객체의 사실은 권한이 있을 때 보조적으로 수집·비교할 수 있고 의미는 수기 등록·검수 대상이다. 자동 수집이 의미·정책을 덮지 않는다
    table_level: 귀속 데이터소스 · DB/카탈로그명 · DB 스키마명 · 객체명 · 필요한 서버 한정자 · 객체 유형(TABLE/VIEW) · 공개 여부 · 업무 명칭·설명. 물리 식별·중복 제한·스키마명 명시는 REQ-301을 따른다. **대상 시스템 귀속 없음**
    query_constraints: 관리는 FEAT-012·SCR-009에 이관하며 카탈로그는 REQ-611.query_constraints.catalog_projection만 제공한다
    column_facts: REQ-301.column_workspace/source_dimensions의 컬럼 기본정보·원천 치수를 표시한다. PK/유니크는 전체 키를 사용하고 관계 건수는 FEAT-011의 같은 정본에서 읽기 전용으로 요약한다. 관계 편집은 SCR-039가 맡으며 이 화면의 전체 후보 저장·복사·고정도 소유 관계/쌍을 보존한다. 등록 컬럼의 그룹 기본 상속·예외와 미등록 컬럼 차단은 유지한다
    column_order: REQ-301.column_order. 원천 순서 또는 수기 확인값을 컬럼과 이력에 보존하며 기본 숫자 오름차순/null 마지막으로 조회한다. PK 내 순서/그리드 No와 혼동하지 않는다.
    column_meaning: groupCode는 원천 공통 코드 그룹 구분값이며 해당 없으면 null이다. 상세 설명(detailDescription)에 컬럼 용도·사용법과 공통 코드가 아닌 하드 코딩 값/의미를 작성한다. 수기 열거 자식·값 방식 선택은 관리하지 않는다.
    metadata_validation: REQ-301.column_metadata·value_domain에 따라 물리 자료형과 의미/형식, 코드 원천·그룹·값 의미·검수 상태를 관리한다. 개인정보 속성·미확인 통제는 REQ-111.privacy_metadata와 정책 원천을 참조한다. 미완성 후보를 AI 사용 가능으로 확정하지 않으며 구체 필드·배치는 P3에서 정한다
    why_value_domain: '**LLM 이 실존하지 않는 값으로 조건을 만드는 것을 막기 위해** 컨텍스트에 값·명칭을 함께 주입하는 근거가 된다'
    not_managed: DB 기본값(DEFAULT)과 원천 구조/인덱스 생성·변경·삭제는 관리하지 않는다. 컬럼 사이즈·인덱스 메타데이터의 이전 제외는 2026-10-29 사용자 결정으로 철회했으며 REQ-301.source_dimensions/index_metadata를 따른다
    includes: 등록 공개 객체의 구조 비교·차이/미지원/확인 불가·수기 메타데이터와 검증 상태·전체 직접 변경 이력을 관리한다. 지식 의미 영향 검토 상태/작업이나 자동 본문 수집은 제공하지 않는다.
    hard_rule: 업무명/설명과 필수 기술 검증·현재 권한·기준 버전을 확인한 카탈로그 전체 구성을 직접 저장한다. 미완성 검증 상태는 AI 사용 자격과 구분하며 별도 승인 요청을 만들지 않는다(REQ-301·305·306).
    reqs:
      - REQ-103
      - REQ-301
      - REQ-304
      - REQ-111
    traces_to:
      - PRN-10
    history_pattern: REQ-601.change_history·ADR-035. 소유 관리 테이블의 _HIST 복사·HIST_ID PK·공통 HISTORY_NO와 마스터의 HIST_DTM을 적용하고 별도 이력 메뉴가 원 관리 화면을 상속한다. 현재 등록/수정과 이력 조회를 같은 탭/모달로 혼합하지 않는다.
    screens:
      - SCR-003
    direct_management: REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다.
    management_boundary: REQ-301.save_reason·REQ-601.management_storage. 현재 적용본을 기준으로 버튼 고정 saveTarget의 영역 변경만 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다.
    save_boundary: 전체 카탈로그·컬럼/관계·그룹/예외를 소유 현재값/baseRevision 기준으로 직접 저장한다. 원 소유 기술 검증·참조/이력과 현재 권한을 유지하며 자식별 별도 승인/리비전을 만들지 않는다.
    asset_availability: 'REQ-601.asset_availability: useYn은 현재 자산 전체 직접 저장·이력에 포함하는 수동 Boolean이다. 유효 적용본/필수 참조에 따른 사용 가능 여부 및 사유와 구분하며 현재 사용자 권한/신원은 호출 때 별도 검사한다. OFF/무효/미확인은 신규 후보·직접 호출·저장된 워크플로우 실행/재시도/재개에 반영한다. 관측/복구가 수동 값을 덮어쓰지 않는다.'
