    request_policy: "Portal 사용자의 신청은 원 제출본·요청 ID/버전·선행 상태·현재 처리 권한을 검증한 관리자가 승인/반려한다. 관리자 간 승인이나 설정에 따른 전결로 대체하지 않는다. REQ-601.request_integrity와 각 업무의 적용 월·지급/만료 경계를 유지한다."
