    save_reason: 상단과 각 편집 탭의 저장 버튼은 소유 영역의 고정 saveTarget 코드를 전달한다. MASTER=마스터 데이터, COLUMNS=컬럼 정의, ACCESS_GROUPS=사용자 그룹, COLUMN_GROUP_EXCEPTIONS=컬럼 그룹 예외, INDEXES=인덱스, RELATIONSHIPS=별도 관계 편집이다. 변경 사유 레이어 팝업의 trim 후 비공백 reason과 해당 영역 변경값만 반영한다. 서버는 대상 코드·허용 필드·현재 HUB_CATALOG READ·SAVE 권한/기준 리비전·전체 참조 무결성을 검증하며 다른 탭의 미저장값은 반영하지 않는다. saveTarget을 그대로 이력에 저장하고 실제 차이로 대상을 재계산하지 않는다. 변경 없음은 새 이력 없이 반환한다. 현재 확정 구성에 영역 변경을 합쳐 같은 HISTORY_NO의 전체 HIST를 복사하며 부모에 saveTarget과 HIST_REASON을 기록한다. 취소는 전송하지 않고 다른 탭 입력도 유지한다. 실패/충돌/결과 불명 및 동일 명령 재시도는 원 대상·reason·입력·commandKey를 보존한다. 성공 후 새 저장은 새 메모를 받고 다른 탭 편집은 보존한 채 최신 기준 리비전/참조를 재검사한다. SCR-042는 저장된 saveTarget 명칭과 메모를 변경 대상/변경 사유로 조회한다.
