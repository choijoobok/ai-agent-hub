    outputs:
      - 안정 객체 ID·전체 식별·후보/유효/과거 리비전과 당시 전체 구성, 속성별 미완성·미검수·무효 참조와 운영 사용 제외 사유
      - FEAT-014로 넘길 고정 대상/내용·기준/참조 리비전·사유·검수 근거와 실제 처리 결과 참조. 후보 저장 성공을 운영 반영으로 표시하지 않는다
    processing:
      read: 안정 항목 ENT-005에서 요청한 내용 판을 조회한다. 현재 컬럼/그룹으로 과거를 재구성하지 않으며 현재 직접 정책과 당시 판단 근거를 구분한다. 배포/참조 조회 실패를 객체 없음·영향 없음으로 처리하지 않는다
      create: REQ-301.manual_registration에 따라 신규 화면에서 직접 입력하거나 선택적인 원천 조회로 보완한 공개 테이블·뷰를 전체 물리 식별로 중복 검사하고 등록한다. 테이블과 접근 그룹 후보를 먼저 정한 뒤 컬럼을 명시 등록한다. 미완성 초안은 보존하되 해당 범위를 AI 주입·업무 조회에서 제외한다
      change: 전체 소유 구성·그룹/예외·가이드·중지/허용된 삭제를 현재 변경 권한·기대 버전·필수 참조/기술 계약으로 검증해 직접 저장한다. 현재값/전체 이력/원 명령 결과는 원자 확정하고 외부 공동 오픈·배포 검수·실제 실행 사용자 확인은 면제하지 않는다.
      metadata: groupCode는 원천 공통 코드 그룹 구분값이며 해당 없으면 null이다. 상세 설명(detailDescription)에 컬럼 용도·사용법과 공통 코드가 아닌 하드 코딩 값/의미를 작성한다. 수기 열거 자식·값 방식 선택은 관리하지 않는다.
      query_constraints: REQ-611.query_constraints의 정책 원천을 읽기 전용으로 참조한다. 대상 catalogId로 건수/조회 상태를 역조회하고 SCR-009로 이동한다. 카탈로그 전체 후보·복사·복원·고정에 제약 정의를 포함하지 않는다
      policy_boundary: 접근 허용 그룹·컬럼 그룹 예외는 FEAT-007의 전체 후보로 함께 반영한다. 마스킹 구현/유형 목록은 REQ-611.masking_utility의 소스를, 행 스코프·기본 필터·필수 조회 제약·전송 정책은 각 현재 원천을 참조하며 카탈로그 승인/복원으로 직접 정책을 덮어쓰지 않는다. 그룹/컬럼 예외는 SCR-003의 사용자 그룹/컬럼 그룹 예외 탭에서만 편집하며 FEAT-007의 같은 소유 구성·기대 버전·공개 명령을 소비한다. 정의와 그룹/컬럼 예외 모두 HUB_CATALOG READ·SAVE를 검사하며 별도 현재값 저장을 만들지 않는다
      observation: 등록 공개 객체의 구조 비교·코멘트 제안은 검수 보조 자료로만 저장한다. 발견 컬럼을 자동 등록/공개하지 않고 구조 비교 정상으로 의미 변화가 없다고 판정하지 않는다. 수집 실패·부분 확인은 ENT-010에 구분한다
      sampling: 현재 UI/구현 범위 제외. 재요청 시 재검토할 통제는 REQ-304.note의 수동 컬럼 선택·현재 권한·개인정보 컬럼 제외·distinct 값 수/조회 행 상한·시스템 조회 이력을 적용한다. 샘플을 수기 코드값으로 저장하지 않으며 원천 관측 근거이며 자동 검수 완료나 무제한 이력 원문으로 보존하지 않는다
      consumption: 현재 허용 선택 카탈로그·컬럼의 메타데이터와 groupCode·detailDescription를 제공하고 데이터소스별 가이드를 한 번 조회한다. 가이드/선행 원천 읽기 조회 결과의 상태·근거는 실제 턴에 추적한다.
