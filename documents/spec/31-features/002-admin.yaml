      - 1측 유일성·타입/의미 호환·누락/중복의 집계 의미 검수 결과와 변경 사유·지식/예제 영향 근거
    outputs:
      - 관계 안정 참조와 소유 내용 판, 양쪽 공개 객체/전체 컬럼 쌍·당시 참조 판·검수 결과 및 사용 제외 사유
      - FEAT-003의 전체 후보에 포함된 관계 변경과 FEAT-014의 세트 처리 참조. 반대편 객체에서의 조회는 같은 정본을 보여 준다
    workspace: REQ-301.relationship_metadata.workspace·related_knowledge. 단일 데이터소스 필터의 좌우 테이블 선택 팝업과 가로3그리드 컬럼 매핑·숫자 순서 폴백·검수 탭 제거·활성 합집합 기반 연결 지식 역조회를 따른다.
    processing:
      read: 소유 후보/선택한 과거 내용 판의 관계를 조회하고 현재 양쪽 접근 가능성과 구분한다. 관계 이름이나 현재 컬럼으로 과거 구성을 다시 만들지 않는다
      change: REQ-301.relationship_metadata.ownership에 따라 신규 관계의 왼쪽 카탈로그를 내부 소유로 자동 지정·고정하고 기존 소유는 보존하며 ENT-008의 전체 컬럼 쌍·두 역할·방향·검수 근거를 그 ENT-006 후보로 작성한다. 별도 화면도 전체 구성을 확보해 저장하고 다른 편집 표면의 BASE_REVISION 충돌을 자동 병합하지 않는다. SCR-003이 관계 편집을 숨기거나 조회에 실패해도 소유 관계 목록을 삭제하지 않는다. 반대쪽은 같은 정본과 관리 후보로 연결하며 자동 FK·동명 컬럼은 검토 근거로만 사용한다
      validation: 공개 대상/컬럼·전체 복합 키·타입/의미 호환·1측 유일성·미대응/중복 의미를 검수한다. 물리 FK 존재나 같은 DB/스키마를 새 필수 조건으로 만들지 않는다
      references: FEAT-014.reference_validation으로 자기 후보·같은 세트 상대 후보·외부 유효본을 구분한다. 자기조인은 두 역할 모두 같은 소유 후보의 컬럼을 참조한다. 양쪽 객체가 같아도 역할/컬럼 쌍을 합치지 않고 상호 참조는 전체 후보 집합에서 대조한다
      impact: 관계 변경으로 연결 지식·예제와 상대 참조에 주는 영향을 FEAT-003·036에서 확인한다. 폐기 시 남은 필수 참조는 REQ-306.shared_impact에 따라 해소한다
      consumption: REQ-301.relationship_metadata.consumption_scope와 50-api FEAT-011.relation_read_contract의 공통 관계 조회를 LLM 컨텍스트와 FEAT-023 예제 작성에 제공한다. 이번 조회/선택의 양쪽 정확 catalogId/revisionId 집합·현재 객체/컬럼 권한·검수·전체 쌍 조건을 확인하며 카탈로그 메타데이터 목록에 모든 관계 본문을 내장하지 않는다. 관계가 필요 없는 독립 조회는 구분하고 1:N 집계를 일괄 DISTINCT로 보정하지 않는다
    public_contract_needs:
      - owner: admin
        purpose: 카탈로그 후보의 전체 관계·소유/상대 참조 판과 변경 세트의 검증/반영
        boundary: 관계 자체에 별도 승인 상태나 상대 객체의 중복 정본을 만들지 않는다
        refs:
          - FEAT-003
          - FEAT-014
          - REQ-306
      - owner: agent
        purpose: 허용된 관계·전체 컬럼 쌍·1측/집계 근거와 실제 연결 범위의 판정
        boundary: 관계 등록만으로 다른 데이터소스를 한 SQL 연결로 합치거나 현재 접근 권한을 부여하지 않는다
        refs:
          - REQ-301
          - REQ-603
          - ARCH-028
    failure_contract:
      - 복합 컬럼 쌍 누락·참조 불명·의미/유일성 미검수는 초안의 사용 불가 사유로 보존하고 권장 경로에서 제외한다. 무관한 독립 컬럼을 위해 관계를 강제로 만들지 않는다
      - 상대 권한 부족·무효 참조·기준/참조 판 충돌은 기존 공통 검증으로 거부/반려한다. 참조 최신판을 자동 선택해 제출 후보를 바꾸지 않는다
