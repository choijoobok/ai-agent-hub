    failure_contract:
      - 전체 식별 중복·모호한 스키마·Hub 관리 권한 부족·필수 참조 조회 실패는 반영 불가다. 원천 메타데이터 조회권 부족은 REQ-301.manual_registration의 수동 입력·근거 검수로 처리한다. 동명 객체를 자동 선택하거나 조회 실패로 기존 항목을 지우지 않는다
      - 미완성 의미/코드·개인정보 미확인·미검수 관계는 해당 범위를 사용 불가로 표시한다. 관계가 필요 없는 독립 컬럼까지 일괄 차단하거나 미확인을 해당 없음으로 바꾸지 않는다
