      create: "REQ-301.manual_registration에 따라 신규 화면에서 직접 입력하거나 선택적인 원천 조회로 보완한 공개 테이블·뷰를 전체 물리 식별로 중복 검사하고 등록한다. 테이블과 접근 그룹 후보를 먼저 정한 뒤 컬럼을 명시 등록한다. 미완성 초안은 보존하되 해당 범위를 AI 주입·업무 조회에서 제외한다"
      change: "전체 소유 구성·그룹/예외·가이드·중지/허용된 삭제를 현재 변경 권한·기대 버전·필수 참조/기술 계약으로 검증해 직접 저장한다. 현재값/전체 이력/원 명령 결과는 원자 확정하고 외부 공동 오픈·배포 검수·실제 실행 사용자 확인은 면제하지 않는다."
      metadata: "구조 사실·업무 의미·값 도메인을 구분해 ENT-007에 연결한다. 같은 데이터소스의 등록 코드 조회 정의 정확 버전·typed 바인딩과 코드값/의미를 검수하며 자동 수집·다른 원천의 동명 코드로 의미를 확정하지 않는다"
      query_constraints: "REQ-611.query_constraints의 정책 원천을 읽기 전용으로 참조한다. 대상 catalogId로 건수/조회 상태를 역조회하고 SCR-009로 이동한다. 카탈로그 전체 후보·복사·복원·고정에 제약 정의를 포함하지 않는다"
      policy_boundary: "접근 허용 그룹·컬럼 그룹 예외는 FEAT-007의 전체 후보로 함께 반영한다. 공통 마스킹 변환 정의·행 스코프·기본 필터·필수 조회 제약·전송 정책은 각 현재 원천을 참조하며 카탈로그 승인/복원으로 직접 정책을 덮어쓰지 않는다 SCR-003의 접근 그룹/컬럼 그룹 예외 탭과 SCR-007은 FEAT-007의 같은 후보·기대 버전·공개 명령을 소비하며 별도 현재값 저장을 만들지 않는다"
      observation: "등록 공개 객체의 구조 비교·코멘트 제안은 검수 보조 자료로만 저장한다. 발견 컬럼을 자동 등록/공개하지 않고 구조 비교 정상으로 의미 변화가 없다고 판정하지 않는다. 수집 실패·부분 확인은 ENT-010에 구분한다"
      sampling: "현재 UI/구현 범위 제외. 재요청 시 재검토할 통제는 REQ-304.note의 수동 컬럼 선택·현재 권한·개인정보 컬럼 제외·distinct 값 수/조회 행 상한·시스템 조회 이력을 적용한다. 샘플은 인라인 값 후보이며 자동 검수 완료나 무제한 이력 원문으로 보존하지 않는다"
      consumption: "agent는 ARCH-028·REQ-108의 선택 내용 판과 현재 공개/권한/신원/정책을 함께 검증한다. 과거 내용 판의 접근 그룹 스냅샷은 당시 근거이며 실제 인가는 현재 그룹/정책으로 판정한다. 필수 제약의 실제 SQL·바인딩 검증은 REQ-611.query_constraints를 따르며 미완성·미검수 범위나 미등록 컬럼을 제공하지 않는다"
