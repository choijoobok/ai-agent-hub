features:
# ══ admin — 시스템 관리 (10.1) ═══════════════════════════════════
  - id: FEAT-001
    usecases:
      - "UC-001"
      - "UC-002"
      - "UC-006"
      - "UC-015"
    module: "admin"
    screen: SCR-001
    roadmap: "RM-P1"
    title: "대상 시스템 등록·관리"
    design_status: "draft"
    entities:
      - "ENT-001"
      - "ENT-003"
      - "ENT-017"
      - "ENT-019"
      - "ENT-044"
    apis:
      - "API-001"
      - "API-002"
      - "API-003"
      - "API-004"
      - "API-005"
      - "API-006"
      - "API-007"
      - "API-008"
      - "API-009"
    trigger: "관리자가 SCR-001에서 정의·허용 연결·기본 연결을 조회하거나 직접 변경하고, API 관리가 제공 시스템/연결 후보를 참조할 때"
    operation_boundary: "각 원 소유 전체 구성은 현재 변경 권한·기대 버전·기술 참조 검증으로 직접 저장하고 현재값/전체 이력을 원자 반영한다. 별도 관리자 요청/승인·전결·지식 영향 검토 작업은 없다. 소유별 기술 계약/쿼터 효력 경계는 유지한다."
    inputs:
      - "조회: 시스템 식별자/명칭·관리 사용 상태, 선택 대상의 최신순 변경 이력 페이지와 권한 있는 사용처"
      - "변경: ENT-001의 편집 가능한 정의·허용 연결 집합·기본 연결, 기존 대상 식별자/기대 버전·작업 종류·사유. 처리자와 처리 시각은 서버 근거를 사용한다"
    outputs:
      - "관리 정의와 현재 버전, 지정한 기본/허용 연결 참조, 배포 연결의 현재 관측 결과와 확인 불가 사유를 구분한 상세"
      - "권한 범위의 영향 API·기본/개별 연결 사용·신원 매핑 참조, ENT-003의 반영 후 전체 구성과 처리 근거"
      - "직접 변경의 실제 저장 결과 또는 검증/권한/버전/참조 충돌. 저장 성공을 모든 API의 호출 가능이나 배포 완료로 표시하지 않는다"
    processing:
      read: "저장된 정의와 배포 공개 조회를 분리한다. 연결 없는 등록 초안도 조회한다. 후보 선택/허용 연결/관측에는 REQ-604.connection_display의 현재 Base URL·인증 방식·표시 상태와 적용 근거를 읽기 전용으로 제공한다. 배포 조회 실패는 빈 허용 목록이나 참조 삭제로 바꾸지 않고 저장된 참조를 유지하되 이전 주소/인증 방식을 현재값으로 남기지 않는다"
      create: "새 안정 식별자로 정의를 등록한다. 허용 연결이 없는 초안을 허용하며 기본 연결은 지정한 경우 허용 집합 안에서 선택한다. 표시명/배포 연결명을 내부 식별자로 사용하지 않는다"
      change: "현재 관리 권한·기대 버전과 실제 변경 대상의 참조 조건을 서버에서 검증한다. 허용 집합·기본값·정의의 반영 후 전체 구성을 ENT-003에 보존하고 현재값을 함께 반영한다. 신규도 확정된 버전 1 스냅샷을 만든다"
      references: "기본 연결 사용 API와 특정 연결 선택 API를 나누어 영향을 조회한다. 사용 중인 연결 참조를 끊는 제거는 거부하고 변경 근거를 안내한다. 비활성화/삭제는 REQ-601의 대상별 참조 보호를 검증하며 이력 존재만으로 일괄 금지하지 않는다"
      consumption: "API가 선택한 기본/특정 방식으로 ARCH-028의 실제 연결을 해석한다. 기본 연결 부재는 기본 연결 사용 API의 문제이며 특정 연결 API까지 같은 사유로 차단하지 않는다. 현재 로드 정의·권한·승인 대상 비교는 호출 시 소비 계약에서 다시 확인한다"
    public_contract_needs:
      - owner: "integration"
        purpose: "현재 로드된 API 연결 식별자·표시용 Base URL/인증 방식·불변 적용 설정 식별자·검수/조회 결과"
        boundary: "REQ-604.connection_display의 안전한 표시와 적용 근거만 읽는다. 배포 파일 예정값·주소 원문·인증값·공통 고정 헤더를 편집하거나 관리 저장값/이력으로 복제하지 않는다"
        refs:
          - "ARCH-028"
          - "REQ-403"
          - "REQ-604"
      - owner: "admin"
        purpose: "FEAT-004의 API 제공 시스템/연결 선택과 FEAT-005의 신원 매핑 사용처"
        boundary: "선택 후보 제공·참조 변경 보호·당시 이력 조회를 구분하며 조회만 하는 사용처를 변경 대상으로 선점하지 않는다"
        refs:
          - "FEAT-004"
          - "FEAT-005"
          - "REQ-608"
          - "REQ-609"
    failure_contract:
      - "기본값의 허용 집합 이탈·사용 중 참조 제거·권한 회수·기준 버전 충돌이면 현재값을 유지한다. 화면에서 사용처를 읽었다는 사실만으로 저장 직전 검증을 생략하지 않는다"
      - "배포/참조 조회가 실패해 필요한 검증을 완료하지 못한 변경은 반영하지 않는다. 관측 불가와 실제 미등록을 구분하며 다른 연결로 자동 대체하지 않는다"
      - "반영 후 이력 또는 현재값 저장 실패는 함께 실패한다. 응답 유실 뒤에는 기존 결과를 대조하고 중복 변경/이력을 만들지 않는다. 정확한 명령 식별·경합 방식은 50-api의 FEAT-001.shared_write_contract 물리 초안을 따른다"
    permissions: "REQ-604.permissions와 AUTHZ-090을 적용한다. 시스템 단위 사용자 그룹을 추가하지 않으며 사용처 조회로 API 권한·민감 근거를 우회하지 않는다"
    rules_from:
      - "REQ-604"
      - "REQ-601.business_rules"
      - "REQ-601.permissions"
      - "ARCH-028.api_connection_resolution"
      - "ARCH-028.deployment_contract"
      - "AUTHZ-090"
    pending:
      - "@defer P3 integration_assets — 50-api의 FEAT-001 shared_write_contract·integration_public_contract와 ENT-001·003·017·019 물리 초안을 후속 참조 쓰기·현재 배포 계약에 연결한다. UC-015.sequence_design과 project.state.yaml의 SLICE-001은 초안이다. SCR-001.target_doc의 전체 화면 상세 승인과 TC-0011~0019·TC-00110·TC-00111의 실제 시험·구체 응답/오류 MSG 계약은 후속이며 시스템명/배포 참조의 유일성은 추가하지 않는다"
    detail: "REQ-604의 대상 시스템 정의·API별 제공 시스템 지정·허용 연결 목록·기본 연결과 사용처를 관리한다. 공통 참조 보호는 REQ-601을 따른다"
    reqs:
      - "REQ-105"
      - "REQ-601"
      - "REQ-604"
    history_pattern: "REQ-601.change_history·ADR-035. 소유 관리 테이블의 _HIST 복사·HIST_ID PK·공통 HISTORY_NO와 마스터의 HIST_DTM을 적용하고 별도 이력 메뉴가 원 관리 화면을 상속한다. 현재 등록/수정과 이력 조회를 같은 탭/모달로 혼합하지 않는다."
    screens:
      - "SCR-001"
      - "SCR-040"
  - id: FEAT-002
    code_lookup_definition: "REQ-603.code_lookup_definition에 따라 SCR-002의 코드 정의/파라미터/결과 탭에서 ENT-041/042/043을 관리한다. API-063~069의 초안 저장/복사·검수/활성 명령·판 원장은 기본설정 명령과 독립이다. 초안/반려는 운영 _HIST를 만들지 않고 실제 유효값 반영 성공 때만 데이터소스 마스터/전체 유효 자식을 같은 이력 세트로 저장한다. 구체 물리/실행 통제는 FEAT-002.code_lookup_contract.pending을 따른다."
    dbms_context_contract: "REQ-603.dbms_context의 DBMS/버전 관리·관측 대조·확정 후 이력과 LLM 소비 정보를 소유한다. 공통코드 DBMS 활성 후보와 연결 지원을 확인하고 실제 버전 문자열을 관리한다. 버전별 자료형 관리 기능은 만들지 않는다"
    usecases:
      - "UC-001"
      - "UC-002"
      - "UC-006"
      - "UC-016"
    module: "admin"
    screen: SCR-002
    roadmap: "RM-P1"
    title: "데이터소스 관리"
    design_status: "draft"
    entities:
      - "ENT-002"
      - "ENT-004"
      - "ENT-018"
      - "ENT-019"
      - "ENT-041"
      - "ENT-042"
      - "ENT-043"
      - "ENT-045"
      - "ENT-046"
      - "ENT-047"
      - "ENT-048"
    apis:
      - "API-010"
      - "API-011"
      - "API-012"
      - "API-013"
      - "API-014"
      - "API-015"
      - "API-016"
      - "API-017"
      - "API-018"
      - "API-062"
      - "API-063"
      - "API-064"
      - "API-065"
      - "API-066"
      - "API-067"
      - "API-068"
      - "API-069"
    trigger: "관리자가 SCR-002에서 Hub 데이터소스를 등록·변경·조회하거나 배포 연결 참조를 명시적으로 정정할 때"
    operation_boundary: "각 원 소유 전체 구성은 현재 변경 권한·기대 버전·기술 참조 검증으로 직접 저장하고 현재값/전체 이력을 원자 반영한다. 별도 관리자 요청/승인·전결·지식 영향 검토 작업은 없다. 소유별 기술 계약/쿼터 효력 경계는 유지한다."
    inputs:
      - "조회: 내부 식별자/별칭·DBMS/파서·DB/DW 유형과 연결 관측 상태, 선택 대상의 최신순 이력 페이지·권한 있는 사용처"
      - "변경: ENT-002의 연결 참조·업무 메타데이터·적용 가능 그룹 집합, 기존 내부 식별자/기대 버전·작업 종류·사유. 참조 정정에는 동일 연결 대상 확인 근거를 전달한다"
    outputs:
      - "현재 관리값·버전과 연결 정상/끊김·확인 불가, 파서 미지정/미지원 사유를 구분한 상세. 배포 연결 상태만으로 조회 가능을 확정하지 않는다"
      - "카탈로그·테이블/컬럼 그룹 매핑·신원 매핑·자산의 권한 있는 사용처와 ENT-004 반영 후 전체 구성"
      - "저장 결과와 유지된 Hub 식별자 또는 충돌/거부 근거. 원천 DB의 실제 접근 권한이나 모든 구문의 파서 지원을 보증하는 결과는 아니다"
    processing:
      read: "현재 관리값과 로드된 데이터소스 ID·지원 DBMS/파서 근거를 별도로 조회한다. 연결 상태는 관측 결과이며 운영자가 정상으로 저장하는 속성이 아니다. 조회 실패를 끊김 확정이나 정상으로 바꾸지 않는다"
      create: "현재 로드된 배포 데이터소스 식별자를 선택해 안정된 Hub 식별자로 등록한다. 별칭은 유일한 수정 가능 표시명이고 파서는 DBMS 기본값과 별도 선택값을 구분한다. 미지정/미지원 파서는 조회 불가로 드러낸다"
      change: "현재 권한·기대 버전·별칭 충돌·참조 보호를 검사한다. 배포 참조 정정은 관리자가 같은 연결 대상임을 확인한 명시적 변경으로 처리하고 Hub 식별자와 하위 카탈로그 참조를 유지한다"
      group_change: "적용 가능 그룹은 하위 테이블·컬럼 매핑 어휘다. 제거할 그룹의 하위 매핑이 남아 있으면 변경을 차단한다(AUTHZ-010 및 mapping_rules). 사용자/그룹별 DB 스키마 권한이나 런타임 추가 권한 게이트를 만들지 않는다"
      save: "메타데이터·배포 참조·그룹 집합의 반영 후 전체 구성을 ENT-004에 기록하고 현재값과 함께 반영한다. 신규도 확정된 버전 1 스냅샷을 만들며 배포 연결 정의·풀을 DB에 복제하거나 동적으로 변경하지 않는다"
      consumption: "카탈로그·신원 매핑·SQL 조회는 Hub 내부 식별자를 참조한다. 한 연결의 다른 DB/스키마 공개 객체도 REQ-301·603의 전체 식별·권한·파서 조건으로 검사하며 대상 시스템 귀속·별도 DB 허용 목록을 추가하지 않는다"
    public_contract_needs:
      - owner: "integration"
        purpose: "현재 로드된 데이터소스 식별자·연결 정의의 적용 근거와 조회 실패 구분"
        boundary: "주소·계정·비밀·풀 설정은 전달/복제하지 않는다. 조회와 검증/실행이 같은 연결·이름 해석 환경을 사용하는 계약을 agent와 대조한다"
        refs:
          - "ARCH-030"
          - "REQ-403"
      - owner: "admin"
        purpose: "카탈로그/그룹 매핑·사용자 대상 신원·지식/예제 사용처"
        boundary: "그룹 축소·허용 삭제의 현재 참조 보호와 변경 당시 근거를 확인한다. 실제 데이터 열람 권한을 대신하지 않는다"
        refs:
          - "FEAT-003"
          - "FEAT-007"
          - "FEAT-005"
          - "FEAT-014"
          - "FEAT-023"
          - "AUTHZ-010"
      - owner: "agent"
        purpose: "Hub 데이터소스 선택·현재 연결/파서 검증과 실제 SQL 대상 동일성"
        boundary: "끊김·미지원·권한 거부에서 다른 연결/동명 객체로 대체하지 않는다. DBMS별 지원·구문 계약은 후속 상세에서 확인한다"
        refs:
          - "ARCH-030"
          - "REQ-301"
          - "REQ-603"
          - "REQ-609"
    failure_contract:
      - "별칭 충돌·권한 회수·기준 버전 충돌·하위 그룹 매핑이 남은 축소·유효 참조를 끊는 삭제는 반영하지 않고 허용 범위의 보완 대상을 안내한다"
      - "기존 배포 ID 부재는 끊긴 연결로 표시하고 관련 조회를 차단한다. 배포 목록 조회 장애는 확인 불가이며 필요한 검증을 할 수 없는 참조 변경을 거부한다. 저장된 참조를 자동 삭제/변환하지 않는다"
      - "이력/현재값 저장 실패는 함께 실패한다. 재전송·참조 검사 직후 하위 매핑 추가·다중 노드 설정 차이의 검증/복구 경계는 물리/공개 계약에서 구체화한다"
    permissions: "REQ-603.permissions와 AUTHZ-090을 적용한다. 데이터소스 적용 가능 그룹과 실제 사용자 신원·객체/행 권한 판정을 구분한다"
    rules_from:
      - "REQ-603"
