    failure_contract:
      - 미허용/해석 불가 연결·목적지 우회·미완성 필드/개인정보·참조 실패는 정상 운영 계약으로 반영하지 않는다. 다른 연결/동명 코드로 자동 대체하지 않는다
      - 기준본·참조 판 충돌·중복 미종결 요청·검수/반영 실패는 기존 유효본을 유지한다. 제출본 교체·부분 반영·하지 않은 승인 기록을 만들지 않는다
      - 실제 입력 부족/모호성·형식/허용값 실패는 호출 전 보완한다. 승인 뒤 조회/변환으로 인자를 조용히 바꾸거나 응답값으로 서버 신원을 덮지 않는다
      - 미등록 응답·개인정보 미확인·응답 불일치는 REQ-111·115를 따른다. 코드명 확인 불가는 허용된 원값/안내와 기존 가림을 유지하고 원 업무를 실패/미실행으로 단정하거나 재전송하지 않는다
      - 결과 확인 API 없음·결과 불명은 REQ-105의 수동 확인·새 승인 경계를 따른다. 타임아웃은 취소 성공이 아니며 제한 설정 변경으로 진행 중 호출 시간을 바꾸지 않는다
    permissions: REQ-608.permissions와 AUTHZ-090·091의 현재 관리 액션을 적용한다. API와 코드 조회/입력 확보용 자산 각각의 현재 접근·신원·마스킹/전송 통제를 유지한다
