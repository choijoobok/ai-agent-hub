    integration_history_link: FEAT-001·002가 생산하는 ENT-003/004 및 ENT-044~048의 동형 복사 세트와 historyNo를 연결한다. 이력 화면은 복원 동작을 제공하지 않으며 복원이 필요한 업무는 원 관리 기능의 새 변경/현재 승인 절차로 인계한다.
    deleted_asset_history: 삭제된 대상도 보존된 원 ID/당시 명칭으로 전용 이력 메뉴에서 찾는다. 현재 행과 조인하거나 관리 화면의 과거 탭으로 복귀하지 않는다. 보존/권한은 현재 정책을 적용한다.
    catalog_history_link: 카탈로그는 SCR-042에서 당시 HISTORY_NO의 원본별 _HIST 전체 세트를 조회한다. 내용 후보·고정 판·제출/승인 원장은 별도 근거이며 이력으로 삭제/대체하지 않는다. 복사 물리/조회 API는 integration_assets 후속에서 확정하고 현재 판 테이블 조회만으로 새 이력 완성을 주장하지 않는다.
    api_tool_history_link: API·도구도 REQ-601.change_history의 전용 상속 이력 메뉴와 원본별 _HIST/HISTORY_NO를 소유 영역에서 설계한다. 후보·고정 판·공동 오픈/검수·승인 원장은 별도 보존하며 이력 조회가 현재 호출 권한을 부여하지 않는다.
    pending:
      - '@defer P3 — 외부 사건과 소유 모듈별 처리 결과의 식별·시간 순서·재전송·부분 실패/재처리 및 조회 계약을 access_policy 영역에서 설계한다. 수신 사실을 전체 반영 성공으로 표시하지 않는다'
      - '@defer P3 audit_trace physical_and_contracts — ENT-003/004·고정 내용 판의 관리 이력과 ENT-019/028/036 성공 결과의 보존·과거 열람·파기 경계를 각 생산 기능과 함께 정한다. 늦은 commandKey가 신규로 재수용되지 않는 근거 및 파기 주체/경합/복구가 확정되기 전 결과 파기는 비활성이다. FEAT-222의 본문/결과 파기에 관리 명령 결과를 자동 편입하지 않는다. audit_trace 물리 검토 및 admin G3 전에 재검토한다'
    hard_rule: 별도 이력 메뉴는 읽기 전용이다. 복원은 원 관리 기능의 새 변경/현재 검증·승인 절차로 수행하고 과거 _HIST를 수정하거나 과거 승인을 승계하지 않는다. SCR-048에 한해 REQ-303.restore_contract의 원 지식 편집 인계를 허용하며 이력에서 직접 복원 저장하지 않는다.
    why: 정책은 배포 없이 즉시 반영되므로(PRN-06) **잘못된 변경을 되돌리는 수단이 사실상 유일한 안전장치다.** 이력이 없으면 매핑을 일시적으로 넓혀 조회한 뒤 되돌리는 행위를 추적할 수 없다
    reqs:
      - REQ-103
      - REQ-107
      - REQ-601
      - REQ-606
      - REQ-308
    direct_management: REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다.
