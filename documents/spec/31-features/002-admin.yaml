    detail: REQ-302.sql_variants의 제목 묶음과 여러 SQL별 순번/제목/설명/원문을 편집한다. 저장 사유·현재 권한·기대 리비전·모든 SQL의 기술 검증과 전체 이력을 원자 반영한다. 파라미터 탭·후보 작성2버튼·근거 탭과 검증 상태/등록 경로 열은 제거한다.
