features:
# ══ admin — 시스템 관리 (10.1) ═══════════════════════════════════
  - id: FEAT-001
    workstream: admin
    configuration_cleanup: REQ-601.configuration_cleanup. 전체 조회 범위 미리보기와 현재 SAVE·참조·버전·배포 검증, 전체 원자 정리/이력·원 명령 재조회. 일반 저장/기술값 편집과 분리한다.
    usecases:
      - UC-001
      - UC-002
      - UC-006
      - UC-015
    module: admin
    screen: SCR-001
    roadmap: RM-P1
    title: 대상 시스템 설정 조회·표시 보완
    design_status: approved
    implementation: implemented
    invoker_extension: REQ-604.invoker_extension·CR-050 B·ADR-051. 연결별 등록 유틸 선택/검증을 구현하고 SAP OData는 후속으로 유지한다.
    delivery_boundary:
      decision: CR-049 A 사용자 승인.
      producer: YAML 동기화·표시 보완·안전한 연결 표시/테스트·저장 진단/경고·확정 누락 정리·전체 이력·소유 연결 포트를 구현한다.
      followup: FEAT-004/118 실제 업무 API·워크플로우 사용, FEAT-510 대시보드 및 FEAT-033 독립 이력 화면 검수는 후속 소유에 남긴다. 기존 FEAT-005 신원 참조는 실제 연결한다.
    entities:
      - ENT-001
      - ENT-003
      - ENT-017
      - ENT-019
      - ENT-044
      - ENT-094
      - ENT-095
      - ENT-098
      - ENT-168
      - ENT-169
      - ENT-170
      - ENT-532
      - ENT-533
      - ENT-534
    apis:
      - API-001
      - API-002
      - API-003
      - API-004
      - API-005
      - API-009
      - API-070
      - API-071
      - API-073
      - API-074
    trigger: 기동 시 YAML 정의 동기화, SCR-001의 표시 보완·연결 테스트/사용 API 조회, SCR-525의 연결 설정 경고 조회
    operation_boundary: 각 원 소유 전체 구성은 현재 변경 권한·기대 버전·기술 참조 검증으로 직접 저장하고 현재값/전체 이력을 원자 반영한다. 별도 관리자 요청/승인·전결·지식 영향 검토 작업은 없다. 소유별 기술 계약/쿼터 효력 경계는 유지한다.
    inputs:
      - '기동 동기화: 현재 환경의 검증된 전체 YAML 시스템/연결 정의와 불변 적용 설정 세대'
      - '관리자 변경: 기존 대상 targetId/expectedRevision과 시스템·연결 이름/설명 재정의 전체. 기술 정의·기본 연결·새 대상 생성/삭제는 받지 않음'
    outputs:
      - 기존 시스템/연결 및 YAML 미존재 DB 잔재·표시 재정의·안전한 현재 연결 표시·사용 API·감사
      - API-070 테스트 결과와 API-071 권한 범위의 원인별 현재 경고·영향/점검 범위
    processing:
      read: REQ-604의 DB 전체 기준 조회·ENT-098의 적용 설정 버전별 저장 판정·현재 안전한 연결 표시·두 하단 탭을 제공한다. 일반 조회에서 전체 YAML 재대조나 판정 저장을 하지 않는다. 누락과 확인 불가를 구분한다.
      sync: REQ-604.synchronization. YAML 소유 키/메타와 REQ-601.configuration_diagnosis의 ENT-098 판정 묶음을 원자 확정하며 제거 행/참조·관리자 재정의는 보존한다. 이전 세대 노드/동시 관리자 입력을 보호하고 동일 내용은 버전/이력을 늘리지 않는다.
      change: 기존 id/version의 관리자 표시 보완값만 직접 저장한다. 전체 구성 이력에 비밀 없는 원본 메타/보완값을 보존하고 기술 주소/인증 원문은 복제하지 않는다.
      references: 사용 API 목록은 API/명시 연결 ID와 표시명을 읽기 전용으로 조회한다. 신원·워크플로우 등 기술 참조는 REQ-601.configuration_alerts의 ID 기반 영향 추적에 연결한다.
      consumption: 현재 정확 시스템/연결·기동 허용과 참조 잠금 포트를 제공한다. Portal 신원 저장은 실제 연결했으며 업무 API 실행·워크플로우 소비는 CR-049 경계에 따라 소유 기능에서 검증한다.
      test: YAML 안전 테스트 구성·현재 정의·READ/EXECUTE 권한을 재검사하고 한정된 GET/HEAD 요청 결과를 비밀 없이 반환한다. SAVE와 별개다.
      alerts: REQ-601.configuration_alerts의 현재 원인 묶음/해소·범위와 ENT-094/095를 소유하며 system dashboard는 admin 공개 조회의 소비자다.
    public_contract_needs:
      - owner: integration
        purpose: 현재 로드된 API 연결 식별자·표시용 Base URL/인증 방식·불변 적용 설정 식별자·검수/조회 결과
        boundary: REQ-604.connection_display의 안전한 표시와 적용 근거만 읽는다. 배포 파일 예정값·주소 원문·인증값·공통 고정 헤더를 편집하거나 관리 저장값/이력으로 복제하지 않는다
        refs:
          - ARCH-028
          - REQ-403
          - REQ-604
      - owner: admin
        purpose: FEAT-004의 API 제공 시스템/연결 선택과 FEAT-005의 신원 매핑 사용처
        boundary: 선택 후보 제공·참조 변경 보호·당시 이력 조회를 구분하며 조회만 하는 사용처를 변경 대상으로 선점하지 않는다
        refs:
          - FEAT-004
          - FEAT-005
          - REQ-608
          - REQ-609
    failure_contract:
      - 일반 UI/API의 신규·삭제·식별/기술값 변경은 거부한다. 확정 누락 정리는 configuration_cleanup의 별도 명령으로만 허용한다. YAML 누락 DB 행/참조를 보존하고 오류·경고를 제공한다.
      - 전체 설정 검증/관측 실패를 빈 정상 또는 전체 삭제로 치환하지 않는다. 관리자 수정·동기화·이력은 소유 필드와 원자성 경계를 지킨다.
      - 실패한 설정/참조는 모든 새 호출·저장된 워크플로우의 재개/재시도 전에 차단한다. 이미 전송된 업무의 기존 결과 통제는 유지한다.
    permissions: REQ-604.permissions와 AUTHZ-090을 적용한다. 시스템 단위 사용자 그룹을 추가하지 않으며 사용처 조회로 API 권한·민감 근거를 우회하지 않는다
    rules_from:
      - REQ-604
      - REQ-601.business_rules
      - REQ-601.permissions
      - ARCH-028.api_connection_resolution
      - ARCH-028.deployment_contract
      - AUTHZ-090
    pending:
      - '@defer FEAT-004/118/510/033 — 업무 API·워크플로우·대시보드·독립 이력 화면 실제 소비 검증. SAP OData는 ADR-051의 후속 설계 체크리스트를 따른다.'
    detail: REQ-604의 YAML 정본 대상 시스템/연결 조회·표시 보완·연결 테스트와 REQ-601.configuration_alerts 경고를 소유한다. Portal 계정 매핑의 시스템 기준을 제공한다.
    reqs:
      - REQ-105
      - REQ-601
      - REQ-604
    history_pattern: REQ-601.change_history·ADR-035. 소유 관리 테이블의 _HIST 복사·HIST_ID PK·공통 HISTORY_NO와 마스터의 HIST_DTM을 적용하고 별도 이력 메뉴가 원 관리 화면을 상속한다. 현재 등록/수정과 이력 조회를 같은 탭/모달로 혼합하지 않는다.
    screens:
      - SCR-001
    uses_features:
      - FEAT-040
  - id: FEAT-002
    workstream: admin
    configuration_cleanup: REQ-601.configuration_cleanup. 전체 조회 범위 미리보기와 현재 SAVE·참조·버전·배포 검증, 전체 원자 정리/이력·원 명령 재조회. 일반 저장/기술값 편집과 분리한다.
    mapping_active: REQ-601.asset_mapping_active. 소유 링크의 활성 설정은 기존 저장 영역/전체 이력에 포함하고 역조회는 같은 값의 읽기 전용 투영이다. 필수 SQL 참조와 사용자 소속·구조/정책 예외는 별도 계약을 유지한다.
    dbms_context_contract: REQ-603.dbms_context. 종류는 YAML URL 도출값, 버전은 수동 보완, 파서는 서버 지원 정책으로 결정한다. REQ-603.dw_sync_note의 DW 동기화 방식은 선택 참고 메모이며 현재 기술 유효성과 구분한다.
    usecases:
      - UC-001
      - UC-002
      - UC-006
      - UC-016
    module: admin
    screen: SCR-002
    roadmap: RM-P1
    title: 데이터소스 관리
    design_status: approved
    implementation: implemented
    delivery_boundary:
      producer: SLICE-002는 YAML 안정 키/별칭/URL 도출 DBMS·기동 판정/경고, 수동 메타·그룹·가이드 전체 원자 저장/동형 이력, 명령 복구·확정 누락 정리와 공개 생산 포트를 구현한다.
      dependency: SLICE-001/006/040/302의 완료 계약을 재사용한다. 카탈로그는 이 데이터소스의 후속 소비자이며 이번 구현의 선행 조건이 아니다.
      followup: FEAT-003/JOB-003의 실제 구조 관측·비교, FEAT-033의 SCR-041 독립 이력/반출, agent/integration의 현재 객체 권한·파서/버전 검증·실제 SQL/턴 근거 연결은 각 소유 기능에서 검증한다. 미설치/실패를 빈 정상 또는 SQL 허용으로 바꾸지 않는다.
      source_contract: sources/backend/core/src/main/java/com/aiagent/core/deployment/DataSourceMetadata.java

    entities:
      - ENT-002
      - ENT-004
      - ENT-018
      - ENT-019
      - ENT-045
      - ENT-096
      - ENT-097
      - ENT-098
      - ENT-094
      - ENT-095
      - ENT-168
      - ENT-169
      - ENT-170
    apis:
      - API-010
      - API-011
      - API-012
      - API-013
      - API-014
      - API-018
      - API-062
      - API-072
      - API-075
      - API-076
    trigger: 서버 기동 시 외부 YAML 정의 동기화 또는 관리자가 기존 데이터소스의 수동 업무 메타·그룹·가이드를 보완할 때
    operation_boundary: 각 원 소유 전체 구성은 현재 변경 권한·기대 버전·기술 참조 검증으로 직접 저장하고 현재값/전체 이력을 원자 반영한다. 별도 관리자 요청/승인·전결·지식 영향 검토 작업은 없다. 소유별 기술 계약/쿼터 효력 경계는 유지한다.
    inputs:
      - 현재 YAML registry의 안정 키/별칭·DBMS/상태 및 수동 메타·그룹·가이드 전체 구성
      - 기존 id/expectedVersion/commandKey/reason과 기존 메타·전체 그룹/가이드 변경. 기술 YAML 값/임의 신규/삭제/연결 교체 입력 거부
    outputs:
      - 현재값·안전한 상태·원인 배지·권한 있는 사용 카탈로그/불일치
      - ENT-004·045·097의 같은 HISTORY_NO 전체 이력. 가이드의 현재 적용 리비전과 보호된 턴 조회 근거는 구분
    processing:
      sync: 전체 YAML 구조/안정 키/중복·지원 연결 형식을 먼저 검증한다. 성공한 설정 세대에서만 메타 추가/갱신과 REQ-601.configuration_diagnosis의 ENT-098 판정 묶음을 원자 확정한다. 전체 로드 실패를 전건 삭제로 처리하지 않으며 확인 필요로 알린다. 동일 내용 재기동은 버전/이력을 반복 생성하지 않는다.
      change: DBMS 버전·DB/DW 유형·DW 동기화 방식 메모·시간대·업무 설명·데이터 기준 시각·그룹 집합·데이터 조회 가이드는 DB에서 수동 관리한다. 동기화가 보완값/최초 등록 감사를 덮지 않는다. 별칭 변경에도 안정 내부 ID와 카탈로그·신원 참조를 유지한다.
      save: 기존 데이터소스 전체 메타·그룹·가이드를 같은 기준 리비전/권한/참조 검증으로 직접 원자 저장한다.
      group_change: 그룹 집합은 하위 매핑 어휘다. 사용 중인 하위 그룹 매핑이 남은 축소는 거부한다.
      read: YAML에서 제거된 데이터소스는 DB·하위 카탈로그·그룹·가이드·신원·이력을 보존한다. 서버 설정 불일치는 일치/불일치/확인 필요 읽기 전용 배지다. 과거 주소·다른 데이터소스로 대체하지 않으며 저장된 agent/워크플로우 정의의 신규·예약·수동·재시도·재개 업무 호출 전에 현재 유효성을 검사한다. 관리자 경고·정확 ID별 영향 목록으로 연결한다.
    public_contract_needs:
      - 'integration: app.external-datasources의 정확 키/기동 세대/DBMS 종류 readonly 판별·존재 진단'
      - 'access_policy: 하위 매핑 어휘와 실제 데이터/행/신원 접근의 현재 검증'
      - 'agent: 선택 카탈로그의 DS별 가이드 조회·실제 코드/참조값 선행 조회·턴 근거'
    failure_contract:
      - YAML 전체 검증 실패·정확 정의 누락·지원 DBMS/파서 미확인은 현재 오류로 알리고 업무 조회를 차단한다. 진단·이력 조회와 권한/기준본 검증 가능한 보완 저장을 일괄 차단하지 않는다.
      - 필수 현재 검증이 불가능한 수동 변경은 전체 저장을 거부하고 입력 보존. 이름/다른 연결 자동 대체 없음.
    permissions: REQ-603.permissions와 AUTHZ-090을 적용한다. 데이터소스 적용 가능 그룹과 실제 사용자 신원·객체/행 권한 판정을 구분한다
    rules_from:
      - REQ-603
      - REQ-601.business_rules
      - ARCH-030
      - AUTHZ-010
      - AUTHZ-090
    pending:
      - '@defer FEAT-003/033/agent — delivery_boundary.followup의 실제 소비·비교·이력 화면 검증.'
    detail: REQ-603의 데이터소스 연결 참조·업무 메타데이터·상태를 관리한다. 연결 원천·비밀정보 제외·반영 시점·실행 차단과 동일 연결의 다중 DB/카탈로그·스키마와 객체 식별/권한 경계는 해당 카드가 정본이다. 단일 DB 스키마 필수 선택이나 별도 스키마 권한 관리 기능을 추가하지 않는다
    reqs:
      - REQ-103
      - REQ-601
      - REQ-603
    traces_to:
      - ARCH-030
    history_pattern: REQ-601.change_history·ADR-035. 소유 관리 테이블의 _HIST 복사·HIST_ID PK·공통 HISTORY_NO와 마스터의 HIST_DTM을 적용하고 별도 이력 메뉴가 원 관리 화면을 상속한다. 현재 등록/수정과 이력 조회를 같은 탭/모달로 혼합하지 않는다.
    screens:
      - SCR-002
