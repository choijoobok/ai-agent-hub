    title: "쿼터 등급 승급 요청 승인"
    detail: "portal에서 접수된 승급 요청(사용자당 처리 대기 1건, 월을 넘겨도 유지)의 희망 등급·사유를 조회하고, 적용 월(대상 월 시작 전 승인된 변경은 첫 예정 생성 여부와 무관하게 해당 미래 월)을 확인해 승인 또는 반려한다. 처리 사유와 처리자·시각을 남기며, 유효 등급에 따른 다음 적용 월의 개인 기본 토큰 한도를 함께 확인한다"
    hard_rule: "이번 달 사용량 부족은 등급 승급으로 처리하지 않고 FEAT-018의 추가 토큰 사용 승인으로 처리한다"
    reqs:
