        purpose: 현재 로드 연결/불변 적용 근거·주소 조립·호출 제한 지원·보호 신원 전달
        boundary: 임의 주소/인증값/헤더로 목적지를 바꾸지 않고 검증한 연결과 실제 전송 대상을 일치시킨다
        refs:
