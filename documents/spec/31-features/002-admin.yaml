    physical_contract: 40-domain/007·010 및 50-api/007·008의 물리/관리·모듈 계약 초안을 따른다. 그룹/세트/실행의 소유 pending과 G3 승인은 별도다
    pending:
      - '@defer P3 integration_assets — 물리/관리 API 초안과 대조하여 입력/응답/가이드/이력 화면 요건·목업·시퀀스·예외/경합 시험을 정한다. 정책/원천/세트 연결은 물리 계약 pending을 따른다'
      - '@defer P3 integration_assets·agent/integration·access_policy — 경로/보호 헤더·실제 승인 대상/인자 고정·호출 제한/점유·코드 조회 상한/캐시/실패·반출 속성·응답 처리 후보/현재 정책의 계약과 시험을 연결한다'
    metadata_validation: REQ-608.field_metadata에 따라 요청·응답 양쪽의 구조·의미/형식·필수/NULL·코드 참조를 검수하고 REQ-111.privacy_metadata를 같은 명세 원천에서 관리한다. 코드명 제공 방법·명시적 원천/조건 매핑·실패 처리의 관리와 검수는 REQ-608.field_value_mapping을 참조한다. 그룹 매핑·지식에 속성을 복제하지 않으며 구체 입력 항목·저장·화면 배치는 P3에서 정한다 JSON 샘플은 초안만 만들며 미확인/타입 충돌을 운영 사용으로 확정하지 않는다. PATH는 이름 대신 변수 순서와 템플릿 자리의 일대일 대응을 검증한다.
    detail: REQ-608의 API 전체 계약·입출력/필드 속성·코드명·공통 가이드·그룹·연결·공동 오픈 근거를 현재 권한·기대 버전·기술 참조 검증으로 직접 저장한다. 지식은 안정 API ID와 매핑별 업무 사용 설명만 소유하며 실제 실행 사용자 승인은 별도 유지한다.
    identity_contract: REQ-609.identity_verification. API의 신원 필요 컬럼/스위치는 제거하고 선택 연결의 검수된 신원 계약을 참조한다. 운영자/모델 입력으로 신원 검사를 해제하지 못하며 난수 토큰 발급·소비는 FEAT-205의 실행 처리다.
    reqs:
      - REQ-105
      - REQ-111
      - REQ-113
      - REQ-608
      - REQ-609
      - REQ-612
    screens: []
    direct_management: REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다.
    management_boundary: REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다.
    asset_availability: 'REQ-601.asset_availability: useYn은 현재 자산 전체 직접 저장·이력에 포함하는 수동 Boolean이다. 유효 적용본/필수 참조에 따른 사용 가능 여부 및 사유와 구분하며 현재 사용자 권한/신원은 호출 때 별도 검사한다. OFF/무효/미확인은 신규 후보·직접 호출·저장된 워크플로우 실행/재시도/재개에 반영한다. 관측/복구가 수동 값을 덮어쓰지 않는다.'
    connection_selection: 'REQ-604·608: 제공 시스템 다음 현재 유효한 명시 연결 ID를 필수 선택한다. 기본 연결은 없으며 시스템 변경은 재선택한다. 목록은 현재 적용본의 선택 연결이 참조하는 ENT-098 저장 판정으로 서버 설정 불일치/안전한 사유·경고 연결을 반환한다. 시스템 전체 집계나 API별 진단 사본을 사용하지 않는다.'
