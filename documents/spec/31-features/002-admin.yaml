  - id: FEAT-035
    module: "admin"
    uses_features:
      - "FEAT-014"
    usecases:
      - "UC-036"
    screen: SCR-033
    roadmap: "RM-P1"
    title: "오류·품질 조사 관리"
    protection_operations: "현재 조사 보호 액션 권한으로 필요한 범위의 보호를 설정·변경·해제하고 담당자·사유·원래 만료 시각과 이력을 남긴다. 장기 미완료 보호를 담당자·기간·사유로 조회·재검토하며 연결 취소/재연결 때 실제 필요 범위를 다시 판단한다. 일반 열람 연장이나 이미 파기된 자료의 복원을 허용하지 않는다(REQ-107.retention_policy)"
    source_contracts: "채팅 오류 원본의 접수는 FEAT-041, 실행 감사 원본은 FEAT-210, 자료의 정기 파기는 FEAT-222가 소유한다. 보호 상태의 생산/소비 공개 계약과 경합을 함께 설계하며 조사 담당자 배정만으로 증거 열람권을 부여하지 않는다"
    links: "발생 원본/당시 실행 근거를 조사에 연결하고 진단된 조치는 해당 현재 권한자의 원 관리 기능 직접 저장·이력과 연결한다. 별도 의미 영향 검토 큐나 승인 요청을 필수 경유하지 않는다."
    detail: "채팅 오류 발생·품질 신고·저장 조회 실행 실패·추적 감사 검토 근거를 원본별로 조회하고, 담당자가 관련 근거를 조사에 연결·배정해 분석·조치·검증한다. 원문/증거의 조사 보호 범위·담당자·원래 만료 시각·보호/해제 근거도 REQ-107·115에 따라 확인한다. 사후 연결·연결 취소·재연결·이력 조회·재발·알림·완료 규칙은 REQ-115, 신고별 회신은 REQ-110을 따른다"
    hard_rule: "원본 이력은 보존하고 동일 원인을 코드·메시지로 자동 묶지 않는다. system 오류 이력은 참조하지 않으며 내부 증거는 유효 권한으로 보호한다. 조사 완료는 저장 조회의 활성 복귀나 신고의 자동 종결을 뜻하지 않는다(REQ-115)"
    reqs:
      - "REQ-115"
      - "REQ-304"
