    operation_boundary: UC-019의 등록 업무 도구와 전체 후보·노출 구성을 소유한다. 실제 구현/배포·호출은 agent, API 공통 계약은 FEAT-004, 업무별 도구 연결·사용 설명은 지식이 소유한다
    inputs:
      - 검증된 구현 식별자·계약 버전·배포 근거와 자동 분석 입출력 계약
      - 도구 사용 가이드·필드 설명/값 확보·의미 매핑·결과 판정·그룹·응답 마스킹 예외·사용 설정·메모
      - 현재 도구 ID·기대 리비전·변경 사유·명령키와 전체 소유 구성
    outputs:
      - 안정 도구·전체 내용 판·원천 계약/가이드 참조와 연결 지식/매핑의 읽기 전용 역조회
      - FEAT-014·040에 인계할 고정 후보·영향/검수 근거와 관리 판정·실제 반영 결과. 저장/승인 성공을 호출 성공으로 표시하지 않는다
    processing:
      read: ENT-015와 ENT-016의 요청한 판을 조회하고 당시 원천 계약/검수 근거와 현재 효력을 구분한다. 지식 매핑은 원천 역조회이며 별도 편집 사본을 만들지 않는다
      create: 검증된 내부 빈을 선택하고 상단 서비스 빈 정보 리로드로 현재 입력/응답 명세를 확인한다. 차이 미리보기/명시 반영과 불일치 보존을 거쳐 보충 설정을 관리한다.
      validation: REQ-612.workspace의 7탭을 구현의 실제 계약·코드/결과 참조·응답 정책과 대조한다. 임의 메서드·미확정 구조·보호 문맥 덮기·금지 구현을 거부한다. 메모에 검수 근거를 남기되 별도 검수 승인 탭은 없다.
      guide: 도구 사용 가이드와 필드값 의미·입력 확보 설명을 소유 전체 구성에서 편집한다. 지식별 사용 설명은 지식 소유다.
      change: 전체 소유 구성·그룹/예외·가이드·중지/허용된 삭제를 현재 변경 권한·기대 버전·필수 참조/기술 계약으로 검증해 직접 저장한다. 현재값/전체 이력/원 명령 결과는 원자 확정하고 외부 공동 오픈·배포 검수·실제 실행 사용자 확인은 면제하지 않는다.
      consumption: 지식 직접 도구 연결·현재 사용/그룹·실행 노드 구현 계약·입력·신뢰 문맥·실행 승인을 확인한다. 외부 API는 REQ-608 실행 기술자로 분리되어 이 등록을 요구하지 않는다.
      references: 현재 권한 안에서 안정 ID·이름·적용 리비전·연결 경로·현재 참조 여부만 조회한다. 연결 지식 본문/설명 자동 수집·업무 의미 영향 판정/보완 작업은 없다. 유효 참조를 끊는 삭제/중지는 기술 참조 검증으로 차단한다.
    public_contract_needs:
      - owner: admin
        purpose: TOOL_ID 소유 7탭 전체 구성·그룹·HIST 및 지식 역조회
        boundary: 업무 API의 API_ID 자식 구조와 섞지 않으며 지식 매핑을 복제하지 않는다
        refs:
          - REQ-303
          - REQ-601
          - REQ-612
      - owner: agent
        purpose: 검증된 빈 목록·리플렉션 기반 입출력 계약·현재 관측·고정 진입점/실행 문맥
        boundary: 실제 실행 노드와 직렬화 계약에 맞춰 검증한다. 목록 조회는 이후 호출 예약이 아니다.
        refs:
          - REQ-105
          - REQ-114
          - REQ-612
    failure_contract:
      - 구현 없음·검수 무효·동적 미확정 구조·계약 불일치·권한 없음은 저장/후보/실행을 거부한다.
      - 현재값·전체 이력·명령 결과 일부 실패는 전체 롤백하며 결과 불명은 원 명령키로 확인한다.
      - 배포 계약 변경은 명시 대조/보완 전 사용을 차단한다. 사용 중지는 이후 호출에 적용하고 이미 발생한 효과는 취소하지 않는다.
      - 내부 실행의 시간 초과는 결과 불명일 수 있다. 자동 재전송/폴링이나 롤백 추정 없이 현재 권한 안의 결과 확인과 새 실행 승인 경계를 지킨다.
    permissions: REQ-612.permissions의 현재 관리 권한과 각 원천/연결 지식의 접근 권한을 검사한다. 이력의 과거 그룹이나 구현 검수 기록으로 현재 권한을 대신하지 않는다
    rules_from:
      - REQ-612
      - REQ-114
      - REQ-105
      - REQ-113
      - REQ-306.version_guard
      - REQ-601.management_storage
      - ARCH-028.asset_versions
    physical_contract: 40-domain/007·010 및 50-api/007·008의 물리/관리·모듈 계약 초안을 따른다. 그룹/세트/실행의 소유 pending과 G3 승인은 별도다
    pending:
      - '@defer agent/admin P3 — REQ-612.internal_invocation의 레지스트리·자동 구조/직렬화·신뢰 실행 문맥 및 7탭 소유 하위 구성/HIST 물리를 확정한다.'
      - '@defer P3 integration_assets·knowledge — 가이드 참조/편집·지식 역조회·혼합 세트·반영/폐지와 이력의 소유 연결 및 화면·목업·시험을 설계한다'
    detail: 검증된 Hub 내부 서비스 빈 전용 7탭 관리. 상단 서비스 빈 정보 리로드 후 입력/응답 구조를 명시 동기화하고 업무 가이드·코드 의미·결과 판정·그룹·응답 마스킹을 보완해 현재 권한으로 전체 직접 저장한다. 연결 지식은 역조회, 외부 API 기술자는 REQ-608·FEAT-203 소유다.
    reqs:
