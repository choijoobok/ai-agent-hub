features:
# ══ agent — 백엔드 (10.5) ════════════════════════════════════════
# 화면을 갖지 않는다. 상세 흐름은 documents/design/ 이 갖는다.
  - id: FEAT-201
    module: agent
    uses_features: [FEAT-041]
    error_handoff: "REQ-115의 채팅 처리 오류·증거를 FEAT-041의 admin 공개 접수 계약으로 인계한다. FEAT-210의 원 감사 생성은 agent가 유지하며 admin 원본을 직접 쓰지 않는다. 전달·수신/저장 실패·원천 증거 계약은 소유 후속 설계에서 확정한다"
    roadmap: RM-P1
    title: "질의 처리 오케스트레이션 (턴·스텝 관리)"
    plan_execution: "REQ-015의 계획 채택/변경을 REQ-004의 상태 기반 반복 수행에 연결한다. 계획/작업·현재 상태의 Hub DB 저장, 다음 작업 판정·실제 결과 갱신·대기/실패/종결은 해당 정본을 따르며 계획 작업과 실제 모델 스텝을 구분한다"
    detail: "REQ-038의 유형·후보 범위·실행 순서와 복합 작업의 부분 실패 처리를 적용한다. 최종 실패 시 독립 작업도 새로 시작하지 않고 처리 내역을 구분해 사용자에게 계속 여부를 확인하며 재요청·재승인은 기존 수명주기 규칙을 따른다 REQ-111.input_privacy_assessment에 따라 입력 패턴 검사와 기존 의도 파악 LLM 호출의 개인정보 의심 판단을 결합하고 입력 버전별 감사로 연결한다. 검사 전용 모델 호출은 추가하지 않는다."
    multi_source_orchestration: "REQ-021.multi_source_query의 데이터소스별 조회 의존 계획·현재 검증·결과 결합 인계를 담당한다. 확인·취소·최종 실패·부분 결과는 기존 턴 수명주기를 사용하며 새 상태나 전용 대기열을 만들지 않는다"
    reqs: [REQ-004, REQ-009, REQ-010, REQ-015, REQ-020, REQ-021, REQ-038, REQ-111]
    user_language: "RM-P4의 모델 호출별 사용자 소통 언어·언어 변경 경계·표현 재시도와 업무 실행 분리는 REQ-020을 따른다. 공통 요청/응답 연결은 REQ-009를 사용하며 현재 RM-P1의 필수 범위로 앞당기지 않는다"
  - id: FEAT-202
    code_value_context: "REQ-301.value_domain·FEAT-003.code_value_read_contract에 따라 실제 선택/최종 허용 CODE 컬럼을 수집하고 정확 조회 버전·typed 바인딩/현재 보안 문맥 튜플을 중복 제거해 한 번씩 조회한다. 코드값과 코드명/설명을 정확 컬럼에 연결해 프롬프트에 제공한다. 실시간 기본/명시 TTL 캐시의 시점·완전성/근거를 구분하고 실패/미확인/한도 초과를 코드 추정이나 무표시 절단으로 대체하지 않는다. 상태명 동의어가 여러 실제 코드와 모호하면 의도를 확인한다. SQL 예제만으로 코드 목록을 추정하지 않는다"
    datasource_sql_context: "REQ-603.dbms_context·ARCH-030에 따라 허용 테이블/컬럼을 소속 데이터소스별로 묶고 관리 DBMS 코드·버전·관리 버전 참조·선택 파서와 원천 타입/치수를 전달한다. 공통코드 표시 메시지를 SQL 타입 원문으로 사용하지 않는다. 필요한 문법·집계 함수 안내는 같은 실행 지원 계약을 참조하며 버전별 자료형 목록을 만들지 않는다. 비밀/접속 URL은 전달하지 않고 미확인/불일치 연결을 확인된 DBMS로 제시하지 않는다"
    module: agent
    roadmap: RM-P1
    title: "컨텍스트 구성과 총량 관리"
    relationship_context: "REQ-301.relationship_metadata.consumption_scope와 50-api FEAT-011.relation_read_contract를 따른다. 카탈로그 메타데이터 목록에 모든 관계 본문을 내장하지 않고 관련성·권한·컬럼 프루닝·상한을 반영해 이번 호출에 실제 조회/선택한 정확 catalogId/revisionId 집합으로 관계를 별도 조회한다. 양쪽이 모두 그 집합에 있고 현재 양쪽 객체/전체 쌍 컬럼 권한·검수/사용 가능 상태가 유효한 관계만 전달한다. 자기조인의 두 역할/방향과 전체 복합 쌍을 유지하며 필수 쌍 컬럼이 빠진 관계를 부분 전달하지 않는다. 범위 밖 중간 테이블 자동 추가·권한 확대·동명/다른 판 대체는 금지한다. 같은 계약을 FEAT-023의 예제 작성이 소비하며 관리용 getRelatedJoins 전체 역조회나 CatalogComposition을 LLM 입력으로 복사하지 않는다"
    catalog_union: "REQ-303의 지식 직접 카탈로그와 연결된 사용 가능 예제의 카탈로그를 중복 제거해 후보 범위로 합산한다. 매핑 복사 없이 승인된 참조 버전을 사용하며 예제의 필수 참조 일부를 제외한 불완전한 주입은 금지한다. 합산 뒤에도 기존 질의 관련성·컬럼 프루닝·상한을 적용한다"
    detail: "과거 턴 참조 · REQ-021의 허용 지식 검색 → 연결 카탈로그 합산·현재 권한 확인 → 필요한 객체/컬럼/관계 선별 → 소속 데이터소스별 실행 정보 전달 · 활성 반영 세트의 지식·인증 예제 주입 판정과 필수 참조 유지 · 값 도메인·의미 유형·권장 조인 경로 주입과 입력 예산 적용 · REQ-611의 기본 필터 명세를 허용된 카탈로그와 함께 제공 · 주입 지식의 안정 식별자·리비전·검토 필요 상태를 감사 이력에 전달하고, 하나라도 검토 필요이면 응답 계약에 경고 여부를 표시 업무 API·커스텀 도구 후보는 REQ-303·REQ-608·REQ-612의 지식 연결과 현재 권한·활성·검증 경계를 따른다. 유효 매핑의 용도·사용 조건을 도구와 함께 전달하고 설명의 지식·매핑 출처를 보존한다."
    conversation_context: "REQ-001의 서버 맥락 저장·제한된 요약 갱신·턴별 최종 조건/참조 탐색·과거 조건 변경 새 조회를 담당한다. 권한/동의/보존·버전 경합·실패 처리는 해당 정련 카드를 따르며 화면 복원과 실행 체크포인트의 책임을 구분한다"
    past_result_reference: "REQ-002에 따라 보존 결과의 버전/범위·완전성을 확인하고 지원 가능한 결정적 가공과 동의된 모델 가공을 구분한다. 비교 기준·원본/가공본 출처·실패/만료 처리는 해당 정련 카드를 따르며 새 원천 조회와 혼합하지 않는다"
    query_constraint_context: "REQ-611.query_constraints·REQ-021.selection_flow에 따라 적용 제약과 필요한 허용 컬럼/참조 버전을 컨텍스트에 유지하고 조건 확인·실행 검증으로 전달한다"
    current_execution_input: "REQ-004.execution_loop.model_input의 호출 목적별 최신 계획/상태·유효 입력/결과 참조를 구성한다. 대화 요약·전체 결과를 실행 상태로 대체하거나 모든 보조 호출에 전체 계획을 전송하지 않는다"
    reqs: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-021, REQ-301, REQ-303, REQ-306, REQ-611]
    traces_to: [AUTHZ-040]
  - id: FEAT-203
    module: agent
    roadmap: RM-P1
    title: "도구 레지스트리와 도구 호출 처리"
    detail: "등록 REST 업무 API와 **Hub 내부 서비스 빈 기반 커스텀 도구를 같은 레지스트리·권한·승인·감사 흐름으로 호출**한다. 커스텀 도구의 데이터 범위·마스킹은 도구 구현이 선언한 계약으로 별도 강제한다 업무 질의의 후보 범위는 REQ-303·REQ-608·REQ-612의 지식 연결을 기준으로 하며 후보 구성과 호출 시 현재 유효 조건을 확인한다. REQ-009.result_dialogue에 따라 허용된 결과와 적용 가이드/매핑으로 LLM이 안내·질문·후속 작업을 제안하게 하고 agent가 실제 호출을 검증한다. 사용자 선택은 REQ-005의 기존 대기에 연결하며 필수 확인·재전송 금지·새 실행 승인·자동 폴링 금지를 유지한다."
    reqs: [REQ-004, REQ-114, REQ-303, REQ-608, REQ-612]
    pending:
      - "@defer P3 agent — FEAT-021.registry_contract와 ENT-016의 implementationId/contractVersion/deploymentRef·검수/무효화 관측을 공개 레지스트리 계약으로 연결한다. API 도구는 현재 대응과 정확 원천 판·지식 연결·양쪽 현재 그룹/노출을 함께 검사한다. agent P3 레지스트리/호출 계약 검토와 admin G3 전에 교차 확인한다"

  - id: FEAT-204
    datasource_sql_validation: "REQ-603.dbms_context·REQ-301.source_type_catalog를 따른다. 모델 입력에 사용한 DBMS/버전과 실제 실행 연결의 차이·관리 변경을 확인하고 불일치이면 재확인 전 실행하지 않는다. 공통코드 선택/파서 통과는 해당 버전의 실제 타입·집계 함수 지원 보증이 아니며 기존 실행 오류 분류와 재작성 절차를 유지한다"
    module: agent
    roadmap: RM-P1
    title: "SQL 검증·정책 적용·실행"
    result_paging: "NFR-001~003에 따라 첫/후속 페이지마다 검증된 조회 범위·현재 권한/필수 조건·행/시간/크기 상한을 적용하고 N+1행 초과 감지와 안정적인 이어가기를 지원한다. 페이지별 변환이 있으면 최종 SQL/바인딩까지 검증하며 정렬/조회 기준을 유지할 수 없는 경우 이어가기 불가 사유를 반환한다. 사전 전체 COUNT·규모 추정을 기본 전제로 두지 않는다"
    detail: "파서로 구문 검증 · 선언된 데이터소스의 카탈로그와 참조 객체 대조 검증(테이블·컬럼 단위) · 대조 실패 및 DBMS가 확인한 구문 오류의 중립 피드백 반환과 재작성 · DBMS 종류·실행 단계·Spring 변환 예외·근본 SQL 오류 코드 기반 실패 분류 · REQ-611의 기본 필터 제외 명세 검증과 모든 행 스코프/남은 기본 필터 주입 · 참조별 적용 완전성·조회 의미·업무 조건 출처 검증 및 적용/제외 이력 · 원본 컬럼 추적. LLM 조회 도구 호출과 저장 조회의 복원 요청은 REQ-207의 같은 검증·정책 적용·실행 경로를 사용한다 REQ-007의 동기 DB 조회 중 취소 전달·실제 종료 근거 판정·호출 참조 경합 방지·후속 차단과 결과 보고를 제공한다."
    multi_source_execution: "REQ-021·ARCH-030에 따라 각 조회의 명시 데이터소스와 등록 객체를 검증하고 해당 연결에서 실행한다. 결과의 원천·범위·완전성·기준 시각을 결합 처리에 전달하며 여러 데이터소스를 단일 SQL로 실행하지 않는다"
    query_constraint_validation: "REQ-611.query_constraints의 최종 SQL·바인딩·참조별 충족 검증을 모든 공통 SQL 실행 경로에 적용한다. 실패를 REQ-025의 부족 조건/처리 불가로 연결하며 검증할 수 없는 조회는 실행하지 않는다"
    reqs: [REQ-007, REQ-021, REQ-025, REQ-037, REQ-103, REQ-207, REQ-301, REQ-611]
    traces_to: [AUTHZ-030, AUTHZ-050]
  - id: FEAT-205
    module: agent
    roadmap: RM-P1
    title: "업무 API 호출 (조회·실행)"
    detail: "**연속 실행의 순차 처리와 실패 시 중단·보고** · 타임아웃 재시도 가능으로 등록된 호출의 **최대 한 번 자동 재시도**와 `TIMEOUT_RETRYING` 시도 이력 기록 · 자동 재시도 소진 뒤 안전한 호출의 중단 전이와 수동 재시도 · 대상 실행 결과 불명 시 직접 재시도 차단과 등록된 결과 확인 · 결과 확인 API가 없거나 확인 실패면 대상 시스템 수동 확인 안내 · 결과가 처리 중이면 자동 폴링하지 않고 권장 재확인 시간을 안내 · 부분 실행 상태 판정 · **응답 수신 직후의 경로 분류와 마스킹 사본 분리** — 감사·재개 상태·로그로는 마스킹본만 내보내고 평문 사용은 허용된 사용자 응답·REQ-106의 요청/동의 모델 전송·승인된 업무 호출 경로로 한정한다 · 미지정 경로 경고 기록 · 실행 파라미터 원값의 전용 암호화 임시본·승인 버전 연결·호출 후 삭제는 REQ-005.execution_parameter_storage를 따른다 사용자 중단 시 전송 후 취소 불가·미전송 후속 중단·타임아웃 결과 불명/자동·무확인 재실행 금지와 결과 확인 안내는 REQ-007을 따른다. 멱등성 제공자 계약·기본 미보장은 REQ-105.idempotency_contract, 사용자 확인 후 새 승인으로 수행하는 원 실행 연결 후속 실행과 반복 경계는 REQ-105.manual_reexecution을 따른다."
    reqs: [REQ-005, REQ-007, REQ-026, REQ-105, REQ-111]
    nfrs: [NFR-022]
    pending:
      - "@defer P3 agent·integration — FEAT-004.field_contract/reference_contract/module_contract의 정적 경로·필수/null/형식·입력 출처/보호 주입·코드명/전체 대응·결과 상태를 실제 호출/응답 계약으로 대조한다. 원 실행과 응답/코드명 실패를 분리하고 URL/배포 연결·긴 호출 지원은 ARCH-028의 integration 계약과 함께 검증한다. 코드명 조회 상한/실패/권한·마스킹 계약 미완성이면 해당 조회는 비활성이다. agent P3 API 호출 계약 검토와 admin G3 전에 교차 확인한다"

  - id: FEAT-206
    module: agent
    roadmap: RM-P1
    title: "지식 검색"
