        gate_preparation: system G3의 승인 범위에 CR-028/033 인증·권한·배치와 변경 화면, CR-034의 새 알림 종류·역할 수신자·정확 인앱 결과·기존 AUTHZ 만료예고/알림함 회귀를 포함한다. 구현은 위 순서와 슬라이스별 G4를 따른다. G2의 DB/권한/인앱 아키텍처를 바꾸는 별도 저장소·화면·outbox는 추가하지 않는다.
        minimum_producer_contract: FEAT-210/211.minimal_producer·ENT-258~264·UC-050/051·SLICE-230이 호출/계량/불명복구와불변집계근거를소유한다. FEAT-305·ENT-257/265/266·ADR-047과system FEAT-509/CR-034·SLICE-521이최신성/통지/보존인계를소유한다. 역할코드·고객보존값은운영설정으로후속정의한다. ASM-003은 ADR-048 승인 기준의 설계 재현을 확인했다. 운영 API 미실행 수락은 ARCH-032.operational_usage_acceptance를 따른다.
