        gates: 각 소유 G3 동결 범위와 project.state.yaml의 승인 기록을 따른다. 공통 integration 계약 슬라이스의 G4 승인에 따라 기존 system 계약 영향 대조를 먼저 마치고 관리자 소비를 진행한다. 후속 구현은 슬라이스별 검증/확인을 따른다. SLICE-307의 실제 DB/HTTP·자격 생산자 대역 검증은 SLICE-520 실제 관리자 전환 또는 SLICE-301 실제 Portal 인증 완료가 아니다.
        integration_g2_evidence: ARCH-028.p2_operations·ARCH-032.p2_evidence/boot_design에 개발 CLI 실측과 제품 동등 부팅/키 교체·복구 근거를 반영했다. 승인 상태는 project.state.yaml이 관리한다. 운영 API 실증은 CON-033·034의 사용자 A에 따라 구독 확보 후이며 전체 설정/운영 도구·실제 배포 시험은 후속 소유 단계다.
        shared_contract_version: SLICE-307의 admin-auth-boundary/v1 JDBC 검증/G4는 완료 이력으로 보존한다. CR-035/036 A와 최대60초 복구 대기를 수용한 integration 영향 G3로 FEAT-301.session_store_v2를 동결했다. system 소비 영향 G3 승인→SLICE-308 공통 양 provider G4→SLICE-520/301/306 소비 순서다. 기존501/504 완료는 보존하고520 미완료 부분만 새 의존에 따라 재설계 대기로 둔다. 실제 Redis/제품 시험은 소유 구현에서 수행하며 승인 상태/일자는 project.state.yaml을 따른다.
        system_consumer_followup: FEAT-501.auth_precondition.frontend_consumption·TC-50115/50116으로 관리자 첫 사용 확인·암호 확정 후 재로그인·관리 참조를 검증한다. CR-037의 관리자 /admin 경로 통일과 구주소 호환 제거를 SLICE-520에 포함한다. ADMIN 부트/신호/wildcard가 ARCH-021의 Portal/디버그 진입을 가로채지 않게 하되 제품 Portal 요건/목업·소유 구현 승인을 대신하지 않는다.
