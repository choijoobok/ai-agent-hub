delivery_strategy:
  decision: ADR-006
  order: admin 세 영역 19화면·필수 공통 처리 → agent·비메뉴 오류 접수와 integration 계약 시험 → 나머지 admin 및 제품 Portal
  release_rule: RM-P1 제품 출시는 조회 전용으로 쪼개지 않는다. 등록 REST 업무 API의 명시적 사용자 승인 실행(REQ-026·105·111·113), 저장된 조회의 현재 권한 재판정 실행(REQ-201~207), 이번 달 추가 토큰 사용 신청·승인(REQ-119)이 함께 준비돼야 한다. 위 개발 순서는 내부 구현·검증 순서일 뿐 중간 조회 전용 제품을 고객에게 먼저 출시할 근거가 아니다. 커스텀 도구(REQ-114)는 RM-P1의 should 범위로 유지하며 첫 출시의 필수 조건으로 올리지 않는다
  workstream_rule: 기능의 `workstream:`이 있으면 그것이 소유하고, 없으면 `module:`과 같은 이름의 작업흐름이 소유한다
  staged_delivery:
    decided_at: '2026-11-09'
    decision: 사용자 명시 요청 — 세 영역을 먼저 구현하고 agent·계약 시험을 거친 뒤 나머지 admin과 제품 Portal을 구현한다. 개발 순서·승인 범위 조정이며 이번에 단계 게이트를 승인하지 않는다.
    scope_rule: '제품 모듈은 그대로 두고 기능의 workstream으로 승인 단위를 나눈다. admin은 선행, admin-operations는 후행 관리 화면, agent는 실행과 그 시점에 필요한 비메뉴 오류 접수, integration은 공통/공개 계약을 소유한다. 실제 진행 상태는 project.state.yaml만 관리한다. ADR-046: 공통 기반은 integration, FEAT-126/SCR-112와 응답 계약 시험은 integration-debug가 소유한다.'
    admin_first:
      workstream: admin
      menu_groups:
        - HUB_FOUNDATION
        - HUB_INTEGRATION
        - HUB_KNOWLEDGE
      screens:
        - SCR-015
        - SCR-062
        - SCR-016
        - SCR-064
        - SCR-021
        - SCR-006
        - SCR-005
        - SCR-001
        - SCR-002
        - SCR-003
        - SCR-039
        - SCR-004
        - SCR-019
        - SCR-010
        - SCR-011
        - SCR-012
        - SCR-009
        - SCR-013
        - SCR-014
      features:
        - FEAT-001
        - FEAT-002
        - FEAT-003
        - FEAT-004
        - FEAT-005
        - FEAT-006
        - FEAT-007
        - FEAT-008
        - FEAT-009
        - FEAT-010
        - FEAT-011
        - FEAT-012
        - FEAT-013
        - FEAT-014
        - FEAT-015
        - FEAT-016
        - FEAT-017
        - FEAT-020
        - FEAT-021
        - FEAT-023
        - FEAT-024
        - FEAT-040
        - FEAT-042
        - FEAT-045
      scope: 공통 기반 7·연동 관리 6·업무 지식 관리 6의 원 화면 19개와 기능에 필요한 비메뉴 처리. 세 영역의 화면 검토 결과를 입력으로 기술 상세를 완성한다. 전체 admin 화면 합의를 기다리지 않는다.
      detailed_contracts: 50-api의 FEAT-040 공통 저장/이력·19화면 행렬/모듈 인계, FEAT-005/006 권한/신원, FEAT-016/017/042/045 쿼터 계약과 40-domain의 ENT-099~112를 따른다. UC-006/042 시퀀스·JOB-004·TC-0401~0408/0451~04510은 계획 검증이다. 물리/API/HIST 상세 초안과 ADR-043~045·태그 정규화 결정은 반영했다. 소유 G3와 실제 구현/시험은 별도다.
      common_functions:
        - features:
            - FEAT-040
          refs:
            - REQ-601
            - ARCH-029
          contract: 직접 저장의 현재 권한·참조 보호·기대 버전·동시성·멱등 결과/불명 복구와 현재값·전체 변경 이력의 원자 확정. 이력 저장·불변성·보존/파기와 검증은 선행이며 후행 조회 화면에 미루지 않는다.
        - features:
            - FEAT-005
            - FEAT-006
            - FEAT-007
            - FEAT-008
            - FEAT-009
            - FEAT-012
          refs:
            - REQ-103
            - REQ-609
            - REQ-611
            - REQ-616
          contract: Portal 사용자·그룹·신원 매핑, 자산 접근과 컬럼/응답 마스킹, 행 스코프·기본 필터·조회 제약의 등록·현재 정책 제공. 서버의 실제 실행 검증은 agent/integration이 소유한다.
        - features:
            - FEAT-015
            - FEAT-016
            - FEAT-017
            - FEAT-042
            - FEAT-045
          refs:
            - REQ-116
            - REQ-118
            - REQ-602
            - REQ-606
            - REQ-613
          contract: 모델/용도·후보 순서, 월별 단가·등급·배정과 첫 달 확정/신규 사용자 개별 배정·월말 최종 배분 배치. 후행 통계 화면 없이 기준 배정이 성립하고 agent가 현재 배정을 조회할 수 있어야 한다.
        - features:
            - FEAT-001
            - FEAT-002
            - FEAT-003
            - FEAT-004
            - FEAT-011
            - FEAT-021
          refs:
            - REQ-301
            - REQ-304
            - REQ-603
            - REQ-604
            - REQ-608
            - REQ-612
            - JOB-003
          contract: 정확 배포 연결/객체 참조·카탈로그/관계·API/도구 계약·구조 수집/스케줄 비교·등록 검증과 구성 진단. 원천 업무 데이터의 실행이나 실모델 검토는 필요한 실행 소유 계약을 따르며 목업 응답으로 완료 처리하지 않는다.
        - features:
            - FEAT-010
            - FEAT-013
            - FEAT-014
            - FEAT-023
            - FEAT-024
          refs:
            - REQ-302
            - REQ-303
            - REQ-305
            - REQ-306
            - REQ-308
            - REQ-607
            - REQ-610
          contract: 지식·태그·예제 SQL별 참조·프롬프트/안내의 전체 저장·정확 판 제공과 임베딩 갱신/실패·낡은 작업 차단. 임베딩 및 관리자 모델 검토의 실호출은 integration/agent의 소유 승인 이후 검증한다.
        - features:
            - FEAT-020
          refs:
            - REQ-614
            - FEAT-506
            - SCR-515
          contract: 기존 system 환경설정의 등록/조회 경계를 재사용하고 실행 필수 설정의 자료형·허용 범위·초기값·적용 시점을 확정한다. 새 system 설정 저장소·변경 이력을 만들지 않는다.
    cross_module_dependencies:
      - owners:
          - system
          - integration
        refs:
          - FEAT-301
          - FEAT-501
          - FEAT-128
          - ARCH-050
          - REQ-616
        needed_by: admin 상세 설계 승인 전 수락 계약, Portal 주체로 실제 실행 시험 전 구현
        deliverable: 관리자/Portal 별도 계정·인증·세션, 안정 주체/권한 전달·계정 철회와 오류 경계. 제품 인증 화면은 FEAT-128/portal 후행으로 분리하고 시험 주체는 실제 서버 인증 계약으로 준비한다. 관리자 세션을 Portal 사용자로 대체하지 않는다. 기존 system 변경분은 system 소유 게이트에서 승인한다.
      - owners:
          - integration
        refs:
          - FEAT-302
          - ARCH-028
          - ARCH-030
          - REQ-403
        needed_by: admin의 연결/수집 슬라이스 구현·검증 전
        deliverable: 비밀 주입/복호화·기동 검증, 정확 연결 ID·노드/기동/적용 설정 관측·지원 DBMS·객체 식별·배포 변경 시 재검증 계약. 공개 계약 승인과 실제 동작 검증을 구분한다.
      - owners:
          - integration
          - agent
        refs:
          - FEAT-303
          - FEAT-304
          - FEAT-203
          - FEAT-205
          - FEAT-221
        needed_by: admin 소비 계약은 admin G3 전; 실제 외부/모델 호출은 각 소유 G3 이후
        deliverable: 권한 판정·모델/임베딩 호출·자산 등록 검증·카탈로그 수집의 입력/결과/오류·지원 능력 계약과 시험 대역. 대역을 이용한 admin 저장 시험과 실제 연동 완료를 따로 기록하며 필요한 실행 구현은 agent 착수 첫 슬라이스에 배치한다.
      - owners:
          - admin
          - agent
          - integration
        refs:
          - FEAT-017
          - FEAT-045
          - FEAT-211
          - REQ-116
          - REQ-118
        needed_by: 첫 실제 질의 접수·유료 호출 전
        deliverable: 당월 확정 배정/개별 배정, 사용량 원천·계량 미상·중복 반영 방지·쿼터 판정 계약. 추가 토큰/등급 승급 신청과 통계 UI는 후행이며 사용량 기록을 생략하지 않는다.
      - owners:
          - agent
          - integration-debug
        refs:
          - FEAT-126
          - FEAT-215
          - FEAT-216
          - REQ-005
          - REQ-009
          - REQ-013
          - REQ-016
          - REQ-026
          - REQ-032
          - REQ-040
          - SCR-112
        needed_by: agent 설계와 계약 시험의 첫 슬라이스
        deliverable: 질의 접수·상태/응답·사용자대기/확인·중단·재접속의 계약. 디버그 화면은 접수/상태/원문 표시 범위를 유지하고 나머지 동작은 계약 시험으로 검증한다. 제품 Portal 화면을 선행 완료 조건으로 두지 않는다.
    auth_boundary_preparation:
      rule: 영향 검토와 단계 승인은 별개다. ADR-046과 FEAT-301을 수락 계약으로 사용하며 상태·검증 근거는 project.state.yaml에서 관리한다.
      scope:
        - owner: system
          g2: CR-028/ADR-034의 관리자 인증/인가·진입 경계 재검증
          g3: FEAT-501/502/503의 관리자 전용 인증·세션·현재 권한과 회수 직렬화, FEAT-507/509/510의 관리자 참조 유지·공개 인계 영향. 기존 승인 근거를 유지하되 바뀐 계약/화면·회귀를 명시한다.
          excluded: Portal 계정 원장/제품 Portal 화면·새 system 설정 이력 저장소
        - owner: integration
          g2: 영역별 주체/세션·API 수락과 FEAT-301~305 공통 경계
          g3: FEAT-301~305 인증·설정/비밀·그룹 판정·모델/임베딩·외부 변경 사건 공개 계약/오류/호환성/시험과 공통 기반. portal 모듈의 FEAT-301 서버 인증 구현도 이 소유 G3에 포함한다.
          excluded: 다른 작업흐름이 소유한 기능의 내부 구현과 제품 Portal UX. portal 모듈에 두는 FEAT-301 서버 구현은 integration 승인 범위에 포함한다.
        - owner: admin
          g2: 별도 Portal 원장·관리 처리자/대상·현재 권한 수락의 영향 범위 재승인
          g3: admin_first.features 24개와 screens 19개, 연결 UC/ENT/API/TC, FEAT-040 저장/HIST·보존/멱등·FEAT-045 배치·Portal 계정/그룹·쿼터·인증 소비 계약. 공유 요구/UC는 선행 생산 부분을 명시한다.
          excluded: admin-operations의 신청/통계/이력 조회/감사/품질 화면, agent 실행/턴 물리 모델, 제품 Portal
        - owner: agent 및 integration-debug
          g2: 미승인 선행 요구/아키텍처 게이트를 소유 범위에서 해결
          g3: 질의·응답 요구 기반 실행/기록/오류 접수와 agent 생산 계약, integration-debug의 SCR-112 소비/호환성 시험을 각 소유 G3로 승인한다.
          excluded: 기존 감사/이력/품질 목업과 제품 Portal 화면 승인
      approval_order:
        - ADR-046 결정과 FEAT-301 수락 계약을 기준으로 system·integration·admin 영향 G2를 각각 재검증/승인받는다. 새 integration-debug도 자기 선행 게이트를 검증하며 한 턴에 여러 게이트를 통과시키지 않는다.
        - integration의 공통 계약과 system의 상세 설계·회귀/소비 계약·변경 화면은 각각 소유 G3로 동결한다. 승인 상태·동결 범위는 project.state.yaml의 각 작업흐름이 정본이다. 승인된 공통 조립부터 구현하고 admin과의 소비 계약을 맞춘다. admin G3가 이 소스들을 열지 않는다.
        - admin의 선행 19화면·24기능 전체 G3 결손을 보완하고 승인받는다. admin 문서 설계는 선행 구현 완료를 기다릴 필요가 없지만 실제 쓰기·인증·연동 시험은 해당 생산 구현과 함께 검증한다.
        - 승인된 소유별로 관리자 권한 보호/인증 기반 → Portal 원장/현재 접근과 저장/HIST → 쿼터/배치 → 연동·지식 화면의 슬라이스를 진행한다. 서로 다른 소유 기능을 하나의 슬라이스로 합치지 않는다.
        - agent 요구 기반 기록 설계와 소유 G3, 디버그 소유 G3를 거쳐 실제 질의/응답·회수·사용량·오류를 검증한다. 그 근거로 후행 admin 화면과 제품 Portal을 설계/승인한다.
      completion_boundary: admin 저장/조회·모듈 계약 대역 시험, 실제 인증/연동 시험, 전체 제품 완료를 구별한다. 모델/임베딩·연결 수집 등 실제 호출을 대역으로만 통과했다면 해당 기능의 실제 연동 검증은 미완료로 남긴다. SSO/LOCAL 개발·실검증 시점은 ADR-046에 따르며 최종 제품의 두 인증 경로 요구는 유지한다.
      before_admin_g3:
        - ARCH-050의 관리자/Portal 수락·회수 경합·처리자/대상 참조와 FEAT-040/005/006의 공개 포트 입력/결과/오류/실패 폐쇄를 연결한다.
        - FEAT-304의 호출 식별·감사/사용량 생산 포트와 FEAT-305의 Portal 변경 사건 중복/실패 계약은 디버그 분리 뒤에도 필요하다. 계약 설계는 admin/agent/integration이 병행하고 실제 호출은 소유 기록/계량 구현과 함께 검증한다. agent 전체 완료를 기다리거나 기록 대역으로 실제 유료 호출을 완료 처리하지 않는다.
        - G3의 정상/대안/예외 UC·핵심 시퀀스 3개 이상·화면/권한/검증·물리 키/제약/이력·API 오류·기능별 정상/예외 TC와 의존 순서 슬라이스 백로그를 범위 전체에서 점검한다.
        - NFR-001/010/011/013/014/023의 admin 설정/생산/소비 측정 시험과 agent 실행 시험 책임을 구분하여 TC를 연결한다. 다른 소유 구현 전의 설계 검증을 실제 실행 완료로 세지 않는다.
        - ENT-035는 ADR-042의 비저장 실행 기술자다. 게이트를 통과시키려고 불필요한 테이블을 만들지 말고 논리/비저장 계약과 물리 완성 검사 적용 여부를 정합화한다.
        - 승인 범위 ASM·pending_rechecks·strict trace 오류를 0으로 해소하고 별도 레드팀/결정 카드/역질문과 사용자 명시 승인으로 동결한다. 현재 상세 초안 존재만으로 승인 청구 가능하다고 하지 않는다.
      workstream_split_decision:
        decision: ADR-046
