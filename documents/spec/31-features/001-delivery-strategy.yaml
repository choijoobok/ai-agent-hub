        development_database: CR-039 사용자 방향에 따라 보존할 데이터가 없는 현재 미배포 개발 DB는 초기 기준선 재정리·전량 초기화 후 Liquibase 재구성으로 검수한다. FEAT-501.route_cutover.development_rebaseline이 범위/실행/재현/검증 정본이다. system G3에 초기SQL/생성CSV 정합과 product/local 빈DB 검증을 포함하고520에서 코드/시드 준비 후 적용한다. 기존 데이터 이관을 구현했다고 주장하지 않으며 보존 DB가 생기면 별도 changeset/복구 검증을 선행한다. 실제 대상 확인·삭제 실행 승인은 설계 승인과 구별한다.
        common_design_package: FEAT-301.admin_interface_v1과 50-api/017의 FEAT-302~305 공개 계약, UC-046~049, ENT-257/API-307 및 70-testcases/021을 함께 검토한다. 공통 v1 기술 검토 완료만으로 integration 전체 G3를 승인 처리하지 않는다.
        producer_order: system521 인앱 생산→integration305 외부 사건, agent230 최소 기록→integration304 실제 모델 호출이다. agent230도 agent 전체 소유 G3 뒤 구현하며 공통 계약 상세화가 부분 G3 승인은 아니다. 따라서 선행19화면 CRUD/대역 검수와 실제 모델 연동 완료를 구분하고 후자는 소유 생산 게이트/구현을 기다린다.
