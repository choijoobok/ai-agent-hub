delivery_strategy:
  decision: "ADR-006"
  order: "admin 기준 정보·지식·정책·실행 설정 → agent 핵심과 실행 계약 시험 → 제품 portal 상세 설계·구현"
  release_rule: "RM-P1 제품 출시는 조회 전용으로 쪼개지 않는다. 등록 REST 업무 API의 명시적 사용자 승인 실행(REQ-026·105·111·113), 저장된 조회의 현재 권한 재판정 실행(REQ-201~207), 이번 달 추가 토큰 사용 신청·승인(REQ-119)이 함께 준비돼야 한다. 위 개발 순서는 내부 구현·검증 순서일 뿐 중간 조회 전용 제품을 고객에게 먼저 출시할 근거가 아니다. 커스텀 도구(REQ-114)는 RM-P1의 should 범위로 유지하며 첫 출시의 필수 조건으로 올리지 않는다"
  workstream_rule: "기능의 `workstream:`이 있으면 그것이 소유하고, 없으면 `module:`과 같은 이름의 작업흐름이 소유한다"
  admin_design_review:
    scope: "현재 차수 admin 상세 명세·논리 모델의 공통 검토 입력이다. 아래 근거의 업무 규칙을 다시 정의하거나 공통 테이블·상태 기계·필수 속성·메뉴를 확정하지 않는다. 진행 상태와 재개 순서는 project.state.yaml의 design_plan이 관리한다. 2026-10-30 사용자 합의로 admin 전체 요건/목업·업무 흐름 합의 후 각 영역의 기술 상세 설계를 재개한다. system은 이번 작업에서 제외한다"
    application: "각 기능의 상세 명세에서 일곱 축의 적용 여부·소유 근거·입출력/실패 경로를 확인하고 필요한 개념·관계·식별·불변식을 논리 모델로 도출한다. 해당하지 않는 축은 이유를 명시한다. 공통 직접 저장/이력 처리 FEAT-040의 사용 여부와 아래 설계 검토 기준의 적용 여부를 구분한다"
    axes:
      identity:
        title: "주체·관리 원천"
        rules_from:
          - "ARCH-050.portal_account_contract"
          - "REQ-601.data"
          - "REQ-601.business_rules"
          - "REQ-609.business_rules"
          - "REQ-616.business_rules"
        owners:
          - "system"
          - "admin"
          - "integration"
        specify:
          - "처리자·관리 대상 이용자·자산의 안정 식별자를 구분하고, 각 속성을 어느 모듈/외부 원천이 쓰며 어느 공개 계약으로 읽거나 변경하는지 정의한다"
          - "system 관리자 계정/자체 인증과 admin이 관리하는 별도 Portal 계정·portal 인증/세션을 구분한다. Portal 외부/자체 모드의 편집 범위·등록 부분 실패/재요청·양방향 인증 거부를 확인한다"
        counterexample: "표시명·이메일·기본 ID 변환 패턴만으로 같은 주체 또는 직접 저장한 현재 유효 대상 매핑이라고 판단하거나, Portal 자격 비활성화를 관리자 계정 전체 비활성화로 처리하면 근거와 어긋난다"
      authorization:
        title: "현재 권한·열람 범위"
        rules_from:
          - "AUTHZ-090.rules"
          - "AUTHZ-001.rules"
          - "REQ-108.hard_rule"
          - "REQ-601.permissions"
          - "REQ-107.permissions"
        owners:
          - "system"
          - "admin"
          - "agent"
          - "integration"
        specify:
          - "메뉴·액션의 system 유효 권한과 대상별 업무 데이터/민감 상세 열람 조건을 별도로 명세한다. 업무 데이터 그룹 검사를 모든 admin 관리 액션의 추가 조건으로 일괄 적용하지 않는다"
          - "조회·변경·검토·승인·보호·회신의 실제 실행 시점과 API/공개 서비스에서 확인할 권한, 내부 화면의 호출 권한·입출력 범위를 연결한다. 역할명·프론트 버튼 상태를 판정 근거로 사용하지 않는다"
        counterexample: "내용 리비전이나 과거 허용 결과가 고정됐다는 이유로 회수된 현재 권한을 계속 허용하거나, 조회 권한으로 조사/복원 처리를 수행하면 실패해야 한다"
      change_path:
        title: "직접 저장·Portal 신청 승인·실제 효력"
        rules_from:
          - "REQ-601.direct_management"
          - "REQ-601.request_integrity"
          - "UC-002"
          - "UC-003"
          - "UC-004.domain_paths"
          - "UC-005"
          - "UC-006"
          - "ARCH-029.target_contract"
        owners:
          - "admin"
          - "system"
          - "integration"
        specify:
          - "admin 권한/자산/그룹은 현재 변경 권한·기대 버전·참조/기술 검증·전체 이력의 직접 저장으로 설계한다. 관리자 요청/기술 검토 완료/최종 승인·전결을 만들지 않는다."
          - "Portal 사용자 신청 승인·취소/재신청·미래 예약/부분 지급과 실제 실행의 사용자 확인은 각 소유 계약으로 설계한다. 변경 이력과 신청 원장/실행 근거는 혼합하지 않는다."
        counterexample: "조회자 저장 허용·과거 승인에 따른 현재값 변경·이력 실패의 부분 반영·Portal 신청자 전결 또는 미래 예약의 소급 적용은 실패다."
      version:
        title: "버전·동시 변경·재수신"
        rules_from:
          - "REQ-601.request_integrity"
          - "REQ-306.version_guard"
          - "REQ-607.business_rules"
          - "REQ-108.hard_rule"
          - "ARCH-029.target_contract"
        owners:
          - "admin"
          - "system"
          - "agent"
          - "integration"
        specify:
          - "대상 식별자·편집 기준본·불변 제출본·요청 상태 버전·유효 내용 리비전과 업무가 고정한 적용 설정값·판정 시각 묶음의 목적을 구분한다. 별도 설정 버전 관리를 추가하지 않으며 권한 내용 해시·캐시 갱신 버전을 실제 적용값 근거의 대용으로 쓰지 않는다"
          - "검증과 저장 사이 경합, 같은 전달의 재수신과 별도 변경, 결과 조회 실패와 실제 처리 불명을 구분한다. 원자성이 필요한 소유 범위와 분리 모듈의 공개 계약을 식별하고 잠금/조건부 갱신·복구 방식은 해당 물리 설계에서 검증한다"
        counterexample: "설정을 두 번 읽었다는 이유만으로 반영과의 원자성을 주장하거나, 통신 실패 후 새 요청으로 중복 지급/활성화하거나, 태그 영향 지식 목록/텍스트 변화만으로 자동 반려하면 실패해야 한다"
      references:
        title: "참조 보호·삭제·과거 재현"
        rules_from:
          - "REQ-601.business_rules"
          - "REQ-601.request_integrity.sets_and_references"
          - "REQ-306.version_guard"
          - "REQ-607.business_rules"
          - "UC-001"
        owners:
          - "admin"
          - "agent"
          - "integration"
        specify:
          - "실제 변경 대상과 조회만 하는 참조/영향 대상을 구분한다. 사용처의 현재 유효 참조·후보 참조·과거 이력별로 삭제/비활성화/연결 변경의 허용 조건과 실패 시 안내 범위를 도출한다"
          - "참조의 안정 식별·당시 버전·현재 상태와 삭제 후 과거 표시 방법을 정의한다. 소유 공개 조회가 실패하거나 일부만 보일 때 참조 없음으로 판단하지 않는다"
        counterexample: "참조/이력이 있다는 이유만으로 모든 삭제를 금지하거나, 영향 조회 자산까지 변경 대상으로 선점하거나, 과거 스냅샷을 현재 매핑으로 재구성하면 근거와 어긋난다"
      audit:
        title: "변경 이력·실행 감사·검토 기록"
        rules_from:
          - "REQ-601.audit"
          - "REQ-601.business_rules"
          - "REQ-107.history_storage"
          - "REQ-115.hard_rule"
          - "REQ-507"
          - "UC-002"
          - "UC-031"
          - "UC-036"
          - "UC-038"
        owners:
          - "admin"
          - "agent"
          - "system"
          - "integration"
        specify:
          - "admin 기준정보의 변경 전 스냅샷·현재값, 관리 요청의 제출/판정/반영 근거, agent 실행 감사, admin 오류 접수/조사, system 일반 사용 이력의 소유와 조회 연결을 구분한다"
          - "원본을 수정하지 않는 추가 검토·보정과 현재 상태 갱신을 구분하고 실제 처리자·대상·시각·사유·관계를 연결한다. admin 변경 이력 원자성을 기존 system 모든 서비스에 소급 적용하지 않으며 승인된 변경 목표는 소유 작업흐름에서 검증한다"
        counterexample: "이력 조회 실패를 변경 실패로 단정해 이미 일어난 외부 업무를 반복하거나, system 일반 사용 이력만으로 admin의 변경 전 전체 스냅샷 요구가 충족됐다고 판단하면 실패해야 한다"
      retention:
        title: "보존·보호·파기"
        rules_from:
          - "REQ-601.open"
          - "REQ-107.retention_policy"
          - "REQ-109.conversation_body_retention"
          - "REQ-109.business_rules"
          - "REQ-110.data"
          - "REQ-115.business_rules"
          - "REQ-204.business_rules"
        owners:
          - "admin"
          - "agent"
          - "system"
          - "integration"
        specify:
          - "기준정보 이력·감사 메타데이터·대화 본문·조회 결과·증거 사본·실행용 상태의 분류와 보존 원천을 구분한다. 기산/만료·일반 접근 차단·유효 보호·해제·물리 파기와 사본의 기한 승계를 소유 요구에 연결한다"
          - "조사 보호의 실제 필요 범위·담당·사유·다른 유효 보호와 파기 선후를 확인할 공개 계약을 정의한다. 고객사 정책으로 정할 관리 이력 기간은 REQ-601.open에서 후속하며 임의 공통 기간을 만들지 않는다"
        counterexample: "증거 사본으로 본문 기한을 우회하거나, 보호 해제일부터 보존 기간을 새로 부여하거나, 파기된 자료를 조사 재개로 복원하거나, 자료별 보존 조건 없이 일괄 삭제하거나 본문 파기로 별도 보존 중인 감사 메타데이터까지 삭제하면 실패해야 한다"
