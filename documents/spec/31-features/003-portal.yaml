features:
# ══ portal — 개인 사용자 (10.4) ══════════════════════════════════
  - id: FEAT-101
    module: portal
    uses_features: [FEAT-041]
    error_handoff: "REQ-115에 따라 portal 소유 채팅 처리 실패를 FEAT-041의 admin 공개 접수 계약으로 인계한다. agent가 이미 기록한 실패와 portal에서 별도로 발생한 실패를 대조하는 전달/식별 계약은 후속 상세 설계에서 정하며, 브라우저가 감사나 증거 원문을 임의 기록하는 경로로 확대하지 않는다"
    screen: SCR-101
    roadmap: RM-P1
    title: "채팅하기"
    detail: "멀티 세션 · 세션 제목 설정 · REQ-602의 Portal 선택이 켜진 유효 텍스트 생성 조합(공급사·모델·effort) 선택(**주 추론 역할에만 적용되고 실행 시도 시작에 고정되며 중단 후 새 시도에서는 변경할 수 있다 — ARCH-040**) · 모델 사용 불가 응답 뒤 선택 목록 복구는 REQ-602.model_selection_recovery 참조 · **레거시 딥링크 팝업 진입과 초기 문맥 파라미터 수신**"
    model_failure: "REQ-602.primary_availability_recovery의 주 추론 일시 장애 안내·유효 선택 유지·명시적 새 시도, auxiliary_fallback의 보조 대체 진행/소진 안내와 REQ-106.consent.auxiliary_candidates의 경로 안내·동의 확인을 제공한다. 보조 모델 선택기를 사용자에게 만들거나 후보 소진을 주 추론 재선택으로 해결하도록 안내하지 않는다"
    reqs: [REQ-001, REQ-002, REQ-020, REQ-040, REQ-116, REQ-602, REQ-106, REQ-041]
    nfrs: [NFR-028]
    user_language: "RM-P4에서 Portal 지정 언어의 소통·정형 문구·원값 구분, 언어 변경과 표현 실패 처리는 REQ-020을 따른다. 언어 선택의 저장·전달과 구체 화면은 해당 차수에서 설계하며 현재 RM-P1의 필수 범위로 앞당기지 않는다"
    past_result_reference: "REQ-002의 과거 결과 후보/범위 확인, 원 조회 시각·부분/마스킹 제한과 원본/가공 결과 구분·사용 불가/실패 안내를 표시한다. 구체 선택/동의 화면 계약은 P3에서 정하며 보존 결과 열람만으로 새 업무 실행이나 모델 호출을 만들지 않는다"
    traces_to: [ARCH-020, ARCH-040]
  - id: FEAT-102
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "진행 상황 표시 · 중단 · 처리 중 추가 입력"
    detail: "REQ-006에 따른 실제 처리 이력의 최신 유효 진행·업무 대상이 드러나는 누적 수행 내역 · 현재 작업 시간 카운트·턴 누적 처리 시간 · 상세 펼침/접기로 작업별 시간·시도 소계·접수 후 경과/대기 시간 확인 · **개인 한도로 순서 대기 중임과 자동 처리 예정 안내·취소 버튼 또는 카드** · REQ-040에 따라 재접속 시 같은 턴의 현재 상태·이력/시간·허용 결과·유효 조작 복원, 이전 미종결 턴 안내/이동과 카드 제출 시 현재 유효성 재검사 · **도구 호출이 타임아웃으로 재시도 중일 때의 순번(2/2), 자동 재시도 소진 뒤 수동 재시도 가능 여부와 최종 사유, 실행 결과가 처리 중일 때의 수동 재확인 안내**. 추가 입력의 종류·대상 확인·병행형/차단형 확인과 접수/반영 결과·현재 유효 조작은 REQ-007·032를 따른다. CLI/API 구현체에 따른 별도 사용자 절차를 요구하지 않는다. REQ-007에 따라 중단 버튼/카드·자연어 대상 연결, 접수/반영중/처리 결과와 호출별 취소 여부·전송 후 취소 불가·응답 시간 초과/실행 결과 확인 불가·재시도 불가·다음 행동을 agent의 표준 문구로 표시하고 복원한다."
    reqs: [REQ-006, REQ-007, REQ-032, REQ-036, REQ-040, REQ-041]
    nfrs: [NFR-022, NFR-028]
    token_display: "REQ-006.personal_usage에 따라 각 질의·응답의 사용 토큰을 수행 시간과 함께 표시하고, 처리 중 누적·추정/미상 계량·새 턴 재요청·늦은 사용량 정정을 구분한다"
  - id: FEAT-103
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "응답 렌더링 — 텍스트 · 그리드 · 차트"
    result_paging: "REQ-011·NFR-002·003에 따라 페이지 상한 초과 시 페이징 필요를 알리고 다음 페이지 요청 또는 페이징 지원 그리드 등으로 처리한다. portal이 표현/조작을 결정하고 agent의 페이지/이어가기·끝/실패/만료 계약을 사용한다. 부분 범위·미상 총 건수·현재 페이지 정렬과 전체 정렬을 구분하며 원 SQL 실행이나 전체 자동 수집으로 대체하지 않는다"
    detail: "REQ-011에 따라 목록은 그리드, 값·설명/브리핑은 텍스트, 요청 시 차트로 표시하고 필드 타입·단위·코드명·시스템 기본/사용자 숫자·날짜 형식을 적용한다. 컴포넌트별 변환은 REQ-027의 portal 어댑터가 담당한다. agent 계약이 포함한 검토 필요 경고 문구와 의미 블록을 그대로 표시한다. portal은 경고 문구를 자체 생성하지 않으며, 지식 식별자·리비전·공개 객체명은 표시하지 않는다"
    reqs: [REQ-011, REQ-012, REQ-027, REQ-039, REQ-304, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-104
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "엑셀 다운로드 · 차트 이미지 다운로드"
    detail: "REQ-011의 원천 반출 허용·현재 권한·엑셀 행 상한·선행 감사 기록을 확인한 뒤 그리드 엑셀/차트 이미지를 클라이언트에서 생성한다. 서버는 파일을 만들지 않는다. 후속 생성/개시·실패/취소·미확인 보고를 같은 내보내기 식별자로 연결하고 기존 사후 비동기 로그만으로 필수 감사를 대체하지 않는다"
    reqs: [REQ-011, REQ-041]
    nfrs: [NFR-028]
    traces_to: [NGOAL-10]
  - id: FEAT-105
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "추가 정보 입력 · 승인 요청 응답 · 의도 확인 응답"
    detail: "REQ-005의 대기 유형·대상 요청 연결·응답별 분기·개인 순서/재접속 표시와 모든 파라미터 실제 값 확인 후 최종 승인 조작을 제공한다. 추가 정보는 유효한 입력을 유지하고 부족·부적합 항목만 보완받으며 부분 입력으로 기한을 연장하지 않는다. **승인 요청 화면에는 예정된 액션 목록과 순서, 승인 대기 만료 시각과 남은 시간, 이 세션에서 이미 실행된 액션, 다른 세션의 최근 동일 API 실행을 함께 제시한다.** 실행 승인과 일반 입력/계획·의도 확인의 구분은 REQ-005·017, 거절 카드 무효화·원 턴 대기 유지·질문·새 카드·만료 후 새 턴은 REQ-017, 승인 대상·기한은 REQ-026을 따른다. 승인 카드의 실제 값은 REQ-005의 전용 암호화 임시본과 같은 버전이며 현재 권한·유효 기한 안에서만 제시한다."
    approval_presentation: "REQ-005.approval_presentation에 따라 입력창 위 승인 대기 고정 진입점·현재 승인 상세 패널·요청별 전체 값/기한·승인/거절/질문하기·구카드 무효 표시와 현재 요청 연결을 제공한다. 질문/보류와 거절·재승인·최초/승인 후 기한은 REQ-017·026을 따르고 REQ-014의 과거 응답 레이어는 읽기 전용으로 유지한다."
    reqs: [REQ-005, REQ-017, REQ-026, REQ-030, REQ-113, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-106
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "세션 질의 목록·응답 보기·새 턴 요청·즐겨찾기 등록"
    detail: "REQ-014의 세션 전체 사용자 질의 목록·접수 시각·현재 상태·중단 표식/사유와 두 버튼을 제공한다. 질의 항목 클릭으로 연결 응답을 모달/팝업 레이어에서만 열람하며 본문 원본 위치로 이동하지 않는다. 목록/레이어 조회로 본문 로드 구간·조회 경계·스크롤을 바꾸지 않으며 상태·권한/보존·조회 오류·닫은 뒤 위치 유지는 REQ-014.response_preview를 따른다. 모든 상태의 원 질의에서 새 턴으로 다시 요청하면 REQ-013의 별도 접수·현재 조건·새 계획/승인·실행 결과 확인 경계를 적용한다. 자주 쓰는 질의 등록은 REQ-201.favorite_eligibility의 기존 입력 분류·문맥 관계로 허용/불가/판정 전을 표시하고, 허용된 개인 즐겨찾기에 질의문만 저장하고 새 턴을 실행하지 않는다. 목록/조작은 별도 LLM 호출 없이 처리하고 본문 밖 질의·재접속·동일 접수 중복과 별도 명시 요청을 구분한다"
    reqs: [REQ-013, REQ-014, REQ-201, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-107
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "채팅 도움말·주의사항 조회"
    detail: "새 대화 화면에 agent가 제공한 'AI에게 무엇을 할 수 있는지 물어보세요'라는 짧은 고정 계약 문구를 모델 호출 없이 표시한다. 사용자가 기능·사용 방법·질의 예시를 물으면 활성 사용 안내 지식을 검색해 답하고, 현재 접근 가능한 업무 범주·데이터소스는 짧게 요약한다. 지식 검색 무결과에는 허용된 지식 태그만 안내하며, RM-P2의 SCR-107이 제공되면 상세 접근 가능 데이터·지식 태그 목록으로 안내한다 REQ-106.input_notice에 따라 요청 제출 전에 개인정보 직접 입력 주의와 LLM 전송 안내를 확인할 수 있게 한다."
    reqs: [REQ-101, REQ-106, REQ-308, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-108
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "조회 계획 확인과 자연어 교정"
    detail: "REQ-022·023에 따라 업무 용어 계획·필요 확인·자연어 교정과 실제 반영 결과를 표시한다. 규모 추정/미상을 기본 확인 사유로 사용하지 않고 같은 조회의 페이지 이동을 계획 재확인으로 처리하지 않는다"
    reqs: [REQ-022, REQ-023, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-109
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "결과 교정 재요청"
    detail: "성공한 턴의 결과가 의도와 다를 때, 이전 해석문·조회 계획을 근거로 재작성을 요구한다"
    reqs: [REQ-024, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-111
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "지난 대화 조회·검색"
    detail: "REQ-019의 최신 메시지 묶음·입력/출력 기록 순서·역방향 페이징·메시지 중복/누락 방지·질의/응답 페이지 분리와 양방향 관련 위치 이동을 따른다. REQ-040의 이전 미종결 안내/유효 조작 복원 및 REQ-006의 별도 처리 상세와 연결한다"
    reqs: [REQ-019, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-112
    module: portal
    screen: SCR-101
    roadmap: RM-P1
    title: "대화 이력 삭제"
    detail: "**논리 삭제만**. REQ-109.session_deletion에 따라 세션 내 모든 현재 턴/시도의 종결을 확인한 뒤 허용한다. 미종결 턴이 있으면 먼저 취소·중단하도록 안내하고 삭제하지 않는다"
    reqs: [REQ-109, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-113
    module: portal
    screen: SCR-110
    roadmap: RM-P1
    title: "개인화 프롬프트 관리"
    detail: "개인 기본 지시 · **정책과 충돌해 적용되지 않은 지시 표시**"
    reqs: [REQ-112, REQ-041]
    nfrs: [NFR-028]
  - id: FEAT-114
    module: portal
    screen: SCR-109
    roadmap: RM-P1
    title: "내 토큰·비용 사용량 및 잔여 한도·추가 질의 예상 횟수 확인"
    detail: "REQ-006.personal_usage에 따라 당월 개인 사용량·잔여 토큰과 추가 질의 예상 횟수를 표시한다. 채팅창의 별도 요약 영역과 내 사용량 화면에서 동일한 집계·표본·산식·예외 기준을 사용하고, 이번 달 승인된 추가 한도와 만료일을 확인한다"
    reqs: [REQ-006, REQ-041]
    nfrs: [NFR-010, NFR-011, NFR-012, NFR-028]
  - id: FEAT-115
    module: portal
    screen: SCR-109
    roadmap: RM-P1
    request_integrity: "REQ-601.request_integrity의 중복 요청 차단·제출본 고정·취소 후 재요청·오래된 승인 거부를 적용하며 해당 업무의 기존 승인/효력 규칙을 유지한다"
    title: "이번 달 초과 토큰 사용 신청"
    detail: "사유와 이번 달에 필요한 추가 토큰을 신청하고, 승인된 한도(부분 승인 포함)·월말 만료일·처리 결과(미처리 자동 만료 포함)를 조회하고 결과 알림을 받는다"
    reqs: [REQ-119, REQ-041]
    nfrs: [NFR-011, NFR-028]
  - id: FEAT-127
    module: portal
    screen: SCR-109
    roadmap: RM-P1
    request_integrity: "REQ-601.request_integrity의 중복 요청 차단·제출본 고정·취소 후 재요청·오래된 승인 거부를 적용하며 해당 업무의 기존 승인/효력 규칙을 유지한다"
    title: "쿼터 등급 승급 요청"
    detail: "현재 쿼터 등급과 다음 적용 월의 기본 토큰 한도를 확인하고, 희망 등급(현재보다 높은 등급만)과 사유를 제출한다. 처리 대기 요청은 1건만 둘 수 있다. 승인·반려 결과와 적용 예정 월을 조회한다"
