development:
  - id: CON-033
    title: "개발 기간에는 CLI Provider 를 쓴다"
    constraint: "엔터프라이즈 API 구독 비용 문제로 개발 중에는 CLI 를 사용한다. 토큰 집계·스트리밍·동시성 특성이 API 와 다르다"
    hard_rule: "추상화 인터페이스는 API Provider를 기준으로 설계한다. CLI가 지원하지 못하는 기능은 구현체에서 미지원으로 명시하며 인터페이스를 CLI 수준으로 낮추지 않는다. 질의 변경의 공통 사용자 동작은 REQ-007, 스트리밍/취소 지원 차이를 흡수하는 제어는 REQ-034를 따른다"
    risk: "운영 API의 실제 토큰 집계·스트리밍 취소·동시성은 CLI 시험으로 검증되지 않는다. API 구독 확보 직후 최우선으로 실환경 검증하며 검증 전에는 해당 기능을 완료로 보지 않는다. 사용자 진행 표시는 모델 청크가 아니라 REQ-006의 서버 기록을 근거로 한다"
    confirmation: "2026-11-10 사용자 A 재확인: 개발 CLI 검증을 진행하고 운영 API 실증은 구독 확보 후 수행한다. 미지원 기능을 API 기준 계약에서 삭제하거나 운영 검증 완료로 처리하지 않는다."
  - id: CON-034
    title: "토큰·비용 집계의 정본은 API Provider 다"
    constraint: "개발 환경의 사용량 수치는 정산 근거로 사용하지 않는다"
