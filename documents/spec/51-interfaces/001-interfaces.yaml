interfaces:
# ── 나가는 연동 (Hub → 외부) ──────────────────────────────────────
  - id: IF-001
    direction: outbound
    peer: ACT-006
    name: "업무 DB · DW 조회"
    protocol: "JDBC (읽기 전용 계정)"
    ownership: "**데이터의 주인은 업무 시스템이다.** Hub 는 읽기 전용 계정으로 읽기만 하고, 변경은 반드시 업무 API 를 통한다(IF-002). Hub 는 업무 데이터의 사본을 원천으로 삼지 않는다"
    detail: "데이터소스 단위로 접속한다. 접속 정보는 **yml 이 유일한 원천**이고 admin 은 매핑만 관리한다"
    hard_rules:
      - "**읽기 전용 계정을 쓴다.** 데이터 변경은 반드시 업무 API 를 통한다"
      - "**하나의 SQL 은 하나의 데이터소스 안에서만** 생성한다. 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"
      - "상한 강제는 **JDBC 수준**(최대 행 수·fetch size·쿼리 타임아웃)에서 적용하고 SQL 을 고쳐 쓰지 않는다"
      - "실행하는 SQL 에 **턴 ID 를 주석으로 주입한다** — DBA 가 슬로우 쿼리 로그에서 출처를 특정할 수 있게 한다"
    prerequisites: "읽기 전용 계정 · **메타데이터 조회 권한**(없으면 카탈로그 자동 수집 불가) · DBMS 별 리소스 한도 · 접속 허용 IP"
    traces_to: [CON-018, ARCH-030]
    reqs: [REQ-103]

  - id: IF-002
    direction: outbound
    peer: ACT-006
    name: "업무 API 호출 (조회·실행)"
    protocol: "HTTP/HTTPS 표준 REST · JSON"
    ownership: "**실행 결과의 주인도 업무 시스템이다.** Hub 는 호출자일 뿐 그 시스템의 상태를 자기 쪽에 복제하지 않는다. **우리가 갖는 것은 실행 사실과 파라미터의 감사 이력이다**(REQ-107)"
    detail: "대상 시스템 단위로 등록된 API 만 호출한다. **목록에 없는 호출은 불가능하다.** 최초 등록과 계약 변경은 고객사의 시스템 추가 기능 오픈 절차에서 양 시스템 개발팀이 개발·테스트·검수·운영 이관을 함께 완료한 뒤 Hub 관리자가 등록한다"
    auth: "REQ-604의 등록 연결 인증 방식과 REQ-608의 서버 신원 주입 계약을 따른다(ARCH-050). 인증 필요 시 시스템 단위 연동 계정을 사용하고, 명시 검수된 인증 없음도 허용한다. 사용자 개인 비밀번호를 저장하지 않으며 현재 사용자 권한·응답 통제는 인증 방식과 별도로 적용한다. 비밀값의 배포 설정·참조 보호는 REQ-403을 따른다"
    hard_rules:
      - "**SOAP · gRPC · 메시지 큐 · 소켓 · DB 프로시저 직접 호출 · 파일 인터페이스는 지원하지 않는다**"
      - "**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하지 않는다**"
      - "명세에 **타임아웃 · 재시도 정책 · 멱등성 여부**를 등록한다 — 앞의 둘은 실행 점유 유지 시간 산정에, 멱등성은 승인 화면의 주의 문구와 복구 판단에 쓴다"
      - "대상 시스템의 제한 응답(429 등)을 존중해 백오프·재시도하며 **자체 rate limit 을 약속하지 않는다**"
      - "**응답 경로 명세는 허용목록이며 미등록 경로는 닫힘이다**"
      - "고객사 변경관리의 릴리스 식별자·계약 버전·대상 시스템 책임자·테스트·검수 근거·변경 설명과 적용일을 연결하고, 양 시스템 오픈 절차가 완료된 계약만 활성화한다. Hub 내부 API는 REQ-608·601의 현재 변경 권한·기대 버전·기술 참조 검증·전체 이력으로 직접 저장한다. 외부 공동 오픈 검수·적용일과 실제 실행 사용자 확인은 유지한다"
    prerequisites: "REST 제공 여부와 명세 문서 · 등록할 인증 방식(인증 없음 포함) 및 필요한 시스템 연동 계정 · 계약별 신원 전달·검증 범위 · 호출 허용 대역 · 응답 개인정보 경로와 변경 통보 절차 · 복구·원복 절차"
    adapter_policy: "REST 를 제공하지 않는 기능은 **고객사가 어댑터를 제공하는 것을 연동 전제로 한다.** 어댑터가 확보되지 않은 기능은 연동 대상에서 제외한다"
    traces_to: [CON-003, CON-019, CON-020, ARCH-050, AUTHZ-070]
    reqs: [REQ-105, REQ-111, REQ-113]

  - id: IF-003
    direction: outbound
    peer: ACT-007
    name: "대화·추론 LLM 호출"
    protocol: "공급 경로 API (HTTPS · 스트리밍 수신)"
    ownership: "**보내는 것은 우리 데이터, 받는 것은 생성물이다.** 업무 자료 전송 대상은 사용자 요청·동의와 현재 접근·마스킹·상한을 거치고(REQ-103·106), 공급 경로에 남는 것은 그쪽 정책의 영역이다 — 통로를 하나로 묶는 이유가 그것이다(CON-013)"
    detail: "**agent 만 호출한다.** 공통 컴포넌트(FEAT-304)를 경유하며 모듈 코드는 공급 경로의 SDK 를 직접 참조하지 않는다. CLI·공급자 API 변환과 공통 메시지/작업 의미·검증·시험 범위는 REQ-009를 따른다"
    hard_rules:
      - "운영 모델 API는 REQ-034의 스트리밍 기준을 따른다. 개발 CLI의 대체 제어와 공통 사용자 변경 동작은 REQ-007·034, 진행 표시는 REQ-006의 서버 기록을 따른다. 스트리밍 지원만으로 실제 생성 취소·비용 절감을 보장하지 않는다"
      - "**호출 성공·실패와 무관하게 호출 내용·토큰·비용을 기록한다.** 기록 없이 성공한 호출이 있으면 안 된다"
      - "**REQ-106의 요청·동의 범위 밖 업무 자료를 보내지 않는다.** 현재 접근·마스킹·상한·필수 감사를 검사하며 종전 LLM 허용 플래그가 이 검사를 대체하지 않는다"
    path: "폐쇄망 → DMZ 아웃바운드 게이트웨이 → 외부망. **인바운드는 허용하지 않는다**"
    prerequisites: "목적지의 **도메인 기준** 아웃바운드 허용 · 프록시 경유 정보 · 약관상 학습·저장 미사용 보장과 공인 정보보호 인증"
    traces_to: [CON-013, PRN-01, ARCH-040]
    auxiliary_fallback: "REQ-602·ARCH-032에 따라 공통 호출은 후보별 실제 경로/모델/effort와 오류·접수/종료·계량 근거를 반환한다. agent의 명시 지시 없이 대체/재전송하지 않으며 모든 후보는 기존 외부 통신·동의·권한·감사 경계를 거친다"
    reqs: [REQ-007, REQ-009, REQ-034, REQ-106, REQ-107]

  - id: IF-004
    direction: outbound
    peer: ACT-007
    name: "임베딩 모델 호출"
    protocol: "공급 경로 API (HTTPS)"
    ownership: "**지식 본문과 질의 키워드가 나가고 벡터가 돌아온다.** 생성된 벡터의 주인은 우리이며 AI 전용 DB 에 둔다(CON-001 · ADR-005)"
    detail: "호출 주체는 둘이다 — **admin**(지식 본문 임베딩·전체 재임베딩) · **agent**(질의 키워드 임베딩). 같은 공통 컴포넌트를 경유한다"
    hard_rules:
      - "**두 경로는 반드시 같은 모델·같은 설정을 쓴다** — 서로 다른 모델로 만든 벡터를 비교하면 검색 결과가 무의미해진다"
      - "**임베딩 사용은 선택 기능이다.** 끄면 이 인터페이스 없이 태그 검색만으로 동작한다"
      - "비용 귀속이 다르다 — 지식 본문 임베딩은 **시스템 비용**, 질의 키워드 임베딩은 **해당 사용자 사용량**"
    option: "**폐쇄망 내부 배치 가능성을 열어 둔다** — 지식 본문이 외부로 나가는 것을 허용하지 않는 고객사에 필요하다"
    traces_to: [ARCH-060]
    nfrs: [NFR-015, NFR-021]

  - id: IF-005
    direction: outbound
    peer: ACT-009
    name: "알림 발송 (메일 등)"
    protocol: "고객사 환경에 따라 상이"
    ownership: "**발송 경로는 고객사 것이다.** 우리는 발송을 요청할 뿐 전달 보장과 발송 로그는 고객사 환경이 갖는다"
    detail: "자체 메일 전송 에이전트를 보유한 고객사가 있고, 메일 서버를 직접 구성해야 하는 고객사도 있다"
    prerequisites: "발송 경로 확정"
    traces_to: [CON-031]
    roadmap: RM-P3

# ── 들어오는 연동 (외부 → Hub) ────────────────────────────────────
  - id: IF-006
    direction: inbound
    peer: ACT-008
    name: "사용자 변경 이벤트 수신"
    protocol: "REST (폐쇄망 내부 호출)"
    ownership: "외부 인사/계정 원천과 검증된 연결이 있는 Portal 계정의 변경만 수신한다(ARCH-050). Portal 자체 계정과 system 관리자 계정의 원천을 이 인터페이스로 대체하지 않으며 system 관리자 계정에 자동 적용하지 않는다"
    detail: "퇴직은 연결된 Portal 계정의 이용 중지·세션/실행 검사 반영, 조직 이동은 Portal 일시 비활성화와 관리자 통보다. 같은 문자열 ID의 관리자 계정에는 전파하지 않는다"
    why: "**퇴직·조직 이동이 발생했는데 그룹 소속이 방치되면 권한이 누적된다**"
    hard_rules:
      - "처리 결과는 **정책 변경 이력에 남긴다**"
      - "**관리자가 인사팀 확인을 거쳐 그룹을 재부여한다** — 자동 재부여하지 않는다"
      - "**폐쇄망 내부 호출이다.** 외부에서 들어오는 인바운드는 허용하지 않는다"
    prerequisites: "이벤트 원천 시스템과 전달 방식"
    feature: FEAT-305
    traces_to: [CON-022]
    reqs: [REQ-103]

  - id: IF-007
    direction: inbound
    peer: ACT-006
    name: "레거시 딥링크 팝업 진입"
    protocol: "브라우저 URL (별 창 팝업)"
    detail: "Hub 는 **딥링크 규약과 팝업 호출 스니펫을 제공**한다. 파라미터로 진입 화면 식별자·사용자가 보고 있던 대상의 키 값·초기 질의문을 전달하며, 이 문맥은 첫 턴의 컨텍스트에 포함된다"
    hard_rules:
      - "인증도 권한도 우회하지 않는다. 팝업은 Portal의 선택된 SSO/대상 인증 또는 자체 계정 모드와 Portal 세션을 거치며 관리자 인증·세션이나 레거시 전달 사용자 ID로 대체하지 않는다. 키 값도 현재 Portal 그룹 판정을 통과해야 한다"
      - "**iframe 임베드는 지원하지 않는다** — 삽입 방식은 레거시 화면의 CSS·스크립트와 충돌하고 고객사별 대응이 무한히 늘어난다. 진입 수단은 별 창 팝업 하나로 고정한다"
      - "**진입 경로는 컨텍스트의 출처일 뿐 권한의 근거가 아니다**"
    ownership: "실제 링크·버튼의 설치는 **고객사 선택 사항**이다. 링크 삽입은 레거시의 스키마·기능 변경이 아니므로 PRN-09 에 저촉되지 않는다"
    prerequisites: "설치할 화면 목록 · 설치 담당 · 전달할 문맥 파라미터"
    feature: FEAT-101
    traces_to: [ARCH-020, CON-029]

  - id: IF-008
    direction: inbound
    peer: ACT-009
    name: "기술 운영 헬스·지표 노출"
    protocol: "**내부 HTTPS pull** · Prometheus/OpenMetrics 호환 형식 기본"
    ownership: "**애플리케이션 지표의 주인은 Hub 이고 수집·시계열 보관은 고객사 전사 표준 도구가 맡는다.** 고객사 도구가 없을 때만 Prometheus·Grafana 기본 구성을 선택 설치한다(CON-037)"
    detail: "Spring Boot Actuator·Micrometer로 JVM·프로세스·HTTP·커넥션 풀·구성요소 헬스를 노출한다. 호스트 네트워크와 업무 DB 슬로우 쿼리는 고객사 인프라·DB 도구의 영역이고, 비용·쿼터·품질 신고·턴 상태는 admin 제품 기능의 영역이다"
    security: "내부 관리망에서만 열고 인증·접근 허용 대역을 적용한다. **사용자 ID·턴 ID·질의문·업무 키를 라벨로 내보내지 않는다**"
    prerequisites: "고객사 표준 도구의 유무 · 수집 주체와 접근 허용 대역 · 노출 지표 범위 · 기본 구성 설치 여부"
    traces_to: [CON-027]
    status: decided

# ── 인터페이스가 아닌 것 ──────────────────────────────────────────
