llm_layer:
  id: ARCH-040
  abstraction:
    - "REQ-602.registry_contract의 표시명과 실제 호출 코드/미전송 여부를 구분한다. 용도 매핑은 등록 모델/effort의 안정 참조를 선택하며 실행 당시 등록 리비전·용도 설정 버전·실제 전송값을 고정 기록한다"
    - "공급 경로·모델·effort 는 설정 값이다. 도메인 코드는 추상화된 인터페이스만 사용한다"
    - "**임베딩 모델도 동일하게 추상화**한다. 대화·추론 모델과 임베딩 모델은 공급 경로·모델을 따로 설정할 수 있다"
    - "**임베딩 모델을 교체하면 기존 벡터를 재생성해야 하므로** 지식 전체 재임베딩 수단을 갖춘다"
    - "지식 본문 임베딩(admin)과 질의 키워드 임베딩(agent)은 **반드시 같은 모델·같은 설정**을 사용한다 — 서로 다른 모델로 만든 벡터를 비교하면 검색 결과가 무의미해진다"
    - "임베딩 모델은 **폐쇄망 내부 배치 가능성을 열어 둔다** — 지식 본문이 외부로 나가는 것을 허용하지 않는 고객사에 필요하다"
  role_based_model_selection:
    why: "모델·effort 를 모든 호출에 최상급으로 고정하면 비용이 불필요하게 커지고, 매 질의의 난이도를 판정해 고르게 하면 판정 호출이 또 늘어난다. 따라서 **선택의 단위는 질의의 난이도가 아니라 스텝 역할**로 고정한다"
    mapping:
      - role: "주 추론"
        steps: "계획 수립 · SQL 생성 · 최종 응답 작성 · 실패 원인 분석"
        model: "**REQ-602에 Portal 선택이 켜진 유효 텍스트 생성 조합 중 사용자가 선택한 공급사·모델·effort.** 선택하지 않으면 관리자가 정한 기본값"
      - role: "보조 판정"
        steps: "업무 연관성 판정 · 지식에 연결된 허용 카탈로그의 질의 관련 객체·컬럼 선별(REQ-021) · 질의 키워드 추출 · 과거 턴 요약 · 처리 중 입력의 의도 분류"
        model: "**관리자가 역할별로 지정한 공급 경로·모델·effort 후보 순서를 사용.** REQ-602.auxiliary_fallback에 한해 자동 대체하며 사용자 선택의 영향을 받지 않는다"
      - role: "시스템 운영"
        steps: "관리자 전사 공통 프롬프트 의미 검토"
        model: "REQ-602의 별도 시스템 운영용 공급 경로·모델·effort 설정"
    rules:
      - "시스템 운영 호출도 admin이 직접 대화·추론 LLM에 연결하지 않고 agent를 경유한다(ARCH-013). 검토 실패는 REQ-610의 검토 미완료로 처리한다"
      - "**역할 ↔ 모델 매핑은 admin 런타임 설정이다.** 역할별 모델을 코드에 박지 않는다"
      - "모든 사용자의 주 추론 선택지는 REQ-602.screen_contract.primary_selection의 Portal 선택이 켜진 유효 텍스트 생성 조합이다. 용도 미지정 및 보조/운영용 조합도 포함하고 동일 공급사·모델·effort는 한 선택지로 합친다. 그룹·쿼터 등급·system 역할로 제한하지 않는다. 보조 판정 역할은 사용자가 고르지 않는다"
      - "**주 추론의 공급 경로·모델·effort는 실행 시도 시작에 고정한다.** 같은 시도의 처리 중 입력 변경·유효한 사용자대기 응답·브라우저 재접속으로 바꾸지 않는다. 중단 후 원 질의의 명시적 새 턴 요청으로 새 실행 시도를 시작할 때는 현재 허용 집합 안에서 사용자 선택 또는 관리자 기본값을 다시 적용할 수 있다. 이전 시도의 결과·승인·체크포인트는 REQ-013에 따라 실행 입력으로 재사용하지 않는다"
      - "새 주 추론 시도의 선택은 Portal 선택 허용과 공급 경로의 활성 상태·등록된 모델/effort 지원 조합을 확인한다. 접근·마스킹·전송 정책도 REQ-108에 따라 새로 판정하며, 모델 변경을 이유로 보안 통제를 생략하지 않는다. 주 추론의 장애 시 자동 대체는 아니며 수동 전환은 REQ-602.primary_availability_recovery·NFR-020을 따른다"
      - "**자동 난이도 판정으로 모델을 고르지 않는다** — 판정 자체가 추가 LLM 호출이고 비결정적이어서 비용은 줄지 않는데 같은 질의가 매번 다른 모델로 처리될 수 있다"
      - "REQ-021의 소속 데이터소스 해석은 등록 카탈로그 참조를 따른다. 데이터소스 선택 전용 모델 호출을 선행 필수 단계로 두지 않으며 보조 선별이 필요한 원천·필수 관계를 누락시키거나 권한을 판정하게 하지 않는다. 데이터소스별 조회·결합 계획은 주 추론의 계획 수립과 서버 검증 경계 안에서 처리한다"
      - "**보조 판정 역할의 모델 호출이 실패하면 주 추론 모델로 자동 대체하지 않는다.** REQ-602.auxiliary_fallback의 명시된 일시 장애만 관리자 지정 후보로 순차 대체한다. 전환 불가 또는 후보 소진이면 REQ-001·007·039의 오류 유형·복구 가능성에 따른 처리와 종료 사유를 적용한다. 사용자 중단과 실행 실패를 같은 중단 상태로 일괄 기록하지 않는다"
      - "호출 기록에는 **실행 시도·스텝 역할과 그때 사용된 공급 경로·모델·effort를 함께 남긴다** — 모델이 바뀐 새 시도도 이전 시도와 구별해 판단 근거와 사용량을 추적한다"
      - "Portal 질의 사용량은 주 추론·보조 판정 역할과 무관하게 **질의를 발생시킨 사용자에게 귀속**한다. 보조 판정 호출도 그 사용자의 쿼터에서 차감한다"
      - "관리자 운영 호출 사용량은 REQ-116에 따라 관리자별로 집계하되 쿼터를 적용하지 않는다. 스텝 유형별 프롬프트 조합과 소스 통신 계약은 REQ-610을 따른다"
      - "**컨텍스트 조립 순서를 안정 접두부 → 가변부로 고정한다**(시스템 프롬프트·프롬프트 규칙·카탈로그·지식 → 과거 턴 요약 → 이번 질의). 공급 경로가 프롬프트 캐시를 제공하면 접두부가 적중 대상이 된다 — 캐시가 없는 공급 경로에서도 동작에는 영향이 없다"
    decision: "2026-10-01 사용자 승인 — 주 추론 모델 고정 단위를 턴 전체에서 실행 시도로 정리하고, 중단 후 새 시도에서는 모델 변경을 허용한다. 임베딩 모델 변경·재임베딩 규칙은 별개다. 2026-10-28 사용자 승인으로 보조 판정에만 REQ-602의 한정된 자동 대체를 추가했다. 시스템 운영·임베딩과 주 추론의 고정 규칙은 유지한다"

# ── 인증·계정 원천과 신원 매핑 ──────────────────────────────
