identity:
  id: ARCH-050
  decision: ADR-034
  account_source:
    - Portal 사용자·조직·권한의 원천은 **레거시 시스템의 SSO·계정 연동을 기본**으로 한다 — 사용자 정보를 이중 관리하지 않기 위함이다
    - Portal 연동 수단이 없는 고객사를 위해 **Portal 자체 계정 모드**를 병행 제공한다. 관리자 계정은 이 모드와 무관한 system 자체 계정이다
    - 어느 모드이든 사용자 그룹·그룹 매핑·쿼터 등급 같은 AI 시스템 고유 권한은 admin 에서 관리한다. **레거시 권한을 그대로 상속하지 않는다**
  trusted_subsystem:
    claim: '**레거시 호출은 trusted subsystem 모델을 따른다**'
    detail: API 인증은 REQ-604의 등록 연결 방식과 REQ-608의 신원 전달 계약을 따른다. 인증이 필요한 API에는 시스템 단위 연동 계정을 사용하며, 실사용자 신원은 REQ-609.identity_verification의 권장 난수 토큰 검증·소비 또는 검수된 대상 계약으로 제공한다. 난수 토큰 경로는 Hub 호출자 증명과 대상의 인증된 소비 API를 필수로 하며, 직접 식별자 주입으로 조용히 대체하지 않는다. 명시 등록·공동 검수된 인증 없음 연결도 허용하지만, Hub의 현재 그룹·권한·응답 개인정보 통제는 동일하게 집행한다. 인증 없음은 누락된 자격증명을 보완하는 폴백이 아니다
    forbidden: '**사용자 개인의 레거시 비밀번호를 Hub 가 저장·사용하는 방식은 금지한다** — 전 직원의 타 시스템 비밀번호를 한곳에 모으는 구조가 되기 때문이다. 서비스 계정 발급이 불가능하고 사용자별 인증만 지원하는 레거시 API 는 연동 대상에서 제외하거나 고객사가 어댑터·계정을 마련한다'
    risk: 연동 계정이 유출되면 신원 매개변수를 악용할 수 있으므로 자격증명·호출 대역을 보호한다. 인증 없는 연결은 대상 API가 제공하는 실제 신원 검증·접근 제한 범위를 공동 검수에서 확인하며, Hub의 신원 주입만으로 대상 시스템이 호출자를 인증했다고 간주하지 않는다
  recommended_identity_verification: ADR-041·REQ-609.identity_verification·IF-009·UC-044. Hub DB에는 해시/바인딩/상태만 보관하고 보호된 API에서 검증·일회 소비 후 대상 신원을 해석한다. 대상 DB 직접 접근·브라우저/모델 토큰 발급/노출은 금지하며 소비 성공이 대상 권한/업무 성공을 뜻하지 않는다. 기존 인증/매핑과 고객사 선택 경계를 유지한다.
  mapping_rules:
    - 매핑은 **시스템/데이터소스별 기본 규칙**(Portal 계정 ID 그대로, 또는 변환 패턴)을 두고 다른 사용자만 개별 오버라이드한다 — 대부분의 고객사는 사번이 통일되어 있어 전 조합의 수기 입력은 낭비다
    - '**SSO 모드여도 이 매핑은 필요하다** — SSO 는 Hub 로그인을 해결할 뿐, 각 시스템 내부의 사용자 키가 같다는 보장이 아니다'
    - '**행 스코프 조인의 바인딩 값도 같은 매핑을 쓴다**'
    - '**신원 매핑은 대상의 업무 사용자 연결이다.** 데이터소스·대상 시스템 아이디 신규/교체/중지는 REQ-609.identity_management의 승인 없는 직접 저장으로 처리하고 현재 권한·근거·기대 버전과 변경 전후 감사를 검증한다. 대량 등록/동기화도 같은 계약을 따른다(ADR-036).'
    - '**현재 유효한 활성 사용자-대상 매핑이 없으면 닫힌다.** 미설정/중지 아이디는 사용하지 않는다. 신원이 필요한 API 호출과 행 스코프 조회는 신원 설정 오류로 거부하고 NULL 바인딩/정상 0건으로 바꾸지 않는다.'
  change_events:
    claim: '**인사·조직 변경은 수신 인터페이스로 전파받는다**'
    why: 퇴직·조직 이동이 발생했는데 Hub 의 그룹 소속이 방치되면 **권한이 누적된다**
    handling: 검증된 외부 원천과 연결된 Portal 계정의 퇴직 → **Portal 비활성화** / 조직 이동 → **Portal 일시 비활성화 후 관리자 통보**. 관리자 계정·세션에는 자동 전파하지 않으며 관리자가 인사팀 확인을 거쳐 Portal 그룹을 재부여한다
  security_domains:
    decision: 'CR-028 사용자 명시 결정: CR-027의 공통 계정과 공통 인증 방향을 철회한다. 관리자와 Portal은 계정·로그인 인증·세션·현재 주체·권한 수락을 분리한다. 이름/이메일/로그인 ID가 같아도 다른 영역의 별도 계정이다'
    boundary: 관리자 계정·SSO 응답·세션을 Portal 인증으로, Portal 계정·SSO 응답·세션을 관리자 인증으로 수락하지 않는다. 각 영역의 인증 후 현재 권한과 대상 계정 상태를 다시 검사한다. 관리 콘솔은 관리자 인증만 허용하며 역할명 하드코딩 대신 현재 관리 메뉴/액션 권한을 적용한다
    lifecycle: 한쪽의 등록·비활성화·잠금·비밀번호 변경·세션 종료·삭제/보존 조치가 다른 영역 계정을 자동 생성·연결·동기화·삭제하지 않는다. system의 SYS_USER 물리 삭제 금지는 유지하며 Portal 삭제/익명화·보존은 별도 상세 설계다
    principal: 모듈 간 현재 주체는 인증 영역과 그 영역의 안정 계정 식별자를 함께 검증한다. 프론트가 보낸 사용자 ID로 인증을 대체하지 않는다. 관리자 변경 처리자와 변경 대상 Portal 이용자·레거시 신원은 서로 다른 참조다
    reuse: 암호 해시·검증·암호화·HTTP 등 도메인 비종속 기술은 재사용할 수 있으나 동일 계정 원장·세션·로그인 수락기를 공유하지 않는다. 단일 배포·SPA·공유 PostgreSQL 결정은 유지한다
    source_gap: 현재 제품은 SYS_USER 관리자 자체 인증과 공통 system 프론트 auth 상태를 사용한다. 독립 Portal 계정 원장·SSO/자체 인증·세션과 영역별 API 진입 경계는 미구현이다. 기존 소스를 새 방향 구현 완료로 표시하지 않는다
  admin_account_contract:
    reqs:
      - REQ-501
      - REQ-502
    ownership: system이 관리자 계정·자체 비밀번호·잠금·기간/IP·세션과 system/admin 관리 메뉴·액션 유효 권한을 소유한다. Portal SSO·대상 계정 인증을 관리자 인증에 적용하지 않는다
    management_views: SCR-501은 관리자 계정 자체 등록/관리이며 Portal 계정 목록에서 선택 등록하지 않는다. ITO 운영 조직도 해당 관리 권한을 부여받아 운영할 수 있다. 관리자로 등록돼도 Portal 계정은 생기지 않는다
    session: 관리자 세션과 관리자 인증 흐름만 관리 콘솔 및 관리 API에 수락한다. Portal 세션이 함께 존재하더라도 관리자 세션의 로그인·로그아웃·잠금·현재 권한 판정을 대체하지 않는다 비활성화 반영과 저장/회수의 선후는 ADR-046·FEAT-301.admin_authority_guard를 따른다.
    pending: '@defer P3 system/integration — 기존 관리자 API·세션·프론트 부팅·로그인 화면의 관리자 영역 한정, UI 상태/알림/이력의 SYS_USER 참조, 회귀/전환·롤백을 상세 설계한다'
  portal_account_contract:
    reqs:
      - REQ-616
      - REQ-609
      - REQ-041
    ownership: admin이 관리자 계정과 다른 Portal 계정 원장·자체 인증정보 관리·이용 상태·AI 그룹·쿼터·대상 신원 매핑을 소유한다. portal이 Portal 로그인·SSO/대상 시스템 인증 수락·현재 세션을 소유하며 admin의 공개 Portal 계정 계약을 소비한다. system 관리자 인증/계정 저장소를 참조해 Portal 계정을 등록하거나 로그인하지 않는다
    identity_link: Portal 내부의 안정 계정 키와 검증된 외부 원천/주체를 연결한다. 관리자 계정과의 공통 개인 키나 자동 연결은 두지 않는다. 이메일·표시명 일치로 외부 주체를 병합하지 않으며 외부와 자체 인증 모드의 전환은 별도 검증 계약을 따른다
    management_views: admin SCR-005에서 Portal 계정을 별도 등록·관리한다. 관리자는 관리자 세션과 해당 관리 메뉴/액션 권한으로 이 작업을 수행하며 대상 Portal 이용자로 로그인한 것으로 간주하지 않는다. 관리자 겸임자는 별도 Portal 계정을 발급받는다
    creation: 자체 모드는 Portal 원장에 등록하고 외부 모드는 검증된 SSO/대상 계정 신원을 연결한다. 미완료 등록을 활성화하거나 재요청으로 같은 Portal 계정을 중복 생성하지 않는다. 관리자 계정의 존재/상태는 Portal 등록의 선행 조건이 아니다
    local_mode: Portal 자체 비밀번호·초기화·잠금 해제는 admin Portal 계정 관리 공개 계약으로, 본인 로그인·비밀번호 변경·로그아웃은 portal 인증 계약으로 제공한다. system 관리자 계정 명령을 호출하지 않는다
    external_mode: SSO·대상 시스템 계정 인증 연동은 Portal에 한정한다. 외부 신원/기본 프로필은 원천 소유·읽기 전용이며 인증 성공과 Portal 이용 활성은 별개다. 사용자 개인의 레거시 비밀번호 저장·대리 사용 금지는 trusted_subsystem을 따른다. 실제 프로토콜과 비밀정보 비보관 수락 방식은 integration 상세 설계에서 정한다
    access: Portal 인증 주체와 현재 Portal 등록/활성·활성 그룹·쿼터·매핑 및 기능별 접근 조건을 확인한다. Portal 업무 API를 SYS_USER 관리자 메뉴 권한이나 전역 빈 권한 허용 설정으로 열지 않는다. agent·admin으로 전달하는 Portal 주체는 서버가 인증 영역과 본인 범위를 검증한다
    revocation: Portal 비활성화·퇴직·그룹/매핑 회수는 Portal 접근과 agent의 다음 접근/실행 검사에 반영한다. system 관리자 계정·세션·권한은 변경하지 않는다. 외부 인사 이벤트도 검증된 Portal 외부 연결에만 적용한다
    audit_and_ui_state: 관리자 처리자는 system 계정, Portal 요청자/대상은 Portal 계정으로 식별한다. system 로그·알림·개인 설정의 SYS_USER FK/이름 조인을 Portal ID에 재사용하지 않는다. 통합 조회/발송에는 인증 영역·소유 계정·당시 표시 근거를 구별하는 공개 계약이 필요하며 물리 구조는 후속이다
    pending: '@defer 소유 G3 — 선행 인증/권한 수락 상세는 FEAT-301, admin 원장/자격은 FEAT-005/006이다. Portal 세션/증거/인증 사건의 물리·조립·배포 상세는 FEAT-301·UC-045·ENT-252~256에 연결했다. 소유 G3 심사와 실제 구현/이행·롤백 실증, 고객 어댑터·portal SCR-113~115 제품 요건/목업은 남아 있다. LOCAL 선행 시험과 실SSO 후속 검증은 ADR-046을 따른다.'
  boundary_impact_review:
    status: ADR-046의 사용자 A 선택을 반영한 설계. 인증/권한 상세 정본은 FEAT-301이며 실제 소스와 소유 G2/G3 승인은 별도다.
    source_evidence:
      - area: 계정·인증 진입
        current: AppUserDetails는 SYS_USER 주체이며 SecurityFilterChain과 프런트 authStore는 단일 관리자 인증 흐름이다. Portal 원장 설계만으로 Portal 로그인·세션이 생기지 않는다. FEAT-301 서버 계약의 제품 모듈별 구현과 FEAT-128 제품 인증 UI를 구별한다.
        paths:
          - sources/backend/api/src/main/java/com/aiagent/api/auth/AppUserDetails.java
          - sources/backend/api/src/main/java/com/aiagent/api/config/SecurityConfig.java
          - sources/backend/modules/system/src/main/java/com/aiagent/system/api/auth/AuthController.java
          - sources/frontend/src/shared/stores/authStore.ts
          - sources/frontend/src/app/router/AppRouter.tsx
      - area: 인가 갱신
        current: 관리 API는 SYS_API/SYS_MENU_API와 유효 권한으로 판정한다. AuthzSession/Invalidator는 회수 후 재계산을 예약하지만 권한 변경 트랜잭션과 관리 저장 커밋의 직렬화 계약은 아직 없다.
        paths:
          - sources/backend/api/src/main/java/com/aiagent/api/authz/AuthzSession.java
          - sources/backend/api/src/main/java/com/aiagent/api/authz/AuthzInvalidator.java
          - sources/backend/modules/system/src/main/java/com/aiagent/system/api/role/RoleAuthController.java
      - area: 관리자 비활성화
        current: SYS_USER USE_YN 저장은 세션에 무효화 표식을 남기지 않아 즉시 차단을 보장하지 않는다. 재로그인 또는 dirty/날짜 경과로 권한을 재계산할 때 계정 상태를 재검사하며, 별도 강제 종료도 있다. 화면 U-48은 현행 재계산 경로와 CR-033의 목표를 구분해 정정했다. 목표 구현 전에는 현재 소스가 실제 동작의 근거다. Portal 회수 규칙을 현행 관리자에 자동 적용하지 않는다.
        paths:
          - sources/backend/domain/src/main/java/com/aiagent/domain/user/admin/UserService.java
          - documents/screen/admin/system/user/requirements.md
          - sources/backend/modules/system/src/main/java/com/aiagent/system/api/authz/AuthorizationInterceptor.java
        decision: 'ADR-046·CR-033: 다음 보호 요청부터 차단하도록 변경한다. 현행 소스와 목표 계약은 구별하며 적용 전까지 구현 완료로 표시하지 않는다.'
    acceptance_matrix:
      - surface: 19개 관리 화면·관리 저장/조회 API
        principal: ADMIN
        authority: system 현재 메뉴/액션 권한과 소유 API의 저장 영역·대상 검증. Portal 업무 데이터 그룹을 모든 관리자 행위의 추가 조건으로 일괄 적용하지 않는다.
        owners:
          - system
          - admin
          - integration
        refs:
          - AUTHZ-090
          - FEAT-040
      - surface: Portal 로그인·본인 비밀번호/세션
        principal: 검증된 LOCAL/EXTERNAL 증거 → PORTAL 안정 계정 키
        authority: 등록·인증 상태와 제한 세션/이용 가능 상태를 구별한다. 인증 성공을 그룹·쿼터·신원 검증 완료로 보지 않는다.
        owners:
          - admin
          - portal
          - integration
        refs:
          - REQ-616
          - FEAT-301
          - FEAT-128
      - surface: Portal 질의·상태/결과·업무 실행
        principal: 서버가 수락한 PORTAL 본인
        authority: 요청 및 실제 실행 경계에서 현재 이용 조건과 행위에 필요한 그룹·쿼터·대상 매핑을 검사한다. 관리 메뉴 권한·브라우저 userId로 대체하지 않는다.
        owners:
          - portal
          - agent
          - admin
          - integration
        refs:
          - AUTHZ-001
          - REQ-103
          - REQ-609
      - surface: SCR-112 내부 계약 시험
        principal: 전용 관리 화면/액션 권한을 가진 ADMIN과 별도 인증한 PORTAL 실행 주체
        authority: AUTHZ-090/ARCH-021의 숨김 관리 자원 권한과 별도 Portal 본인의 현재 데이터 권한을 모두 확인하고 ARCH-019의 보안 처리된 최종 계약 응답만 표시한다. 관리자 인증을 Portal 실행 주체로 바꾸는 시험 경로를 만들지 않는다.
        owners:
          - integration-debug
          - agent
        refs:
          - FEAT-126
          - SCR-112
        pending: '@defer SCR-112 소유 P3 — 두 주체의 서버 결합/감사 연결, 권한 자원/정확 API, 두 인증의 만료/회수 시험을 확정한다. 운영 원문 열람을 일반 시험 권한으로 확대하지 않는다.'
    handoff_requirements:
      - topic: 세션·API 경계
        owners:
          - system
          - integration
        before: admin G3의 수락 계약 / 실제 Portal 경계 시험 전 구현
        deliverable: 정확 API별 인증 영역·공개 허용 목록, 도메인이 있는 안정 주체, 영역별 세션 저장/쿠키·CSRF·프런트 저장 키·로그인/로그아웃·안전한 복귀와 제한 세션 계약. 단일 SPA/호스트에서도 다른 영역의 쿠키·인증 응답을 수락하지 않고 전역 public/common 허용으로 우회하지 않는다.
      - topic: 관리 권한 회수와 저장
        owners:
          - system
          - integration
          - admin
        before: admin G3 전 계약 / 첫 실제 관리 쓰기 전 구현
        deliverable: FEAT-040.locks.admin_authority의 동일 직렬화 경계에 역할·개인 예외·메뉴/API 연결 등 현재 권한을 바꾸는 모든 경로가 참여한다. 저장이 먼저 확정되면 유효, 회수가 먼저면 저장과 원 명령 결과 열람을 현재 권한으로 거부한다. 실패/장애는 낡은 세션 허용으로 폴백하지 않는다. 계정 비활성화는 ADR-046의 다음 보호 요청 차단을 적용한다. 상세 잠금/현재 검사 계약은 FEAT-301이다.
      - topic: Portal 계정 관리와 인증정보
        owners:
          - admin
          - integration
        before: admin G3 전 계약 / SCR-005 실제 인증 검증 전 구현
        deliverable: FEAT-005/006 접근 계약·ENT-101 이용자·ENT-114 자체 인증정보·ENT-131 외부 주체 물리 설계를 따른다. 공개 포트로 등록/활성·LOCAL 정책/잠금/비밀번호 변경·외부 원천+subject를 수락한다. admin은 원장 쓰기, portal은 인증/세션을 소유한다. 비밀/해시는 관리 HIST·로그·재생 응답에서 제외하고 초기화 1회 노출·재수신 규칙을 유지한다.
      - topic: Portal 회수와 진행 중 실행
        owners:
          - admin
          - integration
          - agent
        before: admin G3 전 생산/소비 계약 / 첫 실제 Portal 실행 전 구현
        deliverable: 이용 중지·마지막 그룹 회수·대상 매핑 변경의 동일 정책 보호 경계와 다음 접근/실행 재판정을 사용한다. 로그인 성공이나 세션 캐시만으로 실행을 허용하지 않는다. 이미 전송된 외부 업무 효과를 회수로 취소 완료 처리하지 않으며 이후 실행/결과 공개는 현재 조건을 검사한다. 실제 턴 상태·호출/이력 저장은 agent 요구 기반 모델에서 설계한다.
      - topic: 감사·알림·개인 설정 참조
        owners:
          - system
          - admin
          - integration
          - portal
        before: admin G3의 처리자/대상 계약 / 후행 소비 구현 전 상세
        deliverable: 관리 처리자 ADMIN ID, 대상 PORTAL ID, 레거시 신원, 시스템 배치 주체를 구별한다. system의 SYS_USER FK/세션 검색·알림·UI 상태 키에 Portal ID를 대입하지 않는다. 통합 표시만 영역+안정 ID+당시 표시 근거 공개 계약으로 수행한다. 후행 감사·이력·품질 목업을 생산 모델의 근거로 삼지 않는다.
    required_boundary_tests:
      - 동일 로그인 ID의 두 계정을 등록해도 계정/권한/비밀번호/로그아웃이 서로 전파되지 않는다. 관리자 쿠키로 Portal API, Portal 쿠키로 관리 API를 양방향 거부한다.
      - 같은 브라우저의 두 영역 동시 로그인·탭·로그아웃·만료·강제 비밀번호 변경·CSRF·복귀 URL에서 다른 영역 세션이나 저장 키를 사용하지 않는다.
      - 메뉴 조회만 있는 관리자가 저장/비밀번호 초기화/API 직접 호출을 하면 거부한다. 숨긴 버튼·알려진 URL·역할명으로 허용하지 않는다.
      - 권한 회수와 관리 저장의 순서를 양쪽으로 뒤집고 원 명령 재수신·결과 열람까지 검사한다. 요청 시작 권한만 검사하는 변이와 dirty 표식만으로 완료하는 변이는 실패해야 한다.
      - Portal 비활성화·마지막 그룹 회수·기간 만료·매핑 교체를 접수/실행/결과 조회 사이에 넣어 현재 조건을 확인한다. 이미 전송한 업무 효과는 별도 결과 확인 대상으로 남긴다.
      - 외부 인증 성공이어도 미등록/비활성·잘못된 원천/subject·응답 재사용은 이용을 열지 않는다. LOCAL 초기화 응답 유실은 같은 명령으로 새 비밀을 발급하지 않는다.
      - 내부 시험도 실제 서버 인증으로 만든 Portal 주체와 합성 데이터를 사용한다. 임의 userId 주입·관리자 대행 로그인·권한/쿼터/감사 생략을 허용하면 실패해야 한다.
