datasource:
  id: ARCH-030
  modes:
    - mode: "운영 DB 직결"
      detail: "업무 시스템별 운영 DB 에 읽기 전용으로 접속"
      caution: "운영 부하 영향. 조회 제한 정책 필수"
    - mode: "통합 DW"
      detail: "여러 업무 시스템 데이터를 모아둔 DW 에 접속"
      caution: "**동기화 시점 문제.** 조회 결과에는 기준 시각을 함께 제공한다"
  rules:
    - "두 방식을 고객사별로 선택하거나 혼용할 수 있어야 한다"
    - "어느 방식이든 조회는 **읽기 전용 계정**을 사용한다. 데이터 변경은 반드시 업무 API 를 통한다"
    - "데이터소스별 **기준 시각을 조회 결과 메타데이터로 항상 반환한다**"
    - "**하나의 SQL 은 하나의 데이터소스 안에서만 생성한다.** 여러 데이터소스에 걸친 요청은 데이터소스별로 조회한 뒤 agent 가 결합한다"
    - "조회 원천 구성은 REQ-021을 따른다. 지식·연결 카탈로그의 현재 권한과 업무 관련성으로 필요한 객체를 선별한 뒤 소속 데이터소스로 실행을 나눈다. 데이터소스를 먼저 선택해 지식/객체 후보를 제한하지 않으며 결과 결합의 근거·완전성·부분 실패는 해당 카드가 정본이다"

  relation_to_target_system:
    claim: "**대상 시스템과 데이터소스 사이에 매핑을 두지 않는다**"
    detail: "데이터 조회(SQL)는 데이터소스·테이블·컬럼의 조회 권한을, 기능 실행(API)은 개별 API의 호출 권한을 판정한다. 두 경로는 같은 Hub 사용자 그룹을 사용하며 각 자산에 독립적으로 매핑한다. 대상 시스템에는 그룹 목록을 두지 않는다(REQ-604). REQ-609의 사용자-대상 신원 매핑은 각 경로에서 별도로 확인한다"
    gained: "이렇게 절단하면 이전에 필요했던 구조 — 시스템 ↔ 데이터소스 N:N 매핑, 공유 DB 의 판정 기준 선택, 경로별 등급 결합 규칙 — 가 전부 사라진다"
    catalog: "**스키마 카탈로그의 테이블은 데이터소스에만 귀속된다.** 테이블 ↔ 데이터소스 매핑이 결정하는 것은 둘이다 — ① 어떤 커넥션으로 조회할지 ② SQL 검증·조건 주입·원본 컬럼 추적에 어떤 파서를 쓸지"
    unique: "카탈로그의 물리 객체 식별·중복 제한은 REQ-301, 동일 연결의 교차 DB 허용 정책은 REQ-603·ADR-027을 따른다. 물리 테이블명만으로 대조하지 않는다"

  schema_boundary:
    database_scope: "REQ-603·ADR-027에 따라 데이터소스의 기존 연결로 접근 가능한 다른 DB/카탈로그도 허용한다. 별도 DB 허용 목록은 두지 않는다. 실제 DB 권한은 DBMS가, 등록 공개 객체와 현재 사용자 권한은 Hub가 판정한다"
    terms: "DB 스키마와 스키마 카탈로그는 TRM-161·TRM-162로 구분한다. 카탈로그 항목은 공개 테이블·뷰이며 DB 스키마 전체의 공개를 뜻하지 않는다"
    management: "데이터소스의 다중 DB 스키마와 별도 스키마 권한 제외는 REQ-603을 따른다. 사용자 매핑은 REQ-609, 인증 예제의 실행 데이터소스·자동 참조는 REQ-302, 지식의 직접·간접 참조는 REQ-303을 사용하며 별도 스키마 매핑 계층을 두지 않는다"
    resolution: "REQ-301의 DB/카탈로그명·실제 DB 스키마명·객체명과 필요한 서버 한정자를 보존하고 SQL 물리 참조와 대조한다. 기본 스키마·검색 경로로 생략된 이름을 임의 보정하거나 검증되지 않은 DB/서버 접두어를 버려 다른 등록 객체로 대체하지 않는다"
    execution_context: "DB명 생략 시의 현재 DB 해석은 REQ-301을 따른다. 검증과 실행은 같은 연결 정의·이름 해석 환경을 사용하고 풀에서 반환된 세션의 DB/검색 경로가 다르면 복원·확인 전 실행하지 않는다. DBMS·파서가 해석과 통제를 지원하지 않는 구문은 이유를 알리고 거부하며 추가 계정·연결을 시도하지 않는다"

  two_layers:
    dbms_context: "REQ-603.dbms_context에 따라 관리 DBMS 코드·버전과 연결의 실제 제품/버전 관측을 구분한다. FEAT-202는 허용 카탈로그를 데이터소스 단위로 묶고 DBMS/버전·서버 지원 정책의 파서·원천 자료형/치수와 필요한 지원 문법/집계 함수 안내를 전달한다. 버전별 자료형 코드 목록은 만들지 않는다. FEAT-204는 같은 데이터소스 정보로 구문·참조·실행 지원을 검증하며 파서 통과나 LLM 설명만으로 실제 함수 지원을 확정하지 않는다"
    why: "접속 정보를 화면에 노출하지 않기 위해 **연결 정의의 원천은 배포 yml**로 둔다. 비밀 원문을 yml에 넣어야 한다는 뜻이 아니며 비밀 설정값의 암호화 yml·공통 복호화 연동·외부 마스터 키 관리는 REQ-403을 따른다. admin은 **매핑만 관리**한다"
    layers:
      - layer: "접속 계층"
        source: "yml 설정"
        holds: "데이터소스 ID · 접속 URL·계정·암호화된 비밀 설정값 · 커넥션 풀 설정"
        note: "화면에서 관리하지 않고 AI 전용 DB 에도 저장하지 않는다"
      - layer: "관리 계층"
        source: "AI 전용 DB (admin 데이터소스 관리)"
        holds: "별칭 · 연결된 yml 데이터소스 ID · DBMS 종류·버전 · 유형(운영 DB / DW) · DW 동기화 방식 참고 메모 · 시각 체계 · 설명"
    rules:
      - "**yml 은 기동 시 로드되며 데이터소스 추가·변경의 반영은 재기동을 전제로 한다.** 화면의 '실시간 조회' 는 로드된 설정을 화면 진입 시점에 직접 읽는다는 뜻이지(DB 에 복사해 두지 않는다) 무중단 동적 커넥션 풀 등록을 뜻하지 않는다"
      - "**다른 모든 메뉴와 agent 런타임은 관리 계층의 데이터소스 레코드만 참조한다.** 카탈로그의 테이블 귀속도 레코드의 **내부 식별자**를 참조할 뿐 yml ID 를 직접 참조하지 않는다"
      - "그 결과 **yml 의 데이터소스 ID 가 바뀌어도 관리 화면에서 해당 레코드의 ID 연결 한 군데만 바꾸면 된다.** 간접 계층을 두는 이유가 이것이다"
      - "**별칭은 표시용**이므로 변경할 수 있다. admin 화면과 LLM 컨텍스트에서 데이터소스를 지칭하는 이름이므로 업무 담당자가 알아보는 이름으로, 혼동을 막기 위해 유일하게 부여한다"
      - "REQ-603.parser_policy에 따라 파서는 서버의 검증된 DBMS/버전 지원 정책으로 결정한다. 데이터소스별 수동 선택/저장 필드는 없으며 지원 불가·미확인 조합의 SQL은 차단한다. DW 동기화 방식은 REQ-603.dw_sync_note의 참고 메모이며 실행·스케줄·최신성 판정 설정이 아니다"
      - "**yml 에 없는 ID 를 참조하는 레코드는 끊긴 연결로 감지한다.** REQ-601.configuration_diagnosis에 따라 기동/검증된 비교 대상 변경 때 검사해 DB에 버전별 판정을 저장한다. 관리 화면/업무 호출은 저장 판정과 해당 기동의 준비를 확인하고, 끊긴 연결에 귀속된 테이블은 조회 불가로 처리해 경고를 남긴다"

  declaration_and_verification:
    claim: "SQL 조회 도구 호출은 **대상 데이터소스를 파라미터로 명시**해야 하며, SQL 안의 객체는 DBMS의 실제 한정 이름(`DB 스키마.객체명`, 다른 DB는 `DB명.DB 스키마.객체명` 등)을 그대로 쓴다. 별칭 접두어·노출명 같은 이름 변환 계층은 두지 않는다"
    steps:
      - "1. 도구 호출이 선언한 데이터소스로 **파서를 선택**한다. 선언이 없으면 거부한다"
      - "2. 파서로 SQL 의 **참조 객체 전체를 추출**한다"
      - "3. 모든 객체를 DB/카탈로그·DB 스키마·필요한 서버 한정자까지 식별해 **선언된 데이터소스의 카탈로그와 대조**한다. REQ-301·REQ-603의 식별 계약을 만족하지 않거나 하나라도 없으면 실행하지 않고 거부한다"
      - "4. REQ-609의 활성 사용자-데이터소스 매핑과 현재 객체 권한 및 SQL 통제 4단계를 모두 통과한 뒤 선언된 데이터소스의 커넥션으로 실행한다"
    why_safe: "선언된 데이터소스의 등록·권한·정책 검증을 통과한 객체만 실행한다. 서로 다른 데이터소스의 동명 객체는 다른 실체이며 SQL 이름만으로 모델의 업무 대상 오선택까지 검출한다고 보장하지 않는다. 같은 연결에서 조회 가능한 다른 DB의 등록 객체는 허용한다. 다른 데이터소스의 커넥션을 섞거나 미검증 접두어로 식별 계약을 통과하지 못하면 실행을 차단한다"
    context: "LLM 컨텍스트에는 카탈로그를 **데이터소스 단위로 묶어 제시**하고, 각 묶음에 별칭과 업무 설명을 함께 표기해 LLM 이 선언할 값을 고를 수 있게 한다. 반복 거부(선언 오류)는 품질 지표로 집계한다"

  pending:
    - "@defer P3 integration — FEAT-003.source_public_contract와 FEAT-002의 연결/파서 소비에 필요한 정확 객체 식별·identityProfile 버전/이행·공개 범위 구조 관측·지원 파서 및 샘플링의 실제 조회 연결 계약을 완성한다. FEAT-221/204가 같은 원천 해석/정책/상한을 사용하도록 연결하며 integration P3 DB 조회 계약 검토와 admin G3 전에 교차 확인한다"

# ── LLM 연동 계층 ───────────────────────────────────────────
