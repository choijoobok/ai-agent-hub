module_boundaries:
  - id: ARCH-032
    rule: 제작사·공급 경로·모델·역할 설정과 실제 배포 연결을 구분하고, 실행용 불변 호출 구성은 서버에서 조립한다
    reqs:
      - REQ-403
      - REQ-602
      - REQ-604
      - REQ-608
      - REQ-610
      - REQ-116
    ownership:
      admin: 제작사·공급 경로·모델의 업무 메타데이터, 유효 제공 조합과 역할 매핑·사용 여부·연결 참조를 소유한다. 비밀이나 접속 주소를 별도 저장·편집하지 않는다
      integration: 배포 연결 로드·비밀 해석·공급자 변환 계약과 지원 기능을 소유한다. 도메인에 공급자 SDK 객체·인증 헤더·비밀 원문을 노출하지 않는다
      agent: 대화·추론·보조 판정·시스템 운영 모델 호출의 실행 주체다. 역할 선택과 현재 권한·전송 정책·사용량 기록을 집행한다
      embedding: admin의 지식 본문 임베딩과 agent의 질의 임베딩만 ARCH-013·040에 따라 같은 유효 모델/벡터 설정을 사용한다. 대화 모델 호출의 우회 통로로 쓰지 않는다
    resolution:
      - 호출 목적과 실행 시도/작업의 주체를 서버가 확인하고 REQ-602·ARCH-040의 역할 설정을 선택한다. 주 추론의 시도별 고정과 관리자 운영 역할을 구분한다
      - 제공 조합은 REQ-602.registry_contract의 공급사/모델/effort 표시명과 코드·전송 방식을 기준으로 공급 경로·해당 경로의 실제 호출 모델 식별값·지원 effort·용도와 어댑터 지원 기능을 대조한다. 미전송 effort는 값을 생략하고 표시명을 전송 값으로 사용하지 않는다. 표시명이 같다는 이유로 다른 경로/모델을 같은 것으로 취급하지 않는다
      - admin의 연결 참조를 현재 로드된 배포 연결과 연결한다. 누락·미지원 조합은 명시 사유로 실패시키며 다른 기본 연결·모델로 대체하지 않는다. 모델 비활성화의 신규 선택/진행 시도 경계는 REQ-602·ARCH-040을 따른다
      - 서버는 목적지·연결 리비전·모델 호출 식별값·effort·지원 기능·적용 정책 근거를 불변 호출 구성으로 확보한다. 전송 단계에서 이름으로 다시 조회해 다른 구성으로 바꾸지 않는다
    lifecycle: 모델 비활성화·진행 중 시도·새 시도 재선택은 REQ-602·ARCH-040을 따른다. 실행 구성을 고정해도 현재 권한·전송 정책 검사는 유지한다. 물리 배포 연결은 ARCH-028·ADR-028의 호환성 검수와 계획 배출 후 순차 재기동을 따른다
    capability_contract:
      fields: 추론/임베딩 용도·effort 조합·구조화/도구 호출·스트리밍·취소·사용량 계량·입력/출력 제한과 지원 근거를 구분한다. 지원 불명은 지원으로 기록하지 않는다
      semantics: 취소 요청 접수, 실제 공급자 처리 종료, 최종 사용량 확인을 별도 결과로 둔다. 클라이언트 대기 종료만으로 외부 처리가 중단되거나 과금이 멈췄다고 표시하지 않는다
      development: CON-033·034에 따라 개발용 명령행 공급자와 운영 API의 지원/실측 결과를 구분한다. 명령행 시험 통과나 관리자 등록만으로 운영 기능 지원을 확정하지 않는다
      compatibility: 제품 호출 의미·결과·오류 계약과 공급자 변환 계약을 구분한다. 어댑터가 의미를 보존할 수 없는 요청은 축소·자동 대체하지 않고 거부한다
      p2_evidence:
        date: '2026-11-10'
        codex: codex-cli 0.165.0·요청 모델 gpt-6.1-sol/low, 도구 차단/임시 작업공간/사용자 설정 미적용으로 실제 구독 로그인 호출 성공. AIHUB_PROBE_OK와 turn.completed.usage(input11288/output10/cached0)를 관측했다. CLI 사건은 서버 모델 식별이나 호출별 정산 증명이 아니다. 실제 구독 경로의 내부 반복/재시도별 사전 통제·원격 종료·최종 계량은 미확인으로 유지한다.
        claude: 최초 P2 조사 당시 Claude Code2.1.314의 로그인 부재로 선언만 확인했다. 2026-11-10 사용자 로그인 완료 안내 후2.1.322 실제 구독 호출을 추가했으며 현재 결과는 p3_usage_evidence를 따른다.
        api_candidates: '2026-11-10 사용자 A 결정: 개발 CLI로 검증하고 운영 API 실증은 구독 확보 후 CON-033·034에 따라 최우선 수행한다. OpenAI/Anthropic API 자격 환경 변수는 없으며 운영 API를 호출하지 않았다. API 기준 공통 계약과 미지원 거절은 유지한다.'
        limits: CLI JSONL/구조화 출력은 단일 모델 HTTP 호출이나 모든 전송의 사전 허가를 보장하지 않는다. 종료 신호는 원격 종료/과금0 근거가 아니다. 내장 도구·MCP·프로젝트 훅/설정 접근을 격리하고 부작용 없는 개발 범위에서 CON-033·034를 적용한다. 사전 통제 불명 경로는 업무 실행/정확 쿼터 시험에 사용하지 않는다.
        next_probe: 개발 CLI는 합성 입력의 응답/형식·명시 미지원 분기를 시험한다. 내부 모든 전송의 사전 통제가 확인되지 않은 경로는 업무 실행·정확 쿼터·취소 확정 시험에서 비활성화한다. 운영 API 구독 후 선정 SDK/전송 버전·모든 재전송 차단/외부 제어·취소 경합·지연 계량·동시성을 별도 실증한다. 승인된 CON-033·034의 유예이며 운영 완료가 아니다.
        transport: '실제 Codex CLI + 인증 없는 loopback 합성 서버: HTTP503의 request_max_retries=0/2에서 POST1/3회, 부분 SSE 뒤 단절의 stream_max_retries=0/2에서 POST1/3회를 관측했다. 모두 turn.failed·최종 usage 없음·Authorization 전달0. 이 설정 효력은 custom provider만의 실측이며 내장 ChatGPT 경로가 같은 제어를 제공한다는 증거가 아니다.'
        cancellation: 실제 구독 호출의 turn.started 뒤0.4초에 로컬 프로세스를 종료했다. turn.completed/usage 없음·프로세스 종료만 관측했고 원격 접수/종료는 확인되지 않았다. 사용량은 UNKNOWN으로 남기며 0으로 채우지 않는다.
      p3_usage_evidence:
        date: '2026-11-10'
        source: documents/research/model-provider-usage-verification.md
        codex: 0.165.0/gpt-6.1-sol/low. 새세션 중단 usage 부재, 정상11328/10 뒤 중단 turnId/context에 동일 last/total 재표시. 종결 뒤30초·저장조회·재시작/재개에도 원 호출 최종량 없음. 실제0 또는 확정 계량으로 사용 불가.
        claude: 2.1.322/sonnet(관측 claude-sonnet-5-5). 정상 최종output13. 중단은 부분 input/cache/output 자리표시를 관측하나 오류 result의usage0, 정상 뒤에는 이전 누적modelUsage/비용 보존. 종결 뒤30초와 저장 메시지에도 최종output 근거 없음.
        supported: 시험 경로의 합성 정상 응답·부분청크·중단접수·로컬종결·원천관측 보존은 확인했다. 숫자 존재/중단 turnId/CLI result를 최종량의 충분조건으로 삼지 않는다.
        unsupported: 두 CLI 시험 경로의 중단 호출 최종 사용량 확정·정확 쿼터/정산은 지원 검증되지 않았다. 원격종료는 UNKNOWN. API 기준 계약은 유지한다.
        verification: 정상/중단 비교6호출·실행18단언·관측재검사10개와 오귀속/오류0확정 반례2개. 최초 Codex 훅혼입3호출은 별도 시행이며 훅false 재시험을 근거로 사용한다. 제품 TC 실행 아님.
      operational_usage_acceptance:
        when: '@defer 운영 API 구독/유효 시험 연결 확보 직후 우선 실행 — ADR-048 A 승인. 해당 조합의 모델 통합 G4 완료와 해당 기능 최초 활성화 중 먼저 오는 시점 전까지 판정한다. P5 통합/정확 쿼터·P6 운영 인수의 필수 범위 검증은 면제하지 않는다.'
        status: not_executed
        decision: ADR-048
        assessment_scope: 공급자·모델·SDK·전송 방식·버전별로 미실행/지원/미지원/미확인을 구별한다. 단일 조합 통과로 다른 조합을 활성화하지 않는다. 검증되지 않은 기능은 완료/운영 지원으로 표시하지 않는다.
        owner: integration FEAT-304/UC-048·TC-3043~3048. 기록 소비/쿼터 원자 반영은 agent FEAT-211·TC-2112~2119와 소유 구현 단계에서 연결한다.
        cases:
          - 공급자/모델/SDK/전송 방식·버전 고정. 실제 요청/메시지 ID와 Hub callKey의 정확 매핑 및 모든 하위 재시도의 사전 통제/비활성화를 확인한다.
          - 정상 스트림의 전체 관측과 최종 usage, 입력/캐시/출력 포함관계·단위·원천 범위와 실제0을 대조한다. 클라이언트 추정 비용을 공급자 계량/청구액으로 채택하지 않는다.
          - 청크 경계 중단·완료와의 경합·부분 단절에서 접수/수신종료/원격종료관측/최종계량을 각각 기록한다. 지원되는 조회가 있으면 같은 호출을 조회하며 새 추론 요청을 복구로 보내지 않는다.
          - 미제공/초기자리표시/이전누적 재표시/귀속불명은 UNKNOWN·INCOMPLETE. 실제 호출별0 근거를 가진 대조군과 구별하고 예약/추정량을 임의 해제하지 않는다.
          - 늦은 최종량/정정·중복·역순을 원 호출/원월에 반영한다. 미귀속 계량은 선택하지 않고 중복 차감0, 같은키 다른값은 충돌로 보존한다.
          - 두 독립 호출과 재접속/프로세스 재시작에서 계량을 섞지 않는다. 계정/세션 합계 차액으로 호출별 정확성을 대신하지 않는다.
        provider_scope: OpenAI 동기 스트림과 background 취소/조회는 별도 지원 조합이다. background 채택 시 데이터 보존/배포 조건을 먼저 검토한다. Anthropic Messages의 누적 usage/최종 메시지 및 중단/조회 지원은 실제 선정 경로에서 확인한다. 기능 부재면 명시 미지원이며 다른 경로로 자동 변경하지 않는다.
        evidence_required: 합성 입력·기대·실제 이벤트/요청 참조·버전·관측기간·귀속 판정·UNKNOWN/중복 반례와 비밀 없는 재현 코드를 남긴다. ASM-003의 설계 재현 판정은 ADR-048·ASSUMPTIONS를 따르며 이 운영 수락과 분리한다. 설계 확인을 운영 API 실행 통과로 표시하지 않는다.
        unsupported_outcome: 중단 최종량을 원천이 제공하지 않으면 그 능력을 UNSUPPORTED로 판정하고 UNKNOWN 보존·필요 기능 차단을 시험한다. 존재하지 않는 최종량을 기다리거나0으로 확정하지 않는다. 해당 차수의 필수 요구를 충족하지 못하면 영향 G4/G5를 완료 처리하지 않고 다른 지원 조합 검증 또는 정식 CR로 범위/계약을 결정한다.
    execution_contract:
      status: P3 상세 초안·미구현. 공통 호출/응답 필드·권한·오류·시험은 50-api/017의 FEAT-302/304에 명세했다. 실제 공급자별 지원 판정은 operational_usage_acceptance와 소유 구현 시험 대상이다
      layers: integration은 제품 공통 호출/오류 의미와 공급자 변환 계약·버전·시험을 소유한다. agent는 시도·스텝·현재 권한·예산·도구 실행·종결을 결정한다. 어댑터는 확보한 요청을 변환하고 관측 사실을 반환하며 사용자 승인·권한·모델 교체·업무 실행 여부를 자율 결정하지 않는다. portal은 ARCH-019의 통제된 제품 응답만 소비한다
      capabilities: 지원 근거에는 공급 경로/모델·어댑터/도구 버전·개발/운영 모드·확인 일자·시험 조건과 선언/실측/미지원/미확인 상태를 구별한다. 연결 성공을 스트리밍·취소·도구 호출·정확한 사용량 지원의 근거로 확대하지 않는다. 필요한 제어를 확인할 수 없는 조합을 해당 기능의 지원 목록에 넣지 않는다
      attempts: Hub 호출 식별자·시도 순번·목적·확보한 설정/연결 리비전과 공급자 요청 식별자를 연결한다. 전송 전 실패·전송 여부 불명·접수 관측·부분 응답·정상 종료·오류·취소 요청/확인·최종 사용량 확인을 별도 사실로 기록한다. 늦은 응답은 현재 시도/점유와 대조하고 종결 작업을 되살리지 않는다
      timeouts: ARCH-033.calls의 사용자 승인 공통값과 REQ-608.timeout_policy의 API별 예외를 서버에서 해석해 호출별로 고정한다. 실제 전송 경로의 지원/프록시 제한·현재 점유/갱신·허용된 재시도 예산을 대조하고 조합이 유효하지 않으면 호출을 시작하지 않는다. 승인 후 호출 시작 기한을 개별 호출 실행 시간으로 오해하지 않는다
      retry_owner: agent가 REQ-009·NFR-022의 원인별 재시도 허용을 판정하고 integration 어댑터가 그 한도 안에서 호출한다. 하위 SDK·HTTP 클라이언트·그래프·개발 CLI의 각 재전송은 전송 전에 현재 중단/점유·권한·예산·필수 이력 기록을 검사하는 agent 경계를 통과할 수 있을 때만 허용한다. NFR-022의 TIMEOUT_RETRYING 저장과 실제 새 모델 응답 실행의 스텝 예산 확보를 사후 횟수 집계로 대신하지 않는다. 이 사전 통제를 제공하지 못하면 하위 자동 재시도를 끄거나 해당 호출 경로를 미지원으로 둔다. 원 호출과 모든 시도의 전송/계량은 같은 근거로 연결한다
      retries: 등록 계약상 안전한 도구 타임아웃만 NFR-022의 자동 1회를 사용한다. DB/DW 타임아웃은 REQ-037에 따라 재시도/재작성하지 않는다. 전송한 업무 실행과 결과 불명은 REQ-105의 확인·새 승인 경계를 따르며 멱등성 선언만으로 재전송하지 않는다. 인증/권한·정책 거부·미지원 기능·설정/계약 불일치를 다른 모델/연결로 우회하지 않는다
      auxiliary_fallback: REQ-602.auxiliary_fallback을 실행 정책 정본으로 사용한다. integration은 일시 수용량/서비스 불가와 인증·정책·계정 쿼터·계약 오류를 구별하고 공급자 오류 코드/근거·접수/종료 관측을 agent에 반환한다. 문구/HTTP 상태만으로 자동 대체 가능을 추정하지 않는다. agent가 후보/입력/설정 스냅샷·현재 검사·남은 마감/횟수·동의와 필수 기록을 확보해 다음 호출을 요청한다. 어댑터의 암묵적 경로 변경과 하위 자동 재시도는 금지한다. 후보마다 해석된 연결·모델·지원 계약을 고정하며 각 원격 호출의 취소·종료·사용량 미확인은 대체 성공으로 덮지 않는다. 실제 공급자별 분류 표와 거절/종료 근거를 검증하기 전에는 해당 오류를 자동 대체 가능으로 활성화하지 않는다
      cancellation: 클라이언트 취소 요청 수락·공급자 처리 종료 확인·응답 수신 종료·사용량 확정을 분리한다. 개발 CLI의 프로세스 종료만으로 원격 작업 취소·과금 종료를 확정하지 않는다. 취소 미확인·계량 미제공은 명시 상태이며 성공/0으로 채우지 않는다
      usage: 공급자 계량·Hub 추정·확인 불가를 구분해 REQ-116·NFR-010의 귀속과 기록을 유지한다. 늦은 계량의 반영은 원 호출에 연결해 중복 차감/집계를 방지하고 일반 응답에는 인증 정보·원문 헤더를 포함하지 않는다
      proof: 정상/빈/잘린/거절 응답·부분 스트림 뒤 단절·취소 경합·사용량 누락/지연·숨은 재시도·동일 이름의 다른 모델·미지원 기능·승인 후 대상 변경을 실제 지원 경로별로 검증한다. CON-033·034의 개발 CLI 결과와 운영 API 결과는 따로 판정한다
    secret_contract:
      authority: REQ-403·ADR-022가 비밀 종류·암호화 YAML·환경별 외부 활성 마스터 키·구현 경계의 정본이다. 새 비밀 저장소·관리 화면·암호 알고리즘을 선택하지 않는다
      flow: 공통 설정 해석 계층이 기존 설정 우선순위를 보존해 접속 구성요소 사용 전에 복호화한다. 연결 소비자는 그 결과를 사용하며 모듈마다 복호화 도구를 복제하지 않는다
      exposure: admin·portal에는 식별자·유효 상태·허용된 공개 필드만 제공한다. 설정 객체 전체 직렬화·바인딩 예외·헤더·URL·도구 출력·진단·감사·모델 문맥의 비밀 노출을 검증한다
      failure: 필수 연결의 비밀 누락·변조·미지원 형식·복호화 실패는 해당 구성요소 기동/호출을 막는다. 미사용 선택 연동의 비밀을 요구하거나 인증 없음·평문으로 대체하지 않는다
      no_auth: 인증 없음은 REQ-604·608의 명시 등록·공동 검수된 연결 방식에 한한다. API 키가 없다는 사실로 자동 선택하지 않는다
      rotation: 비밀 교체의 업무 동일성 예외는 REQ-105, 배포 적용·복구는 ADR-028을 참조한다. 환경 마스터 키 교체를 일반 연결의 호환 변경으로 자동 분류하지 않는다. 비밀값 해시를 업무 승인 대상의 공개 지문으로 쓰지 않는다
      boot_design:
        status: 'P2 기술 경로 실증 완료: 기존 제품 runtimeClasspath/처리 리소스·임시 PostgreSQL16의 실제 Boot/Liquibase/JPA 기동·설정 우선순위·키 교체/복구13건 및 엄격 형식16검사 통과. 제품 설정 어댑터/운영 도구는 SLICE-302에서 구현하고 실제 Boot/DB 차단·키 짝 복구를 검증했다. 고객 운영 키/복구 인수는 P6 후속이다. ADR-022 검증 보충 참조.'
        order: Spring Boot의 설정 데이터/프로파일 해석 뒤, 비밀을 소비하는 DB·Liquibase 등 구성요소 바인딩 전의 공통 Environment 해석 경로에 연결한다. 각 PropertySource의 우선순위·원천 정보를 유지하고 평문 재정의 맵을 최상위에 덧씌워 선택 결과를 바꾸지 않는다
        resolution: 최종 선택된 비밀 설정값을 소비할 때 버전/형식과 해당 환경 키를 검증해 메모리에서 복호화한다. 사용하지 않는 선택 연동의 설정을 전체 열거·강제 복호화하지 않는다. 필요한 연결의 해석 실패는 그 기동/사용을 차단하며 낮은 우선순위 값이나 평문으로 대체하지 않는다 Boot의 원천 mapper가 getProperty 예외를 삼킬 수 있으므로 선택 전 복호화 예외에 의존하지 않는다. 암호문을 비밀 없는 toString의 불투명 값으로 운반하고 선택된 값의 소비 변환에서 검증 실패를 전달한다. Environment와 Binder 양쪽에 같은 변환을 적용하고 원천 교체 뒤 mapper cache를 재부착한다.
        bootstrap: 프로파일 선택·설정 파일 위치·외부 키 읽기 자체가 그 키의 복호화를 요구하는 순환 구성을 허용하지 않는다. 조기 로그/실패 분석·설정 진단에서 값·암호문·키가 노출되지 않는지 실제 부팅 경로를 별도로 검증한다
        operations: 암호문 생성·검증·재암호화는 공통 운영 도구로 제공한다. 키/평문은 화면·명령행 인자·셸 이력·일반 로그·평문 중간 파일에 남기지 않으며 출력은 암호문과 비밀 없는 성공/실패 근거로 제한한다. YAML 전체 자동 편집과 원문 출력 도구를 범위에 추가하지 않는다
        key_change: 환경별 활성 마스터 키 하나를 유지한다. 암호문과 외부 키는 저장소·백업에서도 분리 보관하고, 복구 시 맞출 버전·참조만 논리적 복구 세트로 관리한다. 키를 암호문과 같은 파일/배포 묶음에 넣지 않는다. 교체 시 이전 각각의 보호된 복구본을 확보하고 새 키로 재암호화한 설정과 실제 자격증명을 별도 검수한다. 자동 키 혼용·온라인 무중단 교체를 전제하지 않고 ADR-028의 별도 전환 절차를 따른다. 복구 때도 암호문/키 짝과 실제 자격증명 유효성을 확인한다
        proof: DB·Liquibase 이전 복호화, 다중 프로파일/외부 파일/환경 재정의 우선순위, 선택 연동 미사용, 오키/키 누락·변조·다른 용도·미지원 형식, 바인딩/로그/진단/도구 출력, 교체 부분 실패/복구를 합성 비밀로 검증한다. 실제 비밀을 시험 데이터로 쓰지 않는다
        evidence: Spring 공식 문서는 Environment 초기 확장과 인증된 대칭 암호화 기능을 제공한다. 현재 저장소 Boot 4.1.1의 관리 의존성과 공식 최신 문서의 버전은 다르므로 클래스/형식/파라미터를 최신 예제만으로 확정하지 않는다
        references:
          - https://docs.spring.io/spring-boot/reference/features/external-config.html#features.external-config.encrypting
          - https://docs.spring.io/spring-security/reference/features/integrations/cryptography.html
        format_v1: '2026-11-10 integration G2 승인: ENC(v1.A256GCM.<base64url-no-padding>)이며 디코딩 값은 Spring AesGcmBytesEncryptor 원출력(16바이트 난수 IV + 암호문 + 128비트 태그)이다. 정규 형식/최대64KiB·허용 버전/프로파일만 수락하며 다른 형식/평문 폴백은 없다. Jasypt 암호문 호환은 제공하지 않는다.'
        key_v1: 환경별 외부 활성 키는 CSPRNG의32바이트 AES 키, 보호된 입력의 base64url-no-padding을 엄격 디코딩한다. withSecretKey(SecretKeySpec AES)를 사용해 암호 알고리즘을 재구현하지 않는다. 사람이 정한 암호에서 키를 유도하는 프로파일은 제공하지 않으므로 PBKDF2 salt/반복 파라미터를 섞지 않는다. 외부 키의 배포·접근/복구 검수 전 운영 키를 생성/교체하지 않는다.
        binding_v1: 암호화 내부 구조는 버전·프로파일·고객사·환경·정규 설정키·비밀의 여섯 UTF-8 필드를 각4바이트 big-endian 길이와 함께 저장한다. 음수/필드16KiB초과·잘린 데이터·잔여 바이트·비정규 UTF-8은 거부하고 복호화 후 앞5개 필드를 서버 기대값과 대조한다. 빈 필수 비밀은 소비 설정 검증에서 거부한다. 별도 AAD API를 가정하지 않는다. 환경/속성 이름의 복사와 버전 치환을 거부한다.
        extension: 현행 Boot4.1.1은 org.springframework.boot.EnvironmentPostProcessor와 같은 이름의 spring.factories 키를 사용한다. 옛 org.springframework.boot.env 인터페이스는 제거 예정이라 새 구현의 기본값으로 쓰지 않는다. ConfigDataEnvironmentPostProcessor.ORDER 이후·소비 바인딩 전이며 원천별 우선순위/Origin·relaxed binding을 보존해야 한다. 프로파일/키 파일 위치 등 부트스트랩 선택값은 암호화하지 않는다. 환경 원천의 직접 조회와 getSource/entrySet 기반 캐시를 모두 보존·보호해야 한다. 실측은 spring.datasource.password와 SPRING_DATASOURCE_PASSWORD·외부 YAML/프로파일에 한하며 배열/중첩/임의 별칭의 일반 지원은 제품 어댑터 계약 시험으로 확정한다.
        measured: '13기동 사례: 키 없음/오키/용도 불일치는 DB pool 시작 전 실패·DDL0, 정상 제품 첫 기동은 Liquibase6 changeset/JPA/실접속, 외부파일/프로파일/환경변수 우선순위와 파일 Origin 보존, 미사용 오류값 지연, 유효한 하위 값이 있어도 잘못된 상위값 폴백0, 부분 키 교체/키 유실 차단, 새 짝/이전 복구 짝 부팅 성공. 기존 합성 행과 적용 changelog 보존, stdout/stderr의 합성 평문/키/암호문 누출0. 형식16검사는 최대16KiB·비정규 UTF-8/길이/잔여/변조/버전/프로파일 등을 포함한다. 이전 축소14검사와 제품 수락 TC의 통과를 혼동하지 않는다.'
        implementation_followup: SLICE-302 공통 어댑터/운영 도구는 등록 canonical binding·진단 비노출·선택값 실패 폐쇄·파일 입력 ACL을 구현했다. P2 결과와 별도 제품 시험 근거를 project.state에 기록한다. 실제 고객 키 발급·접근권한/분리 보관·복구본 인계는 P6에서 검수한다.
    verification:
      - 동일 표시명의 다른 공급 경로, 미지원 effort/기능, 없는 연결, 해석 실패에서 자동 대체 호출이 없어야 한다
      - 검증과 전송 사이 역할 설정이 바뀌어도 이미 확보한 시도별 구성과 현재 접근 검사를 구별한다
      - 정상·실패·취소·바인딩 오류에서 합성 비밀이 일반 로그·설정 응답·모델 문맥에 나타나면 실패다
      - 개발용 공급자가 계량/취소를 지원하지 않는 상태를 운영 검증 완료로 표시하면 실패다
