# 운영 설정의 논리 정의. 기존 system 설정 화면을 그대로 재사용하며 현재 구현 키 목록은 아니다.
module_boundaries:
  - "id": "ARCH-031"
    "rule": "운영 설정은 항목별 원천·형식·기본값 근거·적용 경계를 갖고, 지원 목록 밖 키와 보안 불변식을 끄는 값을 받지 않는다"
    "reqs":
      - "REQ-506"
      - "REQ-601"
      - "REQ-614"
      - "REQ-107"
      - "REQ-108"
      - "REQ-109"
      - "REQ-037"
      - "REQ-204"
      - "REQ-207"
    "contract": "ARCH-029의 system 공개 설정 계약을 사용한다. REQ에 이미 있는 키는 유지하고 새 key는 논리 키 제안으로 구분해 P3에서 기존 설정 바인딩·메시지·화면과 연결한다. 확정 기본값의 정본은 각 basis다. ARCH-033의 초기 운영값·기술 설정·적용/보호 계약은 2026-10-27 admin G2에서 사용자 승인했고 실제 소유 구현과 운영 적합성 검수는 별도다"
    "definition_fields": "기능 요건과 속성 정의에 키·업무 설명·소유 모듈·자료형·단위·기본값과 근거·허용 범위·상호 제약·관리 원천·편집 가능 여부·적용 시점을 둔다. 기존 화면의 키·유형·설명·기본값·적용값·변경 여부 표시를 재사용하고 새 컬럼·설정 버전·인스턴스 로드값 관측은 추가하지 않는다. 소비 기록은 실제 적용값·판정 시각을 연결한다"
    "review_status": "2026-10-27 운영 설정 정련. 기존 basis와 confirmed_changes의 확정 규칙을 미정 수치·제안 경계와 구분한다. proposed_boundary는 별도 확정 또는 소유 작업흐름 설계 검증 전이며 승인된 제품 기본 동작으로 간주하지 않는다"
    "confirmed_changes":
      - "subject": "개인 동시 한도 감소"
        "basis": "NFR-023.configuration_change"
        "status": "2026-10-27 사용자 승인"
        "effect": "기존 실행 유지·다음 개인 한도 확보부터 현재 설정 적용"
      - "subject": "스텝·되돌림 상한 변경"
        "basis": "NFR-013.configuration_change·NFR-014.configuration_change"
        "status": "2026-10-27 사용자 승인"
        "effect": "각 집계 단위의 실제 실행 시작 때 상한 고정·동일 실행의 이어가기/인계에서 초기화 금지"
      - "subject": "조회·실행 예산·개별 호출의 초기 운영값"
        "basis": "ARCH-033.query·execution_budget·calls"
        "status": "2026-10-27 사용자 승인"
        "effect": "기본값·허용 범위·초과 처리와 호출별 고정 경계 확정. 실측/구현은 별도"
      - "subject": "API별 호출 타임아웃"
        "basis": "REQ-608.timeout_policy"
        "status": "2026-10-27 사용자 추가 요청 반영"
        "effect": "미지정 시 공통값, 지정 시 해당 API 계약값 우선. 점유/연결/프록시와 상호 검증"
      - "subject": "의도 확인 만료·저장 조회 제한의 실측 순서"
        "basis": "ADR-029·ARCH-033.measurement_required.sequencing"
        "status": "2026-10-27 사용자 승인"
        "effect": "P2 측정 계약·소유 G3 후 구현/시험·최초 운영 활성화 전 수치/범위/근거 확정. 미설정 활성화 금지"
      - "subject": "추가 정보 대기·계획 확인 기한"
        "basis": "ARCH-033.additional_info_wait"
        "status": "2026-10-27 사용자 승인"
        "effect": "WT-02 공통 초기값·범위와 최초 대기 기한 고정·자료 기한 우선·만료 중단"
      - "subject": "입력 의도 분류 전용 상한"
        "basis": "ARCH-033.classification_budget"
        "status": "2026-10-27 사용자 승인"
        "effect": "턴별 전용 상한과 시도별 스텝 동시 검사·실제 실행 단일 귀속·소진 시 명시 선택"
    "execution_settings":
      - "key": "sys-config.agent.approval.wait-timeout-minutes"
        "basis": "REQ-026.config"
        "type": "integer"
        "unit": "분"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "REQ-026의 10분"
        "allowed_basis": "REQ-026의 양의 정수 분"
        "editable": true
        "applies": "다음 승인 요청의 최초 제시 시각부터 계산한다. 같은 요청의 질문·재발급·개인 순서 대기로 만료 시각을 다시 시작하지 않는다"
      - "key": "sys-config.agent.approval.execution-ttl-minutes"
        "basis": "REQ-026.config"
        "type": "integer"
        "unit": "분"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "REQ-026의 5분"
        "allowed_basis": "REQ-026의 양의 정수 분"
        "editable": true
        "applies": "다음 사용자 승인부터 호출 시작 기한을 계산한다. 진행 중 호출을 기한 경과만으로 취소하지 않고 일괄 승인 뒤 각 후속 액션도 전송 직전 같은 만료를 검사한다"
      - "key": "sys-config.agent.sql-regeneration.max-attempts"
        "basis": "REQ-037"
        "type": "integer"
        "unit": "재작성 횟수"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "REQ-037의 3"
        "allowed_basis": "REQ-037의 0~5 정수"
        "editable": true
        "applies": "저장 후 다음 재작성 판정부터 적용한다. 진행 SQL을 중단하지 않으며 판정별 누계·적용 설정값·판정 시각을 기록한다"
      - "key": "sys-config.agent.policy.recheck-after-minutes"
        "basis": "REQ-108"
        "type": "integer"
        "unit": "분"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "REQ-108의 60분"
        "allowed_basis": "REQ-108의 양의 정수"
        "editable": true
        "applies": "저장 후 새로 사용자대기에 들어가는 턴부터 적용한다. 현재 권한 검사를 이 시간까지 미루거나 턴 만료 시간으로 사용하지 않는다"
      - "key": "sys-config.agent.quota.step-recheck-enabled"
        "basis": "NFR-012·REQ-614"
        "type": "boolean"
        "unit": "none"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "NFR-012.config의 false"
        "allowed":
          - true
          - false
        "editable": true
        "applies": "저장 후 다음 모델 호출 직전부터 진행 중 시도에도 적용한다. 이미 전송한 호출을 취소하거나 시작 전 검사·계량을 끄지 않는다"
      - "key": "sys-config.agent.execution.user-concurrency"
        "basis": "NFR-023"
        "type": "integer"
        "unit": "동시 실행 건"
        "source": "SYS_CONFIG 재정의와 제품 YAML 기본값"
        "default_basis": "NFR-023의 3"
        "editable": true
        "applies": "실행 시작/재개/원천 후속 페이지의 개인 점유 확보 경계. 집계 대상과 중복 배제는 NFR-023을 따른다"
        "allowed_basis": "NFR-023.configuration_range가 참조하는 ARCH-033.execution_budget의 사용자 승인 범위"
      - "key": "sys-config.agent.execution.drain-timeout"
        "basis": "ARCH-070"
        "type": "duration"
        "unit": "분"
        "source": "운영 설정 — ARCH-029의 공통 원천"
        "default_basis": "ARCH-070의 드레인 상한 5분"
        "editable": true
        "applies": "종료 신호 후 진행 중 스텝의 대기 상한. 사용자대기 턴과 종료 신호 전 ADR-028의 계획 배출에는 적용하지 않는다"
        "design_basis": "ARCH-033.technical_parameters의 종료 신호 후 대기 범위·고정 시점·검증된 비상 종료값·외부 종료 유예 대조를 따른다. 계획 배출에는 적용하지 않는다"
        "pending": "@defer P3 — G2에서 승인한 초기 설계 기준을 시스템 설정·기동 검증·서비스 관리자 종료 설정과 연결하고 소유 구현 후 경합/시간 경계를 시험한다"
    "deployment_readonly":
      - "item": "결과 원문 사본 보존"
        "basis": "REQ-107.retention_policy"
        "type": "양의 유한 기간"
        "unit": "일"
        "default_basis": "REQ-107의 기본 7일"
        "source": "YAML 전역값·데이터소스/대상 시스템별 예외"
        "applies": "REQ-107의 기산·새 자료 적용 규칙"
        "editable": false
      - "item": "질의·응답 본문 보관"
        "basis": "REQ-109.conversation_body_retention"
        "type": "양의 유한 기간"
        "unit": "일"
        "default_basis": "REQ-109의 기본 7일"
        "source": "YAML 전역값"
        "applies": "새로 접수/생성한 본문. 기존 자료 기한 자동 변경 금지"
        "editable": false
      - "item": "현재 적용 연결의 공개 정보"
        "basis": "ARCH-028·REQ-403"
        "type": "허용 필드만 포함한 참조"
        "source": "현재 실행 노드의 로드 결과"
        "applies": "배포 적용 경계"
        "editable": false
    "technical_design":
      "basis": "ARCH-033.technical_parameters — 상태별 조회·요청 제한/재조회, 두 점유 갱신 모드·기존 점유 고정·만료 회수, 종료 신호 후 대기의 초기값·범위·적용 경계와 검수 조건"
      "status": "2026-10-27 admin G2에서 초기 설계 기준을 사용자 승인했다. 숫자별 허용 범위를 통과해도 소유 구현의 갱신 모드/연결/현재 점유 상호 제약 검수 전 운영 활성화하지 않는다"
    "wait_contract": "계획 확인은 REQ-023에 따라 WT-02 추가 정보 대기 목적이며 ARCH-033.additional_info_wait의 사용자 승인 기한을 함께 쓴다. 업무 승인은 REQ-026의 확정값, 의도 확인은 REQ-032와 ADR-029의 실측 순서를 따른다. 정책 재판정 주기를 만료 시간으로 쓰거나 이미 발급된 대기의 기한을 설정 변경으로 다시 계산하지 않는다"
    "unresolved_definitions":
      - "items": "저장 조회·대시보드·위젯 수"
        "basis": "REQ-204·207·NFR-005"
        "type": "건수"
        "proposed_boundary": "신규 등록/추가 시 현재 제한으로 검증하고 제한 감소만으로 기존 자산을 자동 삭제하지 않는 안이다"
        "pending": "@defer 최초 운영 활성화 전 — ARCH-033.measurement_required.sequencing의 승인된 순서로 사용자별 사용량·화면/메모리 부하를 측정해 하드 상한을 정한다. 초과 기존 자산의 조회/수정·추가 허용 범위는 소유 P3에서 구체화한다"
      - "items": "저장 조회 동시 실행·캐시 수명·쿨다운·실패 재시도 대기"
        "basis": "REQ-204·207·NFR-005"
        "type": "건수·기간"
        "proposed_boundary": "캐시 적중에도 현재 권한과 만료를 확인하고 결과를 영속 저장하지 않는다. 실패 후 재요청은 사용자·저장조회 식별자 단위 서버 제한을 적용하며 채팅의 개인 순서 대기 계약과 혼동하지 않는다"
        "pending": "@defer 최초 운영 활성화 전 — ARCH-033.measurement_required.sequencing의 승인된 순서로 하드 상한을 실측 후 결정한다. 캐시 적중/권한 회수·노드 이동·동시 위젯 조회·연속 실패를 대조하고 소유 P3에서 적용 시점과 기존 캐시/대기 처리 경계를 구체화한다"
    "measurement_plan":
      "ownership": "agent는 실행·조회·사용량·대기, integration은 공급자 호출·연결/재시도·노드 전환, system은 기존 설정 정의·검증·작업 단위 조회를 제공한다. admin은 소유 요청/실행에 적용값·승인 방식·판정 근거를 기록한다"
      "cases": "정상 짧은 작업과 장기/넓은 결과·느린 외부 호출·사용자대기·한도 감소·노드 한 대 배출·중복 요청·시간 경계·저장 실패를 당시 적용한 설정값과 적용 시각 근거로 대조한다"
      "evidence": "소유 NFR의 measurement/source를 사용해 완료율·제한 사유·지연 분포·메모리/연결 사용·중복 실행·권한 회수·결과 불명을 기록한다. 시험 환경·공급 경로·자료 규모·표본 수와 개발/운영 차이를 남긴다"
      "decision": "이미 승인된 기본값과 새로 측정할 후보값을 구분한다. 성능 목표 미확정을 허용한 ASM-002가 실행 보호 설정을 비우거나 무제한으로 운영해도 된다는 뜻은 아니다. 필요한 보호값과 적용 경계가 검증되지 않은 경로는 운영 준비 완료로 판정하지 않는다"
      "timing": "의도 확인 만료·저장 조회 제한은 ADR-029로 승인한 ARCH-033.measurement_required.sequencing을 따른다. 기술값은 초기 설계 기준안을 검토하고 소유 구현 후 계약/지연 시험으로 검수한다. 사용자 승인한 추가 정보 대기·분류 상한 등 초기값과 실측 대상을 구분한다. G3 전 제품 소스 변경과 G2 자동 완료는 허용하지 않는다"
    "invariants":
      - "턴 전체 시간·턴당 누적 토큰 강제 종료 상한, 원문 0일·음수·무기한, 임의 비밀값 키를 지원 목록에 추가하지 않는다"
      - "단순 미구성은 제품 기본값으로 해석하되 읽기 장애·형식 오류·지원 불명 키를 미구성으로 바꾸지 않는다"
      - "등록 정의의 타입·범위를 통과한 유효값만 사용한다. 다중 키 제약은 전체 후보값으로 검증하고 기존 공통 조회의 작업 단위 값 고정을 따른다. 별도 설정 버전 관리나 기대 버전 검사를 추가하지 않는다"
      - "기간이 정해진 대기·승인·자료의 만료 시각은 단순 설정 변경으로 소급 연장하지 않는다. 항목별 별도 규칙이 있으면 그 정본을 적용한다"
      - "sys-config.admin.approval.*의 관리자 승인/전결 설정을 제공하지 않는다. Portal 사용자 신청 승인과 실제 실행 확인은 각각의 소유 계약을 따른다."
    "verification":
      - "개인 한도 3→1 감소 중 기존 3건은 계속하고 종료/사용자대기로 확보 수가 줄어도 1건 이상이면 신규 배정을 막는다. 0건이면 개인 순서의 다음 1건만 획득한다. 설정 변경과 시작 경합에서 초과 획득하거나 기존 작업을 강제 중단하면 실패다"
      - "스텝 상한을 바꾸기 전 시작한 시도는 고정값·누적 사용량을 유지하고 개인 순서 대기 뒤 새로 시작하는 시도는 새 값을 확보한다. 사용자대기 이어가기·인계·회차 변경에서 예산이 다시 생기면 실패다"
