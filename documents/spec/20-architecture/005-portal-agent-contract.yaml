portal_agent_contract:
  id: ARCH-019
  rule: "**portal 은 agent 가 권한·보안·쿼터·감사 처리를 끝낸 뒤 내놓은 응답 계약만 소비한다.** 처리 내부 상태나 LLM 공급자 응답을 직접 해석하지 않는다. 저장된 조회는 별도의 agent 실행 계약으로 요청하며, portal은 SQL·저장 시점 권한 결과를 보유하거나 재사용하지 않는다"
  ownership: "계약 버전·호환성·계약 시험은 integration 작업흐름이 소유한다. agent는 의미 블록·사용자 표시 문구·저장된 조회 실행 결과와 페이지 결과/이어가기 계약을 생산하고 원천 조회를 집행한다. portal은 표현 어댑터와 REQ-011의 페이지 안내·후속 요청·그리드 등 화면 처리를 맡는다"
  hard_rules:
    - "초기 계약 시험 화면은 최종 응답의 원문과 메타데이터를 **누락·재해석 없이** 보여 준다. 이것은 제품 portal 채팅 화면의 완료로 세지 않는다"
    - "업무 처리 상태·실행 결과·업무 오류·권한/범위 안내·대안·경고·지식 태그 안내와 새 대화 초기 안내는 **agent 계약의 문구 블록**이다. portal은 문구를 만들거나 바꾸거나 자체 폴백 문구로 대체하지 않고 그대로 표시한다. 초기 안내도 모델 호출은 만들지 않되 agent가 제공한 고정 계약 문구를 사용한다"
    - "**저장된 조회 실행은 턴·LLM을 만들지 않는다.** agent는 매 요청마다 참조 객체 재추출·현재 사용자 그룹·데이터소스·신원 매핑·컬럼 마스킹·조회 상한을 판정하고, portal은 그 결과만 표시한다(REQ-201·207)"
    - "조회 결과의 페이지 상한·초과/다음 페이지 존재·이어가기 검증은 NFR-001~003이 정본이다. portal은 페이징 필요 문구를 표시하고 다음 페이지 요청 또는 페이징 그리드 등의 표현/조작을 선택한다. agent는 현재 권한/정책·원 조회 연결을 검증해 결과를 반환하며 원 SQL·물리명·비밀값을 portal에 맡기지 않는다"
    - "같은 조회의 후속 페이지 요청은 원 결과에 연결된 별도 조회 요청으로 처리하고 종결 원 턴의 계획/스텝을 재개하지 않는다. 페이지 이동만으로 새 모델 호출·계획 확인을 만들지 않으며 페이지 일부를 전체 결과로 모델 전송·집계·내보내기하지 않는다. 요청/결과/실패·개인 실행 제어와 보존은 NFR-002·REQ-011을 따른다"
    - "계약은 특정 그리드·차트·지도 라이브러리의 설정 객체를 직접 노출하지 않는다. 라이브러리를 바꾸는 일은 portal 어댑터 안에서 끝나야 한다"
    - "새 표현 블록은 계약 버전과 함께 추가한다. 소비자가 모르는 블록은 버리거나 전체 응답을 실패시키지 않고 원문 대체 표시가 가능해야 한다"
    - "철회된 지식 업무 의미 영향 검토 상태/경고를 계약에 만들지 않는다. 실제 권한·입력/기술 검증 실패와 사용자 안내는 소유 계약을 따르며 지식 식별자·정확 리비전·공개 객체명은 보호된 실행 감사에만 보관한다"
    - "**호환 불가 변경(주 버전 상승)은 직전 주 버전을 병행 지원하지 않는다.** 전환 시점부터 agent 는 새 주 버전만 받고, 구 주 버전 요청은 NFR-026 대로 **지원하지 않는 버전으로 실패 처리**한다. 영향받는 작업흐름의 베이스라인은 다시 연다"
    - "**구 계약을 들고 있는 portal 은 재접속시킨다.** portal 은 주 버전 불일치 실패를 버전 불일치로 판정해 화면을 다시 불러온다 — PRC-05-03 의 두 갈래(`재접속` · `한시 유지`) 중 **재접속이 기본**이다. 작성 중이던 입력과 화면 상태는 잃는다"
    - "**이 규칙은 서버 대수와 무관하다.** 단일 인스턴스여도 **브라우저에 이미 내려간 portal**은 구 계약으로 호출하므로, 서버를 한꺼번에 바꾸는 것으로는 구 계약 호출이 사라지지 않는다 — 병행 지원의 실제 이유는 인스턴스 수가 아니라 **클라이언트가 이미 받아 간 계약**이다"
  auxiliary_fallback: "REQ-602의 주 추론 일시 장애·선택 불가 복구·보조 대체 처리 중/최종 실패를 구분하는 사유와 허용 후속 동작을 agent가 제공한다. Portal은 후보를 선택하거나 공급자 원문 오류를 해석하지 않는다. REQ-106의 후보 공급 경로 사전 안내·동의 버전/범위와 추가 확인을 제품 계약으로 전달하며 실제 경로 공개명 이외의 비밀·원문 예외는 내보내지 않는다. 실패 안내만으로 주 추론 선택 해제·새 턴/업무 재전송을 만들지 않는다. 상세 스키마·메시지 키·경합 시험은 소유 P3에서 확정한다"
  local_failure:
    ownership: "agent 응답을 받을 수 없거나 표시할 수 없는 통신 단절·응답 해석/렌더링 실패·미지원 계약의 클라이언트 안내는 portal이 소유한다. 기존 업무 문구를 고쳐 쓰지 않고 별도 등록된 MSG 키와 label()로 안내하며 REQ-020의 정형 문구 언어 정책을 따른다. agent 접속이 실패해도 이미 배포된 정형 안내를 표시할 수 있어야 한다"
    state: "마지막 확인한 업무 상태·시각과 현재 조회/표시 실패를 구분한다. 로컬 오류만으로 턴 성공·실패·중단, 승인·거절·만료를 확정하거나 승인 기한을 연장하지 않는다. 인증·권한·계약 버전 오류를 서버에서 확인한 경우에는 그 계약의 접근 차단·재접속 규칙을 적용한다"
    retry: "재조회·화면 재표시와 REQ-020의 표현 재생성은 새 업무 실행과 구분한다. 로컬 오류 재시도로 업무 API·승인 명령을 자동 재전송하지 않으며, 승인 제출 응답 유실은 현재 승인/실행 상태를 조회해 대조한다. 원문 대체 표시는 현재 권한으로 공개된 안전한 원문에 한정한다"
    verification: "agent 무응답·표현 파싱 실패·승인 제출 응답 유실에서 등록 안내와 마지막 확인 상태를 표시하고, 업무 호출/승인 효과의 중복 생성 및 기한 변경이 없는지 계약 시험으로 검증한다"
  note: "@defer G3 — integration 작업흐름에서 envelope·상태·오류·표현 블록의 정확한 스키마와 portal의 버전 불일치 판정 지점을 확정한다. NFR-002·REQ-011의 후속 페이지 요청/계속 정보·조회 기준·유효 기한·실패/미지원·중복 방지 계약과 agent/portal 계약 시험을 함께 설계한다"
  traces_to: [REQ-602, REQ-106, REQ-009, REQ-011, REQ-020, REQ-027, REQ-040, NFR-002]

# ── portal 진입 경로 · 레거시 딥링크 ────────────────────────
