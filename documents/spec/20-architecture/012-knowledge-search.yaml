knowledge_search:
  id: ARCH-060
  rules:
    - "지식 검색은 **태그 기반 검색을 기본**으로 한다. agent 가 질의에서 키워드를 추출해 지식에 부여된 태그와 매칭한다"
    - "태그 정의·지식별 태그 ID 매핑의 소유와 승인 경계는 REQ-607을 따른다. 태그 검색은 지식에 매핑된 ID의 승인·활성 검색 텍스트·동의어를 사용하며 태그 텍스트 수정으로 지식 리비전·매핑을 변경하지 않는다"
    - "**임베딩 사용 여부는 시스템 설정으로 켜고 끈다.** 켜면 태그 검색과 벡터 검색을 **함께 수행하고 결과를 병합**한다. 끄면 태그 검색만 수행하며 임베딩 모델 연동 없이도 시스템이 동작한다"
    - "**벡터 검색만 단독으로 쓰는 구성은 두지 않는다** — 태그 검색이 항상 동작해야 임베딩 모델 장애나 비용 한도 초과 시에도 지식 검색이 유지된다"
    - "임베딩을 끈 구성에서는 사용자가 태그에 없는 표현을 쓰면 지식을 찾지 못한다. 이를 보완할 수 있도록 태그에 **동의어를 등록**할 수 있어야 한다. **이 구성에서는 태그 품질이 곧 검색 품질이다**"
    - "설정을 끈 상태에서 켜면 기존 지식 전체에 대한 임베딩이 필요하다"
    - "**벡터는 AI 전용 DB 의 pgvector 확장에 둔다**(CON-001 · ADR-005). 별도 벡터 저장소를 두지 않으므로 지식 본문과 벡터가 **같은 트랜잭션·같은 백업·같은 복구 지점** 안에 있고, 임베딩을 끈 고객사에는 남는 구성요소가 없다"
    - "검색된 지식이 컨텍스트에 주입될 때는 **참조 공개 인터페이스 판정**을 거치고, 주입된 지식의 참조 인터페이스는 카탈로그 주입 대상에 합류한다"
    - "REQ-021의 순서에 따라 관련 지식 검색과 REQ-303의 직접/예제 경유 카탈로그 합산을 먼저 수행한다. 현재 권한 안에서 필요한 객체·컬럼·관계를 선별한 뒤 소속 데이터소스별 실행으로 나누며, 선행 데이터소스 선택으로 지식 후보를 제한하지 않는다. 단계별 필수 근거 보존·실패 처리는 REQ-021을 참조한다"
    - "지식의 API·커스텀 도구 매핑별 용도·사용 조건과 공통 입력 계약의 역할 경계는 REQ-303·REQ-608·REQ-612를 따른다. 공통 호출 명세를 지식 본문에 복제하지 않으며 업무 전체 절차는 본문에 두고 유효 매핑과 해당 설명을 함께 전달한다. 참조 API의 명세 제공과 입력 확보용 조회·호출은 현재 권한·활성 판정을 별도로 통과해야 한다. API 계약 내용 버전은 REQ-108로 선택하고 실제 API 명세를 지식 본문에 복제하지 않는다"
    - "Agent는 **승인·활성화된 반영 세트의 지식 리비전과 참조 매핑만** 검색·컨텍스트 주입에 사용한다. 후보·반려 세트와 그 리비전은 태그·벡터 어느 검색 경로에서도 제외한다"
    - "반영 세트의 활성 포인터 전환은 AI 전용 DB 트랜잭션 하나로 처리해 세트 안의 지식·카탈로그·예제 쿼리·매핑이 부분 활성화되지 않게 한다. 턴 안의 지식·카탈로그 내용과 참조 구성 버전 고정은 REQ-108을 따른다. 검색·주입 때마다 현재 사용자·대상·자산 권한을 확인하며 내용 버전 고정으로 과거 접근 권한을 재사용하지 않는다. 최초 필요 시 판정한 스냅샷·리비전을 감사 이력에 연결하며 턴 시작 일괄 고정으로 별도 정의하지 않는다"
  undecided: "두 검색 결과의 병합 규칙(중복 제거·순위 결합·컨텍스트 주입 건수 상한)과 키워드 추출 방식은 상세 설계에서 확정한다"

