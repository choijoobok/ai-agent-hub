# admin P2 계약 — 2026-10-27 G2 사용자 승인. 물리 상세 설계와 구현 완료는 별도다.
module_boundaries:
  - id: ARCH-028
    rule: "admin은 자산의 내용 버전·현재 효력·연결 참조를 제공하고 agent는 이를 실제 실행 직전에 검증해 사용한다. 내용 버전을 고정하는 것과 현재 권한을 고정하는 것은 다르다"
    reqs: [REQ-105, REQ-108, REQ-301, REQ-303, REQ-305, REQ-306, REQ-403, REQ-601, REQ-604, REQ-608, REQ-612, REQ-603]
    ownership: "ARCH-011·ADR-013의 공개 계약을 사용한다. admin 내부 저장소를 agent·portal에 공개하지 않으며, UI가 보낸 자산/연결 식별자를 그대로 실행 권한으로 사용하지 않는다"
    asset_versions:
      stable_id: "지식·예제·카탈로그·API·도구는 변경되지 않는 자산 식별자와 내용 리비전을 구분한다. API 연결은 안정된 API 식별자를 참조하고 표시명·주소 복사로 관계를 대신하지 않는다 지식→태그/카탈로그/예제/API/도구는 REQ-303.reference_mapping의 안정 ID 연결이며 운영 매핑에 외부 리비전을 고정하거나 자동 동기화하지 않는다."
      selection: "REQ-108에 따라 턴에서 처음 필요해진 자산의 유효 내용 리비전을 선택하고 실행 근거에 기록하며 같은 턴에서 유지한다. 단순 내용 갱신이나 다음 스텝/액션 진입만으로 사용 중 버전을 바꾸지 않는다. 다만 장기 대기 후 기준 시간을 넘긴 이어가기의 내용 재선택은 REQ-108을 따르며, 바뀐 실행 내용·대상에 과거 승인을 재사용하지 않는다. 중단 후 새 실행 시도는 REQ-013에 따라 현재 내용을 새로 선택한다"
      current_checks: "선택한 내용의 참조 정합성과 현재 공개 상태·사용자 권한·신원 매핑·마스킹/전송 정책을 필요한 접근 시점마다 판정한다. 버전이 보관되어 있다는 사실은 폐지·회수된 권한을 계속 사용할 근거가 아니다"
      candidates: "관리 화면의 로컬 전체 편집본과 현재 적용본·과거 HIST를 구분한다. 실제 직접 저장의 현재 권한·기대 버전·필수 기술 참조를 원자 검증하고 현재값/리비전·전체 이력을 함께 반영한다. 외부 안정 ID 매핑의 리비전 상승만으로 지식 변경을 강제하지 않는다."
      api_change: "API/카탈로그/예제/태그/도구 변경은 원 소유 현재 권한·기대 버전·기술 참조 검증과 전체 직접 저장/이력을 사용한다. 현재 사용처/참조 경로 조회만 제공하고 연결 지식 본문 수집·의미 영향 판정/보완 작업은 제품 절차로 두지 않는다. 고객사 API 공동 오픈과 실제 실행 사용자 확인은 유지한다."
      history: "요청·판정·반영·실행은 사용한 자산/참조 리비전으로 연결한다. 이력 재현은 과거 판단 근거 조회이며 과거 권한·자격증명을 이용한 재실행이 아니다. 보존 범위는 REQ-107·109를 따른다"
      storage: "REQ-601.management_storage. 적용본은 본 테이블, 제출/반려본은 _SNP, 정확 과거 적용 리비전은 _HIST 공개 조회로 읽는다. 실행·장기 대기·다른 자산의 참조 등록과 파기는 동일 보호 경계에 참여하며 참조 중인 세트를 파기하지 않는다."
    api_connection_resolution:
      inputs: "API/계약 리비전·안정 제공 시스템·API의 명시 연결 ID·현재 적용 YAML 세대/정확 연결 정의·현재 자산 사용 설정을 사용한다. 기본 연결 모드는 없다."
      order: ["REQ-601.asset_availability의 수동 사용과 유효 적용본/필수 참조를 현재 기준으로 검사한다. 저장된 정의/캐시/워크플로우 버전도 우회하지 못한다.", "정확 연결 ID가 해당 시스템의 현재 YAML 구성에 속하고 실행 노드에 정상 로드됐는지 확인한다. 누락/소속 불일치/확인 불가는 외부 요청 전 오류로 차단한다.", "상대 경로·현재 인증/신원 계약으로 목적지를 해석하고 REQ-105.approval_target_binding의 실제 업무 실행 승인/값을 대조한다. 사용자·LLM이 주소/보호 헤더를 덮지 못한다.", "검증한 동일 불변 연결 객체를 전송에 사용한다. 다른 연결/기본값/DB의 옛 표시 주소로 자동 대체하지 않는다."]
      approval_record: "API/계약·제공 시스템·명시 연결·불변 적용 설정·신원 매핑 버전과 비밀 없는 실행 대상 근거를 연결한다. 비밀/비밀 해시는 카드·일반 감사로 내보내지 않는다."
      change: "연결/신원 의미 변경과 재승인은 REQ-105를 따른다. 기술 설정 삭제/복구는 수동 사용 값을 변경하지 않고 이미 전송한 원 업무를 재전송/미실행으로 만들지 않는다."
      credential_rotation: "동일성 예외에는 변경 전후의 적용 설정 식별자와 목적지·테넌트·인증 방식·실행 주체/권한 범위가 같다는 검수 근거가 필요하다. 비밀 교체를 수행한 운영 주체의 검증 근거를 서버가 확인할 수 없으면 기존 승인을 유지하지 않는다. 이름이나 비밀 해시만으로 동일성을 증명하지 않는다"
    deployment_contract:
      active_definition: "배포 연결의 현재 로드 정의와 배포 파일의 다음 기동 예정값을 구분한다. admin에는 참조 가능한 식별자와 비밀을 제거한 적용 정보만 제공한다. API 연결은 REQ-604.connection_display의 읽기 전용 Base URL·인증 방식·표시 상태를 동일 불변 로드 정의의 node/boot/appliedSettings/observedAt 근거와 함께 제공하며 관리 DB·이력에 배포 정의나 연결 비밀의 사본을 만들지 않는다"
      generation: "연결의 불변 적용 설정 식별자는 재기동/노드가 달라도 같은 배포 정의를 구분할 수 있어야 한다. 실행 노드가 승인 근거와 현재 효력을 확인하지 못하면 호출하지 않는다. 서로 다른 설정을 같은 식별자로 선언하지 않도록 배포 검증이 필요하다"
      datasource: "DB 연결은 ARCH-030의 기동 시 로드·재기동 반영을 따른다. 참조 변경 뒤에는 실제 로드 정의를 다시 확인한다"
      rollout: "2026-10-27 사용자 방향은 ADR-028의 계획 배출 후 순차 재기동이다. API/모델 연결도 기동 시 로드한다. 대상 노드의 신규 접수·새 작업 배정을 닫고 맡은 실행이 완료되면 재기동·검수한 뒤 다음 노드로 진행한다. 나머지 노드는 서비스를 계속한다"
      compatibility: "순차 배포 중 허용한 구·신 세대/연결 리비전은 공존할 수 있다. 세션·공유 스키마·실행 상태·메시지/설정·공개 계약과 진행/대기 시도의 고정 연결이 호환되는지 확인한다. 배출 완료한 구 노드의 재가입·신규 배정을 차단한다"
      incompatible: "비호환 연결은 영향 경로의 구 실행이 향후 송신할 가능성까지 제거한 뒤 새 효력을 연다. 계약 주 버전·세션 형식·파괴적 스키마·임베딩/키 교체의 기존 별도 전환 규칙을 유지하고 중지 구간을 무중단으로 표시하지 않는다"
      control_design:
        status: "2026-10-27 ADR-028을 구체화한 P2 설계 초안·미구현. 노드별 배정 제어는 업무 연결의 온라인 동적 교체와 별개다"
        ownership: "integration이 배포 허용 세대·노드 기동 식별자·배정 상태·검수 근거를 관리하고 agent/admin 작업 실행부가 같은 배정 경계에서 집행한다. 공유 제어가 필요하면 기존 AI 전용 DB를 사용하며 새 브로커/분산 락 서버를 도입하지 않는다. 물리 구조·명령은 P3 대상이다"
        transitions: ["기동/검수 중: 신규 배정은 닫힌다. 의도한 배포 세대·실제 로드 연결·설정 정의·세션/공유 상태 호환성·필수 연결과 잔여 용량을 확인한다", "서비스 중: 검수한 기동 식별자·배포 세대에만 신규 접수/배정을 연다. 프로세스 재시작이나 오래된 명령 재전송으로 자동 재가입하지 않는다", "계획 배출 중: 노드 배정 상태를 먼저 바꾸고 로드밸런서 신규 유입을 차단한다. 늦게 도착한 새 요청·예약·재개는 실행하지 않고 다른 가용 노드의 정상 접수 경로로 보낸다. 비멱등 명령을 클라이언트가 무조건 재전송하게 하지 않는다", "배출 완료: 아래 completion의 동일 기동 구간 근거를 확인한 뒤 종료 신호를 허용한다. 정상 완료·실패·취소·결과 불명은 원래 업무 의미와 이력을 유지한다", "새 프로세스 검수: 다시 신규 배정을 닫은 채 검수하고, 성공 후 열어 다음 노드 배출을 시작한다. 실패하면 다음 노드를 내리지 않는다"]
        admission: "새 작업 획득과 배출 상태 변경을 같은 노드 기동 식별자·배정 버전으로 직렬화한다. 로드밸런서 제외만으로 스케줄·내부 큐·사용자대기 재개가 막혔다고 판단하지 않는다. 배출 중 기존 실행의 다음 스텝·개인 점유/실행 점유 갱신·중단 입력·종결 저장은 계속한다"
        queued_work: "배출 전에 이미 접수한 메모리 큐 작업은 목록을 고정해 원 노드에서 마칠 배출 대상으로 센다. 이 한정된 목록의 시작은 새 접수와 구분하되 현재 권한·개인 순서/한도를 재검증한다. 배출 뒤 큐에 새 항목을 붙이지 않는다. 다른 노드로 옮기는 미시작 요청은 영속 접수·단일 획득·순서·취소 계약이 있어야 한다"
        completion: "진행 실행·고정한 기존 큐·전송 결과를 기다리는 호출·종결/감사 저장을 동일 기동 식별자로 대조한다. 이후 전송 가능한 작업이 없고 필수 결과/감사 저장이 확정되어야 한다. HTTP 요청 수 0이나 마지막 모니터링 표본으로 대신하지 않는다. 결과 불명은 성공으로 바꾸지 않고 확인 경로를 남긴다"
        waiting: "사용자대기는 공유 상태에 남기며 배출 완료 수에서 제외한다. 다른 노드는 해당 요청·현재 권한·미만료·고정 모델/연결 지원·개인 한도·단일 점유를 검증해 재개한다. 종결 시도와 만료 점유는 인계하지 않는다"
        failure: "검수/배정 제어의 근거를 읽지 못하면 새 배정을 열지 않는다. 기존 실행은 현재 유효 점유와 원래 실패/중단 규칙을 따른다. 배출 취소로 다시 열 때도 세대·권한·연결 유효성을 재검수한다. 장애 복구가 구 세대의 자동 재가입이나 업무 재전송을 허용하지 않는다"
        operations: "고객 환경의 기존 배포 도구/보호된 운영 명령에서 예상 기동 식별자·현재 상태를 대조한 배출/개방을 수행한다. 공개 익명 제어와 단순 파일 변경에 따른 자동 개방은 허용하지 않는다. 운영자 권한·감사·상태 확인·명령 재시도의 정확한 인터페이스는 P3에서 정한다"
        proof: "두 노드에서 신규 접수/배출 경합·기존 큐·장기 작업·사용자대기·설정 혼재·신 노드 실패·구 노드 자동 재시작·중단 입력/결과 저장·롤백을 재현한다. 접수 가용성·중복/누락·로그인 유지·잔여 처리 용량을 각각 판정한다"
      pending: "@defer P2 integration — control_design과 소유 실행 경로의 배정·저장 경계를 대조하고 실제 배포 환경에서 사용할 운영 수단과 검수 시나리오를 확인한다. @defer P3 노드/기동/배정 상태의 물리 구조·권한·명령·계약 시험을 명세한다. 현재 소스의 구현 보장으로 표현하지 않는다 @defer P3 integration — FEAT-001.integration_public_contract·FEAT-004.module_contract.connection_owner의 선택 ID 정확 조회·node/boot/appliedSettings/observedAt·지원/검수와 실제 전송 동일성을 공개 계약으로 연결한다. integration P3 배포 연결 계약 검토와 admin G3 전에 교차 확인한다"
    verification: ["API 명시 연결 변경, 동일 연결명 내용 교체, 신원 매핑 회수, 노드별 적용 버전 불일치에서 과거 승인으로 다른 대상에 전송하지 않는다", "검증 직후 연결 정의를 교체해도 실제 전송은 검사한 정의만 사용하거나 거부된다. 전송 직전 현재 권한·효력 검사를 별도로 통과해야 한다", "지식 로컬 편집 중 API 변경, 필수 참조 폐지, 동시 직접 저장에서 오래된 후보의 부분 반영과 잘못된 참조를 거부한다", "사용 중 내용 버전은 유지하되 권한 회수는 다음 접근에 적용된다. 과거 실행을 조회해도 현재 비밀이나 권한 밖 내용을 노출하지 않는다"]
