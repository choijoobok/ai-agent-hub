  - id: NFR-016
    category: 비용
    title: "월별 공급사 사용 대조와 보정 근거 제공"
    requirement: "Hub는 월별 사용량·공급 경로·모델·effort·계량 단위·사용자 및 시스템 귀속을 집계·다운로드하고, 관리자가 공급사가 제공한 월별 사용 토큰 총량과 사용분 비용을 대조값으로 기록해 계획 1M 단가와의 괴리율과 수동 보정 참고 근거를 확인할 수 있어야 한다. 용도·실제 공급 경로/모델/effort별 사용자 귀속 실적은 REQ-613의 다음 달 단가 자동 초안에 스냅샷으로 제공한다"
    detail: "대조값은 토큰 풀 보정용 관측 자료이며 청구서·전표·회계 정산을 처리하지 않는다. 공급사 청구서의 형식, 약정 할인·통화·세금 반영, 전표 처리와 최종 정산은 재경·회계의 업무다. 고정 요금·세금·일회성 할인처럼 사용 패턴 비교를 왜곡하는 값은 대조 근거와 함께 사용 패턴 대조 표본에서 분리할 수 있다. 최근3개월 자동 보정률 제안은 제공하지 않으며 실제 월 보정률은 SCR-021에서 기본1.0 또는 관리자 수동 근거로 확정한다"
    measurement: "월별 대조값·괴리율·실적 스냅샷 완전성 · 표본에서 분리된 월/호출과 근거 · Hub 기록과 공급사 토큰 총량 차이"
    source: "**Hub 집계는 LLM 사용량 기록에서**, 공급사 사용 토큰·사용분 비용 대조값은 관리자가 월별로 기록한 근거에서 온다. 공급사 청구서 원문과 회계 처리 자료는 Hub의 저장·처리 대상이 아니다"
    test_case: null
    target: null
