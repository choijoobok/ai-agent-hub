nfrs:
# ── 대량 조회 방어 ──────────────────────────────────────────
  - id: NFR-001
    category: 성능
    title: 페이지별 조회 강제 상한과 실행 자원 제한
    configuration_contract: '2026-10-27 사용자 승인: 초기 기본값·허용 범위와 호출별 적용은 ARCH-033.query가 정본이다. 시간/크기 초과의 실패·행 초과의 정상 페이지 구분을 적용한다. 수치 확정은 이 카드의 성능 목표 실측을 대신하지 않는다'
    query_constraint_boundary: REQ-611.query_constraints의 필수 조건 충족은 비용 추정·계획 확인·승인과 별개인 실행 전제다. 조건 충족이 낮은 실행 비용을 보장하지 않으므로 이 카드의 행·시간·결과 크기 상한을 계속 적용한다
    requirement: 최초 및 후속 페이지 요청마다 최대 반환 행 수·실행 시간·결과 크기 제한을 agent가 강제한다. 행 상한은 한 페이지에 전달할 수 있는 최대 건수이며 이를 넘는 전체 결과는 NFR-002·003에 따라 portal에서 페이지로 이어 조회한다. 규모·정확한 전체 건수·비용의 사전 추정은 기본 실행 전제가 아니며 별도 COUNT를 필수로 수행하지 않는다. 필수 조회 조건과 현재 권한은 실행 전에 검증하고 계획 확인으로 상한을 면제하지 않는다
    measurement: 페이지 행 상한 초과 감지율 · 시간/크기 제한으로 실패한 조회 비율 · 최초/후속 페이지별 실행 시간 분포(p50·p95·p99)
    source: agent의 최초/후속 페이지 요청·조회 실행 기록을 원 조회/결과와 연결한다(ARCH-013). 실행 전 조건/권한 거부, 실제 행 상한 초과 감지, 시간/크기 제한 실패와 종결 시간을 구분하고 후속 요청을 원 조회의 성공 사실로 덮지 않는다
    test_case:
      - TC-0201
      - TC-0202
      - TC-20490
    target: null
    note: 반환 행 제한은 원천에서 읽거나 정렬·집계·결합하는 작업량의 상한이 아니다. 필수 조회 제약·개별 실행 시간/결과 크기·원천 자원 통제를 함께 적용한다. 운영 DB 부하가 우려되는 고객사에는 별도 DW 경유를 권장한다. 실행 계획(EXPLAIN) 기반 비용 검토는 SQL 생성 뒤 실제 실행 전의 선택 기능으로 별도 검토하며 기본 계획 확인/실행 전제에 넣지 않는다. 도입 시 데이터소스별 지원·추정 단위/임계치·실패 처리를 설계하고 실제 실행하는 분석 호출을 사전 추정으로 사용하지 않는다
    decision: 2026-10-26 사용자 요청으로 규모 사전 추정을 기본 전제에서 제외하고 행 상한 초과 시 portal이 페이징 조회를 처리하도록 변경한다. 기존 턴 전체 시간/토큰 상한 없음·모델 입력/전송·내보내기 제한은 유지한다
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
  - id: NFR-002
    category: 성능
    title: "페이지 상한 초과 감지와 portal의 후속 페이지 조회"
    requirement: "agent는 페이지 크기와 서버 최대 행 상한 안에서 결과를 반환하고 다음 페이지 존재/조회 가능 정보를 제공한다. 상한 초과 시 NFR-003·REQ-011에 따라 portal이 페이징 필요 안내와 다음 페이지 요청 또는 페이징 지원 그리드를 제공한다. 구체 UI·컴포넌트는 portal이 결정하며 원천 조회·현재 권한·행 스코프·마스킹·상한 집행은 agent가 담당한다"
    why: "일반 목록을 한 페이지 상한 때문에 업무 시스템으로 돌려보내지 않고 필요한 페이지를 이어 볼 수 있게 한다. 정확한 전체 건수용 COUNT나 원 질의의 LLM 재실행 없이 진행하되 페이지 일부를 전체 결과로 표시하거나 다른 실행/전송/내보내기 제한을 우회하지 않는다"
    detection: "서버가 허용한 페이지 크기를 N이라 할 때 최대 N+1행을 받아 초과를 감지한다. 정상 종료하고 N행 이하이면 해당 위치에서 더 없음, N+1번째 행이 있으면 더 있음으로 판정하고 사용자에게는 최대 N행만 전달한다. 추가 한 행은 이번 응답의 감지용이며 다음 페이지의 실제 대상에서 누락시키지 않는다. 선택한 페이지 크기가 서버 최대 허용 건수보다 작으면 N+1행만으로 서버 최대 건수까지 넘었다고 주장하지 않고 현재 페이지 이후 결과가 있음을 알린다. 시간 초과·중간 오류·크기 제한 중단을 더 없음이나 정확한 건수로 보정하지 않는다. 전체 건수를 미리 세는 별도 COUNT는 기본 경로에 두지 않는다"
    response_contract: "원 조회/결과의 안정 참조·현재 페이지의 범위/건수·한 번에 전달 가능한 상한·상한 초과/다음 페이지 존재 여부·후속 조회 가능 여부와 허용된 이어가기 참조·유효 기한/사용 불가 사유·조회 기준/부분 범위를 제공한다. 전체 건수/총 페이지 수는 근거가 없으면 미상으로 두며 N+1행 감지로 정확한 전체 건수를 만들지 않는다. 원 SQL·물리명·비밀값을 페이지 요청용으로 portal에 넘기지 않는다. 물리 필드/전송 계약은 ARCH-019·REQ-009·011·027의 P3 설계를 따른다"
    continuation: "portal은 사용자의 다음 페이지 선택·그리드 탐색에 따른 명시 요청으로 허용된 이어가기 참조와 페이지 크기 등을 agent에 보낸다. agent는 소유 사용자·대화·결과·검증된 질의/조건·정렬·조회 기준과 요청을 대조하고 현재 권한·필수 조건·보존/유효 기한·NFR-001의 상한을 다시 검사한다. 클라이언트가 원 SQL·임의 조건·다른 사용자의 참조·상한보다 큰 크기를 넣어 실행 범위를 바꾸지 못한다. 같은 조회의 정상 페이지 이동은 새 LLM 호출이나 계획 확인을 요구하지 않는다"
    lifecycle: "후속 페이지는 원 조회/결과에 연결된 별도 조회 요청과 실행 이력으로 관리하고 종결된 원 턴의 계획/스텝을 재개하거나 완료 사실을 덮지 않는다. 원천 호출이 필요한 후속 요청의 개인 한도·순서는 NFR-023·REQ-036.page_requests의 독립 실행 단위 기준을 적용하고 접수/실행/실패는 REQ-107의 감사 원칙에 연결한다. 동일 요청 재전송은 중복 실행/표시를 방지하고 사용자 재접속·이력 열람만으로 미조회 페이지를 자동 실행하지 않는다. 요청·상태의 물리 모델은 P3에서 기존 계약과 정합되게 설계한다"
    consistency: "페이지 경계는 검증된 정렬·동률 구분 기준과 동일 조회 범위에 연결하며, 페이지마다 무관한 순서로 재실행해 중복/누락을 만들지 않는다. 결과 기준을 유지할 수 있는 조회/보존 방식을 사용하고 원천 변경·권한 변경·기한 만료로 같은 기준의 이어가기가 불가능하면 연속 결과처럼 섞지 않고 새 조회가 필요함을 안내한다. 조회 중 데이터 변경의 일관성 계약과 보존 결과 재사용·원천 후속 조회 선택은 P3에서 검증하며 화면에 보이지 않는 전체 수집이나 무기한 원천 연결 유지를 전제하지 않는다"
    scope_boundary: "페이지 순회는 결과 열람 기능이다. 전체 조회 조건을 바꾸는 정렬/필터 요청은 기존 페이지 연결을 무효화하고 검증된 새 조회 범위로 시작하며, 현재 수신 페이지에만 적용하는 정렬/필터는 그 범위를 표시한다. 여러 데이터소스의 원천별 잘린 페이지를 전체 입력처럼 결합·집계하지 않고 REQ-021의 정확한 결합/집계 기준을 충족한 결과에서만 페이지 경계를 정의한다. 모델 전송·전체 집계/후속 액션·엑셀은 각 목적의 완전성·권한·동의·상한을 따르고 페이지를 자동 순회해 우회하지 않는다"
    measurement: "첫/후속 페이지의 행 수·상한 초과율·조회 지연·결과 크기 · 중복/누락·만료/권한 거부·후속 조회 실패 건수"
    source: "원 조회/결과와 연결된 페이지 요청·실행·반환 기록. 결과 크기는 직렬화 직후 값을 기준으로 하며 압축 전후·표시 행과 감지용 추가 행·실제 원천 호출을 구분한다"
    test_case: null
    target: null
    implementation: "서버의 결과 행 제한과 읽기 중 N+1행 감지·시간/크기 검사를 적용한다. fetch size는 전송 묶음 힌트이므로 총 행 상한으로 쓰지 않는다. OFFSET은 건너뛸 위치이지 행 상한이 아니다. 데이터소스/API별 후속 페이지 방식·결과 보존/참조·정렬 보강·SQL 페이징 변환의 지원 범위는 P3에서 정한다. 변환이 필요한 경우 최종 SQL/바인딩까지 기존 권한·제약·SQL 검증을 통과해야 하며 portal이 SQL을 편집/실행하지 않는다"
    verification:
      - { case: "결과 0건·N건 미만·정확히 N건·N+1건 이상", expected: "정상 종료 여부와 추가 행으로 끝/다음 페이지를 구분하고 최대 N행만 전달한다. 정확히 N건을 초과로 오인하지 않는다" }
      - { case: "N+1번째 감지 행과 최대 허용 건수보다 작은 페이지 크기", expected: "감지 행을 다음 페이지 대상에서 빠뜨리거나 중복 표시하지 않는다. 작은 페이지의 더 있음만으로 서버 최대 건수 초과·정확한 전체 건수를 주장하지 않는다" }
      - { case: "N행을 받기 전 시간 초과·결과 크기 초과·원천 오류", expected: "부분 실패를 알리고 더 없음·정확한 전체 건수·정상 페이지 완료로 표시하지 않는다" }
      - { case: "상한 초과와 사용자 다음 페이지 선택", expected: "portal이 안내/조작을 제공하고 agent가 검증한 후속 페이지를 반환하며 매 페이지 LLM/계획 확인을 반복하지 않는다" }
      - { case: "상한보다 큰 페이지 요청·다른 사용자 결과 참조·변조 조건", expected: "agent가 현재 권한/원 조회 연결·상한을 검사하고 허용되지 않은 범위로 실행하지 않는다" }
      - { case: "정렬 동률·페이지 사이 원천 변경·조회 조건 변경", expected: "검증한 순서/조회 기준으로 중복·누락을 방지하거나 이어가기 불가를 안내한다. 다른 기준의 결과를 기존 페이지에 섞지 않는다" }
      - { case: "종결 원 턴의 다음 페이지·재접속·중복 요청", expected: "명시 페이지 요청만 별도 이력으로 실행하고 원 턴을 되살리거나 재접속/중복 전송으로 추가 실행하지 않는다" }
      - { case: "페이지 사이 권한 회수·결과/이어가기 참조 만료", expected: "과거 허용 이력으로 조회하지 않고 현재 거부/새 조회 필요를 안내한다" }
      - { case: "다중 원천 결합/집계·일부 페이지만 받은 모델 가공/엑셀", expected: "원천별 페이지를 전체 입력으로 오인하지 않고 실제 범위·완전성과 각 목적의 별도 상한을 검증한다" }
    open: "@defer P3 — 서버 최대/기본 페이지 크기·적용 시점은 ARCH-033.query의 사용자 승인값을 따른다. 데이터소스/API별 이어가기·정렬/동률·일관성·유효 기한·보존량, 별도 페이지 요청의 개인 제어/취소·감사/실패·재전송 계약을 설계한다. 구체 화면/그리드 선택은 REQ-011의 portal 설계에 맡기고 현재 system 페이징 구현을 자동 적용 완료로 보지 않는다"
  - id: NFR-003
    category: 성능
    title: "상한 초과 안내와 portal의 페이징 처리"
    requirement: "페이지 행 상한 초과는 전체 조회 거부가 아니라 다음 페이지가 필요한 정상 결과로 구분한다. agent는 NFR-002의 초과/다음 페이지 존재·조회 가능/불가 사유를 전달하고 portal은 REQ-011에 따라 사용자에게 페이징 필요를 알리며 다음 페이지 요청이나 페이징 지원 그리드 등으로 처리한다. 원천의 후속 조회 미지원·안정적 이어가기 불가·권한/기한 문제·실행 시간/결과 크기 제한 실패는 정상 페이징과 구분해 조건 보완·새 조회·업무 시스템 이용 등 가능한 대안을 안내한다"
    why: "단순히 한 페이지를 넘는 목록과 실제로 안전하게 처리할 수 없는 조회를 구분하고 사용자에게 다음 행동을 제공한다. 상한 초과만으로 업무 시스템 이용을 강제하지 않는다"
    measurement: "페이징 필요 안내 후 후속 페이지 성공/실패 비율 · 이어가기 불가 사유별 건수 · 조건 보완/새 조회 전환 건수"
    source: "원 조회/결과와 연결된 초과 판정·portal 안내용 응답·후속 페이지 요청/결과 기록. 페이지 끝·실패·미지원·만료를 구분하며 화면 표시 성공과 원천 조회 성공을 혼합하지 않는다"
    test_case: null
    target: null
  - id: NFR-004
    category: 성능
    title: "읽기 전용 계정과 별도 리소스 한도"
    requirement: "조회는 읽기 전용 계정과 별도 리소스 한도로 수행해 업무 시스템 영향을 억제한다"
    measurement: "업무 DB 의 Hub 세션 CPU·IO 점유율"
    source: "**고객사 모니터링 도구다 — 우리가 재지 못한다.** 업무 DB 안의 세션 점유는 Hub 밖의 값이라 고객사에 제출을 요청해야 한다(CON-015 와 같은 성격의 협의 항목). **우리 쪽에 값이 없다는 사실 자체를 기록한다** — 빈칸과 *문제 없음* 은 다르다"
    test_case: null
    target: null
  - id: NFR-005
    category: 성능
    title: "저장된 조회의 유량 제한"
    requirement: "**사용자당 저장 개수 상한** · **사용자당 대시보드 수 상한** · **대시보드당 위젯 수 상한** · **자동 실행의 동시 실행 수 제한과 결과 캐시 TTL** · **같은 위젯의 연속 실행 최소 간격(쿨다운)** · **실패 후 사용자·저장 조회 ID 단위 재시도 대기시간**(REQ-204). 조회 상한은 채팅 조회와 동일하며 **완화하지 않는다**"
    why: "저장된 조회는 토큰을 소모하지 않아 **쿼터가 유량 제한 역할을 하지 못한다.** 채팅 조회에서는 토큰 한도가 자연스러운 브레이크였지만, 조회 버튼은 부담 없이 반복 클릭된다"
    measurement: "사용자·기간 단위의 조회 실행 횟수와 누적 반환 행 수 (임계 초과 시 관리자에게 알린다)"
    source: "**저장된 조회의 실행 기록.** 채팅 조회와 같은 기록에 두되 **경로를 구분**하는 것이 전제다(NFR-017 이 그 비율을 본다). 알림은 집계가 임계를 넘을 때 낸다"
    test_case: null
    target: null
    hard_rule: "**결과 캐시는 DB에 저장하지 않는 메모리 캐시로 한정하고 TTL 안에서만 산다**(2026-09-28 사용자 결정) — 영속 캐시는 평문 업무 데이터의 저장 사본이 되어 PRN-07의 저장 사본 마스킹 원칙을 우회한다"
    note: "**하드 상한은 실측 후 정한다.** 2026-10-27 사용자 승인·ADR-029에 따라 측정 순서·확정 시점·미설정 활성화 차단은 ARCH-033.measurement_required.sequencing을 따른다. @defer 최초 운영 활성화 전 — 수치·허용 범위·시험 근거를 확정한다"
    roadmap: RM-P1

# ── 응답성 ──────────────────────────────────────────────────
# **넷이 정하는 것은 목표가 아니라 재는 방법이다**(ASM-002). 그래서 target 은 비어 있고,
# G2 가 볼 것은 *얼마나 빠른가* 가 아니라 **재고 있는가** 다.
  - id: NFR-006
    category: 응답성
    title: "응답성의 구간 정의와 시각 기준점 — 무엇을 재면 응답 시간인가"
    requirement: "턴 하나의 응답성을 **세 구간**으로 나누어 잰다 — ① **접수 확인**(질의 수신 → 접수 응답 반환 · TS-01) ② **첫 진행 표시**(질의 수신 → 사용자 화면의 상태가 처음 바뀐 시점) ③ **최종 응답**(질의 수신 → TS-06 완료). **MET-03 이 말한 「첫 응답」은 ②이며 ①이 아니다** — 접수 확인은 접수됐다는 사실만 알릴 뿐 사용자의 기다림을 끝내지 않는다"
    hard_rule: "**기준 시각은 agent 가 질의를 수신한 서버 시각 하나다.** 클라이언트 시계를 t0 로 쓰지 않는다 — 폐쇄망 PC 의 시계를 맞출 방법이 없고, 어긋난 t0 는 음수 지연을 만들어 분포 전체를 오염시킨다. 사용자 PC ↔ portal 구간은 이 값에 들어가지 않으며, 사용자가 실제로 겪는 지연은 NFR-007 이 폴링 주기와 함께 따로 잡는다"
    aggregation: "**정상 종결(TS-06)과 그 밖(TS-04 중단 · TS-05 실패)을 분리해 집계한다** — 실패가 빨리 끝날수록 평균이 좋아지는 착시가 생긴다. **평균을 지표로 삼지 않는다**: p50 · p95 · p99 · 최대를 함께 남기고 표본 수를 붙인다. **질의 유형(조회 · 실행 · 지식)별로 나눈다** — 성격이 다른 것을 한 분포에 섞으면 무엇이 느린지 볼 수 없다"
    measurement: "구간 ①②③ 각각의 소요 시간 분포(p50·p95·p99·최대) · 종결 상태별 · 질의 유형별 · 표본 수"
    source: "**턴 이력.** t0 는 agent 가 질의를 수신한 서버 시각이고, 구간 ②(첫 진행 표시)는 **폴링 응답이 상태 변화를 처음 실어 나른 시각**이라 서버 기록만으로는 잡히지 않는다 — NFR-007 과 같은 지점에서 함께 남긴다"
    test_case: null
    target: null
    note: "**같은 값을 두 번 재지 않는다** — 총 소요 시간의 측정은 유지하되 NFR-013에 따라 턴 전체 시간 상한으로 집행하지 않는다. 시간 예산 계산용 별도 테이블은 요구하지 않는다. 저장된 조회(LLM 미경유)의 실행 시간은 NFR-001이 갖는다"
    traces_to: [ARCH-015]
  - id: NFR-007
    category: 응답성
    title: "체감 지연은 폴링 주기가 지배한다 — 설정값과 함께 잰다"
    requirement: "portal ↔ agent 가 비동기 폴링이므로(ARCH-015) 사용자가 상태 변화를 보기까지의 지연은 **서버 처리 시간 + 다음 폴링까지의 대기**다. 그때 유효했던 **폴링 주기 설정값을 함께 기록**하고, 주기를 바꾸면 변경 시각을 남겨 앞뒤 분포를 가른다"
    why: "서버가 상태를 200ms 만에 바꿔도 주기가 5초면 사용자는 최대 5초를 기다린다. **그때 고칠 것은 코드가 아니라 설정이다** — 나누어 재지 않으면 엉뚱한 곳을 고치고, 서버 구간만 재면 사용자가 겪는 것을 재지 못한다"
    detail: "**폴링 부하를 같은 자리에서 본다** — 주기를 줄이면 체감은 좋아지고 요청 수는 늘어난다. 턴당 폴링 요청 수를 함께 집계해야 균형점을 근거로 고를 수 있다. **진행 표시가 한 번도 갱신되지 않은 채 끝난 턴은 따로 센다** — 폴링 사이에 종결된 짧은 턴과 표시 누락을 구분하고 REQ-006에 따라 최종 상태와 저장된 상세 이력·시간을 조회할 수 있어야 한다. 짧은 턴에 가짜 진행을 재생하지 않는다"
    measurement: "상태 변화 시각 → 그것을 실어 나른 폴링 응답 시각의 차 분포 · 유효 폴링 주기 설정값 · 턴당 폴링 요청 수 · 진행 표시 무갱신 종결 턴의 비율"
    source: "**폴링 요청 처리 지점.** 상태 변화 시각은 턴 이력이, 실어 나른 시각은 폴링 응답이 갖는다 — **두 기록을 잇지 않으면 이 값이 나오지 않는다.** 유효 주기는 admin 시스템 설정의 **변경 이력**에서 온다(그때 값이어야 한다)"
    test_case: null
    target: null
    traces_to: [ARCH-015]
    reqs: [REQ-006]
  - id: NFR-008
    category: 응답성
    title: "총 시간을 구성으로 분해한다 — 나누지 않으면 고칠 곳을 모른다"
    requirement: "턴의 소요 시간을 **LLM 대기 · 도구 실행(업무 DB 조회 / 업무 API 실행) · 지식 검색(임베딩 호출 포함) · 개인 순서 대기·시작 전 인계 구간 · 그 밖 자체 처리**로 나누어 기록한다. 스텝마다 **역할(주 추론 / 보조 판정)과 그때 쓰인 공급 경로·모델·effort** 를 함께 남긴다 — ARCH-040 이 비용 분석을 위해 이미 요구하는 기록이며, 응답성은 같은 기록의 시간 축을 쓴다"
    why: "총 시간만 있으면 *느리다* 만 남는다. 분해가 없으면 **개선 대상의 선택이 추측이 된다** — 모델을 낮출 일인지, 조회를 좁힐 일인지, 인스턴스를 늘릴 일인지가 여기서 갈린다"
    hard_rule: "벽시계 경과와 실제 누적 처리 시간을 모두 남긴다. 각 턴의 사용자대기/개인 순서/인계는 경과에는 포함하고 실행 처리 합계와 구분한다. 중단 후 명시 재시도는 새 턴의 접수·개인 한도·시작 조건 확인을 거치며 원 턴의 종결 시간/합계는 고정한다. 두 턴 사이 미실행 간격을 새 턴 처리 시간에 넣지 않는다. 연관 전체 기간/합계가 필요한 조회는 관계를 따라 계산하고 개별 턴 시간과 구분한다"
    calculation:
      processing: "누적 처리 시간은 실제 실행 구간으로 식별한 작업별 소요 시간을 합산한다. 완료·실패·중단·재시도·무효 회차/이전 시도의 실제 소비 시간을 포함하고 동일 작업/이벤트 재수신은 한 번만 센다. 진행 중 작업은 조회 기준 시각까지의 확인 가능한 구간을 더한다. LLM 응답 대기·DB/API 호출·임베딩/검색·실제 자체 처리는 작업 시간에 포함한다"
      exclusions: "개인 실행 순서 대기·시작 전 인계·사용자 응답/승인 대기·중단 후 새 시도 접수 전 간격은 누적 처리 시간에서 제외하고 별도 구간으로 기록한다. 실행/대기 구간의 전환을 연결하고 같은 시간을 양쪽 처리 합계에 중복 넣지 않는다"
      hierarchy: "합산할 실행 구간의 계층을 정해 상위 작업의 포괄 시간과 하위 작업 시간을 중복 더하지 않는다. 상위 작업 안의 실제 자체 처리도 빠뜨리지 않으며 기록 상세도와 합산 단위는 P3에서 정한다. 병렬인 서로 다른 작업은 각각 합산하므로 누적 처리 시간이 벽시계 시간보다 클 수 있다. 실제 경과는 접수/종결 시각 차로 구하고 합계로 대체하지 않는다"
      scope: "각 턴 합계는 그 턴의 전체 시도/회차에 실제 소비한 중복 없는 작업 시간이다. 명시 재시도 새 턴의 작업은 원 턴 합계에 자동 합산하지 않는다. 각 턴의 경과는 자체 서버 접수/종결 시각을 기준으로 계산하고 원 턴의 종결 값은 고정한다. 연관 전체 합산/기간은 원본·재시도 관계로 별도 조회하며 각 작업을 한 번만 집계하고 개별 턴 시간과 구분한다. 화면의 대표값·상세 표시는 REQ-006을 따른다"
    detail: "**되돌림으로 버려진 회차의 시간도 남긴다**(NFR-014) — 버려진 스텝도 사용자가 기다린 시간이고, 회차 상한을 조정할 근거가 거기서 나온다. **접수 후 처리 시작까지의 시간 정본은 NFR-023이며** 여기서는 턴 시간의 구성 요소로 그 값을 끌어 쓴다"
    measurement: "구간별 소요 시간 분포(p50·p95·p99·최대) · 역할별 LLM 대기 시간 · 스텝 수 대비 총 시간 · 버려진 회차의 누적 시간 · 벽시계와 누적 처리 시간의 차"
    source: "**스텝 기록** — ARCH-040 이 비용 분석을 위해 이미 요구하는 그 기록에 **시작·종료 시각을 함께** 남긴다. 실행 구간(LLM 대기 / 도구 실행 / 지식 검색 / 자체 처리)은 REQ-107의 모델 스텝과 연결된 작업/호출 종류로 가르며 모두를 LLM 스텝으로 세지 않는다. 개인 순서 대기와 시작 전 인계 구간은 스텝이 아니라 NFR-023의 턴/시도·대기 이력에서 가져오고 사용자 응답 뒤 이어가기 대기도 연결한다"

    test_case: null
    target: null
    traces_to: [ARCH-040]

  - id: NFR-009
    category: 응답성
    title: "멈춘 턴을 사용자가 알기까지 — 헛되이 기다린 시간도 응답 시간이다"
    requirement: "인스턴스 이상·점유 만료 때 서버가 중단(TS-04)을 확정하는 지연과 사용자가 그 상태를 확인하는 지연을 분리한다. 서버 회수의 설계 기준은 마지막 유효 점유 갱신부터 점유 유지 시간 + 만료 회수 배치 주기이며, 실제 배치 대기·처리/저장 지연을 별도로 관측한다. 이 기준을 사용자 표시 시간의 절대 상한으로 쓰지 않는다. 사용자 확인 구간에는 다음 유효 폴링까지의 대기·통신·표시 지연이 추가된다(NFR-007). 오프라인·백그라운드 조회 중지 시간은 별도로 구분하며 유한한 표시 상한을 보장하지 않는다"
    why: "**멈춘 동안에도 화면은 「처리 중」이다.** 자동 재개는 하지 않으므로(ARCH-070) 이 구간은 사용자가 아무것도 진행되지 않는 채로 기다리는 시간이며, 사용자에게는 응답이 늦는 것과 구분되지 않는다"
    measurement: "① 마지막 유효 점유 갱신 → 서버 중단 전이의 지연과 당시 점유 유지 시간·회수 배치 주기·실제 배치 처리 지연 ② 중단 전이 → 중단 상태를 실은 폴링 응답의 지연과 당시 유효 폴링 주기 ③ 수신 → 실제 표시의 클라이언트 경과 시간 및 확인 가능한 왕복 통신 지연. 브라우저·서버 절대 시각을 직접 빼지 않고 같은 시계의 구간을 연결한다. 표시 계측이 없으면 응답 전달 지연까지만 관측했다고 표시한다. 오프라인/조회 중지·재접속은 정상 온라인 분포와 분리하고, 만료 중단 비율·원 질의 새 턴 요청 비율을 함께 기록한다"
    source: "ARCH-070의 점유·회수 배치·턴 전이 이력과 NFR-007의 폴링 기록을 같은 턴/시도·상태 버전으로 연결한다. 각 구간에서 실제 적용한 설정값·판정 시각을 기록하고 현재 설정으로 과거를 판정하지 않는다. 화면 표시 구간은 portal이 계측하며, 서버 회수 초과와 통신·화면 조회 지연을 구분해 원인을 판단한다"
    test_case: null
    target: null
    note: "회수 건수·유형별 분해의 정본은 documents/design/turn-execution.md §7이다. 여기서는 서버 중단 확정과 사용자 인지의 구간 연결을 정의한다. 온라인 폴링 대기·오프라인 복귀·회수 배치 지연을 각각 주입했을 때 해당 구간만 늘고 다른 원인으로 오판하지 않는 검증을 후속 TC에 연결한다"
    traces_to: [ARCH-070]

# ── 토큰·비용 관리 ──────────────────────────────────────────
  - id: NFR-010
    category: 비용
    title: 사용량 기록과 토큰 풀 기준 단가
    requirement: Hub는 실제 LLM 호출의 **공급 경로·모델·effort·계량 단위별 수량과 계량 출처**를 사용자·기간별로 기록·집계한다. 공급 경로 응답이 입력·출력·캐시 토큰 수를 주면 그 값을 기록하고, 응답에 토큰 수가 없으면 Hub가 실제 전송 프롬프트와 수신 응답 본문을 당시 모델의 토큰 계산기로 산출한 입력·출력 **추정 사용량**을 기록한다. 월 총 토큰 풀 산정에는 REQ-613의 수동 턴 가정/당월 실적 스냅샷으로 산정·관리자 확정한 **USD/100만 토큰 기준 단가**, 대상 월의 수동 계획 통화/USD 환산율과 수동 보정률을 사용한다
    effort_rule: 월 산정 행의 용도·공급 경로/모델/effort는 실제 소비 구성 축이다(TRM-091). 단가 근거는 경로·모델·세부 계량 단위이며 effort에서 가격을 자동 추론하지 않는다. 해당 월의 단가/수량 스냅샷으로 소비 구성 차이를 반영하며 같은 차이를 옛3개월 보정률로 다시 곱하지 않는다
    detail: 계획 단가는 REQ-613.price_history_contract에 따라 관리자가 확인한 기본·할인·프로모션·인상 가격을 적용 시작일별로 관리하고 대상 월 1일 유효 가격을 사용한다. 공급사 가격/할인 조건·세금·구독료·배치·우선처리 정책을 자동 수집/판정하는 요금 엔진은 제공하지 않는다. 확인된 실제 캐시 구성은 당월 실적 스냅샷에서 사용하되 입력 총량과 캐시를 중복 가산하지 않고 서로 다른 캐시 과금 단위도 구분한다. 공급 경로가 준 계량값은 원문 그대로 기록하고, Hub 추정 사용량은 **공급사 계량값으로 표기하거나 덮어쓰지 않는다**. 추정 시에는 토큰 계산기 식별자·버전과 계산 대상(전송 프롬프트·수신 응답)을 함께 남긴다. 캐시 적중처럼 본문만으로 알 수 없는 단위는 추정 0으로 기록하지 않고 미상으로 남긴다. REQ-613의 월 산정용 턴/실적 시나리오 예상 비용만 계산하며 개별 실시간 호출의 예상 청구액은 계산하지 않는다
    hard_rule: 월 총 토큰 풀은 `floor(계획 가능 금액 ÷ (월 기준 저장 시 고정한 USD/100만 토큰 단가 × 대상 월 계획 통화/USD 환산율 × 월말 마감 수동 보정률) × 1,000,000)`으로 자동 산정하며, 안전 여유율은 적용하지 않는다. USD 기준 단가·소비 구성·기준 실적 스냅샷·단가 고정 근거·환산율/메모·원 기록·수동 보정률은 월별 산정 기준으로 이력을 남기며 단가/계획 변경을 이유로 과거 월의 토큰 풀·배정·사용량을 소급 재계산하지 않는다. 원 계량의 지연 정정은 기존 기록/중복 방지 규칙에 따라 원 사용 월에 남기되 고정 단가/확정 배정을 바꾸지 않는다. 이 값은 전사 예산·공급사 청구·회계 정산의 금액이 아니라 다음 달 토큰 풀을 계산하기 위한 운영 기준이다
    quota_count_rule: 개인 쿼터 차감값은 공급 경로가 **총 토큰 수**를 주면 그 값을 우선 사용한다. 총 토큰 수가 없고 입력·캐시·출력 등 분리 필드만 있으면, 공급 경로별로 등록한 **비중복 필드 조합**만 합산한다. 응답에 계량값이 전혀 없으면 실제 전송 프롬프트와 수신 응답 본문을 계산한 입력·출력 추정값을 합산하며, 이때 캐시는 별도 추정·가산하지 않는다
    unknown_unit_rule: 공급 경로 응답의 모르는 계량 단위는 0으로 기록하거나 조용히 버리지 않는다. 캐시가 입력 토큰에 포함되는지 여부와 비중복 조합은 공급 경로별 차감 규칙으로 명시하며, 새 공급 경로 또는 응답 계량 형식 변경은 이 규칙을 등록하기 전 **사용자 쿼터가 적용되는 호출로 허용하지 않는다**. 본문만으로 알 수 없는 캐시 등 단위는 미상으로 남겨 공급사 월 집계 대조의 차이 원인이 되게 한다
    measurement: 질의당 계량 수량(공급 경로·모델·effort·단위별)과 출처(공급사 계량·Hub 추정) · 추정 사용량 비율 · 캐시 적중률 · 계획 1M 기준 단가 · 공급사 실제 1M 비용과의 괴리율
    source: '**LLM 호출 기록(사용량)과 월별 계획 단가 기준 이력.** 계량 수량은 공급 경로 응답이 준 값 또는 당시 전송 프롬프트·수신 응답으로 Hub가 계산한 값이며, 호출에는 적용한 공급 경로별 쿼터 차감 규칙 식별자와 추정값의 계산기 식별자·버전을 남긴다. 월별 토큰 풀에는 당시의 계획 기준 식별자를 함께 남긴다'
    test_case:
      - TC-04513
      - TC-04514
      - TC-21190
    target: null
    traces_to:
      - ARCH-040
    invalidation_accounting: 응답 무효화·중단·화면 미표시와 실제 계량은 별개다. 공급자가 총량/출력에 포함해 제공한 추론 세부량은 중복 가산하지 않는다. 취소로 최종 계량이 유실돼도 확정 0으로 기록하지 않으며 전송/수신 본문으로 계산 가능한 값만 기존 추정 규칙으로 기록하고 미수신 출력·내부 추론 등 확인 불가분은 미상으로 남긴다. 늦은 공급자 계량과 원장 정정은 REQ-036·107의 중복 방지·근거 연결을 따르고, 공급사 월 대조와 토큰 풀 보정은 NFR-011을 따른다. 변경 전·분류·변경 후 호출을 각각 기록하며 개별 호출 예상 비용이나 임의 환불 규칙을 추가하지 않는다. 턴/스텝/원 호출의 대체 관계·출처별 소계/미상 표시·늦은 계량의 유효값 정정과 중복 방지는 REQ-107.history_storage가 정본이다. 같은 응답 실행의 누적 스냅샷/청크와 공급자 자동 후속의 별도 실행을 구분한다. 요청/세션 합계와 실행별 계량의 중첩 제거·개별 미상 표시는 REQ-107.history_storage를 따른다
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
  - id: NFR-011
    category: 비용
    title: 월별 개인 쿼터 배분·추가 승인 이력의 운영 정합성
    requirement: 월 기준 저장/단가 고정·미래 예정 생성/교체·월말 다음 달 최종 배분과 실제 사용/일할/추가 승인을 같은 사용자/월로 재구성한다. 생성본을 중복 가산하지 않으며 금융 승계 원 월과 대상 월 등급/효력 사용자·마감 스냅샷/원 작업·주체/시각을 각각 보존한다. 예정 생성 이후에도 대상 월 시작 전 변경/재생성이 가능하고 실제 월 시작 후 소급 재생성은 금지한다
    why: 업무량은 월초·월말에 몰릴 수 있으므로, 주별로 쪼개지 않고 한 달 안에서 사용량을 유연하게 쓰게 한다. 토큰 계량과 공급사 청구에는 오차가 있고 긴급 업무도 있으므로 계획 총 풀을 절대 상한으로 강제하면 정상 운영을 해친다. 반대로 예외를 근거 없이 자동 허용하면 사용 통제와 사후 정산 근거가 사라진다
    hard_rule: 쿼터는 **Hub 사용량 통제와 운영 가이드**이지 전사 예산 편성·잔액 통제·회계 처리 기능이 아니다. 월중 변경으로 과거의 배정·승인·사용량을 소급 재계산하지 않으며, 계획 총 풀 밖의 예외 승인과 공급사 계량 차이는 일반 배정이나 계획값을 덮어쓰지 않고 별도 근거로 남긴다
    measurement: 월별 계획 총 토큰 풀 대비 등급별 배분 가중치·등급별 활성 사용자 수·가중치 1단위 토큰량·미배정 계획량·사용자별 배정·누적 사용·잔여 한도·공급사 계량/Hub 추정 사용량 · 신규 사용자 일할 배정 건수·배정량과 미배정 계획량 초과분 · 승급의 적용 월 반영 건수 · 승계 확정 월 · 추가 토큰 신청·승인(부분 승인 포함)·반려·미처리 만료 건수와 승인량 · 계획 총 풀 밖 예외 승인량과 사유 · 계획·실제 1M 비용 괴리율과 실적 기반 단가 초안·수동 보정률 및 근거 · Hub 기록과 공급사 계량의 실제 사용 차이 · 월말 만료량
    source: '**사용량 기록·월별 쿼터 배분 기준·사용자 배정·추가 승인 이력·공급사 월 사용량의 대조.** 공급사 사용분 기준 토큰 총량과 비용은 월 단위 대조값으로 기록하고, 할인·세금·구독료·일회성 크레딧 등 비교를 왜곡하는 달은 사용 패턴 대조 표본에서 분리할 수 있다. 최근3개월 자동 보정률 제안은 제공하지 않으며 실제 월 보정률은 SCR-021에서 기본1.0 또는 관리자 수동 근거로 확정한다. 각 사용량에는 발생 시점의 월과 사용자, 각 배정·승인·수동 보정에는 대상 월·근거·처리자·토큰량을 남기며, 계획 초과와 계량 차이는 계획값을 덮어쓰지 않고 별도 대조 근거로 남긴다'
    traces_to:
      - REQ-116
      - REQ-117
      - REQ-118
      - REQ-119
    test_case:
      - TC-04515
      - TC-04516
      - TC-21191
    target: null
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
  - id: NFR-012
    category: 비용
    title: "쿼터 집행 — 시작 전 검사와 선택적 스텝 재검사"
    requirement: "**원 질의의 재요청을 포함해 새 턴/시도를 시작하기 전의 개인 쿼터 검사는 항상 수행한다.** 턴 처리 중 각 스텝의 LLM 호출 직전 쿼터 재검사는 시스템 설정으로 활성화·비활성화하며 **기본값은 비활성화(false)**다. 비활성화 시 이미 시작한 처리는 개인 쿼터 소진만을 이유로 중단하지 않고 실제 사용량을 전량 기록한다. 이후 새 턴·새 시도는 그 사용량을 반영해 검사한다"
    detail: "시작 전 검사는 커밋된 사용량과 개인의 당시 유효 한도를 기준으로 하며 여유가 없으면 시작하지 않고 추가 사용 신청 경로를 안내한다. 재검사가 활성화된 경우 각 스텝의 LLM 호출 직전에 같은 기준으로 검사하여 사용량이 한도 이상이면 그 호출과 후속 처리를 시작하지 않는다. 기존 쿼터 소진 상태 규칙에 따라 실패로 종결하되 이미 수행한 업무·발생한 사용량·감사 이력은 남긴다. 비활성화 상태의 유효한 사용자대기 후 이어가기는 새 턴 시작이 아니므로 쿼터 소진만으로 차단하지 않는다. 계획 총 토큰 풀은 개인별 집행 한도와 구분하며, 진행 중 처리의 정책상 허용된 초과·승인된 추가 한도·동시 호출의 계량 지연을 각각 구분해 대조한다"
    hard_rule: "이 설정은 개인 쿼터의 처리 중 재검사만 제어한다. 시작 전 검사·모델 허용 범위·권한·실행 승인·사용량 기록을 끄지 않는다. 활성 상태에서도 이미 전송한 LLM·업무 실행 요청을 취소하거나 롤백한 것으로 처리하지 않고 다음 호출 경계에서 차단한다. 차단 안내를 만들기 위해 모델을 추가 호출하지 않는다. 이미 수행한 업무와 결과 불명 여부를 보존·안내하며 실행 결과를 확인 없이 실패로 단정하지 않는다"
    measurement: "시작 전 쿼터 차단 건수 · 설정 활성/비활성별 개인 한도 초과 건수·초과량 · 활성 상태에서 처리 중 쿼터 소진으로 실패한 턴 수"
    source: "2026-10-01 사용자 결정 — 스텝 LLM 호출 직전 쿼터 검사 활성/비활성을 시스템 설정으로 제공하고 기본은 처리 중 중단하지 않음. 계측은 시작·호출 경계의 적용 설정값·개인 유효 한도·커밋된 사용량·판정 시각·차단 또는 검사 생략 사유를 실제 호출 사용량과 연결한다"
    config:
      - "시스템 공통 운영 설정: 처리 중 스텝 LLM 호출 전 개인 쿼터 재검사 여부. 불리언, 기본 false, 관리 권한자가 배포 없이 변경한다. 저장 후 다음 LLM 호출 직전부터 진행 중인 턴에도 적용하며 이미 전송한 호출은 소급 취소하지 않는다(2026-10-01 사용자 확정). REQ-614에서 항목·기본값·현재 값·원천·적용 시점을 표시한다. 구체적인 설정 키는 P2에서 정한다"
    examples:
      - { kind: 정상, case: "재검사 비활성 상태에서 잔여 1,000토큰으로 시작한 턴이 5,000토큰을 사용해도 개인 쿼터 소진만으로 중단하지 않는다. 실제 5,000토큰을 기록하고 다음 새 턴·새 시도는 갱신된 사용량으로 시작 전 검사해 차단한다" }
      - { kind: 예외, case: "재검사 활성 상태에서 앞 스텝까지 커밋된 사용량이 개인 한도에 도달하면 다음 LLM 호출은 전송하지 않고 쿼터 소진으로 처리를 끝낸다. 그 전에 사용한 토큰과 수행한 업무는 지우지 않는다" }
      - { kind: 예외, case: "활성 상태라도 동시에 검사에 통과한 호출의 사용량이 나중에 기록되면 한도를 초과할 수 있다. 비활성 상태에서는 진행 중 처리의 사용량만큼 초과할 수 있으므로 초과량을 소폭이라고 보장하지 않는다" }
      - { kind: 예외, case: "비활성 상태에서 시작한 모델 호출 A의 응답을 기다리는 동안 설정을 활성화해도 A는 취소하지 않는다. 다음 호출 B 직전에 활성 설정과 커밋된 사용량을 확인해 한도에 도달했다면 B를 전송하지 않는다. 반대로 비활성화하면 이후 호출은 쿼터 소진만으로 차단하지 않되 이미 실패로 종결한 턴을 자동 재시작하지 않는다" }
    test_case: null
    target: null
    note: "이 설정은 선차감·토큰 예약·정확한 한도 내 사용을 보장하는 기능이 아니다. 비활성 상태에서 허용된 초과도 실제 사용량에 포함하며 초과분을 버리거나 사용량을 한도로 잘라 기록하지 않는다 공급자 자동 후속도 새 모델 응답 실행이면 사전 재검사 적용 대상이다. 이를 유발하는 변경 제어의 허용과 경계별 집행 가능 여부는 REQ-007.model_change_contract.admission을 따르며 청크/동일 실행 변경을 새 스텝 검사로 세지 않는다"

    open: "@defer P2 — 재검사 여부의 구체적인 설정 키와 적용 설정값·판정 근거의 조회·감사 계약을 정한다. 다음 호출 직전 적용과 기본 false는 확정값이다"
  - id: NFR-013
    category: 비용
    title: 실행 시도별 최대 스텝 수 — 전체 시간·토큰 상한은 두지 않는다
    budget_contract: '2026-10-27 사용자 승인: 기본값·허용 범위와 상한 도달 처리는 ARCH-033.execution_budget을 따른다. 마지막 허용 단계에서 정상 완료하면 완료, 추가 단계가 필요하지만 허용 예산이 없으면 실패로 종결하고 자동 새 턴으로 우회하지 않는다. 현재 configuration_change의 시작 시점 고정과 누적 집계는 유지한다'
    configuration_change: '2026-10-27 사용자 승인: 새 실행 시도를 실제로 시작할 때 스텝 상한 값과 고정 시각을 기록한다. 접수 후 개인 순서 대기 중에는 시작 시점의 설정을 사용한다. 설정 변경은 그 뒤 시작하는 새 시도부터 적용하며 진행 중 시도의 상한·누적 사용량은 바꾸지 않는다. 사용자대기 이어가기·재접속·노드 인계·회차 변경·개별 호출 재시도로 고정 상한과 사용량을 초기화하지 않는다. 현재 권한·개인 쿼터·다른 개별 제한은 각각의 기존 적용 규칙을 유지한다'
    requirement: '**실행 시도별 최대 스텝 수**를 제한한다. 원 턴 상태와 무관하게 사용자가 명시적으로 재요청해 원본과 연결된 새 턴/시도를 접수하면 새 시도에 별도 스텝 예산을 적용한다. 이전 시도의 스텝 수 때문에 새 시도의 예산을 줄이지 않으며 각 턴 및 재시도 관계의 누적 스텝 수는 감사·통계로 보존한다. 턴 전체 누적 토큰과 전체 소요 시간에는 강제 종료 상한을 두지 않는다. 개인 쿼터의 시작 전 검사와 선택적 처리 중 재검사는 NFR-012로 별도 집행한다. 개별 LLM·도구 호출 타임아웃, 모델·API 자체 한도, 사용자대기 만료와 실행 점유 만료는 유지한다'
    hard_rule: '**같은 시도에서는 회차와 무관하게 누적으로 집행한다.** 처리 중 변경으로 스텝 순번을 되돌리거나 사용자대기 후 이어가기·재접속·인계·개별 호출 자동 재시도를 해도 그 시도의 예산은 초기화하지 않는다. 원 질의의 재요청은 REQ-013의 현재 접수 조건과 사용자 명시 의도로 별도 새 턴/시도를 접수할 때 새 예산을 시작하며 원 턴의 중단을 전제하지 않는다. 내부 반복이 새 시도를 자동 생성해 상한을 우회하지 않으며 이전 시도의 카운트·시간·사용량·감사 이력을 지우지 않는다 스텝 경계는 TRM-003·REQ-107.history_storage의 실제 모델 응답 실행이다. 동일 실행 변경/청크는 증가시키지 않지만 공급자 자동 후속은 새 실행으로 집계한다. 자동 후속의 사전 예산 통제는 REQ-007.model_change_contract.admission을 따르고 공급자의 자체 토큰/도구 제한으로 Hub 상한을 대체하지 않는다'
    termination_guards:
      - 시도별 누적 스텝 상한만으로 종결을 보장하지 않는다. 스텝 내부 반복·재시도·되돌림, 연결/응답/스트리밍 대기, DB 잠금 대기와 호출 외 내부 작업의 각 경로에 유한한 종료 조건 또는 정체 감지·중단 수단을 둔다. 개별 호출 타임아웃이 스텝 전체 제한과 같다고 가정하지 않는다
      - 구현체·agent·그래프의 숨은 중복 재시도는 REQ-009에 따라 통제한다. 응답 조각 수신이나 내부 반복으로 제한을 무한 연장하지 않도록 적용 단위·횟수·시간·진전 기준을 정한다. 모든 스텝에 동일한 고정 시간 제한을 일괄 적용하거나 턴 전체 시간 상한을 새로 도입하는 결정은 아니다
      - 실행 점유 갱신이 계속된다는 사실만으로 업무 진전을 판단하지 않는다. 실제 처리가 멈춘 채 점유만 갱신되는 경우를 탐지·제한하고 기존 완료·실패 또는 현재 시도 중단 경로, 개인 한도 해제·감사 기록에 연결한다
      - 사용자대기 만료·점유 회수·대기열 재탐색·종결 저장의 실패/지연을 탐지·복구해야 한다. 종결 가능성은 새 입력/재시도가 없고 서버와 복구 처리가 정상 동작하는 조건에서 검증하며, 저장 실패나 외부 업무의 결과 불명을 성공 완료로 간주하지 않는다(REQ-016·036·109)
    implementation: '**이 상한은 오케스트레이션 프레임워크의 자체 제한 기능이 아니라 우리 코드에서 집행한다** — 프레임워크의 제한값은 대개 그래프 컴파일 시점에 고정되어 PRN-06(배포 없는 런타임 변경)을 만족하지 못하고, 초과 시의 처리도 우리 턴 상태 모델과 다르다'
    measurement: 시도별 누적 스텝 수와 상한 도달로 종료된 시도 수 · 턴 전체 누적 스텝 수·시도 수·누적 토큰·소요 시간 분포. 시도별 상한 집행과 턴 누적 통계를 구분하고 사용량·시간은 모두 기록한다
    source: '**턴·시도·스텝 이력** — 시도별 카운트는 해당 시도의 실제 스텝 기록에서 얻고 턴 전체는 모든 시도의 기록을 합산한다. 소요 시간은 NFR-006·008과 REQ-006의 기준을 쓰며 다시 재지 않는다. 같은 시도의 무효 회차 기록도 예산과 감사에 남긴다 재시도 새 턴은 원 턴과 별도 합계이며 연관 전체 합산은 REQ-013·107의 관계로 조회해 중복 집계하지 않는다'
    test_case:
      - TC-0203
      - TC-0204
      - TC-21192
    target: null
    note: 현재 시도의 남은 스텝 수를 LLM에 알려 범위를 조절하거나 종결하도록 유도한다. 이는 안내이며 강제의 대체가 아니다. 한 시도의 복수 지시·워크플로우와 회차 되돌림도 같은 시도 예산 안에서 처리한다. 새 시도마다 현재 개인 쿼터를 검사하고 이전 사용량은 누적 유지한다(NFR-012)
    decision: 2026-10-01 사용자 승인 — 전체 시간·턴당 토큰 강제 종료 상한을 없애고 최대 스텝 수·개별 호출 제한·개인 동시 처리 한도로 통제한다. 재시도 잔여 시간 계산은 필요하지 않다. 2026-10-14 사용자 명시 승인 — REQ-013과 연관 변경 요구사항의 전체 보완본을 함께 확정했다. 명시 재시도는 원본과 연결된 새 턴/시도로 접수하고 새 시도별 스텝 예산을 적용한다. 같은 시도의 되돌림·이어가기·인계는 예산을 초기화하지 않는다. 각 턴의 시간·사용량·감사를 보존하고 연관 누적 집계를 별도로 제공한다. 2026-10-27 스텝 상한 기본값·적용 시점은 budget_contract·configuration_change로 확정했으며 물리 집행은 P3 후속이다
    open: '@defer P3 시도별 예산·새 시도 접수/중복 방지와 termination_guards의 경로별 통제 수단·진전 판단·중단 지점·복구 기한을 설계하고 REQ-013·016의 검증과 연결해 정체·무한 반복·점유 누수 반례를 시험한다. 초기 스텝/개별 호출 기본값과 허용 범위는 ARCH-033의 사용자 승인값을 사용하고 미검증 내부 반복·공급자 제어까지 완료로 보지 않는다'
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
  - id: NFR-014
    category: 비용
    title: 되돌림 상한 (회차 상한)
    budget_contract: '2026-10-27 사용자 승인: 기본값·허용 범위와 상한 도달 처리는 ARCH-033.execution_budget을 따른다. 되돌림이 더 필요하지만 허용 횟수가 없으면 기존 시도를 실패로 종결하고 완료된 범위·미처리 범위를 알린다. 0은 되돌림 불허이며 무제한이 아니다'
    configuration_change: '2026-10-27 사용자 승인: 새 턴의 첫 실행을 실제로 시작할 때 되돌림 상한 값과 고정 시각을 기록한다. 설정 변경은 그 뒤 시작하는 새 턴부터 적용한다. 같은 턴의 이어가기·재접속·인계·회차 변경으로 상한과 사용한 되돌림 횟수를 초기화하지 않으며 스텝의 시도별 집계 단위와 구분한다'
    requirement: 한 턴에서 되돌려 다시 수행할 수 있는 횟수를 제한한다. 처리 중 변경으로 이전 체크포인트가 반복해 무효화되면 버려지는 회차마다 토큰이 새로 발생하므로 NFR-013의 스텝 상한과 함께 집행한다
    measurement: 턴당 회차 수 분포 · 회차 상한 도달 건수
    source: '**턴 이력의 회차 값.** 되돌림으로 버려진 스텝은 **지우지 않고 회차로 구분해** 남긴다 — 지우면 NFR-008 의 *버려진 시간* 도 함께 사라진다'
    test_case:
      - TC-0205
      - TC-0206
      - TC-21193
    target: null
    note: 초기 설정값과 변경 시점은 budget_contract·configuration_change로 확정했다. 실제 업무의 회차 분포 측정과 구현 검증은 별도다
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
  - id: NFR-015
    category: 비용
    title: "임베딩 비용의 귀속"
    requirement: "지식 본문 임베딩(admin)은 개인 쿼터가 아닌 **시스템 비용**으로 집계한다. 질의 키워드 임베딩(agent)은 해당 사용자 사용량에 포함한다. 관리자 운영용 LLM 호출의 개인별 집계·쿼터 제외는 REQ-116을 따른다. 향후 평가셋 실행을 도입하면 시스템 비용으로 집계하되 평가 기능 도입 자체는 REQ-615에 따라 유예한다"
