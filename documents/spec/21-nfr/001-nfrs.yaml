  - id: NFR-022
    category: 운영성
    title: "도구 호출 실패·타임아웃·중단의 처리 방침"
    requirement: "Hub는 도구 호출 실패를 호출 종류·실패 단계·요청 도달/결과 확인 가능성·멱등성·부작용 여부로 분류한다. **타임아웃 재시도가 안전하다고 도구 등록 계약에 명시된 경우에만**, 최초 타임아웃 뒤 자동 재시도를 한 번 수행한다. 두 번째 시도도 타임아웃이면 자동 재시도를 끝내고 사용자에게 알린다. 같은 호출이 수동 재시도 가능으로 등록됐고 되돌릴 수 없는 실행이 없으면, 턴은 중단(ABORTED)으로 전이하여 사용자가 수동 재시도를 요청할 수 있다"
    hard_rule: "DB/DW 실행 타임아웃은 REQ-037에 따라 재작성·재시도하지 않는다. 타임아웃 재시도는 전송 전에 `TIMEOUT_RETRYING` 호출 시도 이력을 DB에 남긴 뒤에만 시작하며, 턴 자체에 새 상태를 만들지 않는다. 수동 재시도는 자동 1회 제한을 우회하는 자동 동작이 아니며, 수동 요청마다 새 호출 시도 이력·쿼터·동시 처리 한도를 적용한다. 대상 시스템 실행 API가 전송됐거나 결과가 불명인 경우에는 자동·무확인 재전송하지 않는다. 결과 불명 종결 뒤 사용자의 대상 시스템 확인과 새 승인에 따른 새 턴의 후속 실행은 REQ-105.manual_reexecution을 따른다. 결과 확인 방법이 등록됐으면 먼저 확인하고, 방법이 없거나 확인에 실패하면 결과 불명 이력과 대상 시스템 수동 확인 안내를 남긴다. 결과 확인이 `처리 중`이면 사용자에게 알리고, 조회 API 가이드에 따라 사용자가 별도로 확인하도록 안내하며 Hub가 자동 폴링하지 않는다. 이력에는 원 호출·자동/수동 재시도 순번·타임아웃 시각·재시도 시작 시각·적용한 도구 계약·멱등성/결과 확인 근거·최종 결과를 남긴다. portal은 처리 중 `타임아웃으로 재시도 중(2/2)`을, 자동 재시도 소진 뒤 수동 재시도가 가능한 경우에는 재시도 버튼과 사유를 보여야 한다 사용자 중단이 반영되면 허용된 자동 재시도도 시작하지 않는다. REQ-007의 DB 조회 취소·실행 전송 후 취소 불가 및 결과 보고를 적용하며, 전송한 상태 변경 실행은 재시도 가능/멱등성 보장 등록만으로 위 금지 조건을 우회할 수 없다. 멱등성 보장 여부와 기본 미보장은 REQ-105.idempotency_contract가 정본이다. 사용자 확인 후 수동 후속 실행이 다시 결과 불명이면 매번 최신 실행의 새 확인·새 승인을 받아 같은 절차를 반복할 수 있으며 별도 고정 수동 반복 횟수 제한을 신설하지 않는다. 이는 자동 1회 제한과 별개이며 현재 권한·쿼터·개인 실행 한도와 시도별 스텝/정체 제한을 유지한다. 이 금지는 기존 호출의 재전송을 대상으로 하며, 모든 상태의 원 질의에 대한 새 턴 접수는 REQ-013의 별도 경계를 따른다. 응답 시간 초과는 통신 원인으로, 업무 결과 확인 불가는 별도 결과로 표시하고 실행 실패·취소 성공으로 단정하지 않는다."
    measurement: "도구 호출 실패율 · 유형별 분포 · 타임아웃 발생·자동/수동 재시도 시작·재시도 성공·두 번째 타임아웃·수동 재시도 요청 건수 · 첫 타임아웃부터 최종 결과까지의 소요 시간"
    source: "**도구 호출 시도 이력과 턴 상태 이력.** 실패 유형(거부 · 타임아웃 · 오류 · 중단)을 **호출 시점에 분류해** 남기고, 최초 호출과 자동·수동 재시도를 같은 호출 식별자로 연결한다. 자동 재시도 소진 뒤 중단으로 전이한 시각과 수동 재시도 요청은 턴 상태 이력으로 남긴다 — 사후에 메시지 문구로 분류하면 문구가 바뀌는 순간 통계가 끊긴다"
    test_case: null
    target: null
    status: in_progress
  - id: NFR-023
    category: 확장성
    title: 개인별 동시 실행 한도와 순서 대기
    configuration_range: '2026-10-27 사용자 승인: 입력 허용 범위는 ARCH-033.execution_budget을 따르며 기존 기본 3건·현재 집계 단위·configuration_change의 감소 정책을 유지한다'
    configuration_change: '2026-10-27 사용자 승인: 한도를 낮춰도 이미 확보한 실행을 그 이유만으로 중단하거나 점유를 회수하지 않는다. 실행 시작·재개·원천 후속 페이지의 다음 개인 한도 확보에서 현재 설정을 사용하며 확보한 실행 수가 새 한도 미만일 때만 새 실행을 배정한다. 3건 실행 중 1건으로 줄이면 기존 3건을 마치게 하고 0건이 되었을 때 다음 1건을 배정한다. 한도 감소/증가와 획득이 경합해도 같은 사용자별 판정 순서를 따른다. 사용자 중단·권한 회수·만료·실패의 기존 규칙과 개인 순서 대기는 유지한다'
    requirement: 개인별 동시 실행 한도 기본값은 3이며 기존 운영 설정으로 관리한다. 개인 한도를 확보해 실행 시작 인계 중/처리 중인 턴과 NFR-002의 원천 후속 페이지 조회 요청을 합산한다. 같은 턴의 중복 기록은 한 번만 세지만, 각 독립 페이지 조회 요청은 원 턴과 분리해 한 건씩 세며 같은 원 결과에 속해도 서로 다른 동시 요청을 한 건으로 합치지 않는다. 보존 결과 열람만으로 원천 조회를 하지 않는 경우는 이 추가 집계 대상이 아니다. 개인 순서 대기와 사용자대기는 한도에서 제외하며 실행 점유/처리 스레드를 유지하지 않는다. 유효 응답과 원천 페이지 요청 모두 REQ-036의 같은 사용자별 순서·한도 확보·대기 안내/취소를 따르고 해당 실행의 종료·취소/실패 확정 시 해당 점유만 한 번 해제한다. 서버 전체 한도·사용자 간 공용 순서·페이지 전용 추가 한도는 두지 않는다
    measurement: 동시 처리 턴 수·원천 후속 페이지 실행 수·합산 개인 한도 집계 수 · 개인 순서 대기 건수/시간 · 대기 취소 건수 · 접수 후 처리 시작까지의 시간
    source: 턴/시도 및 독립 원천 페이지 요청의 현재 상태, 대기 항목의 접수·등록·선택·실행 시작·취소·사용자대기·종결 시각과 개인 한도 판정 기록을 사용한다. 개인 대기 시간은 대기 등록부터 실행 선택까지이며 접수 후 시작까지의 전체 시간과 겹쳐 합산하지 않는다. 사용자대기 응답과 페이지 요청은 각각 접수 근거로 연결한다. 시작하지 못한 요청은 지연 0으로 계산하지 않고 취소·실패·만료로 구분한다. 모니터링 집계 주기를 남기며 표본 지표로 실시간 개인 한도 판정을 대신하지 않는다
    test_case:
      - TC-0207
      - TC-0208
      - TC-21690
    target: null
    status: decided
    note: 2026-10-01 개인 한도 기본 3·사용자대기 제외와 2026-10-13 사용자별 순서 대기/자동 처리·취소를 유지한다. 2026-10-26 사용자 요청의 결과 페이징을 연결해 원천 후속 페이지 요청도 같은 개인 한도의 독립 집계 대상으로 보완한다. 요청 종류별 접수/집계·순서·인계·중복·취소/시작 경합과 장애 후 해제를 실제 운영 API 환경에서 검증한다
    open: '@defer P3 — 사용자별 순서·집계·취소·자동 시작의 원자성과 장애 후 상태 정합성, 기존 승인/카드 기한 검증 및 대기/실행 상태의 메시지·화면 계약을 확정한다'
    verification_boundary: admin의 설정·월 원장 계약과 agent의 실제 생산/집행 시나리오를 별도 TC로 연결한다. 양쪽 실제 시험이 완료되기 전 NFR 전체를 검증 완료로 표시하지 않는다.
