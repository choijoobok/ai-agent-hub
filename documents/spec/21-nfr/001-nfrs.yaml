# ── 가용성 · 운영성 · 확장성 ────────────────────────────────
  - id: NFR-020
    category: 가용성
    title: "LLM 공급 경로 장애 — 주 추론 수동 전환과 보조 판정의 제한적 자동 대체"
    requirement: "주 추론은 REQ-602.primary_availability_recovery에 따라 오류를 안내하고 사용자의 명시적 선택·전송으로 새 실행 시도를 시작한다. 보조 판정은 REQ-602.auxiliary_fallback의 후보·오류·동의·총 횟수/시간 한도 안에서만 자동 대체한다. 후보 소진/전환 금지/현재 검사 실패는 REQ-007·039의 해당 실패/확인 경로로 연결하고 사용자 중단과 구분한다. 시스템 운영은 기존 수동 설정 조치를 유지하며 임베딩 장애는 NFR-021을 따른다. 장애가 길어지면 관리자는 변경 이력을 남기고 역할 설정을 조정한다"
    measurement: "보조 역할별 전환 시도/성공/소진/금지 건수·후보별 실제 호출 수·원 오류부터 복구/종결까지 소요 시간과 실제 비용. 주 추론은 오류 안내부터 사용자의 새 시도 성공까지, 관리자 설정 전환은 감지부터 조작까지를 구분 측정한다"
    source: "REQ-107의 원/후속 호출·후보 설정 버전·오류/전환 근거·실제 사용량과 REQ-601의 관리자 변경 이력. 숨은 재시도·관측 없는 종료/계량은 성공/0으로 채우지 않는다"
    test_case: TC-2091
    target: "REQ-602에 따라 후보 하나당 최대 1회·전체 최대 3회, 공유 마감 이내. 금지 오류·미동의·중단/예산 차단 뒤 대체 전송 0회, 성공 후 추가 후보 호출 0회. 실환경 성공률/지연 목표는 공급 경로 검증 후 정한다"
