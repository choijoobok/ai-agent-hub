screens:
# ══ admin — 연동 관리 (3.1) ══════════════════════════════════════
# 카탈로그는 구조·업무 의미·관계를 관리한다. 행 스코프·기본 필터·조회 제약은 SCR-009가 관리한다.
  - id: SCR-001
    type: "list_detail"
    route: "/admin/hub/target-system"
    history_entry: "/admin/hub/target-system/history?targetId={원ID}&historyNo={선택세트번호}. 이력 번호 생략 시 당시 값/기간 조건으로 목록을 조회하며 별도 이력 메뉴 권한을 검사한다."
    menu_code: "HUB_TARGET_SYSTEM"
    menu_parent: "HUB_INTEGRATION"
    target_doc: "documents/screen/admin/hub/target-system/requirements.md"
    connection_display: "REQ-604.connection_display·connection_test. 현재 정확 YAML 정의의 안전한 표시·연결별 불일치 배지(일치·불일치·확인 필요)와 조건부 행 테스트를 제공한다. 상단 집계만으로 다른 유효 연결을 일괄 차단하지 않는다."
    layout: "상단 시스템 식별자/이름/설명/집계 불일치와 하단 연결 정보·사용 API 두 탭, 가운데 스플리터. 이름/설명만 보완하고 기술값·신규/삭제·기본 연결은 없음."
    export: true
    access: "HUB_TARGET_SYSTEM READ, 직접 변경은 SAVE 추가 검사. 저장 결과 확인도 현재 READ·SAVE와 원 주체 검사"
    empty_state: "목록 없음·연결 미지정·권한 있는 사용처 없음과 조회 실패를 구분"
    loading: "목록/상세/관측/이력 분리, 저장·결과 불명 중 새 편집/명령 잠금"
    error_display: "YAML 제거·로드 확인 불가·현재 설정/소속 무효를 구분하고 API/저장된 워크플로우 전송 전 차단·관리 대시보드 경고로 연결한다."
    module: "admin"
    entry: "menu"
    group: "연동 관리"
    title: "대상 시스템"
    feature: FEAT-001
    usecases: [UC-015]
    roadmap: "RM-P1"
    agent_contact: "설정"
    note: "**RM-P1에서 등록한다** — 조회는 데이터소스만으로 성립하지만, 실행 출시 범위에서는 업무 API를 제공하는 대상 시스템을 등록해야 한다. 개별 API의 제공 시스템 지정과 계약 상세는 SCR-004가 관리한다"
    history_view: SCR-040
    screen_role: "management"
    design_status: "screen_draft"
    menu_contract: "현재 요구 기준의 목업 검토용 메뉴/경로안. 화면 합의 후 구현 시 선언·시드에 반영한다."
    history_policy:
      kind: "independent"
      rule: "REQ-601.change_history. 최종 적용 관리 구성의 원 화면 상속 이력 메뉴를 둔다."
  - id: SCR-002
    features: [FEAT-002, FEAT-003]
    comparison: "REQ-304.batch_structure_comparison. 선택 데이터소스의 등록 객체 일괄 비교 버튼과 컬럼 불일치·인덱스 불일치 탭별 단일 그리드를 제공한다. 성공 확인된 해소만 현재 목록에서 제거하며 실패·부분 비교/오래된 결과로 삭제하지 않는다"
    dbms_fields: "상단 그리드에서 DBMS 공통코드와 DBMS 버전 문자열을 관리한다. 연결 관측 제안/불일치와 관리값을 구분하고 이력에 당시 값을 표시한다. 상세는 target_doc·REQ-603.dbms_context를 따른다"
    type: "list_detail"
    route: "/admin/hub/data-source"
    history_entry: "/admin/hub/data-source/history?targetId={원ID}&historyNo={선택세트번호}. 이력 번호 생략 시 당시 값/기간 조건으로 목록을 조회하며 별도 이력 메뉴 권한을 검사한다."
    menu_code: "HUB_DATA_SOURCE"
    menu_parent: "HUB_INTEGRATION"
    target_doc: "documents/screen/admin/hub/data-source/requirements.md"
    layout: "상단 YAML 식별자/별칭/DBMS readonly와 수동 업무 메타·서버 불일치 배지, 가운데 스플리터, 하단 접근 가능 사용자 그룹·사용 스키마 카탈로그·컬럼 불일치·인덱스 불일치·데이터 조회 가이드 정확히5탭."
    export: true
    access: "HUB_DATA_SOURCE READ, 직접 변경은 SAVE 추가 검사. 그룹 집합은 하위 매핑 어휘이며 사용자 접근 게이트 아님"
    empty_state: "목록 없음·파서/시간대 미지정·연결 MISSING/UNAVAILABLE를 구분"
    loading: "상세 전체 집합 확보 후 편집, 저장·결과 불명 중 새 명령 잠금"
    error_display: "별칭/버전/참조 충돌·정정 근거 누락·연결/파서 미확인 구분"
    module: "admin"
    entry: "menu"
    group: "연동 관리"
    title: "데이터소스"
    feature: FEAT-002
    usecases: [UC-016]
    roadmap: "RM-P1"
    agent_contact: "설정"
    history_view: SCR-041
    screen_role: "management"
    design_status: "screen_draft"
    menu_contract: "현재 요구 기준의 목업 검토용 메뉴/경로안. 화면 합의 후 구현 시 선언·시드에 반영한다."
    history_policy:
      kind: "independent"
      rule: "REQ-601.change_history. 최종 적용 관리 구성의 원 화면 상속 이력 메뉴를 둔다."
    note: "REQ-603.yaml_authority·data_query_guides. Hub spring.datasource 제외, app.external-datasources 기동 동기화. UI 마스터 신규/삭제/연결 정정과 옛 코드 정의/파라미터/결과 탭 없음. 가이드 여러 제목/상세+감사4개, 같은 DS 전체 저장/이력."
  - id: SCR-003
    object_type: "OBJECT_TYPE의 TABLE/VIEW를 상단 목록과 조건·신규/정의에서 테이블/뷰로 표시한다. 유형은 필수이며 수동 지정/원천 관측 상태를 구분한다"
    code_workspace: "REQ-301.value_domain.workspace. INLINE 직접 코드값 관리와 CODE 원천확인 필요 표시를 유지한다. 옛 코드 조회 정의/정확 버전 선택·코드 바인딩·조회 결과 탭은 제거하고 데이터소스의 범용 데이터 조회 가이드를 소비한다."
    simplified_tabs: "키 구성·원천 구조·샘플 조회 탭 제거. PK 여부/순서는 컬럼 정의, 유일키는 기존 인덱스 탭의 종류로 구분. 비교는 SCR-002 인계"
    evidence_targets: "근거 대상 탭은 변경 근거에서 선택한 기록의 관련 테이블·업무명·근거 내용·관측/전후/후보 역할·버전 번호/상태를 보여준다. 내부 ID는 기본 숨김이다. 원천은 API-032의 EvidenceTargetView와 target_doc이며 영향 확정/조치 완료나 과거 버전 복사 출처로 해석하지 않는다"
    datatype_and_group_fields: "원천 자료형은 REQ-301.source_type_catalog의 DBMS별 공통코드 검색콤보이며 버전으로 목록을 나누지 않는다. 컬럼 그룹 예외는 REQ-103.column_group_exclusions의 컬럼·제외 그룹·사유·등록자·등록일시 다섯 열로 표시한다"
    revision_terminology: "내용 판의 버전/후보/고정 의미는 유지한다. 과거 구성의 변경 이력은 SCR-042의 같은 화면 구조에서 읽기 전용으로 조회하고 현재 관리 화면에 변경 이력 탭을 두지 않는다."
    type: "list_detail"
    route: "/admin/hub/catalog"
    menu_code: "HUB_CATALOG"
    menu_parent: "HUB_INTEGRATION"
    target_doc: "documents/screen/admin/hub/catalog/requirements.md"
    layout: "상단 현재 테이블 목록(접기 가능)·하단 컬럼 정의 기본 탭. 각 탭에는 그리드 하나만 둔다. 기본 컬럼 정보·코드 조회 설정 셀과 유일키·인덱스/값/그룹 예외의 건수 클릭으로 같은 후보의 해당 탭 이동을 제공한다. 관계·관계 건수는 읽기 전용 요약이며 관계 편집 탭/직접 설정 창 대신 SCR-039를 참조한다. 접근 그룹과 컬럼 예외는 FEAT-007 동일 후보 편집이며 원천 구조 변경은 없다. 상세 탭/선택 동작은 target_doc·REQ-301.column_workspace를 따른다"
    query_policy_reference: "REQ-611.query_constraints.catalog_projection. 상단 테이블 목록에 현재 유효 조회 제약 건수를 읽기 전용으로 표시하고 SCR-009를 catalogId·QUERY_CONSTRAINT로 필터링해 연다. 조회 실패/권한 제한은 0건으로 표시하지 않는다. 신규 미저장 테이블은 규칙 참조 전이다"
    export: true
    access: "HUB_CATALOG READ/SAVE/EXPORT, 원본/개인정보/정책 소유 권한을 별도 검사한다. 실제 시드는 소유 G3·화면 승인 뒤 연결한다"
    history_entry: "/admin/hub/catalog/history?targetId={원ID}&historyNo={선택세트번호}. 이력 번호 생략 시 당시 값/기간 조건으로 목록을 조회하며 별도 이력 메뉴 권한을 검사한다."
    empty_state: "미등록 공개 객체·미완성 초안·현재 버전 없음·조회 실패·정책 계약 대기를 구분한다"
    loading: "현재 항목/선택 버전/현재 관측·정책/근거 분리, 전체 편집본 미확보와 저장/결과 불명 중 새 변경 차단"
    error_display: "초안 버전/소유·참조·정확 식별/profile 충돌·관측 실패·결과 불명을 입력 유지와 함께 표시한다"
    relation_management: "REQ-301.relationship_metadata.workspace에 따라 관계 편집은 SCR-039가 맡고 여기서는 선택 판의 관계·관계 건수만 읽기 전용으로 표시한다. 기존 전체 후보의 소유 관계/쌍은 저장·복사·고정에서 보존하며 요약만 읽었거나 관계를 숨겼다는 이유로 삭제하지 않는다. 별도 화면 이동의 입력 보존·문맥/권한 계약은 SCR-039 상세 설계 후속이다"
    module: "admin"
    entry: "menu"
    group: "연동 관리"
    title: "스키마 카탈로그"
    feature: FEAT-003
    features: [FEAT-003]
    usecases: [UC-007, UC-014, UC-026]
    privacy_workspace: "REQ-111.privacy_metadata.column_workspace. 별도 개인정보 탭/메뉴 없이 컬럼 정의에서 개인·민감정보 여부·마스킹 옵션을 편집하고 그룹 예외 탭에서 숨김/MASK를 선택한다. FK 요약 컬럼은 제거한다"
    metadata_scope: "REQ-301.column_metadata·value_domain·relationship_metadata와 REQ-111.privacy_metadata를 참조해 컬럼의 구조/의미·코드 출처·관계·개인정보 기준과 미완성/검수 상태를 확인한다. 정책 편집 권한과 원천은 REQ-103·611을 유지하고 필드·배치·목업은 P3에서 정한다"
    roadmap: "RM-P1"
    agent_contact: "설정"
    note: "공개 테이블/뷰의 현재 메타데이터·업무 의미·컬럼/그룹/기술 근거를 전체 구성으로 직접 저장한다. 업무 DB 전체 수집이 아니며 agent는 검증된 유효 적용본을 소비한다."
    history_view: SCR-042
    applied_only: true
    management_boundary: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
    screen_role: "management"
    design_status: "screen_draft"
    menu_contract: "현재 요구 기준의 목업 검토용 메뉴/경로안. 화면 합의 후 구현 시 선언·시드에 반영한다."
    history_policy:
      kind: "independent"
      rule: "REQ-601.change_history. 최종 적용 관리 구성의 원 화면 상속 이력 메뉴를 둔다."
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
  - id: SCR-039
    module: "admin"
    entry: "menu"
    group: "연동 관리"
    title: "테이블 관계"
    feature: FEAT-011
    usecases:
      - "UC-008"
    roadmap: "RM-P1"
    design_handoff: "REQ-301.relationship_metadata.workspace·FEAT-011. 관계 작성 시 양쪽 중 관리 카탈로그 선택·고정, 반대편 동일 정본 조회, 자기조인 두 역할과 전체 컬럼쌍·검수 근거를 상세 설계한다. 관리 카탈로그의 같은 전체 후보·EDIT_VERSION·API-022/023/024/025와 고정/세트 반영을 재사용하고 독립 관계 저장/버전/승인 모델을 만들지 않는다. SCR-003 읽기 전용 요약에서의 문맥 전달·미저장 입력 보존·권한 재검사·동시 편집 충돌, 화면 요건/목업·경로·메뉴/액션 계약은 후속 P3에서 정한다. LLM과 인증 예제 작성은 50-api FEAT-011.relation_read_contract의 양쪽 정확 판/현재 권한/검수·전체 쌍 필터를 공통 소비한다"
    route: "/admin/hub/catalog-relation"
    menu_code: "HUB_CATALOG_RELATION"
    menu_parent: "HUB_INTEGRATION"
    target_doc: "documents/screen/admin/hub/catalog-relation/requirements.md"
    screen_role: "shared_composition"
    design_status: "screen_draft"
    menu_contract: "현재 요구 기준의 목업 검토용 메뉴/경로안. 화면 합의 후 구현 시 선언·시드에 반영한다."
    history_policy:
      kind: "shared_owner"
      source_screen: SCR-003
      rule: "같은 관리 구성의 다른 진입점이다. 저장·이력 복사 단위를 중복 생성하지 않고 소유 관리 화면의 이력으로 이동한다."
    history_view: "SCR-042"
    request_owner: "SCR-003"
    request_boundary: "별도 승인 루트를 만들지 않고 소유 자산의 전체 구성/요청번호와 전용 변경 요청 화면을 재사용한다. 요청 화면 이동은 현재 권한과 해당 대상/매핑 문맥을 유지한다."
  - id: SCR-004
    usecases: [UC-018]
    tool_reference: "REQ-612.api_tool_mapping의 대응 도구 0개 또는 1개와 후보/유효 상태를 권한 범위에서 조회한다. 조회 실패를 미등록으로 표시하거나 API 승인만으로 도구를 생성·노출하지 않는다"
    module: "admin"
    entry: "menu"
    group: "연동 관리"
    title: "업무 API"
    feature: FEAT-004
