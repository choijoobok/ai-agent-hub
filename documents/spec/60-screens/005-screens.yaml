    features: [FEAT-101, FEAT-102, FEAT-103, FEAT-104, FEAT-105, FEAT-106, FEAT-107, FEAT-108, FEAT-109, FEAT-111, FEAT-112, FEAT-114, FEAT-121, FEAT-124]
    result_paging: "REQ-011·NFR-002·003의 페이지 상한 초과 안내와 후속 페이지 요청/표시를 제공한다. 다음 페이지 조작·페이징 지원 그리드 등 구체 방식은 portal이 P3 화면 요건/목업에서 결정하며 현재 범위·미상 전체 건수·로딩/끝/실패/만료를 구분한다. 대화 이력 페이징과 조회 결과 페이징은 별개다"
    privacy_notice: "REQ-106.input_notice의 개인정보 직접 입력 주의와 전송 안내를 제출 전에 확인할 수 있게 한다. 본문 만료/파기와 재요청 불가 안내는 REQ-109를 따르며 실제 문구·배치는 P3에서 설계한다"
    token_usage: "REQ-006.personal_usage에 따라 각 질의·응답의 수행 시간과 사용 토큰을 함께 표시하고, 별도 영역에 본인의 당월 잔여 총 토큰과 추가 질의 예상 횟수를 표시한다. 구체 배치·표본 근거의 상세 보기·갱신 계약은 P3 화면 요건서·목업에서 정한다"
    model_failure: "REQ-602의 주 추론 일시 장애/사용 불가 복구 구분, 보조 대체 진행·최종 실패·관리자 확인 안내와 REQ-106의 후보 경로 사전 안내/동의를 설계한다. TC-1011·1012를 화면 테스트에 연결하고 모델 선택만으로 자동 전송하지 않는다"
    roadmap: RM-P1
    model_selection: "모델 사용 불가 응답 뒤 허용 목록 자동 재조회·현재 선택의 유효성 대조·미선택 전환·질의 유지·사용자 직접 재선택/전송과 빈 목록/조회 실패 처리는 REQ-602.model_selection_recovery를 따른다. 실제 입력 위치·상태 표시·메시지 키는 P3 화면 요건서·목업에서 정한다"
    response_preview: "질의 목록 항목을 클릭하면 선택 질의와 연결된 공개 응답을 모달/팝업 레이어로 보여준다. 목록/레이어에 본문 원본 위치 이동을 제공하지 않고 본문 로드 구간·조회 경계·스크롤을 유지한다. 새 턴 요청·즐겨찾기 등록과 조작을 분리하며 응답 연결/표현·상태·권한/보존·오류·늦은 응답·닫은 뒤 위치/입력 유지는 REQ-014.response_preview를 따른다. 구체적인 레이어 형태·배치는 P3 화면 설계에서 정한다"
    approval_entry: "REQ-005.approval_presentation의 입력창 위 승인 대기 고정 영역과 현재 승인 상세 패널을 제공한다. 스크롤/본문 페이지와 독립적으로 요청을 선택해 전체 값을 확인하고 승인·거절·질문한다. 패널 조회는 같은 서버 요청의 재표시이고 교체/거절/만료 카드는 승인할 수 없다. 질문/보류·재승인은 REQ-017, 복원은 REQ-040, 과거 응답 레이어의 읽기 전용은 REQ-014를 따른다. 구체 화면 요건·목업은 P3에서 작성한다."
    manual_reexecution: "REQ-105.manual_reexecution에 따라 최신 불명 실행의 대상 시스템 확인 내용을 받고 현재 전체 실제 값의 새 승인을 제시한다. 확인 진술·원 불명·후속 실제 결과를 구분하며 확인과 승인 묶음·반복 안내의 구체 배치는 P3 화면 요건서·목업에서 정한다"
    query_list: "본문과 별도로 현재 세션의 모든 사용자 질의를 REQ-014의 목록으로 표시한다. 질의문·접수 시각·현재 상태와 중단 표식/사유, '새 턴으로 다시 요청'·'자주 쓰는 질의로 등록' 버튼을 제공한다. 모든 상태의 새 턴 요청은 REQ-013, 등록/관리는 REQ-201을 따른다. 즐겨찾기 등록은 기존 입력 종류·문맥 관계로 자격을 구분하고 변경/추가 응답·문맥 의존 입력·판정 전 항목에는 비활성 사유를 표시한다. 목록/두 조작 자체의 모델 호출 없이 본문 밖 질의·페이지·현재 권한/보존을 처리한다"
    note: "**이 화면 하나가 P1 가치의 전달 지점이다.** admin 메뉴 하나와 같은 무게로 다루면 안 되며, 문서 셋을 단일 문서로 두지 않고 **흐름 단위로 나누는 것을 허용한다.** 13개 기능이 들어가는 것은 전부 **진행 중인 대화에 대한 동작**이라 별도 진입점을 가질 수 없기 때문이다. 새 대화에는 AI에게 가능한 일을 물어보라는 정적 안내가 보이고, 사용법 질문은 활성 사용 안내 지식으로 답한다. 중단 요청·호출별 취소/업무 결과·자동/무확인 재시도 차단·확인 안내는 REQ-007을 참조하며 agent 계약의 접수/반영중/처리 결과를 폴링·재접속으로 표시한다. 추가 입력의 대상 확인·분류/확인·변경 반영 안내와 CLI/API 공통 사용자 동작은 REQ-007을 따른다"
