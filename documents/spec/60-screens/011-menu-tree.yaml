      reason: "RM-P3 자동화 후속 화면. 이번 목업 대상에서 제외한다."
  rules:
    - "운영 설정은 기존 system 시스템 환경설정(SCR-515)을 수정 없이 재사용한다. admin 설정 메뉴·설정 저장소·별도 설정 변경 이력을 추가하지 않는다. 설정 항목은 기능 요건에서 정의하고 제품 반영은 구현 단계에서 기존 YAML/속성 등록 방식을 따른다."
    - "메뉴 영역과 화면의 표시 순서는 admin_groups의 배열 순서를 정본으로 삼는다. 생성 화면정의서와 설계 사이트의 목업 목차도 같은 순서를 따른다. 파일명·화면 ID 순으로 다시 정렬하지 않는다."
    - "공통 기반을 최상단에 두고 모델→단가→쿼터 등급 기준→월별 쿼터 기준→사용자 그룹→Portal 사용자 순으로 준비한다. 이후 연동 자산→접근 권한→업무 지식→요청·승인→AI 운영→비용 관리→변경 이력→감사·이력→품질 관리로 내려간다."
    - "선행 기반을 먼저 준비하는 업무 탐색 순서이며 모든 참조를 단방향으로 제한하지 않는다. 자산 등록 뒤 대상별 권한을 연결하고, 월 운영 결과는 다음 월 기준 보완으로 되돌아올 수 있다."
    - "관리 화면과 공유 편집면은 업무 영역에 두고, 변경 이력은 변경 이력 영역에 모은다. SCR-031 통합 검색을 먼저 두고 상속 이력17개를 원 관리 화면의 업무 순서로 배치한다. 상속 연결과 별도 열람 권한은 유지하며 독립 목업을 복제하지 않는다."
    - "원 화면별 상속 이력은 목록에 포함하지만 독립 목업 작성 수에는 포함하지 않는다."
    - "메뉴별 독립 이동과 읽기/처리/반출 권한을 유지한다. 구조 노드는 URL을 갖지 않고 리프만 화면에 연결한다."
    - "전체 화면 요건/목업 합의 후 물리/API·트랜잭션 설계를 진행한다. 지금의 경로·코드는 구현 완료나 G3 승인을 뜻하지 않는다."
    - "관리자 권한/자산 변경은 현재 변경 권한자의 직접 저장과 전체 이력을 사용한다. Portal 신청 승인 영역에는 SCR-022 추가 토큰과 SCR-035 쿼터 승급만 둔다. 관리자 간 요청/승인과 업무 의미 영향 검토 작업 메뉴는 제공하지 않는다."
    - "현재 적용 관리 이력과 Portal 신청/실행 감사는 업무 의미를 구분한다."
  portal_requests:
    screens:
      - "SCR-022"
      - "SCR-035"
    rule: "Portal 사용자가 접수한 원 신청을 현재 처리 권한의 관리자가 승인/반려한다. admin 관리 변경이나 전결 설정으로 대체하지 않는다."
