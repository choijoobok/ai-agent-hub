doc_order:
  unit: "**독립된 화면 계약 SCR 1개 = 화면 명세 1건**을 기본으로 한다. 메뉴의 주 화면에서 시작하되 독립 계약이 있는 상세·모달·탭·공통 화면은 별도 SCR로 식별한다"
  flexibility: "같은 메뉴의 내부 동작은 주 화면 명세 안에서 다룰 수 있다. 여러 화면이 공유하는 업무 선택창·모달은 공통 계약을 한 번 정의하고 호출 화면은 전달값·반환값 매핑을 참조한다. 화면의 기능은 FEAT ID로 연결하며 메뉴와 기능을 일대일로 강제하지 않는다"
  order: "31-features의 delivery_strategy.staged_delivery를 따른다. 세 영역 19화면의 검토 결과로 선행 기술 상세·G3·구현을 진행하고, agent 요구 기반 기록 모델/계약을 검증한 뒤 후행 화면의 요건·목업을 재작성한다."
  path_rule: "화면 정본은 AGENTS.md §6.1에 따라 실제/설계 페이지 경로를 documents/screen/ 아래에 그대로 미러링한다. system은 admin/system, admin은 ARCH-021의 admin/hub 경로다. 모듈 소유권은 SCR.module로 구분하며 URL 접두사를 모듈명으로 해석하지 않는다"
  common_screen_design: "@defer P3 — UND-S07은 해당 소유 화면 승인 전에 호출/입출력을 대조한다. 선행 19화면의 공통 선택/편집은 먼저 결정하고, 후행 조사/이력 화면용 후보 때문에 선행을 일괄 대기시키지 않는다."
  menu_design: "2026-10-30 사용자 합의: menu_tree의 admin 메뉴 배치·코드·경로를 목업 검토안으로 사용한다. source_screen 상속 이력은 목록에 포함하되 독립 목업을 만들지 않는다. 유예/후속 화면은 이번 목록에서 제외한다."
  screen_requirement_depth: "화면 검토 단계는 업무 목적·조회/입력 항목·선택 출처·필수/검증·버튼·상태·저장 단위·화면 간 전달과 사용자 수락 사례를 작성한다. 미정 물리명/API 경로·잠금/복구 상세는 추정하지 않고 같은 요건서의 후속으로 표시해 해당 선행/후행 범위의 G3 전에 보완한다."
  request_screen_design: "Portal 신청 승인 화면은 admin-operations 후행이다. 관리자 자산 변경 요청/승인 화면은 철회되어 만들지 않는다. 현재 직접 저장/HIST 생산 계약을 선행 구현하고 이력 조회 화면은 후행에서 별도 검토한다."
