judgement:
  id: AUTHZ-001
  rule: "사용자의 **승인된 활성 소속 그룹 집합**과 객체의 **허용 그룹 집합**의 **교집합이 비어 있지 않으면 허용**, 매핑이 없으면 차단"
  applies_to:
    - 데이터소스
    - "테이블 · 컬럼"
    - "실행 API"
    - "커스텀 도구"
    - "지식 · 인증 예제 쿼리의 컨텍스트 주입 판정"
  single_component: "**다섯이 전부 같은 규칙을 쓰며 구현은 공통 컴포넌트 하나다**(FEAT-303). 같은 판정을 두 곳에서 구현하면 두 결과가 어긋난다"
  rules:
    - "권한은 REQ-108에 따라 지식 검색·모델 입력·조회·실행·결과 제공마다 현재 유효값으로 판정한다. 내용 리비전 고정·이전 허용 판정·캐시는 접근 허용의 대체 근거가 아니다"
    - "데이터소스·대상 시스템 접근에는 REQ-609의 현재 변경 권한자가 직접 저장한 유효 사용자-대상 신원 매핑을 별도 필수 조건으로 확인한다. 대상 매핑 활성은 데이터소스·객체·개별 API의 그룹 판정·행 스코프·레거시 시스템 자체의 권한 판정을 대신하지 않는다"
    - "사용자 그룹은 system 모듈의 메뉴·기능 역할과 분리한 **Hub 전역 접근 기준**으로 정의하고 사용자에게 N:N 으로 매핑한다. 그룹은 개인 단위가 아니라 **업무상 직무 단위**로 만든다 — 급여담당·근태담당·평가관리자"
    - "**그룹 결합은 합집합이다.** 여러 그룹에 속한 사용자의 접근 범위는 각 그룹이 여는 범위를 합친 것이다. **그룹을 추가로 부여한 것이 기존 접근을 좁혀서는 안 된다**"
    - "**기본값은 닫힘이다.** 그룹이 없는 신규 사용자, 허용 그룹 매핑이 없는 신규 공개 인터페이스·API 는 아무것도 열리지 않는다. **원천 DB/DW 변화 후보로 발견됐지만 카탈로그에 아직 등록하지 않은 신규 컬럼은 차단된다.** 반면 관리자가 카탈로그에 등록한 컬럼은 예외 매핑이 없으면 AUTHZ-012에 따라 상위 테이블의 허용 그룹을 상속한다 — 등록은 공개·검수 의사를 가진 행위이고, 미등록 원천 컬럼의 자동 공개는 사고다"

# ── 매핑 구조 ──────────────────────────────────────────────────────
