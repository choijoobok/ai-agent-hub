sql_control:
  id: AUTHZ-030
  claim: "통제는 한 지점이 아니라 **네 단계**로 나뉘며 단계마다 막는 것이 다르다. **LLM 이 만든 SQL 을 신뢰하지 않는다**"
  stages:
    - stage: 1
      name: "컨텍스트 필터링"
      how: "스키마 카탈로그를 사용자의 소속 그룹으로 필터링해 LLM에 전달한다. 허용된 지식·카탈로그와 기본 필터 명세의 전달은 AUTHZ-040·050을 따른다. 허용 그룹 밖 테이블·컬럼과 권한 원천은 노출하지 않는다"
      blocks: "권한 없는 객체가 조회 대상으로 선택되는 것"
      note: "**가장 강력한 방어선이다.** 애초에 보여주지 않으므로 조회 대상이 될 수 없다"
    - stage: 2
      name: "구문 검증"
      how: "파서로 SQL을 해석하고 REQ-301의 DB 스키마명을 포함한 물리 참조를 선언된 데이터소스의 카탈로그·허용 범위와 대조한다. REQ-603의 식별 경계를 통과하지 못한 참조를 기본 스키마 추정이나 DB/서버 접두어 삭제로 보정하지 않는다"
      blocks: "아래 bypass_paths"
    - stage: 3
      name: "조건 주입"
      how: "REQ-611의 제외 명세를 검증하고 파서로 REQ-611.condition_exclusions로 확정한 사용 중 미해제 스코프와 기본 필터를 추가한다. 생성 SQL의 업무 조건과 서버 주입 조건의 출처를 구분한다"
      blocks: "권한 밖 행의 조회 · 폐기·무효 데이터의 혼입"
    - stage: 4
      name: "결과 마스킹"
      how: "REQ-611에 따라 조회 결과의 마스킹 열람 컬럼에 공통 변환을 적용한다"
      blocks: "마스킹 대상 값의 노출"
  parser_rule: "2~4단계는 모두 파서를 필요로 하며 **도구 호출이 선언한 데이터소스에 지정된 파서**를 사용한다. **파서 선택의 단위는 항상 데이터소스다**"

  llm_boundary: "LLM은 허용된 값 확보·쿼리 작성/설명과 기존 parse_failure 재작성만 지원한다. 주입 위치·참조·실제 바인딩·제약 충족을 서버가 검증하지 못하면 LLM의 판단/자신감으로 통과시키지 않는다. 재작성 후에도 동일한 현재 정책·권한·최종 SQL 검증을 다시 거쳐야 하며 미지원 표현식의 임의 의미 추론·강제 조건 생략은 금지한다."
  join_constraints: "REQ-611.query_constraints.join_rule. 선택 컬럼 모두의 검증된 실제 조인은 한 항목 내부의 전체 충족 조건이며 EQ/RANGE/JOIN 항목 사이는 OR다. 별칭·분기별 최종 SQL에서 판정하고 다른 접근 통제를 대체하지 않는다."
  query_constraints: "REQ-611.query_constraints의 서버 검증을 기존 구문·참조 검증과 조건 주입 후 최종 검증에 연결한다. 실제 SQL의 각 대상 참조와 바인딩이 제약을 충족해야 실행하며 계획의 충족 표식이나 다른 조건의 제외로 면제하지 않는다. 해당 제약의 명시 해제는 REQ-611.condition_exclusions로 검증한다. 미충족·검증 불가는 REQ-025로 처리하고 정책 거부를 아래 구문/카탈로그 대조 오류의 자동 재작성 루프로 확대하지 않는다. SQL 통제의 기존 4단계 구분은 유지한다"

  filter_injection:
    reference_coverage: "자기조인·서브쿼리·공통 테이블 식·집합 연산의 각 분기를 포함한 모든 대상 테이블 참조에 규칙을 적용한다. 모델의 OR 조건은 괄호로 묶고 권한 조건과 AND 결합해 허용 범위를 넓히지 못하게 한다"
    join_semantics: "외부 조인을 포함해 원래 업무 조회의 의미와 행 수를 유지하는 위치에 주입한다. 최종 WHERE에 무조건 덧붙여 외부 조인을 내부 조인처럼 바꾸지 않는다. 주입 위치·별칭·상관 참조와 적용 완전성을 검증하지 못하면 실행하지 않는다"
    trusted_policy_source: "사용자/LLM SQL의 참조 검증과 관리자가 등록한 정책의 권한 원천 검증을 구분한다. 서버가 주입할 권한 테이블·컬럼·조건은 등록된 정책에서만 가져오며 해당 테이블을 LLM 카탈로그나 일반 사용자 조회 허용 목록에 추가하지 않는다"
    default_predicate_origin: "관리자 기본 필터는 모델 생성 SQL에 복사하지 않고 서버 주입 단계에서 처리한다. 기존 SQL에 동일 조건이 있으면 출처·사용자 의도를 대조해 재작성하거나 검증 가능한 정규화로 처리하며 문자열 삭제로 조건을 제거하지 않는다"
    verification: "구문·참조 대조 뒤 주입한 결과에서도 참조별 필수 권한 조건·남은 기본 필터·바인딩과 조회 의미를 확인한다. 중복 권한 행으로 업무 행/집계가 늘어나거나 미검증 조건이 통과하면 실행하지 않는다"

  bypass_paths:
    claim: "1단계는 **LLM 에게 보여주는 정보**에만 적용되고 실제 DB 에는 모든 객체가 그대로 있으므로 다음 경로가 남는다"
    paths:
      - path: "전체 컬럼 지정(별표)"
        risk: "카탈로그에 없던 컬럼까지 결과에 포함된다"
        block: "**별표를 금지하고 컬럼 명시를 강제한다**"
      - path: "카탈로그에 없는 객체 참조"
        risk: "LLM 이 흔한 테이블명을 추측해 서브쿼리에서 참조할 수 있다. 데이터소스 접속 계정은 사용자별로 나�‍지 않으므로 DB 권한으로는 막히지 않는다"
        block: "**SQL 이 참조하는 모든 객체를 추출해 허용 목록과 대조한다. 대조는 테이블만이 아니라 컬럼 단위까지 수행한다**(별표 금지로 모든 컬럼이 명시되므로 가능하다). 사용자에게 접근 제한된 컬럼은 **존재하지 않는 컬럼과 같은 대조 실패**로 처리하고, 마스킹 열람 컬럼은 대조를 통과하며 4단계가 처리한다"
      - path: "뷰"
        risk: "뷰는 내부적으로 권한 없는 테이블을 참조할 수 있다"
        block: "뷰를 카탈로그에 등록할 때 **기반 테이블의 민감도를 뷰의 그룹 매핑에 반영한다**"
      - path: "함수·프로시저"
        risk: "데이터를 반환하거나 파일·시스템에 접근하는 함수가 있다"
        block: "**허용 함수 목록으로 제한한다** — 집계·문자열·날짜·수치 함수만 넣고, 세션·서버·설정·파일·권한 정보를 돌려주는 함수(현재 사용자·서버 주소·설정값·버전·파일 읽기 등)는 넣지 않는다. 목록 자체는 DBMS별로 P3에서 정한다(2026-09-28 사용자 결정)"
      - path: "다중 문장"
        risk: "하나의 요청에 여러 문장"
        block: "**하나의 조회 문장으로 제한한다**"
      - path: "크로스 데이터소스 조인"
        risk: "데이터소스 경계를 무시하면 실행 불가뿐 아니라 선택된 연결의 동명 객체를 잘못 읽거나 검증되지 않은 다른 DB/서버를 참조할 수 있다"
        block: "REQ-603·ARCH-030에 따라 한 SQL은 선언된 데이터소스 안의 검증된 객체만 사용한다. 다른 데이터소스의 물리 참조나 식별 불가 접두어를 섞으면 실행하지 않는다. 여러 데이터소스의 동명 객체가 존재할 수 있으므로 이름 대조만으로 모델의 업무 대상 오선택까지 검출한다고 보장하지 않는다"
      - path: "컬럼 별칭"
        risk: "민감 컬럼에 무해한 별칭을 붙이면 결과 컬럼명으로는 마스킹 대상을 식별할 수 없다"
        block: "4단계 마스킹은 결과 컬럼명이 아니라 **파서가 추적한 원본 컬럼**을 기준으로 적용한다"

  turn_id_comment: "실행하는 SQL 에는 **턴 ID 를 SQL 주석으로 주입한다**(예: `/* turn:12345 */`). LLM 이 생성한 SQL 은 쿼리 모양이 출처를 말해주지 않으므로, DBA 가 세션 모니터·슬로우 쿼리 로그에서 문제 쿼리를 발견했을 때 턴 ID 로 감사 이력을 역조회해 출처를 특정할 수 있게 한다. **사용자 ID 가 아닌 턴 ID 를 쓰므로 DB 로그에 개인 식별자를 남기지 않는다**"

  rewrite_loop:
    parse_failure: "파서가 SQL 을 해석하지 못하면 조회도 불가능하므로(파싱 실패 = 검증 불가 = 실행 불가) **파싱 오류는 LLM 에 되돌려 다른 구문으로 재작성하게 한다.** 재작성 횟수는 REQ-037의 런타임 상한으로 제한한다"
    mismatch: "**대조 실패도 같은 재작성 루프로 처리한다.** 이때 LLM 에 돌려주는 피드백은 **차단과 부재를 구분하지 않는 중립 문구로 고정한다** — '다음 객체가 카탈로그에 없음. 카탈로그에 제시된 객체만 사용해 재작성하라'"
    execution_failure: "DB/DW 실행 오류는 Spring 변환 예외만 보지 않고 데이터소스 DBMS 종류·실행 단계·근본 SQLException의 SQLState·공급사 코드를 Hub 표준 유형으로 분류한다. **공급사 오류 코드로 확인한 `SQL_SYNTAX`만** 정제 피드백을 넣어 재작성한다. 타임아웃·접근/정책 거부·연결/인프라 장애·취소·객체 부재·의미/타입·미분류 오류는 재작성하지 않고 REQ-037의 해당 종료 경로로 보낸다"
    why_neutral: "**사유별로 문구가 다르면 존재 은닉(REQ-101)이 피드백 경로에서 깨지고 LLM 이 그 사유를 최종 응답에 옮긴다.** 실패한 객체명을 피드백에 적는 것은 안전하다 — LLM 이 방금 스스로 쓴 이름이라 새 정보가 아니다"
    internal: "agent 는 **내부적으로 차단과 부재를 구분해** 실제 사유를 정책 판정 이력에 남기고, 권한 부족 건은 품질 지표에 집계한다. 재작성으로 일부 항목이 제외된 채 완료된 턴의 응답에는 해당 항목에 대한 **정보 부재 안내를 붙인다**"

# ── 지식·인증 예제 쿼리의 주입 통제 ───────────────────────────────
