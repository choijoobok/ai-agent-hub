application_access:
  id: AUTHZ-090
  decision: ADR-007
  claim: "관리 콘솔과 system/admin 관리 API는 관리자 인증과 system 메뉴/액션 유효 권한으로 판정한다. Portal 진입/업무 API는 별도 Portal 인증·현재 이용 조건으로, AI 업무 데이터 범위는 Portal 주체의 AUTHZ-001 사용자 그룹으로 판정한다. 영역 간 계정·세션·권한을 교차 수락하지 않는다"
  rules:
    - "역할은 메뉴/액션 권한을 묶어 사용자에게 배포하는 수단이다. `ADMIN`·`TESTER`·`DEBUGGER` 같은 역할 코드는 런타임 분기 조건이 아니다"
    - "로그인 뒤 복귀는 ARCH-021의 영역별 인증·초기 변경·현재 권한·안전한 목적지 순서를 따른다. 관리자 세션을 Portal 진입이나 그 반대에 사용하지 않는다"
    - "메뉴 없는 내부 화면은 내비게이션에서 숨겨도 권한 대상이어야 한다. 화면과 관련 모듈의 service API에 같은 자원·액션 권한을 적용한다"
    - "프론트 라우트 가드는 사용성 장치이며 최종 판정은 서버 API가 한다. 직접 URL 입력으로 서버 권한을 우회할 수 없다"
    - "현재 인증 영역에 접근 권한이 없으면 해당 영역에서 종료/재인증을 안내한다. 다른 영역의 세션·메뉴 권한으로 우회하거나 공통 빈 권한 허용으로 Portal을 열지 않는다"
  unresolved_design: "숨김 화면을 `SYS_MENU`의 비내비게이션 유형으로 표현할지 별도 권한 자원으로 둘지는 SCR-112·ENT·API 설계에서 비교한다"
  traces_to: [ARCH-012, ARCH-021, FEAT-303]

# ── 설치 계정과 운영 권한의 분리 ────────────────────────────────
