row_scope:
  id: AUTHZ-020
  implementation: "대상 데이터소스의 신뢰된 권한 원천을 참조하는 등록 조건식 목록이다. IN/EXISTS 또는 행 수 보존을 검증한 조인으로 적용한다. 복수 결합·사용/해제·#{변수명}과 예약값은 REQ-611이 정본이다."
  why: "스코프 값을 AI 전용 DB 에 이중 관리하지 않고 **레거시가 이미 보유한 권한 데이터를 그대로 사용**한다(PRN-09)"
  rules:
    - "admin이 관리하는 것은 사용자별 허용 값이 아니라 테이블별 주입 규칙 목록이다. 각 규칙은 안정된 식별자·리비전·업무 의미·대상 컬럼·권한 원천·조건·서버 신원 바인딩을 가진다(REQ-611). 회사·조직·담당 업무 규칙을 별개 항목으로 등록할 수 있다"
    - "바인딩 값은 **그 데이터소스에 신원 매핑된 사용자 식별자**다. **매핑이 없으면 조회를 사유와 함께 거부**하고, 매핑은 있으나 권한 정보 테이블에 해당 사용자의 행이 없으면 결과가 0건이 되며 **이것이 정상 동작이다**"
    - "서버가 REQ-611.condition_exclusions로 사용/해제 집합을 확정한다. LLM은 임의 규칙 선택·신원 변경을 하지 못한다. 현재 정책/권한은 매 실제 접근 시 검사하며 신뢰 원천과 참조별 적용은 AUTHZ-030을 따른다."
  not_supported:
    claim: "그룹별 임의 규칙 선택·OR 조합 엔진은 두지 않는다. 스코프 다중 결합은 REQ-611.screen_contract.decisions의 확정 AND를 적용하고 조건별 명시 해제는 condition_exclusions를 따른다."
    example: "팀원은 본인만 · 팀장은 부하 전원 · 관리자는 전 직원"
    why: "필수 규칙 사이의 OR 또는 일부 생략은 허용 범위의 교집합을 넓힌다. 개별 등록 규칙 안의 허용 집합은 고객사 권한 원천에서 표현한다"
    instead: "**운영 가이드의 수단**으로 대응한다(아래 operational_means)"

# ── SQL 통제 4단계 ────────────────────────────────────────────────
