mapping_rules:
  - "컬럼 그룹 예외의 정본은 REQ-103.column_group_exclusions다. 테이블 허용 집합 밖 예외 행·같은 컬럼/그룹 중복을 거부하며 테이블 그룹 축소와 관련 제외 행 제거는 같은 전체 후보로 처리한다. 예외 유형은 HIDE/MASK이며 MASK는 유효한 컬럼 마스킹 참조를 요구한다. 사용자 소속 그룹 중 하나를 숨겼다고 다른 허용 그룹의 권한을 취소하지 않는다"
  - "컬럼/API 응답 경로의 그룹별 세 가지 처리와 복수 소속 그룹의 원본 열람·마스킹 열람·접근 제한 판정은 REQ-611을 따른다. AUTHZ-001의 합집합 원칙을 유지한다"
  - "**데이터소스의 적용 가능 그룹에서 그룹을 제거할 때 해당 데이터소스의 테이블·컬럼에 그 그룹 매핑이 남아 있으면 차단한다.** 대상 시스템에는 그룹 목록을 두지 않는다(REQ-604). 사용자 그룹 자체의 삭제는 데이터소스·테이블·컬럼·API 등 사용 중인 매핑이 있으면 차단한다"
  - "마스킹 구현의 정본은 REQ-611이다. 카탈로그는 기존 공통 변환을 유지하고 API 응답의 그룹별 지원 수준·덜 엄격한 수준 결합은 REQ-608.response_access를 따른다"

# ── 행 스코프 ──────────────────────────────────────────────────────
