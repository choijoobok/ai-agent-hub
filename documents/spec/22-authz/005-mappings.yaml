mappings:
  - id: AUTHZ-010
    object: 데이터소스
    mapping: "적용 가능 그룹 목록"
    meaning: "**어휘 제약** — 이 데이터소스의 테이블·컬럼에는 이 목록에 있는 그룹만 매핑할 수 있다. 런타임 판정은 말단(테이블·컬럼) 매핑만 보면 된다"
    scope_boundary: "DB 스키마는 별도 그룹·사용자 권한 매핑 단위가 아니다. 데이터소스 이용자 매핑과 객체 권한의 경계는 REQ-603·REQ-609를 따른다"
  - id: AUTHZ-011
    object: 테이블
    mapping: "접근 허용 그룹 목록"
    meaning: "매핑된 그룹의 사용자만 이 테이블을 볼 수 있다. **컨텍스트 필터링의 기준**이다"
    object_identity: "허용 그룹은 REQ-301의 물리 객체를 가리키는 카탈로그 항목에 연결한다. 테이블명만 같거나 같은 DB 스키마에 속한다는 이유로 다른 객체에 권한을 확장하지 않는다"
  - id: AUTHZ-012
    object: 컬럼
    mapping: "그룹별 처리(원본 열람/마스킹 열람/접근 제한) — REQ-611"
    meaning: "REQ-103.column_group_exclusions에 따라 테이블 그룹을 승계하고 예외 없는 그룹은 원본 열람, HIDE 예외는 숨김, MASK 예외는 마스킹 열람이다. 테이블 밖 그룹의 컬럼 단독 허용은 없다. 복수 그룹의 최종 처리와 공통 변환은 REQ-611, 개인정보 저장 사본은 REQ-111을 따른다"
  - id: AUTHZ-014
    object: "실행 API"
    mapping: "호출 허용 그룹 목록 + 위험 등급 + 실행 승인 근거(일반 사용자 승인 / RM-P3 REQ-405 자동 승인 활성화)"

    meaning: "**사용자에게 API 를 개별 매핑하지 않는다** — API별 호출 허용 그룹과 사용자 소속 그룹으로 판정한다. 대상 시스템·API 가 늘어날 때 개인별 API 매핑을 유지하는 것은 현실적으로 불가능하다"
    scope_boundary: "2026-10-06 사용자 정정에 따른 대상 시스템의 관리 범위는 REQ-604를 따른다. 대상 시스템에 별도 그룹 목록을 두거나 API 호출 허용 그룹의 상위 범위를 만들지 않는다. REQ-609의 사용자-대상 시스템 신원 매핑은 별도로 확인한다 API 위험 등급·일반 설정만으로 RM-P1 실행 승인을 해제하지 않는다. RM-P3 예약 워크플로우 예외는 REQ-405의 유효한 활성화 승인 범위에 한정하며 현재 실행자 권한·정책 검사는 유지한다"

  - id: AUTHZ-015
    object: "API 응답 경로"
    mapping: "그룹별 처리(원본 열람/마스킹 열람/접근 제한) — REQ-611"
    meaning: "REQ-608.response_access가 API 응답의 기본값·그룹별 Portal 마스킹/원문/미전송·같은 유형의 덜 엄격한 수준 결합을 정의한다. 활성 API 허용 그룹과 현재 소속만 판정에 사용한다. 이력 마스킹은 필드 기준으로 유지하며 미등록/미확인은 REQ-111을 따른다."