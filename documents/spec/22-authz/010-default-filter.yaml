default_filter:
  id: AUTHZ-050
  why: "레거시 테이블에는 논리 삭제 플래그나 유효 상태 컬럼이 있고, 이를 빠뜨리면 **폐기된 데이터까지 집계된다.** 권한 위반은 아니지만 **사용자가 틀린 숫자를 받아 업무 판단을 하게 되므로** 통제 대상으로 다룬다"
  rules:
    - "등록한 컬럼·값과 일치하는 행만 조회하며 복수 기본 필터는 AND로 적용한다. 값의 자료형·NULL 의미는 REQ-611을 따른다."
    - "기본 필터는 테이블별 항목 목록이며 필터 식별자·리비전·업무명/설명·조건·해제 허용 여부를 각각 가진다. 개수·기본 적용·선택 제외·요청 검증·생성 SQL 조건 처리의 업무 규칙은 REQ-611을 따른다"
    - "지식·허용된 스키마 카탈로그와 함께 해당 테이블의 기본 필터 명세를 LLM에 제공한다. 모델은 사용자 의도를 해석해 제외 명세를 요청할 수 있으며 최종 적용 목록은 agent 서버가 검증해 결정한다"
    - "제외 요청은 SQL과 분리해 대상·필터·리비전·사용자 의도 근거를 전달하고, 검증한 제외 항목만 조건 주입 대상에서 뺀다. 그 외 기본 필터와 해제되지 않은 사용 중 스코프·필수 조건은 유지한다. 다른 종류의 해제는 REQ-611.condition_exclusions로 별도 검증한다. 잘못된 명세로 실행하지 않고 재해석·확인한다"
    - "항목별 해제 허용 여부와 사유를 조회 계획에 표시하고 실제 적용·제외 항목을 감사 이력에 남긴다. 해제 불가 항목은 유지하며 그 사실을 알린다. 파서 주입·검증은 AUTHZ-030을 따른다"
  not_authz: "**기본 필터는 권한 통제가 아니다.** 그룹 판정·행 스코프를 대체하거나 보완하지 않으며 정확도를 위한 장치다. **두 규칙을 한 항목으로 합치지 않는다** — 하나는 볼 수 있는 범위이고 하나는 세어야 할 범위다"

# ── 시스템 통제의 경계와 운영 수단 ────────────────────────────────
