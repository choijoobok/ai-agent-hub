# 영역: 기준정보·Portal 이용자 운영
processes:
  - id: PRC-13
    name: "기준정보·Portal 이용자 등록과 변경 적용"
    trigger: "Hub 운영에 필요한 기준 정의·매핑·이용자를 등록하거나 변경·사용 중지한다"
    actors:
      - "ACT-002"
      - "ACT-003"
      - "ACT-004"
      - "ACT-005"
    steps:
      - id: PRC-13-01
        name: "관리 원천·속성·사용처 확인과 변경 작성"
        actor:
          - "ACT-002"
          - "ACT-003"
          - "ACT-004"
          - "ACT-005"
        system: "admin의 대상별 관리 메뉴 — 실제 처리자는 해당 메뉴·액션 권한자"
        input: "원천 자료·변경 사유·대상 식별자·현재 속성·참조 현황"
        output: "원천과 편집 범위를 확인한 변경 내용 및 영향 대상"
        reqs:
          - "REQ-601"
          - "REQ-602"
          - "REQ-603"
          - "REQ-604"
          - "REQ-605"
          - "REQ-606"
          - "REQ-607"
          - "REQ-608"
          - "REQ-609"
          - "REQ-610"
          - "REQ-611"
          - "REQ-612"
          - "REQ-613"
          - "REQ-614"
          - "REQ-615"
          - "REQ-616"
        rules:
          - "개별 요구사항의 관리 주체·속성·사용처를 따른다. 모든 기준정보를 같은 액터나 하나의 범용 테이블로 통합하지 않는다"
          - "Portal 계정은 admin에서 별도 등록·관리하고 portal이 별도 인증/세션으로 수락한다. system 관리자 계정은 Portal 등록 원천이 아니며 겸임자는 별도 Portal 계정을 발급받는다. 외부/자체 모드·재요청·활성화는 UC-023을 따른다"
        exceptions:
          - "권한 밖 원천·비밀값·연동 원천 소유 속성은 편집하지 않고 관리 원천을 안내한다"
      - id: PRC-13-02
        name: "현재 권한·참조·기술 검증 후 직접 저장"
        actor:
          - "ACT-002"
          - "ACT-003"
          - "ACT-004"
          - "ACT-005"
        system: "대상별 관리 기능의 직접 저장·전체 이력과 고유 월 적용/외부 오픈 경계"
        input: "변경 내용·사용처·원천별 적용 규칙"
        output: "실제 저장 결과 또는 검증/충돌/실패·효력 월 안내"
        reqs:
          - "REQ-601"
        rules:
          - "현재 변경 권한·기대 버전·필수 참조/기술 계약을 검증하고 전체 구성·이력/명령 결과를 원자 반영한다. 관리자 간 요청·검토·최종 승인·전결과 지식 영향 검토 작업은 없다. Portal 사용자 신청/실행 확인·외부 코드/배포·고객사 공동 오픈은 별도 소유 계약을 유지한다."
        exceptions:
          - "유효 참조를 끊거나 값·지원 조합·원천 규칙이 잘못되면 적용하지 않고 대상과 보완 방법을 알린다"
      - id: PRC-13-03
        name: "적용 상태·이력 확인 및 후속 보완"
        actor:
          - "ACT-002"
          - "ACT-003"
          - "ACT-004"
          - "ACT-005"
        system: "대상별 상세·변경 이력 및 유효 설정 조회"
        input: "변경 처리 결과·실제 적용값·처리 근거"
        output: "현재 사용 여부·적용 시점·변경 전후 근거 확인"
        reqs:
          - "REQ-601"
        rules:
          - "요청·저장 상태와 실제 유효 상태를 구분하며 과거 이력을 현재 값으로 바꾸지 않는다"
        exceptions:
          - "끊긴 연결·비활성 참조·미반영 설정은 정상 적용으로 표시하지 않고 해당 복구·재적용 경로를 안내한다"
      - id: PRC-13-04
        name: "사용자 그룹 소속 직접 추가·재부여"
        actor: "ACT-002"
        system: "admin Portal 사용자 관리/사용자 그룹 매핑"
        input: "Portal 사용자·그룹·추가 사유"
        output: "직접 반영된 소속과 전체 변경 이력"
        reqs:
          - "REQ-609"
        rules:
          - "현재 그룹 변경 권한·사용자/그룹 유효성·기대 버전을 검증하고 소속과 전후 감사 이력을 원자 저장한다. 별도 관리자 승인·전결은 없다."
        exceptions:
          - "권한 부족·기준본 충돌·이력 실패는 현재 소속을 바꾸지 않는다. 과거 요청의 늦은 승인으로 소속을 부활시키지 않는다."
      - id: PRC-13-05
        name: "사용자 접근 권한 제거"
        actor: "ACT-002"
        system: "admin Portal 사용자 관리"
        input: "사용자에게 부여된 데이터소스·대상 시스템·그룹과 제거 사유"
        output: "제거된 권한과 변경 이력"
        reqs:
          - "REQ-609"
        rules:
          - "현재 권한자가 그룹/신원을 직접 중지/회수하고 이력을 보존한다. 마지막 활성 그룹은 이용자 비활성화와 원자 처리하며 재부여도 현재 조건을 검증하는 직접 저장이다."
        exceptions:
          - "현재 기대 버전·참조/사용 조건·감사 저장 실패는 부분 회수하지 않는다. 과거 승인으로 현재 설정을 되살리지 않는다."
    outcome: "운영 기준·Portal 이용자 소속/신원은 현재 변경 권한자가 직접 관리하고 전후 이력을 보존한다. 업무 의미 검토는 운영조직 자체 프로세스이며 제품은 기술 참조/계약 검증을 유지한다."
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
