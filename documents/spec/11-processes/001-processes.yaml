processes:
  - id: PRC-01
    name: "실행 환경 준비"
    trigger: "고객사 환경에 Hub를 새로 설치하거나 실행 프로파일을 바꾼다"
    actors: [ACT-009]
    steps:
      - id: PRC-01-01
        name: "환경별 설정과 프로파일 구성"
        actor: ACT-009
        system: "Hub 배포 환경"
        input: "로컬·개발·운영 환경 정보와 모듈별 설정"
        output: "활성 프로파일과 비밀 값 참조가 분리된 실행 설정"
        reqs: [REQ-402]
        rules:
          - "비밀 값과 업무 DB·API 자격증명을 설정 파일에 평문으로 두지 않는다"
          - "화면은 자격증명 자체가 아니라 매핑과 참조 키만 관리한다"
        exceptions:
          - "필수 비밀 값이나 참조 대상이 없으면 해당 프로파일을 활성화하지 않고 누락 항목을 알린다"
    outcome: "선택한 환경에서 모듈이 같은 설정 원칙으로 기동된다"

  - id: PRC-02
    name: "자연어 요청 접수와 응답 전달"
    trigger: "업무 담당자가 portal에서 자연어 요청을 보낸다"
    actors: [ACT-001, ACT-002, ACT-005, ACT-007]
    steps:
      - id: PRC-02-01
        name: "요청 계약 검사와 비동기 접수"
        actor: ACT-001
        system: "portal · agent 계약 어댑터"
        input: "계약 버전이 명시된 요청"
        output: "접수된 턴 식별자와 실행 또는 대기 상태"
        reqs: [REQ-005, REQ-007, REQ-009, REQ-013, REQ-014, REQ-023, REQ-031, REQ-036, REQ-038, REQ-040, REQ-101, REQ-102, REQ-308]
        rules:
          - "portal과 agent는 합의한 요청 스키마만 사용한다"
          - "조회 계획 확인의 필요 여부·사용자대기·현재 계획에 대한 유효 응답은 REQ-023을 따른다. 모든 턴에 확인을 강제하지 않으며 PRC-03의 실제 실행 승인과 구분한다"
          - "처리 중 추가 입력의 변경 영향 분류와 사용자 확인은 REQ-031을 따른다. 분류 응답만으로 변경·중단을 확정하지 않으며 최신 요청과 경합·실패 처리는 해당 정본을 따른다"
          - "조회·실행은 지식 기반 통제를 유지하고 지식 불필요 요청은 REQ-101의 AI 업무 연관성 판정과 감사 표식으로 관리한다. LLM의 분류가 권한·실행 승인·전송 동의를 대신하지 못하게 서버가 강제한다"
          - "REQ-036·NFR-023에 따라 요청·상태를 DB에 저장하고 개인 한도가 차면 사용자별 순서 대기에 넣어 안내·취소 조작을 제공한다. 개인 실행 여유가 생기면 앞선 유효 요청부터 자동 처리한다. 사용자대기는 개인 한도에서 제외하고 처리를 계속할 유효 응답을 보관해 같은 순서·한도 확보 절차로 이어간다"
          - "사용자대기 응답은 REQ-005의 현재 요청 연결·유형/입력 검증·미만료·중복 방지를 거친다. 필요한 정보가 모두 확보된 응답·명시적 승인·변경/계속 선택만 같은 턴·시도의 이어가기로 접수한다. 부분 정보는 유효 항목 유지·부족 항목 보완, 거절은 REQ-017의 카드 무효화·최초 기한까지 대기 유지, 중단은 REQ-007·030·033의 중단 접수·호출별 취소/결과 확인·후속 차단·결과 보고, 별개 질의는 원 대기 조건을 임의 해소하지 않는 새 턴 접수로 분기한다. 이어가기 접수 후 개인 순서와 실행 직전 재검사는 REQ-036을 따른다"
          - "대기 턴의 중단과 실행 시작은 같은 상태 조건에서 원자적으로 처리해, 중단된 턴을 시작하지 않는다"
          - "모든 상태의 원 질의에서 명시적으로 새 턴을 요청할 수 있다(REQ-013). 원 턴의 진행/종결을 유지하고 새 입력/응답을 REQ-019의 메시지 기록 순서에 추가하며 원본과 양방향 이동한다. 현재 권한·개인 순서·쿼터·새 승인과 이전 실행 결과 확인을 적용한다"
          - "REQ-014의 세션 전체 질의 목록은 상태와 중단 표식을 표시하고 항목 클릭으로 연결 응답을 모달/팝업 레이어에서 확인하며 새 턴 요청·자주 쓰는 질의 등록을 제공한다. 목록/레이어는 본문 원본 위치 이동을 제공하지 않고 응답 조회만으로 본문 로드 범위·과거 조회 경계·스크롤을 바꾸지 않는다. 응답 열람은 REQ-014.response_preview를 따르며 목록/응답 열람/버튼 접수·등록에는 별도 LLM 호출이 없고 질의 즐겨찾기는 REQ-201의 기존 관리와 입력 종류별 등록 자격으로 연결한다. 조회/등록으로 질의를 자동 실행하거나 이전 질의 재요청 의향을 되묻지 않는다"
        exceptions:
          - "지원하지 않는 계약 주 버전이면 조용히 무시하지 않고 접수를 거부한다"
          - "개인 한도 때문에 대기하면 자동 처리 예정과 취소 방법을 안내한다. 취소/시작 경합·승인 만료는 REQ-036의 상태 판정에 따라 알린다"
      - id: PRC-02-02
        name: "사용자와 데이터 접근 권한 판정"
        actor: ACT-002
        system: "common 권한 판정 컴포넌트"
        input: "사용자 신원·소속 그룹·요청 대상"
        output: "허용 범위와 마스킹 모드"
        reqs: [REQ-103]
        rules:
          - "허용 그룹 매핑이 없으면 기본값으로 차단한다"
        exceptions:
          - "사용자나 대상의 매핑이 없으면 실행하지 않고 중립적인 거부 사유를 반환한다"
      - id: PRC-02-03
        name: "허용된 데이터로 외부 모델 호출"
        actor: ACT-007
        system: "agent 외부 모델 호출 컴포넌트"
        input: "현재 접근·마스킹을 적용한 지식·카탈로그·필터 명세와 REQ-106의 유효 요청·동의 범위에 포함된 자료"
        output: "모델 응답·SQL과 분리된 기본 필터 제외 요청 명세·사용량"
        reqs: [REQ-021, REQ-039, REQ-106, REQ-112, REQ-611]
        rules:
          - "모델 입력에 필요한 지식·카탈로그 후보의 합산·현재 권한 확인·객체/컬럼 선별과 다중 데이터소스 보존은 REQ-021을 따른다. 관련 지식을 모두 주입하거나 데이터소스부터 하나로 제한하지 않는다"
          - "업무 결과 전송은 REQ-106의 요청·동의·접근·마스킹·상한을 호출 직전에 검사한다. 직접 입력은 안내된 제출을 해당 자료의 동의로 기록하고 기존 결과의 동의 없는 자동 재전송은 금지한다"
          - "사용자 입력·조회 데이터·지식의 지시성 문장을 시스템 명령으로 해석하지 않으며, 정책 판정은 서버 규칙이 최종 결정한다"
          - "기본 필터 제외 의도는 REQ-611의 명세로 전달하고 실행 전 agent가 검증한다. 모델이 행 스코프·실사용자 신원을 변경하거나 미검증 제외로 조회하지 못하게 한다"
        exceptions:
          - "공급 경로 호출 실패·취소·늦은 응답은 REQ-007·039에 따라 실제 결과에 맞게 처리한다. 실패를 사용자 중단이나 성공으로 임의 바꾸지 않으며 이미 발생한 외부 실행 결과는 별도로 보존한다"
      - id: PRC-02-04
        name: "처리 사실과 판정 기록"
        actor: ACT-005
        system: "agent 감사 이력 기록"
        input: "요청·판정·호출·응답·비용 정보"
        output: "변경할 수 없는 감사 이력"
        reqs: [REQ-107, REQ-108, REQ-109]
        rules:
          - "기록은 성공·실패와 무관하게 외부 업무 트랜잭션과 독립해 확정한다. 접수·스텝 시작 시 생성과 현재 상태 갱신/불변 전이 사건 추가는 REQ-107.history_storage를 따르며 Hub 상태 변경과 그 전이 사건은 함께 확정한다. REQ-107의 요청/실제 처리 유형·출처·업무 판정 표식·동의/실제 전송·관리자 검토로 필터링한다"
        exceptions:
          - "필수 선행 기록 실패 시 새 호출을 시작하지 않는다. 외부 처리 이후 기록 실패는 성공으로 공개하지 않고 확인·대조하며 외부 실행을 자동 반복하거나 실패로 단정하지 않는다(REQ-107.history_storage)"
      - id: PRC-02-05
        name: "최종 응답 계약 전달과 표시"
        actor: ACT-001
        system: "agent 응답 계약 · portal 표현 어댑터"
        input: "agent가 통제를 끝낸 최종 응답과 메타데이터"
        output: "agent 계약의 사용자 문구와 의미 블록을 portal이 누락·재해석 없이 표시한 응답"
        reqs: [REQ-007, REQ-009, REQ-027, REQ-104]
        rules:
          - "업무 처리의 안내·오류·대안·경고 문구는 agent 계약이 생산하며 portal은 해당 문구를 변경하지 않는다. 통신·해석·표시 실패의 로컬 안내는 ARCH-019.local_failure를 따르고 업무 상태 변경·승인 기한 연장·업무 호출 자동 재전송으로 이어지지 않는다"
          - "agent는 의미·데이터·사용자 문구를 반환하고 portal은 계약이 정한 표시 여부와 레이아웃만 적용한다 — 문구 내용은 바꾸지 않는다"
          - "중단 접수·반영 결과와 호출별 취소/업무 결과는 REQ-007.result_reporting에 따라 LLM 없이 서버 근거로 전달한다. portal은 접수만으로 최종 처리를 끝내지 않고 기존 폴링/재접속으로 현재 결과를 표시한다"
          - "모르는 선택 필드·표현 블록은 REQ-027에 따라 표시 불가 범위를 안내하고 사용자 선택으로 안전한 원문 보기/동의된 재가공을 제공한다"
        exceptions:
          - "계약 자체를 해석할 수 없으면 전체를 무시하지 않고 지원하지 않는 버전으로 처리한다"
      - id: PRC-02-06
        name: "채팅·저장 조회 품질 신고와 처리 결과 회신"
        actor: ACT-001
        system: "portal 품질 신고 · admin 품질 관리"
        input: "채팅 턴·응답 회차 또는 본인 저장 조회의 개별 실행·오류 발생 ID와 신고 사유"
        output: "대상 처리 근거·조사 연결과 개별 진행 안내·처리 결과가 남은 품질 신고"
        reqs: [REQ-110]
        rules:
          - "대상별 근거·증거 보존과 접수·검토·종결·개별 회신은 REQ-110을 따른다. 저장 조회 신고에 없는 턴이나 모델 호출을 만들지 않는다"
          - "담당자가 관련성을 확인해 PRC-10의 오류·품질 조사에 연결한다. 같은 턴만으로 같은 문제라고 판정하지 않고, 특정 오류의 기존 조사 안내에서도 신고 원본·추가 설명은 보존한다"
          - "조사가 완료돼도 각 신고의 조치 적용 여부와 사용자용 회신을 확인한 뒤 신고를 종결한다"
        exceptions:
          - "신고자가 자신의 처리 결과와 사유를 보지 못한 채 종결하지 않는다"
      - id: PRC-02-07
        name: "질의 즐겨찾기·저장된 조회·개인 대시보드 사용"
        actor: ACT-001
        system: "portal 질의 즐겨찾기 · 저장 조회 · 개인 대시보드"
        input: "세션 질의 목록의 개인 즐겨찾기 등록·관리 요청 또는 성공한 조회 이력·저장된 조회·대시보드 위젯 실행 요청"
        output: "개인 즐겨찾기 등록/관리 결과 또는 사용자 전송·실행 요청에 따른 현재 권한의 질의·저장 조회·대시보드 결과"
        reqs: [REQ-014, REQ-201, REQ-202, REQ-203, REQ-204, REQ-205, REQ-206, REQ-207]
        rules:
          - "즐겨찾기 등록/관리는 실행하지 않고 선택해 입력창에 반영한 뒤 사용자가 전송해야 새 턴으로 처리한다. 목록 등록 자격은 REQ-201.favorite_eligibility를 따른다. 저장된 조회는 REQ-202의 성공한 조회 실행 요청을 보존하고 REQ-203의 파라미터화·바인딩을 거쳐 원 조회 도구 호출과 같은 agent 입력으로 복원한다. LLM을 호출하거나 사용자 입력 SQL을 등록하지 않는다"
          - "실행마다 참조 객체·현재 사용자 그룹·데이터소스 접근·신원 매핑·행 스코프·마스킹·상한과 시간 제한을 다시 판정한다"
          - "기본 필터 제외를 포함한 복원 요청은 REQ-207의 동일 SQL 검증·정책 적용·실행 경로로 전달한다. 계약 미지원·필수 인자 유실이면 SQL만으로 대신 실행하지 않으며 현재 정책 검증 실패와 함께 개별 실행 실패로 남긴다. 과거 허용 판정·신원·실행 ID를 재사용하지 않는다"
          - "사용자 간 공유 대신 인증 예제 후보로 승격하며, 운영 활용 전 PRC-09-05·07·06의 요청·기술 검토·최종 승인·반영을 거친다(REQ-205·302). 대시보드 위젯은 수동 실행을 기본으로 하고 주기 자동 갱신을 제공하지 않는다"
          - "즐겨찾기는 자유롭게 문장을 수정할 수 있으나 위젯 대상은 아니다(REQ-201). 저장 조회의 신규 저장·삭제·오류 복구와 실행별 기록은 REQ-202·204·207을 따른다"
          - "저장 조회 오류의 실제 재시도는 대기시간 후 사용자 요청으로만 하고, 실행 성공 시 활성 복귀한다. 개별 실패에서 PRC-02-06으로 신고하거나 PRC-10에서 조사에 연결할 수 있다"
        exceptions:
          - "공개 객체 변화·권한 상실·신원 매핑 부재·사용자 비활성화로 실행할 수 없으면 저장 항목을 자동 삭제하거나 객체 존재를 드러내지 않고 사유를 안내한다"
    outcome: "사용자는 통제를 거친 결과를 받고 감사 담당자는 같은 처리의 근거를 추적할 수 있다"

  - id: PRC-03
    name: "등록된 업무 API 실행"
    trigger: "사용자 요청에 등록된 업무 액션이 포함된다"
    actors: [ACT-001, ACT-002, ACT-005, ACT-006]
    steps:
      - id: PRC-03-01
        name: "실행 가능성과 유효 승인 근거 판정"
        actor: ACT-002
        system: "common 권한 판정 · agent 실행 통제"
        input: "대상 API·현재 실행자 그룹·실제 파라미터·실행 모드와 해당 승인 근거"
        output: "실행 허용 또는 거부"
        reqs: [REQ-005, REQ-017, REQ-026, REQ-105, REQ-114, REQ-405]
        rules:
          - "여러 액션의 순서·실제 값 확보·일괄 승인과 앞선 결과에 의존하는 액션의 개별 승인은 REQ-026을 따른다. 앞선 실행 결과로 값이 달라진 후속 액션에 과거 승인을 적용하지 않는다"
          - "등록되지 않았거나 그룹 판정에 실패한 API는 실행하지 않는다"
          - "일반 실행·워크플로우 수동 실행은 요청 사용자가 승인한 액션·순서·파라미터로만 실행한다. RM-P3 예약 실행은 REQ-405의 관리자 활성화 승인과 현재 실제 값/범위의 서버 판정을 통과한 액션에 한정해 자동 승인할 수 있다"
          - "REQ-005.execution_parameter_storage에 따라 실제 호출 전 확정한 원값을 전용 임시 테이블에 암호화해 보호한다. 수동 경로는 승인 카드와 실제 호출을 같은 원값 버전으로 연결하고, 자동 경로는 REQ-405의 실행별 적합성 판정과 실제 호출을 같은 원값 버전으로 연결하며 가짜 승인 카드를 만들지 않는다"
          - "수동 승인 경로에서는 REQ-005.approval_presentation의 현재 요청 상세에서 전체 값을 확인한 최종 조작을 검사한다. 질문/보류·거절·재승인과 기한은 REQ-017을 따르며 변경 확정·교체된 카드의 이전 승인을 현재 값에 적용하지 않는다."
        exceptions:
          - "해당 실행 모드의 유효 승인 근거가 없거나 대상·순서·실제 값이 승인 범위 밖이거나 기한이 지났으면 실행하지 않는다. 자동 경로는 REQ-405를 검사하며 수동 카드 승인과 서로 위장하지 않는다"
      - id: PRC-03-02
        name: "업무 시스템 호출"
        actor: ACT-006
        system: "agent 업무 API 어댑터"
        input: "허용된 API와 현재 신원 매핑·수동 또는 REQ-405 자동 승인 근거·원값 버전을 검사해 암호화 임시본에서 복원한 실제 파라미터"
        output: "업무 시스템의 실행 결과"
        reqs: [REQ-005, REQ-007, REQ-026, REQ-105]
        rules:
          - "Hub는 등록된 방식으로만 호출하고 업무 상태의 원천을 자기 DB에 복제하지 않는다"
          - "결과 안내·질문과 사용자 응답 이후 처리는 REQ-009.result_dialogue로 연결한다. REQ-608·612의 공통 결과 가이드와 REQ-303의 업무별 매핑 설명을 참조하고, 필요한 선택은 REQ-005의 기존 대기로 받으며 후속 호출의 현재 후보·권한·계약·승인을 검증한다"
          - "호출과 기존 명세상 필요한 후속 처리·허용 재시도 종료 뒤 원값 임시본을 삭제한다. 중단·만료·무효화·삭제 실패의 사용 차단과 정리는 REQ-005를 따르고 감사에는 마스킹한 값만 남긴다"
          - "중단과 전송 시도 경합, 전송 후 취소 불가 안내·남은 액션 중단, 실행 타임아웃의 결과 불명·자동/무확인 재실행 차단·확인/수동 확인과 사용자 보고는 REQ-007을 따른다. 사용자 확인 후 새 승인·원 실행 연결 후속 실행 및 반복 경계는 REQ-105.manual_reexecution을 적용한다"
        exceptions:
          - "실패하면 그 지점에서 중단하고 남은 액션의 실행 여부를 임의로 판단하지 않는다"
      - id: PRC-03-03
        name: "실행 이력 기록"
        actor: ACT-005
        system: "agent 감사 이력 기록"
        input: "API·파라미터·결과·승인 이력"
        output: "감사 이력"
        reqs: [REQ-107]
        rules:
          - "업무 트랜잭션의 성공·롤백과 무관하게 발생 사실을 기록한다"
        exceptions:
          - "기록 실패는 실행 성공으로 보고하지 않는다"
    outcome: "허용된 업무 액션만 실행되고 결과와 승인 근거가 추적된다"

  - id: PRC-04
    name: "사용자 상태 동기화"
    trigger: "인사 시스템이나 그룹웨어가 퇴직·조직 이동 이벤트를 보낸다"
    actors: [ACT-002, ACT-005, ACT-008]
    steps:
      - id: PRC-04-01
        name: "사용자 변경 이벤트 접수"
        actor: ACT-008
        system: "common 사용자 변경 수신 인터페이스"
        input: "원천 시스템의 사용자 변경 이벤트"
        output: "검증된 변경 요청"
        reqs: [REQ-103]
        rules:
          - "외부 인터넷이 아니라 고객사 폐쇄망 내부의 등록된 원천에서만 받는다"
        exceptions:
          - "원천이나 대상 사용자를 식별하지 못하면 적용하지 않고 실패 이력을 남긴다"
      - id: PRC-04-02
        name: "접근 상태 변경과 기록"
        actor: ACT-002
        system: "common 계정·권한 컴포넌트"
        input: "검증된 퇴직·조직 이동 정보"
        output: "비활성화 또는 관리자 확인 대기 상태"
        reqs: [REQ-103, REQ-107]
        rules:
          - "퇴직은 비활성화하고 조직 이동은 일시 비활성화한 뒤 관리자에게 알린다"
        exceptions:
          - "정책 변경 이력을 남기지 못하면 변경을 성공 처리하지 않는다"
    outcome: "계정 원천의 변경이 Hub 접근 상태에 반영되고 변경 근거가 남는다"

  - id: PRC-05
    name: "계약 버전 배포 전환"
    trigger: "portal과 agent 사이의 계약이나 이를 구현한 서버를 배포한다"
    actors: [ACT-009]
    steps:
      - id: PRC-05-01
        name: "신규 서버군 격리 기동"
        actor: ACT-009
        system: "고객사 배포·트래픽 제어 환경"
        input: "신규 서버 버전과 실행 프로파일"
        output: "사용자 접근이 차단된 신규 서버군"
        reqs: [REQ-402]
        rules:
          - "기존 서버군은 사용자 서비스를 계속하고 신규 서버군에는 운영 트래픽을 보내지 않는다"
        exceptions:
          - "기동 또는 상태 점검이 실패하면 트래픽을 전환하지 않는다"
          - "고객사 환경이 서버군 격리와 일괄 전환을 지원하지 않으면 이 절차를 무중단으로 간주하지 않는다. 계약 호환 롤링 배포를 별도로 검증하거나 계획된 중단 배포로 전환한다"
      - id: PRC-05-02
        name: "요청·응답 계약 시험"
        actor: ACT-009
        system: "Agent 계약 시험 화면"
        input: "지원 계약 버전별 대표 요청"
        output: "agent 응답 원문과 스키마 검증 결과"
        reqs: [REQ-009, REQ-027]
        rules:
          - "계약 시험 화면은 응답을 의미 변환 없이 안전한 원문으로 표시한다"
          - "실제 portal은 계약상 알고 있는 데이터만 처리한다"
          - "계약 시험은 합성 데이터를 기본으로 하고, 운영 응답 원문은 권한을 가진 내부 운영자만 감사 이력을 남기며 예외적으로 열람한다"
        exceptions:
          - "필수 필드·상태·오류 의미가 계약과 다르면 신규 서버군을 활성화하지 않는다"
          - "원문에 허용되지 않은 민감정보가 포함되면 화면에 표시하지 않고 보안 실패로 기록한다"
      - id: PRC-05-03
        name: "신규 서버군으로 접근 전환"
        actor: ACT-009
        system: "고객사 트래픽 제어 환경"
        input: "계약 시험과 상태 점검을 통과한 신규 서버군"
        output: "신규 서버군으로 향하는 사용자 트래픽"
        reqs: [REQ-009]
        rules:
          - "서버 빌드 버전과 API 계약 버전을 같은 것으로 취급하지 않는다"
          - "접수된 턴에는 접수 당시 계약 버전을 기록한다"
        exceptions:
          - "이전 portal이나 진행 중인 턴이 남으면 버전 불일치를 감지해 재접속시키거나 해당 계약을 한시적으로 유지한다"
          - "전환 뒤 핵심 요청이나 상태 조회가 실패하면 이전 DB 구조가 남아 있는 되돌림 기간 안에서 접근을 이전 서버군으로 복귀시킨다"
      - id: PRC-05-04
        name: "이전 서버군 정리"
        actor: ACT-009
        system: "고객사 배포·트래픽 제어 환경"
        input: "이전 계약의 진행 중 턴·접속·되돌림 기간 현황"
        output: "이전 서버군과 계약 경로의 비활성화"
        reqs: [REQ-009]
        rules:
          - "신규 서버 준비뿐 아니라 이전 계약의 진행 중 턴과 기존 클라이언트가 없는 것도 확인한다"
          - "되돌림 기간이 끝나기 전에는 이전 DB 구조를 제거하지 않는다"
        exceptions:
          - "진행 중 요청이나 되돌림 필요성이 남아 있으면 이전 계약 경로를 닫지 않는다"
    outcome: "서버 다중화 환경에서 진행 중 요청을 잃지 않고 계약 버전을 전환한다"

  - id: PRC-06
    name: "관리자 계정과 관리 접근 권한 운영"
    trigger: "관리자의 등록·이동·퇴직, 관리 역할 변경 또는 관리 화면/API 배포로 관리자 접근 범위를 바꿔야 한다"
    actors: [ACT-012]
    steps:
      - id: PRC-06-01
        name: "계정 상태와 접속 조건 관리"
        actor: ACT-012
        system: "system 관리자 자체 계정 관리"
        input: "사용자 식별 정보 · 사용 기간 · 접속 허용 IP · 잠금·휴면 상태"
        output: "로그인 가능 여부와 활성 세션 상태"
        reqs: [REQ-501]
        rules:
          - "관리자 계정 상태·기간·잠금·휴면·IP를 모두 통과한 자체 관리자만 관리자 세션을 얻는다. Portal 계정·SSO·세션과 자동 연결/동기화하지 않는다"
        exceptions:
          - "계정은 존재하지만 어느 조건 하나라도 통과하지 못하면 로그인시키지 않고 해당 사유를 남긴다"
      - id: PRC-06-02
        name: "역할과 개인 예외 권한 관리"
        actor: ACT-012
        system: "system 유효 권한 관리"
        input: "관리자 계정 · 역할 · 관리 메뉴별 액션 부여와 회수"
        output: "현재 시점의 사용자별 유효 권한"
        reqs: [REQ-502]
        rules:
          - "역할 권한과 개인 예외를 한 계산 규칙으로 합성하고 변경 즉시 기존 세션의 권한 버전을 무효화한다"
        exceptions:
          - "권한 변경으로 현재 사용자가 영향받으면 저장 전에 영향 사용자를 알려 준다"
      - id: PRC-06-03
        name: "메뉴와 API 권한 사슬 맞추기"
        actor: ACT-012
        system: "system 메뉴·API 카탈로그"
        input: "배포된 화면 경로 · 서비스 API · 메뉴별 액션"
        output: "메뉴 노출과 API 호출이 같은 권한을 따르는 매핑"
        reqs: [REQ-503]
        rules:
          - "메뉴·화면·API 중 하나라도 매핑이 없으면 접근을 허용하지 않는다"
        exceptions:
          - "화면은 열리지만 필요한 API가 매핑되지 않은 경우를 API 카탈로그에서 진단 가능하게 드러낸다"
    outcome: "사용자는 현재 계정 상태와 유효 권한에 맞는 화면·액션·API만 사용한다"

  - id: PRC-07
    name: "백오피스 공통 기준 운영"
    trigger: "화면과 서버가 함께 쓰는 코드·문구·설정 값을 추가하거나 바꿔야 한다"
    actors: [ACT-012]
    steps:
      - id: PRC-07-01
        name: "공통코드와 참조 규칙 관리"
        actor: ACT-012
        system: "system 공통코드 관리"
        input: "코드 그룹 · 코드 · 참조 코드 정의와 값"
        output: "참조 무결성을 만족하는 공통코드"
        reqs: [REQ-504]
        rules:
          - "시스템 보호 그룹·코드는 삭제·비활성화하지 못하고, 코드가 남은 그룹은 삭제하지 못한다"
        exceptions:
          - "참조 정의와 값이 맞지 않으면 저장하지 않고 어느 정의가 어긋났는지 알리며, 원본을 삭제하면 파생 참조값과 코드명을 같은 트랜잭션에서 정리한다"
      - id: PRC-07-02
        name: "다국어 메시지 값 관리"
        actor: ACT-012
        system: "system 다국어 메시지 관리"
        input: "소스와 시드가 만든 메시지 키 · 언어별 값"
        output: "화면과 서버가 조회하는 언어별 문구"
        reqs: [REQ-505]
        rules:
          - "관리 화면은 키를 새로 만들지 않고 값과 미사용 키 정리만 담당한다"
        exceptions:
          - "요청 언어 값이 없으면 정해진 기본 언어 또는 키 문자열로 폴백한다"
      - id: PRC-07-03
        name: "시스템 설정 변경"
        actor: ACT-012
        system: "system 환경설정 관리"
        input: "설정 키의 허용 범위 안에서 바꾼 값"
        output: "검증을 통과해 적용되고 이력이 남은 설정"
        reqs: [REQ-506]
        rules:
          - "보호 설정과 런타임 영향 설정은 값 검증과 경고를 통과한 뒤에만 반영한다"
        exceptions:
          - "값 형식이나 범위가 틀리면 이전 유효 값을 유지한다"
    outcome: "모든 모듈이 같은 코드·문구·공통 설정을 읽고 변경 실패가 부분 적용으로 남지 않는다"

  - id: PRC-08
    name: "백오피스 공통 운영과 추적"
    trigger: "관리자가 운영 상태를 확인하거나 배치·공지·알림 요청을 처리해야 한다"
    actors: [ACT-001, ACT-005, ACT-012]
    steps:
      - id: PRC-08-01
        name: "로그인·사용·오류 이력 조회"
        actor: ACT-005
        system: "system 운영 이력"
        input: "조회 기간 · 사용자 · 경로 · 결과 조건"
        output: "수정할 수 없는 이력 목록과 요청·오류 상세"
        reqs: [REQ-507]
        rules:
          - "조회 화면에서 원 이력을 수정하거나 삭제하지 않는다"
        exceptions:
          - "상세 API를 직접 호출해도 해당 이력 메뉴의 READ 권한을 통과하지 못하면 전문을 내주지 않는다"
      - id: PRC-08-02
        name: "배치 등록·실행·중단과 이력 확인"
        actor: ACT-012
        system: "system 배치 운영"
        input: "배치 구현 식별자 · 크론 · 시간대 · 즉시 실행 또는 중단 요청"
        output: "검증된 일정과 실행 상태·결과 이력"
        reqs: [REQ-508]
        rules:
          - "등록된 구현만 실행하며 같은 배치의 중복 실행을 막는다"
        exceptions:
          - "유령 실행은 LOST로 남기고, 중단 요청은 요청 시각과 실제 작업 결과를 구분한다. 작업이 중단을 보고하면 CANCELED, 정상 완료하면 SUCCESS로 기록한다"
      - id: PRC-08-03
        name: "공지와 알림 요청 처리"
        actor: ACT-012
        system: "system 공지·알림"
        input: "공지 내용 또는 사용자의 권한·계정 관련 요청"
        output: "노출 기간이 적용된 공지 또는 처리 상태와 사유"
        reqs: [REQ-509]
        rules:
          - "알림 요청 처리는 실제 권한·계정 변경과 분리하고 판정과 사유만 기록한다"
        exceptions:
          - "노출 기간 밖의 공지는 목록에 남아도 사용자 팝업으로 노출하지 않는다"
      - id: PRC-08-04
        name: "사용자 공통 상태 유지"
        actor: ACT-001
        system: "system 사용자 공통 상태"
        input: "즐겨찾기 · 그리드 설정 · 저장 조회조건 · 메뉴 사용 통계"
        output: "관리 콘솔과 portal이 함께 쓸 수 있는 사용자별 공통 상태"
        reqs: [REQ-510]
        rules:
          - "특정 화면 모듈에 종속되지 않는 사용자 상태만 system이 소유한다"
        exceptions:
          - "화면이나 메뉴가 사라진 뒤 남은 사용자 상태는 기능 데이터로 승격하지 않고 정리 대상으로 구분한다"
    outcome: "관리자는 공통 운영 기능을 실행하고 그 결과와 사용 흔적을 같은 기준으로 추적한다"

  - id: PRC-09
    name: "공개 데이터 인터페이스·지식 반영 관리"
    trigger: "새 데이터소스 또는 업무 지식을 Hub의 지식·조회 대상에 처음 등록하거나, 고객사 DB/DW 변경이 Hub 공개 범위에 영향을 줄 수 있다"
    actors:
      - "ACT-002"
      - "ACT-003"
      - "ACT-010"
      - "ACT-014"
    steps:
      - id: PRC-09-01
        name: "업무·데이터·구현 관계 수집"
        actor: "ACT-003"
        system: "admin 업무 자산 관리"
        input: "데이터소스 정보 · 고객사가 선택한 공개 뷰·테이블의 스키마 사실 · 개발 구현 상세 · 업무 흐름과 용어"
        output: "업무 관계가 연결된 공개 카탈로그 등록 초안"
        reqs:
          - "REQ-301"
          - "REQ-303"
        rules:
          - "업무 자산 관리자는 업무 분석·데이터 관리·구현 상세 이해를 함께 갖춰야 한다"
          - "Hub 카탈로그는 업무 DB/DW 전체 스키마가 아니라 고객사가 선택한 공개 뷰·테이블만 등록한다"
          - "미완성·미검수 범위는 관리자 초안으로 저장할 수 있지만 AI 주입·업무 조회에서 제외한다(REQ-301)"
        exceptions:
          - "업무 관계나 구현 근거가 불명확하면 지식과 인증 예제 쿼리를 공개하지 않고 근거를 보완한다"
      - id: PRC-09-02
        name: "카탈로그·지식·인증 예제 쿼리 검수"
        actor: "ACT-003"
        system: "admin 업무 자산 관리"
        input: "연결된 카탈로그 등록 초안"
        output: "업무 의미·참조 공개 인터페이스가 검수된 지식과 인증 예제 쿼리"
        reqs:
          - "REQ-301"
          - "REQ-302"
          - "REQ-303"
          - "REQ-608"
        rules:
          - "지식은 카탈로그의 참조 공개 인터페이스 링크로 업무와 연결하고 물리명·SQL을 자유 텍스트로 복제하지 않는다"
          - "예제 후보 SQL에서 공개 참조 객체를 추출해 예제 자체에 카탈로그를 자동 매핑한다. 지식의 예제·직접 카탈로그는 독립 연결하고 조회 시 두 경로를 합산하며 예제 매핑을 지식에 복사하지 않는다. 버전·권한·연결 해제·미등록·추출 불확실 처리는 REQ-302·303을 따른다"
          - "지식의 API·커스텀 도구 연결과 각 매핑 건의 용도·사용 조건·입력 확보·조회·선택·결과 안내·사용자 선택별 후속 설명을 검수하고 공통 입력 계약·결과 가이드는 등록 원천을 참조한다. 지식 본문에 특정 도구의 사용 안내를 중복하지 않으며 매핑 설명과 대상의 일치 여부를 확인한다. 지식 매핑 변경 승인과 API·도구 자체 갱신의 구분은 REQ-303·REQ-608·REQ-612를 따른다"
        exceptions:
          - "카탈로그와 지식·예제 쿼리의 참조 관계가 끊기면 등록을 확정하지 않는다"
      - id: PRC-09-03
        name: "보안 정책 직접 반영과 오픈 전 보안 검수"
        actor: "ACT-002"
        system: "제품 오픈 전 보안 검수"
        input: "카탈로그에 적용된 그룹 매핑 · 마스킹 · 행 스코프 · 전송 허용 · 중대한 변경의 사유와 근거"
        output: "오픈 가능한 정책 적용 확인과 변경 이력"
        reqs:
          - "REQ-103"
          - "REQ-106"
          - "REQ-301"
        rules:
          - "지식·예제·카탈로그의 내용/접근 그룹·컬럼 예외도 원 소유 전체 구성으로 직접 저장한다. 사용자 소속·그 밖의 정책도 현재 변경 권한·기대 버전·참조 검증·변경 이력을 적용한다. 초기 오픈 전 고객사 보안 검수는 유지한다."
          - "중대한 정책 변경은 사유·근거·실제 전후 전체 구성과 행위자/시각을 남긴다."
        exceptions:
          - "정책이 적용되지 않았거나 보안 검수를 통과하지 못하면 해당 자산을 오픈하지 않는다"
      - id: PRC-09-04
        name: "등록 공개 범위 구조 관측"
        actor: "ACT-003"
        system: "admin 데이터소스 수동 구조 비교/관측"
        input: "등록 공개 테이블/뷰·기준 카탈로그 정의·현재 원천 구조 관측"
        output: "구조 차이/부재/미지원/조회 실패와 기준·관측 시각"
        reqs:
          - "REQ-301"
          - "REQ-304"
        rules:
          - "등록 공개 범위만 명시 비교하고 업무 DB 전체 대사/다운로드를 강제하지 않는다."
          - "관측은 구조 사실일 뿐 업무 의미 변화·지식 보완 필요를 판정하지 않는다. 업무 의미 검토는 운영/유지보수 조직의 자체 프로세스다."
          - "현재 사용처/참조 경로 조회와 SQL/API 기술 계약·필수 참조 무결성 검증은 유지한다. 연결 지식 본문 수집·영향 판정/배정/완료 작업은 제공하지 않는다."
        exceptions:
          - "조회 실패/미지원/미확인을 부재 또는 구조 일치로 바꾸지 않는다."
          - "관측 결과로 카탈로그/지식 값을 자동 수정·활성/비활성화하지 않는다."
      - id: PRC-09-05
        name: "전체 변경 구성 작성과 직접 저장"
        actor: "ACT-003"
        system: "admin 원 소유 자산 관리"
        input: "현재 적용본·기대 버전·전체 편집 구성·변경 사유·필수 기술 근거"
        output: "서버 검증에 전달할 전체 직접 저장 입력"
        reqs:
          - "REQ-305"
          - "REQ-306"
          - "REQ-308"
        rules:
          - "현재 변경 권한자가 소유 전체 구성을 편집하고 실제 함께 바꾸는 대상만 하나의 원자 변경 단위로 지정한다."
          - "별도 관리자 요청·기술 검토 완료·최종 승인/전결을 만들지 않는다. 다음 기술 검증·실제 반영은 같은 저장의 서버 내부 처리이며 다른 관리자의 수동 단계를 요구하지 않는다."
        exceptions:
          - "입력 오류는 현재값을 바꾸지 않고 로컬 편집과 보완 근거를 유지한다."
      - id: PRC-09-07
        name: "직접 저장의 서버 기술·권한 검증"
        actor: "ACT-010"
        system: "admin 소유 서버 검증"
        input: "한 번의 전체 직접 저장 입력·현재 권한·기대 버전·필수 참조/기술 계약"
        output: "같은 저장 트랜잭션의 검증 결과"
        reqs:
          - "REQ-305"
          - "REQ-306"
        rules:
          - "현재 변경 권한·기대 버전·필수 입력/유일성·참조·SQL/API 계약을 부모 잠금 경계에서 검증한다."
          - "관리자 검토 큐/판정·지식 업무 의미 영향 확인이 아닌 저장 내부의 기계 검증이다."
        exceptions:
          - "한 대상의 검증 실패도 같은 전체 저장을 거부하고 기존 적용값/이력을 유지한다."
      - id: PRC-09-06
        name: "직접 저장의 전체 적용·이력 확정"
        actor: "ACT-010"
        system: "admin 소유 서버 반영"
        input: "같은 저장에서 검증한 전체 구성/기준본"
        output: "현재값·결과 리비전·전체 HIST/HISTORY_NO·원 명령 결과"
        reqs:
          - "REQ-305"
          - "REQ-306"
        rules:
          - "현재값·전체 자식·행위자/시각·리비전·HIST와 원 명령 결과를 같은 트랜잭션으로 확정한다."
          - "같은 명령 재전송은 원 결과만 반환하고 일부 이력/반영 실패는 전체 롤백한다. 원천 외부 실행 성공으로 관리 저장을 가장하지 않는다."
        exceptions:
          - "결과 불명은 새 명령/새 승인으로 재적용하지 않고 원 명령키로 확인한다."
    outcome: "현재 권한자가 공개 카탈로그·지식·예제·매핑을 직접 저장하고 기술 검증·전체 변경 이력을 보존한다. 업무 의미 영향 검토는 운영조직 자체 절차이며 관리자 승인 단계는 없다."
    direct_management: "REQ-601.direct_management. 변경은 소수의 업무 전문가·관리자에게 부여한 해당 메뉴/대상/액션의 현재 유효 권한으로 직접 저장한다. 별도 관리자 요청·기술 검토 완료·최종 승인·반려·전결 또는 승인 사용 설정을 두지 않는다. 필수 입력·참조·현재 권한·기대 버전 검증과 변경 전후 전체 이력·행위자·시각·사유를 같은 성공 단위로 보존한다."
  - id: PRC-10
    name: "오류·품질 조사·조치와 향후 품질 평가 후보"
    trigger: "담당자가 채팅 오류·품질 신고·저장 조회 실행 실패·추적 감사 검토 근거를 확인해 공통 조사·조치가 필요하다고 판단한다"
    actors:
      - "ACT-005"
      - "ACT-003"
      - "ACT-002"
      - "ACT-012"
    steps:
      - id: PRC-10-01
        name: "발생 기록 확인과 오류·품질 조사 생성·연결"
        actor: "ACT-005"
        system: "admin 오류·품질 조사 · 채팅 오류·신고·저장 조회 실행 이력"
        input: "채팅 오류 발생 ID·품질 신고 ID·저장 조회 ID와 개별 실행/오류 ID·감사 검토 기록과 턴/스텝·실제 처리 근거"
        output: "원본 발생을 보존한 조사 건과 담당자·근거 연결·사용자 진행 안내"
        reqs:
          - "REQ-115"
        rules:
          - "채팅 오류는 발생별 원본과 실제 턴·스텝·모델 입력 증거를 보존하고, 저장 조회 실패는 REQ-207의 실행 이력을 참조한다. 기록·마스킹·열람 규칙은 REQ-115가 정본이다"
          - "담당자가 관련성을 확인해 오류·신고·개별 실행·추적 감사 검토 근거를 조사에 연결한다. 필요한 증거의 보호 범위·담당자·사유를 기록하고 REQ-107.retention_policy에 따라 해제한다. 코드·메시지·턴 일치로 같은 원인을 자동 판정하거나 조사 건을 자동 생성하지 않는다"
          - "잘못된 연결은 사유를 남겨 취소하고 필요하면 다시 연결한다. 현재 연결과 연결·취소 이력을 구분해 조회하며 원본 보존·권한·상태 분리 규칙은 REQ-115를 따른다"
          - "원본 목록에서 턴·회차 또는 저장 조회의 개별 실행 근거로 당시 지식·카탈로그·SQL을 확인하고 조사를 등록·연결한다. 조사 상세에서도 관련 원본을 조회하고 현재 자산과 당시 사용 근거를 구분한다"
          - "조사 담당자 배정은 system public 알림 계약으로 알린다. 발생마다 알림을 보내지 않고 당일·주간 유형별 현황과 미연결·미처리 현황을 조회한다"
          - "신고 원본·신고 상태는 유지하고 관련 조사 진행 안내와 개별 회신은 REQ-110을 따른다"
        exceptions:
          - "원인·관련성이 불명확하면 기존 완료 조사에 해결된 발생으로 임의 연결하지 않는다"
      - id: PRC-10-02
        name: "조사·조치 검증과 완료 후 사후 연결·재발 처리"
        actor: "ACT-005"
        system: "admin 오류·품질 조사와 원 소유 자산/정책 직접 관리"
        input: "연결 근거·영향 자산·담당자 분석·조치 적용 시각과 범위·검증 결과"
        output: "실제 직접 변경 이력·적용 범위/시각·조치 검증/신고 회신 근거"
        reqs:
          - "REQ-115"
          - "REQ-304"
          - "REQ-305"
        rules:
          - "조사 담당자가 진단과 조치 방향을 기록하고 필요한 변경은 해당 현재 변경 권한자가 원 관리 기능에서 직접 저장한다. 조사 권한이 자산 변경 권한을 자동 부여하지 않는다."
          - "자산/정책/그룹의 직접 저장은 기술 참조 검증·기대 버전·전체 이력을 지킨다. 업무 의미 영향 검토 작업/관리자 승인 요청을 필수 경유하지 않는다. 실제 변경 완료만으로 조사 해결/신고 종결을 자동 처리하지 않는다."
          - "조치 적용 시각·범위·검증 근거를 확인해 완료한다. 조사 완료와 신고 종결을 분리하고 신고별 회신을 확인한다"
          - "완료 조사에 같은 문제의 조치 전 발생을 사후 연결할 수 있으며 연결자·시각·사유를 남긴다. 조치 후 재발은 재개 또는 후속 조사로 처리한다(REQ-115)"
        exceptions:
          - "추가 오류가 없다는 사실만으로 조치를 검증했다고 보지 않는다"
      - id: PRC-10-03
        scope_status: "REQ-615에 따라 전체 개발 완료 후 재검토하는 유예 후보다. 현재 운영 필수 단계가 아니며 PRC-10-01·02의 신고·조사는 유지한다"
        name: "사용자 질의 관찰과 일상 품질 평가"
        actor: "ACT-005"
        system: "admin 품질 지표 · 평가셋·회귀 평가"
        input: "권한 내 사용자 질의·응답·신고·품질 지표 · 대표 질의와 기대 처리 기준"
        output: "보완된 평가셋 · 평가 근거·결과 · 담당자가 확인한 품질 문제와 후속 조치 근거"
        reqs:
          - "REQ-301"
        rules:
          - "대상은 카탈로그에 한정하지 않고 모델 입력의 모든 구성 요소다. 관찰·평가·근거 보관·권한 통제는 REQ-301 quality_management를 따른다"
          - "평가셋 보유·평가 실행·평가 통과를 모든 자산 변경의 일률적인 승인 관문으로 두지 않는다. 문제 조사·변경 조치는 기존 조사와 현재 권한자의 직접 저장·기술 검증·이력로 이어진다"
        exceptions:
          - "평가 결과만으로 운영 자산을 자동 수정하거나 원인을 자동 확정하지 않는다. 원본 열람·실행 권한이 없는 경우 평가 목적이라도 우회하지 않는다"
    outcome: "일상 질의 관찰·평가로 품질을 관리하며 오류·신고·실행 실패·감사 검토 원본을 유지한 채 공통 조사에서 관련성을 확인하고 조치·검증한다. 저장 조회 복구·조사 완료·신고 종결은 각각의 규칙으로 처리한다"
  - id: PRC-11
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.direct_management를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    name: "업무 API 계약 등록·변경 동기화"
    trigger: "고객사 업무 시스템의 REST API를 Hub 호출 대상으로 처음 열거나 요청·응답 계약을 변경한다"
    actors: ["ACT-003","ACT-006","ACT-014"]
    steps:
      - id: PRC-11-01
        name: "고객사 공동 개발·시험·검수"
        actor: "ACT-014"
        system: "고객사 시스템 추가 기능 오픈 절차"
        input: "대상 시스템 API 계약과 변경 설명 · 양 시스템 개발 결과 · 테스트·검수 근거 · 운영 이관 계획"
        output: "양 시스템이 함께 적용하기로 한 릴리스 근거"
        reqs: ["REQ-105","REQ-111","REQ-113"]
        rules:
          - "Hub와 대상 시스템은 고객사 오픈 절차에서 함께 적용하거나 함께 보류한다"
        exceptions:
          - "계약·테스트·검수 또는 운영 이관 근거가 빠지면 Hub 등록을 활성화하지 않는다"
      - id: PRC-11-02
        name: "Hub API 계약 등록·갱신과 근거 기록"
        actor: "ACT-003"
        system: "admin 업무 API 등록"
        input: "릴리스 식별자·계약 버전·대상 시스템 책임자·요청/응답 명세·인증·재시도·멱등성·마스킹 경로·근거와 적용일"
        output: "고객사 오픈 절차와 동기화된 활성 API 계약과 변경 이력"
        reqs: ["REQ-105","REQ-111","REQ-113","REQ-601","REQ-608"]
        rules:
          - "Hub 관리자는 고객사 오픈 근거를 연결한 전체 API 후보를 작성한다. API 관리 승인 설정 사용 시 REQ-305·306의 요청·기술 검토·책임자 승인 후 반영하며 미사용 시 REQ-601의 저장자 전결로 반영한다. 고객사 외부 공동 오픈 검수·적용일은 두 방식 모두 유지한다"
          - "응답 경로가 새로 생기거나 바뀌면 REQ-111의 허용목록과 마스킹 규칙을 함께 갱신한다"
        exceptions:
          - "근거가 불명확하거나 응답 경로 통제가 준비되지 않으면 기존 계약을 임의로 덮어쓰지 않고 고객사 확인을 받는다"
    outcome: "업무 API 계약은 고객사의 양 시스템 공동 오픈 절차와 일관되게 적용되고, Hub에는 적용 근거와 통제 명세가 남는다"

  - id: PRC-12
    approval_policy: "요청·검토·책임자 승인 단계의 사용/미사용과 전결은 REQ-601.direct_management를 따른다. 내용·권한·스냅샷·참조 검증과 실제 효력 시점은 대상별 요구사항을 유지한다"
    name: "월별 쿼터 배분·승급·추가 사용 승인"
    trigger: "다음 달 토큰 풀을 계획하거나, 사용자가 쿼터 등급 승급 또는 이번 달 추가 사용을 요청한다"
    actors: ["ACT-001","ACT-004"]
    steps:
      - id: PRC-12-01
        name: "월별 기준 저장·미래 예정 생성·월말 다음 달 최종 배분"
        actor: ACT-004
        system: "admin 비용 관리·월말 스케줄 배치"
        input: "대상 M월 저장 금융 기준(부재 시 직전 월 유효 금융 원 기준)·M월 시작 마감의 사용자/효력 등급·M월에 유효한 시작월 등급 기준/가중치"
        output: "M월 기준 기존 행 설정 적용 또는 부재 시 금융 승계 새 행·유효 최종 배분 한 세트·개인 한도/출처 이력"
        reqs: [REQ-116, REQ-118, REQ-606]
        rules:
          - "수동 예정 생성은 M월 시작 전 교체 가능하며 월말 배치가 M월 마감의 최신 저장/승인 효력 기준으로 최종 한 번 배분한다"
          - "M월 기준이 있으면 그 설정값, 부재이면 직전 월 유효 금융기준을 새 M월 행에 그대로 복사한다. 조회 실패·잘못된 값은 부재로 덮어쓰지 않는다"
          - "두 경우 모두 사용자/효력 등급·가중치는 M월 기준이다. 금융 원 월과 M월 등급/대상자 출처·마감 스냅샷을 보존한다"
          - "최초 수동 저장의 원 USD 고정과 미래 금융/메모 재저장을 구분하고 적용 월 시작 뒤 전체 수동 재생성/소급 변경·중복 최종 배분을 막는다"
          - "승급/직접 등급 변경은 대상 월 시작 전 승인/저장하면 그 미래 월부터 효력이고 첫 수동 예정 생성 여부로 그다음 달로 미루지 않는다"
        exceptions:
          - "유효 금융/등급 기준·사용자 대응/현재 권한이 없거나 기준본 충돌이면 임의0/최저 등급 없이 실패한다"
          - "0명은 월 준비 완료와 개인 기준 미산정을 구분하고 신규/재활성·최초 활성/첫 사용 전 정정은 기존 자동 개별 배정 예외로 유지한다"
          - "배치 실패/불명은 원 마감 스냅샷·원 작업 결과를 복구하며 현재 값으로 과거 월을 재분배하지 않는다"
      - id: PRC-12-02
        request_integrity: "REQ-601.request_integrity의 대상별 중복 신청 차단·제출 내용 고정·취소 후 새 신청과 승인 근거 검증을 적용한다. 기존 적용 월·부분 승인·월말 만료 규칙을 유지한다"
        name: "쿼터 등급 승급 요청 처리"
        actor: ACT-004
        system: "portal 요청 · admin 비용 관리"
        input: "사용자의 희망 등급과 사유"
        output: "다음 달 적용 승급 승인 또는 반려와 처리 이력"
        reqs: [REQ-117]
        rules:
          - "승급 승인·반려와 처리 사유를 남기며, 진행 중인 달의 기본 한도를 다시 계산하지 않는다"
        exceptions:
          - "이번 달 사용량 부족은 승급으로 처리하지 않고 PRC-12-03의 추가 사용 신청으로 안내한다"
      - id: PRC-12-03
        request_integrity: "REQ-601.request_integrity의 대상별 중복 신청 차단·제출 내용 고정·취소 후 새 신청과 승인 근거 검증을 적용한다. 기존 적용 월·부분 승인·월말 만료 규칙을 유지한다"
        name: "이번 달 추가 토큰 사용 신청·승인"
        actor: ACT-004
        system: "portal 요청 · admin 비용 관리"
        input: "사용자의 추가 토큰량·업무 사유 · 월 개인 한도 · 계획 총 풀·미배정 계획량·현재 예외 승인 현황"
        output: "즉시 반영된 추가 한도 또는 반려 사유와 변경 불가 처리 이력"
        reqs: [REQ-119]
        rules:
          - "계획 총 풀 초과 여부와 업무상 필요·사유를 함께 확인하며, 총 풀 밖 승인은 예외 승인량·사유·승인자·처리 시각을 별도로 기록한다"
          - "승인된 추가 한도는 해당 월에만 유효하고 월말에 만료하며 이월하지 않는다. 승인량은 신청량 이하에서 정할 수 있다"
        exceptions:
          - "사유나 추가 토큰량이 없으면 승인하지 않으며, 이미 종결된 신청을 덮어쓰지 않고 새 요청으로 처리한다"
          - "월말까지 처리되지 않은 신청은 자동 만료하고 신청자에게 알린다"
    outcome: "쿼터 등급과 월별 기본 한도는 적용 월 단위로 예측 가능하게 적용되고, 신규 사용자는 등록 즉시 일할 배정으로 쓰며, 긴급한 이번 달 업무는 근거가 남는 추가 승인으로만 즉시 보완된다"
