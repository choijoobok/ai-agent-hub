    main_flow: ["제공 시스템과 그 허용 목록 안의 기본/특정 연결, 메서드·상대 경로·조회/실행 유형을 확인한다", "입력 확보 방법과 요청/응답 필드의 경로·타입·의미·필수/NULL·형식·코드·개인정보를 검수한다. 서버 신원·보호 헤더를 업무 인자로 대체하지 않는다", "코드명 제공 방법과 전체 대응 조건·결과/후속 가이드·공통/개별 호출 제한을 검수하고 지식·정책·도구 참조 영향을 확인한다", "실제 반영 상태와 고객사 공동 오픈 적용일을 확인한다. 승인만으로 적용일 전 호출을 허용하지 않으며 승인 뒤 실제 목적지/실행 주체 변경은 REQ-105의 재확인 경계를 유지한다", "원 소유 전체 구성·현재 변경 권한·기대 버전·필수 참조/기술 계약을 UC-003/012로 직접 저장해 전체 이력과 함께 확정한다.", "사용처의 안정 ID/경로·현재 참조 여부는 조회하되 연결 지식 본문 수집·의미 영향 판정/보완 작업은 만들지 않는다."]
