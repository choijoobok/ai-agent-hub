    trigger: "SCR-015의 외부 모델 등록 조합을 변경하거나 SCR-062의 용도·우선순위·설명을 변경한다"
    main_flow:
      - "SCR-015에서 배포 연결을 참조해 공급사·모델·지원 effort의 표시명/실제 호출 코드와 사용 여부를 등록하고 지원 근거를 검증한다. 접속 비밀은 편집하지 않는다"
      - "SCR-062에서 등록 조회로 구성한 일반 셀 콤보(공급사 / 모델 표시명 / effort 표시명)로 외부 모델 식별값을 선택한다. 용도는 agent 소스의 스텝 유형/LLM 통신 계약 목록을 일반 셀 콤보로 공급받고 설명은 텍스트 셀에서 입력한다. 주 추론 한 조합은 최초 기본값이고 모든 사용자 선택지는 용도 지정과 무관한 전체 유효 텍스트 조합이다. 보조 용도만 순위를 적용하며 그룹·등급으로 제한하지 않는다"
      - "활성 경로·지원 조합·후보 순번/중복·역할 기능·기본 조합과 전체 사용자 선택지의 영향을 검증하고 UC-002로 해당 화면의 편집본 전체와 자기 기준본/실제 적용 이력을 원자 반영한다. 등록과 용도 저장은 각각 소유 단위이며 두 화면을 한 명령으로 저장하지 않는다"
      - "REQ-602·ARCH-040에 따라 진행 시도의 고정 설정과 새 선택/시작의 현재 유효 집합을 구분해 안내한다"
    alternative_flows:
      - { id: A1, condition: "임베딩 모델 교체", flow: ["ARCH-040의 본문/질의 임베딩 일치와 기존 벡터 재생성 조건으로 인계한다. 설정 저장만으로 전환 완료를 표시하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "미지원 조합·미설정 또는 비활성 기본 모델", flow: ["허용되지 않는 조합을 사용하지 않는다. 다른 모델로 자동 대체하지 않고 현재 허용 목록 재선택 또는 관리자 확인을 안내한다"] }
      - { id: E2, condition: "보조 판정/운영용 경로 장애", flow: ["사용자가 고른 주 추론 조합으로 우회하지 않는다. 보조 판정만 REQ-602의 허용 오류/동의/예산에 따라 대체한다. 후보 소진/금지 오류 또는 운영용 실패는 해당 역할의 오류·설정 근거·다음 조치를 남긴다"] }
    postcondition: "역할별 설정·지원 조합·변경 근거가 관리되며 배포 비밀값과 진행 시도 설정은 임의로 바뀌지 않는다"
    rules_from: ["REQ-602.registry_contract", "REQ-602.screen_contract", "REQ-602.business_rules", "REQ-602.auxiliary_fallback", "REQ-602.primary_availability_recovery", "REQ-602.model_selection_recovery", "ARCH-040"]
    pending: ["@defer P3 — 역할 정책/후보 목록의 논리·물리 계약, 저장/조회 API, 후보 순서 편집·지원 검증·동의 영향·사용 불가 사유/선택 복구의 화면과 동시 수정 버전 검사를 상세화한다. 테스트는 TC-0151·0152·0153을 연결한다"]

  - id: UC-018
    name: "업무 API의 계약·연결·필드 통제 후보를 검수하고 반영한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: "FEAT-004"
    entities:
      - "ENT-011"
      - "ENT-012"
      - "ENT-013"
      - "ENT-014"
      - "ENT-015"
    reqs:
      - "REQ-608"
    actors:
      primary:
        - "ACT-003"
        - "ACT-002"
      secondary: []
    process_step: "PRC-11-02"
    precondition: "해당 후보 작성 권한이 있다. 초안의 미완성은 표시하고 정상 운영 반영 전 고객사 공동 개발·시험·오픈 근거와 계약을 검수한다. 실제 호출은 적용일과 현재 조건을 별도로 확인한다"
    trigger: "업무 API를 등록하거나 계약·연결·입출력 가이드·응답 통제·상태를 변경한다"
    main_flow:
      - "제공 시스템과 그 허용 목록 안의 기본/특정 연결, 메서드·상대 경로·조회/실행 유형을 확인한다"
      - "입력 확보 방법과 요청/응답 필드의 경로·타입·의미·필수/NULL·형식·코드·개인정보를 검수한다. 서버 신원·보호 헤더를 업무 인자로 대체하지 않는다"
      - "코드명 제공 방법과 전체 대응 조건·결과/후속 가이드·공통/개별 호출 제한을 검수하고 지식·정책·도구 참조 영향을 확인한다"
      - "실제 반영 상태와 고객사 공동 오픈 적용일을 확인한다. 승인만으로 적용일 전 호출을 허용하지 않으며 승인 뒤 실제 목적지/실행 주체 변경은 REQ-105의 재확인 경계를 유지한다"
      - "원 소유 전체 구성·현재 변경 권한·기대 버전·필수 참조/기술 계약을 UC-003/012로 직접 저장해 전체 이력과 함께 확정한다."
      - "사용처의 안정 ID/경로·현재 참조 여부는 조회하되 연결 지식 본문 수집·의미 영향 판정/보완 작업은 만들지 않는다."
    alternative_flows:
      - id: "A1"
        condition: "업무별 사용 방법만 변경"
        flow:
          - "API 공통 계약을 복제하지 않고 UC-010의 지식 매핑 설명 후보로 처리한다"
      - id: "A2"
        condition: "결과 확인 API가 없는 계약"
        flow:
          - "없음을 명시하고 완료/접수·결과 불명·수동 확인 안내를 검수한다. 결과 확인 API 부재만으로 등록을 금지하거나 재전송 가능으로 간주하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "미허용 연결·절대 주소·미완성 필드/개인정보·참조 충돌"
        flow:
          - "정상 운영 계약으로 반영하지 않고 보완 지점을 알린다"
      - id: "E2"
        condition: "개별 호출 제한과 점유 유지/프록시 검수 조건이 불일치"
        flow:
          - "긴 숫자만으로 호출을 허용하지 않는다. REQ-608.timeout_policy의 검증된 경로·설정 조건을 보완한다"
      - id: "E3"
        condition: "코드명/응답 해석 실패"
        flow:
          - "원 업무의 실제 성공·접수·불명 상태를 보존한다. 이름을 추측하거나 원 업무를 자동 재실행하지 않는다"
      - id: "E4"
        condition: "반려 또는 검증/반영 실패"
        flow:
          - "기존 유효본을 유지하고 실패 근거를 남긴다. 후보나 부분 반영을 새 유효 계약으로 사용하지 않는다"
    postcondition: "전체 직접 저장과 현재값/이력은 일관되며 실제 노출/호출은 현재 그룹·계약/원천 유효성과 실행 사용자 확인을 별도 검사한다."
    rules_from:
      - "REQ-608.business_rules"
      - "REQ-608.field_metadata"
      - "REQ-608.code_name_resolution"
      - "REQ-608.timeout_policy"
      - "REQ-608.result_handling_guide"
      - "REQ-608.approval_target"
      - "REQ-608.lifecycle"
      - "REQ-303.reference_mapping"
    pending:
      - "@defer P3 — 입력/응답 편집·코드명 참조·상속/반출 정책·계약 리비전·조건부 반영과 실패 상태의 물리/API/화면 계약을 설계한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-019
    name: "업무 도구의 구현·계약·노출 후보를 검수한다"
    workstream: "admin"
