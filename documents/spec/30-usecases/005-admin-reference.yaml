    postcondition: "전체 직접 저장과 현재값/이력은 일관되며 실제 노출/호출은 현재 그룹·계약/원천 유효성과 실행 사용자 확인을 별도 검사한다."
    rules_from:
      - "REQ-612.business_rules"
      - "REQ-612.result_handling_guide"
      - "REQ-612.permissions"
      - "REQ-303.reference_mapping"
    pending:
      - "@defer P3 — 구현 레지스트리·계약 버전·역참조·가이드 편집과 반영/호출 시 검증의 계약·시험을 설계한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-020
    name: "공통 자연어 지침을 검토하고 리비전으로 반영한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-610]
    actors: { primary: [ACT-003, ACT-004], secondary: [] }
    process_step: PRC-13-02
    precondition: "프롬프트 규칙 관리 권한이 있다. 의미 검토는 운영용 모델 설정을 사용하며 설정 부재/호출 실패는 검토 미완료로 처리한다"
    trigger: "공통 지침 본문·우선순위·적용 조건·활성 상태를 변경한다"
    main_flow:
      - "자연어 본문과 관리 속성의 후보를 작성하고 함께 적용될 규칙·기준 리비전을 확인한다"
      - "admin→agent 경로로 운영용 모델의 의미 검토를 요청하고 비교 리비전·모델·사용량·경고/실패 근거를 기록한다"
      - "권한자가 검토 내용과 판단·사유를 남기고 최종 반영 여부를 결정한다. 본문을 수정하면 새 변경안을 다시 검토한다"
      - "UC-002의 현재 권한·관리 값·리비전·이력 검증을 거쳐 반영한다. 런타임 통신·권한·승인 검증은 별도로 유지한다"
    alternative_flows:
      - { id: A1, condition: "의미 경고 또는 검토 실패", flow: ["무모순이나 검토 통과로 표시하지 않는다. 권한자의 실제 판단·사유를 기록해 보완 또는 반영을 결정한다"] }
    exception_flows:
      - { id: E1, condition: "관리 값 오류·리비전 충돌·현재 권한 없음", flow: ["운영 반영하지 않는다. 의미 검토 결과만으로 저장 검증을 우회하지 않는다"] }
      - { id: E2, condition: "자연어 안의 변수/스크립트·계약 우회 지시", flow: ["본문을 실행하거나 비밀/설정값으로 치환하지 않는다. 운영 문구로 소스의 입출력 계약과 통제를 변경할 수 없다"] }
    postcondition: "판단 근거가 있는 지침 리비전과 호출별 조합 근거를 추적할 수 있다. 의미 검토가 업무 도구 실행이나 무모순 보증이 되지 않는다"
    rules_from: ["REQ-610.prompt_contract", "REQ-610.business_rules", "REQ-602.business_rules"]
    pending: ["@defer P3 — 검토 요청/응답·관리 액션 인가·비교 리비전·변경 뒤 재검토와 호출별 조합 근거의 저장/화면/시험을 구체화한다"]

  - id: UC-021
    name: "사용 안내 지식을 관리하고 초기 안내와의 경계를 확인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-308"
    actors:
      primary: "ACT-003"
      secondary:
        - "ACT-002"
    process_step: "PRC-09-05"
    precondition: "사용 안내 지식의 후보 작성·관리 권한이 있다"
    trigger: "사용 목적·가능한 업무·질의 예시·주의사항·사용 한계 안내를 변경한다"
