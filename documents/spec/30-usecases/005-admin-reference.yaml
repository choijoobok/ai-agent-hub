        flow:
          - "실제 변경 대상 전체의 혼합 세트·참조 검증을 적용하고 과거 연결/실행 근거를 보존한다"
    exception_flows:
      - id: "E1"
        condition: "설정/비밀값을 읽는 금지 도구 또는 검증 무효 구현"
        flow:
          - "등록·노출하지 않는다. 배포되었다는 사실로 허용하지 않는다"
