# 영역: admin 기준정보·연동 관리
usecases:
  - id: UC-015
    name: "대상 시스템과 배포 연결의 사용 범위를 관리한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-604]
    feature_contract: FEAT-001
    entities: [ENT-001, ENT-003, ENT-017, ENT-019]
    actors: { primary: [ACT-003, ACT-002], secondary: [] }
    process_step: PRC-13-01
    precondition: "대상 시스템 관리 권한이 있다. 연결 없는 등록 초안은 허용하며 실제 사용 전에는 배포 연결의 유효성을 확인한다"
    trigger: "대상 시스템을 등록하거나 허용 연결·기본 연결·사용 상태를 변경한다"
    main_flow:
      - "안정 식별자·업무 명칭·사용 상태와 현재 로드된 연결 식별자를 확인한다. REQ-604.connection_display의 읽기 전용 Base URL·인증 방식·표시 상태와 관측 근거로 접속 대상을 구분한다"
      - "시스템의 허용 연결 목록을 관리하고 기본 연결을 지정할 때는 그 목록 안에서 선택한다. 개별 API·신원 매핑의 영향을 확인한다"
      - "UC-002로 현재 권한·참조·기준 버전을 검증하고 직접 관리 변경과 이력을 반영한다"
      - "개별 API의 기본/특정 연결 해석과 승인 후 실제 호출 대상 비교는 REQ-608·105의 계약으로 인계하고 UC-006에서 적용 결과를 확인한다"
    alternative_flows:
      - { id: A1, condition: "같은 도메인에 서로 다른 인증·헤더 구성이 필요함", flow: ["배포에 정의된 여러 연결 식별자를 선택한다. 이를 이유로 시스템을 강제로 분리하지 않는다"] }
      - { id: A2, condition: "배포 연결을 아직 정의하지 않은 신규 등록 초안", flow: ["시스템 정의 초안을 보존하되 호출 가능으로 표시하지 않는다. 유효 연결을 매핑·검증한 뒤 실제 사용한다"] }
      - { id: A3, condition: "기본 연결 없이 특정 연결을 선택한 API가 있음", flow: ["해당 API가 선택한 연결의 현재 유효성·권한으로 판단한다. 기본 연결 부재만으로 모든 API를 차단하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "사용 중인 연결 제거 또는 기본 연결 해석 실패", flow: ["참조를 끊거나 다른 연결로 대체하지 않는다. 영향 API와 필요한 배포/참조 보완을 안내한다"] }
      - { id: E2, condition: "주소·인증값·공통 헤더의 화면 편집이나 시스템 단위 사용자 그룹 부여 시도", flow: ["관리 대상이 아님을 안내한다. 배포 연결 원천과 개별 API 권한의 경계를 유지한다"] }
      - { id: E3, condition: "배포 연결·사용처 조회 실패", flow: ["저장된 정의/참조와 확인 불가 상태를 구분한다. 필요한 검증을 완료하지 못한 변경은 거부하고 빈 목록으로 덮어쓰지 않는다"] }
    postcondition: "시스템 정의와 지정한 연결 참조·변경 근거가 남는다. 등록 초안·관리 저장 성공과 개별 API의 실제 호출 가능을 구분하며 시스템 등록만으로 API 호출 권한이 생기지 않는다"
    rules_from: ["REQ-604.business_rules", "REQ-604.connection_display", "REQ-604.approval_target", "REQ-604.lifecycle", "REQ-601.business_rules"]
    sequence_design:
      contracts_from: ["FEAT-001.shared_write_contract", "FEAT-001.history_contract", "FEAT-014.reference_validation", "ADR-035"]
      scope: "대상 시스템 직접 저장/삭제와 데이터소스가 재사용하는 공통 원자성·결과 확인 흐름이다. 후보 승인 세트나 실제 업무 실행을 대신하지 않는다"
      diagrams:
        - key: save
          title: "전체 구성 저장과 확정 후 이력의 동시 반영"
          apis: [API-005, API-006, API-014, API-015]
          testcases: [TC-0012, TC-0013, TC-0017, TC-0018, TC-00111, TC-0028, TC-00212]
          transaction_boundary: "기존 부모 잠금·원 명령 재조회·기대 버전/참조 검증·ENT-019 결과와 현재값/집합·확정 후 이력 저장은 같은 READ COMMITTED 쓰기 트랜잭션이다. 원 성공 재생 경로도 잠금을 해제하고 트랜잭션을 끝낸 후 응답한다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant U as 관리자 화면
                participant S as admin 직접 변경
                participant D as AI 전용 DB
                U->>S: save/delete 원 키·전체 입력·기대 버전
                S->>S: 현재 SAVE 권한·명령 형식·인증 주체/입력 지문
                S->>D: 같은 명령 키의 성공 결과 확인
                alt 동일 주체·기능·입력의 원 성공 있음
                    D-->>S: 원 대상·버전·historyNo·반영 시각
                    S-->>U: 원 성공 결과 재생
                else 원 성공 없음
                    rect rgba(110, 150, 190, 0.10)
                        Note over S,D: BEGIN READ COMMITTED — 아래 모든 실패는 전체 ROLLBACK
                        opt 기존 대상 변경/삭제
                            S->>D: 기존 부모 잠금 시도 — 부재만으로 즉시 404 금지
                        end
                        S->>D: 부모 잠금 뒤 같은 명령 결과 재조회
                        alt 동일 원 명령 성공 확인
                            D-->>S: 원 성공 결과 — 기대 버전보다 먼저 판정
                            Note over S,D: 트랜잭션 종료·잠금 해제 후 원 결과 응답
                        else 미반영 명령
                            S->>S: 현재 권한·대상 존재·전체 입력·기대 버전 검사
                            S->>D: 같은 부모 보호 아래 전체 현재 참조 검증
                            alt 입력/버전/참조 충돌 또는 필수 검증 불가
                                S->>D: ROLLBACK
                                S-->>U: 계약의 400/403/404/409/503 — 입력 보존
                            else 검증 통과
                                S->>D: 신규 대상 ID/이력 ID 채번
                                S->>S: 신규 v1/기존 v+1·서버 근거·최종 전체 구성 확정
                                S->>D: ENT-019에 historyNo 포함 완전한 성공 결과 INSERT
                                S->>D: 현재값/집합과 확정 후 전체 스냅샷 함께 저장
                                Note over S,D: 삭제는 현재값/집합 제거 + 마지막 구성·deleted=true 이력
                                alt 결과·현재값·이력 모두 저장 성공
                                    S->>D: COMMIT
                                    D-->>S: 커밋 완료
                                    S-->>U: AssetMutationResult — 성공 후 재조회
                                else 명령 키 경합 또는 저장 실패
                                    S->>D: ROLLBACK — 채번 공백 허용
                                    Note over S,D: 키 경합은 종료 뒤 새 읽기로 원 성공 확인 — replay 그림 참조
                                    S-->>U: 오류/확정 불가 — 커밋 전 성공 공개 금지
                                end
                            end
                        end
                    end
                end
          reading_order:
            - "먼저 현재 권한과 명령 형식을 확인한다. 동일 키의 다른 입력은 commandConflict, 다른 주체의 변경 재전송은 403이며 원 결과를 노출하지 않는다"
            - "기존 대상은 부모를 잠근 뒤 성공 결과를 재조회한다. 삭제로 부모가 없어도 이 확인을 마치기 전에 404나 낡은 버전 충돌로 종결하지 않는다"
            - "새 명령만 현재 권한·기대 버전·전체 참조를 검증하고 최종 상태를 확정한다. 신규도 v1의 이력과 필수 historyNo를 만든다"
            - "성공 결과·현재값/집합·이력을 함께 커밋한 뒤 응답한다. 삭제는 마지막 구성과 삭제 표시를 남기며 다음 저장 의도와 구분한다"
          counterexamples:
            - "원 성공 재확인보다 기대 버전을 먼저 검사하면 재전송이 자기 변경의 새 버전과 충돌하므로 실패해야 한다"
            - "이력 저장 실패 후 현재값만 남거나, 커밋 전에 성공을 보내거나, 같은 원 키로 두 번째 이력을 만들면 실패해야 한다"
        - key: replay
          title: "응답 유실·UNKNOWN·원 명령 재전송"
          apis: [API-005, API-006, API-009, API-014, API-015, API-018]
          testcases: [TC-0016, TC-0018, TC-0027, TC-0028]
          transaction_boundary: "결과 확인은 현재 READ+SAVE를 검사하는 단순 읽기다. 원 명령 재전송은 save 그림의 별도 쓰기 트랜잭션을 사용한다. 명령 키 유일성 오류를 받은 쓰기 트랜잭션은 종료한 뒤 새 읽기를 시작한다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant U as 관리자 화면
                participant S as admin 직접 변경/결과 조회
                participant D as AI 전용 DB
                S--xU: save/delete 응답 유실 — 실제 커밋 여부 미확인
                U->>U: 원 키·원 입력 유지, 편집/신규/행 전환 잠금
                U->>S: getCommandResult 원 키
                S->>S: 현재 READ+SAVE 검사 — 회수됐으면 403
                S->>D: 현재 주체·기능/대상 종류에 묶인 성공 결과 읽기
                alt 같은 주체/종류의 성공 결과 있음
                    D-->>S: 원 성공 결과
                    S-->>U: APPLIED + 원 대상·버전·historyNo·appliedAt
                    U->>U: 완료 표시·잠금 해제·현재값/이력 재조회
                else 미발견 또는 다른 주체/종류의 키
                    S-->>U: UNKNOWN — 존재/결과 비노출
                    U->>U: 미실행으로 단정하지 않고 원 키 유지
                    opt 같은 입력 재시도 선택
                        U->>S: 같은 save/delete·원 키·원 입력·원 기대 버전
                        rect rgba(110, 150, 190, 0.10)
                            Note over S,D: save 그림의 독립 쓰기 TX — 부모 잠금 후 결과 재확인이 기대 버전보다 먼저
                            S->>S: 원 성공 재생 또는 미반영 명령 검증/반영
                        end
                        alt 원 성공 확인 또는 이번 커밋 성공
                            S-->>U: 동일 명령의 확정 성공 결과
                        else 명령 키 유일성 경합으로 쓰기 실패
                            S->>D: 실패 TX ROLLBACK 완료 후 새 읽기로 성공 확인
                            Note over S,D: 같은 실패 TX에서 추가 SQL을 계속하지 않음
                            S-->>U: 확인된 원 성공 또는 확정 불가 안내
                        else 원 명령 미반영이 확정된 계약 거부
                            S-->>U: 확정 거부 사유 — 입력 보존
                            U->>U: 편집 복귀·수정한 새 저장 의도에 새 키
                        else 통신/커밋 불명 또는 원 성공 여부 미확인
                            S-->>U: 결과 불명 — 원 키·원 입력 유지, 새 키 금지
                        end
                    end
                end
          reading_order:
            - "결과 조회에 쓰는 현재 권한과 키 소유를 구분한다. 현재 권한이 없으면 거부하고, 권한이 있는 다른 주체/종류의 키 조회는 UNKNOWN으로 존재를 숨긴다"
            - "UNKNOWN은 진행 중·미접수·롤백을 구별할 근거가 없다는 뜻이다. 신규로 복제하거나 키/입력을 바꾸지 않는다"
            - "원 키 재전송에서 원 성공을 먼저 재생한다. 명령 키 경합으로 실패한 TX에서는 조회하지 않고 종료 뒤 새 읽기로 확인한다"
            - "재생 응답의 traceId는 이번 HTTP 요청 값이고 data.appliedAt·대상/버전/historyNo는 원 성공 값이다. 대상이 삭제됐어도 원 성공은 재생할 수 있다"
            - "원 명령의 미반영이 확인된 명시적 계약 거부만 편집으로 돌아가며 수정한 의도에 새 키를 만든다. 단순 HTTP 400/409 코드만으로 원 성공 없음이 증명되지는 않는다. 기존 키의 다른 입력 충돌/통신/커밋 불명은 원 결과 확인 경로를 유지한다"
          counterexamples:
            - "UNKNOWN을 미실행으로 보고 새 키를 만들거나 같은 키의 입력을 바꾸면 실패해야 한다"
            - "현재 SAVE 회수 뒤 결과를 보여주거나 다른 주체의 키 존재를 APPLIED로 노출하면 실패해야 한다"
            - "미반영이 확정된 거부까지 원 키로만 반복하게 하거나, 반대로 코드만 보고 결과 불명 명령에 새 키를 발급하면 실패해야 한다"
        - key: reference-race
          title: "허용 연결 제거·삭제와 API/신원 참조 추가 경합"
          apis: [API-005, API-006]
          testcases: [TC-0014]
          transaction_boundary: "직접 변경과 실제 참조 추가/교체는 각자의 트랜잭션에서 같은 대상 시스템 부모를 잠그고 커밋/롤백까지 유지한다. 여러 부모는 대상 종류+숫자 ID 순으로 잠근다"
          mermaid: |
            sequenceDiagram
                autonumber
                participant M as 대상 시스템 직접 변경
                participant W as API/신원 참조 반영
                participant D as AI 전용 DB
                Note over M,D: M은 save 그림의 현재 권한·원 성공 재확인·기대 버전 검사를 따른다
                rect rgba(90, 160, 110, 0.10)
                    Note over M,D: 두 요청은 독립 TX이며 같은 부모 잠금에 참여
                    alt 제거 대상 연결 또는 삭제 대상 시스템을 쓰는 참조가 먼저 잠금 획득
                        W->>D: 대상 시스템 부모 잠금
                        W->>D: 현재 대상·허용/기본 연결 검증 후 참조 반영
                        M->>D: 같은 부모 잠금 대기
                        W->>D: COMMIT — 부모 잠금 해제
                        D-->>M: 부모 잠금 획득
                        M->>D: 최신 전체 참조 검증 — 제거/삭제에 영향받는 사용처 확인
                        M->>D: ROLLBACK
                        M-->>M: 409 referenceConflict — 참조 제거/삭제 반영 없음
                    else 제거/삭제가 먼저 잠금 획득
                        M->>D: 대상 시스템 부모 잠금·현재 참조 검증
                        W->>D: 같은 부모 잠금 대기
                        M->>D: 결과·현재값/허용 집합·확정 후 이력 COMMIT
                        D-->>W: 잠금 획득 또는 부모 부재 확인
                        W->>D: 현재 대상/연결 재검증
                        W->>D: 참조 무효면 ROLLBACK — 끊어진 참조 쓰기 금지
                    end
                end
          reading_order:
            - "화면의 사용처 페이지가 비어 있어도 서버는 전체 참조를 확인한다. 필수 참조 조회 실패는 미사용 판정이 아니라 반영 거부다"
