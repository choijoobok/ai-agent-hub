      - "권한자가 검토 내용과 판단·사유를 남기고 최종 반영 여부를 결정한다. 선택/동료 규칙이나 조합 근거 변경 시 전체 검토 최신성을 다시 대조하며 낡은 결과를 재사용하지 않는다"
