  - id: UC-016
    code_lookup_flow: "데이터소스 기본값과 별도로 코드 조회 정의·typed 파라미터를 버전 초안에 작성/복사·저장하고 검수/활성화한다. 결과 탭 조회는 일시 시험 바인딩으로 제한 미리보기를 실행한다. ACTIVE만 운영 사용하며 READ만으로 임의 SQL을 실행하지 않는다. 초안/검수 명령·판 원장은 기본설정 명령과 독립이며 초안·반려는 운영 이력을 만들지 않는다. 실제 유효값 반영 성공은 데이터소스 마스터와 전체 유효 관리 자식을 같은 HISTORY_NO와 마스터의 HIST_DTM의 _HIST 세트로 저장한다"
