    feature_contract: "FEAT-021"
    entities:
      - "ENT-011"
      - "ENT-012"
      - "ENT-015"
      - "ENT-016"
    reqs:
      - "REQ-612"
    actors:
      primary:
        - "ACT-003"
        - "ACT-004"
      secondary: []
    process_step: "PRC-13-02"
    precondition: "도구 후보 작성 권한이 있다. 미완성 초안은 누락을 표시하고 정상 등록/노출 전 등록 API 또는 배포 내부 서비스의 계약·검증 근거를 확인한다. 호출 시 현재 유효성을 다시 검사한다"
    trigger: "도구를 등록·수정·비활성화·삭제하거나 허용 그룹·노출 상태를 변경한다"
    main_flow:
      - "REST API 원천과 내부 서비스 빈의 계약/검증 근거를 구분해 참조한다. API 기반은 REQ-612.api_tool_mapping에 따라 기존 대응 도구를 확인하고 API당 하나를 유지한다"
      - "현재 도구를 참조하는 지식의 매핑과 업무별 사용 설명을 역조회하고 변경 영향을 확인한다"
      - "전체 후보·작업 종류·사유·기준 버전·공통 결과 가이드를 검수한다. API 계약은 원천을 참조하고 내부 구현 가이드는 해당 정본에서 관리한다"
      - "원 소유 전체 구성·현재 변경 권한·기대 버전·필수 참조/기술 계약을 UC-003/012로 직접 저장해 전체 이력과 함께 확정한다."
      - "사용처의 안정 ID/경로·현재 참조 여부는 조회하되 연결 지식 본문 수집·의미 영향 판정/보완 작업은 만들지 않는다."
    alternative_flows:
