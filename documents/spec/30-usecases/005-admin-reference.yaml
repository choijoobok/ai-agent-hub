  - id: UC-018
    workspace_flow: "REQ-608.api_workspace: 기본 계약/멱등성/메모 → 호출 계약 설명을 통합한 가이드 → 순서 기반 경로 변수·쿼리·헤더 → JSON 샘플 구조 초안과 검수 → 필드값 의미 매핑(참조 가이드/직접 등록) → 응답 코드 참조 판정 → 사용자 그룹/Portal 예외 → 전체 직접 저장/이력. 연결 지식 탭에서 현재 권한의 참조를 읽기 전용으로 확인한다. 재가져오기는 기존 메타데이터를 보존하고 덜 엄격한 Portal 수준이 이력 기본 수준을 해제하지 않는다."
    name: "업무 API의 계약·연결·필드 통제 후보를 검수하고 반영한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: FEAT-004
    entities: [ENT-011, ENT-012, ENT-013, ENT-014, ENT-015]
    reqs: [REQ-608, REQ-609]
    identity_verification: "REQ-609.identity_verification와 UC-044의 권장 프로세스·고객사 검증 지원/보호 경로를 공동 검수한다. 설정 미확인을 신원 불필요로 바꾸지 않으며 이 관리 화면에서 호출용 토큰을 발급/표시하지 않는다."
    actors:
      primary: [ACT-003, ACT-002]
      secondary: []
    process_step: "PRC-11-02"
    precondition: "현재 API 변경 권한이 있다. 미완성 필드/계약을 표시하고 고객사 공동 시험·오픈 근거는 REQ-608.api_workspace.master의 메모로 기록한다. 실제 호출은 현재 사용·연결·신원·권한·기술 계약을 검증하며 메모에서 적용일/오픈 완료를 자동 추출하지 않는다."
    trigger: "업무 API를 등록하거나 계약·연결·입출력 가이드·응답 통제·상태를 변경한다"
    main_flow:
      - "제공 시스템과 그 허용 목록 안의 명시 연결, 메서드·상대 경로·조회/실행 유형 및 검수된 신원 계약을 확인한다. 기본 연결/신원 필요 스위치는 두지 않는다"
      - "입력 확보 방법과 요청/응답 필드의 경로·타입·의미·필수/NULL·형식·코드·개인정보를 검수한다. 서버 신원·보호 헤더를 업무 인자로 대체하지 않는다"
      - "입력·응답 등록 필드의 참조 가이드/직접 등록 의미 매핑과 응답 코드 항목을 참조하는 결과 판정을 검수한다. 코드 의미와 호출 결과 상태를 구분하고 현재 허용 조회·정책·결과/후속 가이드를 확인한다."
      - "공동 시험·오픈 근거는 상단 메모에 기록하고 현재 사용/연결·기술 계약을 검증한다. 별도 적용일 기반 자동 오픈은 없으며 실제 실행 주체·목적지·인자 변경은 REQ-105 재확인 경계를 유지한다."
      - "원 소유 전체 구성·현재 변경 권한·기대 버전·필수 참조/기술 계약을 UC-003/012로 직접 저장해 전체 이력과 함께 확정한다."
      - "사용처의 안정 ID/경로·현재 참조 여부는 조회하되 연결 지식 본문 수집·의미 영향 판정/보완 작업은 만들지 않는다."
    alternative_flows:
      - id: "A1"
        condition: "업무별 사용 방법만 변경"
        flow: ["API 공통 계약을 복제하지 않고 UC-010의 지식 매핑 설명 후보로 처리한다"]
      - id: "A2"
        condition: "결과 확인 API가 없는 계약"
        flow: ["없음을 명시하고 완료/접수·결과 불명·수동 확인 안내를 검수한다. 결과 확인 API 부재만으로 등록을 금지하거나 재전송 가능으로 간주하지 않는다"]
    exception_flows:
      - id: "E1"
        condition: "미허용 연결·절대 주소·미완성 필드/개인정보·참조 충돌"
        flow: ["정상 운영 계약으로 반영하지 않고 보완 지점을 알린다"]
      - id: "E2"
        condition: "개별 호출 제한과 점유 유지/프록시 검수 조건이 불일치"
        flow: ["긴 숫자만으로 호출을 허용하지 않는다. REQ-608.timeout_policy의 검증된 경로·설정 조건을 보완한다"]
      - id: "E3"
        condition: "코드명/응답 해석 실패"
        flow: ["원 업무의 실제 성공·접수·불명 상태를 보존한다. 이름을 추측하거나 원 업무를 자동 재실행하지 않는다"]
      - id: "E4"
        condition: "반려 또는 검증/반영 실패"
        flow: ["기존 유효본을 유지하고 실패 근거를 남긴다. 후보나 부분 반영을 새 유효 계약으로 사용하지 않는다"]
    postcondition: "전체 직접 저장과 현재값/이력은 일관되며 실제 노출/호출은 현재 그룹·계약/원천 유효성과 실행 사용자 확인을 별도 검사한다."
    rules_from: ["REQ-608.business_rules", "REQ-608.field_metadata", "REQ-608.field_value_mapping", "REQ-608.timeout_policy", "REQ-608.result_handling_guide", "REQ-608.approval_target", "REQ-608.lifecycle", "REQ-303.reference_mapping"]
    pending: ["@defer P3 — 입력/응답 편집·코드명 참조·상속/반출 정책·계약 리비전·조건부 반영과 실패 상태의 물리/API/화면 계약을 설계한다"]
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
    connection_selection: "REQ-608.connection_selection: 제공 시스템을 고른 뒤 현재 유효한 정확 연결 ID를 필수 선택한다. 기본 연결 선택지는 없다. API 목록/실행은 수동 useYn과 자동 연결 유효성/사유를 분리해 제공하고 전송 전 검사한다."
