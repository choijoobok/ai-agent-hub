# 영역: admin 기준정보·연동 관리
usecases:
  - id: UC-015
    configuration_cleanup: "REQ-601.configuration_cleanup. 해당 대상의 현재 조회 범위 전체에서 누락 확정 후보 확인 → 차단 사용처 해소 → 새 사유·명시 실행 → 서버 전체 재검증·원자 정리·이력. 미저장/불명/낡은 미리보기는 실행하지 않는다."
    name: "YAML 대상 시스템과 연결을 확인하고 표시 정보를 보완한다"
    workstream: "admin"
    design_status: "draft"
    reqs: [REQ-604]
    feature_contract: FEAT-001
    entities: [ENT-001, ENT-003, ENT-017, ENT-019, ENT-094, ENT-095, ENT-098]
    actors:
      primary: [ACT-003, ACT-002]
      secondary: []
    process_step: "PRC-13-01"
    precondition: "현재 환경의 YAML 로드/검증·동기화 근거와 대상 메뉴 권한을 확인할 수 있다. 기술 정의는 배포가 소유한다."
    trigger: "기동 동기화, 대상 시스템/연결 조회·이름/설명 보완, 접속 테스트 또는 경고 확인"
    main_flow: ["현재 YAML 전체를 검증해 시스템/연결 키의 DB 메타와 REQ-601.configuration_diagnosis의 적용 설정 버전별 판정 묶음을 원자 확정하고 해당 기동의 준비를 연다. 제거 행/참조와 DB 재정의는 보존한다.", "상단 목록에서 선택하면 연결 정보와 사용 API 두 탭을 읽고 저장된 설정 불일치/현재 안전한 표시·감사를 확인한다. 일반 조회는 전체 YAML 재대조/판정 쓰기를 하지 않는다.", "현재 관리 권한으로 시스템/연결 이름·설명 재정의만 직접 저장해 전체 이력을 보존한다.", "YAML 테스트 설정과 EXECUTE 권한이 있으면 현재 연결로 확인용 요청을 실행하고 비밀 없는 결과를 확인한다.", "누락 설정의 영향 참조를 REQ-601.configuration_alerts로 묶어 관리자 대시보드/API 목록에 노출하고 실제 호출은 REQ-601.asset_availability로 차단한다."]
    alternative_flows:
      - id: "A1"
        condition: "같은 시스템의 서로 다른 인증/경로가 필요함"
        flow: ["YAML에 여러 연결을 정의하고 개별 API에서 명시 연결을 필수 선택한다. 기본 연결을 만들지 않는다."]
      - id: "A2"
        condition: "표시 이름이 YAML에 없거나 운영 명칭 보완이 필요함"
        flow: ["관리자 DB 재정의 또는 식별자 대체 표시를 사용한다. 재기동이 재정의를 덮어쓰지 않는다."]
    exception_flows:
      - id: "E1"
        condition: "기존 시스템/연결이 YAML에서 제거됨"
        flow: ["DB 행/참조를 보존하고 불일치·경고를 표시한다. 저장된 정의와 워크플로우의 새 호출도 전송 전에 차단한다."]
      - id: "E2"
        condition: "YAML/관측 검증 실패 또는 이전 세대 노드"
        flow: ["부분 갱신/전량 삭제/현재 세대 덮어쓰기를 막고 마지막 성공 근거와 확인 필요를 보존한다."]
      - id: "E3"
        condition: "직접 API에서 기술값·임의 신규/삭제·테스트 우회"
        flow: ["현재 권한과 입력 소유/설정 조건을 서버에서 검증해 거부한다."]
    postcondition: "YAML 기술 정의와 관리자 보완값이 분리되고 현재 불일치·영향 경고가 조회된다. 개별 API/신원/현재 행위자 검사 없이 호출 권한이 생기지 않는다."
    rules_from: ["REQ-604.authority", "REQ-604.synchronization", "REQ-604.connection_test", "REQ-601.asset_availability", "REQ-601.configuration_alerts"]
    sequence_design:
      contracts_from: ["REQ-604.synchronization", "FEAT-001.shared_write_contract", ADR-038]
      scope: "기동 동기화와 관리자 보완 저장은 소유 필드를 분리한다. 실제 HTTP 검사/경고 공개는 별도 권한으로 수행한다."
      diagrams:
        - key: "metadata-save"
          title: "YAML 동기화와 표시 보완의 독립 저장"
          apis: [API-005, API-009]
          testcases: [TC-0012, TC-0017, TC-00120]
          transaction_boundary: "전체 YAML 검증 후 동기화 또는 관리자 보완 저장의 각 트랜잭션에서 부모 잠금/기준 버전·소유 필드·실제 변경 이력·원 결과를 확정한다. 외부 HTTP 호출은 DB 쓰기 트랜잭션 밖이다."
          mermaid: |
            sequenceDiagram
             participant Y as 현재 YAML
             participant A as admin
             participant D as DB
             participant U as 관리자
             Y->>A: 환경/설정 세대 전체 검증
             alt 현재 세대와 정의가 유효
             A->>D: 기술 메타만 추가/갱신, 제거행 보존
             else 실패 또는 낡은 세대
             A-->>U: 확인 필요, 기존 DB/보완 유지
             end
             U->>A: 기존 ID/버전 + 이름/설명 보완
             alt 현재 권한과 버전/필드 검증 통과
             A->>D: 보완값/이력/원 명령 결과 원자 저장
             A-->>U: 저장 결과와 현재 설정 진단
             else 권한/기준 버전/입력 위반
             A-->>U: 거부와 입력 보존
             end
          reading_order: ["YAML 전체 검증과 기술 메타 동기화를 먼저 읽는다.", "관리자 표시 보완은 기존 ID/기준 버전과 소유 필드 검증 뒤 원자 저장한다.", "설정/검증 실패는 쓰기와 외부 호출 전에 차단하며 표시 재정의를 유지한다."]
    pending: ["@defer P3 — 시퀀스의 소유 후속 계약과 구현 슬라이스 착수 조건·구체 응답/오류 MSG를 연결하고 전체 화면 상세 승인을 받는다"]
  - id: UC-016
    configuration_cleanup: "REQ-601.configuration_cleanup. 해당 대상의 현재 조회 범위 전체에서 누락 확정 후보 확인 → 차단 사용처 해소 → 새 사유·명시 실행 → 서버 전체 재검증·원자 정리·이력. 미저장/불명/낡은 미리보기는 실행하지 않는다."
    code_lookup_flow: "선택 카탈로그 DS별 여러 제목/상세 가이드를 중복 제거하여 제공하고 필요한 코드/참조값을 현재 허용 원천에서 먼저 읽어 확인한 후 업무 SQL에 사용한다. CODE 정의/버전/파라미터/결과탭 관리 없음."
    name: "YAML 데이터소스의 수동 업무 메타와 데이터 조회 가이드를 관리한다"
    workstream: "admin"
    design_status: "draft"
    reqs: [REQ-603]
    feature_contract: FEAT-002
    entities: [ENT-002, ENT-004, ENT-018, ENT-045, ENT-096, ENT-097, ENT-098]
    actors:
      primary: ACT-003
      secondary: []
    process_step: "PRC-13-01"
    precondition: "Hub DB와 분리된 외부 YAML 기동 registry와 현재 관리 권한이 있다. 업무 조회와 메타 보완의 가능 상태를 구분한다."
    trigger: "기동 YAML 동기화 또는 기존 데이터소스 수동 메타·그룹·가이드 보완"
    main_flow: ["기동 시 전체 YAML 검증 후 안정 키로 비밀 없는 메타와 REQ-601.configuration_diagnosis의 ENT-098 판정 묶음을 원자 확정. Hub DB 제외, 수동값·최초 감사 보존.", "관리자가 상단 기존 DS와 다섯 탭에서 메타·그룹·가이드 전체 편집본을 확인/보완한다. DW 동기화 방식은 참고 메모이며 파서는 서버 지원 정책으로 결정한다. 사용 카탈로그·컬럼/인덱스 차이는 조회값이다.", "현재 권한·필수 수동 필드·참조·기대 리비전 검증 후 현재값/전체 HIST/멱등 결과를 원자 저장한다.", "YAML 제거·미상·DBMS 미판별은 배지/경고와 업무 호출 차단으로 제공한다. 저장 결과 불명은 원 키로 확인한다."]
    alternative_flows: ["같은 YAML 재기동은 실제 변경이 없으면 새 버전/이력을 만들지 않는다.", "YAML 누락에서도 참조/이력은 보존하고 현재 검증 가능한 메타 보완은 허용한다. 필수 검증이 불가한 변경은 전체 거부한다."]
    exception_flows: ["전체 YAML 오류를 일부 적용/전건 삭제로 바꾸지 않는다.", "현재권한 회수/기준 리비전 충돌은 입력/현재값 보존, 부분 저장 없음.", "가이드가 인가·read-only·신원/마스킹/행 필터를 대체하거나 미확정 코드값을 추정 실행하지 않는다."]
    postcondition: "안정된 Hub 참조와 실제 배포 연결 상태가 구분된다. 데이터소스 등록이 객체 접근 권한을 대신하지 않는다"
    rules_from: ["REQ-603.business_rules", "REQ-603.exceptions", "REQ-301.data", AUTHZ-010]
    sequence_design:
      contracts_from: [REQ-603, FEAT-002]
      scope: "설계 초안·제품 구현 별도"
      diagrams:
        - key: "yaml-metadata"
          title: "YAML 기동 동기화와 수동 보완"
          apis: [API-010, API-011, API-014, API-018]
          testcases: [TC-0022, TC-00218]
          transaction_boundary: "전체 YAML을 검증한 뒤 같은 세대로 메타 upsert/누락 판정을 게시한다. 수동 전체 저장은 현재값·리비전·그룹/가이드 전체 HIST·멱등 성공 결과를 같은 DB 트랜잭션으로 확정한다. 원천 DB 조회는 이 쓰기 트랜잭션 밖이다."
          reading_order: ["YAML 검증과 안정 키 동기화", "수동 전체 편집본 검증", "실제 변경/전체 이력/원 결과 확정 또는 입력 보존"]
          mermaid: |
            sequenceDiagram
             participant B as 기동 registry
             participant A as admin
             participant D as Hub DB
             B->>B: 전체 YAML 검증·DBMS 판별
             alt 전체 설정 검증 성공
              B->>D: 안정 키 upsert·수동값 보존
             else 전체 로드/검증 실패
              B-->>A: 확인 필요·부분 게시와 전건 삭제 없음
             end
             A->>D: 현재 권한·전체 편집본·기대 리비전 검사
             alt 필수 검증 가능·기준 리비전 일치
              D->>D: 현재 메타·그룹·가이드·전체 HIST 원자 확정
              D-->>A: 원 결과와 새 리비전
             else 검증 불가 또는 충돌
              D-->>A: 전체 거부·현재값/입력 보존
             end
        - key: "query-guides"
          title: "선택 데이터소스 가이드와 실제 참조값 확인"
          testcases: [TC-00220, TC-00319]
          transaction_boundary: "가이드 공개 조회와 원천 읽기는 서버 현재 권한을 각각 검사한다. SQL 조회가 관리 이력/현재값을 변경하지 않으며 실제 사용 근거는 해당 턴의 보호된 실행 이력에 기록한다."
          reading_order: ["현재 허용된 선택 카탈로그의 DS 추출", "DS별 가이드 중복 제거 조회", "권한 있는 스키마·참조값 읽기", "확정 값으로 업무 SQL 또는 질문/보류"]
          mermaid: |
            sequenceDiagram
             participant G as agent
             participant A as admin 공개 조회
             participant Q as SQL 도구
             participant D as 허용 원천 DB
             G->>A: 현재 주체·선택 카탈로그 문맥
             A-->>G: DS별 가이드·적용 리비전과 ID
             G->>Q: 필요한 코드/참조 테이블 읽기 계획
             Q->>Q: 현재 객체·컬럼·행·신원·read-only 검증
             alt 현재 권한과 연결 유효
              Q->>D: 제한된 읽기 조회
              D-->>G: 실제 값·결과 상태·확인시각
              G->>G: 확정 값 바인딩·턴 근거 기록
             else 실패 또는 값 미확정
              Q-->>G: 사유·질문/보류·추정 실행 금지
             end
    pending: ["@defer P3 — 시퀀스의 소유 후속 계약과 구현 슬라이스 착수 조건·구체 응답/오류 MSG를 연결하고 전체 화면 상세 승인을 받는다. DBMS별 전체 물리 객체 식별/조회 시험은 카탈로그·integration 소유에서 설계한다"]
  - id: UC-017
    name: "공급사·모델 조합과 용도별 사용 순서를 관리한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-602]
    actors: { primary: ACT-004, secondary: [] }
    process_step: PRC-13-01
    precondition: "모델 관리 권한과 배포 공급 경로·모델/추론 수준의 검수 근거가 있다"
    trigger: "SCR-015의 외부 모델 등록 조합을 변경하거나 SCR-062의 용도·우선순위·설명을 변경한다"
    main_flow:
      - "SCR-015에서 배포 연결을 참조해 공급사·모델·지원 effort의 표시명/실제 호출 코드와 Portal 선택 허용 여부를 등록하고 지원 근거를 검증한다. 접속 비밀은 편집하지 않는다"
      - "SCR-062에서 등록 조회로 구성한 일반 셀 콤보(공급사 / 모델 표시명 / effort 표시명)로 외부 모델 식별값을 선택한다. 용도는 agent 소스의 스텝 유형/LLM 통신 계약 목록을 일반 셀 콤보로 공급받고 설명은 텍스트 셀에서 입력한다. 주 추론 한 조합은 최초 기본값이고 모든 사용자 선택지는 용도 지정과 무관한 Portal 선택이 켜진 유효 텍스트 생성 조합이다. 보조 용도만 순위를 적용하며 그룹·등급으로 제한하지 않는다"
      - "활성 경로·지원 조합·후보 순번/중복·역할 기능·기본 조합과 전체 사용자 선택지의 영향을 검증하고 UC-002로 해당 화면의 편집본 전체와 자기 기준본/실제 적용 이력을 원자 반영한다. 등록과 용도 저장은 각각 소유 단위이며 두 화면을 한 명령으로 저장하지 않는다"
      - "REQ-602·ARCH-040에 따라 진행 시도의 고정 설정과 새 선택/시작의 현재 유효 집합을 구분해 안내한다"
    alternative_flows:
      - { id: A1, condition: "임베딩 모델 교체", flow: ["ARCH-040의 본문/질의 임베딩 일치와 기존 벡터 재생성 조건으로 인계한다. 설정 저장만으로 전환 완료를 표시하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "미지원 조합·미설정 또는 Portal OFF 또는 기술 무효 주 추론 기본 모델", flow: ["허용되지 않는 조합을 사용하지 않는다. 다른 모델로 자동 대체하지 않고 현재 허용 목록 재선택 또는 관리자 확인을 안내한다"] }
      - { id: E2, condition: "보조 판정/운영용 경로 장애", flow: ["사용자가 고른 주 추론 조합으로 우회하지 않는다. 보조 판정만 REQ-602의 허용 오류/동의/예산에 따라 대체한다. 후보 소진/금지 오류 또는 운영용 실패는 해당 역할의 오류·설정 근거·다음 조치를 남긴다"] }
    portal_selection: "Portal OFF는 내부 용도 후보·현재 지정과 분리한다. 다음 새 턴의 저장 선택이 OFF이면 사용자 재선택·명시 전송을 기다리며 진행 중 시도의 고정 조합은 유지한다."
    postcondition: "역할별 설정·지원 조합·변경 근거가 관리되며 배포 비밀값과 진행 시도 설정은 임의로 바뀌지 않는다"
