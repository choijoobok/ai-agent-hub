# 영역: 공개 카탈로그·인증 예제 — 공통 접수/승인 계약은 UC-001~006을 사용한다.
usecases:
  - id: UC-007
    code_lookup_flow: "groupCode는 원천 공통 코드 그룹 구분값이며 해당 없으면 null이다. 상세 설명(detailDescription)에 컬럼 용도·사용법과 공통 코드가 아닌 하드 코딩 값/의미를 작성한다. 수기 열거 자식·값 방식 선택은 관리하지 않는다. groupCode가 있으면 데이터소스 가이드의 공통 코드 조회 SQL 패턴에 그 값을 안전하게 바인딩해 허용된 원천을 읽고 코드명을 확인한다. groupCode=null이면 조회를 강제하지 않으며 상세 설명에 명확히 기재한 값/의미를 LLM이 해석한다. 설명에 없는 값·모호한 뜻·현재 동적 코드명을 지어내지 않고 필요한 경우 질문/허용된 읽기 조회로 확인한다. 가이드/설명은 권한·실행 명령이 아니며 SQL·객체/컬럼·행·신원·마스킹·read-only·상한 검사는 유지한다."
    name: "공개 카탈로그 전체 구성을 검증하고 직접 저장한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: FEAT-003
    comparison_entry: "REQ-304.batch_structure_comparison의 일괄 관측·현재 불일치 목록은 SCR-002에서 수행한다. 카탈로그 원천 구조/샘플 조회 탭은 제거하고 원천 객체 확인은 신규 수동 등록의 선택 보조로 유지한다"
    entities: [ENT-005, ENT-006, ENT-007, ENT-020, ENT-021, ENT-022, ENT-028]
    reqs: [REQ-301]
    actors:
      primary: ACT-003
      secondary: [ACT-002]
    process_step: "PRC-09-01"
    precondition: "고객사가 공개할 테이블·뷰를 선정했고 관리 대상 데이터소스의 Hub 열람·카탈로그 작성 권한과 업무 근거가 있다. 원천 메타데이터 조회권은 선택적이다"
    trigger: "선정한 공개 객체를 처음 등록하거나 구조·업무 의미·그룹 코드·상세 설명·접근 그룹을 보완한다"
    main_flow: ["UC-001에서 관리 원천과 영향을 확인하고 데이터소스 내부 ID·DB/카탈로그·실제 스키마·객체명으로 공개 객체를 식별한다. 필요한 서버 한정자는 원천 사실에 포함한다", "REQ-301.manual_registration에 따라 공개 객체와 컬럼을 직접 입력하거나 원천 조회로 보완하고 업무 명칭·설명·의미/형식·값 도메인의 원천과 검수 근거를 후보에 작성한다. 원천 자료형은 REQ-301.source_type_catalog의 DBMS별 공통코드에서 선택·대조하며 버전별 목록은 만들지 않는다. 대상 시스템 귀속을 새로 만들지 않는다", "개인정보 기준·테이블 접근 허용 그룹과 REQ-103.column_group_exclusions의 컬럼별 대상 그룹과 숨김/마스킹 예외를 확인한다. 테이블 밖 그룹은 허용하지 않으며 컬럼의 개인정보 여부·마스킹 옵션과 같은 전체 후보로 저장한다. 의미 검수·개인정보 검수·보안 정책 적용을 각각 구분한다", "대상 테이블에 적용되는 현재 조회 정책은 REQ-611.query_constraints에 따라 역조회하고 편집은 SCR-009·UC-026으로 이동한다. 카탈로그 후보 저장/복사/복원에 정책 정의를 포함하지 않는다", "현재 변경 권한·기대 버전·필수 속성/참조·SQL/객체 참조 기술 검증을 통과한 영역 변경을 UC-003으로 직접 저장한다. 미완성 검증 상태는 AI 사용 자격과 구분한다.", "자산 변경이 연결 지식의 업무 의미 영향 검토 작업을 생성하거나 관리자 승인 대기로 전환하지 않는다.", "UC-006에서 실제 반영 결과를 확인한다. 유효본에서도 현재 공개·권한·필수 메타데이터 조건을 만족하는 범위만 AI 주입·업무 조회에 제공한다"]
    alternative_flows:
      - id: "A1"
        condition: "선택적인 원천 조회/표본 확인"
        flow: ["현재 원천 권한·개인정보 제외·조회 상한과 REQ-304.note의 수동 표본 확인 경계를 따른다. 성공 관측과 수기 근거는 구분한다."]
      - id: "A2"
        condition: "미완성 메타데이터"
        flow: ["입력 가능한 미완성 상태를 직접 저장할 수 있어도 해당 범위를 AI 사용 가능으로 검증하지 않는다. 참조/입력 무결성 오류 자체는 저장하지 않는다."]
      - id: "A3"
        condition: "비활성/허용된 삭제·과거 복원"
        flow: ["현재 권한·기대 버전/참조 보호를 다시 검증해 새 직접 저장/전체 이력으로 처리한다."]
    exception_flows:
      - id: "E1"
        condition: "완전한 선언 식별 불가·Hub 관리 권한 부족·필수 참조 조회 실패"
        flow: ["읽기 실패를 객체 없음으로 처리하지 않는다. 자동 삭제·공개·후보 확정 없이 실패 원인과 보완 항목을 안내한다"]
      - id: "E2"
        condition: "업무 의미·값 도메인·개인정보 검수가 미완성/지원 불가"
        flow: ["해당 범위를 사용할 수 없는 후보로 유지한다. 자동 수집·입력 문구만으로 사용 가능을 확정하거나 제약을 완화하지 않는다"]
      - id: "E3"
        condition: "반영 시 기준 운영본이나 참조가 변경됨"
        flow: ["UC-003·012의 검증 결과에 따라 접수/반영을 막고 차이를 확인한다. 오래된 후보로 현재 값을 덮어쓰지 않는다"]
    postcondition: "현재 적용 카탈로그와 전체 HIST/실제 검증 상태가 일관되게 저장된다. 로컬 편집·미완성 범위를 검증된 AI 사용 범위로 표시하지 않는다."
    rules_from: ["REQ-301.column_metadata", "REQ-301.value_domain", "REQ-611.query_constraints", "REQ-301.business_rules", "REQ-301.quality_management", "REQ-304.note", "REQ-601.direct_management"]
    sequence_design:
      scope: "관리 화면의 한 번의 버튼 영역 직접 저장과 전체 이력 복사. 별도 관리자 승인/서버 요청 초안은 없다."
      contracts_from: ["REQ-601.management_storage", "REQ-306.version_guard"]
      diagrams:
        - key: "direct-save"
          title: "영역 저장과 전체 변경 이력 원자 반영"
          transaction_boundary: "현재 변경 권한·기대 버전·참조/기술 검증 후 현재값·리비전·전체 HIST와 원 명령 결과를 같은 트랜잭션으로 확정한다."
          mermaid: |
            sequenceDiagram
            autonumber
            participant U as 관리 화면
            participant A as admin 소유 서비스
            participant D as AI 전용 DB
            U->>A: saveTarget·영역 변경값·기대 버전·사유·명령키
            A->>A: 현재 변경 권한·참조/기술 계약 검증
            A->>D: 같은 부모 잠금·기준 버전 비교
            alt 유효한 영역 변경
            A->>D: 대상 영역만 반영·리비전·전체 HIST·saveTarget/사유·명령 결과 원자 반영
            A-->>U: 실제 반영 결과·HISTORY_NO
            else 검증/저장 실패
            A-->>U: 현재값 유지·오류/충돌·원 결과 확인
            end
          reading_order: ["관리 화면이 현재 적용본의 saveTarget·기대 버전·해당 영역 입력·사유·원 명령키를 보낸다.", "서버는 현재 변경 권한·참조/기술 계약과 같은 부모 잠금/기준본을 검증한다.", "성공 분기에서 해당 영역·리비전·전체 HIST·전달 대상/메모·원 결과를 원자 확정한다. 실패 분기는 현재값을 유지하고 원 결과를 확인한다."]
    pending: ["@defer P3 — 입력 필드·원천 조회/샘플링 계약·미완성 표시·버전과 공개 범위 검증을 데이터/API/화면·시험으로 구체화한다. DB 기본값과 원천 DDL은 제외한다. 2026-10-29 사용자 결정에 따른 치수·인덱스 메타데이터는 REQ-301.source_dimensions/index_metadata의 후속 저장 설계를 따른다"]
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 saveTarget의 영역 변경값만 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-008
    name: "공개 객체 사이의 권장 조인 관계 후보를 검수한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: "FEAT-011"
    entities:
      - "ENT-006"
      - "ENT-008"
      - "ENT-020"
      - "ENT-025"
    reqs:
      - "REQ-301"
    actors:
      primary: "ACT-003"
      secondary: []
    process_step: "PRC-09-02"
    precondition: "양쪽 공개 객체·컬럼을 식별할 수 있고 관계의 업무 의미와 물리 또는 논리 근거를 확인할 수 있다"
    trigger: "별도 테이블 관계 화면 SCR-039에서 권장 조인 관계를 등록·수정·폐기한다. SCR-003은 읽기 전용 요약과 이동 참조를 제공한다"
    main_flow:
      - "REQ-301.relationship_metadata.ownership에 따라 데이터소스를 먼저 고르고 같은 소스의 양쪽 카탈로그를 팝업에서 각각 선택한다. 신규 왼쪽 카탈로그를 비표시 소유로 자동 고정하고 기존 소유는 보존한다. 좌우 컬럼 선택 후 가운데 그리드에 모든 쌍을 추가하고 숫자형 순서를 정정한다. FEAT-014.reference_validation으로 자기/같은 세트 후보와 외부 유효본을 구분하고 현재 접근 범위를 확인한다"
      - "물리 외래 키 또는 검수한 논리 관계의 근거와 방향·대응 수·복합 키 전체를 후보로 작성한다"
      - "REQ-301.relationship_metadata에 따라 조인 의미와 집계 중복 위험을 검수한다. 1:N의 중복을 일괄 DISTINCT로 숨기지 않는다"
      - "관계/전체 카탈로그 구성·정확 컬럼 쌍과 필수 기술 검증·현재 권한·기대 버전을 확인해 UC-003으로 직접 저장한다. 관계만 따로 부분 반영하거나 미열람 관계를 삭제하지 않는다."
    alternative_flows:
      - id: "A1"
        condition: "자동 수집한 외래 키 또는 동명 컬럼이 관계 후보로 보임"
        flow:
          - "검토 자료로만 사용하고 업무 관계를 확인한 뒤 후보로 확정한다"
      - id: "A2"
        condition: "독립 조회에 관계가 필요하지 않음"
        flow:
          - "관계 등록을 강제하지 않는다. 미확인 관계에 의존한 조회와 독립적으로 사용 가능한 컬럼을 구분한다"
      - id: "A3"
        condition: "같은 카탈로그의 자기조인"
        flow:
          - "두 역할과 컬럼 쌍 방향을 유지하고 양쪽 모두 같은 소유 후보의 구성으로 검증한다. 인증 예제의 객체 목록 중복 제거로 역할까지 합치지 않는다"
      - id: "A4"
        condition: "반대쪽 카탈로그 화면에서 관계를 변경"
        flow:
          - "같은 관계의 관리 카탈로그 후보로 연결해 현재 편집 권한을 검사한다. 화면 방향만으로 관리측을 바꾸거나 별도 관계 사본을 만들지 않는다"
    exception_flows:
      - id: "E1"
        condition: "복합 키 일부 누락·컬럼/객체 식별 불가·관계 의미 미확인"
        flow:
          - "권장 관계로 운영 사용하지 않고 초안·미검수 사유를 보존한다"
      - id: "E2"
        condition: "상대 객체의 현재 접근 권한 부족 또는 참조 버전 충돌"
        flow:
          - "관계 등록으로 권한을 부여하거나 참조 버전을 임의 선택하지 않는다. 관련 후보와 영향을 보완한다"
    postcondition: "권장 관계 전체 구성은 소유 카탈로그의 직접 저장/전체 이력과 함께 반영되고 관리자의 승인 큐를 만들지 않는다."
    rules_from:
      - "REQ-301.relationship_metadata"
      - "REQ-306.catalog_boundary"
      - "REQ-306.version_guard"
    sequence_design:
      scope: "관리 화면의 한 번의 전체 직접 저장. 별도 관리자 승인/서버 요청 초안은 없다."
      contracts_from:
        - "REQ-601.management_storage"
        - "REQ-306.version_guard"
      diagrams:
        - key: "direct-save"
          title: "전체 직접 저장과 변경 이력 원자 반영"
          transaction_boundary: "현재 변경 권한·기대 버전·참조/기술 검증 후 현재값·리비전·전체 HIST와 원 명령 결과를 같은 트랜잭션으로 확정한다."
          mermaid: |-
            sequenceDiagram
                autonumber
                participant U as 관리 화면
                participant A as admin 소유 서비스
                participant D as AI 전용 DB
                U->>A: 전체 구성·기대 버전·사유·명령키
                A->>A: 현재 변경 권한·참조/기술 계약 검증
                A->>D: 같은 부모 잠금·기준 버전 비교
                alt 유효한 전체 변경
                    A->>D: 현재값·리비전·전체 HIST·명령 결과 원자 반영
                    A-->>U: 실제 반영 결과·HISTORY_NO
                else 검증/저장 실패
                    A-->>U: 현재값 유지·오류/충돌·원 결과 확인
                end
          reading_order:
            - "관리 화면이 현재 적용본의 기대 버전·해당 영역 입력·사유·원 명령키를 보낸다."
            - "서버는 현재 변경 권한·참조/기술 계약과 같은 부모 잠금/기준본을 검증한다."
            - "성공 분기에서 현재값·리비전·전체 HIST·원 결과를 원자 확정한다. 실패 분기는 현재값을 유지하고 원 결과를 확인한다."
    pending:
      - "@defer P3 — SCR-039 별도 화면의 요건/목업·경로/권한·SCR-003 요약 이동/미저장 입력 보존·동일 전체 후보의 경합을 설계한다. 관계·복합 컬럼 쌍·검수 근거와 공통 관계 조회의 참조 무효/집합 밖/집계 중복 반례를 함께 검증한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-009
    name: "인증 예제 후보와 SQL에서 추출한 카탈로그 참조를 검수한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-302"
    actors:
      primary: "ACT-003"
      secondary: []
    process_step: "PRC-09-02"
    precondition: "후보 작성 권한과 공개 카탈로그·업무 질문·파라미터 근거가 있다. 원 조회를 승격할 때는 원본 조회 권한도 별도로 갖는다"
    trigger: "인증 예제를 직접 작성하거나 성공한 조회 이력을 후보로 승격하고, 기존 SQL·실행 데이터소스를 변경한다"
    main_flow:
      - "원본 근거 또는 직접 작성한 업무 질문·SQL·파라미터와 실행 데이터소스 내부 ID 하나를 후보에 기록한다"
      - "해당 후보 SQL의 실제 공개 객체 참조를 추출해 데이터소스·DB/스키마까지 식별하고 예제 자체에 카탈로그 ID·버전을 자동 매핑한다"
      - "REQ-302.authoring_relations에 따라 선택/추출한 정확 카탈로그 판 집합으로 FEAT-011의 공통 관계 조회를 호출한다. 양쪽이 그 집합에 속하고 현재 권한·검수·전체 컬럼쌍을 만족한 관계의 역할/방향·대응 수·근거를 작성에 참고하며 후보와 운영 상태를 구분한다"
      - "별칭·임시 질의 이름과 실제 객체를 구분하고 추출 결과·누락·버전 차이·모든 필수 참조를 검수한다. 공개 뷰 내부의 비공개 원본까지 수집하지 않는다"
      - "SQL 또는 실행 데이터소스·참조 판이 바뀌면 다시 추출·대조하고 같은 공통 관계 조회도 갱신한다. 범위 밖 중간 테이블이나 동명/다른 판을 자동 추가/대체하지 않는다. 예제의 카탈로그 매핑을 지식의 직접 매핑으로 복사하지 않는다"
      - "질문·파라미터·연결 지식 참조(직접 그룹 매핑 없음)·SQL과 참조 매핑을 전체 후보에 보존하고 UC-012로 인계한다. 운영 반영 뒤의 예시 주입·직접 실행은 현재 권한과 기존 SQL 통제를 따른다"
    alternative_flows:
      - id: "A1"
        condition: "개인 저장 조회의 사용 근거에서 승격"
        flow:
          - "REQ-205의 사용 현황 열람과 후보 작성 권한을 각각 검사한다. 후보만 만들고 원 개인 조회·다른 사용자의 즐겨찾기·위젯을 바꾸지 않는다"
      - id: "A2"
        condition: "같은 연결에서 여러 DB·스키마를 참조"
        flow:
          - "실제 참조의 식별자를 구분한다. 별도 사용 DB/스키마 허용 목록이나 데이터소스 간 SQL 조인을 새로 만들지 않는다"
      - id: "A3"
        condition: "같은 세트에서 공개 카탈로그 후보를 함께 작성"
        flow:
          - "UC-007과 연결하고 검증된 세트 내 후보 참조를 사용한다. UC-012의 전체 정합성·기준본 검증을 유지한다"
    exception_flows:
      - id: "E1"
        condition: "추출 실패·불확실·미등록 또는 식별 불가 객체"
        flow:
          - "누락·불확실성을 표시하고 초안만 보존한다. 미등록 객체를 자동 등록·공개하거나 불완전한 참조로 반영하지 않는다"
      - id: "E2"
        condition: "필수 참조 일부의 권한·사용 가능성 또는 버전 정합성 실패"
        flow:
          - "필수 참조를 일부 제거한 예제를 운영에 제공하지 않는다. 허용 가능한 전체 참조와 후보를 보완한다"
      - id: "E3"
        condition: "승격 원본 열람 또는 후보 작성 권한 부족"
        flow:
          - "승격을 거부하며 원 개인 조회를 공유하거나 내부 내용을 복제하지 않는다"
    catalog_access: "지식에 연결된 예제의 조회 후보 필터는 REQ-303.example_catalog_mapping.linked_example_filter를 따른다. 등록·저장/기술 검증의 조건과 구분한다."
    postcondition: "예제 SQL/파라미터·정확 참조와 지식 연결은 기술 검증·현재 변경 권한·기대 버전·전체 이력으로 직접 저장된 적용본만 활용한다."
    rules_from:
      - "REQ-302.business_rules"
      - "REQ-302.authoring_relations"
      - "REQ-302.exceptions"
      - "REQ-205.business_rules"
      - "REQ-303.example_catalog_mapping"
      - "REQ-306.version_guard"
    pending:
      - "@defer P3 — SQL 추출·카탈로그 식별·참조 스냅샷·원본 접근 계약과 실패 표시를 구체화한다. 직접 실행은 소유 agent 실행 계약과 시험으로 연결한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-014
    name: "등록 공개 범위의 원천 구조 차이를 관측한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: "FEAT-003"
    jobs: [JOB-003]
    screens: [SCR-002, SCR-525]
    entities:
      - "ENT-039"
      - "ENT-040"
      - "ENT-010"
      - "ENT-027"
      - "ENT-028"
    reqs:
      - "REQ-304"
    actors:
      primary: "ACT-003"
      secondary:
        - "ACT-010"
        - "ACT-014"
    process_step: "PRC-09-04"
    precondition: "등록 공개 범위와 구조 관측의 현재 권한을 확인할 수 있다."
    trigger: "JOB-003의 예약 시각 또는 관리자의 원천 구조 비교 명령"
    main_flow:
      - "예약/수동 실행이 같은 점유·멱등 계약으로 현재 설정의 등록 카탈로그 범위와 기준 판을 확정한다."
      - "등록 공개 테이블/뷰와 기준 카탈로그·현재 원천 구조의 비교 범위/권한을 확인한다."
      - "REQ-304.batch_structure_comparison으로 타입/컬럼/키 등 지원 구조 속성의 양쪽 값·부재/미지원/실패·기준/관측 시각을 조회한다."
      - "구조 관측/불일치 사실만 보존하고 자동 카탈로그/지식 변경·지식 영향 검토 작업을 만들지 않는다."
      - "업무 의미 적합성은 운영조직 자체 프로세스로 맡기고 필요한 관리는 현재 변경 권한자의 원 소유 직접 저장/기술 검증·이력으로 처리한다."
      - "저장된 결과를 불일치 탭·불일치 검사 요약·대시보드에서 같은 집계 단위와 현재 열람 범위로 확인하고 관리 화면으로 이동한다."
    alternative_flows:
      - id: "A1"
        condition: "담당자 변경 통지"
        flow:
          - "통지 사실/출처·대상·시각을 보존할 수 있으나 지식 영향 판정/작업을 생성하지 않는다."
      - id: "A2"
        condition: "접속 계정의 대상 스키마 메타데이터 조회 권한 부재가 확인됨"
        flow: ["REQ-304.batch_structure_comparison.summary에 따라 해당 없음 또는 일부 확인으로 표시한다. 과거 차이를 해소하지 않고 이전 결과로 유지한다."]
    exception_flows:
      - id: "E1"
        condition: "원천 조회 실패/미지원 또는 범위 불완전"
        flow:
          - "부재나 변경 없음으로 바꾸지 않고 실제 확인 상태를 안내한다."
    postcondition: "지원된 구조 관측 사실과 확인 불가를 재현한다. 업무 의미 영향 판단/배정/완료 상태는 없다."
    rules_from:
      - "REQ-304"
      - "REQ-303.reference_mapping"
    pending:
      - "@defer P3 — 구조 관측 범위·권한·기준/관측 시각·보존/재접수/복구 계약을 상세 설계한다."
    storage_context: "REQ-304.batch_structure_comparison 및 FEAT-003.batch_comparison_contract. ENT-039 비교 실행/대상별 근거와 ENT-040 현재 차이를 원자 갱신하고 관리값·마스터 리비전·관리 HIST는 수정하지 않는다. 공통 배치 실행 이력과 runId를 연결한다."
