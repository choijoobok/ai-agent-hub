    trigger: "고객사 변경 근거를 받거나 등록 공개 객체의 구조 변화 후보를 확인하거나 UC-007에서 카탈로그 업무 의미·값 도메인을 변경한다"
    main_flow:
      - "등록 공개 테이블/뷰와 기준 카탈로그·현재 원천 구조의 비교 범위/권한을 확인한다."
      - "REQ-304.batch_structure_comparison으로 타입/컬럼/키 등 지원 구조 속성의 양쪽 값·부재/미지원/실패·기준/관측 시각을 조회한다."
