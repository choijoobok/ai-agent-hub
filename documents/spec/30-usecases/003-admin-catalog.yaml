# 영역: 공개 카탈로그·인증 예제 — 공통 접수/승인 계약은 UC-001~006을 사용한다.
usecases:
  - id: UC-007
    code_lookup_flow: "컬럼 값 방식 CODE에서 같은 데이터소스의 사용 가능한 코드 조회 정확 버전을 선택하고 선언 파라미터의 값을 코드 바인딩 탭에 입력한다. 현재 조회 결과는 조회 코드 값 탭에서 확인하며 결과를 후보에 복제하지 않는다. 전체 저장은 참조/typed 바인딩과 직접 INLINE 목록을 모드에 따라 검증하고 원천 데이터 갱신과 내용 버전 변경을 구분한다. 실패/빈 결과·비활성/미검수·한도 초과는 사용 가능으로 표시하지 않는다"
    name: "공개 카탈로그 후보를 작성하고 사용 가능성을 검수한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: FEAT-003
    comparison_entry: "REQ-304.batch_structure_comparison의 일괄 관측·현재 불일치 목록은 SCR-002에서 수행한다. 카탈로그 원천 구조/샘플 조회 탭은 제거하고 원천 객체 확인은 신규 수동 등록의 선택 보조로 유지한다"
    entities:
      - ENT-005
      - ENT-006
      - ENT-007
      - ENT-020
      - ENT-021
      - ENT-022
      - ENT-023
      - ENT-024
      - ENT-028
    reqs:
      - REQ-301
    actors:
      primary: ACT-003
      secondary:
        - ACT-002
    process_step: "PRC-09-01"
    precondition: "고객사가 공개할 테이블·뷰를 선정했고 관리 대상 데이터소스의 Hub 열람·카탈로그 작성 권한과 업무 근거가 있다. 원천 메타데이터 조회권은 선택적이다"
    trigger: "선정한 공개 객체를 처음 등록하거나 구조·업무 의미·값 도메인·접근 그룹을 보완한다"
    main_flow:
      - "UC-001에서 관리 원천과 영향을 확인하고 데이터소스 내부 ID·DB/카탈로그·실제 스키마·객체명으로 공개 객체를 식별한다. 필요한 서버 한정자는 원천 사실에 포함한다"
      - "REQ-301.manual_registration에 따라 공개 객체와 컬럼을 직접 입력하거나 원천 조회로 보완하고 업무 명칭·설명·의미/형식·값 도메인의 원천과 검수 근거를 후보에 작성한다. 원천 자료형은 REQ-301.source_type_catalog의 DBMS별 공통코드에서 선택·대조하며 버전별 목록은 만들지 않는다. 대상 시스템 귀속을 새로 만들지 않는다"
      - "개인정보 기준·테이블 접근 허용 그룹과 REQ-103.column_group_exclusions의 컬럼별 대상 그룹과 숨김/마스킹 예외를 확인한다. 테이블 밖 그룹은 허용하지 않으며 컬럼의 개인정보 여부·마스킹 옵션과 같은 전체 후보로 저장한다. 의미 검수·개인정보 검수·보안 정책 적용을 각각 구분한다"
      - "대상 테이블에 적용되는 현재 조회 정책은 REQ-611.query_constraints에 따라 역조회하고 편집은 SCR-009·UC-026으로 이동한다. 카탈로그 후보 저장/복사/복원에 정책 정의를 포함하지 않는다"
      - "업무 의미·값 도메인 변경은 외부 통지·구조 비교 이상 유무와 무관하게 UC-014로 인계해 연결 지식·인증 예제의 검토 필요를 남긴다. 변경 후보와 실제 운영 반영 시점은 구분한다"
      - "미완성·미검수 범위를 표시하고 초안으로 저장한다. 검수가 끝난 후보를 반영하려면 UC-012의 자산 변경 세트로 인계한다"
      - "UC-006에서 실제 반영 결과를 확인한다. 유효본에서도 현재 공개·권한·필수 메타데이터 조건을 만족하는 범위만 AI 주입·업무 조회에 제공한다"
    alternative_flows:
      - id: "A1"
        condition: "원천 코멘트 또는 인라인 값 후보를 보완 자료로 사용"
        flow:
          - "코멘트는 초안 제안으로만 사용한다. 값 샘플링은 구조 조회와 구분하고 REQ-304.note의 수동 컬럼 선택·개인정보 제외·권한·조회량 제한·이력 계약을 적용한다"
      - id: "A2"
        condition: "일부 객체·컬럼의 의미나 제약을 아직 확인하지 못함"
        flow:
          - "초안을 보존하고 해당 범위를 운영 사용에서 제외한다. 미확인을 해당 없음이나 검수 완료로 바꾸지 않는다"
      - id: "A3"
        condition: "기존 후보의 비활성화·삭제 또는 과거 상태 복원"
        flow:
          - "참조 영향을 확인한 새 후보로 작성하고 UC-012를 따른다. 현재 유효본이나 과거 스냅샷을 직접 덮어쓰지 않는다"
      - id: "A4"
        condition: "원천 메타데이터 조회권 부족 또는 조회 불가"
        flow:
          - "실패 상태를 보존하고 정확 객체·컬럼을 직접 입력한다. 설계서/담당자 근거로 구조·의미를 검수하고 요청·승인·반영한다. 실제 관측 성공/자동 동일 객체 승계로 표시하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "완전한 선언 식별 불가·Hub 관리 권한 부족·필수 참조 조회 실패"
        flow:
          - "읽기 실패를 객체 없음으로 처리하지 않는다. 자동 삭제·공개·후보 확정 없이 실패 원인과 보완 항목을 안내한다"
      - id: "E2"
        condition: "업무 의미·값 도메인·개인정보 검수가 미완성/지원 불가"
        flow:
          - "해당 범위를 사용할 수 없는 후보로 유지한다. 자동 수집·입력 문구만으로 사용 가능을 확정하거나 제약을 완화하지 않는다"
      - id: "E3"
        condition: "반영 시 기준 운영본이나 참조가 변경됨"
        flow:
          - "UC-003·012의 검증 결과에 따라 접수/반영을 막고 차이를 확인한다. 오래된 후보로 현재 값을 덮어쓰지 않는다"
    postcondition: "공개 객체의 후보·검수 상태·운영 사용 가능 범위와 후속 요청이 구분된다. 초안 작성만으로 활성화하지 않는다"
    rules_from:
      - "REQ-301.column_metadata"
      - "REQ-301.value_domain"
      - "REQ-611.query_constraints"
      - "REQ-301.business_rules"
      - "REQ-301.quality_management"
      - "REQ-304.note"
      - "REQ-601.direct_management"
    sequence_design:
      contracts_from:
        - "FEAT-003.identity_contract"
        - "FEAT-003.composition_contract"
        - "FEAT-003.edit_transaction"
        - "FEAT-003.set_public_contract"
        - "FEAT-003.source_public_contract"
        - REQ-301
        - REQ-304
      scope: "SCR-003의 현재 적용본 전체 변경을 요청 또는 전결 반영한다. 서버 저장 초안의 편집은 별도 SCR-056 문맥이며 운영 리비전을 바꾸지 않는다."
      diagrams:
        - key: "draft-save"
          title: "전체 변경의 요청 스냅샷과 전결·승인 후 원자 반영"
          apis:
            - API-023
            - API-024
            - API-034
          testcases:
            - TC-0032
            - TC-0033
            - TC-0034
            - TC-0035
            - TC-0036
            - TC-0037
            - TC-00310
          transaction_boundary: "요청 접수는 ENT-049·전체 SNP·명령 결과를 원자 저장한다. 실제 반영은 부모 잠금 아래 기준/참조·현재 권한을 검증하고 본 데이터·마스터 REVISION·전체 HIST·APPLIED_REVISION·요청/명령 결과를 함께 확정한다."
          mermaid: |
            sequenceDiagram
            autonumber
            participant U as 적용본 관리 화면
            participant A as admin 변경 처리
            participant Q as 별도 요청 화면
            participant D as AI 전용 DB
            U->>A: 전체 구성·baseRevision·commandKey
            A->>A: 현재 권한·기준본·전체 구성·승인 설정 검증
            alt 동일 명령 성공 존재
            A-->>U: 기존 요청/반영 결과 재생
            else 새 변경
            A->>D: 요청 원장·전체 SNP·BASE_REVISION 원자 저장
            alt 승인 사용
            A-->>U: REQUESTED·requestNo·appliedRevision null
            U->>Q: 요청번호로 이동
            Q->>A: 기술 검토 후 최종 승인 또는 반려
            else 승인 미사용
            A->>A: 실제 저장자 전결 근거 기록
            end
            alt 반려
            A->>D: 제출본 유지·판정자/시각/반려 사유 저장
            A-->>Q: 운영값·리비전·HIST 유지
            else 실제 반영
            rect rgba(90, 160, 110, 0.10)
            Note over A,D: 하나의 실제 반영 트랜잭션
            A->>D: 모든 부모 잠금·BASE_REVISION·참조·현재 권한 검사
            alt 충돌 또는 저장 실패
            A->>D: 전체 ROLLBACK
            else 검증 통과
            A->>D: 본 데이터·새 마스터 REVISION·전체 HIST 저장
            A->>D: APPLIED_REVISION·요청 완료·명령 결과 COMMIT
            end
            end
            A-->>U: 실제 반영 결과·새 리비전 또는 실패
            end
            end
            opt 응답 유실
            U->>A: API-034 원 명령 확인/같은 입력 재시도
            A-->>U: 원 결과·추가 리비전 없음
            end
          reading_order:
            - "현재 화면은 기준 적용본의 전체 변경을 전달한다. 승인 사용 시 본 데이터는 유지하고 별도 요청 메뉴에서 제출본을 검토한다."
            - "기술 검토·최종 판정과 실제 반영을 구분한다. 반영 성공에만 결과 리비전·HIST를 만들며 반려 제출본은 보존한다."
            - "전체 대상과 자식은 원자 반영하며 같은 명령 재전송은 원 결과만 반환한다."
          counterexamples:
            - "요청 접수/반려만으로 운영 리비전이 증가하거나 HIST가 생기면 실패한다."
            - "자식 반영/이력/요청 결과 일부만 성공하거나 동일 명령으로 추가 증가하면 실패한다."
        - key: "source-and-handoff"
          title: "원천 관측·메타데이터 검수와 소유 변경 세트의 고정/반영 인계"
          apis:
            - API-028
            - API-029
            - API-030
            - API-035
          testcases:
            - TC-00310
            - TC-00311
            - TC-00312
            - TC-00313
            - TC-00314
          transaction_boundary: "원천 확인/샘플과 getValidation은 운영 반영 TX가 아니다. 고정과 실제 반영은 FEAT-014/040 소유의 별도 짧은 TX이며 사람의 검토/승인 대기를 DB 잠금 안에 두지 않는다"
          mermaid: |
            sequenceDiagram
            autonumber
            participant U as 카탈로그 화면
            participant A as admin 카탈로그 조회/검증
            participant I as integration 원천 관측
            participant K as 자산 변경 세트 소유
            participant D as AI 전용 DB
            opt 데이터소스 관리의 일괄 비교 또는 신규 객체 확인
            U->>A: API-028/029 선정한 정확 객체/선택 판
            A->>I: 현재 공개/권한 안의 정확 객체 구조 확인
            alt 모호/부분/실패
            I-->>A: 상태·누락/실패 범위·관측 근거
            A-->>U: 확인 불가/차이 표시 — 자동 삭제·공개 없음
            else 정확 사실 확인
            I-->>A: 구조 사실·코멘트 제안·관측 근거
            A-->>U: 검수 보조 자료 — 의미 검수 완료 아님
            end
            end
            Note over U,A: 조회권이 없으면 완전한 직접 입력과 설계서/담당자 근거로 검수
            opt 현재 범위 제외인 샘플링의 향후 재검토
            Note over U,I: 등록 컬럼 선택·현재 원본 권한·개인정보 제외·제약/상한 계약이 완성된 때만 활성화
            U->>A: API-030 검증 가능한 조건/선택 컬럼
            A->>I: 현재 정책/제약/행·시간 제한 검증 후 조회
            I-->>U: 허용 결과·시스템 조회 이력 참조 — 후보/근거에 원문 복제 금지
            end
            U->>A: API-035 명시 문맥/기준 리비전·세트 후보 집합 검증
            A-->>U: 누락·참조·검수 결과 — 예약/접수/반영 허가 아님
            alt 미완성 또는 소유 계약 대기
            U->>U: 초안 보완 — 현재 운영본 유지
            else 인계 가능한 전체 후보
            U->>K: SCR-056의 소유 흐름으로 대상·기준/후보 판·사유 인계
            rect rgba(110, 150, 190, 0.10)
            Note over K,D: 소유 고정 TX — 실제 저장/복구 계약은 knowledge 후속
            K->>D: 전체 SNP/참조 잠금·BASE_REVISION·구성 완전성 검사
            K->>D: 전체 SNP 고정·REQUESTED 또는 전체 실패
            end
            Note over K,D: 요청/기술 검토·승인 또는 설정 미사용 전결 — DB 잠금 밖의 소유 절차
            rect rgba(90, 160, 110, 0.10)
            Note over K,D: 별도 실제 반영 TX — 소유 G3 후 구현
            K->>D: 전체 기준/참조 최신성·현재 권한/정책·동일성 재검증
            alt 충돌/필수 검증 실패
            K->>D: ROLLBACK — 운영본 유지
            else 반영 검증 통과
            K->>D: 전체 적용 데이터·마스터 REVISION·HIST·APPLIED_REVISION·세트 결과 COMMIT
            end
            end
            K-->>U: 실제 세트 결과 확인 — 초안 저장과 구분
            end
          reading_order:
            - "관측과 검수, 샘플 실행, 후보 검증, 고정/승인·전결, 실제 반영을 분리한다. 구조 정상도 업무 의미/값 변경의 영향 검토를 면제하지 않는다"
            - "샘플의 현재 권한/개인정보 제외·조건/상한이 미완성이면 기능을 활성화하지 않는다. 이 그림은 샘플 상한 숫자나 허용 공개 범위를 새로 정하지 않는다"
            - "고정과 반영은 소유 기능의 전체 후보 집합을 사용한다. 현재 직접 정책이나 외부 DDL을 admin DB 잠금으로 동결한 것으로 간주하지 않는다"
          pending:
            - "@defer P3 knowledge·access_policy·integration·agent — 그룹 후보·세트 원장/고정/복구·원천 관측/샘플 공개 계약과 실제 동시 실행 시험을 연결한다"
      pending:
        - "@defer P3 — 화면 상세 승인·소유 후속 계약·구체 DTO/오류 메시지·제품 DB/동시 요청 및 사용자 시험을 완료한다"
    pending:
      - "@defer P3 — 입력 필드·원천 조회/샘플링 계약·미완성 표시·버전과 공개 범위 검증을 데이터/API/화면·시험으로 구체화한다. DB 기본값과 원천 DDL은 제외한다. 2026-10-29 사용자 결정에 따른 치수·인덱스 메타데이터는 REQ-301.source_dimensions/index_metadata의 후속 저장 설계를 따른다"
    storage_context: "REQ-601.management_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-056 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-008
    name: "공개 객체 사이의 권장 조인 관계 후보를 검수한다"
    workstream: "admin"
    design_status: "draft"
    feature_contract: FEAT-011
    entities:
      - ENT-006
      - ENT-008
      - ENT-020
      - ENT-025
    reqs:
      - REQ-301
    actors:
      primary: ACT-003
      secondary: []
    process_step: "PRC-09-02"
    precondition: "양쪽 공개 객체·컬럼을 식별할 수 있고 관계의 업무 의미와 물리 또는 논리 근거를 확인할 수 있다"
    trigger: "별도 테이블 관계 화면 SCR-039에서 권장 조인 관계를 등록·수정·폐기한다. SCR-003은 읽기 전용 요약과 이동 참조를 제공한다"
    main_flow:
      - "REQ-301.relationship_metadata.ownership에 따라 관리 카탈로그를 작성 시 명시 선택·고정하고 양쪽 역할·공개 객체·모든 컬럼 쌍을 작성한다. FEAT-014.reference_validation으로 자기/같은 세트 후보와 외부 유효본을 구분하고 현재 접근 범위를 확인한다"
      - "물리 외래 키 또는 검수한 논리 관계의 근거와 방향·대응 수·복합 키 전체를 후보로 작성한다"
      - "REQ-301.relationship_metadata에 따라 조인 의미와 집계 중복 위험을 검수한다. 1:N의 중복을 일괄 DISTINCT로 숨기지 않는다"
      - "별도 화면에서도 관리 카탈로그의 같은 리비전·전체 후보·EDIT_VERSION과 API-023/024/025 계열로 관계 이외의 구성을 보존해 저장하고 UC-012의 세트 승인/전결로 인계한다. 독립 관계 버전·부분 저장/승인을 만들지 않는다"
    alternative_flows:
      - id: "A1"
        condition: "자동 수집한 외래 키 또는 동명 컬럼이 관계 후보로 보임"
        flow:
          - "검토 자료로만 사용하고 업무 관계를 확인한 뒤 후보로 확정한다"
      - id: "A2"
        condition: "독립 조회에 관계가 필요하지 않음"
        flow:
          - "관계 등록을 강제하지 않는다. 미확인 관계에 의존한 조회와 독립적으로 사용 가능한 컬럼을 구분한다"
      - id: "A3"
        condition: "같은 카탈로그의 자기조인"
        flow:
          - "두 역할과 컬럼 쌍 방향을 유지하고 양쪽 모두 같은 소유 후보의 구성으로 검증한다. 인증 예제의 객체 목록 중복 제거로 역할까지 합치지 않는다"
      - id: "A4"
        condition: "반대쪽 카탈로그 화면에서 관계를 변경"
        flow:
          - "같은 관계의 관리 카탈로그 후보로 연결해 현재 편집 권한을 검사한다. 화면 방향만으로 관리측을 바꾸거나 별도 관계 사본을 만들지 않는다"
    exception_flows:
      - id: "E1"
        condition: "복합 키 일부 누락·컬럼/객체 식별 불가·관계 의미 미확인"
        flow:
          - "권장 관계로 운영 사용하지 않고 초안·미검수 사유를 보존한다"
      - id: "E2"
        condition: "상대 객체의 현재 접근 권한 부족 또는 참조 버전 충돌"
        flow:
          - "관계 등록으로 권한을 부여하거나 참조 버전을 임의 선택하지 않는다. 관련 후보와 영향을 보완한다"
    postcondition: "검수 근거가 있는 관계 후보와 변경 요청이 연결되며 운영 사용은 실제 반영·현재 접근 통제를 따른다"
    rules_from:
      - "REQ-301.relationship_metadata"
      - "REQ-306.catalog_boundary"
      - "REQ-306.version_guard"
    sequence_design:
      contracts_from:
        - FEAT-011
        - "FEAT-003.composition_contract"
        - "FEAT-003.set_public_contract"
        - "FEAT-014.reference_validation"
        - ADR-030
      shared_sequences:
        - "[공통 후보 저장](UC-007.md#draft-save)"
        - "[고정·실제 반영 인계](UC-007.md#source-and-handoff)"
      scope: "별도 SCR-039의 관계 관리측 선택·반대편 동일 정본 조회·자기조인과 복합 컬럼쌍을 같은 전체 카탈로그 후보에 연결한다. SCR-003의 관계 탭/FK 직접 설정은 제공하지 않는다"
      diagrams:
        - key: "managing-relation"
          title: "관리측 고정과 자기/세트/외부 판을 구분한 관계 후보"
          apis:
            - API-024
            - API-027
            - API-036
          testcases:
            - TC-0111
            - TC-0112
            - TC-0113
          transaction_boundary: "관계/쌍은 관리 카탈로그 전체 후보의 저장 TX에 포함한다. 별도 관계 승인/부분 반영은 없고 실제 고정·반영은 UC-007의 소유 세트 인계를 따른다"
          mermaid: |
            sequenceDiagram
            autonumber
            participant U as 테이블 관계 화면 SCR-039
            participant A as admin 카탈로그 후보
            participant D as AI 전용 DB
            U->>A: API-027 선택 판에 관련된 관계 조회
            A-->>U: 같은 관계 ID·관리 카탈로그·두 역할/방향·정확 참조 판
            alt 반대편 화면에서 기존 관계 수정
            U->>A: 관리 카탈로그 후보 열기·현재 SAVE/소유 권한 확인
            A-->>U: 관리측 편집 문맥 또는 권한 거부
            else 새 관계 작성
            U->>U: 양쪽 공개 카탈로그 중 관리측 명시 선택
            Note over U,A: 관리측은 생성 뒤 고정 — 1/N 방향·화면 진입과 별개
            end
            U->>A: API-036 현재 권한의 객체/컬럼/참조 판 후보 조회
            A-->>U: 자기/같은 세트 후보·외부 유효본 참조 구분
            alt 자기조인
            U->>U: 같은 소유 후보의 LEFT/RIGHT 두 역할·모든 방향 컬럼쌍 유지
            else 서로 다른 공개 객체
            U->>U: 양쪽 정확 판/역할·관계 의미·전체 복합 컬럼쌍 검수
            end
            rect rgba(110, 150, 190, 0.10)
            Note over A,D: UC-007 draft-save의 관리측 전체 후보 TX
            U->>A: API-024 관리측 전체 구성·기대 편집 버전·원 키
            A->>D: 전체 후보/EDIT_VERSION·소유/종류·전체 쌍/참조·검수 근거 확인
            alt 존재하지 않는 비null 참조/잘못된 소유/중복/관리측 이전 시도
            A->>D: ROLLBACK
            A-->>U: 보완 사유 — 자동 판 치환/권한 부여 없음
            else 전체 초안 저장 가능
            Note over A,D: 쌍 0개/일부 완전 쌍은 누락 사유와 UNKNOWN 보존 — 검수 완료/운영 사용은 불가
            A->>D: 관계/쌍 포함 전체 후보·원 성공 COMMIT
            A-->>U: 후보 저장 결과 — 운영 반영은 소유 세트로 인계
            end
            end
          reading_order:
            - "반대편 조회도 같은 안정 관계 ID를 사용한다. 기존 관계의 관리측을 바꾸거나 사본으로 편집하지 않는다"
            - "자기조인은 같은 카탈로그/후보여도 두 업무 역할을 유지하며 LEFT/RIGHT 컬럼쌍을 합치지 않는다. 복합 쌍 일부만 검수하지 않는다"
            - "관계 정의는 쌍 목록 0개나 일부 완전한 쌍과 누락 사유로 초안 보존한다. 한쪽 컬럼만 있는 불완전 쌍 행·없는 참조·소유 오류·중복·관리측 이전은 거부하고, 누락 상태를 검수 완료/권장 경로로 운영 제공하지 않는다"
            - "참조 선택은 예약이 아니다. 같은 세트 후보/외부 현재 유효본과 실제 반영 직전 현재 권한을 다시 검증하며 무관한 자산에 업무 점유를 만들지 않는다"
          counterexamples:
            - "1:N 중복 의미를 일괄 DISTINCT로 감추거나 관계가 불필요한 독립 컬럼에도 관계를 강제하면 실패해야 한다"
    pending:
      - "@defer P3 — SCR-039 별도 화면의 요건/목업·경로/권한·SCR-003 요약 이동/미저장 입력 보존·동일 전체 후보의 경합을 설계한다. 관계·복합 컬럼 쌍·검수 근거와 공통 관계 조회의 참조 무효/집합 밖/집계 중복 반례를 함께 검증한다"
    storage_context: "REQ-601.management_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 SCR-056 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
  - id: UC-009
    name: "인증 예제 후보와 SQL에서 추출한 카탈로그 참조를 검수한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-302]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-02
    precondition: "후보 작성 권한과 공개 카탈로그·업무 질문·파라미터 근거가 있다. 원 조회를 승격할 때는 원본 조회 권한도 별도로 갖는다"
    trigger: "인증 예제를 직접 작성하거나 성공한 조회 이력을 후보로 승격하고, 기존 SQL·실행 데이터소스를 변경한다"
    main_flow:
      - "원본 근거 또는 직접 작성한 업무 질문·SQL·파라미터와 실행 데이터소스 내부 ID 하나를 후보에 기록한다"
      - "해당 후보 SQL의 실제 공개 객체 참조를 추출해 데이터소스·DB/스키마까지 식별하고 예제 자체에 카탈로그 ID·버전을 자동 매핑한다"
      - "REQ-302.authoring_relations에 따라 선택/추출한 정확 카탈로그 판 집합으로 FEAT-011의 공통 관계 조회를 호출한다. 양쪽이 그 집합에 속하고 현재 권한·검수·전체 컬럼쌍을 만족한 관계의 역할/방향·대응 수·근거를 작성에 참고하며 후보와 운영 상태를 구분한다"
      - "별칭·임시 질의 이름과 실제 객체를 구분하고 추출 결과·누락·버전 차이·모든 필수 참조를 검수한다. 공개 뷰 내부의 비공개 원본까지 수집하지 않는다"
      - "SQL 또는 실행 데이터소스·참조 판이 바뀌면 다시 추출·대조하고 같은 공통 관계 조회도 갱신한다. 범위 밖 중간 테이블이나 동명/다른 판을 자동 추가/대체하지 않는다. 예제의 카탈로그 매핑을 지식의 직접 매핑으로 복사하지 않는다"
      - "질문·파라미터·접근 그룹·SQL과 참조 매핑을 전체 후보에 보존하고 UC-012로 인계한다. 운영 반영 뒤의 예시 주입·직접 실행은 현재 권한과 기존 SQL 통제를 따른다"
    alternative_flows:
      - { id: A1, condition: "개인 저장 조회의 사용 근거에서 승격", flow: ["REQ-205의 사용 현황 열람과 후보 작성 권한을 각각 검사한다. 후보만 만들고 원 개인 조회·다른 사용자의 즐겨찾기·위젯을 바꾸지 않는다"] }
      - { id: A2, condition: "같은 연결에서 여러 DB·스키마를 참조", flow: ["실제 참조의 식별자를 구분한다. 별도 사용 DB/스키마 허용 목록이나 데이터소스 간 SQL 조인을 새로 만들지 않는다"] }
      - { id: A3, condition: "같은 세트에서 공개 카탈로그 후보를 함께 작성", flow: ["UC-007과 연결하고 검증된 세트 내 후보 참조를 사용한다. UC-012의 전체 정합성·기준본 검증을 유지한다"] }
    exception_flows:
      - { id: E1, condition: "추출 실패·불확실·미등록 또는 식별 불가 객체", flow: ["누락·불확실성을 표시하고 초안만 보존한다. 미등록 객체를 자동 등록·공개하거나 불완전한 참조로 반영하지 않는다"] }
      - { id: E2, condition: "필수 참조 일부의 권한·사용 가능성 또는 버전 정합성 실패", flow: ["필수 참조를 일부 제거한 예제를 운영에 제공하지 않는다. 허용 가능한 전체 참조와 후보를 보완한다"] }
      - { id: E3, condition: "승격 원본 열람 또는 후보 작성 권한 부족", flow: ["승격을 거부하며 원 개인 조회를 공유하거나 내부 내용을 복제하지 않는다"] }
    postcondition: "예제 전체 후보와 실제 공개 참조·검수 근거가 연결된다. 승격·추출·초안 저장은 인증 완료나 실행 권한 부여가 아니다"
    rules_from: ["REQ-302.business_rules", "REQ-302.authoring_relations", "REQ-302.exceptions", "REQ-205.business_rules", "REQ-303.example_catalog_mapping", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — SQL 추출·카탈로그 식별·참조 스냅샷·원본 접근 계약과 실패 표시를 구체화한다. 직접 실행은 소유 agent 실행 계약과 시험으로 연결한다"

  - id: UC-014
    name: "고객사 변경이 공개 카탈로그와 연결 지식에 주는 영향을 판정한다"
    workstream: admin
    design_status: draft
    feature_contract: FEAT-003
    entities: [ENT-010, ENT-027, ENT-028]
    reqs: [REQ-304]
    actors: { primary: ACT-003, secondary: [ACT-010, ACT-014] }
    process_step: PRC-09-04
    precondition: "고객사 변경 통지·근거, 등록 공개 객체의 구조 변화 후보 또는 관리자의 카탈로그 업무 의미·값 도메인 변경이 있으며 영향 자산과 변경 근거를 조회할 권한이 있다"
    trigger: "고객사 변경 근거를 받거나 등록 공개 객체의 구조 변화 후보를 확인하거나 UC-007에서 카탈로그 업무 의미·값 도메인을 변경한다"
    main_flow:
      - "변경 통지의 출처·내용·예정/실제 적용 시점과 Hub에 등록된 공개 객체 범위를 확인한다"
      - "구조·업무 의미·민감도 영향을 판정하고 카탈로그→지식 직접 경로와 카탈로그→예제→지식 간접 경로를 함께 추적한다"
      - "구조 변화 후보 또는 카탈로그 업무 의미·값 도메인 변경이면 연결 지식·인증 예제에 UC-013의 검토 필요를 남긴다. 기존 열린 작업에는 근거·해당 버전을 연결하며, 내부 의미 변경을 외부 통지나 구조 이상이 없다는 이유로 생략하지 않는다"
      - "영향 없음은 판정 근거·사유·처리자·시각을 남긴다. 수정이 필요하면 검토 작업에서 UC-012의 실제 변경 요청으로 이어진다"
      - "고객사 적용과 Hub 실제 반영의 시점·영향·미해결 검토를 대조한다. 비중대한 변경의 시차 수용과 중대한 영향 판단을 구분한다"
    alternative_flows:
      - { id: A1, condition: "등록 공개 객체의 구조 비교를 사용", flow: ["REQ-304의 선택적 검수 보조 신호로만 사용한다. 전체 DB 대사·원천 자동 감시·업무 의미 변화의 완전 탐지를 약속하지 않는다"] }
      - { id: A2, condition: "실제 실행 실패나 품질 문제가 함께 발견됨", flow: ["발생 근거와 조사를 원래 소유 경로로 연결한다. 이미 조사에서 진단했다면 같은 예방적 검토를 강제로 중복 생성하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "통지 근거 부족 또는 영향 불명확", flow: ["구조 비교 정상·SQL 성공만으로 영향 없음으로 종결하지 않고 고객사 확인과 검토를 유지한다"] }
      - { id: E2, condition: "파괴적 변경으로 기존 실행이 실패", flow: ["오류를 기록하되 활성 지식·예제를 자동 비활성화하지 않는다. SQL 접근·마스킹 통제는 계속 적용하고 개인 저장 조회의 확인 필요/오류는 REQ-204의 별도 상태를 따른다"] }
      - { id: E3, condition: "중대한 영향이 확인됐으나 조치 판단이 필요", flow: ["비중대한 시차 허용을 통제 유예로 확대하지 않는다. 근거와 영향 범위를 남기고 REQ-304.open의 후속 중지·재개 판단 계약으로 연결한다"] }
    postcondition: "공개 범위의 영향 판정 또는 미해결 검토가 남고 실제 변경·조사와 연결된다. 판정만으로 운영 카탈로그를 자동 갱신하지 않는다"
    rules_from: ["REQ-304.detail", "REQ-304.hard_rule", "REQ-304.limits", "REQ-304.timing_policy", "REQ-307.boundary"]
    pending:
      - "@defer P3 — 선택적 구조 비교의 주기·상한과 중대한 영향 판정·긴급 중지/재개 권한·절차는 REQ-304.open을 구체화한다. 이번 업무 흐름에서 수치나 자동 중단 정책을 정하지 않는다"
