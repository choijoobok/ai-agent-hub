# 영역: 지식·공통 태그·자산 변경 요청·예방적 검토. 업무 규칙의 정본은 rules_from이다.
usecases:
  - id: UC-010
    name: "지식 본문과 독립 참조·도구별 사용 설명을 후보로 작성한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-303"
    actors:
      primary: "ACT-003"
      secondary: []
    process_step: "PRC-09-02"
    precondition: "지식 작성 권한과 업무 근거가 있고 매핑 대상의 현재 존재·연결 가능 상태·권한을 확인할 수 있다. 외부 리비전을 지식의 운영 매핑에 고정하지 않는다"
    trigger: "지식을 신규 작성하거나 본문·접근 그룹·태그 ID·참조 링크·매핑별 설명을 변경한다"
    main_flow:
      - "업무 의미·일반 절차를 본문에 작성하고 접근 그룹을 지정한다. 물리명·SQL은 카탈로그·인증 예제, 특정 도구의 호출 안내는 해당 매핑 설명으로 구분한다"
      - "인증 예제와 직접 카탈로그를 각각 안정 ID로 0개 이상 독립 선택한다. 관리에서는 매핑 ID·표시명·직접/예제 경유 경로를 확인하고 예제 상세/참조 버전을 지식 소유 후보로 복사하지 않는다"
      - "태그 ID와 업무 API·커스텀 도구를 각각 연결하고 도구 매핑마다 용도·사용 조건·입력 확보·결과 안내·질문/선택별 후속 절차를 작성한다"
      - "지식 소유 본문·그룹·안정 ID 매핑/설명만 현재 권한·기대 버전·필수 참조/입력 검증으로 UC-003에서 직접 저장한다. 외부 자산 상세를 지식 소유로 복사하거나 업무 의미 영향 검토를 요구하지 않는다."
      - "실제 적용본만 현재 접근 권한·활성/기술 유효성을 만족할 때 검색/주입한다."
    alternative_flows:
      - id: "A1"
        condition: "특정 데이터 객체나 도구가 없는 일반 업무 지식"
        flow:
          - "예제·카탈로그·도구 연결을 강제하지 않는다. 지식 접근 그룹과 본문 검수는 유지한다"
      - id: "A2"
        condition: "여러 데이터소스·스키마의 카탈로그를 연결"
        flow:
          - "참조에서 소속을 얻고 지식에 별도 데이터소스/스키마 목록을 중복 저장하지 않는다. 합산을 권한 확대나 데이터소스 간 SQL 조인 허용으로 해석하지 않는다"
      - id: "A3"
        condition: "예제 또는 도구 연결을 해제"
        flow:
          - "직접 저장된 새 적용본부터 해당 경로/매핑 설명을 제외한다. 다른 직접·예제 경로와 자산 자체는 유지한다"
      - id: "A4"
        condition: "매핑 설명만 변경하거나 과거 상태를 복원"
        flow:
          - "새 지식 후보의 전체 스냅샷으로 처리한다. 과거 변경·실행 근거를 현재 값으로 치환하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "본문에 물리명·SQL·특정 도구 호출 안내를 중복 작성"
        flow:
          - "해당 원천·매핑 편집으로 안내하고 검수 전 유효 반영하지 않는다. 자동 탐지만으로 완전 검수를 가정하지 않는다"
      - id: "E2"
        condition: "지식 자기 기준본 충돌·연결 ID 부재/사용 불가·현재 권한 부족 또는 매핑 설명 필수값 누락"
        flow:
          - "유효 반영을 차단하고 실제 오류를 안내한다. 연결 자산의 정상 리비전 상승만을 이 실패로 처리하거나 외부 상세 재심사·리비전 동기화를 요구하지 않는다. SQL/API 기술 검증은 해당 자산/실행에서 유지한다"
      - id: "E3"
        condition: "접근 그룹 없음 또는 현재 권한/필수 참조 판정 실패"
        flow:
          - "REQ-303.example_catalog_mapping.security에 따라 지식·직접 참조·예제의 사용 가능성을 구분한다. 권한 밖 필수 참조를 일부 숨긴 불완전한 예제를 주입하지 않는다"
    postcondition: "지식의 전체 직접 저장·HIST와 실행 당시 정확 외부 자산 참조는 구분된다."
    rules_from:
      - "REQ-303.detail"
      - "REQ-303.example_catalog_mapping"
      - "REQ-303.tool_usage_mapping"
      - "REQ-303.custom_tool_mapping"
      - "REQ-303.result_guidance"
      - "REQ-303.query_constraint_boundary"
      - "REQ-303.reference_mapping"
    pending:
      - "@defer P3 — 본문/매핑 역할 검수의 입력·자동 탐지와 사람 검수, 참조 합산·매핑별 설명/원천 가이드·충돌 표시를 데이터/API/화면·시험으로 설계한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-011
    name: "공통 태그·동의어와 지식 ID 매핑을 소유 권한으로 직접 저장한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-607"
    actors:
      primary: "ACT-003"
      secondary: []
    process_step: "PRC-09-05"
    precondition: "태그 정의의 작성/변경 권한이 있고 해당 태그와 조회 가능한 연결 지식의 근거를 확인할 수 있다"
    trigger: "공통 태그를 등록하거나 검색 텍스트·동의어를 변경한다"
    main_flow:
      - "현재 태그 안정 ID·검색 텍스트/동의어·기대 버전과 소유 변경 권한을 확인한다."
      - "태그 전체 정의를 현재 권한·기대 버전·기술 참조 검증으로 직접 저장하고 전후 전체 이력을 남긴다."
      - "지식의 태그 ID 매핑은 지식 소유 전체 직접 저장으로 관리하고 태그 텍스트 변경 때문에 지식 본문/매핑/리비전을 바꾸지 않는다."
      - "사용처의 안정 ID/연결 경로·현재 참조 여부만 현재 권한 안에서 조회하고 본문 수집·영향 판정/보완 작업은 하지 않는다."
    alternative_flows:
      - id: "A1"
        condition: "태그/지식 독립 변경"
        flow:
          - "실제 변경 대상의 현재 권한/기대 버전과 연결 ID 유효성만 검증하고 외부 리비전 상승만으로 상대 저장을 차단/동기화하지 않는다."
    exception_flows:
      - id: "E1"
        condition: "권한 없음·낡은 기준본·연결 ID 부재/무효·이력 실패"
        flow:
          - "현재 적용본/이력을 유지하고 실제 오류를 안내한다."
    postcondition: "태그 자체 변경과 지식 매핑 변경의 대상·이력이 구분되며 운영 검색은 유효 태그 정의와 현재 지식 접근 통제를 따른다"
    rules_from:
      - "REQ-607"
      - "REQ-601.direct_management"
      - "REQ-306.version_guard"
    pending:
      - "@defer P3 — SCR-010의 독립 메뉴·별도 편집 권한 결정을 적용해 지식 편집의 참조/이동을 연결한다. 버전·관계 스냅샷·검색 색인·턴 내 태그 버전 계약은 화면/데이터 상세 설계에서 정한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-012
    name: "자산 전체 변경을 기술 검증하고 직접 일괄 반영한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-305"
      - "REQ-306"
    actors:
      primary: "ACT-003"
      secondary: []
    process_step: "PRC-09-05"
    precondition: "실제 변경 대상 전체의 현재 변경 권한·기대 버전·입력/기술 근거가 있다."
    trigger: "자산 전체 구성을 저장한다."
    main_flow:
      - "실제 변경 대상과 소유 전체 구성·안정 참조·기대 버전·사유/명령키를 확인한다."
      - "UC-003의 서버 기술 검증·현재 권한/기준본·참조 검사와 전체 직접 저장을 수행한다."
      - "현재값·결과 리비전·전체 HIST·원 명령 성공 결과를 같은 저장 단위로 원자 확정한다."
      - "UC-006에서 실제 적용/실패·원 결과·변경 전후 근거를 확인한다."
    alternative_flows:
      - id: "A1"
        condition: "단독/명시 복합 변경"
        flow:
          - "실제 함께 고치는 대상만 원자 단위에 포함하고 참조/사용처 조회만 하는 외부 자산은 선점하지 않는다."
    exception_flows:
      - id: "E1"
        condition: "권한·기대 버전·기술 참조 오류 또는 전체 이력 실패"
        flow:
          - "전체 변경을 거부/롤백하고 현재값·이력을 유지한다."
      - id: "E2"
        condition: "결과 불명/재전송"
        flow:
          - "원 명령키로 원 결과를 확인하고 중복 반영하지 않는다."
    postcondition: "전체 변경과 이력은 한 번에 성공/실패한다. 관리자 요청/승인/전결과 지식 영향 검토 원장은 없다."
    rules_from:
      - "REQ-305"
      - "REQ-306"
      - "REQ-601.management_storage"
    pending:
      - "@defer P3 — 직접 저장 전체 단위·현재 권한·기대 버전·참조 기술 검증·HIST·멱등/복구 계약을 상세 설계한다."
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
