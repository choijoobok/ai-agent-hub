# 영역: 지식·공통 태그·자산 변경 요청·예방적 검토. 업무 규칙의 정본은 rules_from이다.
usecases:
  - id: UC-010
    name: "지식 본문과 독립 참조·도구별 사용 설명을 후보로 작성한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-303
    actors:
      primary: ACT-003
      secondary: []
    process_step: "PRC-09-02"
    precondition: "지식 작성 권한과 업무 근거가 있고 매핑 대상의 현재 존재·연결 가능 상태·권한을 확인할 수 있다. 외부 리비전을 지식의 운영 매핑에 고정하지 않는다"
    trigger: "지식을 신규 작성하거나 본문·접근 그룹·태그 ID·참조 링크·매핑별 설명을 변경한다"
    main_flow:
      - "업무 의미·일반 절차를 본문에 작성하고 접근 그룹을 지정한다. 물리명·SQL은 카탈로그·인증 예제, 특정 도구의 호출 안내는 해당 매핑 설명으로 구분한다"
      - "인증 예제와 직접 카탈로그를 각각 안정 ID로 0개 이상 독립 선택한다. 관리에서는 매핑 ID·표시명·직접/예제 경유 경로를 확인하고 예제 상세/참조 버전을 지식 소유 후보로 복사하지 않는다"
      - "태그 ID와 업무 API·커스텀 도구를 각각 연결하고 도구 매핑마다 용도·사용 조건·입력 확보·결과 안내·질문/선택별 후속 절차를 작성한다"
      - "매핑별 사용 설명의 필수값·역할 구분과 연결 대상의 현재 존재·연결 가능 상태·권한을 확인한다. 지식 승인에서 외부 자산 상세를 심사하지 않으며 그 상세의 변경 영향은 해당 자산 승인에서 검토한다"
      - "지식 자신의 기준 리비전·본문·그룹·연결 식별자·매핑 설명·당시 표시 근거만 전체 후보로 보존한다. 검수가 끝난 변경은 UC-012로 인계하며 외부 자산의 리비전 고정/자동 동기화를 요구하지 않는다"
      - "UC-006에서 실제 반영을 확인한다. 승인된 연결도 현재 접근 권한·활성·검증 조건을 통과한 경우에만 후보 구성과 주입에 사용한다"
    alternative_flows:
      - id: "A1"
        condition: "특정 데이터 객체나 도구가 없는 일반 업무 지식"
        flow:
          - "예제·카탈로그·도구 연결을 강제하지 않는다. 지식 접근 그룹과 본문 검수는 유지한다"
      - id: "A2"
        condition: "여러 데이터소스·스키마의 카탈로그를 연결"
        flow:
          - "참조에서 소속을 얻고 지식에 별도 데이터소스/스키마 목록을 중복 저장하지 않는다. 합산을 권한 확대나 데이터소스 간 SQL 조인 허용으로 해석하지 않는다"
      - id: "A3"
        condition: "예제 또는 도구 연결을 해제"
        flow:
          - "승인·반영된 새 후보부터 해당 경로/매핑 설명을 제외한다. 다른 직접·예제 경로와 자산 자체는 유지한다"
      - id: "A4"
        condition: "매핑 설명만 변경하거나 과거 상태를 복원"
        flow:
          - "새 지식 후보의 전체 스냅샷으로 처리한다. 과거 승인·실행 근거를 현재 값으로 치환하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "본문에 물리명·SQL·특정 도구 호출 안내를 중복 작성"
        flow:
          - "해당 원천·매핑 편집으로 안내하고 검수 전 유효 반영하지 않는다. 자동 탐지만으로 완전 검수를 가정하지 않는다"
      - id: "E2"
        condition: "지식 자기 기준본 충돌·연결 ID 부재/사용 불가·현재 권한 부족 또는 매핑 설명 필수값 누락"
        flow:
          - "유효 반영을 차단하고 실제 오류를 안내한다. 연결 자산의 정상 리비전 상승만을 이 실패로 처리하거나 외부 상세 재심사·리비전 동기화를 요구하지 않는다. SQL/API 기술 검증은 해당 자산/실행에서 유지한다"
      - id: "E3"
        condition: "접근 그룹 없음 또는 현재 권한/필수 참조 판정 실패"
        flow:
          - "REQ-303.example_catalog_mapping.security에 따라 지식·직접 참조·예제의 사용 가능성을 구분한다. 권한 밖 필수 참조를 일부 숨긴 불완전한 예제를 주입하지 않는다"
    postcondition: "지식 본문·그룹·안정 ID 매핑/사용 설명·당시 표시 근거가 지식 소유 후보에 보존되고 UC-012로 인계된다. 과거 실행에서 실제 선택한 외부 자산 리비전·직접/간접 경로는 실행 기록으로 따로 재현한다"
    rules_from:
      - "REQ-303.detail"
      - "REQ-303.example_catalog_mapping"
      - "REQ-303.tool_usage_mapping"
      - "REQ-303.custom_tool_mapping"
      - "REQ-303.result_guidance"
      - "REQ-303.query_constraint_boundary"
      - "REQ-303.reference_mapping"
    pending:
      - "@defer P3 — 본문/매핑 역할 검수의 입력·자동 탐지와 사람 검수, 참조 합산·매핑별 설명/원천 가이드·충돌 표시를 데이터/API/화면·시험으로 설계한다"
    storage_context: "REQ-601.management_storage. 관리 조회/변경 입력은 현재 적용본, 초안 편집/제출/검토/반려는 소유 자산의 전용 변경 요청 문맥, 과거 적용본은 별도 HIST 문맥이다. 후보는 _SNP의 전체 요청 내용이며 업무 REVISION 증가는 실제 반영 성공 때만 발생한다."
    request_navigation: "통합 요청 목록 SCR-036에서 원 자산의 request_view로 이동한다. 작성/검토/승인·반려와 _SNP 상세는 전용 화면, 복합 세트 판정은 REQ-601.management_storage.request_views의 요청 전체 단위를 따른다."

  - id: UC-011
    name: "공통 태그·동의어 후보와 연결 지식의 영향 차이를 확인한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-607]
    actors: { primary: ACT-003, secondary: [] }
    process_step: PRC-09-05
    precondition: "태그 정의의 작성/변경 권한이 있고 해당 태그와 조회 가능한 연결 지식의 근거를 확인할 수 있다"
    trigger: "공통 태그를 등록하거나 검색 텍스트·동의어를 변경한다"
    main_flow:
      - "검색 텍스트와 별개의 고정 태그 ID를 확인하고 태그 정의·현재 운영 버전의 변경 후보를 작성한다"
      - "연결 지식 ID·당시 리비전·태그 ID 매핑을 영향 확인 근거로 조회한다. 단순 영향 조회 대상을 실제 변경 세트에 넣지 않는다"
      - "변경 전후 태그와 당시 연결 근거를 후보/요청 스냅샷으로 보존해 UC-012로 인계한다. 요청 접수/전결은 태그 종류의 승인 설정과 UC-003을 따른다"
      - "검토·승인 시 요청 당시와 현재 연결 지식의 추가·제거·리비전 차이를 확인하고 원 요청과 별도의 승인 근거를 남긴다"
      - "유효 반영 시 태그 정의만 바꾸고 기존 지식 리비전·태그 ID 매핑을 유지한다. UC-006에서 당시 표현·목록과 실제 반영을 확인한다"
    alternative_flows:
      - { id: A1, condition: "지식에 연결할 태그 ID를 추가·제거·교체", flow: ["태그 정의 변경 대신 UC-010의 지식 후보로 작성한다. 같은 세트에서 둘 다 수정하면 실제 변경한 태그·지식 각각을 검사한다"] }
      - { id: A2, condition: "태그 요청 대기 중 연결 지식이 바뀜 또는 지식 요청 대기 중 태그 텍스트가 바뀜", flow: ["참조/영향 차이만으로 서로의 변경을 잠그거나 자동 반려하지 않는다. 실제 변경 대상의 기준 버전과 태그 ID의 연결 가능 상태는 검증한다"] }
    exception_flows:
      - { id: E1, condition: "같은 실제 변경 대상에 미종결 요청이 있거나 기준 버전이 다름", flow: ["UC-003의 중복·기준본 검사로 차단하고 기존 요청·유효 상태를 유지한다"] }
      - { id: E2, condition: "신규 연결할 태그 ID가 없거나 연결 불가", flow: ["해당 지식 매핑 반영을 막는다. 텍스트만 달라진 경우와 구분한다"] }
      - { id: E3, condition: "태그 요청 반려·반영 실패 또는 영향 근거 열람 권한 부족", flow: ["기존 태그 정의와 별도로 승인·반영된 지식 변경을 유지한다. 근거 연결을 통해 권한 밖 지식이나 과거 본문을 노출하지 않는다"] }
    postcondition: "태그 자체 변경과 지식 매핑 변경의 대상·이력이 구분되며 운영 검색은 유효 태그 정의와 현재 지식 접근 통제를 따른다"
    rules_from: ["REQ-607.business_rules", "REQ-607.data", "REQ-607.exceptions", "REQ-601.request_integrity", "REQ-306.version_guard"]
    pending:
      - "@defer P3 — SCR-010의 독립 메뉴·별도 편집 권한 결정을 적용해 지식 편집의 참조/이동을 연결한다. 버전·관계 스냅샷·검색 색인·턴 내 태그 버전 계약은 화면/데이터 상세 설계에서 정한다"
    request_navigation: "통합 요청 목록 SCR-036에서 원 자산의 request_view로 이동한다. 작성/검토/승인·반려와 _SNP 상세는 전용 화면, 복합 세트 판정은 REQ-601.management_storage.request_views의 요청 전체 단위를 따른다."

  - id: UC-012
    name: "자산 변경 세트를 제출하고 기술 검토·최종 판정·일괄 반영한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - REQ-305
      - REQ-306
    actors:
      primary: ACT-003
      secondary:
        - ACT-013
    process_step: "PRC-09-05"
    precondition: "자산 변경의 전체 후보·영향·사유와 필요한 외부 시험/감수 근거가 있고 해당 작업의 현재 유효 권한을 확인할 수 있다"
    trigger: "단독 또는 복합 자산 후보를 운영에 반영하려 한다"
    main_flow:
      - "지식·예제·카탈로그·태그·업무 API·도구 중 실제 변경 대상을 구성하고 내용·접근 그룹·참조 매핑·설명·기준본을 후보에 포함한다"
      - "조사·예방적 검토 또는 일반 변경 근거를 연결한다. 지식은 소유 본문·매핑/설명만 심사하고 외부 자산 상세를 포함하지 않는다. 다른 자산의 승인에서는 연결 지식 목록·본문·매핑 설명과 보완 필요 여부를 REQ-306.knowledge_impact로 확인하고 근거·별도 지식 요청 연결을 남긴다"
      - "UC-003으로 미종결 요청·전체 제출본·현재 승인 설정을 판정한다. 수동 승인 요청이면 제출본을 고정하고 전결이면 같은 검증·스냅샷·일괄 반영 계약을 적용한다"
      - "수동 승인 경로에서는 PRC-09-07의 기술 검토 권한자가 내용·매핑·접근 범위·시험 근거를 검토하고 완료 또는 사유 있는 반려를 기록한다"
      - "기술 검토 완료 건만 PRC-09-06의 최종 승인 권한자가 업무 영향·반영 범위를 판정한다. 각 단계의 현재 권한이 있으면 동일인이 순서대로 처리할 수 있다"
      - "최종 승인 또는 전결 반영 시 실제 변경 대상의 자기 기준본·고정 후보·필수 참조 유효성/기술 계약·등록 유일성을 검증해 세트 전체를 반영한다. 지식이 연결한 외부 자산의 리비전 상승이나 영향 지식 목록/본문 변화만으로 자동 반려하지 않는다"
      - "UC-006의 결과 리비전·시각·범위를 원 조사/검토에 연결한다. 필요한 변경의 실제 반영과 원 문제 해결 확인에 따라 각 작업의 완료를 별도로 판단한다"
    alternative_flows:
      - id: "A1"
        condition: "지식 변경 없이 예제·카탈로그·태그·API·도구만 변경"
        flow:
          - "단독 변경도 동일한 세트 경로를 사용한다. 의미 없는 지식 후보나 조사·검토 작업을 만들지 않는다"
      - id: "A2"
        condition: "승인 설정이 미사용 또는 실제 변경 종류별로 혼합됨"
        flow:
          - "UC-003·REQ-601의 전결/혼합 세트 판정을 사용한다. 수행하지 않은 사람의 기술 검토·최종 승인을 기록하지 않는다"
      - id: "A3"
        condition: "검토·승인 반려 또는 제출 내용 변경 필요"
        flow:
          - "미반영 종결·취소와 새 요청은 UC-005를 따른다. 이전 요청·근거를 보존하고 UC-003에서 현재 승인 설정으로 새 처리 방식을 판정한다. 수동 승인 경로이면 기술 검토부터 다시 수행하며 전결 경로에서도 전체 검증·스냅샷·반영 계약을 유지한다"
      - id: "A4"
        condition: "지식의 매핑 대상 리비전 또는 자산 승인에서 확인하는 연결 지식 목록/본문이 변경됨"
        flow:
          - "각자의 독립 요청·승인·반영을 허용한다. 지식 매핑을 동기화하거나 리비전 상승만으로 요청을 반려하지 않는다. 자산 승인에서는 현재 연결 지식 차이를 확인하고 보완 필요 여부·근거를 남긴다"
    exception_flows:
      - id: "E1"
        condition: "후보·사유·필요 증빙 누락, 기준본 충돌 또는 한 대상의 미종결 요청 중복"
        flow:
          - "전체 접수를 거부하고 기존 운영본·요청을 유지한다. 세트 일부만 별도 접수하지 않는다"
      - id: "E2"
        condition: "현재 권한 부족 또는 기술 검토 미완료"
        flow:
