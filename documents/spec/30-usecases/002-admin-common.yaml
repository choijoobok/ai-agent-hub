# 영역: admin 공통 관리·승인 흐름
usecases:
  - id: UC-001
    name: "관리 대상의 원천·변경 영향·처리 경로를 확인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary: []
    process_step: "PRC-13-01"
    precondition: "해당 관리 대상의 조회 권한이 있다. 변경은 별도 메뉴·액션의 현재 유효 권한으로 판정한다"
    trigger: "기준정보를 등록·수정·비활성화·삭제하거나 변경 이력을 확인하려 한다"
    main_flow:
      - "대상의 안정 식별자·관리 원천·현재 값/버전·사용 상태를 확인한다."
      - "소유 편집 속성과 외부 읽기 전용 속성을 구분하고 현재 변경 권한과 참조/사용처를 확인한다."
      - "단일 직접 변경은 UC-002, 전체 자산 구성은 UC-003으로 저장하고 결과/이력은 UC-006으로 확인한다."
    alternative_flows:
      - id: "A1"
        condition: "신규 등록"
        flow:
          - "관리 식별자와 신규 후보를 구분한다. 변경 전 유효본은 없음으로 표시한다"
      - id: "A2"
        condition: "system 또는 외부 원천이 소유하는 속성"
        flow:
          - "기존 공개 계약과 소유 관리 경로를 안내한다. admin에 관리 원천을 복제하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "참조 조회 실패 또는 조회 권한 부족"
        flow:
          - "참조 없음으로 표시하지 않는다. 제한 사유를 안내하고 확인되지 않은 참조를 근거로 삭제·변경하지 않는다"
      - id: "E2"
        condition: "대상별 제약을 깨뜨리는 삭제·비활성화"
        flow:
          - "현재 값을 유지하고 권한 범위 안에서 영향을 받는 사용처와 보완 대상을 안내한다"
    postcondition: "관리 원천·변경 대상·조회 가능한 영향과 후속 처리 경로가 구분된다. 조회만으로 현재 값이나 요청 상태는 바뀌지 않는다"
    rules_from:
      - "REQ-601.data"
      - "REQ-601.field_usage"
      - "REQ-601.business_rules"
      - "REQ-601.permissions"
    pending:
      - "@defer P3 — 대상별 참조 조회 계약·삭제 후 과거 참조 표시·권한별 공개 필드는 각 기능의 데이터/API/화면 설계에서 확정한다"
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-002
    name: "직접 관리 대상의 변경을 검증하고 반영한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary: []
    process_step: "PRC-13-02"
    precondition: "admin 소유 관리 대상의 현재 변경 권한과 편집 기준 버전이 있다."
    ownership_boundary: "아래 변경 전 이력·현재값의 동시 저장은 REQ-601이 적용되는 admin 소유 기준정보 변경의 계약이다. 기존 system 기능에 새 이력 원장이나 기대 버전 방식을 일괄 강제하지 않는다. system 소유 작업은 해당 공개 계약을 사용하며, 설정은 ARCH-029의 현행 무수정 재사용 경계를 따르고 계정은 CR-028·ARCH-050의 별도 계약을 따른다"
    trigger: "직접 관리 항목의 변경을 저장한다"
    main_flow:
      - "변경 대상·작업 종류·사유·편집 기준 버전과 변경 내용을 전달한다"
      - "서버가 현재 권한과 대상별 입력·참조·사용 상태·기준 버전을 다시 검증한다"
      - "신규는 현재 데이터로 등록하고, 수정·비활성화·허용된 삭제는 대상별 이력 계약에 따라 변경 전 최종 상태를 보존한다"
      - "admin 소유 기준정보는 이력과 현재 데이터 갱신을 함께 성공시키고 실제 적용 결과·버전·시각을 반환한다. system 소유 작업은 아래 A1의 해당 공개 계약으로 결과를 확인한다"
      - "UC-006에서 현재 유효 상태와 변경 근거를 확인한다"
    alternative_flows:
      - id: "A1"
        condition: "원천이 기존 system 관리 기능"
        flow:
          - "해당 소유 공개 서비스의 권한·경합·결과·이력 계약을 사용한다. 일반 사용 이력을 admin 변경 전 전체 스냅샷으로 간주하지 않고 기존 기록을 새 공통 테이블에 복제하지 않는다"
          - "승인된 목표와 현재 구현의 차이는 ARCH-029·050에서 확인한다. 현재 구현만으로 목표 계약 검증 완료를 선언하지 않는다"
      - id: "A2"
        condition: "그룹 추가/중지 또는 자산 매핑 변경"
        flow:
          - "각 원 소유의 전체 구성·현재 권한·기대 버전/최소 그룹 조건과 전체 이력을 같은 직접 저장 단위로 처리한다."
    exception_flows:
      - id: "E1"
        condition: "참조·기준 버전·현재 권한 검증 실패"
        flow:
          - "변경하지 않고 현재 상태와 다시 확인할 항목을 반환한다"
      - id: "E2"
        condition: "admin 소유 기준정보의 이력 저장 또는 현재 값 갱신 실패"
        flow:
          - "해당 변경의 부분 반영을 남기지 않는다. 성공으로 표시하지 않고 처리 결과를 확인한다. system 소유 작업의 실패 판정·재처리는 그 공개 계약을 따른다"
    postcondition: "검증된 직접 변경과 전체 변경 이력이 원자 반영된다. 관리자 승인/전결 기록을 만들지 않는다."
    rules_from:
      - "REQ-601.direct_management"
      - "REQ-601.management_storage"
      - "REQ-601.audit"
    pending:
      - "@defer P3 — 이력 저장 구조·기준 버전·동시 변경 제어와 대상별 소유 공개 서비스는 데이터/API 설계에서 확정한다. 고객사 이력 보존 기간을 임의로 정하지 않는다"
  - id: UC-003
    name: "자산 전체 변경 구성을 검증하고 직접 저장한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary:
        - "ACT-001"
    process_step: "PRC-13-02"
    precondition: "실제 변경 대상 전부의 현재 변경 권한·전체 편집 구성·기대 버전이 있다."
    trigger: "자산 본문·계약·그룹·참조 매핑·활성/삭제 등의 전체 변경을 저장한다."
    main_flow:
      - "안정 대상·전체 전후 구성·변경 사유·원 명령키와 기준 버전을 확인한다."
      - "서버가 실제 변경 대상 전체의 현재 권한·기대 버전·신규 유일성·참조/SQL/API 기술 계약을 같은 잠금 경계에서 검증한다."
      - "본 데이터·전체 자식·결과 리비전·HIST 세트·행위자/시각·성공 결과를 원자 반영한다."
      - "운영 현재값과 실제 반영 결과를 구분해 반환하고 UC-006에서 이력을 확인한다."
    alternative_flows:
      - id: "A1"
        condition: "과거 구성 복원"
        flow:
          - "과거 이력은 보존하고 현재 적용본/권한으로 새 직접 변경을 저장한다."
      - id: "A2"
        condition: "참조만 하는 외부 자산 변경"
        flow:
          - "안정 ID 존재/연결 유효성과 기술 계약만 검사한다. 외부 리비전 상승만으로 지식 매핑을 자동 변경하거나 업무 의미 보완을 강제하지 않는다."
    exception_flows:
      - id: "E1"
        condition: "현재 권한·기대 버전·필수 참조/기술 계약 오류"
        flow:
          - "현재값/이력을 변경하지 않고 입력과 충돌 근거를 유지한다."
      - id: "E2"
        condition: "전체 이력 저장 또는 일부 자식 반영 실패"
        flow:
          - "같은 저장 단위 전체를 롤백한다. 결과 불명은 원 명령키로 확인한다."
    postcondition: "검증된 전체 구성과 변경 전후 이력이 같은 성공 단위로 반영된다. 관리자 요청/승인·전결 원장은 없다."
    rules_from:
      - "REQ-601.direct_management"
      - "REQ-601.management_storage"
      - "REQ-305"
      - "REQ-306"
    pending:
      - "@defer P3 — 전체 소유 구성·잠금/기대 버전·현재 권한·기술 계약·HIST와 원 명령 결과의 원자성/복구를 설계한다."
    storage_context: "REQ-601.management_storage. 현재 적용본을 기준으로 전체 편집본을 직접 저장하고 현재값·마스터 리비전·전체 HIST 세트·성공 결과를 원자 확정한다. 별도 관리자 요청 원장/SNP/승인 상태는 만들지 않는다."
  - id: UC-004
    name: "Portal 사용자의 신청을 관리자가 승인·반려한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-117"
      - "REQ-119"
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary:
        - "ACT-001"
    process_step: "PRC-13-02"
    precondition: "Portal 사용자가 접수한 유효 신청이 있고 현재 처리 권한이 있다."
    trigger: "Portal의 쿼터 승급 또는 추가 토큰 신청을 처리한다."
    main_flow:
      - "원 신청 ID/버전·신청자/시각·희망 등급 또는 신청량·사유와 현재 상태를 조회한다."
      - "현재 처리 권한·선행 상태·업무별 유효성·취소/만료/재전송을 검증한다."
      - "쿼터 승급은 미래 효력 월/예약을, 추가 토큰은 신청량 이하 실제 승인량/사유를 원 신청과 별도 결과로 확정한다."
      - "신청 결과·실제 효력·행위자/시각·알림을 남기고 UC-006에서 확인한다."
    domain_paths:
      - kind: "쿼터 등급 승급"
        owner: FEAT-037
        screen: SCR-035
        rules_from:
          - "REQ-117"
          - "REQ-116"
        flow: "Portal의 희망 등급/사유를 현재 처리 권한자가 승인/반려하고 실제 미래 적용 월/예약을 기록한다."
      - kind: "이번 달 추가 토큰"
        owner: FEAT-018
        screen: SCR-022
        rules_from:
          - "REQ-119"
        flow: "신청량 이하 실제 승인량과 일반/예외 근거를 기록해 당월에 한 번 반영한다. 월말 만료와 결과 알림을 유지한다."
    alternative_flows:
      - id: "A1"
        condition: "반려 또는 취소 후 재신청"
        flow:
          - "원 신청·판정 근거는 보존하고 현재 허용 조건으로 새 신청을 받는다."
    exception_flows:
      - id: "E1"
        condition: "권한 회수·신청 버전/선행 상태 불일치"
        flow:
          - "판정/반영을 거부한다. 늦은 승인으로 취소/만료 신청을 부활시키지 않는다."
      - id: "E2"
        condition: "승인/취소·만료 경합·중복 전송 또는 반영 결과 불명"
        flow:
          - "허용된 한 상태만 확정하고 중복 지급/예약하지 않는다. 원 신청/명령으로 결과를 확인한다."
    postcondition: "Portal 원 신청과 관리자 처리 근거·실제 효력이 보존된다. 관리자 간 요청/설정 전결을 수행하지 않는다."
    rules_from:
      - "REQ-601.request_integrity"
      - "REQ-117"
      - "REQ-119"
    pending:
      - "@defer P3 — Portal 신청의 현재 권한·상태/버전·월 경계·멱등 결과·반영/알림 원자성과 복구를 설계한다."
    storage_context: "Portal 원 신청·판정/실제 효과 기록은 소유 업무 계약을 따른다. 자산 관리 SNP/승인 원장을 재사용하지 않는다."
  - id: UC-005
    name: "Portal 사용자의 미반영 신청을 종결하고 새로 신청한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-117"
      - "REQ-119"
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary:
        - "ACT-001"
    process_step: "PRC-13-02"
    precondition: "Portal 사용자의 신청 내용 변경이 필요하고 현재 취소/재신청 조건을 만족한다."
    trigger: "Portal 신청자가 제출 내용을 바꾸거나 반려 후 다시 신청한다."
    main_flow:
      - "현재 신청 ID/버전·상태·실제 반영 여부를 확인한다."
      - "허용 상태에서 취소하거나 미반영 종결을 확인한다. 원 제출본/사유는 편집하지 않는다."
      - "이전 신청과 처리 근거를 보존하고 새 ID/원 제출본·사유로 신청한다."
      - "현재 정책·중복 제한을 다시 검사하고 UC-004의 관리자 승인 경로로 보낸다."
    alternative_flows:
      - id: "A1"
        condition: "이미 실제 반영된 결과를 변경하려 함"
        flow:
          - "완료 신청을 취소/재지급하지 않고 해당 소유 업무의 새 변경 조건을 검사한다."
    exception_flows:
      - id: "E1"
        condition: "반영 중·결과 불명"
        flow:
          - "원 신청/명령 결과를 확인할 때까지 임의 취소로 제한을 풀지 않는다."
      - id: "E2"
        condition: "취소/승인 경합·과거 신청의 늦은 승인"
        flow:
          - "유효하게 확정된 현재 상태를 지키고 중복 지급/예약을 거부한다."
    postcondition: "이전 신청 근거는 불변이고 새 신청만 독립된 관리자 판정 대상이다."
    rules_from:
      - "REQ-601.request_integrity.change_and_resubmit"
      - "REQ-601.request_integrity.decision_binding"
    storage_context: "Portal 소유 신청 원문과 처리 이력. 관리자 자산/권한 변경은 이 재신청 흐름을 사용하지 않는다."
  - id: UC-006
    name: "관리 변경의 처리 결과·실제 효력·이력을 확인한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-601"
    actors:
      primary:
        - "ACT-002"
        - "ACT-003"
        - "ACT-004"
      secondary:
        - "ACT-001"
        - "ACT-005"
    process_step: "PRC-13-03"
