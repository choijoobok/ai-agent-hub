      - "id": "A2"
        "condition": "총 풀을 넘는 예외 승인"
        "flow":
          - "총 풀을 절대 차단선으로 바꾸지 않는다. 정해진 권한과 업무 근거를 확인하고 예외 승인 내역을 분리한다"
    "exception_flows":
