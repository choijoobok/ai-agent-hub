  - id: UC-042
    name: 월말에 다음 달 쿼터 기준을 준비하고 최종 배분한다
    workstream: admin
    design_status: draft
    reqs:
      - REQ-118
      - REQ-116
      - REQ-606
    actors:
      primary: ACT-004
      secondary: []
    process_step: PRC-12-01
    precondition: 등록된 업무 배치 실행 권한과 대상 월 마감/원 작업 문맥을 유지한다
    trigger: 월말 스케줄이 다음 달 대상의 최종 배분을 호출한다
    main_flow:
      - 대상 월 M월 시작 경계의 최신 저장/승인 효력 스냅샷과 원 작업을 확인한다
      - 저장된 유효 M월 금융기준이 있으면 그 설정값을 사용한다. 부재가 확인되면 바로 직전 월 유효 금융기준을 그대로 새 M월 행에 복사한다
      - M월 효력 사용자/유효 등급과 M월 이하 최신 시작월 등급 기준·가중치를 검증한다
      - 스냅샷과 금융 원 월/대상 월 기준 출처를 남기고 기준 생성이 필요한 경우 그 생성과 전체 최종 배분을 함께 성공시킨다
      - 같은 M월 최종 효과를 한 번만 적용하고 대상 월 시작 뒤 수동 전체 재생성을 잠근다
    alternative_flows:
      - id: A1
        condition: 활성0명
        flow:
          - 월 기준/배치 준비 성공과 개인 기준 미산정을 구분하고 최초 활성 자동 개별 산정은 REQ-116을 따른다
      - id: A2
        condition: 원 작업 실패 재처리
        flow:
          - 고정한 같은 마감 스냅샷으로 원 결과를 확인/복구하고 새 현재값으로 소급 재집계하지 않는다
    exception_flows:
      - id: E1
        condition: 조회 실패/잘못된 기존값·유효 원 금융/등급 기준/대응 부재
        flow:
          - 없음/0/최저등급으로 대체하지 않고 배분 불가·원 사유를 기록한다
      - id: E2
        condition: 동시 수동 예정 생성/월 변경·중복 호출·결과 불명
        flow:
          - 기준본/월 마감과 원 작업을 검사하고 부분 결과/중복 최종 배분을 막는다
    postcondition: 월 기준과 다음 달 효력 사용자/등급에 따른 유효 최종 배분 한 세트가 적용되거나 원 사유와 함께 일괄 실패한다
    rules_from:
      - REQ-118.business_rules
      - REQ-116.business_rules
      - REQ-116.empty_population
      - REQ-606.business_rules
    pending:
      - '@defer 전체 화면 합의 후 — 스케줄 시각/마감 스냅샷·일관 읽기/권한·중복 방지/원 작업 복구·물리/API 상세와 실제 계약 검증'
