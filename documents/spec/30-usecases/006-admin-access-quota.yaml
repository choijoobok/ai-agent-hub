    "main_flow":
      - "희망 등급·사유·현재 등급과 고정 제출본, 사용자당 미종결 요청을 확인한다"
      - "UC-004의 현재 처리 권한으로 판정하고 처리 결과·사유를 기록한다"
      - "승인 시점과 대상 월 시작 마감으로 미래 효력 월을 정한다. 첫 수동 예정 배분 앞뒤로 적용 월을 미루지 않고 월말 배치가 다음 달 승인 효력 등급을 사용한다"
      - "적용 예약을 확정하고 완료 결과·이력·기존 알림 계약으로 안내한다. 예약 완료를 발효일까지 미반영 상태로 두지 않는다"
    "alternative_flows":
      - "id": "A1"
        "condition": "요청이 월을 넘김"
        "flow":
          - "사용자당 미종결 1건을 유지한다. 당월 추가 토큰 신청처럼 월말 자동 만료시키지 않는다"
      - "id": "A2"
        "condition": "당월 토큰 부족·희망 내용 변경"
        "flow":
          - "당월 부족은 UC-029, 제출본 변경은 UC-005의 취소 후 새 요청으로 연결한다"
