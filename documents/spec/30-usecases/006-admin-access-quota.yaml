      - "id": "E2"
        "condition": "사용량이 한도 초과 또는 과거 월 요청"
        "flow":
          - "실제 사용량을 삭제/축소하거나 과거 한도를 소급 변경하지 않는다. 새 시작/호출 재검사는 NFR-012의 원래 집행 계약에 맡긴다"
    "postcondition": "당월 유효 한도·실제 사용량·일반/예외 승인 근거가 구분되며 동일 신청은 한 번만 반영된다"
    "rules_from":
