    "precondition": "당월 확정 기본 한도가 있는 이용자의 신청과 현재 처리 권한이 있다"
    "trigger": "Portal 당월 추가 토큰 신청의 승인/반려 또는 월말 만료를 처리한다."
    "main_flow":
      - "사용자·대상 월·신청량·업무 사유·고정 제출본과 미종결 중복 여부를 확인한다"
      - "일반 배정·미배정 계획량·실제 사용·예외 승인 현황을 구분해 확인한다"
      - "UC-004로 신청량 이하의 승인량 또는 반려를 판정한다. 전결은 검증된 신청량을 승인량으로 기록한다"
      - "승인량을 당월 한도에 한 번만 반영하고 승인자·양·시각·사유와 결과 알림을 남긴다"
      - "월말에는 승인분과 미처리 요청을 각각 만료 처리하며 다음 달로 이월하지 않는다"
    "alternative_flows":
