    trigger: 등급 추가/통합·이름·가중치 변경을 다음 적용 월부터 반영한다
    main_flow:
      - 기준 시작월을 선택하거나 직전 기준 전체를 새 미래 기준으로 복사한다
      - 메모·등급/순위·상대 가중치·제거 시 이전 대상과 미래 영향 구간을 확인한다
      - 현재 권한·자기 기준본·전체 참조/가중치를 검증하고 한 기준 전체를 저장한다
      - 월별 화면은 대상 월 이하 최신 시작월의 기준을 읽고 월말 배치가 다음 달 효력 사용자/등급으로 배분한다
      - 현재/과거 적용본과 변경 이력을 보존하고 미래 변경으로 예정본이 낡으면 표시한다
    alternative_flows:
      - id: A1
        condition: 변경 없는 달
