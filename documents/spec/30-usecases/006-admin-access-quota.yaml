# 영역: admin Portal 이용자·접근 권한·월별 쿼터
usecases:
  - id: UC-023
    name: "별도 Portal 계정을 등록하고 이용을 활성화한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-616]
    actors: { primary: [ACT-002, ACT-004], secondary: [] }
    process_step: PRC-13-01
    precondition: "Portal 이용자 관리 권한과 계정 원천·본인 식별 근거가 있다"
    trigger: "신규 Portal 계정을 등록하거나 기존 Portal 계정을 재활성화한다"
    main_flow:
      - "Portal 자체 계정 등록과 검증된 외부 신원 연결을 구분하고 Portal 원천·기존 등록 여부를 확인한다. 관리자 계정 목록은 등록 원천이 아니다"
      - "자체 계정 관리 명령은 admin Portal 계정 공개 계약으로 처리한다. 외부 원천 신원/프로필은 읽기 전용이며 portal이 별도 인증/세션으로 수락한다"
      - "Portal 프로필·활성 그룹·등급·현재 신원 매핑을 확인한다. 부여는 UC-024, 월별 배정은 UC-027의 기존 계약으로 연결한다"
      - "활성 그룹 1개 이상과 등급 등 이용 조건을 검증해 등록/활성화 결과를 기록한다. 같은 월 배정이 있으면 유지하고 없으면 신규 배정 계약으로 인계한다"
      - "Portal 계정 등록/외부 연결·활성·배정의 실제 결과와 재처리 지점을 구분해 UC-006으로 확인한다. system 관리자 계정은 변경하지 않는다"
    alternative_flows:
      - { id: A1, condition: "동일인이 관리자와 Portal 이용 자격을 함께 가짐", flow: ["관리자 계정과 다른 Portal 계정을 별도 등록하고 각각 로그인한다. 계정·비밀번호·세션·상태·권한을 자동 연결/동기화하지 않는다"] }
      - { id: A2, condition: "외부 인증 성공 또는 재활성화", flow: ["현재 Portal 등록·그룹·등급 조건을 다시 확인한다. 인증 성공만으로 이용 자격·레거시 신원을 부여하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "활성 그룹/등급 미충족 또는 원천 충돌", flow: ["이용 가능으로 표시하지 않고 필요한 승인/원천 정정을 안내한다"] }
      - { id: E2, condition: "Portal 계정 등록/외부 연결 이후 활성화·배정 일부 실패", flow: ["이미 생성된 계정·배정을 중복 생성하지 않는다. 실제 완료 상태를 확인해 미완료 절차만 재처리한다"] }
    postcondition: "Portal 계정과 해당 월 배정의 상태/이력이 연결되고 미완료 이용자는 실행할 수 없다. 관리자 계정·세션·권한은 변경되지 않는다"
    rules_from: ["REQ-616.business_rules", "REQ-616.lifecycle", "REQ-116.business_rules", "REQ-116.empty_population"]
    pending: ["@defer P3 — CR-028의 별도 Portal 원장·admin 관리/portal 인증 계약·SSO/자체 비밀번호·등록/배정 재처리·세션/삭제/보존·활성화 경합을 설계한다. 현재 구현 완료로 간주하지 않는다"]

  - "id": "UC-024"
    "name": "대상 신원과 사용자 그룹 소속을 직접 설정한다"
    "workstream": "admin"
    "design_status": "draft"
    "reqs":
      - "REQ-609"
    "actors":
      "primary": "ACT-002"
      "secondary": []
    "process_step": "PRC-13-04"
    "precondition": "Portal 사용자·대상/그룹의 현재 열람/변경 권한이 있다."
    "trigger": "데이터소스/대상 시스템 아이디를 직접 설정하거나 그룹 소속을 부여/회수한다"
    "main_flow":
      - "Portal 사용자와 데이터소스/대상 시스템 기준정보·현재 신원/그룹 소속을 확인한다."
      - "필요한 신원 아이디/활성·근거/사유와 그룹 소속 추가/재부여/중지를 각각 원 소유 전체 구성으로 편집한다."
      - "UC-002의 현재 권한·기대 버전·참조 검증 후 현재값과 전후 전체 이력을 직접 저장한다."
      - "마지막 활성 그룹 회수는 이용자 비활성화와 원자 처리하고 UC-006에서 결과/감사를 확인한다."
    "alternative_flows":
      - "id": "A1"
        "condition": "대량 등록/동기화"
        "flow":
          - "같은 현재 권한·기대 버전·감사/회수 조건을 적용하고 다른 사용자/대상 설정을 보존한다."
    "exception_flows":
      - "id": "E1"
        "condition": "현재 변경 권한·대상/아이디 근거·기준 버전 오류"
        "flow":
          - "기존 적용본을 유지하고 입력/원 명령 결과를 확인한다."
      - "id": "E2"
        "condition": "과거 승인 요청/콜백"
        "flow":
          - "읽기 전용 과거 근거로 보존하고 현재 신원/소속을 변경하지 않는다."
    "postcondition": "직접 저장된 현재 신원/그룹 소속과 감사만 유효하다. 중지/미설정·과거 미반영 요청은 접근 권한이 아니다."
    "rules_from":
      - "REQ-609.identity_management"
      - "REQ-609.business_rules"
      - "REQ-601.direct_management"
    "pending":
      - "@defer P3 — 신원/소속 직접 저장의 공개 계약·현재 권한/기대 버전·감사/회수/동기화 경합을 상세 설계한다."
  - "id": "UC-025"
    "name": "Hub 사용자 그룹의 정의와 참조를 관리한다"
    "workstream": "admin"
    "design_status": "draft"
    "reqs":
      - "REQ-605"
    "actors":
      "primary": "ACT-002"
      "secondary": []
    "process_step": "PRC-13-01"
    "precondition": "Hub 그룹 정의 관리 권한이 있다"
    "trigger": "그룹을 생성·변경·비활성화하거나 미사용 그룹을 삭제하려 한다"
    "main_flow":
      - "선택 그룹의 사용자·지식/예제·카탈로그·API·도구 다섯 탭 현재 매핑/허용 후보를 확인한다."
      - "스위치·사유를 그룹/탭별 로컬 편집본으로 유지하고 상단 그룹 정의 저장과 하단 원 소유 전체 매핑 저장을 분리한다."
      - "소속은 UC-024, 자산은 UC-003의 현재 권한·기대 버전·전체 구성·이력으로 직접 저장한다."
      - "그룹 안정 참조와 현재 결과/변경 이력은 UC-006에서 확인한다."
    "alternative_flows":
      - "id": "A1"
        "condition": "매핑 활성/중지"
        "flow":
          - "원 소유의 전체 구성·현재 권한·기대 버전·참조 보호/최소 그룹 조건을 검증하고 직접 저장한다. 다른 그룹/탭 구성은 보존한다."
    "exception_flows":
      - "id": "E1"
        "condition": "사용 중 그룹 삭제 또는 참조 조회 실패"
        "flow":
          - "사용처 없음으로 처리하지 않고 참조를 안내해 삭제를 차단한다"
      - "id": "E2"
        "condition": "그룹 생성으로 메뉴 역할·쿼터 등급·자산 권한을 자동 부여"
        "flow":
          - "독립 관리 대상임을 안내하고 해당 업무의 별도 판정 경로를 유지한다"
    "postcondition": "그룹 정의와 안정 참조가 유지되며 그룹 자체 관리가 사용자/자산 권한 부여를 대신하지 않는다"
    "rules_from":
      - "REQ-605.mapping_workbench"
      - "REQ-605.business_rules"
      - "REQ-605.lifecycle"
      - "REQ-601.business_rules"
    "pending":
      - "@defer P3 — 그룹 참조/사용 상태·허용 비활성화/삭제·식별자 보호와 영향 표시를 상세화한다"
  - "id": "UC-026"
    "name": "자산 접근 매핑과 직접 보안 정책을 정해진 경로로 변경한다"
    "workstream": "admin"
    "design_status": "draft"
    "reqs":
      - "REQ-611"
    "actors":
      "primary": "ACT-002"
      "secondary":
        - "ACT-003"
    "process_step": "PRC-09-03"
    "precondition": "정책 종류별 관리 권한과 현재 대상·그룹·신원/필터 근거가 있다"
    "trigger": "카탈로그/API 접근 매핑·열람/마스킹·행 스코프·기본 필터·필수 조회 제약를 변경한다"
    "main_flow":
      - "SCR-009에서 대상 테이블·규칙 종류를 정하고, 조회 제약이면 입력 파라미터·조건 템플릿·차이/범위 검증식과 질문 안내를 정의한다. 입력값 검증과 실제 SQL 조건 적용을 각각 검수한다"
      - "정책 종류·소유 원천·전체 현재 값과 참조·적용 영향을 확인한다"
      - "카탈로그 테이블 허용 그룹과 REQ-103.column_group_exclusions의 컬럼별 숨김/마스킹 예외와 개인정보 분류·마스킹 참조는 같은 카탈로그 전체 후보, API 허용 그룹·응답 통제는 API 전체 후보로 UC-012에 인계한다"
      - "직접 관리인 공통 마스킹 변환 정의·행 스코프·기본 필터·필수 조회 제약는 UC-002로 처리한다. 별도 관리자 승인 단계를 만들지 않는다"
      - "그룹 허용 합집합·원본/마스킹/차단 판정과 행 스코프·기본 필터·필수 조회 제약의 전체 AND 조건, 해제 가능 여부·신원 출처를 검수한다"
      - "불변 전체 스냅샷·사유·실제 적용과 기존 알림 근거를 남기고 현재 상태·정책 이력으로 확인한다"
    "alternative_flows":
      - "id": "A1"
        "condition": "기본 필터의 명시적 제외 요청"
        "flow":
          - "REQ-103·611의 대상·규칙/리비전·사유·요청 근거를 검사한다. 행 스코프·해제 불가 필터·필수 조회 제약은 제외로 해제하지 않는다"
      - "id": "A2"
        "condition": "과거 정책 복원"
        "flow":
          - "과거 이력을 덮지 않고 현재 권한·참조를 다시 검증하는 새 변경으로 처리한다"
    "exception_flows":
      - "id": "E1"
        "condition": "권한 테이블 중복으로 행/집계 증가 또는 일부 행 스코프 생략"
        "flow":
          - "정상 정책으로 반영하지 않는다. REQ-103의 모든 규칙 결합과 중복 방지 조건을 검증한다"
      - "id": "E2"
        "condition": "현재 신원·참조·기준 리비전·변경 이력 저장 실패"
        "flow":
          - "부분 적용이나 확인되지 않은 정책 복원을 성공으로 표시하지 않는다"
    "postcondition": "현재 변경 권한에 따른 직접 반영과 소유 원천/전체 전후 이력을 추적한다. 과거 정책 이력은 현재 접근 권한/동의를 대체하지 않는다."
    "rules_from":
      - "REQ-611.business_rules"
      - "REQ-611.query_constraint_boundary"
      - "REQ-611.consent_policy_link"
      - "REQ-103.business_rules"
      - "REQ-608.business_rules"
    "pending":
      - "@defer P3 — 정책별 원천·입력 모델·AND/합집합·제외 명세와 조건부 반영/알림의 원자성·실행 시 검증을 설계한다"
  - id: UC-027
    name: "월별 쿼터 기준을 저장하고 미래 예정 배분을 조회·재생성한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-116, REQ-118, REQ-606]
    actors: { primary: ACT-004, secondary: [] }
    process_step: PRC-12-01
    precondition: "년월별 기준 관리/배분 실행 권한과 수동 행 추가 시 같은 월의 유효 저장 단가가 있다. 자동 월말 승계는 직전 실행/승계확정 기준을 사용한다"
    trigger: "미래 월 기준 작성·예정 결과 확인/재생성 또는 월말 최종 결과 조회"
    main_flow:
      - "기준년월을 고르고 같은 월 유효 저장 단가를 참조해 새 행을 추가한다. 원 단가 월/리비전은 비표시 보존한다"
      - "금액·환산율·수동 보정/메모를 저장한다. 최초는 원 단가 고정과 함께, 재저장은 원 USD/스냅샷을 그대로 보존한다"
      - "대상 월에 유효한 시작월별 등급 기준을 읽기 전용으로 조회한다. 등급 정의/가중치는 UC-039에서 관리한다"
      - "대상 월 시작 전 저장된 기준으로 선택적 예정 배분을 생성/교체하고 사용자 배정 탭에서 유효 한 세트를 조회한다"
      - "월말 UC-042가 저장된 다음 달 기준 또는 부재 시 직전 월 금융기준 새 행으로 최종 배분한다. 대상자/효력 등급·가중치는 다음 달 기준이다"
      - "대상 월 시작 후 전체 수동 재생성을 잠그고 비용 통계/상속 이력에서 원 기준·예정/최종·승계 출처를 확인한다"
    alternative_flows:
      - { id: A1, condition: "미래 예정 생성 후 기준 변경", flow: ["계산 입력 변경은 낡음·완료=false로 표시. 메모만 변경은 계산 유효성을 바꾸지 않는다. 월말 배치는 최신 저장본으로 최종 생성한다"] }
      - { id: A2, condition: "활성0명·마감 뒤 신규/재활성", flow: ["월 최종 준비와 개인 기준 미산정을 구분하고 기존 자동 개별 배정·첫 사용 전 최초 정정은 REQ-116을 따른다"] }
    exception_flows:
      - { id: E1, condition: "수동 단가 없음/미완료·월 중복·권한/기준본 충돌", flow: ["추가/저장을 거부하고 입력을 보존한다. 월 기준만 저장/단가만 고정하는 부분 성공 금지"] }
      - { id: E2, condition: "월 시작 뒤 재생성·결과 불명", flow: ["전체 수동 재생성 거부. 배치 원 결과/마감 스냅샷 복구와 현재값 소급 재계산을 구분한다"] }
    postcondition: "월 기준/원 USD 고정·유효 예정 배분·월말 최종 배분의 단계와 실제 적용 월을 구분하고 과거 한도를 보호한다"
    rules_from: ["REQ-116.business_rules", "REQ-116.empty_population", "REQ-116.hard_rule", "REQ-118.business_rules", "REQ-118.lifecycle", "REQ-606.business_rules"]
    pending: ["@defer P3 — 월 확정/승계·0명 첫 활성·일할/최초 정정·동시 배정의 저장 구조와 원자성, 산식 경계 시험을 설계한다"]

  - "id": "UC-028"
