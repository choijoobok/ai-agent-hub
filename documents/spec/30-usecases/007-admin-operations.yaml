# 영역: admin 운영 설정·감사·통계·품질 처리
usecases:
  - id: UC-030
    name: "기존 시스템 환경설정으로 운영값을 확인·변경한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-614]
    actors: { primary: ACT-004, secondary: [ACT-002] }
    process_step: PRC-13-01
    precondition: "일반 운영값은 기존 CONFIG_MGMT 조회/저장 권한이 있고 배포 전용 값은 소유 조회 화면의 권한이 있다"
    trigger: "실행 제한·승인 방식·저장 조회 제한·전송/보존 설정을 확인하거나 편집 가능한 값을 변경한다"
    main_flow:
      - "SCR-515의 기존 키·유형·설명·기본값·적용값·변경 여부를 확인한다. 단위·범위·적용 시점은 속성 설명과 소유 요건을 따르며 새 컬럼/관측 탭을 추가하지 않는다"
      - "화면 편집 가능 항목만 후보로 작성하고 현재 권한·범위·상호 제약을 검증한다"
      - "UC-506의 기존 저장·기본값 복원을 사용한다. 별도 admin 설정 저장소·설정 버전·변경 사유 입력·이력을 추가하지 않는다"
      - "소비 기능은 항목별 적용 경계에서 확보한 값을 사용하고 소유 요청/실행에 적용값·판정 시각을 기록한다. 저장 성공을 모든 진행 작업의 즉시 변경으로 간주하지 않는다"
    alternative_flows:
      - { id: A1, condition: "조회 결과 사본 또는 질의·응답 본문 보존 기간", flow: ["SCR-017 등 소유 조회 화면에서 YAML 원천의 최종 적용값과 출처를 읽기 전용으로 확인한다. 이 값은 시스템 환경설정 목록/저장에 추가하지 않고 YAML 수정·배포로 변경한다"] }
      - { id: A2, condition: "전송 통제 또는 관리 승인 설정 확인/변경", flow: ["현재 요청·동의·전송 범위를 포괄 허용 플래그로 대체하지 않는다. 승인 설정 변경도 기존 CONFIG_MGMT 권한을 검사하고 기존 대기 건은 자동 승인하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "미지원 키·형식/범위·상호 제약 위반 또는 읽기 전용 값 변경", flow: ["적용하지 않고 오류 위치와 관리 원천을 안내한다"] }
      - { id: E2, condition: "대기/점유 시간 변경으로 보존 연장 또는 진행 중 턴에 일괄 덮어쓰기", flow: ["설정별 원래 경계를 유지한다. 턴 전체 시간·누적 토큰 강제 종료 상한을 신설하지 않는다"] }
    postcondition: "기존 화면에서 일반 운영값을 저장/복원하고 소비 기능의 기록에는 당시 적용값·판정 근거가 남는다. 기존 보안·과금·보존 규칙은 유지된다"
    rules_from: ["REQ-614.business_rules", "REQ-614.field_usage", "REQ-614.permissions", "REQ-107.retention_policy", "REQ-109.conversation_body_retention"]
    pending: ["@defer 전체 화면·업무 흐름 합의 후 — 항목별 정의와 기존 공통 조회 소비·적용 경계/기록을 ARCH-029·031·033과 대조한다. 기존 system 화면을 수정하거나 미정 숫자를 새 기본값으로 정하지 않는다"]

  - id: UC-031
    name: "감사 이력을 조회하고 원본과 구분한 검토 의견을 남긴다"
    workstream: admin
    design_status: draft
    reqs: [REQ-107]
    actors: { primary: ACT-005, secondary: [] }
    process_step: PRC-02-04
    precondition: "조회 대상의 현재 감사·메뉴·민감 상세 열람 권한이 있다"
    trigger: "대화·조회·실행·정책 판정/변경 이력을 추적하거나 개별 판정을 검토한다"
    operation_scope:
      history: "FEAT-026·027·028·029·033은 각 소유 이력의 조회·추적에 이 흐름을 사용한다"
      review: "개별 감사/개인정보 판정 검토와 조사 연결은 FEAT-026·029의 해당 검토 대상에서 현재 검토 기록·조사 요청 권한을 별도로 확인해 제공한다. FEAT-027·028·033에 같은 쓰기/조사 생성 기능을 일괄 추가하지 않는다"
      restoration: "정책 복원은 FEAT-033의 기존 소유 변경 인계 범위로 제한한다"
      external_changes: "FEAT-033은 REQ-103·IF-006·FEAT-305의 외부 인사 변경 사건과 실제 처리 결과를 조회한다. system 계정 상태와 admin Portal 이용 자격·그룹 변경을 구분하고 수신·반영·실패/미확인 상태를 성공으로 합치지 않는다"
    main_flow:
      - "서버 전체 이력에 조건을 적용해 실제 턴·시도·회차·스텝·호출·정책 근거를 조회한다. 현재 상태 요약과 불변 사건을 구분한다"
      - "중복 제거한 턴과 일치 스텝으로 이동하고 미분류·판단 불명·실패·거부도 확인한다"
      - "허용 상세·생성/실행 SQL·실제 판정·동의/전송·보존 상태를 권한과 원천에 따라 대조한다"
      - "개별 판정 검토 대상이면 별도 액션 권한을 확인해 검토자·시각·사유·보정 의견을 추가한다. AI/패턴의 원 판정과 원본 사건을 수정하지 않는다"
      - "그 검토에서 별도 조사가 필요하면 권한과 근거·사유를 확인해 UC-036으로 연결한다. 정책 복원은 소유 기능의 새 변경 절차로 인계한다"
    alternative_flows:
      - { id: A1, condition: "본문/결과가 만료·파기됐거나 안전한 사본이 없음", flow: ["감사 메타데이터와 남은 근거로 확인하고 재현 한계를 표시한다. 원문을 복구한 것처럼 표시하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "권한 밖 민감 상세·SQL 편집/직접 실행 요청", flow: ["조회 권한으로 실행하거나 다른 업무 데이터를 열람하지 못하게 한다"] }
      - { id: E2, condition: "단순 검토·표식으로 자동 제재/조사 생성/영구 보호", flow: ["검토 기록과 실제 조사·보호 결정을 분리한다. 보호 범위·담당·기한 근거 없이 보존을 연장하지 않는다"] }
    postcondition: "원본 불변 이력과 추가 검토 의견·조사 연결이 구분되고 현재 권한·보존 한계 안에서 추적된다"
    rules_from: ["REQ-107.history_storage", "REQ-107.audit_classification", "REQ-107.privacy_review", "REQ-107.permissions", "REQ-107.retention_policy", "REQ-104.business_rules"]
    pending: ["@defer P3 — 전체 조건 검색·턴 중복 제거·일치 스텝 이동·민감 상세·검토 이력 및 원문/메타데이터의 보존·보호 경합을 설계한다"]

  - id: UC-032
    name: "토큰 사용량과 공급사 월별 대조 근거를 확인한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-118]
    actors: { primary: ACT-004, secondary: [] }
    process_step: PRC-12-01
    precondition: "사용량/비용 통계 조회·대조 근거 관리 권한이 있다"
    trigger: "월별 사용을 조회·다운로드하거나 다음 달 보정 근거를 검토한다"
    main_flow:
      - "공급 경로·모델·추론 수준·계량 단위/출처·사용자/시스템 귀속별 실제 사용을 조회한다"
      - "공급사 계량·Hub 추정·미상을 구분하고 늦은 계량/누적 스냅샷의 중복을 제거한 근거를 확인한다"
      - "일반 배정·예외 승인·실제 사용·계획 풀과 공급사 월 토큰/사용분 비용 대조값의 범위·괴리·제외 근거를 확인한다"
      - "실제 역할/조합별 실적 스냅샷과 완전성·수동 보정 참고 근거를 확인한다. 단가 작성/저장은 UC-022, 고정은 UC-027의 월 기준 저장이 소유하며 자동3개월 보정 제안은 사용하지 않는다"
      - "계획 확정과 개인 배정은 UC-027로 인계한다. 통계 조회나 대조 등록 자체로 한도를 재배정하지 않는다"
    alternative_flows:
      - { id: A1, condition: "실적 없음/불완전", flow: ["미상을0으로 채우지 않고 누락 범위를 표시한다. REQ-613의 관리자 보완/수동 턴 가정으로 연결하며 자동 보정률을 제안하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "캐시/출력 계량 미상·취소/늦은 정정", flow: ["미상을 0으로 꾸미거나 이미 발생한 사용을 환불한 것으로 처리하지 않는다. 원 계량과 정정 근거를 유지한다"] }
      - { id: E2, condition: "청구서·회계 정산·자동 수집 경로 확대", flow: ["토큰 운영 대조 범위를 유지하고 미정 수집 방식이나 회계 기능을 임의로 확정하지 않는다"] }
    postcondition: "계량 출처와 확정/미상·계획/실적·보정 근거가 구분되어 다음 월 계획 판단에 사용된다"
    rules_from: ["REQ-118.business_rules", "REQ-118.exceptions", "NFR-010.detail", "NFR-010.unknown_unit_rule", "NFR-016.requirement"]
    pending: ["@defer 전체 화면/업무 흐름 합의 후 — 실제 월 집계/출처·동일 통화 범위/환산 근거·실적 스냅샷·수동 참고 기록·반출 권한 계약을 설계한다"]

  - id: UC-033
    name: "턴·시도의 실제 상태와 실행 점유 사건을 관측한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-013, REQ-006]
    actors: { primary: ACT-005, secondary: [ACT-004] }
    process_step: PRC-02-04
    precondition: "REQ-107·ARCH-070의 현재 내부 이력/관측 권한이 있다. Portal 본인 턴 권한을 관리자 전체 업무 데이터 권한으로 확대하지 않는다"
    trigger: "처리 정체·대기 만료·점유 획득 실패/상실·원 턴과 새 턴의 관계를 확인한다"
    main_flow:
      - "원 턴과 연결된 새 턴·시도·회차 및 실제 처리 상태·시간·작업을 각각 조회한다"
      - "점유 획득 실패·만료 회수·대기 만료·점유 상실을 해당 인스턴스·토큰과 원 사건에 연결해 확인한다"
      - "REQ-006의 실제 이력·시각 기준으로 표시하고 종결된 원 턴의 상태/결과를 보존한다"
      - "외부 결과 미관측·늦은 응답과 현재 유효 상태를 구분하고 필요한 조사 근거는 UC-036으로 인계한다"
    alternative_flows:
      - { id: A1, condition: "정상 사용자대기 이어가기와 별도 새 턴 요청이 함께 있음", flow: ["기존 수명주기·원본/새 턴 관계로 구분한다. 조회 화면에서 새 요청을 생성하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "만료 점유의 부활·원 턴 재개·관리자 대리 실행 시도", flow: ["관측 기능으로 허용하지 않는다. 만료 회수의 종결과 별도 사용자 요청 계약을 유지한다"] }
      - { id: E2, condition: "시각/진행 근거 또는 외부 결과가 불명", flow: ["진행률·예상 종료·성공/실패를 추정하지 않고 마지막 관측과 한계를 표시한다"] }
    postcondition: "실제 상태와 점유 사건의 원인을 추적하되 조회 자체가 실행·점유·만료 상태를 바꾸지 않는다"
    rules_from: ["REQ-006.history_contract", "REQ-006.time_display", "REQ-013.request_boundary", "REQ-013.permissions", "REQ-107.history_storage"]
    pending: ["@defer P3 — 관측 권한·상태/사건 조회·늦은 응답·원본/새 턴 관계·지표와 조사 연결의 계약을 ARCH-070과 대조한다"]

  - id: UC-034
    name: "저장된 조회의 운영 상태와 복구 근거를 확인한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-204, REQ-207]
    actors: { primary: [ACT-004, ACT-003, ACT-002, ACT-005], secondary: [ACT-001] }
    process_step: PRC-02-07
    precondition: "해당 관리 목록/상세의 현재 권한이 있다. 실제 재시도는 본인 조회를 실행하는 사용자가 수행한다"
    trigger: "저장 조회의 오류·사용 빈도·반복 실패·신고/조사 상태 또는 복구 여부를 확인한다"
    main_flow:
      - "조회 ID별 목록에서 개별 실행 ID의 실제 실패·신고·조사 근거로 이동한다"
      - "구조 변경 후보의 확인 필요와 확정된 파괴적 변경을 구분한다. 변경 통지로 가짜 실행 실패를 생성하지 않는다"
      - "같은 사용자·조회 ID에 공유되는 실행 진입·재시도 제한·대기 상태와 현재 통제 실패 원인을 확인한다"
      - "대기 뒤 사용자가 요청한 새 실행이 같은 agent 경로의 현재 신원·권한·스키마·필터·마스킹 검사를 통과했는지 확인한다"
      - "실제 새 실행 성공으로만 활성 복귀를 확인하고 신고/조사·제한 설정·인증 예제 후보는 각 소유 절차로 인계한다"
    alternative_flows:
      - { id: A1, condition: "사용 빈도에서 인증 예제 후보를 만들 가치가 있음", flow: ["REQ-205의 별도 승격 권한과 원 조회 권한을 확인해 UC-009로 인계한다. 개인 조회 자체를 공유·배포하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "캐시·권한 재부여·스키마 원복·조사 완료만으로 복구", flow: ["활성 복귀로 표시하지 않는다. 실제 새 실행 결과를 확인한다"] }
      - { id: E2, condition: "관리자 SQL 수정/직접 실행·대기 중 중복 요청", flow: ["우회 실행을 제공하지 않는다. 대기 요청으로 DB 호출·실패 횟수 증가·대기시간 연장이 발생하지 않게 한다"] }
    postcondition: "조회 정의와 개별 실행·오류·복구 근거가 분리되고 없는 턴·모델 사용량을 만들지 않는다"
    rules_from: ["REQ-204.business_rules", "REQ-204.lifecycle", "REQ-207.business_rules", "REQ-205.permissions"]
    pending: ["@defer P3 — 조회별 목록·개별 실행 상세·재시도 제한 공유·변경 후보/확정·실제 성공 복귀의 API/화면/시험을 설계한다"]

  - id: UC-035
    name: "품질 신고를 조사에 연결하고 신고자별 결과를 회신한다"
