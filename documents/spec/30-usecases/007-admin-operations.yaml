      - "권한 범위 안에서 반복 문제와 메타데이터 미완성 근거를 대조한다"
      - "그룹/매핑·자산 보완 또는 별도 조사 필요성을 담당자가 판단해 소유 절차로 인계한다"
    alternative_flows:
      - { id: A1, condition: "표본·집계 근거가 부족하거나 미분류", flow: ["정상이나 위반으로 단정하지 않고 부족/불명 상태와 해석 범위를 표시한다"] }
    exception_flows:
      - { id: E1, condition: "지표만으로 자동 권한 확대·자산 반영·조사 완료", flow: ["판단 자료와 실제 변경/승인 절차를 구분한다"] }
      - { id: E2, condition: "상시 평가셋·회귀 평가 통과를 현재 필수로 추가", flow: ["REQ-615와 PRC-10-03의 유예 범위를 유지한다. 일상 지표 조회를 평가 실행 기능으로 확대하지 않는다"] }
