    main_flow:
      - "신고 원본과 채팅 턴/응답 회차 또는 조회 ID/개별 실행 ID를 확인한다"
      - "동일 턴/오류의 조사는 관련 후보로 제시하고 담당자가 내용의 관련성을 확인해 UC-036에 연결한다"
      - "현재 연결과 취소/재연결 이력을 관리하고 신고자의 자신의 진행/결과 안내를 갱신한다"
      - "조사의 실제 조치가 해당 신고에 적용됐는지 확인하고 사용자용 결과·사유를 회신한 뒤 신고를 종결한다"
    alternative_flows:
      - { id: A1, condition: "이미 조사 중이거나 완료 조사와 관련된 신고", flow: ["새 신고와 설명은 보존한다. 과거 발생의 사후 연결/재발 기준을 UC-036에서 확인하고 개별 회신을 생략하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "증거 만료·마스킹 사본 부재·열람 권한 없음", flow: ["남은 근거와 한계를 표시한다. 신고 접수/연결로 원문을 복원하거나 권한을 확대하지 않는다"] }
      - { id: E2, condition: "조사 완료만으로 신고 자동 종결·내부 증거 자동 공개", flow: ["신고별 조치/회신을 확인하고 내부 사유·다른 신고·정책/객체명 공개를 제한한다"] }
    postcondition: "원본 신고·현재 조사 연결·개별 회신/종결이 분리되며 신고자에게 허용된 결과만 전달된다"
    rules_from: ["REQ-110.business_rules", "REQ-110.hard_rule", "REQ-110.lifecycle", "REQ-110.permissions"]
    pending: ["@defer P3 — 신고 접수/증거 보호 인계·연결 이력·권한별 회신·개별 종결과 조사 완료 경합을 설계한다"]

  - id: UC-036
    name: "오류·품질 조사를 배정하고 조치의 실제 효과를 검증한다"
    workstream: "admin"
    design_status: "draft"
    reqs:
      - "REQ-115"
      - "REQ-304"
    actors:
      primary: "ACT-005"
      secondary:
        - "ACT-003"
        - "ACT-002"
    process_step: "PRC-10-02"
    precondition: "원 발생/신고/감사 검토 근거와 현재 조사·조치별 권한이 있다"
    trigger: "PRC-10-01에서 조사 생성/연결이 필요하거나 기존 조사를 분석·조치·완료·재개한다"
    main_flow:
      - "채팅 오류·신고·저장 조회 개별 실패·감사 검토를 구분하고 사람이 관련성을 확인해 원본별 현재 조사 연결을 설정한다"
      - "담당자를 배정하고 당시 실행 근거와 현재 자산을 대조한다. 배정만으로 민감 증거 열람권을 부여하지 않는다"
      - "조사에 필요한 자료는 현재 보호 액션 권한을 확인해 범위·담당자·사유·원래 만료 시각을 기록하고 보호를 설정하거나 조정한다. 파기와의 선후·미확보 상태는 원천 계약으로 확인한다"
      - "실제 조치·적용 시각/범위와 재현 또는 정상 실행 근거로 효과를 검증한다. 변경 요청의 반영 상태만으로 완료하지 않는다"
      - "완료 사유·검증 근거와 보호 해제를 기록하되 다른 미완료 조사 보호와 원래 보존 기한을 유지한다. 신고 회신·저장 조회 활성 상태는 각각의 절차로 확인한다"
      - "진단된 자산/권한 조치는 해당 현재 변경 권한자의 원 관리 화면 직접 저장·이력으로 연결한다. 조사 해결 검증은 유지하고 별도 의미 영향 검토 큐/관리자 승인을 필수 경유하지 않는다."
    alternative_flows:
      - id: "A1"
        condition: "자산 변경이 필요하지 않음"
        flow:
          - "변경 불필요 사유와 실제 정상 정책/실행 근거로 검증한다. 불필요한 변경 요청·검토 작업을 만들지 않는다"
      - id: "A2"
        condition: "완료 뒤 과거 발생 또는 조치 후 재발을 발견"
        flow:
          - "발생 시각과 실제 조치 적용 범위로 판정한다. 조치 전 같은 문제는 완료 상태로 사후 연결하고 조치 후 재발은 재개/후속 조사로 다룬다"
      - id: "A3"
        condition: "잘못된 조사 연결"
        flow:
          - "사유와 이력을 추가해 취소·재연결한다. 원본과 다른 연결은 보존하고 원본별 유효 연결 하나를 유지한다"
      - id: "A4"
        condition: "장기 미완료 보호 또는 연결 취소/재연결"
        flow:
          - "담당자·기간·사유로 보호를 조회·재검토하고 실제 필요 범위의 조정·해제를 기록한다. 다른 유효 보호와 원래 기한을 유지하며 이미 파기된 자료를 복원하지 않는다"
    exception_flows:
      - id: "E1"
        condition: "코드/메시지/턴 일치만으로 자동 병합·발생마다 알림"
        flow:
          - "사람의 관련성 판정과 담당자/검토 작업 배정 알림 경계를 유지한다"
      - id: "E2"
        condition: "반려/반영 실패·발생 중단·원인 불명만으로 완료"
        flow:
          - "해결됐다고 표시하지 않고 실제 조치·검증과 후속 처리를 계속 추적한다"
      - id: "E3"
        condition: "system 예외 이력이나 권한 밖 원문을 조사 원본으로 편입"
        flow:
          - "정해진 Hub 오류/품질 원본 경계를 유지하고 필요한 원천·권한을 안내한다"
    postcondition: "조사·근거 연결·조치·검증·보호 상태가 추적된다. 완료가 신고 자동 종결·저장 조회 자동 복구·과거 원문 복원을 의미하지 않는다"
    rules_from:
      - "REQ-115.business_rules"
      - "REQ-115.hard_rule"
      - "REQ-115.permissions"
      - "REQ-115.lifecycle"
      - "REQ-304.business_rules"
      - "REQ-107.retention_policy"
    pending:
      - "@defer P3 — 원본별 단일 유효 연결·연결 취소 경합·조치 적용 범위·보호/해제·사후 연결/재발과 검증 증거의 데이터/API/화면 계약을 설계한다"
  - id: UC-037
    name: "실제 처리 사실에서 품질 지표와 보완 대상을 확인한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-101, REQ-110, REQ-301]
    actors: { primary: ACT-005, secondary: [ACT-002, ACT-003] }
    process_step: PRC-02-04
