    rules_from: ["REQ-101.relevance", "REQ-107.audit_classification", "REQ-110.business_rules", "REQ-301.quality_management"]
    pending: ["@defer P3 — 지표별 분모·성공 정의·기간·중복 제거·드릴다운 권한을 설계한다. 임의 목표치나 평가 임계값을 확정하지 않는다"]

  - id: UC-038
    name: "채팅 처리 오류 발생과 불변 증거를 접수한다"
    workstream: admin
    design_status: draft
    reqs: [REQ-115]
    actors: { primary: ACT-005, secondary: [ACT-001] }
    actor_note: "ACT-005는 접수 결과의 업무 수혜·검토 주체이고 ACT-001은 영향 사용자다. 실제 기동/호출자는 portal·agent의 내부 자동 처리이며 담당자의 수동 접수·사전 열람 권한이나 사용자의 신고 조작을 접수 조건으로 삼지 않는다. 생산자 인증은 공개 계약에서 확인한다"
    process_step: PRC-10-01
    precondition: "업무 담당자의 채팅 처리에서 portal·agent 소유 실패와 당시 실행 근거가 발생했다. 오류/증거 접수는 서버 간 공개 계약으로 수행한다"
    trigger: "채팅 요청·응답 계약, 컨텍스트, 모델·도구, SQL 검증·실행 또는 응답 구성에 실패한다"
    main_flow:
      - "실패를 관측한 portal·agent가 해당 발생과 원 턴/회차/스텝·관련 자산의 정제한 근거를 admin 접수 계약으로 인계한다"
      - "admin은 생산 원천과 원 실행 근거를 대조해 오류 발생 원본과 현재 확보 가능한 마스킹 증거를 접수한다. 비밀 원문이나 다른 업무의 원문을 추가 복제하지 않는다"
      - "같은 전달의 재수신과 같은 코드/메시지를 가진 별도 발생을 구별하고 원본 참조와 확인된 저장 결과를 남긴다. 정확한 식별·재처리 방식은 공개 계약에서 정한다"
      - "접수 결과와 증거 확보 한계를 SCR-033 조회에 제공한다. 담당자의 실제 확인은 접수 완료 조건이 아니며, 후속 조사는 UC-036에서 별도로 처리한다. 접수 자체로 조사나 발생 알림을 만들지 않는다"
    alternative_flows:
      - { id: A1, condition: "저장된 조회의 개별 실행 실패", flow: ["REQ-207의 원 실행 이력을 조사 근거로 참조한다. 채팅 오류 발생을 중복 생성하지 않는다"] }
      - { id: A2, condition: "일부 증거가 만료·파기됐거나 안전한 사본이 없음", flow: ["남은 근거와 확보하지 못한 범위를 명시한다. 과거 증거를 추정하거나 원천 재조회로 채우지 않는다"] }
    exception_flows:
      - { id: E1, condition: "발생/증거 수신 또는 저장 실패", flow: ["접수 완료로 표시하지 않고 확인된 실패·미확보 범위를 남긴다. 전달/저장 실패와 복구의 상세 계약은 소유 모듈과 대조한다"] }
      - { id: E2, condition: "같은 코드만으로 원인 병합·조사 자동 생성·무기한 보호 시도", flow: ["발생 원본을 분리하고 조사·보호는 권한 있는 담당자의 별도 판단으로 처리한다"] }
    postcondition: "admin 소유 오류 발생과 확보된 증거가 원 실행 근거에 연결되거나 접수 실패/미확보 범위가 드러난다. agent 감사 원본과 조사 상태는 별개다"
    rules_from: ["REQ-115.detail", "REQ-115.hard_rule", "REQ-115.business_rules", "REQ-110.business_rules", "REQ-107.retention_policy", "REQ-109.conversation_body_retention"]
    pending: ["@defer P3 — 생산자 인증·수신/발생 식별·중복/부분 실패·증거 확보/파기 경합·저장 실패 복구의 API와 데이터·계약 시험을 설계한다"]
