# 권장 신원 확인의 요구 흐름. 런타임 상세 설계·제품 구현은 후속이다.
usecases:
  - id: UC-044
    name: "일회용 신원 토큰으로 대상 시스템의 사용자를 확인한다"
    workstream: agent
    design_status: draft
    feature_contract: FEAT-205
    reqs: [REQ-103, REQ-105, REQ-113, REQ-608, REQ-609]
    actors: { primary: ACT-001, secondary: [ACT-006] }
    process_step: PRC-03-02
    precondition: "REQ-609.identity_verification의 권장 계약을 대상/게이트웨이가 지원하고 현재 사용자·매핑·연결·권한·필요한 실행 승인이 유효하다. 보호된 내부 왕복 경로와 요청 결합이 공동 검수됐다."
    trigger: "실제 업무 API 전송 직전의 신원 확인"
    main_flow:
      - "Hub는 현재 실행 주체·매핑/규칙 버전과 확정 요청·정확 연결 계약을 검사한다."
      - "호출용 난수 토큰을 내부 발급하고 해시·바인딩·만료·미사용 상태를 Hub DB에 확정한다."
      - "Hub 호출자 증명과 토큰을 포함한 보호된 업무 요청을 대상 시스템에 전송한다."
      - "대상은 원 호출자 증명과 실제 요청 근거를 확인하고 자기 서버 인증으로 IF-009 검증·소비를 요청한다."
      - "Hub는 현재 효력·요청 결합과 반환 신원을 같은 경계에서 검증·고정하고 일회 소비와 최소 감사를 원자 확정한 뒤 고정한 대상 사용자 ID를 최소 반환한다."
      - "대상은 동일 요청의 자체 권한·업무 조건·중복 실행을 검사한 뒤 실행하고 Hub는 기존 업무 결과 계약으로 처리한다."
    alternative_flows:
      - id: A1
        condition: "기존 검수된 다른 신원 계약 또는 사용자 위임 없음"
        flow: ["선택 연결의 명시 계약을 따른다. 권장 경로의 오류를 이 경로로 자동 대체하지 않는다."]
    exception_flows:
      - id: E1
        condition: "인증/대상/요청 결합 실패·만료·신원/권한 회수·이미 소비됨"
        flow: ["신원 없이 거부하고 잘못된 요청으로 정상 토큰을 소비하지 않는다. 실제 업무를 시작하지 않는다."]
      - id: E2
        condition: "동시 소비 또는 회수와 소비가 경합"
        flow: ["한 번만 소비하고 REQ-609.identity_verification.revocation_order의 확정 선후를 적용한다."]
      - id: E3
        condition: "DB/검증 장애 또는 소비/업무 응답 유실"
        flow: ["실행 허용으로 바꾸지 않는다. 이미 소비한 토큰은 복원하지 않고 REQ-105·113에 따라 결과 확인/멱등성·재승인을 판정한다. 새 토큰만으로 재전송하지 않는다."]
    postcondition: "정확 사용자·대상·요청에 한 번만 신원을 제공하거나 신원 없이 거부한다. 소비 완료와 업무 성공은 분리하고 토큰 원문은 모델/화면/이력/로그에 남기지 않는다."
    rules_from: ["REQ-609.identity_verification", "REQ-105.idempotency_contract", REQ-113, IF-009]
    pending: "@defer P3 agent/integration·admin G3 교차 검수 — 저장/API/오류·정규화·키 교체·만료/보존·부하와 결과 확인 계약을 구체화한다. 이 요구 흐름은 작업흐름 단계/게이트 승인을 대신하지 않는다."
    sequence_design:
      contracts_from: ["REQ-609.identity_verification", IF-009, ADR-041]
      scope: "고객사가 채택한 권장 신원 확인 경로. 로그인/관리 CRUD·SQL 사용자 바인딩과 분리한다."
      diagrams:
        - key: identity-consumption
          title: "난수 발급과 인증된 대상의 일회 소비"
          testcases: [TC-2051, TC-2052, TC-2053, TC-2054, TC-2055, TC-2056, TC-2057, TC-2058]
          transaction_boundary: "발급 저장을 확정한 뒤 외부 업무 요청을 보낸다. 현재 효력/회수 검사와 미사용→사용 완료·최소 감사는 일관된 원자 경계이며 HTTP 왕복 중 DB 잠금을 보유하지 않는다. 대상 업무 트랜잭션과 분산 원자 커밋을 약속하지 않는다."
          reading_order: ["Hub에서 현재 주체·매핑과 확정 요청에 결합한 토큰을 발급한다.", "대상은 원 Hub 호출자 증명과 실제 요청을 확인한 뒤 별도 서버 인증으로 소비한다.", "검증/저장 실패는 닫고 소비 응답 유실은 업무 미실행이나 자동 재전송의 근거가 아니다."]
          mermaid: |
            sequenceDiagram
              participant H as Hub 실행 서비스
              participant D as Hub DB
              participant T as 대상 시스템 또는 게이트웨이
              H->>H: 현재 주체와 매핑, 계약, 최종 요청 확인
              H->>D: 토큰 해시와 바인딩, 만료, 미사용 저장
              D-->>H: 발급 저장 확정
              H->>T: Hub 호출자 증명 + 업무 요청 + 난수 토큰
              T->>T: 원 호출자 증명과 실제 요청 확인
              T->>H: 대상 서버 인증 + 토큰 검증과 소비 요청
              H->>D: 현재 효력과 바인딩 검사, 일회 소비와 감사 원자 확정
              alt 유효하고 소비 확정 성공
                H-->>T: 대상 사용자 ID와 검증 요청 식별자
                T->>T: 자체 권한과 중복 실행 검사 후 업무 실행
                T-->>H: 업무 결과
              else 무효 또는 DB 확정 실패
                H-->>T: 신원 없는 거부
                T-->>H: 업무 실행 차단
              end
              Note over H,T: 소비 응답 유실 시 재소비 거부, 업무 결과 확인과 재실행은 별도 계약
