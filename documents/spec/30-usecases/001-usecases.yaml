usecases:
  - id: UC-501
    name: 관리자 계정 상태와 접속 조건을 운영한다
    workstream: system
    reqs:
      - REQ-501
    actors:
      primary: ACT-012
      secondary: []
    process_step: PRC-06-01
    precondition: 관리자는 계정 관리 권한을, 로그인 대상자는 system 관리자 자체 계정을 가진다
    trigger: 계정을 변경하거나 로그인·비밀번호·세션 동작을 요청한다
    main_flow:
      - 관리자가 계정·사용 기간·접속 IP·잠금·휴면 상태를 조회하고 저장한다
      - 로그인 시 존재·사용 여부·기간·잠금·휴면·IP와 해당 인증 수단의 검증 결과를 한 판정으로 검사한다. 로컬 계정은 기존 비밀번호 정책을 따른다
      - 성공 시 현재 동시접속 슬롯과 수락 원장을 확인하고 FEAT-301.session_store_v2의 JDBC 또는 Redis 발행/확정 뒤 세션과 권한 응답을 전달한다. 로그인 이력의 독립 실패 정책은 유지한다
      - 비밀번호 변경·초기화·세션 종료는 v2의 provider별 확정/재로그인 복구와 DB 회수·기한을 적용한다. 관리용 참조의 기존 targets 필드와0건/실제 회수 건수 의미를 보존한다
    alternative_flows:
      - id: A1
        condition: 잠금 또는 휴면만 해제
        flow:
          - 전용 명령으로 해당 상태만 해제한다
      - id: A2
        condition: 비밀번호 분실
        flow:
          - 재설정 코드를 검증해 일회용 토큰으로 변경한다
      - id: A3
        condition: 관리자가 Portal 이용도 필요함
        flow:
          - admin Portal 사용자 관리에서 별도 Portal 계정을 등록한다. 관리자 계정은 연결/복제하지 않는다
          - 각 영역의 별도 로그인·계정·세션·권한으로 이용하며 한쪽 변경을 자동 동기화하지 않는다
      - id: A4
        condition: 관리자가 이미 로그인한 계정을 비활성화
        flow:
          - 현재 관리 권한과 대상 상태를 같은 배타 보호 경계에서 검증하고 커밋한다
          - 대상 세션의 다음 보호 요청은 현재 계정 검사로 차단한다. Portal 계정/세션에는 전파하지 않는다
    exception_flows:
      - id: E1
        condition: 상태·기간·잠금·휴면·IP 중 하나라도 실패
        flow:
          - 세션을 만들지 않고 내부 사유를 로그인 이력에 남긴다
      - id: E2
        condition: 재사용 비밀번호·만료 토큰·다른 세션 소유자
        flow:
          - 변경을 거부하고 기존 상태를 보존한다
      - id: E3
        condition: Portal 자격증명·세션·SSO 응답으로 관리자 인증/명령을 요청
        flow:
          - 관리자 인증으로 수락하지 않고 관리자 계정·세션을 생성하거나 변경하지 않는다
          - 현재 관리자 인증과 관리 액션 권한을 별도로 확인한다
      - id: E4
        condition: 비활성화와 대상 관리자의 저장이 경합
        flow:
          - 권한 보호 잠금의 확정 순서로 판정한다. 먼저 확정된 저장은 유지하고 회수가 먼저면 저장을 거부한다
          - 현재 계정/권한 조회 장애는 503이며 과거 세션 권한으로 폴백하지 않는다
    postcondition: 허용된 관리자 계정만 현재 관리 권한 버전의 관리자 세션을 가지며 이력을 보존한다. Portal 계정·상태·세션은 자동 변경되지 않는다
    change_status: CR-028·CR-033 방향 승인·미구현. 상세 수락 계약은 FEAT-301이며 system 소유 G2/G3·화면 검토 후 구현한다.
    business_rules:
      - system의 계정 생성·신원 수정·비밀번호 변경/초기화·잠금 해제는 관리자 자체 계정에만 적용한다. Portal SSO/대상 계정/자체 모드와 계정 생애주기는 REQ-616·ARCH-050.portal_account_contract가 별도로 소유한다
      - SYS_USER는 물리 삭제하지 않는다
      - 관리자 설정과 시스템 파생 상태를 섞지 않는다
      - 설치용 admin의 초기 비밀번호는 admin이며 PWD_INIT_YN=Y·PWD_CHG_DTM=NULL로 둔다. 초기화 또는 주기 만료로 제한된 세션은 비밀번호 변경 성공 전 메인 화면·업무 API를 사용할 수 없다. 새 비밀번호는 기존 정책과 재사용 금지를 적용한다
      - 초기 계정 보정은 기존 설치 시드의 비밀번호 해시가 그대로인 admin에만 새 changeset으로 적용한다. 보정된 대상의 기존 JDBC 로그인 세션도 종료해 재접속 시 변경을 강제한다. 사용자가 변경한 비밀번호·세션과 다른 계정은 보존하며, 세션 종료·새 해시·초기화 플래그·변경 시각은 같은 트랜잭션으로 처리한다
      - ADR-046·CR-033의 비활성화 후 다음 보호 요청 차단과 관리 저장/권한 회수 직렬화를 FEAT-301.admin_authority_guard로 수행한다. 401은 계정/세션 불가, 403은 현재 액션 권한 없음으로 구별한다.
    sequence_design:
      scope: CR-033 비활성화와 보호 저장의 선후
      contracts_from:
        - FEAT-301
        - ADR-046
      diagrams:
        - key: authority-revocation
          title: 관리 저장과 권한 회수의 확정 순서
          transaction_boundary: 공유/배타 잠금은 각 변경과 동일 DB 트랜잭션 종료까지 유지한다.
          apis:
            - API-511
          testcases:
            - TC-50110
            - TC-50111
            - TC-5037
          mermaid: |
            sequenceDiagram
              autonumber
              participant U as 관리 요청
              participant A as system 현재 권한 포트
              participant D as 공유 DB
              U->>D: 트랜잭션 시작 및 명령키 보호
              U->>A: shared 또는 권한변경 exclusive 보호
              A->>D: 같은 트랜잭션 잠금 후 현재 계정/권한 조회
              alt 회수가 먼저 커밋됨
                A-->>U: 401 또는 403
                U->>D: 업무 효과 없이 종료
              else 현재 허용
                A-->>U: 보호 구간 안의 허용
                U->>D: 업무값/이력/명령 결과 커밋
              end
              U->>D: 트랜잭션 종료로 보호 해제
          reading_order:
            - 권한 변경 요청은 처음부터 배타, 보호 저장은 공유 모드로 같은 키를 획득한다.
            - 잠금 뒤 현재 계정/권한을 다시 읽고 판정과 효과를 같은 트랜잭션으로 확정한다.
            - 회수 선행은 거부하고 저장 선행 효과는 유지한다. 다음 요청 차단은 dirty 통지 성공 여부와 독립이다.
  - id: UC-502
    name: "역할과 개인 예외를 유효 권한으로 합성한다"
    workstream: system
    reqs: [REQ-502]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-06-02
    precondition: "대상 사용자·역할·메뉴 액션이 존재한다"
    trigger: "역할 또는 메뉴 액션 권한을 부여·회수한다"
    main_flow: ["역할과 보유 사용자·메뉴 액션을 조회한다", "변경 전 영향 사용자를 확인한다", "역할·역할 권한·개인 예외를 저장한다", "영향 사용자의 공유 세션에 고유 무효화 표식을 남긴다", "후속 보호 요청이 표식과 업무일자를 검사해 현재 권한을 재계산하고 권한 내용 해시를 제공한다"]
    alternative_flows:
      - { id: A1, condition: "한 사용자가 운영·감사·AI 품질 역할을 함께 보유", flow: ["역할 조합을 금지하지 않고 데이터에 등록된 액션을 합성한다"] }
    exception_flows:
      - { id: E1, condition: "존재하지 않거나 사용 중지된 사용자·역할·메뉴", flow: ["저장을 거부하고 기존 권한을 유지한다"] }
      - { id: E2, condition: "무효화 표식 불일치·업무일자 변경·로그인 첫 보호 요청", flow: ["현재 계정 상태와 권한을 재계산한다", "회수된 액션은 403으로 거부하고 계정 사용 불가는 401과 세션 종료로 처리한다"] }
    postcondition: "역할명 하드코딩 없이 데이터와 유효 기간으로 현재 권한이 계산된다"
    business_rules: ["역할 묶음은 겸임 가능하다", "권한 변경 API는 SYS_LO_ACCESS의 일반 시스템 사용 이력에 포함하지만 부여·회수 전용 원장은 만들지 않는다", "같은 역할의 전체 권한을 동시에 저장하면 나중에 완료된 전체 스냅샷이 이기며 자동 병합하지 않는다", "계산 전에 관측한 표식과 결과를 한 속성으로 저장하고 변경 표식을 삭제하지 않는다. 뒤늦은 저장도 후속 회수를 지우지 않는다", "권한 버전은 내용 해시다. 이미 인가를 통과한 요청의 소급 취소나 권한 변경만으로 일괄 재인증을 요구하지 않는다"]

  - id: UC-503
    name: 메뉴와 서비스 API를 실패 폐쇄로 연결한다
    workstream: system
    reqs:
      - REQ-503
    actors:
      primary: ACT-012
      secondary:
        - ACT-001
    process_step: PRC-06-03
    precondition: 관리 화면 경로와 system/admin 관리 서비스 API가 배포 대상에 선언되어 있다. Portal 업무 API는 ARCH-050의 별도 인증/권한 계약을 따른다
    trigger: 메뉴·API 카탈로그를 관리하거나 서비스 API를 호출한다
    main_flow:
      - 메뉴 트리와 API 카탈로그를 조회한다
      - 메뉴 액션과 API를 매핑한다
      - 메뉴를 유효 권한으로 필터링한다
      - 관리 service 요청의 현재 관리자 인증·API 등록·메뉴 매핑·액션 권한을 대조한다. Portal 세션으로 대신하지 않는다
      - 모두 맞을 때만 실행하고 접근 이력을 남긴다
    alternative_flows:
      - id: A1
        condition: 같은 API를 여러 메뉴가 사용
        flow:
          - SYS_MENU_API 다대다 매핑으로 각 메뉴 액션에 연결한다
    exception_flows:
      - id: E1
        condition: API 미등록·메뉴 미매핑·액션 불일치
        flow:
          - 403으로 닫고 업무 서비스를 호출하지 않는다
      - id: E2
        condition: 순환 트리·중복 URL·사용 중인 노드 삭제
        flow:
          - 변경을 거부하고 기존 트리를 보존한다
    postcondition: 관리 메뉴 노출과 관리 서비스 API가 같은 관리자 권한 데이터로 판정된다. Portal API는 별도 Portal 인증/현재 이용 조건으로 검사한다
    business_rules:
      - URL·역할명·메뉴 노출은 허용 근거가 아니다
      - 목표 API에는 system 모듈 경로를 한 번만 둔다
    sequence_design:
      status: CR-033 목표·미구현. 현재 interceptor의 사전 인가만으로 아래 원자성을 충족하지 않는다.
      scope: CR-033 현재 권한과 업무 확정
      contracts_from:
        - FEAT-501
        - FEAT-301
      diagrams:
        - title: 관리 API의 현재 권한 검사와 업무 확정
          mermaid: |
            sequenceDiagram
                actor A as 관리자
                participant D as 영역 선택/CSRF
                participant G as ADMIN 권한 보호
                participant DB as PostgreSQL
                participant S as 업무 서비스
                A->>D: 정확 method/path 요청
                D->>D: ADMIN 영역·CSRF·세션 문맥 확인
                D->>G: 서버 주체/세션/액션과 callback
                G->>DB: BEGIN + shared/exclusive 보호
                G->>DB: 현재 세션·계정·API/매핑/액션 재조회
                alt 세션/계정 불가 또는 권한 없음
                    G-->>D: 401 또는 403, callback 미실행
                else 원천 조회 장애
                    G-->>D: 503, 과거 권한 폴백 없음
                else 현재 허용
                    G->>S: 같은 트랜잭션 callback
                    S->>DB: 업무 저장·필수 이력/명령 결과
                    DB-->>G: COMMIT 후 보호 해제
                    G-->>A: 확정 응답
                end
                Note over G,DB: 회수 선행은 효과0, 저장 선행은 저장 유지
                Note over G,S: 외부 송신/장기 실행은 이 보호 안에서 기다리지 않음
          transaction_boundary: FEAT-501.auth_precondition·FEAT-301.admin_interface_v1을 따른다. 일반 관리 저장/필수 HIST는 같은 물리 트랜잭션이며 별도 REQUIRES_NEW 쓰기로 우회하지 않는다. 비동기 접수·외부 송신은 별도 인수 경계가 필요하고 현 배치 구현을 자동 적용 완료로 세지 않는다.
          verification: TC-5037/5038·TC-50110/50111. 현재 검사 제거, shared/exclusive 분류 반전, dirty 유실, 재조회 실패를 반례로 둔다.
          key: current-authority
          reading_order:
            - 위에서 아래로 접수·검사·확정 순서를 읽는다.
            - alt는 조건별 분기이며 거부된 분기에서는 다음 업무 효과를 실행하지 않는다.
            - 트랜잭션/큐 인계 경계와 현재 구현·목표 차이를 함께 대조한다.
  - id: UC-504
    name: "공통코드와 참조 코드의 무결성을 관리한다"
    workstream: system
    reqs: [REQ-504]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-07-01
    precondition: "관리 변경은 공통코드 관리 권한이 있고 공통 후보 조회는 기존 common 인증/세션 계약을 통과한다"
    trigger: "코드 그룹·코드·참조 정의와 값을 변경하거나 콤보 소비자가 후보를 조회한다"
    main_flow: ["그룹과 코드·참조 정의를 조회한다", "일반 그룹·코드와 참조값을 편집한다", "보호 여부·자식 존재·참조 정의를 검증한다", "코드명과 파생 참조값을 한 트랜잭션으로 저장한다"]
    alternative_flows:
      - { id: A2, condition: "참조 조건 공통 콤보 조회", flow: ["API-600에 그룹코드·참조코드·참조값을 전달한다", "FEAT-504.reference_combo_contract의 조인/활성/정렬 조건에 맞는 상세 코드만 반환하고 기존 코드명 표시를 사용한다"] }
      - { id: A1, condition: "참조 정의 추가", flow: ["정의된 참조 키의 동적 값 컬럼을 열어 함께 저장한다"] }
    exception_flows:
      - { id: E1, condition: "시스템 보호 그룹·코드 삭제 또는 비활성화", flow: ["저장을 거부한다"] }
      - { id: E2, condition: "자식 코드가 남은 그룹 삭제 또는 정의 없는 참조값", flow: ["전체 변경을 롤백한다"] }
