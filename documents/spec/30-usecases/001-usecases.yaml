      - { id: E2, condition: "기간·페이지 범위 초과", flow: ["조회하지 않고 검증 오류를 반환한다"] }
    postcondition: "원 이력을 바꾸지 않고 요청·결과·오류 연결을 확인한다"
    business_rules: ["이력 쓰기·삭제 API를 만들지 않는다", "민감 등급으로 명시한 상세는 각 HTTP 요청에서 현재 권한을 판정한다. 현 이력 화면의 상세 유형에 민감 등급이 없으면, 불변 이력의 화면 캐시는 각 화면 요건을 따른다"]

  - id: UC-508
    name: 배치 일정과 실행 수명주기를 운영한다
    workstream: system
    reqs:
      - REQ-508
    actors:
      primary: ACT-012
      secondary: []
    process_step: PRC-08-02
    precondition: BatchJob 구현이 레지스트리에 등록되어 있다
    trigger: 배치 일정을 저장하거나 실행·중단·이력을 요청한다
    main_flow:
      - 구현 후보·시간대·일정과 최근 이력을 조회한다
      - bean·cron·timezone·잠금·쿨다운을 검증해 저장한다
      - 분산 잠금을 획득해 이력을 시작한다
      - 완료·실패·중단 결과를 기록하고 잠금을 해제한다
      - 전체 이력과 상세를 조회한다
    alternative_flows:
      - id: A1
        condition: 실행 중 중단 요청
        flow:
          - 요청 시각을 기록한다
          - 작업이 안전 지점에서 중단을 확인하고 중단 결과를 반환하면 CANCELED로 기록한다. 정상 결과를 반환하면 SUCCESS를 유지한다
      - id: A2
        condition: 쿨다운 중 수동 즉시 실행
        flow:
          - 실행 중인 배치가 없는지 확인하고 쿨다운 락을 해제·재획득해 실행한다
    exception_flows:
      - id: E1
        condition: 미등록 구현·잘못된 cron/timezone·잠금 설정
        flow:
          - 저장을 거부하거나 실행 실패를 기록한다
      - id: E2
        condition: 스케줄 쿨다운·잠금 선점 실패·유령 실행
        flow:
          - 각각 SKIP_COOLDOWN·SKIP_LOCK·LOST로 구분한다
      - id: E3
        condition: 수동 즉시 실행 대상이 이미 RUNNING
        flow:
          - 새 실행을 시작하지 않고 현재 실행 정보를 반환한다
    postcondition: 각 실행 시도의 시작·종료·결과가 하나의 이력으로 추적된다
    business_rules:
      - 같은 배치의 중복 실행을 막는다
      - 쿨다운은 스케줄 실행에 적용하고 수동 즉시 실행은 우회한다
      - 중단 요청은 강제 종료나 완료 업무의 롤백을 뜻하지 않는다. 실제 작업 결과로 SUCCESS·FAIL·CANCELED를 확정한다
      - 모든 결과 코드를 명시된 묶음으로 분류한다
      - 'ADR-046 사용자 A: 이미 접수된 수동 배치는 계정 중지 뒤에도 계속 처리한다. 새 실행/중단은 현재 권한을 검사한다. FEAT-508.manual_admission이 접수 확정·큐 인계·실패의 정본이다.'
      - 'CR-033 목표: 중단·실제 종결·유실 판정의 같은 이력 행 경합은 FEAT-508.manual_admission.history_concurrency를 따른다. 최초 중단 시각과 실제 결과를 보존하며 LOST 판정 뒤 도착한 실제 결과의 교정은 유지한다.'
    sequence_design:
      status: 기존 배치 소스 기준선의 순서. CR-033 수동 접수의 보호 확장과 ARCH-028 배포 배정 차단은 후속 계약/구현이며 현 동작으로 완료 처리하지 않는다.
      source_evidence: BatchScheduleService.save, BatchScheduler.onChanged, BatchRunner.runNow/runScheduled/submit/execute, BatchHistoryWriter, BatchCancelService, BatchJobContext의 기존 구현.
      target_admission: 목표 수동 경로는 ADMIN shared guard→현재 계정/EXECUTE→lock/인계 정리 등록→같은 TX RUNNING→COMMIT→큐 제출이다. 아래 그림의 기존 REQUIRES_NEW start를 수동 경로에서 그대로 사용하지 않는다. 예약 경로와 작업 청크/finish는 기존 경계를 유지한다.
      scope: 배치의 기존 수명주기와 CR-033 목표 수동 접수 경계
      contracts_from:
        - FEAT-508
        - FEAT-501
        - ADR-046
      diagrams:
        - title: 배치 접수·독립 실행·협조 중단의 트랜잭션 경계
          mermaid: |
            sequenceDiagram
                actor A as 관리자/스케줄러
                participant S as 일정 서비스
                participant R as BatchRunner
                participant L as 분산 잠금
                participant H as 이력 저장
                participant J as 작업/청크
                A->>S: 일정 변경(관리 권한)
                S->>S: TX 검증·저장
                S-->>R: AFTER_COMMIT 일정 재조립
                A->>R: 수동 또는 예약 실행
                R->>L: cooldown 검사 + tryAcquire
                alt 예약 중복/쿨다운
                    R->>H: 별도 TX SKIP_LOCK/SKIP_COOLDOWN
                else 획득 성공
                    R->>H: REQUIRES_NEW RUNNING 기록
                    R->>R: heartbeat 시작·메모리 큐 제출
                    R->>J: 실행(전체 TX 없음)
                    loop 작업 청크
                        J->>J: 작업별 TX
                        J->>H: checkpoint의 별도 TX 중단 확인
                    end
                    A->>H: 별도 TX RUNNING 행 중단 요청
                    J-->>R: 실제 SUCCESS/CANCELED/FAIL
                    R->>H: REQUIRES_NEW 종결 기록
                    R->>L: finally heartbeat 종료·잠금 해제
                end
                Note over R,J: 요청 접수와 실제 중단 완료는 다름
                Note over R,H: 현 REQUIRES_NEW/메모리 큐는 권한 보호·배출 완료의 근거가 아님
          transaction_boundary: 일정 저장과 AFTER_COMMIT 스케줄 재등록, start/skip/finish 독립 이력, 장기 작업의 청크, cancel 요청을 구분한다. 수동 재실행은 이미 RUNNING이면 거부하고 예약 경합은 skip 이력을 남긴다. 중단 요청 뒤 정상 완료면 SUCCESS를 CANCELED로 덮지 않는다.
          verification: TC-5086~5089가 목표 인수 경계를, 기존 TC-5081~5085가 일반 배치 회귀를 검증한다.
          key: current-batch-lifecycle
          reading_order:
            - 위에서 아래로 접수·검사·확정 순서를 읽는다.
            - alt는 조건별 분기이며 거부된 분기에서는 다음 업무 효과를 실행하지 않는다.
            - 트랜잭션/큐 인계 경계와 현재 구현·목표 차이를 함께 대조한다.
        - key: manual-admission
          title: 목표 수동 접수의 보호와 큐 인계
          mermaid: |
            sequenceDiagram
                actor A as 관리자
                participant G as ADMIN 공유 보호
                participant D as DB/분산 잠금
                participant Q as 메모리 실행기
                A->>G: API-572 대상 목록
                G->>D: BEGIN + 현재 계정/EXECUTE 검사
                alt 회수가 먼저 확정
                    G-->>A: 401/403, 신규 접수0
                else 현재 허용
                    G->>D: 대상별 검증·잠금·RUNNING (REQUIRED)
                    D-->>G: COMMIT (접수 확정)
                    G->>Q: AFTER_COMMIT 인계
                    alt 인계 실패
                        G->>D: 해당 HIST_ID FAIL·잠금 정리
                    else 인계 성공
                        Q->>Q: 계정 중지 뒤에도 수락된 작업 계속
                    end
                end
                Note over G,D: DB rollback이면 RUNNING/큐0·획득 잠금 정리
                Note over G,Q: 장기 실행은 보호 밖, 새 중단은 별도 보호 명령
          transaction_boundary: 목표 수동 경로는 ADMIN shared guard→현재 계정/EXECUTE→lock/인계 정리 등록→같은 TX RUNNING→COMMIT→큐 제출이다. 아래 그림의 기존 REQUIRES_NEW start를 수동 경로에서 그대로 사용하지 않는다. 예약 경로와 작업 청크/finish는 기존 경계를 유지한다.
          reading_order:
            - 회수 선행과 접수 선행을 나눠 본다.
            - RUNNING 커밋이 접수 확정이고 큐 인계는 그 뒤다.
            - 큐 인계 실패와 장기 실행을 권한 보호 트랜잭션으로 합치지 않는다.
  - id: UC-509
    name: "공지와 관리 요청을 분리해 운영한다"
    workstream: system
    reqs: [REQ-509]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-08-03
    precondition: "화면 요청은 공지 또는 알림 요청 처리 권한이 있다. 외부 인사 통지 생산은 UC-049가 검증한 원천 사건과 FEAT-509 공개 포트를 사용하며 관리자 화면 세션을 위조하지 않는다"
    trigger: "공지를 게시하거나 관리 요청을 등록·판정한다. UC-049가 외부 인사 사건의 역할 기반 통지 생산을 요청한다"
    main_flow: ["게시·팝업 기간을 포함한 공지를 저장한다", "현재 시각에 맞는 공지만 제공한다", "사용자가 요청을 등록하고 상태를 조회한다", "관리자가 승인·반려와 사유를 기록한다", "결과를 사용자 알림함에 전달한다"]
    alternative_flows:
      - { id: A1, condition: "admin의 AI 품질·정책 처리 결과", flow: ["관리자 수신자에게는 admin이 system public 알림 계약으로 전달한다. Portal 수신자는 ARCH-050.portal_account_contract.audit_and_ui_state의 별도 영역/수신자 공개 계약으로 설계하며 SYS_USER 알림 FK를 재사용하지 않는다"] }
      - id: A2
        condition: UC-049 외부 인사 사건 처리에서 system 공개 통지 포트를 호출한다
        flow:
          - FEAT-509.external_change_notification에 따라 지정 역할의 현재 유효 관리자와 관련 조회 권한을 확인해 중복 없는 수신자를 결정한다
          - 같은 트랜잭션에서 PORTAL_CHANGE 알림을 저장하고 정확한 알림 ID를 UC-049 호출자에게 돌려준다. 계정 처리·사건 재수신과 통지 복구의 소유자는 integration이다
          - 기존 알림함에서 본인 수신 행을 조회·읽음 처리한다. 기존 종류·만료 예고·90일 파기는 유지한다
    exception_flows:
      - { id: E1, condition: "게시 또는 팝업 기간 밖", flow: ["사용자 팝업에 노출하지 않는다"] }
      - { id: E2, condition: "종결 요청 재처리 또는 실제 권한 변경 동반", flow: ["판정만 기록하고 계정·권한은 바꾸지 않는다"] }
      - { id: E3, condition: "A2의 유효 수신자가 정상 조회 결과0명", flow: ["NoRecipients를 반환한다. UC-049가 Portal 이용 중지와 통지 미완료 보존을 처리하며 system이 계정 처리나 자동 재전송을 추가하지 않는다"] }
      - { id: E4, condition: "A2의 현재 계정·역할·조회 권한 확인에 실패", flow: ["Unavailable을 반환하고 정상0명으로 바꾸지 않는다. 사건의 실패/재수신 처리는 UC-049를 따른다"] }
      - { id: E5, condition: "A2의 다수 알림 저장 또는 사건의 알림 참조 저장 실패", flow: ["같은 트랜잭션을 전체 롤백하고 저장 예외를 호출자에게 전달한다. 일부 알림이나 독립 커밋을 남기지 않는다"] }
    postcondition: "공지 노출과 요청 판정·알림이 추적되며 권한 변경과 분리된다"
    business_rules: ["요청 승인은 권한 부여가 아니다", "알림함은 수신자 자신의 행만 읽는다", "동일 요청의 동시 판정은 대상 행 잠금으로 직렬화하고 뒤 요청은 상태 충돌로 거부한다"]

  - id: UC-510
    name: "관리 콘솔 공통 사용자 상태를 한 곳에서 유지한다"
    workstream: "system"
    reqs: [REQ-510]
    actors:
      primary: ACT-001
      secondary: [ACT-012]
    process_step: "PRC-08-04"
    precondition: "관리자 계정으로 로그인했고 대상 관리 메뉴가 등록되어 있다"
    trigger: "즐겨찾기·그리드 설정·조회조건·메뉴 통계를 읽거나 저장한다"
    main_flow: ["호출 모듈이 system 공개 계약을 부른다", "세션 사용자와 상태 소유자를 대조한다", "사용자·메뉴 키로 상태를 읽거나 갱신한다", "같은 즐겨찾기 동시 등록은 모두 성공으로 끝내고, 기본 조회조건 변경은 사용자 단위로 직렬화해 마지막 저장 완료 요청 하나를 기본으로 둔다", "메뉴 트리에서 현재 셸 탭·셸 새 탭 또는 성공한 브라우저 새 탭·창으로 열면 월별 통계에 누적한다", "system/admin 관리 콘솔 영역에 같은 관리자 소유 값을 반환한다. Portal 세션과 같은 문자열 ID로 연결하지 않는다"]
    alternative_flows:
