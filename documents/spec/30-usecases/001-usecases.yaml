usecases:
  - id: UC-501
    name: "관리자 계정 상태와 접속 조건을 운영한다"
    workstream: system
    reqs: [REQ-501]
    actors: { primary: ACT-012, secondary: [] }
    process_step: PRC-06-01
    precondition: "관리자는 계정 관리 권한을, 로그인 대상자는 system 관리자 자체 계정을 가진다"
    trigger: "계정을 변경하거나 로그인·비밀번호·세션 동작을 요청한다"
    main_flow:
      - "관리자가 계정·사용 기간·접속 IP·잠금·휴면 상태를 조회하고 저장한다"
      - "로그인 시 존재·사용 여부·기간·잠금·휴면·IP와 해당 인증 수단의 검증 결과를 한 판정으로 검사한다. 로컬 계정은 기존 비밀번호 정책을 따른다"
      - "성공 시 세션과 현재 권한 버전을 발급하고 로그인 이력을 남긴다"
      - "비밀번호 변경·초기화·세션 종료에 이력과 만료 규칙을 적용한다"
    alternative_flows:
      - { id: A1, condition: "잠금 또는 휴면만 해제", flow: ["전용 명령으로 해당 상태만 해제한다"] }
      - { id: A2, condition: "비밀번호 분실", flow: ["재설정 코드를 검증해 일회용 토큰으로 변경한다"] }
      - { id: A3, condition: "관리자가 Portal 이용도 필요함", flow: ["admin Portal 사용자 관리에서 별도 Portal 계정을 등록한다. 관리자 계정은 연결/복제하지 않는다", "각 영역의 별도 로그인·계정·세션·권한으로 이용하며 한쪽 변경을 자동 동기화하지 않는다"] }
    exception_flows:
      - { id: E1, condition: "상태·기간·잠금·휴면·IP 중 하나라도 실패", flow: ["세션을 만들지 않고 내부 사유를 로그인 이력에 남긴다"] }
      - { id: E2, condition: "재사용 비밀번호·만료 토큰·다른 세션 소유자", flow: ["변경을 거부하고 기존 상태를 보존한다"] }
      - { id: E3, condition: "Portal 자격증명·세션·SSO 응답으로 관리자 인증/명령을 요청", flow: ["관리자 인증으로 수락하지 않고 관리자 계정·세션을 생성하거나 변경하지 않는다", "현재 관리자 인증과 관리 액션 권한을 별도로 확인한다"] }
    postcondition: "허용된 관리자 계정만 현재 관리 권한 버전의 관리자 세션을 가지며 이력을 보존한다. Portal 계정·상태·세션은 자동 변경되지 않는다"
    change_status: "CR-028 방향 승인·영역 분리 계약 미구현. ARCH-050.admin_account_contract와 security_domains에 따라 기존 관리자 자체 계정과 Portal 계정/인증 수락·세션·감사/설정 참조를 분리하는 상세 설계가 필요하다"
    business_rules:
      - "system의 계정 생성·신원 수정·비밀번호 변경/초기화·잠금 해제는 관리자 자체 계정에만 적용한다. Portal SSO/대상 계정/자체 모드와 계정 생애주기는 REQ-616·ARCH-050.portal_account_contract가 별도로 소유한다"
      - "SYS_USER는 물리 삭제하지 않는다"
      - "관리자 설정과 시스템 파생 상태를 섞지 않는다"
      - "설치용 admin의 초기 비밀번호는 admin이며 PWD_INIT_YN=Y·PWD_CHG_DTM=NULL로 둔다. 초기화 또는 주기 만료로 제한된 세션은 비밀번호 변경 성공 전 메인 화면·업무 API를 사용할 수 없다. 새 비밀번호는 기존 정책과 재사용 금지를 적용한다"
      - "초기 계정 보정은 기존 설치 시드의 비밀번호 해시가 그대로인 admin에만 새 changeset으로 적용한다. 보정된 대상의 기존 JDBC 로그인 세션도 종료해 재접속 시 변경을 강제한다. 사용자가 변경한 비밀번호·세션과 다른 계정은 보존하며, 세션 종료·새 해시·초기화 플래그·변경 시각은 같은 트랜잭션으로 처리한다"

  - id: UC-502
    name: "역할과 개인 예외를 유효 권한으로 합성한다"
    workstream: system
    reqs: [REQ-502]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-06-02
    precondition: "대상 사용자·역할·메뉴 액션이 존재한다"
    trigger: "역할 또는 메뉴 액션 권한을 부여·회수한다"
    main_flow: ["역할과 보유 사용자·메뉴 액션을 조회한다", "변경 전 영향 사용자를 확인한다", "역할·역할 권한·개인 예외를 저장한다", "영향 사용자의 공유 세션에 고유 무효화 표식을 남긴다", "후속 보호 요청이 표식과 업무일자를 검사해 현재 권한을 재계산하고 권한 내용 해시를 제공한다"]
    alternative_flows:
      - { id: A1, condition: "한 사용자가 운영·감사·AI 품질 역할을 함께 보유", flow: ["역할 조합을 금지하지 않고 데이터에 등록된 액션을 합성한다"] }
    exception_flows:
      - { id: E1, condition: "존재하지 않거나 사용 중지된 사용자·역할·메뉴", flow: ["저장을 거부하고 기존 권한을 유지한다"] }
      - { id: E2, condition: "무효화 표식 불일치·업무일자 변경·로그인 첫 보호 요청", flow: ["현재 계정 상태와 권한을 재계산한다", "회수된 액션은 403으로 거부하고 계정 사용 불가는 401과 세션 종료로 처리한다"] }
    postcondition: "역할명 하드코딩 없이 데이터와 유효 기간으로 현재 권한이 계산된다"
    business_rules: ["역할 묶음은 겸임 가능하다", "권한 변경 API는 SYS_LO_ACCESS의 일반 시스템 사용 이력에 포함하지만 부여·회수 전용 원장은 만들지 않는다", "같은 역할의 전체 권한을 동시에 저장하면 나중에 완료된 전체 스냅샷이 이기며 자동 병합하지 않는다", "계산 전에 관측한 표식과 결과를 한 속성으로 저장하고 변경 표식을 삭제하지 않는다. 뒤늦은 저장도 후속 회수를 지우지 않는다", "권한 버전은 내용 해시다. 이미 인가를 통과한 요청의 소급 취소나 권한 변경만으로 일괄 재인증을 요구하지 않는다"]

  - id: UC-503
    name: "메뉴와 서비스 API를 실패 폐쇄로 연결한다"
    workstream: system
    reqs: [REQ-503]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-06-03
    precondition: "관리 화면 경로와 system/admin 관리 서비스 API가 배포 대상에 선언되어 있다. Portal 업무 API는 ARCH-050의 별도 인증/권한 계약을 따른다"
    trigger: "메뉴·API 카탈로그를 관리하거나 서비스 API를 호출한다"
    main_flow: ["메뉴 트리와 API 카탈로그를 조회한다", "메뉴 액션과 API를 매핑한다", "메뉴를 유효 권한으로 필터링한다", "관리 service 요청의 현재 관리자 인증·API 등록·메뉴 매핑·액션 권한을 대조한다. Portal 세션으로 대신하지 않는다", "모두 맞을 때만 실행하고 접근 이력을 남긴다"]
    alternative_flows:
      - { id: A1, condition: "같은 API를 여러 메뉴가 사용", flow: ["SYS_MENU_API 다대다 매핑으로 각 메뉴 액션에 연결한다"] }
    exception_flows:
      - { id: E1, condition: "API 미등록·메뉴 미매핑·액션 불일치", flow: ["403으로 닫고 업무 서비스를 호출하지 않는다"] }
      - { id: E2, condition: "순환 트리·중복 URL·사용 중인 노드 삭제", flow: ["변경을 거부하고 기존 트리를 보존한다"] }
    postcondition: "관리 메뉴 노출과 관리 서비스 API가 같은 관리자 권한 데이터로 판정된다. Portal API는 별도 Portal 인증/현재 이용 조건으로 검사한다"
    business_rules: ["URL·역할명·메뉴 노출은 허용 근거가 아니다", "목표 API에는 system 모듈 경로를 한 번만 둔다"]

  - id: UC-504
    name: "공통코드와 참조 코드의 무결성을 관리한다"
    workstream: system
    reqs: [REQ-504]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-07-01
    precondition: "관리 변경은 공통코드 관리 권한이 있고 공통 후보 조회는 기존 common 인증/세션 계약을 통과한다"
    trigger: "코드 그룹·코드·참조 정의와 값을 변경하거나 콤보 소비자가 후보를 조회한다"
    main_flow: ["그룹과 코드·참조 정의를 조회한다", "일반 그룹·코드와 참조값을 편집한다", "보호 여부·자식 존재·참조 정의를 검증한다", "코드명과 파생 참조값을 한 트랜잭션으로 저장한다"]
    alternative_flows:
      - { id: A2, condition: "참조 조건 공통 콤보 조회", flow: ["API-600에 그룹코드·참조코드·참조값을 전달한다", "FEAT-504.reference_combo_contract의 조인/활성/정렬 조건에 맞는 상세 코드만 반환하고 기존 코드명 표시를 사용한다"] }
      - { id: A1, condition: "참조 정의 추가", flow: ["정의된 참조 키의 동적 값 컬럼을 열어 함께 저장한다"] }
    exception_flows:
      - { id: E1, condition: "시스템 보호 그룹·코드 삭제 또는 비활성화", flow: ["저장을 거부한다"] }
      - { id: E2, condition: "자식 코드가 남은 그룹 삭제 또는 정의 없는 참조값", flow: ["전체 변경을 롤백한다"] }
    postcondition: "공통코드·참조값·다국어 코드명의 무결성이 유지된다"
    business_rules: ["SYS_YN은 서버가 검사한다", "원본과 파생값은 같은 트랜잭션으로 정리한다"]

  - id: UC-505
    name: "생성된 메시지 키의 언어별 값을 운영한다"
    workstream: system
    reqs: [REQ-505]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-07-02
    precondition: "메시지 키가 소스 상수와 시드 생성기에서 등록되어 있다"
    trigger: "언어별 값을 변경하거나 번들을 요청한다"
    main_flow: ["생성된 키와 언어별 값을 조회한다", "값만 편집해 저장한다", "값과 캐시 버전을 한 트랜잭션으로 반영한다", "요청 언어 번들을 새 버전으로 제공한다"]
    alternative_flows:
      - { id: A1, condition: "요청 언어 값이 없음", flow: ["기본 언어를 사용한다", "두 언어 값이 모두 없으면 번들에서는 키를 생략하고 표시 계층이 키 또는 서버 오류 기본문구로 폴백한다"] }
      - { id: A2, condition: "생성 원천에서 사라진 키", flow: ["미사용 키 정리 대상으로 표시한다"] }
    exception_flows:
      - { id: E1, condition: "관리 화면에서 임의 키 생성", flow: ["요청을 거부한다"] }
      - { id: E2, condition: "값 저장 또는 버전 증가 중 하나가 실패", flow: ["둘 모두 롤백한다"] }
      - { id: E3, condition: "공개 번들 읽기 중 연속 변경", flow: ["DB 본문 조회 전후 버전을 최대 3회 검사한다", "계속 불일치하면 본문을 성공으로 전달하지 않고 409로 재조회를 요구한다"] }
    postcondition: "일반 서버 문구는 커밋 노드 후속 조회·다른 노드 TTL 안에 갱신되며 공개 번들은 반환 버전과 본문이 일치한다"
    business_rules: ["키는 관리 화면에서 만들지 않는다", "성공한 저장마다 버전을 한 번만 원자 증가시키고 동시 저장의 증가를 유실하지 않는다", "무효화 전에 시작한 적재 결과를 새 캐시에 재등록하지 않는다", "공개 번들은 일반 서버 문구의 TTL 캐시와 분리해 버전·본문을 검사한다. 브라우저의 기존 버전 비교 시점은 유지한다"]

  - id: UC-506
    name: "검증된 시스템 설정을 적용하고 되돌린다"
    workstream: system
    reqs: [REQ-506]
    actors: { primary: ACT-012, secondary: [ACT-001] }
    process_step: PRC-07-03
    precondition: "`sys-config.*` 아래 화면 노출용 설정 키와 배포 기본값·검증 규칙이 등록되어 있다"
    trigger: "공통 설정을 변경하거나 기본값으로 복원한다"
    main_flow: ["등록된 키의 배포 기본값과 DB 오버라이드를 합성해 조회한다", "기존 그리드에서 편집 가능한 값을 바꾸거나 되돌리기를 선택한다", "전체 후보의 타입·범위·상호 제약과 등록된 키를 검증한다", "오버라이드 변경과 기존 캐시 갱신 버전을 한 트랜잭션으로 저장한다", "소비자는 다음 작업 스코프에서 DB 오버라이드를 다시 합성한 값을 사용한다"]
    alternative_flows:
      - { id: A1, condition: "기본값 복원", flow: ["오버라이드 행을 삭제해 배포 기본값을 드러낸다"] }
    exception_flows:
      - { id: E1, condition: "형식·범위 오류 또는 미등록 키", flow: ["전체 저장을 거부한다"] }
      - { id: E2, condition: "설정 저장과 버전 증가 중 일부 실패", flow: ["트랜잭션을 롤백한다"] }
    postcondition: "검증된 DB 오버라이드가 저장되거나 삭제되어 배포 기본값으로 복원된다. 기존 캐시 갱신 버전도 함께 반영되고 다음 작업에서 변경된 유효값을 읽는다"
    change_status: "2026-10-30 CR-026의 미구현 설정 버전 확장을 철회하고 현행 기능을 그대로 재사용한다. 기대 버전 충돌이나 업무 승인과 설정 저장의 직렬화를 제공한다고 보지 않는다. admin 소유 승인/전결 규칙은 REQ-601·UC-003을 따른다"
    business_rules: ["미등록 키를 런타임에 만들지 않는다", "비밀값·임의 변경 금지 값은 `sys-config.*` 밖의 별도 프로퍼티 경로에 두며 목록·응답·저장 대상이 아니다", "설정값은 노드 캐시를 두지 않고 작업 스코프마다 DB 오버라이드를 다시 합성한다"]

  - id: UC-507
    name: "로그인·사용·오류 이력으로 사건을 재구성한다"
    workstream: system
    reqs: [REQ-507]
    actors: { primary: ACT-005, secondary: [ACT-012] }
    process_step: PRC-08-01
    precondition: "각 이력 메뉴의 READ 유효 권한이 있다"
    trigger: "기간·사용자·경로·결과로 이력을 조회한다"
