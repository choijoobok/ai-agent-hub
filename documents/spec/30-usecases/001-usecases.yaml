      - { id: E2, condition: "설정 저장과 버전 증가 중 일부 실패", flow: ["트랜잭션을 롤백한다"] }
    postcondition: "검증된 DB 오버라이드가 저장되거나 삭제되어 배포 기본값으로 복원된다. 기존 캐시 갱신 버전도 함께 반영되고 다음 작업에서 변경된 유효값을 읽는다"
    change_status: "2026-10-30 CR-026의 미구현 설정 버전 확장을 철회하고 현행 기능을 그대로 재사용한다. 기대 버전 충돌이나 업무 승인과 설정 저장의 직렬화를 제공한다고 보지 않는다. admin 소유 승인/전결 규칙은 REQ-601·UC-003을 따른다"
    business_rules: ["미등록 키를 런타임에 만들지 않는다", "비밀값·임의 변경 금지 값은 `sys-config.*` 밖의 별도 프로퍼티 경로에 두며 목록·응답·저장 대상이 아니다", "설정값은 노드 캐시를 두지 않고 작업 스코프마다 DB 오버라이드를 다시 합성한다"]

  - id: UC-507
