expectations:
  user_priority: balanced
  aligned_at: 2026-09-05
  j_curve_explained: true
  what_was_said: >-
    처음이 느리고 중간이 빠르고 끝이 다시 느리다. 설계 확정까지는 돌아가는 화면이 없고,
    구현 구간에서 기능이 빠르게 쌓이며, 검증 구간에서 다시 느려진다. **AI 를 쓴다고 총
    기간이 줄지는 않을 수 있다** — 줄어드는 것은 문서를 쓰는 시간이고 늘어나는 것은
    확인하는 시간이다.
  what_it_means: >-
    **균형**이다. 게이트는 지키되 산출물의 깊이를 상황에 맞춘다. 절차를 줄이자는 판단이
    나올 때 AI 가 *지금 줄일 수 있다 / 절대 안 된다 / 지금은 빨라도 나중에 비싸다* 셋으로
    나눠 제시하고 사용자가 고른다(aidd-guide/process/12-scope-reduction.md).
  reduced_scope:
    - agreed_at: '2026-11-11'
      decision: 앞으로도 반드시 필요한 중요한 테스트만 하도록 테스트 절차를 간소화한다.
      applies_to: 현재 SLICE-308의 남은 검증과 이후 모든 구현·수정 작업
      policy_ref: aidd-guide/quality/test-design.md §0
      changes:
        - 자동 변이 전수 실행·고정 점수와 모든 업무 규칙의 수동 반전을 기본 의무에서 제외한다.
        - 수정 중에는 관련 시험만 실행하고 비영향 통과 근거를 재사용한다. 통합 영향이 있을 때만 최종 전체 회귀 한 번을 수행한다.
        - 실제 DB·Redis·HTTP 시험은 해당 연결/원자성/장애 계약의 중요한 대표 사례로 제한하고 변이마다 반복하지 않는다.
      retained: 변경된 보안·권한·정합성·비가역 동작의 필수 반례, DB 변경의 적용/복구, 소유 게이트 승인, 실패의 정직한 기록은 유지한다.

