non_goals:
  - id: NGOAL-01
    title: "범용 챗봇이 아니다"
    why: "업무 시스템 조회·실행은 지식 기반 허용 범위를 유지한다. 지식 불필요 요청의 활용을 사전 열거로 제한하지 않으며 업무 연관성이 낮으면 REQ-101의 비업무 추정 감사로 관리한다"
    traces_to: [REQ-101]
  - id: NGOAL-02
    title: "레거시 업무 시스템의 대체가 아니다"
    why: "기존 시스템의 화면·기능을 없애지 않는다. 병행 사용한다"
  - id: NGOAL-03
    title: "LLM 이 업무 DB·WAS 에 직접 접근하지 않는다"
    why: "실행 주체는 항상 agent 다"
    traces_to: [PRN-02]
  - id: NGOAL-04
    title: "특정 업무 도메인 전용 기능을 내장하지 않는다"
    why: "업무 지식은 코드가 아닌 설정으로 표현한다"
    traces_to: [PRN-08]
  - id: NGOAL-05
    title: "데이터 웨어하우스 구축 자체는 범위가 아니다"
    why: "연동 대상으로만 취급한다"
  - id: NGOAL-06
    title: "멀티테넌시를 지원하지 않는다"
    why: "다중 시스템 연동은 한 고객사 내부에 한한다. 고객사당 독립 구축·독립 운영을 전제하며, 하나의 배포가 여러 고객사를 수용하지 않는다"
  - id: NGOAL-07
    title: "모바일 네이티브 앱은 제공하지 않는다"
    why: "Portal은 REQ-041의 PC·모바일 반응형 웹으로 제공한다. admin/system 관리 화면의 모바일 지원은 이번 범위 변경에 포함하지 않는다"
    traces_to: [REQ-041]
  - id: NGOAL-08
    title: "비 HTTP 연동 프로토콜을 지원하지 않는다"
    why: "실행 연동은 HTTP/HTTPS 표준 REST 하나로 고정하고, 그 외 수단(SOAP·gRPC·메시지 큐·소켓·파일 인터페이스)은 고객사가 REST 어댑터를 제공하는 것을 연동 전제로 한다"
  - id: NGOAL-09
    title: "저장된 조회를 사용자 간에 공유하지 않는다"
    why: "정의를 공유하면 실행은 각자의 권한으로 이루어져야 하고, 같은 위젯이 사람마다 다른 결과를 보이거나 누군가에게는 거부된다. 그 이유도 존재 은닉(REQ-101) 때문에 설명할 수 없다. 조직 차원의 공유는 **인증 예제 쿼리로의 승격**으로 처리한다"
  - id: NGOAL-10
    title: "조회 결과를 서버에서 파일로 생성하지 않는다"
    why: "표시 상한 안의 결과는 전량 브라우저로 전달되므로, 엑셀·이미지 내보내기는 그리드·차트 컴포넌트의 클라이언트 기능으로 제공한다. 서버가 파일을 만들 이유가 없다"
  - id: NGOAL-11
    title: "AI 처리 오류 알림의 이메일 발송과 범용 알림 전달은 이번 차수 범위가 아니다"
    why: "메일 서버가 없으므로 기존 개인 알림을 발송 통로로만 사용한다. 담당자 변경은 알림함 메시지 전달이 아니라 오류·품질 조사의 상태와 담당자 변경 이력으로 기록한다"

# ── 성공 기준 ────────────────────────────────────────────────
# **셋만 둔다**(G0 — 3개 이내). 사용자가 정확성·유효성·절제를 택했다(2026-09-05).
# **목표 수치를 미리 세우지 않는 것이 방침이다**(사용자 결정 2026-09-05).
# 순서는 *측정 방법을 만든다 → 정확히 잰다 → 개선이 필요한지 판단한다* 이며,
# 그래서 `target: null` 은 **빠진 것이 아니라 아직 재지 않았다는 뜻**이다.
# 재기 전에 세운 목표는 근거가 없고, 근거 없는 목표는 게이트에서 협상 대상이 된다.
# 동시 처리 성능·인스턴스 수 산정은 실측값을 근거로 결정한다(ASM-002).
