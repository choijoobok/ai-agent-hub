incidents:
  - id: RUN-201
    title: "API 권한 거부 원인 구분"
    symptom: "공개 정책·무인증·CSRF·유효 권한에 따라 403 또는 권한 오류가 발생한다"
    traces_to: [AUTHZ-091, API-540, SCR-511]
    procedure:
      - "API 카탈로그에서 주소 등록과 메뉴 매핑을 확인한다"
      - "호출 계정의 현재 유효 권한을 확인한다"
      - "쓰기 요청이면 CSRF 토큰과 요청 본문 검증 결과를 확인한다"
    verify: "공개 200, 무인증 service 403, CSRF 없는 admin service 403, 권한 보유 200, 권한 미보유 403의 P5 직접 호출 결과와 대조한다"
    rollback: "권한을 임의로 넓히지 않는다. 잘못 바꾼 정책은 변경 이력에서 직전 상태로 되돌린다"
    scope_note: "기존 검증은 관리자 system 인증/유효 권한의 기준선이다. CR-028의 별도 Portal 인증/세션은 미구현이며 Portal 오류는 해당 영역·인증 원천/현재 이용 상태로 진단한다. 관리자 권한을 넓히거나 관리자 세션을 Portal에 수락하는 복구는 금지한다"
    status: verified
  - id: RUN-202
    title: "YAML 연결 설정 누락과 저장된 실행 차단 진단"
    symptom: "관리 대시보드/API 목록에 시스템·연결 누락 또는 확인 필요가 있고 API/워크플로우의 새 호출이 설정 오류로 차단됨"
    traces_to: [REQ-601, REQ-604, API-071, SCR-001, SCR-004, SCR-525]
    procedure: ["현재 경고 원인/설정 세대·점검 범위를 확인한다. 실패/미지원 영향 건수를 0건으로 해석하지 않는다.", "대상 시스템에서 시스템 자체와 연결별 상태를 확인한다. 상단 집계 ON만으로 다른 유효 연결까지 사용 중지하지 않는다.", "누락이 의도한 제거인지 배포 오류인지 운영 담당자가 판단한다. 배포 오류는 올바른 환경/세대로 YAML을 복구·재기동/검증하고, 의도한 제거는 영향 API에서 유효한 명시 연결을 정정한다. 화면에서 기술 주소/비밀을 새로 입력하지 않는다.", "기존 신원 매핑/저장된 정의·이력을 보존하고 새 호출의 현재 사용/권한/신원 검사를 확인한다. 실패한 단계 앞의 완료 작업을 자동 재실행하지 않는다.", "성공 검증으로 원인 해소와 경고 사건을 확인한다. 수동 OFF는 유지하고 이미 전송된 업무는 실제 결과/멱등성 절차에 따라 별도 판단한다."]
    verify: "@defer P4/P5 — API070/071·기동 동기화·진단 제공자 및 실제 호출 통제 구현 후 누락/부분 조회/복구·기존 OFF·재시도/재개의 합성 및 통합 시험으로 검증한다."
    rollback: "검증되지 않은 과거 세대나 다른 연결로 자동 대체하지 않는다. 관리자 보완값·수동 사용 의도와 참조/감사를 보존한 채 승인된 배포 복구 절차를 따른다."
    scope_note: "2026-11-01 승인된 설계용 절차이며 현재 제품의 경고 서비스/워크플로우 구현 완료를 뜻하지 않는다."
    status: "draft"
