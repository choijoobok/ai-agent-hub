    scope: "REQ-304.batch_structure_comparison이 업무 판정 정본이다. 현재 설정된 데이터소스의 현재 유효 카탈로그에 등록된 정확 TABLE/VIEW만 비교한다. 전체 DB/스키마 탐색·신규 자동 등록·값 샘플 조회는 하지 않는다."
    schedule:
      batch_id: null
      bean_id: null
      seed_cron: null
      seed_timezone: null
      seed_use_yn: null
      activation: "제품 구현 후 운영자가 SCR-519에서 주기·시간대·사용 여부를 정한다. 기본 주기를 추정하지 않으며 DW 동기화 방식 참고 메모로 예약하지 않는다."
    parameters: "계획 입력은 비교 대상 데이터소스의 안정 ID다. 정확 형식·다중 대상 등록 방식은 P3 후속이다. 실제 비교 객체 목록은 실행 시 서버가 현재 등록 카탈로그에서 확정하며 임의 SQL/객체 목록·비밀 연결을 파라미터로 받지 않는다."
    permissions: "예약 실행의 승인된 운영 대상 범위와 현재 연결 계정의 스키마 메타데이터 조회 권한을 확인한다. 수동은 현재 HUB_DATA_SOURCE READ+비교 실행 권한이다. 화면 열람 권한과 접속 계정의 원천 메타데이터 권한을 구분한다. 판정/표시 조건은 REQ-304.batch_structure_comparison.summary를 따른다."
    processing: "고정 기준/설정으로 비교하고 대상별 결과 ENT-039와 현재 차이 ENT-040을 같은 성공 단위로 반영한다. 스케줄과 수동이 같은 비교 서비스를 사용한다. 비교 관측/갱신·성공 해소·범위/완전성은 REQ-304.batch_structure_comparison을 따른다."
    concurrency: "공통 batchId 락에 더해 데이터소스 단위 점유를 비교 서비스가 소유한다. 여러 배치 등록/수동 요청이 겹쳐도 동일 실행 안내·멱등·세대/기준 재검사로 오래된 결과 반영을 막는다. 공통 실행기의 현재 락만으로 충분하다고 가정하지 않는다."
    failure: "차이 발견은 실행 장애가 아니다. 비교 가능한 범위를 모두 처리한 경우 SUCCESS이며 업무 결과에 불일치/해당 없음/비교 대상 없음을 구분한다. 실제 접속/시간초과·확인 불가/부분 실패는 대상별 근거와 성공분을 보존한 뒤 공통 FAIL로 기록한다. 해당 없음만 있는 경우 장애 알림 대신 대시보드에서 제외 사유를 알린다. 실패를 0건 또는 일치로 덮지 않는다."
    cancellation: "대상 간 체크포인트에서 협조 중단하고 CANCELED를 반환한다. 이미 확정된 대상 결과는 유지하고 미완료 범위는 이전 차이와 미검사 근거를 보존한다."
    retry: "결과 불명은 실행 키로 확인한다. 재시작 시 현재 설정/기준을 다시 고정하고 성공 재비교한 범위만 갱신/해소한다. 과거 실행 기록은 보존한다. 기술적 체크포인트/시간 상한은 P3 후속이다."
    outputs: "ENT-039 대상별 실행/권한/확인 근거·ENT-040 현재 미해결 목록, resultSnapshot과 컬럼/인덱스 그룹 건수의 조회 투영. REQ-304.batch_structure_comparison.summary의 같은 그룹 단위를 SCR-002 두 탭·요약 및 SCR-525가 공유한다."
    observability: "공통 실행 이력과 admin 비교 runId를 연결한다. SCR-525에서 불일치/미검사/일부 확인/확인 불가/해당 없음을 알리고 정확 데이터소스의 SCR-002로 이동한다. system에 비교 이력을 추가하지 않는다. 원천 실패 근거는 비밀/업무값 없이 보존한다."
    sources: []
