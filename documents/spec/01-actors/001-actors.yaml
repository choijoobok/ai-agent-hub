actors:
  - id: ACT-001
    name: "업무 담당자"
    kind: human
    module: portal
    detail: "일상적으로 여러 업무 시스템을 오가며 조회·확인·실행하는 사용자. 자연어로 질의하고 결과를 받는다"
    goals: "화면을 찾아다니지 않고 목적을 말해 처리한다. 시스템 경계를 넘는 대조를 한 자리에서 한다"
    note: "**이 액터의 신뢰가 제품의 성패다.** 처리한 것을 믿을 수 없으면 원래 화면을 다시 열게 되고, 그러면 창구가 하나 더 늘어난 것에 그친다"

  - id: ACT-002
    name: "보안 담당자(정책 관리자)"
    kind: human
    module: admin
    detail: "사용자 그룹 정의 · 그룹 매핑 · 마스킹 · 행 스코프 · 전송 허용을 다룬다. **접근 범위 자체를 바꾸는 자리**이며 자기 권한 확대가 가능하다. 초기 스키마 카탈로그의 접근·마스킹·전송 정책이 적용됐는지를 제품 오픈 직전에 최종 승인한다"
    goals: "접근 범위를 업무에 필요한 만큼만 열어 두되, **자기가 넓힌 것을 자기가 감사하지 않는 상태**를 유지한다"
    scope: "admin 권한 관리 대분류 (MNU-A05~A09)"
    note: "**감사 열람 권한과 반드시 분리할 수 있어야 한다** — 정책을 넓혀 조회한 뒤 되돌리는 행위를 같은 사람이 감사하면 통제가 성립하지 않는다"

  - id: ACT-003
    name: "업무 자산 관리자"
    kind: human
    module: admin
    detail: "업무 분석가·데이터 관리자·개발 구현 상세를 아는 개발자 역할을 겸한다. 데이터소스·스키마 카탈로그·구현 상세와 업무 관계를 함께 파악해 **Hub에 공개할 뷰·테이블만** 골라 업무 명칭·설명·의미 유형·값 도메인, 권장 조인 경로, 지식·검색 태그·동의어와 인증 예제 쿼리를 등록·검수한다. DB/DW 변경 때 공개 범위 영향을 직접 판정하고 지식·카탈로그·매핑·예제 쿼리를 반영 세트로 묶는다. 기술 검토 액션 권한이 있으면 요청된 세트의 기술 정합성과 시험 근거를 확인하고 검토 완료·반려를 처리한다(REQ-305·306). 고객사 공동 오픈 근거가 있는 업무 REST API 계약을 Hub에 등록·갱신한다"
    goals: "테이블·컬럼의 업무 의미와 구현·업무 관계를 등록·검수해 **답의 정확도를 올리고 올바른 지식·SQL 예시를 만든다**. 권한을 넓히지 않고 정확도만 만들며, 원본 DB 전체가 아닌 공개 데이터 인터페이스만 Hub에 들인다"
    scope: "admin 연동 관리 · 업무 지식 관리 대분류 (MNU-A01~A04 · A10~A14)"
    note: "**정확도의 상한을 정하는 액터다.** 정확도가 메타데이터 품질에서 나오므로(PRN-10), 이 인력의 확보가 도입의 실질 비용이다. 정확도를 만들지만 권한을 넓히지는 않으므로 **현업 담당자에게 열 수 있어야 한다**"

  - id: ACT-004
    name: "운영·비용 관리자"
    kind: human
    module: admin
    detail: "외부 모델·단가·월별 개인 쿼터·초과 사용 승인·실행 제한·도구 노출을 다룬다. 한도와 모델을 정하고 월 청구 대조 근거를 제공한다"
    goals: "모델과 월별 사용 한도를 정해 사용량을 통제하고, 재경·회계가 정산할 수 있는 근거를 제공한다"
    scope: "admin AI 운영 · 비용 관리 대분류 (MNU-A15~A23)"

  - id: ACT-005
    name: "감사·품질 담당자"
    kind: human
    module: admin
    detail: "대화·조회·실행·정책 판정·정책 변경 이력을 열람하고 품질 신고와 AI 처리 오류의 상태·담당자·조치 이력을 관리한다. 지식·카탈로그·정책의 본문은 직접 수정하지 않는다"
    goals: "무슨 일이 있었는지 사후에 재구성하고, 원본과 구분한 검토·조사·회신을 통해 개선으로 잇는다. 원본 이력이나 업무 자산 본문은 직접 고치지 않는다"
    scope: "admin 품질 관리 · 감사·이력 대분류 (MNU-A24~A32)"
    note: "이 대분류가 그 자체로 개인정보 열람 경로다. system의 메뉴·액션 유효 권한을 독립 부여하고 업무 데이터 그룹과 구분한다(AUTHZ-090). 조회·검토·조사 처리 권한을 각각 확인하며 조회 권한이 다른 처리 권한을 대신하지 않는다"

  - id: ACT-014
    name: "업무 시스템 유지보수 담당자"
    kind: external_org
    module: integration
    detail: "연동 대상 업무 시스템의 스키마·기준정보·업무 규칙을 유지보수한다. Hub에 영향을 줄 수 있는 변경을 조직이 정한 협업 수단으로 업무 자산 관리자에게 알린다"
    goals: "자기 시스템의 변경이 Hub 지식·조회 품질에 미치는 영향을 사람이 검토할 수 있게 하되, Hub가 자기 시스템을 감시하거나 변경하게 하지 않는다"
    scope: "고객사 변경관리 절차 · 이메일·사내 메신저 또는 Hub 공지"
    note: "이 역할은 제품 연동 API가 아니다. 고객사 운영에서 정한 통지 책임과 채널이며, 통지를 받은 업무 자산 관리자가 PRC-09-04 영향 검수를 시작한다"

  - id: ACT-012
    name: "시스템 관리자"
    kind: human
    module: system
    detail: "계정·메뉴·역할·권한·공통코드·다국어 메시지·시스템 설정과 백오피스 공통 운영 기능을 관리한다"
    goals: "사용자가 필요한 화면과 API만 쓰게 하고, 공통 기준과 운영 상태를 한 관리 콘솔에서 일관되게 유지한다"
    scope: "현재 구현된 SYSTEM 하위 메뉴 화면 16개, 공통 대시보드 1개와 메뉴 없는 공통 화면 8개(REQ-501~510)"
    note: "현재 부트스트랩 역할 `ADMIN`의 표시명도 **시스템 관리자**다. AI 지식·정책을 관리하는 ACT-002~005와 이름이 비슷하지만, 이 액터는 제품 기반 계정·권한·공통 운영을 맡는다"

# ── 외부 시스템 ────────────────────────────────────────────────────
  - id: ACT-006
    name: "레거시 업무 시스템"
    kind: external_system
    detail: "연동되는 기존 업무 시스템. **복수를 전제한다**(GOAL-0). 읽기는 운영 DB·DW, 실행은 기존 공개 REST API 를 쓴다"
    goals: "자기 데이터와 기능을 내주되 **코드와 스키마는 바꾸지 않는다**. 누구에게 무엇을 줄지는 자기가 판정한다"
    provides: "운영 DB / DW 조회용 읽기 전용 계정 · 표준 REST API · 시스템 단위 연동 계정 · API 응답 스키마 명세"
    responsibility: "**이 사용자에게 어떤 행·컬럼을 돌려줄 것인가** — 전달받은 신원 파라미터로 자체 권한 검사를 수행한다. 파라미터 검증과 멱등성도 이쪽 책임이다"
    constraint: "코드·스키마 변경을 요구하지 않는다(PRN-09). REST 를 제공하지 않는 기능은 고객사가 어댑터를 마련하거나 연동 대상에서 제외한다"

  - id: ACT-007
    name: "모델 제작사 · 공급 경로"
    kind: external_system
    detail: "대화·추론 LLM 과 임베딩 모델. 폐쇄망에서 단일 아웃바운드 통로로 나간다. **둘을 가른다**(ADR-004) — 만든 곳(TRM-086)과 사서 호출하는 통로(TRM-087)"
    goals: "대화·추론·임베딩을 제공한다. **고객 데이터를 학습·저장하지 않는 것이 계약 조건**이다"
    constraint: "**고객 데이터의 학습·저장 미사용이 약관으로 보장되고 공인 정보보호 인증을 보유한 곳만** 선정 대상이며, **게이트웨이를 경유하면 제작사와 경로 둘 다 심사한다** — 데이터가 지나는 곳이 둘이다(CON-035). 경로·모델·effort 는 설정으로 교체된다(PRN-05)"
    note: "장애 자체를 극복하는 수단은 없으며 약속하지 않는다. 전환은 **수동 조치**다. **경로만 바꾸는 것도 전환이다** — 같은 모델을 다른 경로로 옮기면 단가가 달라진다"

  - id: ACT-008
    name: "인사 시스템 · 그룹웨어"
    kind: external_system
    detail: "사용자 변경 이벤트(퇴직·조직 이동)의 원천. 폐쇄망 내부에서 수신 REST API 를 호출한다"
    goals: "사람의 신분 변화(퇴직·조직 이동)를 알려 **권한이 누적되지 않게** 한다"
    why: "퇴직·조직 이동이 발생했는데 그룹 소속이 방치되면 **권한이 누적된다**"
    traces_to: [FEAT-305]

  - id: ACT-009
    name: "고객사 인프라 팀"
    kind: external_org
    detail: "아웃바운드 통로(방화벽 정책·프록시·목적지 허용 목록·전송량 제한)와 그 구간의 접속 로그를 구성·보유한다. **기술 운영 모니터링은 고객사 전사 표준 도구를 우선**하며, 도구가 없을 때의 기본 구성은 CON-037이 정한다"
    goals: "폐쇄망에서 밖으로 나가는 통로를 **통제된 형태로만** 연다. 통로를 여는 것이지 보장하는 것이 아니다"
    note: "**이 통로는 제품 기능이 아니다.** 우리가 제공하거나 보장하지 않으며, 연동 전제(인프라 요건)로 요구한다"

  - id: ACT-010
    name: "고객사 DBA"
    kind: external_org
    detail: "읽기 전용 계정의 권한 범위·리소스 한도, 그룹별 차등 뷰의 생성과 배치, 읽기 계정의 SELECT 부여를 담당한다. 고객사 변경관리 절차에서 DB/DW 변경 사실과 근거를 제공한다"
    goals: "업무 DB 를 읽게 열되 **운영 부하와 권한 범위를 자기 손에 둔다**"
    note: "**뷰 생성은 우리가 요구하는 것이 아니라 고객사가 선택하는 운영 수단이다** — PRN-09(변경을 요구하지 않는다)와 구분한다"

  - id: ACT-011
    name: "고객사 법무·보안"
    kind: external_org
    detail: "대화 이력의 보관 기간과 파기 방식, 응답 스키마의 개인정보 경로 식별 담당과 시점을 검토·확정한다"
    goals: "보관 항목·기간·파기 방식이 **법적 요건을 만족하는지 확정한다**. 시스템은 남길 수 있게만 해 둔다"
    note: "**보관 항목과 기간의 법적 요건은 이쪽 검토로 확정된다.** 시스템이 정하는 것은 '무엇을 남길 수 있게 해 두는가' 까지다"

# ── 모듈 (액터가 아니지만 통제 경계다) ─────────────────────────────
# 네 모듈은 **역할의 분리이지 배포 단위의 분리가 아니다** — 하나의 애플리케이션,
# 하나의 DB, 하나의 스키마로 통합 개발·배포한다. 상세는 20-architecture/_index.yaml.
# 설계·구현 진척을 작업흐름별로 나누는 것은 이 런타임 경계를 바꾸지 않는다(ADR-006).
