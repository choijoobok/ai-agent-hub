# ── 단계 게이트 — **현재 차수(`current.roadmap`)의 것이다** ────────
# status: not_started | in_progress | self_verified | approved
#
# **게이트는 차수마다 한 벌 돈다**(process/04-gates.md §5). 여기 있는 일곱은 지금 도는
# 차수의 게이트이고, 차수를 넘길 때 `phase-gate` 가 **아래 `roadmap_closed` 로 접어 넣고
# 일곱을 `not_started` 로 되돌린다.** 차수별로 표를 늘리지 않는 이유는 읽는 사람과 훅이
# *지금 어디인가* 하나만 물어보기 때문이고, 지난 차수는 요약 한 줄이면 족하다.
gates:
  P0_inception:    { status: approved, approved_at: "2026-09-05", note: "**Exit Criteria 8/8.** 목적 한 문장 · 성공 기준 셋(정확성 1 · 유효성 2 · 절제 3, 목표값은 ASM-002 로 P1) · 범위 In 7/Out 10 · 액터 11 전원 목적 보유 · 제약 44 · 트랙 full · 기존 시스템 병행 · 기대치 balanced. 안고 넘어간 것 셋은 아래 gate_note" }
  P1_discovery:    { status: in_progress, approved_at: null, note: "Hub 도메인 중립 프로세스 PRC-01~13과 요구사항은 정의되어 있다. 전역 G1은 각 작업흐름 P1의 통합 검증 뒤 승인한다. 2026-10-28 현재 차수 포함 요구사항 97건 중 must 84건(86.6%)으로 전역 상한 70%를 넘는다. 현재 범위 제외 REQ-615는 분모에서 제외했다. 우선순위를 임의로 낮추지 않고 전역 승인 전에 출시 범위·우선순위와 근거를 사용자와 조정한다. 첫 고객 실제 업무·적용 전 기준선 OQ-002는 파일럿 착수 조건이며 제품 G1을 막지 않는다." }
  P2_architecture: { status: in_progress, approved_at: null, note: "2026-10-29 CR-028·ADR-034의 공통 계정 철회/영역별 별도 인증 보안 불변식을 통합 재검증한다. 기존 재개방 기록: **2026-09-12 재개방.** 기존 백오피스를 system으로 분리하고 admin·agent·portal과 함께 4모듈 경계를 두는 ADR-007이 ARCH-003·010~014와 공통 인가·라우팅에 영향을 준다. 기존 G2 자체검증은 무효화했으며 정본·하네스 갱신 뒤 다시 검증한다" }
  P3_design:       { status: in_progress, approved_at: null, note: "system 범위의 30·31·40·50·60·70 설계와 핵심 시퀀스 3건은 작성됐다. admin·agent·integration·portal의 각 소유 범위는 아직 해당 작업흐름 단계에서 설계한다" }
  P4_build:        { status: not_started, approved_at: null, note: "**G4 기계 검사 셋이 다 초록이다**(2026-09-06) — 셋 다 빨갛던 것을 세는 법을 고쳐 닫았다. 아래 quality_baseline" }
  P5_verify:       { status: not_started, approved_at: null, note: "" }
  P6_deliver:      { status: not_started, approved_at: null, note: "" }

# ── 작업흐름 게이트 — **같은 차수 안의 모듈·계약별 성숙도** ─────────
# 로드맵은 무엇을 내는지, 전역 gates는 차수 통합 상태, 아래는 어디까지 성숙했는지를 갖는다.
# P0/G0과 G6은 전역이다. 소스 쓰기는 기능을 소유한 작업흐름 P3_design 승인으로 열린다.
workstreams:
  system:
    phase: P3
    required_in: [RM-P1]
    blocked_by: []
    deferred_until: null
    gates:
      P1_discovery:    { status: approved, approved_at: "2026-09-12", note: "**사용자 승인 · Exit Criteria 8/8.** ACT-012, PRC-06~08, REQ-501~510을 현재 소스·Liquibase·화면 문서에서 역추적했다. SYSTEM 하위 16개·공통 대시보드 1개·메뉴 없는 공통 화면 8개와 근거 테이블 31개를 대조했고 추적성 오류 0건이다. 레드팀에서 전 수명주기·변조 불가·소스 키 한정·요청 승인이라는 과잉 표현을 현재 구현 범위로 바로잡았다. 역질문 권장안에 따라 설치용 ADMIN은 설치 시점의 전체 권한 기준선으로 한정하고, 운영에서는 시스템 관리자와 감사·품질 역할을 분리한다. 일반 계정·권한 공지와 요청은 system, AI 품질·정책 관련 알림은 admin이 소유한다" }
      P2_architecture: { status: in_progress, approved_at: null, note: "2026-10-29 CR-028·ADR-034로 계정·인증/인가·진입 경계만 재개방했다. 사용자 명시 변경 방향은 승인됐으나 영향 G2 재승인은 별도다. 다른 범위의 이전 승인 근거는 유지한다. 이전 기록: **사용자 승인 · Exit Criteria 8/8.** ADR-007 아래 ARCH-022~026으로 system의 백엔드·프론트 목표 경로, 31개 테이블 쓰기 소유권, 화면 경로와 기능별 이행 순서를 정의하고 AUTHZ-091로 설치용 ADMIN과 운영 권한을 분리했다. 사용자는 역할 겸임을 허용하고 특정 역할·메뉴 코드의 금지 하드코딩을 거부했다. 역할·메뉴·개인 권한 데이터와 유효 권한이 유일한 판정 근거다. 현재 고객이 없는 개발 단계이므로 신규 경로 전환과 회귀 시험 뒤 기존 API·화면 경로는 같은 슬라이스에서 즉시 제거하고 호환 별칭을 남기지 않는다. ASM-005·006은 기각됨으로 닫았다" }
      P3_design:       { status: in_progress, approved_at: null, note: "2026-10-29 CR-028이 CR-027의 공통 계정 방향을 철회했다. 관리자 자체 계정과 별도 Portal 계정/인증의 수락·세션·API/감사 참조 분리를 영향 상세 설계한다. 2026-10-30 CR-026의 미구현 설정 버전 확장은 철회하고 기존 기능을 그대로 재사용한다. 계정 계약의 재검토와 현재 게이트 상태는 유지한다. 기존 이력: 2026-10-27 CR-026·027 방향 승인으로 계정/설정의 영향 상세 설계만 재개방했다. 당시 추가된 미구현 TC 6건 중 설정 확장3건은 철회했으며 계정 계약은 CR-028로 대체됐다. 기존 승인 근거: **사용자 승인 · Exit Criteria 11/11.** REQ-501~510을 UC-501~510·FEAT-501~510·ENT-501~531·API-501~599·SCR-501~525·TC 52건으로 연결했다. 실제 컨트롤러 99개와 목표 API의 요청·응답 타입·근거 메서드를 전수 대조했고 누락·중복 0건이다. 핵심 시퀀스는 UC-501·503·508 세 건이며 예외와 트랜잭션 경계를 표시했다. 권한 변경 API는 SYS_LO_ACCESS의 일반 시스템 사용 이력에 남기되 전용 원장은 고객사 요구가 생긴 도입 시점 이후만 기록하고 과거 변경은 복원하지 않는다. 같은 역할을 동시에 전체 저장하면 나중에 완료된 스냅샷이 이기고 자동 병합하지 않는다. 레드팀 위험은 사용자 결정과 TC-5076·TC-5026으로 닫았고 trace 오류 0건이었다" }
      P4_build:        { status: not_started, approved_at: null, note: "CR-026의 설정 확장은 철회했고 CR-027은 CR-028로 대체됐다. 남은 계정 변경분의 구현은 아직 시작하지 않았다. 기존 소스의 승인 이력은 변경 전 기준선 근거이며 새 목표의 완료를 뜻하지 않는다. 기존 승인 근거: 사용자 재승인. CR-019로 재개방한 sample local 전용 코드·프런트·시드·Liquibase 기준선 분리를 재검증했다. 제품 번들은 sample을 제외하고 local은 여섯 화면을 포함하며, 전체 백엔드·프런트(88파일·688테스트)·시드·품질·추적성·문서 검사를 통과했다. SampleRules PIT는 변이 3개를 모두 제거했다. 실제 DB 설치·성능·번들 경고 영향은 P5에서 검증한다." }
      P5_verify:       { status: not_started, approved_at: null, note: "CR-026 철회와 CR-027 대체 뒤 남은 CR-028 계정 변경분의 계약·회귀·이행/배포 검증은 후속이다. 기존 승인 근거: **사용자 승인 · Exit Criteria 6/6.** 실제 빈 PostgreSQL 설치·product/local 기준선·product 백업/복구·JPA validate·API 인가 경계·운영 흐름을 검증했다. 잔여 5건은 RoleAuthServiceTest·AuthorizationInterceptorTest·CodeAdminServiceTest·ConfigServiceTest 재실행으로 닫았고, 전체 백엔드 check와 프런트 lint·타입 검사·테스트도 통과했다. system 소유 NFR은 0건이며 다른 작업흐름 NFR은 전역 G5 대상이 아니다. system 범위 trace 오류·경고 0건, Critical/High·Medium 이하 잔여 결함 0건이다. 실제 배치 자연 실행은 RUN-101 운영 관찰로 남긴다. P6에서 정본으로 생성물 전체를 다시 만들어 문서 생성 완전성 검사(ID 567개·장문 필드 1,980개)가 모두 누락 0건으로 닫혔다." }
