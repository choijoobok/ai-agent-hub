# ── 미결 질문 (Open Questions) ─────────────────────────────────────
# 사용자 답변이 필요한 것. 답변되면 삭제하고 결과를 spec·ADR 에 반영한다.
open_questions:
  - id: OQ-002
    phase: P5
    question: "첫 고객 파일럿에서 어떤 실제 업무를 1차 적용하고, 적용 전 처리 시간·건수를 어떻게 측정할 것인가 (CON-017)"
    status: "**범위가 바로잡혔다(2026-09-11).** WMS(창고관리)·TMS(운송관리)는 고정된 1차 연동 대상이 아니라, 기존 구축 고객과 업무 지식에 접근하기 쉬워 **초기 영업·검증에 유리한 후보**다. Hub 는 특정 업무 시스템에 맞추지 않는다. 이 질문에 남은 것은 첫 고객 파일럿의 **실제 적용 업무 선정과 적용 전 처리 시간·건수 실측**이다"
    blocked_on: "첫 고객 파일럿 확정"
    required: true
    impact: "첫 고객 파일럿의 To-Be 프로세스 · 성공 기준의 실제 기준선(SUC-01) · 고객별 메타데이터 구축 범위(CON-016)"
    reversal_cost: medium
    note: >-
      **이것은 현재 제품 범위를 고르는 질문이 아니라 고객 파일럿의 착수 조건이다.** CON-017 은
      *실제 적용 업무를 고르고, 그 업무의 순서를 AI 기준으로 다시 그리고, 붙이기 전
      처리 시간·건수를 재 둔다* 를 요구한다 — 셋 다 실재하는 고객 업무와 담당자가 있어야
      한다. 범용 Hub 의 프로세스는 도메인 중립으로 정의하되, 고객별 To-Be 프로세스와 기준선은
      고객이 정해진 뒤에만 만든다.
    blocks: >-
      **범용 Hub 의 P1·P2 를 막지 않는다.** 첫 고객 파일럿의 착수와 그 고객에 대한
      SUC-01(실제 업무에서 효용을 검증하는 성공 기준)의 기준선 확정을 막는다.
    next: >-
      첫 고객 후보가 정해지면 **시스템 경계를 넘는 업무 빈도 · 반복 수작업 · 처리 건수 ·
      메타데이터 확보 가능성**으로 1차 업무를 고르고 적용 전 값을 잰다. 우리 WMS·TMS 구축
      고객은 접근성이 좋아 우선 후보지만, 그 사실이 제품의 연동 범위를 제한하지 않는다.
