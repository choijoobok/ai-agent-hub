# ── G4 기계 검사 (2026-09-06 · 셋 다 초록) ────────────────────────
# `node .claude/hooks/quality-check.mjs` — 소스 983개 / 코드 44,170라인
#
# **임계는 세 번 다 그대로였다**(5% · 0 · 0 — CLAUDE.md §5-10). 고친 것은 *무엇을 세는가*
# 이지 *얼마까지 봐주는가* 가 아니다. 셋이 빨갛던 것은 코드가 나빠서가 아니라
# **검사가 셋 다 틀리게 세고 있었기 때문**이었고, 그 사실 자체가 이 게이트의 첫 소득이다.
quality_baseline:
  measured_at: 2026-09-06
  duplication_pct: 2.91       # 임계 5% — 12.66 → 7.4 → 6.95 → 2.91
  duplication_finding: >-
    **세 번 내렸고 이유가 다 다르다.** ① `import`·`package` 를 코드로 세지 않게 고쳐
    **12.66 → 7.4** — 같은 배럴을 여는 컨트롤러 열셋은 같은 줄로 시작하지만 그것은 복사가
    아니라 *같은 것을 쓰는 것* 이다(672 그룹 중 282 가 순전히 import 였다). ② 진짜 복사였던
    `confirmDiscard` 열세 줄 일곱 벌을 `useConfirmDiscard` 로 올려 **7.4 → 6.95**.
    ③ **같은 줄을 여러 번 세고 있었다 — 6.95 → 2.91.** 6줄 창을 한 줄씩 미끄러뜨리므로
    7줄짜리 복사 한 곳이 창 둘에 걸리고, 창마다 더하면 23벌짜리 `*ErrorCode` 가 **264줄**로
    세어진다(참값 154). 창을 덩이로 접고 덩이마다 가장 긴 한 벌을 남기게 고쳤다 —
    **임계 5%가 온 GitClear 의 측정이 원래 그렇게 센다.** 다른 자로 재고 같은 눈금을
    읽고 있었다.
    **셈이 맞으니 성격별 제외는 필요 없었다.** 계산해 두기는 했다 — 언어가 요구하는 것
    (enum·JPA 선언)과 표준이 요구하는 것(화면 뼈대)을 빼면 1.21% 다. **빼지 않는다**:
    2.91% 로 이미 통과하고, 예외 목록은 늘어나면서 게이트를 조용히 비우기 때문이다.
    남은 2.91% 의 절반은 화면 뼈대이며(17벌 × 68줄) 그것은 §8 이 *같기를 요구하는* 것이다.
  swallowed_errors: 0         # 임계 0 — 면제 1건이 보고에 선다
  swallowed_finding: >-
    **닫혔다(2026-09-06).** `BatchGhostSweeper.sweepQuietly()` 는 삼키는 것이 맞고 이유도
    소스에 있었다 — `scheduleWithFixedDelay` 는 작업이 던지면 다시 부르지 않으므로 올려
    보내면 청소가 영영 멈춘다. `@swallow <이유>` 를 catch 위에 달고 검출기가 읽는다.
    **명단이 아니라 표시다**(`feat-baseline` 은 빚이고 `FEATURELESS` 는 영구 규칙인 것과
    같은 갈림). **이유 없는 태그는 인정하지 않고, 면제도 보고에 뜬다** — 조용히 사라지면
    그것은 면제가 아니라 검사를 끈 것이다.
  untagged_files: 0           # 임계 0 — 2026-09-05 에 층 규칙(FEATURELESS)으로 닫혔다
  untagged_finding: >-
    **닫혔다.** 기능 없는 층(core·support·bootstrap·shared·layouts·app·locales·진입점·빌드)은
    `lib.mjs` 의 `FEATURELESS` 가 영구 규칙으로 덮고, 템플릿이 남긴 기능 코드의 빚만
    `feat-baseline.txt` 가 갖는다. 두 게이트가 **같은 규칙을 읽는다**.
  note: >-
    **맞출 두 수가 애초에 없었다(2026-09-06 닫음).** `817` 은 소스 개수인 적이 없다 —
    2026-09-05 의 `@feat` 경고 건수였고, 그날 면제 명단과 층 규칙으로 닫은 그 수다.
    그것을 여기 옮기며 *두 게이트가 소스를 다르게 센다* 로 잘못 읽었고, 그 오독이
    미룬 것으로 굳어 있었다. 실제 값은 `quality-check` 983(테스트 158 포함) ·
    `trace-check` 의 T10 대상 825(테스트 제외) · 면제 명단 600줄 · 미태깅 0 이다.
    **둘은 갈린 것이 아니라 원래 다른 것을 센다** — 하나로 맞출 대상이 아니고,
    보고할 때 *무엇을 세는지* 를 함께 적으면 된다.
    **G4 셋이 초록이 됐다고 P4 가 열리는 것은 아니다** — 기계가 세는 부분일 뿐이고,
    게이트는 사용자 승인이 연다(CLAUDE.md §5-2).

