        mockup_draft:
          status: in_progress
          admin_direct_change_review: "2026-10-31 사용자 결정 ADR-037에 따라 관리자 간 자산/권한·그룹 부여 승인과 지식 영향 검토 제품 절차를 철회했다. 현재 대상별 변경 권한·자기 기준 리비전·참조/SQL/API 기술 검증 후 현재값·전후 이력·행위자/시각/사유를 원자 저장한다. Portal발 신청/관리자 판정과 실행 사용자 확인은 유지한다. 연결 지식은 사용처 조회이며 업무 의미 검토는 운영 조직의 자체 절차다. 아래 기존 승인/검토 관련 검증 기록의 현행 정책은 이 결정으로 대체된다. 독립 검토의 저장 순서·Portal 전결 잔재·미래 월 예시·태그 의미 검토 잔재를 해결했다. 도구시험94개·추적성 오류0/후속 경고159·하네스/lint 통과, 목업59개 어긋남0이다. 생성258개·정본ID1023/장문12318 누락0·깨진 링크0, 최종 설계337/사용자18/운영9장과 독립 설계HTML을 생성했다. Edge에서 변경13화면/63탭의 독립57·최종HTML80개 검사와 직접 저장 시퀀스2개·보기 설정·현재 문서만 인쇄를 확인했고 페이지 오류0이다. 기존 전체 사이트 회귀 유예와 화면별 요건 매핑27개 후속은 유지한다. 제품 구현·계획TC214개의 실제 실행·사용자 화면/G3 승인을 뜻하지 않는다."
          portal_user_review: "2026-10-31 사용자 요청과 최종 신원 무승인 결정을 반영했다. Portal의 로그인 아이디 중심 표시·사용기간·비밀번호 동등 정책·감사 넷·스위치와 다섯 탭을 정의하고 데이터소스/대상 시스템 기준정보에서 필요한 아이디만 직접 설정하도록 했다. 그룹 추가 승인만 SCR-037에 남기고 ADR-036 및 연결 정본을 맞췄다. 독립 검토의 최초 등급 입력/비활성 선등록·기간과 배분 자격·잔존 승인 문구 세 지적을 해소했다. Edge 독립/최종 HTML 126개 조작·공통 도구 시험47개·문서/목업/HTML 검사 통과, 추적성 오류0/기존 단계 경고184. 전체 사이트 도표 회귀의 유예는 html_delivery_review를 유지하며 제품 구현·사용자 화면/G3 승인은 별도다."
          user_group_mapping_review: "2026-10-31 사용자 요청으로 SCR-006 하단을 사용자·지식·스키마 카탈로그·API·커스텀 도구 다섯 매핑 탭과 활성 설정 스위치로 정의했다. 원 소유 부여/회수·자산 후보/승인·현재 접근 효력을 분리하고 그룹/탭별 입력·선택을 유지한다. 독립 검토의 저장 버튼 중복·왕복 선택 누락을 보완했으며 Edge 독립/최종 HTML 108개 조작·관련 도구 시험과 요건/목업/HTML 검사 통과. TC-0061~0068은 후속 제품 검수 계획이며 실제 저장/승인·제품 구현·사용자 화면/G3 승인은 별도다."
          model_usage_selection_review: "2026-10-31 사용자 요청으로 SCR-062의 행 선택 체크박스를 제거하고 단일 행 클릭 선택으로 변경했다. 요건·기존 검수 사례·목업과 최종 HTML을 갱신했다. 요건 매핑/목업/HTML 구조·공통 문서 검사 통과, 추적성 오류0/기존 단계 경고185. 실제 Edge 통합 HTML에서 모든 상태의 행 선택 체크박스0·단일 선택·다른 두 행 수정 보존·페이지 오류0을 확인했다. 제품 구현·사용자 화면/G3 승인과 구분한다."
          foundation_mockup_recovery: "2026-10-31 사용자 제보로 최종 HTML의 공통 기반 5개 목업 누락을 확인했다. 요건서의 목업 상태는 남아 있으나 로컬 파생 파일이 없는 상태를 빌더가 빈 안내문으로 처리한 것이 원인이었다. 같은 조건의 누락41개를 화면별 생성·검사해 복구했고 준비된46개 목업 원본/최종 HTML 누락0을 확인했다. 빌드 전 누락 검사·기존 HTML 보존과 생성 후 포함 검사를 추가하고 공통 스킬을 동기화했다. 관련 시험5개, 실제 누락 빌드 종료1·기존 HTML SHA256 동일, HTML 구조검사와 Edge 공통 기반7화면/12탭·페이지 오류0을 확인했다. 전체 사이트 도표 회귀 미완료는 기존 html_delivery_review를 따른다. 제품 구현·사용자 화면/G3 승인과 구분한다."
          html_delivery_review: "2026-10-31 사용자 요청으로 목업 신설·수정은 최종 HTML 생성·검사까지 한 번에 수행하도록 공통 화면 절차·목업 스킬을 갱신하고 Claude/Codex 생성본을 맞췄다. 기존 build/deliverables의 설계371장·사용자18장·운영9장을 재생성했으며 manifest 문제0·구조검사와 SCR-015/016 삽입 목업의 가격 탭/모델 선택/월1일 가격/읽기 전용/실적 탭을 실제 Edge에서 확인했다. 전체 사이트 browser-check는 데이터 모델 표시 확인 뒤 8분 이상 종료되지 않아 중단했다. 변경 두 화면의 별도 통합 검증은 통과했으며 전체 도표/테마/인쇄 회귀 통과로 간주하지 않는다. @defer 다음 전체 HTML 공통 동작 검증 때 — 전체 browser-check의 대기 원인을 확인하고 재실행한다. 제품 구현·화면/G3 승인과 구분한다."
          model_price_review: "2026-10-31 사용자 요청과 월1일 기준 선택을 반영해 SCR-015 하단 적용 시작일별 공유 가격 이력과 SCR-016 실적/가격 스냅샷 초안을 연결했다. 미래 가격은 새 리비전 정정·과거 사본 보존, 적용 가격은 새 시작일 변경이다. 독립 검토의 미래 오입력 정정 경로·추가 캐시 단위 후속을 보완했다. 두 화면 요건 매핑/목업 검사, Edge 1366·1920폭 조작22개, 생성기 시험40개·선택 문맥 반례 실패 확인, 하네스/self-test/lint·추적성 오류0(기존 단계 경고185)을 확인했다. 추가 계량 단위 입력 상세화는 해당 요건서에 남겼으며 제품 구현·화면/G3 승인은 후속이다."
          alignment_review: "2026-10-30 사용자 요청으로 작업 버튼의 우측 정렬을 공통 목업 서식과 생성기/스킬에 반영했다. 기존25목업 재생성·어긋남0, Edge1366/1920폭의 작업줄6·그리드툴바76·모달 하단 우측 정렬을 확인했다. 제목/건수는 왼쪽이며 탭/셀 탐색 배치는 유지한다. 관련 도구시험40개·하네스/self-test/lint/추적성 오류0(후속경고188), 실제 Claude 세션 trigger 시험과 제품 UI 구현은 후속이다."
          reference_mapping_review: "2026-10-30 사용자 확정 방향으로 지식→태그/카탈로그/예제/API/도구를 안정 ID 매핑으로 정리했다. 외부 리비전 상승에 따른 자동 반려·매핑/지식 리비전 동기화를 제거하고 자산 승인에서 적용/미종결 제출 지식의 본문·사용 설명·보완 판단과 요청 연결을 확인한다. 자기 BASE_REVISION·권한/필수 참조·SQL/API 기술 검증·실행 당시 버전 고정/기록은 유지한다. 독립 의미 검토의 제출 연결 누락·기술 참조 범위·UC 후조건을 보완해 잔여 발견0, 검수 사례10개 추가. 도구시험9개 통과·추적성 오류0/후속 경고187을 확인했다. 제품 구현/실제 승인·동시성 시험과 화면 최종 합의는 후속이다."
          next: "직접 변경 정책을 반영한 원 화면37개·상속 이력17개의 최종 HTML을 사용자와 검토하고 전체 업무 흐름을 합의한다. 화면별 미작성 요건 매핑27개와 기술 상세는 후속이며 사용자 화면 승인이나 G3 승인을 대신하지 않는다."
