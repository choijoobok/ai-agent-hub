        - "@defer 고객 IF-006 운영 검수 — SourceChangeVerifier 구현/실제 원천 시험, 수신 역할·상세 READ 권한·유한 사건 보존/조사 보호 정책을 연결한다. 검증기 미설치503, 보존 정책 미설치 파기 비활성이다."
        - "@defer 고객 운영 검수 — 역할0명은 이용 중지+통지 pending이며 재전송으로만 복구한다. 자동 outbox/재전송 배치·신규 입사 자동 등록은 승인된 범위에 없다."
      g4:
        status: approved
        approved_at: "2026-11-14"
        approval_basis: delegated_progress
        technical_exit_criteria: 제품 공통 범위의 기술9/9 충족. 구현/검증 결과와 위험을 상태에 기록하고 부재 중 권장안 결정·다음 작업·커밋/푸시의 사용자 명시 위임으로 기술 G4를 처리한다.
        user_screen_acceptance: not_applicable_server_slice
        unresolved_assumptions: 공통 수신 범위의 미결 전제 없음. 고객 운영 어댑터/설정은 명시 운영 검수 항목이다.
        decision_card:
          - 퇴직과 조직 이동은 기존 외부 연동 사용자의 이용을 중지한다. 신규 입사를 자동 등록하지 않는다. 변경 비용은 중간이다.
          - 알림 받을 관리자가 없어도 이용 중지는 확정하고 통지를 미완료로 남긴다. 변경 비용은 높다.
          - 같은 사건을 다시 보내면 효과를 반복하지 않고 미완료 알림만 복구한다. 변경 비용은 높다.
          - 보존 기한은 고객이 정하며 기록을 지운 뒤에도 같은 사건의 재실행을 막는다. 변경 비용은 높다.
        reverse_question: 복귀 후 실제 인사 연동 담당·수신 역할과 미통지 사건의 보존 종료 기준을 검토한다. 제품 구현은 사용자 위임대로 계속한다.
