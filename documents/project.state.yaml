  # ADR-005 결론은 규모가 아니라 임베딩 off 구성과 규모 무관 이중화 비용을 핵심 근거로 유지한다.
  - { at: "2026-09-10", by: "[AA]", what: "**ADR-005 가 승인됐고 spec 으로 내려보냈다 — 결정이 문서에만 있으면 구현이 그것을 모른다.** ① **CON-001 에 pgvector 확장을 명시**하고, 근거 문장을 *폐쇄망 구성요소를 늘리지 않기 위함* 한 줄에서 **요지 둘**로 바꿨다(끈 고객사의 잉여 구성요소 · 규모와 무관한 이중화 비용). **대안 비교는 옮겨 적지 않고 ADR 을 가리킨다** — 두 곳에 적으면 두 사실이 된다. ② **재검토 신호를 spec 에 실었다**(`review_signal`) — ADR 안에만 두면 *결정할 때 본 문서* 로 남고, 나중에 증상이 보일 때 아무도 그 문서를 열지 않는다. **제약 옆에 있어야 읽힌다.** ③ **ARCH-060 에 저장 위치 규칙을 더했다** — 지식 본문과 벡터가 같은 트랜잭션·같은 백업에 있고, 임베딩을 끈 고객사에는 남는 구성요소가 없다. 병합 규칙 미확정은 그대로다. ④ **구성도 주석과 ARCH-003 의 근거를 ADR 로 옮겼다** — 같은 주장이 세 곳에 흩어져 있었다. ⑤ **후속 둘을 수집 가능한 형태로 달았다**(`@defer P3`) — PostgreSQL·pgvector 최소 버전 · 재임베딩 뒤 인덱스 재구축 절차. **앞서 ADR 에 적어 둔 `@defer P4` 는 수집되지 않고 있었다** — 괄호 안 백틱이라 수집기가 설명을 못 잡는다. 그 자리는 21-nfr 이 이미 갖고 있으므로 **토큰을 지우고 링크로 바꿨다**(두 번 세지 않는다). **G2 는 이제 하나 남았다** — 기존 NFR 19건의 measurement 를 *누가 어디서 재나* 까지 보강하는 일. **미룬 것은 23 → 25 건**(후속 둘이 늘었다 — 늘어난 것이 정직한 표시다)" }
  - { at: "2026-09-10", by: "[AA]", what: "**재는 방법을 적었다는 것과 잴 수 있다는 것이 같지 않았다 — NFR 23건에 `source` 축을 세웠다.** ① **measurement 는 손대지 않고 칸을 하나 더했다** — *무엇을 재나* 는 이미 있었고 없던 것은 *어디서 나오나* 다. 기존 문장을 고치면 무엇이 달라졌는지 diff 에서 보이지 않는다. ② **쓰면서 드러난 것이 이 작업의 소득이다.** NFR-001 은 **거부 건수와 실행 시간을 다른 시점에 남겨야** 한다 — 한 시점에서 재면 거부된 조회가 분포에서 통째로 빠진다. NFR-006·007 은 **두 기록을 잇지 않으면 값이 나오지 않는다**(상태 변화는 턴 이력이, 실어 나른 시각은 폴링 응답이 갖는다). NFR-009·011 은 **그때 유효했던 설정값**이 필요해 변경 이력이 있어야 하고, 현재 값을 쓰면 판정이 뒤집힌다. NFR-022 는 실패 유형을 **호출 시점에 분류**해야 한다 — 사후에 메시지 문구로 분류하면 문구가 바뀌는 순간 통계가 끊긴다. **이것들은 계측을 심을 때가 아니라 지금 정해야 하는 것들이었다.** ③ **못 재는 것을 못 잰다고 적었다** — NFR-004 는 업무 DB 안의 값이라 고객사 모니터링 도구가 갖는다. **빈칸과 *문제 없음* 은 다르다.** ④ **두 번 재지 않는 경계를 유지했다** — 총 시간은 NFR-006, 큐 대기는 NFR-023 이 정본이고 NFR-008·013 은 끌어 쓴다. ⑤ NFR-004 의 measurement 에 있던 괄호(고객사 모니터링 도구가 수집)를 뺐다 — source 가 그 사실을 갖는다. **G2 는 추적하던 셋이 다 닫혔다. 다만 나머지 다섯은 2026-09-07 의 판정이고 이 세션이 확인하지 않았다** — `/phase-gate` 가 여덟을 다시 본다. **넘겨받은 판정을 초록으로 쓰지 않는다**" }
  - { at: "2026-09-10", by: "[AA]", what: "**G2 를 청구하려고 여덟을 직접 세어 보니 ❌ 가 넷 있었다 — 넘겨받은 판정을 쓰지 않은 것이 이 게이트의 소득이다.** 2026-09-07 의 *다섯은 충족* 을 그대로 썼으면 **빈 축 셋과 소유권 7건 결손과 실행 불가능한 가정 기한을 안고 게이트를 넘었을 것이다.** ① **기술 스택에 빈 축이 셋 있었다** — 런타임 버전이 제약이 아니라 **내가 어제 그린 컨테이너 그림 라벨에만** 있었고(CON-007 로 올렸다 · 근거는 빌드 toolchain), 캐시는 축 자체가 없었으며(CON-036 — **두지 않는다도 결정이다.** 재기 전에 넣으면 무엇을 줄였는지 알 수 없다), 모니터링은 착수 협의 항목의 note 로만 있었다(CON-037). ② **외부 연동 8건 중 데이터 소유권을 적은 것이 하나뿐이었다** — 실질은 하드 규칙에 흩어져 있었으나 축이 아니었다. 여덟에 `ownership` 을 세웠다. ③ **ASM-003 의 확인 기한이 실행 불가능했다** — 재현에 sources/ 가 필요한데 guard-write 가 G3 전까지 그 문을 잠근다. **기한을 G3 로 옮겼다**(옮긴 것은 기한이지 요구가 아니다). ④ **게이트 문구를 고쳤다**(04-gates.md) — *측정 가능한 목표치* 하나만 받던 것을, **미루기로 한 명시적 결정(ASM)이 있고 측정이 서 있으면** 통과로 넓혔다. 이 프로젝트만의 예외가 아니라 **일반 규칙으로 옳다** — 재기 전에 세운 목표는 근거가 없다. 그 위에서 ASM-002 를 **확인됨**으로 판정했다. ⑤ **사용자 답이 레드팀 지적 하나를 지웠다** — 임베딩 대상이 카탈로그가 아니라 **지식 산문뿐**이고 스키마는 건별 매핑으로 따라붙는다. **그리고 그것은 이미 REQ-303 에 있었다** — 내가 못 찾고 걱정한 것이다. ADR-005 의 규모 근거를 그 사실로 다시 적었다. ⑥ **훅이 확인됨 가정을 계속 미확인으로 세고 있었다** — 행 전체에서 *미확인* 을 찾는데 결과 칸이 *확인되지 않으면 이렇게 된다* 를 담는 자리다. **상태 칸을 읽게 고쳤다**(3 → 2건). **바로잡음**: 직전 커밋에서 P2 게이트 줄의 닫는 중괄호를 떨어뜨려 브리핑이 P2 를 *시작 안 함* 으로 표시했다. 게이트 상태가 조용히 거짓이 됐고 되돌렸다" }
  - { at: "2026-09-10", by: "[AA]", what: "**사용자가 P2 를 읽다 딥링크 진입 흐름을 물었고, 그 자리에 문장 하나가 빠져 있었다.** ARCH-020 은 *딥링크는 인증도 권한도 우회하지 않는다* 까지 말하고 **그 다음을 말하지 않았다** — 로그인을 거친 뒤 문맥이 어떻게 되는지. 리다이렉트를 지나면 URL 파라미터는 유실되기 쉽고, 그러면 사용자는 **빈 채팅창**을 본다. **이 진입 경로의 값 전부가 「보고 있던 대상이 첫 턴 컨텍스트에 들어간다」에 있으므로, 문맥을 잃은 딥링크는 새 창 열기와 다르지 않다.** ① **복귀를 규약으로 넣었고, 유실 시 빈 창을 열지 않고 알리게 했다** — 빈 창을 열면 사용자는 딥링크가 동작한 줄 알고 대상 없이 질의한다. ② **키 값이 URL 에 머무르지 않게 함께 못 박았다** — 복귀만 요구하면 자연스러운 구현이 파라미터를 URL 에 계속 싣는 것이고, 그러면 브라우저 이력·중간 장비 접속 로그(CON-028)·Referer 에 업무 데이터의 키가 남는다. **마스킹은 본문에만 걸리고 URL 은 그 밖이다.** 진입 시점에 서버가 접수하고 이후는 단기 식별자로만 오간다. ③ **함께 물어본 둘은 P3 로 넘겼다** — 이미 로그인된 세션의 재사용 여부 · 셸의 탭으로 뜨나 메뉴 없는 단독 창으로 뜨나. 둘 다 화면 설계이고 SCR-101 요건서를 쓸 때 결정된다. **곁들여 확인한 것**: SCR-105 의 *진입 기본 화면 미확정* 은 직접 접속의 첫 화면이고 딥링크 진입은 채팅으로 정해져 있다 — 둘은 다른 문제다. **남겨 둔 것**: IF-007 의 hard_rules 가 ARCH-020 의 규칙 셋을 그대로 복사해 갖고 있다(인증 우회 금지 · iframe 미지원 · 진입 경로는 권한 근거 아님). **이번 규칙은 ARCH-020 에만 넣었다** — 복사를 늘리지 않기 위해서이고, IF-007 은 이미 traces_to 로 그것을 가리킨다. 기존 복사 셋을 접는 것은 별 일이다" }
