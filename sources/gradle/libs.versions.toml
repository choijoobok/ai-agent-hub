# 버전 단일 출처 — llm-guide/06-framework/stack.md §4
# Spring Boot BOM 이 관리하는 아티팩트는 버전을 명시하지 않는다.

[versions]
jsoup = "1.24.1"
commonmark = "0.30.0"
springBoot = "4.1.1"
querydsl = "7.6"
archunit = "1.5.0"
swaggerAnnotations = "2.2.30"
p6spy = "3.9.1"
poi = "5.4.1"
pitestGradle = "1.19.0"
pitestCore = "1.22.1"
pitestJunit5 = "1.2.3"


[libraries]
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

querydsl-core = { module = "io.github.openfeign.querydsl:querydsl-core", version.ref = "querydsl" }
querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# @Operation 이 SYS_API 이름의 원천이다 — backend/api.md. 스캔이 읽어야 하므로 RUNTIME 유지이며,
# springdoc 스타터(SYS-05 문서 UI)가 오면 이 아티팩트를 전이로 갖고 온다. 애너테이션만 먼저
# 두는 이유는 시드 생성이 문서 UI 를 기다릴 이유가 없기 때문이다(stack.md).
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swaggerAnnotations" }

# 파라미터가 바인딩된 SQL — backend/logging.md. Boot BOM 관리 대상이 아니라 버전을 적는다.
#
# 스타터(com.github.gavlyukovskiy)를 쓰지 않는다. 그것이 해 주는 일은 자동 래핑과 yml
# 바인딩뿐인데(backend/logging.md), 최신 릴리스가 Spring Boot 3 계열이라 Boot 4 에서 자동설정이
# 붙는지가 확인 대상이 된다 — backend/logging.md 이 "스타터가 따라오지 못해도 라이브러리를 갈아탈
# 이유는 없다" 며 2단계(직접 래핑)를 미리 열어 두었고, 그 길을 택했다.
p6spy = { module = "p6spy:p6spy", version.ref = "p6spy" }

# 서버 생성 엑셀 — playbook/excel-download.md 의 세 번째 갈래(임의 API). Boot BOM 관리 대상이 아니라 버전을 적는다.
#
# 프론트 생성(exceljs)이 기본이고 이쪽은 화면 구조와 엑셀 구조가 다를 때만 쓴다 — 헤더
# 블록 + 상품 표, 병합, 다중 시트. 그리드가 가진 것만 내보내는 방식으로는 나오지 않는다.
#
# poi-ooxml 이 xlsx 를 연다. poi 만으로는 xls(HSSF)까지이고, 우리가 주고받는 것은 xlsx 다.
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

# JDBC 드라이버 — 4벤더 무수정 기동 요건상 전부 포함한다(stack.md).
# 넷 다 Spring Boot BOM 관리 대상이라 버전을 적지 않는다(stack.md).
driver-postgresql = { module = "org.postgresql:postgresql" }
driver-oracle = { module = "com.oracle.database.jdbc:ojdbc11" }
driver-mysql = { module = "com.mysql:mysql-connector-j" }
driver-mariadb = { module = "org.mariadb.jdbc:mariadb-java-client" }
driver-mssql = { module = "com.microsoft.sqlserver:mssql-jdbc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestGradle" }
