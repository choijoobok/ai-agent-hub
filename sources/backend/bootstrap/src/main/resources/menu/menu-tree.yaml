# 메뉴 선언 — 이 파일이 메뉴의 원본이다 (seed.md · sys/menu.md).
#
#   ./gradlew generateMenuSeed    이 파일 → data/003-init-menu.csv
#   ./gradlew checkMenuSeed       재생성 결과 == 커밋본 (CI 의 check 에 달려 있다)
#
# ── 왜 시드 파일이 아니라 여기인가 ──────────────────────────────────────
#
# 메뉴는 화면과 1:1 이라 개발이 가장 자주 바꾸는 시드다. changeset 을 누적하면 셋이
# 깨진다 — master 의 include 목록이 부딪히고, 브랜치를 되돌리면 데이터가 남아 유령
# 메뉴가 되며, 이미 적용된 changeset 을 고치면 남의 로컬이 checksum 으로 죽는다.
#
# 그래서 006(API)처럼 생성물로 옮겼다. 다만 전건 삭제는 하지 않는다 — SYS_MENU 를
# 참조하는 FK 가 일곱이고 그중 넷은 사람이 결정한 사실(역할 권한 · 개인 예외)이다.
# 여기서 줄을 지우면 그 메뉴는 SRC_CD='ORPHAN' 으로 표시될 뿐이고, 지우는 것은
# MENU_TREE 화면에서 사람이 한다(screen/menu/requirements.md).
#
# ── 무엇이 여기 있고 무엇이 없나 ────────────────────────────────────────
#
#   있다   MENU_CD · UP_MENU_CD · MENU_URL · EXPORT_YN     ← 구조. 개발이 정한다
#   없다   SORT_NO · ICON_CD · USE_YN                      ← 표시. 운영이 정한다
#
# 없는 셋은 CSV 에도 없다. loadUpdateData 는 CSV 에 담은 컬럼만 갱신하므로 운영자가
# 드래그한 순서와 켜고 끈 상태가 배포에서 살아남는다. 새 메뉴는 DB 기본값으로 들어온다
# (SORT_NO=0 · USE_YN='Y') — MENU_CD 순으로 서므로 운영이 한 번 드래그해야 한다.
#
# MENU_NM 도 없다. 그 컬럼에는 메뉴명이 아니라 메시지 키 menu.{MENU_CD} 가 들어가며
# (sys/menu.md) 생성이 코드에서 만든다. 이름의 단일 원본은 SYS_MESSAGE 다.
#
# ── 트리 ────────────────────────────────────────────────────────────────
#
#   DASHBOARD                대시보드                 ← 유일한 최상위 리프
#   SYSTEM                   시스템                   ← 모듈 (1단)
#     ├ USER                 사용자
  #     │   ├ USER_MGMT        사용자 관리              /admin/system/user
#     │   └ USER_AUTH_MGMT   개인 예외 권한           /user-auth
#     ├ MENU                 메뉴 관리
#     │   ├ MENU_TREE        메뉴 트리                /admin/system/menu
#     │   ├ ROLE_MGMT        역할 관리                /admin/system/role
#     │   ├ ROLE_AUTH_MGMT   역할 권한 관리           /admin/system/role-auth
#     │   └ API_CATALOG      API 카탈로그             /admin/system/api-catalog
#     ├ MASTER               기준정보
#     │   ├ CODE_MGMT        공통 코드 관리           /admin/system/code
#     │   ├ MESSAGE_MGMT     다국어 메시지 관리       /admin/system/message
#     │   └ CONFIG_MGMT      시스템 환경설정          /admin/system/config
#     ├ LOG                  이력 · 로그
#     │   ├ ACCESS_LOG       사용 이력                /admin/system/log/access
#     │   ├ LOGIN_LOG        로그인 이력              /admin/system/log/login
#     │   └ ERROR_LOG        에러 로그                /admin/system/log/error
#     ├ BATCH                배치 · 스케줄
#     │   ├ BATCH_SCHEDULE   스케줄 관리              /admin/system/batch/schedule
#     │   └ BATCH_HISTORY    실행 이력                /admin/system/batch/history
#     └ NOTICE               공지 · 알림
#         ├ NOTICE_MGMT      공지사항 관리            /admin/system/notice
#         └ NOTI_REQUEST     요청함 처리              /admin/system/noti-request
#
# 위 한글은 주석이며 데이터가 아니다 — 이름은 SYS_MESSAGE 의 menu.{MENU_CD} 다.
# 트리를 여기 남기는 것은 code/parent 만으로는 사람이 구조를 읽을 수 없기 때문이다.
#
# ── 규칙 ────────────────────────────────────────────────────────────────
#
# url 이 없으면 구조 노드다. URL 과 자식은 배타이며 SeedMenuTreeTest 가 지킨다(sys/menu.md).
#   url 이 있으면 screenRegistry.ts 에도 있어야 한다 — 없으면 generateApiSeed 가 막는다.
# 깊이는 리프 포함 5단이 상한이다(sys/menu.md).
# export 는 프론트가 만드는 엑셀의 EXPORT 액션이다(sys/menu.md) — 부를 API 가 없어 여기서 선언한다.
#   순서는 읽는 순서일 뿐 SORT_NO 가 아니다.

menus:
  - code: DASHBOARD
    url: /admin/system/dashboard

  - code: SYSTEM

  - code: USER
    parent: SYSTEM
  - code: USER_MGMT
    parent: USER
    url: /admin/system/user
    export: true
  - code: USER_AUTH_MGMT
    parent: USER
    url: /admin/system/user-auth
    export: true

  - code: MENU
    parent: SYSTEM
  - code: MENU_TREE
    parent: MENU
    url: /admin/system/menu
    export: true
  - code: ROLE_MGMT
    parent: MENU
    url: /admin/system/role
  - code: ROLE_AUTH_MGMT
    parent: MENU
    url: /admin/system/role-auth
  - code: API_CATALOG
    parent: MENU
    url: /admin/system/api-catalog
    export: true

  - code: MASTER
    parent: SYSTEM
  - code: CODE_MGMT
    parent: MASTER
    url: /admin/system/code
    export: true
  - code: MESSAGE_MGMT
    parent: MASTER
    url: /admin/system/message
    export: true
  - code: CONFIG_MGMT
    parent: MASTER
    url: /admin/system/config

  - code: LOG
    parent: SYSTEM
  - code: ACCESS_LOG
    parent: LOG
    url: /admin/system/log/access
    export: true
  - code: LOGIN_LOG
    parent: LOG
    url: /admin/system/log/login
    export: true
  - code: ERROR_LOG
    parent: LOG
    url: /admin/system/log/error
    export: true

  - code: BATCH
    parent: SYSTEM
  - code: BATCH_SCHEDULE
    parent: BATCH
    url: /admin/system/batch/schedule
  - code: BATCH_HISTORY
    parent: BATCH
    url: /admin/system/batch/history
    export: true

  - code: NOTICE
    parent: SYSTEM
  - code: NOTICE_MGMT
    parent: NOTICE
    url: /admin/system/notice
  - code: NOTI_REQUEST
    parent: NOTICE
    url: /admin/system/noti-request

  # ── 샘플 (68) ─────────────────────────────────────────────────────────
  #
  # 모듈 노드도 SMPL_ 접두다 — SAMPLE 이면 제거 changelog 의 LIKE 에 걸리지 않는다
  # (playbook/INDEX.md). 걷어낼 때 지우는 줄이 여기 있다.
  - code: SMPL_ROOT
  # 어휘의 본진이다(playbook/INDEX.md) — 트리에서도 첫 리프이며, 베껴 갈 화면을 먼저 만난다.
  #
  # export 를 선언한다. ①의 엑셀은 프론트 생성이라 서버 경로가 없고(playbook/INDEX.md 의 선언 없음),
  # 그 갈래의 EXPORT 는 메뉴가 선언하지 않으면 아무도 갖지 못한다(sys/menu.md).
  - code: SMPL_SINGLE_OFFSET
    parent: SMPL_ROOT
    url: /sample/single-offset
    export: true
  # 커서형 — 저장이 없다. export 는 선언한다: 엑셀 둘이 프론트 생성이라 서버 경로가
  # 없고, 그 갈래의 EXPORT 는 메뉴가 선언하지 않으면 아무도 갖지 못한다(sys/menu.md).
  - code: SMPL_SINGLE_CURSOR
    parent: SMPL_ROOT
    url: /sample/single-cursor
    export: true
  - code: SMPL_MD_VERT
    parent: SMPL_ROOT
    url: /sample/md-vertical
    # ②가 서버 생성이다(playbook/excel-download.md 의 임의 API) — EXPORT 를 줄 수 있어야 버튼이 선다.
    export: true
  # 좌우 분할 — 실행이 없다(액션 R S E). 엑셀은 프론트 생성이라 EXPORT 를 메뉴가 선언한다.
  - code: SMPL_MD_HORZ
    parent: SMPL_ROOT
    url: /sample/md-horizontal
    export: true
  # 복수 탭 — 액션 R S E 다. 그리드가 셋이라 엑셀도 셋인데 전부 프론트 생성이므로
  # (화면의 표가 곧 엑셀의 표다) 메뉴가 EXPORT 를 선언하지 않으면 아무도 못 갖는다.
  - code: SMPL_MD_TABS
    parent: SMPL_ROOT
    url: /sample/md-tabs
    export: true
  # 엑셀 — 액션 R S E 다. 여기서 EXPORT 는 두 몫이다: 업무 탭의 내려받기이자,
  # 그 파일이 곧 업로드 양식이다(frontend/grid.md · playbook/INDEX.md) — 없으면 사용자가 양식을 얻을 길이 없다.
  - code: SMPL_EXCEL
    parent: SMPL_ROOT
    url: /sample/excel
    export: true

